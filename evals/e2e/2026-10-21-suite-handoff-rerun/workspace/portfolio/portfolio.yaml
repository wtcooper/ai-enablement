# sponsor yet). sox-junior-development is deliberately not imported: its title breaks the YAML in the SOX-only file;
# add it after the advisor skill fixes the title. Owners are placeholder roles taken from the audit plan.
# sox-listing-tool depends on sox-junior-development, which is not yet in the register.
# Step 3 (screen): two fields go beyond the portfolio/v1 schema, at the portfolio lead's request.
#   variant_of: id     the item is a duplicate of a primary; counted once, under the primary
#   provisional: true  a draft-to-validate item that cannot pass g0 until its validator has reviewed it
# No g0 decision is appended yet: g0 needs the portfolio lead and, on the full path, the risk lead, and the live
# limit is unset. Proposed outcomes are in each intake record's "Screen result". The three outline stubs, the
# enterprise assistant (an inventory entry) and sox-junior-development are not screened.
