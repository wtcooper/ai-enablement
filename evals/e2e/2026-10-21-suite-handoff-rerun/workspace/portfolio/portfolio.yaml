# Firm AI portfolio. Schema: portfolio/v1 (ai-portfolio references/schemas/portfolio.md).
# Owners are roles, never names. No dates as targets. Free text is quoted.
schema: portfolio/v1
portfolio:
  name: "Firm AI portfolio"
  scope: "Audit, tax, advisory and client accounting, plus internal functions (finance, HR, IT). One register for ideas, pilots and live AI systems, including AI already in use."
  level: organization
  owner: "Portfolio lead (head of AI office)"
  plan: "../transformation-plan.md"
settings:
  # Levers, weights inherited from the audit (SOX/ICFR) plan. Metrics are audit-specific: other practices
  # need their own metric under each lever when their first item is logged. Weights to be confirmed firm-wide.
  value_levers:
    - { id: capacity, name: "Capacity", metric: "Staff hours per unit of work (unit defined in writing per item)", weight: 0.25 }
    - { id: quality, name: "Quality", metric: "Review-note or rework rate (definition agreed per item)", weight: 0.25 }
    - { id: risk, name: "Risk", metric: "Regulator or internal inspection comments", weight: 0.20 }
    - { id: experience, name: "Staff experience", metric: "Busy-season overtime; share of junior time on judgment work", weight: 0.20 }
    - { id: cost, name: "Margin", metric: "Margin per engagement or fixed-fee program", weight: 0.10 }
  scoring_weights: { value: 0.30, feasibility: 0.20, data_readiness: 0.15, risk: 0.20, time_to_value: 0.05, strategic_fit: 0.10 }
  axes:
    value: [value, strategic_fit, time_to_value]
    readiness: [feasibility, data_readiness, risk]
  # The audit plan chose redeploy for its own practice. No firm-wide choice has been made, so it stays open here.
  capacity_stance: undecided
  inherited_from: "../transformation-plan.md"
  live_limit: null   # open: to be set by the steering group as a number tied to owner and review capacity
stages:
  - id: discover
    purpose: "Frame the problem, find the baseline and look at the real data"
    entry: ["Passed the screen (g0)"]
    exit: ["Problem and success metric agreed with the benefit owner", "Baseline from records", "Data located and seen in its real state", "Strategic fit and technical feasibility assessed", "Full path: counterfactual idea, build/buy/partner leaning, risk tier confirmed"]
    gatekeepers: ["Practice leader (submitting practice)", "Risk lead", "IT/security lead"]
  - id: prototype
    purpose: "Test technical feasibility on real data"
    entry: ["Go at g1"]
    exit: ["Prototype run on real data, not dummy data", "Data available, good enough and governed", "Skills in place or sourced; process redesign need and owner", "Security and confidentiality controls defined", "Business case still holds", "Full path: build/buy/partner recorded, run-cost range, evaluation plan"]
    gatekeepers: ["Practice leader (submitting practice)", "Finance lead", "IT/security lead", "Risk lead"]
  - id: pilot
    purpose: "Test value and adoption on live work with a comparison"
    entry: ["Go at g2"]
    exit: ["Adoption tested, not only accuracy", "Results against baseline and comparison", "Benefit rows with owner, baseline and counterfactual", "Audit and tax items: independence, tax-consent and quality-review sign-off by the risk lead", "Full path: red-team scrutiny, production readiness signed, role evolution and capacity choice, decommissioning route"]
    gatekeepers: ["Practice leader (submitting practice)", "Finance lead", "IT/security lead", "Risk lead"]
  - id: production
    purpose: "Run as supported service for the first population; realise and measure benefits"
    entry: ["Go at g3"]
    exit: ["Benefits measured against forecast after go-live", "Total cost of ownership tracked and who pays run cost at scale", "Post-launch review done", "Full path: reuse plan, enablement plan, control plan per site"]
    gatekeepers: ["Practice leader (submitting practice)", "Finance lead", "IT/security lead", "Risk lead"]
  - id: scale
    purpose: "Extend to further practices, offices or client groups; reuse components"
    entry: ["Go at g4"]
    exit: ["Benefits and run cost hold in the receiving practice", "Control plan in place for each new site", "Enablement plan delivered"]
    gatekeepers: ["Practice leaders (receiving practices)", "Finance lead", "IT/security lead", "Risk lead"]
  - id: retire
    purpose: "Decommission safely, keep lessons and reusable assets"
    entry: ["Retire decision by the steering group (stop, or Kill of anything built)"]
    exit: ["Reason and evidence recorded in the gate log", "IT/security lead cuts access or switches the system off", "Practice leader tells users and affected clients, and a fallback keeps critical work running", "Live-systems inventory updated", "Records of AI use kept as firm policy requires", "Lessons and reusable assets (data clean-up, evaluation sets, prompts) kept", "Unrealised benefits recorded as not-realised or withdrawn"]
    gatekeepers: ["IT/security lead", "Practice leader (submitting practice)", "Risk lead"]
gate_paths:
  light: "No client data, a single team, and no independence or tax-return-consent angle: internal finance, HR and IT ideas, and audit or tax drafting aids that touch only firm-owned material. g1 and g2 combine into one gate; g3 keeps adoption evidence and benefit rows."
  full: "Any client data, more than one practice, or anything touching independence or tax-return consent. All gates g0 to g4."
  g0_deciders:
    light: ["Portfolio lead (head of AI office)"]   # submitting practice leader consulted, not a decider
    full: ["Portfolio lead (head of AI office)", "Risk lead"]
roles:
  review_forum: ["AI steering group", "Finance lead (standing member)", "Risk lead (standing member)"]
  intake_contact: "Portfolio lead (head of AI office)"
  other:
    - { role: "Practice leader (submitting practice)", duty: "Releases people's time; consulted at g0 on the light path; gatekeeper at gates" }
    - { role: "Finance lead", duty: "Holds and releases budget; gatekeeper at gates; standing forum member" }
    - { role: "IT/security lead", duty: "Releases client data with the risk lead; cuts access at retire; supplies licence counts to the live-systems inventory" }
    - { role: "Risk lead", duty: "Releases client data with IT/security; decides g0 on the full path; independence and tax-consent sign-off; standing forum member" }
    - { role: "Portfolio lead (head of AI office)", duty: "Runs intake and the register, decides g0 as set above, prepares the monthly review pack, keeps the live-systems inventory with practice input; business owner of the approved enterprise assistant" }
    - { role: "SOX/ICFR practice lead", duty: "Placeholder owner for audit items (the plan's practice lead): owns checklist, request template, client-data approval request; same role as Practice leader (submitting practice) for audit" }
    - { role: "Managing partner for assurance", duty: "Placeholder sponsor for audit items (from the audit plan); controls discovery resources for them" }
    - { role: "ITGC senior manager", duty: "Placeholder owner of the report register, validation and checklist back-test (from the audit plan)" }
    - { role: "Integrated-audit manager", duty: "Placeholder owner of the integrated-audit items, which stay draft to validate until this role has reviewed them (the practice lead's stated requirement)" }
rhythm:
  review: "Monthly portfolio review by the AI steering group with the finance and risk leads. Decides continue, hold, redirect, stop or scale on each item, and where freed capacity goes. The portfolio lead's office prepares the pack."
  rebalance: "Every third review: balance across horizons, scoring weights, live limit, and whether the central team should move toward an advisory role (proposed default)"
  benefits_review: "At every review for items in production or scale"
state:
  status: running
  step_completed: 2
  next_step: 3
  last_review: 0
  updated: 2026-10-21
# Step 2 intake. Audit items are imported from the advisor files with a back-link; scores, value and category are
