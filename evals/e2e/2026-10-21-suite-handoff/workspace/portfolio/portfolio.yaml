# Firm AI portfolio. Schema: portfolio/v1.
# Settings came from the SOX/ICFR practice plan and were then made firm-level by the portfolio owner:
# common levers, weights kept equal to the audit plan's, capacity stance left as a firm-level choice.
# OPEN SET-UP ITEMS (step 1 not finished): gatekeepers, review forum membership, live limit and rhythm are PROPOSED,
# not agreed; tax, advisory and other practices are not yet in; no inventory of AI already in use; no overlay/ yet.
# DUPLICATE-CHECK PAIRS (do not add their value; screen together):
#   sox-prereview-checklist <-> ct-int-precheck-checklist
#   sox-report-register     <-> ct-int-validated-report-register
#   sox-listing-tool        <-> ct-int-listing-compare-draft
# RELATED (not pairs): sox-client-data-approval serves both listing tools; sox-chase-assistant and
#   ct-int-nonclient-drafting are both non-client assistant drafting.
# NOT IMPORTED (target pictures with no value or scores in the advisor file): sox-ai-secondary-review,
#   sox-agent-testing, sox-platform-plus-review. Their revisit triggers stay in units/sox-only-outsourcing/opportunities.yaml.
# Scores, ranges, categories and role evolution are copied as the advisor left them. Value and readiness indexes are
# arithmetic on those scores under the weights below; the advisor's weighted scores all re-checked correctly.
# Value units differ between items (percentage points, hours a month, hours per test, days): not yet comparable.
schema: portfolio/v1
portfolio:
  name: "Firm AI portfolio"
  scope: "All practices and functions; ideas, pilots and live systems. Audit (SOX-only outsourcing and integrated audit) is the first practice imported."
  level: organization
  owner: "Head of AI"
  plan: "../transformation-plan.md"
settings:
  # Common levers on the shared vocabulary ids. Metrics are written so any practice can score against them;
  # each item states its own unit in value[].unit. Weights equal the audit plan's. Metrics for tax and advisory to be agreed.
  value_levers:
    - { id: capacity, name: "Capacity", metric: "Staff hours per unit of work (unit defined per practice and written down)", weight: 0.25 }
    - { id: quality, name: "Quality", metric: "Review-note rate, or errors found at review, per unit of work", weight: 0.25 }
    - { id: risk, name: "Risk", metric: "Regulator or internal inspection comments, or incidents, per cycle", weight: 0.20 }
    - { id: experience, name: "Staff experience", metric: "Busy-season overtime; share of junior time on judgment work", weight: 0.20 }
    - { id: cost, name: "Margin", metric: "Margin per fixed-fee engagement or programme", weight: 0.10 }
  scoring_weights: { value: 0.30, feasibility: 0.20, data_readiness: 0.15, risk: 0.20, time_to_value: 0.05, strategic_fit: 0.10 }
  axes:
    value: [value, strategic_fit, time_to_value]
    readiness: [feasibility, data_readiness, risk]
  capacity_stance: undecided   # firm-level choice (redeploy, reduce or mixed) not yet made; the audit plan's redeploy stance is not assumed
  inherited_from: "../transformation-plan.md"
  live_limit: null             # to agree: no more live items than there are owners and review capacity
stages:   # defaults from references/method/stage-gates.md. Practice leaders (they release people and budget) and the risk and quality partner (independence and client-data approval are gate conditions) are PROPOSED gatekeepers at g1-g3 on the portfolio owner's instruction; other gatekeepers are PROPOSED too, to confirm
  - { id: discover, purpose: "Frame the problem, find the baseline and look at the real data", entry: ["Passed the screen (g0)"], exit: ["Problem and success metric agreed with the benefit owner", "Baseline from records", "Data located and seen in its real state", "Independence check added for any item that touches audit clients"], gatekeepers: ["Practice leaders", "Risk and quality partner"] }
  - { id: prototype, purpose: "Test technical feasibility on real data", entry: ["Go at g1"], exit: ["Prototype run on real data, not dummy data", "Data available, good enough and governed", "Skills in place or sourced", "Controls defined; business case still holds"], gatekeepers: ["Practice leaders", "Risk and quality partner"] }
  - { id: pilot, purpose: "Test value and adoption on live work with a comparison", entry: ["Go at g2"], exit: ["Adoption tested, not only accuracy", "Results against baseline and comparison", "Benefit rows with owner, baseline and counterfactual"], gatekeepers: ["Practice leaders", "Risk and quality partner"] }
  - { id: production, purpose: "Run as supported service for the first population; realise and measure benefits", entry: ["Go at g3"], exit: ["Benefits measured against forecast after go-live", "Total cost of ownership tracked and who pays for run cost"], gatekeepers: ["Practice leaders", "Finance lead"] }
  - { id: scale, purpose: "Extend to further practices, offices or client groups; reuse components", entry: ["Go at g4"], exit: ["Reuse plan", "Control plan per site"], gatekeepers: ["Managing partner or chief operating officer", "Practice leaders"] }
  - { id: retire, purpose: "Decommission safely, keep lessons and reusable assets", entry: ["Retire decision"], exit: ["Fallback in place", "Records kept", "Lessons and reusable assets recorded"], gatekeepers: ["Head of AI", "Risk and quality partner"] }
gate_paths:
  light: "PROPOSED, to confirm: lowest-risk-tier and individual-productivity items combine g1 and g2; the portfolio owner decides g0."
  full: "PROPOSED, to confirm: every other item takes all gates with gatekeepers per stage. Any item that touches client evidence takes the full path and the existing independence check."
roles:
  review_forum: ["Managing partner or chief operating officer", "Practice leaders", "Risk and quality partner", "Head of IT", "Finance lead", "People lead", "Head of AI"]   # PROPOSED
  intake_contact: "Head of AI"
  other: []
rhythm:
  review: "PROPOSED: monthly portfolio review"
  rebalance: "PROPOSED: every third review (balance, weights, live limit)"
  benefits_review: "PROPOSED: every review, for items in production or scale"
state:
  status: setting-up
  step_completed: 5
  next_step: 3
  last_review: 1   # review 1 in portfolio/reviews/1-review.md; three of four g0 decisions recorded, sox-listing-tool open
  updated: 2026-10-21
