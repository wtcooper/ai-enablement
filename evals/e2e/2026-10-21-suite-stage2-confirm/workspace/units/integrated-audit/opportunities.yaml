  - id: ct-int-listing-compare-draft
    title: Certified tool for listing-to-active-user comparison and workpaper drafting, with exceptions to a person
    process: ITGC operating-effectiveness test
    work_types: [review-assurance, document-production]
    pattern: reconcile-exceptions
    ladder: augment
    change_scope: step
    runtime_class: workflow-automation
    description: "Today staff compare and write up by hand. Future: a tool, once approved for client data, proposes matches and a draft with citations; staff work the exceptions."
    value:
      - { lever: capacity, low: 0.3, high: 0.75, unit: "staff hours per control test", assumptions: "20-50% of the 1.5 h hands-on released, net of review. Pattern evidence is Microsoft IA's self-reported 850 h/yr (#06, self-reported by the deploying team; to be re-graded); #07 has no controls measure. Reddit -60% not used. Grade C." }
    scores: { value: 4, feasibility: 2, data_readiness: 2, risk: 3, time_to_value: 1, strategic_fit: 4 }
    weighted_score: 2.95
    category: foundation
    depends_on: [ct-int-validated-report-register, ct-int-precheck-checklist]
    prerequisites: ["3-4 month approval (risk and quality, CIO, general counsel); no controls case has gone through yet", "Written attributes and exception rules", "Parallel run on past tests"]
    risks: ["Automation bias", "Non-repeatable output", "Documentation does not meet AS 1215", "Reliance on others' work (AS 2605) unclear"]
    human_checkpoints: ["Staff and senior review every flagged exception and a sample of unflagged items", "Risk and quality sign-off on documentation before use"]
    role_evolution: { tasks_moving: "Listing comparison and write-up first pass", new_work: "Exception investigation; juniors still do manual comparison on a rotating sample to keep learning", capacity_use: redeploy }
    evidence: [assurance-controls-testing-06, assurance-controls-testing-07]
    label: draft-to-validate
    next_step: { action: "Start the approval request with this use as the first controls case", owner: "Practice lead", depends_on: ["ct-int-validated-report-register"] }

