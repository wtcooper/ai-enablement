items:
  - id: ct-int-validated-report-register
    title: Register of specialist-validated reports, reusable across engagements and lent to the SOX-only line
    process: ITGC reliability of information (IPE)
    work_types: [review-assurance, data-reporting]
    pattern: other
    ladder: assist
    change_scope: process
    runtime_class: shared-team-skills
    description: "Today (reported, one case) the specialist tests report parameters once per engagement and staff reuse it. Future: validated reports, parameters, version and re-validation triggers are recorded in one place, with a standard form the SOX-only line can use. Mostly standardisation; AI use limited to drafting the form on non-client material."
    value:
      - { lever: capacity, low: 0.25, high: 1.0, unit: "staff hours per SOX-only ITGC test", assumptions: "Gap between SOX-only case (2.5 h) and integrated case (1.5 h) is the ceiling; 25-100% attributable to once-only validation. Two single reported cases, not comparable samples. Excludes one-off specialist validation effort (user estimate 180-600 h, SOX-only). Grade C." }
      - { lever: risk, low: 0, high: 2, unit: "PCAOB ITGC evidence comments avoided per cycle", assumptions: "Baseline 2 last cycle (reported, practice-level, line of origin unknown); no evidence yet that this closes them" }
    scores: { value: 4, feasibility: 4, data_readiness: 3, risk: 4, time_to_value: 3, strategic_fit: 5 }
    weighted_score: 3.90
    category: quick-win
    depends_on: []
    prerequisites: ["Specialist capacity and scoping", "Methodology agreement on what must be recorded", "Risk and quality view on AS 1215 documentation"]
    risks: ["Pattern is individual-dependent, not firm practice", "Validation goes stale when report or system changes", "Reuse across clients or lines weakens independence of evidence if poorly scoped"]
    human_checkpoints: ["IT audit specialist signs each validation", "Senior confirms listing is system-generated and in scope"]
    role_evolution: { tasks_moving: "Per-test re-proving of report completeness (SOX-only) stops; seniors stop re-checking by memory", new_work: "Specialists own validation and the register; seniors review exceptions; juniors learn why a report is complete by reading the register's validation records", capacity_use: redeploy }
    evidence: [assurance-controls-testing-06, assurance-controls-testing-07, assurance-controls-testing-03]
    label: draft-to-validate
    next_step: { action: "Ask the specialist how validation is recorded today and what triggers re-validation", owner: "Integrated-audit manager", depends_on: [] }

  - id: ct-int-precheck-checklist
    title: Written pre-review evidence checklist capturing the senior's unwritten checks
    process: ITGC operating-effectiveness test
    work_types: [review-assurance, document-production]
    pattern: draft-review-loop
    ladder: assist
    change_scope: step
    runtime_class: shared-team-skills
    description: "Today three checks (listing straight from the system, date range covers period, active-user population complete) live in seniors' heads. Future: a written staff self-check attached to the workpaper; AI use limited to drafting the wording on non-client material."
    value:
      - { lever: quality, low: 0, high: 5, unit: "percentage points of review-note rate", assumptions: "Integrated baseline unknown (one case, zero notes). Ceiling reasoned from SOX-only evidence notes (about 20% of tests, reported) with a quarter caught; integrated likely lower. Grade D." }
      - { lever: experience, low: 0, high: 0, unit: "not quantified", assumptions: "Qualitative: juniors learn senior judgment explicitly" }
    scores: { value: 3, feasibility: 5, data_readiness: 4, risk: 5, time_to_value: 5, strategic_fit: 4 }
    weighted_score: 4.15
    category: quick-win
    depends_on: []
    prerequisites: ["Seniors articulate the checks", "Methodology owner approves checklist"]
    risks: ["Tick-box compliance replaces thinking", "Checklist becomes stale"]
    human_checkpoints: ["Senior reviews every exception and a sample of checklist completions"]
    role_evolution: { tasks_moving: "Late discovery of completeness gaps at senior review", new_work: "Seniors coach against the checklist; juniors explain each check", capacity_use: redeploy }
    evidence: [assurance-controls-testing-03, assurance-controls-testing-10]
    label: draft-to-validate
    next_step: { action: "Co-write the checklist with two seniors and test on three past files", owner: "Integrated-audit manager", depends_on: [] }

