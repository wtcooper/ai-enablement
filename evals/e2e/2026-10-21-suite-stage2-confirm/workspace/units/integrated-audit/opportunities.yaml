    pattern: draft-review-loop
    ladder: assist
    change_scope: step
    runtime_class: personal-assistant
    description: "Today a few seniors use the assistant on templates. Future: shared prompts for test-step wording and narrative templates, plus synthetic practice cases for juniors. No client data."
    value:
      - { lever: capacity, low: 0, high: 0.2, unit: "staff hours per control test", assumptions: "0-15% of the 1.5 h hands-on is template or wording work; no measure exists. Grade D." }
    scores: { value: 2, feasibility: 5, data_readiness: 4, risk: 5, time_to_value: 4, strategic_fit: 3 }
    weighted_score: 3.70
    category: quick-win
    depends_on: []
    prerequisites: ["Usage rule restated", "Synthetic examples reviewed by a senior"]
    risks: ["Client data pasted by mistake", "Unreviewed wording enters workpapers"]
    human_checkpoints: ["Senior approves templates before shared use"]
    role_evolution: { tasks_moving: "Template and wording drafting", new_work: "Juniors critique AI drafts against what they saw", capacity_use: redeploy }
