<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">How the advisor works</title>
  <desc id="d">A guided loop of eight steps: Onboard, Frame, Map, Diagnose, Reimagine, Prioritize, Make the case, Plan. At practice or firm level, Map breaks the scope into units that run the same loop, and Prioritize rolls them back up. The output is a transformation plan.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 20px; font-weight: 600; }
      .sub { font-size: 13px; fill: #57606a; }
      .label { font-size: 15px; font-weight: 600; }
      .num { fill: #0969da; }
      .desc { font-size: 12.5px; fill: #424a53; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
      .start { fill: #ddf4ff; stroke: #54aeff; }
      .end { fill: #dafbe1; stroke: #4ac26b; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .dashed { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="468" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="32" y="40">How the advisor works</text>
  <text class="sub" x="32" y="62">One guided loop. The same steps work for a team, a practice or a whole firm.</text>

  <!-- Row 1 -->
  <rect class="box start" x="32" y="90" width="196" height="84" rx="10"/>
  <text class="label" x="48" y="120"><tspan class="num">0</tspan>  Onboard</text>
  <text class="desc" x="48" y="142">Your role, your business</text>
  <text class="desc" x="48" y="160">and your AI journey</text>

  <rect class="box" x="260" y="90" width="196" height="84" rx="10"/>
  <text class="label" x="276" y="120"><tspan class="num">1</tspan>  Frame</text>
  <text class="desc" x="276" y="142">Why change and what</text>
  <text class="desc" x="276" y="160">good looks like</text>

  <rect class="box" x="488" y="90" width="196" height="84" rx="10"/>
  <text class="label" x="504" y="120"><tspan class="num">2</tspan>  Map</text>
  <text class="desc" x="504" y="142">Walk the real work:</text>
  <text class="desc" x="504" y="160">steps, volumes, handoffs</text>

  <rect class="box" x="716" y="90" width="196" height="84" rx="10"/>
  <text class="label" x="732" y="120"><tspan class="num">3</tspan>  Diagnose</text>
  <text class="desc" x="732" y="142">Find waste, bottlenecks</text>
  <text class="desc" x="732" y="160">and rework</text>

  <line class="line" x1="228" y1="132" x2="258" y2="132" marker-end="url(#arrow)"/>
  <line class="line" x1="456" y1="132" x2="486" y2="132" marker-end="url(#arrow)"/>
  <line class="line" x1="684" y1="132" x2="714" y2="132" marker-end="url(#arrow)"/>

  <!-- Wrap to row 2 -->
  <path class="line" d="M814 174 V194 H130 V212" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect class="box" x="32" y="214" width="196" height="84" rx="10"/>
  <text class="label" x="48" y="244"><tspan class="num">4</tspan>  Reimagine</text>
  <text class="desc" x="48" y="266">Improve, automate,</text>
  <text class="desc" x="48" y="284">delegate or reinvent</text>

  <rect class="box" x="260" y="214" width="196" height="84" rx="10"/>
  <text class="label" x="276" y="244"><tspan class="num">5</tspan>  Prioritize</text>
  <text class="desc" x="276" y="266">Score and sequence:</text>
  <text class="desc" x="276" y="284">quick wins to big bets</text>

  <rect class="box" x="488" y="214" width="196" height="84" rx="10"/>
  <text class="label" x="504" y="244"><tspan class="num">6</tspan>  Make the case</text>
  <text class="desc" x="504" y="266">Value as ranges, risks,</text>
  <text class="desc" x="504" y="284">how roles change</text>

  <rect class="box end" x="716" y="214" width="196" height="84" rx="10"/>
  <text class="label" x="732" y="244"><tspan class="num">7</tspan>  Plan</text>
  <text class="desc" x="732" y="266">Now, next and later,</text>
  <text class="desc" x="732" y="284">sequenced by dependency</text>

  <line class="line" x1="228" y1="256" x2="258" y2="256" marker-end="url(#arrow)"/>
  <line class="line" x1="456" y1="256" x2="486" y2="256" marker-end="url(#arrow)"/>
  <line class="line" x1="684" y1="256" x2="714" y2="256" marker-end="url(#arrow)"/>

  <!-- Output arrow -->
  <line class="line" x1="814" y1="298" x2="814" y2="328" marker-end="url(#arrow)"/>

  <!-- Bottom panels -->
  <rect class="panel dashed" x="32" y="330" width="430" height="112" rx="10"/>
  <text class="label" x="48" y="358">At practice or firm level</text>
  <text class="desc" x="48" y="382">Map breaks the scope into units, such as service lines.</text>
  <text class="desc" x="48" y="402">Each unit runs the same loop with its own leader.</text>
  <text class="desc" x="48" y="422">Prioritize rolls every unit's plan back up.</text>

  <rect class="panel" x="482" y="330" width="430" height="112" rx="10"/>
  <text class="label" x="498" y="358">What you get</text>
  <text class="desc" x="498" y="382">A transformation plan saved to your folder:</text>
  <text class="desc" x="498" y="402">what to do now, what it unlocks next, owners,</text>
  <text class="desc" x="498" y="422">business cases, and a roadmap at firm level.</text>
</svg>
