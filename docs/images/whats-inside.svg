<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">What's inside</title>
  <desc id="d">Three kinds of knowledge feed the transformation advisor: the method, business archetypes, and optional organization content. The suite runs as five skills in the AI tool you already use and saves its work to your own workspace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 20px; font-weight: 600; }
      .sub { font-size: 13px; fill: #57606a; }
      .label { font-size: 15px; font-weight: 600; }
      .desc { font-size: 12.5px; fill: #424a53; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
      .optional { stroke-dasharray: 5 4; fill: #ffffff; }
      .advisor { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.2; }
      .out { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.2; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="378" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="32" y="40">What's inside</text>
  <text class="sub" x="32" y="62">Deep, researched knowledge behind simple conversations.</text>

  <!-- Knowledge sources -->
  <rect class="box" x="32" y="84" width="300" height="76" rx="10"/>
  <text class="label" x="48" y="111">Method</text>
  <text class="desc" x="48" y="132">How an expert runs a transformation:</text>
  <text class="desc" x="48" y="150">a guide for every step of the loop</text>

  <rect class="box" x="32" y="176" width="300" height="76" rx="10"/>
  <text class="label" x="48" y="203">Business archetypes</text>
  <text class="desc" x="48" y="224">Deep knowledge of your field, with</text>
  <text class="desc" x="48" y="242">sourced and graded real examples</text>

  <rect class="box optional" x="32" y="268" width="300" height="76" rx="10"/>
  <text class="label" x="48" y="295">Your organization (optional)</text>
  <text class="desc" x="48" y="316">Your tools, terms and internal examples,</text>
  <text class="desc" x="48" y="334">kept in your own folder</text>

  <!-- Converging arrows -->
  <path class="line" d="M332 122 C356 122 352 176 378 176" marker-end="url(#arrow)"/>
  <line class="line" x1="332" y1="214" x2="378" y2="214" marker-end="url(#arrow)"/>
  <path class="line" d="M332 306 C356 306 352 252 378 252" marker-end="url(#arrow)"/>

  <!-- Advisor -->
  <rect class="advisor" x="380" y="130" width="230" height="170" rx="12"/>
  <text class="label" x="396" y="162">Five AI transformation skills</text>
  <text class="desc" x="396" y="188">Advisor · portfolio · delivery</text>
  <text class="desc" x="396" y="206">enablement · governance</text>
  <text class="desc" x="396" y="232">Claude · ChatGPT / Codex</text>
  <text class="desc" x="396" y="250">Cursor · GitHub Copilot</text>
  <text class="desc" x="396" y="280">In the AI tool you already use</text>

  <line class="line" x1="610" y1="214" x2="656" y2="214" marker-end="url(#arrow)"/>

  <!-- Workspace -->
  <rect class="out" x="658" y="130" width="270" height="170" rx="12"/>
  <text class="label" x="674" y="162">Your workspace</text>
  <text class="desc" x="674" y="188">Transformation plan and roadmap</text>
  <text class="desc" x="674" y="206">Portfolio and benefits register</text>
  <text class="desc" x="674" y="224">Solution briefs and evaluations</text>
  <text class="desc" x="674" y="242">Enablement program, AI policy</text>
  <text class="desc" x="674" y="280">Any folder, or a GitHub repo</text>
</svg>
