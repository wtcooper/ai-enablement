- id: security-data-privacy-20
  title: Testing LLM-generated differentially private synthetic data against direct synthesis (financial transactions)
  archetype: security
  module: data-privacy
  function: risk-compliance-legal
  work_types:
  - data-reporting
  - research-synthesis
  pattern: bulk-transformation
  ladder: augment
