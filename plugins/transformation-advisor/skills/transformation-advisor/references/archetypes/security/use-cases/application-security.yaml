- id: security-application-security-23
  title: AI-assisted research for curators of a vulnerability advisory database
  archetype: security
  module: application-security
  function: technology-it
  work_types: [research-synthesis, transaction-processing]
  pattern: intake-triage
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Advisory submissions surged, and the hard ones need package disambiguation, version-range reconstruction,
    multi-ecosystem checks and reconciliation of conflicting upstream data, all of which takes human time.
  solution: >-
    GitHub gave curators of its Advisory Database AI-powered assistance during the research phase of advisory review,
    and improved automation for extracting data from upstream CVE information. Curators still make every decision,
    and reviewed advisories remain human-validated.
  outcomes:
    - {lever: capacity, description: "Advisory output during the surge", figure: "1,560 reviewed advisories in May 2026, over five times a typical month", measures: "reviewed advisories published in May 2026; the post attributes the output to the whole programme, not to the AI tooling", provenance: self-reported, source_ref: GITHUB-ADVDB-2026}
    - {lever: speed, description: "Processing time under load", figure: "about a week, then multiple weeks for a meaningful share", measures: "GitHub's account of publication times since mid-April; internal goals were not consistently met despite the AI-assisted tooling", provenance: self-reported, source_ref: GITHUB-ADVDB-2026}
  prerequisites:
    - "A human-validated review standard"
    - "Triage and prioritisation of inbound submissions"
  risks_and_guardrails:
    - "GitHub says publishing faster by skipping verification would increase false positives at scale (GITHUB-ADVDB-2026)"
    - "Throughput, not data quality, was the failing point: the CVE assignment rate held between 91% and 94% (GITHUB-ADVDB-2026)"
  human_checkpoints:
    - "Curators make every decision on advisories (GITHUB-ADVDB-2026)"
  role_evolution: >-
    Curators keep decision authority and receive AI help for routine research (GITHUB-ADVDB-2026).
  evidence_grade: B
  sources:
    - {ref: GITHUB-ADVDB-2026, title: "Inside the Advisory Database and what happens when vulnerability volume breaks records", publisher: "GitHub Blog", type: vendor, url: "https://github.blog/security/supply-chain-security/inside-the-advisory-database-and-what-happens-when-vulnerability-volume-breaks-records/", date: "2026-06-29", access: full, locator: "Sections: the surge; building AI-assisted research tools; expanding automation"}
  last_reviewed: "2026-10-17"
  notes: >-
    No measurement of the AI tooling's own effect was published. NIST's AI-enabled NVD effort is routed to
    vulnerability-exposure.

- id: security-application-security-24
  title: Testing AI security tools on contamination-reduced, audited benchmarks before trusting them
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, data-reporting]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Public benchmarks built from known CVEs can be memorised by models, proof-of-concept-only checks inflate results,
    one LLM scan can miss a bug the next run finds, and secure-code benchmarks for code models often test function
    rather than security.
  solution: >-
    Teams build their own evaluation harnesses. GitLab's code security team hires engineers to build harnesses that
    measure false positives and missed findings against benchmark applications with known vulnerabilities. AWS built a
    continuously refreshed benchmark of recent CVEs, disabled runtime CVE lookup and audited every success. Semgrep
    measured how closely a model's 'secure' solutions matched the project's real code. Trail of Bits checks grader
    verdicts against expert review.
  outcomes:
    - {lever: quality, description: "Benchmark inflation from memorisation (Claude Opus 5.5 on SusVibes)", figure: "93 of 176 judged solutions (53%) near-identical to the real code; 57 of 102 secure solutions (56%) memorised", measures: "solutions with code similarity of 0.80 or more to the project's real implementation (added lines in non-test files); Semgrep says similarity is not proof of recall", provenance: vendor-published, source_ref: SEMGREP-SUSVIBES-2026}
    - {lever: quality, description: "Headline score on the same benchmark", figure: "54.8% correct and secure of 186 tasks, against a previous best of 43.5%", measures: "tasks passing the project's functional tests and the CVE-fix security tests, run by Semgrep under the leaderboard protocol on 2026-09-26", provenance: vendor-published, source_ref: SEMGREP-SUSVIBES-2026}
    - {lever: quality, description: "Inflation of patching results from proof-of-concept-only validation", figure: "1.83 times on average", measures: "solve rate under PoC-only validation versus fuller validation, across 11 agents (see -18)", provenance: independent, source_ref: ARXIV-2609.04075}
    - {lever: quality, description: "Effect of removing contaminated samples from bug-fixing benchmarks", figure: "reported resolution rates of most LLMs fall by more than 20% relative on medium-difficulty tasks", measures: "SWE-bench Verified and Multi-SWE-bench after filtering contaminated samples; general bug-fixing, adjacent to security", provenance: independent, source_ref: USENIX-BENCHCHECKER-2026}
  prerequisites:
    - "Labelled vulnerable applications or recent CVEs the model has not seen"
    - "Per-vulnerability reporting and repeated trials"
    - "Agreement checks between automated graders and expert review"
  risks_and_guardrails:
    - "AWS reports its own benchmark as contamination-reduced, not contamination-free (AWS-SECAGENT-2026)"
    - "Quoting the rival study's tables, Trail of Bits found 8% of its ActiveMQ verdicts penalised an intended behaviour change and that automated graders agreed with human reviewers on the full outcome in 65.9% of reviewed cases (TOB-1PASSWORD-2026)"
    - "A run that failed because of a broken build can be mistaken for evidence (TOB-1PASSWORD-2026)"
    - "The same patching dataset reads as 26.0% (1Password) or 86% (Trail of Bits reanalysis) depending on subset and success definition (TOB-1PASSWORD-2026; see -18)"
    - "CSET observed that code-model benchmarks often measure function but not security, and training-data transparency is inadequate (CSET-CODEGEN-2024)"
  human_checkpoints:
    - "Experts review graders' verdicts (TOB-1PASSWORD-2026)"
  role_evolution: >-
    GitLab asks security engineers for experience evaluating AI-driven detection against labelled data, measuring
    false positives and missed findings (GITLAB-JOB-CODESEC-2026).
  evidence_grade: B
  sources:
    - {ref: GITLAB-JOB-CODESEC-2026, title: "Job posting: Senior Software Engineer, Security Factory: Code Security", publisher: "GitLab (Greenhouse)", type: job-posting, url: "https://job-boards.greenhouse.io/gitlab/jobs/8738179002", date: "2026-10-09", access: full, locator: "Responsibilities and qualifications"}
    - {ref: AWS-SECAGENT-2026, title: "AWS Security Agent (now part of AWS Continuum) exploited 33 of 37 new real-world CVEs", publisher: "AWS Security Blog", type: vendor, url: "https://aws.amazon.com/blogs/security/aws-security-agent-now-part-of-aws-continuum-exploited-33-of-37-new-real-world-cves/", date: "2026-10-15", access: full, locator: "'Why we built a fresh benchmark'; contamination"}
    - {ref: SEMGREP-SUSVIBES-2026, title: "Is AI-Generated Code Secure? Testing Claude Opus 5.5 (listing title: Claude Opus 5.5 Writes Working Code but Only Half of It Is Secure)", publisher: "Semgrep Blog", type: vendor, url: "https://semgrep.dev/blog/2026/claude-opus-5-5-susvibes-benchmark", date: "2026-09-29", access: full, locator: "TL;DR and memorisation analysis"}
    - {ref: ARXIV-2609.04075, title: "PatchBench: Evaluating AI Agents for Vulnerability Patching", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.04075", date: "2026-09-03", access: full, locator: "Abstract"}
    - {ref: USENIX-BENCHCHECKER-2026, title: "BenchChecker: Assessing the Credibility of Bug-Fixing Benchmarks for LLMs", publisher: "USENIX Security Symposium 2026", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/wu-di", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: TOB-1PASSWORD-2026, title: "1Password's AI patching benchmark is misleading", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/09/15/1passwords-ai-patching-benchmark-is-misleading/", date: "2026-09-15", access: full, locator: "Benchmark design principles and grading critique"}
    - {ref: CSET-CODEGEN-2024, title: "Cybersecurity Risks of AI-Generated Code", publisher: "Georgetown CSET", type: academic, url: "https://cset.georgetown.edu/publication/cybersecurity-risks-of-ai-generated-code/", date: "2024-11", access: full, locator: "Key findings"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': evaluation of AI tools before reliance. The SusVibes run is by a scanner vendor. The ActiveMQ and
    grader-agreement numbers are Trail of Bits' reading of 1Password's report. BenchChecker was routed from the
    vulnerability-exposure research and covers general bug-fixing benchmarks. Merged from practice and governance.

- id: security-application-security-25
  title: Security team rebuilt around building and operating its own AI skills and agents
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [expert-judgment, software-systems]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Handing people chat licences did not change how security work flows; most staff were sceptical or resistant, and
    expertise stayed with individuals.
  solution: >-
    Trail of Bits standardised on one coding agent, wrote an AI handbook listing approved and unapproved tools and
    rules for sensitive data, built a curated marketplace of plugins and skills with sandboxing, and used a visible
    maturity matrix and hackathons so expertise is encoded as reusable skills, with leadership going first. Anthropic's
    application security engineers each own a Claude-powered security system end to end; GitLab expects all team
    members to use AI in daily work; Cloudflare, Coinbase and Samsara postings ask security engineers to build or use
    AI-driven triage, detection and remediation tooling.
  outcomes:
    - {lever: capacity, description: "Library size and adoption starting point", figure: "94 plugins, 201 skills and 84 agents; about 5% of the firm on board a year earlier", measures: "the firm's own counts at 2026-03-31; the 5% is the author's statement of the starting point", provenance: self-reported, source_ref: TOB-AINATIVE-2026}
    - {lever: quality, description: "Bugs found by AI-augmented auditors", figure: "200 a week 'on the right engagements'", measures: "the firm's claim; no definition of bug, auditor or engagement basis", provenance: self-reported, source_ref: TOB-AINATIVE-2026}
  prerequisites:
    - "An executive sponsor who uses the tools first"
    - "A standard toolchain and one-command setup"
    - "A handbook with approved tools and data rules"
    - "Sandboxing and a curated marketplace for skills"
  risks_and_guardrails:
    - "The firm names four adoption barriers (self-enhancing bias, identity threat, intolerance for imperfection, opacity) and designs each programme element against one (TOB-AINATIVE-2026)"
    - "The handbook bars at least one coding tool from client code except on blockchain engagements (TOB-AINATIVE-2026)"
    - "A curated marketplace and sandboxing guard against backdoored plugins and destructive mistakes, and Trail of Bits later showed public skill scanners could be bypassed (TLDRSEC-TOBAINATIVE-2026; TOB-SKILLS-2026)"
  human_checkpoints:
    - "Approval rules in the handbook; humans remain the auditors (TOB-AINATIVE-2026)"
  role_evolution: >-
    About 5% of the firm backed the initiative at the start; the expert's identity shifts from not needing AI to being
    the one who builds the tools, and level 3 of the matrix is inventing new ways and building tools
    (TLDRSEC-TOBAINATIVE-2026; TOB-AINATIVE-2026). Anthropic's posting says the human work is the judgement layer
    (ANTHROPIC-JOB-APPSEC-2026). Coinbase asks engineers to mentor juniors on integrating AI into offensive security
    workflows (COINBASE-JOB-PSE-2026).
  evidence_grade: B
  sources:
    - {ref: TOB-AINATIVE-2026, title: "How we made Trail of Bits AI-native (so far)", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/03/31/how-we-made-trail-of-bits-ai-native-so-far/", date: "2026-03-31", access: full, locator: "Whole post"}
    - {ref: TLDRSEC-TOBAINATIVE-2026, title: "How we made Trail of Bits AI-native (so far) (newsletter version)", publisher: "tl;dr sec (Dan Guido, Clint Gibler)", type: press, url: "https://tldrsec.com/p/how-we-made-trail-of-bits-ai-native-so-far", date: "2026-03-31", access: full, locator: "Opening and 'The remedies that actually worked'"}
    - {ref: TOB-SKILLS-2026, title: "The sorry state of skill distribution", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/", date: "2026-06-03", access: full, locator: "Opening"}
    - {ref: ANTHROPIC-JOB-APPSEC-2026, title: "Job posting: Staff+ Application Security Engineer (first published 2025-01-22, updated 2026-08-21)", publisher: "Anthropic (Greenhouse)", type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/4502508008", date: "2026-08-21", access: full, locator: "About the role"}
    - {ref: GITLAB-JOB-CODESEC-2026, title: "Job posting: Senior Software Engineer, Security Factory: Code Security", publisher: "GitLab (Greenhouse)", type: job-posting, url: "https://job-boards.greenhouse.io/gitlab/jobs/8738179002", date: "2026-10-09", access: full, locator: "Team expectation to use AI in daily workflows"}
    - {ref: CLOUDFLARE-JOB-PSE-2026, title: "Job posting: Product Security Engineer", publisher: "Cloudflare (Greenhouse)", type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8102768?gh_jid=8102768", date: "2026-08-04", access: full, locator: "Responsibilities: AI-driven tools to automate code analysis and triage"}
    - {ref: COINBASE-JOB-PSE-2026, title: "Job posting: Product Security Engineer (Offensive Security, Application Security team)", publisher: "Coinbase (Greenhouse)", type: job-posting, url: "https://www.coinbase.com/careers/positions/8165389?gh_jid=8165389", date: "2026-08-28", access: full, locator: "Responsibilities: mentor junior engineers on integrating AI"}
    - {ref: SAMSARA-JOB-APPSEC-2026, title: "Job posting: Staff Application Security Engineer", publisher: "Samsara (Greenhouse)", type: job-posting, url: "https://www.samsara.com/company/careers/roles/8205149?gh_jid=8205149", date: "2026-09-15", access: full, locator: "Qualification: hands-on AI use in triage, detection logic and remediation drafting"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': an operating-model change, not a workflow pattern. Graded B under the 2026-10-17 rule: the
    '200 bugs a week' figure is a management claim with no definition, and asset counts are not work outcomes (the
    discourse angle had graded this A). The post was adapted from an [un]prompted talk. This is the only entry with
    change scope 'model'. Merged from practice and discourse.
