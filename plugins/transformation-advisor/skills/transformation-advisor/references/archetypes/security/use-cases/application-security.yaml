  last_reviewed: "2026-10-17"
  notes: >-
    Counts are published by the model provider and are not audited. Denominators differ between Anthropic's May
    update (90.6%, 1,587 of 1,752 assessed findings valid; 23,019 total findings estimated), the October dashboard and
    VulnCheck's September count (26,153 claimed); VulnCheck says the dashboard and ledger do not fully match, and
    VulnCheck itself sells vulnerability intelligence. Glasswing partners' results (more than 10,000 high- or
    critical-severity flaws) are reported by Anthropic, not by the partners. A second-hand quote that Mozilla fixed
    271 Firefox vulnerabilities found with the model (Computer Weekly) is unverified. curl's high-severity
    CVE-2026-92392 was found by an Anthropic researcher using OSS Scanner, per the curl maintainer (STENBERG-UAF-2026).
    Strong overlap with the vulnerability-exposure module.

- id: security-application-security-14
  title: Specialist AI-augmented audit of a critical open-source project, validated by its maintainers
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Heavily fuzzed and audited projects such as curl still contain undiscovered vulnerabilities, and small volunteer
    maintainer teams cannot find them all or scale their review.
  solution: >-
    Engineers at AISLE pointed AI-powered analysis tooling at the curl source over about a year, with human security
    staff backing each finding, and worked closely with the curl team, which triaged, fixed and decided which reports
    merited CVEs. curl published AISLE's audit report as its fifth external audit. curl's maintainer separately reports
    that AISLE, ZeroPath and OpenAI's Codex Security together triggered hundreds of merged bugfixes.
  outcomes:
    - {lever: quality, description: "Published curl vulnerabilities attributed to the AISLE work", figure: "35 vulnerabilities with CVE identifiers", measures: "count stated by curl's lead maintainer of published curl vulnerabilities resulting from AISLE engineers' AI-assisted analysis over 'the last year or so'", provenance: independent, source_ref: CURL-AISLE-2026}
    - {lever: quality, description: "Merged bugfixes triggered by AI tools in curl", figure: "two to three hundred, plus a dozen or more CVEs", measures: "the maintainer's approximate count, as of 2026-05-11, of bugfixes merged over 'the recent 8-10 months' attributed to AISLE, ZeroPath and Codex Security together", provenance: independent, source_ref: STENBERG-MYTHOS-2026}
    - {lever: capacity, description: "Share of one release's new vulnerabilities reported by AISLE", figure: "18 of 24 in curl 8.23.0", measures: "AISLE's count; curl's own pre-release post said 22 were pending, so the counts differ (STENBERG-PENDING-2026)", provenance: vendor-published, source_ref: AISLE-YEAR-2026}
  prerequisites:
    - "A maintainer team willing to cooperate closely and able to triage a high volume of reports"
    - "Skilled humans validating findings and authoring patches (the curl post credits this as the difference)"
    - "Maintainer capacity to fix reports quickly"
  risks_and_guardrails:
    - "Maintainers decide what is a vulnerability: curl's maintainer rejected three of five Mythos 'confirmed' findings as false positives and one as an ordinary bug (STENBERG-MYTHOS-2026)"
    - "The post does not say how many AI-generated candidates were rejected, so yield per finding is unknown; the maintainer says curl is scanned by countless humans and AIs (CURL-AISLE-2026)"
    - "GTIG reports that 50% of vulnerabilities it identified as likely AI-discovered (January-August 2026) led to remote code execution versus 26% across the broader CVE ecosystem, using a heuristic attribution method, and saw the first exploiting cluster within 4 days of disclosure for one AI-found flaw (GTIG-VULNTRENDS-2026)"
    - "Kernel policy tells AI users to build a reproducer before reporting, because many unverified reports prove invalid (LINUX-KERNEL-AI-2026)"
  human_checkpoints:
    - "AISLE's skilled humans back up each finding (CURL-AISLE-2026)"
    - "curl maintainers reproduce, fix and decide CVE status (CURL-AISLE-2026)"
  role_evolution: >-
    AISLE employees have authored several dozen commits in curl, so the external auditors also act as contributors
    (CURL-AISLE-2026). curl's security team is its core team of six volunteers (CURL-TEAM-2026), and its maintainer
    reports security reports at 4-5 times the 2024 rate, more than one a day (STENBERG-PRESSURE-2026).
  evidence_grade: A
  sources:
    - {ref: CURL-AISLE-2026, title: "A curl audit by Aisle", publisher: "daniel.haxx.se (Daniel Stenberg, curl lead maintainer)", type: community, url: "https://daniel.haxx.se/blog/2026/10/14/a-curl-audit-by-aisle/", date: "2026-10-14", access: full, locator: "Whole post (paragraphs 1-4 for the count)"}
    - {ref: STENBERG-MYTHOS-2026, title: "Mythos finds a curl vulnerability", publisher: "daniel.haxx.se (Daniel Stenberg, curl lead developer)", type: community, url: "https://daniel.haxx.se/blog/2026/05/11/mythos-finds-a-curl-vulnerability/", date: "2026-05-11", access: full, locator: "Section 'AI scans of curl'"}
    - {ref: AISLE-YEAR-2026, title: "AISLE's Year on the Cyber Frontier: 500 CVEs Later", publisher: "AISLE (Stanislav Fort)", type: vendor, url: "https://aisle.com/blog/aisle-year-on-the-cyber-frontier", date: "2026-10-14", access: full, locator: "Introduction and 'Why We Chose curl'"}
    - {ref: STENBERG-PENDING-2026, title: "Twenty-two pending curl vulnerabilities", publisher: "daniel.haxx.se", type: community, url: "https://daniel.haxx.se/blog/2026/10/07/twenty-two-pending-curl-vulnerabilities/", date: "2026-10-07", access: full, locator: "Whole post"}
    - {ref: STENBERG-PRESSURE-2026, title: "The pressure", publisher: "daniel.haxx.se", type: community, url: "https://daniel.haxx.se/blog/2026/05/26/the-pressure/", date: "2026-05-26", access: full, locator: "Report-rate paragraphs"}
    - {ref: CURL-TEAM-2026, title: "The 2026 curl team", publisher: "daniel.haxx.se (Daniel Stenberg, curl lead maintainer)", type: community, url: "https://daniel.haxx.se/blog/2026/10/12/the-2026-curl-team/", date: "2026-10-12", access: full, locator: "Security team"}
    - {ref: GTIG-VULNTRENDS-2026, title: "Vulnerability Discovery and Exploitation Trends in the AI Era", publisher: "Google Threat Intelligence Group", type: firm, url: "https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era/", date: "2026-09-30", access: full, locator: "Sections 'AI as the Hunter', 'Risk Profile Divergence'"}
    - {ref: LINUX-KERNEL-AI-2026, title: "AI Coding Assistants; Kernel Guidelines for Tool-Generated Content", publisher: "The Linux Kernel documentation", type: community, url: "https://docs.kernel.org/process/coding-assistants.html", date: "2026", access: full, locator: "'Procedure for finding and fixing bugs'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The maintainer's counts come from a third party to the vendor, hence 'independent', but they are blog statements,
    not an audit of the audit, and the source does not name AISLE's tools. AISLE's headline claims (500+ CVEs across
    100+ code bases; about 1% of 2026 open-source CVEs) are vendor-published and unchecked; a maintainer comparison
    AISLE quotes ('Mythos 0 / Aisle 29') was not found in the maintainer's own posts. Merged from all three angles.

- id: security-application-security-15
  title: Autonomous cyber reasoning systems that find and patch vulnerabilities (DARPA AI Cyber Challenge)
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [software-systems, review-assurance]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Finding and patching vulnerabilities by current methods is slow, expensive and depends on a limited workforce
    (DARPA's director, as quoted by DARPA).
  solution: >-
    DARPA's AI Cyber Challenge (AIxCC, 2023-2025) had seven finalist teams build fully autonomous systems that find and
    patch vulnerabilities in open-source code; winners were Team Atlanta, Trail of Bits and Theori. All seven systems
    are being released as open source, and DARPA and ARPA-H added prizes for integrating them into software relevant
    to critical infrastructure.
  outcomes:
    - {lever: quality, description: "Final-round discovery and patching of synthetic vulnerabilities", figure: "54 of 63 found (86%); 43 patched (68% of the 63); semifinal rates 37% found, 25% patched", measures: "unique synthetic vulnerabilities in the final competition's scored round, as published by DARPA", provenance: independent, source_ref: AIXCC-DARPA-2025}
    - {lever: quality, description: "Real, non-synthetic findings", figure: "18 real vulnerabilities; 11 patches", measures: "real vulnerabilities found in the final (6 in C, 12 in Java, being disclosed to maintainers) and patches provided for real vulnerabilities", provenance: independent, source_ref: AIXCC-DARPA-2025}
    - {lever: cost, description: "Average cost per competition task", figure: "about USD 152", measures: "average cost per task of competitor systems, as stated by DARPA", provenance: independent, source_ref: AIXCC-DARPA-2025}
  prerequisites:
    - "An open-source code base with build and test infrastructure"
    - "LLM credits (frontier labs donated credits to each finalist)"
  risks_and_guardrails:
    - "Scoring used synthetic vulnerabilities, so rates may not transfer to production code; a USENIX Security 2026 systematisation of the competition says limitations remain open (USENIX-SEC-2026, SoK abstract)"
    - "PatchBench found proof-of-concept-only validation inflates agent patch solve rates by 1.83 times on average across 11 agents, including the top three AIxCC agents (ARXIV-2609.04075)"
  human_checkpoints:
    - "Real findings are disclosed to maintainers for confirmation (AIXCC-DARPA-2025)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: B
  sources:
    - {ref: AIXCC-DARPA-2025, title: "AI Cyber Challenge marks pivotal inflection point for cyber defense (page undated; final at DEF CON 33, August 2025)", publisher: "DARPA", type: regulator, url: "https://www.darpa.mil/news/2025/aixcc-results", date: "2025-08", access: full, locator: "'Deep Dive: Final Competition Findings'"}
    - {ref: USENIX-SEC-2026, title: "SoK: DARPA's AI Cyber Challenge (AIxCC): Competition Design, Architectures, and Lessons Learned (35th USENIX Security Symposium)", publisher: "USENIX", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/technical-sessions", date: "2026-08", access: full, locator: "Software Security 2 session, abstract"}
    - {ref: ARXIV-2609.04075, title: "PatchBench: Evaluating AI Agents for Vulnerability Patching", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.04075", date: "2026-09-03", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Capped at B: a government-run competition on synthetic vulnerabilities, adjacent to production AppSec. DARPA
    organised and scored it, so 'independent' means independent of the competitors. DARPA is typed 'regulator' for
    lack of a better source type. Note the 68% is 43 of all 63 synthetic vulnerabilities, not of those found. The
    winners' names come from the landscape scan.

- id: security-application-security-16
  title: AI-drafted fixes for scanner alerts and critical vulnerabilities, delivered as reviewable changes
  archetype: security
  module: application-security
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    GitHub says developers often have little secure-coding training, so fixing code-scanning alerts takes substantial
    effort; Snyk says its data as of October 2026 showed roughly eight new vulnerabilities introduced for every one
    remediated. Finding vulnerabilities is only half the work.
  solution: >-
    LLMs draft a fix for a code-scanning alert or a confirmed vulnerability and present it as a proposed change that a
    developer must review. GitHub's Copilot Autofix does this for CodeQL alerts on pull requests and default branches;
    Meta reports AI-written diffs for critical vulnerabilities; Google's bug-fix agent uses scan results and generated
    proofs to build fixes consistent with internal standards and submits them inside the original change request;
    Snyk sells an agentic fix architecture.
  outcomes:
    - {lever: speed, description: "Share of Meta's critical vulnerabilities fixed by AI-written diffs", figure: "over 40%", measures: "from the abstract of an upcoming talk; denominator and period not stated; the abstract adds that this did not by itself reduce the time to fix", provenance: self-reported, source_ref: UNPROMPTED-2026}
    - {lever: quality, description: "Secure-and-functional fix rate with and without vendor security context", figure: "74.6% to 85.4% (Claude Opus 4.6 alone versus with Snyk Intelligence)", measures: "share of about 150 single-vulnerability samples where a hidden security test and a hidden functional test both pass on the first try; Snyk's own benchmark", provenance: vendor-published, source_ref: SNYK-AGENTFIX-2026}
    - {lever: speed, description: "Google's bug-fix agent", figure: "none published", measures: "Google says the agent shortens the time between detection and resolution but gives no figure", provenance: self-reported, source_ref: GOOGLE-AGENTICSCAN-2026}
  prerequisites:
    - "Scanner alerts or confirmed findings, ideally with a proof of how the flaw is exercised"
    - "Test coverage so a developer can check behaviour is unchanged (GitHub advises this)"
    - "Dependency-review controls for fixes that add or update packages"
  risks_and_guardrails:
    - "GitHub's application card says suggestions can be non-deterministic, semantically wrong, partial, at the wrong location, or can introduce fabricated dependencies, and that review is required (GITHUB-APPCARD-2026, Limitations)"
    - "GitHub tests Autofix on a harness of over 2,300 alerts and reports that 'many' suggestions could be committed as-is, but publishes no success rate (GITHUB-APPCARD-2026, Custom evaluations)"
    - "In a 15-day single-case study in a closed-source industrial C++ repository, AI-assisted remediation produced hundreds of commits that saturated build-on-commit CI and reviewer attention until changes were batched by directory and capped in size (ARXIV-2609.29172)"
    - "Controlled studies show agent patches are often incomplete (see -18)"
  human_checkpoints:
    - "A developer reviews and accepts or edits every suggested fix (GITHUB-APPCARD-2026; GOOGLE-AGENTICSCAN-2026)"
    - "Fixes that add or update dependencies are checked before merge"
  role_evolution: >-
    Developers evaluate a suggested fix instead of starting from a search for how to fix the issue (GITHUB-APPCARD-2026,
    intended uses).
  evidence_grade: B
  sources:
    - {ref: UNPROMPTED-2026, title: "[un]prompted 2026 agenda (conference 2026-10-27 to 2026-10-29, San Francisco; abstracts of upcoming talks)", publisher: "[un]prompted (AI security practitioner conference)", type: conference, url: "https://unpromptedcon.org/agenda-10-2026/", date: "2026-10-06", access: full, locator: "Session: How Meta Changed Building Secure Software With AI (David Molnar, Meta)"}
    - {ref: GITHUB-APPCARD-2026, title: "Application card: GitHub security and quality AI features (page undated; date is retrieval date)", publisher: "GitHub Docs", type: vendor, url: "https://docs.github.com/en/code-security/code-scanning/managing-code-scanning-alerts/about-autofix-for-codeql-code-scanning", date: "2026-10-17", access: full, locator: "Sections: Copilot Autofix; Limitations; Custom evaluations"}
    - {ref: SNYK-AGENTFIX-2026, title: "Benchmarking Secure-and-Functional Remediation and How Snyk Agent Fix Lifts Frontier-Model Fix Rates by over 14%", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/snyk-agent-fix-remediation-benchmark/", date: "2026-08-18", access: full, locator: "Headline findings and Golden Tests design"}
    - {ref: GOOGLE-AGENTICSCAN-2026, title: "Changing the game: Using agentic AI to secure infrastructure code (page title: Using AI agents to secure Google infrastructure)", publisher: "Google Cloud Blog (Google AI Infrastructure team)", type: firm, url: "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/", date: "2026-09-19", access: full, locator: "Bug fix agents close the loop"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Problem statement: introduced-to-remediated ratio"}
    - {ref: ARXIV-2609.29172, title: "Orchestrating AI-Assisted Code Remediation: Socio-Technical Bottlenecks in a Large Industrial Repository", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.29172", date: "2026-09-24", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    The Meta figure is from a conference abstract for an event not yet held, so B rather than A. The Snyk figure is a
    vendor benchmark of its own product. Merged from practice and the governance angle's bug-fix agent entry.

- id: security-application-security-17
  title: Engineer-directed agent patching of open-source vulnerabilities, reviewed by maintainers
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [software-systems, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Frontier models produce a flood of security findings that stretched open-source maintainers must sort into real
    vulnerabilities and plausible false positives, let alone fix.
  solution: >-
    Trail of Bits, with OpenAI, pairs its engineers with open-source projects under 'Patch the Planet'. Agents find
    bugs and write patches, tests, fuzzing harnesses and CI hardening while the engineers direct the work, triage the
    findings and check the results; maintainers decide whether to merge, revise or reject each pull request. A bot
    tracks every project and posts findings and merged patches to the team's chat.
  outcomes:
    - {lever: quality, description: "Maintainer disposition of decided pull requests", figure: "126 of 186 merged (67.7%); 60 closed unmerged, 4 of them explicitly rejected on technical grounds", measures: "Patch the Planet pull requests that maintainers had merged or closed by 2026-09-14; 54 still open are excluded", provenance: self-reported, source_ref: TOB-1PASSWORD-2026}
    - {lever: quality, description: "Merged patches that kept the proposed security fix", figure: "91 of 126 (72.2%) with no security-relevant revision observed; 33 (26.2%) with one", measures: "merged pull requests, by whether maintainers revised the security fix", provenance: self-reported, source_ref: TOB-1PASSWORD-2026}
    - {lever: risk, description: "Problems found after merge", figure: "at least 10 functional bugs, 4 build, test or release bugs, 1 performance bug; no exploitable vulnerabilities", measures: "result of an agent-and-engineer review of about 33,500 later commits in Patch the Planet projects, looking for changes that repaired a problem the patches introduced; extension to all patches under way", provenance: self-reported, source_ref: TOB-1PASSWORD-2026}
    - {lever: capacity, description: "First-week output", figure: "64 pull requests and 51 issues across 19 projects; 37 merged", measures: "public tally at 2026-06-22; private reports not counted", provenance: self-reported, source_ref: TOB-PTP-2026}
  prerequisites:
    - "Access to frontier models, including a cyber-oriented variant (the posts name GPT-5.5-Cyber)"
    - "Engineer time set aside (the first week cleared dozens of engineers' schedules)"
    - "Coordinated-disclosure channels and maintainers who want the help"
  risks_and_guardrails:
    - "In a freenginx case an agent-written patch left one vulnerable path open and added a crash during request cleanup; the maintainer's own replacement had the same crash (TOB-1PASSWORD-2026)"
    - "Maintainer acceptance does not establish correctness (TOB-1PASSWORD-2026)"
    - "The firm says its post-patch-validation skill was not used in this work (TOB-1PASSWORD-2026; see -18)"
    - "GitHub's fund report says maintainers keep context, judgement and accountability for what ships (GITHUB-SECUREFUND-2026)"
  human_checkpoints:
    - "Trail of Bits engineers direct the agents and check results (TOB-PTP-2026)"
    - "Project maintainers decide whether to merge each pull request (TOB-1PASSWORD-2026)"
  role_evolution: >-
    The firm says its experts orchestrate and triage findings and handle fixing and hardening alongside maintainers,
    rather than filing issues and leaving (TOB-PTP-2026).
  evidence_grade: A
  sources:
    - {ref: TOB-1PASSWORD-2026, title: "1Password's AI patching benchmark is misleading", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/09/15/1passwords-ai-patching-benchmark-is-misleading/", date: "2026-09-15", access: full, locator: "Sections 'What happened to our patches in real projects' and 'We checked what happened after our patches were merged'"}
    - {ref: TOB-PTP-2026, title: "Introducing Patch the Planet", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/06/22/introducing-patch-the-planet/", date: "2026-06-22", access: full, locator: "Introduction; first-week tally"}
    - {ref: GITHUB-SECUREFUND-2026, title: "What 50 open source projects taught us about security in the AI era", publisher: "GitHub Blog", type: vendor, url: "https://github.blog/open-source/maintainers/what-50-open-source-projects-taught-us-about-security-in-the-ai-era/", date: "2026-08-13", access: full, locator: "Lesson: maintainers keep judgement and accountability"}
    - {ref: RESILIENTCYBER-VULNMGMT-2026, title: "AI Just Broke Vulnerability Management", publisher: "Resilient Cyber (Chris Hughes)", type: podcast, url: "https://www.resilientcyber.io/p/ai-just-broke-vulnerability-management", date: "2026-10-03", access: full, locator: "Video summary text"}
  last_reviewed: "2026-10-17"
  notes: >-
    All figures are the firm's own; Trail of Bits is also the party criticising a rival benchmark. The merge rate
    counts only decided pull requests. A commentator's summary gives a different funnel (1,646 issues, 615 patches,
    13% merged as of 2026-10-03; RESILIENTCYBER-VULNMGMT-2026). Merged from all three angles; the vulnerability-
    exposure research carries the same programme as a service to maintainers.

- id: security-application-security-18
  title: Independent verification of AI-written security patches before human review
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    A patch can stop the supplied proof-of-concept (PoC) crash without fixing the root cause, and both agents and
    developers submit incomplete fixes.
  solution: >-
    Trail of Bits released two agent skills. Post-patch-validation has the agent write a check that fails on the
    vulnerable code and passes on the patched version, test at least one other path to the same failure, check for
    regressions with project tests, sanitizers or a bounded fuzzing run, and treat broken builds as inconclusive.
    Review-walkthrough turns a branch diff into an ordered walkthrough with findings beside the code for the
    reviewing engineer. Anthropic used 'task verifiers' that check the vulnerability is gone and functionality is
    preserved in its Firefox work, and Snyk has deterministic engines, not the model that wrote the fix, verify it.
  outcomes:
    - {lever: quality, description: "Developers' first fixes that failed to fully resolve the issue (the human baseline)", figure: "283 of 2,265 (12.5%; 95% interval 10.5% to 14.5%)", measures: "first fixes for vulnerabilities in 236 Trail of Bits assessments, 2024-2026, that the firm reviewed; may undercount; the firm says it is not directly comparable with agent results", provenance: self-reported, source_ref: TOB-1PASSWORD-2026}
    - {lever: quality, description: "Autonomous agent patch quality in a controlled study", figure: "26.0% fully mitigated with no side effects; 49.3% failed to fix at least one exploit path; 4.5% introduced a new vulnerability", measures: "6,080 valid iterations of two frontier coding agents on six recent high-complexity CVEs, several prompting and iteration modes", provenance: vendor-published, source_ref: ONEPASSWORD-FLAWED-2026}
    - {lever: quality, description: "Trail of Bits' reanalysis of the same data", figure: "2,634 of 3,067 patches (86%) blocked the supplied exploit", measures: "trials where agents could run code and were not told to apply the wrong fix, excluding runs that consulted the upstream fix; blocking the exploit does not establish a complete repair", provenance: self-reported, source_ref: TOB-1PASSWORD-2026}
    - {lever: quality, description: "Inflation from checking only the proof-of-concept", figure: "1.83 times on average; 25% of agent patches substantially similar to historical developer patches", measures: "increase in solve rate under PoC-only validation versus PatchBench's fuller validation, across 11 agents including the top three AIxCC agents", provenance: independent, source_ref: ARXIV-2609.04075}
  prerequisites:
    - "A vulnerability report and the vulnerable and patched revisions"
    - "A runnable build with project tests, sanitizer builds or bounded fuzzing"
    - "Reviewers able to read an ordered walkthrough of the diff"
  risks_and_guardrails:
    - "Trail of Bits says the 1Password sample was chosen for difficulty, 22% of the data used prompts telling agents to apply a wrong fix and 36% prohibited testing (TOB-1PASSWORD-2026)"
    - "1Password concludes highly automated LLM remediation pipelines are more likely to change behaviour or introduce or mask vulnerabilities than fix them, and recommends tightly constrained environments with skilled oversight (ONEPASSWORD-FLAWED-2026, abstract)"
    - "Anthropic's feedback to 1Password, as published by 1Password: make verification execution-grounded and keep domain experts as final reviewers at current capability (ONEPASSWORD-FLAWEDBLOG-2026)"
    - "Anthropic says it cannot guarantee that patches passing its verifiers are good enough to merge and recommends the same scrutiny as for any outside patch (ANTHROPIC-FIREFOX-2026)"
    - "Unaided agents can claim a fix that a rescan contradicts, so the verifier must not trust the agent (SNYK-VULNBUMP-2026)"
  human_checkpoints:
    - "Engineers review the walkthrough and decide to merge (TOB-1PASSWORD-2026)"
    - "Maintainers review AI-authored patches as for any external author (ANTHROPIC-FIREFOX-2026)"
  role_evolution: >-
    The post releases review-walkthrough to help engineers review patches they are responsible for merging; it does not
    describe role changes (TOB-1PASSWORD-2026).
  evidence_grade: B
  sources:
    - {ref: TOB-1PASSWORD-2026, title: "1Password's AI patching benchmark is misleading", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/09/15/1passwords-ai-patching-benchmark-is-misleading/", date: "2026-09-15", access: full, locator: "'Developers get one in eight fixes wrong'; 'How the experiment produces a misleading headline'; 'Agent skills for better security patches'"}
    - {ref: ONEPASSWORD-FLAWED-2026, title: "Frontier Models' Vulnerability Patches are Often F.L.A.W.E.D.", publisher: "1Password (Off-by-1 Labs)", type: vendor, url: "https://1password.com/files/resources/frontier-models-vulnerability-patches-flawed.pdf", date: "2026-08-06", access: full, locator: "Abstract; section 3.1; section 5.1"}
    - {ref: ONEPASSWORD-FLAWEDBLOG-2026, title: "Off-by-1 Labs: AI-Generated Vulnerability Patches and Human Review (FLAWED study blog)", publisher: "1Password", type: vendor, url: "https://1password.com/blog/why-ai-generated-patches-still-require-human-review", date: "2026-08-06", access: full, locator: "Feedback from model providers"}
    - {ref: ARXIV-2609.04075, title: "PatchBench: Evaluating AI Agents for Vulnerability Patching", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.04075", date: "2026-09-03", access: full, locator: "Abstract"}
    - {ref: ANTHROPIC-FIREFOX-2026, title: "Partnering with Mozilla on Firefox security", publisher: "Anthropic Frontier Red Team (red.anthropic.com)", type: vendor, url: "https://red.anthropic.com/2026/firefox/", date: "2026-03-06", access: full, locator: "Task verifiers"}
    - {ref: SNYK-VULNBUMP-2026, title: "VulnBump: Can AI Agents Safely Fix Dependencies?", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/vulnbump/", date: "2026-10-15", access: full, locator: "Independent verifier in a clean container"}
  last_reviewed: "2026-10-17"
  notes: >-
    No outcome is published for the skills themselves; the figures show why verification matters. The 1Password and
    Trail of Bits figures come from a published dispute between commercial parties; the 1Password report's date is
    taken from the Trail of Bits post (the blog was updated 2026-09-16). PatchBench was read at abstract level only.
    Merged from all three angles plus the governance angle's controlled-study evidence.

- id: security-application-security-19
  title: Agent-applied compiler bounds-safety annotations to remove whole vulnerability classes
  archetype: security
  module: application-security
  function: technology-it
  work_types: [software-systems]
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Patching one bug at a time does not remove whole classes of memory-safety vulnerability, such as the libwebp heap
    overflow used in a zero-click iOS exploit.
  solution: >-
    Google DeepMind's CodeMender agent applied -fbounds-safety annotations to parts of the libwebp image library so the
    compiler adds bounds checks, fixed its own compile errors and test failures, and used an LLM judge configured for
    functional equivalence. It surfaces patches for human review only after validation by static and dynamic
    analysis, differential testing, fuzzing and SMT solvers. Anthropic lists rebuilding legacy code bases in
    memory-safe languages among defensive tasks such models can support.
  outcomes:
    - {lever: capacity, description: "Security fixes upstreamed during the research", figure: "72", measures: "fixes upstreamed to open-source projects (some up to 4.5 million lines of code) over the six months of building CodeMender; not limited to hardening annotations", provenance: self-reported, source_ref: DEEPMIND-CODEMENDER-2025}
  prerequisites:
    - "Compiler support for the annotations"
    - "Strong test suites and program-analysis tooling to validate each change"
    - "Maintainer willingness to take the changes"
  risks_and_guardrails:
    - "DeepMind says mistakes in code security could be costly and that only validated, high-quality patches reach human review (DEEPMIND-CODEMENDER-2025)"
    - "Results are described as early research (DEEPMIND-CODEMENDER-2025)"
  human_checkpoints:
    - "Humans review surfaced patches (DEEPMIND-CODEMENDER-2025)"
  role_evolution: >-
    DeepMind says the agent frees developers and maintainers to focus on building good software
    (DEEPMIND-CODEMENDER-2025).
  evidence_grade: B
  sources:
    - {ref: DEEPMIND-CODEMENDER-2025, title: "Introducing CodeMender: an AI agent for code security", publisher: "Google DeepMind", type: vendor, url: "https://deepmind.google/discover/blog/introducing-codemender-an-ai-agent-for-code-security/", date: "2025-10-06", access: full, locator: "Whole post; libwebp section"}
    - {ref: ANTHROPIC-EXPAND-2026, title: "Expanding Project Glasswing", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/expanding-project-glasswing", date: "2026-06-02", access: full, locator: "Defensive tasks Mythos Preview can support"}
  last_reviewed: "2026-10-17"
  notes: >-
    The 72-fix count does not measure the hardening work itself, for which no figures were published. The post was
    last modified 2026-07-13.

- id: security-application-security-20
  title: Agents that upgrade vulnerable dependencies and prove the upgrade builds and removes the vulnerability
  archetype: security
  module: application-security
  function: technology-it
  work_types: [software-systems]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Most vulnerable packages already have a fixed version, but upgrading safely is hard: most are transitive
    dependencies (pulled in by other packages), about a quarter need a major version bump and even minor releases can
    break builds.
  solution: >-
    A remediation agent applies one recommended upgrade per task, runs the build and tests, rescans, and repairs errors
    before finishing. Snyk's Evo Remediation Agent is the product example, with policies deciding what goes to human
    review. Anthropic lists automated dependency vulnerability remediation across its own code base as a
    representative project for its application security team, and an AppSec lead described a self-built CVE-fixing
    bot at BSides Las Vegas 2026.
  outcomes:
    - {lever: quality, description: "Pass rate on real dependency upgrades (all agents on Claude Sonnet 5.5)", figure: "Evo Remediation Agent 90.2%; Claude Code with Snyk scan 77.5%; Claude Code unaided 59.6%; package-manager bump with no AI 46.9%", measures: "share of 307 upgrade tasks across 43 repositories and 2,066 fixable vulnerabilities passing all gates (vulnerability removed, installs, builds, previously passing tests pass) in a clean container; Snyk's own VulnBump benchmark", provenance: vendor-published, source_ref: SNYK-VULNBUMP-2026}
    - {lever: quality, description: "Unaided agent claiming a fix that a rescan contradicted", figure: "70 of 124 failures", measures: "failures of unaided Claude Code where it said it had fixed vulnerabilities that a rescan still found", provenance: vendor-published, source_ref: SNYK-VULNBUMP-2026}
    - {lever: risk, description: "CVE count under a self-built fixing bot", figure: "0 CVEs for three months", measures: "the speaker's claim in a talk abstract; organisation and scope not named", provenance: self-reported, source_ref: BSIDESLV-2026}
  prerequisites:
    - "Projects that install, build and pass most of their tests before the change"
    - "Scanner data with recommended upgrades, to confirm the vulnerability is gone"
    - "A policy on which upgrades merge automatically and which need review"
  risks_and_guardrails:
    - "Build success was about 93% for all three agents, so removing the vulnerability, not keeping the build green, was the hard part (SNYK-VULNBUMP-2026)"
    - "GitHub warns AI fixes may suggest fabricated or unsupported dependency versions (GITHUB-APPCARD-2026)"
    - "Snyk says deterministic engines should verify proposed fixes rather than the model that wrote them (SNYK-AGENTIC-2026)"
  human_checkpoints:
    - "Teams define policies and acceptance criteria; items outside policy go to human review (SNYK-AGENTIC-2026)"
    - "The BSides speaker paired by hand with an AI assistant on flaky tests after a bot failed (BSIDESLV-2026)"
  role_evolution: >-
    The BSides speaker, an AppSec lead, took on pipeline fixes nobody else would touch and built four bots alone over
    six months (BSIDESLV-2026).
  evidence_grade: C
  sources:
    - {ref: SNYK-VULNBUMP-2026, title: "VulnBump: Can AI Agents Safely Fix Dependencies?", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/vulnbump/", date: "2026-10-15", access: full, locator: "Findings and method"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Evo Remediation Agent"}
    - {ref: ANTHROPIC-JOB-APPSEC-2026, title: "Job posting: Staff+ Application Security Engineer (first published 2025-01-22, updated 2026-08-21)", publisher: "Anthropic (Greenhouse)", type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/4502508008", date: "2026-08-21", access: full, locator: "Representative project: automated dependency vulnerability remediation"}
    - {ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talk list (Came for the AppSec scans, stayed for the flaky tests, Aldo Salas)", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026", access: full, locator: "Talk abstract, Common Ground track"}
    - {ref: GITHUB-APPCARD-2026, title: "Application card: GitHub security and quality AI features (page undated; date is retrieval date)", publisher: "GitHub Docs", type: vendor, url: "https://docs.github.com/en/code-security/code-scanning/managing-code-scanning-alerts/about-autofix-for-codeql-code-scanning", date: "2026-10-17", access: full, locator: "Dependency changes limitation"}
  last_reviewed: "2026-10-17"
  notes: >-
    The benchmark and the product belong to the same vendor. Snyk also reports from its own data that 94% of 459
    million findings over six months had a known fixed version and only about 10% had been resolved; that is a vendor
    statistic about backlog, not about the agent. GitLab's posting describes a service that turns advisories into
    dependency-update merge requests but does not say it uses AI. The BSides page shows no month, so the year alone
    is recorded. Overlaps the vulnerability-exposure research on dependency and container remediation.

- id: security-application-security-21
  title: 'Automated AI screening of untrusted inbound code: packages, agent skills and outside pull requests'
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Malicious packages reach developer machines before any pull-request scan runs; code-generating models invent
    package names, a new route for package-confusion attacks; public skill marketplaces for AI agents are being
    flooded with malicious skills that run with the user's access; and anonymous pull requests can reach privileged CI
    workflows that hold secrets.
  solution: >-
    Automated gates with AI components screen what comes in. Semgrep says it updates its malware database with
    AI-assisted, expert-verified rules within minutes of a major supply-chain incident, rescans customer repositories
    with only the new advisories and triggers organisation-wide policies; Snyk's Dependency Firewall blocks malicious
    and out-of-policy packages at install time, including when coding agents install them. ClawHub combines
    VirusTotal signature checks with an LLM-based scanner and a guard-model prompt; skills.sh integrates Gen, Socket
    and Snyk scanners; Cisco publishes an open-source multi-engine skill scanner. OpenSearch put a model in production
    as the only check between an anonymous pull request and CI pipeline secrets, according to a DEF CON 34 talk.
  outcomes:
    - {lever: speed, description: "Time from a major incident to updated malware detection", figure: "within minutes", measures: "Semgrep's statement, with no measured distribution", provenance: vendor-published, source_ref: SEMGREP-MALWARE-2026}
    - {lever: risk, description: "Independent bypass test of deployed skill scanners", figure: "all tested scanners bypassed with four purpose-built malicious skills", measures: "Trail of Bits bypassed ClawHub's detector, Cisco's skill scanner and the three scanners in skills.sh; three of the four skills took under an hour to build, the fourth a few hours", provenance: independent, source_ref: TOB-SKILLS-2026}
    - {lever: risk, description: "Researcher's bypass of OpenSearch's model gate", figure: "none published as counts; bypass succeeded", measures: "the abstract says the model caught every hidden attack, and the working bypass hid no attack because the dangerous part lived where the model could not verify it", provenance: independent, source_ref: DEFCON-34-2026}
    - {lever: risk, description: "Package names invented by code-generating models", figure: "at least 5.2% for commercial models; 21.7% for open-source models", measures: "average share of hallucinated packages across 576,000 code samples in two languages from 16 LLMs, with 205,474 unique hallucinated names (peer-reviewed)", provenance: independent, source_ref: USENIX-SEC-2025-HALLUC}
  prerequisites:
    - "Repository inventory and dependency data for rescans; package-manager integration for install-time blocking"
    - "Organisation-wide response policies (tickets, alerts, webhooks)"
    - "Curated or procedural controls on where agent skills come from"
    - "A clear view of what an AI gate can and cannot verify before it guards secrets"
  risks_and_guardrails:
    - "Static scanners give an adversary unlimited attempts to tweak an attack until it passes; curated marketplaces and out-of-band distribution can exclude malicious skills through procedural controls, public marketplaces cannot (TOB-SKILLS-2026)"
    - "A research detector reached 76% hallucination-free runs on 300 prompts, and half of flagged hallucinated names were lookalike packages already registered on PyPI (ARXIV-2608.23897)"
    - "GTIG reports adversaries tricking AI coding assistants and LLM scanners in supply-chain compromises (GTIG-AITRACKER-2026)"
    - "LLM review can be steered by crafted pull-request context (ARXIV-2603.18740) and by familiar-looking code (NDSS-FPA-2026); researchers argue for testing review pipelines adversarially before relying on them, though no organisation was found doing so"
    - "Fewer than half of 25 package managers verified lockfile integrity by default, and only 2 verified every package (TOB-PKGMGR-2026; not AI-specific)"
  human_checkpoints:
    - "An expert verifies AI-assisted malware rules before they publish (SEMGREP-MALWARE-2026)"
    - "None stated for OpenSearch's model gate (DEFCON-34-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: B
  sources:
    - {ref: SEMGREP-MALWARE-2026, title: "Introducing Malware Detection and Response Automation", publisher: "Semgrep Blog", type: vendor, url: "https://semgrep.dev/blog/2026/introducing-malware-detection-and-response-automation", date: "2026-09-24", access: full, locator: "Malware detection and response automation; malware firewall (private beta)"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Evo Dependency Firewall"}
    - {ref: TOB-SKILLS-2026, title: "The sorry state of skill distribution", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/", date: "2026-06-03", access: full, locator: "Opening and 'Bypassing ClawHub scanning'"}
    - {ref: DEFCON-34-2026, title: "DEF CON 34 main stage talks: LGTM: Bypassing an LLM Build Gate When Prompt Injection Fails (Aviv Donenfeld, Check Point Software Technologies)", publisher: "DEF CON", type: conference, url: "https://defcon.org/html/defcon-34/dc-34-speakers.html", date: "2026-08", access: full, locator: "Talk abstract (Main Track 5, Friday 13:00)"}
    - {ref: USENIX-SEC-2025-HALLUC, title: "We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs", publisher: "USENIX Security 2025 (Distinguished Paper)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity25/presentation/spracklen", date: "2025-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2608.23897, title: "Names Can Hurt: Spotting Slopsquatting Risks Caused by Package Name Hallucinations in Local Coding LLMs", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.23897", date: "2026-08-24", access: full, locator: "Abstract"}
    - {ref: GTIG-AITRACKER-2026, title: "GTIG AI Threat Tracker: From Prompting to Autonomy - The Evolution of Adversarial AI", publisher: "Google Threat Intelligence Group", type: vendor, url: "https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai/", date: "2026-09-08", access: full, locator: "AI supply-chain section (as routed by the threat-intelligence discourse file)"}
    - {ref: ARXIV-2603.18740, title: "Measuring and Exploiting Contextual Bias in LLM-Assisted Security Code Review", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.18740", date: "2026-03-19", access: full, locator: "Abstract"}
    - {ref: NDSS-FPA-2026, title: "Trust Me, I Know This Function: Hijacking LLM Static Analysis using Bias", publisher: "NDSS Symposium 2026", type: academic, url: "https://www.ndss-symposium.org/ndss-paper/trust-me-i-know-this-function-hijacking-llm-static-analysis-using-bias/", date: "2026-02", access: full, locator: "Abstract"}
    - {ref: TOB-PKGMGR-2026, title: "Package managers have an integrity problem", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/10/14/package-managers-have-an-integrity-problem/", date: "2026-10-14", access: full, locator: "Opening"}
  last_reviewed: "2026-10-17"
  notes: >-
    B because ClawHub, skills.sh and OpenSearch are named deployments, but the only outcome evidence is independent
    bypass research, not detection rates. The OpenSearch deployment is the researcher's claim in an abstract. Semgrep
    cites an estimate of 1.8 million malicious packages in Q2 2026 and Snyk cites more than 20 high-profile attacks in
    2026; both are unverified vendor figures and are not used as outcomes. Merged: malicious-package detection
    (practice), skill scanning and the LLM build gate (discourse), and two governance ideas (registry checks for
    AI-suggested dependencies and adversarial testing of AI review pipelines, each grade D). Skill and plugin scanning
    was routed here from the ai-security research. No attack detail recorded.

- id: security-application-security-22
  title: AI triage of inbound vulnerability reports for bug-bounty and product security incident response teams
  archetype: security
  module: application-security
  function: technology-it
  work_types: [transaction-processing, review-assurance, coordination-scheduling]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Programmes and maintainers receive rising volumes of reports, many low quality or AI-generated, and each needs
    reproduction before it can be fixed. Human-only triage brings slipping service levels, duplicate hunting across
    tools and severity decided by intuition. Product security incident response teams (PSIRTs) also face new EU
    reporting duties, and 85% of APAC PSIRTs have fewer than five members (FIRST session abstract).
  solution: >-
    Anthropic's application security team says Claude performs first-line bug-bounty triage and drafting while
    engineers handle escalations and corner cases. GM's Auto-Triage sits on top of HackerOne and Slack and combines
    scope and asset mapping, multi-signal duplicate detection, safe automated reproduction in sandboxes and a
    multi-agent 'severity meeting'. A three-year FIRST conference series moved from a PSIRT vision with generative AI
    (2025) to multi-agent systems automating complex PSIRT workflows with human oversight for critical decisions
    (2026). Coinbase's posting asks for AI-driven automation of triage, validation and remediation for its bug-bounty
    pipeline, and open-source maintainers in GitHub's Secure Open Source Fund explored Copilot for vulnerability triage.
  outcomes:
    - {lever: capacity, description: "Effect of AI triage", figure: "none published", measures: "the postings and abstracts state intended or current practice without measured results", provenance: self-reported, source_ref: ANTHROPIC-JOB-APPSEC-2026}
  prerequisites:
    - "A programme with defined scope and severity, and a tracker"
    - "Engineers on an escalation rota"
    - "Sandboxed reproduction environments for reports"
    - "A PSIRT process with defined decision points"
  risks_and_guardrails:
    - "GitHub's private vulnerability reports rose from about 550 a week in January to over 3,000 a week for most of May 2026 (GITHUB-ADVDB-2026)"
    - "The Linux Foundation says maintainers face a higher velocity of security reports, many AI-generated, and OpenAI says maintainers want fewer low-quality reports and false positives, not more (LF-GLASSWING-2026; OPENAI-CODEXSEC-2026)"
    - "Anthropic, citing the Firefox team, urges researchers who use LLM tools to include evidence of verification and reproducibility with each report (ANTHROPIC-FIREFOX-2026)"
    - "The FIRST abstract reports a tension between precision and scale in early implementations; the session was TLP:AMBER (shared with attendees only), so details are not public (FIRST-CON-2026)"
    - "EU Cyber Resilience Act reporting of actively exploited vulnerabilities applies from 2026-09-11: early warning within 24 hours, notification within 72 hours, final report within 14 days after a corrective measure, through ENISA's Single Reporting Platform (EC-CRA-REPORTING-2026)"
  human_checkpoints:
    - "Engineers handle escalations and corner cases (ANTHROPIC-JOB-APPSEC-2026)"
    - "Human insight is kept for critical PSIRT decisions (FIRST-CON-2026)"
    - "Humans oversee generative AI output (COINBASE-JOB-PSE-2026)"
  role_evolution: >-
    Anthropic's posting says automation handles routine triage and root-cause work while engineers handle escalations
    (ANTHROPIC-JOB-APPSEC-2026). The FIRST abstract says agentic AI can amplify small PSIRT teams only when guided
    adequately by human expertise (FIRST-CON-2026).
  evidence_grade: B
  sources:
    - {ref: ANTHROPIC-JOB-APPSEC-2026, title: "Job posting: Staff+ Application Security Engineer (first published 2025-01-22, updated 2026-08-21)", publisher: "Anthropic (Greenhouse)", type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/4502508008", date: "2026-08-21", access: full, locator: "About the role; Key responsibilities"}
    - {ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talk list (Five AIs Walk Into a Severity Meeting: Auto-Triage and the Evolution of GM's Bug Bounty)", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026", access: full, locator: "Talk abstract, Common Ground track"}
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program (Denver, 2026-06-14 to 2026-06-19): PSIRT 2.0 in Action: Implementing Agentic AI Architecture for Autonomous Operations", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06-18", access: full, locator: "Session abstract (GMO Cybersecurity by IERAE, Ken Associates)"}
    - {ref: COINBASE-JOB-PSE-2026, title: "Job posting: Product Security Engineer (Offensive Security, Application Security team)", publisher: "Coinbase (Greenhouse)", type: job-posting, url: "https://www.coinbase.com/careers/positions/8165389?gh_jid=8165389", date: "2026-08-28", access: full, locator: "Responsibilities: AI-driven automation for vulnerability triage, validation and remediation"}
