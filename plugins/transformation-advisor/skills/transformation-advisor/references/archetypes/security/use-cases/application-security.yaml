    - {ref: ANTHROPIC-OSSSCAN-2026, title: "OSS Scanner", publisher: "Anthropic Frontier Red Team (red.anthropic.com)", type: vendor, url: "https://red.anthropic.com/oss-scanner", date: "2026-10", access: full, locator: "Fast-track without human review"}
    - {ref: ANTHROPIC-GLASSWING-2026, title: "Project Glasswing: Securing critical software for the AI era", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/glasswing", date: "2026-04-07", access: full, locator: "Launch partners and claims (page updated 2026-10-06)"}
