  last_reviewed: "2026-10-17"
  notes: >-
    Grade A rests on two measured sources: Cloudflare's telemetry (security is one of seven reviewers, so most
    figures cover code review broadly; the post says the security reviewer flags the highest proportion of critical
    findings, 4%) and the security-specific AgenticSCR shadow deployment (study setting Atlassian per the abstract;
    author affiliations not checked). No accuracy figure against human reviewers is published. The 3% to 61% figures
    are quoted by Semgrep and were not read in the 2022 paper's body. Merged from the practice, discourse and
    governance angles: agentic PR review, Cloudflare code review, maintainers' review bots and the separate AI
    reviewer pass over AI-generated code.

- id: security-application-security-05
  title: Engineering standards rewritten as machine-readable rules that review agents enforce
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Standards live in documents, chat threads and individual memory; no engineer can read every standard and
    reviewers cannot reliably check every requirement (Cloudflare).
  solution: >-
    Cloudflare rebuilt its engineering standards as a governed 'Codex' of RFC-format documents with MUST and SHOULD
    statements, which an agent extracts into structured rules with stable identifiers. Review agents for code,
    specifications and incident reports retrieve the statements; findings from approved RFCs are advisory and only
    RFCs promoted to 'enforced' block merges. Rules that can be checked mechanically also ship as linter packages and
    a local command-line tool.
  outcomes:
    - {lever: quality, description: "Standards violations flagged by the AI code reviewer since the Codex began earlier in 2026", figure: "close to 230,000 flagged; almost 16,000 withheld approval", measures: "violations flagged over about four months (the introduction says 'nearly a quarter of a million'); the almost 16,000 referred to MUST statements on enforced RFCs and caused approval to be withheld", provenance: self-reported, source_ref: CLOUDFLARE-CODEX-2026}
    - {lever: capacity, description: "Design reviews before implementation", figure: "close to 600 unique specs; over 3,200 review invocations since May 2026", measures: "unique open specs reviewed by the spec reviewer; findings rated major 65%, minor 29%, critical 6%", provenance: self-reported, source_ref: CLOUDFLARE-CODEX-2026}
  prerequisites:
    - "A governed standards body with domain owners and an RFC process"
    - "A promotion step from approved to enforced so teams can adapt"
  risks_and_guardrails:
    - "A large corpus would strain context windows, so statements are extracted and compacted rather than fed whole (CLOUDFLARE-CODEX-2026)"
    - "Blocking only after explicit promotion of an RFC to enforced (CLOUDFLARE-CODEX-2026)"
  human_checkpoints:
    - "Domain owners approve and promote RFCs; engineers act on findings (CLOUDFLARE-CODEX-2026)"
  role_evolution: >-
    The post says engineers focus their time and judgement on the resulting findings (CLOUDFLARE-CODEX-2026,
    introduction).
  evidence_grade: B
  sources:
    - {ref: CLOUDFLARE-CODEX-2026, title: "How Cloudflare enforces engineering standards using AI", publisher: "Cloudflare Blog", type: firm, url: "https://blog.cloudflare.com/engineering-standards-enforcement/", date: "2026-08-04", access: full, locator: "Introduction; 'AI code reviewer' and 'Spec reviewer' sections"}
    - {ref: TLDRSEC-346-2026, title: "[tl;dr sec] #346 - Can AI Do Novel Security Research?", publisher: "tl;dr sec (Clint Gibler)", type: press, url: "https://tldrsec.com/p/tldr-sec-346", date: "2026-09-17", access: full, locator: "AppSec section, Cloudflare item"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade capped at B: the Codex covers engineering standards of all kinds (security is one domain), so the
    measurement is adjacent to security. The incident report reviewer in the same post is in incident-response
    (security-incident-response-16 uses the same source).

- id: security-application-security-06
  title: Risk-tiered automated review that lands low-risk code changes without a human reviewer
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    AI coding agents increase code volume faster than reviewers can read it. At Meta, significant lines of code per
    human-landed diff grew 105.9% year over year, with agentic AI responsible for over 80% of that growth, while the
    share of diffs getting timely review fell.
  solution: >-
    Meta's RADAR (Risk Aware Diff Auto Review) classifies each diff by authorship and source type, applies
    eligibility gates and static heuristics, scores it with a machine-learned Diff Risk Score, runs LLM-based
    automated code review and then deterministic validation before landing qualifying changes.
  outcomes:
    - {lever: capacity, description: "Volume handled by the funnel", figure: "535K+ diffs reviewed; 331K+ landed", measures: "diffs reviewed and landed by RADAR, per the authors' telemetry (period not stated in the abstract)", provenance: self-reported, source_ref: ARXIV-2605.30208}
    - {lever: quality, description: "Revert and production incident rates of RADAR-reviewed diffs relative to non-RADAR diffs", figure: "revert rate one third; production incident rate one fiftieth", measures: "observational comparison; RADAR only lands diffs that pass its eligibility and risk gates, and the abstract does not say the groups were matched for risk", provenance: self-reported, source_ref: ARXIV-2605.30208}
    - {lever: speed, description: "Review latency", figure: "median diff review wall time down 35%; median time to close reduced 'by over 330%' as worded", measures: "difference-in-differences estimates, wording as in the abstract", provenance: self-reported, source_ref: ARXIV-2605.30208}
    - {lever: capacity, description: "Approval yield when the risk threshold is relaxed", figure: "60.31% approve rate", measures: "approve rate after relaxing the Diff Risk Score threshold from the 25th to the 50th percentile", provenance: self-reported, source_ref: ARXIV-2605.30208}
  prerequisites:
    - "A trained diff risk model and eligibility rules"
    - "Telemetry on reverts and production incidents to calibrate the threshold"
    - "Deterministic validation steps before landing"
  risks_and_guardrails:
    - "The threshold trades automation yield against safety, the paper's second research question (ARXIV-2605.30208)"
    - "The measured safety outcomes are reverts and production incidents, not security defects"
    - "LLM-based review can be steered by crafted pull-request context (ARXIV-2603.18740)"
    - "At another AI-forward company, per-reviewer load roughly doubled while automated review overtook human review and merge and revert rates held steady (ARXIV-2607.01904, abstract)"
  human_checkpoints:
    - "Diffs that fail the eligibility, risk-score or validation gates stay on the normal human review path (ARXIV-2605.30208); the abstract does not describe sampling of auto-landed diffs"
  role_evolution: >-
    The authors frame the problem as a gap between code supply and reviewer bandwidth; the abstract does not describe
    role changes (ARXIV-2605.30208).
  evidence_grade: B
  sources:
    - {ref: ARXIV-2605.30208, title: "Automating Low-Risk Code Review at Meta: RADAR, Risk Calibration, and Review Efficiency", publisher: "arXiv (Meta authors)", type: academic, url: "https://arxiv.org/abs/2605.30208", date: "2026-05-28", access: full, locator: "Abstract (v2 revised 2026-06-12)"}
    - {ref: ARXIV-2607.01904, title: "AI Writes Faster Than Humans Can Review: A Longitudinal Study of an Enterprise 2x Mandate", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.01904", date: "2026-07-02", access: full, locator: "Abstract"}
    - {ref: ARXIV-2603.18740, title: "Measuring and Exploiting Contextual Bias in LLM-Assisted Security Code Review", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.18740", date: "2026-03-19", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade capped at B: general code review with revert and incident outcomes, not security-specific review. Only the
    arXiv abstract was read. Merged from all three angles.

- id: security-application-security-07
  title: Pre-submit agentic security scanning of every code change, with a reachability-proving triage agent
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    One-off security scans of large code bases are slow and short on context, so vulnerabilities are found late,
    while AI is increasing the amount of code that needs securing. Checking every finding for exploitability burns
    reviewer time.
  solution: >-
    Google's AI Infrastructure team checks each code check-in with AI agents inside tools developers already use. A
    multi-agent review harness (Mantis, open source) is paired with localized threat models built from live code base
    metadata and a cross-package call graph. A specialised triage agent validates the quick scan's findings using
    abstract syntax tree (AST) parsing, call-graph traversal and pre-indexed safety rules to test whether the
    vulnerable path is reachable. A nightly post-submit scan is a second layer. A bug-fix agent drafts fixes for
    human review inside the original change request (see -12).
  outcomes:
    - {lever: quality, description: "Triage agent precision and turnaround", figure: "over 92% precision; under one minute", measures: "precision of the triage agent's reachability verdicts as stated by Google; numerator, denominator and sample are not given; time is the agent's completion time", provenance: self-reported, source_ref: GOOGLE-AGENTICSCAN-2026}
    - {lever: quality, description: "False-positive rate with localized threat models", figure: "3% 'in some cases'", measures: "false-positive rate of the scanning agents in some cases, as stated; no denominator, baseline or number of cases", provenance: self-reported, source_ref: GOOGLE-AGENTICSCAN-2026}
    - {lever: risk, description: "Vulnerabilities stopped before they reach the code base or production", figure: "hundreds per month", measures: "Google's statement; no exact count, baseline or severity split", provenance: self-reported, source_ref: GOOGLE-AGENTICSCAN-2026}
  prerequisites:
    - "Threat models kept current as live code base metadata"
    - "Call-graph and AST tooling across packages and libraries, and pre-indexed safety rules"
    - "A low-latency pre-submit hook in developer tooling"
    - "Separate harnesses, rules and context for the development, scanning and triage agents (the post's own advice)"
  risks_and_guardrails:
    - "Google advises keeping development, scanning and triage systems separate to prevent bias, and pairing lightweight AI scans with deterministic structural validation (GOOGLE-AGENTICSCAN-2026, 'Learnings and call to action')"
    - "Precision is stated without recall, so missed findings are unknown"
    - "Pull-request framing can bias LLM security judgements (ARXIV-2603.18740)"
    - "No independent measurement of the figures was found"
  human_checkpoints:
    - "Proposed fixes go to human review as part of the change request (GOOGLE-AGENTICSCAN-2026, 'Bug fix agents close the loop'); no human checkpoint is stated for triage verdicts"
  role_evolution: >-
    Developers receive scan results and agent-proposed fixes inside their normal change review
    (GOOGLE-AGENTICSCAN-2026). A Google Cloud talk abstract says the team rebuilt its security engineering function
    around collaborative secure development, starting with Mantis (UNPROMPTED-2026, talk not yet delivered).
  evidence_grade: A
  sources:
    - {ref: GOOGLE-AGENTICSCAN-2026, title: "Changing the game: Using agentic AI to secure infrastructure code (page title: Using AI agents to secure Google infrastructure)", publisher: "Google Cloud Blog (Google AI Infrastructure team)", type: firm, url: "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/", date: "2026-09-19", access: full, locator: "Sections: Pervasive pre-submit agentic scanning; The importance of localized threat models; Specialized triage agents; Bug fix agents; Learnings"}
    - {ref: UNPROMPTED-2026, title: "[un]prompted 2026 agenda (conference 2026-10-27 to 2026-10-29, San Francisco; abstracts of upcoming talks)", publisher: "[un]prompted (AI security practitioner conference)", type: conference, url: "https://unpromptedcon.org/agenda-10-2026/", date: "2026-10-06", access: full, locator: "Session: Secure Product Development With Mantis (Nick Galloway, Ruchi Shah, Google Cloud)"}
    - {ref: ARXIV-2603.18740, title: "Measuring and Exploiting Contextual Bias in LLM-Assisted Security Code Review", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.18740", date: "2026-03-19", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    In-house case study; all figures are Google's own and are bounded ('in some cases') or unbounded ('hundreds').
    Graded A on the stated precision metric from a named deployment; treat it as self-reported. Merged from all three
    angles, including the governance angle's separate triage-agent entry. The vulnerability-exposure synthesis dropped
    its copy and names this module as the home for this deployment.

- id: security-application-security-08
  title: Reasoning-based AI code scanning alongside rule-based static analysis
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Rule-based static analysis (SAST) finds only what someone wrote a rule for, misses business-logic and
    access-control flaws, and creates noise that teams spend time triaging. Authorization flaws are hard for
    scanners because a valid session, a well-formed request and a success response look like a pass. LLM runs are
    non-deterministic, so one general prompt can miss whole vulnerability classes.
  solution: >-
    Agentic scanners read the repository, build a project-specific threat model the team can edit, search for
    vulnerabilities, test findings in a sandbox where possible and propose a fix; nothing is applied without human
    approval. OpenAI's Codex Security (formerly Aardvark), Anthropic's Claude Code Security, Wiz AI SAST, Semgrep
    Agentic Workflows and Snyk's Code Scanning Agent follow this pattern. AISLE argues the harness (scan, detect,
    triage, patch) matters more than the model. A GitHub Security Lab researcher wrote open-source agent 'taskflows'
    that make the model check a fixed list of mobile vulnerability classes for each entry point, combined with a
    broad prompt over repeated runs, with results stored for the researcher to review before reporting.
  outcomes:
    - {lever: quality, description: "Android application vulnerabilities found with the taskflows and reported", figure: "24", measures: "vulnerabilities in Android applications reported by one GitHub Security Lab researcher using the taskflows (the post's text also says 'more than 20')", provenance: self-reported, source_ref: GITHUB-ANDROID-2026}
    - {lever: quality, description: "Noise reduction during OpenAI's beta", figure: "84% less noise in one case; over-reported severity down over 90%; false-positive rate down over 50% across repositories", measures: "changes since initial rollout on the same repositories in OpenAI's beta cohort; no baselines or sample sizes stated", provenance: vendor-published, source_ref: OPENAI-CODEXSEC-2026}
    - {lever: capacity, description: "Beta scanning volume", figure: "1.2 million commits in 30 days; 792 critical and 10,561 high-severity findings", measures: "external beta repositories over the 30 days before the post; critical findings appeared in under 0.1% of commits", provenance: vendor-published, source_ref: OPENAI-CODEXSEC-2026}
    - {lever: quality, description: "AI analysers versus SAST on AISLE's benchmark", figure: "best AI analyser 68%; best SAST tool (Snyk Code) 12.1%", measures: "share of 95 public CVEs (all found by AISLE) recovered with code path, root cause, attack condition and impact; the AI figure accumulates findings over four runs", provenance: vendor-published, source_ref: AISLE-SAST-2026}
    - {lever: quality, description: "Authorization-flaw (IDOR) detection on Semgrep's benchmark", figure: "Mythos precision 80.0%, recall 13.9% (20 of 144 true positives); an open-weight model beat it on both at USD 4.29 a run", measures: "275 human-reviewed IDOR labels across four codebases, 144 true positives, graded by an LLM judge with deterministic tooling; 23 configurations compared", provenance: vendor-published, source_ref: SEMGREP-IDOR-2026}
  prerequisites:
    - "A buildable project environment for sandbox testing"
    - "A reviewed threat model, and security-team time to adjust finding criticality, which OpenAI's tool uses as feedback"
    - "Token budget: a GitHub taskflow run takes an hour or two on a medium-sized repository and can consume many tokens"
    - "For authorization flaws, the product's role and tenancy model"
  risks_and_guardrails:
    - "Each vendor says a human approves patches (ANTHROPIC-CCS-2026; OPENAI-CODEXSEC-2026)"
    - "An AISLE talk abstract reports that an LLM scanner can miss a real bug on one run and find it on the next, across 25,000 trials on 50 models; repeated passes and diverse cheaper models helped (UNPROMPTED-2026)"
    - "Single model calls missed CVEs in AISLE's study, which is why findings were accumulated over four runs (AISLE-SAST-2026)"
    - "Semgrep notes that newer models are not reliably better at finding IDORs (SEMGREP-IDOR-2026)"
    - "Familiar-pattern attacks on LLM static analysis transfer across OpenAI, Anthropic and Google models and remain effective when models are warned (NDSS-FPA-2026, abstract)"
    - "Memorised benchmarks can inflate results (see -16); Semgrep's design partners are unnamed (SEMGREP-AGENTICWF-2026)"
  human_checkpoints:
    - "An analyst or developer reviews validated findings and approves patches (ANTHROPIC-CCS-2026; OPENAI-CODEXSEC-2026)"
    - "The researcher reviews the stored results and reports only confirmed vulnerabilities (GITHUB-ANDROID-2026)"
  role_evolution: >-
    Anthropic says developers always make the call on patches, and Snyk says teams focus on setting policy and owning
    decisions while agents do program work (ANTHROPIC-CCS-2026; SNYK-AGENTIC-2026). GitHub says its framework lets
    researchers automate, package and share the prompts and workflows that work for them (GITHUB-ANDROID-2026).
  evidence_grade: A
  sources:
    - {ref: GITHUB-ANDROID-2026, title: "How we found 24 Android vulnerabilities using our open source AI security agent", publisher: "GitHub Blog", type: vendor, url: "https://github.blog/security/how-we-found-24-android-vulnerabilities-using-our-open-source-ai-security-agent/", date: "2026-09-28", access: full, locator: "Sections: intro; taskflow changes; results"}
    - {ref: OPENAI-CODEXSEC-2026, title: "Codex Security: now in research preview", publisher: "OpenAI", type: vendor, url: "https://openai.com/index/codex-security-now-in-research-preview/", date: "2026-03-06", access: full, locator: "Intro; How it works; named early users NETGEAR and vLLM; scan statistics"}
    - {ref: OPENAI-AARDVARK-2025, title: "Introducing Aardvark: OpenAI's agentic security researcher (page updated 2026-03-06 to say Aardvark is now Codex Security)", publisher: "OpenAI", type: vendor, url: "https://openai.com/index/introducing-aardvark/", date: "2025-10-30", access: full, locator: "Benchmark testing on golden repositories"}
    - {ref: ANTHROPIC-CCS-2026, title: "Making frontier cybersecurity capabilities available to defenders (Claude Code Security)", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/claude-code-security", date: "2026-02-20", access: full, locator: "Limited research preview; multi-stage verification; human approval"}
    - {ref: WIZ-AISAST-2026, title: "Wiz AI SAST: AI Code Security With Code-to-Cloud Context", publisher: "Wiz Blog", type: vendor, url: "https://www.wiz.io/blog/introducing-wiz-ai-sast", date: "2026-10-06", access: full, locator: "Public preview announcement"}
    - {ref: SEMGREP-AGENTICWF-2026, title: "Introducing Semgrep Agentic Workflows: Automate Deep Vulnerability Hunting at Scale (date from the Semgrep blog listing)", publisher: "Semgrep Blog", type: vendor, url: "https://semgrep.dev/blog/2026/introducing-semgrep-agentic-workflows-automate-deep-vulnerability-hunting-at-scale", date: "2026-07-28", access: full, locator: "Nine agentic workflows in public beta; design partner feedback; benchmark claim"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Evo Code Scanning Agent and Security Review Agent"}
    - {ref: UNPROMPTED-2026, title: "[un]prompted 2026 agenda (conference 2026-10-27 to 2026-10-29, San Francisco; abstracts of upcoming talks)", publisher: "[un]prompted (AI security practitioner conference)", type: conference, url: "https://unpromptedcon.org/agenda-10-2026/", date: "2026-10-06", access: full, locator: "Session: The Scanner Said Clean. We Ran It Again (Petr Simecek, AISLE)"}
    - {ref: AISLE-SAST-2026, title: "AI Code Analysis Beats SAST. Here's the Evidence", publisher: "AISLE (Ondrej Vlcek)", type: vendor, url: "https://aisle.com/blog/attackers-are-using-ai-to-find-vulnerabilities-in-your-code-your-sast-was-never-even-looking-for-them", date: "2026-08-12", access: full, locator: "Sections 'What Legacy Pattern Matching Tools Miss' and 'Signal-to-Noise'"}
    - {ref: SEMGREP-IDOR-2026, title: "Mythos Benchmarked Against 22 Configs on 275 IDORs", publisher: "Semgrep", type: vendor, url: "https://semgrep.dev/blog/2026/mythos-idor-benchmark", date: "2026-08-25", access: full, locator: "Results under 'How does Mythos stack up?'"}
    - {ref: NDSS-FPA-2026, title: "Trust Me, I Know This Function: Hijacking LLM Static Analysis using Bias", publisher: "NDSS Symposium 2026", type: academic, url: "https://www.ndss-symposium.org/ndss-paper/trust-me-i-know-this-function-hijacking-llm-static-analysis-using-bias/", date: "2026-02", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade A rests only on GitHub Security Lab's count of 24 reported vulnerabilities (one researcher, no
    false-positive rate). Every product figure is vendor-published; OpenAI names early users NETGEAR and vLLM but
    reports cohort-wide figures. AISLE's benchmark uses CVEs it discovered; Semgrep sells an approach its benchmark
    favours. Also published: Aardvark 92% recall on OpenAI's 'golden' test repositories (OPENAI-AARDVARK-2025) and
    Semgrep's claim of 3.5 times more true positives at 19% lower cost per true positive than a model alone
    (SEMGREP-AGENTICWF-2026), both vendor-published. Wiz AI SAST's code-to-cloud correlation is routed to
    cloud-infrastructure. Merged: reasoning-based scanning (practice), LLM analysis versus SAST and IDOR detection
    (discourse), and the GitHub Android taskflows (practice).

- id: security-application-security-09
  title: Reachability-first triage and closure tracking for AI-generated vulnerability candidates
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    AI-assisted programmes generate more vulnerability candidates and patch pull requests than engineering teams can
    review, so an opened pull request is not a fixed bug. Static-analysis false positives require costly manual triage.
  solution: >-
    Rubrik's product security lead describes an operating loop that moves each verified finding to merge, rejection,
    deferral or formal risk acceptance, using root-cause de-duplication, reachability-first ranking, typed refutation
    reasons, explicit ownership, detector replay, and a refusal to auto-patch bug classes that cannot be validated
    cheaply. Opened, reviewed and fixed are kept as separate states. OpenAI's Codex Security documentation offers a
    task to triage an existing backlog from another scanner or issue tracker, and Google's triage agent proves
    reachability before a finding reaches a developer (see -07).
  outcomes:
    - {lever: quality, description: "Operating-loop results", figure: "none published", measures: "the abstract lists the loop's components but no measured results", provenance: self-reported, source_ref: UNPROMPTED-2026}
  prerequisites:
    - "A closure-state schema that separates opened, reviewed and fixed"
    - "Ownership data per finding"
    - "Detectors that can be replayed to check a fix"
  risks_and_guardrails:
    - "The abstract says a passing build does not prove the vulnerable path is gone and that pull-request volume can hide the review bottleneck (UNPROMPTED-2026, Rubrik session)"
    - "Anthropic says a high- or critical-severity bug found in its programme takes on average two weeks to patch (ANTHROPIC-GLASSWINGUPDATE-2026)"
    - "Anthropic says verifying, prioritising and fixing remain the challenge (ANTHROPIC-CYBERMISSION-2026)"
  human_checkpoints:
    - "Engineers review before merge; an accountable owner signs formal risk acceptance (UNPROMPTED-2026, Rubrik session)"
  role_evolution: >-
    The abstract says that once discovery is cheap, review and closure are the scarce resource (UNPROMPTED-2026,
    Rubrik session).
  evidence_grade: B
  sources:
    - {ref: UNPROMPTED-2026, title: "[un]prompted 2026 agenda (conference 2026-10-27 to 2026-10-29, San Francisco; abstracts of upcoming talks)", publisher: "[un]prompted (AI security practitioner conference)", type: conference, url: "https://unpromptedcon.org/agenda-10-2026/", date: "2026-10-06", access: full, locator: "Session: Opened Is Not Fixed (Shayaun Nejad, Rubrik)"}
    - {ref: ARXIV-2601.02941, title: "SastBench: A Benchmark for Testing Agentic SAST Triage", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2601.02941", date: "2026-01-06", access: full, locator: "Abstract: SAST false positives require costly manual triage"}
    - {ref: OPENAI-CODEXDOCS-2026, title: "Codex Security (product documentation; page undated, date is retrieval date)", publisher: "OpenAI Developers", type: vendor, url: "https://developers.openai.com/codex/security", date: "2026-10-17", access: full, locator: "Task: triage a backlog"}
    - {ref: GOOGLE-AGENTICSCAN-2026, title: "Changing the game: Using agentic AI to secure infrastructure code (page title: Using AI agents to secure Google infrastructure)", publisher: "Google Cloud Blog (Google AI Infrastructure team)", type: firm, url: "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/", date: "2026-09-19", access: full, locator: "Specialized triage agents"}
    - {ref: ANTHROPIC-GLASSWINGUPDATE-2026, title: "Project Glasswing: An initial update", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/research/glasswing-initial-update", date: "2026-05-22", access: full, locator: "Section 'Open-source software'"}
    - {ref: ANTHROPIC-CYBERMISSION-2026, title: "Introducing the Anthropic Cyber Mission", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/anthropic-cyber-mission", date: "2026-10-08", access: full, locator: "Verifying, prioritizing and fixing remain the challenge"}
  last_reviewed: "2026-10-17"
  notes: >-
    Abstract of a talk not yet delivered, so no measurements. SastBench was read at abstract level only. Programme-
    level validation of AI-found findings and standing 'VulnOps' workflows are in security-vulnerability-exposure-06
    and security-vulnerability-exposure-11; this entry keeps the engineering team's closure loop. An ICSE 2026
    industry paper on LLM filtering of static-analysis false positives was seen only in search results; its figures
    are unverified and not used.

- id: security-application-security-10
  title: Validator-gated agentic testing of an organisation's own running web applications
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    LLM code scanners flood security teams with unverified hypotheses ('AI slop'), so a real flaw is hard to tell from
    a convincing hallucination, and code-reading scanners report candidates without proof that they can be exploited
    or chained.
  solution: >-
    Google's product security team runs PageBreak, an internal agent that hypothesises web flaws in Google's own
    applications and passes each hypothesis to a validator that is not written by AI and that confirms the flaw
    against a running environment with a deterministic signal. Findings that cannot be confirmed are kept as seeds for
    later scans and for building new validators; they are not sent to product teams. The agent is run repeatedly with
    identical seeds to raise the chance of finding the path. Snyk describes the same idea as a product: continuous
    offensive testing of a running application to prove exploit chains rather than list findings. Vendor
    autonomous-pentest agents run against external targets (AWS Security Agent, XBOW) are covered in
    security-vulnerability-exposure-17 and security-vulnerability-exposure-18.
  outcomes:
    - {lever: quality, description: "Cross-site scripting (XSS) flaws found by PageBreak in Google's first-party web applications since a November 2025 pilot (full project from January 2026)", figure: "over 500", measures: "XSS vulnerabilities, each confirmed by a deterministic validator; severity and application names not given", provenance: self-reported, source_ref: GOOGLE-PAGEBREAK-2026}
    - {lever: risk, description: "XSS found in applications built on Google's high-assurance web framework", figure: "2 across hundreds of applications as of 2026-09-04", measures: "XSS found by the scanner in framework-based applications; both were in internal applications or debug endpoints with hardening gaps", provenance: self-reported, source_ref: GOOGLE-PAGEBREAK-2026}
    - {lever: quality, description: "Snyk's dynamic tester versus a code-only scan on a deliberately vulnerable app", figure: "10 of 15 exploit chains confirmed; severity-weighted detection 75.7% versus 49.6%", measures: "points found out of 938 against a fixed answer key (57 vulnerabilities, 15 chains); a dynamic tester against a white-box code scanner, so not like for like", provenance: vendor-published, source_ref: SNYK-CHAINS-2026}
  prerequisites:
    - "Running test environments the validators can attack, and validators written per vulnerability class and attack surface"
    - "Google credits a mono-repo, live HTTP traffic mapped to source lines and an existing authenticated scanner for PageBreak's effectiveness"
  risks_and_guardrails:
    - "Validators are not written by the AI; Google says they do not yet cover all vulnerability types, so false negatives are possible (GOOGLE-PAGEBREAK-2026, 'Internal Feedback Loop')"
    - "Models can wander into unproductive paths, so agents run with identical seeds across many iterations (GOOGLE-PAGEBREAK-2026, 'The present and the future')"
    - "Agents that exploit live targets can take them down; AWS's agent did so in both of its benchmark misses (AWS-SECAGENT-2026; see security-vulnerability-exposure-17)"
  human_checkpoints:
    - "Only deterministically validated findings go to product teams; unverified candidates are withheld (GOOGLE-PAGEBREAK-2026)"
  role_evolution: >-
    Not described beyond product security staff building validators and agent tooling (GOOGLE-PAGEBREAK-2026).
  evidence_grade: A
  sources:
    - {ref: GOOGLE-PAGEBREAK-2026, title: "Agentic Hacks, Real Proofs: Inside Google's PageBreak Project", publisher: "Google (Michal Bentkowski, Information Security Engineer)", type: firm, url: "https://blog.google/security/agentic-hacks-real-proofs-inside-googles-pagebreak-project/", date: "2026-09-24", access: full, locator: "Sections 'Security landscape in 2026', 'How Agent Validators Work', 'PageBreak vs a High-Assurance Framework'"}
    - {ref: TLDRSEC-348-2026, title: "[tl;dr sec] #348 - Google's PageBreak Scanner, Perplexity's Agent Security Tool, Defending Agentically", publisher: "tl;dr sec (Clint Gibler)", type: press, url: "https://tldrsec.com/p/tldr-sec-348", date: "2026-10-01", access: full, locator: "AppSec section, PageBreak item"}
    - {ref: SNYK-CHAINS-2026, title: "Finding Vulnerabilities Isn't Proving Exploit Chains", publisher: "Snyk", type: vendor, url: "https://snyk.io/blog/frontier-models-vulnerabilities-attacker-chains/", date: "2026-10-07", access: full, locator: "'The results' table"}
    - {ref: AWS-SECAGENT-2026, title: "AWS Security Agent (now part of AWS Continuum) exploited 33 of 37 new real-world CVEs", publisher: "AWS Security Blog", type: vendor, url: "https://aws.amazon.com/blogs/security/aws-security-agent-now-part-of-aws-continuum-exploited-33-of-37-new-real-world-cves/", date: "2026-10-15", access: full, locator: "Misses and non-destructive guardrails"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade A rests on Google's PageBreak counts (self-reported); Google calls the false-positive rate 'near zero' but
    publishes no number. Pattern 'other': an agent hypothesis checked by a deterministic, non-AI validator before any
    human sees it. Search-only press coverage of PageBreak (no application names, a plan to connect it to CodeMender)
    is not relied on. The research angles merged PageBreak with AWS Security Agent, XBOW and a PortSwigger research
    system; those parts are left to vulnerability-exposure (17, 18) and the module's frontier notes. No exploit
    detail recorded.

- id: security-application-security-11
  title: Agents build bespoke analysis tooling and formal models before a manual security audit
  archetype: security
  module: application-security
  function: service-delivery
  work_types: [software-systems, review-assurance]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Reviewing code in a new virtual machine with a custom assembly language and almost no developer tooling is slow,
    and manual review alone may miss classes of bugs.
  solution: >-
    Before reviewing the Miden zero-knowledge virtual machine, Trail of Bits spent six months having agents build a
    language server and VS Code extension, a decompiler, a static analysis engine and a Lean model (a machine-checkable
    formal model) of the VM executor, then used those tools in manual and agent-driven review. One AI model planned
    and developed while another reviewed code.
  outcomes:
    - {lever: quality, description: "Machine-checked correctness proofs", figure: "95", measures: "proofs produced from the agent-built Lean model, covering a large component of the Miden core library", provenance: self-reported, source_ref: TOB-MIDEN-2026}
    - {lever: quality, description: "Analysis findings during the audit", figure: "over 400 unique locations where type validation could be improved; one high-severity issue", measures: "unique locations reachable from the core library's public API flagged by the analysis passes (locations, not distinct bugs); the high-severity issue involved an unvalidated prover-supplied value", provenance: self-reported, source_ref: TOB-MIDEN-2026}
  prerequisites:
    - "Months of lead time before the audit"
    - "Engineers who can specify and verify the tools agents build"
    - "Client scope that allows the work"
  risks_and_guardrails:
    - "The decompiler was restricted to a subset that can be decompiled correctly and compared at random against originals for regressions (TOB-MIDEN-2026)"
    - "The post is the firm's own account; no independent verification of the proofs or findings was read"
  human_checkpoints:
    - "Auditors use and check the tools during the manual review (TOB-MIDEN-2026)"
  role_evolution: >-
    The post describes agents extending what reviewers can do before code review begins, not only agentic code review
    (TOB-MIDEN-2026). The firm says its security expertise compounds as code: each engagement's skills and workflows
    make the next one faster (TOB-AINATIVE-2026).
  evidence_grade: A
  sources:
    - {ref: TOB-MIDEN-2026, title: "Auditing in the age of (good enough) AI", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/09/18/auditing-in-the-age-of-good-enough-ai/", date: "2026-09-18", access: full, locator: "Introduction; 'Building all the tools!'; 'Finding all the bugs!'"}
    - {ref: TOB-AINATIVE-2026, title: "How we made Trail of Bits AI-native (so far)", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/03/31/how-we-made-trail-of-bits-ai-native-so-far/", date: "2026-03-31", access: full, locator: "AI-native definition"}
  last_reviewed: "2026-10-17"
  notes: >-
    Client named in the post (Miden). Pattern 'other': agents build the review workbench, not only review code. Merged
    from practice and discourse; security-vulnerability-exposure-19 cross-references this entry.

- id: security-application-security-12
  title: AI-drafted fixes for scanner alerts and critical vulnerabilities, delivered as reviewable changes
  archetype: security
  module: application-security
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    GitHub says developers often have little secure-coding training, so fixing code-scanning alerts takes substantial
    effort; Snyk says its data as of October 2026 showed roughly eight new vulnerabilities introduced for every one
    remediated. Finding vulnerabilities is only half the work.
  solution: >-
    LLMs draft a fix for a code-scanning alert or a confirmed vulnerability and present it as a proposed change that a
    developer must review. GitHub's Copilot Autofix does this for CodeQL alerts on pull requests and default branches;
    Meta reports AI-written diffs for critical vulnerabilities; Google's bug-fix agent uses scan results and generated
    proofs to build fixes consistent with internal standards and submits them inside the original change request;
    Snyk sells an agentic fix architecture.
  outcomes:
    - {lever: speed, description: "Share of Meta's critical vulnerabilities fixed by AI-written diffs", figure: "over 40%", measures: "from the abstract of an upcoming talk; denominator and period not stated; the abstract adds that this did not by itself reduce the time to fix", provenance: self-reported, source_ref: UNPROMPTED-2026}
    - {lever: quality, description: "Secure-and-functional fix rate with and without vendor security context", figure: "74.6% to 85.4% (Claude Opus 4.6 alone versus with Snyk Intelligence)", measures: "share of about 150 single-vulnerability samples where a hidden security test and a hidden functional test both pass on the first try; Snyk's own benchmark", provenance: vendor-published, source_ref: SNYK-AGENTFIX-2026}
    - {lever: speed, description: "Google's bug-fix agent", figure: "none published", measures: "Google says the agent shortens the time between detection and resolution but gives no figure", provenance: self-reported, source_ref: GOOGLE-AGENTICSCAN-2026}
  prerequisites:
    - "Scanner alerts or confirmed findings, ideally with a proof of how the flaw is exercised"
    - "Test coverage so a developer can check behaviour is unchanged (GitHub advises this)"
    - "Dependency-review controls for fixes that add or update packages"
  risks_and_guardrails:
    - "GitHub's application card says suggestions can be non-deterministic, semantically wrong, partial, at the wrong location, or can introduce fabricated dependencies, and that review is required (GITHUB-APPCARD-2026, Limitations)"
    - "GitHub tests Autofix on a harness of over 2,300 alerts and reports that 'many' suggestions could be committed as-is, but publishes no success rate (GITHUB-APPCARD-2026, Custom evaluations)"
    - "In a 15-day single-case study in a closed-source industrial C++ repository, AI-assisted remediation produced hundreds of commits that saturated build-on-commit CI and reviewer attention until changes were batched by directory and capped in size (ARXIV-2609.29172)"
    - "Controlled studies show agent patches are often incomplete (security-vulnerability-exposure-13, security-vulnerability-exposure-14)"
  human_checkpoints:
    - "A developer reviews and accepts or edits every suggested fix (GITHUB-APPCARD-2026; GOOGLE-AGENTICSCAN-2026)"
    - "Fixes that add or update dependencies are checked before merge"
  role_evolution: >-
    Developers evaluate a suggested fix instead of starting from a search for how to fix the issue (GITHUB-APPCARD-2026,
    intended uses).
  evidence_grade: B
  sources:
    - {ref: UNPROMPTED-2026, title: "[un]prompted 2026 agenda (conference 2026-10-27 to 2026-10-29, San Francisco; abstracts of upcoming talks)", publisher: "[un]prompted (AI security practitioner conference)", type: conference, url: "https://unpromptedcon.org/agenda-10-2026/", date: "2026-10-06", access: full, locator: "Session: How Meta Changed Building Secure Software With AI (David Molnar, Meta)"}
    - {ref: GITHUB-APPCARD-2026, title: "Application card: GitHub security and quality AI features (page undated; date is retrieval date)", publisher: "GitHub Docs", type: vendor, url: "https://docs.github.com/en/code-security/code-scanning/managing-code-scanning-alerts/about-autofix-for-codeql-code-scanning", date: "2026-10-17", access: full, locator: "Sections: Copilot Autofix; Limitations; Custom evaluations"}
    - {ref: SNYK-AGENTFIX-2026, title: "Benchmarking Secure-and-Functional Remediation and How Snyk Agent Fix Lifts Frontier-Model Fix Rates by over 14%", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/snyk-agent-fix-remediation-benchmark/", date: "2026-08-18", access: full, locator: "Headline findings and Golden Tests design"}
    - {ref: GOOGLE-AGENTICSCAN-2026, title: "Changing the game: Using agentic AI to secure infrastructure code (page title: Using AI agents to secure Google infrastructure)", publisher: "Google Cloud Blog (Google AI Infrastructure team)", type: firm, url: "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/", date: "2026-09-19", access: full, locator: "Bug fix agents close the loop"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Problem statement: introduced-to-remediated ratio"}
    - {ref: ARXIV-2609.29172, title: "Orchestrating AI-Assisted Code Remediation: Socio-Technical Bottlenecks in a Large Industrial Repository", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.29172", date: "2026-09-24", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    The Meta figure is from a conference abstract for an event not yet held, so B rather than A. The Snyk figure is a
    vendor benchmark of its own product. Merged from practice and the governance angle's bug-fix agent entry.
    Engineer-directed patching programmes and patch validation are in security-vulnerability-exposure-12 and
    security-vulnerability-exposure-14.

- id: security-application-security-13
  title: Agent-applied compiler bounds-safety annotations to remove whole vulnerability classes
  archetype: security
  module: application-security
  function: technology-it
  work_types: [software-systems]
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Patching one bug at a time does not remove whole classes of memory-safety vulnerability, such as the libwebp heap
    overflow used in a zero-click iOS exploit.
  solution: >-
    Google DeepMind's CodeMender agent applied -fbounds-safety annotations to parts of the libwebp image library so the
    compiler adds bounds checks, fixed its own compile errors and test failures, and used an LLM judge configured for
    functional equivalence. It surfaces patches for human review only after validation by static and dynamic
    analysis, differential testing, fuzzing and SMT solvers. Anthropic lists rebuilding legacy code bases in
    memory-safe languages among defensive tasks such models can support.
  outcomes:
    - {lever: capacity, description: "Security fixes upstreamed during the research", figure: "72", measures: "fixes upstreamed to open-source projects (some up to 4.5 million lines of code) over the six months of building CodeMender; not limited to hardening annotations", provenance: self-reported, source_ref: DEEPMIND-CODEMENDER-2025}
  prerequisites:
    - "Compiler support for the annotations"
    - "Strong test suites and program-analysis tooling to validate each change"
    - "Maintainer willingness to take the changes"
  risks_and_guardrails:
    - "DeepMind says mistakes in code security could be costly and that only validated, high-quality patches reach human review (DEEPMIND-CODEMENDER-2025)"
    - "Results are described as early research (DEEPMIND-CODEMENDER-2025)"
  human_checkpoints:
    - "Humans review surfaced patches (DEEPMIND-CODEMENDER-2025)"
  role_evolution: >-
    DeepMind says the agent frees developers and maintainers to focus on building good software
    (DEEPMIND-CODEMENDER-2025).
  evidence_grade: B
  sources:
    - {ref: DEEPMIND-CODEMENDER-2025, title: "Introducing CodeMender: an AI agent for code security", publisher: "Google DeepMind", type: vendor, url: "https://deepmind.google/discover/blog/introducing-codemender-an-ai-agent-for-code-security/", date: "2025-10-06", access: full, locator: "Whole post; libwebp section"}
    - {ref: ANTHROPIC-EXPAND-2026, title: "Expanding Project Glasswing", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/expanding-project-glasswing", date: "2026-06-02", access: full, locator: "Defensive tasks Mythos Preview can support"}
  last_reviewed: "2026-10-17"
  notes: >-
    The 72-fix count does not measure the hardening work itself, for which no figures were published. The post was
    last modified 2026-07-13. security-vulnerability-exposure-13 cites the same 72 fixes as evidence on automated
    patching.

- id: security-application-security-14
  title: 'Automated AI screening of untrusted inbound code: packages, agent skills and outside pull requests'
  archetype: security
  module: application-security
  function: technology-it
  work_types: [review-assurance, transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Malicious packages reach developer machines before any pull-request scan runs; code-generating models invent
    package names, a new route for package-confusion attacks; public skill marketplaces for AI agents are being
    flooded with malicious skills that run with the user's access; and anonymous pull requests can reach privileged CI
    workflows that hold secrets.
  solution: >-
    Automated gates with AI components screen what comes in. Semgrep says it updates its malware database with
    AI-assisted, expert-verified rules within minutes of a major supply-chain incident, rescans customer repositories
    with only the new advisories and triggers organisation-wide policies; Snyk's Dependency Firewall blocks malicious
    and out-of-policy packages at install time, including when coding agents install them. ClawHub combines
    VirusTotal signature checks with an LLM-based scanner and a guard-model prompt; skills.sh integrates Gen, Socket
    and Snyk scanners; Cisco publishes an open-source multi-engine skill scanner. OpenSearch put a model in production
    as the only check between an anonymous pull request and CI pipeline secrets, according to a DEF CON 34 talk.
  outcomes:
    - {lever: speed, description: "Time from a major incident to updated malware detection", figure: "within minutes", measures: "Semgrep's statement, with no measured distribution", provenance: vendor-published, source_ref: SEMGREP-MALWARE-2026}
    - {lever: risk, description: "Independent bypass test of deployed skill scanners", figure: "all tested scanners bypassed with four purpose-built malicious skills", measures: "Trail of Bits bypassed ClawHub's detector, Cisco's skill scanner and the three scanners in skills.sh; three of the four skills took under an hour to build, the fourth a few hours", provenance: independent, source_ref: TOB-SKILLS-2026}
    - {lever: risk, description: "Researcher's bypass of OpenSearch's model gate", figure: "none published as counts; bypass succeeded", measures: "the abstract says the model caught every hidden attack, and the working bypass hid no attack because the dangerous part lived where the model could not verify it", provenance: independent, source_ref: DEFCON-34-2026}
    - {lever: risk, description: "Package names invented by code-generating models", figure: "at least 5.2% for commercial models; 21.7% for open-source models", measures: "average share of hallucinated packages across 576,000 code samples in two languages from 16 LLMs, with 205,474 unique hallucinated names (peer-reviewed)", provenance: independent, source_ref: USENIX-SEC-2025-HALLUC}
  prerequisites:
    - "Repository inventory and dependency data for rescans; package-manager integration for install-time blocking"
    - "Organisation-wide response policies (tickets, alerts, webhooks)"
    - "Curated or procedural controls on where agent skills come from"
    - "A clear view of what an AI gate can and cannot verify before it guards secrets"
  risks_and_guardrails:
    - "Static scanners give an adversary unlimited attempts to tweak an attack until it passes; curated marketplaces and out-of-band distribution can exclude malicious skills through procedural controls, public marketplaces cannot (TOB-SKILLS-2026)"
    - "A research detector reached 76% hallucination-free runs on 300 prompts, and half of flagged hallucinated names were lookalike packages already registered on PyPI (ARXIV-2608.23897)"
    - "GTIG reports adversaries tricking AI coding assistants and LLM scanners in supply-chain compromises (GTIG-AITRACKER-2026)"
    - "LLM review can be steered by crafted pull-request context (ARXIV-2603.18740) and by familiar-looking code (NDSS-FPA-2026); researchers argue for testing review pipelines adversarially before relying on them, though no organisation was found doing so"
    - "Fewer than half of 25 package managers verified lockfile integrity by default, and only 2 verified every package (TOB-PKGMGR-2026; not AI-specific)"
  human_checkpoints:
    - "An expert verifies AI-assisted malware rules before they publish (SEMGREP-MALWARE-2026)"
    - "None stated for OpenSearch's model gate (DEFCON-34-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: B
  sources:
    - {ref: SEMGREP-MALWARE-2026, title: "Introducing Malware Detection and Response Automation", publisher: "Semgrep Blog", type: vendor, url: "https://semgrep.dev/blog/2026/introducing-malware-detection-and-response-automation", date: "2026-09-24", access: full, locator: "Malware detection and response automation; malware firewall (private beta)"}
    - {ref: SNYK-AGENTIC-2026, title: "Introducing Evo Agentic AppSec: Security That Keeps Up With AI Development", publisher: "Snyk Blog", type: vendor, url: "https://snyk.io/blog/announcing-snyk-agentic-appsec/", date: "2026-10-15", access: full, locator: "Evo Dependency Firewall"}
    - {ref: TOB-SKILLS-2026, title: "The sorry state of skill distribution", publisher: "Trail of Bits Blog", type: firm, url: "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/", date: "2026-06-03", access: full, locator: "Opening and 'Bypassing ClawHub scanning'"}
    - {ref: DEFCON-34-2026, title: "DEF CON 34 main stage talks: LGTM: Bypassing an LLM Build Gate When Prompt Injection Fails (Aviv Donenfeld, Check Point Software Technologies)", publisher: "DEF CON", type: conference, url: "https://defcon.org/html/defcon-34/dc-34-speakers.html", date: "2026-08", access: full, locator: "Talk abstract (Main Track 5, Friday 13:00)"}
