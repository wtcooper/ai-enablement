  maturity: emerging
  problem: "Video, voice and email can now all be synthesised. FinCEN observed more suspicious-activity reports describing suspected deepfake media, particularly fraudulent identity documents used to circumvent verification; NYDFS lists AI-enabled social engineering among the most significant threats to financial services. The FBI warned in May 2025 of AI-generated voice messages used to impersonate senior US officials."
  solution: "idea (regulator-recommended): treat a voice or video request for money, credentials or data as unverified until confirmed through a separate channel, with defined points for human review. NYDFS says training should cover verifying unexpected money transfer requests by telephone, video or email and when human review must be part of verification procedures."
  outcomes:
    - { lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: NYDFS-AIGUIDE-2024 }
