- id: security-human-risk-16
  title: "Shadow-AI visibility and point-of-risk coaching ('audit and educate' instead of block)"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: "Employees put internal documents, source code and meeting content into public AI tools and AI meeting assistants; AI browsers and agents can bypass traditional logging. In Proofpoint's 2026 survey of 1,600 CISOs, 37% cite misuse or misconfiguration of AI tools as a cause of material data loss (respondents could cite several causes)."
  solution: "DTEX's CTO describes shifting from a block-first approach to an audit and educate approach with prompt inspection and real-time nudges. Adaptive lists an 'AI Governance' product (live feed of risky prompts across AI tools, with policy enforcement and coaching). KnowBe4 announced on 2026-09-23 an Agent Risk Manager browser extension for Chrome and Edge that discovers new and unknown AI sites and lets security teams block, warn or allow them; it was in early access for some US customers."
  outcomes:
    - { lever: speed, description: "Claimed effect of audit-and-educate on containment time", figure: "17% reduction, from 81 to 67 days (CTO statement)", measures: "average days to contain an insider incident, as claimed by DTEX's CTO; the same article gives 86 days for 2023", provenance: vendor-published, source_ref: HELPNET-PONEMON-2026 }
  prerequisites:
    - "Inventory of sanctioned and unsanctioned AI tools; acceptable-use policy"
  risks_and_guardrails:
    - "Prompt inspection captures employee content; privacy and monitoring rules apply (ICO-MONITORING-2023)"
    - "Only a small share of surveyed organisations classify AI agents as equivalent to human insiders (HELPNET-PONEMON-2026)"
  human_checkpoints:
    - "Not described"
  role_evolution: "DTEX argues insider-risk programmes should treat AI agents as operational identities with defined access controls (HELPNET-PONEMON-2026)."
  evidence_grade: C
  sources:
    - { ref: HELPNET-PONEMON-2026, title: "The USD 19.5 million insider risk problem", publisher: Help Net Security, type: survey, url: "https://www.helpnetsecurity.com/2026/02/26/insider-risk-costs-2026/", date: 2026-02-26, access: full, locator: "Paragraphs on shadow AI and CTO quotes" }
    - { ref: ADAPTIVE-HOME-2026, title: "Adaptive Security homepage", publisher: Adaptive Security, type: vendor, url: "https://www.adaptivesecurity.com/", date: 2026-10-15, access: full, locator: "AI Governance section" }
    - { ref: PROOFPOINT-VOC-2026, title: "The risk has moved: what Proofpoint's 2026 Voice of the CISO reveals", publisher: Proofpoint, type: survey, url: "https://www.proofpoint.com/au/blog/corporate-news/risk-has-moved-what-proofpoints-2026-voice-ciso-reveals", date: 2026-09-09, access: full, locator: "'Human risk is now a core data security challenge' paragraphs" }
    - { ref: KNOWBE4-ARM-2026, title: "KnowBe4 Shuts Down Shadow AI with Agent Security Innovation", publisher: KnowBe4, type: vendor, url: "https://www.knowbe4.com/press/knowbe4-shuts-down-shadow-ai-with-agent-security-innovation", date: 2026-09-23, access: full, locator: "Subtitle; paragraphs 1 and 4-5 (read via a text mirror)" }
    - { ref: ICO-MONITORING-2023, title: "Employment practices and data protection: monitoring workers", publisher: UK Information Commissioner's Office, type: regulator, url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/employment/monitoring-workers/", date: 2023-10, access: full, locator: "Page banner and contents" }
  last_reviewed: 2026-10-17
  notes: "From deep-dive 14, plus the Proofpoint figure routed from governance-risk. Partly belongs to the data-security-privacy module. The KnowBe4 Agent Risk Manager claim is now sourced to the press release itself (opened in verification). Proofpoint's survey is vendor-run."

