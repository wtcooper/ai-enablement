# Use cases: security / human-risk (security awareness and phishing simulation, reported-email handling,
# impersonation and scam defence, identity and request verification, insider risk, social-engineering testing).
# Synthesised 2026-10-17 from the wave-4 landscape scan, the single combined human-risk deep dive (21 candidates) and
# items other security angle files routed to human-risk. 18 entries out.
# Verified 2026-10-17 against the cited sources (research/runs/wave4/human-risk-verification-report.md); 0 rejected,
# security-human-risk-10 downgraded from A to B.
# Canonical refs (one key per document across security files): NYDFS-AIGUIDE-2024 (= NYDFS-AI-2024 in the deep dive);
# FBI-IC3-2025 means the 2025 Internet Crime Report, published 2026-04 (= FBI-IC3-2026 in the deep dive);
# FBI-IC3PSA-2025 is the FBI public service announcement of 2025-05-15. FINCEN-DEEPFAKE-NR-2024 is FinCEN's news
# release; FINCEN-DEEPFAKE-2024 in identity-access.yaml is the alert PDF itself. The deep dive used ADAPTIVE-BLOG-2026
# for two pages; here ADAPTIVE-HOME-2026 is the homepage and ADAPTIVE-BLOG-2026 the blog index.
# Almost every outcome figure is vendor-published or self-reported. Grades follow the 2026-10-17 grade A rule: figures
# that a customer recalls or estimates in a vendor case study are grade B, with the figure kept and labelled.
# Cross-module overlaps are referenced by id rather than repeated: security-operations-04 (phishing triage agent),
# security-identity-access-18, -19, -21, -22, -23 (help-desk verification, identity proofing, contact-centre voice and
# deepfake detection), security-threat-intelligence-18 (takedown evidence agents), security-threat-intelligence-21
# (Datadog fake-applicant hunting).

- id: security-human-risk-01
  title: "Adaptive, reward-based phishing training aimed at the riskiest employees first and tested on cohorts before company-wide rollout"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: "A small group of repeat clickers is said to cause most phishing incidents, and blanket annual training treats everyone the same. The Qualcomm case page cites research (it names Cyentia) that 4% of users cause 80% of phishing incidents; this is a general research figure, not Qualcomm's own incident data."
  solution: "Qualcomm picked its 1,000 highest-risk employees (people who had failed 3 or more of the previous 6 exercises and who worked in frequently targeted roles such as accounts payable, sales/marketing or executive support) and enrolled them in Hoxhunt's gamified, reward-based adaptive phishing programme. Their results were compared with the rest of the company in periodic benchmark phishing tests, and the result won support for a rollout to about 48,000 employees. Avanade ran a three-month proof of concept comparing two 1,000-user cohorts, one on Hoxhunt and one on its previous awareness tool, before choosing the platform."
  outcomes:
    - { lever: risk, description: "Three-month benchmark of two 1,000-user cohorts, Hoxhunt versus Avanade's previous awareness tool", figure: "43% higher resilience ratio; 11% lower failure rate; 27% higher reporting rate; 37% more simulations sent", measures: "resilience ratio is defined on the page as phishing-simulation engagement rate divided by failure rate; two cohorts of 1,000 users over a three-month proof of concept that the page says Avanade performed; the tools sent different simulations (Hoxhunt's adapt in difficulty and 37% more were sent), so failure rates are not like-for-like, and the page does not say whether 11% is relative or in percentage points", provenance: vendor-published, source_ref: HOXHUNT-AVANADE-2026 }
    - { lever: risk, description: "Baseline phishing-simulation failure rate of Qualcomm's selected cohort before enrolment", figure: "30-50% failure rate, negligible reporting", measures: "failure rate of the 1,000 selected employees in Qualcomm's earlier simulations, as stated on the Hoxhunt case page; period not stated", provenance: vendor-published, source_ref: HOXHUNT-QUALCOMM-2024 }
    - { lever: risk, description: "Change in simulation failure rates for the risky cohort and then company-wide, as stated by Qualcomm's Global Head of Cybersecurity on the case page", figure: "risky cohort went from double their colleagues' failure rate to roughly half over a 9-month enrollment; company-wide failure rates then fell by a factor of 6 (the case-study index card says 3.5x drop in failure rate and 73% increase in reporting)", measures: "simulated-phishing failure rate, quoted from Kris Virtue on the vendor page; absolute rates, sample sizes and the period of the company-wide drop are not stated, and the index card's figures differ from the quote", provenance: vendor-published, source_ref: HOXHUNT-QUALCOMM-2024 }
  prerequisites:
    - "History of simulation results and role data to identify the highest-risk users"
    - "A training platform that supports gamified, reward-based programmes rather than penalties"
    - "Support from leadership obtained through a cohort experiment before the general rollout (HOXHUNT-QUALCOMM-2024, Solution)"
  risks_and_guardrails:
    - "A large randomised field trial (UCSD Health, over 19,500 employees, 8 months) reported limited value from embedded phishing training and stressed the need for a no-training control group; Qualcomm's page describes comparison against the rest of the company, not a randomised control (UCSD-PHISHTRAIN-2025, Abstract and Section 1)"
    - "The vendor's own blog says a failure rate only means something next to simulation difficulty and reporting rate (HOXHUNT-FAILRATE-2026, opening summary)"
  human_checkpoints:
    - "Security team selects the cohort and decides on the general rollout after the cohort comparison (HOXHUNT-QUALCOMM-2024)"
  role_evolution: "The Qualcomm page describes replacing 'phishing prison' with a reward-based programme for repeat clickers; it does not describe changes to security-team roles (HOXHUNT-QUALCOMM-2024)."
  evidence_grade: A
  sources:
    - { ref: HOXHUNT-AVANADE-2026, title: "How Avanade reduces human cyber risk and saves over 900 hours of SOC analysis per month", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/case-studies/avanade-reduced-cyber-risk-and-saved-5-soc-analyst-ftes-with-hoxhunt", date: 2026, access: full, locator: "'The Hoxhunt challenge benchmark study'" }
    - { ref: HOXHUNT-QUALCOMM-2024, title: "How Qualcomm used Hoxhunt to turn their 1,000 highest-risk employees into their top performers", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/case-studies/how-qualcomm-used-targeted-security-awareness-training-for-employees", date: 2024, access: full, locator: "Challenge; Solution; 'How did Qualcomm start transforming their culture'; 'CSO50 Award-Winning Results' (Kris Virtue quote)" }
    - { ref: UCSD-PHISHTRAIN-2025, title: "Understanding the Efficacy of Phishing Training in Practice", publisher: "IEEE Symposium on Security and Privacy (UC San Diego, University of Chicago, UC San Diego Health)", type: academic, url: "https://sysnet.ucsd.edu/~voelker/pubs/phishtrain-oakland25.pdf", date: 2025-05, access: full, locator: "Abstract; Section 1 findings list" }
    - { ref: HOXHUNT-FAILRATE-2026, title: "What is a good phishing failure rate?", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/blog/what-is-a-good-phishing-failure-rate", date: 2026-03-09, access: full, locator: "Opening summary" }
  last_reviewed: 2026-10-17
  notes: "Merged from deep-dive 01 (Qualcomm) and the benchmark outcome of deep-dive 02 (Avanade). Low-confidence A, kept after verification on 2026-10-17: the page says Avanade itself performed the three-month, two-cohort benchmark (a study, so it meets the A rule), and Qualcomm's Global Head of Cybersecurity states measured failure-rate changes in his own words. Both appear only on the winning vendor's pages; neither is randomised; both are simulation metrics on non-identical simulations, with no incident data. The pages call the training adaptive but do not describe the AI method. Both case pages are undated. Qualcomm's page reports results 'within 6 months of the global rollout' in August 2023, so it was written in 2024 at the earliest (key renamed from HOXHUNT-QUALCOMM-2023). Avanade's year reflects only the current listing; the Wayback Machine could not be reached to date it."

- id: security-human-risk-02
  title: "Behaviour-signal-driven human risk management with just-in-time micro-training and nudges"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [data-reporting, document-production]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: "Uber judged that compliance-based awareness training could not reduce risk effectively, and the TrainShield authors note that traditional programmes are delivered outside real-world contexts (ARXIV-2608.02296). Uber wanted a human risk management programme for over 25,000 users with a two-person team and no existing playbook."
  solution: "Uber and Hoxhunt co-developed a programme that takes behavioural signals (phishing simulation outcomes, incident response data, vulnerability and bug tickets, data-handling events, policy exceptions, endpoint and network telemetry, external threat intelligence) and triggers targeted micro-learning and nudges at the moment of risk. The page says content is selected 'with AI capabilities' by role, behaviour pattern and observed risk. The page says many of the co-developed capabilities are now part of Hoxhunt's HRM platform; Hoxhunt also markets a Behavior Risk Console that combines Hoxhunt, Microsoft Defender, CrowdStrike, Zscaler and other signals into per-employee, team and organisation views. Research prototypes go further: TrainShield (ACM Hypertext 2026) embeds LLM-generated learning overlays in the browsing workflow, triggered by real-time phishing or data-loss detection, and CyberGLA (2026) pairs a spoof-detection tool with an LLM security coach that selects training modules based on detection outcomes."
  outcomes:
    - { lever: experience, description: "Training completion after moving from forced compliance to voluntary participation", figure: "60% to over 90%", measures: "security-training completion as stated on the case page; user base and period not stated", provenance: vendor-published, source_ref: HOXHUNT-UBER-2026 }
    - { lever: risk, description: "Simulated threat reporting", figure: "3-fold increase", measures: "simulated threat reporting as stated on the case page; baseline not stated", provenance: vendor-published, source_ref: HOXHUNT-UBER-2026 }
    - { lever: experience, description: "Programme sentiment", figure: "96% found training valuable; 98% reported confidence in making secure decisions", measures: "share of survey respondents, as stated on the case page; sample size and response rate not stated", provenance: vendor-published, source_ref: HOXHUNT-UBER-2026 }
    - { lever: experience, description: "TrainShield preliminary perception study", figure: "none published", measures: "the abstract reports perceived usefulness and a preference over lengthy asynchronous formats; sample size not captured", provenance: independent, source_ref: ARXIV-2608.02296 }
  prerequisites:
    - "Integrations that bring security tooling signals into one behavioural view (HOXHUNT-BRC-2026)"
    - "Willingness to use employee behaviour data across detection, ticketing and endpoint systems"
    - "For in-workflow coaching, a browser or mail-client integration that can raise the trigger event"
  risks_and_guardrails:
    - "Combining behaviour signals about named employees is workplace monitoring; the UK ICO has monitoring-of-workers guidance under UK GDPR, currently flagged as under review after the Data (Use and Access) Act (ICO-MONITORING-2023, banner)"
    - "The EU AI Act prohibits AI that infers emotions of people in the workplace (EC-AIACT-2026, prohibited practices list); the Uber page does not describe such inference"
    - "Hoxhunt's product page says AI tools operate under the same governance framework as the rest of its platform (HOXHUNT-BRC-2026)"
    - "TrainShield authors highlight challenges aligning generated content with user expectations (ARXIV-2608.02296, abstract)"
  human_checkpoints:
    - "Security team defines escalation playbooks and intervention triggers (HOXHUNT-BRC-2026)"
  role_evolution: "Uber's two-person team (Head of Security Diligence, Analytics, Vendor Risk, and Awareness, and Head of Security, Global Risk & Compliance) manages a signal-and-intervention system rather than a training calendar; self-service tools are said to cut tier-1 policy inquiries (HOXHUNT-UBER-2026)."
  evidence_grade: B
  sources:
    - { ref: HOXHUNT-UBER-2026, title: "Uber reduces human risk with CSO Award-winning signal-driven behavior management", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/case-studies/uber-reduces-human-risk-with-signal-driven-behavior-management", date: 2026, access: full, locator: "Challenge; Solution; Key takeaways; behavioural signals list" }
    - { ref: HOXHUNT-BRC-2026, title: "Behavior Risk Console", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/product/behavior-risk-console", date: 2026, access: full, locator: "Product description and integrations" }
    - { ref: ARXIV-2608.02296, title: "TrainShield: Targeted Awareness for Cybersecurity Training", publisher: ACM Hypertext 2026 via arXiv, type: academic, url: "https://arxiv.org/abs/2608.02296", date: 2026-08-03, access: full, locator: "Abstract" }
    - { ref: ARXIV-2608.21547, title: "Enhancing User Resilience Against AI-Augmented Phishing: A Two-Stage Framework for Detection and Personalized Training", publisher: Journal of the Colloquium for Information Systems Security Education via arXiv, type: academic, url: "https://arxiv.org/abs/2608.21547", date: 2026-08-21, access: full, locator: "Abstract" }
    - { ref: ICO-MONITORING-2023, title: "Employment practices and data protection: monitoring workers", publisher: UK Information Commissioner's Office, type: regulator, url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/employment/monitoring-workers/", date: 2023-10, access: full, locator: "Page banner and contents" }
    - { ref: EC-AIACT-2026, title: "AI Act (regulatory framework for AI)", publisher: European Commission, type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", date: 2026-10-17, access: full, locator: "Unacceptable risk list; application dates" }
  last_reviewed: 2026-10-17
  notes: "Merged from deep-dive 03 (graded A there) and deep-dive 18 (an idea: research prototypes of event-triggered LLM coaching). Graded B under the 2026-10-17 rule: Uber is a named production deployment, but the figures are rounded, with no baseline, period, population or method on the vendor's page, so they cannot be told apart from estimates; they are kept with that provenance. Uber page is undated; the year comes from its reference to a 'CSO 2026 Expert Panel'. ICO guidance year is from prior knowledge (the page shows no date). EC page date is the check date."

- id: security-human-risk-03
  title: "LLM-generated and AI-agent-built awareness content and campaigns"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Content libraries have gaps for organisation-specific policies, new attacks and incidents; building modules takes days and waiting on a vendor takes longer."
  solution: "Hoxhunt's Content Studio (page dated 2026-06-24) turns a prompt and the customer's own documents into a draft training module; it says every module stays a draft until a person reviews and publishes it. KnowBe4 said in January 2026 that it has seven AIDA agents in market for human risk management, listing contextual phishing simulations, automated remedial training, policy-based quizzes and customised deepfakes. A controlled academic experiment tested LLM-generated phishing training."
  outcomes:
    - { lever: speed, description: "Vendor claim that modules can be created in minutes instead of days", figure: "minutes (no measurement)", measures: "vendor statement about authoring time; no sample or comparison given", provenance: vendor-published, source_ref: HOXHUNT-CONTENT-2026 }
    - { lever: quality, description: "Two controlled online studies found pre-post learning gains from AI-generated training and no measurable advantage for complex psychometric personalisation over well-designed generic content", figure: "N=480 (Study 1 N=80; Study 2 N=400); effect sizes not captured from the abstract", measures: "participants' pre-post accuracy gains in an online experiment; this is knowledge gain, not real-world click or incident behaviour", provenance: independent, source_ref: ARXIV-2512.01893 }
    - { lever: capacity, description: "KnowBe4 says its agents are in use across more than 70,000 organisations", figure: "70,000+ organisations", measures: "company statement about organisations in which its agents are available or in use; no customer names or seat counts given", provenance: vendor-published, source_ref: SECURITYBRIEF-AIDA-2026 }
  prerequisites:
    - "Source policy and procedure documents in usable form"
    - "An awareness manager who reviews and publishes drafts"
  risks_and_guardrails:
    - "Hoxhunt: AI drafts, admins decide; modules remain drafts until published (HOXHUNT-CONTENT-2026)"
    - "TrainShield authors flag difficulty aligning generated content with user expectations (ARXIV-2608.02296, abstract)"
  human_checkpoints:
    - "A person reviews and publishes every generated module (HOXHUNT-CONTENT-2026)"
  role_evolution: "KnowBe4 says the aim is for staff to spend more time on higher-level risk decisions (SECURITYBRIEF-AIDA-2026); Hoxhunt describes the tool as an on-demand instructional design team for awareness managers (HOXHUNT-CONTENT-2026)."
  evidence_grade: C
  sources:
    - { ref: HOXHUNT-CONTENT-2026, title: "Content Studio creates customizable security awareness content", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/blog/content-studio-creates-customizable-security-awareness-content", date: 2026-06-24, access: full, locator: "Opening paragraphs; publishing control" }
    - { ref: SECURITYBRIEF-AIDA-2026, title: "KnowBe4 marks AIDA decade, names AI innovation VP", publisher: SecurityBrief UK, type: press, url: "https://securitybrief.co.uk/story/knowbe4-marks-aida-decade-names-ai-innovation-vp", date: 2026-01-30, access: full, locator: "Paragraphs 1-6" }
    - { ref: ARXIV-2512.01893, title: "Improving Phishing Resilience with AI-Generated Training: Evidence on Prompting, Personalization, and Duration", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2512.01893", date: 2025-12-01, access: full, locator: "Abstract" }
    - { ref: ARXIV-2608.02296, title: "TrainShield: Targeted Awareness for Cybersecurity Training", publisher: ACM Hypertext 2026 via arXiv, type: academic, url: "https://arxiv.org/abs/2608.02296", date: 2026-08-03, access: full, locator: "Abstract" }
  last_reviewed: 2026-10-17
  notes: "From deep-dive 04. Only the abstract of the academic study was read. KnowBe4's own history reported eight agents in other coverage (search-only), so the agent count is unresolved. No named customer outcome was found."

- id: security-human-risk-04
  title: "Personalised, OSINT-driven spear-phishing simulations inside awareness programmes"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [review-assurance, research-synthesis]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: piloting
  problem: "Generic simulations may under-represent what attackers can now do cheaply. Researchers note spear phishing is about 0.1% of phishing emails but is linked to 66% of data breaches in one cited vendor study (USENIX-CZYBIK-2026, Introduction)."
  solution: "In a study run inside the phishing-awareness training of a partner university (TU Braunschweig) with 7,700 participants, the authors fed each participant's email address into web searches, generated a tailored email with an LLM (a large language model, the technology behind chat assistants), and compared click rates with generic lures. Another study ran three simulations across organisations ranging from small businesses to a multinational (over 71,000 emails) including an LLM-plus-OSINT lure (OSINT: open-source intelligence, meaning public information). A vendor (Adaptive Security) lists 'OSINT & AI Email Spearphishing' among its simulation products."
  outcomes:
    - { lever: risk, description: "Click rate of LLM-personalised spear phishing versus generic phishing", figure: "10.0% (330 of 3,177 delivered) versus 3.7% for LLM generic (65 of 1,735 delivered) and 4.1% for manual generic (79 of 1,918 delivered)", measures: "participants who clicked the phishing link divided by emails delivered, in the paper's campaign table; manual spear phishing (100 sent, 99 delivered) reached 24.2%", provenance: independent, source_ref: USENIX-CZYBIK-2026 }
    - { lever: cost, description: "Marginal cost of personalisation per email", figure: "approximately USD 0.03", measures: "authors' stated cost of generating a personalised email", provenance: independent, source_ref: USENIX-CZYBIK-2026 }
    - { lever: risk, description: "LLM plus OSINT lure in one of the organisations", figure: "over 30% of opened emails led to a visit to the landing page", measures: "share of opened emails in one company that led to landing-page visits; organisations unnamed", provenance: independent, source_ref: ARXIV-2505.12104 }
  prerequisites:
    - "Approval from security office, administration and staff committee as in the university study; briefing and debriefing of participants (USENIX-CZYBIK-2026, Section 5.1)"
    - "A policy on what public personal information may be used"
  risks_and_guardrails:
    - "The study's lures covered a university workplace and may differ from corporate or government settings (USENIX-CZYBIK-2026, Section 5.1)"
    - "Sophos lists 'unfair' simulations among common mistakes, including pretexts about financial hardship or job security and lures built from personal information scraped from social media, which bears directly on OSINT-personalised simulations (SOPHOS-PHAKE-2025, list of common mistakes)"
  human_checkpoints:
    - "Ethics and staff-committee review before launch; participants are briefed and debriefed (USENIX-CZYBIK-2026, Section 5.1)"
  role_evolution: "Authors recommend incorporating personalised phishing into awareness training and limiting public information linkable to email addresses (USENIX-CZYBIK-2026, Abstract); no role change is described."
  evidence_grade: B
  sources:
    - { ref: USENIX-CZYBIK-2026, title: "A Large-Scale Study of Personalized Phishing using Large Language Models", publisher: "USENIX Security Symposium (BIFOLD, TU Berlin, Inria, Ruhr-University Bochum)", type: academic, url: "https://www.usenix.org/system/files/usenixsecurity26-czybik.pdf", date: 2026-08, access: full, locator: "Abstract; Section 5.1; Section 6.1 and campaign table" }
    - { ref: ARXIV-2505.12104, title: "The Impact of Emerging Phishing Threats: Assessing Quishing and LLM-generated Phishing Emails against Organizations", publisher: AsiaCCS 2025 via arXiv, type: academic, url: "https://arxiv.org/abs/2505.12104", date: 2025-05-17, access: full, locator: "Abstract" }
    - { ref: ADAPTIVE-HOME-2026, title: "Adaptive Security homepage", publisher: Adaptive Security, type: vendor, url: "https://www.adaptivesecurity.com/", date: 2026-10-15, access: full, locator: "Product menu: Phishing Simulations (Realistic Email Phishing, Voice Call & SMS Phishing, OSINT & AI Email Spearphishing)" }
    - { ref: SOPHOS-PHAKE-2025, title: "Phake phishing: Phundamental or pholly?", publisher: Sophos, type: vendor, url: "https://www.sophos.com/en-us/blog/phake-phishing-phundamental-or-pholly", date: 2025-10-31, access: full, locator: "Opening list of common mistakes (read via a text mirror)" }
  last_reviewed: 2026-10-17
  notes: "From deep-dive 05. Grade B rather than A: the named-organisation measurement shows how susceptible staff are to LLM-personalised lures, not that using them in training reduces risk. The Adaptive date is the latest dated item on its blog index; the product menu itself is undated."

- id: security-human-risk-05
  title: "Conversational vishing and smishing practice with AI-voice scenarios"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [review-assurance, client-interaction]
  pattern: service-agent-escalation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: "Employees are trained to scrutinise emails, but a live call (vishing: voice phishing; smishing: SMS phishing) demands instant reaction. A survey experiment (N=4,100) found that 16.5% of participants said they would or might comply across five AI voice scam categories, and up to 36% in a relative-in-distress scenario (participants heard recordings or read transcripts; these were not live calls). The authors judged AI vishing economically viable where human-operated vishing at US wages is not."
  solution: "Hoxhunt describes (blog dated 2025-10-24) an immersive voice-phishing training capability in which employees practise against an AI voice in simulated phone conversations that adapt to their responses; Adaptive lists voice-call and SMS phishing simulations."
  outcomes:
    - { lever: risk, description: "none published for the training itself; no customer names or results found", figure: "none published", measures: "not applicable", provenance: vendor-published, source_ref: HOXHUNT-VOICE-2025 }
  prerequisites:
    - "Employee consent and notice for simulated calls"
    - "Out-of-band verification procedures that staff are trained to apply"
  risks_and_guardrails:
    - "Caller persuasiveness, not whether the caller was believed to be human, was the strongest predictor of compliance in the survey experiment, so training on spotting 'robotic' voices is unlikely to be sufficient (ARXIV-2607.09970, abstract)"
    - "Humans struggle to tell AI-generated scam calls from human voices: participants correctly recognised human callers only 24-45% of the time (BSIDESLV-2026, 'Devising and Detecting Voice Phishing' abstract)"
  human_checkpoints:
    - "Awareness team reviews scenario design and results"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - { ref: HOXHUNT-VOICE-2025, title: "Hoxhunt Voice Phishing Training", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/blog/hoxhunt-voice-phishing-training", date: 2025-10-24, access: full, locator: "Opening and 'Practice makes perfect' sections" }
    - { ref: ARXIV-2607.09970, title: "Evaluating AI Models' Capability to Automate Voice Phishing Attacks", publisher: Expert Systems with Applications vol. 332 via arXiv, type: academic, url: "https://arxiv.org/abs/2607.09970", date: 2026-07-10, access: full, locator: "Abstract" }
    - { ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talk list", publisher: BSides Las Vegas, type: conference, url: "https://bsideslv.org/talks", date: 2026-08, access: full, locator: "'Devising and Detecting Voice Phishing' (Ground Truth, Monday 10:00)" }
    - { ref: ADAPTIVE-HOME-2026, title: "Adaptive Security homepage", publisher: Adaptive Security, type: vendor, url: "https://www.adaptivesecurity.com/", date: 2026-10-15, access: full, locator: "Product menu: Voice Call & SMS Phishing" }
  last_reviewed: 2026-10-17
  notes: "From deep-dive 06. BSides LV month is from the landscape file (early August 2026); exact dates were not verified. An Infosec product claim seen only in search results was removed in verification because no source was opened."

- id: security-human-risk-06
  title: "Deepfake and executive-impersonation drills for finance, help desk and executive staff"
  archetype: security
  module: human-risk
  function: finance-accounting
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: "Arup confirmed that a Hong Kong employee paid out about USD 25 million after a video call with deepfake colleagues; the police account says the worker's initial phishing suspicion was put aside after the call. The FBI recorded 135 BEC complaints that reference AI, with USD 30.3M in AI-related BEC losses, in 2025 (BEC, business email compromise, overall: over USD 3.0 billion)."
  solution: "NYDFS tells regulated entities that social-engineering training, including on deepfakes, can be delivered through simulated phishing and voice and video impersonation exercises and should cover verifying unexpected money-transfer requests. Vendors (KnowBe4 'customised deepfakes for education'; Adaptive deepfake training) sell simulations; none reported outcomes."
  outcomes:
