    - "Named verification channels and contact data held independently of the request"
  risks_and_guardrails:
    - "NYDFS: not all authentication factors resist AI-manipulated deepfakes; consider factors that withstand them (NYDFS-AIGUIDE-2024, access controls section)"
    - "The FBI recommends independently finding the person's number and calling to verify, and warns that AI-generated voices can sound nearly identical to a known contact (FBI-IC3PSA-2025, Recommendations)"
  human_checkpoints:
    - "Human review and oversight inside verification procedures (NYDFS-AIGUIDE-2024)"
  role_evolution: "Not described."
