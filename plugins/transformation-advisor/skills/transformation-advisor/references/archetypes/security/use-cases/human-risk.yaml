  last_reviewed: 2026-10-17
  notes: "From deep-dive 15, plus routed items: Datadog's FIRST session (held in full as security-threat-intelligence-21), Nametag's report and the IC3 interview voice-spoofing point (both routed from identity-access). Graded B: KnowBe4 is a named real case with process changes but no measured defender outcome. The AI role in Datadog's stack is a single phrase ('AI-driven risk assessment'); the session is TLP:AMBER and only the abstract is public. ML identity proofing with liveness and deepfake detection is security-identity-access-19. Vendor claims on candidate-fraud detection were seen only in search results and are not used."

- id: security-human-risk-13
  title: "Out-of-band, deepfake-aware verification for payment and credential requests (idea)"
  archetype: security
  module: human-risk
  function: finance-accounting
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
