- id: security-human-risk-07
  title: "Automated triage of employee-reported suspicious emails"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: "Once training works, employees report more suspicious emails. Avanade says its people 'began reporting far more threats', a volume that was hard to analyse manually, and Microsoft describes analysts facing a continuous stream of user-reported emails."
  solution: "Avanade used Hoxhunt's response platform to categorise and prioritise reported messages (legitimate email, spam, threats, incidents) automatically. Microsoft documents a Phishing Triage Agent in Defender that classifies user-reported phishing as real threat or false positive with a natural-language rationale and analyst feedback; the SOC-side agent is covered in security-operations-04."
  outcomes:
    - { lever: capacity, description: "Monthly SOC analysis time saved by automated response handling", figure: "over 900 hours a month; described as up to 5 full-time analysts", measures: "SOC analyst hours of analysis saved per month, as stated on the Hoxhunt case page for Avanade; the page says 'by one calculation' and elsewhere describes an analysis that assigned a time value to each report the platform handled, compared with an analyst; it gives 3-5 FTEs in one place and over 5 in another", provenance: vendor-published, source_ref: HOXHUNT-AVANADE-2026 }
    - { lever: quality, description: "Reduction in false positives and incident escalations due to the response platform", figure: "98%", measures: "stated on the case page as a reduction in false positives and incident escalations; baseline and period not stated", provenance: vendor-published, source_ref: HOXHUNT-AVANADE-2026 }
  prerequisites:
    - "A one-click report button integrated with the mail platform (Microsoft: 'Monitor reported messages in Outlook' must be enabled)"
    - "For Microsoft's agent: Defender for Office 365 Plan 2, Security Copilot capacity (SCUs), unified RBAC and the 'Email reported by user as malware or phish' alert policy; alerts resolved by tuning rules are not triaged (MSFT-PHISHTRIAGE-2026, prerequisites)"
  risks_and_guardrails:
    - "Microsoft recommends creating a dedicated agent identity with the minimum required permissions; an existing user account can be assigned instead (MSFT-PHISHTRIAGE-2026, agent identity section)"
    - "Verdicts are explained in natural language and analysts can give feedback, so wrong classifications can be corrected (MSFT-PHISHTRIAGE-2026, key capabilities)"
    - "No independent false-negative or override-rate data was found for either product"
  human_checkpoints:
    - "Analysts review the agent's rationale and can feed back on classifications (MSFT-PHISHTRIAGE-2026)"
  role_evolution: "Avanade's page says the platform did the work of over 5 full-time threat analysts per month and let the team 'focus on real threats' (HOXHUNT-AVANADE-2026, Overview); no redeployment details are given."
  evidence_grade: B
  sources:
    - { ref: HOXHUNT-AVANADE-2026, title: "How Avanade reduces human cyber risk and saves over 900 hours of SOC analysis per month", publisher: Hoxhunt, type: vendor, url: "https://hoxhunt.com/case-studies/avanade-reduced-cyber-risk-and-saved-5-soc-analyst-ftes-with-hoxhunt", date: 2026, access: full, locator: "Key takeaways; Overview" }
    - { ref: MSFT-PHISHTRIAGE-2026, title: "Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent", date: 2026-07-02, access: full, locator: "Overview; key capabilities; prerequisites; agent identity" }
  last_reviewed: 2026-10-17
  notes: "From deep-dive 02 (graded A there). Graded B under the 2026-10-17 rule: the 900-hour figure is a modelled estimate (a time value per report, 'by one calculation') and the 98% has no baseline, so both read as estimates on a vendor page; kept with that provenance. The Avanade cohort benchmark moved to security-human-risk-01. Overlaps security-operations-04, which holds the Microsoft agent from the SOC side; this entry keeps the reporter-loop view (report volume rises as training works). Avanade page is undated; no Microsoft customer figures were found."

- id: security-human-risk-08
  title: "Behavioural-AI email security that replaces the secure email gateway, re-checks delivered mail and answers employee reports"
  archetype: security
  module: human-risk
  function: technology-it
  work_types: [transaction-processing, review-assurance]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "Valvoline used a secure email gateway (SEG, a filter in front of the mail server) plus Microsoft 365 native security plus an API-based tool, yet spear phishing and invoice fraud (from USD 5,000 to millions, per the quoted security director) still reached inboxes despite awareness training. Messages that pass native filtering rely on users to notice them."
  solution: "Valvoline moved to Abnormal's API-based behavioural AI, removed its secure email gateway, and uses an AI Security Mailbox that gives users personalised replies to their report submissions. Adaptive Security, an awareness vendor, lists 'Adaptive Email Security (Beta)' on 2026-04-16 and a 2026-08-26 post calling it the company's fastest-growing product; its homepage says it re-analyses every inbound message after native filtering and remediates automatically."
  outcomes:
    - { lever: cost, description: "Loss avoided by stopping one recurring invoice fraud attack", figure: "USD 600K", measures: "figure shown as a headline metric on the customer story ('Saved by stopping a recurring invoice fraud attack'); method not described", provenance: vendor-published, source_ref: ABNORMAL-VALVOLINE-2026 }
    - { lever: capacity, description: "Analyst hours saved on email and solution management", figure: "480 hours per month", measures: "headline metric on the customer story; the security director also says 4-5 analysts had spent 90% of each day on email-related tasks", provenance: vendor-published, source_ref: ABNORMAL-VALVOLINE-2026 }
  prerequisites:
    - "Cloud mailbox API integration; a proof of value on the customer's own mail"
  risks_and_guardrails:
    - "All figures are vendor-published; no independent false-positive or missed-attack rates were found"
    - "Adaptive publishes no accuracy or false-positive data; the product was described as beta in April 2026 (ADAPTIVE-BLOG-2026)"
    - "The customer says awareness training did not stop mistakes ('humans will always make mistakes'), which is the argument for removing reliance on user judgement (ABNORMAL-VALVOLINE-2026)"
  human_checkpoints:
    - "Analysts still handle reports and dashboards; the security team uses the dashboard to identify attack trends (ABNORMAL-VALVOLINE-2026)"
  role_evolution: "Analyst time moves away from manual investigation and remediation to other tasks (ABNORMAL-VALVOLINE-2026)."
  evidence_grade: B
  sources:
    - { ref: ABNORMAL-VALVOLINE-2026, title: "Valvoline Replaces SEG with Autonomous AI to Stop Evolving Threats", publisher: Abnormal AI, type: vendor, url: "https://abnormal.ai/customers/stories/valvoline", date: 2026, access: full, locator: "Headline metrics; challenge; results quotes" }
    - { ref: ADAPTIVE-BLOG-2026, title: "Adaptive Security blog index", publisher: Adaptive Security, type: vendor, url: "https://www.adaptivesecurity.com/blog", date: 2026-08-26, access: full, locator: "Listings dated 2026-04-16 and 2026-08-26" }
    - { ref: ADAPTIVE-HOME-2026, title: "Adaptive Security homepage", publisher: Adaptive Security, type: vendor, url: "https://www.adaptivesecurity.com/", date: 2026-10-15, access: full, locator: "Agentic Email Security description" }
  last_reviewed: 2026-10-17
  notes: "Merged from deep-dive 08 (graded A there) and deep-dive 09 (post-delivery agentic re-analysis, C). Graded B under the 2026-10-17 rule: the USD 600K is a loss-avoided estimate with no method, and the 480 hours sits beside the director's recollection of analyst time; both kept as vendor-published. Valvoline page is undated; the year reflects only the page footer. Adaptive: only titles and product summaries were read."

- id: security-human-risk-09
