- id: security-cloud-infrastructure-22
  title: "Shared security AI platform team on which each security function builds governed agents"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Each security function (detection and response, threat intelligence, vulnerability management, red team, GRC,
    continuous monitoring) wants agents, and Databricks lists high-risk workflows such as offensive personas, untrusted
    inputs, sensitive data, production access and automated tool execution (DATABRICKS-JOB-AGENTICSEC-2026).
  solution: >-
    Databricks advertises a horizontal Agentic Security Engineering team that owns the shared platform on which security
    functions build, deploy and run governed AI personas, covering agent identity, isolation and sandboxing, policy
    enforcement, auditability, evaluation and orchestration (DATABRICKS-JOB-AGENTICSEC-2026). CrowdStrike sells the same
    idea as Charlotte AI AgentWorks: agents bounded in scope, versioned, role-governed, cost-capped and traceable
    (CROWDSTRIKE-AGENTWORKS-2026). Robinhood's security engineering posting splits AI work into securing its AI
    infrastructure and building AI platforms that improve detection fidelity and coverage (ROBINHOOD-JOB-SECENG-2026);
    Block's platform-security posting asks for integrations with CSPM and DSPM tools to surface and prioritise findings
    (BLOCK-JOB-PLATSEC-2026).
  outcomes:
    - lever: capacity
      description: "No figure for Databricks; CrowdStrike cites an unnamed analyst's comparison of agent build time"
      figure: "6-8 hours in Microsoft Copilot vs 4 minutes in AgentWorks"
      measures: "one analyst's comparison of the time to build the same agent, as quoted by CrowdStrike; analyst and organisation not named"
      provenance: vendor-published
      source_ref: CROWDSTRIKE-AGENTWORKS-2026
  prerequisites:
    - "Platform engineers experienced in agent identity, sandboxing and policy enforcement, and named AI champions in each security function (DATABRICKS-JOB-AGENTICSEC-2026)"
    - "Evaluation datasets to benchmark agent versions before promotion (CROWDSTRIKE-AGENTWORKS-2026)"
  risks_and_guardrails:
    - "Pegasystems' senior director of corporate security operations is quoted saying governance means agents that are testable, traceable, capped and versioned (CROWDSTRIKE-AGENTWORKS-2026)."
    - "The platform owns guardrails and domain teams own the business outcomes of their personas (DATABRICKS-JOB-AGENTICSEC-2026)."
  human_checkpoints:
    - "Domain teams own the outcomes of the agents they build; the platform team owns guardrails (DATABRICKS-JOB-AGENTICSEC-2026)"
  role_evolution: >-
    Security engineers become builders and supervisors of agents: Databricks hires platform architects to serve security
    functions (DATABRICKS-JOB-AGENTICSEC-2026); Block's posting asks for fluency with agentic coding tools in real
    production work (BLOCK-JOB-PLATSEC-2026); Robinhood and Cloudflare postings list AI use among requirements
    (ROBINHOOD-JOB-SECENG-2026; CLOUDFLARE-JOB-VM-2026).
  evidence_grade: B
  sources:
    - {ref: DATABRICKS-JOB-AGENTICSEC-2026, title: "Sr. Staff Security Software Engineer - Agentic Security Engineering", publisher: "Databricks (Greenhouse job board)", type: job-posting, url: "https://databricks.com/company/careers/open-positions/job?gh_jid=8612865002", date: "2026-10-12", access: full, locator: "Team description and responsibilities"}
    - {ref: CROWDSTRIKE-AGENTWORKS-2026, title: "How AI-leading Security Teams Are Building the Agentic SOC", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/how-ai-leading-security-teams-are-building-the-agentic-soc/", date: "2026-07-06", access: full, locator: "'The AgentWorks Advantage'; customer quotes"}
    - {ref: ROBINHOOD-JOB-SECENG-2026, title: "Senior Staff Security Engineer, Security Engineering", publisher: "Robinhood (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/robinhood/jobs/8167616", date: "2026-09-01", access: full, locator: "Opening paragraph and responsibilities"}
    - {ref: BLOCK-JOB-PLATSEC-2026, title: "Senior Security Engineer, Platform Security", publisher: "Block (Greenhouse job board)", type: job-posting, url: "http://block.xyz/careers/jobs/5231316008?gh_jid=5231316008", date: "2026-06-02", access: full, locator: "Responsibilities and requirements (careers page timed out; read through the Greenhouse boards API)"}
    - {ref: CLOUDFLARE-JOB-VM-2026, title: "Vulnerability Management Engineer", publisher: "Cloudflare (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/7579269?gh_jid=7579269", date: "2026-02-05", access: full, locator: "Responsibilities and requirements"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B: Databricks describes its own team in a job posting (a named organisation's real set-up), with no
    outcomes; borderline, because a posting shows intent and structure rather than use. Maturity piloting is a
    judgment. The scope is wider than cloud-infrastructure. Related: security-application-security-17 (security team
    rebuilt around its own AI skills and agents), security-operations-18 and -23.

- id: security-cloud-infrastructure-23
