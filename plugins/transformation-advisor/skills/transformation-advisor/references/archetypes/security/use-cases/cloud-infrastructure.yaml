- id: security-cloud-infrastructure-18
  title: "LLM-assisted cloud detection engineering and telemetry analysis, with rule-quality testing that catches hallucinated fields"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, research-synthesis, review-assurance]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Detection engineers must write and maintain rules across cloud, endpoint and identity telemetry as threats change
    (WIZ-JOB-CLOUDDET-2025). A Sigma rule for AWS IAM privilege escalation sat in a production SIEM for nine months
    without firing because it referenced a CloudTrail field that does not exist (FWDCLOUDSEC-GOWTHAM-2026).
  solution: >-
    A Wiz posting for a cloud threat detection researcher lists using AI and LLM-driven tools to enhance detection
    generation and telemetry analysis (WIZ-JOB-CLOUDDET-2025); a Cloudflare network security engineer posting lists
    generative AI for log analysis and root-cause analysis during incidents (CLOUDFLARE-JOB-NETSEC-2026). A Meta threat
    detection engineer (per the speaker biography) ran an open-source analyser over public cloud rules, checking field
    names against 400+ validated CloudTrail log schemas, testing logic against realistic attack variants and flagging
    hallucinated fields in AI-generated rules (FWDCLOUDSEC-GOWTHAM-2026).
  outcomes:
    - lever: quality
      description: "Cloud detection rules with significant quality defects in two public repositories"
      figure: "1 in 3"
      measures: "speaker's abstract: more than 2,000 cloud detection rules across SigmaHQ and Elastic, 'significant quality defects' as defined by the tool; not independently reproduced"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-GOWTHAM-2026
  prerequisites:
    - "Detection rules kept as code, validated log schemas for each cloud log source and test events for realistic attack variants (FWDCLOUDSEC-GOWTHAM-2026)"
    - "Review and testing of generated detections before release"
  risks_and_guardrails:
    - "The abstract names logic that misses 80% of realistic attack variants and invented fields in AI-generated rules as defect classes, so AI-written rules need the same tests as human-written ones (FWDCLOUDSEC-GOWTHAM-2026)."
    - "Pinterest's security operations posting asks engineers to apply AI while defining validation, data-handling and accountability practices (PINTEREST-JOB-SECOPS-2026)."
    - "Log content fed to an AI analyst is attacker-controlled input (ARXIV-2605.24421)."
  human_checkpoints:
    - "Detection researchers own and review rules (WIZ-JOB-CLOUDDET-2025)"
  role_evolution: >-
    The Wiz posting makes LLM tool use part of the researcher's job (WIZ-JOB-CLOUDDET-2025), and detection engineering
    borrows application-code testing discipline for rules (FWDCLOUDSEC-GOWTHAM-2026).
  evidence_grade: C
  sources:
    - {ref: WIZ-JOB-CLOUDDET-2025, title: "Threat Detection Researcher (Cloud) (Greenhouse first_published 2025-06-08; version read updated 2026-08-19)", publisher: "Wiz (Greenhouse job board)", type: job-posting, url: "https://www.wiz.io/careers/job/4566780006/:title?gh_jid=4566780006", date: "2025-06-08", access: full, locator: "Responsibilities list"}
    - {ref: CLOUDFLARE-JOB-NETSEC-2026, title: "Network Security Engineer", publisher: "Cloudflare (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8081027?gh_jid=8081027", date: "2026-07-24", access: full, locator: "Responsibilities: generative AI for log analysis and root-cause analysis"}
    - {ref: FWDCLOUDSEC-GOWTHAM-2026, title: "Schrodinger's Detection: Finding the 'Zombie' Rules in Your SIEM (Gowthamaraj Rajendran, Meta)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/7LUWPZ/", date: "2026-06-02", access: full, locator: "Abstract (talk not viewed)"}
    - {ref: PINTEREST-JOB-SECOPS-2026, title: "Sr. Security Software Engineer, Security Operations", publisher: "Pinterest (Greenhouse job board)", type: job-posting, url: "https://www.pinterestcareers.com/jobs/?gh_jid=8230778", date: "2026-10-01", access: full, locator: "Responsibilities (careers page blocked; read through the Greenhouse boards API)"}
    - {ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: "arXiv (Pandey, Bhujang)", type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 14 and discourse 12. Grade C: job postings show intent, not results, and the rule audit is a
    conference abstract whose analyser is a static tool (the AI link is the defect class of AI-generated rules); the
    abstract does not say Meta ran the audit. Related: security-operations-15 (AI drafts and scores detection rules) and
    -16 (coding agents validate detections end to end).

- id: security-cloud-infrastructure-19
  title: "Idea: agents run attack simulations in sandbox cloud accounts to build an empirical telemetry-to-technique map for detection"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [research-synthesis, software-systems]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Cloud detection engineering is hobbled by poor telemetry documentation and vague, static mappings from log entries to
    MITRE techniques (FWDCLOUDSEC-GABBAY-2025).
  solution: >-
    Autonomous agents take high-level objectives, break them into API call graphs and run them in sandbox accounts on
    AWS, Azure and GCP using real APIs; the system records which telemetry actually fires and builds a queryable
    knowledge base of log-to-technique mappings with context on signal fidelity, timing and trigger conditions, wrapped
    in an MCP server (FWDCLOUDSEC-GABBAY-2025).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "the abstract describes the design only"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-GABBAY-2025
  prerequisites:
    - "Disposable sandbox accounts in each cloud, full log pipelines and a technique taxonomy to map to"
  risks_and_guardrails:
    - "The agents call real cloud APIs, so sandbox containment matters; see security-ai-security-10."
  human_checkpoints:
    - "Detection engineers consume and curate the knowledge base; the abstract does not describe review steps (FWDCLOUDSEC-GABBAY-2025)"
  role_evolution: >-
    Detection engineers would work from empirical coverage maps rather than static mappings (FWDCLOUDSEC-GABBAY-2025).
  evidence_grade: D
  sources:
    - {ref: FWDCLOUDSEC-GABBAY-2025, title: "Connecting the Cloud-Dots: Constructing a Knowledge Layer from Autonomous Attack Simulation (Itay Gabbay)", publisher: "fwd:cloudsec Europe 2025", type: conference, url: "https://pretalx.com/fwd-cloudsec-europe-2025/talk/FFQZDF/", date: "2025-09-15", access: full, locator: "Abstract (talk not viewed)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: from discourse 10; a research system presented at fwd:cloudsec Europe 2025, no deployment or outcome found.
    Pattern 'other': agent-run simulation that produces a knowledge base. Confluent's non-AI attack-simulation programme
    on Datadog's Threatest (2026 North America schedule) is related practice.

- id: security-cloud-infrastructure-20
  title: "Idea: cloud canaries and deception to detect and steer autonomous AI attackers"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Frontier agents can chain reconnaissance, privilege escalation, lateral movement, exfiltration and persistence in the
    cloud; benchmarking them by compromise rate alone says little about whether defenders can see them
    (FWDCLOUDSEC-BRUCATO-2026).
  solution: >-
    Brucato's lab scored 10 models across 599 autonomous attack runs in a deliberately hard AWS environment, with cloud
    canaries deployed or not and agents told or not told that deception might be present; scoring covers effectiveness
    and detectability, and the abstract says autonomous attackers can be influenced (FWDCLOUDSEC-BRUCATO-2026). CSA
    summit participants listed exposure reduction, deception technology and security boundaries as responses
    (CSA-AISTORM-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published (results are not in the abstract)"
      measures: "the abstract states 10 models and 599 runs; results not given"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-BRUCATO-2026
  prerequisites:
    - "Canary tokens or decoy resources in cloud accounts, with alerting wired to the detection pipeline"
  risks_and_guardrails:
    - "Results depend on guardrails, prompting strategy and inference framework, which the talk says it will discuss (FWDCLOUDSEC-BRUCATO-2026)."
  human_checkpoints:
    - "Canary hits go to the normal detection and response queue; the abstract does not describe review steps"
  role_evolution: >-
    No source describes a role change; the abstract argues that benchmarks of AI attackers should measure detectability
    and behaviour, not only compromise rates (FWDCLOUDSEC-BRUCATO-2026).
  evidence_grade: D
  sources:
    - {ref: FWDCLOUDSEC-BRUCATO-2026, title: "Lessons from benchmarking AI attackers in AWS (Alessandro Brucato, Tracebit)", publisher: "fwd:cloudsec Europe 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-europe-2026/talk/ZAWFW7/", date: "2026-09-08", access: full, locator: "Abstract (talk not viewed)"}
    - {ref: CSA-AISTORM-2026, title: "AI Security Through the CISO Lens: Insights from the AI Storm Summit Series", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/artifacts/ai-security-through-the-ciso-lens", date: "2026-07-28", access: full, locator: "'Event-specific themes', Washington, D.C. breakout"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: from discourse 11; benchmark design and a discussed response, no results or deployment found. The speaker works
    at Tracebit, a deception vendor. Practice routed the same talk to identity-access and ai-security.

