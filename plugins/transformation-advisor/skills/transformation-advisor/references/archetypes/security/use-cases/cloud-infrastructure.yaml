- id: security-cloud-infrastructure-06
  title: "Remediation agent finds the owner, root cause and fix layer, then drafts the ticket, pull request or remediation plan"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, coordination-scheduling, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Security teams find a vulnerability but often do not know who pushed the code or owns the resource, and a CVE
    advisory does not say whether to patch the instance, update the base image, fix the Dockerfile or change the
    Terraform template; Wiz says routing can take longer than the fix (WIZ-PILLAR2-2026). La Centrale's three-person
    security team had to correlate network exposure, IAM permissions and data sensitivity by hand (WIZ-LACENTRALE-2026).
  solution: >-
    Wiz's Green Agent suggests an owner from a service catalog, project and resource tags, cloud event logs, CODEOWNERS
    and git blame (WIZ-PILLAR2-2026), traces an issue to its root cause, returns a Remediate or Ignore verdict with a
    confidence score and drafts CLI, Terraform or Kubernetes changes; steps that could affect availability are marked
    Suggested or Optional with restore instructions, and teams can open pull requests or hand the fix to a coding agent
    (WIZ-GREEN-2026; WIZ-OPMODEL-2026). Orca's Green Pod works out who owns a finding and drafts the fix in the team's usual format
    (ORCA-AGENTPODS-2026). CrowdStrike announced AI-enhanced remediation plans in Falcon Cloud Security with time
    estimates, confidence indicators, permission needs and a validation check (CROWDSTRIKE-CLOUDREM-2026). La Centrale is
    running a proof of concept to automate Jira ticket generation with tailored remediation blueprints
    (WIZ-LACENTRALE-2026).
  outcomes:
    - lever: speed
      description: "project44 reports faster remediation after adopting the Wiz Red and Green Agents with Wiz Code"
      figure: "10x faster vulnerability remediation"
      measures: "headline in Wiz's project44 case study; baseline, period and metric definition not stated; the figure cannot be split between the Red Agent, Green Agent and Wiz Code"
      provenance: vendor-published
      source_ref: WIZ-PROJECT44-2026
    - lever: speed
      description: "Rogo AI's product security engineer says the agent surfaces the owner automatically, replacing a lookup of resource changes in their SIEM"
      figure: "none published"
      measures: "qualitative customer quote in a vendor blog; no time, count or error rate"
      provenance: vendor-published
      source_ref: WIZ-PILLAR2-2026
  prerequisites:
    - "Ownership data: tags, code-to-cloud mapping, service catalog, CODEOWNERS or CMDB, and cloud event logs for creator attribution (WIZ-PILLAR2-2026; WIZ-WORKFLOWS-2026)"
    - "Source repositories and ticketing connected to the platform"
    - "Engineering buy-in: project44 ran an engineering-wide enablement session on fixing findings with the platform (WIZ-PROJECT44-2026)"
  risks_and_guardrails:
    - "Wrong-owner routing and unsafe fix suggestions; Wiz publishes no error rates. Tamnoon argues that fix safety needs usage evidence, for example live HTTP traffic before enforcing HTTPS on a bucket (TAMNOON-REMEDIATION-2026)."
    - "Wiz says teams can set, per workflow, whether agents make routine remediations autonomously or need human approval on sensitive systems (WIZ-FORGOV-2026)."
    - "Remediation steps can go straight to developers or their coding agent, so the review burden moves to the owning engineering team (WIZ-OPMODEL-2026)."
  human_checkpoints:
    - "Teams assign the issue to the suggested owner and choose whether to open a pull request or send the fix to a coding agent (WIZ-GREEN-2026)"
    - "Approval for changes on sensitive systems (WIZ-FORGOV-2026)"
  role_evolution: >-
    project44's security operations manager compares the Green Agent to the velocity AI gave engineers, and the team
    treats engineers as the people who fix rather than validate (WIZ-PROJECT44-2026). Wiz positions the agent so
    engineers outside security can act on findings (WIZ-GREEN-2026).
  evidence_grade: B
  sources:
    - {ref: WIZ-GREEN-2026, title: "Introducing the Green Agent: AI-Powered Remediation for the Cloud", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/introducing-wiz-green-agent", date: "2026-03-26", access: full, locator: "'Remediation at Machine Speed with the Green Agent'; 'From Issue to Action'"}
    - {ref: WIZ-PILLAR2-2026, title: "AI Threat Readiness Pillar 2: Accelerate Patching and Response", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/ai-threat-readiness-pillar-2", date: "2026-06-09", access: full, locator: "'Why Accelerating Patching and Response is Crucial'; 'Expedite Response with Unified Ownership' (ownership sources; Rogo AI quote)"}
    - {ref: WIZ-PROJECT44-2026, title: "project44 Accelerates Cloud Remediation and Security Operations with Wiz AI Agents (customer story; page undated, retrieved 2026-10-17)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/customers/project44", date: "2026", access: full, locator: "Results; 'Scaling Secure Development with the Green Agent'"}
    - {ref: WIZ-LACENTRALE-2026, title: "From Alert Overload to Developer Ownership: How La Centrale Built a Top-Ranked Cloud Security Culture (customer story; page undated, retrieved 2026-10-17)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/customers/lacentrale", date: "2026", access: full, locator: "Section on AI triage and Green Agent proof of concept"}
    - {ref: WIZ-OPMODEL-2026, title: "Build AI Threat Readiness with Wiz", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/wiz-ai-threat-readiness-operating-model", date: "2026-05-27", access: full, locator: "Pillar 2, 'Fix fast with the Wiz Green Agent'"}
    - {ref: ORCA-AGENTPODS-2026, title: "An Inside Look at Orca AI Agent Pods", publisher: "Orca Security", type: vendor, url: "https://orca.security/resources/blog/an-inside-look-at-orca-ai-agent-pods/", date: "2026-08-06", access: full, locator: "'Green Pod: The Path to Resolution'"}
    - {ref: CROWDSTRIKE-CLOUDREM-2026, title: "New in Falcon Cloud Security: Third-Party App Insights and AI-Enhanced Remediation", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/falcon-cloud-security-third-party-app-insights-ai-enhanced-remedation/", date: "2026-10-05", access: full, locator: "'AI-Enhanced Remediation Plans for Cloud Risks'"}
    - {ref: WIZ-FORGOV-2026, title: "Wiz AI Agents for FedRAMP High: Accelerate Public Sector AI (Securing the Mission at Machine Speed)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/wiz-for-gov-agents-fedramp", date: "2026-10-14", access: full, locator: "'Introducing Wiz AI Agents in Wiz for Gov'"}
    - {ref: WIZ-WORKFLOWS-2026, title: "Introducing Wiz Workflows: Build a Self-Healing Cloud", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/introducing-wiz-workflows", date: "2026-03-25", access: full, locator: "Section on ownership routing"}
    - {ref: TAMNOON-REMEDIATION-2026, title: "AI Cloud Remediation in 5 Stages, Including the Stage That Says No", publisher: "Tamnoon", type: vendor, url: "https://www.tamnoon.io/blog/how-agentic-cloud-remediation-actually-works-in-5-stages", date: "2026-04-30", access: full, locator: "'Stage 3: Investigation And Safety Assessment'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 03 and discourse 04, plus CrowdStrike's remediation plans from practice 12. Grade B: named users
    (project44, Rogo AI, La Centrale's proof of concept) without a separable measurement; vendor-authored throughout. La
    Centrale's fall in critical open vulnerabilities comes from graph context and ownership routing, not the Green Agent,
    so it is not claimed. The Red Agent part of project44's figure belongs with security-vulnerability-exposure-21.
    Related: security-application-security-12 (AI-drafted fixes delivered as reviewable changes).

- id: security-cloud-infrastructure-07
  title: "Evidence-gated automated remediation of cloud misconfigurations: safe fixes run, risky ones wait for approval, unsafe ones go to the owner"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Tamnoon, citing its own research, says teams investigate about 4% of the alerts their tools generate, under 1%
    result in a confirmed fix, critical misconfigurations sit unresolved for an average of 128 days and the backlog grows
    by nearly 40% a year (TAMNOON-REMEDIATION-2026). Speakers at fwd:cloudsec Europe 2026 say most cloud security teams
    have solved visibility and fixing at scale was the real problem (FWDCLOUDSEC-ALONSO-2026). ENISA names an 'Authority
    Gap': human change boards cannot authorise a fix in the minutes available against autonomous exploits
    (ENISA-FRONTIER-2026).
  solution: >-
    Tamnoon de-duplicates findings from several scanners into initiatives, runs read-only automations against cloud APIs
    to learn usage, ownership and dependencies, and scores each finding SAFE, RISKY or UNSAFE: SAFE fixes run from
    parameterised playbooks, RISKY ones wait for human approval, UNSAFE ones go to the owning team with context, and
    guardrails such as service control policies and policy as code follow (TAMNOON-REMEDIATION-2026). Practitioners from
    Crossmint and Flywire say they built custom multi-cloud auto-remediation with simple rules for what is safe to fix
    automatically (FWDCLOUDSEC-ALONSO-2026). Research encodes change rules (maintenance windows, staged rollouts,
    blast-radius limits, approval gates) as executable policy and has the agent score candidate plans for policy-violation
    risk before acting (USENIX-PATCHWEAVER-2026).
  outcomes:
    - lever: risk
      description: "PatchWeaver research prototype: fewer change-policy violations than a standard toolchain"
      figure: "4.73% vs 9.95% step-level violations (52.5% fewer)"
      measures: "step-level change-policy violations across four Kubernetes remediation workloads in the authors' setup, versus a Gatekeeper + Argo Rollouts + Cosign baseline; no production result"
      provenance: independent
      source_ref: USENIX-PATCHWEAVER-2026
    - lever: risk
      description: "PatchWeaver: worst-case violations versus an LLM-agent baseline"
      figure: "16.8% vs 51.3% p99 episode violations"
      measures: "p99 episode-level policy violations over the same four workloads, versus an LLM-agent baseline"
      provenance: independent
      source_ref: USENIX-PATCHWEAVER-2026
    - lever: speed
      description: "Baseline the approach targets: time critical cloud misconfigurations stay unresolved (no post-adoption result published)"
      figure: "128 days on average (baseline)"
      measures: "Tamnoon's State of Cloud Remediation 2025 as cited on its blog; sample and period not given. Its 2026 report, as cited on another Tamnoon post, says critical alerts stay unresolved for 150 days (TAMNOON-CORTEX-2026)"
      provenance: vendor-published
      source_ref: TAMNOON-REMEDIATION-2026
  prerequisites:
    - "Read-only API access to production accounts for usage evidence such as 90-day activity, CloudTrail and VPC Flow Logs (TAMNOON-REMEDIATION-2026)"
    - "Tested playbooks, an approval workflow and a guardrail layer that stops the same misconfiguration returning"
    - "Change rules expressed as executable predicates, and a refreshed graph of assets, dependencies and approvals (USENIX-PATCHWEAVER-2026)"
  risks_and_guardrails:
    - "Fear of breaking production is the main reason remediation stalls, per Tamnoon: in its illustration one of several buckets with the same HTTPS finding had 45 active HTTP calls in 90 days and was scored UNSAFE (TAMNOON-REMEDIATION-2026)."
    - "The Financial Times, as relayed by Tom's Hardware, reported a 13-hour December 2025 disruption of one service in parts of mainland China after an AI coding tool decided to erase the environment it was working on; the agents held the engineers' permissions and no second approval was needed. Amazon said it was user error, not AI error (TOMSHW-AWSKIRO-2026)."
    - "ENISA says critical providers may be forced into autonomous patching, at the risk of automated updates breaking systems, and verifying AI-generated patches may become a bottleneck (ENISA-FRONTIER-2026)."
    - "Joint agency guidance recommends human approval for high-stakes actions (CISA-AGENTIC-2026)."
    - "CSA summit participants could not agree where human review must sit for production remediation ('governance in the loop' versus 'human in the loop') (CSA-AISTORM-2026)."
  human_checkpoints:
    - "Human approval for RISKY findings; UNSAFE findings routed to the owner with context (TAMNOON-REMEDIATION-2026)"
    - "High-impact or irreversible actions go to a person (CISA-AGENTIC-2026)"
  role_evolution: >-
    Tamnoon splits work between its AI agent (investigation and operations) and human experts it calls CloudPros
    (judgment calls and high-risk approvals) (TAMNOON-REMEDIATION-2026). ENISA asks for human-gated AI workflows and
    upskilling (ENISA-FRONTIER-2026).
  evidence_grade: C
  sources:
    - {ref: TAMNOON-REMEDIATION-2026, title: "AI Cloud Remediation in 5 Stages, Including the Stage That Says No", publisher: "Tamnoon", type: vendor, url: "https://www.tamnoon.io/blog/how-agentic-cloud-remediation-actually-works-in-5-stages", date: "2026-04-30", access: full, locator: "Opening paragraphs; workflow table; 'Stage 3'; 'What This Looks Like In Practice'"}
    - {ref: TAMNOON-CORTEX-2026, title: "CDR and CNAPP Remediation: Fixing Findings Across Cortex Cloud's Unified View", publisher: "Tamnoon", type: vendor, url: "https://tamnoon.io/blog/cdr-and-cnapp-remediation/", date: "2026-06-22", access: full, locator: "State of Cloud Remediation 2026 citation"}
    - {ref: FWDCLOUDSEC-ALONSO-2026, title: "Closing the Loop: Auto-Remediation for the Cloud You Actually Run (Andoni Alonso, Crossmint, and Samuel Burgos, Flywire)", publisher: "fwd:cloudsec Europe 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-europe-2026/talk/97RAN3/", date: "2026-09-08", access: full, locator: "Abstract (talk not viewed)"}
    - {ref: USENIX-PATCHWEAVER-2026, title: "PatchWeaver: Risk-Bounded Autonomous Vulnerability Remediation Under Change-Management Policies (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/li-rui", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: ENISA-FRONTIER-2026, title: "ENISA's view on Cybersecurity in the Frontier AI Era", publisher: "ENISA", type: regulator, url: "https://www.enisa.europa.eu/sites/default/files/2026-07/ENISA%20view%20on%20cybersecurity%20in%20the%20frontier%20AI%20era_en_0.pdf", date: "2026-07-07", access: full, locator: "pp.6, 8-9 ('Authority Gap'), 11"}
    - {ref: TOMSHW-AWSKIRO-2026, title: "AWS outages caused by AI coding bot blunder, report claims", publisher: "Tom's Hardware (relaying the Financial Times)", type: press, url: "https://www.tomshardware.com/tech-industry/artificial-intelligence/multiple-aws-outages-caused-by-ai-coding-bot-blunder-report-claims-amazon-says-both-incidents-were-user-error", date: "2026-02-20", access: full, locator: "Body, paragraphs 2 to 5 and final paragraphs"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "NCSC-NZ copy of the PDF; 'Oversight mechanisms' (PDF p.15); 'Operating agentic AI securely' (PDF p.18)"}
    - {ref: CSA-AISTORM-2026, title: "AI Security Through the CISO Lens: Insights from the AI Storm Summit Series", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/artifacts/ai-security-through-the-ciso-lens", date: "2026-07-28", access: full, locator: "'The human-in-the-loop question'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: discourse 05 (Tamnoon, Crossmint and Flywire) and governance 06 (idea: policy-bounded autonomous remediation).
    Grade C: a vendor's method description with no named customer, a conference abstract and a peer-reviewed prototype
    (two authors at Dawn Computing). Maturity piloting: the Crossmint and Flywire speakers say they built their own
    auto-remediation, but the abstract does not say which employer runs it. Related: security-vulnerability-exposure-16
    (estate-wide agentic patching, idea) and security-incident-response-11 (guardrailed containment playbooks).

