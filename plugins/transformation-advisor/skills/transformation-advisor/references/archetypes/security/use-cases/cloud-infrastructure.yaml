  maturity: announced
  problem: >-
    Managed service providers juggle fragmented consoles, client policies and scattered visibility, which slows their
    response as client estates grow (WIZ-MSP-2026).
  solution: >-
    Wiz announced an MSP programme on 2026-09-28 with centralised multi-tenant management, just-in-time provisioning and
    portfolio-level dashboards on its AI Application Protection Platform; partners quoted include Optiv, SEP2 and Deloitte
    (WIZ-MSP-2026). Wiz also launched an integration so Wiz Defend and its Blue Agent analysis appear inside Google
    Security Operations cases (WIZ-DEFENDGSO-2026).
  outcomes:
    - lever: growth
      description: "none published"
      figure: "none published"
      measures: "programme announcement with partner quotes; no results"
      provenance: vendor-published
      source_ref: WIZ-MSP-2026
  prerequisites:
