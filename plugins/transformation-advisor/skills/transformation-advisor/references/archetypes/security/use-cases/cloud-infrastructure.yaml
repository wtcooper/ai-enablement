    - {ref: WIZ-DEFENDGSO-2026, title: "Wiz Defend & Google Security Operations Integration", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/wiz-defend-and-google-security-operations", date: "2026-09-15", access: full, locator: "'Accelerate Google Security Operations investigations with Blue Agent analysis'"}
  last_reviewed: "2026-10-17"
  notes: >-
    A service-model change not yet evidenced by a provider's published results. Related: security-operations-22 (MDR
