# Security archetype, cloud-infrastructure module: use cases (wave 4 synthesis, 2026-10-17).
# Merged from the practice, discourse and governance deep dives in research/runs/wave4/.
# Agent containment, agent identity and agent action logging live in ai-security (security-ai-security-06, -10, -12);
# the Wiz Red Agent perimeter agent lives in security-vulnerability-exposure-21; AWS Security Agent in
# security-vulnerability-exposure-17; calibrated endpoint-triage classifiers in security-operations-06.

# ---------------------------------------------------------------------------------------------------------------
# Area 1: posture assessment and prioritisation
# ---------------------------------------------------------------------------------------------------------------

- id: security-cloud-infrastructure-01
  title: "Rank cloud posture findings by reachability, permissions and data access, with agent-explained fix-first plans"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [review-assurance, data-reporting, expert-judgment]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Cloud security tools raise more severity-rated findings than engineers can fix, and many have no route to harm on
    their own. Wiz says treating every isolated alert with equal urgency spends engineering effort on theoretical risk
    (WIZ-CLOUDRISK-2026). Tamnoon, citing its own research, says teams investigate about 4% of the alerts their tools
    generate (TAMNOON-REMEDIATION-2026). Rule-based posture tools (CSPM, cloud security posture management) produce
    many false positives from limited context (ARXIV-2508.12584).
  solution: >-
    Platforms combine external reachability, toxic permission combinations and sensitive-data access into attack paths
    and keep the findings that complete a path (WIZ-CLOUDRISK-2026). Microsoft's Posture Prioritization Agent (Project
    Perception, invitation-only limited public preview) ingests cloud and device posture findings and produces a ranked,
    explained action plan, including a threat-driven mode that maps a threat to posture findings (MSFT-LEARN-PPA-2026).
    SACR describes the next step as runtime exposure management, asking whether a component is loaded, reachable and
    exercisable given current identity and network context (SACR-ACSP-2026). CSA summit participants described
    multi-stage validation that requires confirmed exploitability before a finding goes to engineering (CSA-AISTORM-2026).
    Research adds a model that filters rule-based scanner output (ARXIV-2601.14595).
  outcomes:
    - lever: quality
      description: "Share of initial high-priority findings removed once reachability, toxic permission combinations and sensitive-data access were applied"
      figure: "more than half of initial findings, across four risk categories"
      measures: "Wiz Research before/after comparison of high-priority alerts across enterprise environments; per-category counts and customer sample are in the full report, not the blog; graph-based context, not a language-model agent"
      provenance: vendor-published
      source_ref: WIZ-CLOUDRISK-2026
    - lever: quality
      description: "Neural filtering of infrastructure-as-code security-smell findings (IntelliSA research prototype)"
      figure: "F1 83%; outperforms baselines by 7-42%"
      measures: "F1 on a human-labelled dataset of 241 security smells in 11,814 lines of real-world IaC, versus two static analysers and three LLM baselines (abstract)"
      provenance: independent
      source_ref: ARXIV-2601.14595
    - lever: quality
      description: "Active behavioural probing of CSPM alerts (scripted probes, not a language model; adjacent evidence)"
      figure: "93% average false-positive reduction"
      measures: "average reduction in false-positive rate across misconfiguration and vulnerability alerts in a reproducible AWS test setup (abstract)"
      provenance: independent
      source_ref: ARXIV-2508.12584
  prerequisites:
    - "Connected inventory of cloud accounts, identities, network paths and data stores, in a graph or equivalent"
    - "A written definition of an exploitable path that engineering accepts"
    - "For Microsoft's preview agent: Microsoft 365 E5 among other prerequisites (MSFT-LEARN-PPA-2026)"
  risks_and_guardrails:
    - "Wiz both sells the context filter and reports its value; the blog gives no count of removed findings that later proved exploitable, and no independent measurement was found (WIZ-CLOUDRISK-2026)."
    - "In preview the Microsoft agent is read-only (MSFT-LEARN-PPA-2026)."
    - "AWS's Deception Benchmark found models flagged code next to a Kubernetes NetworkPolicy that made it unexploitable, and none kept both false positives and false negatives under 10%; it tests code, not posture findings, so treat it as a caution about environment-aware reasoning (AWS-DECEPTION-2026)."
    - "Latio's founder calls runtime-first designs 'the patchwork thing' and argues for posture and blast-radius limits instead (RESILIENTCYBER-LATIO-2026)."
    - "Filtering studies report scores on test sets, not miss rates in production (ARXIV-2601.14595)."
  human_checkpoints:
    - "Findings reach engineering only after a multi-stage validation pipeline confirms exploitability (CSA-AISTORM-2026)"
    - "The agent produces a plan; people decide and act (MSFT-LEARN-PPA-2026)"
  role_evolution: >-
    SACR frames success as measurable reductions in exposure, investigation time and recurring remediation work
    (SACR-ACSP-2026). Microsoft says its agent gives the rationale, evidence and impact of not acting so teams can justify
    priorities to stakeholders (MSFT-LEARN-PPA-2026).
  evidence_grade: C
  sources:
    - {ref: WIZ-CLOUDRISK-2026, title: "Report Recap: State of Cloud Risk 2026", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/cloud-risk-report-2026", date: "2026-08-26", access: full, locator: "'The Context Filter: Turning Alerts Into Action'"}
    - {ref: MSFT-LEARN-PPA-2026, title: "Posture Prioritization Agent (Project Perception, limited public preview)", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/security/agentic-security/posture-prioritization-agent", date: "2026-08-03", access: full, locator: "Introduction; 'Scenarios'; 'Preview scope and limitations'"}
    - {ref: SACR-ACSP-2026, title: "Introducing a New Cloud Security Category: Agentic Cloud Security Platforms (ACSP)", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/introducing-a-new-cloud-security", date: "2026-06-11", access: full, locator: "'Key Takeaways From The Report'; 'Runtime exposure management replaces ranked risk lists'"}
    - {ref: CSA-AISTORM-2026, title: "AI Security Through the CISO Lens: Insights from the AI Storm Summit Series", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/artifacts/ai-security-through-the-ciso-lens", date: "2026-07-28", access: full, locator: "'Common themes', first theme"}
    - {ref: TAMNOON-REMEDIATION-2026, title: "AI Cloud Remediation in 5 Stages, Including the Stage That Says No", publisher: "Tamnoon", type: vendor, url: "https://www.tamnoon.io/blog/how-agentic-cloud-remediation-actually-works-in-5-stages", date: "2026-04-30", access: full, locator: "Opening paragraphs"}
    - {ref: ARXIV-2601.14595, title: "IntelliSA: An Intelligent Static Analyzer for IaC Security Smell Detection Using Symbolic Rules and Neural Inference (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2601.14595", date: "2026-01-21", access: full, locator: "Abstract"}
    - {ref: ARXIV-2508.12584, title: "Reducing False Positives with Active Behavioral Analysis for Cloud Security (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2508.12584", date: "2025-08-18", access: full, locator: "Abstract"}
    - {ref: AWS-DECEPTION-2026, title: "The state of AI for security: Measuring what matters most for building trust (Deception Benchmark)", publisher: "AWS Security Blog", type: vendor, url: "https://aws.amazon.com/blogs/security/the-state-of-ai-for-security-measuring-what-matters-most-for-building-trust/", date: "2026-09-09", access: full, locator: "Results paragraph"}
    - {ref: RESILIENTCYBER-LATIO-2026, title: "The AI Security Market Moves to the Endpoint (podcast with James Berthoty of Latio)", publisher: "Resilient Cyber (Chris Hughes)", type: podcast, url: "https://www.resilientcyber.io/p/the-ai-security-market-moves-to-the", date: "2026-10-05", access: full, locator: "Show notes, 'Runtime versus posture, blast radius'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 12 (posture-prioritization agent), discourse 01 (attack-path context) and governance 03 (idea:
    AI triage of IaC and CSPM findings). Grade C: the only figure on a deployed tool is vendor telemetry with no named
    customer; the independent figures come from research prototypes, one of them not language-model based. SACR's
    report was licensed free by Palo Alto Networks. Related: security-vulnerability-exposure-09 (risk-based
    prioritisation) and -22 (exposure-platform agent behind an approval harness).

# ---------------------------------------------------------------------------------------------------------------
# Area 2: runtime detection, investigation and response
# ---------------------------------------------------------------------------------------------------------------

- id: security-cloud-infrastructure-02
  title: "Agent investigates cloud detections, is validated in parallel with analysts, then closes a defined set of low-severity alerts"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [transaction-processing, research-synthesis, review-assurance]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Cloud detections require pulling identity, network, runtime and code context from several consoles; Wiz says manual
    investigation across sprawling cloud environments can take hours (WIZ-BLUEAGENT-GA-2026). ZS wanted analysts to
    spend more time on investigations that need deep expertise (WIZ-ZS-2026). Owkin runs a three-person security team
    over a large AWS estate (WIZ-OWKIN-2026).
  solution: >-
    The Wiz Blue Agent gathers evidence, compares activity with a historical baseline, checks IP reputation, validates
    actor identity and correlates signals across cloud platforms, then returns a verdict with the full investigation flow
    (WIZ-BLUEAGENT-CASE-2026; WIZ-BLUEAGENT-GA-2026). ZS ran it in parallel with its analysts for three months, compared
    the agent's investigations with analyst findings and tracked confidence over time, then let it investigate and close
    a defined set of low-severity cloud detections inside Wiz Defend (WIZ-ZS-2026). After a verdict, teams can escalate,
    notify responders or trigger containment playbooks by verdict and confidence (WIZ-BLUEAGENT-GA-2026). Orca announced
    a Threat Investigation Agent on 2026-03-18 and says its agents start by recommending rather than acting
    (ORCA-AGENTIC-2026).
  outcomes:
    - lever: quality
      description: "ZS: agreement of Blue Agent investigations with analysts' parallel investigations before operationalising"
      figure: "around 95.17% (headline: 95% accuracy)"
      measures: "ZS Director of Information Security's account of accuracy against analyst findings over three months of parallel investigation, using an internal framework; the page calls it 'self-validated'; number of cases, definition of accuracy and handling of disagreements not stated; hosted on Wiz's customer page"
      provenance: self-reported
      source_ref: WIZ-ZS-2026
    - lever: quality
      description: "Redis: Blue Agent verdicts compared with analysts' final case dispositions"
      figure: "85.7% overall accuracy; false negative rate below 2%"
      measures: "Wiz blog: measured against analysts' final case dispositions across 431 cases since October 2025; denominator for the false negative rate not stated; measured differently from ZS, so not comparable"
      provenance: vendor-published
      source_ref: WIZ-RUNTIME-2026
    - lever: speed
      description: "ZS: time to render a verdict compared with manual analysis"
      figure: "80-90% faster"
      measures: "headline on the ZS case page; method and baseline not stated"
      provenance: vendor-published
      source_ref: WIZ-ZS-2026
    - lever: capacity
      description: "ZS: analyst throughput"
      figure: "4x"
      measures: "headline on the ZS case page: analysts can triage significantly more threats than before; calculation not stated"
      provenance: vendor-published
      source_ref: WIZ-ZS-2026
    - lever: speed
      description: "Owkin: time spent investigating false positives, using Wiz's assistant and the Blue and Green agents"
      figure: "75% reduction, from 20-30 minutes to 5 minutes"
      measures: "headline in the Owkin case study; sample and period not stated"
      provenance: vendor-published
      source_ref: WIZ-OWKIN-2026
    - lever: quality
      description: "Owkin's head of cloud security ran manual investigations side by side with the agents at first"
      figure: "same conclusions '10 out of 10 times'"
      measures: "the head of cloud security's recollection of side-by-side comparisons; number of comparisons not stated"
      provenance: self-reported
      source_ref: WIZ-OWKIN-2026
  prerequisites:
    - "A cloud detection platform with runtime telemetry (both named cases use Wiz Defend)"
    - "A way to score agent verdicts against analyst verdicts before automating; ZS built an internal framework over three months (WIZ-ZS-2026)"
    - "A defined, low-severity scope for autonomous closure"
  risks_and_guardrails:
    - "ZS limited automatic closure to a defined set of low-severity cloud detections (WIZ-ZS-2026)."
    - "Independent evidence on LLM triage generally is less favourable: in ALERT-BENCH every tool-using approach tested missed at least 40.4% of attack-related alerts across 1,247 alerts from one multi-stage scenario; the study did not test the Blue Agent (ARXIV-2610.10608)."
    - "In an end-to-end cloud intrusion scenario published on unsecure.sh, five of seven frontier models run unharnessed in Cursor graded the real intrusion alert a false or benign positive (UNSECURE-EVAL-2026)."
    - "On SecRespond, 23 frontier models were tested on 10 ranges built from compromised cloud hosts and no model achieved complete detection and remediation on any single range (ARXIV-2607.26791)."
    - "Log content is attacker-controlled: with gpt-4o-mini as the analyst, persona-hijack prompts suppressed 68% of malicious logs under a naive classifier (ARXIV-2605.24421)."
    - "Wiz says the Blue Agent shows the questions asked, data retrieved and how each signal shaped the verdict, so analysts can audit it (WIZ-BLUEAGENT-GA-2026)."
  human_checkpoints:
    - "ZS analysts review what the agent closed in a threat review at the end of each shift (WIZ-ZS-2026)"
    - "Higher-severity cloud detections stay with analysts (WIZ-ZS-2026)"
  role_evolution: >-
    Work moves from alert queues to exception review: ZS says analysts without deep cloud experience can read the verdict
    and evidence, and analyst time shifts to advanced investigations, threat hunting and security initiatives
    (WIZ-ZS-2026).
  evidence_grade: B
  sources:
    - {ref: WIZ-ZS-2026, title: "How ZS Operationalized Blue Agent-Powered Cloud Detection and Response (customer story; page undated, retrieved 2026-10-17)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/customers/zs-blue-agent", date: "2026", access: full, locator: "Headline results; 'Earning Trust Before Automation'; 'From Alert Queues to Exception Reviews'"}
    - {ref: WIZ-RUNTIME-2026, title: "FAQs from the Field: Is Wiz a Runtime Security Tool?", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/is-wiz-a-runtime-security-tool", date: "2026-07-06", access: full, locator: "'What this looks like with our customers' (Redis)"}
    - {ref: WIZ-OWKIN-2026, title: "How Owkin's lean Security Team Protects AI-Driven Biotech Research at Scale (customer story; page undated, retrieved 2026-10-17)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/customers/owkin", date: "2026", access: full, locator: "Results headlines; section on AI capabilities"}
    - {ref: WIZ-BLUEAGENT-GA-2026, title: "The Wiz Blue Agent, now Generally Available", publisher: "Wiz", type: vendor, url: "https://wiz.io/blog/wiz-blue-agent-generally-available", date: "2026-03-30", access: full, locator: "'Investigation with full context'; 'From triage to action'"}
    - {ref: WIZ-BLUEAGENT-CASE-2026, title: "How Wiz's Blue Agent Traced a Multi-Cloud Attack", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/blue-agent-data-exfiltration-investigation", date: "2026-09-29", access: full, locator: "Phases 1 to 4 of the worked investigation"}
    - {ref: ORCA-AGENTIC-2026, title: "Introducing the Agentic Cloud Security Platform", publisher: "Orca Security", type: vendor, url: "https://orca.security/resources/blog/introducing-agentic-cloud-security-platform/", date: "2026-03-18", access: full, locator: "'What we're building: Agentic AI for CNAPP'; 'Transparency builds trust'"}
    - {ref: ARXIV-2610.10608, title: "From Investigation Failures to Reliable SOC Agents: Understanding and Improving LLM-Based Alert Triage", publisher: "arXiv (Tsegai, Kantchelian, Yao et al.)", type: academic, url: "https://arxiv.org/abs/2610.10608", date: "2026-10-07", access: full, locator: "Abstract"}
    - {ref: UNSECURE-EVAL-2026, title: "A scenario to evaluate your Agentic SOC (John Ao and Michel San, builders of the Tengu harness)", publisher: "unsecure.sh", type: vendor, url: "https://unsecure.sh/blog/agentic-soc-scenario/", date: "2026-08-27", access: full, locator: "'How well do off-the-shelf agents perform?'"}
    - {ref: ARXIV-2607.26791, title: "SecRespond: Benchmarking AI Agents for Real-World Post-Compromise Incident Response (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.26791", date: "2026-07-29", access: full, locator: "Abstract"}
    - {ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: "arXiv (Pandey, Bhujang)", type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 02 and discourse 03; the SecRespond benchmark from governance 09 (routed to incident-response) is
    kept as a caution. Graded B, not A: ZS has not published the
    figure itself. It reaches us only as its director's spoken 'around 95.17%' on an undated Wiz page; the 'internal
    framework' and 'self-validated' wording is Wiz's narration, and case count, accuracy definition, period and handling
    of disagreements are not given. Redis's 85.7% is likewise relayed by Wiz. Owkin's '10 out of 10' is a recollection
    and the ZS speed and throughput figures are vendor headlines. No independent measurement of any cloud-security agent
    was found.
    Related: security-operations-05, -06 and -21 (SOC-wide triage and measuring SOC AI); response actions by verdict
    overlap security-operations-19 and security-incident-response-11.

- id: security-cloud-infrastructure-03
  title: "In-house triage agent over cloud posture findings, connected through MCP or built in-house, with evidence rules and approval for IAM and network changes"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [transaction-processing, research-synthesis, coordination-scheduling]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    At Cohere a single critical Wiz finding took an analyst between 30 minutes and 2 hours to investigate, search for an
    existing ticket, draft an incident-response report and update Wiz (WIZ-COHERE-2026). WRITER saw thousands of alerts
    from cloud security tooling, of which roughly 100 were truly actionable, about a 2% signal rate; analysts kept an
    undocumented heuristic about what to ignore, and it left when senior analysts left (WRITER-CEREBRO-2026).
  solution: >-
    Cohere built a custom MCP server (Model Context Protocol, a standard way to connect an agent to tools) so its own
    agent platform can list open Wiz issues, pull asset context, identify attack paths and write status and notes back.
    One prompt has an agent investigate a critical issue, check Linear for duplicate tickets, create one if needed and
    mark the Wiz issue in progress; a scheduled workflow builds a Monday posture brief with a prioritised fix list
    (WIZ-COHERE-2026). Wiz made its MCP server generally available on 2026-07-02 (WIZ-MCP-2026). WRITER built Cerebro,
    an open-source agent system that normalises findings from CSPM, CNAPP and vulnerability tools, builds a resource
    graph, groups related findings into one incident and has an agent choose: resolve now, ticket with priority and
    owner, or defer, accept or monitor (WRITER-CEREBRO-2026).
  outcomes:
    - lever: speed
      description: "Cohere: time for attack-path analysis of a critical finding"
      figure: "from up to 120 minutes to 20 seconds"
      measures: "headline metric on Wiz's Cohere case page ('attack path analysis time'); number of findings measured and method not stated"
      provenance: vendor-published
      source_ref: WIZ-COHERE-2026
    - lever: capacity
      description: "Cohere: SecOps hours spent on first-pass triage"
      figure: "about 145 hours per week eliminated"
      measures: "headline metric on Wiz's Cohere case page; derivation not stated"
      provenance: vendor-published
      source_ref: WIZ-COHERE-2026
    - lever: quality
      description: "WRITER: baseline share of cloud alerts that were actionable, before Cerebro"
      figure: "about 2% (roughly 100 actionable out of thousands)"
      measures: "WRITER's own count after triage of alerts from its cloud security tooling, over several weeks; a problem baseline, not an outcome; WRITER lists tracked metrics (false positive and false negative rates, mean time to decision, analyst override rate, time saved) without values"
      provenance: self-reported
      source_ref: WRITER-CEREBRO-2026
  prerequisites:
    - "An MCP server or API layer in front of the posture platform, with write-back permissions (WIZ-COHERE-2026)"
    - "Findings normalised into one queryable store and an up-to-date resource graph with ownership metadata; WRITER found the graph is never complete and added fallback heuristics (WRITER-CEREBRO-2026)"
    - "Routing and approval rules agreed with the owners of IAM and network boundaries"
  risks_and_guardrails:
    - "WRITER's first version said 'triage this' without evidence and produced confident, plausible and often wrong answers; it now requires evidence before a decision: no 'resolve now' without confirmed exposure, no 'defer' without confirmed mitigation, no 'ticket' without an owner (WRITER-CEREBRO-2026)."
    - "Anything that touches IAM or a network boundary requires human approval, deterministic checks run before any downstream action, and missing evidence produces needs_human_review rather than a guess (WRITER-CEREBRO-2026)."
    - "Write-back access widens the agent's permissions, and the Cohere story gives no error or override rate (WIZ-COHERE-2026)."
    - "On Hacker News a commenter said such an agent needs IAM permissions that are 'not read-only'; the vendor's founders replied that every potentially destructive change goes through IaC for a human to apply (HN-DATAFRUIT-2025)."
  human_checkpoints:
    - "Cohere analysts start from a populated incident report and a tracked ticket, then handle remediation and escalation (WIZ-COHERE-2026)"
    - "WRITER: human approval for IAM and network-boundary changes and high-risk actions; analyst override rate is tracked (WRITER-CEREBRO-2026)"
  role_evolution: >-
    WRITER frames the change as moving people from assembling context across tools to decisions that need judgment: the
    agent proposes, rules validate, humans approve high-risk actions (WRITER-CEREBRO-2026). At Cohere first-pass triage
    moves to the agent, so analysts no longer start from a raw alert (WIZ-COHERE-2026).
  evidence_grade: B
  sources:
    - {ref: WIZ-COHERE-2026, title: "How Cohere Cut Security Triage from 2 Hours to 20 Seconds with Wiz (customer story; page undated)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/customers/cohere", date: "2026", access: full, locator: "'Reduced' metrics block; 'The Challenge'; 'The Solution'; 'Operational Impact'"}
    - {ref: WIZ-MCP-2026, title: "Build AI Security Agents with Wiz MCP (general availability)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/introducing-wiz-mcp", date: "2026-07-02", access: full, locator: "'What teams are building with Wiz'; GA announcement"}
    - {ref: WRITER-CEREBRO-2026, title: "Cerebro: An open source agentic system for security alert triage", publisher: "WRITER Engineering", type: firm, url: "https://writer.com/engineering/cerebro-ai-security-alert-triage-system/", date: "2026-03-23", access: full, locator: "Opening; 'What Cerebro actually does'; 'What We Got Wrong (At First)'; 'Guardrails'; 'Evals'"}
    - {ref: HN-DATAFRUIT-2025, title: "Launch HN: Datafruit (YC S25) - AI for DevOps (comment thread, 48 comments)", publisher: "Hacker News", type: community, url: "https://news.ycombinator.com/item?id=45104974", date: "2025-09-02", access: full, locator: "Comment thread on agent privileges"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 05 (WRITER Cerebro) and discourse 02 (Cohere). Discourse graded Cohere A; lowered to B under the
    2026-10-17 grade A rule, because the figures are vendor headline metrics with no stated method, and the 30-minute to
    2-hour baseline reads as an estimate. Cohere sells the agent platform it used, an interest to weigh. WRITER publishes
    a baseline but no post-deployment numbers, and says it wants feedback 'once the repo is public', so its production
    scope is not clear. Related: security-operations-01 (context-grounded triage pipeline) and -07 (evidence-gated
    dismissal).

- id: security-cloud-infrastructure-04
  title: "Correlating weak runtime signals with posture context into one critical attack-sequence finding"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Individual runtime findings on EC2, ECS and EKS are noisy; AWS says customer feedback consistently names noise as a
    major pain point, and a runtime signal alone often stays below the threshold for a critical finding
    (AWS-GUARDDUTY-ETD-2026).
  solution: >-
    Amazon GuardDuty Extended Threat Detection correlates weak signals into one attack-sequence finding when they cross a
    credibility threshold. From 2026-05-20 it attaches five indicator types (vulnerability, malicious package,
    reachability, misconfiguration, sensitive data) taken from Inspector, VPC Reachability Analyzer, Macie and Security
    Hub posture data (AWS-GUARDDUTY-ETD-2026).
  outcomes:
    - lever: quality
      description: "Net-new attack sequences on the runtime-process surface after the indicators were added"
      figure: "roughly one in four prioritised runtime-process attack sequences"
      measures: "AWS's description of the share of prioritised runtime-process attack sequences that were net-new in the first week after launch, across many customer accounts; counts and number of accounts not stated"
      provenance: vendor-published
      source_ref: AWS-GUARDDUTY-ETD-2026
    - lever: speed
      description: "One anonymised EKS example: 8 days of activity, 11 GuardDuty findings, 55 EKS audit-log signals and 18 finding-level signals"
      figure: "surfaced as a single CRITICAL attack sequence"
      measures: "a single example scenario AWS says was observed on an EKS cluster; not a rate"
      provenance: vendor-published
      source_ref: AWS-GUARDDUTY-ETD-2026
  prerequisites:
    - "Amazon Inspector on EC2 and EKS; AWS Security Hub (Foundational Security Best Practices); VPC Reachability Analyzer on production VPCs; GuardDuty Runtime Monitoring; Macie for the sensitive-data indicator (AWS-GUARDDUTY-ETD-2026)"
  risks_and_guardrails:
    - "AWS says the new indicators do not change incident-response runbooks for sequences that already occurred (AWS-GUARDDUTY-ETD-2026)."
    - "AWS advises patching by EPSS-weighted priority rather than CVSS alone, and rotating every credential that could have been exposed (AWS-GUARDDUTY-ETD-2026)."
  human_checkpoints:
    - "Responders contain exposures, isolate reachable hosts, rotate credentials and patch (AWS-GUARDDUTY-ETD-2026)"
  role_evolution: >-
    In AWS's EKS example responders work from one sequence instead of triaging more than 100 CVE findings at
    worker-node level (AWS-GUARDDUTY-ETD-2026).
  evidence_grade: C
  sources:
    - {ref: AWS-GUARDDUTY-ETD-2026, title: "GuardDuty Extended Threat Detection has added five new indicators to surface attack sequences", publisher: "AWS Security Blog", type: vendor, url: "https://aws.amazon.com/blogs/security/guardduty-extended-threat-detection-has-added-five-new-indicators-to-surface-attack-sequences/", date: "2026-10-12", access: full, locator: "'New indicators overview'; 'Strengthening weak runtime signals'; EKS example; 'Responding to attack sequences'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C here: the figure is AWS's own claim about its service, with no named customer. The post describes signal
    correlation; it does not say a generative model produces the finding, so this is adjacent to LLM-based AI. Kept
    because it shows detection vendors cutting triage load before any language model is applied. Maturity
    in-production refers to a generally available AWS service.

- id: security-cloud-infrastructure-05
  title: "Read-only first-pass incident triage agent across a Kubernetes fleet, with scope enforced in infrastructure"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    First-pass triage of Kubernetes incidents needs pod state, logs, metrics and deployment history from many clusters
    before a person can act (FWDCLOUDSEC-RAJI-2026).
  solution: >-
    A talk abstract describes an open-source investigation agent running in a production Kubernetes estate, one instance
    per cluster, doing first-pass triage from pod state, logs, metrics and deployment history. The author, who leads
    cloud and autonomous systems security at a European automotive manufacturer, says it has run for over a year and has
    never written to a cluster (FWDCLOUDSEC-RAJI-2026).
  outcomes:
    - lever: risk
      description: "Failure episodes despite a correctly labelled read-only permission set"
      figure: "4 failures in more than a year of operation"
      measures: "speaker's count in the abstract: read access reached secret material through pod specs and logs; an audit-log line could not be attributed to the agent or a human; the model sometimes guessed a cluster-name parameter; one investigation over-fetched until it hit its own resource ceiling"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-RAJI-2026
    - lever: risk
      description: "Cloud-log injection against LLM debugging agents (lab study)"
      figure: "0% (Claude Sonnet 4.6) to 86.2% (Llama 3.3 70B) verbatim execution of injected commands; Azure Prompt Shield detected 1 of 32 payloads in log context, GCP Model Armor none"
      measures: "8 models, 32 attack payloads, n=160 per model; the same payloads were detected in isolation but not in log context (abstract)"
      provenance: independent
      source_ref: ARXIV-2604.15368
  prerequisites:
    - "One agent instance per cluster with scoped service accounts (FWDCLOUDSEC-RAJI-2026)"
    - "Tool scopes narrower than the 'read-only' label, since read access to pod events reached secret material"
    - "Audit logging that distinguishes agent actions from human actions; tool parameters validated outside the prompt; cost and resource ceilings"
  risks_and_guardrails:
    - "The speaker says the 'read-only' label got the deployment approved but said nothing about what the agent could reach, who it was or what it cost; every control that held was infrastructure and every control that failed was a prompt (FWDCLOUDSEC-RAJI-2026)."
    - "Telemetry manipulation can mislead AIOps agents into actions that compromise infrastructure integrity; the authors' sanitiser blocked their attacks in their experiments (USENIX-AIOPSDOOM-2026)."
    - "Passive prompt injection in network-log analysis reached up to 88.2% attack success; layered defences cut it by 90.4% but 8.4% remained, so human oversight of security-critical decisions stays (ARXIV-2607.14493)."
  human_checkpoints:
    - "The agent never writes to a cluster; engineers receive the triage and act (FWDCLOUDSEC-RAJI-2026)"
  role_evolution: >-
    The speaker's lesson is that reviewers who approve such agents must check their reach, identity and cost, not only
    whether they can write (FWDCLOUDSEC-RAJI-2026).
  evidence_grade: C
  sources:
    - {ref: FWDCLOUDSEC-RAJI-2026, title: "What We Learned Giving an AI Agent Read Access to Our Whole Kubernetes Fleet (Amine Raji)", publisher: "fwd:cloudsec Europe 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-europe-2026/talk/TN9SP9/", date: "2026-09-08", access: full, locator: "Talk abstract and speaker bio (talk not viewed)"}
    - {ref: ARXIV-2604.15368, title: "LogJack: Indirect Prompt Injection Through Cloud Logs Against LLM Debugging Agents (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2604.15368", date: "2026-04-15", access: full, locator: "Abstract"}
    - {ref: USENIX-AIOPSDOOM-2026, title: "When AIOps Become 'AI Oops': Subverting LLM-driven IT Operations via Telemetry Manipulation (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/pasquini", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2607.14493, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.14493", date: "2026-07-16", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 10 and discourse 13; log-injection evidence from governance 11 (idea: operations agents that read
    telemetry and run fixes), whose control set is covered by security-ai-security-13 (untrusted content as hostile
    input). Grade C: a first-hand production report in a conference abstract (talk not viewed) from an unnamed
    organisation, so maturity is set to piloting rather than in-production. Agent identity in logs: see
    security-ai-security-06 and -12; verifying AI investigations: security-incident-response-09.

