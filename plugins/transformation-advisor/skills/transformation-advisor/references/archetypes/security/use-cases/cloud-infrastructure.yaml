- id: security-cloud-infrastructure-24
  title: "Idea: a runtime control layer that decides whether live cloud actions proceed, are constrained, remediated or escalated"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    SACR argues that CNAPP (cloud-native application protection platforms) unified visibility but still relies on
    periodic telemetry, API-derived state, delayed correlation and human remediation queues while workloads, identities,
    APIs and AI-mediated actions change in seconds (SACR-ACSP-2026).
  solution: >-
    SACR defines Agentic Cloud Security Platforms: a runtime layer connecting CNAPP evidence to a decision on whether a
    workload, API call, identity action, model interaction or agent tool call should proceed, be constrained, be
    remediated or be escalated, with audit-grade records (SACR-ACSP-2026). Sysdig's CTO argues agent behaviour cannot be
    enumerated in advance, so runtime is where truth lives (SYSDIG-RUNTIME-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "category definition only; SACR says its vendor landscape anchors the market 'not as a ranking' and gives no deployment results"
      provenance: vendor-published
      source_ref: SACR-ACSP-2026
  prerequisites:
    - "Runtime discovery, identity-aware policy for human, machine and agent actions, and a context graph joining code, cloud configuration, runtime behaviour and data (SACR-ACSP-2026)"
  risks_and_guardrails:
    - "Latio argues runtime orientation is a patchwork and favours posture and blast-radius limits, so that an agent cannot take down production because its owner cannot (RESILIENTCYBER-LATIO-2026)."
    - "SACR's Black Hat read says vendors can describe what agents do but few can show what happens when the agent is wrong, and prevention is regaining ground over detect-and-respond (SACR-BHUSA-2026)."
  human_checkpoints:
    - "The 'escalate' outcome sends the action to a person; where that boundary sits was unresolved across CSA's summits (CSA-AISTORM-2026)"
  role_evolution: >-
    SACR argues the centre of gravity has been scans, snapshots, graph analysis and remediation queues, and that the next
    layer must govern live execution decisions (SACR-ACSP-2026); it does not describe role changes.
  evidence_grade: D
  sources:
    - {ref: SACR-ACSP-2026, title: "Introducing a New Cloud Security Category: Agentic Cloud Security Platforms (ACSP)", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/introducing-a-new-cloud-security", date: "2026-06-11", access: full, locator: "'Key Takeaways From The Report'"}
    - {ref: SYSDIG-RUNTIME-2026, title: "With AI agents, runtime is the only place truth lives", publisher: "Sysdig (Loris Degioanni)", type: vendor, url: "https://sysdig.com/blog/with-ai-agents-runtime-is-the-only-place-truth-lives", date: "2026-10-01", access: full, locator: "'The challenge of securing agentic AI'; 'Agents move faster than people can review by hand'"}
    - {ref: RESILIENTCYBER-LATIO-2026, title: "The AI Security Market Moves to the Endpoint (podcast with James Berthoty of Latio)", publisher: "Resilient Cyber (Chris Hughes)", type: podcast, url: "https://www.resilientcyber.io/p/the-ai-security-market-moves-to-the", date: "2026-10-05", access: full, locator: "Show notes, 'Runtime versus posture, blast radius'"}
    - {ref: SACR-BHUSA-2026, title: "Black Hat USA 2026: Key Insights We're Observing For H2 2026", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/black-hat-usa-2026-key-insights-were", date: "2026-08-21", access: full, locator: "Executive summary; 'Prevention is becoming the centre of gravity again'"}
    - {ref: CSA-AISTORM-2026, title: "AI Security Through the CISO Lens: Insights from the AI Storm Summit Series", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/artifacts/ai-security-through-the-ciso-lens", date: "2026-07-28", access: full, locator: "'The human-in-the-loop question'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: from discourse 18; an analyst category and vendor positioning that practitioners debate, no deployment of the
    full model found. Palo Alto Networks licensed SACR's report free to readers, and Sysdig sells runtime products.
    Related: security-ai-security-07 (gateway that permits, denies, modifies or escalates each agent action).
