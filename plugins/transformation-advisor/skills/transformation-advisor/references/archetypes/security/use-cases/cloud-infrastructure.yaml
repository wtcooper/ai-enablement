- id: security-cloud-infrastructure-16
  title: "Runtime guardrails and telemetry for coding agents on developer endpoints, with an agent proposing detection changes"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Coding agents act on privileged developer endpoints; users hand approvals to classifiers or switch them off with
    flags such as --dangerously-skip-permissions, and an agent can cause an incident without any malicious input
    (PERPLEXITY-NUMBAT-2026). SACR says EDR (endpoint detection and response) sees processes and files, but the risky
    action is now a plain-language instruction carried out above the operating system (SACR-ECP-2026).
  solution: >-
    Perplexity open-sourced Numbat, which hooks into the harnesses of common coding agents on macOS, Linux and Windows,
    enforces rules (for example on commands that upload data), records activity locally and sends structured telemetry
    to central systems. A scheduled Perplexity agent reviews findings, reconstructs sessions and proposes tested
    detection changes as pull requests for human review (PERPLEXITY-NUMBAT-2026). SACR names the category Endpoint
    Control and Prevention (SACR-ECP-2026).
  outcomes:
    - lever: risk
      description: "Deployment scale at the builder; no detection-quality figures"
      figure: "thousands of Perplexity endpoints"
      measures: "endpoints where Numbat is deployed through MDM (mobile device management); counts of blocks, detections and false positives not published"
      provenance: self-reported
      source_ref: PERPLEXITY-NUMBAT-2026
    - lever: risk
      description: "AI applications found on enterprise devices by a vendor discovery feature"
      figure: "more than 1,800"
      measures: "CrowdStrike claim relayed by NAND Research for Shadow AI Discovery; time frame and customer base not stated"
      provenance: vendor-published
      source_ref: NAND-RSAC-2026
  prerequisites:
    - "MDM to deploy the tool, agent-harness hooks, and a SIEM or logging platform to receive telemetry (PERPLEXITY-NUMBAT-2026)"
    - "A rule language for the security team and a review path for rule changes"
  risks_and_guardrails:
    - "Intent-based detection raises a worker-privacy problem (RESILIENTCYBER-LATIO-2026)."
    - "Detection Engineering Weekly's author says the safer assumption is that coding agents are untrusted, not that they are malicious (DETENGWEEKLY-166-2026)."
  human_checkpoints:
    - "Rule changes the agent proposes go through human-reviewed pull requests (PERPLEXITY-NUMBAT-2026)"
  role_evolution: >-
    At Perplexity the security team adds its own Numbat rules and reviews detection changes an agent proposes
    (PERPLEXITY-NUMBAT-2026); SACR expects EDR to extend into agent, browser and data controls rather than be replaced
    (SACR-ECP-2026).
  evidence_grade: B
  sources:
    - {ref: PERPLEXITY-NUMBAT-2026, title: "Securing agents across Perplexity's client endpoints with Numbat", publisher: "Perplexity Secure Intelligence Institute", type: firm, url: "https://research.perplexity.ai/articles/securing-agents-across-perplexity%E2%80%99s-client-endpoints-with-numbat", date: "2026-07-29", access: full, locator: "'Introduction'; 'Managing and monitoring Numbats across the fleet'"}
    - {ref: SACR-ECP-2026, title: "The CISO Guide to Endpoint Control and Prevention (ECP): The Next Architecture for Endpoint Security", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/the-ciso-guide-to-endpoint-control", date: "2026-07-22", access: full, locator: "'Executive Summary'; 'The Report Summary'"}
    - {ref: NAND-RSAC-2026, title: "RSAC 2026: Agentic AI Security Takes Center Stage at Industry's Marquee Event", publisher: "NAND Research", type: press, url: "https://nand-research.com/rsac-2026-agentic-ai-security-takes-center-stage-at-industrys-marquee-event/", date: "2026-04-01", access: full, locator: "CrowdStrike paragraph"}
    - {ref: RESILIENTCYBER-LATIO-2026, title: "The AI Security Market Moves to the Endpoint (podcast with James Berthoty of Latio)", publisher: "Resilient Cyber (Chris Hughes)", type: podcast, url: "https://www.resilientcyber.io/p/the-ai-security-market-moves-to-the", date: "2026-10-05", access: full, locator: "Show notes, intent-based detection"}
    - {ref: DETENGWEEKLY-166-2026, title: "DEW #166 - Figma's Agentic SecOps, AI-EDRs and Anthropic Evals Breaking into Companies", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-166-figmas-agentic-secops-ai", date: "2026-08-05", access: full, locator: "'State of the Art', Numbat item"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B: Perplexity describes its own deployment across thousands of endpoints without detection metrics. SACR
    partnered with the vendors it names. Scope is developer endpoints running agents; classic EDR evidence was not
    collected. Related: security-ai-security-07 (runtime policy enforcement for agent actions) and -11 (monitoring
    agent trajectories).

- id: security-cloud-infrastructure-17
  title: "Idea: LLM agents tune endpoint detection and response policy from a bounded catalogue of hardening actions"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Commercial EDR has shifted from operator-configured rules to systems with autonomous AI components, so a defence
    agent tuning EDR acts on a black box that can change its own behaviour (ARXIV-2606.08168).
  solution: >-
    An LLM agent selects EDR hardening actions from a finite, tool-enforced catalogue, evaluated against attack-graph
    data and, in a separate framework, against a commercial EDR and an autonomous pentester in a lab (ARXIV-2605.03034;
    ARXIV-2606.08168).
  outcomes:
    - lever: risk
      description: "Research prototype: attacker's expected payoff versus a greedy baseline"
      figure: "59% reduction"
      measures: "reduction in the attacker's expected payoff (game value) for a tool-mediated Claude Sonnet 4 controller versus a deterministic greedy baseline on paired offensive and defensive telemetry, zero variance across 40 runs (abstract)"
      provenance: independent
      source_ref: ARXIV-2605.03034
  prerequisites:
    - "EDR telemetry that separates agent actions from the EDR's own autonomous actions (ARXIV-2606.08168)"
  risks_and_guardrails:
    - "Commercial EDR telemetry is built for analyst workflows, not benchmarking, and the EDR's autonomous behaviour varied during evaluation (ARXIV-2606.08168)."
    - "Constrain agent choices to a finite catalogue enforced at the tool-output interface; a smaller model converged to worse values but stayed within the catalogue (ARXIV-2605.03034)."
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: >-
    No source describes a role change for this use.
  evidence_grade: D
  sources:
    - {ref: ARXIV-2605.03034, title: "Stable Agentic Control: Tool-Mediated LLM Architecture for Autonomous Cyber Defense (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2605.03034", date: "2026-05-04", access: full, locator: "Abstract"}
    - {ref: ARXIV-2606.08168, title: "Closing the Sim-to-Real Gap: An Evaluation Framework for Autonomous Cyber Defense Configuration of Commercial EDR (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2606.08168", date: "2026-06-06", access: full, locator: "Abstract"}
    - {ref: AVC-EPR-2026, title: "Endpoint Prevention & Response (EPR) Test 2026", publisher: "AV-Comparatives", type: survey, url: "https://av-comparatives.org/tests/endpoint-prevention-response-epr-test-2026/", date: "2026-09-15", access: full, locator: "Introduction (independent endpoint test context; no AI attribution)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: from governance 10; research only, no named organisation's production use found. AV-Comparatives' 2026 EPR
    test (50 targeted attack scenarios, 14 enterprise products, 11 certified) measures endpoint products independently
    but does not attribute results to AI components, so it is context, not an outcome. Endpoint detection triage with
    calibrated confidence (CrowdStrike, practice 11) is not duplicated here: see security-operations-06.

