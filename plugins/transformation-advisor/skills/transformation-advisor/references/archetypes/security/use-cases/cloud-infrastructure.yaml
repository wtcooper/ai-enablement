# Area 4: identities and permissions in the cloud
# ---------------------------------------------------------------------------------------------------------------

- id: security-cloud-infrastructure-08
  title: "AI turns unused-access findings into least-privilege changes delivered as infrastructure-as-code pull requests"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Permissions accumulate. IAM Access Analyzer can recommend right-sized policies, but a console fix is overwritten at
    the next deployment if the role is defined in CloudFormation or CDK, manual remediation leaves no record of why, and
    tightening access can break workflows (AWS-LEASTPRIV-2026). Smolen notes that policies generated from usage logs are
    easy to produce and hard to ship, because a tightened role can throw AccessDenied errors in the middle of an
    incident (FWDCLOUDSEC-SMOLEN-2026). In Datadog's 2025 data, 59% of AWS IAM users had an active access key older than
    one year (DATADOG-SOCS-2025).
  solution: >-
    AWS describes a daily automation that reads Access Analyzer findings, uses CloudTrail to find how each role was
    created, and uses Bedrock models to produce a pull request with CDK code and a plain-English explanation (roles in
    IaC), an issue with migration steps (manual roles) or a soft-disable plan (unused roles) (AWS-LEASTPRIV-2026). A
    fwd:cloudsec abstract describes a coding agent that drafts least-privilege Terraform from pre-aggregated CloudTrail,
    a background agent that detects AccessDenied errors, contacts the user in Slack and drafts pull requests for
    security review, and a validation agent that compares break-glass narratives with session summaries
    (FWDCLOUDSEC-SMOLEN-2026). Research applies the same idea to serverless functions and Kubernetes workloads:
    static analysis extracts needed permissions and a model writes the policy or repaired manifest (ARXIV-2603.25393;
    ARXIV-2608.26699; ARXIV-2509.04191).
  outcomes:
    - lever: risk
      description: "ALPS research prototype: least-privilege extraction coverage for serverless functions"
      figure: "94.8%"
      measures: "coverage over 8,322 real-world functions across AWS, Google Cloud and Azure (abstract)"
      provenance: independent
      source_ref: ARXIV-2603.25393
    - lever: risk
      description: "KubeCap research prototype: capability reduction in Kubernetes manifests"
      figure: "54.97% average reduction"
      measures: "average capability reduction rate on 10 Go-based Kubernetes projects (abstract)"
      provenance: independent
      source_ref: ARXIV-2608.26699
    - lever: capacity
      description: "AWS reference automation and the Smolen pipeline"
      figure: "none published"
      measures: "no results in the AWS post or the Smolen abstract"
      provenance: vendor-published
      source_ref: AWS-LEASTPRIV-2026
  prerequisites:
    - "IAM Access Analyzer unused-access analyzer enabled; roles in IaC with a traceable repository, or a plan to migrate them (AWS-LEASTPRIV-2026)"
    - "A CI/CD platform token stored securely and model access in Bedrock (AWS-LEASTPRIV-2026)"
    - "CloudTrail history and a chat channel for access requests (FWDCLOUDSEC-SMOLEN-2026)"
  risks_and_guardrails:
    - "AWS recommends dry-run mode first, conservative pull-request limits ('a team that can review 10 PRs per week shouldn't receive 50 on Monday morning'), and routing admin or sensitive-data roles to manual review issues instead of automated PRs (AWS-LEASTPRIV-2026)."
    - "A restricted role can throw AccessDenied during an incident; the Smolen abstract also covers the trust-model implications of letting agents take part in IAM governance (FWDCLOUDSEC-SMOLEN-2026)."
    - "Over-trimmed permissions can break workloads; KubeGuard frames its output as recommendations that users review and adopt (ARXIV-2509.04191)."
  human_checkpoints:
    - "The team that owns the role reviews the PR through normal code review (AWS-LEASTPRIV-2026)"
    - "Security reviews AccessDenied-driven PRs (FWDCLOUDSEC-SMOLEN-2026)"
  role_evolution: >-
    Smolen describes least privilege as an ongoing conversation between agents and engineers rather than a one-off
    policy export (FWDCLOUDSEC-SMOLEN-2026).
  evidence_grade: C
  sources:
    - {ref: AWS-LEASTPRIV-2026, title: "Operationalizing least privilege: Automate IAM remediation through your CI/CD pipeline", publisher: "AWS Security Blog", type: vendor, url: "https://aws.amazon.com/blogs/security/operationalizing-least-privilege-automate-iam-remediation-through-your-ci-cd-pipeline/", date: "2026-09-15", access: full, locator: "'Solution overview'; practices on limits, dry-run and approval tags"}
    - {ref: FWDCLOUDSEC-SMOLEN-2026, title: "Least Privilege is a Conversation: Building an Agentic Role Engineering Pipeline (Alex Smolen, EngSec Labs)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/9LRLDS/", date: "2026-06-01", access: full, locator: "Talk abstract (talk not viewed)"}
    - {ref: DATADOG-SOCS-2025, title: "State of Cloud Security (2025 edition)", publisher: "Datadog", type: vendor, url: "https://www.datadoghq.com/state-of-cloud-security/", date: "2025-10-08", access: full, locator: "Fact 3, long-lived credentials"}
    - {ref: ARXIV-2603.25393, title: "ALPS: Automated Least-Privilege Enforcement for Securing Serverless Functions (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.25393", date: "2026-03-26", access: full, locator: "Abstract"}
    - {ref: ARXIV-2608.26699, title: "KubeCap: A Framework for Capability Minimization in Kubernetes via Static Analysis and LLM-Assisted Rule Inference (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.26699", date: "2026-08-27", access: full, locator: "Abstract"}
    - {ref: ARXIV-2509.04191, title: "KubeGuard: LLM-Assisted Kubernetes Hardening via Configuration Files and Runtime Logs Analysis (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2509.04191", date: "2025-09-04", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 06 (AWS and Smolen parts), discourse 06 (Smolen part) and governance 05 (idea: AI-derived least
    privilege for functions and Kubernetes). Grade C: AWS publishes a reference pattern, not a customer deployment; the
    talk is an abstract from a consultancy; the figures come from research prototypes. Related:
    security-identity-access-07 (usage-based role mining) and -11 (LLM-drafted access policy as code); over-granted
    privileges before agents find them: security-ai-security-09. The governance file used DATADOG-CLOUDSEC-2025 for the
    same Datadog report; this file uses DATADOG-SOCS-2025.

- id: security-cloud-infrastructure-09
  title: "Multi-agent cloud security 'team' (IAM, red team, threat intelligence, behaviour analytics) that scores identity risk, applies controls and red-teams them"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Horsman says most security teams have no dedicated cloud identity person, so IAM clean-up is nobody's priority
    (FWDCLOUDSEC-HORSMAN-2026).
  solution: >-
    A fwd:cloudsec 2026 abstract describes four agents (IAM, red team, threat intelligence, UEBA, or user and entity
    behaviour analytics), each with its own machine identity through IAM Roles Anywhere. In a real AWS account with more
    than 500 identities, the IAM agent scored every identity on four risk dimensions (permissions, usage, exposure,
    activity) and applied controls, and the red-team agent checked that each control blocked its attack path
    (FWDCLOUDSEC-HORSMAN-2026).
  outcomes:
    - lever: risk
      description: "Account risk score after five days of agent work in one real AWS account"
      figure: "42.7% reduction (critical to moderate); 11 attack paths addressed; 8 permission controls across 19 API actions; 9 identities quarantined"
      measures: "speaker's abstract: risk score for one AWS account of more than 500 identities across four dimensions; scoring method, baseline and independent validation not stated; the speaker works for an identity-security vendor"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-HORSMAN-2026
  prerequisites:
    - "A distinct machine identity and permission boundary per agent (Horsman uses IAM Roles Anywhere with X.509 certificates)"
    - "Approval workflows for dangerous API actions"
  risks_and_guardrails:
    - "The abstract promises to show what the agents did to the account, what broke and what auto-remediation guardrails should look like when the operator is autonomous; the agent also repaired its own bug on day five (FWDCLOUDSEC-HORSMAN-2026)."
    - "Each agent had its own identity and boundary, and a red-team agent validated each control (FWDCLOUDSEC-HORSMAN-2026)."
  human_checkpoints:
    - "Approval workflows gate dangerous API actions (FWDCLOUDSEC-HORSMAN-2026)"
  role_evolution: >-
    Horsman casts the agent team as the missing cloud IAM specialist (FWDCLOUDSEC-HORSMAN-2026).
  evidence_grade: C
  sources:
    - {ref: FWDCLOUDSEC-HORSMAN-2026, title: "I made AI agents apply for my Security Team. Then I gave the agents access to AWS. (Cole Horsman, Sonrai Security)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/RAEUSE/", date: "2026-06-01", access: full, locator: "Talk abstract and speaker bio (talk not viewed)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Kept separate from entry 08 because an agent team owning a multi-step outcome is a different ladder level from
    drafting pull requests. Grade C: one conference abstract by the Field CTO of an identity-security vendor;
    abstracts cannot support A or B. The abstract does not say whose account was used. Agent identity design:
    security-ai-security-06.

- id: security-cloud-infrastructure-10
  title: "AI-assisted discovery of new cloud IAM privilege-escalation paths, with deterministic lab validation before publication"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [research-synthesis, software-systems]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Language models surface new attack vectors quickly but also hallucinate issues that are not exploitable, which
    wastes researcher time (FWDCLOUDSEC-ART-2026).
  solution: >-
    An agentic, skill-based workflow pairs AI-driven discovery with deterministic integration tests in an open-source
    lab, so every candidate is validated before publication; the talk also introduces an exploitation framework for IAM
    privilege escalation built the same way (FWDCLOUDSEC-ART-2026).
  outcomes:
    - lever: quality
      description: "New AWS IAM privilege-escalation paths found and validated with the workflow"
      figure: "over a dozen"
      measures: "speaker's abstract; candidates generated and rejected not stated"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-ART-2026
  prerequisites:
    - "Lab infrastructure that reproduces each path, and integration tests that decide pass or fail without the model"
    - "Deep AWS IAM expertise to write the skills and judge results"
  risks_and_guardrails:
    - "Hallucinated findings are the stated risk; deterministic validation is the guardrail (FWDCLOUDSEC-ART-2026)."
    - "Escalation catalogues serve attackers and defenders alike; this entry records capability only at the level defenders need."
  human_checkpoints:
    - "The researcher decides what to publish after tests pass (FWDCLOUDSEC-ART-2026)"
  role_evolution: >-
    The speaker, who previously led a cloud penetration-testing practice per the schedule's biography, pairs AI discovery
    with deterministic tests he wrote; no source describes a wider role change (FWDCLOUDSEC-ART-2026).
  evidence_grade: C
  sources:
    - {ref: FWDCLOUDSEC-ART-2026, title: "Discovering New AWS Privilege Escalation Paths with an AI-Driven Workflow (Seth Art, Datadog)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/Q9NXBS/", date: "2026-06-01", access: full, locator: "Abstract and speaker biography (talk not viewed)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: a conference abstract (talk not viewed); the speaker's biography lists Datadog, but the abstract does
    not say Datadog runs the workflow. Pattern 'other': AI discovery plus deterministic validation of each candidate.

# ---------------------------------------------------------------------------------------------------------------
# Area 5: preventive guardrails in infrastructure as code
# ---------------------------------------------------------------------------------------------------------------

- id: security-cloud-infrastructure-11
  title: "Guardrails and independent verification for AI-written and AI-repaired infrastructure code: approved modules, policy gates and plan checks"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Rengasamy's abstract says AI coding assistants now generate the majority of infrastructure code in many
    organisations, so paved roads aimed at developers' judgment miss the model doing the reasoning
    (FWDCLOUDSEC-RENGASAMY-2026). Studies find valid Terraform is not necessarily secure Terraform, and repairs can
    satisfy a scanner while leaving the vulnerability in place (ARXIV-2608.02672; ARXIV-2606.26590).
  solution: >-
    Rengasamy presents a reference architecture: an MCP server exposes approved Terraform modules from an internal
    registry, runs OPA policies (Open Policy Agent, a policy-as-code engine) with output designed for agents, auto-fixes
    eligible violations, risk-scores exceptions and sends high-risk ones to humans, then opens a compliant pull request
    with a reasoning trace (FWDCLOUDSEC-RENGASAMY-2026). Wiz describes guardrails and code plugins that let coding agents
    scan and rewrite AI-generated code against organisation baselines (WIZ-OPMODEL-2026). Researchers propose
    multi-scanner gates in CI/CD and layered checks for repairs: re-run the full scanner, check the provider schema and
    plan, compare plans and escalate when deployment context is missing (ARXIV-2608.02672; ARXIV-2607.11390;
    ARXIV-2606.26590). The Datafruit founders say every potentially destructive change becomes an IaC pull request
    (HN-DATAFRUIT-2025).
  outcomes:
    - lever: risk
      description: "Deceptive fixes among LLM repairs of Terraform misconfigurations (TerraProbe)"
      figure: "71.4% of plan-compared real-world repairs judged deceptive; 83.3% targeted-finding removal vs 10.4% full-scanner cleanliness"
      measures: "288 first-pass repairs from gemini-2.5-flash-lite, GPT-4o and Claude 3.5 Sonnet on 68 real-world and 28 injected-defect modules; deceptive = passes automated checks, vulnerability remains, judged by human adjudication; older models (abstract)"
      provenance: independent
      source_ref: ARXIV-2606.26590
    - lever: risk
      description: "Vulnerability density of LLM-generated IaC against size-matched human-written IaC"
      figure: "3.21x to 3.87x the human baseline"
      measures: "1,196 artifacts from 12 model configurations across 100 scenarios versus 634 human templates, same three policy engines; the authors say the corpus cannot isolate unprompted default posture (abstract)"
      provenance: independent
      source_ref: ARXIV-2608.28021
    - lever: quality
      description: "Verification-guided iterative repair versus single-shot repair (IaC-Guard-V)"
      figure: "68-92% vs 32-50% of repairs passing full verification"
      measures: "630 runs on 70 real-world misconfigured Terraform and Kubernetes artifacts, three strategies, three LLM families; checks: syntax, target-issue resolution, regression safety, patch minimality (abstract)"
      provenance: independent
      source_ref: ARXIV-2609.28488
    - lever: risk
      description: "Security regressions during iterative LLM repair of IaC"
      figure: "3.3% (strict detection) to 13.8% (standard) of scenarios"
      measures: "5,968 IaC-Eval scenario timelines, up to five iterations; regression = a previously passing CIS check fails (abstract)"
      provenance: independent
      source_ref: ARXIV-2608.13404
  prerequisites:
    - "An internal module registry, OPA policies written for agent consumption, and an exception workflow with ticketing (FWDCLOUDSEC-RENGASAMY-2026)"
    - "More than one IaC policy scanner on every change, and a non-production plan step to compare behaviour before and after a fix (ARXIV-2608.02672; ARXIV-2606.26590)"
  risks_and_guardrails:
    - "Do not treat disappearance of the targeted finding as success; wildcard IAM grants persisted in the deceptive fixes (ARXIV-2606.26590)."
    - "Prompt engineering alone was insufficient and multi-tool scanning stayed necessary (ARXIV-2608.02672)."
    - "Re-run the full scanner after each iteration and cap iterations; iteration 3 was the optimal stopping point in one study (ARXIV-2608.13404)."
    - "Escalate rather than fabricate a fix when deployment-specific context is missing (ARXIV-2607.11390)."
  human_checkpoints:
    - "High-risk exceptions go to humans (FWDCLOUDSEC-RENGASAMY-2026)"
    - "Destructive changes land as pull requests for review (HN-DATAFRUIT-2025)"
  role_evolution: >-
    Security effort shifts from training developers to curating the modules, policies and exception rules an agent works
    inside (FWDCLOUDSEC-RENGASAMY-2026).
  evidence_grade: C
  sources:
    - {ref: FWDCLOUDSEC-RENGASAMY-2026, title: "Agentic Paved Roads: Shifting Security Left to the Machine That Thinks (Prahathess Rengasamy, xAI)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/RDXF3X/", date: "2026-06-01", access: full, locator: "Talk abstract and speaker bio (talk not viewed)"}
    - {ref: WIZ-OPMODEL-2026, title: "Build AI Threat Readiness with Wiz", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/wiz-ai-threat-readiness-operating-model", date: "2026-05-27", access: full, locator: "Pillar 2, 'Implement prevention with WizOS and guardrails'"}
    - {ref: ARXIV-2606.26590, title: "TerraProbe: A Layered-Oracle Framework for Detecting Deceptive Fixes in LLM-Assisted Terraform (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2606.26590", date: "2026-06-25", access: full, locator: "Abstract"}
    - {ref: ARXIV-2608.28021, title: "Compared to What? A Human-Anchored Security Benchmark for LLM-Generated Infrastructure-as-Code (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.28021", date: "2026-08-28", access: full, locator: "Abstract"}
    - {ref: ARXIV-2608.02672, title: "Security-First Evaluation of Text-to-Terraform: Benchmarking LLMs and SLMs for Secure IaC Generation (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.02672", date: "2026-08-02", access: full, locator: "Abstract"}
    - {ref: ARXIV-2609.28488, title: "IaC-Guard-V: A Verification Framework for LLM-Generated Infrastructure-as-Code Repairs (arXiv preprint, abstract read; arXiv lists first submission 2026-08-12)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.28488", date: "2026-08-12", access: full, locator: "Abstract"}
    - {ref: ARXIV-2607.11390, title: "TerraRepair: A Tool-Grounded LLM Agent for Infrastructure-as-Code Repair (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.11390", date: "2026-07-13", access: full, locator: "Abstract"}
    - {ref: ARXIV-2608.13404, title: "Does Fixing Break Security? An Empirical Study of Security Degradation in Iterative LLM-Driven Infrastructure-as-Code Repair (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.13404", date: "2026-08-13", access: full, locator: "Abstract"}
    - {ref: HN-DATAFRUIT-2025, title: "Launch HN: Datafruit (YC S25) - AI for DevOps (comment thread, 48 comments)", publisher: "Hacker News", type: community, url: "https://news.ycombinator.com/item?id=45104974", date: "2025-09-02", access: full, locator: "Founder replies on IaC pull requests"}
    - {ref: ARXIV-2607.25995, title: "Does Runtime Topology Context Improve LLM-Generated Kubernetes Security Patches? (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.25995", date: "2026-07-28", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 07 (idea: policy-checking MCP paved road), discourse 09, governance 01 (idea: scanner-verified IaC
    repair), 02 (idea: policy-scanner gate) and 04 (idea: topology-aware Kubernetes remediation; live topology context
    raised dependency-sensitive patch correctness from 11.1% to 78.0% across 248 trials on a purpose-built test cluster,
    ARXIV-2607.25995). Grade C: Wiz's commercial guardrails are a vendor claim; the paved road is a talk and demo; the
    independent figures are preprints on mostly older models that measure the problem, not a deployed guardrail.
    Related: security-application-security-02 (guardrails for AI-written code) and security-vulnerability-exposure-14
    (validating AI-written patches).

- id: security-cloud-infrastructure-12
  title: "Idea: agents detect configuration drift from infrastructure code and propose reconciling IaC updates"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    When consoles, CLIs and SDKs are used alongside IaC, deployed systems drift from the IaC specification and later IaC
    runs may undo valid changes (ARXIV-2510.20211; ARXIV-2603.02345). NIST lists configuration drift management among
    defensive AI opportunities (NIST-IR8596-2025).
  solution: >-
    Agents read API traces or telemetry to detect out-of-band change and propose updates to the IaC program; RIVA adds a
    verifier agent and cross-validation so wrong tool outputs do not cause missed drift or false alarms
    (ARXIV-2510.20211; ARXIV-2603.02345).
  outcomes:
    - lever: quality
      description: "NSync research prototype: drift reconciliation accuracy"
      figure: "0.71 to 0.97 (pass@3)"
      measures: "372 injected drift scenarios across five real-world Terraform projects, NSync versus a baseline (abstract)"
      provenance: independent
      source_ref: ARXIV-2510.20211
    - lever: quality
      description: "RIVA research prototype: drift detection accuracy when tools return wrong outputs"
      figure: "27.3% to 50.0%"
      measures: "task accuracy on the AIOpsLab benchmark with erroneous tool responses, RIVA versus a ReAct agent baseline (abstract)"
      provenance: independent
      source_ref: ARXIV-2603.02345
  prerequisites:
    - "IaC as source of truth, and API-trace or telemetry access (ARXIV-2510.20211)"
  risks_and_guardrails:
    - "Agents cannot tell a broken tool from a real infrastructure problem unless outputs are cross-checked (ARXIV-2603.02345)."
    - "NIST's draft profile asks organisations to keep evaluating whether AI defence capabilities are mature enough (NIST-IR8596-2025)."
  human_checkpoints:
    - "Not described in the abstracts; the governance deep dive infers engineer review of proposed IaC updates before merge"
  role_evolution: >-
    No source describes a role change for this use.
  evidence_grade: D
  sources:
    - {ref: ARXIV-2510.20211, title: "Automated Cloud Infrastructure-as-Code Reconciliation with AI Agents (NSync) (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2510.20211", date: "2025-10-23", access: full, locator: "Abstract"}
    - {ref: ARXIV-2603.02345, title: "RIVA: Leveraging LLM Agents for Reliable Configuration Drift Detection (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.02345", date: "2026-03-02", access: full, locator: "Abstract"}
    - {ref: NIST-IR8596-2025, title: "NIST IR 8596 (initial preliminary draft): Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Section 2.1.2 (Defend), 'Mission assurance: configuration management', pp.10-12"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: from governance 07; research prototypes only, no named organisation's production use found. Kept because it
    is the only reconcile-exceptions pattern in the module.

# ---------------------------------------------------------------------------------------------------------------
# Area 6: network and edge policy
# ---------------------------------------------------------------------------------------------------------------

- id: security-cloud-infrastructure-13
  title: "Virtual patching at the WAF and network layer for newly found vulnerabilities, with AI-assisted rule generation and tuning"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Patching takes weeks: a fwd:cloudsec abstract cites a 43-day median time to patch a critical vulnerability, and says
    tuning WAF (web application firewall) rules across hundreds of technology stacks and owners does not scale with
    headcount (FWDCLOUDSEC-ALIM-2026). Palo Alto Networks' announcement says critical-infrastructure operators find that
    uptime and safety testing prevent patching at AI speed (PANW-FRONTIERCDP-2026).
  solution: >-
    In-house: a DevSecOps manager at Adobe (per the speaker biography) describes AI-assisted rule generation and
    context-aware tuning inside a human-in-the-loop pipeline, aiming to shorten the path from vulnerability disclosed to
    fleet protected without a WAF expert in every product team (FWDCLOUDSEC-ALIM-2026). Vendor: Palo Alto Networks
    announced Frontier Virtual Patching, network-level patches delivered through its Frontier AI Critical Defense
    Program (2026-08-19) (PANW-FRONTIERCDP-2026), and a collaboration with IBM and Red Hat under which network-level
    protections for a newly discovered flaw can be deployed the same day (2026-06-24) (PANW-LIGHTWELL-2026).
  outcomes:
    - lever: speed
      description: "Claim in the Adobe manager's talk abstract"
      figure: "'from 43 days to single-digit minutes' (claimed capability)"
      measures: "the abstract says the approach 'can compress' the cycle from disclosure to fleet protected; 43 days is the industry median the speaker cites, not a measured Adobe baseline"
      provenance: self-reported
      source_ref: FWDCLOUDSEC-ALIM-2026
  prerequisites:
    - "A WAF or network enforcement point that can take rules in minutes, and an inventory of stacks and owners behind it"
    - "Vulnerability intelligence from the software owner or a disclosure partner (PANW-LIGHTWELL-2026)"
    - "A testing path so a rule does not become a reliability incident"
  risks_and_guardrails:
    - "Rules that are too broad are useless and rules that are too tight become reliability incidents (FWDCLOUDSEC-ALIM-2026)."
    - "Palo Alto Networks says it plans to establish secure processes for sharing vulnerability information (PANW-LIGHTWELL-2026)."
    - "These are announcements and a conference abstract; no deployment outcome is published."
  human_checkpoints:
    - "Human-in-the-loop pipeline for rule approval (FWDCLOUDSEC-ALIM-2026)"
    - "IBM Security Services can help customers prioritise, deploy and validate protections (PANW-LIGHTWELL-2026)"
  role_evolution: >-
    The abstract frames the AI as a teammate that needs supervision, clear trust boundaries and a good memory of what
    normal looks like, inside a human-in-the-loop pipeline, without a WAF expert in every product team
    (FWDCLOUDSEC-ALIM-2026).
  evidence_grade: C
  sources:
    - {ref: FWDCLOUDSEC-ALIM-2026, title: "The Tireless Guardian: Agentic AI and the Art of WAF at Scale (Ammar Alim, Adobe)", publisher: "fwd:cloudsec North America 2026", type: conference, url: "https://pretalx.com/fwd-cloudsec-2026/talk/XEMZWB/", date: "2026-06-01", access: full, locator: "Talk abstract and speaker bio (talk not viewed)"}
    - {ref: PANW-FRONTIERCDP-2026, title: "Palo Alto Networks Introduces Frontier AI Critical Defense Program", publisher: "Palo Alto Networks (press release)", type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-introduces-frontier-ai-critical-defense-program", date: "2026-08-19", access: full, locator: "Opening paragraphs"}
    - {ref: PANW-LIGHTWELL-2026, title: "IBM, Red Hat and Palo Alto Networks Expand Project Lightwell to Help Organizations Respond to Software Vulnerabilities", publisher: "Palo Alto Networks (press release)", type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/ibm-red-hat-and-palo-alto-networks-expand-project-lightwell-to-help-organizations-respond-to-software-vulnerabilities", date: "2026-06-24", access: full, locator: "'A Seamless Shield-and-Fix Workflow'; key capabilities"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 08 and discourse 08. Grade C: the abstract does not say the AI pipeline runs in production, and
    Palo Alto statements use plans language. Overlaps vulnerability-exposure and the optional OT module.

- id: security-cloud-infrastructure-14
  title: "AI firewall policy hygiene: flag stale, overly permissive and conflicting rules from observed traffic"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Firewall rulebases grow through temporary exceptions, cloud deployments and new AI-driven workloads; Check Point
    says policies become risky after months of incremental changes, and reviews wait for the next policy review cycle
    (CHECKPOINT-AGENTICNET-2026).
  solution: >-
    Cato Networks' AI-Driven Posture agent analyses rule behaviour against traffic across Internet, WAN and LAN firewalls
    and remote port forwarding, flags forgotten test rules and overly permissive rules, and a wizard recommends rules to
    enable (CATO-AUTONOMOUSPOL-2026). Check Point's AI Auditor and AI Insights look for redundant rules, excessive
    permissions, conflicts and unused access paths, and prioritise IPS protections by risk (CHECKPOINT-AGENTICNET-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "product documentation and a vendor blog; Cato's examples are illustrative scenarios without named customers"
      provenance: vendor-published
      source_ref: CATO-AUTONOMOUSPOL-2026
  prerequisites:
    - "Traffic and rule telemetry from the vendor's cloud (CATO-AUTONOMOUSPOL-2026)"
    - "Administrators able to accept or reject each recommendation"
  risks_and_guardrails:
    - "Check Point says the goal is not to automate security decisions but to reduce the manual analysis needed to make them (CHECKPOINT-AGENTICNET-2026)."
    - "Cato presents recommendations that administrators choose to apply (CATO-AUTONOMOUSPOL-2026)."
  human_checkpoints:
    - "Administrators select which recommended rules to apply (CATO-AUTONOMOUSPOL-2026)"
  role_evolution: >-
    Check Point says security teams spend much of their time reviewing firewall rules and validating protections, and
    expects more of their time to go to risk-based decisions (CHECKPOINT-AGENTICNET-2026).
  evidence_grade: C
  sources:
    - {ref: CATO-AUTONOMOUSPOL-2026, title: "Understanding Cato Autonomous Policies (product documentation)", publisher: "Cato Networks", type: vendor, url: "https://knowledge.catonetworks.com/docs/understanding-cato-autonomous-policies", date: "2026-08-27", access: full, locator: "Overview; 'Autonomous Policies Use Cases'"}
    - {ref: CHECKPOINT-AGENTICNET-2026, title: "When Security Operations Can't Keep Up: 4 Ways Agentic Network Security Management Improves Security Operations", publisher: "Check Point", type: vendor, url: "https://blog.checkpoint.com/hybrid-mesh/when-security-operations-cant-keep-up-4-ways-agentic-network-security-management-improves-security-operations/", date: "2026-09-18", access: full, locator: "Sections 1, 3 and closing"}
  last_reviewed: "2026-10-17"
  notes: >-
    Kept because network policy is part of this module; evidence is product documentation only. Check Point says its
    management features are powered by OpenAI Daybreak frontier models (vendor statement).

- id: security-cloud-infrastructure-15
  title: "Intent-to-rule firewall and network policy authoring, with change-impact checks grounded in live topology"
  archetype: security
  module: cloud-infrastructure
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Firewall change-impact analysis used to come from third-party policy tools that assessed a change from outside the
    platform being changed (FWCHANGE-VENDORAI-2026). Network policy is large and heterogeneous, and LLMs translate intent
    well but miss policy violations when not grounded in topology (ARXIV-2609.21103).
  solution: >-
    FwChange lists vendor features that take an intent, write or evaluate a rule and report its effect: Fortinet
    FortiAI-Assist in FortiManager, Palo Alto Networks Policy Analyzer in Strata Cloud Manager, Check Point Agentic
    Network Security Orchestration and Cisco's Policy Change Impact Analyzer in AgenticOps, released 2026-09-17 per
    FwChange (FWCHANGE-VENDORAI-2026). Research adds a layer that retrieves live network facts and checks each proposed
    intent against existing security policy before approval (ARXIV-2609.21103).
  outcomes:
    - lever: quality
      description: "NetInspector research prototype: grounded verification lowers missed policy violations"
      figure: "over 30% lower false-negative rate"
      measures: "false-negative rate when checking whether a proposed intent violates existing policy, versus ungrounded baselines, on a 2,224-sample synthetic benchmark (abstract)"
      provenance: independent
      source_ref: ARXIV-2609.21103
    - lever: quality
      description: "Adoption of vendor features"
      figure: "none published"
      measures: "FwChange relays a Gartner statement (via a Redmond Channel Partner summary) that customers are 'not yet fully using' AI orchestration and LLM assistants for everyday firewall administration"
      provenance: vendor-published
      source_ref: FWCHANGE-VENDORAI-2026
  prerequisites:
    - "A live, queryable model of network topology (ARXIV-2609.21103)"
    - "Impact analyses exportable to a record outside the vendor console, so a change board can review them (FWCHANGE-VENDORAI-2026)"
  risks_and_guardrails:
    - "FwChange argues that when the same vendor platform writes the rule and grades it, four-eyes review becomes two eyes owned by one company, citing NIST SP 800-53 CM-4 and AC-5 on separation of duties (FWCHANGE-VENDORAI-2026)."
    - "NIST's draft Cyber AI Profile says AI-initiated network changes should be gated by human approval or policy-based checks (NIST-IR8596-2025)."
  human_checkpoints:
    - "The change board signs the change; FwChange argues it needs independent impact evidence (FWCHANGE-VENDORAI-2026)"
    - "Human approval or a policy-based check before an AI-initiated network change (NIST-IR8596-2025)"
  role_evolution: >-
    FwChange argues vendor AI fits drafting rules and spotting duplicates, while the impact statement for the change board
    and post-change verification need an independent check that the change policy should name (FWCHANGE-VENDORAI-2026).
  evidence_grade: C
  sources:
    - {ref: FWCHANGE-VENDORAI-2026, title: "Your Firewall Vendor's AI Now Grades Its Own Changes. That Is Why Few Use It Daily", publisher: "FwChange", type: vendor, url: "https://fwchange.com/blog/vendor-ai-firewall-change-impact-analysis/", date: "2026-10-01", access: full, locator: "Vendor table; 'Why aren't customers using the AI they already bought?'"}
    - {ref: ARXIV-2609.21103, title: "NetInspector: Measuring and Improving LLM Capabilities for Reliable Intent-Based Networking Policy Generation (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.21103", date: "2026-09-17", access: full, locator: "Abstract"}
    - {ref: NIST-IR8596-2025, title: "NIST IR 8596 (initial preliminary draft): Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Profile table, PR.IR-01, Defend column"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: discourse 16 and governance 08 (idea: intent-to-network-policy with verify-then-act checks). Grade C:
    FwChange sells independent change management, so its argument is interested, and its vendor descriptions and the
    Gartner statement are second-hand; the research benchmark is synthetic.

