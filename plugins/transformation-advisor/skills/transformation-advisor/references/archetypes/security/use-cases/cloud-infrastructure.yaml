- id: security-cloud-infrastructure-21
  title: "Continuous compliance for cloud controls: AI-assisted evidence collection inside an authorised boundary and LLM-drafted policy as code"
  archetype: security
  module: cloud-infrastructure
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Point-in-time compliance checks struggle to keep pace with dynamic cloud environments, and public-sector teams need
    AI workload discovery and remediation inside a FedRAMP High boundary (WIZ-FORGOV-2026). Policy-as-code adoption is
    hindered by the complexity of policy languages and the risk of misconfiguration (ARXIV-2507.10584).
  solution: >-
    Wiz announced on 2026-10-14 that its Red, Blue and Green agents are available in Wiz for Gov, its FedRAMP High
    environment, and says continuous visibility enhanced by AI analysis simplifies evidence collection and risk-posture
    tracking for continuous authorisation to operate and continuous monitoring (WIZ-FORGOV-2026). Research pipelines turn
    natural-language policy into executable Rego (the OPA policy language), test it, and check or correct Terraform
    against it (ARXIV-2603.15799; ARXIV-2507.10584). NIST's draft Cyber AI Profile lists automated policy enforcement and
    compliance assessment, including FedRAMP-type regimes, among defensive AI opportunities (NIST-IR8596-2025).
  outcomes:
    - lever: quality
      description: "Prose2Policy research prototype: natural-language access policy to executable Rego"
      figure: "95.3% compile rate; 82.2% positive-test and 98.9% negative-test pass"
      measures: "compile rate for accepted policies and automated test pass rates on the ACRE dataset (abstract)"
      provenance: independent
      source_ref: ARXIV-2603.15799
    - lever: speed
      description: "Wiz for Gov agents"
      figure: "none published"
      measures: "launch announcement; Wiz claims it is the first AI-APP for the US public sector (vendor claim)"
      provenance: vendor-published
      source_ref: WIZ-FORGOV-2026
  prerequisites:
    - "A FedRAMP High tenancy for the Wiz case, with operational boundaries set per workflow (WIZ-FORGOV-2026)"
    - "A policy engine and test harness (OPA/Rego in the studies) (ARXIV-2603.15799)"
  risks_and_guardrails:
    - "CISA BOD 26-04, issued 2026-06-10 according to CrowdStrike's summary, replaces BOD 19-02 and BOD 22-01 and requires risk-based remediation using public exposure, KEV status, exploit automatability and technical impact; the highest-risk cases carry a three-calendar-day clock (CROWDSTRIKE-BOD2604-2026)."
    - "The research tools lint, compile and generate tests to bound unreliable policy text, with auditability as a design aim (ARXIV-2603.15799)."
    - "In CSA's 2026 financial-services survey (n=340), CSPM is used by 56%, cloud XDR by 40%, CNAPP by 39% and CWPP by 28%; the report labels itself 'Unofficial AI-assisted Research' (CSA-FSCLOUD-2026)."
  human_checkpoints:
    - "Human-in-the-loop approval configurable per workflow for sensitive systems (WIZ-FORGOV-2026)"
    - "Policy owner approves generated rules before enforcement (not stated in the research abstracts)"
  role_evolution: >-
    Wiz says agents act as a force multiplier for human operators and move teams from point-in-time compliance to
    continuous lifecycle-wide risk management (WIZ-FORGOV-2026).
  evidence_grade: C
  sources:
    - {ref: WIZ-FORGOV-2026, title: "Wiz AI Agents for FedRAMP High: Accelerate Public Sector AI (Securing the Mission at Machine Speed)", publisher: "Wiz", type: vendor, url: "https://www.wiz.io/blog/wiz-for-gov-agents-fedramp", date: "2026-10-14", access: full, locator: "'From CNAPP to AI-APP'; 'Introducing Wiz AI Agents in Wiz for Gov'; 'Delivering Mission Outcomes at Scale'"}
    - {ref: CROWDSTRIKE-BOD2604-2026, title: "CrowdStrike Falcon Platform Helps Meet U.S. Government Mandates for CISA BOD-26-04", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-falcon-platform-helps-meet-us-government-mandates-cisa-bod-26-04/", date: "2026-07-22", access: full, locator: "Opening paragraphs"}
    - {ref: ARXIV-2603.15799, title: "Prose2Policy (P2P): A Practical LLM Pipeline for Translating Natural-Language Access Policies into Executable Rego (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.15799", date: "2026-03-16", access: full, locator: "Abstract"}
    - {ref: ARXIV-2507.10584, title: "ARPaCCino: An Agentic-RAG for Policy as Code Compliance (arXiv preprint, abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2507.10584", date: "2025-07-11", access: full, locator: "Abstract"}
    - {ref: NIST-IR8596-2025, title: "NIST IR 8596 (initial preliminary draft): Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Section 2.1.2 (Defend), 'Mission assurance', pp.10-11"}
    - {ref: CSA-FSCLOUD-2026, title: "State of Cloud and AI for Financial Services, 2026 Industry Survey Report (340 respondents; marked 'Unofficial AI-assisted Research')", publisher: "Cloud Security Alliance (CSAI Foundation)", type: survey, url: "https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/04/state-of-cloud-and-ai-for-financial-services-2026-v1.pdf", date: "2026-03-31", access: full, locator: "PDF p.11, 'Security Posture: Tools, Risks, and Priorities'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: practice 13 (FedRAMP High agents) and governance 12 (idea: LLM-drafted policy as code). Grade C: a launch
    announcement and research prototypes. BOD 26-04 details come from a vendor's summary because CISA's site blocked
    access.

