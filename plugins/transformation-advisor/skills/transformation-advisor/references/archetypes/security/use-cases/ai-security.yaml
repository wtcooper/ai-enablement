- id: security-ai-security-13
  title: "Treat untrusted content as hostile input: screen it before the model reads it and constrain what the model can trigger, including the security team's own LLMs"
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Attackers place instructions where an LLM will read them: resumes, email, retrieved pages, tool results, and the log
    fields, alerts and code that SOC copilots and LLM scanners read. A single crafted email enabled a zero-click
    exfiltration exploit in a production copilot (ARXIV-2509.10540), and Google's threat group reports malware loaders
    carrying text apparently meant to make LLM security scanners refuse or skip analysis (GTIG-AITRACKER-2026).
  solution: >-
    Put detectors and provenance controls between untrusted content and the model: purpose-built detectors, stripping
    invisible characters, modality-aware filters and provenance-labelled channels (OWASP-LLM-2026). Anthropic describes an
    API-side probe that scans tool results for hijack attempts and adds a warning to the model's context
    (ANTHROPIC-AUTOMODE-2026). For the security team's own AI, confine an analyst model to a closed vocabulary of intents
    whose templated commands thin endpoint agents run, validate arguments before anything crosses the trust boundary, wrap
    the model in input and output rails (ARXIV-2610.09906), and red-team SOC copilots and code-scanning LLMs with
    adversarial log and code content (ARXIV-2605.24421).
  outcomes:
    - lever: risk
      description: About 1% of roughly 200,000 resumes contained hidden prompt injections; prevalence rose over the past one to two years, and more than 90% used no explicit instruction.
      figure: "About 1% of about 200K resumes; more than 90% non-explicit"
      measures: "Share of resumes collected over multiple years by an anonymised company that contained hidden prompt injections (abstract)"
      provenance: independent
      source_ref: USENIX-RESUME-2026
    - lever: risk
      description: In a lab attack that first guaranteed retrieval, one poisoned email was enough to make GPT-4o exfiltrate SSH keys with over 80% success in a multi-agent workflow; tested defences did not prevent retrieval of the malicious text.
      figure: "More than 80%"
      measures: "Attack success in the authors' end-to-end exploit (abstract)"
      provenance: independent
      source_ref: USENIX-IPIRETRIEVAL-2026
    - lever: quality
      description: >-
        With gpt-4o-mini as the analyst, persona-hijack attacks suppressed 68% of malicious logs under a naive classifier,
        and context manipulation reached 96% injection success in summarisation without defences (38% with constrained
        output).
      figure: "68%; 96%; 38%"
      measures: "Suppression of malicious logs and injection success in summarisation, across 48 strategy-defence-task combinations (lab, one analyst model)"
      provenance: independent
      source_ref: ARXIV-2605.24421
    - lever: quality
      description: Average injection success fell from 26.6% under naive prompting to 11.8% under the authors' strongest defence.
      figure: "26.6% to 11.8%"
      measures: "Average injection success across the 48 combinations"
      provenance: independent
      source_ref: ARXIV-2605.24421
  prerequisites:
    - "A choke point between untrusted content and the model, with logging of blocked and flagged content"
    - "Inventory of LLM-based security tools and the untrusted fields they read"
    - "Labelled data and an adversarial corpus to build and test detectors; deterministic output schemas and limits on what a copilot can trigger"
  risks_and_guardrails:
    - "OWASP says semantic filters are evadable by rephrasing or encoding, and stripping invisible characters does not stop visible-text payloads (OWASP-LLM-2026, LLM01 mitigations 3 and 5, p.14)."
    - "EchoLeak chained several bypasses, including of the vendor's injection classifier (ARXIV-2509.10540); adaptive attacks bypassed 12 published defences (ARXIV-2510.09023)."
    - "Defences reduced but did not eliminate success in the log study, and its authors conclude SOC copilots should treat raw log content as adversarial input (ARXIV-2605.24421)."
    - "A DEF CON 34 abstract describes a production model used as the gate between anonymous pull requests and CI secrets being bypassed (DEFCON-34-SPEAKERS-2026, 'LGTM')."
    - "Google says it hardened its classifiers and model against the malware's adversarial prompts (GTIG-AITRACKER-2026)."
  human_checkpoints:
    - "Recruiters or analysts review content flagged as injected; security reviews detector precision before blocking"
    - "Analyst confirms any benign or suppress decision before closing an alert"
    - "Detection engineers review red-team results before copilots are given response authority"
  role_evolution: >-
    Content owners (HR, support, email security) become part of the AI threat-surface review; the resume study's
    co-authors include a recruiting-platform company (USENIX-RESUME-2026). Detection engineers add adversarial-input
    testing of their own AI tools (ARXIV-2605.24421).
  evidence_grade: B
  sources:
    - {ref: USENIX-RESUME-2026, title: "Measuring Real-World Prompt Injection Attacks in LLM-based Resume Screening", publisher: "USENIX Security Symposium 2026 (UNC Chapel Hill, Duke, ASU, hireEZ, UC Berkeley)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/zhang-mohan", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: USENIX-IPIRETRIEVAL-2026, title: "Overcoming the Retrieval Barrier: Indirect Prompt Injection in the Wild for LLM Systems", publisher: "USENIX Security Symposium 2026 (MBZUAI)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/chang-hongyan", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2509.10540, title: "EchoLeak: The First Real-World Zero-Click Prompt Injection Exploit in a Production LLM System", publisher: "arXiv preprint", type: academic, url: "https://arxiv.org/abs/2509.10540", date: "2025-09-06", access: full, locator: "Abstract"}
