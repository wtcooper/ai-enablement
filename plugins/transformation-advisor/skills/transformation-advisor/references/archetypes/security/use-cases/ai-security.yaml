    - {ref: CISA-FVEY-2026, title: "Five Eyes Cyber Security Agencies Statement", publisher: "CISA, ASD's ACSC, Canadian Cyber Centre, NCSC-NZ, NCSC-UK, NSA", type: regulator, url: "https://www.cisa.gov/news-events/news/five-eyes-cyber-security-agencies-statement", date: "2026-06", access: full, locator: "'A whole-of-organization and whole-of-society response is required'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: governance-assurance-04 (tiering, B), -16 (board governance, C), -08 (crosswalks, C) and -18 (baseline gap
    assessment, C). Grade B rests on MSCI's described tiering framework (no measurements; top-tier certification
    planned). MSCI's agent counts are practitioner statements in a vendor case study. US agency pages now use 'super
    intelligence' for 'AI' after an Executive Order of 2026-09-29; search both terms. Overlaps security-governance-risk.

- id: security-ai-security-23
  title: Independent adversarial testing of a specific high-risk agent to give auditors evidence it does what policy says
  archetype: security
  module: ai-security
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    MSCI had an AI governance programme, ISO 42001 work and SOC 2, but its CISO said none answered the auditor question of
    whether the agent does what the policy says and can be proven to. A SecOps agent that approves privileged-access
    requests brought the agent into SOX scope (AIUC-MSCI-2026).
  solution: >-
    MSCI chose the privileged-access SecOps agent as the first test case. AIUC scoped it with MSCI engineers, agreed grading
    criteria, validated sample tests, then scaled up across benign, social-engineering and adversarial cases. AIUC delivered
    a report on methodology, test design and performance that MSCI used for its SOX programme (AIUC-MSCI-2026).
  outcomes:
    - lever: quality
      description: The agent passed with no major or significant vulnerabilities; remaining low-severity cases were timeouts, upstream platform controls or the agent being stricter than required.
      figure: "About 1,400 tests; 112 privileged roles; no major or significant vulnerabilities"
      measures: "Tests run by AIUC against MSCI's SecOps agent across benign, social-engineering and adversarial risks, covering 112 privileged roles; results by severity as reported by AIUC (no counts by severity given)"
      provenance: vendor-published
      source_ref: AIUC-MSCI-2026
    - lever: risk
      description: Evidence package usable by auditors for a SOX-scoped agent.
      figure: "none published"
      measures: "Qualitative: the CISO says the report was 'exactly what we needed' for the SOX programme"
      provenance: vendor-published
      source_ref: AIUC-MSCI-2026
  prerequisites:
    - "An existing AI governance programme, ISO 42001 work and SOC 2 with an independent auditor (AIUC-MSCI-2026)"
    - "A single well-understood high-stakes agent and agreed grading criteria before scale-up"
  risks_and_guardrails:
    - "The case study is written by the standard's owner, which also sells certification and insurance; MSCI figures are quoted, not independently audited (AIUC-MSCI-2026; AIUC-1-2026)."
    - "One agent was tested; the pass says nothing about MSCI's other agents or about drift after deployment (AIUC-MSCI-2026)."
  human_checkpoints:
    - "MSCI engineers and AIUC agree scope and grading criteria; MSCI's auditors examine the report (AIUC-MSCI-2026)"
  role_evolution: >-
    MSCI's CISO, who oversees the AI governance programme, took agent test evidence to auditors rather than relying on
    policy documents alone (AIUC-MSCI-2026).
  evidence_grade: A
  sources:
    - {ref: AIUC-MSCI-2026, title: "How MSCI secures its highest-risk AI agents with AIUC-1 (case study)", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/research/how-msci-secures-its-highest-risk-ai-agents-with-aiuc-1", date: "2026-09-24", access: full, locator: "Sections 'When an AI agent is in scope for SOX' and 'Why AIUC-1'"}
    - {ref: AIUC-1-2026, title: "AIUC-1 Standard (home page; 'Last updated Q4: Oct 15, 2026')", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/", date: "2026-10-15", access: full, locator: "Home page: MSCI listed as 'Adopted AIUC-1'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Source: governance-assurance-03. Grade A under the 2026-10-17 rule: the test and role counts and the severity finding
    are results the tester reports from its own testing, not a practitioner's recollection; but every figure comes from a
    vendor-authored case study with no independent check, and the counts are activity measures. The CISO's quote is B-level
    evidence. The same evidence supports the tiering in security-ai-security-22. Overlaps assurance-assurance-over-ai-19
    (AIUC-1 agent certification, assurance archetype).

- id: security-ai-security-24
  title: "Third-party AI assurance: due diligence on AI vendors and embedded AI, relying on independent certification (ISO/IEC 42001, CSA STAR for AI) only under conditions"
  archetype: security
  module: ai-security
  function: risk-compliance-legal
  work_types: [review-assurance, transaction-processing]
  pattern: intake-triage
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI enters through procurement and through features switched on in existing SaaS. Vendors guard model details, boards
    rarely discuss it, and regulators say the buyer stays accountable; provider self-attestations carry little weight
    (MAS-AIRM-RESPONSE-2026; CSA-SCHELLMAN-2026).
  solution: >-
    Cengage's team describes building an AI security and governance programme from scratch, assessing AI vendors and
    red-teaming its own AI integrations (BSIDESLV-2026). MAS says the firm remains accountable for third-party AI, expects
    risk-proportionate visibility into provider practices, and expects it to limit, suspend or replace a provider when
    residual risk exceeds appetite (MAS-AIRM-RESPONSE-2026, sections 9.3-9.5). NYDFS expects due diligence on vendors that
    use AI (NYDFS-AIIL-2024); CSA's AI-CAIQ questionnaire evaluates vendors against the AI Controls Matrix (CSA-AICM-2026).
    Providers obtain accredited certification of their AI management system (ISO/IEC 42001, an audit of an organisation's
    AI policies, roles and controls): Anthropic announced ANAB-accredited certification issued by Schellman
    (ANTHROPIC-ISO42001-2025) and Microsoft lists in-scope offerings (MSFT-ISO42001-2026). CSA STAR for AI Level 2 requires
    third-party ISO/IEC 42001 certification plus a validated AI-CAIQ (CSA-STARAI-2026). MAS allows reliance on such
    certifications when independent, competent and relevant to the risk (MAS-AIRM-RESPONSE-2026, section 9.9).
  outcomes:
    - lever: capacity
      description: Cengage says it assessed 67 AI vendors in 15 months.
      figure: "67 AI vendors in 15 months"
      measures: "AI vendors assessed by Cengage's programme, as stated in a conference talk abstract; no findings, rejection rates or staffing given"
      provenance: self-reported
      source_ref: BSIDESLV-2026
    - lever: risk
      description: Board attention to third-party AI is low in a certifier's survey.
      figure: "36% of boards regularly discuss third-party AI risk"
      measures: "Surveyed US enterprise leaders (more than 500) whose boards regularly discuss third-party AI risk (Schellman, summarised by CSA)"
      provenance: vendor-published
      source_ref: CSA-SCHELLMAN-2026
    - lever: risk
      description: No measured effect of certification on incidents or assurance cost has been published; the outcome is the existence of the certificate.
      figure: "none published"
      measures: "Certification issued; Anthropic announcement dated 2025-01-13"
      provenance: self-reported
      source_ref: ANTHROPIC-ISO42001-2025
  prerequisites:
    - "AI-specific questions in vendor onboarding and renewal, covering embedded AI (MAS-AIRM-RESPONSE-2026, sections 2.10-2.11)"
    - "Contract terms for incident notice, including AI-related events (NYDFS-AIIL-2024), and change notification scaled to risk"
  risks_and_guardrails:
    - "MAS accepts independent certifications or external assessments from independent, expert parties that cover the risks in question, but says provider self-attestations unsupported by evidence are generally not effective (MAS-AIRM-RESPONSE-2026, sections 9.6-9.9)."
    - "MAS does not expect firms to receive and assess every update to third-party AI in all cases (MAS-AIRM-RESPONSE-2026, section 9.13)."
    - "A management-system certificate shows process, not that a given agent behaves safely; MSCI's CISO said ISO 42001 work and SOC 2 did not answer the agent-behaviour question (AIUC-MSCI-2026)."
    - "Certifiers earn fees from certification; Schellman issued Anthropic's certificate and also ran the survey cited (ANTHROPIC-ISO42001-2025; CSA-SCHELLMAN-2026)."
    - "FINRA reports more cyberattacks and outages at member firms' vendors and expects supervisory procedures for outsourced functions (FINRA-ROR-2026)."
  human_checkpoints:
    - "Security and procurement approve onboarding with conditions"
    - "Buyer's risk team decides whether the certificate scope covers the service used; additional testing on the firm's own data where transparency is limited (MAS-AIRM-RESPONSE-2026, sections 9.9-9.10)"
  role_evolution: >-
    Cengage's abstract describes the security team moving away from being the 'Department of No' (BSIDESLV-2026). Risk
    teams add certificate review to AI vendor assessments (MAS-AIRM-RESPONSE-2026, section 9.9).
  evidence_grade: B
  sources:
    - {ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talks", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026-08-03", access: full, locator: "'From the Wild West to Yes, If: Building an AI Security & Governance Program' (Cengage, Tuesday 2026-08-04; abstract)"}
    - {ref: MAS-AIRM-RESPONSE-2026, title: "Response to Feedback Received on Guidelines on Artificial Intelligence Risk Management (P017-2025, 57 pages)", publisher: "Monetary Authority of Singapore", type: regulator, url: "https://www.mas.gov.sg/-/media/mas-media-library/publications/consultations/bd/2025/response-to-feedback-received-on-guidelines-on-artificial-intelligence-risk-management.pdf", date: "2026-10-07", access: full, locator: "Section 9; sections 2.10-2.11"}
    - {ref: NYDFS-AIIL-2024, title: "Industry Letter: Cybersecurity Risks Arising from AI and Strategies to Combat Related Risks", publisher: "New York State Department of Financial Services", type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Third-Party Service Provider and Vendor Management"}
    - {ref: CSA-AICM-2026, title: "AI Controls Matrix v1.1", publisher: "Cloud Security Alliance", type: standard-setter, url: "https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1", date: "2026-06-22", access: full, locator: "AI-CAIQ"}
    - {ref: ANTHROPIC-ISO42001-2025, title: "Anthropic achieves ISO 42001 certification for responsible AI", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/anthropic-achieves-iso-42001-certification-for-responsible-ai", date: "2025-01-13", access: full, locator: "Announcement text"}
    - {ref: MSFT-ISO42001-2026, title: "ISO/IEC 42001:2023 Artificial Intelligence Management System Standards (Microsoft Compliance)", publisher: "Microsoft", type: vendor, url: "https://learn.microsoft.com/en-us/compliance/regulatory/offering-iso-42001", date: "2026-09-11", access: full, locator: "Product list and audit statements"}
    - {ref: CSA-STARAI-2026, title: "CSA STAR for AI (program page)", publisher: "Cloud Security Alliance", type: standard-setter, url: "https://cloudsecurityalliance.org/star/ai/", date: "2026-10-17", access: full, locator: "'Levels of STAR for AI'; 'STAR for AI Level 2'"}
    - {ref: CSA-SCHELLMAN-2026, title: "Enterprise Reality: Why Organizations Aren't as Prepared for AI Governance as They Think They Are (CSA blog republishing Schellman's summary of its 2026 State of AI Governance Report)", publisher: "Cloud Security Alliance / Schellman", type: survey, url: "https://cloudsecurityalliance.org/blog/2026/09/16/enterprise-reality-why-organizations-aren-t-as-prepared-for-ai-governance-as-they-think-they-are", date: "2026-09-16", access: full, locator: "Section 'Boards are Behind on the One Risk They Can't See'"}
    - {ref: AIUC-MSCI-2026, title: "How MSCI secures its highest-risk AI agents with AIUC-1 (case study)", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/research/how-msci-secures-its-highest-risk-ai-agents-with-aiuc-1", date: "2026-09-24", access: full, locator: "Section 'When an AI agent is in scope for SOX'"}
    - {ref: FINRA-ROR-2026, title: "2026 FINRA Annual Regulatory Oversight Report: GenAI section (incl. AI agents) and Third-Party Risk Landscape", publisher: "FINRA", type: regulator, url: "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", date: "2025-12-09", access: full, locator: "Third-Party Risk Landscape page"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: governance-assurance-05 (due diligence, B) and -06 (provider certification, B). Grade B: Cengage and the
    certified providers are named, without measured outcomes; the Cengage count comes from a talk abstract and is not
    verified. The ISO standard page itself was not reachable. Job postings asking for ISO 42001 credentials were seen in
    search only and are not used. Overlaps security-governance-risk (vendor risk) and the assurance archetype's
    assurance-over-ai module (certification services).

- id: security-ai-security-25
  title: Agent certification with independent quarterly testing, tied to insurance underwriting (AIUC-1)
  archetype: security
  module: ai-security
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Enterprise buyers want proof that a vendor's agent is secure, safe and reliable, while traditional insurers are
    reported to be excluding AI liability from standard policies (OWASP-STATE-AGENTIC-2026, p.67).
  solution: >-
    AIUC publishes AIUC-1, a standard for agent security, safety and reliability whose controls are tested by red-teaming
    and independent audits, and offers certification, auditing and insurance. Its site lists certified agents from Cursor,
    Fin, ElevenLabs, Harvey, UiPath and KPMG, and MSCI as an adopter. Fin's CISO describes 'quarterly independent testing'
    with published results; UiPath's head of GRC says testing produced new guardrails (AIUC-1-2026).
  outcomes:
    - lever: growth
      description: Vendors state that certification supports enterprise sales and product improvement; no figures are published.
      figure: "none published"
      measures: "Qualitative customer quotes on the AIUC-1 site"
      provenance: vendor-published
      source_ref: AIUC-1-2026
  prerequisites:
    - "A scoped agent, access for testers and a certification engagement (AIUC-MSCI-2026)"
    - "Dedicated AI insurers reportedly require demonstrated governance as an underwriting prerequisite (OWASP-STATE-AGENTIC-2026, p.67)"
  risks_and_guardrails:
    - "Conflict of interest: the standard's maintainer describes itself as offering certification, auditing and insurance for AI agents (AIUC-MSCI-2026, company description; AIUC-1-2026)."
    - "AIUC's own pages disagree on consortium size: 300-plus Fortune 500 security leaders on the home page, 250 CISOs and risk leaders from the Fortune 1000 in the MSCI case study (AIUC-1-2026; AIUC-MSCI-2026)."
    - "OWASP's insurance-exclusion claims were not checked against primary insurer documents (OWASP-STATE-AGENTIC-2026, p.67)."
  human_checkpoints:
    - "Independent auditor and red-team testers issue results; the buyer decides whether to accept the certificate"
  role_evolution: >-
    Vendor security and trust teams own a recurring third-party test cycle for each agent product, and buyers' GRC teams
    read certificates (AIUC-1-2026).
  evidence_grade: B
  sources:
    - {ref: AIUC-1-2026, title: "AIUC-1 Standard (home page; 'Last updated Q4: Oct 15, 2026')", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/", date: "2026-10-15", access: full, locator: "Certified Agents list and case-study quotes"}
    - {ref: AIUC-MSCI-2026, title: "How MSCI secures its highest-risk AI agents with AIUC-1 (case study)", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/research/how-msci-secures-its-highest-risk-ai-agents-with-aiuc-1", date: "2026-09-24", access: full, locator: "'About AIUC' paragraph"}
    - {ref: OWASP-STATE-AGENTIC-2026, title: "State of Agentic AI Security and Governance, version 2.01 (139-page PDF)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/", date: "2026-06-01", access: full, locator: "'Cyber Insurance Coverage Collapse for Agentic AI Deployments', pp.67-68"}
  last_reviewed: "2026-10-17"
  notes: >-
    Source: governance-assurance-07. Change scope 'model': a new service (certification tied to insurance) and a new
    sourcing of assurance. Grade B: named certified agents appear on the standard owner's own site, with no measurements
    beyond MSCI. Whether insurance policies have been issued to the listed firms was not found. The same certification is
    covered from the assurance provider's side in assurance-assurance-over-ai-19.
