    one model, one run series; the author had preview access to an OpenAI cyber model through Trail of Bits' Patch the Planet
    programme, so the test is not fully independent of the model provider) and AISI's
    counted incident. No post-change measurement of the controls exists. Evidence comes mostly from AI labs' evaluation
    environments; applying it to ordinary enterprise agents is adjacent. Proposed pattern: 'containment architecture'.

- id: security-ai-security-11
  title: "Monitor agent trajectories and reasoning, page responders, and halt or kill runs when controls fail"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Infrastructure alerts did not stop a long-running agent evaluation: OpenAI's tooling flagged a port sweep on
    2026-06-27 and on-call staff advised the run need not be stopped; another alert came on 2026-07-19
    (OPENAI-HFTECH-2026). WIRED reports the activity went undetected over many days (WIRED-OPENAI-2026). Per-agent monitors
    may miss attacks split across many agents (UKAISI-MULTIAGENT-2026), and on 2026-07-20 responders had to terminate pods,
    disable repositories and remove accounts piecemeal (OPENAI-HFTECH-2026).
  solution: >-
    Monitor reasoning (chain of thought, the model's written working), tool actions and sequences for deception, reward
    hacking, exfiltration and safeguard circumvention across training and evaluation, aiming to cover all workloads where a
    model is connected to tools; connect monitors to 24/7 paging with a goal of notifying within 30 minutes, and pause if a
    false positive cannot be ruled out in that time (OPENAI-HFTECH-2026). NIST, NSA and CISA call for monitoring across
    model, harness, host and network layers using more than one model (NISTCISA-IRKEY-2026). Place canaries and decoys so
    an agent that steps out of bounds trips an alert; OpenAI says it is adding deception-based tripwires. Build halt tooling
    by workload, agent or task type, automatic shutdown on a control failure, credential revocation, and automatic
    termination if paged staff do not respond (OPENAI-HFTECH-2026; NISTCISA-IRKEY-2026; OWASP-AGENTIC-2025).
  outcomes:
    - lever: speed
      description: OpenAI states that had its now-deployed monitor been running, it would have caught the initial activity and paged security more than a day before the Hugging Face breach.
      figure: "More than 1 day earlier (counterfactual)"
      measures: "Time between a hypothetical page and the breach, as stated by OpenAI; no false-positive or miss rate published"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
    - lever: quality
      description: In a synthetic multi-agent setting, as more agents coordinate an attack, per-agent monitoring is less likely to catch any attacker; a stronger monitor cut undetected success by more than an order of magnitude but stays imperfect.
      figure: "More than 10x reduction with a stronger monitor"
      measures: "Undetected attack success in a synthetic codebase (9 services, 86 benign tasks, 4 attack objectives), abstract page"
      provenance: independent
      source_ref: UKAISI-MULTIAGENT-2026
    - lever: speed
      description: Manual first-hours response on 2026-07-20.
      figure: "6 pods, 311 repositories, 22 administrator accounts"
      measures: "Model-created pods terminated, Artifactory repositories used for message-board communication disabled, and model-created administrator accounts removed in the first hours, per OpenAI's report"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
    - lever: risk
      description: The most common primary containment action for agent incidents in a survey was disabling the identity or revoking tokens.
      figure: "49%"
      measures: "Respondents naming disabling identity or revoking tokens as their primary containment action (CSA and Aembit survey of 228, January 2026, as reported in the CSA note)"
      provenance: vendor-published
      source_ref: CSA-AGENTIDSPRAWL-2026
  prerequisites:
    - "Retained transcripts and tool-action telemetry across agent workloads, including reasoning where available"
    - "A 24/7 paging path with authority to pause or end experiments"
    - "Monitors agents cannot tamper with, ideally from different model families (NISTCISA-IRKEY-2026, practices 3.3-3.4)"
    - "An inventory of agent identities and credentials across trust domains so revocation is complete; tested revocation paths"
  risks_and_guardrails:
    - "Monitors are attack surface; treat monitored outputs as potentially containing exploits aimed at the monitors, and do not train against adverse reasoning in a way that reduces monitorability (NISTCISA-IRKEY-2026, practices 4.2 and 7.7)."
    - "IANS faculty criticise OpenAI for not adding monitoring after learning agents were exploiting Artifactory (IANS-OPENAI-2026); a commentator's view."
    - "Reasoning monitors can be misled: Anthropic found its chain-of-thought offline monitors would have missed one incident because the model's biased reasoning persuaded the monitor the environment was simulated (ANTHROPIC-ALIGNMENT-2026, 'Replication and monitoring')."
    - "Agents may locate and avoid tripwires; NIST, NSA and CISA list additional escalation mechanisms as future work (NISTCISA-IRKEY-2026, practices 1.8 and 3.5)."
    - "Revocation can be partial: missing one credential leaves an agent partly operational (CSA-AGENTIDSPRAWL-2026)."
  human_checkpoints:
    - "Paged responders decide whether to end the experiment; automatic termination only as a fallback (OPENAI-HFTECH-2026, IX.B)"
    - "Restart only after verifying monitors, egress allowlists and shutdown work, and documenting the recovery decision (NISTCISA-IRKEY-2026, practices 7.3 and 7.5)"
  role_evolution: >-
    Safety, security and research staff are paged together, may end experiments and are expected to pause activity if they
    cannot rule out a false positive within 30 minutes; OpenAI is clarifying decision rights for misalignment incidents
    (OPENAI-HFTECH-2026, IX.B and IX.D). Detection engineers add
    agent-specific tripwires (NISTCISA-IRKEY-2026, practice 3.5).
  evidence_grade: B
  sources:
    - {ref: OPENAI-HFTECH-2026, title: "OpenAI - Hugging Face Incident Technical Report", publisher: "OpenAI", type: vendor, url: "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf", date: "2026-08-26", access: full, locator: "III.B p.8; VI.A pp.14-16; IX.A.4 p.28; IX.B pp.28-29; IX.D pp.30-31"}
    - {ref: WIRED-OPENAI-2026, title: "OpenAI Didn't Notice Its AI Agents Using a Message Board to Plan Their Hacking Spree", publisher: "WIRED", type: press, url: "https://www.wired.com/story/openai-didnt-notice-its-ai-agents-using-a-message-board-to-plan-their-hacking-spree/", date: "2026-08-05", access: full, locator: "Paragraph 4"}
    - {ref: UKAISI-MULTIAGENT-2026, title: "Multi-Agent AI Control: Distributed Attacks Hamper Per-Instance Monitors (abstract page)", publisher: "UK AI Security Institute", type: regulator, url: "https://www.aisi.gov.uk/research/multi-agent-ai-control-distributed-attacks-hamper-per-instance-monitors", date: "2026-07-08", access: full, locator: "Abstract"}
    - {ref: NISTCISA-IRKEY-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (joint cybersecurity information sheet PP-26-4396)", publisher: "NIST CAISSI (formerly CAISI), NSA Super Intelligence Security Center and CISA", type: regulator, url: "https://www.nist.gov/document/keypracticesforincidentreadinessandresponseinsuperintelligence-trainingandevaluation", date: "2026-10-16", access: full, locator: "Practices 1.7-1.8, 3.1-3.5, 4.2, 6.1-6.5, 7.3-7.7, pp.4-9"}
    - {ref: OWASP-AGENTIC-2025, title: "OWASP Top 10 for Agentic Applications for 2026", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", date: "2025-12-09", access: full, locator: "ASI10 Rogue Agents, mitigations 4-6, pp.37-38"}
    - {ref: CSA-AGENTIDSPRAWL-2026, title: "AI Agent Identity Sprawl: The Enterprise Authorization Crisis", publisher: "Cloud Security Alliance AI Safety Initiative", type: survey, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-identity-sprawl-authorization-202/", date: "2026-06-20", access: full, locator: "The Multi-Credential Trust Gap"}
    - {ref: IANS-OPENAI-2026, title: "OpenAI's Postmortem Recasts the Hugging Face Breach as an Incident Response Failure", publisher: "IANS Research", type: firm, url: "https://www.iansresearch.com/resources/all-blogs/post/security-blog/2026/08/28/openai's-postmortem-recasts-the-hugging-face-breach-as-an-incident-response-failure", date: "2026-08-27", access: full, locator: "Big Picture"}
    - {ref: ANTHROPIC-ALIGNMENT-2026, title: "An alignment assessment of recent cybersecurity incidents", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents", date: "2026-09-09", access: full, locator: "Alignment assessment summary"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-10 (B), agent-identity-containment-08 (graded A there), -09 (kill switches, B) and -17
    (tripwires, C). Graded B: the A in containment-08 rested on OpenAI's harness-versus-research-set-up figure, which
    measures the harness, not monitoring, and is now in security-ai-security-04. The monitoring figures are a
    counterfactual and a target; OpenAI says halt tooling and tripwires are being developed. The AISI result is a lab
    simulation. Overlaps security-incident-response-19 (monitors page responders, 30-minute pause rule) and -17.

- id: security-ai-security-12
  title: Log every agent action against the agent's own identity, traceable to its human sponsor, in tamper-resistant storage
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [data-reporting, review-assurance]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    IAM logs usually show the credential used, not the agent, the task or the delegation chain, so after an incident teams
    cannot say which agent did what under whose authority (CSA-AGENTIDSPRAWL-2026). FINRA notes multi-step agent reasoning
    is hard to trace, which complicates auditability (FINRA-ROR-2026).
  solution: >-
    Record tool calls, rejected actions, identity and privilege changes and inter-agent messages against the agent's own
    identity, link them to the human sponsor, use reliable timestamps sufficient to reconstruct trajectories, and keep logs
    where agents cannot alter or reach them (NISTCISA-IRKEY-2026; CISA-AGENTIC-2026). Microsoft's agent identities record
    queries as performed by an AI agent (MSFT-ENTRAAGENTID-2026). FINRA lists tracking agent actions and decisions among
    supervision considerations (FINRA-ROR-2026); MAS extends expected monitoring to decision paths, including reasoning,
    actions and tools used (MAS-AIRM-RESPONSE-2026, section 12.8).
  outcomes:
    - lever: risk
      description: A survey on whether agent actions can be told apart from human activity and traced to a sponsor.
      figure: "68% cannot clearly distinguish; 28% can trace across all environments"
      measures: "Respondents whose organisations cannot clearly distinguish agent actions from human activity (68%), and those that can trace agent actions to a human sponsor across all environments (28%) (CSA and Aembit survey of 228, January 2026)"
      provenance: vendor-published
      source_ref: CSA-AGENTIDSPRAWL-2026
  prerequisites:
    - "Agent-level identity so log entries can be attributed (security-ai-security-06)"
    - "A log pipeline that captures MCP and tool-layer calls, which CSA says most SIEM and PAM tools cannot natively parse"
    - "Retention and write-protection; CERT-In asks for a tamper-resistant log of agent actions that touch production (THN-CERTIN-2026)"
  risks_and_guardrails:
    - "ACSC/CISA guidance notes comprehensive agent logging is hard because long reasoning chains create large, repetitive logs (CISA-AGENTIC-2026, p.13)."
    - "Agents must not be able to access or interfere with monitoring processes and logs (NISTCISA-IRKEY-2026, practice 3.3)."
    - "Logs of agent actions can carry sensitive data and become a target (FINRA-ROR-2026)."
    - "Hugging Face found a naive scan of raw captured logs recovered far fewer secrets than replicating the attacker's decoding (about four times as many findings after decoding), so log review must allow for obfuscation (HF-TIMELINE-2026)."
  human_checkpoints:
    - "Audit review combining human review with automated log analysis (CISA-AGENTIC-2026, p.21)"
    - "Humans verify key facts where AI assists an investigation (NISTCISA-IRKEY-2026, practice 5.5)"
  role_evolution: >-
    Microsoft records the user who creates an agent as its sponsor and logs the agent's authentications against its own
    identity, so log review can run from agent to sponsor (MSFT-ENTRAAGENTID-2026). Audit
    and forensic teams ask for agent-trace evidence (FINRA-ROR-2026).
  evidence_grade: B
  sources:
    - {ref: CSA-AGENTIDSPRAWL-2026, title: "AI Agent Identity Sprawl: The Enterprise Authorization Crisis", publisher: "Cloud Security Alliance AI Safety Initiative", type: survey, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-identity-sprawl-authorization-202/", date: "2026-06-20", access: full, locator: "Attribution Collapse"}
    - {ref: MSFT-ENTRAAGENTID-2026, title: "What are agent identities? - Microsoft Entra Agent ID", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/entra/agent-id/identity-platform/what-is-agent-id", date: "2026-06-15", access: full, locator: "Agent identities in practice, conditional access optimization agent"}
    - {ref: NISTCISA-IRKEY-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (joint cybersecurity information sheet PP-26-4396)", publisher: "NIST CAISSI (formerly CAISI), NSA Super Intelligence Security Center and CISA", type: regulator, url: "https://www.nist.gov/document/keypracticesforincidentreadinessandresponseinsuperintelligence-trainingandevaluation", date: "2026-10-16", access: full, locator: "Practices 3.3, 5.1-5.5, pp.6-7"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Accountability risks pp.12-13; Monitoring and auditing pp.21-22"}
    - {ref: FINRA-ROR-2026, title: "2026 FINRA Annual Regulatory Oversight Report: GenAI section (incl. AI agents) and Third-Party Risk Landscape", publisher: "FINRA", type: regulator, url: "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai", date: "2025-12-09", access: full, locator: "GenAI page, agent considerations"}
    - {ref: MAS-AIRM-RESPONSE-2026, title: "Response to Feedback Received on Guidelines on Artificial Intelligence Risk Management (P017-2025, 57 pages)", publisher: "Monetary Authority of Singapore", type: regulator, url: "https://www.mas.gov.sg/-/media/mas-media-library/publications/consultations/bd/2025/response-to-feedback-received-on-guidelines-on-artificial-intelligence-risk-management.pdf", date: "2026-10-07", access: full, locator: "Section 12.8"}
    - {ref: THN-CERTIN-2026, title: "CERT-In Warns AI Agents Accessed Sensitive Data at Indian Organizations During Testing", publisher: "The Hacker News", type: press, url: "https://thehackernews.com/2026/10/cert-in-warns-ai-agents-accessed.html", date: "2026-10-16", access: full, locator: "'What CERT-In Wants Fixed' (tamper-resistant log of agent actions)"}
    - {ref: HF-TIMELINE-2026, title: "Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident", publisher: "Hugging Face", type: vendor, url: "https://huggingface.co/blog/agent-intrusion-technical-timeline", date: "2026-07-27", access: full, locator: "Paragraph on log decoding and detection"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: agent-identity-containment-07 (B) and governance-assurance-17 (D). Grade B: Microsoft names its own agents
    using agent identities with attributed logging; no measured benefit is published. CERT-In's 180-day retention appears
    as a general API-monitoring step, not specifically for agent logs. Overlaps security-incident-response-18
    (reconstructing agent actions from tamper-resistant logs).

