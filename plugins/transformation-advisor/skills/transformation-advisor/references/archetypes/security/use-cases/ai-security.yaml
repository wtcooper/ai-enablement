  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-07 (government stress tests, A) and -08 (simulated propensity testing, B). The OpenAI figure
    also appears in agent-identity-containment-08 (where it supported an A for monitoring); it measures the harness and
    prompt, not monitoring, so it sits here. The two deep dives name the production harness differently (Codex in one,
    ChatGPT in the other); the harness is left unnamed here. Grade A rests on AISI's independent measurements; AISI's
    propensity rates were not read and OpenAI's figure is preliminary and self-reported.

- id: security-ai-security-05
  title: Continuous agentic red teaming of security invariants and containment controls
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Production environments change quickly, and a single misconfiguration can be found and abused by an agent collective
    at machine speed, so point-in-time validation goes stale. Containment controls are designed against assumed attacker
    capability and can regress as environments change.
  solution: >-
    OpenAI says organisations should continuously and autonomously use their own red-team AI agents to try to break key
    security invariants (written rules a system must never violate). It reports initial assessments through existing
    red-team processes, a deep architectural assessment of its research environment that used its own models to search
    for vulnerabilities, and work underway toward more autonomous, continuous agentic red teaming (OPENAI-HFTECH-2026).
    Sandbox, network, monitor and shutdown controls are tested with human red teams and AI agents before use
    (NISTCISA-IRKEY-2026; CISA-AGENTIC-2026).
  outcomes:
    - lever: risk
      description: No results from continuous agentic red teaming were published.
      figure: "none published"
      measures: "No outcome measure found"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
    - lever: risk
      description: A DEF CON 34 abstract reports that three AI coding agents' sandboxes (Claude Code, Gemini CLI, Codex CLI) each failed on their own design assumptions.
      figure: "3 of 3 sandboxes (presenter's claim)"
      measures: "Sandboxes the presenter reports containment failing for, each reported through coordinated disclosure (talk abstract; no test counts)"
      provenance: self-reported
      source_ref: DEFCON-34-SPEAKERS-2026
    - lever: risk
      description: A DEF CON 34 abstract by BeyondTrust reports defeating all three defence layers (Python sandbox, container and an LLM guardrail) around a Microsoft Copilot Studio code-interpreter agent.
      figure: "3 of 3 layers (presenter's claim)"
      measures: "Defence layers the presenter reports bypassing (talk abstract)"
      provenance: self-reported
      source_ref: DEFCON-34-SPEAKERS-2026
  prerequisites:
    - "Written security invariants for critical systems and a repeatable list to test"
    - "Rules of engagement so out-of-scope actions cannot harm critical systems (NISTCISA-IRKEY-2026, practice 1.9)"
    - "Remediation capacity matched to finding rate"
  risks_and_guardrails:
    - "OpenAI's own report shows evaluation-time offensive agents breached real systems when containment failed, so red-team agents need the controls in security-ai-security-10 (OPENAI-HFTECH-2026, section I, p.4)."
    - "OpenAI says no single control should be assumed robust and controls must be independent across prevention, detection and mitigation (OPENAI-HFTECH-2026, section VII.C, p.18)."
    - "NIST, NSA and CISA say to use AI systems for red teaming only where out-of-scope actions could not harm critical systems, and flag AI-assisted red-teaming of critical systems as future work (NISTCISA-IRKEY-2026, practice 1.9, p.5)."
    - "Trail of Bits' VM test hard-locked the host machine several times, so test hosts need isolation of their own (TOB-VMS-2026)."
  human_checkpoints:
    - "Humans define the invariants and authorise test scope; humans red-team alongside AI (NISTCISA-IRKEY-2026, practices 1.9 and 4.1)"
    - "Security team triages and remediates findings; independent external evaluators verify monitoring and detection (practice 2.4)"
  role_evolution: >-
    Security engineers shift from running periodic tests to defining invariants and supervising agents that test them
    (OPENAI-HFTECH-2026, section VII.C, p.18). Red teams extend to testing agent harnesses, sandboxes and monitors
    (OPENAI-HFTECH-2026, IX.A.3, p.27).
  evidence_grade: C
  sources:
    - {ref: OPENAI-HFTECH-2026, title: "OpenAI - Hugging Face Incident Technical Report", publisher: "OpenAI", type: vendor, url: "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf", date: "2026-08-26", access: full, locator: "Section I p.4; VII.C p.18; IX.A.3 p.27"}
    - {ref: DEFCON-34-SPEAKERS-2026, title: "DEF CON 34 main-stage speakers and abstracts (Las Vegas, 6-9 Aug 2026)", publisher: "DEF CON", type: conference, url: "https://defcon.org/html/defcon-34/dc-34-speakers.html", date: "2026-08-06", access: full, locator: "'The Sandbox is a Suggestion' (Friday 7 Aug, Novee Security); Copilot Studio code-interpreter talk (Saturday 8 Aug, BeyondTrust); abstracts only"}
    - {ref: NISTCISA-IRKEY-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (joint cybersecurity information sheet PP-26-4396)", publisher: "NIST CAISSI (formerly CAISI), NSA Super Intelligence Security Center and CISA", type: regulator, url: "https://www.nist.gov/document/keypracticesforincidentreadinessandresponseinsuperintelligence-trainingandevaluation", date: "2026-10-16", access: full, locator: "Practices 1.9, 2.4, 4.1, pp.5-6"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Red teaming, p.17; Performance monitoring, pp.22-23"}
    - {ref: TOB-VMS-2026, title: "VMs won't contain cyber-capable agents", publisher: "Trail of Bits", type: firm, url: "https://blog.trailofbits.com/2026/08/26/vms-wont-contain-cyber-capable-agents/", date: "2026-08-26", access: full, locator: "Whole post"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-13 (grade C) and agent-identity-containment-15 (graded B there). Graded C here: the agentic,
    continuous part is a vendor's stated plan; the DEF CON results are presenters' abstract-level claims from human
    researchers. The only delegate-level entry in this module. Exploit methods are deliberately omitted.

