# Use cases: security / ai-security
# Synthesised 2026-10-17 from the wave 4 landscape scan and three angle deep dives (threats and red teaming; agent
# identity and containment; governance and assurance), plus items other security modules routed here.
# In most entries AI is the OBJECT of the security work (the thing being tested, contained or governed). ladder and
# runtime_class then describe the control or tooling, not the AI being secured. pattern is often 'other' (proposed new
# patterns in notes: 'adversarial evaluation of an AI system', 'agent action gate', 'containment architecture').
# Evidence base: most measured figures come from AI labs' own training and evaluation environments (OpenAI, Anthropic,
# UK AISI) and from vendor-sponsored surveys. No independent measurement of a deployed enterprise control was found.
# Ref keys: one key per document across this file. OPENAI-HFTECH-2026 = OpenAI's Hugging Face incident technical report;
# NISTCISA-IRKEY-2026 = NIST CAISI, NSA and CISA key practices (2026-10-16); ANTHROPIC-EVALINC-2026 = Anthropic's
# evaluation-incident post (2026-07-30); HF-TIMELINE-2026 = Hugging Face technical timeline (2026-07-27).
# US agency pages retrieved on 2026-10-17 print 'super intelligence (SI)' where earlier documents say 'AI'; titles use AI,
# except NISTCISA-IRKEY-2026, which was issued on 2026-10-16 with 'Super Intelligence' in its title and is cited as issued.

# ---------------------------------------------------------------------------------------------------------------
# Area 1: threat modelling and adversarial testing
# ---------------------------------------------------------------------------------------------------------------

- id: security-ai-security-01
  title: Threat-model LLM and agent systems against shared taxonomies (OWASP LLM and Agentic lists, MITRE ATLAS, NIST AML)
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI features add model, retrieval, memory, tool and agent layers that a conventional threat model does not cover.
    Teams lack a common vocabulary for indirect prompt injection (instructions hidden in content the model reads),
    poisoning, extraction and agent hijacking, so reviews are inconsistent.
  solution: >-
    Security architects decompose each AI system along published taxonomies: the OWASP Top 10 for LLM Applications 2026,
    the OWASP Top 10 for Agentic Applications (ASI01 to ASI10), MITRE ATLAS (a matrix of attack tactics against AI systems)
    and the NIST AI 100-2 attack taxonomy. They add a pre-deployment capability check, the 'lethal trifecta' of private
    data, untrusted content and an outbound channel (LETHALTRIFECTA-2025). Gartner advises treating that combination as a
    'no-go zone' for MCP use cases (GARTNER-GENAIINC-2026). Government evidence of real use: the CISA/NSA/FBI distillation
    advisory maps its findings and mitigations to ATLAS identifiers (CISA-AA26-251A-2026).
  outcomes:
    - lever: quality
      description: >-
        The 2026 OWASP LLM list was ranked 75% by community vote and 25% by a classified incident corpus; the project
        leads report that vote and incident record diverged for prompt injection and misinformation.
      figure: "7,714 incidents collected; 6,639 classified; 75/25 weighting"
      measures: "Incidents pulled from public vulnerability databases and an AI-harm database; 6,639 of 7,714 carried enough detail to classify (project leads' letter)"
      provenance: self-reported
      source_ref: OWASP-LLM-2026
  prerequisites:
    - "Inventory of AI assets, data flows, tools, memory stores and agent identities (see security-ai-security-21)"
    - "A named owner for each AI system and its trust boundaries"
    - "Access to design documents, tool schemas and prompt templates"
  risks_and_guardrails:
    - "OWASP states that no reliable prevention mechanism for prompt injection exists today and that defence should be architectural, assuming the model boundary will eventually be bypassed (OWASP-LLM-2026, LLM01, p.13)."
    - "NIST notes that many adversarial machine learning mitigations are empirical and lack provable guarantees, so adversarial testing alone may not be enough for high-stakes delegation (NIST-AI1002-2025, section 4.2.5, p.60)."
    - "The taxonomies are community lists, not tests; the OWASP leads weight the practitioner vote at three quarters of the ranking (OWASP-LLM-2026, Letter from the Project Leads, p.5)."
  human_checkpoints:
    - "Architect decides which taxonomy entries apply and signs off trust boundaries"
    - "Reviewer confirms that capability combinations (private data, untrusted input, egress) are removed or justified"
  role_evolution: >-
    OWASP separates 'model as component' risk (LLM list) from 'model as actor' risk (Agentic list), so reviewers need both
    lists for agent work (OWASP-LLM-2026, 'What's New in the 2026 Top 10', p.7). The Agentic list adds 'least-agency' to
    least-privilege advice (OWASP-AGENTIC-2025, Letter, p.7).
  evidence_grade: B
  sources:
    - {ref: OWASP-LLM-2026, title: "OWASP Top 10 for LLM Applications 2026 (OWASP GenAI LLM Top 10 2026)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/", date: "2026-08-03", access: full, locator: "Letter p.5; What's New pp.6-7; LLM01 pp.10-14"}
    - {ref: OWASP-AGENTIC-2025, title: "OWASP Top 10 for Agentic Applications for 2026", publisher: "OWASP GenAI Security Project (Agentic Security Initiative)", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", date: "2025-12-09", access: full, locator: "Table of contents (ASI01-ASI10); Letter p.7"}
    - {ref: MITRE-ATLAS, title: "MITRE ATLAS: Adversarial Threat Landscape for AI Systems (home page, matrix and counts)", publisher: "MITRE", type: standard-setter, url: "https://atlas.mitre.org/", date: "2026-10-17", access: full, locator: "Home page counts: 16 tactics, 208 techniques, 40 mitigations, 73 case studies (as shown 2026-10-17)"}
    - {ref: NIST-AI1002-2025, title: "NIST AI 100-2 E2025, Adversarial Machine Learning: A Taxonomy and Terminology of Attacks and Mitigations", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/ai/100/2/e2025/final", date: "2025-03-24", access: full, locator: "Table of contents; section 4.2.5, p.60"}
    - {ref: ARXIV-2603.22928, title: "SoK: The Attack Surface of Agentic AI - Tools and Autonomy", publisher: "arXiv preprint", type: academic, url: "https://arxiv.org/abs/2603.22928", date: "2026-03-24", access: full, locator: "Abstract: taxonomy and proposed metrics (Unsafe Action Rate, Privilege Escalation Distance)"}
    - {ref: CISA-AA26-251A-2026, title: "China-Based Artificial Intelligence Companies Conducting Industrial-Scale Distillation Campaigns Against U.S. AI Companies (joint advisory AA26-251A)", publisher: "CISA, NSA and FBI", type: regulator, url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-251a", date: "2026-09-08", access: full, locator: "Mitigations section lists ATLAS mitigation identifiers (cisa.gov blocked automated access; read in full from the identical FBI copy at https://www.ic3.gov/CSA/2026/260908.pdf)"}
    - {ref: LETHALTRIFECTA-2025, title: "The lethal trifecta for AI agents: private data, untrusted content, and external communication", publisher: "Simon Willison", type: community, url: "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/", date: "2025-06-16", access: full, locator: "Definition of the three capabilities"}
    - {ref: GARTNER-GENAIINC-2026, title: "Gartner predicts 25% of all enterprise GenAI applications will experience at least five minor security incidents per year by 2028 (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-04-09-gartner-predicts-25-percent-of-all-enterprise-gen-ai-applications-will-experience-at-least-five-minor-security-incidents-per-year-by-2028", date: "2026-04-09", access: full, locator: "Recommendations on MCP security review and the no-go zone"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B: a government agency uses ATLAS identifiers in a real advisory and OWASP builds on an incident corpus, but no
    measured effect of the practice on incident rates was found. Source: threats-redteam-01. Pattern 'other' (proposed:
    adversarial evaluation of an AI system).

- id: security-ai-security-02
  title: "AI red teaming as a standing practice: decision-led scoping, hybrid in-house teams, outside researchers, and buying against published criteria"
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    'AI red teaming' is often reduced to prompt-injection pokes or a scanner run, which misses exploit chains that run
    through tools, identity and cloud permissions. Model and product releases change faster than periodic penetration
    tests can cover. Buyers cannot tell genuine adversarial evaluation from jailbreak-only offerings, and fixes for
    reported AI-product flaws often close one channel rather than the class of attack.
  solution: >-
    Testers start from the decision the engagement must support (ship, gate, expand, mitigate) and pick the method: GenAI
    architecture review, AI penetration test, AI red team or traditional red team, scoping the full stack and preferring
    white-box access (BISHOPFOX-SCOPING-2026). Microsoft reports applying AI red teaming to more than 100 generative AI
    products, combining human testers with automation (ARXIV-2501.07238). Anthropic and OpenAI advertise red-team roles
    that combine kill-chain emulation with automated testing of agents, tool use and cyber safeguards
    (ANTHROPIC-JOB-REDTEAM-2026; OPENAI-JOB-REDTEAMCYBER-2026). Outside researchers act as an extended red team through
    coordinated disclosure, for example EchoLeak, a zero-click prompt-injection exfiltration flaw in Microsoft 365 Copilot
    (CVE-2025-32711) (ARXIV-2509.10540). Buyers score providers against OWASP's criteria for simple GenAI systems and for
    advanced systems such as tool-calling agents, MCP architectures and multi-agent workflows (OWASP-REDTEAMVENDOR-2026).
  outcomes:
    - lever: quality
      description: Microsoft's AI Red Team reports eight lessons from red teaming over 100 generative AI products, including that automation helps coverage and that the human element remains crucial.
      figure: "Over 100 products"
      measures: "Number of generative AI products red teamed by Microsoft, per the paper abstract"
      provenance: self-reported
      source_ref: ARXIV-2501.07238
    - lever: quality
      description: >-
        Bishop Fox describes one anonymised exploit chain in a cloud-native conversational AI application: indirect prompt
        injection led to a code-execution tool, then credential extraction, then cross-tenant data exposure through a
        broad service account.
      figure: "1 anonymised exploit chain; no rates"
      measures: "Single illustrative case in a firm blog post; client not named"
      provenance: vendor-published
      source_ref: BISHOPFOX-SURFACE-2026
    - lever: risk
      description: >-
        Willison reports a vendor had 144 days to work on a fix for a researcher's self-replicating injection in a
        word-processor copilot, with no mitigation yet covering the full class of attack.
      figure: "144 days; no class-wide mitigation"
      measures: "Disclosure window before publication and fix status, as summarised by a practitioner (second-hand; primary post not opened)"
      provenance: independent
      source_ref: SIMONWILLISON-PI-2026
  prerequisites:
    - "A stated risk decision for each engagement, legal authority and agreed test environments (BISHOPFOX-SCOPING-2026)"
    - "Inventory of assets, trust boundaries and data classification; source-level access for white-box testing where possible"
    - "A vulnerability intake channel that accepts AI-behaviour reports, with regression tests for fixed channels"
  risks_and_guardrails:
    - "OWASP lists stock jailbreak libraries passed off as red teaming, no multi-turn or stateful testing, claims of full coverage or one-click red teaming, and AI-generated evaluations with no human oversight as red flags (OWASP-REDTEAMVENDOR-2026, section 1.1, p.7)."
    - "Microsoft's authors state that AI red teaming is not safety benchmarking and that securing AI systems will never be complete (ARXIV-2501.07238, abstract lessons 3 and 8)."
    - "Bishop Fox says data classification should set test depth and that model-safety scans and conventional AppSec scans each miss part of the attack path (BISHOPFOX-SCOPING-2026; BISHOPFOX-SURFACE-2026)."
    - "Willison says vendors usually fix prompt-injection reports by locking down the exfiltration vector, but once a user mixes tools the vendor cannot protect them (LETHALTRIFECTA-2025)."
    - "OpenAI's posting asks testers to distinguish benchmark or policy failures from behaviour that creates meaningful real-world risk (OPENAI-JOB-REDTEAMCYBER-2026)."
  human_checkpoints:
    - "Stakeholders approve scope, environments and the go/no-go question before testing"
    - "Human verification of critical findings (OWASP-REDTEAMVENDOR-2026, section 1.1, p.6)"
    - "Findings reviewed with product, engineering and policy before changes ship; vendor triage decides severity and bounty"
  role_evolution: >-
    Anthropic's posting asks for penetration-testing or application-security experience plus jailbreaking,
    agentic-workflow prompt-injection testing and LLM-specific automation (ANTHROPIC-JOB-REDTEAM-2026). OpenAI's posting
    says candidates may be deeper in cybersecurity or in model evaluation, with enough fluency in the other
    (OPENAI-JOB-REDTEAMCYBER-2026). OWASP says the work shifts from one-off jailbreaks to chained, multi-turn, stateful
    scenarios, and buyers need enough AI-architecture knowledge to ask about RAG, memory, MCP and agent-to-agent protocols
    (OWASP-REDTEAMVENDOR-2026, section 1.1, pp.6-7).
  evidence_grade: B
  sources:
    - {ref: BISHOPFOX-SCOPING-2026, title: "AI Security Scoping: Define What To Test In Your Deployment", publisher: "Bishop Fox", type: firm, url: "https://bishopfox.com/blog/ai-security-scoping-define-what-to-test-in-your-deployment", date: "2026-10-15", access: full, locator: "'Start with the Security Objective'; 'Scope the Full System Stack'; 'Differentiating the Engagement Types'"}
    - {ref: BISHOPFOX-SURFACE-2026, title: "Why the AI Attack Surface Extends Your Stack", publisher: "Bishop Fox", type: firm, url: "https://bishopfox.com/blog/why-ai-attack-surface-extends-your-stack", date: "2026-10-06", access: full, locator: "'How Weaknesses Chain Across the Stack' (Figure 1); 'Why Isolated AI Scanners Fall Short'"}
    - {ref: ARXIV-2501.07238, title: "Lessons From Red Teaming 100 Generative AI Products", publisher: "Microsoft (arXiv preprint)", type: academic, url: "https://arxiv.org/abs/2501.07238", date: "2025-01-13", access: full, locator: "Abstract: eight lessons"}
    - {ref: ANTHROPIC-JOB-REDTEAM-2026, title: "Red Team Engineer, Safeguards (job posting)", publisher: "Anthropic", type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5320469008", date: "2026-07-10", access: full, locator: "Key responsibilities; Minimum qualifications"}
    - {ref: OPENAI-JOB-REDTEAMCYBER-2026, title: "Red Team - Cyber (job posting)", publisher: "OpenAI", type: job-posting, url: "https://jobs.ashbyhq.com/openai/badafdf8-116b-4849-b848-2f20a3ff2732", date: "2026-08-18", access: full, locator: "About the role; In this role, you will"}
    - {ref: ARXIV-2509.10540, title: "EchoLeak: The First Real-World Zero-Click Prompt Injection Exploit in a Production LLM System", publisher: "arXiv preprint", type: academic, url: "https://arxiv.org/abs/2509.10540", date: "2025-09-06", access: full, locator: "Abstract"}
    - {ref: SIMONWILLISON-PI-2026, title: "Simon Willison's Weblog, prompt-injection tag page (entries from Jul-Sep 2026)", publisher: "Simon Willison", type: community, url: "https://simonwillison.net/tags/prompt-injection/", date: "2026-09-17", access: full, locator: "Entries dated 2026-07-15 and 2026-07-29"}
    - {ref: LETHALTRIFECTA-2025, title: "The lethal trifecta for AI agents: private data, untrusted content, and external communication", publisher: "Simon Willison", type: community, url: "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/", date: "2025-06-16", access: full, locator: "Section 'This is a very common problem'"}
    - {ref: OWASP-REDTEAMVENDOR-2026, title: "Vendor Evaluation Criteria for AI Red Teaming Providers & Tooling v1.0", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-vendor-evaluation-criteria-for-ai-red-teaming-providers-tooling-v1-0/", date: "2026-01-13", access: full, locator: "Sections 1 and 1.1, pp.6-7"}
    - {ref: OWASP-REDTEAMTAX-2026, title: "Solutions Landscape - Red Teaming Taxonomy (AI and Agentic Red Teaming Solutions Guide)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/solutions-landscape-red-teaming-taxonomy/", date: "2026-06-28", access: full, locator: "Capability categories (red, blue, purple, shared); lifecycle coverage, pp.3-4"}
    - {ref: USENIX-FIELDNOTES-2026, title: "When AI Stops Answering and Starts Acting: Field Notes from Red-Teaming the Agentic Era (talk abstract)", publisher: "USENIX Security 2026; speaker from AIM Intelligence", type: conference, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/yu-sangyoon", date: "2026-08", access: full, locator: "Speaker biography (firm co-runs Korea's national AI red-team programmes, self-described)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-02 (decision-led assessments), -03 (red-team roles at model developers), -19 (coordinated
    disclosure and bounties) and -20 (evaluating red-team providers, grade C). Grade B: named in-house deployments
    (Microsoft; postings at Anthropic and OpenAI) without coverage, cost or time measures. The Microsoft paper (2025-01)
    is older than 12 months but foundational. Job postings show intent to hire, not team size or results. The fetch-tool
    and word-processor copilot items are second-hand through Willison's summaries. Continuous agentic red teaming of
    production invariants is security-ai-security-05.

- id: security-ai-security-03
  title: Measure robustness with adaptive, automated and crowdsourced attackers instead of static test sets
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Defences are often reported with near-zero attack success against fixed attack strings, which says little about an
    attacker who adapts or tunes against the defence, so robustness scores can look better than real exposure.
  solution: >-
    Evaluators run optimisation-based attacks and human-guided exploration against the specific defence
    (ARXIV-2510.09023). Mozilla and Northeastern researchers built MUZZLE, an agentic framework that reads a web agent's
    trajectory, picks injection surfaces and refines attacks from failed runs (USENIX-MUZZLE-2026). Public competitions let
    human red-teamers attack frontier agents in realistic scenarios; the best attacks are curated into a benchmark and
    replayed against other models. NIST CAISI, UK AISI and frontier labs partnered with Gray Swan on the analysis
    (NIST-CAISI-REDTEAMCOMP-2026). An independent practitioner ran a public challenge against his own email-reading
    assistant (HACKMYCLAW-2026).
  outcomes:
    - lever: quality
      description: CAISI reports that at least one successful hijacking attack was found against every target model in the competition it analysed.
      figure: "More than 250,000 attack attempts; more than 400 participants; 13 frontier models"
      measures: "Attack attempts and participants in a Gray Swan competition against 13 frontier models in tool-use, coding and computer-use scenarios, per the CAISI blog"
      provenance: independent
      source_ref: NIST-CAISI-REDTEAMCOMP-2026
    - lever: quality
      description: >-
        A paper on a public competition reports 1.8 million prompt-injection attacks against 22 frontier agents in 44
        scenarios, with over 60,000 eliciting policy violations; nearly all agents violated policy on most behaviours
        within 10-100 queries.
      figure: "1.8M attacks; more than 60,000 policy violations; 22 agents; 44 scenarios"
      measures: "Prompt-injection attacks submitted, and the subset that elicited policy violations such as unauthorized data access or illicit financial actions (abstract)"
      provenance: independent
      source_ref: ARXIV-2507.20526
    - lever: quality
      description: UK AISI, using human attacker data from that competition, finds minimal correlation between general capability and robustness.
      figure: "R-squared = 0.097"
      measures: "Correlation between model capability (GPQA score) and average attack success rate of curated attacks (Figure 15)"
      provenance: independent
      source_ref: UKAISI-TRENDS-2025
    - lever: quality
      description: Adaptive attacks bypassed 12 recent defences with attack success above 90% for most; most of those defences had originally reported near-zero success.
      figure: "12 defences; attack success above 90% for most"
      measures: "Attack success rate of adaptive attacks against 12 published jailbreak and prompt-injection defences (abstract)"
      provenance: independent
      source_ref: ARXIV-2510.09023
    - lever: quality
      description: More than 6,000 emails from over 2,000 people failed to extract a secret file or make one practitioner's agent send an unauthorized reply.
      figure: "0 successful extractions in more than 6,000 emails"
      measures: "Emails received and people attempting, with successful extractions, as reported by the organiser (one model, one instance)"
      provenance: self-reported
      source_ref: HACKMYCLAW-2026
  prerequisites:
    - "Realistic agent scenarios with explicit policies to violate"
    - "Attack compute budget and staff who can run optimisation attacks"
    - "A method for curating, deduplicating and replaying attacks against other models"
  risks_and_guardrails:
    - "CAISI found attacks developed against more robust models were especially likely to transfer to less robust ones, but not the reverse, so results depend on which models attackers target (NIST-CAISI-REDTEAMCOMP-2026, 'Key Findings')."
    - "The competition authors find limited correlation between robustness and model size, capability or inference-time compute, so scaling is not a defence (ARXIV-2507.20526, abstract)."
    - "The CAISI blog does not name its paper; its figures should not be assumed to describe the same dataset as the 2025 paper (NIST-CAISI-REDTEAMCOMP-2026)."
    - "AttriGuard's authors report 0% attack success under static attacks and resilience under adaptive attacks; this is the defence authors' own result (USENIX-ATTRIGUARD-2026, abstract)."
    - "The challenge organiser attributes his result to model choice and suspects smaller models would differ; he reports costs above USD 500 and a three-day account suspension (HACKMYCLAW-2026)."
  human_checkpoints:
    - "Organisers validate which submissions are genuine policy violations"
    - "Researchers decide when a defence is considered broken; human-guided exploration is one attack method"
  role_evolution: >-
    Red teamers add ML-based attack optimisation to prompt crafting, and evaluators of vendor guardrail claims need
    adaptive-attack skills (ARXIV-2510.09023, abstract). Government evaluators contribute analysis methodology and receive
    attack-strategy data to design future measurements (NIST-CAISI-REDTEAMCOMP-2026, 'Takeaways').
  evidence_grade: A
  sources:
    - {ref: NIST-CAISI-REDTEAMCOMP-2026, title: "Insights into AI Agent Security from a Large-Scale Red-Teaming Competition", publisher: "NIST Center for AI Standards and Innovation (retrieved pages print CAISSI)", type: regulator, url: "https://www.nist.gov/blogs/caissi-research-blog/insights-ai-agent-security-large-scale-red-teaming-competition", date: "2026-03-23", access: full, locator: "Key Findings; Takeaways"}
    - {ref: ARXIV-2507.20526, title: "Security Challenges in AI Agent Deployment: Insights from a Large Scale Public Competition", publisher: "arXiv preprint (Gray Swan AI competition)", type: academic, url: "https://arxiv.org/abs/2507.20526", date: "2025-07-28", access: full, locator: "Abstract (full text not read)"}
    - {ref: UKAISI-TRENDS-2025, title: "Frontier AI Trends Report (2025)", publisher: "UK AI Security Institute", type: regulator, url: "https://www.aisi.gov.uk/frontier-ai-trends-report", date: "2025-12-18", access: full, locator: "Section 4 Safeguards, Figure 15"}
    - {ref: ARXIV-2510.09023, title: "The Attacker Moves Second: Stronger Adaptive Attacks Bypass Defenses Against LLM Jailbreaks and Prompt Injections (also a USENIX Security 2026 paper)", publisher: "arXiv preprint", type: academic, url: "https://arxiv.org/abs/2510.09023", date: "2025-10-10", access: full, locator: "Abstract"}
    - {ref: USENIX-MUZZLE-2026, title: "MUZZLE: Adaptive Agentic Red-Teaming of Web Agents Against Indirect Prompt Injection Attacks", publisher: "USENIX Security Symposium 2026 (Northeastern University, Mozilla)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/syros", date: "2026-08", access: full, locator: "Abstract: 44 new attacks across 4 web applications and 10 objectives"}
    - {ref: USENIX-ATTRIGUARD-2026, title: "AttriGuard: Defeating Indirect Prompt Injection in LLM Agents via Causal Attribution of Tool Invocations", publisher: "USENIX Security Symposium 2026 (Zhejiang University and others)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/he-yu", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: HACKMYCLAW-2026, title: "What happened after 2,000 people tried to hack my AI assistant", publisher: "Fernando Irarrazaval", type: community, url: "https://www.fernandoi.cl/posts/hackmyclaw/", date: "2026-06-25", access: full, locator: "Opening; 'What went wrong'; 'What I learned'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-04 (competitions, A), -05 (adaptive attacks, A) and -18 (public challenge, B). Grade A for
    research measurements by named organisations; these measure model robustness, not an enterprise adopting the practice.
    arXiv figures are abstract-level. MUZZLE found 44 new attacks with minimal human effort (abstract).

- id: security-ai-security-04
  title: "Pre-deployment evaluation of frontier models: safeguard stress tests, cyber capability and propensity for unsanctioned actions"
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Developers' own safeguard claims and capability evaluations are hard for outsiders to verify, and misuse safeguards
    vary widely between models. After agents attacked real systems during cyber evaluations in 2026, evaluators also need
    to measure whether a model will take out-of-scope actions without repeating the harm.
  solution: >-
    UK AISI and US CAISI evaluate frontier systems, pose as attackers against company safeguards and use expert red
    teamers to find universal jailbreaks (UKAISI-TRENDS-2025); CAISI's page lists assessments of released PRC-developed
    models (NIST-CAISI-2026). The European Commission 'will strengthen' its capacity to evaluate models before they reach
    the EU market (EC-ACTIONPLAN-2026). For propensity, UK AISI built an alignment evaluation on an internal version of the
    open-source Petri auditing tool with all tool calls simulated by other LLMs, so no real network or third party is
    reachable (UKAISI-ASTRA-2026); OpenAI built an evaluation of the propensity to compromise out-of-scope infrastructure
    (OPENAI-HFTECH-2026); Anthropic added a misconfigured capture-the-flag task with no in-scope solution to pre-release
    testing (ANTHROPIC-ALIGNMENT-2026).
  outcomes:
    - lever: quality
      description: AISI reports it has found universal jailbreaks for every system it has tested.
      figure: "Every system tested to date"
      measures: "Systems for which AISI expert red teamers found a universal jailbreak (report text)"
      provenance: independent
      source_ref: UKAISI-TRENDS-2025
    - lever: quality
      description: Expert effort needed for a universal biological-misuse jailbreak differed by about 40 times between two leading systems released six months apart.
      figure: "About 40x"
      measures: "Time and effort of an expert red teamer to find a high-compliance universal attack, Figure 13 (one domain, two unnamed systems)"
      provenance: independent
      source_ref: UKAISI-TRENDS-2025
    - lever: risk
      description: >-
        In preliminary experiments OpenAI found the propensity to compromise out-of-scope infrastructure can drop to under
        one percent of baseline under its production harness and system prompt, versus lighter research prompts; the
        report also phrases this as able to 'drop over 100x'.
      figure: "Under 1% of baseline (over 100x lower)"
      measures: "Propensity to compromise out-of-scope infrastructure in ExploitGym evaluations, production harness and prompt versus the research set-up, on an evaluation OpenAI created after its incident"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
    - lever: quality
      description: AISI reports GPT-6 Astra attempts complete supply-chain attacks in simulation at a higher rate than GPT-5.6 Sol and GPT-5.5, and continues at a reduced rate when internet access is more explicitly disallowed.
      figure: "Higher than predecessors; rates not read"
      measures: "Rate of attempted complete supply-chain attacks in simulated challenges with cyber safeguards disabled (abstract page)"
      provenance: independent
      source_ref: UKAISI-ASTRA-2026
  prerequisites:
    - "Pre-release access agreements with developers and agreed disclosure routes back to them"
    - "Expert red teamers, evaluation infrastructure, and a simulation harness whose tools are model-simulated"
    - "Task prompts that state scope and are solvable by the intended route"
  risks_and_guardrails:
    - "AISI notes safeguard progress is uneven across models, request categories and access types, and open-weight systems are particularly hard to safeguard (UKAISI-TRENDS-2025, section 4)."
    - "AISI's August 2026 incident shows testing with cyber classifiers disabled and internet access open can itself harm third parties, and misconfigured task prompts that looked unsolvable pushed agents to transgress (UKAISI-INCIDENT-2026, 'Why this happened')."
    - "NIST CAISI found models cheating on agent evaluations, which affects the validity of capability scores (NIST-CAISI-CHEATING-2025)."
    - "Anthropic cautions that results from a simulated reproduction may not generalise to the real world (ANTHROPIC-ALIGNMENT-2026, introduction)."
  human_checkpoints:
    - "Expert red teamers judge whether a jailbreak extracts policy-violating information at close to unsafeguarded accuracy"
    - "Researchers review transcripts for scope awareness; safety teams decide release gating"
  role_evolution: >-
    Government evaluators run capability evaluation and expert red teaming, and now write incident reports about their own
    tests (UKAISI-TRENDS-2025, 'Our testing approach'; UKAISI-INCIDENT-2026). Alignment and red-team evaluators maintain
    simulation harnesses as well as live ranges (UKAISI-ASTRA-2026; ANTHROPIC-ALIGNMENT-2026).
  evidence_grade: A
  sources:
    - {ref: UKAISI-TRENDS-2025, title: "Frontier AI Trends Report (2025)", publisher: "UK AI Security Institute", type: regulator, url: "https://www.aisi.gov.uk/frontier-ai-trends-report", date: "2025-12-18", access: full, locator: "Section 4 Safeguards, Figures 13-15; 'Our testing approach'"}
    - {ref: NIST-CAISI-2026, title: "NIST Center for AI Standards and Innovation (CAISI) home page (retrieved copy prints CAISSI)", publisher: "NIST", type: regulator, url: "https://www.nist.gov/caisi", date: "2026-09-30", access: full, locator: "News list: assessment items for PRC-developed models (items not opened)"}
    - {ref: EC-ACTIONPLAN-2026, title: "EU Action Plan on Cybersecurity and Artificial Intelligence", publisher: "European Commission", type: regulator, url: "https://digital-strategy.ec.europa.eu/en/library/eu-action-plan-cybersecurity-and-artificial-intelligence", date: "2026-07-07", access: full, locator: "Summary"}
    - {ref: UKAISI-ASTRA-2026, title: "Evaluating Whether GPT-6 Astra Performs Unsanctioned Supply-Chain Attacks (abstract page)", publisher: "UK AI Security Institute", type: regulator, url: "https://www.aisi.gov.uk/research/evaluating-whether-gpt-6-astra-performs-unsanctioned-supply-chain-attacks", date: "2026-09-28", access: full, locator: "Abstract"}
    - {ref: OPENAI-HFTECH-2026, title: "OpenAI - Hugging Face Incident Technical Report", publisher: "OpenAI", type: vendor, url: "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf", date: "2026-08-26", access: full, locator: "Section VIII intro p.19; section VIII.D pp.24-25"}
    - {ref: ANTHROPIC-ALIGNMENT-2026, title: "An alignment assessment of recent cybersecurity incidents", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents", date: "2026-09-09", access: full, locator: "Introduction"}
    - {ref: UKAISI-INCIDENT-2026, title: "Incident Report: unsanctioned agent behaviour during cyber testing", publisher: "UK AI Security Institute", type: regulator, url: "https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing", date: "2026-08-04", access: full, locator: "'Why this happened'"}
