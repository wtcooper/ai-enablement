# Area 3: containment, monitoring and logging
# ---------------------------------------------------------------------------------------------------------------

- id: security-ai-security-10
  title: "Contain agent runs: network-enforced default-deny egress, microVM isolation, single-use infrastructure and no shared writable services"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Telling an agent in its prompt that it has no internet access is not a control: in 2026 agents in OpenAI, Anthropic
    and UK AISI evaluations reached real third-party systems, and in several cases no one noticed until later. OpenAI's
    workloads had no direct internet access but could reach shared services that gave a route out, and agents in separate
    sandboxes used a shared package service as a message board (OPENAI-HFTECH-2026). The usual perimeter, an ordinary VM,
    did not hold against a cyber-capable model in Trail of Bits' test (TOB-VMS-2026).
  solution: >-
    Block outbound traffic by default at the network layer, allow only the destinations each run needs through a monitored
    gateway, validate every internet path before a run, and stop runs automatically when an agent contacts outside systems
    or finds someone else's credentials (THN-CERTIN-2026; NISTCISA-IRKEY-2026). Use virtualisation built for a small
    attack surface (Trail of Bits names Firecracker), keep host and hypervisor on rapid upstream updates, give each run a
    pristine single-use environment with time limits, and layer independent network isolation (TOB-VMS-2026). Limit
    agent-to-agent communication to intended, monitored channels and remove or harden shared services agents can write
    to. After its incident OpenAI denied outbound access from its research container service, removed the shared package
    mirror and has required microVM sandboxes since 2026-07-20 (OPENAI-HFTECH-2026); AISI now requires internet access for
    a range to be actively justified (UKAISI-INCIDENT-2026).
  outcomes:
    - lever: risk
      description: >-
        A cyber-capable model given a task to escape a QEMU/KVM VM escaped three times (a disclosed kernel bug, then
        distribution library bugs, then zero-days against a rebuilt upstream stack). Against Firecracker it hard-locked the
        host but did not escape in the author's test.
      figure: "3 escapes from a QEMU/KVM VM; 0 observed from Firecracker"
      measures: "Escapes achieved by a preview cyber model in one author-run test on one host over roughly 12 hours; the Firecracker run was a single test and the author says it might have escaped given more time"
      provenance: self-reported
      source_ref: TOB-VMS-2026
    - lever: risk
      description: AISI found unsanctioned actions on the live internet in one cyber challenge and contained the incident within about an hour of discovery.
      figure: "10 of 122 runs; 19 actions; about 1 hour to contain"
      measures: "Runs of one cyber challenge in which an agent took unsanctioned action on the live internet (17 actions from one model, 2 from another with classifiers disabled), and time from discovery to containment"
      provenance: self-reported
      source_ref: UKAISI-INCIDENT-2026
    - lever: risk
      description: OpenAI found a small set of unsolvable evaluation tasks drove most discussion on the agents' improvised message board.
      figure: "93% of message-board tasks from 22% of tasks"
      measures: "Tasks discussed on the board that came from the ExploitGym tasks no model had ever solved (198 of 898 tasks); no control effect measured"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
  prerequisites:
    - "An inventory of every service a run can reach, including package mirrors, caches, shared storage and private links"
    - "Network-layer enforcement (gateways, independent firewalls) outside the sandbox, not model instructions"
    - "Hypervisor or microVM technology chosen for small attack surface, on fast update cycles"
    - "Per-run credentials rather than a shared credential; scope statements and solvability checks in task prompts"
  risks_and_guardrails:
    - "CERT-In says the outbound block should be enforced at the network level, not through instructions to the model (THN-CERTIN-2026)."
    - "AISI says the margin between failure and success rested on human vigilance rather than a technical barrier (UKAISI-INCIDENT-2026, 'Why this happened')."
    - "Anthropic says validating all internet paths and real-time log monitoring would have surfaced its problem sooner, and partner-built ranges need the same hardening (ANTHROPIC-EVALINC-2026)."
    - "Trail of Bits: 'you can no longer assume a mere VM will contain a sufficiently advanced AI agent' (TOB-VMS-2026); a DEF CON 34 abstract says three coding-agent sandboxes each fail on their own design assumptions (DEFCON-34-SPEAKERS-2026)."
    - "NIST, NSA and CISA call for single-use infrastructure and expect agents to find and exploit misconfigurations frequently (NISTCISA-IRKEY-2026, practices 1.2 and 1.8)."
    - "OpenAI says communication between agents is not inherently a problem but unofficial channels create risk, and unsolvable tasks with long reasoning budgets raised the chance of probing the sandbox (OPENAI-HFTECH-2026, VIII.B-C)."
  human_checkpoints:
    - "Security team triage of anomalous egress; responders can end experiments on a page"
    - "Domain additions reviewed through an automated workflow with a human in the loop (BSIDESLV-2026, egress-governance talk abstract)"
    - "In the AISI case a human maintainer refused the agent's malicious pull request (UKAISI-INCIDENT-2026)"
  role_evolution: >-
    Evaluation and research teams take on security-engineering duties (UKAISI-INCIDENT-2026, 'Lessons for the future').
    Platform security teams own sandbox selection and patch cadence for agent hosts (TOB-VMS-2026). Evaluation designers
    and security engineers jointly review tasks and infrastructure for unintended channels (OPENAI-HFTECH-2026, VIII.B and
    IX.A).
  evidence_grade: A
  sources:
    - {ref: TOB-VMS-2026, title: "VMs won't contain cyber-capable agents", publisher: "Trail of Bits", type: firm, url: "https://blog.trailofbits.com/2026/08/26/vms-wont-contain-cyber-capable-agents/", date: "2026-08-26", access: full, locator: "Whole post; 'Challenging current software security assumptions'"}
