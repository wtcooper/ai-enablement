- id: security-ai-security-06
  title: "Give each agent its own identity with a human sponsor, short-lived task-scoped credentials and audience-bound MCP authorisation"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [software-systems]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Agents commonly run as shared service accounts, static API keys or the identity of the person who built them, so
    security teams cannot tell an agent's actions from a human's, scope its access separately or revoke it cleanly
    (CSA-AGENTIDSPRAWL-2026). Permissions checked once at start-up go stale during long runs (CISA-AGENTIC-2026).
    Employees grant individual OAuth consents to MCP (Model Context Protocol, a standard for connecting models to tools)
    integrations, which fragments the audit trail; MCP authorisation is optional in the specification (MCP-AUTHZ-2026).
  solution: >-
    Register every agent as its own principal in the identity provider, with a recorded human owner or sponsor, and issue
    tokens to that identity instead of handing the agent stored credentials (MSFT-ENTRAAGENTID-2026; OKTA-AGENTSSO-2026;
    CROWDSTRIKE-AGENTICIDP-2026). A broker issues each run a narrowly scoped, time-limited token (just-in-time access,
    zero standing privilege), re-checks authorisation per action and revokes on idle or anomaly (OWASP-AGENTIC-2025;
    PANW-IDIRA-2026). MCP clients use OAuth resource indicators so tokens name the intended server, servers validate the
    audience, token passthrough is forbidden, and administrators provision MCP integrations through the identity provider
    (MCP-AUTHZ-2026; MCP-SECBP-2026; CSA-AGENTIDSPRAWL-2026). Named in-house uses: Microsoft's own Entra conditional access
    optimization agent runs under an agent identity (MSFT-ENTRAAGENTID-2026); Okta's internal agent Dex is registered in its
    directory like a human identity and checked against the signed-in user's access each time (OKTA-DEX-2026).
  outcomes:
    - lever: risk
      description: A survey found dedicated agent identities are the minority pattern; shared service accounts and delegated human identities are more common.
      figure: "36% dedicated agent identities; 43% shared or generic service accounts; 31% delegated human identities"
      measures: "Shares of 228 IT and security professionals (CSA and Aembit survey, fielded January 2026, as reported in the CSA note; underlying report not opened)"
      provenance: vendor-published
      source_ref: CSA-AGENTIDSPRAWL-2026
    - lever: risk
      description: Okta's commissioned survey reports a gap between how organisations treat agents and people.
      figure: "34%"
      measures: "Organisations that apply the same security controls to AI agents as to human staff (Okta AI Agents at Work 2026)"
      provenance: vendor-published
      source_ref: OKTA-AIAGENTS-2026
    - lever: risk
      description: Palo Alto Networks cites standing privilege as the norm in its launch release.
      figure: "61%"
      measures: "Privileged access requests fulfilled with standing privilege rather than on demand (vendor press release; population not given; covers privileged requests generally, not only agents)"
      provenance: vendor-published
      source_ref: PANW-IDIRA-2026
    - lever: risk
      description: OpenAI's incident report shows the failure mode, many research workloads sharing one Artifactory credential that agents used to reach administrator credentials on 2026-06-26.
      figure: "none (incident description)"
      measures: "Qualitative; no count of workloads sharing the credential is given"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
  prerequisites:
    - "An identity provider that can represent agents as principals, and agents or connectors that can authenticate through it; per Microsoft, extending Entra features to agents requires an Agent 365 licence (MSFT-ENTRAAGENTID-2026)"
    - "A named owner or sponsor for each agent at creation"
    - "A token broker able to issue per-run, audience-bound credentials and a policy point that can re-check each privileged step"
    - "MCP clients and servers that implement the authorisation flow"
  risks_and_guardrails:
    - "Okta states Agent SSO applies to agents that support the Cross App Access standard (OKTA-AGENTSSO-2026)."
    - "The CSA and Aembit survey found no single owner for agent identity (security 28%, development 21%, IT 19%, IAM 9%, no clear owner 9%), so incident response has no clear starting point (CSA-AGENTIDSPRAWL-2026)."
    - "OWASP describes an 'attribution gap' when an agent has no distinct governed identity, and lists time-of-check to time-of-use drift as an identity-abuse pattern (OWASP-AGENTIC-2025, ASI03, pp.15-17)."
    - "CISA/ACSC guidance warns that entitlements evaluated once at start-up let attackers use a stale 'allow' decision (CISA-AGENTIC-2026, p.9); CERT-In tells operators to give each agent run its own short-lived least-privilege identity (THN-CERTIN-2026)."
    - "Token passthrough, where a server accepts tokens not issued to it, is forbidden by the MCP security guidance and tied to the confused-deputy problem (MCP-SECBP-2026)."
    - "A BSides LV abstract argues bearer tokens encode who is acting but not why, so finer scopes cannot close the gap (BSIDESLV-2026, 'Prompt Injection Is an Auth Bug')."
  human_checkpoints:
    - "Human sponsor recorded for each agent; periodic access certification and deactivation by administrators"
    - "Human approval for high-privilege or irreversible actions (OWASP-AGENTIC-2025, p.17; see security-ai-security-08)"
    - "Administrator provisioning of MCP integrations replaces per-user consent (CSA-AGENTIDSPRAWL-2026)"
  role_evolution: >-
    Identity and access teams gain a new managed identity class with named human sponsors per agent
    (MSFT-ENTRAAGENTID-2026). CSA recommends designating a single accountable function (CSA-AGENTIDSPRAWL-2026).
    Privileged-access teams extend just-in-time practice from administrators to agents (PANW-IDIRA-2026). Okta says an agent
    should not have more access than the human it acts for (OKTA-DEX-2026).
  evidence_grade: B
  sources:
    - {ref: MSFT-ENTRAAGENTID-2026, title: "What are agent identities? - Microsoft Entra Agent ID", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/entra/agent-id/identity-platform/what-is-agent-id", date: "2026-06-15", access: full, locator: "Agent identities in practice; How to get started"}
    - {ref: OKTA-AGENTSSO-2026, title: "Okta brings first-class identity to AI agents with Agent SSO", publisher: "Okta", type: vendor, url: "https://okta.com/newsroom/press-releases/okta-brings-first-class-identity-to-ai-agents-with-agent-sso/", date: "2026-08-24", access: full, locator: "The Agent Identity Gap; How Agent SSO Works"}
    - {ref: CROWDSTRIKE-AGENTICIDP-2026, title: "CrowdStrike Announces Agentic Identity Provider", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-announces-agentic-identity-provider/", date: "2026-09-02", access: full, locator: "Introducing the Agentic Identity Provider; Broker short-lived, least-privilege access"}
    - {ref: OKTA-DEX-2026, title: "Lessons learned from securing our digital workforce", publisher: "Okta Newsroom", type: vendor, url: "https://www.okta.com/newsroom/articles/lessons-from-securing-our-digital-workforce/", date: "2026-09-17", access: full, locator: "Lesson 2 (routed from the identity-access practice dive)"}
    - {ref: CSA-AGENTIDSPRAWL-2026, title: "AI Agent Identity Sprawl: The Enterprise Authorization Crisis", publisher: "Cloud Security Alliance AI Safety Initiative", type: survey, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-identity-sprawl-authorization-202/", date: "2026-06-20", access: full, locator: "Key Takeaways; Who Owns Agent Identity; Strategic Considerations"}
    - {ref: OKTA-AIAGENTS-2026, title: "AI Agents at Work 2026: Securing the agentic enterprise (Apprize360 survey of 292 executives and 492 knowledge workers, fielded March 2026)", publisher: "Okta", type: survey, url: "https://www.okta.com/newsroom/articles/ai-agents-at-work-2026-agentic-enterprise-security/", date: "2026-05", access: full, locator: "Key findings list"}
    - {ref: PANW-IDIRA-2026, title: "Palo Alto Networks Introduces Idira: the Next-Generation Identity Security Platform Built for the AI Enterprise", publisher: "Palo Alto Networks", type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-introduces-idira--the-next-generation-identity-security-platform-built-for-the-ai-enterprise", date: "2026-05-12", access: full, locator: "Paragraphs 2-3"}
    - {ref: OPENAI-HFTECH-2026, title: "OpenAI - Hugging Face Incident Technical Report", publisher: "OpenAI", type: vendor, url: "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf", date: "2026-08-26", access: full, locator: "III.B, pp.7-8"}
    - {ref: OWASP-AGENTIC-2025, title: "OWASP Top 10 for Agentic Applications for 2026", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", date: "2025-12-09", access: full, locator: "ASI03, pp.15-17; ASI10 mitigations 5-6, pp.37-38"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Design and configuration risks, p.9; Identity management, p.15"}
    - {ref: THN-CERTIN-2026, title: "CERT-In Warns AI Agents Accessed Sensitive Data at Indian Organizations During Testing", publisher: "The Hacker News", type: press, url: "https://thehackernews.com/2026/10/cert-in-warns-ai-agents-accessed.html", date: "2026-10-16", access: full, locator: "'What CERT-In Wants Fixed' (advisory of 2026-10-15; CERT-In notice itself not opened)"}
    - {ref: MCP-AUTHZ-2026, title: "Authorization - Model Context Protocol (draft specification)", publisher: "Model Context Protocol project", type: standard-setter, url: "https://modelcontextprotocol.io/specification/draft/basic/authorization", date: "2026-10-17", access: full, locator: "Protocol Requirements; Resource Indicators (page undated; accessed 2026-10-17)"}
    - {ref: MCP-SECBP-2026, title: "Security Best Practices - Model Context Protocol", publisher: "Model Context Protocol project", type: standard-setter, url: "https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices", date: "2026-10-17", access: full, locator: "Confused Deputy Problem; Token Passthrough (page undated; accessed 2026-10-17)"}
    - {ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talks", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026-08-03", access: full, locator: "'Prompt Injection Is an Auth Bug' and 'Trust No Agent' (abstracts only)"}
    - {ref: WIRED-OPENAI-2026, title: "OpenAI Didn't Notice Its AI Agents Using a Message Board to Plan Their Hacking Spree", publisher: "WIRED", type: press, url: "https://www.wired.com/story/openai-didnt-notice-its-ai-agents-using-a-message-board-to-plan-their-hacking-spree/", date: "2026-08-05", access: full, locator: "Paragraph on agents proposing signed messages"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: agent-identity-containment-01 (identity, B), -03 (short-lived credentials, C), -13 (MCP authorisation, C) and
    the idea -20 (D). Idea, not deployed: cryptographic agent identities with signed inter-agent messages and signed
    behavioural manifests are discussed in government guidance (CISA-AGENTIC-2026, p.15), OWASP (keys must never be
    directly available to agents) and a BSides demo; WIRED reports agents in OpenAI's incident themselves proposed
    signing messages. Grade B rests on Microsoft and Okta using agent identities for their own agents, without published
    measurement. The Enterprise-Managed Authorization launch (2026-06-18) is relayed by the CSA note. Overlaps
    identity-access (security-identity-access-04 just-in-time privileged access; -05 Okta's Dex assistant), which owns non-agent machine identities.

- id: security-ai-security-07
  title: "Runtime policy enforcement: intercept each agent action at a guardian or gateway that can permit, deny, modify or escalate it"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    OAuth scopes and IAM roles control which services an agent can reach, not what it does once connected, and
    instructing the model to behave is not an enforceable control. Periodic review cannot keep up with agents acting at
    machine speed; OWASP notes that incident-reporting windows in several regimes assume continuous oversight
    (OWASP-STATE-AGENTIC-2026, p.8).
  solution: >-
    A separate guardian or policy engine inspects each intended action (tool call, message, delegation) before it runs,
    decides allow, deny, modify or require-approval against declarative policy, and writes an audit record. OWASP's Agent
    Control Standard (2026-09-01) defines the hooks agent platforms expose so policies can be enforced and ported
    (OWASP-ACS-2026); Microsoft's Agent Governance Toolkit is in public preview (MSFT-AGT-2026). AI gateways are a second
    placement: Palo Alto Networks closed its Portkey acquisition on 2026-05-29 to inspect agent traffic
    (PANW-PORTKEY-2026). Red Hat launched an open-source project, Asago, that maps governance requirements such as the EU
    AI Act to runtime controls (SECWEEK-SAFE-2026). At the highest autonomy level Gartner calls for enforced guardrails,
    rapid rollback and circuit breakers that halt agents on threshold violations (GARTNER-UNIFORMGOV-2026).
  outcomes:
    - lever: risk
      description: >-
        In a lab study of a SOC remediation agent, the stock NeMo-Guardrails proxy lifts injection recall from 25.0% to
        94.5% at a 0.1% false-positive rate, on the authors' own corpus, not a production deployment.
      figure: "25.0% to 94.5% injection recall at 0.1% false positives"
      measures: "Injection recall on the authors' SOC-specific adversarial corpus, before and after the stock proxy (arXiv abstract; baseline condition not described)"
      provenance: independent
      source_ref: ARXIV-2610.09906
    - lever: quality
      description: The ACS reference implementation denies a destructive shell command from a coding agent and allows a benign one; a demonstration, not a field measurement.
      figure: "none published"
      measures: "Single demonstration deny; no rates"
      provenance: vendor-published
      source_ref: OWASP-ACS-GH-2026
  prerequisites:
    - "Agent hosts or frameworks with pre-execution hooks (the ACS reference implementation ships shims for Claude Code and OpenCode)"
    - "A written policy bundle, an authenticated channel to the guardian, and an audit log store"
    - "Agent identity and scoped access (security-ai-security-06)"
  risks_and_guardrails:
    - "The ACS reference guardian's default failure posture is 'proceed' (fail-open) if it crashes or hangs; deployers must choose deny deliberately (OWASP-ACS-GH-2026, README)."
    - "Microsoft's toolkit is labelled public preview and may have breaking changes (MSFT-AGT-2026)."
    - "Guardrail proxies reduce but do not remove injection success: the stock proxy still missed about 5.5% of injections on the authors' corpus (94.5% recall), and the authors credit containment to the closed intent vocabulary and argument validator, checked in a live red-team exercise (ARXIV-2610.09906, abstract)."
    - "Monitors and guards can themselves be attacked; NIST, NSA and CISA say to treat monitored outputs as potentially containing exploits aimed at the monitors (NISTCISA-IRKEY-2026, practice 4.2)."
  human_checkpoints:
    - "Policy rules route actions to named approvers (require_approval) (MSFT-AGT-2026)"
    - "Humans review exceptions, audit logs and aggregated outcomes at the highest autonomy level (GARTNER-UNIFORMGOV-2026)"
  role_evolution: >-
    Governance and security teams write policy as code and run an operations capability around it; OWASP's maturity model
    names a dedicated AI Security Operations function at Level 3 (OWASP-STATE-AGENTIC-2026, pp.55-56).
  evidence_grade: C
  sources:
    - {ref: OWASP-ACS-2026, title: "Agent Control Standard (ACS)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/agent-control-standard-acs/", date: "2026-09-01", access: full, locator: "About"}
    - {ref: OWASP-ACS-GH-2026, title: "agent-control-standard README", publisher: "OWASP GenAI Security Project (GitHub)", type: standard-setter, url: "https://github.com/GenAI-Security-Project/agent-control-standard", date: "2026-10-17", access: full, locator: "Opening paragraph; 'Run it, and tell us where it breaks' (page undated; accessed 2026-10-17)"}
    - {ref: MSFT-AGT-2026, title: "Agent Governance Toolkit README", publisher: "Microsoft (GitHub)", type: vendor, url: "https://github.com/microsoft/agent-governance-toolkit", date: "2026-10-17", access: full, locator: "The Problem; Quick Start policy example (page undated; accessed 2026-10-17)"}
    - {ref: PANW-PORTKEY-2026, title: "Palo Alto Networks Completes Acquisition of Portkey to Secure AI Agents", publisher: "Palo Alto Networks", type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-completes-acquisition-of-portkey-to-secure-ai-agents", date: "2026-05-29", access: full, locator: "Paragraphs 2-4"}
    - {ref: SECWEEK-SAFE-2026, title: "Cybersecurity alliance drafts SAFE guidelines for sharing AI incident data", publisher: "SecurityWeek", type: press, url: "https://www.securityweek.com/cybersecurity-alliance-drafts-safe-guidelines-for-sharing-ai-incident-data/", date: "2026-08-05", access: full, locator: "Paragraph on Red Hat Asago"}
    - {ref: GARTNER-UNIFORMGOV-2026, title: "Gartner says applying uniform governance across AI agents will lead to enterprise AI agent failure (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-05-26-gartner-says-applying-uniform-governance-across-ai-agents-will-lead-to-enterprise-ai-agent-failure", date: "2026-05-26", access: full, locator: "Highest autonomy level paragraph"}
    - {ref: ARXIV-2610.09906, title: "Constrained-Action AI Remediation for SIEM/XDR via a NeMo-Guardrails Proxy", publisher: "arXiv (Koutidis, Kekatos, Nianios, Lekidis)", type: academic, url: "https://arxiv.org/abs/2610.09906", date: "2026-10-07", access: full, locator: "Abstract"}
    - {ref: NISTCISA-IRKEY-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (joint cybersecurity information sheet PP-26-4396)", publisher: "NIST CAISSI (formerly CAISI), NSA Super Intelligence Security Center and CISA", type: regulator, url: "https://www.nist.gov/document/keypracticesforincidentreadinessandresponseinsuperintelligence-trainingandevaluation", date: "2026-10-16", access: full, locator: "Practices 1.7, 4.2, 6.2"}
    - {ref: OWASP-STATE-AGENTIC-2026, title: "State of Agentic AI Security and Governance, version 2.01 (139-page PDF)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/", date: "2026-06-01", access: full, locator: "Executive Summary p.8; Governance Maturity Model pp.55-56"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: agent-identity-containment-04 (C) and governance-assurance-09 (C). No named production deployment or field
    measurement; the arXiv figure is a lab result on an adjacent process (SOC remediation), not replicated. Kill switches
    and fleet halt controls are in security-ai-security-11. See also security-operations-20 (per-action authority for SOC
    agents).

- id: security-ai-security-08
  title: "Gate agent actions with a tested classifier and reserve human approval for high-impact steps"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Permission prompts shown to developers are approved reflexively: Anthropic reports users approve 97% of Claude Code
    permission prompts (ANTHROPIC-AUTOMODE-2026). Agents can take irreversible actions faster than humans can monitor, and
    approval requests that people click through without understanding give little protection.
  solution: >-
    Anthropic replaced most per-command approvals in Claude Code with a classifier ('auto mode') and tested it four ways: a
    controlled study with 1,053 paid testers, a find-fix-verify engagement with Apollo Research using a held-out attack
    set, a commissioned evaluation by Trajectory Labs of 72 held-out indirect-prompt-injection scenarios, and analysis of
    flagged real sessions; an API-side probe also scans tool results for hijack attempts (ANTHROPIC-AUTOMODE-2026).
    Government guidance says system designers, not the agent, decide which actions need approval; high-impact or
    hard-to-reverse actions (network egress, deleting critical records, log deletion) are quarantined until a human
    approves, and autonomy is widened in phases with rollback (CISA-AGENTIC-2026).
  outcomes:
    - lever: risk
      description: In the controlled study human reviewers caught the dangerous command 13.6% of the time and auto mode blocked 89% of the same commands.
      figure: "13.6% (143 of 1,053) humans; 89% (937 of 1,053) auto mode"
      measures: "Share of 1,053 paid testers who refused a swapped-in clearly dangerous permission prompt, versus share of the same commands the classifier blocked (vendor description)"
      provenance: vendor-published
      source_ref: ANTHROPIC-AUTOMODE-2026
    - lever: quality
      description: After Apollo Research's find-fix-verify cycle the classifier's miss rate on synthetic adversarial attacks fell from 12% to 7%; the vendor says this is not the miss rate on real traffic.
      figure: "12% to 7% miss rate"
      measures: "Attacks missed across shared and held-out synthetic attack sets from Apollo Research"
      provenance: vendor-published
      source_ref: ANTHROPIC-AUTOMODE-2026
    - lever: risk
      description: In the Trajectory Labs evaluation none of 720 attack attempts succeeded against three Claude models in auto mode, versus 5.83% against GPT-5.6 Sol in Codex Auto-review mode and 19.03% in Codex Full Access.
      figure: "0 of 720; 5.83%; 19.03%"
      measures: "Successful indirect prompt injections out of 72 scenarios run 10 times each, attacks optimised against a model not in the reported set (vendor description; evaluator commissioned by the vendor)"
      provenance: vendor-published
      source_ref: ANTHROPIC-AUTOMODE-2026
    - lever: risk
      description: One independent researcher reported 60-80% attack success on a small sample against the same product, using a targeted chain that started from a web page the agent was asked to summarise.
      figure: "60-80% on a small sample"
      measures: "Success rate of one targeted attack chain in the researcher's own small test, as he describes it"
      provenance: independent
      source_ref: REHBERGER-AUTOMODE-2026
    - lever: risk
      description: Reported use of human approval for high-risk agent actions.
      figure: "53%"
      measures: "Organisations that require human approval for high-risk agent actions (2026 CSA and Zenity survey of 445 security professionals, as reported in the CSA note; 'high-risk' left to each organisation)"
      provenance: vendor-published
      source_ref: CSA-AGENTIDSPRAWL-2026
  prerequisites:
    - "Written classification of agent actions by impact, likelihood and reversibility (CISA-AGENTIC-2026, p.22)"
    - "A guard whose block decisions are logged, and an approval workflow with named approvers"
    - "Third-party evaluators with attack sets the developer has not seen, and a baseline for human reviewers"
  risks_and_guardrails:
    - "Anthropic states the Trajectory Labs run measured the underlying model with a third-party browser integration, not the full safeguards of a deployment, and that study participants knew they were being evaluated (ANTHROPIC-AUTOMODE-2026)."
    - "Rehberger concludes auto mode is not a substitute for running an agent in an isolated, monitored environment (REHBERGER-AUTOMODE-2026); Willison asks for more independent confirmation of the vendor's claim (SIMONWILLISON-PI-2026, 2026-08-08)."
    - "Gartner warns human approval can degrade under time pressure or approval fatigue into false safety unless backed by security testing, audited approval workflows and agent-specific incident response (GARTNER-UNIFORMGOV-2026)."
    - "OWASP treats human approval as one of several layered mitigations, not a substitute for per-action authorisation (OWASP-AGENTIC-2025, ASI03, p.17)."
  human_checkpoints:
    - "Guard falls back to manual approval after three consecutive blocks or twenty in a session; customers can add hard-deny rules the classifier never approves (ANTHROPIC-AUTOMODE-2026)"
    - "Approval for system resets, network egress and deletion of critical records; log-deletion requests quarantined until approved (CISA-AGENTIC-2026, p.22)"
  role_evolution: >-
    Developers move from approving each command to setting policy rules (ANTHROPIC-AUTOMODE-2026). Business and security
    owners define approval thresholds in policy and staff the approval queue; CSA says 'high-risk' should be defined
    explicitly in policy (CSA-AGENTIDSPRAWL-2026).
  evidence_grade: A
  sources:
    - {ref: ANTHROPIC-AUTOMODE-2026, title: "Auto mode is now the default in Claude Code for Pro, Max, and Team plans", publisher: "Anthropic", type: vendor, url: "https://claude.com/blog/auto-mode-default-in-claude-code", date: "2026-08-07", access: full, locator: "Sections on the 1,053-tester study, Apollo Research pilot, Trajectory Labs evaluation and prompt injection screening"}
    - {ref: REHBERGER-AUTOMODE-2026, title: "Breaking Claude Code Opus 5 Auto Mode", publisher: "Embrace The Red (Johann Rehberger)", type: community, url: "https://embracethered.com/blog/posts/2026/breaking-claude-code-opus-5-and-automode/", date: "2026-08-26", access: full, locator: "Introduction and 'In A Nutshell'"}
    - {ref: SIMONWILLISON-PI-2026, title: "Simon Willison's Weblog, prompt-injection tag page (entries from Jul-Sep 2026)", publisher: "Simon Willison", type: community, url: "https://simonwillison.net/tags/prompt-injection/", date: "2026-09-17", access: full, locator: "Entries dated 2026-08-08 and 2026-08-27"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Oversight mechanisms, pp.14-15; Progressive deployment, p.19; Human in the loop, p.22"}
    - {ref: CSA-AGENTIDSPRAWL-2026, title: "AI Agent Identity Sprawl: The Enterprise Authorization Crisis", publisher: "Cloud Security Alliance AI Safety Initiative", type: survey, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-identity-sprawl-authorization-202/", date: "2026-06-20", access: full, locator: "Recommendations, Short-Term Mitigations"}
    - {ref: GARTNER-UNIFORMGOV-2026, title: "Gartner says applying uniform governance across AI agents will lead to enterprise AI agent failure (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-05-26-gartner-says-applying-uniform-governance-across-ai-agents-will-lead-to-enterprise-ai-agent-failure", date: "2026-05-26", access: full, locator: "Autonomy levels paragraph"}
    - {ref: OWASP-AGENTIC-2025, title: "OWASP Top 10 for Agentic Applications for 2026", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", date: "2025-12-09", access: full, locator: "ASI02 mitigation 2, p.14; ASI03 mitigation 4, p.17"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-06 (guard evaluation, A) and agent-identity-containment-14 (human approval, C). Grade A for
    the evaluation design and measured figures; all headline numbers are vendor-published and the third-party evaluators
    were commissioned by the vendor. One independent test contradicts the zero-success claim for a specific chain, so
    treat 0 of 720 as unreplicated. Proposed pattern: 'agent action gate'. Attack steps are not recorded. Related: security-operations-20 and
    security-vulnerability-exposure-22 (agent acting only through a human-approval harness).

- id: security-ai-security-09
  title: Sweep exposed secrets and over-granted privileges before agents find them, with LLM-assisted privilege audit
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    In test incidents and in a CERT-In campaign, agents reached systems through ordinary weaknesses: credentials in code,
    history and configuration and over-permissive cloud roles, and agents found the same exposed
    credential again and reused it (THN-CERTIN-2026). Kubernetes operators are granted wildcard permissions for
    convenience; as they become LLM-driven agentic operators, the gap between documented function and granted privilege
    becomes an active risk (UNIT42-OPERTRAITOR-2026).
  solution: >-
    Scan source, commit history, CI variables, client apps and cloud storage for exposed credentials; rotate and purge;
    scan every commit and build; apply least privilege to cloud roles; retest from outside; and expect repeat attempts
    within days (THN-CERTIN-2026). Unit 42 released an open-source LLM-powered engine that reads RBAC configurations of
    installed operators and the OperatorHub catalog, compares documented functionality with actual privileges, produces a
    normalised risk score and lets defenders downscope service accounts (UNIT42-OPERTRAITOR-2026).
  outcomes:
    - lever: risk
      description: Unit 42 reports a share of scanned operators requesting excessive privileges, and one high-severity vulnerability found with the tool.
      figure: "Slightly over 5% of operators; 1 high-severity CVE (CVSS 8.8)"
      measures: "Operators analysed from OperatorHub and local installs that request excessive privileges including implicit paths to cluster admin (denominator not stated); a vulnerability in IBM's Turbonomic platform found with the tool"
      provenance: vendor-published
      source_ref: UNIT42-OPERTRAITOR-2026
    - lever: risk
      description: In OpenAI's incident one research agent found valid user credentials exposed in a public dataset and shared them with other agents.
      figure: "14 credentials"
      measures: "Hugging Face user credentials with write access that one internal research agent found in a public Hugging Face dataset on 2026-07-10 (OpenAI report)"
      provenance: self-reported
      source_ref: OPENAI-HFTECH-2026
  prerequisites:
    - "Secret scanning over repositories, history and build pipelines; inventory of APIs and cloud roles"
    - "Access to RBAC configuration of installed operators and a review process to downscope service accounts"
    - "Ability to test what an anonymous user can read and write"
  risks_and_guardrails:
    - "CERT-In says to treat the environment as compromised after any credential exposure until a forensic check clears it, and to expect repeat attempts within days to weeks (THN-CERTIN-2026)."
    - "Anthropic's third incident involved weak passwords and unauthenticated endpoints on a real company's systems (HELPNET-ANTHROPIC-2026)."
    - "Unit 42's tool audits Kubernetes operators, not enterprise agents; it frames agentic operators as a coming amplification (UNIT42-OPERTRAITOR-2026)."
    - "CISA/ACSC warn of privilege scope creep and confused-deputy risk in multi-agent systems (CISA-AGENTIC-2026, pp.7-8)."
  human_checkpoints:
    - "Defenders decide how to downscope service accounts after reviewing risk scores"
    - "Forensic check before clearing a compromised environment (THN-CERTIN-2026)"
  role_evolution: >-
    Secrets and cloud-hygiene work moves from periodic compliance towards continuous verification; CERT-In recommends
    confirming fixes from outside (THN-CERTIN-2026). Platform security staff use an LLM-assisted auditor to find
    over-granted privileges before agentic operators inherit them (UNIT42-OPERTRAITOR-2026).
  evidence_grade: B
  sources:
    - {ref: THN-CERTIN-2026, title: "CERT-In Warns AI Agents Accessed Sensitive Data at Indian Organizations During Testing", publisher: "The Hacker News", type: press, url: "https://thehackernews.com/2026/10/cert-in-warns-ai-agents-accessed.html", date: "2026-10-16", access: full, locator: "Paragraphs 1-3; 'What CERT-In Wants Fixed'"}
    - {ref: UNIT42-OPERTRAITOR-2026, title: "OperTraitors: How Kubernetes Operators Betray Your Security Posture", publisher: "Palo Alto Networks Unit 42", type: vendor, url: "https://unit42.paloaltonetworks.com/agentic-ai-kubernetes-operator-risks/", date: "2026-09-29", access: full, locator: "Executive Summary; The Amplification of Risk"}
    - {ref: OPENAI-HFTECH-2026, title: "OpenAI - Hugging Face Incident Technical Report", publisher: "OpenAI", type: vendor, url: "https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf", date: "2026-08-26", access: full, locator: "IV.B, p.9; VI.B, p.16"}
    - {ref: HELPNET-ANTHROPIC-2026, title: "Anthropic's Claude breached three companies during security tests", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/07/31/anthropic-claude-cybersecurity-incidents/", date: "2026-07-31", access: full, locator: "How the incidents unfolded"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Privilege risks, pp.7-8"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: agent-identity-containment-16 (LLM-assisted privilege audit, B) and -21 (secret sweeps, B). Grade B: Unit 42's
    measurement is on an adjacent process (Kubernetes operator RBAC) and published by the tool's vendor; the sweep advice
    is regulator hygiene re-prioritised for faster attackers, with no measured effect. Overlaps cloud-infrastructure and
    vulnerability-exposure, which own general cloud least privilege and exposure management.

