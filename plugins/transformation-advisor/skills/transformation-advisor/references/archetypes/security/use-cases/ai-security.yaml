- id: security-ai-security-21
  title: "Inventory AI use cases, models and agents, including shadow AI and AI embedded in vendor services, with a named owner for each"
  archetype: security
  module: ai-security
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Security and risk teams cannot assess AI they cannot see. AI arrives through vendor features, personal accounts,
    low-code agent builders, personal OAuth grants and shared development tokens, and executives tend to overestimate
    their visibility (OKTA-AIAGENTS-2026; CSA-AGENTIDSPRAWL-2026). Singapore's regulator records that embedded AI in
    third-party services and shadow AI make complete identification hard (MAS-AIRM-RESPONSE-2026).
  solution: >-
    Keep one register of AI use cases, systems, models and agents (owner, data used, tools reachable, dependencies, risk
    tier), linked to other inventories and fed by staff attestation and, where proportionate, discovery tooling. MAS's
    final position is that identification should at least cover embedded AI from material third-party providers, that
    granularity and update frequency are risk-based, and that multi-agent systems may need agent-level identifiers
    (MAS-AIRM-RESPONSE-2026, sections 6.6, 6.15, 6.18). Discovery tools find AI tools and agents across endpoint, cloud and
    SaaS (CROWDSTRIKE-PRESS-2026); Okta says its agent product discovers shadow agents, assigns named human owners and feeds
    access certifications (OKTA-AGENTSSO-2026).
    Publish permitted and prohibited uses, restrict sharing of sensitive data with public AI tools and offer approved
    tools; Gartner says blocking agents drives staff to shadow AI (GARTNER-AGENTSPRAWL-2026). Vendors sell registries:
    Microsoft Agent 365 and ServiceNow's control tower (MSFT-AGENT365-2026; SERVICENOW-CONTROLTOWER-2026).
  outcomes:
    - lever: risk
      description: "Okta's commissioned survey shows the visibility gap an inventory is meant to close."
      figure: "90% of executives confident in AI-tool visibility; 52% of knowledge workers admit unapproved use"
      measures: "292 executives confident in visibility of AI tools vs 492 knowledge workers admitting AI use without approval, seven countries, fielded March 2026"
      provenance: vendor-published
      source_ref: OKTA-AIAGENTS-2026
    - lever: risk
      description: IBM's 2025 breach study links shadow AI to breaches and higher cost.
      figure: "1 in 5 reported a breach due to shadow AI; USD 670,000 higher average cost with high shadow-AI use"
      measures: "Breached organisations (600, March 2024 to February 2025) reporting a breach due to shadow AI; cost gap high vs low or no shadow AI"
      provenance: vendor-published
      source_ref: IBM-CODB-2025
    - lever: risk
      description: Only a minority have the controls to find shadow AI.
      figure: "37% have policies to manage AI or detect shadow AI; 34% of those with a policy audit regularly for unsanctioned AI"
      measures: "Shares of breached organisations in the IBM study"
      provenance: vendor-published
      source_ref: IBM-CODB-2025
    - lever: risk
      description: Unsanctioned agents run alongside sanctioned ones.
      figure: "More than half"
      measures: "Organisations with more than 100 sanctioned agents reporting an equal or larger number of unsanctioned agents (2026 CSA and Zenity survey of 445; denominator not stated)"
      provenance: vendor-published
      source_ref: CSA-AGENTIDSPRAWL-2026
  prerequisites:
    - "A definition of what counts as AI for the inventory, including hybrid systems, pilots and embedded vendor AI (MAS-AIRM-RESPONSE-2026, sections 2.7-2.11)"
    - "Named owners per entry and links to asset, vendor and model-risk inventories"
    - "A written acceptable-use policy staff can find; 57% of surveyed knowledge workers found theirs unclear, hard to find or non-existent (OKTA-AIAGENTS-2026)"
  risks_and_guardrails:
    - "Complete identification may be impossible; MAS says firms should assess the risk from visibility gaps and mitigate with permitted-use policy, technical limits, monitoring and awareness (MAS-AIRM-RESPONSE-2026, section 6.7)."
    - "Respondents criticised automated surveillance for unauthorised AI as invasive; MAS left the choice to the firm (MAS-AIRM-RESPONSE-2026, sections 6.9-6.11)."
    - "CSA argues shadow agents mostly appear because the approved route to deploy one is slow or undefined, so discovery without a workable approved path may not reduce their number (CSA-AGENTIDSPRAWL-2026)."
    - "Vendor registries cover that vendor's agents first (MSFT-AGENT365-2026); survey definitions of 'shadow AI' differ, and IBM's population is breached organisations (IBM-CODB-2025)."
  human_checkpoints:
    - "Business owner attests entries and risk tier; risk or security reviews new material entries before go-live (MAS-AIRM-RESPONSE-2026, section 6.8)"
    - "Security reviews high-risk findings and decides to block, approve or replace"
  role_evolution: >-
    Security and risk staff shift from policing tools to maintaining a living register with the business
    (MAS-AIRM-RESPONSE-2026, sections 6.18-6.19), and from blocking to brokering sanctioned tools
    (GARTNER-AGENTSPRAWL-2026). CSA says most organisations cannot produce an agent inventory from existing tooling
    (CSA-AGENTIDSPRAWL-2026).
  evidence_grade: C
  sources:
    - {ref: MAS-AIRM-RESPONSE-2026, title: "Response to Feedback Received on Guidelines on Artificial Intelligence Risk Management (P017-2025, 57 pages)", publisher: "Monetary Authority of Singapore", type: regulator, url: "https://www.mas.gov.sg/-/media/mas-media-library/publications/consultations/bd/2025/response-to-feedback-received-on-guidelines-on-artificial-intelligence-risk-management.pdf", date: "2026-10-07", access: full, locator: "Sections 2.4-2.11, 6.1-6.19"}
    - {ref: OKTA-AIAGENTS-2026, title: "AI Agents at Work 2026: Securing the agentic enterprise (Apprize360 survey of 292 executives and 492 knowledge workers, fielded March 2026)", publisher: "Okta", type: survey, url: "https://www.okta.com/newsroom/articles/ai-agents-at-work-2026-agentic-enterprise-security/", date: "2026-05", access: full, locator: "Key findings list"}
    - {ref: IBM-CODB-2025, title: "IBM Report: 13% of organizations reported breaches of AI models or applications, 97% of which reported lacking proper AI access controls (Cost of a Data Breach 2025)", publisher: "IBM", type: survey, url: "https://newsroom.ibm.com/2025-07-30-ibm-report-13-of-organizations-reported-breaches-of-ai-models-or-applications,-97-of-which-reported-lacking-proper-ai-access-controls", date: "2025-07-30", access: full, locator: "'Breaches and the AI era' bullets"}
    - {ref: CSA-AGENTIDSPRAWL-2026, title: "AI Agent Identity Sprawl: The Enterprise Authorization Crisis", publisher: "Cloud Security Alliance AI Safety Initiative", type: survey, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-identity-sprawl-authorization-202/", date: "2026-06-20", access: full, locator: "Shadow Agent Proliferation; Recommendations"}
    - {ref: OKTA-AGENTSSO-2026, title: "Okta brings first-class identity to AI agents with Agent SSO", publisher: "Okta", type: vendor, url: "https://okta.com/newsroom/press-releases/okta-brings-first-class-identity-to-ai-agents-with-agent-sso/", date: "2026-08-24", access: full, locator: "Okta for AI Agents (generally available since May 2026)"}
    - {ref: CROWDSTRIKE-PRESS-2026, title: "CrowdStrike press room (lists 'Shadow AI Visibility Service')", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/press-releases/", date: "2026-10-17", access: full, locator: "Navigation entry"}
    - {ref: GARTNER-AGENTSPRAWL-2026, title: "Gartner identifies six steps to manage AI agent sprawl (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-04-28-gartner-identifies-six-steps-to-manage-artificial-intelligence-agent-sprawl", date: "2026-04-28", access: full, locator: "Analyst quote on blocking vs shadow AI"}
    - {ref: MSFT-AGENT365-2026, title: "Microsoft Agent 365 overview", publisher: "Microsoft", type: vendor, url: "https://learn.microsoft.com/en-us/microsoft-agent-365/overview", date: "2026-08-20", access: full, locator: "Agent registry paragraph"}
    - {ref: SERVICENOW-CONTROLTOWER-2026, title: "AI Control Tower product page (retrieved title reads 'Super Intelligence Control Tower')", publisher: "ServiceNow", type: vendor, url: "https://www.servicenow.com/products/ai-control-tower.html", date: "2026-10-17", access: full, locator: "Hero text"}
    - {ref: PAGERDUTY-SHADOWAI-2026, title: "PagerDuty report finds two-thirds (66%) of office professionals have used unauthorized AI tools at work", publisher: "PagerDuty", type: survey, url: "https://www.pagerduty.com/newsroom/shadow-ai-workplace-survey-2026/", date: "2026-06-11", access: full, locator: "Headline and survey description (1,250 non-IT office professionals)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: governance-assurance-01 (inventory, C), -02 (shadow AI, C) and agent-identity-containment-02 (shadow agents,
    C). Grade C: vendor-sponsored survey data and product descriptions; no named organisation published results from
    running an inventory or discovery. Gartner forecasts more than 150,000 agents in an average Fortune 500 enterprise by
    2028, against fewer than 15 in 2025 (a forecast). PagerDuty reports 66% of non-IT office professionals have used
    unauthorised AI tools. Overlaps security-governance-risk.

- id: security-ai-security-22
  title: "Proportionate AI governance: board oversight, a named owner, autonomy-based risk tiers that set assurance depth, and one control set mapped to frameworks and law"
  archetype: security
  module: ai-security
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance]
  pattern: intake-triage
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Testing and certifying each agent one at a time will not scale: MSCI's team ran 40-plus agents by summer 2026 and
    expects hundreds more within 18 months (AIUC-MSCI-2026). Gartner argues uniform, binary governance over-restricts
    simple agents and under-restricts autonomous ones (GARTNER-UNIFORMGOV-2026). Funding is common but operating governance
    is not, and teams map overlapping obligations (NIST, ISO, EU AI Act, state laws) by hand (CSA-SCHELLMAN-2026).
  solution: >-
    Classify every agent by what it can do and set assurance by tier. MSCI built a tiering framework with AIUC: top-tier
    agents (customer-facing, or touching regulatory processes, HR or client data) are planned for independent
    certification, and lower tiers apply a defined subset of requirements at build time (AIUC-MSCI-2026). Gartner's
    autonomy ladder runs from read-only 'observe' agents to agents acting independently within guardrails, with controls
    rising at each level (GARTNER-UNIFORMGOV-2026). MAS expects proportionality, a risk-materiality assessment per use case,
    board and senior-management responsibilities and a cross-functional committee (MAS-AIRM-RESPONSE-2026); OWASP's
    maturity model runs from Level 0 (shadow deployments) to continuous oversight with kill switches
    (OWASP-STATE-AGENTIC-2026). Map one control set outward: OWASP's crosswalk maps 51 GenAI vulnerabilities to controls in
    25 frameworks (OWASP-XWALK-2026); CSA's AI Controls Matrix v1.1 has 247 control objectives in 18 domains with a
    machine-readable bundle (CSA-AICM-2026). Score against a chosen baseline: NIST's preliminary Cyber AI Profile, the
    COSAiS control overlays (planned for five use cases including single and multi-agent systems), the UK AI Cyber Security
    Code of Practice (13 principles) or ETSI EN 304 223 (NIST-IR8596-2025; NIST-COSAIS-2026; UK-DSIT-AICODE-2025;
    ETSI-EN304223-2025).
  outcomes:
    - lever: speed
      description: In a certifier's survey, firms with mature AI governance run agents in production at a much higher rate than those still building programmes (correlation, not shown to be causal).
      figure: "78% vs 22% with agents in production"
      measures: "Surveyed US enterprise leaders (more than 500) with agents in production, mature AI governance vs still building programmes (Schellman, summarised by CSA)"
      provenance: vendor-published
      source_ref: CSA-SCHELLMAN-2026
    - lever: quality
      description: Confidence outruns maturity in the same survey.
      figure: "74% could pass an AI compliance audit; 27% fully mature; 42% place AI purchasing decisions with a single executive; 29% prepared for the EU AI Act"
      measures: "Shares of the same sample (Schellman sells AI audits)"
      provenance: vendor-published
      source_ref: CSA-SCHELLMAN-2026
    - lever: risk
      description: Stakeholder support for the UK's AI cyber security intervention.
      figure: "80% endorsed; 83% to 90% support per principle"
      measures: "Respondents to DSIT's call for views (15 May to 9 August 2024) endorsing the two-part intervention, and support for each principle"
      provenance: independent
      source_ref: UK-DSIT-AICODE-2025
    - lever: speed
      description: No measured outcome from tiering is published; MSCI describes the intent as proportionate assurance as agent count grows.
      figure: "none published"
      measures: "Tiering framework described as built and planned for use"
      provenance: vendor-published
      source_ref: AIUC-MSCI-2026
  prerequisites:
    - "An agent inventory with attributes that drive the tier: autonomy, data, audience, regulatory touchpoints (security-ai-security-21)"
    - "Cyber leaders given authority and resources, as the Five Eyes agencies urge (CISA-FVEY-2026)"
    - "A control library and an owner for mapping upkeep"
  risks_and_guardrails:
    - "Gartner predicts that by 2027, 40% of enterprises will demote or decommission autonomous agents because governance gaps are found only after production incidents (a forecast) (GARTNER-UNIFORMGOV-2026)."
    - "Single-owner accountability can make risk assessment harder to trust, and the survey is run by an audit firm that sells AI governance services (CSA-SCHELLMAN-2026)."
    - "Mappings are community or consortium work and not legal advice (OWASP-STATE-AGENTIC-2026, p.2); dates move, as when the EU AI Omnibus pushed Annex III obligations to 2027-12-02 (EC-AIACT-2026)."
    - "Several baselines are drafts or under revision: the Cyber AI Profile is a preliminary draft and AI RMF 1.0 is being revised (NIST-IR8596-2025; NIST-AIRMF)."
  human_checkpoints:
    - "Governance owner reviews tier assignments; top-tier agents get independent audit before launch (AIUC-MSCI-2026)"
    - "Compliance counsel confirms mapped obligations and dates; control owners agree scores and remediation"
    - "Board or committee reviews tier-1 agent approvals and incident summaries"
  role_evolution: >-
    Lower-tier agents apply a defined subset of AIUC-1 requirements at build time, with testing scaled to risk, while
    top-tier agents go to independent certification (AIUC-MSCI-2026). Compliance and security architects maintain one control set mapped outward to many
    regimes (CSA-AICM-2026). At MSCI the CISO oversees the AI governance programme (AIUC-MSCI-2026).
  evidence_grade: B
  sources:
    - {ref: AIUC-MSCI-2026, title: "How MSCI secures its highest-risk AI agents with AIUC-1 (case study)", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/research/how-msci-secures-its-highest-risk-ai-agents-with-aiuc-1", date: "2026-09-24", access: full, locator: "Section 'A framework for the next thousand agents'"}
    - {ref: GARTNER-UNIFORMGOV-2026, title: "Gartner says applying uniform governance across AI agents will lead to enterprise AI agent failure (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-05-26-gartner-says-applying-uniform-governance-across-ai-agents-will-lead-to-enterprise-ai-agent-failure", date: "2026-05-26", access: full, locator: "Autonomy levels and prediction paragraphs"}
    - {ref: MAS-AIRM-RESPONSE-2026, title: "Response to Feedback Received on Guidelines on Artificial Intelligence Risk Management (P017-2025, 57 pages)", publisher: "Monetary Authority of Singapore", type: regulator, url: "https://www.mas.gov.sg/-/media/mas-media-library/publications/consultations/bd/2025/response-to-feedback-received-on-guidelines-on-artificial-intelligence-risk-management.pdf", date: "2026-10-07", access: full, locator: "Sections 3-5 and 7 (contents; section text for 4, 5 and 7 not read)"}
    - {ref: OWASP-STATE-AGENTIC-2026, title: "State of Agentic AI Security and Governance, version 2.01 (139-page PDF)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/", date: "2026-06-01", access: full, locator: "p.2; maturity models pp.53-57"}
    - {ref: CSA-SCHELLMAN-2026, title: "Enterprise Reality: Why Organizations Aren't as Prepared for AI Governance as They Think They Are (CSA blog republishing Schellman's summary of its 2026 State of AI Governance Report)", publisher: "Cloud Security Alliance / Schellman", type: survey, url: "https://cloudsecurityalliance.org/blog/2026/09/16/enterprise-reality-why-organizations-aren-t-as-prepared-for-ai-governance-as-they-think-they-are", date: "2026-09-16", access: full, locator: "Opening; sections on agentic AI, accountability and regulation"}
    - {ref: OWASP-XWALK-2026, title: "GenAI Security Industry Framework Crosswalk", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/genai-security-industry-framework-crosswalk/", date: "2026-09-01", access: full, locator: "Resource description"}
    - {ref: CSA-AICM-2026, title: "AI Controls Matrix v1.1", publisher: "Cloud Security Alliance", type: standard-setter, url: "https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1", date: "2026-06-22", access: full, locator: "'What's included in this download'"}
    - {ref: NIST-IR8596-2025, title: "NIST IR 8596 preliminary draft, Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile)", publisher: "NIST CSRC", type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Draft text; announcement box"}
    - {ref: NIST-COSAIS-2026, title: "SP 800-53 Control Overlays for Securing AI Systems (COSAiS)", publisher: "NIST CSRC", type: standard-setter, url: "https://csrc.nist.gov/projects/cosais", date: "2026-01-08", access: full, locator: "Overview: five proposed use cases"}
    - {ref: UK-DSIT-AICODE-2025, title: "Code of Practice for the Cyber Security of AI", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/ai-cyber-security-code-of-practice/code-of-practice-for-the-cyber-security-of-ai", date: "2025-01-31", access: full, locator: "Introduction (80%; 83% to 90%) and principle list"}
    - {ref: ETSI-EN304223-2025, title: "ETSI EN 304 223 V2.1.1, Securing Artificial Intelligence (SAI); Baseline Cyber Security Requirements for AI Models and Systems", publisher: "ETSI", type: standard-setter, url: "https://www.etsi.org/deliver/etsi_en/304200_304299/304223/02.01.01_60/en_304223v020101p.pdf", date: "2025-12", access: full, locator: "Scope"}
    - {ref: NIST-AIRMF, title: "AI Risk Management Framework (hub page)", publisher: "NIST", type: standard-setter, url: "https://www.nist.gov/itl/ai-risk-management-framework", date: "2026-04-07", access: full, locator: "Banner: AI RMF 1.0 being revised"}
