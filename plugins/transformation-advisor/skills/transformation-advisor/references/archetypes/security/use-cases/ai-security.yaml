- id: security-ai-security-14
  title: "Vet the AI supply chain: scan and allowlist agent skills, MCP servers and model files, gate new tools through security review, and keep AI bills of materials"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Agents load community skills, MCP servers and model files that run with the user's privileges, and registries have
    little vetting (USENIX-SKILLS-2026). OWASP cites an npm MCP server impersonating a legitimate mail package and secretly
    copying outgoing mail (OWASP-AGENTIC-2025, ASI04). Gartner says MCP's design favours interoperability over security
    enforcement (GARTNER-GENAIINC-2026). Ordinary software bills of materials miss model provenance and what a deployed
    agent can access, remember, change and delegate (ARXIV-2606.21877).
  solution: >-
    Researchers combined static pattern matching with dynamic behavioural checks over whole registries rather than samples
    (USENIX-SKILLS-2026). Defenders keep a registry of approved tools and versions, pin by content hash or commit, verify
    provenance, require consent before connecting a local server and sandbox it with minimal privileges
    (MCP-SECBP-2026; CISA-AGENTIC-2026). Gartner advises a formal security review for each MCP use case, domain ownership
    of MCP servers and tighter oversight of third-party components (GARTNER-GENAIINC-2026); OWASP publishes a cheat sheet
    for third-party MCP servers (OWASP-3PMCP-2025). OWASP's open-source AIBOM Generator produces CycloneDX AI bills of
    materials for Hugging Face models (OWASP-AIBOM-2025); a research prototype, AgentRiskBOM, adds runtime-authority fields
    such as autonomy, tool permissions, memory and credential scope (ARXIV-2606.21877).
  outcomes:
    - lever: risk
      description: Across 98,380 skills from two registries the study confirmed 157 as malicious; maintainers removed all 157 after disclosure.
      figure: "157 of 98,380 (about 0.16%, computed); 157 of 157 removed"
      measures: "Skills with confirmed malicious behaviour out of skills collected from two major registries; removal after responsible disclosure"
      provenance: independent
      source_ref: USENIX-SKILLS-2026
    - lever: risk
      description: A measurement of live remote MCP servers found many expose tools without authentication, and every OAuth-enabled server tested had at least one flaw.
      figure: "40.55% of 7,973 servers; 119 of 119 OAuth servers with a flaw"
      measures: "Live remote MCP servers exposing tools without authentication; OAuth-enabled servers tested showing at least one flaw (abstract; routed from the identity-access governance dive)"
      provenance: independent
      source_ref: ARXIV-2605.22333
    - lever: risk
      description: In a vendor survey, most security professionals use open-weight models from public repositories, yet fewer than half consistently scan inbound models.
      figure: "93%; fewer than half"
      measures: "Respondents (more than 500 security professionals) using open-weight models from public repositories; share consistently scanning inbound models (report landing page)"
      provenance: vendor-published
      source_ref: HIDDENLAYER-2026
    - lever: risk
      description: A DEF CON 34 abstract by a Wiz researcher reports testing a widely used AI gateway across thousands of real instances.
      figure: "Nearly 1 in 10"
      measures: "Real-world LiteLLM gateway instances, among thousands validated by the presenter, that accepted default credentials or required no authentication (talk abstract; method not reviewed)"
      provenance: vendor-published
      source_ref: DEFCON-34-SPEAKERS-2026
    - lever: risk
      description: In the authors' evaluation the agent bill of materials exposed far more of the modelled risk categories than SBOM-like or AIBOM-like views.
      figure: "100% vs 10.5% (SBOM-like) and 20.9% (AIBOM-like)"
      measures: "Share of modelled risk categories made visible, across 13 open-source agents and 52 risk scenarios in 14 categories; authors' own evaluation of their tool"
      provenance: self-reported
      source_ref: ARXIV-2606.21877
  prerequisites:
    - "Inventory of installed skills, servers and model files, with domain ownership of MCP servers"
    - "A sandbox for dynamic checks, a policy on registries and signing, and authentication on any gateway or tool server before exposure"
    - "Agent definitions and tool configurations in machine-readable form for bills of materials"
  risks_and_guardrails:
    - "Each malicious skill averaged 4.03 vulnerabilities and sophistication correlated with concealment, which limits static detection (USENIX-SKILLS-2026)."
    - "Trail of Bits bypassed all tested public skill scanners with four purpose-built malicious skills (TOB-SKILLS-2026; routed from the application-security discourse dive)."
    - "GTIG reports a threat actor published trojanized forks of MCP servers via a package registry (GTIG-AITRACKER-2026, UNC6780)."
    - "CISA/ACSC warn of tool 'squatting' with look-alike names and persuasive tool descriptions that bias tool selection (CISA-AGENTIC-2026, pp.11-12)."
    - "AgentRiskBOM's authors say scoring thresholds require human calibration (ARXIV-2606.21877)."
  human_checkpoints:
    - "Security review approves any new skill, server or model for production; the high-risk capability combination is blocked (GARTNER-GENAIINC-2026)"
    - "Explicit user or administrator consent before connecting a new local server (MCP-SECBP-2026)"
    - "Security reviews diffs when agent authority fields change (ARXIV-2606.21877)"
  role_evolution: >-
    Application-security and platform teams take on registry and artifact vetting for AI components alongside dependency
    review (OWASP-GENAI-RES-2026), and run an approval queue and catalogue of vetted tool servers (OWASP-3PMCP-2025).
  evidence_grade: A
  sources:
    - {ref: USENIX-SKILLS-2026, title: "'Do Not Mention This to the User': Detecting and Understanding Malicious Agent Skills in the Wild", publisher: "USENIX Security Symposium 2026 (Griffith University and others)", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/liu-yi", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2605.22333, title: "A First Measurement Study on Authentication Security in Real-World Remote MCP Servers", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2605.22333", date: "2026-05-21", access: full, locator: "Abstract (read by the identity-access governance dive; routed)"}
    - {ref: HIDDENLAYER-2026, title: "2026 AI Threat Landscape Report (landing page with key findings; full report gated)", publisher: "HiddenLayer", type: survey, url: "https://www.hiddenlayer.com/report-and-guide/threatreport2026", date: "2026-03-18", access: full, locator: "'Key findings at a glance'"}
    - {ref: DEFCON-34-SPEAKERS-2026, title: "DEF CON 34 main-stage speakers and abstracts (Las Vegas, 6-9 Aug 2026)", publisher: "DEF CON", type: conference, url: "https://defcon.org/html/defcon-34/dc-34-speakers.html", date: "2026-08-06", access: full, locator: "'OffGuard: Breaking the Most Popular AI Gateway from Auth Bypass to Cloud Compromise' (Saturday 8 Aug, Wiz; abstract)"}
    - {ref: ARXIV-2606.21877, title: "AgentRiskBOM: A Risk-Scoping Security Bill of Materials for Agentic AI Systems", publisher: "arXiv (IEEE Cyber-AI 2026)", type: academic, url: "https://arxiv.org/abs/2606.21877", date: "2026-06-20", access: full, locator: "Abstract"}
    - {ref: TOB-SKILLS-2026, title: "The sorry state of skill distribution", publisher: "Trail of Bits", type: firm, url: "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/", date: "2026-06-03", access: full, locator: "Opening and 'Bypassing ClawHub scanning' (read by the application-security discourse dive; routed)"}
    - {ref: GTIG-AITRACKER-2026, title: "GTIG AI Threat Tracker: From Prompting to Autonomy - The Evolution of Adversarial AI", publisher: "Google Threat Intelligence Group", type: vendor, url: "https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai/", date: "2026-09-08", access: full, locator: "UNC6780 supply chain compromise"}
    - {ref: OWASP-AGENTIC-2025, title: "OWASP Top 10 for Agentic Applications for 2026", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", date: "2025-12-09", access: full, locator: "ASI04 Agentic Supply Chain Vulnerabilities, pp.18-20"}
    - {ref: MCP-SECBP-2026, title: "Security Best Practices - Model Context Protocol", publisher: "Model Context Protocol project", type: standard-setter, url: "https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices", date: "2026-10-17", access: full, locator: "Local MCP Server Compromise (page undated; accessed 2026-10-17)"}
    - {ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services", publisher: "CISA with ASD's ACSC, NSA, Canadian Cyber Centre, NCSC-NZ and NCSC-UK", type: regulator, url: "https://www.cyber.gov.au/sites/default/files/2026-05/careful_adoption_of_agentic_ai_services.pdf", date: "2026-05-01", access: full, locator: "Third-party components, pp.11-12; Manage third-party components, p.18"}
    - {ref: GARTNER-GENAIINC-2026, title: "Gartner predicts 25% of all enterprise GenAI applications will experience at least five minor security incidents per year by 2028 (press release)", publisher: "Gartner", type: firm, url: "https://www.gartner.com/en/newsroom/press-releases/2026-04-09-gartner-predicts-25-percent-of-all-enterprise-gen-ai-applications-will-experience-at-least-five-minor-security-incidents-per-year-by-2028", date: "2026-04-09", access: full, locator: "Press release body"}
    - {ref: OWASP-3PMCP-2025, title: "CheatSheet: A Practical Guide for Securely Using Third-Party MCP Servers 1.0", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/cheatsheet-a-practical-guide-for-securely-using-third-party-mcp-servers-1-0/", date: "2025-11-04", access: full, locator: "Resource description"}
    - {ref: OWASP-AIBOM-2025, title: "OWASP AIBOM Generator", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-aibom-generator/", date: "2025-12-17", access: full, locator: "Resource description"}
    - {ref: OWASP-GENAI-RES-2026, title: "OWASP GenAI Security Project resources library", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resources/", date: "2026-09-01", access: full, locator: "Entries on MCP server guides and the AIBOM Generator"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged: threats-redteam-15 (A), agent-identity-containment-12 (C), governance-assurance-19 (MCP review gate, C) and
    -10 (AI and agent bills of materials, C). Grade A rests on an independent, measured whole-registry study; it is a
    research measurement, not an enterprise deployment. Wiz also markets agentless AI-BOM discovery (vendor claim). Gartner
    forecasts 25% of enterprise GenAI applications with at least five minor security incidents a year by 2028 (9% in
    2025), a forecast, not a measurement of this control. Developer-facing skill and package scanning overlaps
    security-application-security-21.

- id: security-ai-security-15
  title: Detect and disrupt model-extraction and distillation campaigns against hosted models
  archetype: security
  module: ai-security
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Competitors use fraudulent accounts and proxies to harvest outputs of frontier models (distillation: training a model
    on another model's outputs), which transfers proprietary capability and can leave the resulting models without the
    original safeguards (ANTHROPIC-DISTILL-2026).
  solution: >-
    Model providers build classifiers and behavioural fingerprinting over API traffic, detect chain-of-thought elicitation,
    share indicators across labs and clouds, tighten account verification on exploited pathways and reduce the usefulness
    of suspected distillation outputs (ANTHROPIC-DISTILL-2026; GTIG-AITRACKER-2026). CISA, NSA and FBI issued a joint
    advisory recommending detection, targeted response alteration and cross-organisation sharing (CISA-AA26-251A-2026).
  outcomes:
    - lever: risk
      description: Anthropic attributed three campaigns to named laboratories.
      figure: "More than 16M exchanges; about 24,000 fraudulent accounts"
      measures: "Exchanges with Claude generated by the three campaigns and fraudulent accounts used, as stated by Anthropic"
      provenance: vendor-published
      source_ref: ANTHROPIC-DISTILL-2026
    - lever: risk
      description: Google's threat group says it observes coordinated distillation campaigns regularly, some exceeding 100 million prompts, and has deployed defences that lower the utility of the output.
      figure: "More than 100M prompts in some campaigns"
      measures: "Prompts in individual coordinated campaigns targeting Google models, per GTIG"
      provenance: vendor-published
      source_ref: GTIG-AITRACKER-2026
    - lever: risk
      description: The joint advisory states six China-based companies extracted billions of tokens across millions of exchanges since at least late 2024.
      figure: "Billions of tokens; millions of exchanges"
      measures: "Tokens and exchanges extracted from U.S. frontier models, as stated in the advisory"
      provenance: independent
      source_ref: CISA-AA26-251A-2026
  prerequisites:
    - "API telemetry with account, payment and network metadata"
    - "Behavioural classifiers and fraud-style account verification"
    - "Cross-provider intelligence-sharing channels and legal terms prohibiting distillation"
  risks_and_guardrails:
    - "The advisory recommends subtly altering responses to suspected distillers and not telling them about downgrades, to avoid helping them adapt (CISA-AA26-251A-2026, 'Mitigations')."
    - "Anthropic aims to reduce the usefulness of outputs for illicit distillation without degrading legitimate customers' experience (ANTHROPIC-DISTILL-2026)."
    - "OWASP places model extraction under Unbounded Consumption (LLM06) and notes that exposing logits and log-probabilities speeds extraction (OWASP-LLM-2026, LLM06 item 7, p.39)."
  human_checkpoints:
    - "Attribution to specific actors rests on analyst review of metadata and infrastructure indicators"
    - "Cross-organisation correlation before response degradation"
  role_evolution: >-
    Abuse and threat-intelligence analysts at model providers add extraction hunting to fraud-style account analysis
    (ANTHROPIC-DISTILL-2026; CISA-AA26-251A-2026).
  evidence_grade: A
  sources:
    - {ref: ANTHROPIC-DISTILL-2026, title: "Detecting and preventing distillation attacks", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/detecting-and-preventing-distillation-attacks", date: "2026-02-23", access: full, locator: "'What we found'; 'How we're responding'"}
    - {ref: GTIG-AITRACKER-2026, title: "GTIG AI Threat Tracker: From Prompting to Autonomy - The Evolution of Adversarial AI", publisher: "Google Threat Intelligence Group", type: vendor, url: "https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai/", date: "2026-09-08", access: full, locator: "Section 'Distillation Attacks'"}
    - {ref: CISA-AA26-251A-2026, title: "China-Based Artificial Intelligence Companies Conducting Industrial-Scale Distillation Campaigns Against U.S. AI Companies (joint advisory AA26-251A)", publisher: "CISA, NSA and FBI", type: regulator, url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-251a", date: "2026-09-08", access: full, locator: "Executive summary; Table 2 ATLAS mappings; mitigations (read from the identical FBI copy at https://www.ic3.gov/CSA/2026/260908.pdf; cisa.gov blocked automated access)"}
    - {ref: OWASP-LLM-2026, title: "OWASP Top 10 for LLM Applications 2026 (OWASP GenAI LLM Top 10 2026)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/", date: "2026-08-03", access: full, locator: "LLM06 Unbounded Consumption, item 7, p.39"}
  last_reviewed: "2026-10-17"
  notes: >-
    Source: threats-redteam-16. Grade A: measured by named organisations and a joint government advisory. Figures describe
    the threat and detection scope; none report false-positive rates or the result of response degradation. Relevant
    mainly to organisations that host models for others. Related: security-threat-intelligence-24 (model providers'
    threat intelligence teams disrupting misuse).

- id: security-ai-security-16
  title: "Idea: check training, fine-tuning and retrieval data for tampering before use"
  archetype: security
  module: ai-security
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Researchers show that a small, near-constant number of poisoned documents can implant backdoors in language models
    regardless of dataset size, and that the same holds for fine-tuning (ARXIV-2510.07192).
  solution: >-
    Idea (discussed by researchers and named in a regulatory code): review training data and retrieval corpora for
    tampering, using provenance, anomaly checks and sampling or full scans, and recheck after data refreshes
    (EU-GPAICODE-2025; OWASP-LLM-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "No production data-tampering check with results was found; the research result is that 250 poisoned documents compromised models of 600M to 13B parameters"
      provenance: independent
      source_ref: ARXIV-2510.07192
  prerequisites:
    - "Provenance and versioning for datasets and corpora"
    - "Ability to retrain or revert after a finding"
  risks_and_guardrails:
    - "OWASP notes poisoning can require data revalidation, retraining or pipeline redesign, which is expensive and disruptive (OWASP-LLM-2026, LLM05, p.33)."
    - "The EU code lists checking training data for indications of tampering among objectives for reducing sabotage of model training (EU-GPAICODE-2025, Appendix 4.4, p.42)."
  human_checkpoints:
    - "Data owners approve datasets for training; security reviews flagged records"
  role_evolution: >-
    Data engineers and security share dataset integrity review; the EU code lists reviews of training data for poisoning
    among risk-identification methods (EU-GPAICODE-2025, Measure 3.1, p.12).
  evidence_grade: D
  sources:
    - {ref: ARXIV-2510.07192, title: "Poisoning Attacks on LLMs Require a Near-constant Number of Poison Samples", publisher: "arXiv preprint", type: academic, url: "https://arxiv.org/abs/2510.07192", date: "2025-10-08", access: full, locator: "Abstract"}
    - {ref: OWASP-LLM-2026, title: "OWASP Top 10 for LLM Applications 2026 (OWASP GenAI LLM Top 10 2026)", publisher: "OWASP GenAI Security Project", type: standard-setter, url: "https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/", date: "2026-08-03", access: full, locator: "LLM05 Data and Model Poisoning, pp.33-37"}
    - {ref: EU-GPAICODE-2025, title: "General-Purpose AI Code of Practice, Safety and Security chapter", publisher: "European Commission", type: regulator, url: "https://ec.europa.eu/newsroom/dae/redirection/document/118119", date: "2025-07-10", access: full, locator: "Measure 3.1 p.12; Appendix 4.4 p.42"}
    - {ref: NIST-AI1002-2025, title: "NIST AI 100-2 E2025, Adversarial Machine Learning: A Taxonomy and Terminology of Attacks and Mitigations", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/ai/100/2/e2025/final", date: "2025-03-24", access: full, locator: "Sections 2.3 and 3.2 on poisoning and supply chain"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: grade D. Source: threats-redteam-21. Discussed by researchers, OWASP, NIST and the EU code of practice; no named
    deployment or measured outcome was found. Kept because it is the module's only entry on data poisoning.

