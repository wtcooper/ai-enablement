    Merged from the drafting part of P08 and D17 (an idea on its own). Graded B on Synthesia as a named deployment
    without measurement. Policy-as-code drafting for access control is identity-access-11; consistency and gap checks
    are entry 09.

- id: security-governance-risk-09
  title: Gap analysis of security policies against a standard and against what the organisation actually does
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Security policies are often incomplete against standards and regulations and are only found wanting in a thorough
    audit; finding the gaps takes extensive manual effort and experienced reviewers are scarce (ARXIV-2607.22885).
    Policies also drift from what teams do and from what customer documents say (WHISTIC-CALASTONE-2025).
  solution: >-
    AI compares policies with programme data or customer-facing reports to surface inconsistencies for a person to fix
    (VANTA-COMPLIANCEAGENT-2026; WHISTIC-CALASTONE-2025). In a lab benchmark, retrieval-augmented small open-weight
    models run on CPU judged each ISO/IEC 27002:2022 control as met or not met by the policy text and wrote a
    justification, positioned as an assistant to the auditor or policy owner (ARXIV-2607.22885). A proof of concept
    maps log evidence from one simulated incident to MITRE ATT&CK and tests policy adequacy (ARXIV-2601.03287).
  outcomes:
    - lever: quality
      description: Calastone's analyst reports using AI to spot mismatches between its policies and its SIG report
      figure: "none published"
      measures: "qualitative statement ('our own policies didn't always align perfectly to what our SIG report was telling us'); no count"
      provenance: vendor-published
      source_ref: WHISTIC-CALASTONE-2025
    - lever: quality
      description: Best model's mean agreement with the human expert verdict on conformity
      figure: "80.65%"
      measures: "mean agreement for Granite4.1:8B across retrieval configurations; 93 ISO/IEC 27002:2022 controls x 3 policy datasets; 8 open-weight models, 26,784 evaluations"
      provenance: independent
      source_ref: ARXIV-2607.22885
    - lever: quality
      description: Best model's chance-corrected agreement, and the weakest models
      figure: "balanced accuracy 75.0% (kappa 0.528); four of eight models 52.4-59.9%"
      measures: "balanced accuracy, Cohen's kappa against human expert consensus (Table 5); one dataset is 100% conformity, so plain accuracy is not the headline"
      provenance: independent
      source_ref: ARXIV-2607.22885
  prerequisites:
    - "Policy set in text form and the standard's control text as a checklist (ARXIV-2607.22885)"
    - "A human-labelled sample to calibrate the chosen model; the benchmark used expert consensus (ARXIV-2607.22885)"
    - "A policy repository connected to programme data (VANTA-COMPLIANCEAGENT-2026)"
  risks_and_guardrails:
    - "Models stated that policies mentioned items they did not and confused the requirement text with policy evidence (ARXIV-2607.22885)"
    - "Confidence scores tracked the verdict, not certainty (30 for non-conformity, 90 or 95 for conformity), so they cannot route items for review (ARXIV-2607.22885)"
    - "The benchmark tests policy documents only, not whether controls operate (ARXIV-2607.22885)"
    - "The post-incident proof of concept covers one simulated brute-force scenario and its authors stress continued human oversight (ARXIV-2601.03287)"
  human_checkpoints:
    - "Policy owners review flagged inconsistencies (VANTA-COMPLIANCEAGENT-2026)"
    - "The benchmark authors frame the tool as an assistant to the auditor or policy owner, not a replacement (ARXIV-2607.22885)"
  role_evolution: >-
    The ReCon authors expect one auditor could analyse several policy sets instead of one, with less review fatigue;
    this is their expectation, not a measured effect (ARXIV-2607.22885).
  evidence_grade: B
  sources:
    - { ref: WHISTIC-CALASTONE-2025, title: "How Calastone Transformed TPRM with Whistic", publisher: Whistic, type: vendor, url: "https://www.whistic.com/resources/case-studies/calastone-customer-story", date: "2025-12", access: full, locator: "'AI-Powered Insights'" }
    - { ref: VANTA-COMPLIANCEAGENT-2026, title: "Vanta Delivers: Compliance Agent", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-delivers-compliance-agent", date: "2026-06", access: full, locator: "'Policy-to-program consistency checks'" }
    - { ref: ARXIV-2607.22885, title: "ReCon: A Resource-Constrained Benchmark for LLM-Based Cybersecurity Compliance Across Ingestion and Retrieval Pipelines", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2607.22885", date: "2026-07-24", access: full, locator: "Abstract; Section 5.1 Table 5; qualitative analysis (pp. 14-17); Conclusion" }
    - { ref: ARXIV-2601.03287, title: "Automated Post-Incident Policy Gap Analysis via Threat-Informed Evidence Mapping using Large Language Models", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2601.03287", date: "2026-01-04", access: full, locator: "Abstract" }
    - { ref: NIST-CYBERAI-2025, title: "Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile), NIST IR 8596 initial preliminary draft", publisher: NIST, type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Section 2.1.2, 'Supporting automated policy enforcement and compliance assessments' (p. 10)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from G04, G05 (an idea) and the consistency-check part of P08. Graded B on Calastone as a named deployment
    without measurement; ReCon is an independent lab benchmark (arXiv preprint, three policy datasets), not a
    deployment. NIST's draft profile lists automated compliance assessment as an AI-enabled defence opportunity
    (NIST-CYBERAI-2025). Review of post-incident reports against standards is incident-response-16.

- id: security-governance-risk-10
  title: Mapping AI-related and security regulations into policy and controls, from a baseline of shared principles
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [research-synthesis, document-production]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    A Gartner analyst writes that the global AI regulatory landscape is fragmented and volatile, with the EU AI Act,
    China's laws and a patchwork of US state requirements, so security leaders face competing mandates while AI
    adoption stretches their resources (TECHTARGET-AIREG-2026). Teams must keep policy-to-regulation mappings current
    (GITLAB-JOB-GOV-2026).
  solution: >-
    Governance engineers use automation and AI-assisted workflows to monitor regulations, assess impact with Legal and
    update policy mappings (GITLAB-JOB-GOV-2026); Okta's posting names 'intelligent policy mapping' (OKTA-JOB-GRC-2026).
    Gartner advises grouping risks into harm to people and harm to property and building a baseline on shared
    principles (safety, transparency, accountability, privacy, security) instead of law-by-law compliance
    (TECHTARGET-AIREG-2026). A Ukrainian research proposal describes a retrieval-augmented advisor that builds target
    security profiles from national regulations and policies (ARXIV-2604.06274).
  outcomes:
    - lever: risk
      description: none published
      figure: "none published"
      measures: "no measured outcome; sources are postings, an opinion article and a research proposal"
      provenance: self-reported
      source_ref: GITLAB-JOB-GOV-2026
  prerequisites:
    - "A maintained mapping between policies and external standards (GITLAB-JOB-GOV-2026)"
    - "Working relationships with assurance, governance and legal groups to judge which mandates apply (TECHTARGET-AIREG-2026)"
  risks_and_guardrails:
    - "Gartner's analyst calls complying with each emerging regulation individually a resource-intensive trap (TECHTARGET-AIREG-2026)"
    - "EU AI Act dates moved: the AI Omnibus (in force 2026-07-27) moved Annex III high-risk duties to 2027-12-02 (EC-AIACT-2026)"
    - "US SEC cyber disclosure rules face a rescission request from trade associations (2026-04-10); no final SEC action was found (SIFMA-SEC-2026)"
    - "The Ukrainian proposal claims retrieval reduces human error but reports no measurement (ARXIV-2604.06274)"
  human_checkpoints:
    - "Legal partnership on compliance deadlines (GITLAB-JOB-GOV-2026)"
    - "Cross-functional review of which mandates apply (TECHTARGET-AIREG-2026)"
  role_evolution: >-
    GitLab's governance engineer turns emerging regulations, including AI regulation, into requirements for
    engineering, product and legal (GITLAB-JOB-GOV-2026). Gartner's analyst says controls aimed at harm to people fall
    within CISO purview (TECHTARGET-AIREG-2026).
  evidence_grade: C
  sources:
    - { ref: GITLAB-JOB-GOV-2026, title: "Staff Security Governance Engineer, Policies & Standards (job posting)", publisher: GitLab, type: job-posting, url: "https://job-boards.greenhouse.io/gitlab/jobs/8846277002", date: "2026-09-30", access: full, locator: "'Regulatory and framework alignment'; 'Automation and AI'" }
    - { ref: OKTA-JOB-GRC-2026, title: "Senior Director, GRC (job posting)", publisher: Okta, type: job-posting, url: "https://www.okta.com/company/careers/opportunity/8130437?gh_jid=8130437", date: "2026-08-17", access: full, locator: "'Drive AI-first Transformation': intelligent policy mapping" }
    - { ref: TECHTARGET-AIREG-2026, title: "How to prepare security controls for future AI regulations (opinion by Gartner VP analyst Bernard Woo)", publisher: TechTarget SearchSecurity, type: press, url: "https://www.techtarget.com/cybersecurity/opinion/How-to-prepare-security-controls-for-future-AI-regulations", date: "2026-06-02", access: full, locator: "Whole article" }
    - { ref: EC-AIACT-2026, title: "AI Act: regulatory framework for AI (status page)", publisher: European Commission, type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", date: "2026-08-03", access: full, locator: "Application timeline" }
    - { ref: SIFMA-SEC-2026, title: "Reforming Regulation S-K's Cybersecurity Disclosures (joint trades letter to the SEC)", publisher: "SIFMA, ABA, BPI, ICBA and IIB", type: professional-body, url: "https://www.sifma.org/advocacy/letters/reforming-regulation-s-ks-cybersecurity-disclosures-joint-trades", date: "2026-04-10", access: full, locator: "Opening and section I" }
    - { ref: ARXIV-2604.06274, title: "Towards the Development of an LLM-Based Methodology for Automated Security Profiling in Compliance with Ukrainian Cybersecurity Regulations", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2604.06274", date: "2026-04-07", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P12, D11 and the regulatory part of G03. Evidence of AI doing the mapping is intent in job postings
    only; the regulatory sources set context. Regulation itself is covered at archetype level in
    research/runs/wave4/security-x-guardrails-regulation.md.

- id: security-governance-risk-11
  title: Risk register upkeep, intake triage and first-draft risk analyses with AI
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [expert-judgment, research-synthesis, document-production]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Risk analysts spend time classifying incoming risks, keeping the register clean, linking risks to assets, controls
    and vendors, and drafting analyses for leadership (ANTHROPIC-JOB-RISKANALYST-2026).
  solution: >-
    AI classifies and triages incoming risks, drafts first-pass risk analyses, links each risk scenario to affected
    assets, relevant controls and vendors, and generates reports; analysts own calibration and review
    (ANTHROPIC-JOB-RISKENG-2026; ANTHROPIC-JOB-RISKANALYST-2026; VANTA-RISKAGENT-2026).
  outcomes:
    - lever: quality
      description: Independent comparison of five LLMs with 50 human experts scoring cybersecurity risk scenarios
      figure: "LLMs consistently lower"
      measures: "the five LLMs 'consistently underestimated cybersecurity risks compared to human experts' on 18 CIS-Controls-based scenarios; the abstract gives no numeric gap"
      provenance: independent
      source_ref: ARXIV-2605.05424
  prerequisites:
    - "Asset, control and vendor data in one place so risks can be mapped (VANTA-RISKAGENT-2026)"
    - "Calibration and quality review owned by named analysts (ANTHROPIC-JOB-RISKANALYST-2026)"
  risks_and_guardrails:
    - "Models underestimated risk compared with experts; the authors say LLMs should be complementary tools, not standalone assessors (ARXIV-2605.05424)"
    - "Vanta says programme owners 'review, adjust, and add additional context' to suggestions (VANTA-RISKAGENT-2026)"
  human_checkpoints:
    - "Analyst reviews AI outputs; Anthropic's analyst 'own[s] the calibration and quality review' (ANTHROPIC-JOB-RISKANALYST-2026)"
  role_evolution: >-
    Anthropic says it is rebuilding risk management 'to operate as an engineering function', and Plaid asks analysts to
    be 'AI power users' who automate risk-programme work (ANTHROPIC-JOB-RISKANALYST-2026; PLAID-JOB-RISK-2026).
  evidence_grade: B
  sources:
    - { ref: ANTHROPIC-JOB-RISKENG-2026, title: "Staff Security Engineer, Risk Engineering (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5250052008", date: "2026-06-08", access: full, locator: "'Risk platform and automation'" }
