- id: security-governance-risk-20
  title: Security operating model and roles redesigned around AI oversight, with role-based AI skills training
  archetype: security
  module: governance-risk
  function: people-hr
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: delegate
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Teams report skills, not headcount, as the binding constraint: SANS/GIAC slides put the split at 60% skills to 40%
    headcount (RSAC-WORKFORCE-2026), and ISC2 dropped its headcount-gap estimate in favour of skills measures
    (ISC2-WORKFORCE-2025). AI changes entry-level work and creates roles few organisations have filled, and only 20%
    provide comprehensive AI training for all staff (RSAC-WORKFORCE-2026).
  solution: >-
    Reassign work between people and agents: analysts supervise agents, new roles such as AI security engineer and AI
    governance analyst appear, workforce frameworks (NICE, ECSF) define requisitions (RSAC-WORKFORCE-2026), and staff
    get role-based training in AI tools, LLM SecOps (running and securing LLM systems) and AI regulation
    (ISC2-WORKFORCE-2025; ISACA-SOC-2026). CSA is drafting an 'AI-First Security Organization' model with team
    topologies and agent-manager roles (CSA-FRC-HUB-2026).
  outcomes:
    - lever: capacity
      description: Organisations reporting AI impact on entry-level roles, and new AI roles created
      figure: "SOC and security analysts 32%; 39% no reductions yet; new roles 34% AI/ML specialist, 32% AI security engineer, 30% AI governance analyst"
      measures: "share of surveyed organisations, multiple answers allowed (SANS/GIAC slides 7-8); sample size not on the slides"
      provenance: independent
      source_ref: RSAC-WORKFORCE-2026
    - lever: capacity
      description: Respondents naming AI as the most pressing skills need
      figure: "41%"
      measures: "share of 16,029 ISC2 2025 respondents, ahead of cloud security (36%)"
      provenance: independent
      source_ref: ISC2-WORKFORCE-2025
    - lever: capacity
      description: Cyber teams naming LLM SecOps as a skill gap
      figure: "45% (12 points up on 2025)"
      measures: "share of ISACA 2026 respondents (more than 1,800)"
      provenance: independent
      source_ref: ISACA-SOC-2026
  prerequisites:
    - "A skills inventory against NICE or ECSF; 56% use workforce frameworks to define requisitions (RSAC-WORKFORCE-2026)"
    - "Career paths so that entry-level work AI absorbs still leads to senior roles; only 24% have well-defined progressions (RSAC-WORKFORCE-2026)"
    - "Time for training during working hours; 28% of ISC2 respondents' organisations allow it (ISC2-WORKFORCE-2025)"
  risks_and_guardrails:
    - "Pipeline risk: if AI absorbs entry-level work, the supply of experienced staff may fall; ISC2 and SANS comment only qualitatively (ISC2-WORKFORCE-2025; RSAC-WORKFORCE-2026)"
    - "Accountability for AI is unsettled: 29% put AI governance with the CIO or CTO, 26% with a dedicated AI leader, 17% with the CISO (PWC-GDTI-2027)"
    - "Training offered is mostly basic and not security-specific (RSAC-WORKFORCE-2026, slide 6)"
  human_checkpoints:
    - "Senior cyber management is the primary hiring decision maker in 53% of organisations (RSAC-WORKFORCE-2026)"
  role_evolution: >-
    ISC2 respondents expect AI to create more specialised skills (73%) and more strategic roles (72%) rather than replace
    jobs (ISC2-WORKFORCE-2025). ISACA reports 35% of teams are increasing reliance on AI or automation to address
    technical skills gaps (ISACA-SOC-2026).
  evidence_grade: C
  sources:
    - { ref: RSAC-WORKFORCE-2026, title: "AI, Regulation, & the Battle for Talent: The Future of the Cyber Workforce (slides presenting the 2026 SANS/GIAC Workforce Report)", publisher: "RSA Conference / SANS-GIAC", type: conference, url: "https://www.rsaconference.com/library/presentation/usa/2026/ai%20regulation%20%20the%20battle%20for%20talent%20the%20future%20of%20the%20cyber%20workforce", date: "2026-03-23", access: full, locator: "Slides 6-8, 12, 14, 15, 17, 18" }
    - { ref: ISC2-WORKFORCE-2025, title: "2025 ISC2 Cybersecurity Workforce Study", publisher: ISC2, type: professional-body, url: "https://www.isc2.org/Insights/2025/12/2025-isc2-cybersecurity-workforce-study", date: "2025-12-04", access: full, locator: "Research Note; 'AI Is Creating Opportunities'; 'Key Skills for AI'; Conclusion" }
    - { ref: ISACA-SOC-2026, title: "Only 8 Percent of Organizations Conduct Regular AI-Specific Response Exercises (State of Cybersecurity 2026 press release)", publisher: ISACA, type: professional-body, url: "https://www.isaca.org/about-us/newsroom/press-releases/2026/only-8-percent-of-organizations-global-enterprises-conduct-regular-ai-specific-response-exercises", date: "2026-09-22", access: full, locator: "Sections on skills gaps" }
    - { ref: PWC-GDTI-2027, title: "2027 Global Digital Trust Insights: Moving targets", publisher: PwC, type: survey, url: "https://www.pwc.com/gx/en/issues/cybersecurity/global-digital-trust-insights.html", date: "2026-10-01", access: full, locator: "Key takeaways: 'Who's accountable for AI?'" }
    - { ref: CSA-FRC-HUB-2026, title: "Frontier Ready Cybersecurity initiative hub (lists 'Designing the AI-First Security Organization', in open peer review; retrieval date used)", publisher: "Cloud Security Alliance (CSAI Foundation)", type: standard-setter, url: "https://cloudsecurityalliance.org/csai-foundation/frontier-ready-cybersecurity", date: "2026-10-17", access: full, locator: "Research list (description only)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from G12 and G14. Survey evidence only, without published sample sizes for the SANS/GIAC slides. Ladder
    delegate follows G12's framing (work reassigned between people and agents). Archetype-level workforce data are in
    research/runs/wave4/security-x-workforce-talent.md; this entry keeps only what an advisor needs for the GRC
    conversation.

- id: security-governance-risk-21
  title: Deliberate apprenticeship for junior risk and assurance staff when AI absorbs entry-level work (idea)
  archetype: security
  module: governance-risk
  function: people-hr
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Juniors used to learn what 'normal' looks like by doing routine work that AI now automates. Venables argues that
    unless organisations act the pipeline fractures within a few years, and the shape shifts from a pyramid to a
    diamond (VENABLES-WORKFORCE-2026).
  solution: >-
    Idea: replace each lost on-ramp with a deliberate one. For risk and assurance, Venables proposes putting juniors on
    control-failure post-mortems (why a control documented as effective failed when needed) instead of evidence
    gathering, with AI as a coach, pod or master-and-apprentice structures, and hiring rubrics that test spotting errors
