- id: security-governance-risk-18
  title: The security function's own AI-use policy - approved tools, logged prompts and outputs, autonomy tiers and AI incident playbooks
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [document-production, review-assurance]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI is in security work faster than control over it. SANS reports 79% of SOCs use AI or ML tools but only 36% have
    built them into a defined workflow, and most analysts use AI individually without systematic validation
    (SANS-SOC-2026). Leaders want agents in security work but not in charge: 22% would let agents execute defensive
    actions fully without human approval (PWC-GDTI-2027).
  solution: >-
    The security function sets its own AI policy: approved tools and data classes, an owner and approval path for each
    use, logging of prompts, outputs and model versions, validation and human review, and supervision of agents
    (FINRA-OVERSIGHT-2026). Trail of Bits wrote an AI handbook listing approved and unapproved tools and rules for
    sensitive data, and bars at least one coding tool from client code except on blockchain engagements
    (TOB-AINATIVE-2026). Agent actions are tiered by consequence, agents get their own identities and limited access,
    and a control the agent cannot influence sits before consequential actions (CISA-AGENTIC-BULLETIN-2026;
    VENABLES-HFT-2026). A Centene FIRST session describes versioned, hash-verified records of each AI-assisted step
    with prompt traceability (FIRST-CON-2026).
  outcomes:
    - lever: risk
      description: Organisations that assess the security of AI tools before use
      figure: "64% (37% in 2025)"
      measures: "share of respondents with processes to assess AI tool security (WEF Global Cybersecurity Outlook 2026 survey)"
      provenance: independent
      source_ref: WEF-GCO-2026
    - lever: risk
      description: Organisations that regularly run AI-specific response exercises
      figure: "8%"
      measures: "'only eight percent of organizations indicate they conduct AI-specific response exercises regularly'; 64% have conducted none, as read by two research angles; the cross-cutting regulation file read 71% none from the same release"
      provenance: independent
      source_ref: ISACA-SOC-2026
    - lever: risk
      description: Respondents who would authorise AI agents to execute defensive actions without human approval
      figure: "22% (38% partial autonomy; 36% human-led with AI support)"
      measures: "survey of 3,934 business and tech leaders in 71 countries; the answer base for this question is not stated"
      provenance: independent
      source_ref: PWC-GDTI-2027
  prerequisites:
    - "Inventory of AI tools and agents in use, including vendor-embedded features (TECHTARGET-AIREG-2026)"
    - "Logging of prompts, outputs and tracked model versions (FINRA-OVERSIGHT-2026)"
    - "Agents issued their own identities with least privilege (CISA-AGENTIC-BULLETIN-2026)"
    - "A defined safety envelope for each agent action type (VENABLES-HFT-2026)"
  risks_and_guardrails:
    - "FINRA lists formal review and approval, testing of privacy, integrity, reliability and accuracy, and ongoing monitoring for GenAI; for agents it warns of acting without validation, exceeding scope and difficult auditability (FINRA-OVERSIGHT-2026)"
    - "Joint CISA, NSA and partner guidance recommends aligning agentic AI risk management with existing frameworks, no broad or unrestricted agent access, layered defence, strong identity management and continuous monitoring (CISA-AGENTIC-BULLETIN-2026; CCCS-AGENTIC-2026)"
    - "Researchers describe a single adversarial alert driving an unconstrained SOC LLM to a harmful recommendation, so alert and log content must be treated as untrusted input (ARXIV-2610.09906)"
    - "Venables argues a non-deterministic system such as an LLM judge cannot reliably monitor another for critical actions, and that approvers need a context bundle, since blind approval is like resetting a tripped breaker (VENABLES-HFT-2026)"
    - "The UK Cyber Governance Code of Practice says organisations implementing the AI Cyber Security Code should also follow the governance code (UK-CGCOP-2025)"
  human_checkpoints:
    - "Human approval for high-risk decisions, with a kill switch outside the agent's control (DARKREADING-ROGUE-2026)"
    - "Decision authority stays with the analyst in Centene's described pipeline (FIRST-CON-2026)"
  role_evolution: >-
    56% of ISACA respondents helped write their organisation's AI policy and 51% help develop, onboard or implement AI
    solutions (ISACA-SOC-2026). PwC finds 44% of CISOs name AI oversight skills as a top barrier to more agent autonomy
    (PWC-GDTI-2027). Venables and Dark Reading's sources put the limits outside the model, which GRC and risk staff are
    asked to specify and test (VENABLES-HFT-2026; DARKREADING-ROGUE-2026).
  evidence_grade: B
  sources:
    - { ref: TOB-AINATIVE-2026, title: "How we made Trail of Bits AI-native (so far)", publisher: Trail of Bits Blog, type: firm, url: "https://blog.trailofbits.com/2026/03/31/how-we-made-trail-of-bits-ai-native-so-far/", date: "2026-03-31", access: full, locator: "Whole post (AI handbook)" }
    - { ref: SANS-SOC-2026, title: "SANS 2026 SOC Report: A Decade of Evolution in Cyber Defense (landing page)", publisher: SANS Institute, type: professional-body, url: "https://www.sans.org/research/security-operations-report", date: "2026", access: full, locator: "Top takeaways and FAQ" }
    - { ref: PWC-GDTI-2027, title: "2027 Global Digital Trust Insights: Moving targets", publisher: PwC, type: survey, url: "https://www.pwc.com/gx/en/issues/cybersecurity/global-digital-trust-insights.html", date: "2026-10-01", access: full, locator: "'AI for security' section" }
    - { ref: WEF-GCO-2026, title: "Global Cybersecurity Outlook 2026 (with Accenture)", publisher: World Economic Forum, type: survey, url: "https://www.weforum.org/publications/global-cybersecurity-outlook-2026/", date: "2026-01-12", access: full, locator: "'AI is supercharging the cyber arms race'" }
