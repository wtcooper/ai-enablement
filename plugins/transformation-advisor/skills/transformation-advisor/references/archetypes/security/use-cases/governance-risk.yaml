# Use cases: security / governance-risk (security governance, risk and compliance (GRC): customer security
# assurance, third-party risk, control frameworks and evidence, audits, policy, risk registers and quantification,
# board and regulator reporting, the security team's own AI policy, and the security workforce and operating model).
# Merged from research/runs/wave4/security-governance-risk-practice.md (P), -discourse.md (D) and -governance.md (G),
# the landscape scan (landscape-security.md) and items routed to governance-risk from other wave 4 security files.
# See research/runs/wave4/governance-risk-synthesis-report.md.
# Every grade-A figure is vendor-published on the vendor's own site and quotes the customer. No override rate,
# error rate, parallel run, auditor-reliance study or regulator inspection finding exists for AI used in GRC work.
# Canonical source keys: TECHTARGET-BOARD-2026 (= TECHTARGET-GARTNERBOARD-2026), TECHTARGET-CISO-2026
# (= TECHTARGET-GARTNERCISO-2026), TECHTARGET-AIREG-2026 (= TECHTARGET-GARTNERREG-2026, TECHTARGET-GARTNER-REG-2026),
# RSAC-WORKFORCE-2026 (= SANS-WORKFORCE-RSAC-2026), CSA-MYTHOSREADY-2026 (= CSA-STORM-2026, the publication page of the
# same briefing). FAIR-CRMSURVEY-2026 (the report PDF) and FAIR-SOCRM-2026 (the Institute's blog summary of it) are kept
# as separate documents.
# Cross-references to other security modules (ids as published on 2026-10-17): ai-security-21 (AI inventory, including
# AI embedded in vendor services), ai-security-22 (proportionate AI governance), ai-security-24 (third-party AI
# assurance), ai-security-07/08/10/11/12 (runtime gates, containment, monitoring and logging of agents),
# operations-19/20/21 (constrained SOC agent actions, per-action authority, measuring the SOC's AI),
# incident-response-02 (AI-built tabletop exercises), incident-response-14/15 (incident summaries and regulator
# notifications), incident-response-16 (AI review of post-incident reports), incident-response-17 (preparing for
# AI-agent incidents), identity-access-11 (access-control policy as code), application-security (security team that
# builds its own AI skills and agents; that file was being renumbered when this one was written).

- id: security-governance-risk-01
  title: Inbound customer security questionnaires answered from an approved knowledge base, with uncertain answers sent to an analyst
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: grounded-knowledge-assistant
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Customer and prospect security reviews arrive as long spreadsheets or portal forms. Each answer is looked up by
    hand in policies, audit reports and past answers, so a small GRC team becomes a sales bottleneck. After GitHub
    launched Copilot, its customer assurance team faced more than 300 questionnaires in a short timeframe
    (VANTA-GITHUB-2026).
  solution: >-
    The questionnaire is read in any format, answers are drafted from the company's approved documents (audit
    reports, policies, product documentation), and only low-confidence or unmatched questions go to a person. Some
    tools attach a confidence score and sentence-level source citations to each answer (WHISTIC-CALASTONE-2025).
    GitHub also publishes data-use and retention practices in a trust centre so fewer questionnaires are sent
    (VANTA-GITHUB-2026).
  outcomes:
    - lever: speed
      description: GitHub reports automating most inbound questionnaires within six months, against its own 12-month goal
      figure: "93%"
      measures: "'93% of inbound questionnaires automated in 6 months' (goal was 12 months). The page gives no definition of 'automated', no count behind the percentage and no error rate."
      provenance: vendor-published
      source_ref: VANTA-GITHUB-2026
    - lever: speed
      description: Carta reports less time spent on customer security reviews
      figure: "83% decrease"
      measures: "'decrease in time spent on customer security reviews' (baseline and method not stated)"
      provenance: vendor-published
      source_ref: CONVEYOR-CARTA-2026
    - lever: quality
      description: Carta reports AI accuracy on questionnaires
      figure: "95%"
      measures: "'AI accuracy when answering customer security questionnaires' (how accuracy was judged is not stated). Separately, Carta's GRC analyst recalls a 77-question spreadsheet with 72 right answers, done in 20 minutes instead of days; that is a recollection, not a tracked metric."
      provenance: vendor-published
      source_ref: CONVEYOR-CARTA-2026
    - lever: capacity
      description: Carta reports fewer questionnaires reaching the team
      figure: "40% fewer"
      measures: "'fewer customer security questionnaires', attributed on the page to the trust centre and self-serve access, not only to AI"
      provenance: vendor-published
      source_ref: CONVEYOR-CARTA-2026
    - lever: capacity
      description: Vendor-run adoption survey of 50+ B2B teams
      figure: "88% / 46%"
      measures: "'88% of teams are using AI or plan to in next 12 months, but only 46% are advanced users'; '60% of teams are running customer security reviews with 2 or fewer FTEs'"
      provenance: vendor-published
      source_ref: CONVEYOR-BENCH-2026
  prerequisites:
    - "A maintained library of approved source documents; the Conveyor survey says 62% of teams are not using AI to maintain the knowledge base (CONVEYOR-BENCH-2026)"
    - "Carta's InfoSec team connected systems, cleaned up documentation and identified each product and report before the AI could answer accurately (CONVEYOR-CARTA-2026)"
    - "Integration with the CRM or sales workflow so reviewers see deal context (CONVEYOR-CARTA-2026)"
    - "A customer-assurance function that owns the answers; GitHub's Director of Customer Assurance is quoted (VANTA-GITHUB-2026)"
  risks_and_guardrails:
    - "Answers are statements to customers about security controls; Vanta's own evaluation work treats hallucinated detail in compliance answers as an audit risk (VANTA-QUALITYEVAL-2026)"
    - "Lovable's CISO says AI is not always hallucination-free and can 'imagine answers' (CLOUDSECPOD-LOVABLE-2026)"
    - "Confidence scores and sentence-level citations let a reviewer check an answer (WHISTIC-CALASTONE-2025)"
    - "CSA's AI Controls Matrix ships an AI-specific questionnaire (AI-CAIQ) that standardises what AI-related answers must cover (CSA-AICM-2026)"
    - "The only academic work found on questionnaire automation reports 'improved accuracy' without figures in its abstract (ARXIV-2412.13988)"
  human_checkpoints:
    - "Questions the AI cannot answer or flags as uncertain go to an analyst (CONVEYOR-CARTA-2026)"
    - "GitHub describes its programme as 'human-reviewable'; the review procedure and sampling rate are not described (VANTA-GITHUB-2026)"
    - "Approved-content owners keep the knowledge base current (CONVEYOR-CARTA-2026)"
  role_evolution: >-
    Carta's CISO says the tool handles repetitive work so the team can focus on higher-value projects, and its GRC
    analyst says it helps the company grow without adding headcount (CONVEYOR-CARTA-2026). GitHub says its customer
    assurance team is freed for higher-value work (VANTA-GITHUB-2026).
  evidence_grade: A
  sources:
    - { ref: VANTA-GITHUB-2026, title: "GitHub accelerates sales by automating 93% of security questionnaires with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/github", date: "2026-03", access: full, locator: "TL;DR; 'The challenge'; 'The Vanta impact' ROI list (date is sitemap last-modified)" }
    - { ref: CONVEYOR-CARTA-2026, title: "Carta cuts security review time by 83% with Conveyor", publisher: Conveyor, type: vendor, url: "https://www.conveyor.com/customers/carta-2", date: "2026-06", access: full, locator: "Header stats; 'Results: 95% AI accuracy'; Callie Dedinsky quote (date is sitemap last-modified)" }
    - { ref: CONVEYOR-BENCH-2026, title: "2026 Customer Trust Benchmark Report (landing page)", publisher: Conveyor, type: survey, url: "https://www.conveyor.com/landing-page/2026-customer-trust-benchmark", date: "2026-09", access: full, locator: "Headline statistics" }
    - { ref: WHISTIC-CALASTONE-2025, title: "How Calastone Transformed TPRM with Whistic", publisher: Whistic, type: vendor, url: "https://www.whistic.com/resources/case-studies/calastone-customer-story", date: "2025-12", access: full, locator: "'AI-Driven Speed' and 'AI-Powered Insights'" }
    - { ref: VANTA-QUALITYEVAL-2026, title: "Vanta AI Quality Eval Maturity Model", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-ai-quality-evaluation-maturity-model", date: "2026-07", access: full, locator: "Opening section on hallucination risk" }
    - { ref: CLOUDSECPOD-LOVABLE-2026, title: "How AI Agents Will Negotiate Your Vendor Contracts", publisher: "Cloud Security Podcast", type: podcast, url: "https://www.cloudsecuritypodcast.tv/videos/how-ai-agents-will-negotiate-your-vendor-contracts", date: "2026-05-27", access: full, locator: "Transcript, roughly 00:07-00:16" }
    - { ref: CSA-AICM-2026, title: "AI Controls Matrix v1.1", publisher: Cloud Security Alliance, type: standard-setter, url: "https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1", date: "2026-06-22", access: full, locator: "'What's Included in this Download': AI-CAIQ" }
    - { ref: ARXIV-2412.13988, title: "RAG for Effective Supply Chain Security Questionnaire Automation (QuestSecure)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2412.13988", date: "2024-12-18", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P01, G01 and the questionnaire remark in D03. Grade A under the 2026-10-17 rule: GitHub's 93% and
    Carta's header figures are presented as tracked programme metrics for named customers, published by the vendor
    (labelled vendor-published); the Carta analyst's 72-of-77 anecdote is a recollection and would only support B.
    Change scope normalised to step (P said process, G said step): AI answers within the existing review step and
    people handle exceptions, as in the vocabulary's worked example. Vendor pages carry no publication date; sitemap
    last-modified months are used. Loopio's customer index lists RFP and due-diligence results that were not opened.

- id: security-governance-risk-02
  title: Self-serve trust centre with an AI agent that answers security questions before they reach the team
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [client-interaction]
  pattern: service-agent-escalation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Customers ask for the same audit reports and policy documents by email, NDA and ticket, and then ask follow-up
    questions the documents already answer. Sumo Logic's compliance lead describes the earlier manual request
    handling as a second full-time job (CONVEYOR-SUMO-2026).
  solution: >-
    A public or gated trust centre exposes audit reports, policies and FAQs with automated NDA and access rules, and
    an AI agent answers inbound security questions from that content. Questions it cannot answer fall back to the
    security team (VANTA-SYNTHESIA-2026).
  outcomes:
    - lever: capacity
      description: Synthesia reports customer questions resolved without staff
      figure: "20-30%"
      measures: "'20-30% of customer questions resolved through self-service or AI agent' (not split between the document portal and the agent); about 100 customers per month self-serve without submitting questions"
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: speed
      description: Synthesia reports shorter sales cycles after launching its trust centre
      figure: "2 weeks"
      measures: "'2-week average reduction in sales cycles' (attribution to the trust centre versus other changes not shown)"
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: capacity
      description: Perforce reports the share of inbound requests handled by its trust centre, alongside questionnaire automation
      figure: "more than half"
      measures: "'More than half of all inbound requests are handled by the Trust Center'; also '60% less time spent on questionnaires' and '10x increase in Trust Center interactions'. The page does not say how much of this is AI."
      provenance: vendor-published
      source_ref: VANTA-PERFORCE-2026
  prerequisites:
    - "A curated, current document set tagged by industry or regulation (VANTA-SNOWFLAKE-2026 shows the document-distribution part; Snowflake's trust centre is not described as AI-based)"
    - "CRM integration to check whether a requester is a customer or prospect and to handle NDAs (CONVEYOR-SUMO-2026)"
  risks_and_guardrails:
    - "Figures bundle non-AI self-service (a document portal) with AI answering, so the AI contribution cannot be separated (VANTA-SYNTHESIA-2026)"
  human_checkpoints:
    - "Unanswered questions and non-standard requests still reach the security team (VANTA-SYNTHESIA-2026)"
  role_evolution: >-
    Synthesia's two-person security team says it runs six frameworks and fields customer questions without adding
    headcount to match company growth (VANTA-SYNTHESIA-2026).
  evidence_grade: B
  sources:
    - { ref: VANTA-SYNTHESIA-2026, title: "How Synthesia became the first AI video company certified against ISO 42001", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/synthesia", date: "2026-10", access: full, locator: "'Vanta impact': Trust Center Pro and Vanta AI bullets (date is sitemap last-modified)" }
    - { ref: VANTA-PERFORCE-2026, title: "Perforce unifies enterprise compliance, security, and risk with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/perforce", date: "2026-03", access: full, locator: "ROI bullets under Trust Center Pro and Questionnaire Automation" }
    - { ref: VANTA-SNOWFLAKE-2026, title: "Snowflake's trust program speaks for itself", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/snowflake", date: "2026-03", access: full, locator: "Header stats and 'How Snowflake did it'" }
    - { ref: CONVEYOR-SUMO-2026, title: "Sumo Logic automates 100% of security requests with Conveyor Trust Center", publisher: Conveyor, type: vendor, url: "https://www.conveyor.com/customers/sumo-logic", date: "2026-07", access: full, locator: "Challenge and Results sections" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P02 and the trust-centre part of G01. Graded B: the measured results combine a document portal that
    does not need AI with the AI agent. Snowflake (2,000+ hours saved annually) and Sumo Logic (100% of document
    requests automated) are trust-centre results with no AI claim.

- id: security-governance-risk-03
  title: Agent-drafted third-party (vendor) security assessments, with an analyst deciding residual risk
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Each new vendor needs its SOC 2 report, pen test summary and questionnaire read against the buyer's standards.
    Volume grows faster than analysts, and reviews take weeks. A CISO and a vendor founder describe third-party risk
    management in large companies as 'a paper exercise' (CLOUDSECPOD-LOVABLE-2026). WEF reports 65% of large
    companies name third-party and supply chain vulnerabilities as their greatest challenge, up from 54% (WEF-GCO-2026).
  solution: >-
    An AI agent collects vendor documents, extracts exceptions and risk signals from SOC 2 reports, pen tests and
    questionnaires, drafts an evaluation against the buyer's criteria and prepares follow-up questions (DRATA-TPRMAI-2026).
    An analyst verifies the draft, decides inherent and residual risk and drives findings to closure
    (ANTHROPIC-JOB-SUPPLIER-2026). A third-party-risk vendor founder describes a setting that lets the customer choose
    between fully autonomous and in-the-loop operation, including whether the AI may go back and forth with the vendor
    on missing pen tests (CLOUDSECPOD-LOVABLE-2026).
  outcomes:
    - lever: speed
      description: Samsara reports faster vendor reviews using a TPRM agent that analyses SOC 2 reports, pen tests and questionnaires
      figure: "up to 50% faster"
      measures: "'Up to 50% faster vendor review time' across about 600 vendors and about 130 reviews per month (baseline and method not stated)"
      provenance: vendor-published
      source_ref: VANTA-SAMSARA-2026
    - lever: speed
      description: An unnamed global payments company reports parallel AI-driven assessments
      figure: "150 assessments in under 2 weeks"
      measures: "'150 assessments' launched in parallel and completed 'in under two weeks' with RiskAI, 'a process that once took several months'; '1,000+ hours saved with RiskAI'. The customer is anonymous."
      provenance: vendor-published
      source_ref: HYPERPROOF-FINCO-2025
    - lever: speed
      description: Calastone's analyst describes vendor document review time
      figure: "report in minutes"
      measures: "analyst's statement that automated review matches vendor documents to compliance standards and 'generates an entire report in minutes' (no baseline)"
      provenance: vendor-published
      source_ref: WHISTIC-CALASTONE-2025
  prerequisites:
    - "Written vendor risk criteria and tiering for the agent to evaluate against (DRATA-TPRMAI-2026)"
    - "Intake integration with procurement so new vendors are discovered; Samsara integrates bi-directionally with Zip (VANTA-SAMSARA-2026)"
    - "Prompt development, questionnaire design and calibration against assessor decisions as ongoing work (ANTHROPIC-JOB-SUPPLIER-2026)"
    - "An inventory of third-party services and the data each vendor holds, which FINRA lists as an effective practice (FINRA-OVERSIGHT-2026)"
  risks_and_guardrails:
    - "Agent output is a draft; Anthropic's posting has analysts 'verify agent-drafted evaluations' and route to domain specialists (ANTHROPIC-JOB-SUPPLIER-2026)"
    - "A Cloud Security Alliance research note says any AI-generated finding that triggers a consequential action needs a named human reviewer and a defined review path; the note says it was generated with AI assistance and not formally reviewed (CSA-AGENTS-2026)"
    - "Lovable's CISO describes a trust gap: sceptical users need a way to keep control, and agent-to-vendor negotiation makes them uncomfortable; high-trust industries need high assurance (CLOUDSECPOD-LOVABLE-2026)"
    - "FINRA expects due diligence on vendors' own use of generative AI and contract terms that bar sensitive firm or customer data from a vendor's open-source GenAI tool (FINRA-OVERSIGHT-2026)"
    - "Of 264 AI vendors studied, 36% had no vulnerability disclosure policy and 18% mentioned AI risks, so vendor-supplied evidence about AI risk may be thin (USENIX-PIAO-2026)"
  human_checkpoints:
    - "Analyst decides residual risk and approval (ANTHROPIC-JOB-SUPPLIER-2026)"
    - "Final decisions sit with humans in Drata's described flow (DRATA-TPRMAI-2026)"
    - "The customer chooses the autonomy setting in the Ethira founder's description (CLOUDSECPOD-LOVABLE-2026)"
  role_evolution: >-
    Anthropic describes supplier assurance analysts as reviewers of agent-prefilled outputs who also tune the
    Claude-powered assessment platform (ANTHROPIC-JOB-SUPPLIER-2026). Plaid's posting asks a third-party risk analyst
    to handle more reviews without adding headcount using AI-assisted workflows (PLAID-JOB-TPRM-2026). OpenAI's
    posting asks a vendor security programme manager to use Codex for scoping, evidence checks and routing
    (OPENAI-JOB-VENDOR-2026). The podcast guests expect agents to join the workforce as contracted resources managed
    much like third parties (CLOUDSECPOD-LOVABLE-2026).
  evidence_grade: B
  sources:
    - { ref: VANTA-SAMSARA-2026, title: "Samsara realized $150M+ in influenced revenue while scaling its GRC program with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/samsara", date: "2026-05", access: full, locator: "TPRM paragraph under 'Vanta impact'" }
    - { ref: HYPERPROOF-FINCO-2025, title: "How Hyperproof Helped a Global Financial Enterprise Revolutionize Third-Party Risk Management", publisher: Hyperproof, type: vendor, url: "https://hyperproof.io/case-studies/how-hyperproof-helped-a-global-financial-enterprise-revolutionize-third-party-risk-management/", date: "2025-11-08", access: full, locator: "Stat tiles; 'Scalability for enterprise'" }
    - { ref: WHISTIC-CALASTONE-2025, title: "How Calastone Transformed TPRM with Whistic", publisher: Whistic, type: vendor, url: "https://www.whistic.com/resources/case-studies/calastone-customer-story", date: "2025-12", access: full, locator: "'Streamlined Vendor Assessments'" }
    - { ref: DRATA-TPRMAI-2026, title: "Accelerate Third-Party Reviews with AI (product page, undated; retrieval date used)", publisher: Drata, type: vendor, url: "https://drata.com/product/vendor-risk-management/ai-agent", date: "2026-10-17", access: full, locator: "Intro; 'Maintain Oversight'" }
    - { ref: ANTHROPIC-JOB-SUPPLIER-2026, title: "Supplier Security & Assurance, Security GRC (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5427893008", date: "2026-09-17", access: full, locator: "About the role; Key responsibilities" }
    - { ref: PLAID-JOB-TPRM-2026, title: "Security Analyst, Third-Party Ecosystem Risk Management (job posting)", publisher: Plaid, type: job-posting, url: "https://jobs.ashbyhq.com/plaid/94752cfc-4a62-48c9-bcc0-e5f7f1905be6", date: "2026-08-12", access: full, locator: "'Scale Through AI and Tooling'" }
    - { ref: OPENAI-JOB-VENDOR-2026, title: "Vendor Security Technical Program Manager (job posting)", publisher: OpenAI, type: job-posting, url: "https://jobs.ashbyhq.com/openai/3ae71c21-60dd-42b2-a913-58df05988976", date: "2026-10-02", access: full, locator: "Qualifications" }
    - { ref: CSA-AGENTS-2026, title: "The Agents You Didn't Choose: Embedded AI and Liability", publisher: "Cloud Security Alliance (CSAI Foundation)", type: standard-setter, url: "https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/10/CSA_research_note_embedded_third_party_agents_systemic_risk_20261012-csa-styled.pdf", date: "2026-10-12", access: full, locator: "Key Takeaways" }
    - { ref: CLOUDSECPOD-LOVABLE-2026, title: "How AI Agents Will Negotiate Your Vendor Contracts", publisher: "Cloud Security Podcast", type: podcast, url: "https://www.cloudsecuritypodcast.tv/videos/how-ai-agents-will-negotiate-your-vendor-contracts", date: "2026-05-27", access: full, locator: "Transcript, roughly 00:07-00:16 and 00:25-00:36" }
    - { ref: FINRA-OVERSIGHT-2026, title: "2026 FINRA Annual Regulatory Oversight Report", publisher: FINRA, type: regulator, url: "https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report", date: "2025-12-09", access: full, locator: "Third-Party Risk Landscape: Effective Practices" }
    - { ref: WEF-GCO-2026, title: "Global Cybersecurity Outlook 2026 (with Accenture)", publisher: World Economic Forum, type: survey, url: "https://www.weforum.org/publications/global-cybersecurity-outlook-2026/", date: "2026-01-12", access: full, locator: "'Securing supply chains amid opacity and concentration risks'" }
    - { ref: USENIX-PIAO-2026, title: "'Abuse Risks are Often Inherent to Product Features': Exploring AI Vendors' Bug Bounty and Responsible Disclosure Policies", publisher: "USENIX / University of Edinburgh", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/piao", date: "2026-08", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P03, D03 and G09 (G09's supplier-evidence idea is the same change). Graded B, not A as in the practice
    file: Samsara's 'up to 50% faster' has no baseline or method and reads as a best case, the Hyperproof customer is
    anonymous, and Calastone's figure is an analyst's description. Ladder normalised to delegate (P and D said augment):
    the agent owns a multi-step outcome (collect, extract, evaluate, draft follow-ups) with an analyst checkpoint, as in
    the vocabulary's 'agent tests key controls end to end' example. Safe Security's 'TPRM AI Co-Worker' and Optro's
    Agentic TPRM (announced 2026-10-14) give no customer outcomes. Doctor On Demand's in-platform grading (Whistic) is
    rule-based, not AI. Due diligence on AI vendors themselves sits in ai-security-24.

- id: security-governance-risk-04
  title: Continuous vendor monitoring with trigger-based reassessment, including AI features and agents added after approval
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Vendor approvals are point-in-time. A new SOC 2 report, new subprocessor, data-classification change or vendor
    incident can change the risk without anyone reopening the review. A Gartner analyst writes that most leaders
    struggle to keep visibility into AI features that vendors embed (TECHTARGET-AIREG-2026), and a CSA note says vendors
    ship agents inside renewals and platform updates (CSA-AGENTS-2026).
  solution: >-
    The programme defines triggers (new SOC 2 report, new subprocessor, vendor incident, drift in SaaS configuration or
    use case); an agent watches for them, reopens the assessment, prepares the delta and queues a reassessment for an
    analyst (ANTHROPIC-JOB-SUPPLIER-2026; SAFE-TPRM-2026). A third-party-risk vendor founder describes tracking when AI is
    added to a vendor and tying shadow AI back to approved vendors, and Lovable's CISO suggests treating internal
    builders as 'mini vendors' under similar rules (CLOUDSECPOD-LOVABLE-2026). Idea: extend the inventory to
    vendor-embedded agents, their credentials and logs (CSA-AGENTS-2026).
  outcomes:
    - lever: risk
      description: none published
      figure: "none published"
      measures: "no figures in any source; Anthropic's posting describes the practice, Vanta and Safe describe product features, the podcast and CSA note describe ideas"
      provenance: self-reported
      source_ref: ANTHROPIC-JOB-SUPPLIER-2026
  prerequisites:
    - "Inventory of vendors with data classification and use-case context (ANTHROPIC-JOB-SUPPLIER-2026)"
    - "Feeds for vendor documents, breaches and legal events (SAFE-TPRM-2026)"
    - "An up-to-date inventory that shows when it changes, integrated with existing systems such as the SIEM (CLOUDSECPOD-LOVABLE-2026)"
    - "Internal partners from assurance, governance and legal to judge which obligations apply (TECHTARGET-AIREG-2026)"
  risks_and_guardrails:
    - "No source read discusses false triggers or alert fatigue; no quality data found"
