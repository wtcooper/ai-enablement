- id: security-governance-risk-14
  title: Board and executive risk reporting drafted from programme data and re-based for AI-accelerated exploitation
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [data-reporting, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Gartner analysts say many board reports are structured around cybersecurity, not around the business, and a CISO
    may get five to ten minutes with the board (TECHTARGET-BOARD-2026). The CSA 'Mythos-ready' briefing says pre-AI
    assumptions about patch windows, exploit scarcity and incident frequency may no longer hold, which could underfund
    controls and make business reporting inaccurate (CSA-MYTHOSREADY-2026).
  solution: >-
    Programme data (risk register, control status, vendor posture, quantified exposure) feeds a structured board pack
    that AI drafts and the CISO edits; Perforce plans to use its GRC platform for regular risk reviews and board-level
    reporting (VANTA-PERFORCE-2026). NIST's draft profile lists risk communication and executive decision support as
    a defensive use of AI (NIST-CYBERAI-2025). Gartner suggests a financial-statement format: balance sheet of
    programme state, income statement of expected losses, cash flow of resources, and a narrative with requests
    (TECHTARGET-BOARD-2026). The CSA briefing asks CISOs to update risk models and reporting and gives board talking
    points (CSA-MYTHOSREADY-2026).
  outcomes:
    - lever: speed
      description: none published
      figure: "none published"
      measures: "Perforce 'plans to use Vanta for regular risk reviews and board-level reporting'; no result yet"
      provenance: vendor-published
      source_ref: VANTA-PERFORCE-2026
    - lever: experience
      description: Boardroom use of cyber risk data (context)
      figure: "63% in 2026"
      measures: "boardroom use of cyber risk data per the report summary (400 respondents, April 2026); fewer than half in 2025"
      provenance: independent
      source_ref: FAIR-CRMSURVEY-2026
  prerequisites:
    - "A stable minimum set of indicators per report section, consistent over time, and the framework circulated among leaders before use (TECHTARGET-BOARD-2026)"
  risks_and_guardrails:
    - "NIST says AI-generated reports should be reviewed by a human before they change organisational risk management (NIST-CYBERAI-2025)"
    - "The CSA briefing says boards will face questions on whether available AI tools were used for defensive scanning and whether not doing so is negligence (CSA-MYTHOSREADY-2026)"
    - "A survey cited by Gartner found 71% of board members willing to accept more cyber risk to reach business goals (TECHTARGET-CISO-2026)"
  human_checkpoints:
    - "The CISO owns the narrative section and the requests to the board (TECHTARGET-BOARD-2026)"
  role_evolution: >-
    Gartner predicts business acumen will be the main differentiator of high-performing CISOs by 2028, and says the new
    mandate is to minimise harm to the business before, during and after an attack rather than maximise prevention
    (TECHTARGET-CISO-2026).
  evidence_grade: C
  sources:
    - { ref: VANTA-PERFORCE-2026, title: "Perforce unifies enterprise compliance, security, and risk with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/perforce", date: "2026-03", access: full, locator: "ROI bullet 'Vendor and Enterprise Risk Management'" }
    - { ref: TECHTARGET-BOARD-2026, title: "Lost in translation: Cybersecurity board reporting for CISOs (Gartner Security & Risk Management Summit session)", publisher: TechTarget SearchSecurity, type: press, url: "https://www.techtarget.com/cybersecurity/news/366643884/Lost-in-translation-Cybersecurity-board-reporting-for-CISOs", date: "2026-06-03", access: full, locator: "'Know your audience'; 'Use financial reports as templates'" }
    - { ref: TECHTARGET-CISO-2026, title: "CISO role changes as cyber-risk appetites in the C-suite grow (Gartner Security & Risk Management Summit session)", publisher: TechTarget SearchSecurity, type: press, url: "https://www.techtarget.com/cybersecurity/news/366644003/CISO-role-changes-as-cyber-risk-appetites-in-the-C-suite-grow", date: "2026-06-08", access: full, locator: "'The security drag'; 'A new mandate for CISOs'" }
    - { ref: CSA-MYTHOSREADY-2026, title: "The 'AI Vulnerability Storm': Building a 'Mythos-ready' Security Program (PDF v1.0)", publisher: "Cloud Security Alliance with SANS, [un]prompted and OWASP GenAI Security Project", type: standard-setter, url: "https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/05/mythosreadyv1.0.pdf", date: "2026-04-12", access: full, locator: "Action 6 'Update Risk Models and Reporting' p. 20; Section V p. 22; risk register items 11-12 pp. 17-18" }
    - { ref: NIST-CYBERAI-2025, title: "Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile), NIST IR 8596 initial preliminary draft", publisher: NIST, type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Section 2.1.2 'Risk communication and executive decision support' (p. 11); GV.OV-03 row (p. 28)" }
    - { ref: FAIR-CRMSURVEY-2026, title: "2026 State of Cyber Risk Management Report", publisher: FAIR Institute, type: survey, url: "https://www.fairinstitute.org/hubfs/State%20of%20Cyber%20Risk%20Management%20Report%202026.pdf", date: "2026", access: full, locator: "Executive Summary item 4" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P11, D12 and G07. The weakest entry on AI use: no named deployment of AI-drafted board packs with
    results. The Gartner format is not AI-based. Safe Security and Kovrr board-reporting features were not read.

- id: security-governance-risk-15
  title: Audit response drafting and consolidation of several framework audits around one evidence set
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Each external audit asks subject experts for the same walkthroughs and evidence, and several audits run in parallel
    (VANTA-SAMSARA-2026). Analysts assemble evidence packs and compliance reports by hand (NIST-CYBERAI-2025).
  solution: >-
    AI drafts responses to auditor requests from existing evidence, and one evidence set is mapped to several
    frameworks so audits can be run together (ANTHROPIC-JOB-GRCPLATFORM-2026; VANTA-SYNTHESIA-2026). NIST's draft
    profile says AI can draft compliance reports, organise evidence and produce standardised documentation
    (NIST-CYBERAI-2025).
  outcomes:
    - lever: capacity
      description: Synthesia reports consolidating audit cycles
      figure: "five framework audit cycles in one month"
      measures: "'Five framework audit cycles condensed into a one-month window' (ISO 27001, ISO 27018, ISO 27701, ISO 42001, SOC 2, HITRUST); AI contribution not isolated; baseline not stated"
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: capacity
      description: Samsara reports less subject-matter-expert time per audit cycle
      figure: "70 to 40 hours"
      measures: "'SME interview time reduced from 70 to 40 hours per audit cycle' (follows control consolidation, entry 05, not AI drafting of responses)"
      provenance: vendor-published
      source_ref: VANTA-SAMSARA-2026
  prerequisites:
    - "A common control framework and mapped evidence (VANTA-SAMSARA-2026)"
    - "Structured evidence records and templates that match the auditor's or regulator's required fields (NIST-CYBERAI-2025)"
  risks_and_guardrails:
    - "No source read documents auditor reliance on AI-prepared evidence"
    - "NIST says AI-generated reports should be reviewed by a human before any change to organisational risk management (NIST-CYBERAI-2025)"
  human_checkpoints:
    - "Control owners and auditors review responses (ANTHROPIC-JOB-GRCPLATFORM-2026)"
    - "NIS2 makes top management accountable for non-compliance with risk-management measures, so a named executive owns what is filed (EC-NIS2)"
  role_evolution: >-
    Anthropic's GRC platform role has engineers design workflows in which Claude 'generat[es] audit responses'
    (ANTHROPIC-JOB-GRCPLATFORM-2026).
  evidence_grade: B
  sources:
    - { ref: VANTA-SYNTHESIA-2026, title: "How Synthesia became the first AI video company certified against ISO 42001", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/synthesia", date: "2026-10", access: full, locator: "Multi-framework compliance bullet" }
    - { ref: VANTA-SAMSARA-2026, title: "Samsara realized $150M+ in influenced revenue while scaling its GRC program with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/samsara", date: "2026-05", access: full, locator: "ROI list" }
    - { ref: ANTHROPIC-JOB-GRCPLATFORM-2026, title: "Staff+ Software Engineer, GRC Platform (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5250091008", date: "2026-06-08", access: full, locator: "Responsibilities" }
    - { ref: NIST-CYBERAI-2025, title: "Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile), NIST IR 8596 initial preliminary draft", publisher: NIST, type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "Section 2.1.2 'Conduct reporting' (p. 11); GV.OV-03 row (p. 28)" }
    - { ref: EC-NIS2, title: "NIS2 Directive: securing network and information systems (policy page)", publisher: European Commission, type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/nis2-directive", date: "2026-07-02", access: full, locator: "Paragraphs on risk-management measures and top-management accountability" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P15 and the audit-evidence part of G08 (an idea). Graded B: both figures are vendor-published, but
    neither isolates AI drafting. Overlaps entries 05 and 06; kept separate because the change is in the auditor-facing
    step. Incident summaries and regulator notifications are incident-response-14 and -15. A-LIGN's compliance
    benchmark figures did not render.

- id: security-governance-risk-16
  title: Verifying automated compliance evidence and auditor independence before relying on attestations
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Compliance platforms promise speed. After a whistleblower alleged that the platform Delve generated fabricated SOC 2
    and ISO 27001 evidence and weakened independent audit testing (the company denies this and says independent
    auditors give the final opinions), practitioners worry that customers who relied on the certifications carry the
    liability and the burden of proof (IANS-DELVE-2026).
  solution: >-
    IANS faculty recommend that buyers re-read their own SOC 2 report as a security artifact, confirm in writing that the
    auditor designed and ran its own tests, ask the platform vendor what the auditor can access and when, spot-check 5
    to 10 controls at random for evidence that exists and is current, and add a vetting checklist (AICPA accreditation,
    US physical presence, business ties to the platform vendor, number of clients audited) to vendor management
    (IANS-DELVE-2026). A GRC-agent advocate frames it as 'pass/fail is a compliance outcome, confidence is a security
    outcome' (BLEEPING-ANECDOTES-2026).
  outcomes:
    - lever: risk
      description: none published
      figure: "none published"
      measures: "no source measures the effect of these checks; the whistleblower's figures are allegations"
      provenance: independent
      source_ref: IANS-DELVE-2026
  prerequisites:
    - "A list of where SOC 2 reports, trust pages and questionnaire answers were used with customers or regulators (IANS-DELVE-2026)"
    - "A named owner for compliance-platform and auditor vetting inside vendor management (IANS-DELVE-2026)"
  risks_and_guardrails:
    - "A SOC 2 Type II report attests that specified controls operated over a limited period; it is not a security guarantee (IANS-DELVE-2026)"
    - "If conclusions do not match how security works, or were written before testing finished, IANS faculty advise treating the control as unproven (IANS-DELVE-2026)"
    - "The Anecdotes author says trust, not effort, becomes the bottleneck once agents prepare evidence (BLEEPING-ANECDOTES-2026)"
  human_checkpoints:
    - "Written confirmation from the auditor that it designed its own tests (IANS-DELVE-2026)"
    - "Random spot-check of 5 to 10 controls against real evidence (IANS-DELVE-2026)"
  role_evolution: >-
    IANS says liability and regulatory exposure may sit with the companies that relied on the certifications, so the
    customer's GRC team becomes a verifier of its platform and auditor (IANS-DELVE-2026).
  evidence_grade: C
  sources:
    - { ref: IANS-DELVE-2026, title: "Delve Allegations Expose Weak Points in Modern Compliance", publisher: IANS Research, type: firm, url: "https://www.iansresearch.com/resources/all-blogs/post/security-blog/2026/03/30/delve-allegations-expose-weak-points-in-modern-compliance", date: "2026-03-24", access: full, locator: "Key Points; Big Picture; 'IANS Faculty Recommendations'" }
    - { ref: BLEEPING-ANECDOTES-2026, title: "Your First GRC Agent: A Red Teamer's Walkthrough (vendor-authored, Anecdotes)", publisher: BleepingComputer, type: press, url: "https://www.bleepingcomputer.com/news/security/your-first-grc-agent-a-red-teamers-walkthrough/", date: "2026-06-26", access: full, locator: "'Trust becomes the bottleneck'" }
    - { ref: CSA-STARAI-2026, title: "CSA STAR for AI (program page)", publisher: Cloud Security Alliance, type: standard-setter, url: "https://cloudsecurityalliance.org/star/ai/", date: "2026-10-17", access: full, locator: "'Levels of STAR for AI'" }
  last_reviewed: "2026-10-17"
  notes: >-
    From D02. Everything about Delve is an allegation reported by IANS; Delve denies it. The sources do not say AI
    generated the evidence; the case is used because it shapes discussion of automated attestation. Routed from the
    ai-security governance file: CSA's STAR for AI includes an automatically scored 'Valid-AI-ted' AI-CAIQ level, one
    form of automated validation of vendor self-assessments (CSA-STARAI-2026); see ai-security-24.

- id: security-governance-risk-17
  title: The security team as author and reviewer of enterprise AI policy and approval gates for AI tools and agents
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance, coordination-scheduling]
  pattern: intake-triage
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Staff and teams adopt AI tools and agents faster than policy; security teams must decide what data agents may touch
    and which actions need human approval (ANTHROPIC-JOB-AGENTSEC-2026). At Cengage, student data, author IP and
    proprietary curriculum were in play (BSIDESLV-2026). Venables says boards turn to the CISO for AI risks (safety,
    model validation, privacy, reliability) that do not fall into existing organisations (VENABLES-CISO2-2026).
  solution: >-
    The GRC function writes agent governance policies and standards, defines review and approval criteria (sensitive
    data, actions needing human approval, least privilege), sits as GRC reviewer in engineering approval workflows and
    monitors agent behaviour (ANTHROPIC-JOB-AGENTSEC-2026); Cloudflare's posting names deterministic 'action gates' and
    risk thresholds (CLOUDFLARE-JOB-GRC-2026). Cengage built a programme that assessed AI vendors, aimed to stop being
    'the Department of No' and red-teamed its own AI integrations (BSIDESLV-2026). Sendbird's CSO describes enterprise AI
    tools at several tiers, blocks on some models and unofficial browser add-ons, GRC review of contracts so vendors do
    not train on customer data, and a norm of asking security before enabling a new model (CLOUDSECPOD-SENDBIRD-2025).
  outcomes:
    - lever: capacity
      description: Cengage reports AI vendors assessed by its security and governance programme
      figure: "67 AI vendors in 15 months"
      measures: "count stated in the abstract of a BSides Las Vegas talk; the talk itself was not seen"
      provenance: self-reported
      source_ref: BSIDESLV-2026
    - lever: risk
      description: "Survey: security professionals involved in writing their organisation's AI policy"
      figure: "56%"
      measures: "'56 percent of respondents say that they or someone from their team were involved in the development of a policy governing the use of AI' (ISACA, more than 1,800 professionals); the cross-cutting regulation file read 60% from the same release"
      provenance: independent
      source_ref: ISACA-SOC-2026
    - lever: risk
      description: "Survey: organisations restricting employee GenAI use"
      figure: "78%"
      measures: "'78% of organizations block or limit employee use of GenAI' (Proofpoint 2026 Voice of the CISO, 1,600 CISOs)"
      provenance: vendor-published
      source_ref: PROOFPOINT-VOC-2026
    - lever: risk
      description: "Survey: organisations developing AI policy"
      figure: "93% developing; 72% still in development"
      measures: "slide text from the SANS/GIAC 2026 workforce survey; respondent count not stated"
      provenance: independent
      source_ref: RSAC-WORKFORCE-2026
  prerequisites:
    - "An inventory of which AI tools and agents are in use and what data they reach (PROOFPOINT-VOC-2026)"
    - "Deterministic action gates and predefined risk thresholds (CLOUDFLARE-JOB-GRC-2026)"
    - "Enterprise-tier tools provided up front so staff do not use free versions, and a written definition of what counts as an AI incident (CLOUDSECPOD-SENDBIRD-2025)"
  risks_and_guardrails:
    - "79% of CISOs say they are expected to manage AI risk without a proportional increase in resources (PROOFPOINT-VOC-2026)"
    - "AI-generated findings that drive consequential action need a named reviewer (CSA-AGENTS-2026)"
    - "Sendbird's CSO says he has no great answer yet for securing MCP servers and that blocking everything cannot be won (CLOUDSECPOD-SENDBIRD-2025)"
    - "Gartner's analyst advises a baseline posture on shared principles rather than one programme per AI law (TECHTARGET-AIREG-2026)"
    - "Gartner's Candrick warns that more security can mean slower speed to market and stalled AI adoption (TECHTARGET-CISO-2026)"
    - "The SANS/GIAC session recommends an AI governance programme within 3 months and baseline AI training for all staff within 6 (RSAC-WORKFORCE-2026)"
    - "A 2024 Splunk report found 34% lacked an acceptable-use policy for generative AI while 91% said security teams used public generative AI tools; older and vendor-run (SPLUNK-CISOPOLICY-2024)"
  human_checkpoints:
    - "Policy defines which agent actions need human approval (ANTHROPIC-JOB-AGENTSEC-2026)"
    - "The GRC team reviews vendor contracts and data-flow agreements (CLOUDSECPOD-SENDBIRD-2025)"
  role_evolution: >-
    ISACA reports 51% of respondents now help develop, onboard or implement AI solutions, up from 40% in 2025 and 29% in
    2024 (ISACA-SOC-2026). Anthropic's posting makes the GRC person 'the security policy partner for AI agent
    governance' (ANTHROPIC-JOB-AGENTSEC-2026). SANS/GIAC slides report 30% of organisations adding AI governance analyst
    roles (RSAC-WORKFORCE-2026). Venables describes an emerging 'Chief Digital Risk Officer' form of the CISO role; an
    opinion with no named organisation (VENABLES-CISO2-2026).
  evidence_grade: B
  sources:
