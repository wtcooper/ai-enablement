- id: security-governance-risk-19
  title: "GRC engineering operating model: engineers and analysts build compliance automation and agent workflows inside the GRC team"
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [software-systems, review-assurance]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Compliance headcount scales with frameworks, vendors and customer requests while expectations for continuous
    assurance rise (ANTHROPIC-JOB-GRCPLATFORM-2026). GRC still runs on spreadsheets: an independent practitioner survey
    found spreadsheets the most-cited primary GRC tool and uneven technical skills (GRCENGINEER-STATEOFGRC-2026).
  solution: >-
    GRC teams hire software and automation engineers, define controls as machine-readable code, build internal
    platforms with LLM components, and expect analysts to build their own AI skills and automations
    (ANTHROPIC-JOB-GRCPLATFORM-2026; FIGMA-JOB-COMPLIANCEENG-2026; PLAID-JOB-TPRM-2026). GRC staff learn to read system
    configurations (branch protection, infrastructure-as-code plans), collect evidence through APIs and build small
    automations, including with coding agents (GRCENGINEER-086-2026).
  outcomes:
    - lever: capacity
      description: none published
      figure: "none published"
      measures: "no measured result; postings describe design intent"
      provenance: self-reported
      source_ref: ANTHROPIC-JOB-GRCPLATFORM-2026
    - lever: capacity
      description: Baseline among survey respondents
      figure: "spreadsheets 93 respondents, ServiceNow 86; skill 5.4 of 10; 73.6% of CISOs use no commercial tool"
      measures: "counts of 795 GRC and security professionals naming each primary tool; average self-rated technical skill; share of CISO respondents with no commercial GRC tool, as stated in the post (self-selected readership)"
      provenance: independent
      source_ref: GRCENGINEER-STATEOFGRC-2026
  prerequisites:
    - "Engineers with GRC knowledge and a platform to build on (ANTHROPIC-JOB-GRCPLATFORM-2026; CLOUDFLARE-JOB-GRC-2026)"
    - "Machine-readable control definitions and APIs (FIGMA-JOB-COMPLIANCEENG-2026)"
    - "API access to production systems, which often means negotiating with an infrastructure team (GRCENGINEER-086-2026)"
  risks_and_guardrails:
    - "Anthropic's posting asks for LLM components 'reliable enough for high-stakes use' with evaluation of outputs (ANTHROPIC-JOB-GRCPLATFORM-2026)"
    - "Vanta says most of its own AI teams started 'deep in red and yellow' on its evaluation maturity model (VANTA-QUALITYEVAL-2026)"
    - "The GRC Engineer survey author says the design could be tighter and the sample is self-selected (GRCENGINEER-STATEOFGRC-2026)"
  human_checkpoints:
    - "Human-in-the-loop design stated in Anthropic's postings (ANTHROPIC-JOB-CONTROLS-2026)"
    - "The GRC practitioner decides whether a configuration is in fact their control (GRCENGINEER-086-2026)"
  role_evolution: >-
    Seven employers' postings (Anthropic, OpenAI, Plaid, Cloudflare, Okta, GitLab, Figma) ask for builder profiles in
    GRC; Plaid expects analysts to share AI automations with the team (PLAID-JOB-TPRM-2026; PLAID-JOB-RISK-2026). A GRC
    newsletter says most day-to-day GRC engineering is sysadmin-like reading of systems, learnable in months
    (GRCENGINEER-086-2026). Vanta cites an Axipro count of 3,004 AI builder to 446 AI governance postings in eight EU
    countries, about 7 to 1, across all functions (VANTA-AIGOVGAP-2026).
  evidence_grade: B
  sources:
