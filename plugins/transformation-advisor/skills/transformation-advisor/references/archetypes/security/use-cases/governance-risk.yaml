- id: security-governance-risk-05
  title: Mapping and rationalising controls and evidence across frameworks with an agent
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Organisations holding many frameworks (SOC 2, ISO 27001, ISO 42001, HITRUST, FedRAMP) keep duplicate controls and
    map evidence by hand, and every audit repeats interviews with the same subject experts. Synthesia's case study puts
    matching 500+ HITRUST controls at 1.5 months of manual work (VANTA-SYNTHESIA-2026).
  solution: >-
    An agent proposes a common control framework, maps controls and evidence items to each framework's requirements,
    and matches control sets to a new framework's controls; a GRC owner approves the mapping (VANTA-SAMSARA-2026;
    ANTHROPIC-JOB-CONTROLS-2026). Synthesia used its compliance platform's MCP server integration for HITRUST control
    matching (VANTA-SYNTHESIA-2026). NIST's draft Cyber AI Profile lists identifying and mapping similar concepts
    between documents as a defensive use of AI (NIST-CYBERAI-2025).
  outcomes:
    - lever: quality
      description: Samsara reports consolidating controls across 10 frameworks with the Compliance Agent
      figure: "820 to 260 controls (68% reduction)"
      measures: "'820 controls consolidated to 260 (68% reduction)'; '1,200 evidence items mapped across 10 frameworks'"
      provenance: vendor-published
      source_ref: VANTA-SAMSARA-2026
    - lever: speed
      description: Synthesia reports a compressed HITRUST implementation
      figure: "18 months to about 3 months"
      measures: "'Reduced an 18-month manual implementation timeline to approximately 3 months' (the whole implementation, not only matching; the 18 months and the 1.5 months for manual matching are counterfactual estimates)"
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: quality
      description: Vanta reports the precision of its AI control-to-evidence mapping on an offline evaluation set
      figure: "below 35% to 78% precision"
      measures: "precision of AI evidence suggestions on 'thousands of evidence suggestions across an extensive range of control descriptions'; baseline 'below 35%' with high recall, later 'precision to 78%'"
      provenance: vendor-published
      source_ref: VANTA-QUALITYEVAL-2026
  prerequisites:
    - "A common control framework as the base; Anthropic's controls posting describes owning one mapped to SOC 2, ISO 27001/42001, HIPAA, FedRAMP and customer commitments (ANTHROPIC-JOB-CONTROLS-2026)"
    - "Integrations that supply evidence from connected systems; Synthesia has 50-60 (VANTA-SYNTHESIA-2026)"
    - "An offline evaluation set curated by GRC experts to tune mapping quality (VANTA-QUALITYEVAL-2026)"
  risks_and_guardrails:
    - "Baseline mapping precision was below 35%, so most suggestions were wrong before tuning; no current error rate across customers is published (VANTA-QUALITYEVAL-2026)"
    - "NIST's draft profile says human oversight will be required to maintain regulatory and legal compliance even where AI supports compliance work (NIST-CYBERAI-2025)"
    - "Vanta says its risk agent acts with a human in the loop; the compliance agent page uses recommendations language (VANTA-RISKAGENT-2026; VANTA-COMPLIANCEAGENT-2026)"
  human_checkpoints:
    - "A GRC owner reviews and approves mappings; Anthropic's controls role decides 'where human judgment stays in the loop' (ANTHROPIC-JOB-CONTROLS-2026)"
  role_evolution: >-
    Anthropic's Controls Specialist posting makes drafting and mapping controls with Claude 'a normal part of the job'
    and expects the person to design continuous monitoring (ANTHROPIC-JOB-CONTROLS-2026).
  evidence_grade: A
  sources:
    - { ref: VANTA-SAMSARA-2026, title: "Samsara realized $150M+ in influenced revenue while scaling its GRC program with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/samsara", date: "2026-05", access: full, locator: "Header stats; 'Vanta's Agentic Trust Platform' ROI list" }
    - { ref: VANTA-SYNTHESIA-2026, title: "How Synthesia became the first AI video company certified against ISO 42001", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/synthesia", date: "2026-10", access: full, locator: "'MCP Server integration' bullet" }
    - { ref: VANTA-QUALITYEVAL-2026, title: "Vanta AI Quality Eval Maturity Model", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-ai-quality-evaluation-maturity-model", date: "2026-07", access: full, locator: "Example: AI-powered control-to-evidence mapping" }
    - { ref: VANTA-COMPLIANCEAGENT-2026, title: "Vanta Delivers: Compliance Agent", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-delivers-compliance-agent", date: "2026-06", access: full, locator: "Feature list" }
    - { ref: VANTA-RISKAGENT-2026, title: "Vanta Delivers: Agent for Risk", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-delivers-agent-for-risk", date: "2026-06", access: full, locator: "'Act with a human in the loop, always'" }
    - { ref: ANTHROPIC-JOB-CONTROLS-2026, title: "Controls Specialist, Security GRC (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5436826008", date: "2026-09-29", access: full, locator: "About the role; Key responsibilities" }
    - { ref: NIST-CYBERAI-2025, title: "Cybersecurity Framework Profile for Artificial Intelligence (Cyber AI Profile), NIST IR 8596 initial preliminary draft", publisher: NIST, type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8596/iprd", date: "2025-12-16", access: full, locator: "GV.OC-03 row, Defend column (p. 17)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P05 and G03. Grade A rests on Samsara's control and evidence counts, vendor-published for a named
    customer. Synthesia's timeline figures compare against estimates of manual effort, so they would support only B.
    Samsara's 'estimated $300,000+ in ROI in year one' is an estimate and is not used. ISO 42001 certification at
    Samsara and Synthesia (governing their own AI products) is routed to ai-security. Samsara's SME interview hours are
    in entry 15.

- id: security-governance-risk-06
  title: Agent-run evidence collection and continuous control monitoring in place of periodic audit preparation
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Control evidence is gathered by hand before each audit, so control failures are found late and staff spend a large
    share of their time on it. GRC teams chase screenshots and update spreadsheets, and 'are we compliant right now' is
    answered from a snapshot that may be stale (BLEEPING-ANECDOTES-2026).
  solution: >-
    Connectors pull evidence from source systems, and agents validate it against control descriptions, flag drift
    before an auditor does and push issues to control owners (VANTA-SYNTHESIA-2026; ANTHROPIC-JOB-CONTROLS-2026). In a
    vendor employee's worked example, an agent wakes on a schedule or stale evidence, queries the identity provider for
    the current MFA policy, compares it with the required baseline and opens a finding for the control owner
    (BLEEPING-ANECDOTES-2026). GRC engineers build the automated tests and agent workflows (CLOUDFLARE-JOB-GRC-2026).
  outcomes:
    - lever: capacity
      description: Synthesia reports the share of evidence collection automated
      figure: "60%"
      measures: "'60% of evidence collection automated across 50-60 connected systems'. The source does not separate AI from non-AI integrations."
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: capacity
      description: Perforce reports compliance work as a share of its team's time
      figure: "60% to 15%"
      measures: "'Manual compliance work dropped from 60% to 15% of the team's time' after consolidating onto a GRC platform; the page also cites '75% reduction in compliance labor'. Platform consolidation, not AI alone."
      provenance: vendor-published
      source_ref: VANTA-PERFORCE-2026
  prerequisites:
    - "A defined baseline for each control (BLEEPING-ANECDOTES-2026) and machine-readable control definitions; Figma's posting names JSON control definitions and APIs (FIGMA-JOB-COMPLIANCEENG-2026)"
    - "Access to the systems that hold the evidence so the agent works from live state (BLEEPING-ANECDOTES-2026)"
    - "Engineers inside the GRC team who can build integrations (CLOUDFLARE-JOB-GRC-2026; PLAID-JOB-GRC-2026)"
    - "A catalogue of key controls kept as code with version control and review, per Venables' control-reliability-engineering proposal (VENABLES-CRE-2026)"
  risks_and_guardrails:
    - "Anthropic's posting says the aim is to evidence controls 'continuously rather than through periodic audits' with 'the right humans in the loop'; monitoring work includes tuning out false positives, but no false-positive rate is published (ANTHROPIC-JOB-CONTROLS-2026)"
    - "The Anecdotes author says most of the work should stay deterministic, with controls, thresholds and policy decisions coming from humans, and warns of a 'verification tax' if manual work only moves to checking the agent (BLEEPING-ANECDOTES-2026)"
    - "A monitored control that reads zero may be broken; Venables proposes injecting harmless synthetic events to test it (VENABLES-CRE-2026)"
    - "No source read reports whether auditors rely on, sample or re-perform automated evidence, or how often it is wrong"
  human_checkpoints:
    - "Control owners receive findings and drive them to closure (ANTHROPIC-JOB-CONTROLS-2026; BLEEPING-ANECDOTES-2026)"
    - "Humans own thresholds and policy decisions (BLEEPING-ANECDOTES-2026)"
    - "External auditors still receive the evidence and issue the certifications (VANTA-SYNTHESIA-2026)"
  role_evolution: >-
    Postings at Anthropic, OpenAI, Okta, Plaid, Cloudflare and Figma ask for GRC engineers who build automations and
    agent workflows (ANTHROPIC-JOB-GRCPLATFORM-2026; OPENAI-JOB-AUDIT-2026; OKTA-JOB-GRC-2026; PLAID-JOB-GRC-2026;
    CLOUDFLARE-JOB-GRC-2026; FIGMA-JOB-COMPLIANCEENG-2026). The Anecdotes author says the analyst's job shifts from
    collecting to managing (BLEEPING-ANECDOTES-2026).
  evidence_grade: B
  sources:
    - { ref: VANTA-SYNTHESIA-2026, title: "How Synthesia became the first AI video company certified against ISO 42001", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/synthesia", date: "2026-10", access: full, locator: "'Vanta impact': Multi-framework compliance management and Vanta AI bullets" }
    - { ref: VANTA-PERFORCE-2026, title: "Perforce unifies enterprise compliance, security, and risk with Vanta", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/perforce", date: "2026-03", access: full, locator: "TL;DR; 'Vanta's Agentic Trust Platform' ROI" }
    - { ref: BLEEPING-ANECDOTES-2026, title: "Your First GRC Agent: A Red Teamer's Walkthrough (vendor-authored, Anecdotes)", publisher: BleepingComputer, type: press, url: "https://www.bleepingcomputer.com/news/security/your-first-grc-agent-a-red-teamers-walkthrough/", date: "2026-06-26", access: full, locator: "'What Agentic Actually Means Here'; 'Three Things That Actually Change'; 'What It Looks Like to Build One'" }
    - { ref: VENABLES-CRE-2026, title: "Control Reliability Engineering (CRE): Applying SRE Principles to Cybersecurity Controls", publisher: "Phil Venables (personal blog)", type: community, url: "https://www.philvenables.com/post/control-reliability-engineering-cre-applying-sre-principles-to-cybersecurity-controls", date: "2026-07-25", access: full, locator: "'The 10 Essential Elements'" }
    - { ref: ANTHROPIC-JOB-CONTROLS-2026, title: "Controls Specialist, Security GRC (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5436826008", date: "2026-09-29", access: full, locator: "About the role" }
    - { ref: ANTHROPIC-JOB-GRCPLATFORM-2026, title: "Staff+ Software Engineer, GRC Platform (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5250091008", date: "2026-06-08", access: full, locator: "Role summary and responsibilities" }
    - { ref: OKTA-JOB-GRC-2026, title: "Senior Director, GRC (job posting)", publisher: Okta, type: job-posting, url: "https://www.okta.com/company/careers/opportunity/8130437?gh_jid=8130437", date: "2026-08-17", access: full, locator: "'Drive AI-first Transformation'" }
    - { ref: PLAID-JOB-GRC-2026, title: "Security Engineer, GRC (job posting)", publisher: Plaid, type: job-posting, url: "https://jobs.ashbyhq.com/plaid/587e83dd-1d1b-4f31-812a-74fc67d67fbe", date: "2026-07-16", access: full, locator: "'Shift Compliance Left with Code and AI'" }
    - { ref: CLOUDFLARE-JOB-GRC-2026, title: "GRC Engineer (job posting)", publisher: Cloudflare, type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8045914?gh_jid=8045914", date: "2026-07-08", access: full, locator: "About the role" }
    - { ref: FIGMA-JOB-COMPLIANCEENG-2026, title: "Compliance Engineer (job posting)", publisher: Figma, type: job-posting, url: "https://boards.greenhouse.io/figma/jobs/6223155004?gh_jid=6223155004", date: "2026-10-16", access: full, locator: "Role summary and responsibilities" }
    - { ref: OPENAI-JOB-AUDIT-2026, title: "GRC Program Manager, Audit & Controls (job posting)", publisher: OpenAI, type: job-posting, url: "https://jobs.ashbyhq.com/openai/aeac2b78-1f4a-4dfe-b88f-25fc8adf5bb3", date: "2026-08-06", access: full, locator: "Role summary" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P06, G02 and D01. Graded B (G graded A on Synthesia's 60%): every figure measures platform automation
    in general, so the AI contribution is not isolated. Ladder normalised to automate (P said augment): connectors and
    agents run the normal path and exceptions go to control owners. Anthropic's wording is 'building toward'
    continuous, Claude-directed control testing; Anecdotes Agent Studio was in early access. Identity posture checks
    with recorded evidence are in identity-access-08.

- id: security-governance-risk-07
  title: Agents test controls end to end and assemble audit-ready workpapers for review
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: full-population-testing
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Control testing, such as user access reviews and reconciliations, is done by sampling and manual fieldwork, then
    written up as workpapers for internal and external auditors (OPTRO-AUTOTEST-2026).
  solution: >-
    Agents ingest unstructured evidence (PDFs, spreadsheets, video walkthroughs), run attribute tests on the full set of
    uploaded evidence, record each step and assemble Excel workpapers linked back to source evidence for human review
    (OPTRO-AUTOTEST-2026; OPTRO-CRX-2026).
  outcomes:
    - lever: capacity
      description: none published
      figure: "none published"
      measures: "vendor describes 'full population coverage' and 'reduce manual effort' without figures"
      provenance: vendor-published
      source_ref: OPTRO-CRX-2026
  prerequisites:
    - "Controls and evidence held in a system of record that agents can read (OPTRO-AUTOTEST-2026)"
  risks_and_guardrails:
    - "Optro says agent actions are logged, cited and reviewable (OPTRO-CRX-2026)"
    - "Anthropic's SOX role asks for 'grounded, specific views' on which assurance workflows AI can run today and which it cannot yet (ANTHROPIC-JOB-SOX-2026)"
  human_checkpoints:
    - "Auditors review workpapers and exceptions (OPTRO-AUTOTEST-2026)"
  role_evolution: >-
    Optro says auditors' work 'starts at the review' of documented workpapers (OPTRO-AUTOTEST-2026).
  evidence_grade: C
  sources:
    - { ref: OPTRO-CRX-2026, title: "GRC Intelligence takes the stage at CRX '26", publisher: "Optro (formerly AuditBoard)", type: vendor, url: "https://optro.ai/blog/grc-intelligence-takes-the-stage-crx-26", date: "2026-10-14", access: full, locator: "'Agentic capabilities extend across GRC'" }
    - { ref: OPTRO-AUTOTEST-2026, title: "Autonomous testing software (product page, undated; retrieval date used)", publisher: Optro, type: vendor, url: "https://auditboard.com/product/autonomous-testing", date: "2026-10-17", access: full, locator: "Feature list and FAQ on the Midship acquisition" }
    - { ref: ANTHROPIC-JOB-SOX-2026, title: "Lead, Security Controls Assurance - SOX (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5415864008", date: "2026-09-08", access: full, locator: "Qualifications" }
  last_reviewed: "2026-10-17"
  notes: >-
    From P07. Ladder normalised to delegate (P said automate), matching the vocabulary's worked example 'agent tests
    key controls end to end and drafts the workpaper'. Optro's material is about SOX and operational controls (user
    access reviews, bank reconciliations), adjacent to security-control testing. Announced, not measured.

- id: security-governance-risk-08
  title: Drafting and keeping security policies current with AI
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Policy sets must be written and updated for each new framework, and practitioners who ask a chatbot to 'help me
    write a security policy' get generic output (GRCENGINEER-AIUSAGE-2026).
  solution: >-
    AI drafts tailored policy documents and keeps a policy database current across frameworks (VANTA-SYNTHESIA-2026;
    VANTA-COMPLIANCEAGENT-2026). A GRC-engineering newsletter gives prompt templates that supply the audience, tech
    stack, certifications held and current state, as in a worked example of an access control policy for a 200-person
    fintech (GRCENGINEER-AIUSAGE-2026).
  outcomes:
    - lever: quality
      description: Synthesia reports its policy database is kept current across six frameworks with the vendor's AI
      figure: "none published"
      measures: "qualitative bullet ('Policy database kept current across all six frameworks'); no count or time"
      provenance: vendor-published
      source_ref: VANTA-SYNTHESIA-2026
    - lever: quality
      description: Independent test of LLM translation of natural-language access-control policies into executable policy code
      figure: "50.3% vs 15.3%"
      measures: "end-to-end correctness on 372 access-control statements (compile, lint, positive and negative tests) for a structured pipeline versus a single-prompt baseline; adjacent (access-control rules, not GRC policy text)"
      provenance: independent
      source_ref: ARXIV-2609.24036
  prerequisites:
    - "A policy repository connected to programme data (VANTA-COMPLIANCEAGENT-2026)"
    - "Organisational context supplied in the prompt (GRCENGINEER-AIUSAGE-2026)"
  risks_and_guardrails:
    - "A single-prompt LLM got 15.3% of policies right in the access-control study, so structured pipelines and tests are needed before enforcing generated policy code (ARXIV-2609.24036)"
    - "The newsletter issue does not discuss hallucination or drift; no quality data found for policy text"
  human_checkpoints:
    - "The policy owner reviews and approves drafts; the newsletter implies but does not state a review (GRCENGINEER-AIUSAGE-2026)"
  role_evolution: >-
    GitLab's governance posting asks for AI-assisted workflows for policy management, evidence collection and control
    monitoring (GITLAB-JOB-GOV-2026). The newsletter author says GRC professionals who master AI scaffolding will define
    the next decade (GRCENGINEER-AIUSAGE-2026).
  evidence_grade: B
  sources:
    - { ref: VANTA-SYNTHESIA-2026, title: "How Synthesia became the first AI video company certified against ISO 42001", publisher: Vanta, type: vendor, url: "https://www.vanta.com/customers/synthesia", date: "2026-10", access: full, locator: "'Vanta AI' bullet: 'Policy database kept current across all six frameworks'" }
    - { ref: VANTA-COMPLIANCEAGENT-2026, title: "Vanta Delivers: Compliance Agent", publisher: Vanta, type: vendor, url: "https://www.vanta.com/resources/vanta-delivers-compliance-agent", date: "2026-06", access: full, locator: "Feature list" }
