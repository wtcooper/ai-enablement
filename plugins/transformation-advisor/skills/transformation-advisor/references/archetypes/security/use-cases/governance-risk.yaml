- id: security-governance-risk-12
  title: "Cyber risk quantification with AI: scenario scoping, data gathering and LLM-assisted expert elicitation"
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Risk quantification needs frequency and loss estimates that take scarce expert time, and results go stale between
    reviews (ANTHROPIC-JOB-RISKENG-2026). Structured expert elicitation such as the Delphi method needs months of
    coordination (ARXIV-2602.08889). Boards ask for decision-ready, data-driven numbers (FAIR-CRMSURVEY-2026).
  solution: >-
    Analysts use AI to speed scenario scoping and data gathering, then apply calibrated estimation or Monte Carlo
    simulation where it changes a resource or treatment decision (ANTHROPIC-JOB-RISKENG-2026). Survey respondents say
    they use or test AI to quantify risk automatically, forecast and simulate scenarios, and read vendor contracts and
    SOC 2 reports to populate risk models (FAIR-CRMSURVEY-2026). Researchers replace or supplement the expert panel
    with LLM personas that estimate, iterate and share rationales, so estimates can be rerun when evidence changes
    (ARXIV-2602.08889).
  outcomes:
    - lever: quality
      description: LLM-panel estimates against ground truth on verifiable proxies (lab study)
      figure: "Pearson r = 0.91-0.98"
      measures: "correlation with ground truth across two domains (one is AI-augmented cybersecurity risk), three benchmarks and three reproduced expert studies, as stated in the abstract"
      provenance: independent
      source_ref: ARXIV-2602.08889
    - lever: capacity
      description: Organisations using or experimenting with AI in cyber risk management
      figure: "80% (37% using, 43% experimenting)"
      measures: "share of 400 respondents (cyber risk leaders at organisations with established programmes, 14 countries, fielded April 2026); 42% name automated risk quantification as an area of most value"
      provenance: independent
      source_ref: FAIR-CRMSURVEY-2026
    - lever: speed
      description: T-Mobile reports faster control assessment when NIST CSF was updated, using a vendor's integrations
      figure: "75% reduction in reporting time"
      measures: "'rapidly assess controls and prioritize remediation in just a week - a 75% reduction in reporting time'; the page does not say AI was responsible"
      provenance: vendor-published
      source_ref: SAFE-TMOBILE-2026
  prerequisites:
    - "A quantified risk programme whose outputs change real resource decisions (ANTHROPIC-JOB-RISKENG-2026)"
    - "A defined risk taxonomy; 58% of respondents use or plan to use FAIR (FAIR-SOCRM-2026)"
    - "Calibration against verifiable proxies before trusting estimates (ARXIV-2602.08889)"
  risks_and_guardrails:
    - "Five LLMs underestimated risk against 50 experts in an independent study, so calibration against expert judgment is needed (ARXIV-2605.05424)"
    - "Target quantities are unobservable by construction; the Scalable Delphi authors validate through accuracy and calibration on proxies and sensitivity to evidence (ARXIV-2602.08889)"
    - "The survey was recruited by panel and sponsored by GuidePoint Security and SAFE, and leans toward mature, tool-using programmes (FAIR-CRMSURVEY-2026)"
    - "Respondents cite regulatory uncertainty (37%), lack of mature AI-specific risk models (32%) and insider misuse or misconfiguration (30%) as concerns (FAIR-CRMSURVEY-2026)"
  human_checkpoints:
    - "Analysts own estimate calibration (ANTHROPIC-JOB-RISKENG-2026)"
    - "Board-approved risk appetite: 89% of respondents have board-approved thresholds (FAIR-CRMSURVEY-2026)"
  role_evolution: >-
    Anthropic's posting asks risk engineers to apply calibrated estimation and Monte Carlo simulation and to build the AI
    risk tooling (ANTHROPIC-JOB-RISKENG-2026). The Scalable Delphi authors frame the estimate as auditable, which would
    shift analysts toward curating evidence and challenging rationales; not measured (ARXIV-2602.08889).
  evidence_grade: C
  sources:
    - { ref: ANTHROPIC-JOB-RISKENG-2026, title: "Staff Security Engineer, Risk Engineering (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5250052008", date: "2026-06-08", access: full, locator: "'Risk assessment and quantification'" }
    - { ref: FAIR-CRMSURVEY-2026, title: "2026 State of Cyber Risk Management Report", publisher: "FAIR Institute (with Hanover Research; sponsored by GuidePoint Security and SAFE)", type: survey, url: "https://www.fairinstitute.org/hubfs/State%20of%20Cyber%20Risk%20Management%20Report%202026.pdf", date: "2026", access: full, locator: "Executive Summary; pp. 27-28; Methodology (p. 5)" }
    - { ref: FAIR-SOCRM-2026, title: "What 400 Cyber Risk Leaders Told Us About the Future of Cyber Risk Management", publisher: FAIR Institute, type: professional-body, url: "https://www.fairinstitute.org/blog/what-400-cyber-risk-leaders-told-us-about-the-future-of-cyber-risk-management", date: "2026-06-04", access: full, locator: "Findings 1, 3, 4 and 8" }
    - { ref: ARXIV-2602.08889, title: "Scalable Delphi: Large Language Models for Structured Risk Estimation", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2602.08889", date: "2026-02-09", access: full, locator: "Abstract" }
    - { ref: ARXIV-2605.05424, title: "Evaluating the Reliability of Multiple LLMs in Risk Assessment: A CIS Controls Based Approach", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2605.05424", date: "2026-05-06", access: full, locator: "Abstract" }
    - { ref: SAFE-TMOBILE-2026, title: "T-Mobile: Cutting the Cord on Subjective Risk Scores (customer story, undated; retrieval date used)", publisher: Safe Security, type: vendor, url: "https://safe.security/resources/customer-stories/t-mobile-cutting-the-cord-on-subjective-risk-scores/", date: "2026-10-17", access: full, locator: "'The Moment of Truth' paragraph" }
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from P10, D07 and G06. No source describes an LLM-built FAIR analysis at a named company with results. SAFE
    markets 'autonomous CRQ' (seen in search results only). Quantifying the risk of AI systems themselves (Kovrr) is
    routed to ai-security; adding AI scenarios to risk analyses is entry 13.

- id: security-governance-risk-13
  title: "Risk analyses extended to the organisation's own AI: agents as privileged insiders, model providers as third parties, coding agents and code-resident controls"
  archetype: security
  module: governance-risk
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Risk analysts must assess software agents that hold privileges, talk to customers and can bind the company, but the
    FAIR threat taxonomy defines AI agents only as malicious tools (FAIR-RISKREPORT-2026). Loss estimates assume
    software controls work as well as when last assessed, while coding agents raise change volume
    (FAIR-AGENTICCODING-2026). A poisoned base model would be nearly impossible for the buyer to find
    (FAIR-ATTACKSURFACE-2026). No single owner for AI risk has emerged: 29% place it with the CIO or CTO, 26% with a
    dedicated AI leader, 17% with the CISO (PWC-GDTI-2027).
  solution: >-
    The FAIR Institute's standards director proposes treating agents the company builds or buys as insiders: read the
    system card for the model version in use and treat published misbehaviour rates as dated priors, scope scenarios
    from what the agent can do, and assess its privileges as for a privileged user (FAIR-RISKREPORT-2026). He asks
    analysts to collect three numbers on agent activity (share reviewed, delay, how often review catches something)
    (FAIR-ATTACKSURFACE-2026), to treat model providers as third parties and ask about poisoning and backdoor controls
    (FAIR-ATTACKSURFACE-2026), and to put eight questions to engineering about agent-generated changes, required checks
    and when each code-resident control was last tested (FAIR-AGENTICCODING-2026). The FAIR Institute promotes extending
    quantification to AI scenarios (FAIR-NACD-2025), and Berkeley CLTC offers boards and investors a structured approach
    to AI risk (CLTC-AIRISK-2026).
  outcomes:
    - lever: risk
      description: none published
      figure: "none published"
      measures: "guidance articles and an investor framework; no assessment results"
      provenance: independent
      source_ref: FAIR-RISKREPORT-2026
  prerequisites:
    - "A list of what each agent can do: tools, systems and records reached, what it can spend or commit, data it can see (FAIR-RISKREPORT-2026)"
    - "System cards and risk reports for the exact model version in use (FAIR-RISKREPORT-2026)"
    - "Help from the CTO or equivalent to understand how software is built, tested and released (FAIR-AGENTICCODING-2026)"
  risks_and_guardrails:
    - "Published misbehaviour rates come from vendor tests, not the enterprise's environment, and models sometimes recognise evaluation (FAIR-RISKREPORT-2026)"
    - "If the same agent writes a feature and its tests, the check and the thing checked share an author; independent testing is advised (FAIR-AGENTICCODING-2026)"
    - "The code-quality studies the FAIR author cites are vendor studies with small agent-specific samples and establish nothing about a reader's codebase (FAIR-AGENTICCODING-2026)"
    - "CLTC's framework is an initial approach aimed at investors, not a validated measure (CLTC-AIRISK-2026)"
  human_checkpoints:
    - "Human approval for agent actions above a defined threshold (FAIR-RISKREPORT-2026)"
    - "Manual testing of business logic, authentication, session management and access control at higher assurance levels (FAIR-AGENTICCODING-2026)"
  role_evolution: >-
    Risk analysts add system-card reading and agent privilege review to scenario work; the author says analysts need the
    shape of the system, not engineers' vocabulary (FAIR-ATTACKSURFACE-2026), and recommends talking to the CTO because
    few risk professionals have software backgrounds (FAIR-AGENTICCODING-2026).
  evidence_grade: C
  sources:
