  last_reviewed: "2026-10-17"
  notes: "Merged from P19 (B), D14 (C) and G15 (C). Grade B because OpenAI's notifications are a named real practice; SAFE itself is a proposal. The 4-business-day, 30-day and 90-day timings are as reported by Axios; the 72-hour customer step is as reported by Techzine. The discourse researcher could not open Axios (search-only there); the practice researcher read it via a text mirror. The RFC date is 2026-08-04 per SiliconANGLE and 2026-08-05 in other reports. Change scope 'model' because it adds a cross-organisation reporting institution to the operating model."

- id: security-incident-response-25
  title: Incident responders become builders and operators of agentic automations for triage, forensics and response
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [software-systems, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "IR teams have to scale 24x7 response without matching headcount, and detection and response work is repetitive (postings from named in-house and managed-defence teams)."
  solution: "Postings treat AI and automation skills as part of the responder job. Databricks' Staff Security Engineer, Incident Response is asked to contribute to 'automations and agentic capabilities' and to show proficiency in AI/LLM and agentic capabilities, with building and operating agentic systems preferred. GitLab's security incident response roles ask for 'automation and AI-assisted workflows to improve triage, investigation speed, and response consistency'. Twilio's IR roles require ability to use AI for complex response work and list LLM-based alert interpretation and evidence triage as desired. Cloudflare's Managed Defense Center response engineers are expected to investigate telemetry autonomously, with experience using agentic AI or LLMs for workflow automation preferred."
  outcomes:
    - lever: capacity
      description: "none published"
      figure: "none published"
      measures: "Not applicable; job postings state duties, not results"
      provenance: self-reported
      source_ref: DATABRICKS-JOB-2026
  prerequisites:
    - "SIEM and SOAR, cloud logging and a data platform the team controls (DATABRICKS-JOB-2026)"
    - "Core DFIR skills: the postings still require IR, forensics and cloud security expertise (DATABRICKS-JOB-2026; GITLAB-JOB-2026; TWILIO-JOB-2026)"
  risks_and_guardrails:
    - "Twilio's posting lists AI model security and posture management (prompt injection, evasion, poisoning) as a desired skill (TWILIO-JOB-2026)"
    - "Home-built AI tooling often does not last: in a vendor-sponsored survey 46% of self-built AI tools were abandoned, never reached production or were replaced (HELPNET-GARTNER-2026)"
  human_checkpoints:
    - "Responders keep ownership of incidents end to end (GITLAB-JOB-2026)"
  role_evolution: "Senior responders are expected both to lead incidents and to build the AI tooling that scales the team; AI proficiency appears as a requirement, not a perk (DATABRICKS-JOB-2026; GITLAB-JOB-2026; TWILIO-JOB-2026). ISC2 says roles such as incident responder are evolving and that AI is the most pressing skills need, at 41% (ISC2-WORKFORCE-2025)."
  evidence_grade: B
  sources:
    - { ref: DATABRICKS-JOB-2026, title: "Staff Security Engineer, Incident Response", publisher: "Databricks", type: job-posting, url: "https://databricks.com/company/careers/open-positions/job?gh_jid=8841960002", date: "2026-10-08", access: full, locator: "Team description, 'The impact you will have', 'What we look for'" }
    - { ref: GITLAB-JOB-2026, title: "Senior Security Engineer, Incident Response Team (Australia)", publisher: "GitLab", type: job-posting, url: "https://job-boards.greenhouse.io/gitlab/jobs/8815229002", date: "2026-09-17", access: full, locator: "'An overview of this role' and 'What you'll do'" }
    - { ref: TWILIO-JOB-2026, title: "Senior Security Engineer, Incident Response", publisher: "Twilio", type: job-posting, url: "https://job-boards.greenhouse.io/twilio/jobs/8065040", date: "2026-07-17", access: full, locator: "'Required' and 'Desired' qualifications" }
    - { ref: CLOUDFLARE-JOB-2026, title: "Response Engineer - Cloudflare Managed Defense Center (CMDC)", publisher: "Cloudflare", type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8222732?gh_jid=8222732", date: "2026-09-24", access: full, locator: "Role description and preferred qualifications" }
    - { ref: ISC2-WORKFORCE-2025, title: "2025 ISC2 Cybersecurity Workforce Study", publisher: "ISC2", type: professional-body, url: "https://www.isc2.org/Insights/2025/12/2025-isc2-cybersecurity-workforce-study", date: "2025-12-04", access: full, locator: "Executive summary" }
    - { ref: HELPNET-GARTNER-2026, title: "Gartner: 70% of SOCs will pilot AI agents. Only 15% will see results (sponsored by Prophet Security)", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/09/09/prophet-security-evaluating-ai-soc-agents/", date: "2026-09-09", access: full, locator: "Survey paragraphs on self-built tools" }
  last_reviewed: "2026-10-17"
  notes: "From P14. Job postings show intent and hiring requirements, not what the tools do or achieved; graded B as named real organisations. Dates are Greenhouse first-published dates. Anthropic, Datadog and Stripe IR postings scanned by the practice researcher had no AI-specific duties. Change scope 'model' because it changes who does the automation work (responders as builders)."
