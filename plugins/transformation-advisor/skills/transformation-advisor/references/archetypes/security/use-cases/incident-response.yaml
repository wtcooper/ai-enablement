  last_reviewed: "2026-10-17"
  notes: "Merged from G16 (C) and the containment-playbook part of D17 (C). Maturity emerging: automated containment is long established in EDR and SOAR, but no named organisation describes AI-driven containment under these guardrails. The Unit 42 attacker claims are the threat actor's own statements in negotiations, as reported by Unit 42. Input files give three dates for the Swimlane page (2026-05-18, 2026-05-20, 2026-08-17), so the year only is used."

- id: security-incident-response-15
  title: "Idea: an LLM agent plans response and recovery, with every action validated in a digital twin or a closed command set first"
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [expert-judgment, software-systems]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: "Network incident response is slow and labour-intensive. LLM agents can reason over context but may hallucinate attacks and responses, prompting frontier models is costly, and an adversarial alert can become a route to an unsafe command."
  solution: "Research prototypes: (a) a hierarchical agent infers attack progression with a fine-tuned LLM, validates it against an emulated network digital twin, plans recovery and checks the resulting commands in the twin; (b) a fine-tuned lightweight model with retrieval and lookahead planning proposes response plans with a bounded hallucination probability; (c) a SIEM/XDR design confines the LLM's output to a closed vocabulary of templated commands behind an argument validator and a guardrails proxy, run human-in-the-loop or delayed."
  outcomes:
    - lever: quality
      description: "Recovery success versus frontier-LLM baselines on a testbed"
      figure: "18-31% higher"
      measures: "Recovery success rate on a 33-component enterprise-network testbed under three multi-stage attack scenarios; the abstract does not say whether points or relative; authors' own evaluation, preprint"
      provenance: independent
      source_ref: ARXIV-2608.15016
    - lever: speed
      description: "Recovery time versus frontier LLMs"
      figure: "up to 22% shorter"
      measures: "Recovery time of generated plans versus frontier LLMs, evaluated on logs from incidents reported in the literature; peer-reviewed, authors' own method"
      provenance: independent
      source_ref: NDSS-HAMMAR-2026
    - lever: risk
      description: "Prompt-injection recall of the guardrails proxy"
      figure: "25.0% to 94.5% at 0.1% false-positive rate"
      measures: "Injection recall of a stock NeMo Guardrails proxy before and after wrapping the SOC analyst model, on the authors' released SOC-specific corpus"
      provenance: independent
      source_ref: ARXIV-2610.09906
  prerequisites:
    - "An emulated environment (digital twin), or a closed command vocabulary with templated endpoint agents (ARXIV-2608.15016; ARXIV-2610.09906)"
    - "Incident logs and a corpus of response knowledge for fine-tuning and retrieval (NDSS-HAMMAR-2026)"
  risks_and_guardrails:
    - "Measured rail latency keeps inline control out of scope, so the loop is best run human-in-the-loop or delayed (ARXIV-2610.09906)"
    - "Lab and testbed results only; hallucination is bounded only under stated assumptions (NDSS-HAMMAR-2026)"
    - "SP 800-61r3 keeps manual selection of containment actions as an option (NIST-80061R3-2025)"
  human_checkpoints:
    - "Human-in-the-loop or delayed execution, as the constrained-action authors recommend (ARXIV-2610.09906)"
  role_evolution: "Not studied."
  evidence_grade: D
  sources:
    - { ref: ARXIV-2608.15016, title: "Hierarchical Agentic Incident Response with Digital-Twin-Validated Attack Inference", publisher: "arXiv (Gao, Chen, Li)", type: academic, url: "https://arxiv.org/abs/2608.15016", date: "2026-08-15", access: full, locator: "Abstract" }
    - { ref: NDSS-HAMMAR-2026, title: "Incident Response Planning Using a Lightweight Large Language Model with Reduced Hallucination (NDSS 2026)", publisher: "NDSS Symposium", type: academic, url: "https://www.ndss-symposium.org/ndss-paper/incident-response-planning-using-a-lightweight-large-language-model-with-reduced-hallucination/", date: "2026-02", access: full, locator: "Abstract (paper PDF not opened)" }
    - { ref: ARXIV-2610.09906, title: "Constrained-Action AI Remediation for SIEM/XDR via a NeMo-Guardrails Proxy", publisher: "arXiv (Koutidis, Kekatos, Nianios, Lekidis)", type: academic, url: "https://arxiv.org/abs/2610.09906", date: "2026-10-07", access: full, locator: "Abstract" }
    - { ref: NIST-80061R3-2025, title: "Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile (SP 800-61 Rev. 3)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final", date: "2025-04-03", access: full, locator: "Table 3, RS.MI-01" }
  last_reviewed: "2026-10-17"
  notes: "Idea (grade D): research prototypes with testbed results and no public deployment. Merged from P17 (D), G05 (C) and the research part of D17 (C); also routed here by the security-operations governance file (NDSS-IRPLAN-2026 there). G marked the digital-twin figure self-reported; marked independent here as an academic measure, with 'authors' own evaluation' stated."

- id: security-incident-response-16
  title: AI in cyber recovery and resilience work - finding the last clean restore point, flagging bad backups, drafting runbooks
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [coordination-scheduling, expert-judgment, document-production]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: "During an incident the SOC flags a compromised host but does not know what is safe to recover; the answer sits in the backup platform and is relayed manually (Rubrik scenario). Ransomware crews now go after backups, identity services and hypervisors; Mandiant calls this 'recovery denial'. Resilience programmes (business continuity, disaster recovery, crisis management, testing) also carry manual evidence and reporting work."
  solution: "Rubrik markets an assistant that maps recent activity across Microsoft 365 workloads, identifies what is needed to be operational and, on approval, runs a recovery sequence with critical users first; through MCP (a protocol that lets agents call tools), a SOC agent can ask Rubrik for a host's last clean recovery point and blast radius (private preview, general availability targeted for October 2026). A backup vendor (N2WS) says backup tools now ship ML-based anomaly detection that flags ransomware activity before it reaches recovery copies, auto-generated runbooks and post-recovery validation, and that AI is good at the writing parts of disaster recovery but weak at orchestration and judgment. A Block job posting asks its resilience programme manager to 'improve resilience workflows through AI, automation, dashboards, templates, and self-service tools'."
  outcomes:
    - lever: capacity
      description: "Vendor-stated reach of its AI assistant among customers"
      figure: "one-third of global customers"
      measures: "Rubrik's statement that Rubrik AI is 'trusted by one-third of its global customers'; denominator and the meaning of 'trusted' not given"
      provenance: vendor-published
      source_ref: RUBRIK-MCP-2026
  prerequisites:
    - "Backups and an identity and data graph in the vendor platform, with role-based permissions carried through to agents (RUBRIK-MCP-2026)"
    - "Immutable, isolated backups and a recovery environment decoupled from the corporate Active Directory domain (MANDIANT-MTRENDS-2026)"
  risks_and_guardrails:
    - "Rubrik says the assistant executes only what is approved, with MCP access at role-based access parity and guardrails aligned to the OWASP MCP Top 10; its safe-harbour statement says unreleased features may change (RUBRIK-MCP-2026)"
    - "N2WS suggests asking vendors for the false-positive rate, whether backup metadata goes to a third-party LLM, whether the AI can explain a flag, and who is accountable if it restores the wrong thing (N2WS-AIDR-2026)"
    - "N2WS says AI will 'probably' not recover an application from corruption without human review, and that a packaged LLM agent producing a defensible RTO/RPO map does not exist (N2WS-AIDR-2026)"
    - "The Block posting names data, access, auditability and human review controls as requirements for AI workflows (BLOCK-JOB-2026)"
  human_checkpoints:
    - "Operator approves the recovery sequence (RUBRIK-MCP-2026)"
    - "Human review of recovery from corruption events (N2WS-AIDR-2026)"
  role_evolution: "The Block posting expects the resilience programme manager to use and administer AI, automation and reporting tools alongside BCP and DR duties and standards such as ISO 22301 (BLOCK-JOB-2026). N2WS says recovery prioritisation workshops are still done by people (N2WS-AIDR-2026)."
  evidence_grade: C
  sources:
    - { ref: RUBRIK-MCP-2026, title: "Rubrik Adds New MCP Support to Expand Access to Agentic Cyber Resilience", publisher: "Rubrik", type: vendor, url: "https://www.rubrik.com/company/newsroom/press-releases/26/rubrik-adds-new-mcp-support-to-expand-access-to-agentic-cyber-resilience", date: "2026-09-15", access: full, locator: "Opening and availability paragraphs (text mirror)" }
    - { ref: RUBRIK-AI-2026, title: "Rubrik AI product page (AI-powered cyber recovery)", publisher: "Rubrik", type: vendor, url: "https://www.rubrik.com/products/ai-powered-cyber-recovery", date: "2026-10", access: full, locator: "Use-case panels on Microsoft 365 recovery and SOC-agent query; accessed 2026-10-17" }
    - { ref: N2WS-AIDR-2026, title: "AI in disaster recovery: what's real in 2026", publisher: "N2WS", type: vendor, url: "https://n2ws.com/blog/emerging-ai-technologies-disaster-recovery", date: "2026-04-30", access: full, locator: "'Where AI in DR actually stands' to 'What to ask your DR vendor about AI' (text mirror)" }
    - { ref: DRJ-WEBINAR-2026, title: "AI, Ransomware, and Cyber Recovery: Turning Hype into Resilience", publisher: "Disaster Recovery Journal", type: conference, url: "https://drj.com/webinars_main/march-11-2026-ai-ransomware-and-cyber-recovery-turning-hype-into-resilience/", date: "2026-03-11", access: full, locator: "Webinar description" }
