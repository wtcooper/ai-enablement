# Use cases: security / incident-response
# Synthesised 2026-10-17 from research/runs/wave4: landscape-security.md and the practice (P), discourse (D) and
# governance (G) deep dives for this module, plus items other security deep dives routed here (Cloudflare incident
# report reviewer, Mandiant/GTIG source-code harness, post-incident policy gap analysis). Source refs are canonical
# keys: where two input files used different keys for the same document, one key is used here (for example
# OPENAI-HFROAD-2026 for OPENAI-ROAD-2026, NIST-KEYPRACTICES-2026 for the 2026-10-16 key practices,
# EUR-LEX-DORA301-2025 for EU-DORARTS-2024, FLI-AIACT73-2024 for EU-AIACT-ART73-2024, SANS-AI-2026 for
# SWIMLANE-SANSAI-2026). Almost every outcome figure is self-reported, vendor-published or a lab benchmark; no
# independent production measurement of AI in incident response was found. Overlaps: alert triage agents sit in
# security-operations; agent containment controls in ai-security; PSIRT agents in vulnerability-exposure; the
# source-code harness also in application-security. No finalised use-case ids existed in those modules at the time
# of writing, so cross-references name the module.

- id: security-incident-response-01
  title: AI review of incident response plans for completeness, currency and fit with NIST SP 800-61
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: "Incident response plans are essential but time-consuming to maintain and are updated reactively (Fortinet session abstract, FIRST 2026). ISACA reports that 48% of respondents either do not know whether their organisation has AI incident playbooks or say it does not."
  solution: "A Fortinet proactive-services consultant presented a proof of concept at FIRST 2026 in which AI analyses an incident response plan for completeness, clarity and alignment with NIST 800-61, flags outdated procedures and suggests targeted improvements. The abstract says it was tested on a real plan and covers data preparation, analysis, validation and limits. NIST SP 800-61 Rev. 3 (April 2025) supersedes Rev. 2 and maps the old lifecycle phases onto the CSF 2.0 functions, so a review rubric should be built from Rev. 3."
  outcomes:
    - lever: speed
      description: "none published"
      figure: "none published"
      measures: "The abstract says manual review time is reduced but gives no figure"
      provenance: vendor-published
      source_ref: FIRST-CON-2026
  prerequisites:
    - "The plan in a form the model can read, and a reference standard to compare against (NIST SP 800-61 Rev. 3) (FIRST-CON-2026; NIST-80061R3-2025)"
    - "Structured playbooks and runbooks; Atlassian's IR team presented Arcana, an open-source structure for playbooks, runbooks, SOPs and knowledge-base articles (not AI), at the same conference (FIRST-CON-2026)"
  risks_and_guardrails:
    - "Proof of concept only; the abstract promises a discussion of the limitations of AI in IR planning, whose contents were not available (FIRST-CON-2026)"
    - "Build the rubric from Rev. 3, which supersedes Rev. 2 (NIST-80061R3-2025, Table 1)"
  human_checkpoints:
    - "Validation is a stage of the described process; who validates is not stated (FIRST-CON-2026)"
    - "The plan owner decides which suggestions to adopt"
  role_evolution: "Not stated in the sources."
  evidence_grade: C
  sources:
    - { ref: FIRST-CON-2026, title: "38th FIRST Conference program (Denver, 14-19 June 2026): session abstracts", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "Session 'Leveraging AI to Review and Strengthen Your Incident Response Plan: A Proof of Concept' (Fortinet); Atlassian Arcana session" }
    - { ref: NIST-80061R3-2025, title: "Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile (SP 800-61 Rev. 3)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final", date: "2025-04-03", access: full, locator: "Document history; Table 1" }
    - { ref: ISACA-SOC-2026, title: "Only 8 Percent of Organizations Conduct Regular AI-Specific Response Exercises (press release on the 2026 State of Cybersecurity survey)", publisher: "ISACA", type: professional-body, url: "https://www.isaca.org/about-us/newsroom/press-releases/2026/only-8-percent-of-organizations-global-enterprises-conduct-regular-ai-specific-response-exercises", date: "2026-09-22", access: full, locator: "Section 'AI incident response planning lags'" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P10, D08 and G06 (the same Fortinet session). Abstract only; the presenter is a vendor consultant, so treated as vendor-originated."

- id: security-incident-response-02
  title: Build tailored tabletop and crisis exercises from the organisation's own playbooks with an AI scenario builder
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [document-production, coordination-scheduling]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Scenarios written once a year drift out of date, and building custom exercises by hand needs focus time, so many exercises stay generic (Immersive). A 2024 paper says externally led tabletop exercises can be costly, time-consuming and not well fitted to the client; another paper calls them scripted, resource-intensive and hard to scale."
  solution: "Immersive released an 'AI Crisis simulation builder' on 1 October 2026. A user describes the exercise or uploads an IR playbook, threat-intelligence report or last year's post-incident review, answers a short form (sector, region, participants, time, regulations, tone), and the tool builds a branching scenario with decision points, role cards, live injects, sector regulatory deadlines as clocks, supporting documents, performance indicators and a debrief. Nothing reaches participants until a person publishes it. The Center for Internet Security published guidance in May 2025 on using generative AI to develop tabletop exercises for state and local governments. Researchers also propose LLM teammates: AgentBnB is a browser version of the Backdoors and Breaches card game with LLM teammates and a retrieval-based hinting copilot."
  outcomes:
    - lever: speed
      description: "none published"
      figure: "none published"
      measures: "The vendor says scenarios are built 'in minutes'; no measured comparison with manual building"
      provenance: vendor-published
      source_ref: IMMERSIVE-AIBUILDER-2026
    - lever: experience
      description: "Solo-player pilot of LLM teammates: participants reported greater intention to use the agent version than the physical card deck"
      figure: "4 participants"
      measures: "Graduate students in the AgentBnB pilot; self-reported intention to use, plus a knowledge quiz with a ceiling effect; too small to generalise, per the authors"
      provenance: independent
      source_ref: ARXIV-2511.00265
  prerequisites:
    - "Current IR playbooks and escalation paths, and recent post-incident reviews as source material (IMMERSIVE-AIBUILDER-2026)"
    - "Detailed data and prompts; CIS notes the user must supply them to get useful scenarios (CIS-TTXGENAI-2025)"
  risks_and_guardrails:
    - "Publishing an exercise is always a person's decision; the vendor says the tool checks its own work for broken branches and dead ends (IMMERSIVE-AIBUILDER-2026)"
    - "The AgentBnB authors list small sample, single-player focus and a narrow corpus as limitations (ARXIV-2511.00265)"
  human_checkpoints:
    - "Exercise owner reviews, edits and publishes each scenario (IMMERSIVE-AIBUILDER-2026)"
  role_evolution: "Immersive says exercise owners shift from authoring scenarios by hand to directing and curating them (IMMERSIVE-AIBUILDER-2026, 'Why this matters')."
  evidence_grade: C
  sources:
    - { ref: IMMERSIVE-AIBUILDER-2026, title: "Turn Conversations into Custom Crisis Simulations with the AI Builder", publisher: "Immersive", type: vendor, url: "https://www.immersivelabs.com/whats-new/turn-conversations-into-custom-crisis-simulations-with-the-ai-builder", date: "2026-10-01", access: full, locator: "Whole post (platform release note)" }
    - { ref: CIS-TTXGENAI-2025, title: "Leveraging Generative Artificial Intelligence for Tabletop Exercise Development", publisher: "Center for Internet Security", type: standard-setter, url: "https://www.cisecurity.org/insights/white-papers/leveraging-generative-artificial-intelligence-for-tabletop-exercise-development", date: "2025-05-15", access: full, locator: "Landing-page summary (white paper PDF not opened)" }
    - { ref: ARXIV-2403.01626, title: "Using LLMs for Tabletop Exercises within the Security Domain", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2403.01626", date: "2024-03-03", access: full, locator: "Abstract" }
    - { ref: ARXIV-2511.00265, title: "AgentBnB: A Browser-Based Cybersecurity Tabletop Exercise with Large Language Model Support and Retrieval-Aligned Scaffolding", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2511.00265", date: "2025-10-31", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P11 (Immersive, C) and D09 (academic idea, D). No named customer or independent evaluation of AI-authored scenarios was found. The governance angle found no source describing AI generating exercise scenarios; the practice angle found the Immersive release, so the two disagree on existence, not on outcomes. FIRST 2026 tabletop sessions describe human-designed exercises. Cytactic and Hack The Box claims were seen only in search results and are not used."

- id: security-incident-response-03
  title: Hold a vetted self-hosted or trusted-access model ready before an incident, so forensic AI is not blocked by provider guardrails
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [coordination-scheduling, software-systems]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: "Hosted frontier models may refuse requests that include real exploit payloads, attack commands or command-and-control artifacts, which is what forensic analysis of an intrusion requires. Hugging Face says the safety filters cannot tell a responder from an attacker."
  solution: "Hugging Face moved its AI-assisted forensic pipeline to an open-weight model (a quantized GLM-5.2 build) on its own infrastructure after hosted APIs blocked the work, which also kept attacker data and the credentials it referenced inside its environment. It now advises defenders to have a capable model they can run themselves vetted and ready before an incident. OpenAI says it added Hugging Face to its Trusted Access for Cyber Program."
  outcomes:
    - lever: risk
      description: "The analysis could proceed after hosted models refused it, and attacker data and credentials stayed in Hugging Face's environment; no measured effect is published"
      figure: "none published"
      measures: "Not applicable; Hugging Face describes the event qualitatively. A newsletter says the local model also cost much less, but the Hugging Face posts do not state cost"
      provenance: self-reported
      source_ref: HF-DISCLOSURE-2026
  prerequisites:
    - "Compute to host a large open-weight model (HF-TIMELINE-2026)"
    - "A decision taken before an incident, with security leadership, about which models are approved for incident data; one newsletter calls it 'a discussion to have' up to the CSO (DETENGWEEKLY-165-2026)"
  risks_and_guardrails:
    - "Hugging Face says this is not an argument against safety measures on hosted models, and says it shared the feedback with the providers concerned (HF-DISCLOSURE-2026)"
    - "Open-weight availability is contested: the newsletter links an argument that restricting open models mainly burdens defenders, while quoting a lab leader's opposing view (DETENGWEEKLY-165-2026)"
  human_checkpoints:
    - "The choice of model, and which incident data may go to which model, is a leadership decision made in advance (HF-DISCLOSURE-2026, 'The asymmetry problem')"
  role_evolution: "Hugging Face's advice adds a new preparation item for IR teams: model-access readiness alongside tooling and retainers (HF-DISCLOSURE-2026)."
  evidence_grade: B
  sources:
    - { ref: HF-DISCLOSURE-2026, title: "Security incident disclosure - July 2026", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/security-incident-july-2026", date: "2026-07-16", access: full, locator: "Section 'The asymmetry problem'" }
    - { ref: HF-TIMELINE-2026, title: "Agent intrusion technical timeline", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/agent-intrusion-technical-timeline", date: "2026-07-27", access: full, locator: "'How we intercepted and analyzed the attack'" }
    - { ref: OPENAI-HFINC-2026, title: "OpenAI and Hugging Face partner to address security incident during model evaluation", publisher: "OpenAI", type: firm, url: "https://openai.com/index/hugging-face-model-evaluation-security-incident/", date: "2026-07", access: full, locator: "Update of 2026-07-28 (Trusted Access for Cyber Program); read via text mirror" }
    - { ref: DETENGWEEKLY-165-2026, title: "DEW #165", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-165-starved-and-neglected-rules", date: "2026-07-29", access: full, locator: "Item 'The Arguments Against Open Source AI are Very Bad'" }
  last_reviewed: "2026-10-17"
  notes: "From D02; also routed here by the ai-security governance and security-operations discourse files. Pattern 'other': a readiness control (pre-approved model access) rather than a workflow pattern. Single-incident evidence."

- id: security-incident-response-04
  title: Reconstruct attack timelines and narratives from logs and forensic artifacts with LLM agents, with validation before export
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [research-synthesis, data-reporting]
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "Timeline analysis can take investigators weeks on difficult cases, sifting hundreds of millions of log records from hundreds of unfamiliar log types (Google talk abstract). Hybrid-cloud incidents scatter evidence across cloud, SaaS and endpoint logs, and Centene's presenters say interpretation under uncertainty, not detection, is now the slow part. In July 2026 Hugging Face had to interpret about 17,600 attacker actions from an autonomous agent."
  solution: "Hugging Face ran LLM-driven analysis agents over the full attacker action log to reconstruct the timeline, extract indicators of compromise, map the credentials touched, separate real impact from decoy activity and decode staged payloads, and had the model build trace-analysis interfaces. Google's Sec-Gemini agent runs forensic analysis over super-timelines in Timesketch, finds and explains evidence of compromise without predefined signatures, and surfaces findings in an AI panel. Centene's FIRST 2026 session describes a six-layer pipeline (ingest, normalise to OCSF, AI assist, validate, timeline, export) in which LLMs help with field inference, clustering and narrative, every transformation is versioned and hash-verified, and the analyst keeps decision authority. Mandiant describes an agentic triage pipeline that built a unified attack timeline from an isolated endpoint anomaly."
  outcomes:
    - lever: speed
      description: "Hugging Face says the AI-assisted approach did in hours what would usually take days"
      figure: "hours instead of days (no numbers given)"
      measures: "Hugging Face's statement about reconstructing the timeline, extracting indicators and mapping credentials for one incident; the baseline for 'days' and how it was estimated are not stated"
      provenance: self-reported
      source_ref: HF-DISCLOSURE-2026
    - lever: capacity
      description: "Scale of evidence the Hugging Face pipeline handled"
      figure: "about 17,600 attacker actions in about 6,280 clusters"
      measures: "Attacker actions Hugging Face says it recovered from the agent's logs between 2026-07-09 and 2026-07-13, grouped into clusters; this counts the input, not accuracy"
      provenance: self-reported
      source_ref: HF-TIMELINE-2026
    - lever: quality
      description: "Google evaluated its Timesketch agent on 100 real-world compromised systems and reports high recall and precision on attack-related log records"
      figure: "none published in the source read"
      measures: "Recall and precision of individual attack-related log records on 100 compromised systems; numeric values are in a slide deck that was not opened"
      provenance: self-reported
      source_ref: GOOGLE-TIMESKETCH-2025
  prerequisites:
    - "Log and artifact normalisation (Plaso, OCSF or similar) and a SIEM or data platform such as Splunk, Sentinel or Databricks (FIRST-CON-2026)"
    - "Recoverable attacker-side or platform logs to correlate (HF-TIMELINE-2026)"
    - "A validation layer, prompt and workflow logging, and ground-truth timelines with a repeatable scoring method; one paper proposes a NIST CFTT-inspired method scoring timelines with BLEU and ROUGE (FIRST-CON-2026; ARXIV-2505.03100)"
  risks_and_guardrails:
    - "No accuracy or error rate is published for the Hugging Face reconstruction; Hugging Face also worked with outside forensic specialists and reported to law enforcement (HF-DISCLOSURE-2026)"
    - "Forensic artifacts can carry injected instructions: an NTT DATA FIRST 2026 abstract demonstrates structured-data injection against DFIR LLM agents (outcomes named: hide, mislead, exploit); see security-incident-response-11 (FIRST-CON-2026; USENIX-LOGINJECT-2026)"
    - "On a public benchmark the best of 11 LLMs fully solved only 8 of 25 incident-analysis scenarios (ARXIV-2603.06422)"
    - "Centene names evidentiary standards (Daubert, Frye, Durant) as the bar and treats AI 'as an accelerator', not an authority (FIRST-CON-2026)"
  human_checkpoints:
    - "Investigators inspect findings in the Timesketch AI panel and work the case from there (GOOGLE-TIMESKETCH-2025)"
    - "Validation layer before export; decision authority 'never leaves the analyst' (FIRST-CON-2026, Centene abstract)"
    - "Hugging Face's security team identified the vector, shut down the affected renderer and cut the attacker off (HF-TIMELINE-2026)"
  role_evolution: "Hugging Face writes that reconstructing about 17,600 actions by hand was impractical, so responders worked through an AI-assisted pipeline of their own (HF-TIMELINE-2026). Centene's speaker biographies describe analysts moving from reactive responders to supervisory decision-makers; this is self-description, not a measured effect (FIRST-CON-2026)."
  evidence_grade: B
  sources:
    - { ref: HF-DISCLOSURE-2026, title: "Security incident disclosure - July 2026", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/security-incident-july-2026", date: "2026-07-16", access: full, locator: "Sections 'Analyzing an AI-driven intrusion', 'What we did'" }
    - { ref: HF-TIMELINE-2026, title: "Agent intrusion technical timeline", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/agent-intrusion-technical-timeline", date: "2026-07-27", access: full, locator: "TL;DR; 'How we intercepted and analyzed the attack'; 'Reflection: the asymmetry problem'" }
    - { ref: GOOGLE-TIMESKETCH-2025, title: "Autonomous Timeline Analysis and Threat Hunting (Black Hat USA 2025 talk page)", publisher: "Elie Bursztein, with Google co-authors", type: conference, url: "https://elie.net/talk/autonomous-timeline-analysis-and-threat-hunting-an-ai-agent-for-timesketch", date: "2025-08-06", access: full, locator: "Talk abstract and 'Available Media'" }
    - { ref: FIRST-CON-2026, title: "38th FIRST Conference program (Denver, 14-19 June 2026): session abstracts", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "Sessions 'From Logs to Living Timelines' (Centene) and 'The Dark Side of Autonomy' (NTT DATA)" }
    - { ref: MANDIANT-AIRR-2026, title: "AI Risk and Resilience in 2026: A Mandiant Special Report", publisher: "Mandiant / Google Cloud", type: vendor, url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026", date: "2026-09", access: full, locator: "Case Study 8, section 'Contextual analytics and the agentic SOC'" }
    - { ref: ARXIV-2505.03100, title: "Towards a standardized methodology and dataset for evaluating LLM-based digital forensic timeline analysis", publisher: "arXiv (preprint)", type: academic, url: "https://arxiv.org/abs/2505.03100", date: "2025-05-06", access: full, locator: "Abstract" }
    - { ref: ARXIV-2603.06422, title: "Before You Hand Over the Wheel: Evaluating LLMs for Security Incident Analysis (SIABench)", publisher: "arXiv (Jajodia, Sultana, Majumdar, Taylor)", type: academic, url: "https://arxiv.org/abs/2603.06422", date: "2026-03-06", access: full, locator: "Abstract; Section V results" }
    - { ref: USENIX-LOGINJECT-2026, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/karanjai", date: "2026-08", access: full, locator: "Abstract" }
    - { ref: DETENGWEEKLY-164-2026, title: "DEW #164", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-164-your-benign-set-stinks-openai", date: "2026-07-22", access: full, locator: "Hugging Face breach item" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P02 (Google, Centene; B), D01 (Hugging Face; B), D03 (Centene; C) and G04 (Centene, Mandiant; C). Grade B: named organisations (Hugging Face, Google) used it on real cases, but no numeric quality outcome was read. Maturity in-production rests on Hugging Face; Centene's pipeline is a conference abstract (announced). Centene's speaker bio claims 'hours to minutes' compression; it is a bio statement and is not used as an outcome. The elie.net page carried embedded text addressed to AI agents; it was ignored by the researcher."

- id: security-incident-response-05
  title: An agent runs deterministic forensic tools for rapid host triage and ties every finding to an artifact
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [research-synthesis, review-assurance, expert-judgment]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: "Intrusions complete in minutes while forensic triage of memory, disk, logs and cloud telemetry takes an analyst a day or more; the Protocol SIFT author describes analysts as 'command-line stenographers' who lose time recalling tool syntax. Organisations also lack benchmarks to judge whether an LLM can be trusted with memory, network and malware forensics."
  solution: "SANS's Protocol SIFT puts an AI agent in front of the SIFT Workstation's forensic tools: deterministic tools produce the evidence, the AI sequences the steps, logs each command and ties findings to artifacts. SANS then ran a public 'Find Evil!' challenge for agents on the same workstation; two winning entrants (Mulder, a five-phase autonomous investigation, and TRUDI, a hypothesis-driven investigation that refutes its own briefing) are being installed on the workstation. Independent benchmarks (SIABench, ExCyTIn-Bench, CyberSOCEval) test agents with tools such as Volatility, Tshark and Oledump on incident evidence."
  outcomes:
    - lever: speed
      description: "A live RSA Conference demonstration investigated a compromised host in 14 minutes, work SANS says traditionally consumes an analyst's day"
      figure: "14 minutes"
      measures: "One live demo of a full compromised-host investigation; the 'analyst's day' is SANS's characterisation, not a measured baseline"
      provenance: self-reported
      source_ref: SANS-FINDEVIL-2026
    - lever: quality
      description: "A challenge judge's run of the first-place entry against a test disk image"
      figure: "119 of 143 artifacts of compromise"
      measures: "Artifacts of compromise identified out of 143 in one judge's single run; not an average and not production data"
      provenance: self-reported
      source_ref: SANS-FINDEVIL-2026
    - lever: speed
      description: "Informal classroom results reported by the Protocol SIFT author"
      figure: "two-thirds of 40+ students"
      measures: "Students across SANS classes who 'showed meaningful improvement in time-to-findings'; the author's own observation, no baseline; one third struggled with the change in workflow"
      provenance: self-reported
      source_ref: ROBLEE-SUBSTACK-2026
    - lever: quality
      description: "Best model on SIABench deep-analysis incident scenarios"
      figure: "8 of 25 scenarios fully solved; 33.33% on hard memory-forensics tasks"
      measures: "Scenarios with every question answered correctly, out of 25, best of 11 LLMs (some now deprecated); average correct answers per scenario for the best model on hard memory-forensics scenarios"
      provenance: independent
      source_ref: ARXIV-2603.06422
    - lever: quality
      description: "Best score on threat investigation over Sentinel-style logs"
      figure: "reward 0.606"
      measures: "Reward score on ExCyTIn-Bench: 7,542 generated questions over 57 log tables from a controlled Azure tenant"
      provenance: independent
      source_ref: ARXIV-2507.14201
  prerequisites:
    - "Read-only evidence mounts, typed and allowlisted tools without shell access, and an audit chain (SANS-FINDEVIL-2026)"
    - "A trained responder to validate findings (SANS-PROTOCOLSIFT-2026)"
    - "Ground-truth scenarios to test the agent on before relying on it (ARXIV-2603.06422)"
  risks_and_guardrails:
    - "SANS states Protocol SIFT is in its initial research stage, has not been validated for forensic soundness or evidentiary reliability, and is not intended for use in legal proceedings (SANS-PROTOCOLSIFT-2026)"
    - "The author names hallucination, overstated confidence and gaps with obscure artifact formats; a DFIR Summit workshop lists hallucinated findings, missed evidence and non-determinism that complicates repeatability (ROBLEE-SUBSTACK-2026; SANS-DFIRSUMMIT-2026)"
    - "SANS testing found an autonomous DFIR agent answered quickly but struggled to document how it reached its answers (BANKINFOSEC-2026)"
    - "SIABench authors conclude LLMs still struggle to complete entire scenarios; CyberSOCEval reports reasoning models did not gain the boost seen in coding and maths on malware-analysis tasks (ARXIV-2603.06422; ARXIV-2509.20166)"
    - "Proposed US Federal Rule of Evidence 707 on machine-generated evidence was sent back for revision in June 2026; its status is unsettled (PROSKAUER-FRE707-2026)"
  human_checkpoints:
    - "Validation, interpretation and reporting are performed by the investigator, not the AI (SANS-PROTOCOLSIFT-2026)"
    - "Challenge finalists were re-run against unseen evidence and findings traced back to raw artifacts before winners were named (SANS-FINDEVIL-2026)"
  role_evolution: "SANS describes the tool as augmenting the practitioner; the author reports a third of students found it harder to state investigative intent than to type memorised commands (SANS-PROTOCOLSIFT-2026; ROBLEE-SUBSTACK-2026). ISC2 expects roles such as incident responder to evolve rather than disappear (ISC2-WORKFORCE-2025)."
  evidence_grade: B
  sources:
    - { ref: SANS-PROTOCOLSIFT-2026, title: "Protocol SIFT: an experimental research initiative for AI-assisted DFIR", publisher: "SANS Institute", type: professional-body, url: "https://www.sans.org/blog/protocol-sift-experimental-research-initiative-ai-assisted-dfir", date: "2026-03-09", access: full, locator: "Body text; validation disclaimers" }
    - { ref: ROBLEE-SUBSTACK-2026, title: "Introducing Protocol SIFT: Meeting AI Threat Speed with Defensive AI Orchestration", publisher: "Rob T. Lee (Substack)", type: community, url: "https://robtlee73.substack.com/p/introducing-protocol-sift-meeting", date: "2026-01-16", access: full, locator: "'Hallucinations' and 'Constraints, Limitations' sections" }
    - { ref: SANS-FINDEVIL-2026, title: "Find Evil! winners", publisher: "SANS Institute", type: professional-body, url: "https://www.sans.org/go/find-evil-winners", date: "2026", access: full, locator: "'The speed', 'The proof', 'The other half' and 'The winners' sections" }
