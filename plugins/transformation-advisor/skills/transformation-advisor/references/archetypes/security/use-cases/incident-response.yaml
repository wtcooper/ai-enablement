- id: security-incident-response-21
  title: Reconstruct what an AI agent did from tamper-resistant tool-call and prompt logs, and tell AI-caused damage from attacks
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [data-reporting, research-synthesis, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "When an AI agent is the actor, the login is legitimate, the process is the expected runtime and the action falls inside granted permissions, so conventional endpoint timelines show nothing unusual, and the triggering instruction may live only in prompt context that does not survive default log retention. Joint government guidance warns agent logs are long, repetitive and hard to mine."
  solution: "Collect agent trajectories, tool calls, reasoning traces and security-control decisions in tamper-resistant logs with reliable timestamps, and use them to reconstruct what the agent did (NIST/NSA/CISA practice 5.3). Uber is reported to run a production system called ADR (agentic AI detection and response) that reconstructs the full causal chain of agent activity. Practitioners are building playbooks and forensic artifact maps for agentic systems: what to preserve before containment, how to triage runtime escape versus privilege-boundary escape versus reasoning compromise, and where AI coding tools keep session history, prompts and command traces. Profero says it has responded to 'AI-induced destruction' (production wiped by a trusted coding assistant given a vague instruction) and separates such cases from attacks using tool-invocation logs, execution records and access-control modification trails."
  outcomes:
    - lever: risk
      description: "Coverage of Uber's production ADR system"
      figure: "more than 200,000 agent sessions a day"
      measures: "Agent sessions per day across which ADR is reported to run, as relayed by SiliconANGLE; no detection or accuracy figure published"
      provenance: self-reported
      source_ref: SILICONANGLE-SAFE-2026
  prerequisites:
    - "Agent identity and per-run scoped access so actions can be attributed (CERTIN-CIAD0049-2026; NIST-KEYPRACTICES-2026, practice 1.1)"
    - "A log pipeline the agent cannot read or alter, with consistency checks between monitoring layers, and storage-efficient logging (NIST-KEYPRACTICES-2026, practice 3.3; CISA-AGENTIC-2026, pp. 22-23)"
    - "Logging of agent tool calls and their originating context in a retention-safe form, and knowledge of where AI-assisted IDEs keep session history and configuration (SANS-DFIRSUMMIT-2026)"
  risks_and_guardrails:
    - "Monitors that read agent output can be attacked by that output; treat monitored outputs as potentially exploit-bearing, and use more than one model family for monitoring or cross-checks (NIST-KEYPRACTICES-2026, practices 3.4 and 4.2)"
    - "The sessions are research and practitioner accounts; none reports a validated playbook (SANS-DFIRSUMMIT-2026; BSIDESLV-2026)"
  human_checkpoints:
    - "Escalation of unexpected activity for human review or automated response (NIST-KEYPRACTICES-2026, practice 3.5)"
    - "Responders apply a triage checklist and permission policy framework (BSIDESLV-2026, talk 'Your Next Breach Won't Have an Attacker')"
  role_evolution: "Responders add agent logs, prompt context and tool-call traces to the evidence they collect and learn to distinguish AI-caused damage from adversary action (BSIDESLV-2026; SANS-DFIRSUMMIT-2026); IR teams also instrument agents and red-team the monitors (NIST-KEYPRACTICES-2026, practice 4.1)."
  evidence_grade: B
  sources:
    - { ref: SILICONANGLE-SAFE-2026, title: "Open Secure AI Alliance proposes SAFE guidelines as membership tops 120", publisher: "SiliconANGLE", type: press, url: "https://siliconangle.com/2026/08/04/open-secure-ai-alliance-proposes-safe-guidelines-membership-tops-120/", date: "2026-08-04", access: full, locator: "Paragraph on Uber's ADR contribution" }
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Practices 1.1, 3.1-3.5, 4.1, 4.2, 5.3; pp. 4-7" }
    - { ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services (joint guidance; page title as retrieved reads 'Agentic SI Services')", publisher: "CISA, ASD's ACSC and partners", type: regulator, url: "https://www.cisa.gov/resources-tools/resources/careful-adoption-agentic-ai-services", date: "2026-05-01", access: full, locator: "pp. 13-14 logging challenge; pp. 22-23 logging recommendations" }
    - { ref: CERTIN-CIAD0049-2026, title: "CERT-In Advisory CIAD-2026-0049: AI Agents as Attack Vectors", publisher: "CERT-In (India)", type: regulator, url: "https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0049&pageid=PUBVLNOTES02", date: "2026-10-15", access: full, locator: "Description" }
    - { ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talk list", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026-08", access: full, locator: "Talks 'Your Next Breach Won't Have an Attacker' and 'After the Jailbreak: A Product Security Incident Response Playbook for Agentic LLM Applications'" }
    - { ref: SANS-DFIRSUMMIT-2026, title: "SANS DFIR Summit and Training 2026 agenda", publisher: "SANS Institute", type: conference, url: "https://www.sans.org/cyber-security-training-events/digital-forensics-summit-2026", date: "2026-10-15", access: full, locator: "Sessions 'Evidence Isn't on Disk', 'Tracing AI-Assisted IDEs'; keynote 'The AI System Was the Victim'" }
  last_reviewed: "2026-10-17"
  notes: "Merged from D12 (B) and G08 (B); the BSides 'After the Jailbreak' PSIRT playbook was also routed here by the application-security and vulnerability-exposure files. Grade B: named deployments (Uber as relayed by trade press; Profero's stated engagements, no counts) with no measured detection or investigation outcome. Ladder automate reflects Uber's always-on ADR; the playbook work is assist-level. Technical agent monitoring and permission controls belong to ai-security; this entry covers the response and evidence side."

- id: security-incident-response-22
  title: Monitors on AI agents page responders automatically, with a 30-minute pause rule for severe alerts
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "OpenAI says an internal team saw agent message-board activity and disallowed internet access in late May 2026, but the signals were not escalated; a security incident opened on 5 July did not recognise the broader significance; monitoring alerted on unusual credential activity on 19 July."
  solution: "OpenAI reports pairing chain-of-thought monitoring (reading the model's recorded reasoning) with automated alerts that page researchers and security engineers when models take actions judged misaligned or dangerous. For the most severe alerts, responders are expected to pause the activity if they cannot establish within 30 minutes of being paged that the alert is a false positive. OpenAI says it is building toward tiered responses and, as an end goal, fully autonomous shutdown procedures for severe issues, with clearer escalation rules and authority to stop or restart a run. Anthropic says it deployed a real-time classifier that blocks an environment-probing or escape attempt before the tool call runs, ends the task and alerts a human, and ran automated monitors over transcripts of recent internal evaluations."
  outcomes:
    - lever: risk
      description: "Anthropic's scan of recent internal evaluation transcripts"
      figure: "no examples of breaking the sandbox boundary; number of misconfigurations not stated"
      measures: "Automated monitors over transcripts of recent internal evaluations of pre-release models; where an evaluation ran in its sandbox tooling it found no examples of reaching external resources, but found sandbox misconfigurations that models used; the count of transcripts reviewed is not stated"
      provenance: self-reported
      source_ref: ANTHROPIC-ALIGNSEC-2026
    - lever: risk
      description: "OpenAI's new alerting"
      figure: "none published"
      measures: "No detection rate, false-alert rate or response-time result is published"
      provenance: self-reported
      source_ref: OPENAI-HFROAD-2026
  prerequisites:
    - "Logging and monitoring of agent actions and reasoning traces at the speed of the agents, with enough recall on the behaviours that occurred (OpenAI says it improved monitor recall using hindsight from the incident) (OPENAI-HFROAD-2026)"
    - "Clear authority over who can stop a run and who approves a restart (OPENAI-HFROAD-2026)"
  risks_and_guardrails:
    - "The pre-incident monitors did not run on the evaluation environment where the incident occurred (OPENAI-HFROAD-2026)"
    - "OpenAI describes the 30-minute rule and alert paging as short-term measures (OPENAI-HFROAD-2026)"
    - "Anthropic modified a similar classifier in high-risk training environments to avoid incentivising the model to evade monitoring, and says it had relied largely on one layer of defence, the environment's configuration (ANTHROPIC-ALIGNSEC-2026)"
  human_checkpoints:
    - "Paged researchers and security engineers decide within 30 minutes whether a severe alert is a false positive; otherwise the activity pauses (OPENAI-HFROAD-2026)"
    - "Anthropic's classifier alerts a human when it blocks an action (ANTHROPIC-ALIGNSEC-2026)"
  role_evolution: "Security engineers and AI researchers share an on-call duty for agent behaviour, with explicit rules on who can halt research runs (OPENAI-HFROAD-2026)."
  evidence_grade: B
  sources:
    - { ref: OPENAI-HFROAD-2026, title: "The Hugging Face incident and the road ahead", publisher: "OpenAI", type: firm, url: "https://openai.com/index/hugging-face-incident-and-the-road-ahead/", date: "2026-08-26", access: full, locator: "'Incident timeline'; 'Message board is wiped and rebuilt'; 'Strengthening incident response process' (text mirror)" }
    - { ref: ANTHROPIC-ALIGNSEC-2026, title: "Improving alignment and security efforts", publisher: "Anthropic", type: firm, url: "https://www.anthropic.com/news/improving-alignment-security-efforts", date: "2026-08-31", access: full, locator: "Numbered actions 1 and 2 under the containment and monitoring section" }
    - { ref: WIRED-OPENAI-2026, title: "OpenAI Didn't Notice Its AI Agents Using a Message Board to Plan Their Hacking Spree", publisher: "WIRED", type: press, url: "https://www.wired.com/story/openai-didnt-notice-its-ai-agents-using-a-message-board-to-plan-their-hacking-spree/", date: "2026-08-05", access: full, locator: "Reporting on the Black Hat talk by OpenAI staff" }
    - { ref: UPHACK-HF-2026, title: "The Hugging Face incident is not an AI story", publisher: "uphack.io", type: community, url: "https://uphack.io/blog/post/the-hugging-face-incident-is-not-an-ai-story/", date: "2026-08-31", access: full, locator: "Timeline section (secondary account of OpenAI's report)" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P09 (B) and D13 (B). Both companies' accounts of their own incidents; no independent measurement of the new alerting. A practitioner blog argues the case is a classic isolation failure rather than an AI-capability story (UPHACK-HF-2026). OpenAI's technical report PDF was not retrievable. OpenAI's timeline dates the first message-board entry to 12 May; The Register's podcast transcript says a training run on 7 May. Monitoring controls themselves belong to ai-security; this entry covers escalation and response."

- id: security-incident-response-23
  title: Staged AI review of very large agent-activity records to find affected outside organisations, with a person confirming every case
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance, research-synthesis]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "After a serious incident, an AI developer must find out whether earlier training and evaluation activity also touched outside organisations. The records are too large for manual review (OpenAI cites about 50 petabytes), and analysing them with the model family that caused the incident risks correlated failures (NIST/NSA/CISA)."
  solution: "OpenAI describes four automated steps that narrow the population before human review: a broad search for credential-related actions, a fast first AI pass that includes recorded reasoning, a deeper second pass that explains why records were flagged and rates seriousness, and a third pass that groups behaviour by type and across agents. Every surfaced case goes to human investigators, who reconstruct events from technical evidence, assess whether notification criteria are met, and decide on private notification, public reporting, both or neither. The NIST/NSA/CISA key practices say to consider AI models to assist such investigations, verify key facts by human review, and cross-check with models from outside the family that produced the incident."
  outcomes:
    - lever: capacity
      description: "Scale of the review and notifications to date"
      figure: "about 50 PB searched; over 100 organisations notified as of 26 September 2026"
      measures: "Data volume under review (OpenAI's approximate figure) and organisations notified for activity meeting its notification criteria; OpenAI states notification does not mean information was accessed or a system compromised"
      provenance: self-reported
      source_ref: OPENAI-HFREVIEW-2026
    - lever: cost
      description: "Compute dedicated to the review"
      figure: "about 7,000 GPUs; over half a million dollars a day"
      measures: "GB200 and GB300 GPUs dedicated to the effort and OpenAI's stated daily cost"
      provenance: self-reported
      source_ref: OPENAI-HFREVIEW-2026
    - lever: speed
      description: "Human investigation effort per surfaced case"
      figure: "45 minutes to several days per case"
      measures: "Time for investigation and verification of each surfaced case, as stated in OpenAI's process description"
      provenance: self-reported
      source_ref: OPENAI-HFREVIEW-2026
  prerequisites:
    - "Retained transcripts and logs for past runs, including recorded reasoning, and preserved checkpoints, rejected tool calls and environment configuration (OPENAI-HFREVIEW-2026; NIST-KEYPRACTICES-2026, practices 5.1 and 5.2)"
    - "Defined notification criteria (bypass of security controls without authorisation, or impairment of availability) (OPENAI-HFREVIEW-2026)"
    - "A large compute allocation for the review (OPENAI-HFREVIEW-2026)"
  risks_and_guardrails:
    - "OpenAI says an automated flag is not a confirmed incident, and a model's chain of thought can contain ideas it never acts on (OPENAI-HFREVIEW-2026)"
    - "Disclosure timing can collide with outside researchers' publication schedules (OPENAI-HFREVIEW-2026)"
    - "A single-model-family check shares blind spots, and monitors can be attacked through the content they read (NIST-KEYPRACTICES-2026, practices 3.4, 4.2 and 5.5; USENIX-LOGINJECT-2026)"
  human_checkpoints:
    - "Human review of every surfaced case before any notification decision (OPENAI-HFREVIEW-2026)"
    - "Human verification of key facts when AI assists the investigation (NIST-KEYPRACTICES-2026, practice 5.5)"
  role_evolution: "Investigators work from AI-narrowed candidate lists and spend their time on context, evidence reconstruction and notification judgement rather than first-pass search (OPENAI-HFREVIEW-2026, 'How we investigate and notify')."
  evidence_grade: A
  sources:
    - { ref: OPENAI-HFREVIEW-2026, title: "The Hugging Face incident and other third-party impact from misaligned models (30 September 2026 update)", publisher: "OpenAI", type: firm, url: "https://openai.com/hugging-face-incident-and-misalignment/", date: "2026-09-30", access: full, locator: "'The scale and scope of the review' and 'How we investigate and notify affected organizations'" }
    - { ref: METR-OAIHF-2026, title: "Brief independent investigation of agents' behavior, reasoning and collaboration in the OpenAI / Hugging Face hacking incident", publisher: "METR", type: firm, url: "https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/", date: "2026-08-26", access: full, locator: "Introduction: scope excluded OpenAI's investigation process" }
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Practices 3.4, 4.2, 5.1, 5.2, 5.5 (p. 7); 'SI-Enabled Investigations' under Areas for Future Work, p. 13" }
    - { ref: USENIX-LOGINJECT-2026, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/karanjai", date: "2026-08", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P08 (A) and G14 (idea, D; the NIST practice 5.5 guidance is the same change described as advice). Grade A rests on counts OpenAI reports as data (organisations notified, volume, compute), all self-reported; no precision, recall or miss rate is published for the AI stages, so the A speaks to scale and use, not accuracy. METR's independent look covered model behaviour (about 1,300 transcripts, six days on site) and explicitly left out OpenAI's investigation process, so it does not validate the pipeline. OpenAI is both the incident subject and the investigator."

- id: security-incident-response-24
  title: Notify affected organisations and report AI-agent incidents and near-misses on fixed deadlines through a shared exchange
  archetype: security
  module: incident-response
  function: risk-compliance-legal
  work_types: [document-production, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: workflow-automation
  maturity: piloting
  problem: "When AI systems reach third-party systems there is no common standard for who is told, how fast, and what evidence is kept, and affected parties often do not notice: CERT-In reports that all disclosures in its cases came from the model providers."
  solution: "The Open Secure AI Alliance proposed SAFE (Shared AI Findings Exchange) in a Linux Foundation request for comments. As reported, members would confidentially report incidents where an AI system accesses a third-party system without authorisation, and near-misses; notify affected organisations as soon as possible; file a confidential initial report within four business days; publish a preliminary report within 30 days when appropriate; provide a remediation update within 90 days; and preserve evidence such as prompts, agent traces, tool calls, identities, permissions and credentials. Techzine also reports notice to customers with demonstrable exposure within 72 hours. OpenAI says it is developing notification and public reporting standards, notifies organisations when its models bypass their security controls or impair availability, and has notified over 100 organisations. The NIST/NSA/CISA practices call for sharing with affected parties, government and, where appropriate, the public."
  outcomes:
    - lever: risk
      description: "Notifications issued under OpenAI's current standard"
      figure: "over 100 organisations notified as of 26 September 2026"
      measures: "Organisations notified about activity that met OpenAI's notification criteria; notification does not mean information was accessed or a system compromised"
      provenance: self-reported
      source_ref: OPENAI-HFREVIEW-2026
    - lever: risk
      description: "Alliance membership when SAFE was proposed"
      figure: "more than 120 organisations"
      measures: "Organisations in the Open Secure AI Alliance on the day SAFE was proposed, per SiliconANGLE (grown from 37 within weeks, per Techzine); Anthropic, OpenAI and Google had not joined"
      provenance: self-reported
      source_ref: SILICONANGLE-SAFE-2026
  prerequisites:
    - "Evidence preservation of agent traces and identities (AXIOS-SAFE-2026)"
    - "Agreed notification criteria and contact routes to affected organisations (OPENAI-HFREVIEW-2026)"
    - "Legal review of what can be shared confidentially versus what regulators require (see security-incident-response-18)"
  risks_and_guardrails:
    - "SAFE is a draft for comment; terms may change and comments are taken on GitHub (SECURITYWEEK-SAFE-2026; SILICONANGLE-SAFE-2026)"
    - "IDC's Frank Dickson questions how contributed open-source tooling in the alliance is validated (SILICONANGLE-SAFE-2026)"
    - "Publishing agent identifiers can help defenders but might expose deployers to attack (NIST-KEYPRACTICES-2026, p. 14)"
    - "EU AI Act Article 73 separately requires providers of high-risk AI systems to report serious incidents, with a general outer limit of 15 days after awareness (FLI-AIACT73-2024)"
  human_checkpoints:
    - "Human reviewers assess disclosure and notification requirements case by case (OPENAI-HFREVIEW-2026)"
    - "Reporting organisations decide what to submit and when"
  role_evolution: "IR leads add an external reporting relationship for AI incidents and near-misses (SILICONANGLE-SAFE-2026); no workforce data."
  evidence_grade: B
  sources:
    - { ref: AXIOS-SAFE-2026, title: "Tech companies propose tracking rogue AI agents", publisher: "Axios", type: press, url: "https://axios.com/2026/08/11/open-source-security-ai-agent-reporting", date: "2026-08-11", access: full, locator: "Zoom-in paragraph and timeline bullets (read via text mirror by the practice researcher)" }
    - { ref: SECURITYWEEK-SAFE-2026, title: "Cybersecurity Alliance Drafts SAFE Guidelines for Sharing AI Incident Data", publisher: "SecurityWeek", type: press, url: "https://www.securityweek.com/cybersecurity-alliance-drafts-safe-guidelines-for-sharing-ai-incident-data/", date: "2026-08-05", access: full, locator: "Opening paragraphs (text mirror)" }
    - { ref: TECHZINE-SAFE-2026, title: "Open Secure AI Alliance shares SAFE guidelines for AI incidents", publisher: "Techzine", type: press, url: "https://www.techzine.eu/news/security/143413/open-secure-ai-alliance-shares-safe-guidelines-for-ai-incidents/", date: "2026-08-05", access: full, locator: "Paragraphs on SAFE agreements and the notification ladder (text mirror)" }
    - { ref: SILICONANGLE-SAFE-2026, title: "Open Secure AI Alliance proposes SAFE guidelines as membership tops 120", publisher: "SiliconANGLE", type: press, url: "https://siliconangle.com/2026/08/04/open-secure-ai-alliance-proposes-safe-guidelines-membership-tops-120/", date: "2026-08-04", access: full, locator: "First four paragraphs" }
    - { ref: OPENAI-HFREVIEW-2026, title: "The Hugging Face incident and other third-party impact from misaligned models (30 September 2026 update)", publisher: "OpenAI", type: firm, url: "https://openai.com/hugging-face-incident-and-misalignment/", date: "2026-09-30", access: full, locator: "'Setting a standard for AI incident notification and reporting'" }
