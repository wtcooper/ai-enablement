- id: security-incident-response-12
  title: Score investigation agents on end-to-end intrusion scenarios with known ground truth before trusting them with incidents
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: "Vendors promise 'AI-driven SOCs' but measured evidence of where agents succeed and fall short is scarce. A one-line alert verdict hides whether the investigation underneath was complete and right for the right reasons."
  solution: "Teams build end-to-end intrusion scenarios with known ground truth and a weighted scorecard that checks findings at key investigation steps, then run agents and models against them at every release. Cotool published a scenario in which a poisoned build workflow leads to Kubernetes and then AWS account compromise, starting from an innocuous downstream alert, and scored seven frontier models. FIRST 2026, SANS DFIR Summit and BSides sessions describe similar controlled experiments."
  outcomes:
    - lever: quality
      description: "Most off-the-shelf models failed the published scenario"
      figure: "5 of 7 models hard-failed; best 29% of weighted score"
      measures: "Cotool scenario, two runs per model in August 2026, best of two: five of seven models labelled the alert a false or benign positive (a hard fail); the best reached 29% of the weighted investigation score (cumulative gate weight, recall only), one other 3%, the rest 0%. One scenario, one starting alert"
      provenance: vendor-published
      source_ref: COTOOL-AGENTICSOC-2026
    - lever: quality
      description: "A conference abstract reports a persistent-learning loop raising accuracy on a custom benchmark"
      figure: "33.3% to 96.7%; 30 scenarios"
      measures: "30 scenarios derived from CISA KEV and NVD data, scored on severity, response action and MITRE-aligned category; baseline Gemini-2.0-Flash 33.3%, after one learning cycle 96.7%; the same scenarios appear to be used to build and to test, per the abstract; presenter's own result"
      provenance: self-reported
      source_ref: SANS-DFIRSUMMIT-2026
  prerequisites:
    - "Scenario telemetry with known dispositions and an independent grader (COTOOL-AGENTICSOC-2026)"
    - "Environment-specific ground truth for what is normal, such as backups and batch jobs (SANS-DFIRSUMMIT-2026, session 'Confidently Wrong')"
  risks_and_guardrails:
    - "Evaluations are themselves attackable: a BSides abstract says frontier agents returned correct answers without touching the logs, gaming a SOC capture-the-flag benchmark (BSIDESLV-2026)"
    - "Cotool says the common failure is implicating the legitimate developer who was debugging around the attack time, by filling gaps with a malicious story (COTOOL-AGENTICSOC-2026)"
  human_checkpoints:
    - "Human analysts receive escalated cases and investigation summaries (COTOOL-AGENTICSOC-2026)"
  role_evolution: "Detection engineers and responders take on evaluation design (DETENGWEEKLY-169-2026)."
  evidence_grade: C
  sources:
    - { ref: COTOOL-AGENTICSOC-2026, title: "A scenario to evaluate your Agentic SOC", publisher: "Cotool (unsecure.sh)", type: vendor, url: "https://unsecure.sh/blog/agentic-soc-scenario/", date: "2026-08-27", access: full, locator: "'How well do off-the-shelf agents perform?' and scorecard" }
    - { ref: DETENGWEEKLY-169-2026, title: "DEW #169", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-169-realistic-ai-soc-evaluation", date: "2026-09-03", access: full, locator: "Item 'A scenario to evaluate your Agentic SOC'" }
    - { ref: SANS-DFIRSUMMIT-2026, title: "SANS DFIR Summit and Training 2026 agenda", publisher: "SANS Institute", type: conference, url: "https://www.sans.org/cyber-security-training-events/digital-forensics-summit-2026", date: "2026-10-15", access: full, locator: "Session 'Confidently Wrong: Feedback Loops of False Positives in AI-Augmented Threat Hunting'" }
    - { ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talk list", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026-08", access: full, locator: "Abstracts 'Breaking BOTS II' and 'Agents Under Fire'" }
    - { ref: FIRST-CON-2026, title: "38th FIRST Conference program (Denver, 14-19 June 2026): session abstracts", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "Session 'Can a General-Purpose LLM Do Tier-1 Triage?' (TandemTrace; early findings)" }
  last_reviewed: "2026-10-17"
  notes: "From D16. D graded B; graded C here because the figures are a vendor's own test of models, not a named deployment. Pattern 'other': pre-deployment evaluation with a ground-truth scenario bank. The SIABench and ExCyTIn benchmarks are in security-incident-response-05."

- id: security-incident-response-13
  title: Recommend triage, containment, investigation and remediation actions inside the incident console
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [expert-judgment, coordination-scheduling]
  pattern: document-to-decision
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: "Responders must decide quickly how to classify an incident and what to contain, and the right steps depend on past similar cases and the organisation's own response rules."
  solution: "Microsoft documents 'guided responses' in Copilot for Defender: recommended actions in four categories (triage, containment, investigation, remediation), each card explaining why the action is recommended. Administrators can upload organisation-specific response guidelines. Documented for incident types such as phishing, business email compromise and ransomware."
  outcomes:
    - lever: speed
      description: "none published"
      figure: "none published"
      measures: "Not applicable; product documentation gives no results"
      provenance: vendor-published
      source_ref: MS-LEARN-DEFENDERCOPILOT-2026
  prerequisites:
    - "Incident data in Microsoft Defender XDR and Sentinel; optional uploaded response guidelines (MS-LEARN-DEFENDERCOPILOT-2026)"
  risks_and_guardrails:
    - "Not all incidents or alerts produce guided responses (MS-LEARN-DEFENDERCOPILOT-2026)"
    - "Research shows a single adversarial alert can become a path to an unsafe action if the model's output is executed (ARXIV-2610.09906)"
  human_checkpoints:
    - "Recommendations are cards for the analyst; execution is by the analyst (MS-LEARN-DEFENDERCOPILOT-2026)"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - { ref: MS-LEARN-DEFENDERCOPILOT-2026, title: "Describe Copilot in Microsoft Defender XDR", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/training/modules/security-copilot-embedded-experiences/2-copilot-for-defender", date: "2026-05-01", access: full, locator: "Section 'Guided responses'" }
    - { ref: ARXIV-2610.09906, title: "Constrained-Action AI Remediation for SIEM/XDR via a NeMo-Guardrails Proxy", publisher: "arXiv (Koutidis, Kekatos, Nianios, Lekidis)", type: academic, url: "https://arxiv.org/abs/2610.09906", date: "2026-10-07", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: "From P06. Product documentation only; no named customer use, acceptance rate or override rate was found."

- id: security-incident-response-14
  title: Guardrailed automated containment playbooks, with pre-authorised human override
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [transaction-processing, software-systems, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: "Containment actions such as isolating a host or revoking credentials are time-critical. Mandiant reports a median 22 seconds between initial access and hand-off to a secondary group in 2025. Unit 42 reports an attacker who said in negotiations that frontier AI and agent frameworks compressed weeks of intrusion work into under 10 hours; manual response across identity, CI/CD and cloud is too slow for that."
  solution: "Unit 42 recommends automated playbooks that simultaneously revoke credentials, terminate OAuth sessions, freeze CI/CD pipelines and isolate cloud accounts. NIST SP 800-61r3 lists configuring tooling to quarantine malware, isolate endpoints or halt containers automatically as something to consider. The NIST/NSA/CISA key practices call for automatic shutdown of agent trajectories on a detected control failure, and Mandiant describes pre-authorised responders able to revoke an agent's credentials."
  outcomes:
    - lever: speed
      description: "Adoption of automated incident response"
      figure: "39%"
      measures: "Adoption level of automated incident response in the 2026 SANS AI Survey as summarised by Swimlane; the summary gives no denominator; in the same summary 63% report significant shortcomings in AI's ability to detect or respond"
      provenance: vendor-published
      source_ref: SANS-AI-2026
    - lever: risk
      description: "How far practitioners let AI act on its own"
      figure: "57% require human review of every AI decision; 30% allow auto-execution of low-risk actions; 13% of medium-risk; none grant full autonomy"
      measures: "Respondents to a vendor-sponsored survey reported in a sponsored article (Prophet Security); not independent"
      provenance: vendor-published
      source_ref: HELPNET-GARTNER-2026
  prerequisites:
    - "Pre-approved response actions across identity, CI/CD and cloud accounts, tested before an incident (UNIT42-AIATTACK-2026)"
    - "Playbooks stating which actions may run without approval, with each action logged; read-only agent access to telemetry and separately scoped response permissions (MANDIANT-AIRR-2026)"
  risks_and_guardrails:
    - "SP 800-61r3 keeps manual selection of containment actions as an option (NIST-80061R3-2025, Table 3, RS.MI-01)"
    - "Joint agentic-AI guidance recommends a secondary agent that validates new tasks against policy before execution, and human review of high-risk incidents, guardrail triggers and actions denied by reviewers (CISA-AGENTIC-2026, pp. 20-21)"
    - "Only 36% of SOCs have built AI into a defined workflow, though 79% use AI or ML tools (SANS-SOC-2026)"
  human_checkpoints:
    - "Pre-authorised responders trigger emergency credential revocation; humans review denied actions (MANDIANT-AIRR-2026; CISA-AGENTIC-2026)"
  role_evolution: "In the sponsored survey 57% of respondents expect AI to shift SOC roles without changing headcount over two years, with analysts moving toward incident response, hunting and detection engineering (HELPNET-GARTNER-2026)."
  evidence_grade: C
  sources:
    - { ref: UNIT42-AIATTACK-2026, title: "AI-assisted cyber attack: inside a Unit 42 investigation", publisher: "Palo Alto Networks Unit 42", type: vendor, url: "https://unit42.paloaltonetworks.com/ai-assisted-cyber-attack-inside-a-unit-42-investigation/", date: "2026-09-02", access: full, locator: "Opening paragraphs and recommendations list" }
    - { ref: NIST-80061R3-2025, title: "Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile (SP 800-61 Rev. 3)", publisher: "NIST", type: standard-setter, url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final", date: "2025-04-03", access: full, locator: "Table 3, RS.MI-01 considerations C1 and R1" }
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Practice 6.2, p. 8" }
    - { ref: MANDIANT-AIRR-2026, title: "AI Risk and Resilience in 2026: A Mandiant Special Report", publisher: "Mandiant / Google Cloud", type: vendor, url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026", date: "2026-09", access: full, locator: "Section 'Contextual analytics and the agentic SOC'" }
    - { ref: MANDIANT-MTRENDS-EXEC-2026, title: "M-Trends 2026 Report: Executive Edition", publisher: "Mandiant / Google Cloud", type: vendor, url: "https://cloud.google.com/security/resources/m-trends-executive-edition", date: "2026", access: full, locator: "Key findings: hand-off time (full report gated)" }
    - { ref: CISA-AGENTIC-2026, title: "Careful Adoption of Agentic AI Services (joint guidance; page title as retrieved reads 'Agentic SI Services')", publisher: "CISA, ASD's ACSC and partners", type: regulator, url: "https://www.cisa.gov/resources-tools/resources/careful-adoption-agentic-ai-services", date: "2026-05-01", access: full, locator: "pp. 20-21 guardrail recommendations (ASD ACSC copy of the PDF)" }
    - { ref: SANS-AI-2026, title: "A SOC Leader's Guide to the 2026 SANS AI Survey (vendor summary; survey report not opened)", publisher: "Swimlane", type: vendor, url: "https://swimlane.com/blog/sans-ai-2026-soc-trust/", date: "2026", access: full, locator: "Section 'Where Automation Actually Earns Trust'" }
    - { ref: SANS-SOC-2026, title: "SANS 2026 SOC Report: A Decade of Evolution in Cyber Defense", publisher: "SANS Institute", type: survey, url: "https://www.sans.org/research/security-operations-report", date: "2026", access: full, locator: "Key findings (landing page)" }
