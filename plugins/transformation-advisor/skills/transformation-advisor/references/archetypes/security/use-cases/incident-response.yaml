- id: security-incident-response-06
  title: Ask plain-language questions of collected evidence in a forensic platform and get leads linked to artifacts
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: "After remote collection from an affected host, establishing what happened and when can take days of manual review before leadership can be briefed or a containment decision made (Magnet Forensics scenario)."
  solution: "Investigators run plain-language queries over collected evidence in Magnet Review; 'Intelligent Insights' runs concurrent analyses and returns a structured summary (flagged IPs, connection patterns, suggested next lines of inquiry) with citations linked to the underlying artifacts. The vendor says outputs are leads, not conclusions, and every finding is validated against source artifacts."
  outcomes:
    - lever: capacity
      description: "Vendor survey of enterprise DFIR (digital forensics and incident response) professionals on AI use in investigations"
      figure: "68%"
      measures: "Share of the more than 350 enterprise DFIR professionals surveyed for the 2026 State of Enterprise DFIR report who say they use AI as part of investigations (a 'more than threefold' rise from two years earlier, per the vendor); adoption, not outcomes"
      provenance: vendor-published
      source_ref: MAGNET-DFIR-2026
  prerequisites:
    - "Evidence collected into the platform (Magnet Axiom Cyber or Magnet Nexus remote collection, then Magnet Review) (MAGNET-AI-2026)"
    - "A written record of which tasks were AI-assisted, which models and controls were used, how outputs were validated and what data was processed (MAGNET-DFIR-2026)"
  risks_and_guardrails:
    - "The 32% of DFIR teams that have not adopted AI cite result validity, legal exposure, data security and handling of personal information (MAGNET-DFIR-2026)"
    - "Teams should be able to answer legal, executive, regulator or opposing-counsel questions about AI use (MAGNET-DFIR-2026, 'Why governance is the defining issue')"
  human_checkpoints:
    - "Investigator validates every AI finding against source artifacts before it informs scoping, CISO briefings or decisions by IR, legal or risk teams (MAGNET-DFIR-2026)"
  role_evolution: "Respondents rate evidence collection, initial case assessment and data analysis as the tasks that most need human intuition; AI is used mostly for text and image analysis, pattern recognition and classification (MAGNET-DFIR-2026)."
  evidence_grade: C
  sources:
    - { ref: MAGNET-DFIR-2026, title: "AI in enterprise DFIR: Moving fast, staying defensible", publisher: "Magnet Forensics", type: vendor, url: "https://www.magnetforensics.com/blog/ai-in-enterprise-dfir-moving-fast-staying-defensible/", date: "2026-05-08", access: full, locator: "Key insights; 'Where AI fits'; 'Using AI in an enterprise investigation'; 'Why governance is the defining issue'" }
    - { ref: MAGNET-AI-2026, title: "Magnet AI for Digital Forensics", publisher: "Magnet Forensics", type: vendor, url: "https://www.magnetforensics.com/magnet-ai/", date: "2026-10", access: full, locator: "Product page text on natural-language search, generated insights and citation verification; no publication date, accessed 2026-10-17" }
  last_reviewed: "2026-10-17"
  notes: "From P03. No named customer deployment or timing result was found. The full State of Enterprise DFIR report was not opened."

- id: security-incident-response-07
  title: An agent builds the first incident-response notebook from the alert; the analyst takes over in the same live case file
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "Mid-incident work is exploratory: many tabs, copied tables, rewritten queries, manual joins and a growing explanation. Case systems track status and SIEMs search, but neither holds the reasoning in a reproducible form (DNB authors)."
  solution: "The DNB Cyber Defense Center built a marimo-based notebook interface for incident response, threat hunting and threat intelligence. A software kit lets notebooks run native Splunk (SPL) and Microsoft (KQL) queries and join the results with warehouse tables. A headless agent builds the first case notebook from alert context; the analyst then takes over in the same running notebook or reconnects to the same agent session. One file serves as workspace, shared view, deployed app and archived report."
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "The authors describe design properties (reproducibility, version control, one artifact for workspace and report) rather than measured results"
      provenance: self-reported
      source_ref: CAUCHY-IRNOTEBOOKS-2026
  prerequisites:
    - "Access to security data platforms through their own query languages (Splunk, Defender XDR, Snowflake and similar) and a typed-table layer (CAUCHY-IRNOTEBOOKS-2026)"
    - "A schema knowledge base maintained as sources and parsers change (CAUCHY-IRNOTEBOOKS-2026, limitations)"
  risks_and_guardrails:
    - "The authors state agent-built notebooks are drafts, not verdicts, and need human review before conclusions are acted on (CAUCHY-IRNOTEBOOKS-2026)"
    - "Isolation is still coarse: cases share services at the directory level rather than running isolated per case (CAUCHY-IRNOTEBOOKS-2026)"
  human_checkpoints:
    - "Analyst takes over the agent-created notebook and reviews before conclusions are acted on (CAUCHY-IRNOTEBOOKS-2026)"
  role_evolution: "A newsletter reviewer says the approach lets responders abstract investigative patterns into skill files rather than building a notebook template for each alert type (DETENGWEEKLY-165-2026)."
  evidence_grade: B
  sources:
    - { ref: CAUCHY-IRNOTEBOOKS-2026, title: "Incident response notebooks (work at the DNB Cyber Defense Center)", publisher: "blog.cauchy.org", type: firm, url: "https://blog.cauchy.org/blog/incident-response-notebooks/", date: "2026-06-19", access: full, locator: "Introduction; 'agent loop' and limitations sections" }
    - { ref: DETENGWEEKLY-165-2026, title: "DEW #165", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-165-starved-and-neglected-rules", date: "2026-07-29", access: full, locator: "Item 'Agentic incident response notebooks'" }
  last_reviewed: "2026-10-17"
  notes: "From D04; also routed here by the security-operations discourse file (as CAUCHY-IRNB-2026). The blog says the real notebooks run server-side against production data; the interactive examples use synthetic data."

- id: security-incident-response-08
  title: An LLM agent walks provenance graphs back from an alert to root cause, with daily sampled human audit
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [research-synthesis, data-reporting, expert-judgment]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: "Provenance-based attack investigation (tracing the chain of system events behind an alert) breaks down in practice because dependency chains explode and causal chains are fragmented by missing events. The partner SOC processes tens of thousands of raw alerts daily and leaves thousands for manual triage, and the authors report that a legacy LLM investigation tool produced plausible but wrong reports that failed human verification."
  solution: "SherAgent iteratively queries and filters a provenance graph, uses an LLM to read unstructured context and threat intelligence, widens queries when events are missing and selects the next nodes to explore. The authors built it with the SOC of an unnamed large internet company, refining its existing LLM-based workflow, and report it running against live alerts with analysts spot-checking a daily sample."
  outcomes:
    - lever: quality
      description: "Human-verified investigation success in production versus the audited legacy baseline"
      figure: "above 96% versus 64.7%"
      measures: "Production: human-verified success in daily spot-checks of 10 cases a day, 980 cases in total (about 2% of 53,849 alerts processed). Baseline: manually audited success of the legacy tool in a January 2026 pilot; the paper says the legacy tool's self-reported rate was higher"
      provenance: self-reported
      source_ref: ARXIV-2607.09176
    - lever: cost
      description: "Cost and time per investigation"
      figure: "under USD 0.10 in API cost; under 4 minutes"
      measures: "Per investigation, as stated in the abstract; in the paper's user study human analysts need 10 to 20 minutes to triage and investigate a single high-severity alert (10 practitioners)"
      provenance: self-reported
      source_ref: ARXIV-2607.09176
  prerequisites:
    - "Provenance data (system audit events) with retention long enough to reach the earliest related events; the paper attributes some daily dips in success to events past retention limits (ARXIV-2607.09176, section 4.2)"
    - "A standing sampling process in which experienced analysts verify results against ground truth (ARXIV-2607.09176)"
  risks_and_guardrails:
    - "Use verified, not self-reported, accuracy: the legacy tool's reported success overstated its audited rate (ARXIV-2607.09176, section 1)"
    - "Preprint, not peer reviewed; the abstract (31.1% and 63.7% improvement) and the conclusion (34.9% and 67.5%) state different improvement figures, so quote the verified rates (ARXIV-2607.09176)"
    - "Treat raw log and artifact content as adversarial input to the LLM (USENIX-LOGINJECT-2026; ARXIV-2605.24421)"
  human_checkpoints:
    - "Daily human spot-check of 10 sampled investigations (ARXIV-2607.09176, section 4.2)"
    - "Analysts review the generated provenance graph before acting on it (ARXIV-2607.09176, section 4.5)"
  role_evolution: "Analysts move from hand-built query chains to verifying and correcting machine-built investigations; in the user study 5 of 10 participants said it saved them more than 10 minutes per investigation (ARXIV-2607.09176, section 4.5)."
  evidence_grade: C
  sources:
    - { ref: ARXIV-2607.09176, title: "SherAgent: Scaling Attack Investigation in the Wild via LLM-Empowered Iterative Query-Filter Backtracking", publisher: "arXiv (preprint; Li, Wang, Jiang, Shen et al.)", type: academic, url: "https://arxiv.org/abs/2607.09176", date: "2026-07-10", access: full, locator: "Abstract; section 1 (Figure 1 pilot); section 4.2; section 4.5 user study" }
    - { ref: USENIX-LOGINJECT-2026, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/karanjai", date: "2026-08", access: full, locator: "Abstract" }
    - { ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: "arXiv (Pandey, Bhujang)", type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "Abstract" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P05 (C), D07 (C) and G01 (B). Graded C, the majority view: the deploying SOC is described only as 'a major Internet corporation serving billions of users' (the author affiliation lists Tencent Security Keen Lab, but the text does not say whose SOC it is), so there is no named deployment even though this holds the module's best audit-style production data. Provenance marked self-reported because the audit figures describe the deployment's own spot-checks reported by its collaborators; P and D marked the abstract figures independent. Ladder: G's delegate/process kept because the agent owns the multi-step investigation with sampled review; P and D had augment/step."

- id: security-incident-response-09
  title: Rank likely root-cause code changes for operational incidents with a retrieval-plus-LLM system
  archetype: security
  module: incident-response
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: "Responders must build context on an investigation and find which of thousands of code changes caused it before they can mitigate (Meta)."
  solution: "Meta's system narrows thousands of changes to a few hundred with heuristics (such as code and directory ownership), then a fine-tuned Llama 2 7B ranker reduces them to a top five. Grafana reports an assistant that investigated an incident in parallel with on-call engineers using metrics, logging and tracing agents."
  outcomes:
    - lever: quality
      description: "Backtesting of root-cause identification at investigation creation time, web monorepo"
      figure: "42%"
      measures: "Accuracy in identifying root causes for investigations at their creation time related to Meta's web monorepo, in backtesting (the post does not define the denominator further)"
      provenance: self-reported
      source_ref: META-RCA-2024
    - lever: speed
      description: "One internal Grafana incident: the assistant found the root cause about eight minutes in, 20 minutes before the on-call team"
      figure: "3.5x faster (single incident)"
      measures: "Time to root cause for one Grafana Labs incident, AI assistant versus the on-call team"
      provenance: self-reported
      source_ref: GRAFANA-AIINC-2026
  prerequisites:
    - "Historical investigations with known root causes (Meta used about 5,000 instruction-tuning examples) (META-RCA-2024)"
  risks_and_guardrails:
    - "Meta notes the system can suggest wrong root causes and mislead engineers, so it uses closed feedback loops, explainability and confidence measures (META-RCA-2024)"
  human_checkpoints:
    - "Responders independently reproduce and validate the results (META-RCA-2024)"
  role_evolution: "Meta says the system is used to onboard engineers to investigations and to isolate root causes (META-RCA-2024)."
  evidence_grade: B
  sources:
    - { ref: META-RCA-2024, title: "Leveraging AI for efficient incident response", publisher: "Engineering at Meta", type: firm, url: "https://engineering.fb.com/2024/06/24/data-infrastructure/leveraging-ai-for-efficient-incident-response/", date: "2024-06-24", access: full, locator: "Opening summary; sections on root cause isolation, training and risks" }
    - { ref: GRAFANA-AIINC-2026, title: "A tale of two incident responses: How our AI assistant found the root cause 3.5x faster", publisher: "Grafana Labs", type: vendor, url: "https://grafana.com/blog/a-tale-of-two-incident-responses-how-our-ai-assist-helped-us-find-the-cause-3-5x-faster/", date: "2026-01-29", access: full, locator: "Body text" }
  last_reviewed: "2026-10-17"
  notes: "From P15. Both are reliability or engineering incidents, not security incidents, so the grade is capped at B even though Meta's 42% is a measured outcome from a named organisation. Meta's evidence is from June 2024, older than the 18-month window. Grafana is a vendor describing its own product on one incident."

- id: security-incident-response-10
  title: An agent harness reviews the source code behind an intrusion during an incident response engagement
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: full-population-testing
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: "During an incident, for example after corporate repositories are stolen, responders may need to review large code bases quickly to find exploitable flaws before attackers do, which is slow by hand (GTIG; Mandiant)."
  solution: "Google Threat Intelligence Group's Mandiant uses an Agentic Vulnerability Discovery Harness (AVDH), built on Google's Agent Development Kit and Gemini, in proactive reviews, penetration tests, red-team work and incident response. A deterministic pipeline chains specialist agents (threat modelling, entry-point discovery, enrichment, access-control and data-flow hypotheses under a consultant-set confidence filter), then validates and ranks findings for a human expert. Mandiant delivers it as a consulting service alongside human consultants."
  outcomes:
    - lever: speed
      description: "Critical findings in one incident response investigation of stolen corporate repositories"
      figure: "over 100 true-positive critical vulnerabilities in two days"
      measures: "Count of true-positive critical vulnerabilities in a single investigation; the post says this took a fraction of manual review time and gives no baseline, and does not say how true positives were established"
      provenance: self-reported
      source_ref: GTIG-AVDH-2026
  prerequisites:
    - "Source access for the affected application, plus asset inventories, SBOMs, architecture documentation and threat intelligence as agent context (GTIG-AVDH-2026)"
    - "Consultants who verify the threat model and triage findings (GTIG-AVDH-2026; MANDIANT-AIRR-2026)"
  risks_and_guardrails:
    - "Single-engagement vendor self-report with no independent validation (MANDIANT-AIRR-2026)"
    - "Early agents do minimal self-validation and are filtered by a consultant-configured confidence filter; the pipeline is deterministic to limit LLM non-determinism (GTIG-AVDH-2026)"
    - "Finding flaws is not fixing them; remediation quality is outside this entry"
  human_checkpoints:
    - "Consultant verifies the threat model before analysis continues; a human expert reviews the ranked findings (GTIG-AVDH-2026)"
  role_evolution: "Mandiant says consultants focus on complex custom logic flaws rather than scanning (MANDIANT-AIRR-2026)."
  evidence_grade: B
  sources:
    - { ref: GTIG-AVDH-2026, title: "Staying Ahead of Adversarial AI Through Agentic Source Code Review", publisher: "Google Cloud Blog (Google Threat Intelligence Group / Mandiant)", type: firm, url: "https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review", date: "2026-08-18", access: full, locator: "Results after 10 months of use; pipeline description; threat model approval gate (as read by the application-security practice researcher)" }
    - { ref: MANDIANT-AIRR-2026, title: "AI Risk and Resilience in 2026: A Mandiant Special Report", publisher: "Mandiant / Google Cloud", type: vendor, url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026", date: "2026-09", access: full, locator: "Section 'Securing the AI SDLC and pipeline supply chain', final paragraphs" }
  last_reviewed: "2026-10-17"
  notes: "Merged from G12 (C) and the item routed here by the application-security practice and vulnerability-exposure discourse files (GTIG-AVDH-2026; the latter called it MANDIANT-AVDH-2026). The application-security practice file graded the harness A on its wider results (12 CVEs); for this module's IR use the only figure is a single-engagement count with no stated verification method, so it is graded B here. The harness's main home is application-security; this entry covers only its use inside an incident."

- id: security-incident-response-11
  title: Verify AI investigation findings and harden the tools against attacker-controlled logs and artifacts
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance, research-synthesis, software-systems]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: "Generative AI can state plausible but false facts about artifacts, and tool-using agents dismiss attack alerts when searches return nothing. The data an investigation tool reads (log fields, phishing emails, incident notes, forensic artifacts) is often attacker-controlled, so it can tell the model what to conclude: hide activity, create false positives or hijack the output."
  solution: "Practitioners combine deterministic existence checks that confirm items the AI cites are in the original data, confirmation against other deterministic sources and an independent judging model, with verification effort set by the stakes of the case (Cyber Triage). Researchers add an explicit proposed decision, a challenge made in a separate reasoning context, stronger evidence before dismissal and an append-only investigation ledger (ALERT-BENCH/AIDA). Raw log and artifact content is treated as adversarial input: input filtering, prompt hardening, output validation, constrained outputs, least privilege and human verification (USENIX; NTT DATA; NIST key practices)."
  outcomes:
    - lever: risk
      description: "Attack success against LLM log analysis at baseline, and the effect of layered defences"
      figure: "up to 88.2% (83.4% average) at baseline; 90.4% reduction, 8.4% residual"
      measures: "Attack success on LogInject-1.0 (12,847 log entries including 2,569 adversarial samples, three production LLMs, four attack objectives); reduction when input filtering, prompt hardening and output validation are combined"
      provenance: independent
      source_ref: USENIX-LOGINJECT-2026
    - lever: risk
      description: "Average injection success, naive prompting versus the strongest defence"
      figure: "26.6% to 11.8%"
      measures: "Average across 48 strategy-defence-task combinations with gpt-4o-mini as the analyst; summarisation reached 96% injection success with context manipulation and no defences"
      provenance: independent
      source_ref: ARXIV-2605.24421
    - lever: quality
      description: "Missed attacks before and after adding a challenge step and stronger dismissal rules (SOC triage benchmark, adjacent to IR)"
      figure: "every studied approach missed at least 40.4%; AIDA 3.1% (F1 0.958), escalating 18.4% of alerts"
      measures: "Share of attack-related alerts missed across 1,247 alerts from one multi-stage scenario replayed through a live SIEM (ALERT-BENCH); AIDA is the authors' own design, compared by the authors"
      provenance: independent
      source_ref: ARXIV-2610.10608
  prerequisites:
    - "Original data retained so cited items can be re-queried (CYBERTRIAGE-HALLU-2026)"
    - "An inventory of every place an LLM or retrieval system ingests external text (alerts, tickets, emails, reports) (FIRST-CON-2026, CyCraft session)"
    - "Red-teaming of monitors and analyst assistants with humans and AI (NIST-KEYPRACTICES-2026, practice 4.1)"
  risks_and_guardrails:
    - "Defences reduce but do not remove the attack surface (USENIX-LOGINJECT-2026; ARXIV-2605.24421)"
    - "A deterministic mock analyst mispredicted real model behaviour, so test on the real model (ARXIV-2605.24421)"
    - "A judging LLM can catch reasoning errors but may share the first model's knowledge gaps (CYBERTRIAGE-HALLU-2026)"
    - "Structured data is not immune: NTT DATA reports injection against structured forensic data in DFIR environments, naming Velociraptor's MCP integration and Timesketch's AI Summary as tools adopting LLMs; CyCraft says one attacker-crafted item can steer SOC and CSIRT tools (FIRST-CON-2026)"
    - "Treat monitored model output as potentially exploit-bearing (NIST-KEYPRACTICES-2026, practice 4.2)"
    - "Single-scenario benchmark and preprints; results may not transfer (ARXIV-2610.10608)"
  human_checkpoints:
    - "Cyber Triage suggests a low-severity alert can tolerate little human checking, a medium one needs a human to review the timeline, and a criminal case needs a human to verify every item (CYBERTRIAGE-HALLU-2026)"
    - "Analysts take the escalated alerts (18.4% in the AIDA run) (ARXIV-2610.10608)"
  role_evolution: "Responders become reviewers who must know how to challenge AI output; a SANS instructor asks where that expertise will come from if AI takes over junior-level work (SANS-SIMON-2026). The tooling itself adds red-team and detection-engineering work (NIST-KEYPRACTICES-2026, practice 4.1)."
  evidence_grade: C
  sources:
    - { ref: USENIX-LOGINJECT-2026, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation (USENIX Security '26)", publisher: "USENIX Association", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/karanjai", date: "2026-08", access: full, locator: "Abstract" }
    - { ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: "arXiv (Pandey, Bhujang)", type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "Abstract" }
    - { ref: ARXIV-2610.10608, title: "From Investigation Failures to Reliable SOC Agents: Understanding and Improving LLM-Based Alert Triage (ALERT-BENCH, AIDA)", publisher: "arXiv (Tsegai, Kantchelian, Yao et al.)", type: academic, url: "https://arxiv.org/abs/2610.10608", date: "2026-10-07", access: full, locator: "Abstract" }
