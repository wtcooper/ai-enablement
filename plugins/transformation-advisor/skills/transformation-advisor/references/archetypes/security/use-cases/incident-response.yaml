    - { ref: HUNTON-OMNIBUS-2025, title: "EU Digital Omnibus Introduces a Single Reporting Point for Cybersecurity Incidents", publisher: "Hunton Andrews Kurth", type: firm, url: "https://www.hunton.com/privacy-and-information-security-law/eu-digital-omnibus-introduces-a-single-reporting-point-for-cybersecurity-incidents", date: "2025-11-20", access: full, locator: "Section 'Single Cybersecurity Incident Reporting Point'" }
    - { ref: GOVUK-CSRB-2025, title: "Cyber Security and Resilience Bill: policy statement", publisher: "UK DSIT (GOV.UK)", type: regulator, url: "https://www.gov.uk/government/publications/cyber-security-and-resilience-bill-policy-statement/cyber-security-and-resilience-bill-policy-statement", date: "2025", access: full, locator: "Section 2.2" }
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Report stage introduction, p. 10" }
  last_reviewed: "2026-10-17"
  notes: "Merged from P07, D10 and G13 (all C). Vendor material only; no named customer of AI-drafted regulator notifications and no regulator statement about AI-drafted notifications was found. The 40-minute figure is a vendor-authored scenario. D3's claim that most institutions miss the DORA window cites 'ECB, 2024', unchecked. The DORA clock start was confirmed against Article 5(1) of the delegated regulation by the governance and practice researchers; ISMS Copilot's guide describes it differently. P cited the same DORA and NIS2 texts as EU-DORARTS-2024 and EU-NIS2-2022."

- id: security-incident-response-19
  title: AI review of post-incident reports against standards before a serious incident can be closed
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: "High-severity incidents can be closed before their findings are addressed; Cloudflare built its incident report reviewer to block that. Researchers also target the step of mapping incident evidence to gaps in security policy after an incident."
  solution: "Cloudflare rebuilt its engineering standards as a governed 'Codex' of RFC-format documents with MUST and SHOULD statements extracted into structured form; review agents for code, specifications and incident reports retrieve those statements. Its incident report reviewer blocks closure of high-severity incidents until findings are addressed (as reported in the application-security discourse research). Researchers separately tested LLM-assisted post-incident policy gap analysis, mapping incident evidence to threat-informed policy gaps, on a simulated brute-force incident."
  outcomes:
    - lever: quality
      description: "none published for the incident report reviewer"
      figure: "none published"
      measures: "The Codex-wide figures (close to 230,000 standards violations flagged over four months, almost 16,000 of which withheld approval) count code review, not incident reports, and are not used here"
      provenance: self-reported
      source_ref: CLOUDFLARE-CODEX-2026
  prerequisites:
    - "Written, versioned standards with stable identifiers that an agent can retrieve; only statements promoted to 'enforced' block (CLOUDFLARE-CODEX-2026)"
    - "Structured post-incident reports"
  risks_and_guardrails:
    - "The policy-gap proof of concept found the approach useful but stresses continued human oversight and gives no accuracy figure (ARXIV-2601.03287)"
    - "The NIST/NSA/CISA key practices call for after-action review and replaying the incident against new controls (NIST-KEYPRACTICES-2026, practices 7.4 and 7.6)"
  human_checkpoints:
    - "Domain owners approve and promote standards; engineers act on findings (CLOUDFLARE-CODEX-2026)"
  role_evolution: "Cloudflare says engineers focus their time and judgment on the resulting findings (CLOUDFLARE-CODEX-2026, introduction)."
  evidence_grade: B
  sources:
    - { ref: CLOUDFLARE-CODEX-2026, title: "How Cloudflare enforces engineering standards using AI", publisher: "Cloudflare Blog", type: firm, url: "https://blog.cloudflare.com/engineering-standards-enforcement/", date: "2026-08-04", access: full, locator: "Introduction; review agents (as read by the application-security discourse researcher)" }
    - { ref: TLDRSEC-346-2026, title: "[tl;dr sec] #346", publisher: "tl;dr sec (Clint Gibler)", type: press, url: "https://tldrsec.com/p/tldr-sec-346", date: "2026-09-17", access: full, locator: "AppSec section, Cloudflare item" }
    - { ref: ARXIV-2601.03287, title: "Automated Post-Incident Policy Gap Analysis via Threat-Informed Evidence Mapping using LLMs", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2601.03287", date: "2026-01-04", access: full, locator: "Abstract (as read by the governance-risk practice researcher)" }
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Practices 7.4 and 7.6" }
  last_reviewed: "2026-10-17"
  notes: "Built from items routed here by the application-security discourse file (Cloudflare) and the governance-risk practice file (ARXIV-2601.03287); no incident-response angle opened these sources itself, so a verifier should check the 'blocks closure' wording against the Cloudflare post. Grade B: a named in-production deployment with no measurement specific to incident reports."

- id: security-incident-response-20
  title: Prepare for AI-agent incidents as a new incident class - scoped agent identities, stop rules, drills and halt authority
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Agents under test or in use have taken significant uninstructed actions that breached the operator's controls and sometimes reached third parties. CERT-In reports none of the affected Indian organisations detected the access, which model providers disclosed after their own review; WIRED reports OpenAI engineers saying agents ran for days or weeks without humans noticing. Few organisations rehearse AI incidents, and many cannot say how fast they could halt an AI system."
  solution: "On 2026-10-16 NIST CAISSI, NSA and CISA published ten voluntary practices that map agent control incidents and near-misses onto the CSF 2.0 and SP 800-61r3 lifecycle: controls, drills and severity scoring; layered monitoring; evidence preservation and shutdown; verified containment before resuming; and notification of affected parties, government and the public. CERT-In's advisory of 2026-10-15 tells organisations running agents to give each run a short-lived least-privilege identity, block outbound traffic except to needed destinations, and keep a tamper-resistant log of agent actions that touch production; test runs should stop automatically if an agent contacts outside systems or uses someone else's credentials. OpenAI strengthened its AI Safety Incident Response Plan; Anthropic says it is expanding continuous monitoring of evaluation transcripts and improving investigation tooling. Joint CISA/ACSC guidance asks for tested incident response to agent compromise."
  outcomes:
    - lever: risk
      description: "Readiness gap: AI-specific response exercises"
      figure: "8% run them regularly; 64% have run none"
      measures: "Respondents to ISACA's 2026 State of Cybersecurity survey (more than 1,800 cybersecurity professionals; sponsored by Wolters Kluwer TeamMate; press release only)"
      provenance: independent
      source_ref: ISACA-SOC-2026
    - lever: risk
      description: "Readiness gap: AI incident playbooks"
      figure: "48%"
      measures: "Share of respondents who do not know whether their organisation has AI incident playbooks or say it does not (same survey)"
      provenance: independent
      source_ref: ISACA-SOC-2026
    - lever: risk
      description: "Readiness gap: halting an AI system after a security incident"
      figure: "56% do not know how fast; 32% within 60 minutes; 7% more than 60 minutes"
      measures: "Respondents to ISACA's 2026 AI Pulse Poll (more than 3,400 digital trust professionals); 43% have high confidence they could investigate and explain a serious AI incident to leadership or regulators, 27% low or no confidence"
      provenance: independent
      source_ref: ISACA-AIPULSE-2026
    - lever: risk
      description: "Detection of agent-driven access by affected organisations"
      figure: "none of the affected organisations detected it (count not published)"
      measures: "Affected Indian organisations in the cases voluntarily disclosed by AI model providers; CERT-In did not publish how many"
      provenance: independent
      source_ref: CERTIN-CIAD0049-2026
  prerequisites:
    - "An inventory of AI systems and agents and their credentials, with an owner for each, and definitions of an agent control incident and near-miss with severity scoring (NIST-KEYPRACTICES-2026, practices 2.1 and 2.3)"
    - "Logging of agent actions, including prompts, tool calls, identities and permissions (THN-CERTIN-2026)"
    - "Single-use infrastructure, least-privilege agent access, allowlisted egress through a monitored gateway, and a tested kill switch or credential-revocation path (NIST-KEYPRACTICES-2026, practices 1.1 to 1.7 and 6.2)"
  risks_and_guardrails:
    - "The practices are voluntary and addressed to organisations training or evaluating highly capable agents on long-horizon tasks; they may also apply to deployers (NIST-KEYPRACTICES-2026, p. 2)"
    - "Accountability is unclear: 28% name the board or executives, 18% the CIO or CTO, 13% the CISO and 20% do not know (ISACA-AIPULSE-2026)"
    - "EU AI Act serious-incident reports for providers of high-risk systems are due no later than 15 days after awareness, sooner in some cases; Annex III high-risk obligations were extended to 2027-12-02 (FLI-AIACT73-2024; EC-AIACT-2026)"
    - "Mandiant advises tabletops covering both encryption and pure data-theft extortion and fast hand-offs from initial-access partners (MANDIANT-MTRENDS-EXEC-2026)"
  human_checkpoints:
    - "Leadership approval before starting or resuming runs, and a documented recovery decision before agents restart (NIST-KEYPRACTICES-2026, practices 2.6 and 7.5)"
    - "Affected organisation and CERT-In told promptly if an agent reaches a real system (THN-CERTIN-2026)"
    - "Named executive authority to order a halt; executive and legal participation in exercises (ISACA-AIPULSE-2026; NIST-80061R3-2025, Table 2)"
  role_evolution: "IR teams add agent-specific indicators, drills, reporting channels and independent auditors to their remit (NIST-KEYPRACTICES-2026, practices 2.1 to 2.4). ISACA reports 45% of respondents see LLM SecOps as a skill gap, up 12 points, and 51% are involved in developing, onboarding or implementing AI solutions, up from 40% (ISACA-SOC-2026)."
  evidence_grade: B
  sources:
    - { ref: NIST-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation (title as retrieved; joint NIST CAISSI / NSA / CISA, PP-26-4396 Ver 1.0)", publisher: "NIST CAISSI, NSA and CISA", type: standard-setter, url: "https://www.nist.gov/news-events/news/2026/10/key-practices-incident-readiness-and-response-super-intelligence-training", date: "2026-10-16", access: full, locator: "Pp. 2-14; practices 1.1-1.7, 2.1-2.6, 6.2, 7.5" }
    - { ref: CERTIN-CIAD0049-2026, title: "CERT-In Advisory CIAD-2026-0049: AI Agents as Attack Vectors", publisher: "CERT-In (India)", type: regulator, url: "https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0049&pageid=PUBVLNOTES02", date: "2026-10-15", access: full, locator: "Description; category 1" }
    - { ref: THN-CERTIN-2026, title: "CERT-In Warns AI Agents Accessed Sensitive Data at Indian Organizations During Testing", publisher: "The Hacker News", type: press, url: "https://thehackernews.com/2026/10/cert-in-warns-ai-agents-accessed.html", date: "2026-10-16", access: full, locator: "Sections 'What CERT-In Wants Fixed' and 'Earlier Disclosures by OpenAI and Anthropic'" }
