- id: security-incident-response-17
  title: Draft incident summaries and executive updates from the case record, with the incident commander editing
  archetype: security
  module: incident-response
  function: service-delivery
  work_types: [document-production, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Incident commanders spend close to an hour (more for complex cases) writing summaries for executives, leads and partner teams from free text, logs, impact notes and timelines scattered across the case (Google)."
  solution: "A 'Generate Summary' control in Google's incident tool pre-fills a draft from structured case fields; the responder accepts, edits or discards it. Inputs are tagged to mirror the incident communication template, long log and code sections are replaced by placeholders, and the model is not called when the input is under 200 tokens. A follow-on experiment drafted executive communications (summary, root cause, impact, mitigation). Vendor consoles now ship similar features: Microsoft documents an incident summary for incidents of up to 100 alerts and a consolidated incident report."
  outcomes:
    - lever: speed
      description: "Time saved per incident summary drafted with the LLM versus written by a human"
      figure: "51%"
      measures: "Reduction in time per incident summary, LLM-drafted versus human-written (sample of 300 summaries, per the post's chart caption)"
      provenance: self-reported
      source_ref: GOOGLE-IRGENAI-2024
    - lever: quality
      description: "Blind comparison of 50 human-written and 50 LLM-written summaries rated by security teams"
      figure: "LLM summaries rated 10% higher"
      measures: "Reviewer rating of LLM-written versus human-written summaries, author not disclosed to raters"
      provenance: self-reported
      source_ref: GOOGLE-IRGENAI-2024
    - lever: speed
      description: "Executive communications drafted for the incident commander (an experiment, not the summary tool)"
      figure: "53%"
      measures: "Reduction in time incident commanders spent writing executive summaries, with quality 'at least on-par' for factual accuracy and writing guidelines"
      provenance: self-reported
      source_ref: GOOGLE-IRGENAI-2024
  prerequisites:
    - "Structured incident records that mirror the communication template (title, actions taken, impact, mitigation history) (GOOGLE-IRGENAI-2024)"
    - "A pipeline with logging off and no use of inputs or outputs for retraining, because incidents hold confidential, sensitive and privileged data (GOOGLE-IRGENAI-2024)"
    - "Human-written example summaries to include in the prompt (GOOGLE-IRGENAI-2024)"
  risks_and_guardrails:
    - "Every draft must be reviewed by a human; Google also notes humans can misread an LLM statement (GOOGLE-IRGENAI-2024)"
    - "Hallucination when the input is small relative to the prompt, fixed by not calling the model below 200 tokens (GOOGLE-IRGENAI-2024)"
    - "Earlier prompt versions drew conclusions on hypotheses and struggled to stick to the latest updates (GOOGLE-IRGENAI-2024)"
  human_checkpoints:
    - "Responder accepts, edits or discards the draft before it is added to the incident (GOOGLE-IRGENAI-2024)"
  role_evolution: "The incident commander moves from writing each update to reviewing and correcting a draft, and keeps accountability for what is sent (GOOGLE-IRGENAI-2024, 'Workflow integration')."
  evidence_grade: A
  sources:
    - { ref: GOOGLE-IRGENAI-2024, title: "Accelerating incident response using generative AI", publisher: "Google Online Security Blog", type: firm, url: "https://security.googleblog.com/2024/04/accelerating-incident-response-using.html", date: "2024-04-26", access: full, locator: "Sections 'Humans vs. LLMs', 'Workflow integration', 'Quantitative wins', 'Evolving to more complex use cases'" }
    - { ref: MS-LEARN-DEFENDERCOPILOT-2026, title: "Describe Copilot in Microsoft Defender XDR", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/training/modules/security-copilot-embedded-experiences/2-copilot-for-defender", date: "2026-05-01", access: full, locator: "Sections 'Summarize incidents' and 'Create incident reports'" }
  last_reviewed: "2026-10-17"
  notes: "From P01. Grade A meets the 2026-10-17 rule: Google reports figures from a measured comparison (300 summaries; 50 vs 50 blind rating). The evidence is from April 2024, older than the 18-month window, and Google's own and unreplicated; kept as the module's best measured case. The Microsoft page is product documentation with no outcome figures or named customer."

- id: security-incident-response-18
  title: Draft regulator and authority notifications from case evidence inside parallel reporting clocks, with people approving every filing
  archetype: security
  module: incident-response
  function: risk-compliance-legal
  work_types: [document-production, review-assurance, coordination-scheduling]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: "Reporting clocks start before forensic work is complete and run in parallel. DORA: initial report within four hours of classifying an incident as major and no later than 24 hours from awareness. NIS2: early warning within 24 hours, notification within 72 hours, final report within one month. Cyber Resilience Act: 24-hour and 72-hour steps for manufacturers, applying from 11 September 2026. SEC Form 8-K Item 1.05: four business days after a materiality determination. CERT-In: reporting within 6 hours. EU AI Act Article 73 adds serious-incident reports for high-risk AI providers."
  solution: "A SOC vendor (D3 Security) markets an AI investigation product that classifies incidents and populates DORA report templates for review and approval, and says its Morpheus AI assembles NIS2 early warnings, 72-hour updates and final reports from evidence captured in the case. Its DORA whitepaper walks through an illustrative case ending in filing to two authorities about 40 minutes after the alert, with the analyst reviewing for about three minutes. A compliance-copilot vendor (ISMS Copilot) publishes prompts for DORA incident classification, notification templates and root-cause analysis. Microsoft's consolidated incident report assembles the factual record notifications draw on."
  outcomes:
    - lever: speed
      description: "Vendor scenario of alert-to-regulatory-filing time (illustrative walkthrough, not a customer result)"
      figure: "about 40 minutes (scenario)"
      measures: "Elapsed time from alert to filing in the vendor's worked example, versus about 1.25 hours before an analyst reached a likely-critical determination in its manual example"
      provenance: vendor-published
      source_ref: D3-DORA-2026
  prerequisites:
    - "Structured, time-stamped case evidence and a decision log recording when the organisation became aware and when severity was classified, since clocks start from those moments (EUR-LEX-DORA301-2025; EUR-LEX-NIS2-2022)"
    - "A matrix of which regimes apply to which incident, a classification rule set a person can check, and a named owner for authority communications (D3-DORA-2026)"
    - "An ICT asset inventory with criticality classifications and existing incident procedures (ISMSCOPILOT-DORA-2026)"
  risks_and_guardrails:
    - "D3 itself says classification as critical needs human review and approval before filing, because false-positive reports damage regulator trust (D3-DORA-2026, 'Honest Assessment')"
    - "Legal determinations ('significant', 'major', 'material') stay with people; NIS2 defines significance in Article 23(3) (EUR-LEX-NIS2-2022; SEC-CYBER-2023)"
    - "US rules are unsettled: trade groups urged rescission of Item 1.05 on 2026-04-10 with no final action found, and the CIRCIA final rule was still at town-hall stage in May 2026, so CIRCIA reporting is not yet required (SIFMA-SEC-2026; FR-CIRCIA-2026; CISA-CIRCIA-2026)"
    - "An EU single reporting point managed by ENISA is at proposal stage; a UK bill would add 24-hour and 72-hour reporting (HUNTON-OMNIBUS-2025; GOVUK-CSRB-2025)"
    - "The NIST/NSA/CISA key practices say reporting is not a final phase but runs throughout the incident (NIST-KEYPRACTICES-2026, p. 10)"
  human_checkpoints:
    - "Analyst or incident commander approves classification; legal and the accountable executive approve every external submission (D3-DORA-2026)"
  role_evolution: "Not described in the sources beyond the approval step."
  evidence_grade: C
  sources:
    - { ref: D3-DORA-2026, title: "DORA Compliance on Autopilot: How AI-Autonomous SOC Operations Meet Every ICT Risk Requirement", publisher: "D3 Security", type: vendor, url: "https://d3security.com/resources/automating-dora-compliance/", date: "2026-03-23", access: full, locator: "Executive text; worked example; 'Honest Assessment'" }
    - { ref: D3-NIS2-2026, title: "What Is the NIS2 Directive? (vendor glossary page describing Morpheus AI)", publisher: "D3 Security", type: vendor, url: "https://d3security.com/glossary/nis2-directive/", date: "2026-04-18", access: full, locator: "Paragraph on the autonomous SOC" }
    - { ref: ISMSCOPILOT-DORA-2026, title: "How to implement DORA incident reporting using AI", publisher: "ISMS Copilot", type: vendor, url: "https://ismscopilot.hc.ferndesk.com/how-to-implement-dora-incident-reporting-using-ai-altze", date: "2026-03-03", access: full, locator: "Overview and 'Before you begin' (text mirror)" }
    - { ref: MS-LEARN-DEFENDERCOPILOT-2026, title: "Describe Copilot in Microsoft Defender XDR", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/training/modules/security-copilot-embedded-experiences/2-copilot-for-defender", date: "2026-05-01", access: full, locator: "Section 'Create incident reports'" }
