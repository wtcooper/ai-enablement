- id: security-identity-access-14
  title: Machine-learning risk scoring of sign-ins and sessions, with automatic step-up, block or session termination
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [research-synthesis, transaction-processing]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Policies evaluated only at sign-in miss session hijacking and token theft later in the session; Okta cites 1.9
    billion session cookies stolen from Fortune 1000 employees in 2022, from a SpyCloud report (OKTA-ITP-2026). NIST IR
    8587 addresses forgery, theft and misuse of the tokens and assertions behind single sign-on, federation and API
    access, citing threats shown in recent high-profile attacks (NIST-IR8587-2026, abstract). In a vendor survey 97% say fragmented identity tools add time to identity incidents, averaging
    12 hours (PANW-IDLANDSCAPE-2026, Chapter 2).
  solution: >-
    Identity platforms compute sign-in and user risk from detections such as anomalous tokens, atypical travel, anonymous
    or malicious IP addresses and suspicious MFA approvals, some in real time and some offline, and feed policy that can
    require step-up or block (MSFT-ENTRAIDP-2026). Okta Identity Threat Protection keeps evaluating the session against
    risk signals (its risk engine, device context, EDR and third-party signals through the Shared Signals Framework); an
    entity risk policy can run a delegated flow, require re-authentication or end the session across apps through
    Universal Logout. Microsoft is adding user-risk and device-revocation signals to continuous access evaluation in Global Secure
    Access (preview, October 2026).
  outcomes:
    - {lever: capacity, description: "A customer quote on time freed from threat investigation (organisation not named)", figure: "hours of daily investigation (qualitative)", measures: "Quote from an IT Systems Engineer on Okta's product page; no measurement and no organisation named", provenance: vendor-published, source_ref: OKTA-ITP-2026}
    - {lever: speed, description: "Baseline, not an AI effect: added time per identity incident from tool fragmentation", figure: "12 hours per incident (average)", measures: "Average added time per identity-related incident among the 97% of 2,930 respondents who say fragmentation adds time; vendor-commissioned survey fielded March-April 2026", provenance: vendor-published, source_ref: PANW-IDLANDSCAPE-2026}
  prerequisites:
    - "Integrated EDR or other security-event providers that support the Shared Signals Framework; apps configured for Universal Logout (OKTA-ITPDOCS-2026)"
    - "A configured entity risk policy per user group and risk level (OKTA-ITPDOCS-2026)"
    - "A tier of the identity platform that includes the premium detections; the free tier shows only a generic 'additional risk detected' entry (MSFT-ENTRAIDP-2026)"
    - "Token issuance, validation and lifecycle controls aligned with NIST IR 8587 (CISA-IR8587-2026; NIST-IR8587-2026)"
  risks_and_guardrails:
    - "Response can be graded rather than a block: on-demand MFA, read-only access via workflows, or session end (OKTA-ITP-2026)"
    - "Actions follow policies the customer configures (OKTA-ITPDOCS-2026, 'How it works')"
    - "Residual risk sits in account bootstrapping: attackers who pass weaker enrolment can self-provision their own phishing-resistant factor (OKTA-TI-2026)"
    - "In the survey only 45% include forced MFA step-up, 41% token or key revocation and 36% termination of privileged sessions among incident-response actions; 51% include password reset (PANW-IDLANDSCAPE-2026, Figure 5)"
    - "Push-based MFA is exposed to fatigue attacks and SIM swap; CISA advises FIDO/WebAuthn or PKI-based MFA (CISA-AA23-320A-2025, Mitigations)"
  human_checkpoints:
    - "Admins monitor the user risk profile, dashboard and System Log; response flows are delegated to workflows the customer defines (OKTA-ITPDOCS-2026)"
    - "An administrator can confirm a user as compromised, which is itself a detection input (MSFT-ENTRAIDP-2026)"
  role_evolution: >-
    Okta and Elastic are hiring product and engineering leaders for identity threat detection and response; Elastic's
    posting asks for fluency in anomaly detection, LLMs and agentic systems (ELASTIC-JOB-ITDR-2026; OKTA-JOB-ITP-2026).
    The survey ties slow response to console fragmentation (PANW-IDLANDSCAPE-2026, Chapter 2).
  evidence_grade: C
  sources:
    - {ref: OKTA-ITP-2026, title: "Identity Threat Protection with Okta AI (product page; undated, date shown is retrieval date)", publisher: Okta, type: vendor, url: "https://www.okta.com/products/identity-threat-protection/", date: "2026-10-17", access: full, locator: "Product page: benefits, FAQ and customer quote"}
    - {ref: OKTA-ITPDOCS-2026, title: "Identity Threat Protection (Identity Engine documentation; undated, date shown is retrieval date)", publisher: Okta Help Center, type: vendor, url: "https://help.okta.com/oie/en-us/content/topics/itp/overview.htm", date: "2026-10-17", access: full, locator: "Overview: 'How it works'; Benefits; Entity risk policy"}
    - {ref: MSFT-ENTRAIDP-2026, title: "What are risk detections? Microsoft Entra ID Protection", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks", date: "2026-04-22", access: full, locator: "Risk detection tables"}
    - {ref: MSFT-ENTRAWN-2026, title: "What's new in Microsoft Entra: October 2026", publisher: "Microsoft Tech Community, Microsoft Entra Blog", type: vendor, url: "https://techcommunity.microsoft.com/blog/microsoft-entra-blog/what%E2%80%99s-new-in-microsoft-entra-october-2026/4556460", date: "2026-10-12", access: full, locator: "'Device signals added to Continuous Access Evaluation (CAE) in Global Secure Access' (public preview)"}
    - {ref: CISA-IR8587-2026, title: "CISA and NIST Release Guidelines to Protect Federal Cloud Identity Systems from Token Theft, Forgery, and Misuse", publisher: CISA, type: regulator, url: "https://www.cisa.gov/news-events/news/cisa-and-nist-release-guidelines-protect-federal-cloud-identity-systems-token-theft-forgery-and", date: "2026-09", access: full, locator: "Body of press release"}
    - {ref: NIST-IR8587-2026, title: "NIST IR 8587: Protecting Tokens and Assertions from Forgery, Theft, and Misuse", publisher: NIST, type: standard-setter, url: "https://csrc.nist.gov/pubs/ir/8587/final", date: "2026-09-15", access: full, locator: "Abstract"}
    - {ref: PANW-IDLANDSCAPE-2026, title: "2026 Identity Security Landscape (research by Vanson Bourne, n=2,930)", publisher: Palo Alto Networks, type: survey, url: "https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/reports/2026-identity-security-landscape-report.pdf", date: "2026-06", access: full, locator: "Chapter 2, pp. 12-14, Figure 5"}
    - {ref: CISA-AA23-320A-2025, title: "Scattered Spider (joint advisory AA23-320A, updated 2025-07-29)", publisher: CISA with FBI and international partners, type: regulator, url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a", date: "2025-07-29", access: full, locator: "Mitigations"}
    - {ref: OKTA-TI-2026, title: "New speed, same tricks: Defend against AI threats with security fundamentals (B. Winterford, Okta Threat Intelligence)", publisher: Okta Newsroom, type: vendor, url: "https://www.okta.com/newsroom/articles/new-speed-same-tricks-defend-against-ai-threats-with-security-fundamentals/", date: "2026-10-07", access: full, locator: "Residual risk (account bootstrapping)"}
    - {ref: ELASTIC-JOB-ITDR-2026, title: "Principal Product Manager - Identity Threat Detection & Response (job posting 8102960)", publisher: Elastic, type: job-posting, url: "https://jobs.elastic.co/jobs?gh_jid=8102960", date: "2026-08-11", access: full, locator: "Role summary and 'AI and ML Fluency'"}
    - {ref: OKTA-JOB-ITP-2026, title: "Manager, Engineering - Identity Threat Protection (job posting 8242296)", publisher: Okta, type: job-posting, url: "https://www.okta.com/company/careers/opportunity/8242296?gh_jid=8242296", date: "2026-10-15", access: full, locator: "Role summary"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 08 (automate, process) and governance 06 (augment, process). Kept as automate: configured
    policies act without a person on the normal path. Okta's documentation describes rules, risk scoring and signal
    sharing but not model types, so the 'AI' label comes from Okta's marketing. No named customer or detection-quality
    figures (false positives, time to revoke) were found. The CISA press release date differs across angles (2026-09,
    2026-09-09, 2026-09-15); the month is used here. The CISA site blocked access at verification (2026-10-17), so the
    problem statement now rests on the NIST IR 8587 abstract; CISA's Scattered Spider mitigations were checked in the
    FBI-hosted copy of the same advisory (https://www.ic3.gov/CSA/2025/250729.pdf). Search-only summaries of Microsoft's Digital Defense Report 2025
    say over 97% of identity attacks are password spray or brute force (MSFT-DDR-2025); not used as evidence.

- id: security-identity-access-15
  title: Closed-loop identity threat response that acts on high-confidence detections without a ticket
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [transaction-processing]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Identity attacks are detected quickly but response waits in a human queue. In SANS's 2026 survey of identity threat
    detection and response (ITDR), 68% detect identity attacks within 24 hours but 55% contain them in that window
    (SANS-ITDR-2026). Palo Alto Networks describes a ticket hand-off between the SOC and the identity team as a
    structural flaw (PANW-IDSECOPS-2026).
  solution: >-
    Netwrix describes ITDR automation as running pre-defined responses (disable the account, block the protocol
    operation, force re-authentication, trigger SOAR playbooks) the moment high-confidence thresholds are met, rolled out
    in stages with audit-mode testing and two thresholds per rule (act automatically vs route to a person). Palo Alto
    Networks proposes 'IdentitySecOps', joining identity posture, detection, response and learning in one loop with
    shared context.
  outcomes:
    - {lever: speed, description: "Gap between detecting and containing identity attacks (the problem baseline, not a result of a fix)", figure: "68% detect within 24 hours; 55% contain within the same window", measures: "Share of surveyed organizations that detect identity attacks within 24 hours, and share that contain them in that window (SANS 2026 ITDR survey; respondent count not stated on the page)", provenance: independent, source_ref: SANS-ITDR-2026}
  prerequisites:
    - "An identity attack-surface inventory and clean posture baseline before enabling automation, because untuned rules produce false positives and programmes then stay detection-only (NETWRIX-ITDR-2026)"
    - "Structured alerts (attack type, accounts, timeline, confidence score) that SOAR playbooks can use (NETWRIX-ITDR-2026)"
  risks_and_guardrails:
    - "Start with well-defined, near-zero-false-positive attack patterns and expand to behavioural rules later; enabling response on untuned behavioural rules leads to alert fatigue (NETWRIX-ITDR-2026, best practice 2)"
    - "Test blocking in audit mode so legitimate admin workflows are not blocked (NETWRIX-ITDR-2026, best practice 4)"
  human_checkpoints:
    - "A second, lower threshold routes to a human review queue (NETWRIX-ITDR-2026, best practice 3)"
  role_evolution: >-
    Palo Alto Networks says identity and security operations should share context, response and accountability
    (PANW-IDSECOPS-2026, 'IdSecOps Connects Detection and Response').
  evidence_grade: C
  sources:
    - {ref: SANS-ITDR-2026, title: "SANS 2026 State of Identity Threat Detection and Response: Key Findings", publisher: SANS Institute, type: survey, url: "https://www.sans.org/research/identity-threat-detection-response-report", date: "2026-03", access: full, locator: "'Key Findings' and 'FAQs' (landing page; report not read)"}
    - {ref: NETWRIX-ITDR-2026, title: "ITDR automation best practices for security teams", publisher: Netwrix, type: vendor, url: "https://www.netwrix.com/en/resources/blog/itdr-automation-best-practices/", date: "2026-06-05", access: full, locator: "Seven best practices"}
    - {ref: PANW-IDSECOPS-2026, title: "IdentitySecOps for AI-Speed Defense", publisher: Palo Alto Networks (Idira blog), type: vendor, url: "https://www.paloaltonetworks.com/blog/identity-security/identitysecops-closed-loop-model-ai-speed-defense/", date: "2026-08-05", access: full, locator: "Sections 'AI Attacks Can Outrun Human-Speed Defense', 'Four Questions That Define IdSecOps'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Discourse 05. The Netwrix post describes rule-based automation and does not say it uses AI; the AI link is Palo
    Alto Networks' framing. Grade C because the SANS figures measure the problem, not an outcome of automating
    response. The SANS page is internally inconsistent on its 85% figure (headline vs key findings); the key findings
    are used. SANS states sponsors had no role in design or analysis. Search-only: Blackpoint Cyber is reported to
    have an AI SOC agent for identity threat response with a vendor claim of containment in under two minutes on
    average (MSSP-BLACKPOINT-2026); not used. Compare security-incident-response-11 (guardrailed automated containment
    playbooks) and security-operations-21 (per-action authority for SOC agents).

- id: security-identity-access-16
  title: Managed detection and response extended to SaaS identity threats, delivered by a provider with agentic workflows
  archetype: security
  module: identity-access
