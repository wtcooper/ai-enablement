- id: security-identity-access-17
  title: Agentic threat hunting and detection engineering for identity-targeting browser attacks
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [research-synthesis, software-systems]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Attack techniques against identities (adversary-in-the-middle phishing kits, device-code phishing, OAuth abuse and
    similar) change weekly or daily and indicators are cheap to rotate, so human-only detection engineering takes days
    or weeks per technique (PUSH-AGENTICHUNT-2026).
  solution: >-
    Push Security built a pipeline in which agents ingest new research, form hunt hypotheses, write and test queries
    against stored browser-session metadata, triage matches, run deeper analysis with a researcher's toolkit, and draft
    detections that researchers ship. Hunts target techniques, not indicators.
  outcomes:
    - {lever: capacity, description: "Detection output after adopting the pipeline", figure: "tripled new detections shipped each month; tripled cumulative detections shipped this year; one hunt found 12 meaningful results, one novel, from trillions of browser events", measures: "Push's own count of detections shipped to customers (monthly and cumulative) and hunt results across its install base; baseline period and quality of the extra detections not stated", provenance: self-reported, source_ref: PUSH-AGENTICHUNT-2026}
  prerequisites:
    - "Rich first-party telemetry; Push says its extension records browser-session metadata locally, queries it only during hunts and does not train models on customer data (PUSH-AGENTICHUNT-2026)"
    - "Researcher-curated context: 'Agents are only as good as the context you give them' (PUSH-AGENTICHUNT-2026, 'Core principles')"
  risks_and_guardrails:
    - "Queries are refined to reduce false positives and back-tested on stored data before becoming scheduled detections (PUSH-AGENTICHUNT-2026, 'Example 1' and 'Example 2')"
  human_checkpoints:
    - "Researchers ship the detection; in a human-initiated hunt researchers and agents formulate the query together (PUSH-AGENTICHUNT-2026, 'Example 2')"
  role_evolution: >-
    Push says the goal is to scale a seasoned hunter's expertise and not to replace researchers
    (PUSH-AGENTICHUNT-2026, opening).
  evidence_grade: B
  sources:
    - {ref: PUSH-AGENTICHUNT-2026, title: "Can AI replace a threat researcher? What we learned building an agentic threat hunting pipeline", publisher: Push Security, type: vendor, url: "https://pushsecurity.com/blog/can-ai-replace-a-threat-researcher-what-we-learned-building-an-agentic-threat-hunting-pipeline", date: "2026-05-12", access: full, locator: "Opening; 'Core principles for agentic threat hunting'; 'Example 1'; 'Example 2'"}
    - {ref: PUSH-SHINYHUNTERS-2026, title: "How three techniques are behind ShinyHunters' 2026 campaigns", publisher: Push Security, type: vendor, url: "https://pushsecurity.com/blog/analyzing-the-instructure-breach", date: "2026-05-08", access: full, locator: "Section on the three browser-based vectors"}
  last_reviewed: "2026-10-17"
  notes: >-
    Discourse 13. Grade B, not A: the figures are counts of detections without a quality measure, and the process
    (detection engineering for a browser security vendor's product) is adjacent to an organization's own identity
    operations. Compare security-operations-18 (triage-to-detection tuning loop) and security-operations-09 (agent
    investigation across identity, endpoint and cloud sources). The 37x rise in device-code
    phishing in Push's install base is the vendor's own threat measurement.

- id: security-identity-access-18
  title: Enforced identity verification before help-desk password, MFA and account-recovery actions, in place of agent judgement
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [transaction-processing, client-interaction, review-assurance]
  pattern: service-agent-escalation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Attackers call the help desk posing as employees and ask for password and MFA resets. The joint CISA and FBI
    advisory on Scattered Spider describes actors persuading help-desk staff to reset passwords and transfer MFA to
    devices they control (CISA-AA23-320A-2025; the advisory does not mention AI). Practitioners say cloned voices make it
    harder still for staff to judge a caller (INFOSEC-SERVICEDESK-2026). At Cisco, recovery meant a help-desk agent
    opened a case, scheduled a video call and judged the employee's face and ID; practice varied across teams
    (PERSONA-CISCO-2026, 'Problem').
  solution: >-
    No reset proceeds until the requester passes an enforced verification step. At Cisco, an employee locked out of Duo
    contacts AISERA, Cisco's AI-powered IT service chatbot, which triggers a Persona flow (government ID and selfie
    verification) after which the employee adds a working factor. Nametag announced a ServiceNow integration where the
    agent presses a button and the result appears in the ticket before a reset. Specops authors argue knowledge-based
    proof should stop and the agent should not have to decide whether a caller sounds genuine; Okta Threat Intelligence
    adds that factor-enrolment policies should themselves demand phishing-resistant proof, a managed device, a trusted
    network or third-party identity verification.
  outcomes:
    - {lever: speed, description: "Time for a Cisco employee to regain access", figure: "from a wait of three or four hours for an agent to as little as five minutes", measures: "Cisco principal engineer's description of ticket response time before, and Persona's statement of self-service time after (a Cisco project manager says 5-10 minutes); not a measured average", provenance: vendor-published, source_ref: PERSONA-CISCO-2026}
    - {lever: capacity, description: "Cisco's stated aim for automated cases", figure: "hopes to automate thousands of support cases each quarter (goal, not a result)", measures: "Cisco's stated hope as reported by Persona; no count of cases automated is given", provenance: vendor-published, source_ref: PERSONA-CISCO-2026}
    - {lever: risk, description: "Counterfactual estimate by Okta on account-takeover attempts, not a deployed result", figure: "88% could have been stopped by mandatory phishing-resistant enrolment; 99.75% with phishing resistance in app sign-in policies", measures: "Share of about 6,000 analysed real-world social-engineering events in which the account-takeover session would have been prevented had the policy been in place; excludes compromised devices, malware and malicious-app authorisations", provenance: vendor-published, source_ref: OKTA-TI-2026}
    - {lever: speed, description: "Vendor's stated end-user completion time for ID-and-selfie verification", figure: "under 30 seconds", measures: "Vendor statement; sample and conditions not stated; no fraud-reduction or error figure", provenance: vendor-published, source_ref: NAMETAG-SERVICENOW-2026}
  prerequisites:
    - "Vendor selection by RFP and proof of concept (Cisco shortlisted six vendors, two finalists) and integration between the service chatbot, verification vendor and MFA platform (PERSONA-CISCO-2026)"
    - "Account-recovery methods defined in advance (recovery codes, recovery contacts or repeated identity proofing), with a notification to the user after every recovery (NIST-SP80063B-4-2025, Sec. 4.2)"
    - "Phishing-resistant authenticators already enrolled; the residual risk Okta describes is 'account bootstrapping', verifying a user before they can enrol a strong factor (OKTA-TI-2026)"
    - "A documented escalation path for failed verification (PETRI-SERVICEDESK-2026)"
  risks_and_guardrails:
    - "An ID-and-selfie check is itself exposed to deepfakes and injected media; the same controls as remote identity proofing apply (NIST-SP80063A-4-2025, Sec. 3.14; see entry 19)"
    - "Attackers push users to downgrade from a phishing-resistant method to a phishable one (OKTA-TI-MFADOWNGRADE-2026)"
    - "CISA recommends FIDO/WebAuthn or PKI-based MFA, which resists phishing, push bombing and SIM swap (CISA-AA23-320A-2025, Mitigations)"
    - "Persona's access to Duo is limited to what verification needs, and Persona's case tool limits which support agents can see personal data when they review failed verifications (PERSONA-CISCO-2026)"
    - "Specops says its product exports verification events to a SIEM as an audit trail that verification happened before a sensitive action (INFOSEC-SERVICEDESK-2026)"
    - "Nametag says video calls should not be trusted for verifying employees or candidates (NAMETAG-IMPERSONATION-2026, p. 13)"
  human_checkpoints:
    - "Failed verifications go to support agents for guidance (PERSONA-CISCO-2026) and into a documented escalation workflow rather than an exception under pressure (PETRI-SERVICEDESK-2026)"
    - "In the Nametag flow the help-desk agent starts verification and decides whether to proceed once the result is shown (NAMETAG-SERVICENOW-2026)"
    - "NYDFS expects training on verifying a requester's identity for unusual requests (NYDFS-AIGUIDE-2024, training section)"
  role_evolution: >-
    Help-desk agents stop acting as ad hoc interrogators: Persona says each case automated at Cisco frees help-desk time
    for complex issues (PERSONA-CISCO-2026, 'Results'; a vendor statement, not a Cisco measurement), and Specops argues staff should follow a process that stays secure
    even when the caller is persuasive (PETRI-SERVICEDESK-2026, point 5).
  evidence_grade: B
  sources:
    - {ref: PERSONA-CISCO-2026, title: "How Cisco Automated Workforce Verification With Persona (customer story; undated, text refers to a use case planned for later in 2026)", publisher: Persona, type: vendor, url: "https://withpersona.com/customers/cisco", date: "2026", access: full, locator: "Sections 'Problem', 'Solution' and 'Results' (page blocks direct download; read through the r.jina.ai text mirror on 2026-10-17)"}
    - {ref: NAMETAG-SERVICENOW-2026, title: "Prevent Deepfake Impersonation at the ServiceNow IT Service Desk with Nametag Identity Verification", publisher: Nametag, type: vendor, url: "https://getnametag.com/newsroom/servicenow-identity-verification", date: "2026-02-12", access: full, locator: "Body and customer quote (ElevateBio)"}
    - {ref: OKTA-TI-2026, title: "New speed, same tricks: Defend against AI threats with security fundamentals (B. Winterford, Okta Threat Intelligence)", publisher: Okta Newsroom, type: vendor, url: "https://www.okta.com/newsroom/articles/new-speed-same-tricks-defend-against-ai-threats-with-security-fundamentals/", date: "2026-10-07", access: full, locator: "'We put phishing resistance to the test'; 'How the security invariants performed'; account management policies"}
    - {ref: OKTA-TI-MFADOWNGRADE-2026, title: "When enrollment isn't enough: How attackers trick users into MFA downgrades", publisher: Okta Threat Intelligence, type: vendor, url: "https://www.okta.com/blog/threat-intelligence/when_enrollment_isnt_enough/", date: "2026-10-05", access: full, locator: "'Executive summary' and 'Threat analysis'"}
    - {ref: INFOSEC-SERVICEDESK-2026, title: "Your Service Desk Agents Can't Out-Talk an AI", publisher: Infosecurity Magazine (author from Specops Software), type: vendor, url: "https://www.infosecurity-magazine.com/blogs/your-service-desk-agents-cant/", date: "2026-10-06", access: full, locator: "Sections 'Why Agent Training Reaches a Limit', 'Remove the Judgement Call from Identity Verification'"}
    - {ref: PETRI-SERVICEDESK-2026, title: "5 Ways to Secure Your Service Desk Against AI-Enabled Attacks", publisher: Petri (author from Specops), type: vendor, url: "https://petri.com/5-ways-to-secure-your-service-desk-against-ai-attacks/", date: "2026-09-01", access: full, locator: "Opening; 'Stop using knowledge as proof of identity'; point 5; closing paragraph"}
    - {ref: NAMETAG-IMPERSONATION-2026, title: "Rebuilding Trust in the Age of AI: The 2026 Workforce Impersonation Report", publisher: Nametag, type: vendor, url: "https://www.go.nametag.co/hubfs/The%202026%20Workforce%20Impersonation%20Report.pdf", date: "2026", access: full, locator: "p. 6 'Helpdesk Social Engineering'; p. 13 'The Limits of Video Verification'"}
    - {ref: CISA-AA23-320A-2025, title: "Scattered Spider (joint advisory AA23-320A, updated 2025-07-29)", publisher: CISA with FBI and international partners, type: regulator, url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a", date: "2025-07-29", access: full, locator: "Summary; social engineering lists; Mitigations"}
    - {ref: NIST-SP80063B-4-2025, title: "NIST SP 800-63B-4 Authentication and Authenticator Management", publisher: NIST, type: standard-setter, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63B-4.pdf", date: "2025-07", access: full, locator: "Sec. 4.2 (account recovery)"}
    - {ref: NIST-SP80063A-4-2025, title: "NIST SP 800-63A-4 Digital Identity Guidelines: Identity Proofing and Enrollment", publisher: NIST, type: standard-setter, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63A-4.pdf", date: "2025-07", access: full, locator: "Sec. 3.14"}
    - {ref: NYDFS-AIGUIDE-2024, title: "Cybersecurity Risks Arising from Artificial Intelligence and Strategies to Combat Related Risks (Industry Letter)", publisher: NYDFS, type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Training section"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 17 (graded A), discourse 08 (C) and governance 05 (C). Graded B under the 2026-10-17 rule: Cisco
    is named, but the waiting-time figure is a practitioner's description quoted in a vendor story, not a measured
    average; the figure is kept with that provenance. The AI parts at Cisco are the service chatbot and the ML-based
    document and face checks. Duo admin verification was planned, not live, at the time of the story. Both
    Specops-authored articles promote its own product. A Vectra post on an FBI complaint describes a May 2025 intrusion
    where help-desk calls led to three compromised accounts in about two to three hours with no exploit (an allegation;
    VECTRA-SPIDER-2026, cited in the module). Search-only: a Deepwatch note on surging voice-phishing SSO resets.

- id: security-identity-access-19
  title: Machine-learning identity proofing with document forensics, liveness, and deepfake and injection detection
  archetype: security
  module: identity-access
  function: risk-compliance-legal
  work_types: [review-assurance, transaction-processing]
  pattern: document-to-decision
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Remote onboarding and account recovery depend on a selfie or video and an image of an identity document. FinCEN
    reports criminals using generative AI to alter or create documents, photographs and videos, combining them with
    stolen or fake personal data into synthetic identities, and an increase in suspicious-activity reports describing
    deepfake media used to get past verification (FINCEN-DEEPFAKE-2024, pp. 1-4). Forged media can also be injected
    straight into the capture channel, so a face comparison alone no longer shows a live person is present
    (NIST-SP80063A-4-2025, Sec. 3.14).
  solution: >-
    Layered capture and analysis: live document capture and document-authenticity checks, 1:1 face match, passive or
    active presentation-attack detection (PAD, spotting masks, screens and printouts), checks that the camera is a
    genuine sensor (virtual camera, emulator or jailbreak detection) and analysis of submitted media for manipulation,
    with failed or suspicious cases sent to people. Coinbase's identity verification team owns ML systems for document
    authenticity, face match, liveness, presentation-attack and deepfake or injection detection, plus a Coinbase-owned
    evaluation set to benchmark outside vendors and route between providers; its posting says every signup, account
    recovery and high-risk action depends on these models. FinCEN observes institutions re-reviewing account-opening
    files and using reverse-image search, and says institutions and verification providers may also examine image
    metadata or use deepfake-detection software.
  outcomes:
    - {lever: quality, description: "DHS test: median presentation-attack detection among tested subsystems", figure: "78% of more than 1,200 attacks (best 100%, worst 0%)", measures: "Share of presentation attacks detected by the median tested subsystem in DHS S&T's Remote Identity Validation Technology Demonstration (2023 event); vendors' systems, not Coinbase's", provenance: independent, source_ref: DHS-RIVTD-2025}
    - {lever: experience, description: "DHS test: genuine users validated by active presentation-attack detection", figure: "median 85% of more than 600 bona fide users (best 94%, worst 41%)", measures: "Share of bona fide users validated by the median of 6 active PAD subsystems; median error 9% for ages 18-45 and 20% for 46+", provenance: independent, source_ref: DHS-RIVTD-2025}
    - {lever: risk, description: "Vendor claim about an independent test: zero attack acceptance in the Active PAD part of DHS S&T's 2025 Remote Identity Validation Rally", figure: "0% attack acceptance; genuine-user rejection 3.4% on Android", measures: "Attack presentation and bona fide rejection error rates across three attack classes on Android and iOS, per the vendor's press release; the DHS report itself was not reachable; iOS rejection described only as 1 point above the 5% threshold", provenance: vendor-published, source_ref: IDENTY-RIVR-2026}
  prerequisites:
    - "Presentation attack detection tested to ISO/IEC 30107-3 with an impostor attack presentation accept rate below 0.07 for remote biometric collection; biometric and attack-detection algorithms periodically tested by independent entities, including across demographic groups (NIST-SP80063A-4-2025, Sec. 3.11)"
    - "Document false acceptance and false rejection rates of 0.1 or less for automated evidence validation; image-analysis false-positive and false-negative rates documented (NIST-SP80063A-4-2025, Sec. 3.13 and 3.14)"
    - "A documented list of AI/ML use disclosed to relying parties, plus a privacy risk assessment (NIST-SP80063-4-2025, Sec. 3.8)"
    - "Vendor and in-house models benchmarked on an owned evaluation set (COINBASE-JOB-IDVML-2026); device and document compatibility testing across phones and issuing states (DHS-RIVTD-2025)"
  risks_and_guardrails:
    - "NIST states a biometric comparison on a captured sample does not stop injection attacks, and that live capture and PAD help but do not cover all cases (NIST-SP80063A-4-2025, Sec. 3.14)"
    - "Biometric verification must perform for each demographic group no more than 25% worse than for the overall population; in the DHS test older users had higher error rates (median 20% vs 9%) (NIST-SP80063A-4-2025, Sec. 3.11; DHS-RIVTD-2025)"
    - "DHS recommends choosing systems with error rates below 10% and checking compatibility with users' documents and devices (DHS-RIVTD-2025)"
    - "Detector robustness is contested: a USENIX 2025 paper builds signed fake photos that fool deepfake and recapture detectors (USENIX-CHIMERA-2025), and a 2026 preprint shows challenge sets must be re-tested against current face-swap tools (ARXIV-2610.16417)"
    - "FinCEN notes deepfake users may claim technical glitches to avoid live checks, and lists phishing-resistant MFA and live verification as best practices (FINCEN-DEEPFAKE-2024, pp. 4-6)"
    - "Oz Forensics, as summarised by NHIMG, says a single liveness check is not a durable trust boundary (NHIMG-OZ-2026)"
  human_checkpoints:
    - "Algorithmic media analysis and automated decisions should be augmented by manual review to address detection errors (NIST-SP80063A-4-2025, Sec. 3.14, item 2)"
    - "Analysts re-review account-opening documents, run enhanced due diligence and file SARs citing FIN-2024-DEEPFAKEFRAUD (FINCEN-DEEPFAKE-2024, pp. 1, 4)"
    - "Failed or suspicious verifications are escalated for human review (NAMETAG-IMPERSONATION-2026, p. 13)"
  role_evolution: >-
    Identity verification ML engineers own vendor benchmarking, routing and evaluation layers, not only models
    (COINBASE-JOB-IDVML-2026). Proofing agents and trusted referees must be trained to spot manipulated media (high
    latency, synchronisation problems, inconsistent skin tone or resolution) and to issue unpredictable prompts
    (NIST-SP80063A-4-2025, Sec. 3.14).
  evidence_grade: B
  sources:
    - {ref: COINBASE-JOB-IDVML-2026, title: "Staff Machine Learning Engineer (Platform - Identity), Identity Verification (job posting 8211486)", publisher: Coinbase, type: job-posting, url: "https://www.coinbase.com/careers/positions/8211486?gh_jid=8211486", date: "2026-09-17", access: full, locator: "Role description and 'What you'll do'"}
    - {ref: DHS-RIVTD-2025, title: "Remote Identity Validation Technology Demonstration (DHS S&T; page last updated 2025-04-10, results from the 2023 test event)", publisher: "U.S. Department of Homeland Security, Science and Technology Directorate", type: regulator, url: "https://www.dhs.gov/science-and-technology/remote-identity-validation-technology-demonstration", date: "2025-04-10", access: full, locator: "Results infographics: Document Validation; Selfie Match; Presentation Attack Detection"}
    - {ref: IDENTY-RIVR-2026, title: "Identy.io Achieves Zero Attack Acceptance in DHS RIVR Face Liveness Evaluation", publisher: Business Wire (Identy.io press release), type: vendor, url: "https://businesswire.com/news/home/20260318279525/en/Identy.io-Achieves-Zero-Attack-Acceptance-in-DHS-RIVR-Face-Liveness-Evaluation-Leads-Field-on-Speed-and-User-Satisfaction", date: "2026-03-18", access: full, locator: "Headline and first three bullets"}
    - {ref: NIST-SP80063-4-2025, title: "NIST SP 800-63-4 Digital Identity Guidelines", publisher: NIST, type: standard-setter, url: "https://doi.org/10.6028/NIST.SP.800-63-4", date: "2025-07", access: full, locator: "Sec. 3.8 (AI and ML in identity systems); 'Background' list of changes"}
    - {ref: NIST-SP80063A-4-2025, title: "NIST SP 800-63A-4 Digital Identity Guidelines: Identity Proofing and Enrollment", publisher: NIST, type: standard-setter, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63A-4.pdf", date: "2025-07", access: full, locator: "Sec. 3.11, 3.13, 3.14"}
    - {ref: FINCEN-DEEPFAKE-2024, title: "FinCEN Alert on Fraud Schemes Involving Deepfake Media Targeting Financial Institutions (FIN-2024-Alert004)", publisher: "FinCEN, U.S. Treasury", type: regulator, url: "https://www.fincen.gov/system/files/shared/FinCEN-Alert-DeepFakes-Alert508FINAL.pdf", date: "2024-11-13", access: full, locator: "p. 1 (increase in SARs); pp. 2-4 (deepfake identities, detection); pp. 4-6 (best practices, red flags)"}
    - {ref: USENIX-CHIMERA-2025, title: "Chimera: Creating Digitally Signed Fake Photos by Fooling Image Recapture and Deepfake Detectors", publisher: USENIX Security 2025, type: academic, url: "https://www.usenix.org/conference/usenixsecurity25/presentation/park", date: "2025-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2610.16417, title: "Not All Challenges Are Equal: Evaluating Interactive Liveness Detection Against Real-Time Face Swaps", publisher: arXiv (Firc et al.), type: academic, url: "https://arxiv.org/abs/2610.16417", date: "2026-10-12", access: full, locator: "Abstract"}
    - {ref: NAMETAG-IMPERSONATION-2026, title: "Rebuilding Trust in the Age of AI: The 2026 Workforce Impersonation Report", publisher: Nametag, type: vendor, url: "https://www.go.nametag.co/hubfs/The%202026%20Workforce%20Impersonation%20Report.pdf", date: "2026", access: full, locator: "pp. 13-14 'The Limits of Video Verification' and 'Workforce Identity Verification'"}
    - {ref: NHIMG-OZ-2026, title: "Industrialized fraud is breaking legacy identity verification controls (NHIMG summary of an Oz Forensics post)", publisher: Non-Human Identity Management Group, type: community, url: "https://nhimg.org/articles/industrialized-fraud-is-breaking-legacy-identity-verification-controls/", date: "2026-07-11", access: full, locator: "'TL;DR' and 'Context'"}
    - {ref: CFI-ENTRUST-2025, title: "Deepfakes, Social Engineering, Injection Attacks On The Rise, Report Reveals (on Entrust's 2026 Identity Fraud Report)", publisher: Crowdfund Insider, type: press, url: "https://www.crowdfundinsider.com/?p=255847", date: "2025-11-25", access: full, locator: "First three paragraphs"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 16 (B), discourse 07 (C), governance 01 (C) and governance 02 (C, forged-document analysis at
    account opening). Grade B with a cap: the Coinbase evidence is a job posting (named, in production, no
    measurements), and the measurements are independent tests of other vendors' technology on a 2023 event or a
    vendor's account of a 2025 test. Threat context, vendor-published: Entrust's 2026 report, as quoted by Crowdfund
    Insider, says deepfakes were one in five biometric fraud attempts, deepfaked selfies rose 58% in 2025 and injection
    attacks 40% year on year (CFI-ENTRUST-2025). Search-only: Incode and IDRnD make similar DHS-testing claims with
    differing vendor counts (18 vs 21); a Gartner 2024-02-01 prediction that by 2026 30% of enterprises will not consider
    identity verification reliable in isolation (GARTNER-DEEPFAKE-2024). Saviynt added biometric and liveness
    verification inside human identity certification on 2026-06-15 (SAVIYNT-IARA-2026, cited in the module).

- id: security-identity-access-20
  title: Identity-graph models and one-to-many biometric search to find duplicate enrolments, account rings and bots
  archetype: security
  module: identity-access
  function: risk-compliance-legal
  work_types: [research-synthesis, data-reporting, review-assurance]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Fraud rings reuse biometric, device and document signals across accounts, enrol the same face under different names,
    and run bots that mimic humans. Cloudflare lists fraudulent signups, promo and trial abuse, payment fraud,
    chargebacks and account takeover as costs to revenue and support overhead (CLOUDFLARE-JOB-FRAUD-2026). False matches
    would wrongly block genuine applicants such as twins (NIST-SP80063A-4-2025, Sec. 3.11).
  solution: >-
    Coinbase's identity verification ML team, which owns production 1:1 and 1:N face match, is hiring a staff engineer to
    build identity-graph systems with graph neural networks that cluster accounts sharing biometric, device and
    document signals, plus behavioural and device models for capture-session anomalies, bot-versus-human classification
    and device-fingerprint risk scoring at real-time latency. Cloudflare's internal fraud platform team, built around
    data-science signals and models, is hiring its first software engineer to ingest events from billing, signup and
    support, route decisions and put case data in front of the people who act on them. NIST permits one-to-many (1:N)
    biometric search of an applicant against the enrolled gallery for deduplication or fraud detection, with hits routed
    to a person.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "Job postings carry no outcome data; NIST sets a permitted false positive identification rate for 1:N search but no deployment result is public", provenance: self-reported, source_ref: COINBASE-JOB-IDVML-2026}
  prerequisites:
    - "Event feeds from signup, billing and support systems, and a decisioning and case-management platform (CLOUDFLARE-JOB-FRAUD-2026)"
    - "Privacy risk assessment before 1:N identification, and a false positive identification rate of 1:1,000 or better shown with a gallery of at least 90% of operational size (NIST-SP80063A-4-2025, Sec. 3.11, items 9-10)"
  risks_and_guardrails:
    - "The identity provider must not decline an enrolment on an automated 1:N result without manual review confirming it is not a false positive (NIST-SP80063A-4-2025, Sec. 3.11, item 11)"
    - "Demographic performance of biometric verification must be within 25% of the overall population (NIST-SP80063A-4-2025, Sec. 3.11, item 12)"
    - "Coinbase's posting uses generative AI 'with human oversight' wording; no other guardrail is described (COINBASE-JOB-IDVML-2026)"
  human_checkpoints:
    - "Manual review confirms every automated 1:N match before an enrolment is declined (NIST-SP80063A-4-2025, Sec. 3.11, item 11)"
    - "Decisions and case data are routed to the people who act on them (CLOUDFLARE-JOB-FRAUD-2026)"
  role_evolution: >-
    Fraud teams add platform engineers to turn data-science models into operations (CLOUDFLARE-JOB-FRAUD-2026, 'About
    the Role'). A manual-review queue for biometric matches becomes a required role; NIST does not describe the staffing
    (NIST-SP80063A-4-2025).
  evidence_grade: B
  sources:
    - {ref: COINBASE-JOB-IDVML-2026, title: "Staff Machine Learning Engineer (Platform - Identity), Identity Verification (job posting 8211486)", publisher: Coinbase, type: job-posting, url: "https://www.coinbase.com/careers/positions/8211486?gh_jid=8211486", date: "2026-09-17", access: full, locator: "'What you'll do': identity-graph and behavioural models"}
    - {ref: CLOUDFLARE-JOB-FRAUD-2026, title: "Senior Software Engineer, Internal Fraud Platform (job posting 8185561)", publisher: Cloudflare, type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8185561?gh_jid=8185561", date: "2026-09-14", access: full, locator: "'About the Role'"}
    - {ref: NIST-SP80063A-4-2025, title: "NIST SP 800-63A-4 Digital Identity Guidelines: Identity Proofing and Enrollment", publisher: NIST, type: standard-setter, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63A-4.pdf", date: "2025-07", access: full, locator: "Sec. 3.11, items 9-12"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 18 (B, automate) and governance 03 (D idea, augment). Grade B from job postings only: named
    firms, no measurements. The B rests on the 1:N face match the Coinbase posting says the team already owns in
    production; the identity-graph models are work the new hire is to build, and Cloudflare's models target signup,
    payment and account-takeover fraud generally, not biometrics. Whether the models are in production at each firm is inferred from the postings' wording
    (Coinbase: 'protecting the integrity of millions of accounts'; Cloudflare: team 'built around data science'). Kept
    at the practice angle's automate: NIST routes declines (the exceptions) to manual review.

- id: security-identity-access-21
  title: Passive, continuous caller authentication in the contact centre in place of knowledge-based questions
  archetype: security
  module: identity-access
  function: customer-service
  work_types: [transaction-processing, client-interaction]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Agents verify callers with security questions (knowledge-based authentication). Stolen breach data lets fraudsters
    answer them: Pindrop reports that across 2,500 fraud calls at 10 financial institutions fraudsters passed
    knowledge-based authentication 53% of the time on average (range 9% to 90%) (PINDROP-VEC-2025). Genuine members get
    frustrated, and authentication took about 90 seconds of an 8:30-minute call at one credit union
    (PINDROP-MSUFCU-2025).
  solution: >-
    Pindrop Passport analyses voice, device and behaviour signals in the background of the call to build a profile
    match, so many callers are verified in the IVR or in seconds with the agent, and agents see risk notifications
    instead of asking questions. Michigan State University Federal Credit Union (MSUFCU) uses it in a Five9 contact
    centre without requiring members to enrol a voiceprint phrase; HealthEquity uses it in its voice channel and moves
    from one-time 'stage-gate' verification to continuous verification.
  outcomes:
    - {lever: speed, description: "MSUFCU average member authentication time", figure: "90 seconds to 45 seconds (-50%) within 90 days", measures: "Average member authentication time at MSUFCU, as stated by Pindrop in the case study; the method is not stated, but the same page gives tracked October 2024 volumes (49,907 calls authenticated, 92.99% overall authentication rate)", provenance: vendor-published, source_ref: PINDROP-MSUFCU-2025}
    - {lever: speed, description: "MSUFCU calls with a full profile match", figure: "12 seconds (78-second reduction) for more than 40% of calls", measures: "Authentication time on calls that achieved a full profile match; more than 40% of calls per Pindrop", provenance: vendor-published, source_ref: PINDROP-MSUFCU-2025}
    - {lever: experience, description: "HealthEquity IVR profile match rate in the first month", figure: "31% to 71%", measures: "Profile match rate in the IVR within the first month of Passport deployment; denominator (callers or calls) not stated", provenance: vendor-published, source_ref: PINDROP-HEALTHEQUITY-2026}
    - {lever: experience, description: "HealthEquity authentication rate with agents", figure: "over 91%", measures: "Authentication rate once callers reach agents, as stated by Pindrop; definition and period not stated", provenance: vendor-published, source_ref: PINDROP-HEALTHEQUITY-2026}
  prerequisites:
    - "Contact-centre platform integration (Five9 for MSUFCU) and agent-desktop integration (PINDROP-MSUFCU-2025)"
    - "Profile data for callers; the profile match is built from prior calls (PINDROP-MSUFCU-2025)"
  risks_and_guardrails:
    - "Knowledge-based questions are described as no longer sufficient (PINDROP-HEALTHEQUITY-2026)"
    - "Independent academic work shows cloned voices built from very small samples can bypass commercial speaker verification and anti-spoofing detectors generalise poorly, so voice should not be the only factor (ARXIV-2601.02914, abstract)"
    - "NYDFS suggests avoiding SMS, voice or video authentication in favour of factors deepfakes cannot impersonate, such as digital certificates and physical security keys (NYDFS-AIGUIDE-2024, Access Controls)"
  human_checkpoints:
    - "Agents receive risk notifications and route elevated-risk calls; low-risk, high-confidence callers move on without questions (PINDROP-HEALTHEQUITY-2026)"
  role_evolution: >-
    Agents spend less of the call authenticating and more on service; HealthEquity's fraud head frames agents as there
    to help, not interrogate (PINDROP-HEALTHEQUITY-2026).
  evidence_grade: A
  sources:
    - {ref: PINDROP-MSUFCU-2025, title: "Michigan State University Federal Credit Union Cuts Authentication Time in Half with Pindrop", publisher: Pindrop, type: vendor, url: "https://www.pindrop.com/customer/michigan-state-university-federal-credit-union", date: "2025-01-09", access: full, locator: "Opening summary; 'Challenges'; results paragraphs"}
    - {ref: PINDROP-HEALTHEQUITY-2026, title: "90% Drop in Fraud and a Smoother CX: How HealthEquity Did It", publisher: Pindrop, type: vendor, url: "https://www.pindrop.com/customer/healthequity-drop-fraud-smoother-cx", date: "2026-02-23", access: full, locator: "Section 'The future of authentication starts with continuous risk assessments'"}
    - {ref: PINDROP-VEC-2025, title: "The Virginia Employment Commission Reduced Fraud by +$500K Within Months", publisher: Pindrop, type: vendor, url: "https://www.pindrop.com/customer/virginia-employment-commission-reduced-fraud-within-months", date: "2025-06-13", access: full, locator: "'Before Pindrop Solutions' (53% KBA pass rate from Pindrop internal data)"}
    - {ref: ARXIV-2601.02914, title: "Vulnerabilities of Audio-Based Biometric Authentication Systems Against Deepfake Speech Synthesis (Hong et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2601.02914", date: "2026-01-06", access: full, locator: "Abstract"}
    - {ref: NYDFS-AIGUIDE-2024, title: "Cybersecurity Risks Arising from Artificial Intelligence and Strategies to Combat Related Risks (Industry Letter)", publisher: NYDFS, type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Access Controls"}
  last_reviewed: "2026-10-17"
  notes: >-
    Practice 13. The only grade A entry. It meets the 2026-10-17 rule because the figures are tracked operating metrics
    (average authentication time over 90 days, profile match rate) for named organizations, not a practitioner's
    estimate; but every figure is in Pindrop's own case studies (provenance vendor-published), the method and counts are
    not stated, and there is no independent test of these deployments. 'AI' is the vendor's label for the risk
    analysis.

- id: security-identity-access-22
  title: Real-time call risk scoring to catch account-takeover and impersonation fraud in the voice channel
  archetype: security
  module: identity-access
  function: risk-compliance-legal
  work_types: [transaction-processing, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Fraud checks in contact centres are slow, run after the fact and rely on knowledge-based quizzes that fraudsters
    pass. Virginia Employment Commission (VEC) lost an estimated $350M to fraud in three years after the pandemic
    (PINDROP-VEC-2025, 'Challenges').
  solution: >-
    Pindrop Protect scores risk throughout the call, from the IVR to the agent leg, using signals such as spoofing
    indicators, device anomalies and voice patterns. At VEC the IVR risk score decides whether a caller gets a callback
    or is routed to a fraud agent, and account-risk analysis links claims sharing addresses or phone numbers. HealthEquity
    runs it with Passport (entry 21).
  outcomes:
    - {lever: risk, description: "HealthEquity voice-channel fraud, year on year", figure: "reduced by over 90%", measures: "Fraud over the voice channel 'from last year to now', in the words of HealthEquity's head of fraud; the metric (counts or losses) and period are not defined", provenance: self-reported, source_ref: PINDROP-HEALTHEQUITY-2026}
    - {lever: risk, description: "VEC potentially fraudulent calls detected", figure: "over 800 in one year", measures: "Calls Pindrop Protect flagged as potentially fraudulent in VEC's call centres in a year; not confirmed fraud", provenance: vendor-published, source_ref: PINDROP-VEC-2025}
    - {lever: cost, description: "VEC potential fraud-loss avoidance", figure: "$560K since deployment in April 2024; $840K annualised (potential)", measures: "Pindrop's estimate of potential fraud-loss avoidance, alongside potential fraud flagged at 1 in every 2,529 calls; how the savings were calculated is not shown", provenance: vendor-published, source_ref: PINDROP-VEC-2025}
  prerequisites:
    - "Telephony and IVR integration with a real-time risk API (PINDROP-VEC-2025)"
    - "A fraud investigation team and case-management process to act on alerts (PINDROP-VEC-2025)"
    - "Custom attributes and policy rules for the organisation's own fraud patterns (PINDROP-VEC-2025)"
  risks_and_guardrails:
    - "VEC wanted to balance fraud detection with low friction for genuine claimants (PINDROP-VEC-2025)"
    - "Synthetic-speech detection models generalise poorly outside their training conditions: a multilingual in-the-wild benchmark shows significant degradation across languages and acoustic conditions, and an audit finds deepfake benchmarks may reward general representation quality (ARXIV-2603.05852; ARXIV-2606.26384)"
  human_checkpoints:
    - "Agents see colour codes and screen pops; high-risk IVR calls go to a fraud agent; investigators run cases from the flagged call (PINDROP-VEC-2025)"
  role_evolution: >-
    At VEC, leadership no longer reviews every callback staff flag as suspicious; the IVR risk score decides who gets a
    callback and who goes to a fraud agent, and investigators track cases to resolution through custom attributes
    (PINDROP-VEC-2025, 'Fraud detection in the IVR' and 'Custom Attributes').
  evidence_grade: B
  sources:
    - {ref: PINDROP-HEALTHEQUITY-2026, title: "90% Drop in Fraud and a Smoother CX: How HealthEquity Did It", publisher: Pindrop, type: vendor, url: "https://www.pindrop.com/customer/healthequity-drop-fraud-smoother-cx", date: "2026-02-23", access: full, locator: "Quote on reducing voice-channel fraud by over 90%; key results"}
    - {ref: PINDROP-VEC-2025, title: "The Virginia Employment Commission Reduced Fraud by +$500K Within Months", publisher: Pindrop, type: vendor, url: "https://www.pindrop.com/customer/virginia-employment-commission-reduced-fraud-within-months", date: "2025-06-13", access: full, locator: "Opening summary; 'ROI' sections; 'Fraud detection in the IVR'"}
    - {ref: ARXIV-2603.05852, title: "ML-ITW: A Multilingual in-the-wild Benchmark for Speech Deepfake Detection (Li et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2603.05852", date: "2026-03-06", access: full, locator: "Abstract"}
    - {ref: ARXIV-2606.26384, title: "What Do Deepfake Benchmarks Measure? An Audit Using Frozen Self-Supervised Representations (Pagon et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2606.26384", date: "2026-06-24", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Practice 14, graded A there and B here under the 2026-10-17 rule: HealthEquity's 'over 90%' is an executive's
    statement with an undefined metric, VEC's $560K is the vendor's estimate of potential loss avoidance with no derivation shown, and the 800
    flagged calls are activity, not confirmed fraud. Figures are kept with their provenance. No independent evaluation
    of detection error rates in these deployments.

- id: security-identity-access-23
  title: Synthetic-voice detection on contact-centre and meeting audio, with risk scores for fraud triage
  archetype: security
  module: identity-access
  function: risk-compliance-legal
  work_types: [review-assurance, transaction-processing]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Voice biometrics and callback checks were not designed for AI-generated speech. A tier-one global bank saw deepfaked
    calls pass voice biometrics and callback checks (REALITYDEFENDER-BANK-2026). NYDFS warns that deepfakes can mimic a
    person's voice or appearance to get past biometric verification (NYDFS-AIGUIDE-2024), and the FBI reports
    AI-generated voice messages used to impersonate senior US officials (FBI-IC3PSA-2025).
  solution: >-
    Reality Defender analysed recorded customer calls across Zoom, Meet, NICE, Twilio and Five9 for an unnamed bank, then
    moved to real-time detection for about 600 frontline staff. It returns probability-based risk scores per file rather
    than a yes-or-no result, which the bank's fraud team uses to triage and escalate against its own thresholds. A
    research direction (July 2026 preprint) evaluates large audio language models for spoofing-aware speaker
    verification that can give natural-language rationales.
  outcomes:
    - {lever: risk, description: "Synthetic voice calls found among calls analysed for an unnamed bank", figure: "about 960 of more than 1.7 million", measures: "Calls the vendor's tool scored as synthetic among customer calls analysed in 2024 across US and LATAM operations; not confirmed fraud; no false-positive rate", provenance: vendor-published, source_ref: REALITYDEFENDER-BANK-2026}
    - {lever: quality, description: "Independent benchmark of 12 state-of-the-art deepfake-voice detectors", figure: "best equal error rate 13.50%; all others above 20%", measures: "Equal error rate on VoiceWukong (265,200 English and 148,200 Chinese deepfake samples, 38 variants across six manipulation types); a multimodal LLM showed no detection ability", provenance: independent, source_ref: USENIX-VOICEWUKONG-2025}
  prerequisites:
    - "Integration with the bank's call-recording, contact-centre and conferencing platforms (REALITYDEFENDER-BANK-2026)"
    - "A triage and escalation process for scored calls (REALITYDEFENDER-BANK-2026)"
    - "Callback or step-up verification that does not depend on voice, SMS or video (NYDFS-AIGUIDE-2024, Access Controls)"
  risks_and_guardrails:
    - "Scores are probabilities, not verdicts; thresholds are set by the bank (REALITYDEFENDER-BANK-2026)"
    - "Detectors face significant challenges in real-world conditions, with dramatically declining performance, according to the VoiceWukong authors (USENIX-VOICEWUKONG-2025)"
    - "Voice clones from very small samples can bypass commercial speaker verification, and detectors degrade out of domain (ARXIV-2601.02914; ARXIV-2603.05852; ARXIV-2606.26384); an audio-detector preprint reports 21 of 29 features reversing direction between training and in-the-wild use (ARXIV-2609.09489)"
    - "Pretrained audio language models perform near chance zero-shot and become competitive only after task-specific adaptation (ARXIV-2607.14753)"
    - "The FBI recommends independently finding the caller's number and calling back to verify, and warns that cloned voices can sound nearly identical to the real person (FBI-IC3PSA-2025, Recommendations)"
  human_checkpoints:
    - "Fraud analysts triage scored calls under a new internal triage and escalation process (REALITYDEFENDER-BANK-2026, 'Key Results')"
  role_evolution: >-
    Frontline staff receive an authenticity signal during the call; fraud and risk teams own a new triage queue for
    calls the older controls had not flagged (REALITYDEFENDER-BANK-2026).
  evidence_grade: C
  sources:
    - {ref: REALITYDEFENDER-BANK-2026, title: "How a Global Bank Mitigates Contact Center Deepfake Threats with Reality Defender (anonymised case study; date is sitemap last-modified)", publisher: Reality Defender, type: vendor, url: "https://www.realitydefender.com/case-studies/how-a-global-bank-mitigates-contact-center-deepfake-threats-with-reality-defender", date: "2026-07-26", access: full, locator: "Key Results; 'How Reality Defender Exposed AI Voice Threats'"}
    - {ref: REALDEFENDER-BANK-2025, title: "How a Global Bank Defends Contact Centers Against Deepfake Threats with Reality Defender (page undated; year inferred from the 2024 data window)", publisher: Reality Defender, type: vendor, url: "https://www.realitydefender.com/case-studies/how-a-tier-one-bank-stopped-deepfaked-audio-with-reality-defender", date: "2025", access: full, locator: "Key Results"}
    - {ref: USENIX-VOICEWUKONG-2025, title: "VoiceWukong: Benchmarking Deepfake Voice Detection", publisher: USENIX Security 2025, type: academic, url: "https://www.usenix.org/conference/usenixsecurity25/presentation/yan-ziwei", date: "2025-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2601.02914, title: "Vulnerabilities of Audio-Based Biometric Authentication Systems Against Deepfake Speech Synthesis (Hong et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2601.02914", date: "2026-01-06", access: full, locator: "Abstract"}
    - {ref: ARXIV-2603.05852, title: "ML-ITW: A Multilingual in-the-wild Benchmark for Speech Deepfake Detection (Li et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2603.05852", date: "2026-03-06", access: full, locator: "Abstract"}
    - {ref: ARXIV-2606.26384, title: "What Do Deepfake Benchmarks Measure? An Audit Using Frozen Self-Supervised Representations (Pagon et al.)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2606.26384", date: "2026-06-24", access: full, locator: "Abstract"}
    - {ref: ARXIV-2609.09489, title: "Audio Deepfake Detection Using Temporal Coherence Analysis", publisher: arXiv (preprint), type: academic, url: "https://arxiv.org/abs/2609.09489", date: "2026-09-08", access: full, locator: "Abstract"}
    - {ref: ARXIV-2607.14753, title: "Large Audio Language Models for Spoofing-Aware Speaker Verification", publisher: arXiv (preprint, not peer reviewed), type: academic, url: "https://arxiv.org/abs/2607.14753", date: "2026-07-16", access: full, locator: "Abstract"}
    - {ref: NYDFS-AIGUIDE-2024, title: "Cybersecurity Risks Arising from Artificial Intelligence and Strategies to Combat Related Risks (Industry Letter)", publisher: NYDFS, type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Sections on AI-enabled social engineering and Access Controls"}
    - {ref: FBI-IC3PSA-2025, title: "Senior US Officials Impersonated in Malicious Messaging Campaign (Alert I-051525-PSA)", publisher: FBI Internet Crime Complaint Center, type: regulator, url: "https://www.ic3.gov/PSA/2025/PSA250515", date: "2025-05-15", access: full, locator: "Campaign details; Recommendations"}
    - {ref: HN-REALITYDEFENDER-2025, title: "Launch HN: Reality Defender (YC W22) - API for Deepfake and GenAI Detection", publisher: Hacker News, type: community, url: "https://news.ycombinator.com/item?id=44941580", date: "2025-08-18", access: full, locator: "Top-level threads on reliability and the arms race"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 15 (C), governance 04 (C) and discourse 15 (D idea, audio language models for spoofing-aware
    verification). Grade C: the bank is anonymised. The practice and governance angles read the case study at two
    different URLs with the same figures; both refs are kept. The Reality Defender founder's claim in the Hacker News
    thread of deployments to 'several Tier 1 banks' is unnamed and unverified. A vendor page elsewhere cites 99.99%
    detection accuracy (search result only, not used). Pindrop's survey of 250 U.S. security leaders (vendor-published)
    finds 37% rely on legacy tools for deepfake detection and 1 in 4 organisations hit by a deepfake attack lost $1M or
    more in a single incident (PINDROP-DRI-2026, cited in the module).

- id: security-identity-access-24
  title: Behavioural biometrics and continuous authentication to detect account takeover, mule accounts and scams
  archetype: security
  module: identity-access
  function: risk-compliance-legal
  work_types: [transaction-processing, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Payment-transaction monitoring does not address pre-payment risks such as identity theft, account takeover (ATO), scams and first-party fraud (Forrester's
    reading of the Visa deal, FORRESTER-BIOCATCH-2026). FBI IC3 received about 4,700 ATO complaints with USD 359.7
    million in losses in 2025 (FBI-IC3-2025). The EU payment services deal would require a provider to refund customers
    defrauded by someone posing as its staff, if they report to the police and inform the provider (EP-PSR-2025).
  solution: >-
    Behavioural signals (typing cadence, touchscreen gestures, mouse movements, hesitation, device handling) are analysed
    through website scripts and mobile SDKs to detect identity theft at registration, ATO, mule accounts and scams before
    a payment occurs; Forrester describes BioCatch this way, and Visa announced its intent to acquire BioCatch for USD
    2.4 billion (reported 2026-08-05). The same kind of signal can keep verifying a user during a session: NYDFS lists a
    fingerprint combined with keystrokes and navigation patterns as one option, and the EU NIS2 implementing regulation
    accepts continuous authentication mechanisms as an alternative to multiple factors.
  outcomes:
    - {lever: risk, description: "none published; no customer deployment or result is named", figure: "none published", measures: "n/a", provenance: independent, source_ref: FORRESTER-BIOCATCH-2026}
  prerequisites:
    - "Integration with customer identity and access management, authentication and deepfake-detection platforms; Forrester names its cost and complexity as a main deployment challenge (FORRESTER-BIOCATCH-2026)"
    - "Strength of authentication appropriate to the classification of the asset accessed (NIS2-IMPL-2024, point 11.7.2)"
    - "Strong customer authentication, a fraud-risk assessment and the ability to freeze a suspicious transaction at the receiving provider (EP-PSR-2025)"
  risks_and_guardrails:
    - "Forrester lists evasion by AI-driven robotic behaviour, bots and RPA, and false positives when users' motor patterns change (for example after an injury), which can insult honest customers and cause attrition (FORRESTER-BIOCATCH-2026)"
    - "Behavioural data may count as personally identifiable information in some jurisdictions (FORRESTER-BIOCATCH-2026)"
    - "The EU AI Act prohibits AI that infers emotions of a person in the workplace, with medical and safety exceptions, so behavioural analytics must not drift into emotion inference (EU-AIACT-2024, Art. 5(1)(f))"
    - "NYDFS warns stolen biometric data can be used to imitate users, bypass MFA and generate realistic deepfakes (NYDFS-AIGUIDE-2024)"
    - "If a payment provider fails to implement appropriate fraud prevention it is liable for the customer's losses; the deal still needs formal adoption (EP-PSR-2025)"
  human_checkpoints:
    - "Not described; the product provides risk signals (FORRESTER-BIOCATCH-2026)"
    - "Users must have access to human customer support, not only chatbots (EP-PSR-2025)"
    - "Fallback to another factor is the usual design for failed biometric checks (NIST-SP80063B-4-2025, Sec. 3.2.3)"
  role_evolution: >-
    Forrester says the standalone behavioural-biometrics market is effectively ending as it is absorbed into
    financial-crime, customer IAM and commerce fraud management markets (FORRESTER-BIOCATCH-2026, closing section).
  evidence_grade: C
