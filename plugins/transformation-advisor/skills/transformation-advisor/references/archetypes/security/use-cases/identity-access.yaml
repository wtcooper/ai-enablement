- id: security-identity-access-11
  title: LLM drafting of access-control policy as code, checked by tests or a verifier before review (idea)
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [software-systems, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Access requirements are written in prose and must be turned into enforceable policies such as OPA Rego, Cedar or
    cloud IAM policy. Manually written policies become complex and error prone (ARXIV-2503.11573), and the RAISE authors
    say even frontier LLMs often produce policies that violate the intended authorisation semantics (ARXIV-2609.33796).
  solution: >-
    Idea under study: an LLM drafts policy code, then schema validation, linting, compilation and generated positive and
    negative tests (or a formal verifier) check it before a person reviews it. A March 2025 preprint and two September
    2026 preprints test versions of this.
  outcomes:
    - {lever: quality, description: "End-to-end correctness of generated Rego policies, structured pipeline vs a single prompt", figure: "50.3% vs 15.3%", measures: "Share of 372 access-control statements for which generated Rego compiled, linted and passed positive and negative tests (strict measure of deployable correctness)", provenance: independent, source_ref: ARXIV-2609.24036}
    - {lever: quality, description: "Cedar policy synthesis: a small tuned model against zero-shot frontier models", figure: "+13.33 and +16.26 percentage points over two named zero-shot models", measures: "Semantic success on held-out scenarios in the authors' CedarInstruct data (5,800 scenarios), as stated in the abstract", provenance: independent, source_ref: ARXIV-2609.33796}
  prerequisites:
    - "A verifier or test harness for the target policy language (ARXIV-2609.24036)"
    - "Structured prompts based on the policy-language syntax (ARXIV-2503.11573, abstract)"
  risks_and_guardrails:
    - "Authors report untrained models rarely write valid Cedar (ARXIV-2609.33796) and a direct single prompt is correct only 15.3% of the time on their test (ARXIV-2609.24036)"
  human_checkpoints:
    - "Not studied; the papers measure automated checks, not human review"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: D
  sources:
    - {ref: ARXIV-2609.24036, title: "Structured Decomposition for Reliable LLM-Generated Access Control Policies (Gupta, Sreenivasamurthy)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2609.24036", date: "2026-09-21", access: full, locator: "Abstract"}
    - {ref: ARXIV-2609.33796, title: "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation (Zhou, Vatsa, Eiers)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2609.33796", date: "2026-09-27", access: full, locator: "Abstract"}
    - {ref: ARXIV-2503.11573, title: "Synthesizing Access Control Policies using Large Language Models", publisher: arXiv (preprint, not peer reviewed), type: academic, url: "https://arxiv.org/abs/2503.11573", date: "2025-03-14", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (research only): merged from practice 20 and discourse 16; no deployment found. All are preprints and results
    come from the authors' own datasets. Microsoft's Copilot gives lifecycle-workflow guidance (entry 09) but not
    verified policy generation. Gartner's IAM Summit (from 2026-12-07) lists runtime and policy-based authorisation
    sessions, which shows interest but not this use (GARTNER-IAMSUMMIT-2026, cited in the module). Cloud IAM policy
    authoring overlaps with the cloud-infrastructure module.

