# Use cases: security / identity-access
# Synthesised 2026-10-17 from the wave-4 practice, discourse and governance deep dives, the security landscape scan
# and items other security angle files routed to identity-access (50 candidate entries in, 24 out).
# Source refs are canonical keys. Where the angles used different keys for the same document, one key is kept:
# MSFT-CAAGENT-2026 (= MS-CAAGENT-2026), MSFT-RISKYUSER-2026 (= MS-ENTRA-RISKYUSER-2025), MSFT-LIFECYCLE-2026
# (= MS-ENTRA-LIFECYCLE-2025), MSFT-ARREC-2026 (= MSFT-ENTRA-ACCESSREV-2026), MSFT-ENTRAWN-2026
# (= MS-ENTRA-WHATSNEW-OCT-2026), OKTA-TI-2026 (= OKTA-TI-INVARIANTS-2026), OKTA-AUTHSURVEY-2026 (= OKTA-YUBICO-2026),
# FINCEN-DEEPFAKE-2024 (= FINCEN-ALERT004-2024), NIST-SP80063-4-2025 (= NIST-80063-2025), CISA-IR8587-2026
# (= CISA-NIST-IR8587-2026), PANW-IDLANDSCAPE-2026 (= PANW-LANDSCAPE-2026, an excerpt page of the same report).
# Key collision: the practice angle used FBI-IC3-2025 for the FBI public service announcement of 2025-05-15; it is
# renamed FBI-IC3PSA-2025 here, and FBI-IC3-2025 means the 2025 Internet Crime Report (governance angle).
# Almost every outcome figure is vendor-published. No override, false-approval or error rate from production was
# found for any AI feature in workforce identity and access management (IAM). Identities for AI agents are covered in
# the ai-security module and are not repeated here.

- id: security-identity-access-01
  title: Daily agent scan of Conditional Access policies for coverage gaps, with report-only fixes an administrator approves
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Conditional Access policy sets (the rules that decide when a sign-in needs MFA, a compliant device or is blocked)
    grow over time. New users, apps and agent identities can fall outside MFA or device controls, policies overlap, and
    some carry too many or no exceptions. Finding these gaps meant reading policy logic by hand; one customer quoted by
    Microsoft says it used to take weeks of manual review (MSFT-ENTRAGA-2025, customer quotes).
  solution: >-
    A Security Copilot agent in the Microsoft Entra admin center scans the tenant's Conditional Access policies every 24
    hours (or on demand). It looks for users and apps with no MFA or device-control policy, legacy-authentication and
    device-code gaps, overlapping policies that could be consolidated, and outlier policies with too many or no
    exceptions. It proposes a new policy in report-only mode or an edit, shows its reasoning and logs its activity.
    Later releases add chat with the agent, a five-phase rollout plan, Intune alignment, root-cause analysis of failed
    sign-ins and ServiceNow change requests.
  outcomes:
    - {lever: quality, description: "Microsoft reports gaps found per customer since general availability", figure: "26 policy gaps per customer per month (average)", measures: "Average policy gaps the agent uncovered per customer per month since general availability, in Microsoft's words; number of customers and period not stated", provenance: vendor-published, source_ref: MSFT-CAUPDATE-2025}
    - {lever: risk, description: "Microsoft reports customers who improved their posture", figure: "73% of customers using the agent", measures: "Share of customers using the agent that Microsoft says made 'meaningful improvements' in Zero Trust security posture; 'meaningful' is not defined and the denominator is not given", provenance: vendor-published, source_ref: MSFT-CAUPDATE-2025}
    - {lever: speed, description: "Microsoft reports preview customers who got usable recommendations quickly", figure: "More than 83% of preview customers", measures: "Customers who used the agent during preview and received actionable recommendations in their first few runs; number of preview customers not stated", provenance: vendor-published, source_ref: MSFT-ENTRAGA-2025}
    - {lever: speed, description: "A named customer's identity lead says the agent replaces review that used to take weeks", figure: "weeks of manual review (qualitative)", measures: "Quote from Avanade's Global Security Technology Lead as printed by Microsoft; no measurement", provenance: self-reported, source_ref: MSFT-ENTRAGA-2025}
  prerequisites:
    - "Microsoft Entra ID P1 or higher (P2 for risk-based policy suggestions) (MSFT-CAAGENT-2026, Prerequisites)"
    - "Security Copilot security compute units provisioned; the documentation gives an average of under one unit per run, and at least one provisioned unit is billed monthly even if unused (MSFT-CAAGENT-2026, Prerequisites)"
    - "Security Administrator role to activate the agent; Conditional Access Administrator or Security Administrator to act on suggestions (MSFT-CAAGENT-2026)"
    - "Intune licences for device-based control suggestions (MSFT-CAAGENT-2026)"
  risks_and_guardrails:
    - "The agent changes no existing policy unless an administrator explicitly approves, and every new policy it suggests is created in report-only mode (MSFT-CAAGENT-2026, 'How it works')"
    - "Documented limits: a run reviews up to 300 users and 150 applications and evaluates 40 policy pairs; scanning covers 24 hours; a started run cannot be stopped; suggestions cannot be customised or overridden (MSFT-CAAGENT-2026, 'Limitations')"
    - "Activity (install, enable, run history) is written to the Security Copilot audit log, and the agent gives plain-language explanations of each recommendation (MSFT-ENTRAGA-2025, 'What's new in GA')"
    - "Deep analysis flags missing break-glass accounts to prevent lockout (MSFT-CAUPDATE-2025, 'Always learning')"
  human_checkpoints:
    - "Administrator reviews each suggestion, its rationale and the policy contents before approving (MSFT-CAAGENT-2026)"
    - "Report-only mode and a phased rollout let administrators see the impact before enforcement (MSFT-CAUPDATE-2025)"
    - "Read-only roles (Security Reader, Global Reader) can see suggestions but not act (MSFT-CAAGENT-2026, Prerequisites)"
  role_evolution: >-
    Conditional Access administrators move from hand-reading policy logic to approving or rejecting agent suggestions
    and writing custom instructions. Microsoft describes the aim as freeing admins for strategic improvements
    (MSFT-CAUPDATE-2025, introduction).
  evidence_grade: B
  sources:
    - {ref: MSFT-CAAGENT-2026, title: "Microsoft Entra Conditional Access Optimization Agent", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/security-copilot/conditional-access-agent-optimization", date: "2026-06-23", access: full, locator: "Overview; Prerequisites; Limitations; How it works"}
    - {ref: MSFT-ENTRAGA-2025, title: "Smarter identity security starts with AI (blog, A. Simons)", publisher: "Microsoft Tech Community, Microsoft Entra Blog", type: vendor, url: "https://techcommunity.microsoft.com/blog/microsoft-entra-blog/-/4429001", date: "2025-07-14", access: full, locator: "Section 'Conditional Access Optimization Agent is now generally available' and customer quotes"}
    - {ref: MSFT-CAUPDATE-2025, title: "The Conditional Access Optimization Agent keeps getting better and making your life easier (blog, A. Simons)", publisher: "Microsoft Tech Community, Microsoft Entra Blog", type: vendor, url: "https://techcommunity.microsoft.com/blog/microsoft-entra-blog/-/4460535", date: "2025-10-14", access: full, locator: "Introduction (26 gaps, 73%); sections on chat, phased rollout, deep analysis, ServiceNow"}
    - {ref: MSFT-ENTRAAGENTS-2026, title: "Microsoft Entra agents (overview)", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/security-copilot/entra-agents", date: "2026-01-21", access: full, locator: "'Conditional Access Optimization Agent' attribute table (trigger: every 24 hours or manual)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 01 and discourse 03 (which graded it C as documentation only and scoped it as step). Kept as
    process: the daily scan makes a periodic manual review continuous. Grade B, not A: the named customers (Avanade,
    Athora) give quotes only, and the figures are Microsoft aggregates across unnamed customers. No false-positive,
    acceptance or rejection rate for the agent's suggestions was found. The ServiceNow integration and activity-based
    runs are marked preview. Practitioner reviews (Practical365, 2025-10-07; a commenter cross-checking the agent
    against the free Maester tool) were seen only in search results and are not used.

- id: security-identity-access-02
  title: Agent-planned passkey adoption campaigns for privileged administrators
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [coordination-scheduling, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Moving administrators to phishing-resistant sign-in (passkeys, which cannot be replayed on a fake site) needs
    readiness checks on devices and operating systems, user nudges, grace periods and a final enforcement switch, which
    is manual coordination at scale.
  solution: >-
    The Conditional Access Optimization Agent identifies eligible privileged administrators (up to 200 users per
    campaign), assesses device and passkey readiness, generates a four-stage plan (target users, check device
    readiness, require passkey registration, enforce passkey usage), guides users through the steps, and applies
    Conditional Access enforcement as users become ready. It re-evaluates progress and advances users automatically.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "No result figures in the documentation", provenance: vendor-published, source_ref: MSFT-PASSKEYCAMP-2026}
  prerequisites:
    - "Entra ID P1 or higher and available security compute units (MSFT-PASSKEYCAMP-2026, Prerequisites)"
    - "Passkeys enabled in the Authentication methods policy (MSFT-PASSKEYCAMP-2026)"
    - "Security Administrator role; the Conditional Access Administrator role cannot manage campaigns (MSFT-PASSKEYCAMP-2026)"
  risks_and_guardrails:
    - "Campaign settings can be edited only while the campaign is in the 'Not started' state (MSFT-PASSKEYCAMP-2026, 'Review and customize')"
    - "The documentation recommends excluding break-glass or emergency-access accounts (MSFT-PASSKEYCAMP-2026, tip under 'Review targeted users')"
    - "Users who lack a compatible device or OS are held in the device-readiness stage rather than enforced (MSFT-PASSKEYCAMP-2026)"
    - "Attackers push users to downgrade from a phishing-resistant method to a phishable one; Okta saw an August 2026 phishing kit telling users a hardware key 'may need to be re-registered' (OKTA-TI-MFADOWNGRADE-2026)"
  human_checkpoints:
    - "Administrator reviews the proposed plan and can edit targeted users and grace periods before deploying (MSFT-PASSKEYCAMP-2026)"
    - "Suggestions can be dismissed like any other agent suggestion (MSFT-PASSKEYCAMP-2026)"
  role_evolution: >-
    The identity administrator reviews and tunes a campaign plan rather than building the list, notices and enforcement
    steps by hand (MSFT-PASSKEYCAMP-2026, introduction).
  evidence_grade: C
  sources:
    - {ref: MSFT-PASSKEYCAMP-2026, title: "Conditional Access Optimization Agent: passkey adoption campaigns", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/security-copilot/conditional-access-agent-optimization-passkeys", date: "2026-05-22", access: full, locator: "Introduction; Prerequisites; 'How the agent identifies passkey campaign candidates'; campaign stages"}
    - {ref: OKTA-TI-2026, title: "New speed, same tricks: Defend against AI threats with security fundamentals (B. Winterford, Okta Threat Intelligence)", publisher: Okta Newsroom, type: vendor, url: "https://www.okta.com/newsroom/articles/new-speed-same-tricks-defend-against-ai-threats-with-security-fundamentals/", date: "2026-10-07", access: full, locator: "'How the security invariants performed'"}
    - {ref: OKTA-TI-MFADOWNGRADE-2026, title: "When enrollment isn't enough: How attackers trick users into MFA downgrades", publisher: Okta Threat Intelligence, type: vendor, url: "https://www.okta.com/blog/threat-intelligence/when_enrollment_isnt_enough/", date: "2026-10-05", access: full, locator: "'Executive summary'; 'When the downgrade pretext is baked into the phishing kit'"}
    - {ref: FORRESTER-MSPASSKEY-2026, title: "Microsoft Makes Passkeys Default: What Identity And Security Leaders Need To Do", publisher: Forrester, type: firm, url: "https://www.forrester.com/blogs/microsoft-makes-passkeys-default-what-identity-and-security-leaders-need-to-do/", date: "2026-07-16", access: full, locator: "Passkeys default from 2026-09-01; SMS and voice retirement on 2027-02-01"}
  last_reviewed: "2026-10-17"
  notes: >-
    Practice 02. Documentation only; it does not state preview or general availability and no customer is named.
    Context (measures the control, not the agent): in about 6,000 real social-engineering events, Okta estimates
    requiring enrolment of phishing-resistant factors could have stopped 88% of account-takeover attempts, rising to
    99.75% with app sign-in enforcement (OKTA-TI-2026; vendor-published counterfactual). Forrester reports Microsoft
    making passkeys the default in Entra from 2026-09-01 and retiring SMS and voice on 2027-02-01
    (FORRESTER-MSPASSKEY-2026).

- id: security-identity-access-03
  title: LLM reviewer for access requests that approves routine requests above a threshold and escalates the rest
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [transaction-processing, expert-judgment]
  pattern: document-to-decision
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Access that needs a manager's approval sits in queues, and approvers lack the context to judge a request.
    Instacart's security lead says managers across the industry probably approve close to 100% of the time
    (C1-INSTACART-2024). Opal says most teams lack time or context, so approval becomes the default; across about half a
    million requests on its platform the median approval took 15 minutes (over 24 hours at some enterprises) and 43.5%
    of granted access went unused for more than 90 days (OPAL-PALADIN-2026).
  solution: >-
    Instacart built Gadjit, an LLM-powered bot released as open source. When a just-in-time (temporary) request needing
    manager approval appears in the identity governance platform (ConductorOne), Gadjit pulls the entitlement
    description, its risk level and the people who hold it. An LLM compares the requester's attributes with the
    entitlement and its current holders; a separate scoring step estimates how likely the request is legitimate. Above a
    set threshold the bot approves and access is provisioned automatically. Opal's agent, Paladin (announced
    2026-08-06), reads the request, gathers context from connected apps (policy documents, tickets, incident tools,
    device posture), reasons against the customer's policy and returns a decision with a plain-language rationale; it
    can run as an advisor or handle routine requests and escalate the rest.
  outcomes:
    - {lever: quality, description: "Instacart says the bot's accuracy in testing is close to perfect", figure: "consistently nearly 100% in testing", measures: "Instacart's description of Gadjit accuracy in testing as relayed in a ConductorOne customer story; test set, ground truth and sample size not stated", provenance: vendor-published, source_ref: C1-INSTACART-2024}
    - {lever: risk, description: "Share of privileged permissions moved to automated just-in-time access by the policy engine before the bot (rule-based, not AI)", figure: "95%", measures: "Share of Instacart's privileged permissions moved to automated just-in-time access with the C1.ai policy engine; the same page also says 100% of privileged access moved, and does not explain the difference", provenance: vendor-published, source_ref: C1-INSTACART-2024}
    - {lever: speed, description: "Baseline from Opal's platform, not a result for its agent", figure: "median approval 15 minutes; 43.5% of granted access unused over 90 days", measures: "About half a million access requests on the Opal platform in the prior year", provenance: vendor-published, source_ref: OPAL-PALADIN-2026}
  prerequisites:
    - "Entitlement, HR and cloud data centralised in the governance platform and reachable by API (C1-INSTACART-2024)"
    - "Access policies written as code (Terraform) so conditions are reviewable (C1-INSTACART-2024)"
    - "An LLM plugin (the README lists OpenAI GPT-4o) and a scoring plugin, deployable as a Lambda webhook or a once-a-minute job (GADJIT-GITHUB-2024, 'Deployment')"
    - "Connected data sources and a curated policy; Opal says customers choose what the agent reads (OPAL-PALADIN-2026)"
  risks_and_guardrails:
    - "Instacart states generative AI is not yet reliable enough to trust with objective approval decisions; it uses the LLM to read and interpret data and a separate computed score for the decision (C1-INSTACART-2024)"
    - "Every step is visible in the platform audit log, and Instacart says auditors have raised no unanswered question about the audit path (C1-INSTACART-2024)"
    - "Privileged access is capped at a maximum of 90 days (C1-INSTACART-2024)"
    - "Opal says authority is graduated, the agent acts only within the role granted, and every recommendation and decision is logged with its reasoning (OPAL-PALADIN-2026)"
  human_checkpoints:
    - "Policy-as-code configurations are reviewed by account owners every quarter (C1-INSTACART-2024)"
    - "Risky, unusual or ambiguous requests go to a person in Opal's design; the customer decides where the line sits (OPAL-PALADIN-2026)"
    - "What happens at Instacart to requests that score below the threshold is not stated in the sources"
  role_evolution: >-
    Before the move to just-in-time access, highly paid staff engineers approved sensitive requests and ran quarterly
    reviews; now access policies are code that account owners review quarterly, and Instacart's infrastructure security
    team built the bot (C1-INSTACART-2024, sections on conditional policies, Gadjit and the closing section). Opal says
    careful review does not scale by adding headcount (OPAL-PALADIN-2026).
  evidence_grade: B
  sources:
    - {ref: C1-INSTACART-2024, title: "How Instacart is using AI to achieve zero standing privileges (customer story; undated, year inferred from the BSidesLV24 talk it describes)", publisher: ConductorOne (C1.ai), type: vendor, url: "https://www.conductorone.com/customers/instacart", date: "2024", access: full, locator: "Sections 'Automating JIT access with conditional policies' and 'Using AI to get to 100% JIT access automation'"}
    - {ref: GADJIT-GITHUB-2024, title: "instacart/gadjit: Automated Access Request Reviews (README; undated, year inferred)", publisher: GitHub (Instacart), type: community, url: "https://github.com/instacart/gadjit", date: "2024", access: full, locator: "README: 'Plugin Architecture'; 'Deployment'"}
    - {ref: SECBOULEVARD-BSIDESLV24-2025, title: "BSidesLV24 - Breaking Ground - JIT Happens: How Instacart Uses AI to Keep Doors Open and Risks Closed", publisher: Security Boulevard, type: conference, url: "https://securityboulevard.com/2025/04/bsideslv24-breaking-ground-jit-happens-how-instacart-uses-ai-to-keep-doors-open-and-risks-closed/", date: "2025-04-08", access: full, locator: "Talk title and embedded recording (opened through a text mirror; supports the talk's existence only)"}
    - {ref: OPAL-PALADIN-2026, title: "Paladin: AI that applies your policy to every request", publisher: Opal Security, type: vendor, url: "https://www.opal.dev/blog/paladin-policy-ai", date: "2026-08-06", access: full, locator: "Sections 'Approval becomes the default', 'Meet Paladin', 'Automate the routine, escalate the rest'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 05 (B) and discourse 14 (C). Instacart is the only first-party-built LLM approval bot found.
    Grade B, not A: 'nearly 100%' has no denominator, and the 95% figure belongs to the rule-based policy engine. The
    Opal blog index lists posts saying Paladin reached general availability; only titles were seen. A July 2026
    1Password launch (auto-approve lower-risk requests) was seen only in search results and is described there as
    rule-based routing; not used.

- id: security-identity-access-04
  title: Zero standing privilege with context-based just-in-time grants and revocation for privileged access
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [transaction-processing, software-systems]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Privileged access is still mostly standing (always on). Palo Alto Networks states that 61% of privileged access
    requests are fulfilled with standing privilege rather than on demand (PANW-IDIRA-2026). Regulators require
    privileged, emergency and administrator access on a need-to-use or ad hoc basis with strong authentication
    (DORA-RTS-2024, Art. 21(e)(ii) and (f)(ii)) and individualised, restricted administration privileges
    (NIS2-IMPL-2024, point 11.3).
  solution: >-
    Vendors replace always-on admin rights with access granted for a task, re-evaluated while in use and revoked when
    risk changes. Palo Alto Networks describes three levels (vaulted persistent access, just-in-time access, and zero
    standing privilege where its platform 'analyzes live context and risk' and grants short-lived, task-scoped access)
    and says they can run in parallel (PANW-DYNPRIV-2026). Idira (generally available 2026-05-12) applies this to every
    identity; CrowdStrike (2026-09-02) extends it to SaaS, endpoints, servers and cloud; SailPoint (2026-10-06) adds
    just-in-time provisioning with conditions.
  outcomes:
    - {lever: risk, description: "Instacart moved most privileged permissions to automated just-in-time access using a rule-based policy engine (adjacent evidence, not AI)", figure: "95%", measures: "Share of Instacart's privileged permissions moved to automated just-in-time access (the page also says 100%); not an AI measurement", provenance: vendor-published, source_ref: C1-INSTACART-2024}
    - {lever: risk, description: "Baseline practice, not a result: few organizations include ending privileged sessions in incident response", figure: "36% terminate active privileged sessions; 40% remove admin rights", measures: "Share of 2,930 survey respondents including each action in incident-response procedures (vendor-commissioned survey, fielded March-April 2026)", provenance: vendor-published, source_ref: PANW-IDLANDSCAPE-2026}
  prerequisites:
    - "Discovery of identities, entitlements and access paths first (PANW-DYNPRIV-2026, opening paragraphs)"
    - "Separate administration accounts used only for administration (NIS2-IMPL-2024, point 11.3.2)"
    - "Context signals (device, threat, business) that can trigger revocation, and an access policy engine (PANW-IDIRA-2026; C1-INSTACART-2024)"
  risks_and_guardrails:
    - "Palo Alto Networks says moving to zero standing privilege cannot happen overnight; vaulting stays for root, built-in and break-glass accounts (PANW-DYNPRIV-2026)"
    - "56% of survey respondents say they cannot effectively enforce continuous least privilege for service accounts, so just-in-time cover may be partial (PANW-IDLANDSCAPE-2026, p. 15)"
    - "Instacart's rollout kept a 90-day cap and policy-as-code review rather than removing oversight (C1-INSTACART-2024)"
    - "CrowdStrike's post notes unreleased features are subject to change (CROWDSTRIKE-AGENTICIDP-2026, 'Forward-Looking Statements')"
  human_checkpoints:
    - "A few sensitive entitlements at Instacart still needed manager approval before the LLM bot (C1-INSTACART-2024)"
    - "Approval of elevation requests is not described in the vendor sources; DORA requires ad hoc assignment (DORA-RTS-2024, Art. 21(e)(ii))"
  role_evolution: >-
    Instacart's infrastructure security lead describes the change as freeing highly paid staff engineers from approvals
    and quarterly reviews (C1-INSTACART-2024, closing section).
  evidence_grade: C
  sources:
    - {ref: PANW-IDIRA-2026, title: "Palo Alto Networks Introduces Idira: the Next-Generation Identity Security Platform Built for the AI Enterprise", publisher: Palo Alto Networks, type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-introduces-idira--the-next-generation-identity-security-platform-built-for-the-ai-enterprise", date: "2026-05-12", access: full, locator: "Opening paragraphs (61% statistic); 'Control Every Privilege'; availability line"}
    - {ref: PANW-DYNPRIV-2026, title: "Dynamic Privilege Control Beyond Login", publisher: Palo Alto Networks (Idira blog), type: vendor, url: "https://www.paloaltonetworks.com/blog/identity-security/dynamic-privilege-control-moment-of-action/", date: "2026-09-23", access: full, locator: "Sections 'Static Controls Leave Privilege Exposed', 'Modernize Control Without Abandoning Vaulting'"}
    - {ref: PANW-MODERNPAM-2026, title: "Modern Privileged Access Management (PAM)", publisher: Palo Alto Networks (Idira blog), type: vendor, url: "https://www.paloaltonetworks.com/blog/identity-security/modern-privileged-access-management/", date: "2026-08-17", access: full, locator: "Sections 'What Is Modern PAM?' and 'Privilege Is Defined by the Action, Not the Account'"}
    - {ref: CROWDSTRIKE-AGENTICIDP-2026, title: "CrowdStrike Announces Agentic Identity Provider", publisher: CrowdStrike, type: vendor, url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-announces-agentic-identity-provider/", date: "2026-09-02", access: full, locator: "Section 'Extending Modern Privileged Access Everywhere Work Happens'"}
    - {ref: SAILPOINT-AUTONOMOUS-2026, title: "From Chaos to Control: SailPoint Unlocks a Secure Agentic Era with Autonomous Identity Security", publisher: SailPoint, type: vendor, url: "https://www.sailpoint.com/press-releases/sailpoint-unlocks-a-secure-agentic-era-with-autonomous-identity-security", date: "2026-10-06", access: full, locator: "'Zero Standing Privilege for humans and machines' bullet"}
    - {ref: C1-INSTACART-2024, title: "How Instacart is using AI to achieve zero standing privileges (customer story; undated, year inferred)", publisher: ConductorOne (C1.ai), type: vendor, url: "https://www.conductorone.com/customers/instacart", date: "2024", access: full, locator: "Section 'Automating JIT access with conditional policies'"}
    - {ref: PANW-IDLANDSCAPE-2026, title: "2026 Identity Security Landscape (research by Vanson Bourne, n=2,930)", publisher: Palo Alto Networks, type: survey, url: "https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/reports/2026-identity-security-landscape-report.pdf", date: "2026-06", access: full, locator: "Figure 5 (p. 14); p. 15"}
    - {ref: DORA-RTS-2024, title: "Commission Delegated Regulation (EU) 2024/1774 (ICT risk management framework RTS under DORA)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1774", date: "2024-06-25", access: full, locator: "Art. 21"}
    - {ref: NIS2-IMPL-2024, title: "Commission Implementing Regulation (EU) 2024/2690 (technical and methodological requirements under NIS2)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R2690", date: "2024-10-18", access: full, locator: "Annex, point 11.3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 11, discourse 09 and governance 10 (governance had augment). Grade C: the AI element is vendor
    language on a mostly rule-based control; the only named measurement (Instacart) is adjacent and not AI. The source
    and denominator of Palo Alto Networks' 61% figure are not named in the release. Agent privilege is covered in the
    ai-security module.

- id: security-identity-access-05
  title: Conversational assistant for employee IT and access questions and requests
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [client-interaction, transaction-processing]
  pattern: service-agent-escalation
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    New hires and employees must already know which of about 1,500 applications to ask about access, devices and VPN, so
    requests go to the wrong place; Okta says building a separate agent per workflow would produce tens of thousands of
    agents (OKTA-DEX-2026, Lesson 1).
  solution: >-
    Okta built Dex, an orchestrating agent on its Okta One platform that covers IT, people, travel and expense support
    as 'one front door', including new hires' questions about getting access to systems. Dex is registered in Okta's directory like a human identity
    and is checked against the signed-in user's access each time. SailPoint has announced (2026-10-06) an AI agent for
    natural-language access requests inside chat tools, with custom forms for business justification.
  outcomes:
    - {lever: experience, description: "Employee adoption two weeks after launch", figure: "25% in two weeks", measures: "Share of Okta employees using Dex within two weeks of launch (denominator not stated by Okta)", provenance: self-reported, source_ref: OKTA-DEX-2026}
    - {lever: capacity, description: "Interactions handled to date", figure: "over 23,500", measures: "Interactions Dex has fielded 'to date' (date of count not stated)", provenance: self-reported, source_ref: OKTA-DEX-2026}
  prerequisites:
    - "Agent identities in the central directory, with access capped at the signed-in human's access (OKTA-DEX-2026, Lesson 2)"
    - "Knowledge bases cleaned until the agent gives the right answer (OKTA-DEX-2026, Lesson 3)"
    - "Tool scoping per identity to control token cost (OKTA-DEX-2026, Lesson 3)"
  risks_and_guardrails:
    - "Okta says an agent should not have more access to systems and data than the human it acts for, and secure token storage replaces static credentials (OKTA-DEX-2026, Lesson 2)"
    - "'You can't have a compensation agent that's only 80% accurate'; AI can be confidently incorrect (OKTA-DEX-2026, Lesson 3)"
    - "SailPoint's conversational requests were announced with no general-availability date in the release (SAILPOINT-HUMANFABRIC-2026)"
  human_checkpoints:
    - "Not described for Dex; SailPoint's agent collects justification and compliance details in the chat flow before the request proceeds (SAILPOINT-HUMANFABRIC-2026)"
  role_evolution: >-
    Okta's SVP says IT risks becoming the 'Department of No' under AI pressure, and positions fewer, more capable agents
    on a governed identity base as the alternative (OKTA-DEX-2026, introduction and closing).
  evidence_grade: B
  sources:
    - {ref: OKTA-DEX-2026, title: "Lessons learned from securing our digital workforce (J. Cline, SVP Technology, Data & Intelligence)", publisher: Okta Newsroom, type: vendor, url: "https://www.okta.com/newsroom/articles/lessons-from-securing-our-digital-workforce/", date: "2026-09-17", access: full, locator: "Lesson 1 (Dex adoption figures); Lesson 2; Lesson 3"}
    - {ref: SAILPOINT-HUMANFABRIC-2026, title: "SailPoint Announces Modernization Capabilities for both Cloud and On-Premises Identity Security", publisher: SailPoint, type: vendor, url: "https://www.sailpoint.com/press-releases/sailpoint-announces-modernization-capabilities-for-both-cloud-and-on-premises-identity-security", date: "2026-10-06", access: full, locator: "'Conversational Access Requests' bullet"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 06 and discourse 11 (both B). Grade capped at B: the figures are adoption counts for general
    IT, HR, travel and expense support, not access requests alone, and say nothing on decision quality. Okta is both
    vendor and deploying firm, so figures are self-reported. Overlaps with an IT service-desk use case; the agent-identity
    half (Dex registered in the directory) belongs to the ai-security module.

- id: security-identity-access-06
  title: Evidence-based recommendations and an agent first pass on access review decisions
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Regulators set review frequencies that create a lot of reviewer work: DORA's technical standard requires access
    rights to be updated at least yearly and at least every six months for systems supporting critical or important
    functions (DORA-RTS-2024, Art. 21(e)(iv)); NYDFS requires at least annual review (NYDFS-AIGUIDE-2024). Reviewers in
    these certifications face long lists with little context, and SailPoint and Lumos say many approve everything
    ('rubber stamping') (SAILPOINT-RECS-2022; LUMOS-UAR-2025); no independent rate was found.
  solution: >-
    The review screen carries system recommendations. Microsoft Entra marks users inactive for 30 days with a Deny
    recommendation and uses a machine-learning 'user-to-group affiliation' score based on reporting-structure distance
    to suggest Deny for outliers. SailPoint's Access Recommendations use peer-group analysis to suggest approve or
    revoke and auto-approve low-risk items. Lumos describes an AI agent that makes a first pass on every identity
    (role, department, sensitivity, last activity, peer group, separation-of-duties conflicts). Opal (2026-06-15)
    surfaces low-risk grants with the signals used so a reviewer can clear them in one click, and sends risky grants to a
    person.
  outcomes:
    - {lever: speed, description: "Lumos states review campaigns finish faster than manual spreadsheet reviews", figure: "up to 6x faster", measures: "Lumos's claim for finishing review campaigns; baseline, sample and customer not stated", provenance: vendor-published, source_ref: LUMOS-UAR-2025}
    - {lever: quality, description: "none published; no override rate, false-approval rate or before/after comparison in any source", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: OPAL-REVIEWS-2026}
  prerequisites:
    - "Usage and last-sign-in data per entitlement, an organisation hierarchy and manager attribute; Entra's affiliation recommendation needs an ID Governance licence and does not support groups over 600 users (MSFT-ARREC-2026)"
    - "Connectors that bring humans, service accounts and other non-human identities into one review (LUMOS-UAR-2025)"
    - "A written policy the model can be tuned to, with a confidence threshold a recommendation must clear before it acts (OPAL-REVIEWS-2026, 'Tune the AI to your policy')"
  risks_and_guardrails:
    - "SailPoint publishes no error or override rate for its low-risk auto-approvals (SAILPOINT-RECS-2022)"
    - "Entra's inactivity recommendation is computed when the review starts and not updated during it; in the documentation's own example, a group member gets a Deny recommendation only because he sits in a different division from the rest of the group (MSFT-ARREC-2026)"
    - "Admins can query which review decisions overrode AI-suggested actions, which gives a way to track override rates (MSFT-GOVOPT-2026, 'Access review decision analysis')"
    - "Opal logs every recommendation and approval with its reasoning for audit (OPAL-REVIEWS-2026)"
    - "NHIMG's summary of an Omada post says AI should prioritise and explain, not erase accountability; final approval still needs human ownership and auditable reasoning (NHIMG-OMADA-2026, 'Key questions')"
  human_checkpoints:
    - "Application owners and managers approve or deny each item; recommendations are decision helpers (MSFT-ARREC-2026; LUMOS-UAR-2025)"
    - "Opal says risky calls always reach a person and autonomy is a dial the customer sets (OPAL-REVIEWS-2026, 'A dial, not a switch')"
  role_evolution: >-
    Reviewers check evidence and exceptions instead of reading raw entitlement rows. Prosper's corporate IT manager says
    activity and last-login data inside the review screen turned a compliance task into a security check
    (LUMOS-UAR-2025, customer quote). Opal frames the constraint as reviewer attention, not effort (OPAL-REVIEWS-2026).
  evidence_grade: B
  sources:
    - {ref: LUMOS-UAR-2025, title: "Lumos Launches Industry-First Agentic User Access Reviews, Moving Towards Autonomous Identity Governance", publisher: Lumos, type: vendor, url: "https://www.lumos.com/blog/lumos-launches-industry-first-agentic-user-access-reviews", date: "2025-12-08", access: full, locator: "Launch text; 'Customer Validation' (Prosper); 'Key Capabilities'"}
    - {ref: MSFT-ARREC-2026, title: "Review recommendations for access reviews (Microsoft Entra ID Governance)", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/id-governance/review-recommendations-access-reviews", date: "2026-03-12", access: full, locator: "'Inactive user recommendations'; 'User-to-Group Affiliation'"}
    - {ref: MSFT-GOVOPT-2026, title: "Governance and optimization with Security Copilot in Microsoft Entra", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/security-copilot/entra-governance-optimization", date: "2025-09-23", access: full, locator: "'Access review decision analysis' prompts"}
    - {ref: SAILPOINT-RECS-2022, title: "AI-driven Access Recommendations: Less Certification. More Revocation.", publisher: SailPoint, type: vendor, url: "https://www.sailpoint.com/blog/ai-driven-access-recommendations-less-certification-more-revocation", date: "2022-06-30", access: full, locator: "Section 'AI-driven Access Recommendations'"}
    - {ref: OPAL-REVIEWS-2026, title: "AI-Guided access reviews, now in Opal", publisher: Opal Security, type: vendor, url: "https://www.opal.dev/blog/ai-guided-access-reviews", date: "2026-06-15", access: full, locator: "Sections 'Review faster', 'A dial, not a switch', 'Tune the AI to your policy'"}
    - {ref: NHIMG-SAILPOINT-2026, title: "AI-driven access recommendations expose the limits of certification (NHIMG summary of the SailPoint post)", publisher: Non-Human Identity Management Group, type: community, url: "https://nhimg.org/articles/ai-driven-access-recommendations-expose-the-limits-of-certification/", date: "2026-06-24", access: full, locator: "'At a glance' and 'Key questions'"}
    - {ref: NHIMG-OMADA-2026, title: "AI augments IGA by fixing review fatigue and weak audit context (NHIMG summary of an Omada post)", publisher: Non-Human Identity Management Group, type: community, url: "https://nhimg.org/articles/ai-augments-iga-by-fixing-review-fatigue-and-weak-audit-context/", date: "2026-06-24", access: full, locator: "'Key questions' (how organisations should use AI in access certification)"}
    - {ref: DORA-RTS-2024, title: "Commission Delegated Regulation (EU) 2024/1774 (ICT risk management framework RTS under DORA)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1774", date: "2024-06-25", access: full, locator: "Art. 21(e)(iv)"}
    - {ref: NYDFS-AIGUIDE-2024, title: "Cybersecurity Risks Arising from Artificial Intelligence and Strategies to Combat Related Risks (Industry Letter)", publisher: NYDFS, type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Access Controls"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 04 (B), discourse 01 (C) and governance 08 (C). Grade B: Prosper is named but the evidence is a
    quote, and 'up to 6x' has no stated baseline. Date conflict: NHIMG labels the SailPoint post 2025-12-10 but the
    SailPoint page's JSON-LD gives 2022-06-30, so this is a long-standing feature. Opal names Mercari as governing more
    than 5,000 Okta entitlements through automated reviews but does not say Mercari uses the AI features. Search-only
    figures not used: over 90% of certifications approved without meaningful review (unattributed), a Ponemon 63%
    rubber-stamping figure, an Avatier 70% fatigue reduction, and SailPoint's April 2026 infographic (30% cite reviewer
    fatigue leading to rubber-stamping). Control testing of user access reviews by audit agents is in governance-risk
    (provisional id security-governance-risk-07).

- id: security-identity-access-07
  title: Usage-based role mining and entitlement right-sizing recommendations
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [expert-judgment, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Roles are hand-curated (OPAL-PALADIN-2026, 'Where Paladin is going'), and reviewers face dense entitlement lists
    they cannot confidently evaluate (NHIMG-OMADA-2026). Least privilege is mandated (DORA-RTS-2024, Art. 21(a)) but hard to keep: 56% of survey
    respondents say they cannot effectively enforce continuous least privilege for service accounts
    (PANW-IDLANDSCAPE-2026, p. 15).
  solution: >-
    Google's IAM recommender examines up to 90 days of permission usage and recommends removing or replacing roles that
    grant excess permissions; a machine-learning model also tries to identify permissions a principal is likely to need
    even if not recently used. Opal lists role mining (propose roles and cohorts from access people actually hold and
    use) and policy suggestions (promote access every cohort member gets to auto-approval, flag outliers) as where its
    agent 'is going'. Omada, via an NHIMG summary, says AI groups stable access into lean roles and focuses reviews on
    permissions that do not match peer patterns.
  outcomes:
    - {lever: risk, description: "none published; no reduction in excess permissions, accuracy or false-removal rate in the documentation", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: GOOGLE-IAMREC-2026}
  prerequisites:
    - "Usage data on granted access over an observation window, 90 days by default (30 or 60 days configurable for project-level recommendations) (GOOGLE-IAMREC-2026)"
    - "Accurate manager and HR mappings plus entitlement context (NHIMG-OMADA-2026)"
  risks_and_guardrails:
    - "Recommendations rest on observed use within the window, so rarely used but needed permissions are the risk; Google's ML component exists to reduce that (GOOGLE-IAMREC-2026)"
    - "PII is dropped and k-anonymity applied in Google's model pipeline (GOOGLE-IAMREC-2026)"
    - "Automated lifecycle management is expected only 'where feasible and appropriate' under DORA (DORA-RTS-2024, Art. 20)"
  human_checkpoints:
    - "Recommendations suggest removal or replacement; applying them is a separate step (GOOGLE-IAMREC-2026)"
    - "Not specified for Opal's role mining or policy suggestions"
  role_evolution: >-
    Platform and IAM teams move from writing roles by hand to approving or rejecting recommended changes at scale
    (GOOGLE-IAMREC-2026, overview).
  evidence_grade: C
  sources:
    - {ref: GOOGLE-IAMREC-2026, title: "Overview of role recommendations, Google Cloud Policy Intelligence (page last updated 2026-10-13)", publisher: Google Cloud, type: vendor, url: "https://cloud.google.com/policy-intelligence/docs/role-recommendations-overview", date: "2026-10-13", access: full, locator: "Overview; 'Machine learning for policy insights'; 'Observation period'"}
    - {ref: OPAL-PALADIN-2026, title: "Paladin: AI that applies your policy to every request", publisher: Opal Security, type: vendor, url: "https://www.opal.dev/blog/paladin-policy-ai", date: "2026-08-06", access: full, locator: "Section 'Where Paladin is going'"}
    - {ref: NHIMG-OMADA-2026, title: "AI augments IGA by fixing review fatigue and weak audit context (NHIMG summary of an Omada post)", publisher: Non-Human Identity Management Group, type: community, url: "https://nhimg.org/articles/ai-augments-iga-by-fixing-review-fatigue-and-weak-audit-context/", date: "2026-06-24", access: full, locator: "'Context' and 'Key questions'"}
    - {ref: DORA-RTS-2024, title: "Commission Delegated Regulation (EU) 2024/1774 (ICT risk management framework RTS under DORA)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1774", date: "2024-06-25", access: full, locator: "Art. 20 and 21(a)"}
    - {ref: PANW-IDLANDSCAPE-2026, title: "2026 Identity Security Landscape (research by Vanson Bourne, n=2,930)", publisher: Palo Alto Networks, type: survey, url: "https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/reports/2026-identity-security-landscape-report.pdf", date: "2026-06", access: full, locator: "p. 15"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse 02 and governance 09. Product documentation and a forward-looking vendor post; no customer or
    measured result was found for any entitlement-recommendation tool. The Omada original (dated 2025-08-15 by NHIMG)
    was not opened, so Omada claims are second-hand. Cloud IAM right-sizing overlaps with the cloud-infrastructure
    module.

- id: security-identity-access-08
  title: Continuous full-population identity posture checks with remediation and recorded evidence
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Periodic certifications and posture dashboards find stale access after the fact, and dashboards flag risks without
    fixing them. Survey respondents describe credentials active years after a project ended (PANW-IDLANDSCAPE-2026, p.
    15). Several regimes require documented, periodic proof of who has access: DORA, the NIS2 implementing regulation (a
    register of access rights and documented review results) and NYDFS (DORA-RTS-2024, Art. 21; NIS2-IMPL-2024, points
    11.2.2-11.2.3; NYDFS-AIGUIDE-2024).
  solution: >-
    SailPoint's Autonomous Identity Security Posture Management (announced 2026-10-06) uses live identity context to
    detect dormant accounts, partially offboarded identities, orphaned access, shadow admins and privileged outliers,
    then remediates, from one-click fixes (revoke access, disable an identity, assign an owner) to fully automated policy
    enforcement. Saviynt (2025-10-15) and Palo Alto Networks' Idira (2026-05-12) describe similar discovery and
    remediation across human and non-human identities. The governance angle adds an idea: test the full population of
    accounts and entitlements against policy continuously and record the result as regulator-facing evidence, instead of
    point-in-time sampling.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "Announcements carry no outcome figures", provenance: vendor-published, source_ref: SAILPOINT-AUTONOMOUS-2026}
  prerequisites:
    - "A unified identity data layer with connectors to apps and cloud (SAILPOINT-AUTONOMOUS-2026)"
    - "Policies that define when remediation may run without a person (SAILPOINT-AUTONOMOUS-2026)"
    - "A register of access rights granted, logging of access-rights management and documented review results (NIS2-IMPL-2024, points 11.2.2-11.2.3)"
  risks_and_guardrails:
    - "Remediation runs 'on each organization's terms', from one-click to fully automated, so autonomy is a configured setting (SAILPOINT-AUTONOMOUS-2026)"
    - "SailPoint's own release says features not yet available may not be delivered (SAILPOINT-HUMANFABRIC-2026, forward-looking statements)"
    - "Under NIS2 and DORA the legal duty to review stays with the entity; automating evidence does not move accountability (NIS2-IMPL-2024; DORA-RTS-2024, Art. 21)"
  human_checkpoints:
    - "One-click remediation leaves the decision with an admin; fully automated enforcement is the opt-in end of the range (SAILPOINT-AUTONOMOUS-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: C
  sources:
    - {ref: SAILPOINT-AUTONOMOUS-2026, title: "From Chaos to Control: SailPoint Unlocks a Secure Agentic Era with Autonomous Identity Security", publisher: SailPoint, type: vendor, url: "https://www.sailpoint.com/press-releases/sailpoint-unlocks-a-secure-agentic-era-with-autonomous-identity-security", date: "2026-10-06", access: full, locator: "A-ISPM section"}
    - {ref: SAILPOINT-HUMANFABRIC-2026, title: "SailPoint Announces Modernization Capabilities for both Cloud and On-Premises Identity Security", publisher: SailPoint, type: vendor, url: "https://www.sailpoint.com/press-releases/sailpoint-announces-modernization-capabilities-for-both-cloud-and-on-premises-identity-security", date: "2026-10-06", access: full, locator: "Forward-looking statements"}
    - {ref: SAVIYNT-AIONB-2025, title: "Saviynt Unveils Major AI Capabilities for Identity Security", publisher: Saviynt, type: vendor, url: "https://saviynt.com/press-release/saviynt-unveils-major-ai-capabilities-for-identity-security", date: "2025-10-15", access: full, locator: "'Secure All Identities' section"}
    - {ref: PANW-IDIRA-2026, title: "Palo Alto Networks Introduces Idira: the Next-Generation Identity Security Platform Built for the AI Enterprise", publisher: Palo Alto Networks, type: vendor, url: "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-introduces-idira--the-next-generation-identity-security-platform-built-for-the-ai-enterprise", date: "2026-05-12", access: full, locator: "'Discover Identity Risk' bullet"}
    - {ref: PANW-IDLANDSCAPE-2026, title: "2026 Identity Security Landscape (research by Vanson Bourne, n=2,930)", publisher: Palo Alto Networks, type: survey, url: "https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/reports/2026-identity-security-landscape-report.pdf", date: "2026-06", access: full, locator: "'The Ghosts of Access Past', p. 15"}
    - {ref: DORA-RTS-2024, title: "Commission Delegated Regulation (EU) 2024/1774 (ICT risk management framework RTS under DORA)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1774", date: "2024-06-25", access: full, locator: "Art. 21"}
    - {ref: NIS2-IMPL-2024, title: "Commission Implementing Regulation (EU) 2024/2690 (technical and methodological requirements under NIS2)", publisher: European Commission, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R2690", date: "2024-10-18", access: full, locator: "Annex, points 11.2.2-11.2.3"}
    - {ref: NYDFS-AIGUIDE-2024, title: "Cybersecurity Risks Arising from Artificial Intelligence and Strategies to Combat Related Risks (Industry Letter)", publisher: NYDFS, type: regulator, url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/il20241016-cyber-risks-ai-and-strategies-combat-related-risks", date: "2024-10-16", access: full, locator: "Access Controls"}
    - {ref: PATHLOCK-GARTNER-IGA-2026, title: "2026 Gartner IGA Market Guide: top findings (Pathlock summary)", publisher: Pathlock, type: vendor, url: "https://pathlock.com/blog/2026-gartner-iga-market-guide-top-findings/", date: "2026-10-05", access: full, locator: "Paragraph quoting the Gartner Market Guide on quarterly manual reviews"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice 10 (C) and governance 14 (D idea, full-population evidence for regulators). Announcements only;
    no named customer. SailPoint's release says A-ISPM is expected in Q4 of its fiscal 2027, so it was not yet available
    (SAILPOINT-AUTONOMOUS-2026). A vendor (Pathlock) quotes Gartner's 2026 IGA Market Guide as saying IGA is moving
    from quarterly cycles of manual access reviews to an autonomous, continuous, outcome-driven process; the Gartner
    guide itself is paywalled and was not read. No
    organization using AI to produce regulator-facing IAM evidence was found. SailPoint's Horizons survey (340
    leaders) is in the module metrics.

- id: security-identity-access-09
  title: Natural-language governance queries, audit preparation and lifecycle-workflow drafting for identity admins
  archetype: security
  module: identity-access
  function: technology-it
  work_types: [data-reporting, document-production, software-systems]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Preparing for a governance audit means pulling access review status, entitlement catalogues and privileged-role
    settings from several admin screens. Identity administrators also spend time configuring joiner-mover-leaver
    (starter, role change, leaver) workflows and diagnosing their processing results.
  solution: >-
    Security Copilot in the Microsoft Entra admin center answers governance prompts such as the top pending access
    reviews, who approved or denied in a review, which decisions overrode AI suggestions, what is in an entitlement
    catalogue, and privileged identity management (PIM) settings. For lifecycle workflows it gives step-by-step guidance
    for a new workflow from a prompt, lists templates, troubleshoots processing results and compares workflow versions.
    The admin still creates and enables the workflow.
  outcomes:
    - {lever: capacity, description: "none published; Microsoft says the lifecycle-workflow feature saves identity administrators time and effort", figure: "none published", measures: "No measurements in the documentation", provenance: vendor-published, source_ref: MSFT-LIFECYCLE-2026}
  prerequisites:
    - "Security Copilot enabled; Entra ID P2 and Identity Governance Administrator (or Security Administrator for PIM) depending on use (MSFT-GOVOPT-2026, Prerequisites)"
    - "Entra ID Governance licence and Lifecycle Workflow Administrator role for workflow prompts (MSFT-LIFECYCLE-2026)"
  risks_and_guardrails:
    - "If a prompt is blocked by missing permissions, Copilot shows the recommended role and can activate it through an eligible PIM assignment on request (MSFT-GOVOPT-2026, Note)"
    - "Verification testing happens before the workflow schedule is enabled (MSFT-LIFECYCLE-2026, 'Create step-by-step guidance')"
  human_checkpoints:
    - "Admin builds and enables the workflow; Copilot output is guidance (MSFT-LIFECYCLE-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: C
  sources:
    - {ref: MSFT-GOVOPT-2026, title: "Governance and optimization with Security Copilot in Microsoft Entra", publisher: Microsoft Learn, type: vendor, url: "https://learn.microsoft.com/en-us/entra/security-copilot/entra-governance-optimization", date: "2025-09-23", access: full, locator: "Introduction; 'Access review decision analysis'; PIM use cases"}
