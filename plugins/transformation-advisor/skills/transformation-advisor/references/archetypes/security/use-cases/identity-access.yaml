  notes: >-
    Merged from discourse 06 (C, augment), governance 07 (D idea, continuous authentication) and governance 13 (D idea,
    customer ATO and scam detection with payment friction). An analyst post on an acquisition; no named deployment or
    result. Forrester does not call the technology AI; the discourse angle characterised behavioural biometrics as
    machine-learning based. Research result, not deployment: the NDSS 2026 smartwatch study (26 subjects) reports
    average accuracy 88.11%, false acceptance 0.48%, false rejection 11.77% and that models trained on resting data fail
    under motion (NDSS-PPG-2026). The EP release is dated 2025-11-27 on the page itself. Search-only: Fintech Global on ATO gaps beyond authentication (FINTECHGLOBAL-ATO-2026).
