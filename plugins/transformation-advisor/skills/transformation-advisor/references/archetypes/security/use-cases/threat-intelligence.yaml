- id: security-threat-intelligence-13
  title: Preparing intelligence for sharing - PII screening, redaction and STIX packaging with analyst approval
  archetype: security
  module: threat-intelligence
  function: risk-compliance-legal
  work_types: [review-assurance, document-production, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    In an 18-person practitioner survey, 17 of 18 named preventing exposure of sensitive information as a recurring
    difficulty in sharing CTI and 7 of 18 named translating it into the formats sharing platforms need
    (ARXIV-2609.01174, section 3.2). Indicators often circulate in emails and chats that bypass STIX/TAXII pipelines
    (FIRST-CON-2026, CISA IMX abstract). SANS reports 55% of organizations lack legally reviewed CTI sharing processes
    (SANS-CTIPR-2026).
  solution: >-
    CISA's Automated Indicator Sharing (AIS) service uses natural-language processing to flag potential personal data
    in submissions; flagged items go to CISA analysts, who confirm or reject and redact, while privacy experts monitor
    the system and audits run regularly (DHS-AIINV-CISA-2026, DHS-4). Researchers pilot LLMs for two further steps:
    redacting victim identifiers from an incident report while keeping attacker detail, and converting findings into a
    STIX 2.1 file (ARXIV-2609.01174, section 6). CISA's IMX tool helps experts publish STIX packages in minutes through
    a guided interface; its abstract makes no AI claim (FIRST-CON-2026, 15 June).
  outcomes:
    - {lever: risk, description: "none published for CISA's tool", figure: "none published", measures: "The inventory gives no detection rate, false-positive rate or review volume", provenance: self-reported, source_ref: DHS-AIINV-CISA-2026}
    - {lever: quality, description: "Redaction pilot: under a privacy-first prompt the three models missed at most 3 of 92 injected identifiers, but one removed 50 values that identified no one (35% of all its removals); a utility-first prompt reversed the errors", figure: "at most 3 of 92 injected values missed (privacy prompt); 50 over-removals by GPT-5.5", measures: "Injected personal and organization-identifying values (92 values plus 10 phrases) in 4 held-out incident reports, three LLMs, two prompts (Table 3); lab pilot", provenance: independent, source_ref: ARXIV-2609.01174}
    - {lever: quality, description: "STIX pilot: every model produced files that parse and carry the supplied findings, but every model asserted relationships the findings did not support", figure: "38 of 73 asserted links correct (GLM 5.2); 67 links asserted (GPT-5.5)", measures: "Correct links among links asserted in generated STIX files on reserved test campaigns (Table 4)", provenance: independent, source_ref: ARXIV-2609.01174}
  prerequisites:
    - "A review queue staffed by trained analysts and a privacy function that monitors the tool and feeds corrections back (DHS-AIINV-CISA-2026, DHS-4)"
    - "A written redaction policy stating what a shared report must keep and may lose; the pilot found models follow whichever goal the prompt states (ARXIV-2609.01174, Experiment 3)"
    - "A model option that keeps the unredacted report inside the organization, since sending it to a third party discloses what the organization is trying to protect (ARXIV-2609.01174, discussion)"
  risks_and_guardrails:
    - "Over-redaction can strip the attacker's identifiers with the victim's, because both appear in the same form (ARXIV-2609.01174, Experiment 3)"
    - "A wrong STIX link passes every format check; the authors suggest requiring each link to name the finding it rests on (ARXIV-2609.01174, Experiment 4)"
    - "FIRST's Traffic Light Protocol (TLP: labels that set how far shared information may travel) requires recipients to get the source's permission before sharing wider than the label allows (FIRST-TLP-2022)"
    - "NIST SP 800-150 advises setting sharing rules with legal and privacy input, including redaction requirements (NIST-SP800150-2016, section 3.4)"
    - "NIS2 Article 29 and DORA Article 45 frame voluntary sharing arrangements; DORA adds GDPR and competition-law limits (EURLEX-NIS2-2022; EURLEX-DORA-2022)"
    - "Liability protections for sharing through AIS rest on the Cybersecurity Information Sharing Act of 2015, which CISA's page says was extended to 2026-09-30; its status after that date was not confirmed (CISA-AIS-2026)"
  human_checkpoints:
    - "CISA analysts confirm or reject each flagged detection and redact (DHS-AIINV-CISA-2026, DHS-4)"
    - "Expert review at each of the four steps of generating shareable CTI (ARXIV-2609.01174, abstract)"
  role_evolution: >-
    Privacy experts become reviewers of the tool's output and a source of feedback (DHS-AIINV-CISA-2026, DHS-4).
    Practitioners rated redaction among the strongest candidates for AI support while doubting reliability: 14 of 18
    lacked confidence AI would do sharing tasks correctly (ARXIV-2609.01174, section 3.2).
  evidence_grade: B
  sources:
    - {ref: DHS-AIINV-CISA-2026, title: "Cybersecurity and Infrastructure Security Agency - AI Use Cases (DHS AI Use Case Inventory)", publisher: US Department of Homeland Security, type: regulator, url: "https://www.dhs.gov/ai/use-case-inventory/cisa", date: "2026-01-28", access: full, locator: "Deployment: DHS-4; Inactive: DHS-5"}
    - {ref: ARXIV-2609.01174, title: "A SoK for SoCs: Reading the TI Leaves on AI for Cyber Threat Intelligence Generation and Sharing", publisher: "arXiv (UC Santa Barbara et al.)", type: academic, url: "https://arxiv.org/abs/2609.01174", date: "2026-09-01", access: full, locator: "section 3.2; section 6, Experiments 3 and 4, Tables 3 and 4; discussion"}
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program, Denver, 14-19 June 2026 (session abstracts)", publisher: FIRST, type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "'Indicator Message eXchange (IMX)' (CISA), 15 June"}
    - {ref: CISAGOV-IMX-2026, title: "cisagov/imx README", publisher: CISA, type: regulator, url: "https://raw.githubusercontent.com/cisagov/imx/develop/README.md", date: "2026-10-17", access: full, locator: "whole file (undated; retrieval date)"}
    - {ref: SANS-CTIPR-2026, title: "91% of CISOs Value Cyber Threat Intelligence. Only 26% Say It Drives Their Decisions (2026 SANS CTI Survey press release)", publisher: SANS Institute, type: survey, url: "https://www.sans.org/press/announcements/2026-cyber-threat-intelligence-survey-insights-report", date: "2026-05-19", access: full, locator: "paragraph on sharing processes"}
    - {ref: FIRST-TLP-2022, title: "Traffic Light Protocol (TLP) version 2.0", publisher: FIRST, type: standard-setter, url: "https://www.first.org/tlp/", date: "2022-08", access: full, locator: "usage rules and definitions"}
    - {ref: NIST-SP800150-2016, title: "Guide to Cyber Threat Information Sharing (SP 800-150)", publisher: NIST, type: standard-setter, url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-150.pdf", date: "2016-10", access: full, locator: "sections 3.4 and 3.4.1"}
    - {ref: EURLEX-NIS2-2022, title: "Directive (EU) 2022/2555 (NIS 2)", publisher: EUR-Lex, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022L2555", date: "2022-12-14", access: full, locator: "Articles 29 and 30"}
    - {ref: EURLEX-DORA-2022, title: "Regulation (EU) 2022/2554 (DORA)", publisher: EUR-Lex, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554", date: "2022-12-14", access: full, locator: "Article 45"}
    - {ref: CISA-AIS-2026, title: "Automated Indicator Sharing (AIS)", publisher: CISA, type: regulator, url: "https://www.cisa.gov/topics/cyber-threats-and-advisories/information-sharing/automated-indicator-sharing-ais", date: "2026-10-17", access: full, locator: "participation steps; CISA 2015 sunset paragraph (undated; retrieval date)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-10 (B), practice-11 (D), discourse-03 (D), governance-05 (C) and governance-06 (C). Grade B rests on
    CISA's deployed PII screening, which the inventory classifies as natural-language processing, not generative AI;
    the LLM redaction and STIX results are a lab pilot on 4 reports. A decision-tree confidence score for AIS
    submissions is listed as retired and consolidated into the PII use case (DHS-5). IMX's FIRST abstract calls it
    newly open-sourced, but its README read on 2026-10-17 says 'Code coming soon'. Only 3 of the 18 surveyed
    practitioners used LLMs to turn attack data into CTI. Routed: legal review of sharing processes to
    security-governance-risk.

- id: security-threat-intelligence-14
  title: Threat reports turned into detection logic (Sigma, YARA, KQL, regex) that is tested before deployment
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [software-systems, research-synthesis]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Moving from a threat report to a detection that fires means finding the right telemetry, understanding its schema,
    writing executable logic and checking it separates attack from normal behaviour; Feedly estimates 20 to 40 minutes
    per report each for converting IOCs into rules and TTPs into hunt hypotheses (FEEDLY-AUTOMATE-2026, Workflow 5). The
    handoff from intelligence analyst to detection engineer can take days or weeks (SECURITYARSENAL-RAPID7-2026).
  solution: >-
    Microsoft's Security Copilot promptbooks analyze an external threat article, extract indicators and generate hunting
    queries (MSFT-MDTICOPILOT-2026). Anthropic's posting includes YARA rule infrastructure and using Claude to generate
    hunting queries from extracted TTPs (ANTHROPIC-JOBTIE-2026). A secondary report says Rapid7's internal team built an
    LLM pipeline that emits Sigma rules and KQL or SQL queries from reports; Rapid7's own write-up was not found
    (SECURITYARSENAL-RAPID7-2026). Feedly publishes prompts for rules and hunt hypotheses (FEEDLY-AUTOMATE-2026), and
    Vega's Detection Skills spec packages triage, investigation and tuning knowledge as portable skill files attached to
    a detection (DETENGWEEKLY-167-2026). Research benchmarks the step: CTI-REALM, SIGMERGE, AutoSigma and IOCRegex-gen.
  outcomes:
    - {lever: quality, description: "Microsoft Security AI's benchmark of agents writing detection rules from CTI reports: the best of 16 frontier models scored well short of full reward, and CTI-specific tools improved agent performance", figure: "best reward 0.637 of 1", measures: "Normalized reward across report analysis, ATT&CK mapping, telemetry discovery, query execution and final detection quality (65% of the reward) on emulated attacks in Linux, Azure Kubernetes Service and Azure cloud; authors listed as Microsoft Security AI", provenance: vendor-published, source_ref: ARXIV-2603.13517}
    - {lever: cost, description: "On the same benchmark an open-weight model matched the strongest closed models at under a tenth of their cost when allowed enough turns; the benchmark's message limit is a confound", figure: "under one tenth of the cost", measures: "26 models (19 open-weight, 7 closed) under a common harness with the message limit relaxed", provenance: independent, source_ref: ARXIV-2610.14180}
    - {lever: quality, description: "SIGMERGE contributed novel Sigma rules to the official repository, all of which were accepted", figure: "4 rules accepted", measures: "Rules the authors contributed to the official Sigma repository and that were formally accepted; number submitted stated only as 'all'", provenance: independent, source_ref: USENIX-SIGMERGE-2026}
    - {lever: quality, description: "IOCRegex-gen, which converts IOCs from reports into regular expressions, reports a high hit rate and low false positives", figure: "hit rate 99.1%; false-positive rate 0.8%", measures: "Over 3,000 real CTI reports and 2,400 ground-truth strings from the MITRE ATT&CK Evaluations; authors' own system", provenance: independent, source_ref: ARXIV-2604.12228}
  prerequisites:
    - "A detection language the SIEM or EDR accepts, ideally a standard such as Sigma, and non-production data or purple-team scenarios to test rules (SECURITYARSENAL-RAPID7-2026)"
    - "Telemetry with a known schema and a test environment; CTI-REALM runs agents against a Kusto emulator and recorded logs (PACKT-CTIREALM-2026)"
    - "A check that the idea is worth building: whether existing visibility already covers it and whether relevant adversaries target a company like yours (DETENGWEEKLY-168-2026)"
  risks_and_guardrails:
    - "Syntactic validity is a weak proxy for rule quality; several baselines emit well-formed YAML with weak detection logic (ARXIV-2610.09007, abstract)"
    - "A fluent explanation of an intrusion can sit beside a detection that misses it, and the benchmark does not establish production adoption (PACKT-CTIREALM-2026)"
    - "Intel 471's hunters cite high false positives and lack of control as reasons for scepticism about out-of-the-box AI detection content (INTEL471-HUNTING-2025, 'Threat Detection')"
    - "A wrong indicator or unfounded rule at scale generates false positives that erode SOC trust quickly (FEEDLY-AUTOMATE-2026)"
    - "LLMs often cannot verify technical details such as IoCs and TTPs without external ground truth (ARXIV-2603.09452, sections 4.4 and 5.1)"
  human_checkpoints:
    - "Detection engineer reviews and tests rules before deployment (SECURITYARSENAL-RAPID7-2026; FEEDLY-AUTOMATE-2026)"
  role_evolution: >-
    The intelligence-to-detection handoff shifts from rewriting reports as rules to reviewing generated rules
    (SECURITYARSENAL-RAPID7-2026, secondary source). The Detection Engineering Weekly author argues agent skills are the
    next step after detection-as-code, so analysts encode triage and tuning knowledge too (DETENGWEEKLY-167-2026).
  evidence_grade: C
  sources:
    - {ref: MSFT-MDTICOPILOT-2026, title: "Use Microsoft Security Copilot for threat intelligence", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender/threat-intelligence/security-copilot-and-defender-threat-intelligence", date: "2026-07-30", access: full, locator: "promptbooks 'Check impact of an external threat article' and 'Threat Intelligence 360 report' (ms.date 2026-07-30)"}
    - {ref: ANTHROPIC-JOBTIE-2026, title: "Threat Intelligence Engineer (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5074937008", date: "2026-01-20", access: full, locator: "Responsibilities bullets on YARA infrastructure and hunting queries"}
    - {ref: SECURITYARSENAL-RAPID7-2026, title: "AI-Driven Detection Engineering: Converting Threat Intel into Executable Hunt Plans", publisher: Security Arsenal, type: press, url: "https://securityarsenal.com/blog/ai-driven-detection-engineering-converting-threat-intel-into-executable-hunt-plans", date: "2026-06-10", access: full, locator: "paragraphs on Rapid7's pipeline; recommendations list"}
    - {ref: FEEDLY-AUTOMATE-2026, title: "How to automate common CTI workflows (J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/how-to-automate-common-cti-workflows", date: "2026-06-12", access: full, locator: "Workflow 5; 'Where the human analyst is still required'"}
    - {ref: DETENGWEEKLY-167-2026, title: "DEW #167 - More Security Agentic Breaches, Cheap and Scalable Threat Hunting & Detection Skills", publisher: Detection Engineering Weekly, type: community, url: "https://www.detectionengineering.net/p/dew-167-more-security-agentic-breaches", date: "2026-08-19", access: full, locator: "item 'Detection Skills by Vega Threat Research'"}
    - {ref: DETENGWEEKLY-168-2026, title: "DEW #168 - The Detection Rule Stork, OpenWeight models vs your SIEM and Sigma vs. YARA", publisher: Detection Engineering Weekly, type: community, url: "https://www.detectionengineering.net/p/dew-168-the-detection-rule-stork", date: "2026-08-26", access: full, locator: "item on where detection ideas originate"}
    - {ref: PACKT-CTIREALM-2026, title: "#34: CTI-REALM tests whether AI can turn threat intelligence into detections", publisher: Packt Cyber_AI newsletter (Substack), type: community, url: "https://packtcyberai.substack.com/p/34-cti-realm-tests-whether-ai-can", date: "2026-10-07", access: full, locator: "'What the score actually measures'; 'How teams can use it today'"}
    - {ref: ARXIV-2603.13517, title: "CTI-REALM: Benchmark to Evaluate Agent Performance on Security Detection Rule Generation Capabilities", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2603.13517", date: "2026-03-13", access: full, locator: "abstract; authors listed as Microsoft Security AI"}
    - {ref: ARXIV-2610.14180, title: "Unconstrained CTI-REALM with Open-Weights", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2610.14180", date: "2026-10-09", access: full, locator: "abstract"}
    - {ref: USENIX-SIGMERGE-2026, title: "From Texts to Rules: Generating Sigma Rules with Large Language Models from Cyber Threat Reports", publisher: USENIX Security Symposium 2026, type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/cai", date: "2026-08", access: full, locator: "abstract"}
    - {ref: ARXIV-2604.12228, title: "From IOCs to Regex: Automating CTI Operationalization for SOC with LLMs", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2604.12228", date: "2026-04-14", access: full, locator: "abstract"}
    - {ref: ARXIV-2610.09007, title: "Sigma-Hunter: A Domain-Specific Language Model for Threat Hunting and Detection Engineering", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2610.09007", date: "2026-10-06", access: full, locator: "abstract"}
    - {ref: ARXIV-2603.09452, title: "CyberThreat-Eval: Can Large Language Models Automate Real-World Threat Research?", publisher: "arXiv (TMLR 11/2025; Microsoft authors)", type: academic, url: "https://arxiv.org/abs/2603.09452", date: "2026-03-10", access: full, locator: "sections 4.4 and 5.1"}
    - {ref: INTEL471-HUNTING-2025, title: "How AI can (and can't) help in threat hunting", publisher: Intel 471, type: vendor, url: "https://www.intel471.com/blog/how-ai-can-and-cant-help-in-threat-hunting", date: "2025-09-09", access: full, locator: "'Threat Detection'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-05, discourse-09 and governance-07. Maturity 'announced': product features and a third-party report
    of Rapid7's pipeline, with no customer outcome. Governance did not confirm CTI-REALM's Microsoft authorship from the
    abstract page; practice read the authors as Microsoft Security AI, so the reward is labelled vendor-published.
    AutoSigma (arXiv 2608.19011) reports better validity and coverage with no figures in its abstract. The rule
    lifecycle and detection-as-code belong to security-operations (security-operations-15, which drafts, translates and
    scores detection rules); only the intelligence-to-rule step is kept here.

- id: security-threat-intelligence-15
  title: SOAR enrichment and MCP connections that let alerts and agents pull threat intelligence on demand
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [software-systems, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Alerts need threat scores, actor profiles and indicator context before anyone can decide, and manual lookups across
    tools slow triage (RF-SUPERHUMAN-2026).
  solution: >-
    Superhuman wired Recorded Future into its SOAR platform (security orchestration and automated response) so alerts
    are enriched automatically, then built an internal MCP server (Model Context Protocol, a standard way to connect
    AI agents to tools and data) on the Recorded Future API so its agents can request intelligence, evaluate risks and
    summarize threats (RF-SUPERHUMAN-2026). Google's changelog describes a SOAR playbook calling its Agentic API to
    triage an unknown file or IP, gather dark-web chatter and draft YARA rules before an analyst starts
    (GOOGLE-GTICHANGELOG-2026), and Google documents an Agentic MCP server for custom agents (GOOGLE-GTIMCP-2026).
    SOCRadar exposes platform data to LLMs through an MCP server (SOCRADAR-SANSCTI-2026). Anthropic's posting lists
    VirusTotal, Censys and Urlscan integrations through MCP servers (ANTHROPIC-JOBTIE-2026).
  outcomes:
    - {lever: speed, description: "Superhuman says investigation times and dwell time are lower with a single trusted source, but gives no numbers", figure: "none published", measures: "Quote from a Superhuman security engineer in a vendor-written case study; no baseline or sample", provenance: vendor-published, source_ref: RF-SUPERHUMAN-2026}
  prerequisites:
    - "A SOAR platform or agent framework and API access to an intelligence provider (RF-SUPERHUMAN-2026)"
    - "For Google's Agentic API, an Enterprise, Enterprise Plus or Integration Advanced licence (GOOGLE-GTICHANGELOG-2026)"
  risks_and_guardrails:
    - "Superhuman advises starting with a specific use case and not using AI just to use AI (RF-SUPERHUMAN-2026, closing section)"
    - "In OpenCTI, tools that change the platform can be gated for approval; an 'always allow' choice also applies to scheduled runs with no one watching (OPENCTI-COPILOT-2026, 'Approving a tool call')"
    - "Anthropic's cookbook enrichment agent uses simulated tools that must be swapped for real APIs; it is a reference design, not evidence of use (ANTHROPIC-COOKBOOK-TI-2026)"
  human_checkpoints:
    - "Superhuman analysts keep doing in-depth investigations; the agents summarize and enrich (RF-SUPERHUMAN-2026)"
  role_evolution: >-
    Security engineers at Superhuman build and operate the integrations, and engineers elsewhere query intelligence
    themselves (RF-SUPERHUMAN-2026). Anthropic and Coinbase postings ask intelligence engineers to build MCP and agent
    integrations and feed intelligence into agent workflows downstream (ANTHROPIC-JOBTIE-2026; COINBASE-JOBTIPE-2026).
  evidence_grade: B
  sources:
