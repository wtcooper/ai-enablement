- id: security-threat-intelligence-16
  title: New indicators matched automatically against enterprise telemetry by a hunting pipeline that also rechecks earlier intelligence
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    When a critical advisory appears, teams spend days reading it, extracting indicators and hunting across several
    tools to learn whether they are affected, while attackers exploit the gap (ADOBE-CTRI-2026).
  solution: >-
    Adobe's Cybersecurity Threat Research and Intelligence team built a platform on a lakehouse architecture that
    monitors dozens of sources, normalizes them into one schema, uses LLMs to extract indicators, enriches them, launches
    parallel hunting jobs across EDR, email security, cloud and authentication logs, and sends structured reports to
    analysts. It also revisits earlier intelligence that produced no matches, to catch delayed signals (ADOBE-CTRI-2026).
  outcomes:
    - {lever: speed, description: "Adobe says each hunting job processes thousands of indicators across millions of security events and completes within minutes; no before-and-after comparison is given", figure: "scans completed within minutes", measures: "Adobe's description of a hunting job; no baseline, sample or error rate", provenance: self-reported, source_ref: ADOBE-CTRI-2026}
  prerequisites:
    - "A common data schema for indicators, detections, workflows and system state (ADOBE-CTRI-2026, 'Start with a unified data architecture')"
    - "Telemetry from EDR, email, cloud and authentication logs in one queryable store laid out for fast scans (ADOBE-CTRI-2026, 'Design for scale from the start')"
  risks_and_guardrails:
    - "Circuit breakers when external sources fail, retry strategies, asynchronous job queues and pipeline-health dashboards (ADOBE-CTRI-2026, 'Engineer for production reliability')"
    - "Run the agentic system beside existing processes so teams can build trust before relying on it (ADOBE-CTRI-2026, closing section)"
    - "Poisoned content in ingested reports is a known attack on LLM-assisted workflows (FIRST-CON-2026, CyCraft session, 18 June)"
  human_checkpoints:
    - "Analysts receive compiled detections and investigate; the post does not say whether any step needs approval before a hunt runs (ADOBE-CTRI-2026, 'Automated notification')"
  role_evolution: >-
    Adobe says the aim is to remove repetitive mechanical work so analysts can focus on investigations and response,
    not to replace them (ADOBE-CTRI-2026, closing section).
  evidence_grade: B
  sources:
    - {ref: ADOBE-CTRI-2026, title: "Building an agentic AI-powered threat intelligence platform", publisher: Adobe, type: firm, url: "https://blog.adobe.com/security/building-an-agentic-ai-powered-threat-intelligence-platform", date: "2026-03-19", access: full, locator: "workflow steps 1 to 5; design guidance list; closing section"}
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program, Denver, 14-19 June 2026 (session abstracts)", publisher: FIRST, type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "CyCraft AI Lab session abstract, 18 June"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-03. Adobe gives no precision, false-positive or override data and does not say how many hunts ran.
    Publication date from the page metadata.

- id: security-threat-intelligence-17
  title: Chained agentic workflow from an inbound report to asset scoping, tickets and draft detections, with approval gates
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [coordination-scheduling, research-synthesis, software-systems]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Following one vendor report through extraction, ATT&CK mapping, relevance checking against the asset inventory,
    ticketing and notifying leadership can consume a morning (FEEDLY-AUTOMATE-2026, introduction). Cyware's RSAC 2026
    survey reports about 40% of respondents say integration of intelligence into workflows is mostly manual
    (CYWARE-RSAC-2026).
  solution: >-
    Feedly's guide chains five prompts and skills in low-code orchestrators (n8n, Tines): extract IOCs, map to ATT&CK,
    build the Diamond Model and risk view, scope the threat to the CMDB (asset inventory) and controls, then draft
    detections, hunt hypotheses and tickets, with analyst approval before any write to live tooling
    (FEEDLY-AUTOMATE-2026, Workflows 1-5). A SANS webcast describes agents that ingest, reason and act, including
    opening and enriching tickets tied to real exposure (SANS-AGENTICWEB-2026). Cyware's sponsored RSAC segment
    describes specialized agents across intelligence, detection engineering and response with human oversight
    (SCWORLD-CYWARE-2026).
  outcomes:
    - {lever: capacity, description: "Agentic AI adoption among the organizations Flashpoint interviewed", figure: "25% in production; 20% piloting; 35% planning within 12 to 24 months", measures: "Share of more than 20 threat intelligence budget owners and influencers at large North American enterprises, early fall 2026; qualitative vendor-commissioned sample, so shares rest on a handful of organizations", provenance: vendor-published, source_ref: FLASHPOINT-ENTERPRISE-2026}
    - {lever: speed, description: "Cyware reports effective automation between CTI and SecOps tools doubled year on year, and most respondents report measurable improvement from AI", figure: "13% to 26%; 79.6% report improvement", measures: "Shares of respondents in Cyware's survey of RSAC 2026 attendees; respondent count not stated", provenance: vendor-published, source_ref: CYWARE-RSAC-2026}
    - {lever: speed, description: "Feedly's estimates for scoping a report to assets and controls, and for turning it into rules, hunts, tickets and a leadership note", figure: "35 to 70 minutes and 40 to 85 minutes (potential)", measures: "Feedly 'Potential time saved' for Workflows 4 and 5 against its own manual-step ranges; estimate, no sample", provenance: vendor-published, source_ref: FEEDLY-AUTOMATE-2026}
  prerequisites:
    - "An asset inventory or CMDB, a control matrix and ticketing integrations; Feedly rates these workflows hard to build because those systems change and integrations break (FEEDLY-AUTOMATE-2026, 'Build versus buy')"
    - "Integration between the intelligence platform and the tools that act on it; Cyware reports only 27.5% of respondents have intelligence fully integrated into detection and response (CYWARE-RSAC-2026)"
    - "Evidence of value before rollout: 55% of Flashpoint interviewees require demonstrable time savings or extended analyst reach and 35% want a proof of concept first (FLASHPOINT-ETIR-2026)"
  risks_and_guardrails:
    - "Chain the low-risk read-only stages first, prove they run reliably, and only then connect stages that act on the environment (FEEDLY-AUTOMATE-2026, 'Chaining the workflows together')"
    - "A retail interviewee would consider only read-only assistants; interviewees' agent tasks range from retrieval to blocking IP addresses and updating blocklists (FLASHPOINT-ENTERPRISE-2026)"
    - "Automated containment is generally limited to high-confidence, contained actions, with tiered automation for riskier steps (SECURITYWEEK-HUNTING-2026)"
    - "Cyware reports 77% of respondents favour AI that prioritizes analyst oversight, 56% of organizations are developing AI guardrails and 32.1% have defined policies (CYWARE-RSAC-2026)"
    - "Unpredictable AI cost and lack of demonstrable value are cited barriers to investment (FLASHPOINT-ETIR-2026)"
    - "NIS2 recital 51 asks that AI used for detection comply with data-protection principles such as accuracy and minimisation (EURLEX-NIS2-2022)"
  human_checkpoints:
    - "Scoping a threat to the environment depends on context a model does not hold, so Feedly requires analyst review there and approval before any write (FEEDLY-AUTOMATE-2026)"
  role_evolution: >-
    Cyware reports 72.4% of respondents are likely to build their own security AI agents (CYWARE-RSAC-2026). SANS reports
    security operations (71%) overtook threat hunting as the leading CTI use case for the first time since 2022
    (SANS-CTIPR-2026).
  evidence_grade: C
  sources:
    - {ref: FEEDLY-AUTOMATE-2026, title: "How to automate common CTI workflows (J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/how-to-automate-common-cti-workflows", date: "2026-06-12", access: full, locator: "introduction; Workflows 1-5; 'Build versus buy'; 'Chaining the workflows together'"}
    - {ref: SANS-AGENTICWEB-2026, title: "Agentic CTI Automation For Fun and Profit (webcast abstract)", publisher: SANS Institute, type: conference, url: "https://www.sans.org/webcasts/agentic-cti-automation-for-fun-and-profit", date: "2026-06-25", access: full, locator: "abstract"}
    - {ref: SCWORLD-CYWARE-2026, title: "Agentic AI and the Future of Threat Intelligence Operations - Sachin Jade - RSAC26 #2 (sponsored by Cyware)", publisher: SC Media, type: podcast, url: "https://www.scworld.com/podcast-segment/14717-agentic-ai-and-the-future-of-threat-intelligence-operations-sachin-jade-rsac26-2", date: "2026-03-24", access: full, locator: "segment description and chapter titles"}
    - {ref: FLASHPOINT-ENTERPRISE-2026, title: "The Enterprise Threat Intelligence Report: 2026 (vendor-commissioned qualitative research, more than 20 interviewees)", publisher: Flashpoint, type: survey, url: "https://flashpoint.io/blog/enterprise-threat-intelligence-report-2026/", date: "2026-10-13", access: full, locator: "'Agentic AI Adoption Is Underway'; Methodology"}
    - {ref: FLASHPOINT-ETIR-2026, title: "Nearly Half of Enterprise Threat Intelligence Teams Are Using or Piloting Agentic AI as AI Threats Lead 2027 Priorities, Flashpoint Research Finds (press release)", publisher: "Flashpoint (PRNewswire/PRWeb)", type: survey, url: "https://www.prweb.com/releases/nearly-half-of-enterprise-threat-intelligence-teams-are-using-or-piloting-agentic-ai-as-ai-threats-lead-2027-priorities-flashpoint-research-finds-302906892.html", date: "2026-10-13", access: full, locator: "paragraphs 5-8"}
    - {ref: CYWARE-RSAC-2026, title: "What Security Professionals at RSAC2026 Told Us About AI and Threat Intelligence", publisher: Cyware, type: survey, url: "https://www.cyware.com/blog/what-security-professionals-at-rsac2026-told-us-about-ai-and-threat", date: "2026-04-28", access: full, locator: "summary bullets and body"}
    - {ref: SECURITYWEEK-HUNTING-2026, title: "Cyber Insights 2026: Threat Hunting in an Age of Automation and AI", publisher: SecurityWeek, type: press, url: "https://www.securityweek.com/cyber-insights-2026-threat-hunting-in-an-age-of-automation-and-ai/", date: "2026-01-26", access: full, locator: "'The continuing rise of automation' (read through a text mirror)"}
    - {ref: SANS-CTIPR-2026, title: "91% of CISOs Value Cyber Threat Intelligence. Only 26% Say It Drives Their Decisions (2026 SANS CTI Survey press release)", publisher: SANS Institute, type: survey, url: "https://www.sans.org/press/announcements/2026-cyber-threat-intelligence-survey-insights-report", date: "2026-05-19", access: full, locator: "paragraph on SecOps as top use case"}
    - {ref: EURLEX-NIS2-2022, title: "Directive (EU) 2022/2555 (NIS 2)", publisher: EUR-Lex, type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022L2555", date: "2022-12-14", access: full, locator: "recital 51"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged discourse-19 and governance-11. Grade C: recipes, a webcast abstract, a sponsored podcast segment and vendor
    surveys with small or unstated samples; no named deployment. Maturity 'piloting' because Flashpoint's 25% in
    production is a share of about 20 interviewees, not a named deployment. The ladder shows what the sources describe
    (agents owning multi-step work); none specifies the scope of autonomy.

- id: security-threat-intelligence-18
  title: Bounded agents that collect, score and package evidence for takedown of phishing and brand-abuse sites
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [transaction-processing, document-production]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Phishing and impersonation sites often live only hours, and Memcyco says manual enrichment and case preparation
    consume the window in which takedown would matter (MEMCYCO-AGENTIC-2026).
  solution: >-
    Memcyco describes 'agentic threat intelligence' as bounded AI agents that continuously collect, enrich, score and
    package external threat evidence so analysts spend time on judgment and enforcement (MEMCYCO-AGENTIC-2026). Recorded
    Future announced AI-driven alert triage in a digital risk protection hub that filters brand-misuse alerts using
    customer-provided context, with automatic takedowns (FORRESTER-PREDICT-2025).
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "Both sources describe intended benefits only", provenance: vendor-published, source_ref: MEMCYCO-AGENTIC-2026}
  prerequisites:
    - "Customer-provided context for relevance filtering (FORRESTER-PREDICT-2025)"
  risks_and_guardrails:
    - "Forrester says customers should evaluate AI triage on effectiveness, not only efficiency, because a black-box triage can fail on both (FORRESTER-PREDICT-2025)"
  human_checkpoints:
    - "Analysts keep enforcement decisions (MEMCYCO-AGENTIC-2026)"
  role_evolution: >-
    Memcyco says analysts move from manual groundwork to judgment and enforcement (MEMCYCO-AGENTIC-2026).
  evidence_grade: C
  sources:
    - {ref: MEMCYCO-AGENTIC-2026, title: "MemcycoFM Ep 27: What Is Agentic Threat Intelligence? (vendor podcast, written episode page)", publisher: Memcyco, type: podcast, url: "https://webcast.memcyco.com/library/the-memcycofm-show-ep-27/", date: "2026-07-21", access: full, locator: "episode summary; 'What agentic means in practice'"}
    - {ref: FORRESTER-PREDICT-2025, title: "Recorded Future Predict 2025: Intelligence To Operations ... And Now To Action (J. Shabadu)", publisher: Forrester, type: firm, url: "https://www.forrester.com/blogs/recorded-future-predict-2025-intelligence-to-operations-and-now-to-action/", date: "2025-10-21", access: full, locator: "'One Platform, Two Promises'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From discourse-08. Vendor podcast page and a vendor roadmap as read by an analyst. Adjacent to fraud and brand
    protection, which the landscape scan folds into human-risk; kept here because takedown evidence is an
    external-threat intelligence product. Cross-reference human-risk.

- id: security-threat-intelligence-19
  title: AI assistants inside human-led hunts and frontline intelligence work - hypothesis stress-testing, query drafting, decoding and documentation
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [expert-judgment, research-synthesis]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Hunters can fixate on one indicator or path, need to understand unfamiliar techniques and query languages, and must
    document findings for several audiences (INTEL471-HUNTING-2025). Hunting depends on query-language expertise (such
    as KQL) and on keeping context across a long session (MSFT-HUNTASSIST-2026). Frontline intelligence work has
    repetitive steps and long ramp-up for analysts moving between domains (GOOGLE-DEFADV-HMT-2026).
  solution: >-
    Intel 471's threat hunt analysts use AI to stress-test hypotheses, suggest related actors and techniques, find
    adjacent hunting paths, point to query-language documentation and draft documentation; they say AI cannot yet
    develop a complete hypothesis (INTEL471-HUNTING-2025). Microsoft's Threat Hunting Assistant turns natural-language
    questions into queries, reads table schemas first, runs and adjusts queries and suggests follow-ups
    (MSFT-HUNTASSIST-2026). The lead of the AI function in Google Threat Intelligence Group's frontline team describes
    automated script decoding, hunting query creation, metadata labelling, 'judge agents' for quality control and AI
    assistants for onboarding under a human-machine teaming model (GOOGLE-DEFADV-HMT-2026). Google's Threat Hunting
    agent was in preview in June 2026 (TECHINFORMED-GOOGLE-2026). Huntress and Twilio postings expect hunters to work
    with AI (HUNTRESS-JOBDETH-2026; TWILIO-JOBSSETH-2026), and BSides Las Vegas 2026 ran a workshop on AI skill files
    for network hunts (BSIDESLV-2026).
  outcomes:
    - {lever: quality, description: "Intel 471 publishes no figures. A research prototype (AHLERT) that constrains hunt leads to the defender's own assets and controls lifted lead quality over a flat retrieval baseline", figure: "mean F1 0.44 to 0.85", measures: "Mean F1 of hunt leads generated from public CTI reports for well-known APTs, hybrid retrieval with ATT&CK-seeded ontology grounding versus single-route flat retrieval, across proprietary and open-weight models; authors' own system", provenance: independent, source_ref: ARXIV-2609.08790}
  prerequisites:
    - "A structured hunt method with explicit triggers and hypotheses (Intel 471 uses TaHiTI) (INTEL471-HUNTING-2025)"
    - "Enough log retention for baselines; some EDRs keep only 30, 60 or 90 days (INTEL471-HUNTING-2025, 'Data Analysis')"
    - "Access to Security Copilot in advanced hunting and the tables to be queried (MSFT-HUNTASSIST-2026)"
  risks_and_guardrails:
    - "Sycophancy: agreeable models can reinforce confirmation bias; Intel 471 recommends fact-finding questions before pitching a hypothesis (INTEL471-HUNTING-2025)"
    - "Query design gives mixed results because models lack training on current resources (INTEL471-HUNTING-2025, 'Data Scoping and Query Design')"
    - "LLM-as-judge methods reduce obvious errors but do not always remove confident misinterpretation, and correlated errors are harder to detect (FEEDLY-VALUE-2026)"
    - "Use deterministic tools where they suffice and reserve LLM, RAG and agent tools for where they pay off (SANS-LEASTAI-2026)"
    - "Huntress expects hunters to validate AI output before it reaches production (HUNTRESS-JOBDETH-2026)"
  human_checkpoints:
    - "The hunter forms and owns the hypothesis (INTEL471-HUNTING-2025, 'Hypothesis Development')"
    - "The hunter reviews generated KQL and results; a suggested action opens a wizard the user completes before anything is applied (MSFT-HUNTASSIST-2026)"
  role_evolution: >-
    Experts quoted by SecurityWeek expect AI to take routine, data-heavy tasks while hunters focus on strategic
    investigations, and several say full automation is unlikely to replace human hunters (SECURITYWEEK-HUNTING-2026).
    Employers ask hunters to orchestrate AI workflows and verify output (HUNTRESS-JOBDETH-2026; TWILIO-JOBSSETH-2026).
    Google links AI assistants to faster onboarding (GOOGLE-DEFADV-HMT-2026); Feedly defines AI literacy as tool
    proficiency, context engineering and validation (FEEDLY-HIRING-2026).
  evidence_grade: B
  sources:
    - {ref: INTEL471-HUNTING-2025, title: "How AI can (and can't) help in threat hunting", publisher: Intel 471, type: vendor, url: "https://www.intel471.com/blog/how-ai-can-and-cant-help-in-threat-hunting", date: "2025-09-09", access: full, locator: "sections 'How AI can help your threat hunting teams', 'Hypothesis Development', 'Data Scoping and Query Design', 'Data Analysis', 'Reporting and Documentation'"}
    - {ref: MSFT-HUNTASSIST-2026, title: "Microsoft Security Copilot Threat Hunting Assistant in advanced hunting", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-security-copilot-threat-hunting-assistant", date: "2026-07-02", access: full, locator: "key capabilities; response components (ms.date 2026-07-02; updated 2026-09-10)"}
    - {ref: GOOGLE-DEFADV-HMT-2026, title: "Human-Machine Teaming: Applying AI to Frontline Threat Intelligence Workflows (The Defender's Advantage podcast; show notes)", publisher: Google Threat Intelligence Group / Mandiant, type: podcast, url: "https://feeds.buzzsprout.com/1762840.rss", date: "2026-07-13", access: full, locator: "episode description"}
