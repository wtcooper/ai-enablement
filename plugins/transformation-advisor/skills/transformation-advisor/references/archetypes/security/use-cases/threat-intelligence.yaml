- id: security-threat-intelligence-06
  title: Mapping report text to ATT&CK techniques and enriching hunts with actor context
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting, expert-judgment]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    MITRE describes mapping the TTPs in CTI reports to ATT&CK as difficult, error-prone and time-consuming
    (MITRE-TRAM-2023, 'Problem'); ATT&CK v20 lists 227 Enterprise techniques and 479 sub-techniques (MITRE-ATTCK-2026). In an
    18-person practitioner survey, 10 of 18 named mapping behaviour to standard taxonomies as a recurring challenge
    (ARXIV-2609.01174, section 3.2).
  solution: >-
    Intel 471's threat hunt analysts say they use AI to enrich hunts with CTI context: tagging hunt packages with
    actors seen using the same techniques, mapping techniques to ATT&CK, and adding industry, geography, severity and
    motivation so teams can prioritize hunts (INTEL471-HUNTING-2025, 'Enrichment'). MITRE's TRAM is an open-source
    platform that maps CTI reports to ATT&CK, and its 2023 project fine-tuned LLMs for the mapping (CTID-TRAMREADME-2026;
    MITRE-TRAM-2023). EclecticIQ's Intelligence Center 3.9 lets customers connect their choice of LLM provider per
    capability (EIQ-IC39-2026). Feedly publishes a mapping prompt with ATT&CK Navigator output (FEEDLY-AUTOMATE-2026,
    Workflow 2), and Flashpoint's pilot interviewees list ATT&CK mapping among workflows they are testing
    (FLASHPOINT-ENTERPRISE-2026).
  outcomes:
    - {lever: quality, description: "On sandbox reports, three LLMs mapped behaviour to techniques far better than a Sigma-rule baseline", figure: "technique F1 0.71 to 0.72; sub-technique F1 0.66 to 0.67; Sigma baseline technique F1 0.16", measures: "F1 against 254 labeled main techniques and 263 labeled sub-techniques across 45 held-out sandbox reports", provenance: independent, source_ref: ARXIV-2609.01174}
    - {lever: quality, description: "On complex, unstructured reports the best of seven open-source models scored low; the authors say open models are not sufficient for production-grade classification", figure: "best micro-averaged F1 0.22", measures: "Micro F1 of multi-label technique classification on 2,076 human-annotated sentences (1,281 technique-positive) from 83 CTI reports, 114 techniques, models from 8B to 236B parameters, inter-annotator kappa 0.68", provenance: independent, source_ref: ARXIV-2606.18166}
    - {lever: quality, description: "Microsoft-authored workflow benchmark: baseline LLMs had low precision in identifying techniques", figure: "TTP precision 0.18 to 0.35 (baseline models)", measures: "Precision of TTP identification on CyberThreat-Eval for vanilla GPT-4o, o3-mini and two fine-tuned GPT-4o variants (Table 6)", provenance: self-reported, source_ref: ARXIV-2603.09452}
    - {lever: speed, description: "Feedly estimates time saved per report for mapping and visualizing; an estimate, not a measurement", figure: "20 to 45 minutes (potential)", measures: "Feedly 'Potential time saved' for Workflow 2 against manual steps of 10-20, 20-35 and 10-20 minutes; no sample", provenance: vendor-published, source_ref: FEEDLY-AUTOMATE-2026}
  prerequisites:
    - "Mappings checkable against the source text; Feedly advises buyers to look for ATT&CK mappings they can validate against the source (FEEDLY-AUTOMATE-2026, 'Build versus buy')"
    - "A current ATT&CK version in the platform; EclecticIQ 3.9 added v19.1 support (EIQ-IC39-2026), and ATT&CK v20 was released in October 2026 with AI-related techniques (MITRE-ATTCK-2026)"
    - "CTI-specific tools in the agent environment significantly improved agent performance in Microsoft's CTI-REALM benchmark (ARXIV-2603.13517, abstract)"
  risks_and_guardrails:
    - "Scores depend heavily on the task: F1 around 0.7 on sandbox reports versus 0.22 on complex prose, so a vendor demo on clean input says little about real reports (ARXIV-2609.01174; ARXIV-2606.18166)"
    - "Models both miss plainly evidenced techniques (masquerading, labeled in 21 reports, was missed by all three models) and assert techniques the evidence does not support (ARXIV-2609.01174, Experiment 2)"
    - "A 2025 study of three LLMs on 350 reports found them inconsistent and overconfident on real-size reports (ARXIV-2503.23175, abstract); another attributes failures to spurious correlations and contradictory sources in the threat landscape itself (ARXIV-2509.23573, abstract)"
    - "Intel 471 warns that agreeable models can validate a flawed hypothesis, so ask questions constrained by facts (INTEL471-HUNTING-2025, 'Hypothesis Development')"
  human_checkpoints:
    - "Feedly lists attribution, risk ratings and business-impact statements as outputs a model tends to assert with unwarranted confidence and that need analyst review (FEEDLY-AUTOMATE-2026, 'Where the human analyst is still required')"
    - "Mappings should be reviewed by analysts, given that current open models are not production-grade on complex reports (ARXIV-2606.18166, abstract)"
  role_evolution: >-
    Intel 471 says it looks for ways AI can streamline enrichment "to help make human analysts informed decision-makers
    rather than merely performing routine tasks" (INTEL471-HUNTING-2025, 'Enrichment').
  evidence_grade: B
  sources:
    - {ref: INTEL471-HUNTING-2025, title: "How AI can (and can't) help in threat hunting", publisher: Intel 471, type: vendor, url: "https://www.intel471.com/blog/how-ai-can-and-cant-help-in-threat-hunting", date: "2025-09-09", access: full, locator: "sections 'Enrichment' and 'Hypothesis Development'"}
    - {ref: MITRE-TRAM-2023, title: "Threat Report ATT&CK Mapper (TRAM)", publisher: MITRE Center for Threat-Informed Defense, type: standard-setter, url: "https://ctid.mitre.org/projects/threat-report-attck-mapper-tram/", date: "2023-08-24", access: full, locator: "project summary and 'Problem' (foundation source)"}
    - {ref: CTID-TRAMREADME-2026, title: "TRAM README", publisher: MITRE Center for Threat-Informed Defense, type: standard-setter, url: "https://raw.githubusercontent.com/center-for-threat-informed-defense/tram/main/README.md", date: "2026-10-17", access: full, locator: "opening paragraphs (file undated; retrieval date)"}
    - {ref: EIQ-IC39-2026, title: "Intelligence Center 3.9: More AI provider choice, MITRE ATT&CK v19.1 support, and more", publisher: EclecticIQ, type: vendor, url: "https://blog.eclecticiq.com/intelligence-center-3.9", date: "2026-09-22", access: full, locator: "paragraphs on AI providers and ATT&CK v19.1"}
    - {ref: FEEDLY-AUTOMATE-2026, title: "How to automate common CTI workflows (J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/how-to-automate-common-cti-workflows", date: "2026-06-12", access: full, locator: "Workflow 2; 'Build versus buy'; 'Where the human analyst is still required'"}
    - {ref: FLASHPOINT-ENTERPRISE-2026, title: "The Enterprise Threat Intelligence Report: 2026 (vendor-commissioned qualitative research, more than 20 interviewees)", publisher: Flashpoint, type: survey, url: "https://flashpoint.io/blog/enterprise-threat-intelligence-report-2026/", date: "2026-10-13", access: full, locator: "'Agentic AI Adoption Is Underway'"}
    - {ref: ARXIV-2609.01174, title: "A SoK for SoCs: Reading the TI Leaves on AI for Cyber Threat Intelligence Generation and Sharing", publisher: "arXiv (UC Santa Barbara et al.)", type: academic, url: "https://arxiv.org/abs/2609.01174", date: "2026-09-01", access: full, locator: "section 3.2; Table 2b; Experiment 2"}
    - {ref: ARXIV-2606.18166, title: "Evaluating Open-Source LLMs for Multi-Label ATT&CK Technique Classification on CTI Reports", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2606.18166", date: "2026-06-16", access: full, locator: "abstract"}
    - {ref: ARXIV-2603.09452, title: "CyberThreat-Eval: Can Large Language Models Automate Real-World Threat Research?", publisher: "arXiv (TMLR 11/2025; Microsoft authors)", type: academic, url: "https://arxiv.org/abs/2603.09452", date: "2026-03-10", access: full, locator: "Table 6, TTP identification (vanilla columns)"}
    - {ref: ARXIV-2603.13517, title: "CTI-REALM: Benchmark to Evaluate Agent Performance on Security Detection Rule Generation Capabilities", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2603.13517", date: "2026-03-13", access: full, locator: "abstract"}
    - {ref: ARXIV-2605.25836, title: "CTI2TTP: Evidence-Grounded TTP Extraction from Cyber Threat Intelligence via Diverge-then-Converge Verification", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2605.25836", date: "2026-05-25", access: full, locator: "abstract (v2 revised 2026-10-13)"}
    - {ref: ARXIV-2503.23175, title: "Large Language Models Are Unreliable for Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2503.23175", date: "2025-03-29", access: full, locator: "abstract"}
    - {ref: ARXIV-2509.23573, title: "Uncovering Vulnerabilities of LLM-Assisted Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2509.23573", date: "2025-09-28", access: full, locator: "abstract"}
    - {ref: MITRE-ATTCK-2026, title: "ATT&CK v20 release (Updates - October 2026)", publisher: MITRE, type: standard-setter, url: "https://attack.mitre.org/resources/updates/", date: "2026-10-13", access: full, locator: "v20 release notes, including Enterprise technique counts"}
    - {ref: ARXIV-2608.06778, title: "Retrieval-Constrained Policy Optimization for Attack Technique Extraction from Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2608.06778", date: "2026-08-07", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-17 (C), discourse-02 (B) and governance-03 (C). Grade B rests on Intel 471 describing its own
    hunters' use; no figures are published for that use. The F1 values are lab benchmarks and are not comparable with
    each other. CTI2TTP's authors report macro-F1 of 76.48% and 87.39% on two sets they defined, for their own
    evidence-anchored design (ARXIV-2605.25836). A fine-tuned 8B model (TTP-R1) reportedly beat a retrieval-augmented
    frontier model on sub-technique F1 by 7.4 points (ARXIV-2608.06778, abstract only).
    TRAM's README references ATT&CK v13 and an earlier supervised model, so it is a foundation source.

- id: security-threat-intelligence-07
  title: "Idea: structuring whole report corpora into merged knowledge graphs and measures of vendor overlap and bias"
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    The same threat is often given unrelated names across vendors, so per-report extraction leaves a fragmented picture
    (ARXIV-2608.28394, abstract). Annual vendor reports contradict each other on top intrusion vectors and on
    definitions such as credential misuse; a Team Cymru FIRST session attributes this to structural bias in each
    vendor's data-collection pipeline (FIRST-CON-2026, 15 June).
  solution: >-
    Research designs extract each report into a graph, verify entities against evidence and ATT&CK definitions, and
    merge graphs across sources (BEACON; ANCHOR, whose local-model option closely matched enterprise LLM typing
    performance, so internal incident data can stay off enterprise APIs; TACTIC-KG) (ARXIV-2608.28394; ARXIV-2606.01208; ARXIV-2607.05001). Another team used an LLM pipeline to
    structure 16,096 public CTI reports from two decades and measure how much each added source contributes
    (ARXIV-2602.17458). No team was found using either approach to manage subscriptions or attribution.
  outcomes:
    - {lever: quality, description: "BEACON beat all baselines on two human-annotated datasets its authors built", figure: "at least 23% (extraction) and at least 9% (cross-source consolidation) better than baselines", measures: "Authors' comparison on their own datasets from 34 sources (8,395 elements for extraction, 3,487 for consolidation); the metric behind the percentages is not in the abstract", provenance: independent, source_ref: ARXIV-2608.28394}
    - {lever: quality, description: "The corpus study finds low overlap between vendors, geographic and sectoral reporting biases, and diminishing returns from sources beyond a few core providers", figure: "16,096 reports analysed; overlap not quantified in the abstract", measures: "Count of reports structured by the authors' LLM pipeline; marginal coverage analysis", provenance: independent, source_ref: ARXIV-2602.17458}
  prerequisites:
    - "Human-annotated ground truth linking entities to technique anchors, which the BEACON authors had to build because none existed (ARXIV-2608.28394, abstract)"
    - "A schema choice (STIX, UCO or other) and a validator (ARXIV-2606.01208, abstract)"
  risks_and_guardrails:
    - "Extraction errors would distort overlap statistics; the authors call their pipeline high-precision but give no figure in the abstract (ARXIV-2602.17458)"
    - "Treat vendor reports as partial lenses rather than authoritative truth (FIRST-CON-2026, Team Cymru session); ENISA likewise warns that reported volume can reflect audience interest, not activity (ENISA-ETL-2026)"
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: "Not described in the sources."
  evidence_grade: D
  sources:
    - {ref: ARXIV-2608.28394, title: "BEACON: Behavior-Anchored Cross-Source Knowledge Graph Construction for Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2608.28394", date: "2026-08-28", access: full, locator: "abstract"}
    - {ref: ARXIV-2606.01208, title: "Schema-Agnostic Knowledge Graph Construction via Hybrid Ontology Discovery for Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2606.01208", date: "2026-05-31", access: full, locator: "abstract"}
    - {ref: ARXIV-2607.05001, title: "TACTIC-KG: Toward Small Agent Teams for Cyber Threat Intelligence Knowledge Graph Construction", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2607.05001", date: "2026-07-06", access: full, locator: "abstract"}
    - {ref: ARXIV-2602.17458, title: "The CTI Echo Chamber: Fragmentation, Overlap, and Vendor Specificity in Twenty Years of Cyber Threat Reporting", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2602.17458", date: "2026-02-19", access: full, locator: "abstract"}
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program, Denver, 14-19 June 2026 (session abstracts)", publisher: FIRST, type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "'Disparate Data, Distorted Decisions: Vendor Data Bias in CTI' (Team Cymru), 15 June"}
    - {ref: ENISA-ETL-2026, title: "ENISA Threat Landscape 2026", publisher: ENISA, type: regulator, url: "https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf", date: "2026-09", access: full, locator: "Methodology"}
    - {ref: NDSS-TIECO-2026, title: "Actively Understanding the Dynamics and Risks of the Threat Intelligence Ecosystem", publisher: NDSS Symposium 2026, type: academic, url: "https://www.ndss-symposium.org/ndss-paper/actively-understanding-the-dynamics-and-risks-of-the-threat-intelligence-ecosystem/", date: "2026-02", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (grade D): research prototypes and one ecosystem study, no adoption found. Merged practice-18, discourse-14,
    discourse-15, governance-12 and governance-13. The Team Cymru session does not say AI is used. A separate NDSS 2026
    measurement with watermarked indicators (no AI) found shared intelligence almost always leads to disruption but
    bottleneck vendors delay sharing by hours to days (NDSS-TIECO-2026). A SANS CTI Summit 2026 talk on deprecating
    threat-actor aliases points at the naming problem (title only).

- id: security-threat-intelligence-08
  title: Global intelligence scored and ranked against an organization profile so only relevant alerts, actors and indicators surface
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, transaction-processing, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    External monitoring floods CTI teams with keyword hits; Google says the problem is a lack of relevance, not of data
    (GOOGLE-DARKWEB-2026). In Flashpoint's interviews, alert noise and false positives were the most cited program
    challenge (65%), and a healthcare practitioner described alerts on old email breaches resurfacing each time the data
    is resold (FLASHPOINT-ENTERPRISE-2026).
  solution: >-
    Google Threat Intelligence's relevance system (Beta) builds an organization profile from a name and domain, scores
    global intelligence and dark-web findings against it and groups findings into alerts (GOOGLE-GTIORGPROFILE-2026;
    GOOGLE-GTIRELEVANCE-2026); Google's launch post says Gemini keeps the profile updated (GOOGLE-DARKWEB-2026). AI
    Threat Profiles recommend actors, malware and campaigns by industry and region using embeddings and customer
    feedback (GOOGLE-GTILANDSCAPE-2026). Microsoft's Threat Intelligence Briefing Agent ranks threats using the
    customer's exposure data (MSFT-TIBAGENT-2026). Recorded Future announced an 'Autonomous Threat Operations' layer
    that de-duplicates, validates, enriches and prioritizes feeds (FORRESTER-PREDICT-2025). A secondary summary of the
    2025 SANS survey says more than one-third of teams used AI to enrich and score intelligence (CSB-CTI-2025).
  outcomes:
    - {lever: quality, description: "Google reports an internal accuracy figure for analyzing external events; the test design is not described", figure: "98% accuracy (vendor claim)", measures: "Google: internal tests on millions of daily external events; accuracy definition, labels and sample not stated", provenance: vendor-published, source_ref: GOOGLE-DARKWEB-2026}
    - {lever: quality, description: "LastPass's director of threat intelligence, quoted in Google's launch post, recalls that dark web tools he used in previous roles averaged over 90% false positives", figure: "over 90% false positives (recollection about earlier tools)", measures: "Customer's recollection in a vendor post; no measurement basis; not a result of the new capability", provenance: vendor-published, source_ref: GOOGLE-DARKWEB-2026}
    - {lever: quality, description: "Mandiant (2023) reported that its scoring models cut noise in alert generation and shrank the indicator set", figure: "96% fewer false positives in alert generation; 97% IOC reduction at high confidence", measures: "Mandiant's wording; baseline, sample and period not given; published 2023-08-24, outside the 12-18 month window", provenance: vendor-published, source_ref: MANDIANT-AIPHASES-2023}
    - {lever: quality, description: "Benchmark of eight LLMs assigning threat levels to records from public MISP OSINT feeds: zero-shot results were weak and fine-tuned scores modest, which the authors call too low for practical deployment", figure: "fine-tuned F1 0.40 to 0.58", measures: "F1 for threat-level determination on a curated dataset derived from public MISP OSINT feeds", provenance: independent, source_ref: ARXIV-2609.07582}
  prerequisites:
    - "An administrator who sets up the organization profile and thresholds, with AI settings enabled; analysts then triage alerts and give feedback (GOOGLE-GTIRELEVANCE-2026, access roles and AI-settings note)"
    - "For Microsoft's agent, Defender for Endpoint and Defender External Attack Surface Management signals (MSFT-TIBAGENT-2026)"
    - "Clear priority intelligence requirements; DTN Advisory says 'relevant' is the key word for AI-driven monitoring (DTN-CTI-2026)"
  risks_and_guardrails:
    - "Google says the relevance system is in Beta and customers should keep Digital Threat Monitoring and Attack Surface Management running in parallel (GOOGLE-GTIRELEVANCE-2026, Beta note)"
    - "The system is tuned to produce few alerts, sometimes zero a day, so a quiet dashboard may hide gaps; profile edits are cited and versioned (GOOGLE-GTIORGPROFILE-2026)"
    - "Forrester's analyst says the test of prioritization is delivering consistently without bias and blind spots, and that black-box AI triage risks failing on both effectiveness and efficiency (FORRESTER-PREDICT-2025)"
    - "LLMs were found inconsistent and overconfident on real-size threat reports (ARXIV-2503.23175, abstract)"
  human_checkpoints:
    - "Analysts change alert status and give feedback that shapes recommendations (GOOGLE-GTIRELEVANCE-2026; GOOGLE-GTILANDSCAPE-2026)"
    - "Forrester asks vendors for their testing and validation mechanisms (FORRESTER-PREDICT-2025)"
  role_evolution: >-
    Google says threat actors used to be the main entry point and manual prioritization is not tenable; the profile
    model recommends actors, malware and campaigns instead, shaped by analyst feedback (GOOGLE-GTILANDSCAPE-2026).
  evidence_grade: C
  sources:
    - {ref: GOOGLE-GTIRELEVANCE-2026, title: "Getting Started with our new Dark Web Intel capabilities, powered by the relevance system", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/dark-web-intel", date: "2026-06-22", access: full, locator: "introduction; Beta and AI-settings notes; access roles"}
    - {ref: GOOGLE-GTIORGPROFILE-2026, title: "Organization Profile (Google Threat Intelligence documentation)", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/my-landscape-organization-profile", date: "2026-06-16", access: full, locator: "Automated Setup; note on alert volume; Citations and Versioning"}
    - {ref: GOOGLE-GTILANDSCAPE-2026, title: "How Your Threat Landscape Uses AI Recommendations", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/threat-landscape-ai-recommendations", date: "2026-02-27", access: full, locator: "whole page"}
