# Use cases: security / threat-intelligence
# Synthesised 2026-10-17 from the wave-4 security landscape scan and the practice, discourse and governance deep dives
# (61 candidate entries in: 23 practice, 19 discourse, 19 governance; 24 out), plus items other security deep dives
# routed to threat-intelligence. Source refs are canonical keys. Where the angles used different keys for the same
# document, one key is kept: FLASHPOINT-ENTERPRISE-2026 = practice's FLASHPOINT-ENTERPRISETI-2026 (the Flashpoint blog
# report; FLASHPOINT-ETIR-2026 is the separate press release); SANS-CTIPR-2026 = the SANS 2026 CTI survey press release
# (practice and governance called it SANS-CTI-2026); SANS-CTI-2026 = the SANS key-findings landing page; MITRE-TRAM-2023 =
# governance's MITRE-CTID-TRAM-2023; MSFT-DEFENDER-AGENTS-2026 = practice's MSFT-DEFENDERAGENTS-2026 (key used by the
# security-operations deep dive). Grades follow the 2026-10-17 grade A rule: A needs a figure the named organization
# reports as measured. Two practice entries graded A were regraded B (Cowbell quotes in a vendor case study; the
# Microsoft-authored Threat Research Agent paper, whose deploying organization is not named), and the DarkBot research
# prototype was graded C. Lab-only results with no product or deployment are graded D and labelled idea. Almost every
# outcome figure is vendor-published, self-reported or a lab benchmark; no source publishes analyst override rates,
# error rates of a deployed CTI assistant, or a parallel run. Final ids for other security modules were not yet
# published when this file was first drafted; notes cross-reference overlapping entries by id where those files now exist. Attacker detail is
# kept at the level defenders need.

- id: security-threat-intelligence-01
  title: "Idea: agents that monitor coverage of priority intelligence requirements and keep standing briefings current"
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [coordination-scheduling, research-synthesis, document-production]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Intelligence requirements are expanding (deepfakes, AI-accelerated exploitation, AI-enabled attack vectors) while
    the capacity available to address them remains constrained (FLASHPOINT-ENTERPRISE-2026, executive summary). Most formal CTI teams have fewer than four full-time staff, 57% of programs do not
    track maturity over time and 49% gather no systematic feedback on effectiveness (SANS-CTIPR-2026).
  solution: >-
    Flashpoint's interview study says practitioners see coverage monitoring against priority intelligence requirements
    (PIRs: the standing questions the intelligence team must answer for the business) and intelligence briefings as
    workflows where agents can extend coverage and reduce recurring work while keeping analysts involved
    (FLASHPOINT-ENTERPRISE-2026, 'What the Findings Mean for Threat Intelligence Programs'). It treats tasks with
    reviewable outputs, reversible actions and clear success criteria as the practical starting point
    (FLASHPOINT-ENTERPRISE-2026, 'Agentic AI Adoption Is Underway'). No deployment was found.
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "No deployment or measurement found; the report offers interview findings only", provenance: vendor-published, source_ref: FLASHPOINT-ENTERPRISE-2026}
  prerequisites:
    - "Written priority intelligence requirements tied to business risks (FLASHPOINT-ENTERPRISE-2026, section on AI-related threats)"
    - "Measures of success agreed before deployment; the report names time savings, accuracy, risk reduction and ROI as what practitioners track (FLASHPOINT-ENTERPRISE-2026, introduction)"
  risks_and_guardrails:
    - "One retail interviewee would consider only read-only AI assistants because of the risk of granting agents write permissions; Flashpoint says that as autonomy increases, teams need clear controls on access, change, human approval and audit (FLASHPOINT-ENTERPRISE-2026, 'Agentic AI Adoption Is Underway')"
    - "Practitioners in Feedly's roundup reject activity metrics (report counts, IOC volume) in favour of decisions influenced, controls implemented and time from intelligence to action (FEEDLY-ROUNDUP-2026, executive summary)"
  human_checkpoints:
    - "Analysts stay in the intelligence process; agents that move from retrieving to acting need controls on access, change, approval and audit (FLASHPOINT-ENTERPRISE-2026)"
  role_evolution: >-
    Recorded Future's customer panelists said junior analysts would not be replaced by AI but their jobs would look
    very different as they use AI to augment their workflows (RF-PRACTITIONER-2026, 'Looking to the future of threat
    intelligence').
  evidence_grade: D
  sources:
    - {ref: FLASHPOINT-ENTERPRISE-2026, title: "The Enterprise Threat Intelligence Report: 2026 (vendor-commissioned qualitative research, more than 20 interviewees)", publisher: Flashpoint, type: survey, url: "https://flashpoint.io/blog/enterprise-threat-intelligence-report-2026/", date: "2026-10-13", access: full, locator: "'What the Findings Mean for Threat Intelligence Programs'; agentic AI section; introduction"}
    - {ref: SANS-CTIPR-2026, title: "91% of CISOs Value Cyber Threat Intelligence. Only 26% Say It Drives Their Decisions (2026 SANS CTI Survey press release)", publisher: SANS Institute, type: survey, url: "https://www.sans.org/press/announcements/2026-cyber-threat-intelligence-survey-insights-report", date: "2026-05-19", access: full, locator: "paragraph on resourcing"}
    - {ref: FEEDLY-ROUNDUP-2026, title: "2026 CTI Practitioners Roundup (14 practitioners; J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/2026-cti-practitioners-roundup", date: "2026-01-29", access: full, locator: "executive summary"}
    - {ref: RF-PRACTITIONER-2026, title: "Practitioners Reveal What Makes Threat Intelligence Programs Mature (webinar recap of the 2025 State of Threat Intelligence report)", publisher: Recorded Future, type: vendor, url: "https://www.recordedfuture.com/blog/practitioner-insights-advancing-threat-intelligence", date: "2026-01-09", access: full, locator: "'Looking to the future of threat intelligence' (date from the page's published-date metadata)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (grade D). Merged practice-15 (D) and discourse-13 (C). The Flashpoint study is vendor-commissioned and
    qualitative (just over 20 budget owners and influencers at large North American enterprises, early fall 2026).
    Cloudflare's PIR and RFI features (2024) are not AI features and are not used as evidence.

- id: security-threat-intelligence-02
  title: AI-supported monitoring, collection and structuring of open sources for threat-landscape reporting
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Threat-landscape reporting depends on collecting and curating thousands of incident reports from open sources and
    partners; ENISA notes open-source reporting has gaps in granularity and timing (ENISA-ETL-2026, Methodology).
    Apura Cyber Intelligence frames its FIRST 2026 session as moving 'beyond manual hunting' to collection,
    enrichment and investigative search at scale (FIRST-CON-2026, Apura session title).
  solution: >-
    ENISA states that AI was used in a limited capacity to support collection and processing of data for its Threat
    Landscape 2026, and its methodology allows AI-supported tools for monitoring and collection (ENISA-ETL-2026,
    Disclaimer; ENISA-CTL-2026, section 2.4.7). Apura Cyber Intelligence presented at FIRST 2026 an approach using open
    tooling, retrieval-augmented generation (RAG: the model answers from documents it retrieves) and agentic LLM
    workflows for extraction, enrichment, indexing and investigative search (FIRST-CON-2026, 19 June). A SANS webcast
    abstract describes automating OSINT and underground streams into usable intelligence (SANS-AGENTICWEB-2026). A
    research benchmark (STINER) extracts strategic entities such as targeted sector and threat group from posts on X
    (ARXIV-2608.14418).
  outcomes:
    - {lever: capacity, description: "ENISA published no measure of the effect of AI on its collection work", figure: "none published", measures: "Not applicable; the 2026 dataset of 8,257 incidents (calendar year 2025) counts dataset size, not an AI outcome", provenance: self-reported, source_ref: ENISA-ETL-2026}
    - {lever: quality, description: "A domain-adapted encoder beat general-purpose baselines and fine-tuned LLMs at extracting strategic entities from social-media alerts; the LLMs also had much higher inference latency", figure: "strict F1 89.33% (DarkBERT-based model)", measures: "Strict entity-level F1 on an expert-annotated corpus of 2,100 real-world alerts, eight entity types, best of nine models in 12 configurations; authors' own corpus (RAID 2026)", provenance: independent, source_ref: ARXIV-2608.14418}
  prerequisites:
    - "A defined source list and curation rules; ENISA curates its dataset to avoid inflating threats when sector or country reporting is vague (ENISA-ETL-2026, Methodology)"
    - "Requirements to collect against; DTN Advisory says AI-driven monitoring needs good requirements (DTN-CTI-2026)"
  risks_and_guardrails:
    - "ENISA says open sources and voluntarily shared information do not give a complete picture, and that more reporting can reflect audience interest rather than more activity (ENISA-ETL-2026, Methodology)"
    - "A practitioner quoted by Feedly says disciplined source handling means evaluating source reliability and spotting manipulation inside clear legal and ethical boundaries (FEEDLY-ROUNDUP-2026, Q3 table)"
    - "Smaller adapted models can beat LLMs on narrow extraction, which fits a Forrester analyst's 'Principle of Least AI': use deterministic tools where they suffice (ARXIV-2608.14418; SANS-LEASTAI-2026)"
  human_checkpoints:
    - "All AI outputs were reviewed and validated by subject-matter experts (ENISA-ETL-2026, Disclaimer)"
  role_evolution: >-
    ENISA does not use AI to identify trends or formulate assessments, so analysts remain responsible for selecting and
    validating evidence (ENISA-CTL-2026, section 2.4.7). Its methodology says the process still involves a lot of manual
    work that could largely be automated and aims for more machine-readable output in the mid-term (ENISA-CTL-2026,
    section 3.1).
  evidence_grade: B
  sources:
    - {ref: ENISA-ETL-2026, title: "ENISA Threat Landscape 2026", publisher: ENISA, type: regulator, url: "https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf", date: "2026-09", access: full, locator: "Disclaimer; Methodology section"}
    - {ref: ENISA-CTL-2026, title: "ENISA Cybersecurity Threat Landscape Methodology (updated 18 September 2026)", publisher: ENISA, type: regulator, url: "https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20CTL%20Methodology_Updated%2018%20september%202026.pdf", date: "2026-09-18", access: full, locator: "sections 2.4.7 and 3.1"}
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program, Denver, 14-19 June 2026 (session abstracts)", publisher: FIRST, type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "'Beyond Manual Hunting: OSINT Copilot with LLMs' (Apura Cyber Intelligence), 19 June"}
    - {ref: SANS-AGENTICWEB-2026, title: "Agentic CTI Automation For Fun and Profit (webcast abstract)", publisher: SANS Institute, type: conference, url: "https://www.sans.org/webcasts/agentic-cti-automation-for-fun-and-profit", date: "2026-06-25", access: full, locator: "abstract, 'Lessons Learned'"}
    - {ref: ARXIV-2608.14418, title: "STINER: Automated Extraction of Strategic Cyber Threat Intelligence from X", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2608.14418", date: "2026-08-14", access: full, locator: "abstract"}
    - {ref: DTN-CTI-2026, title: "Your Threat Intelligence Team Is Collecting Data and Calling It Intelligence", publisher: DTN Advisory (Substack), type: community, url: "https://dtnadvisory.substack.com/p/your-threat-intelligence-team-is", date: "2026-03-31", access: full, locator: "section on AI in threat intelligence"}
    - {ref: FEEDLY-ROUNDUP-2026, title: "2026 CTI Practitioners Roundup (14 practitioners; J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/2026-cti-practitioners-roundup", date: "2026-01-29", access: full, locator: "Q3 table"}
    - {ref: SANS-LEASTAI-2026, title: "Principle of Least AI in Threat Intelligence: A Blueprint for Effective GenAI Adoption (J. Shabadu, Forrester; abstract)", publisher: SANS Institute, type: conference, url: "https://www.sans.org/presentations/principle-of-least-ai-in-threat-intelligence-a-blueprint-for-effective-genai-adoption", date: "2026-01-27", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged governance-02, discourse-06 (OSINT copilot) and discourse-16 (STINER, an idea on its own). Grade B rests on a
    named regulator stating it used AI in collection and processing; no measure of effect is published. The Apura
    session is a vendor-practitioner abstract with no results. Also routed here by the incident-response and
    security-operations deep dives (Apura).

- id: security-threat-intelligence-03
  title: Underground, dark-web and infostealer-log collection triaged by NLP and LLM pipelines
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Forum posts, messaging channels and millions of stealer logs are too many and too varied (languages, formats,
    screenshots) for analysts to read. Flare's FIRST abstract says over 50 million stealer logs were posted in 2025
    alone and that the forensic artifacts in them stay untapped because analysis is manual (FIRST-CON-2026, 17 June).
  solution: >-
    Mandiant (2023) described dozens of AI models over botnet, forum and messaging data, with an NLP pipeline for entity
    extraction, topic classification and translation (MANDIANT-AIPHASES-2023, 'Structure and Enrichment'). Flare
    introduced StealerLens at FIRST 2026, an LLM-powered forensic tool to speed infostealer log investigations, building
    on its Black Hat USA 2025 work on LLM analysis of infection screenshots (FIRST-CON-2026, 17 June). Google's relevance
    system filters dark-web findings against an organization profile (GOOGLE-GTIRELEVANCE-2026; see use case 08).
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "The FIRST abstract states the size of the problem but no result for the tool; Mandiant's 2023 post gives no collection-stage figure", provenance: vendor-published, source_ref: FIRST-CON-2026}
  prerequisites:
    - "A pipeline that extracts, enriches and indexes the collected data so an LLM can retrieve from it (FIRST-CON-2026, Apura abstract)"
  risks_and_guardrails:
    - "Stealer logs and forum posts are attacker-controlled content; a FIRST 2026 session shows one crafted artifact can steer retrieval and the analyst-facing narrative of an LLM-assisted workflow (FIRST-CON-2026, CyCraft session, 18 June)"
    - "A practitioner says teams talk about dark web monitoring but not real source handling (FEEDLY-ROUNDUP-2026, Q3 table)"
    - "Google tells customers to keep Digital Threat Monitoring and Attack Surface Management running in parallel while its relevance system is in Beta (GOOGLE-GTIRELEVANCE-2026, Beta note)"
  human_checkpoints:
    - "Not stated in the abstracts or the Mandiant post"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: FIRST-CON-2026, title: "38th FIRST Conference program, Denver, 14-19 June 2026 (session abstracts)", publisher: FIRST, type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "'Introducing StealerLens' (Flare), 17 June; CyCraft session, 18 June; Apura abstract, 19 June"}
    - {ref: MANDIANT-AIPHASES-2023, title: "AI and the Five Phases of the Threat Intelligence Lifecycle", publisher: Mandiant (Google Cloud Blog), type: vendor, url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-five-phases-intelligence-lifecycle", date: "2023-08-24", access: full, locator: "'Structure and Enrichment' section"}
    - {ref: GOOGLE-GTIRELEVANCE-2026, title: "Getting Started with our new Dark Web Intel capabilities, powered by the relevance system", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/dark-web-intel", date: "2026-06-22", access: full, locator: "introduction and Beta note"}
    - {ref: FEEDLY-ROUNDUP-2026, title: "2026 CTI Practitioners Roundup (14 practitioners; J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/2026-cti-practitioners-roundup", date: "2026-01-29", access: full, locator: "Q3 table"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-09 and discourse-07. Conference abstracts only; slides were not read. The Mandiant source is from
    2023 and is a foundation source. StealerLens was also routed here by the incident-response practice deep dive.

- id: security-threat-intelligence-04
  title: Multi-agent system that actively elicits intelligence in underground forums (research prototype)
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Passive monitoring yields less as forum users grow aware of data collection and valuable intelligence moves to
    private or harder-to-reach spaces (ARXIV-2608.23185, abstract).
  solution: >-
    DarkBot, a university and industry prototype, splits interaction across eleven agents: engagement gating for
    relevance and safety, question generation guided by ATT&CK tactics, and style adaptation. It was tested on recorded
    conversations and then in a prospective matched deployment on live forums (ARXIV-2608.23185, abstract). Recorded
    here at the level a defender needs; it is not an operational recommendation.
  outcomes:
    - {lever: growth, description: "In a controlled evaluation the system recovered most validated ATT&CK techniques from the initial post alone; in a matched live deployment its threads gathered more CTI entities than controls", figure: "72.8% of validated techniques recovered; 3.85 more CTI entities per thread over seven days", measures: "Share of validated MITRE ATT&CK techniques recovered across 100 CrimeBB conversations using only the initial post; mean extra CTI entities in assigned threads versus matched controls over seven days; no account suspensions or accusations of automated participation across 104 live conversations; authors' own system", provenance: independent, source_ref: ARXIV-2608.23185}
  prerequisites:
    - "Ethics and data-protection review before deployment; the authors report approval by their university's Research Ethics Committee after a hearing, a published privacy notice, and GDPR handling with salted-hash pseudonymization of usernames (ARXIV-2608.23185, ethics section)"
  risks_and_guardrails:
    - "The authors report that a layered safety design contained all injected jailbreak attempts at the pipeline level (ARXIV-2608.23185, abstract)"
    - "The agent does not disclose that it is automated; the authors constrain this deception to clarifying cybersecurity questions, no impersonation of real people, and termination of sensitive or jailbreak conversations (ARXIV-2608.23185, ethics section)"
    - "A practitioner in Feedly's roundup says teams rarely discuss source handling inside clear legal and ethical boundaries (FEEDLY-ROUNDUP-2026, Q3 table)"
  human_checkpoints:
    - "Engagement gating is a built-in filter; operator review of individual conversations is not described in the abstract (ARXIV-2608.23185)"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: ARXIV-2608.23185, title: "Towards Automated Cyber Threat Intelligence Elicitation in Underground Forums", publisher: "arXiv (Politecnico di Milano and BV TECH)", type: academic, url: "https://arxiv.org/abs/2608.23185", date: "2026-08-24", access: full, locator: "abstract; author affiliations on page 1; ethics section (IX)"}
    - {ref: FEEDLY-ROUNDUP-2026, title: "2026 CTI Practitioners Roundup (14 practitioners; J. D. MacLellan)", publisher: Feedly TI Essentials, type: vendor, url: "https://feedly.com/ti-essentials/posts/2026-cti-practitioners-roundup", date: "2026-01-29", access: full, locator: "Q3 table"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-19 (graded A), discourse-17 (D) and governance-14 (C). Graded C: measured results come from a
    research prototype run by its authors, not from any CTI team, so A (which needs an organization's measured
    operational outcome) overstates it, and D understates it because a live trial took place. Kept as a frontier
    signal. The authors describe institutional ethics approval for their study; whether a CTI team could lawfully run
    covert engagement in its own jurisdiction is a question the paper does not answer for practitioners.

- id: security-threat-intelligence-05
  title: Unstructured reports turned into indicators, entities and tags, with the source report kept attached and checks before storage
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Analysts read vendor blogs, advisories and feeds, then retype indicators of compromise (IOCs: hashes, domains, IP
    addresses and similar traces) into their tools; indicators get separated from the reason they matter
    (CLOUDFLARE-THREATSIGNALS-2026, introduction). In an 18-person practitioner survey, 13 of 18 named isolating
    malicious indicators from noisy attack data as a recurring challenge (ARXIV-2609.01174, section 3.2).
  solution: >-
    Cloudflare's Threat Signals polls feeds the customer chooses, cleans each article, runs an indicator extractor plus
    summarization, tagging and contextualization skills, and stores each indicator as a threat event linked to its
    source report (CLOUDFLARE-THREATSIGNALS-2026). Adobe's threat research team uses LLMs to extract structured
    indicators from advisories in many formats (ADOBE-CTRI-2026; see use case 16). Anthropic's threat intelligence
    engineering posting describes pipelines that ingest RSS, CTI news and partner sharing and use Claude to extract TTPs
    (tactics, techniques and procedures) (ANTHROPIC-JOBTIE-2026). OpenCTI offers an AI connector that turns documents
    into STIX bundles, with an on-premises option for air-gapped sites (OPENCTI-IMPORTAI-2025). Feedly publishes a
    prompt workflow that returns each indicator with the sentence it came from, in STIX 2.1 (the standard format for
    exchanging threat intelligence), for analyst review (FEEDLY-AUTOMATE-2026, Workflow 1).
  outcomes:
    - {lever: quality, description: "Cloudflare reports analyst trust depended on three design choices: AI tags limited to the account's existing catalog, a record of whether each tag was automatic or analyst-applied, and the link from each event to its source report", figure: "none published", measures: "Qualitative statements by Cloudflare's authors from early testing; no counts, error rates or sample", provenance: vendor-published, source_ref: CLOUDFLARE-THREATSIGNALS-2026}
    - {lever: quality, description: "Controlled study on held-out sandbox reports: three LLMs returned far fewer false indicators than rule baselines but recovered only a minority of labeled indicators", figure: "363 to 461 of 1,472 labeled indicators recovered (recall 0.25 to 0.31); precision 0.51 to 0.78 (rule baselines 0.09 and 0.41)", measures: "True positives out of 1,472 labeled indicators in 45 held-out sandbox reports; precision = true positives out of all values reported", provenance: independent, source_ref: ARXIV-2609.01174}
    - {lever: quality, description: "Preregistered audit of entity extraction from full-length incident reports: precision stayed low across model tiers, including the flagship control", figure: "micro precision 0.03 to 0.34", measures: "Micro precision of entity extraction by two low-cost LLMs and one flagship control over 354 incident campaigns (315 unique reports, 630 model-report evaluations), strict matching", provenance: independent, source_ref: ARXIV-2610.20417}
    - {lever: quality, description: "Benchmark of static IOC recovery from malicious scripts; the authors say recovery without execution remains hard across model scales", figure: "65.4 F1 (strongest model)", measures: "F1 for URLs, domains, IP addresses and filesystem artifacts recovered without execution from 634 manually verified JavaScript, PowerShell and VBScript samples", provenance: independent, source_ref: ARXIV-2609.06149}
    - {lever: speed, description: "Feedly estimates time saved per report for its extract-and-enrich workflow; an estimate built from its own ranges for manual steps, not a measurement", figure: "25 to 50 minutes per report (potential)", measures: "Feedly 'Potential time saved' for Workflow 1 against manual steps of 10-20, 15-30 and 10-20 minutes; no measured baseline or sample", provenance: vendor-published, source_ref: FEEDLY-AUTOMATE-2026}
  prerequisites:
    - "A defined set of trusted source feeds and an existing tag vocabulary (CLOUDFLARE-THREATSIGNALS-2026, 'What we learned')"
    - "A store where indicators keep their provenance, and ingestion connectors with rate-limit and failure handling (CLOUDFLARE-THREATSIGNALS-2026; ADOBE-CTRI-2026, design guidance)"
    - "Each indicator tied to its source sentence and to the malware, technique, campaign or actor it appeared with, because an indicator alone ages quickly (FEEDLY-AUTOMATE-2026, Workflow 1)"
  risks_and_guardrails:
    - "Shared IOCs are consumed as blocklists, so one benign value reported as an indicator raises false detections in every organization that blocks it; precision matters more than recall for sharing (ARXIV-2609.01174, Experiments 1 and 2)"
    - "A single misattribution sentence flipped high-confidence relation judgments in 95.6 to 100% of tested cases; confidence tiering by self-consistency passed the authors' preregistered precision bar in 6 of 6 test cells, but the authors conclude confidence may set review priority, never truth (ARXIV-2610.20417, abstract)"
    - "Encryption-based concealment severely degrades LLM recovery of indicators from obfuscated code (ARXIV-2605.06910, abstract)"
    - "Propose-then-verify designs ground each candidate in report evidence and official ATT&CK definitions to suppress misclassification and hallucination (ARXIV-2608.28394, abstract)"
    - "A crafted report or email can bias what a RAG-based workflow retrieves and outputs (FIRST-CON-2026, CyCraft session, 18 June)"
    - "Adobe recommends circuit breakers, retries, monitoring dashboards and running the system beside existing processes to build trust (ADOBE-CTRI-2026)"
  human_checkpoints:
    - "Analysts see which tags were applied automatically and trace each indicator to its report (CLOUDFLARE-THREATSIGNALS-2026, 'What we learned')"
    - "In analyst-reviewed variants, an approval step sits between any stage that reads and any stage that writes to live tooling (FEEDLY-AUTOMATE-2026, 'Chaining the workflows together')"
    - "The SoK authors conclude each step of generating shareable CTI needs expert supervision (ARXIV-2609.01174, abstract)"
  role_evolution: >-
    Feedly says AI is absorbing routine feed aggregation and indicator enrichment and the premium shifts to interpreting
    what the data means for the organization (FEEDLY-HIRING-2026). Cloudflare says Threat Signals began as a one-week
    prototype built by a threat analyst (CLOUDFLARE-THREATSIGNALS-2026), and Anthropic's posting describes a
    foundational engineering role that may grow into a multi-person collections function (ANTHROPIC-JOBTIE-2026).
  evidence_grade: B
  sources:
    - {ref: CLOUDFLARE-THREATSIGNALS-2026, title: "Introducing Threat Signals: agentic skills for open-source threat intelligence, free for every Cloudflare account", publisher: Cloudflare, type: vendor, url: "https://blog.cloudflare.com/threat-signals/", date: "2026-09-29", access: full, locator: "introduction; how it works; 'What we learned'"}
