  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-06, discourse-05, discourse-18 and governance-10. Maturity 'piloting' because the relevance system
    is Beta. Vendor claims only; no customer outcome or override rate is published. An earlier draft attributed IDC
    figures (139% more threats identified, 46% more efficient CTI teams) to Google's launch post; the post does not
    contain them, so they were removed. POLAR (arXiv 2610.07298) reports better threat
    ranking than baselines with no figure in its abstract. Google's group warns raw CVE volume can mislead (about 5,000
    Linux kernel CVEs in January to August 2026 with no observed exploited zero-days); that item is routed to
    vulnerability-exposure (see security-vulnerability-exposure-09, prioritisation using LLM-synthesised threat
    intelligence).

- id: security-threat-intelligence-09
  title: Malware-analysis agent that triages samples, explains behaviour and extracts indicators for analysts
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [expert-judgment, research-synthesis]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Malware samples from partners need manual reverse engineering to find indications of compromise and adversary
    command-and-control (CISA-AIUC-2024, DHS-107).
  solution: >-
    Google Threat Intelligence's Malware Analyst agent triages files by hash or upload, reverse engineers binaries and
    scripts, deobfuscates PowerShell, VBA, HTA and JavaScript, and explains behaviour in natural language with its
    reasoning shown (GOOGLE-GTIAGENTIC-2026, section 3.1); a 2026-09-10 release added MSI and MSIX installer parsing
    (GOOGLE-GTICHANGELOG2-2026). CISA's December 2024 AI inventory listed a malware reverse-engineering use case at the
    initiation stage that uses deep learning to help its analysts understand malware samples, to speed the production
    of threat intelligence shared with partners (CISA-AIUC-2024, DHS-107).
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "No measurement found for the Google agent or CISA's early-stage tool", provenance: vendor-published, source_ref: GOOGLE-GTIAGENTIC-2026}
  prerequisites:
    - "Google Threat Intelligence Enterprise or Enterprise Plus licence; file uploads use the customer's private scanning quota (GOOGLE-GTIAGENTIC-2026, callouts)"
  risks_and_guardrails:
    - "Files and indicators submitted may be added to Google's shared dataset unless handled as private samples; sensitive or personal data should not be submitted (GOOGLE-GTIAGENTIC-2026, callouts)"
    - "Google says the AI may be inaccurate and shows reasoning and tool calls so users can spot hallucinations (GOOGLE-GTIAGENTIC-2026, section 1.2)"
    - "Encryption-based concealment severely degrades LLM recovery of indicators from obfuscated code (ARXIV-2605.06910, abstract)"
  human_checkpoints:
    - "CISA describes its capability as assisting analysts within a larger reverse-engineering toolbox (CISA-AIUC-2024, DHS-107)"
  role_evolution: "Not described in the sources beyond analysts consuming the agent's output."
  evidence_grade: C
  sources:
    - {ref: GOOGLE-GTIAGENTIC-2026, title: "Agentic Platform (Google Threat Intelligence documentation)", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/agentic-platform", date: "2026-09-24", access: full, locator: "section 3.1 Malware Analyst Agent; section 1.2; callouts"}
    - {ref: GOOGLE-GTICHANGELOG2-2026, title: "September 10th, 2026 - Single Target Operations (GA), Google Insights, Agentic Updates, and Detection Highlights", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/changelog/september-10th-2026-single-target-operations-ga-google-insights-agentic-updates-and-detection-highlights", date: "2026-09-10", access: full, locator: "Google TI Agentic Updates"}
    - {ref: CISA-AIUC-2024, title: "CISA Artificial Intelligence Use Cases (December 2024 inventory refresh)", publisher: CISA, type: regulator, url: "https://www.cisa.gov/ai/cisa-use-cases", date: "2024-12-16", access: full, locator: "Malware Reverse Engineering (DHS-107), stage 'Initiation' (read through a text mirror)"}
    - {ref: ARXIV-2605.06910, title: "Benchmarking Large Language Models for IoC Recovery under Adversarial Code Obfuscation and Encryption", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2605.06910", date: "2026-05-07", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-08. Synthesis cited the January 2026 DHS AI use case inventory (dhs.gov/ai/use-case-inventory/cisa)
    for CISA's tool as pre-deployment classical machine learning; that page returned HTTP 403 directly and through the
    text mirror on 2026-10-17, so the entry now rests on CISA's own December 2024 page, which lists classification,
    clustering, generative AI, information extraction and translation among the tool's techniques. Google's changelog shows active development from May to October 2026 but no customer evidence. Google's frontline
    intelligence team also describes automated script decoding (see use case 19). The security-operations governance
    deep dive routed the CyberSOCEval malware-analysis benchmark (arXiv 2509.20166) here; no figures were passed on.

- id: security-threat-intelligence-10
  title: Threat research agent that triages OSINT articles, gathers evidence, verifies indicators and drafts cited reports for expert review
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, document-production]
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Analysts triage articles, gather supporting evidence and write the report; analysts at the authors' organization
    said analyzing one incident from an article typically takes several hours (ARXIV-2603.09452, section 1).
  solution: >-
    Authors from Microsoft Research and Microsoft describe a Threat Research Agent (TRA) integrated into their
    organization's CTI workflow: an LLM researches a seed article, retrieves supplementary public and proprietary
    content, filters it and drafts a cited report for human review. Verifiers cross-check indicators and techniques
    against external sources such as VirusTotal, and expert corrections are fed back into the prompts
    (ARXIV-2603.09452, sections 1 and 5).
  outcomes:
    - {lever: quality, description: "IoC extraction precision rose a few points with TRA for every base model, at several times the run time; the paper's text claims a 26-point gain that its appendix table does not support, so table values are used", figure: "IoC precision +0.02 to +0.05 (for example 0.8240 to 0.8496 for GPT-4o)", measures: "Precision of IoC extraction on CyberThreat-Eval, built from the authors' daily CTI workflow, vanilla LLM versus the same LLM inside TRA (Table 6); GPT-4o run time rose from about 580 s to about 2,286 s", provenance: self-reported, source_ref: ARXIV-2603.09452}
    - {lever: quality, description: "Technique identification precision rose modestly with TRA while recall was flat or lower", figure: "TTP precision 0.3480 to 0.4190 (o3-mini); recall 0.1759 to 0.1558 (o3-mini)", measures: "Precision and recall of ATT&CK TTP identification on CyberThreat-Eval, vanilla versus TRA (Table 6); section 5.2 text quotes different values", provenance: self-reported, source_ref: ARXIV-2603.09452}
    - {lever: quality, description: "Expert ratings of generated narratives improved most, especially for weaker base models", figure: "threat-actor relevance 1.547 to 2.902 (GPT-4o)", measures: "Average expert scores on a five-point scale, vanilla versus TRA (Table 6); number of raters and items not read", provenance: self-reported, source_ref: ARXIV-2603.09452}
    - {lever: quality, description: "Without TRA, the tested models over-accepted articles at triage and gave weak priority scores", figure: "triage precision typically below 0.40 with recall often above 0.90; priority-score accuracy 55 to 60%", measures: "Article accept/reject precision and recall and priority-score accuracy on CyberThreat-Eval triage tasks (section 4)", provenance: self-reported, source_ref: ARXIV-2603.09452}
  prerequisites:
    - "A benchmark built from the team's own workflow with expert annotations (ARXIV-2603.09452, section 3)"
    - "Access to external ground-truth sources such as VirusTotal for verification (ARXIV-2603.09452, section 5.1)"
  risks_and_guardrails:
    - "The models struggled to tell correct from incorrect information and to map techniques; the authors say TRA 'cannot yet fully automate' the workflow (ARXIV-2603.09452, abstract and section 5.2)"
    - "Precision, latency and token cost trade off; for IoC extraction TRA raised precision but also run time several-fold (ARXIV-2603.09452, Table 6)"
  human_checkpoints:
    - "TRA outputs are reviewed by a team of experts whose corrections are collected systematically (ARXIV-2603.09452, section 5.2)"
  role_evolution: >-
    Experts review cited drafts instead of building them, and their corrections become labelled data; in one case TRA
    surfaced a hardcoded-password fact the analyst had missed (ARXIV-2603.09452, section 5.2).
  evidence_grade: B
  sources:
    - {ref: ARXIV-2603.09452, title: "CyberThreat-Eval: Can Large Language Models Automate Real-World Threat Research?", publisher: "arXiv (TMLR 11/2025; Microsoft Research and Microsoft authors)", type: academic, url: "https://arxiv.org/abs/2603.09452", date: "2026-03-10", access: full, locator: "sections 1, 3, 4, 5.1, 5.2; Table 6 (Appendix D)"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-14, regraded from A to B under the 2026-10-17 rule. The paper says 'the company' without naming it;
    the deploying team is probably Microsoft's CTI division, but that is an inference. The figures compare vanilla and
    agent-assisted models on a benchmark the team built, not before-and-after results of the deployment, and the
    paper's text and table disagree. The paper reports TRA as integrated into daily CTI work without usage volumes.

- id: security-threat-intelligence-11
  title: Natural-language questions answered from a curated intelligence corpus, for analysts and for colleagues outside the intelligence team
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, client-interaction]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Analysts pivot by hand across feeds, portals and query languages, and colleagues outside the security team wait
    days for answers about the threat landscape (RF-COWBELL-2026; RF-SUPERHUMAN-2026).
  solution: >-
    Intelligence platforms put a chat or agent interface on their own corpus. Google Threat Intelligence 'Agentic'
    shows its plan, tool calls and cited sources (GOOGLE-GTIAGENTIC-2026). Recorded Future AI answers from its
    Intelligence Graph (RF-AI-2026). Microsoft Security Copilot answers from Microsoft Threat Intelligence through a
    plugin (MSFT-MDTICOPILOT-2026). Cloudflare's Cloudy assistant covers its Threat Events data (CLOUDFLARE-CLOUDY-2025)
    and CrowdStrike lists threat intelligence analysis among Charlotte AI's functions (CRWD-CHARLOTTE-2026). At Cowbell,
    authorized colleagues outside the intelligence team query the platform directly (RF-COWBELL-2026); at Superhuman,
    engineers ask Recorded Future AI in natural language (RF-SUPERHUMAN-2026).
  outcomes:
    - {lever: speed, description: "Cowbell says stakeholder questions now get an answer in minutes where they used to take two or three days of research by the intelligence team", figure: "minutes instead of two to three days (customer statement)", measures: "Cowbell quote in a vendor-written case study; no sample, baseline period or method", provenance: vendor-published, source_ref: RF-COWBELL-2026}
    - {lever: cost, description: "Cowbell's SVP and GM of Resiliency Services says threat intelligence costs fell by over 90% with the Recorded Future platform as a whole, not the AI features alone", figure: "over 90% (customer statement, platform-wide)", measures: "Quote in a vendor case study; cost baseline and scope not stated", provenance: vendor-published, source_ref: RF-COWBELL-2026}
  prerequisites:
    - "A licence tier that includes the AI features (Google: Enterprise or Enterprise Plus) and AI settings left enabled (GOOGLE-GTIAGENTIC-2026; GOOGLE-GTIRELEVANCE-2026)"
    - "For Security Copilot, the Microsoft Threat Intelligence plugin turned on (MSFT-MDTICOPILOT-2026)"
  risks_and_guardrails:
    - "Google's documentation says the generative AI may produce inaccurate information and responses should be a starting point to double-check (GOOGLE-GTIAGENTIC-2026, callout 'AI is a tool')"
    - "Indicators and files submitted through the web interface are added to the vendor's shared dataset, so sensitive or personal data should not be submitted (GOOGLE-GTIAGENTIC-2026, opening callouts)"
    - "An independent study attributes LLM failures in CTI to the threat landscape itself (spurious correlations, contradictory sources, weak generalization to new threats) (ARXIV-2509.23573, abstract)"
  human_checkpoints:
    - "Analyst reads the cited sources and the agent's tool-call trace before relying on an answer (GOOGLE-GTIAGENTIC-2026, section 1.2)"
    - "Superhuman analysts still run in-depth investigations and validate hypotheses themselves (RF-SUPERHUMAN-2026)"
  role_evolution: >-
    Superhuman says engineers now get threat intelligence directly, which reduces their dependency on the security team
    (RF-SUPERHUMAN-2026). Recorded Future's page quotes an anonymous manufacturer saying the AI lets less experienced
    analysts do more (RF-AI-2026); this is marketing copy.
  evidence_grade: B
  sources:
    - {ref: RF-COWBELL-2026, title: "Cowbell Achieves 90% Cost Savings With Recorded Future", publisher: Recorded Future, type: vendor, url: "https://www.recordedfuture.com/case-study/cowbell", date: "2026-09-30", access: full, locator: "headline; sections on AI Sessions and on cost and staffing savings"}
    - {ref: RF-SUPERHUMAN-2026, title: "How Superhuman Unlocked a New Era of AI-Driven Threat Intelligence With Recorded Future", publisher: Recorded Future, type: vendor, url: "https://www.recordedfuture.com/case-study/superhuman", date: "2026-06-08", access: full, locator: "sections on AI-native workflows and cultural change"}
    - {ref: RF-AI-2026, title: "Streamline Security Workflows with AI", publisher: Recorded Future, type: vendor, url: "https://www.recordedfuture.com/platform/ai", date: "2026-10-17", access: full, locator: "feature list; FAQ; customer quote (page undated; retrieval date)"}
    - {ref: GOOGLE-GTIAGENTIC-2026, title: "Agentic Platform (Google Threat Intelligence documentation)", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/agentic-platform", date: "2026-09-24", access: full, locator: "callouts; sections 1.2, 2.1, 3"}
    - {ref: GOOGLE-GTIRELEVANCE-2026, title: "Getting Started with our new Dark Web Intel capabilities, powered by the relevance system", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/dark-web-intel", date: "2026-06-22", access: full, locator: "note 'AI settings need to be enabled'"}
    - {ref: MSFT-MDTICOPILOT-2026, title: "Use Microsoft Security Copilot for threat intelligence", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender/threat-intelligence/security-copilot-and-defender-threat-intelligence", date: "2026-07-30", access: full, locator: "sections on prompts, plugin and promptbooks (ms.date 2026-07-30; updated 2026-09-23)"}
    - {ref: CLOUDFLARE-CLOUDY-2025, title: "Automating threat analysis and response with Cloudy", publisher: Cloudflare, type: vendor, url: "https://blog.cloudflare.com/automating-threat-analysis-and-response-with-cloudy/", date: "2025-08-29", access: full, locator: "sections on the Cloudforce One Threat Events integration"}
    - {ref: CRWD-CHARLOTTE-2026, title: "Charlotte AI: Agentic Analyst for Cybersecurity", publisher: CrowdStrike, type: vendor, url: "https://www.crowdstrike.com/en-us/platform/charlotte-ai/", date: "2026-09-14", access: full, locator: "FAQ (date from the page's JSON-LD dateModified)"}
    - {ref: ARXIV-2509.23573, title: "Uncovering Vulnerabilities of LLM-Assisted Cyber Threat Intelligence", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2509.23573", date: "2025-09-28", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-01, regraded from A to B under the 2026-10-17 rule: both figures are a customer's statements in a
    vendor-written case study with no stated method, so they are kept but labelled. Cowbell and Superhuman are named
    deployments. The self-service effect (engineers outside security querying intelligence) is the
    nearest this module comes to a change in who does the work.

- id: security-threat-intelligence-12
  title: Drafting and tailoring threat briefings and reports for different audiences, on a schedule or on demand
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Producers write the same finding several times for different readers (SOC, resilience leads, executives); 91% of
    CISOs value CTI but only 26% say it significantly influences their decisions (SANS-CTI-2026). Building a briefing
    means pulling and filtering data from several feeds and tools before writing, which Microsoft says can take hours
    or days (MSFT-TIBAGENT-2026).
  solution: >-
    SANS reports 45% of surveyed organizations use AI in CTI, mainly for summarization and report writing, with a
    human in the loop (SANS-CTIPR-2026). Microsoft's Threat Intelligence Briefing Agent runs on a schedule or on demand
    and combines actor activity with the customer's vulnerability data (MSFT-TIBAGENT-2026). Google Threat Intelligence
    'Flows' schedule a prompt such as a daily sector digest and can email the result (GOOGLE-GTIFLOWS-2026;
    GOOGLE-GTICHANGELOG-2026). Recorded Future AI drafts template or custom reports (RF-AI-2026); Cowbell receives
    reports and short summaries for decision-makers (RF-COWBELL-2026); a US public-sector customer uses AI for weekly
    reports (RF-PUBSECTOR-2026). CISA's December 2024 inventory listed a RAG tool, at the initiation stage, that drafts
    tailored summaries of approved CISA products, with staff reviewing drafts (CISA-AIUC-2024, DHS-2335). ServiceNow's CTI team advertises a reports-officer role expected
    to use generative AI for synthesis and trend summaries (JOB-SERVICENOW-2025). Health-ISAC is looking into AI to speed
    alert distribution and collate open-source intelligence for daily member reports (CSD-ISACAI-2026; HISAC-AIISAC-2026).
  outcomes:
    - {lever: capacity, description: "Share of surveyed organizations using AI in CTI programs, mainly for summarization, report writing and workflow automation", figure: "45% using; another 32% planning to adopt", measures: "Share of organizations, from 401 practitioners surveyed November 2025 to January 2026 (sponsor-supported; SANS says sponsors had no role in design or analysis)", provenance: independent, source_ref: SANS-CTI-2026}
    - {lever: speed, description: "Microsoft says the briefing agent produces a customized report in minutes where manual briefing building can take hours or days", figure: "minutes versus hours or days (design claim)", measures: "Product documentation statements; not a measurement; no sample or method", provenance: vendor-published, source_ref: MSFT-TIBAGENT-2026}
    - {lever: quality, description: "No measurement of output quality was found; Feedly's author reports LLM output compared with an analyst's was often verbose, generic and operationally weak and lacked calibrated confidence", figure: "none published", measures: "Qualitative comparison of one request answered by an LLM and an analyst", provenance: vendor-published, source_ref: FEEDLY-VALUE-2026}
  prerequisites:
    - "A well-structured priority intelligence requirement; DTN Advisory says 'tell me about cyber threats' gives noise at scale (DTN-CTI-2026)"
    - "A one-page team policy on approved tools, data classification and disclosure of AI use in a report's methodology section (FEEDLY-VALUE-2026)"
    - "For Microsoft's agent, a dedicated agent identity with minimal read permissions and correct device-group permissions; without them the exposure report can show zero CVEs when vulnerabilities exist (MSFT-TIBAGENT-2026; MSFT-DEFENDER-AGENTS-2026)"
  risks_and_guardrails:
    - "ENISA says no AI-generated content was used in its Threat Landscape 2026 and its methodology allows AI only for limited editorial help such as rephrasing, not for analytical conclusions (ENISA-ETL-2026, Disclaimer; ENISA-CTL-2026, section 2.4.7)"
    - "De-skilling: analysts who read AI summaries instead of primary sources may lose pattern recognition; Feedly suggests requiring review of original sources before an assessment is submitted (FEEDLY-VALUE-2026)"
    - "Intel 471 says an AI output is only as effective as the analyst validating it (INTEL471-AIHUMAN-2026)"
    - "RH-ISAC's chief security officer warned AI analysis could break chain of custody of threat data and saw nothing on the market people trust (CSD-ISACAI-2026)"
  human_checkpoints:
    - "Drafts are reviewed, edited and coordinated by authorized CISA personnel before publication (CISA-AIUC-2024, DHS-2335)"
    - "Analyst approves the final analytic content and carries accountability (ENISA-CTL-2026, section 2.4.7)"
    - "Google Flows keeps each run's input and output and links to the full agent session (GOOGLE-GTIFLOWS-2026)"
  role_evolution: >-
    ServiceNow lists LLM-driven drafting as a requirement alongside eight or more years of CTI experience
    (JOB-SERVICENOW-2025). Superhuman's engineers say translating intelligence for leadership helps justify investments
    (RF-SUPERHUMAN-2026). Feedly warns efficiency narratives could lead to budget cuts, hiring freezes and fewer
    entry-level roles (FEEDLY-VALUE-2026).
  evidence_grade: B
  sources:
    - {ref: SANS-CTI-2026, title: "SANS 2026 Cyber Threat Intelligence Survey Insights (key findings page and FAQ)", publisher: SANS Institute, type: survey, url: "https://www.sans.org/research/cyber-threat-intelligence-report", date: "2026-05", access: full, locator: "FAQ on AI use in CTI"}
    - {ref: SANS-CTIPR-2026, title: "91% of CISOs Value Cyber Threat Intelligence. Only 26% Say It Drives Their Decisions (2026 SANS CTI Survey press release)", publisher: SANS Institute, type: survey, url: "https://www.sans.org/press/announcements/2026-cyber-threat-intelligence-survey-insights-report", date: "2026-05-19", access: full, locator: "opening; paragraphs on AI use"}
    - {ref: MSFT-TIBAGENT-2026, title: "Security Copilot Threat Intelligence Briefing Agent in Microsoft Defender", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/threat-intel-briefing-agent-defender", date: "2026-07-02", access: full, locator: "introduction; prerequisites; agent identity section"}
    - {ref: MSFT-DEFENDER-AGENTS-2026, title: "Deploy AI agents in Microsoft Defender", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender", date: "2026-05-12", access: full, locator: "Threat Intelligence Briefing Agent permissions section (page ms.date 2026-05-12; updated August 2026)"}
    - {ref: GOOGLE-GTIFLOWS-2026, title: "Flows (Google Threat Intelligence documentation)", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/docs/flows-guide", date: "2026-07-31", access: full, locator: "What is a Flow; Monitoring executions"}
    - {ref: GOOGLE-GTICHANGELOG-2026, title: "August 12th, 2026 - Agentic Flows & API, and Threat Actor Naming Updates", publisher: Google, type: vendor, url: "https://gtidocs.readme.io/changelog/august-5th-2026-agentic-flows-api-and-threat-actor-naming-updates", date: "2026-08-12", access: full, locator: "Public Preview: Google TI Flows"}
