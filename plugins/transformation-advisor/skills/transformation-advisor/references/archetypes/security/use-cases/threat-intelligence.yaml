- id: security-threat-intelligence-20
  title: Managed-service agents turn new campaigns into hunt hypotheses, environment-specific queries and standing detection rules
  archetype: security
  module: threat-intelligence
  function: service-delivery
  work_types: [expert-judgment, research-synthesis, software-systems]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Hypothesis-driven hunting is limited by scarce senior hunters, so teams cannot test for emerging campaigns that have
    not yet triggered an alert (CYBERPROOF-HUNTING-2026).
  solution: >-
    CyberProof describes four agents run as a managed service for a transport and logistics client: one matches
    campaigns to the client's industry, geography and technology; one turns each relevant campaign into 30 to 40 hunting
    hypotheses; one converts hypotheses into SIEM queries that fit the client's data sources; one turns persistent hunts
    into standing detection rules (CYBERPROOF-HUNTING-2026, 'Our solution').
  outcomes:
    - {lever: capacity, description: "CyberProof reports 150 to 200 hunts a month for the client", figure: "10 to 15 times more hunts; 150 to 200 hunts per month", measures: "Vendor's description for one unnamed client versus earlier capacity ('3 to 5 threat hunters were needed'); baseline hunt count not stated", provenance: vendor-published, source_ref: CYBERPROOF-HUNTING-2026}
    - {lever: risk, description: "CyberProof says hunts converted to detection rules raised active detection coverage", figure: "20% increase in active detection coverage", measures: "Stated increase in the client's continuous-monitoring coverage; denominator and coverage definition not given", provenance: vendor-published, source_ref: CYBERPROOF-HUNTING-2026}
  prerequisites:
    - "Open-source and commercial feeds plus a description of the client's industry, geography and technology stack (CYBERPROOF-HUNTING-2026, agent 1)"
    - "Access to the client's SIEM data and naming conventions; the client runs a Microsoft security stack (CYBERPROOF-HUNTING-2026, agent 3)"
  risks_and_guardrails:
    - "The client is unnamed and the figures come from the provider's own marketing page; there is no independent check (CYBERPROOF-HUNTING-2026)"
    - "An independent benchmark of open-ended agentic hunting on raw logs found the best of five frontier models flagged 3.8% of malicious events; that task gives no intelligence-derived hypothesis, so it is not a direct test of this design (ARXIV-2604.19533, abstract)"
    - "Unconstrained LLM agents can invent causal links between log events (ARXIV-2605.29269, abstract)"
  human_checkpoints:
    - "CyberProof says human oversight remains central and senior analysts focus on interpretation and judgment, but does not say which steps need approval (CYBERPROOF-HUNTING-2026)"
  role_evolution: >-
    Query construction, described as a dedicated hunter's job, moves to an agent; senior analysts keep interpretation
    and judgment (CYBERPROOF-HUNTING-2026).
  evidence_grade: C
  sources:
    - {ref: CYBERPROOF-HUNTING-2026, title: "How agentic AI delivered continuous threat hunting for a transport giant", publisher: CyberProof, type: vendor, url: "https://www.cyberproof.com/case-studies/agentic-ai-transportation/", date: "2026-07", access: full, locator: "Benefits; Our solution; Results (date from the PDF's creation date)"}
    - {ref: ARXIV-2604.19533, title: "Cyber Defense Benchmark: Agentic Threat Hunting Evaluation for LLMs in SecOps", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2604.19533", date: "2026-04-21", access: full, locator: "abstract"}
    - {ref: ARXIV-2605.29269, title: "HunterAgent: Neuro-Symbolic Attack Trace Reconstruction under Anti-Forensics", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2605.29269", date: "2026-05-28", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-04. Graded C because the client is unnamed and every figure is the provider's own. The page describes
    agents identifying MuddyWater-linked campaign signatures on the day and an attempted intrusion contained at staging;
    this is the vendor's narrative. No source describes new pricing or a new service line, so change_scope is process.

- id: security-threat-intelligence-21
  title: Scheduled AI hunt agents that investigate across log sources and must argue against their own findings
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [research-synthesis, data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Grow Therapy, a healthcare platform, needed proactive coverage across systems touching sensitive data, but rules
    cover only patterns someone knows how to write, across sources such as AWS, Okta, Google Workspace, GitHub,
    CrowdStrike, Slack and Stripe (GROWTHERAPY-HUNT-2026).
  solution: >-
    About 20 hunts defined in YAML run daily as containers on AWS ECS Fargate. Each is a five-phase Claude-based
    investigation: data gathering on a cheaper model, baseline comparison, context enrichment, confidence scoring, and a
    final phase where the model must argue against its own findings and may reject one only with specific
    counter-evidence. Findings land in the same alert table as SQL detections and flow to Slack and Jira
    (GROWTHERAPY-HUNT-2026). Recorded Future announced an 'Autonomous Threat Hunting' agent that Forrester called a good
    first step but far from true autonomy (FORRESTER-PREDICT-2025).
  outcomes:
    - {lever: cost, description: "Running about 20 daily AI hunts plus SQL detections costs about $500 a month on existing data infrastructure", figure: "$320 to $510 per month", measures: "Grow Therapy's own monthly cost table (Claude API $250-400, Snowflake $60-90, ECS Fargate $10-20, other $5-10); additive to undisclosed baseline Datadog and Snowflake spend, as Detection Engineering Weekly notes", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: cost, description: "Using the cheaper model for the data-gathering phase cut cost", figure: "about 60% cost reduction", measures: "The post's statement comparing Sonnet for phase 1 with the larger model with extended thinking for every phase", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: quality, description: "Tuning a new hunt in a staging table before enabling alerts cut finding volume", figure: "from 15+ to 2-3 findings per run (first CloudTrail hunt)", measures: "Findings per run for one hunt before and after signal-to-noise tuning; single-hunt example", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: quality, description: "Grow Therapy estimates how much noise the adversarial-validation phase removed", figure: "about 40% of findings were noise without the phase (estimate)", measures: "The team's own estimate before the fifth phase was added; counts and period not stated", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
  prerequisites:
    - "Logs already centralized in a queryable store; the author says the data pipeline matters more than the AI (GROWTHERAPY-HUNT-2026, 'Lessons from building this')"
    - "An analyst feedback loop built before deployment, a narrow first tool set (two data sources for the first five hunts) and per-hunt token and cost tracking (GROWTHERAPY-HUNT-2026)"
    - "Behavioural baselines need 60 to 90 days of data before anomaly detection is reliable, per a vendor quoted by SecurityWeek (SECURITYWEEK-HUNTING-2026)"
  risks_and_guardrails:
    - "The model can overstate findings and occasionally invent evidence, so validation is part of the design; vague counter-evidence does not suppress a finding (GROWTHERAPY-HUNT-2026, 'Multi-phase analysis')"
    - "Unguided agentic hunting is weak: the best of five frontier models flagged 3.8% of malicious events in raw Windows logs and none met a 50% recall bar on every ATT&CK tactic (ARXIV-2604.19533); structured, modular workflows help while open-ended reasoning shows clear limits (ARXIV-2509.23571)"
    - "Log content is attacker-influenced: passive prompt injection reached up to 88.2% attack success against LLM log analysis, and layered defences (input filtering, prompt hardening, output validation) cut attacks by 90.4%, leaving 8.4% residual (USENIX-LOGINJECT-2026)"
    - "In another study the strongest defence cut average injection success from 26.6% to 11.8%, and summarization was the riskiest task (ARXIV-2605.24421)"
  human_checkpoints:
    - "Analysts mark false positives in Slack, which syncs to Jira and back; findings with 3 or more occurrences and an 80% or higher false-positive rate are injected as known false positives (GROWTHERAPY-HUNT-2026, 'Handling noise')"
    - "A weekly report on hunts, findings, false positives and cost decides which hunts need tuning (GROWTHERAPY-HUNT-2026)"
  role_evolution: >-
    Not discussed in the post beyond the analyst feedback loop (GROWTHERAPY-HUNT-2026). Risky Business sponsor segments
    argue the data layer is the lever for automated security work (RISKYBIZ-SOAPBOX109-2026; RISKYBIZ-855-2026).
  evidence_grade: A
  sources:
    - {ref: GROWTHERAPY-HUNT-2026, title: "Threat hunt AI: How we built an AI security analyst on AWS for under $500/month", publisher: Grow Therapy engineering blog, type: firm, url: "https://engineering.growtherapy.com/post/threat-hunt-ai-how-we-built-an-ai-security-analyst-on-aws-for-under-500-month", date: "2026-08", access: full, locator: "'How it runs on AWS', 'Multi-phase analysis', 'Handling noise', 'Lessons from building this', 'Where it stands today'"}
    - {ref: DETENGWEEKLY-167-2026, title: "DEW #167 - More Security Agentic Breaches, Cheap and Scalable Threat Hunting & Detection Skills", publisher: Detection Engineering Weekly, type: community, url: "https://www.detectionengineering.net/p/dew-167-more-security-agentic-breaches", date: "2026-08-19", access: full, locator: "item on the Grow Therapy post (summary and cost caveat)"}
    - {ref: FORRESTER-PREDICT-2025, title: "Recorded Future Predict 2025: Intelligence To Operations ... And Now To Action (J. Shabadu)", publisher: Forrester, type: firm, url: "https://www.forrester.com/blogs/recorded-future-predict-2025-intelligence-to-operations-and-now-to-action/", date: "2025-10-21", access: full, locator: "'Inching Toward Autonomy, One Advanced Automation At A Time'"}
    - {ref: SECURITYWEEK-HUNTING-2026, title: "Cyber Insights 2026: Threat Hunting in an Age of Automation and AI", publisher: SecurityWeek, type: press, url: "https://www.securityweek.com/cyber-insights-2026-threat-hunting-in-an-age-of-automation-and-ai/", date: "2026-01-26", access: full, locator: "'The continuing rise of automation' (read through a text mirror)"}
    - {ref: ARXIV-2604.19533, title: "Cyber Defense Benchmark: Agentic Threat Hunting Evaluation for LLMs in SecOps", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2604.19533", date: "2026-04-21", access: full, locator: "abstract"}
    - {ref: ARXIV-2509.23571, title: "Benchmarking LLM-Assisted Blue Teaming via Standardized Threat Hunting (ICML 2026)", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2509.23571", date: "2025-09-28", access: full, locator: "abstract (v3 revised 2026-05-28)"}
    - {ref: USENIX-LOGINJECT-2026, title: "Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation", publisher: USENIX Security Symposium 2026, type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/technical-sessions", date: "2026-08", access: full, locator: "abstract on the technical sessions listing"}
    - {ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: arXiv, type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "abstract"}
    - {ref: RISKYBIZ-SOAPBOX109-2026, title: "Soap Box: Using threat hunting to drive detection (sponsored; show notes)", publisher: Risky Business Media, type: podcast, url: "https://risky.biz/SOAPBOX109/", date: "2026-07-08", access: full, locator: "show notes"}
    - {ref: RISKYBIZ-855-2026, title: "Risky Business #855 (show notes, sponsor interview with Corelight)", publisher: Risky Business Media, type: podcast, url: "https://risky.biz/RB855/", date: "2026-10-14", access: full, locator: "sponsor segment in show notes"}
  last_reviewed: "2026-10-17"
  notes: >-
    From discourse-11, with governance-09 (negative independent evidence on autonomous hunting) and governance-15
    (hardening against attacker-influenced content) folded in as guardrails. Grade A on the cost table and the
    before-and-after finding counts, which are the company's own tracked data; the noise shares (about 40%; about one
    third of confirmed findings dismissible with 30 seconds of context) are the team's estimates and are labelled so.
    Single company, own definitions, self-reported. The hunts are log-based and not all are intelligence-driven. The
    post is undated; Detection Engineering Weekly featured it on 2026-08-19. The adversarial dismissal phase is also
    security-operations-07 (evidence-gated dismissal). Hardening against injected content: see security-ai-security-13
    and security-incident-response-09.

- id: security-threat-intelligence-22
  title: Always-on investigation agent that finds missed malicious activity and writes explainable detections using threat intelligence
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [expert-judgment, research-synthesis]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Defenders must keep translating new attacker tradecraft into detection logic, which leaves them reactive, and attack
    stories with gaps go unflagged (ARXIV-2605.20896).
  solution: >-
    Microsoft's Dynamic Threat Detection Agent runs continuously across Defender, builds a unified timeline of alerts,
    events, behaviour analytics and threat intelligence, runs a planner-executor loop that generates attack-specific
    hypotheses and gathers supporting and refuting evidence, and issues an alert with severity, MITRE mappings,
    remediation guidance, implicated entities and a plain-language description (ARXIV-2605.20896;
    MSFT-DEFENDER-AGENTS-2026).
  outcomes:
    - {lever: quality, description: "Customers rated the agent's alerts correct about four times in five over a 120-day online evaluation", figure: "80.1% precision", measures: "Precision from customer feedback on the agent's alerts over 120 days across Defender customers; alert count and feedback rate not in the abstract", provenance: vendor-published, source_ref: ARXIV-2605.20896}
    - {lever: growth, description: "The agent produced novel alerts for a share of investigated incidents", figure: "approximately 15% of investigated incidents", measures: "Share of investigated incidents with novel agent alerts, as stated in the abstract; base population not given", provenance: vendor-published, source_ref: ARXIV-2605.20896}
    - {lever: cost, description: "Cost and reliability of single-incident investigations", figure: "median 28 minutes; median token cost USD 2.04; 0.38% job failure rate", measures: "Median end-to-end time and token cost per investigation, and share of failed jobs, as reported in the abstract", provenance: vendor-published, source_ref: ARXIV-2605.20896}
  prerequisites:
    - "A unified activity timeline spanning alerts, events, user and entity behaviour analytics and threat intelligence (ARXIV-2605.20896)"
    - "Versioned prompt contracts with schema validation, grounding requirements, bounded retries and fail-closed suppression (ARXIV-2605.20896)"
  risks_and_guardrails:
    - "Fail-closed suppression and bounded retries limit bad outputs reaching customers (ARXIV-2605.20896)"
    - "At 80.1% precision about one alert in five was not rated correct, so triage of the agent's own alerts remains work (ARXIV-2605.20896)"
  human_checkpoints:
    - "Customer feedback on each alert is the evaluation signal; whether a person reviews before an alert is raised is not stated (ARXIV-2605.20896)"
  role_evolution: >-
    Microsoft describes the agent as uncovering false negatives and filling gaps for analysts, not replacing them
    (MSFT-DEFENDER-AGENTS-2026).
  evidence_grade: A
  sources:
    - {ref: ARXIV-2605.20896, title: "GenAI-Driven Threat Detection with Microsoft Security Copilot", publisher: "arXiv (Microsoft authors)", type: academic, url: "https://arxiv.org/abs/2605.20896", date: "2026-05-20", access: full, locator: "abstract"}
    - {ref: MSFT-DEFENDER-AGENTS-2026, title: "Deploy AI agents in Microsoft Defender", publisher: Microsoft, type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender", date: "2026-05-12", access: full, locator: "Dynamic Threat Detection Agent section (page ms.date 2026-05-12; updated August 2026)"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-13. Grade A: Microsoft reports precision from tracked customer feedback over 120 days. The authors
    are Microsoft staff writing about Microsoft's product, so figures are vendor-published; customers are not named,
    and only the abstract was read. The paper says the agent runs across tens of thousands of Defender customers. An
    offline evaluation reports F1 0.78 with GPT-5.4 for recovering hidden malicious activity (+0.12 over GPT-4.1, +0.26
    over baseline). security-operations points to this entry rather than repeating the agent (see security-operations-14).

- id: security-threat-intelligence-23
  title: Machine-learning anomaly surfacing that focuses government threat hunters on critical-infrastructure network data
  archetype: security
  module: threat-intelligence
  function: technology-it
  work_types: [data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Hunt and SOC analysts handle terabytes of daily network log data and need a way to narrow what they review
    (DHS-AIINV-CISA-2026, DHS-106).
  solution: >-
    CISA's CyberSentry program uses unsupervised machine learning with rule-based heuristics to fuse and correlate data
    and highlight anomalies in participating critical-infrastructure networks for analyst review, with a query interface
    and dashboards (DHS-AIINV-CISA-2026, DHS-106, deployed). A similar federal-network use case based on Einstein sensor
    data (DHS-2403) is listed as retired.
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "The inventory gives no detection or workload figures", provenance: self-reported, source_ref: DHS-AIINV-CISA-2026}
  prerequisites:
    - "Partner opt-in to CyberSentry monitoring (DHS-AIINV-CISA-2026, DHS-106)"
  risks_and_guardrails:
    - "The inventory gives no reasons for retiring DHS-2403, so lessons are not public (DHS-AIINV-CISA-2026, Inactive section)"
  human_checkpoints:
    - "Anomalies are highlighted for CISA analyst review (DHS-AIINV-CISA-2026, DHS-106)"
  role_evolution: >-
    Analysts narrow the scope of analysis and prioritize data for review (DHS-AIINV-CISA-2026, DHS-2403 summary).
  evidence_grade: B
  sources:
    - {ref: DHS-AIINV-CISA-2026, title: "Cybersecurity and Infrastructure Security Agency - AI Use Cases (DHS AI Use Case Inventory)", publisher: US Department of Homeland Security, type: regulator, url: "https://www.dhs.gov/ai/use-case-inventory/cisa", date: "2026-01-28", access: full, locator: "Deployment: DHS-106; Inactive: DHS-2403"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-23. Classical or predictive machine learning, not generative AI; included because it shows named,
    deployed AI in government threat hunting. The mirror text of the DHS page renders 'AI' as 'SI'.

- id: security-threat-intelligence-24
  title: Model providers' threat intelligence teams using their own models to investigate and disrupt misuse
  archetype: security
  module: threat-intelligence
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: research-brief
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Model providers must detect and disrupt misuse of their own products and track threats to themselves over very
    large volumes of conversation and telemetry data (OPENAI-JOBII-2025; ANTHROPIC-GTG1002-2025).
  solution: >-
    Anthropic states its Threat Intelligence team used Claude extensively to analyse the large amounts of data generated
    during its investigation of a campaign it reported in November 2025, alongside banning accounts, notifying affected
    entities and coordinating with authorities (ANTHROPIC-GTG1002-2025); its September 2026 report says the team
    disrupted operations in which actors tried to use Claude for malicious activity (ANTHROPIC-TIR-2026). OpenAI's
    Intelligence and Investigations engineering team builds systems that use OpenAI's models for lead generation,
    triage, synthesis and analysis (OPENAI-JOBII-2025), and its Threat Intelligence team seeks investigators who build
    agentic workflows to scale investigative throughput (OPENAI-JOBTTI-2026). Anthropic also posts for investigators who
    detect and disrupt misuse of its models for cyber operations (ANTHROPIC-JOBTCTI-2026).
  outcomes:
    - {lever: capacity, description: "No measurement of time saved, accuracy or error rate is published; Anthropic describes the use qualitatively", figure: "none published", measures: "Not applicable", provenance: vendor-published, source_ref: ANTHROPIC-GTG1002-2025}
  prerequisites:
    - "Internal telemetry from the provider's own platform, plus OSINT and vendor data (OPENAI-JOBTTI-2026)"
  risks_and_guardrails:
    - "Not described in the postings or the report beyond the provider advising defenders to experiment with AI in SOC automation, detection, vulnerability assessment and incident response (ANTHROPIC-GTG1002-2025)"
  human_checkpoints:
    - "Investigators and analysts remain responsible for assessments; engineers build tools to accelerate them (OPENAI-JOBII-2025)"
  role_evolution: >-
    OpenAI pairs engineers with analysts and investigators on one team; Anthropic describes a small engineering role
    that may become a multi-person collections function (OPENAI-JOBII-2025; ANTHROPIC-JOBTIE-2026).
  evidence_grade: B
  sources:
    - {ref: ANTHROPIC-GTG1002-2025, title: "Disrupting an AI-orchestrated cyber espionage campaign", publisher: Anthropic, type: vendor, url: "https://www.anthropic.com/news/disrupting-AI-espionage", date: "2025-11-13", access: full, locator: "section on why continue to develop and release models"}
    - {ref: ANTHROPIC-TIR-2026, title: "Countering misuse of AI: September 2026", publisher: Anthropic, type: vendor, url: "https://www.anthropic.com/threat-intelligence-report-september-2026", date: "2026-09-10", access: full, locator: "introduction"}
    - {ref: OPENAI-JOBII-2025, title: "Full-Stack Software Engineer, Intelligence & Investigations (job posting)", publisher: OpenAI, type: job-posting, url: "https://jobs.ashbyhq.com/openai/52c72cb9-7c44-4cba-b440-e05262a38491", date: "2025-11-12", access: full, locator: "About the Team; About the Role"}
    - {ref: OPENAI-JOBTTI-2026, title: "Technical Threat Investigator, Threat Intel Engineering (job posting)", publisher: OpenAI, type: job-posting, url: "https://jobs.ashbyhq.com/openai/f01b7084-a68d-4e30-ace9-6b5e6d90c517", date: "2026-04-30", access: full, locator: "About the Role; responsibilities"}
    - {ref: ANTHROPIC-JOBTCTI-2026, title: "Technical Cyber Threat Investigator (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5066995008", date: "2026-01-13", access: full, locator: "About the Role"}
    - {ref: ANTHROPIC-JOBTIE-2026, title: "Threat Intelligence Engineer (job posting)", publisher: Anthropic, type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/5074937008", date: "2026-01-20", access: full, locator: "About the Role"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged practice-20 (C) and governance-18 (B). Grade B: a named organization's own statement of use without
    measurement. Change scope 'model' because provider-side misuse intelligence is a new CTI function, not a faster
    version of an existing one. Conflict note: Anthropic makes the model whose use it describes, and this file was
    compiled by an Anthropic model, so treat as vendor evidence. The adversary content of these reports is routed to
    ai-security; detecting model-extraction campaigns against hosted models is security-ai-security-15.
