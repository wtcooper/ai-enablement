- id: security-operations-23
  title: MDR providers move to agent-led, human-accountable services, and buyers test what the AI actually does
  archetype: security
  module: operations
  function: service-delivery
  work_types: [transaction-processing, client-interaction]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Alerts are investigated in tiers one after another, so attackers move while cases wait; providers cap what they
    will investigate; and buyers face a wave of products labelled 'AI MDR' (managed detection and response) while
    regulated buyers must show control over ICT suppliers whose agents act on their environments.
  solution: >-
    MDR providers describe teams of specialist agents (triage, investigation, response) with judge agents and a route to
    human experts when confidence is low. Arctic Wolf calls its model 'AI-led with humans in the loop'; Expel says its AI
    triages and enriches before an analyst touches an alert while analysts make consequential calls; eSentire and Sophos
    describe agentic AI under human accountability. Gartner's 2026 MDR Market Guide, as quoted by Expel, defines MDR as
    'AI-augmented, human-led'. On the buyer side, the NCSC's list of AI risks can serve as a supplier questionnaire, and
    EU financial supervisors say they engage critical ICT providers under DORA on frontier-AI cyber risk.
  outcomes:
    - {lever: speed, description: "Arctic Wolf says businesses can resolve cases 15x faster while keeping an average of one customer ticket per day", figure: "15x faster", measures: "baseline and sample not stated", provenance: vendor-published, source_ref: CIO-ARCTICWOLF-2026}
    - {lever: speed, description: "Mean time to remediate on fully automated high and critical incidents", figure: "14 minutes", measures: "Expel's MTTR; period, volume and definition of 'fully automated' not stated", provenance: self-reported, source_ref: EXPEL-GARTNERMDR-2026}
    - {lever: capacity, description: "Gartner forecast as quoted by Expel", figure: "90% of initial MDR findings handled by AI without human action by 2029, up from 30% today", measures: "Gartner Market Guide for MDR (2026-09-09), as quoted", provenance: vendor-published, source_ref: EXPEL-GARTNERMDR-2026}
  prerequisites:
    - "A body of historical cases and analyst validations to build agent context (Arctic Wolf says more than 1,000 analysts validated its data and workflows) (CIO-ARCTICWOLF-2026)"
    - "Provider-hosted stack, 24/7 staffing and preapproved remote response (Gartner mandatory features as quoted) (EXPEL-GARTNERMDR-2026)"
    - "For buyers: contract rights to evidence of AI validation, change control and incident reporting"
  risks_and_guardrails:
    - "Arctic Wolf routes low-confidence work to a human and a 'Swarm Judge' validates decisions; it says it deploys an agent only after it beats existing workflows in its own SOC (CIO-ARCTICWOLF-2026)"
    - "Gartner, as quoted, says buyers should demand clarity on which services are AI-augmented and which still rely on analysts, and requires triage of all discovered threats regardless of priority (EXPEL-GARTNERMDR-2026)"
    - "The NCSC lists eight risks for AI-enabled cyber defence, including customers and supply chain, and efficacy and verification (NCSC-AIADOPT-2026)"
    - "DORA has applied since 2025-01-17 to financial entities and ICT third-party providers (EIOPA-DORA-2025); the UK joint statement of 2026-05-15 adds no new rules (COOLEY-UKFIN-2026)"
  human_checkpoints:
    - "Human experts take over work outside an agent's validated experience (CIO-ARCTICWOLF-2026)"
    - "Gartner's quoted definition keeps MDR 'human-led' (EXPEL-GARTNERMDR-2026)"
    - "Buyer's third-party risk sign-off before onboarding or a change to an AI-enabled service"
  role_evolution: >-
    Tiered hand-offs are replaced by parallel agent work and analysts validate and supervise (CIO-ARCTICWOLF-2026);
    Expel says AI sits 'in the human loop' (EXPEL-GARTNERMDR-2026).
  evidence_grade: C
  sources:
    - {ref: CIO-ARCTICWOLF-2026, title: "Inside Arctic Wolf's new agentic security platform", publisher: "CIO.com", type: press, url: "https://www.cio.com/article/4211089/inside-arctic-wolfs-new-agentic-security-platform.html", date: "2026-08-26", access: full, locator: "Paragraphs on Swarm of Experts, validation framework and '15x faster'"}
    - {ref: EXPEL-GARTNERMDR-2026, title: "AI-augmented, still human-led: What changed in the 2026 Gartner Market Guide for Managed Detection and Response", publisher: "Expel", type: vendor, url: "https://expel.com/blog/what-changed-in-the-2026-gartner-market-guide-for-managed-detection-and-response/", date: "2026-09-21", access: full, locator: "TL;DR; 'Gartner insights on AI MDR'; 'The 2029 number'"}
    - {ref: ESENTIRE-2026, title: "Managed Detection and Response Services & Security Operations Platform", publisher: "eSentire", type: vendor, url: "https://www.esentire.com/", date: "2026-05-07", access: full, locator: "'Controlled Autonomy SecOps' paragraph (page modified date)"}
    - {ref: SOPHOS-MDR-2026, title: "Sophos MDR | 24/7 Managed Detection & Response | Agentic SOC", publisher: "Sophos", type: vendor, url: "https://www.sophos.com/en-us/products/managed-detection-and-response", date: "2026-10-17", access: full, locator: "Product page (undated; retrieval date)"}
    - {ref: NCSC-AIADOPT-2026, title: "Supporting AI adoption for UK cyber defence", publisher: "UK National Cyber Security Centre", type: regulator, url: "https://www.ncsc.gov.uk/blogs/supporting-ai-adoption-for-uk-cyber-defence", date: "2026-04-23", access: full, locator: "List of eight risks"}
    - {ref: AOSHEARMAN-ESRB-2026, title: "ESRB issues warning on systemic cyber risks from frontier AI models", publisher: "A&O Shearman", type: press, url: "https://finreg.aoshearman.com/esrb-issues-warning-on-systemic-cyber-risks-from-frontier-ai-models", date: "2026-07-07", access: full, locator: "ESAs oversight under DORA; engagement with critical ICT providers"}
    - {ref: COOLEY-UKFIN-2026, title: "Busy Week for AI: FCA Reopens AI Input Zone, Regulators Issue Statement on Frontier AI Cyber Risks", publisher: "Cooley LLP", type: press, url: "https://finsights.cooley.com/busy-week-for-ai-fca-reopens-ai-input-zone-regulators-issue-statement-on-frontier-ai-cyber-risks/", date: "2026-05-26", access: full, locator: "Five domains; no new requirements"}
    - {ref: EIOPA-DORA-2025, title: "Digital Operational Resilience Act (DORA)", publisher: "EIOPA", type: regulator, url: "https://www.eiopa.europa.eu/digital-operational-resilience-act-dora_en", date: "2025-01-17", access: full, locator: "Application date and scope"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-10, discourse-16 and governance-19 (supplier assurance, an idea: no source reports a customer
    applying it to an MDR provider). All performance claims come from the providers; the CIO.com article reads like
    vendor-supplied material. Arctic Wolf's launch date (2026-03-23) was seen only in search results. The Gartner
    documents were not opened.

- id: security-operations-24
  title: SOC staffed to build and supervise automation - detection and response engineers use coding agents to build workflows and agents
  archetype: security
  module: operations
  function: technology-it
  work_types: [software-systems, coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Detection and response work needs custom automation, queries and pipelines while teams are small. Roles organised
    around manual triage are the smallest, lowest-paid and least automated family in SOC hiring, and entry-level seats
    are scarce.
  solution: >-
    Job postings ask detection and response engineers to use AI coding tools as a normal part of work, and some ask for
    experience building agentic SOC workflows: Expel (Claude Code via MCP as 'a first-class part of how you work'),
    Databricks incident response, Robinhood (agentic workflows for SecOps; an AI-native detection platform), Cloudflare's
    managed defense center (preferred), Figma and Anthropic. Postings coded by D3 Security show teams hiring about three
    builders (SecOps, detection and automation engineers) per queue-watching analyst.
  outcomes:
    - {lever: capacity, description: "Hiring mix in a sample of US SOC postings", figure: "247 build-family vs 68 SOC analyst postings; entry-level 39 (5.9%); 22.7% with an active AI or automation requirement; 67% with no AI language", measures: "665 in-scope US security operations postings coded from more than 1,000 read in full (August 2026); shares of the 665", provenance: vendor-published, source_ref: D3-SOCHIRING-2026}
    - {lever: capacity, description: "none published", figure: "none published", measures: "job postings describe requirements, not outcomes", provenance: self-reported, source_ref: EXPEL-JOB-DR-2026}
  prerequisites:
    - "Engineers with scripting skills and API access to SIEM, SOAR and case systems"
    - "Detections-as-code skills (46% of plain SOC analyst postings mention it, per D3) (D3-SOCHIRING-2026)"
  risks_and_guardrails:
    - "D3 warns that teams cutting the junior seat will have no one ready for senior seats in three years (D3-SOCHIRING-2026)"
    - "Forrester heard vendors still hire early-career staff but fewer, and worry about a 'five-year problem' with mid and senior staff adoption (FORRESTER-RSAC-2026)"
  human_checkpoints:
    - "The analyst tier validates AI output; a vendor of autonomous investigation employs tiered human analysts to check it (D3-SOCHIRING-2026)"
  role_evolution: >-
    Detection and response roles are becoming engineering roles; Robinhood advertises a Senior Staff 'Security Operations
    AI Tech Lead' to own an AI roadmap and 'build a synthetic workforce' (ROBINHOOD-JOB-SECOPSAI-2026). ISC2 says roles
    such as SOC analyst and incident responder are 'evolving', with AI the top skills need at 41% (ISC2-WORKFORCE-2025).
  evidence_grade: B
  sources:
    - {ref: EXPEL-JOB-DR-2026, title: "Senior Detection & Response Engineer", publisher: "Expel (Greenhouse job board)", type: job-posting, url: "https://expel.com/about/career-listing/8836996002", date: "2026-09-26", access: full, locator: "Requirements list"}
    - {ref: DATABRICKS-JOB-IR-2026, title: "Staff Security Engineer, Incident Response", publisher: "Databricks (Greenhouse job board)", type: job-posting, url: "https://databricks.com/company/careers/open-positions/job?gh_jid=8841960002", date: "2026-10-08", access: full, locator: "Role description and requirements"}
    - {ref: ROBINHOOD-JOB-DR-2026, title: "Senior Security Engineer, Detection & Response", publisher: "Robinhood (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/robinhood/jobs/8202863", date: "2026-09-21", access: full, locator: "AI Experience section"}
    - {ref: ROBINHOOD-JOB-SECOPSAI-2026, title: "Senior Staff Security Engineer, Security Operations", publisher: "Robinhood (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/robinhood/jobs/8259431", date: "2026-10-06", access: full, locator: "Responsibilities (Security Operations AI Tech Lead)"}
    - {ref: CLOUDFLARE-JOB-CMDC-2026, title: "Response Engineer - Cloudflare Managed Defense Center (CMDC)", publisher: "Cloudflare (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/cloudflare/jobs/8222732", date: "2026-09-24", access: full, locator: "Preferred qualifications"}
    - {ref: FIGMA-JOB-SECOPS-2026, title: "Manager, Security Operations", publisher: "Figma (Greenhouse job board)", type: job-posting, url: "https://boards.greenhouse.io/figma/jobs/6015609004", date: "2026-06-05", access: full, locator: "Qualifications"}
    - {ref: ANTHROPIC-JOB-DRPLATFORM-2026, title: "Security Software Engineer, Detection & Response Platform", publisher: "Anthropic (Greenhouse job board)", type: job-posting, url: "https://job-boards.greenhouse.io/anthropic/jobs/4595463008", date: "2025-03-24", access: full, locator: "Role summary (updated 2026-08-24)"}
    - {ref: D3-SOCHIRING-2026, title: "SOC Hiring in 2026: Three Builders for Every Analyst", publisher: "D3 Security", type: job-posting, url: "https://d3security.com/blog/soc-hiring-2026/", date: "2026-09-11", access: full, locator: "Findings 1-5"}
    - {ref: FORRESTER-RSAC-2026, title: "RSAC 2026: An AI Coming-Of-Age Story Without The Romance", publisher: "Forrester", type: firm, url: "https://www.forrester.com/blogs/rsac-2026-an-ai-coming-of-age-story-without-the-romance", date: "2026-03-31", access: full, locator: "'Staffing shortages have been eclipsed by a shortage of open positions'"}
    - {ref: ISC2-WORKFORCE-2025, title: "2025 ISC2 Cybersecurity Workforce Study", publisher: "ISC2", type: professional-body, url: "https://www.isc2.org/Insights/2025/12/2025-isc2-cybersecurity-workforce-study", date: "2025-12-04", access: full, locator: "Introduction; skills needs section"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-19 and discourse-20. Evidence is hiring intent and a vendor-assembled one-month sample (D3
    sells an AI SOC product), so B is the ceiling. Postings come from a convenience sample of tech-forward firms.
    Anthropic develops the model used in this research; its posting is one data point among six. Pattern 'other':
    a staffing and operating-model change.

- id: security-operations-25
  title: "Idea: defender agents that contain an active attack without a human in the loop"
  archetype: security
  module: operations
  function: technology-it
  work_types: [expert-judgment]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Practitioners say models that find vulnerabilities outpace detection and patching, and that attackers are bound by no
    usage policy.
  solution: >-
    Discussed publicly as an idea: guardrailed agents that stop an active attack without human intervention. A
    DARPA-derived programme planned to deploy red and blue team agents on digital twins of water systems to learn what
    blue agents need. No production deployment was found.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "none", provenance: self-reported, source_ref: DETENGWEEKLY-169-2026}
  prerequisites:
    - "Trust in agent behaviour, not just capability (DETENGWEEKLY-169-2026)"
  risks_and_guardrails:
    - "Podcast guests said models are better at attacking than defending beyond scanning for vulnerabilities and misconfigurations (REGISTER-BHDC-2026)"
    - "The NCSC wants research on proving that 'low risk' automated actions are low risk (NCSC-AGENTICDEF-2026)"
  human_checkpoints:
    - "Not defined; the idea is autonomous"
  role_evolution: "Not described in the sources."
  evidence_grade: D
  sources:
    - {ref: DETENGWEEKLY-169-2026, title: "DEW #169 - Realistic AI SOC evaluation scenarios, tricking EDRs with fake telemetry and Anthropic/OAI cyber eval guardrails", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-169-realistic-ai-soc-evaluation", date: "2026-09-03", access: full, locator: "Section on OpenAI call for collective cyber defence"}
    - {ref: REGISTER-BHDC-2026, title: "Black Hat and DEF CON are AI conferences now, too (Kettle podcast transcript)", publisher: "The Register", type: podcast, url: "https://www.theregister.com/security/2026/08/17/black-hat-and-def-con-are-ai-conferences-now-too/5288076", date: "2026-08-17", access: full, locator: "Water-utility programme; attack versus defence skill"}
    - {ref: NCSC-AGENTICDEF-2026, title: "One does not simply defend agentically", publisher: "UK National Cyber Security Centre", type: regulator, url: "https://www.ncsc.gov.uk/blogs/one-does-not-simply-defend-agentically", date: "2026-09-21", access: full, locator: "Closing section: problem book; Cyber Shield"}
  last_reviewed: "2026-10-17"
  notes: "Idea, not a deployment (discourse-22). Evidence is practitioner commentary and a regulator's research call."
