# Use cases: security / operations (SOC: detection engineering, alert triage, investigation, case management,
# response actions, MDR). Synthesised 2026-10-17 from the wave-4 landscape scan and the practice, discourse and
# governance deep dives, plus items other security modules routed to operations. Sources were opened by the
# researchers (access: full) unless marked search-only; most papers were read at abstract level.
# Canonical refs: ELASTIC-ACCURACY-2026 is the same post the inputs also call ELASTIC-TRIAGE-2026 and
# ELASTIC-AGENTICSOC-2026; EXPEL-PRECEDENT-2026 is the precedent-engine post (EXPEL-RUXIE-2026 in the discourse file;
# here EXPEL-RUXIE-2026 is Expel's AI product page); CSA-SOCBENCH-2025 = CSA-BENCH-2025; CSA-SOCBENCH-PR-2025 =
# CSA-DROPZONE-2025; ARXIV-2604.12040 = AWS-SIRBENCH-2026; HUGGINGFACE-INCIDENT-2026 = HF-DISCLOSURE-2026;
# GOOGLE-TIN-2026 = GOOGLE-SECOPS-TIN-2026.
# Almost every outcome figure is self-reported or vendor-published. Grades follow the 2026-10-17 grade A rule: figures
# that customers state in a vendor-written case study are grade B.

- id: security-operations-01
  title: "Context-grounded agentic triage pipeline: deterministic checks first, narrow agents, and the case built before an analyst opens it"
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing, research-synthesis]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Manual investigation of each alert took about half an hour and hiring more analysts did not scale with alert
    volume. Elastic's first AI case summaries were wrong about 40% of the time, and analysts stopped reading them
    because checking a wrong paragraph took longer than triaging by hand.
  solution: >-
    In Elastic's own SOC ('Customer Zero') a detection rule triggers a workflow. Deterministic ES|QL queries close
    obvious false positives at no token cost. A narrow Initial Triage agent returns a structured verdict, and a
    high-confidence false positive is closed. Everything else becomes a case: specialised agents (endpoint, cloud,
    SaaS) investigate and a Final Review agent writes the verdict to the case. A Pattern Finder agent with no tools
    compares the alert with 30 days of closed cases on the same rule plus HR context (Workday); an L1 agent follows the
    rule's investigation guide, written by detection engineers with separate notes for analysts and for the AI.
    Analysts click 'Close Case: AI Correct' or record that the AI was incorrect, and the mismatch feeds the next run.
    The same idea of shipping know-how with each rule appears as Figma's steering and procedural memory and a vendor
    (Vega) proposal for a portable skill package per detection.
  outcomes:
    - {lever: quality, description: "AI verdict correctness rose after the team changed the context given to the agents; Elastic says it did not change models", figure: "60% to 92%", measures: "AI verdict compared with the analyst's close reason on cases, tracked on a dashboard; period and alert volume not stated", provenance: self-reported, source_ref: ELASTIC-ACCURACY-2026}
    - {lever: speed, description: "A manual investigation of about 30 minutes now finishes in under 3 minutes", figure: "30 minutes to under 3 minutes", measures: "Elastic's stated manual investigation time versus pipeline time; sample size not stated", provenance: self-reported, source_ref: ELASTIC-AGENTICSOC1-2026}
    - {lever: cost, description: "Cost to investigate a Windows endpoint alert with specialised workflow agents versus one agent with 14 skills", figure: "USD 0.69 vs USD 3.42 per alert", measures: "inference cost per investigation, from a parallel test across 36,822 Agent Builder conversations", provenance: self-reported, source_ref: ELASTIC-TOKENS-2026}
  prerequisites:
    - "Detection rules carry investigation guides written by detection engineers, and rules are tagged by triage category (ELASTIC-ACCURACY-2026)"
    - "Case management where analysts must pick a closure reason on every case, so AI verdicts can be scored"
    - "Context lookups: asset inventory, HR data (hire and leave dates, cost centre), 30 days of past cases per rule"
    - "Inference routed only to providers with zero data retention (Elastic's stated choice, ELASTIC-AGENTICSOC1-2026)"
    - "A detection-as-code pipeline and engineers willing to write guides for AI as well as for people"
  risks_and_guardrails:
    - "Before the context changes, accuracy hovered around 60% and analysts stopped reading the AI summaries (ELASTIC-ACCURACY-2026)"
    - "Plain queries replace agents wherever a check is predictable, to avoid hallucination, prompt injection and cost (ELASTIC-AGENTICSOC1-2026)"
    - "The Pattern Finder and Summarizer have no tools, which Elastic says stops injected content from overriding their behaviour (ELASTIC-ACCURACY-2026)"
    - "A third-party researcher reported on 2026-09-28 that a different Elastic product, its AI SOC assistant, could be steered by instructions in an alert into minting API keys, and said the vendor had not engaged after four follow-ups; the report does not concern this internal pipeline (PROMPTARMOR-ELASTIC-2026)"
    - "Steering memory can override agent behaviour if misused; Figma keeps precedent (retrieved) and policy (steering) separate (FIGMA-AGENTS-2026)"
  human_checkpoints:
    - "Only high-confidence false positives are closed without an analyst (ELASTIC-AGENTICSOC1-2026)"
    - "Analysts confirm or override in Slack or the case and must choose a closure reason; an optional 'AI Incorrect?' field feeds tuning (ELASTIC-ACCURACY-2026)"
    - "The Summarizer stops replacing its comment once a case is assigned to an analyst (ELASTIC-ACCURACY-2026)"
  role_evolution: >-
    Detection engineers write investigation guides that the AI follows as primary instructions; analysts review a
    prepared case and their closure reasons become corrective context for the agents (ELASTIC-ACCURACY-2026).
    Detection Engineering Weekly calls this steering-as-code, the next step after detection-as-code
    (DETENGWEEKLY-167-2026).
  evidence_grade: A
  sources:
    - {ref: ELASTIC-ACCURACY-2026, title: "Inside Elastic's agentic SOC: How we took AI alert triage from 60% to 92% accuracy", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/alert-triage-agentic-soc-self-correcting-agents", date: "2026-08-25", access: full, locator: "Opening summary; 'Leading with the data'; investigation guide lookup; feedback-loop section"}
    - {ref: ELASTIC-AGENTICSOC1-2026, title: "Alert triage in under 3 minutes with Elastic's agentic SOC", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/alert-triage-agentic-soc-elastic-workflows", date: "2026-07-02", access: full, locator: "Summary; Initial Triage agent section; case path"}
    - {ref: ELASTIC-TOKENS-2026, title: "Agentic SOC architecture: specialized agents cut costs 5.7x", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/agentic-soc-token-budget-architecture", date: "2026-07-24", access: full, locator: "Opening summary and cost table"}
    - {ref: PROMPTARMOR-ELASTIC-2026, title: "Elastic AI SOC Exfiltrates Credentials", publisher: "PromptArmor", type: vendor, url: "https://www.promptarmor.com/resources/elastic-agentic-soc-vulnerable-to-credential-theft", date: "2026-09-28", access: full, locator: "Context; Responsible Disclosure and Timeline"}
    - {ref: FIGMA-AGENTS-2026, title: "How we secure Figma's internal systems with agents", publisher: "Figma", type: firm, url: "https://www.figma.com/blog/how-we-secure-figmas-internal-systems-with-agents/", date: "2026-07-29", access: full, locator: "'Developing and segmenting agent memory'"}
    - {ref: DETENGWEEKLY-167-2026, title: "DEW #167 - More Security Agentic Breaches, Cheap and Scalable Threat Hunting & Detection Skills", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-167-more-security-agentic-breaches", date: "2026-08-19", access: full, locator: "'Detection Skills by Vega Threat Research'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-01, discourse-02 and discourse-21. Elastic is both the vendor and the deploying SOC, so all
    figures are self-reported. Correctness is agreement with the analyst's close reason, so it inherits analyst error.
    The 60% baseline is the earlier set-up without past-case context; the separate effect of investigation guides is
    not reported. The discourse file cites the same post at a /security-labs/blog/ URL.

- id: security-operations-02
  title: Precedent retrieval that shows the analyst how similar alerts were closed before
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Many alerts look almost identical to cases already investigated, but proving that meant digging through closed
    tickets, raw logs and colleagues' Slack comments to see whether something similar was seen last week and what was
    concluded.
  solution: >-
    Figma indexes each alert with the on-call engineer's Slack and Asana comments as investigation context, retrieves
    similar recent alerts when a new one fires, posts a summary in the alert thread, and downgrades severity when similar
    alerts were judged benign or duplicative with high confidence. Expel's 'precedent engine' embeds a new alert's
    features, matches it against previously triaged alerts and shows a suggested read, the nearest past cases with their
    dispositions, and counterfactuals; weak or unverified matches default to escalation.
  outcomes:
    - {lever: cost, description: "Fewer on-call pages from automatic severity downgrade of alerts that match benign precedent", figure: "20% drop in on-call pages", measures: "Figma: 'drop in on-call pages from this change alone' (downgrade when auto-resolution confidence is 7 or more); baseline period and denominator not stated", provenance: self-reported, source_ref: FIGMA-AGENTS-2026}
    - {lever: capacity, description: "Expel's initiative target and safety-gate design property; no measured result published", figure: "target 10% or greater queue reduction with under 1% change in recall; under 1% suppressed true-positive rate", measures: "stated target and design property, not results", provenance: self-reported, source_ref: EXPEL-PRECEDENT-2026}
  prerequisites:
    - "Closed alerts that carry analyst reasoning; Figma says a closed alert with no comments 'tells you almost nothing' (FIGMA-AGENTS-2026)"
    - "A way to capture analyst notes without changing their workflow (Slack thread comments indexed back to the alert)"
    - "Retrieval biased toward recent cases, and per-vendor calibrated similarity thresholds (FIGMA-AGENTS-2026, EXPEL-PRECEDENT-2026)"
  risks_and_guardrails:
    - "Unverified history and weak matches default to escalation (EXPEL-PRECEDENT-2026)"
    - "Expel warns analysts against 'trusting AI or accepting a historical disposition' (EXPEL-PRECEDENT-2026)"
  human_checkpoints:
    - "The analyst always makes the disposition in Expel's design (EXPEL-PRECEDENT-2026)"
    - "The on-call engineer reads the summary and closes the alert in the thread (FIGMA-AGENTS-2026)"
  role_evolution: >-
    Each useful comment an engineer leaves becomes signal for future similar alerts; Figma calls the existing workflow
    the 'training pipeline' (FIGMA-AGENTS-2026). Expel feeds the output into its rapid alert triage agent
    (EXPEL-PRECEDENT-2026).
  evidence_grade: A
  sources:
    - {ref: FIGMA-AGENTS-2026, title: "How we secure Figma's internal systems with agents", publisher: "Figma", type: firm, url: "https://www.figma.com/blog/how-we-secure-figmas-internal-systems-with-agents/", date: "2026-07-29", access: full, locator: "'The RAG layer'; 'What retrieval could do, and where it stopped'"}
    - {ref: EXPEL-PRECEDENT-2026, title: "New Ruxie AI power-up: Precedent engine turns repetitive alerts into faster decisions", publisher: "Expel", type: vendor, url: "https://expel.com/blog/new-ruxie-ai-power-up-precedent-engine/", date: "2026-09-10", access: full, locator: "'How it works'; 'Higher signal, less noise'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-02 and discourse-01. Grade A rests on Figma's self-reported single-change figure. Expel is
    both vendor and operator; its post describes planned rollout phases and publishes targets, not results.

- id: security-operations-03
  title: Triage agent inside the SIEM proposes a disposition, rationale and next steps for each finding; an analyst decides
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Analysts pivot manually across data to gather context for every queued finding before they can decide whether to
    close, escalate or investigate it.
  solution: >-
    Platform vendors now embed triage agents in the SIEM. Google's Triage and Investigation agent runs automatically
    (by default five minutes after the alert) or on demand, using searches, threat-intelligence enrichment,
    command-line analysis and process-tree reconstruction, then gives a true or false positive verdict with an
    explanation. At the Splunk .conf26 event SOC the Splunk Enterprise Security AI Triage Agent investigated findings as
    they reached the queue and proposed a disposition, rationale and next steps; a blended Tier 1-3 and
    detection-engineering team validated them. Microsoft extended its triage agent from phishing to cloud and identity
    alerts (preview). Cisco's CSIRT presented a similar Tier-1 framework, CoAnalyst, at FIRST 2026.
  outcomes:
    - {lever: speed, description: "Google says a typical 30-minute manual analysis falls to about 60 seconds", figure: "30 minutes to about 60 seconds; more than 5 million alerts investigated", measures: "Google's figures as reported by TechInformed from a Google Cloud post of 10 June 2026; no baseline method or false-positive rate given", provenance: vendor-published, source_ref: TECHINFORMED-GOOGLE-2026}
    - {lever: capacity, description: "Triage agent coverage and activity over the whole .conf26 conference; Cisco calls these event observations, not product benchmarks", figure: "94% triage analysis coverage; 1,503 AI agentic events; 7,605 SPL queries; 26,207 pieces of evidence; 11,250 threat-intelligence lookups", measures: "dashboard snapshot including set-up days; coverage numerator and denominator not defined", provenance: vendor-published, source_ref: CISCO-SPLUNK-CONF26-2026}
    - {lever: quality, description: "Suggested dispositions on the same dashboard; no comparison with analyst verdicts, so accuracy is unknown", figure: "True Positive 44%, Benign Positive 42%, No suggestion 7%, False Positive 6%, Undetermined 1%", measures: "share of findings by suggested disposition; denominator not stated", provenance: vendor-published, source_ref: CISCO-SPLUNK-CONF26-2026}
  prerequisites:
    - "Normalised, searchable telemetry in one analyst workspace; Splunk says the first requirement for an agentic SOC is 'not the agent' but the evidence (SPLUNK-BHUSA-2026)"
    - "Data in the vendor's SIEM (for Google, Google SecOps with one SOAR tenant) (GOOGLE-TIN-2026)"
    - "A tiered analyst team and detection engineers able to validate results and tune content"
  risks_and_guardrails:
    - "Google's agent runs at most 20 minutes per alert with no queue; alerts above the limit are not analysed automatically (GOOGLE-TIN-2026)"
    - "Trade press notes Google gave no false-positive rates, customer ranges or human-approval criteria for containment (TECHINFORMED-GOOGLE-2026)"
    - "An event SOC has short baselines and unmanaged devices, so results do not transfer directly to an enterprise SOC (CISCO-SPLUNK-CONF26-2026)"
    - "The RSAC 2026 SOC operators say they were 'not operating a fully agentic SOC'; AI is decision support, not an accountability replacement (SPLUNK-RSACSOC-2026)"
  human_checkpoints:
    - "Analysts decide whether a finding is closed, escalated, investigated further or acted on (CISCO-SPLUNK-CONF26-2026)"
    - "Response decisions affecting users, availability or trust stay with people (SPLUNK-RSACSOC-2026)"
    - "Google says analysts keep control of 'critical, high-impact actions' (TECHINFORMED-GOOGLE-2026)"
  role_evolution: >-
    Tier 1 analysts review agent-prepared findings instead of gathering context; Tier 2 and 3 take complex findings and
    hunting; detection engineers tune detections from analyst feedback (CISCO-SPLUNK-CONF26-2026).
  evidence_grade: B
  sources:
    - {ref: GOOGLE-TIN-2026, title: "Triage alerts with the Triage Agent", publisher: "Google Cloud documentation", type: vendor, url: "https://docs.cloud.google.com/chronicle/docs/secops/triage-agent", date: "2026-10-13", access: full, locator: "Overview; 'Trigger TIN'; auto-investigation settings"}
    - {ref: TECHINFORMED-GOOGLE-2026, title: "Google's SOC agent cuts alert review from 30 minutes to 60 seconds", publisher: "TechInformed", type: press, url: "https://techinformed.com/googles-soc-agent-cuts-alert-review-from-30-minutes-to-60-seconds/", date: "2026-06-16", access: full, locator: "Opening paragraphs; closing 'boundaries' paragraph"}
    - {ref: CISCO-SPLUNK-CONF26-2026, title: "Splunk .conf26: Tracking the Triage Agent in the Agentic SOC", publisher: "Cisco Blogs", type: vendor, url: "https://blogs.cisco.com/security/conf26-agentic-soc-triage-agent/", date: "2026-10-08", access: full, locator: "'A blended analyst team'; 'Building the Triage Agent Dashboard in an Afternoon'; Dashboard Snapshot table"}
    - {ref: SPLUNK-RSACSOC-2026, title: "From Live Event Telemetry to Action: Lessons from the 10th RSAC SOC", publisher: "Splunk", type: vendor, url: "https://www.splunk.com/en_us/blog/security/lessons-from-the-10th-rsac-soc.html", date: "2026-08-24", access: full, locator: "Opening section; closing list of patterns"}
    - {ref: SPLUNK-BHUSA-2026, title: "Black Hat USA 2026: Proving the Splunk ES Foundation for the Agentic SOC", publisher: "Splunk", type: vendor, url: "https://www.splunk.com/en_us/blog/security/black-hat-usa-2026-proving-the-splunk-es-foundation-for-the-agentic-soc.html", date: "2026-09-23", access: full, locator: "'From Detections to Findings to Agentic Triage'"}
    - {ref: MSFT-DEFENDER-AGENTS-2026, title: "Deploy AI agents in Microsoft Defender", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender", date: "2026-05-12", access: full, locator: "Security Alert Triage Agent section"}
    - {ref: FIRST-CON-2026, title: "38th Annual FIRST Conference program and session abstracts", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "Session 'CoAnalyst: An AI-Driven Framework for Enhanced SOC Triage' (Cisco), abstract only"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-07, practice-08, discourse-07 and governance-01 (the last three describe the same Cisco/Splunk
    event SOC). Grade B: named deployments, no accuracy or override rate published. The RSAC 2026 saving of more than
    nine analyst hours came from a deterministic SOAR playbook, not from AI, and is not used here. A BBVA testimonial
    for Google's agent was seen only in search results and is not used.

- id: security-operations-04
  title: Agent triages user-reported phishing emails and resolves the false alarms
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    User-reported suspicious emails arrive continuously; reviewing each one slows response and risks genuine threats
    being missed.
  solution: >-
    When a user reports an email, an LLM-based agent assesses it (file and URL detonation, screenshot analysis, threat
    intelligence, advanced hunting), classifies it as a real threat or a false positive and explains its verdict in
    plain language. False positives are resolved; true positives stay open for an analyst (Microsoft Security Copilot
    Phishing Triage Agent). Valvoline's CISO describes automated phishing triage on Torq's platform.
  outcomes:
    - {lever: capacity, description: "Valvoline's CISO says analysts reclaimed hours and containment actions became automatic after Torq's platform automated phishing triage", figure: "none published", measures: "quote in a funding press release; no numerator or denominator", provenance: vendor-published, source_ref: TORQ-SERIESD-2026}
  prerequisites:
    - "Security Copilot capacity, unified role-based access for Defender for Office 365, and user-reported-message settings and alert policy turned on (MSFT-PHISHTRIAGE-2026)"
    - "Alert-tuning rules that auto-resolve the same alert must be disabled or the agent never sees it (MSFT-PHISHTRIAGE-2026)"
  risks_and_guardrails:
    - "Analyst feedback can teach the agent, but it is accepted once per alert and the lesson should be previewed before saving (MSFT-PHISHTRIAGE-2026)"
    - "Microsoft says the agent has 'demonstrated measurable improvements' but publishes no figures (MSFT-PHISHTRIAGE-2026)"
  human_checkpoints:
    - "True-positive incidents remain open for an analyst (MSFT-PHISHTRIAGE-2026)"
    - "Analysts can reject or reclassify the verdict and see the reasoning (MSFT-PHISHTRIAGE-2026)"
  role_evolution: >-
    Analysts move from reading each reported email to working the confirmed threats and teaching the agent through
    plain-language feedback (MSFT-PHISHTRIAGE-2026).
  evidence_grade: B
  sources:
    - {ref: MSFT-PHISHTRIAGE-2026, title: "Microsoft Security Copilot Phishing Triage Agent in Microsoft Defender", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/phishing-triage-agent", date: "2026-07-02", access: full, locator: "Overview; prerequisites; feedback sections"}
    - {ref: MSFT-DEFENDER-AGENTS-2026, title: "Deploy AI agents in Microsoft Defender", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender", date: "2026-05-12", access: full, locator: "Security Alert Triage Agent section"}
    - {ref: TORQ-SERIESD-2026, title: "Torq Secures $140M Series D at $1.2B Valuation to Lead the AI SOC and Agentic AI Era", publisher: "Torq", type: vendor, url: "https://torq.io/news/torq-seriesD/", date: "2026-01-12", access: full, locator: "Valvoline CISO quote"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-03. Microsoft's pages name no customer; Valvoline is a Torq customer, not necessarily a user of
    Microsoft's agent. The two sources describe different products with the same pattern.

- id: security-operations-05
  title: An AI SOC analyst investigates every Tier-1 alert and closes the benign majority (MSSPs and lean in-house teams)
  archetype: security
  module: operations
  function: service-delivery
  work_types: [transaction-processing, research-synthesis]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Alert volume grew faster than analyst headcount and most alerts were benign. Human triage varied by shift and
    experience, and SOAR (scripted playbook automation) could enrich alerts but could not reason through
    investigations or safely auto-close (ECS). At Zapier a team 'you could count on one hand' faced 50-100+ daily
    investigations, mostly false positives, which consumed sprints meant for detections and hardening.
  solution: >-
    Alerts flow from detection platforms (through SOAR at ECS) into an AI SOC analyst that investigates each one on
    creation; outcomes are written back into the case system (ServiceNow at ECS, Panther at Zapier). At Zapier the
    agent works across Okta, AWS, Google Workspace and Panther, can interview users over Slack and takes business
    context such as travelling users through a context memory. Analysts work only what is not closed.
  outcomes:
    - {lever: capacity, description: "Share of Tier-1 alerts closed automatically at ECS", figure: "70%", measures: "'Tier 1 alerts automatically closed'; denominator and period not stated", provenance: vendor-published, source_ref: DROPZONE-ECS-2026}
    - {lever: capacity, description: "Alert handling scaled past the previous ceiling without adding headcount", figure: "about 30,000 alerts per month before the tool", measures: "alerts per month the SOC processed, as stated in the case study", provenance: vendor-published, source_ref: DROPZONE-ECS-2026}
    - {lever: speed, description: "Average time to triage an alert at Zapier", figure: "10-15 minutes to under 2 minutes (stated as 85% faster)", measures: "average investigation time as stated by Zapier's detection and response team; sample size not stated", provenance: vendor-published, source_ref: DROPZONE-ZAPIER-2026}
    - {lever: speed, description: "Managed SOC with an agentic investigation layer, unnamed client of about 2,000 alerts a month", figure: "MTTR 16 to 6 minutes (about 62.5% lower)", measures: "mean time to respond as stated in the provider's case study; client unnamed", provenance: vendor-published, source_ref: CYBERPROOF-CASE-2026}
  prerequisites:
    - "A structured proof of value on real production alerts, benchmarked against existing tools and human triage (DROPZONE-ECS-2026)"
    - "Integrations with SIEM, SOAR, identity, cloud and case management"
    - "Analysts add business context (for example travel) to the agent's context memory (DROPZONE-ZAPIER-2026)"
  risks_and_guardrails:
    - "ECS says it did not intend to replace analysts and needed standardised, auditable triage (DROPZONE-ECS-2026)"
    - "Zapier cites analysts' ability to see every query and piece of evidence as the basis for trust (DROPZONE-ZAPIER-2026)"
    - "No case study reports a false-negative or override rate"
  human_checkpoints:
    - "Analysts handle what is not auto-closed; outcomes land in the case system for audit (DROPZONE-ECS-2026)"
    - "A missing AI comment on an alert is treated as a signal to look (DROPZONE-ZAPIER-2026)"
    - "CyberProof describes a human check before escalation to the customer and QA sampling of closed cases (CYBERPROOF-CASE-2026)"
  role_evolution: >-
    Senior staff move to threat hunting, detection engineering and SOC improvement, and the ECS case study reports less
    burnout (DROPZONE-ECS-2026). Zapier engineers spend time on detections and maturity projects, and GRC staff
    self-serve audit evidence (DROPZONE-ZAPIER-2026).
  evidence_grade: B
  sources:
    - {ref: DROPZONE-ECS-2026, title: "How ECS Broke the SOC Scalability Ceiling with AI SOC Agents", publisher: "Dropzone AI", type: vendor, url: "https://www.dropzone.ai/case-studies/how-ecs-broke-the-soc-scalability-ceiling-with-ai-soc-agents", date: "2026-05-01", access: full, locator: "Challenges, solution and results sections (date is sitemap last-modified)"}
    - {ref: DROPZONE-ZAPIER-2026, title: "How Zapier Cut Manual Alert Investigation by 85% With Dropzone AI", publisher: "Dropzone AI", type: vendor, url: "https://www.dropzone.ai/case-studies/how-zapier-cut-manual-alert-investigation-by-85-with-dropzone-ai", date: "2026-01-28", access: full, locator: "Results section (date is sitemap last-modified)"}
    - {ref: DROPZONE-EUMSSP-2026, title: "How a Leading European MSSP Scaled Alert Investigations Without Scaling the SOC", publisher: "Dropzone AI", type: vendor, url: "https://www.dropzone.ai/case-studies/how-a-leading-european-mssp-scaled-alert-investigations-without-scaling-the-soc", date: "2026-05-27", access: full, locator: "Proof-of-concept and results paragraphs"}
    - {ref: CYBERPROOF-CASE-2026, title: "Case study: Improving SOC investigation consistency and reducing MTTR by 60%+ with agentic AI investigation", publisher: "CyberProof", type: vendor, url: "https://go.cyberproof.com/hubfs/Case_Studies/Case_study_Agentic_AI_Improving_SOC.pdf", date: "2026-05", access: full, locator: "Results (as summarised in the incident-response practice file)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-04 and practice-05, plus CyberProof (routed from incident-response practice). Graded B under
    the 2026-10-17 rule: the figures are customers' statements in vendor-written case studies with no stated method.
    An unnamed European MSSP (same vendor) reports proof-of-concept accuracy of 'approximately 90 to 95 percent' and
    better margins from serving more customers without proportional staffing; treat as a vendor claim. Prophet's
    Cabinetworks case study reports a queue 'from thousands to dozens' (vendor-authored, not used as an outcome).

- id: security-operations-06
  title: Calibrated classifiers and decision models score each alert; high-confidence benign alerts close automatically and the middle band goes to analysts
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Obvious noise and low-severity alerts consume analyst time, and prose-generating LLM triage is costly per alert,
    variable and hard to audit, so teams cherry-pick high-severity alerts. A label-only LLM verdict gives no rationale
    and limited recall at the confidence level needed to close alerts safely.
  solution: >-
    Practitioners argue automation should start where the cost of error is lowest: close only alerts judged benign at a
    stated confidence and keep recall as a hard constraint. CrowdStrike trains a triage classifier to reason before a
    true or false positive verdict (Windows endpoint detections only). New 'decision models' (TypeSafe Jev, OpenAI
    Decisions API public beta, a Cribl adapter) return a choice or score with a probability, so alerts above a high
    threshold can close, those below a low one escalate and the middle band go to analysts, with each verdict logged.
    Research designs keep recall at 1.0 while learning from analyst dispositions (REFINE) or route alerts to on-premises
    specialist models that emit SOAR-ready structured output (AIDR).
  outcomes:
    - {lever: capacity, description: "Reasoning before the verdict raised recall at the high-confidence operating point that governs auto-closure", figure: "false-positive recall 21.8% to 64.8%; true-positive recall 34.7% to 53.0%; overall accuracy 82.6% vs about 55-71% for general-purpose models", measures: "recall at 98% FP precision / 99% TP precision on a held-out set of real Windows endpoint detections, reasoning vs direct-label", provenance: vendor-published, source_ref: CROWDSTRIKE-REASONING-2026}
    - {lever: risk, description: "REFINE kept recall at 1.0 on evolution sets and on future windows in three of four scenarios", figure: "recall 1.0 in 3 of 4 future-window scenarios; degraded case 0.807 vs 0.49-0.58 for self-evolution baselines", measures: "attack alerts caught / attack alerts in four real industrial SOC scenarios (organisations not named), temporal train/test split", provenance: independent, source_ref: ARXIV-2609.32516}
    - {lever: speed, description: "Hybrid cloud-edge triage with compact reasoning versus chain-of-thought prompting", figure: "40.6% lower latency; 68% fewer tokens in compact datasets", measures: "authors' own alert datasets", provenance: independent, source_ref: ARXIV-2512.08169}
    - {lever: cost, description: "Vendor price and latency for one decision model, and the article's example annual cost", figure: "USD 42 per billion input tokens; 70-500 ms; about USD 100 a year for 450,000 alerts", measures: "the annual figure is the author's example calculation, not a measured deployment", provenance: vendor-published, source_ref: THN-DECISIONMODELS-2026}
    - {lever: capacity, description: "Adoption of automated incident response in the SANS 2026 AI Survey", figure: "39% adoption", measures: "as reported in a vendor summary; population not described", provenance: vendor-published, source_ref: SANS-AI-2026}
  prerequisites:
    - "A large labelled history of real detections and analyst verdicts to train and calibrate (CROWDSTRIKE-REASONING-2026)"
    - "A trained confidence calibrator; an untrained confidence judge collapsed high-confidence recall to zero in one study (ARXIV-2607.28460)"
    - "Rich per-alert evidence; title and severity alone leave a model calibrated about alerts, not hosts (THN-DECISIONMODELS-2026)"
    - "Runbooks, escalation criteria and organisation context fed to the model (SANS-AI-2026)"
  risks_and_guardrails:
    - "A well-formed answer can still be wrong: 'cannot hallucinate' only means the output matches the schema, and Cribl's model card admits overconfidence (THN-DECISIONMODELS-2026)"
    - "In the same article's data nearly 1% of real incidents traced to lowest-severity alerts (THN-DECISIONMODELS-2026)"
    - "Recall degraded to 0.807 in one REFINE scenario, so closures drift without monitoring (ARXIV-2609.32516)"
    - "63% of SANS AI Survey respondents report significant shortcomings in AI's ability to detect or respond (SANS-AI-2026)"
  human_checkpoints:
    - "Low-confidence and middle-band verdicts go to analysts; stricter thresholds are suggested for irreversible actions (THN-DECISIONMODELS-2026)"
    - "Alerts touching VIP or executive accounts stay with people (SANS-AI-2026)"
    - "Sampling review of auto-closed alerts and recall on rolling windows (see security-operations-22)"
  role_evolution: >-
    Swimlane's reading of the SANS survey is that analysts spend time on the phishing click that landed or early
    ransomware signs rather than sifting noise (SANS-AI-2026).
  evidence_grade: C
  sources:
    - {ref: CROWDSTRIKE-REASONING-2026, title: "Teaching AI to Reason Through Detection Triage", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/teaching-ai-to-reason-through-detection-triage/", date: "2026-08-17", access: full, locator: "Table 1 and following paragraph"}
    - {ref: THN-DECISIONMODELS-2026, title: "AI Decision Models and Their Impact on AI SOC Platforms (contributed by Intezer)", publisher: "The Hacker News", type: press, url: "https://thehackernews.com/2026/10/ai-decision-models-and-their-impact-on.html", date: "2026-10-16", access: full, locator: "'Why a SOC should be excited'; 'But a calibrated guess is still just a guess'"}
    - {ref: ARXIV-2609.32516, title: "REFINE: A Resilient Evolution Framework for Intelligent Enterprise Alert Triage in Security Operations Centers", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.32516", date: "2026-09-26", access: full, locator: "Abstract"}
    - {ref: ARXIV-2607.28460, title: "Cybersecurity Detection Classification with Reasoning-enabled Language Models", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.28460", date: "2026-07-30", access: full, locator: "Abstract: calibrator necessary"}
    - {ref: ARXIV-2512.08169, title: "Information-Dense Reasoning for Efficient and Auditable Security Alert Triage (AIDR)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2512.08169", date: "2025-12-08", access: full, locator: "Abstract"}
    - {ref: SANS-AI-2026, title: "A SOC Leader's Guide to the 2026 SANS AI Survey", publisher: "Swimlane", type: vendor, url: "https://swimlane.com/blog/sans-ai-2026-soc-trust/", date: "2026-05-18", access: full, locator: "TL;DR; 'Where Automation Actually Earns Trust'; 'Trust Requires Context'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-08, discourse-09, discourse-10, governance-05 and governance-15. Grade C: vendor research on
    its own data and academic results; no named SOC reports measured auto-closure through this design. The decision
    model category was weeks old at the time of writing. The Swimlane page shows a display date of 2026-08-17; its
    metadata carries 2026-05-18.

- id: security-operations-07
  title: Evidence-gated dismissal - an independent challenge must produce counter-evidence before an agent may dismiss a finding
  archetype: security
  module: operations
  function: technology-it
  work_types: [review-assurance, expert-judgment]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Triage agents tend to dismiss attack alerts when searches return nothing, and self-review in the same context does
    not correct errors.
  solution: >-
    Grow Therapy adds a final phase in which the model must argue against each finding and produce counter-evidence
    (for example an allowlisted service account, or a historical false-positive pattern above 80% with at least three
    prior occurrences) before it can be dismissed. Slack uses a separate Critic agent. The ALERT-BENCH authors' design
    (AIDA) requires an explicit proposed decision, an independent challenge in a separate context and a judge weighing
    both, with stronger evidence for dismissal and an append-only investigation ledger; CORTEX splits behaviour
    analysis, evidence gathering and reasoning across agents.
  outcomes:
    - {lever: quality, description: "Without the adversarial phase a large share of surfaced findings were noise", figure: "about 40% of findings were noise without the phase", measures: "Grow Therapy's approximate share; with the phase 'most of what surfaces is worth looking at' (no figure)", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: risk, description: "Benchmark: every studied approach missed attack alerts; the authors' challenge-and-judge design cut misses", figure: "false-negative rate at least 40.4% for every studied approach vs 3.1% for AIDA; F1 0.958 vs 0.371-0.744; 18.4% of alerts escalated", measures: "ALERT-BENCH: 1,247 alerts from one multi-stage attack scenario replayed through a live SIEM; method and benchmark built by the same authors", provenance: independent, source_ref: ARXIV-2610.10608}
  prerequisites:
    - "Tools the challenger can call: historical false-positive patterns, actor history, analyst resolution data (GROWTHERAPY-HUNT-2026)"
    - "Evidence-retrieval tools with logging so a challenger can re-check"
    - "Analyst capacity for the escalated share"
  risks_and_guardrails:
    - "Escalating 18.4% of alerts to analysts is the cost of the lower miss rate in the benchmark (ARXIV-2610.10608)"
    - "In the tested approaches dismissals received no consistently stronger investigation than escalations, and same-context self-review had negative net correction (ARXIV-2610.10608)"
    - "Slack's Critic is weakly adversarial to the experts to mitigate hallucination and variable reading of evidence (SLACK-AGENTS-2025)"
  human_checkpoints:
    - "Surviving findings go to analysts, who mark false positive or escalate in Slack (GROWTHERAPY-HUNT-2026)"
    - "The judge's reasoning and ledger are reviewable (ARXIV-2610.10608)"
  role_evolution: >-
    Analysts see fewer, better-qualified findings (GROWTHERAPY-HUNT-2026).
  evidence_grade: B
  sources:
    - {ref: GROWTHERAPY-HUNT-2026, title: "Threat hunt AI: How we built an AI security analyst on AWS for under $500/month", publisher: "Grow Therapy engineering", type: firm, url: "https://engineering.growtherapy.com/post/threat-hunt-ai-how-we-built-an-ai-security-analyst-on-aws-for-under-500-month", date: "2026-08", access: full, locator: "'Phase 5: Adversarial validation'; 'Handling noise'"}
    - {ref: SLACK-AGENTS-2025, title: "Streamlining Security Investigations with Agents", publisher: "Slack Engineering", type: firm, url: "https://slack.engineering/streamlining-security-investigations-with-agents/", date: "2025-12-01", access: full, locator: "'Critic Agent'"}
    - {ref: ARXIV-2610.10608, title: "From Investigation Failures to Reliable SOC Agents: Understanding and Improving LLM-Based Alert Triage", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2610.10608", date: "2026-10", access: full, locator: "Abstract"}
    - {ref: ARXIV-2510.00311, title: "CORTEX: Collaborative LLM Agents for High-Stakes Alert Triage", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2510.00311", date: "2025-09-30", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-06 and governance-04. The discourse file graded this A; it is B here because Grow Therapy's
    figures are approximations ('about') and the benchmark is a research prototype, not a deployment. Inputs date
    ARXIV-2610.10608 as 2026-10-06 or 2026-10-07, so the month is given.

- id: security-operations-08
  title: "A 'SOCless' model: AI investigates all alerts and on-call engineers are paged only for serious events"
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing, expert-judgment]
  pattern: intake-triage
  ladder: automate
  change_scope: model
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    A small, all-senior engineering team targeted by state-sponsored attackers was swamped by thousands of monthly
    alerts, mostly false positives, from detections built like observability.
  solution: >-
    All alert types (endpoint, identity, cloud, email, network) go to an AI SOC analyst; results are pushed back into
    the SIEM and on-call engineers are paged for serious events. There are no dedicated security analysts.
  outcomes:
    - {lever: capacity, description: "Alerts needing human review per month", figure: "thousands to fewer than 20 (stated as 99% reduction)", measures: "monthly alerts needing human review, as stated by the company in the vendor's case study", provenance: vendor-published, source_ref: DROPZONE-MYSTEN-2026}
    - {lever: speed, description: "Engineer time spent on one alert", figure: "30-60 minutes to roughly 1 minute", measures: "per-alert engineer time as stated; sample size not stated", provenance: vendor-published, source_ref: DROPZONE-MYSTEN-2026}
  prerequisites:
    - "Custom strategies that tell the system what is irrelevant and what matters (DROPZONE-MYSTEN-2026)"
    - "Engineers who know the systems and accept on-call paging"
  risks_and_guardrails:
    - "Very low risk tolerance is the stated reason for tuning strategies and escalating only what humans need to review (DROPZONE-MYSTEN-2026)"
    - "The case study reports no missed-threat check"
  human_checkpoints:
    - "On-call engineers are paged for serious events (DROPZONE-MYSTEN-2026)"
  role_evolution: >-
    Alerts route to IT and application engineers instead of a SOC tier; the head of security frames operations as
    site-reliability engineering (DROPZONE-MYSTEN-2026).
  evidence_grade: B
  sources:
    - {ref: DROPZONE-MYSTEN-2026, title: "How Mysten Labs Eliminated Toil and Scaled Security With Dropzone AI", publisher: "Dropzone AI", type: vendor, url: "https://www.dropzone.ai/case-studies/how-mysten-labs-eliminated-toil-and-scaled-security-with-dropzone-ai", date: "2026-01-28", access: full, locator: "Results section (date is sitemap last-modified)"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-06, which graded it A; graded B here under the 2026-10-17 rule (company statements in a vendor-written
    case study). A very small, all-senior team; likely not typical.

- id: security-operations-09
  title: An agent investigates the alert end to end across identity, endpoint, cloud and data-lake sources; on-call staff supervise and correct
  archetype: security
  module: operations
  function: technology-it
  work_types: [expert-judgment, research-synthesis]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Gathering context was the main burden for on-call engineers, and the SIEM raised more checks than a small team could
    work by hand (Figma). A single-prompt prototype at Slack was highly variable, sometimes jumping to a spurious
    conclusion without questioning its method.
  solution: >-
    Figma's triage agent is tagged into the Slack alert thread, calls scoped tools (Okta, endpoint control, Wiz, Panther,
    Slack), delegates data-lake questions to a sub-agent that writes SQL, and keeps case, steering and procedural memory.
    Slack's security team splits an investigation into separate model calls: a Director that poses questions and moves
    through phases, domain Experts (access, cloud, code, threat) and a Critic that scores findings and assembles the
    timeline. A research system (SherAgent) lets an LLM iteratively query and filter a provenance graph to find an
    incident's root cause.
  outcomes:
    - {lever: speed, description: "Reduction in alert time to resolution at Figma", figure: "71% (summary); 'around 70%' on complex alerts (body)", measures: "Figma: 'alert time-to-resolution' and 'time-to-resolution on complex alerts'; baseline and sample not stated", provenance: self-reported, source_ref: FIGMA-AGENTS-2026}
    - {lever: capacity, description: "Agent redirects staff asking about unapproved tools to approved alternatives", figure: "25% fewer endpoint software approval requests", measures: "Figma's stated reduction", provenance: self-reported, source_ref: FIGMA-AGENTS-2026}
    - {lever: quality, description: "SherAgent investigation success in the SOC of a major Internet company (not named)", figure: "end-to-end investigation success up 31.1% vs legacy enterprise baselines and 63.7% vs state-of-the-art; under USD 0.10 and under 4 minutes per investigation", measures: "relative improvement in success rate; per-investigation API cost and time, as stated in the abstract", provenance: independent, source_ref: ARXIV-2607.09176}
  prerequisites:
    - "A security data lake with audit logs; the sub-agent writes its own procedural memory for messy schemas (FIGMA-AGENTS-2026)"
    - "Configuration-as-code for the shared tool set so agents do not fragment into variants (FIGMA-AGENTS-2026)"
    - "Data sources exposed through a controlled tool interface and a dashboard to watch investigations live (SLACK-AGENTS-2025)"
  risks_and_guardrails:
    - "Deterministic safeguards on every tool call: pull requests are set to draft by a workflow step, not a prompt instruction, because the LLM was not reliable at remembering that (FIGMA-AGENTS-2026)"
    - "No ambient access to Slack channels, and channel-aware prompts so sensitive activity data does not surface in large rooms (FIGMA-AGENTS-2026)"
    - "Figma says autonomy is more comfortable when the action is bounded, reversible and supported by clear evidence (FIGMA-AGENTS-2026)"
    - "Structured outputs are 'subject to the usual problems of cheating and hallucination' (SLACK-AGENTS-2025)"
  human_checkpoints:
    - "The on-call engineer reviews what the agent found, confirms or corrects it, and handles cases needing judgment (FIGMA-AGENTS-2026)"
    - "Staff observe investigations in real time and read the reports (SLACK-AGENTS-2025)"
  role_evolution: >-
    Figma's on-call job shifted from investigating from scratch to reviewing and correcting agent output
    (FIGMA-AGENTS-2026); Slack says on-call staff are 'switching to supervising investigation teams'
    (SLACK-AGENTS-2025).
  evidence_grade: A
  sources:
    - {ref: FIGMA-AGENTS-2026, title: "How we secure Figma's internal systems with agents", publisher: "Figma", type: firm, url: "https://www.figma.com/blog/how-we-secure-figmas-internal-systems-with-agents/", date: "2026-07-29", access: full, locator: "Summary paragraph; 'Guardrails'; 'Where we are now and what's next'"}
    - {ref: SLACK-AGENTS-2025, title: "Streamlining Security Investigations with Agents", publisher: "Slack Engineering", type: firm, url: "https://slack.engineering/streamlining-security-investigations-with-agents/", date: "2025-12-01", access: full, locator: "'The Solution'; 'Investigation Loop'; Conclusion"}
    - {ref: ARXIV-2607.09176, title: "SherAgent: Scaling Attack Investigation in the Wild via LLM-Empowered Iterative Query-Filter Backtracking", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2607.09176", date: "2026-07-10", access: full, locator: "Abstract"}
    - {ref: DETENGWEEKLY-166-2026, title: "DEW #166 - Figma's Agentic SecOps, AI-EDRs and Anthropic Evals Breaking into Companies", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-166-figmas-agentic-secops-ai", date: "2026-08-05", access: full, locator: "Detection Engineering Gem"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-03, discourse-04 and governance-06. Figma's figures are single-team and self-reported; the
    headline and body figures differ. Slack describes itself as 'at an early phase'. The incident-response governance
    file reports that a SherAgent spot-check of 980 cases found a verified success rate above 96%, against an audited
    64.7% for the legacy tool. Figma's 20% drop in on-call pages is recorded in security-operations-02.

- id: security-operations-10
  title: Agent prepares the investigation and the analyst makes the call, measured in controlled studies
  archetype: security
  module: operations
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Manual investigations are slow, vary by analyst and degrade with fatigue, and vendors claim AI helps with little
    controlled evidence.
  solution: >-
    Analysts receive an agent's evidence gathering and draft conclusion and decide the verdict. A Cloud Security
    Alliance study with Dropzone AI randomly assigned 148 participants to investigate two escalated-alert scenarios (an
    AWS S3 bucket alert and a Microsoft Entra ID failed-login alert) with or without the platform; a university SOC
    compared a locally deployed agent with manual handling of real tickets.
  outcomes:
    - {lever: speed, description: "AI-assisted analysts completed investigations faster in both scenarios", figure: "45% and 61% faster (58 vs 105 minutes; 30 vs 78 minutes)", measures: "investigation time per scenario, 148 participants randomly assigned (July-August 2025); minutes from the vendor's description of the study", provenance: vendor-published, source_ref: CSA-SOCBENCH-PR-2025}
    - {lever: quality, description: "AI-assisted analysts scored higher against expert-modelled ideal responses", figure: "22% and 29% greater accuracy (68% to 97% and 63% to 85% per the vendor blog)", measures: "accuracy score per scenario; whether 22-29% are relative or percentage points is unclear", provenance: vendor-published, source_ref: CSA-SOCBENCH-PR-2025}
    - {lever: quality, description: "Manual analysts' written detail fell over the session while AI-assisted analysts kept theirs", figure: "manual report detail down 27%, conclusion detail down 20%", measures: "change in detail scores of manual participants", provenance: vendor-published, source_ref: CSA-SOCBENCH-PR-2025}
    - {lever: speed, description: "AI-assisted triage in a university SOC", figure: "about 40% less ticket completion time", measures: "8 real tickets, each handled once manually and once with the agent, by the researchers who built it", provenance: independent, source_ref: NDSS-WOSOC-2026}
  prerequisites:
    - "Integrated access to SIEM, enrichment and OSINT tools; in the university study the agent ran locally so data did not leave the network (NDSS-WOSOC-2026)"
    - "Expert-modelled ideal responses if you want to repeat this kind of test"
  risks_and_guardrails:
    - "Simulated scenarios, two escalated alert types, first-time tool users; not tier-1 volume or production false-negative rates (CSA-SOCBENCH-PR-2025)"
    - "Dropzone is a CSA corporate member; CSA says Dropzone had no influence on content, but both announced the result (CSA-SOCBENCH-PR-2025)"
    - "The university study used eight tickets and notes over-reliance on alert metadata in one failure case (NDSS-WOSOC-2026)"
  human_checkpoints:
    - "The analyst reviews the platform's investigation and remains author of the conclusion (CSA-SOCBENCH-PR-2025)"
    - "Agent output is reviewed by analysts, who can prompt it with more context (NDSS-WOSOC-2026)"
  role_evolution: >-
    In the CSA study 94% of participants said their view of AI in cybersecurity became more positive after hands-on use
    (CSA-SOCBENCH-2025).
  evidence_grade: B
  sources:
    - {ref: CSA-SOCBENCH-PR-2025, title: "New Study from Cloud Security Alliance Finds AI Improves Analyst Accuracy, Speed, and Consistency in Security Investigations", publisher: "Cloud Security Alliance", type: survey, url: "https://cloudsecurityalliance.org/press-releases/2025/10/07/new-csa-study-finds-ai-improves-analyst-accuracy-speed-and-consistency-in-security-investigations", date: "2025-10-07", access: full, locator: "Key findings; methodology paragraph"}
    - {ref: CSA-SOCBENCH-2025, title: "Beyond the Hype: A Benchmark Study of AI Agents in the SOC (report landing page)", publisher: "Cloud Security Alliance", type: survey, url: "https://cloudsecurityalliance.org/artifacts/a-benchmark-study-of-ai-agents-in-the-soc", date: "2025-10-06", access: full, locator: "Report summary"}
    - {ref: DROPZONE-CSA148-2026, title: "AI SOC Agents: What 148 Analysts Think (2026 CSA Study)", publisher: "Dropzone AI", type: vendor, url: "https://www.dropzone.ai/blog/soc-analysts-ai-perception-148-study", date: "2026-05-15", access: full, locator: "Study summary and results tables"}
    - {ref: NDSS-WOSOC-2026, title: "Experiences of Using Agentic AI to Fill Tooling Gaps in a Security Operations Center", publisher: "NDSS Symposium (WOSOC 2026)", type: academic, url: "https://www.ndss-symposium.org/wp-content/uploads/wosoc26-02.pdf", date: "2026-02-23", access: full, locator: "Abstract; Table I; limitations"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-16, discourse-23 and governance-02. The governance file graded this A; the other two capped it
    at B. Kept at B: the study is measured but simulated, vendor-supported and not a production deployment. The full CSA
    report was not opened; figures are from the CSA press release and the vendor's blog.

- id: security-operations-11
  title: Agent-written investigation narratives help new analysts work above their experience level
  archetype: security
  module: operations
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    New analysts spend their first months learning where tools live and how to assemble context.
  solution: >-
    Analysts start from an agent-prepared incident narrative, supporting evidence and recommended next steps; at one
    customer, junior analysts learned from the agent's visible investigation reasoning.
  outcomes:
    - {lever: capacity, description: "Cisco Live trained more than a dozen new analysts who operated at Tier 2 level with agentic support", figure: "more than a dozen new analysts", measures: "count at one event SOC; no performance measure", provenance: vendor-published, source_ref: SPLUNK-CISCOLIVE-2026}
    - {lever: speed, description: "Cabinetworks says ramp-up for junior analysts fell from months to weeks", figure: "months to weeks (no figures)", measures: "customer's statement; no numbers or sample", provenance: vendor-published, source_ref: PROPHET-CABINET-2026}
  prerequisites:
    - "Agent reasoning that is visible to the analyst"
  risks_and_guardrails:
    - "Neither source discusses risks; an explainability study found analysts accepted AI outputs even at lower accuracy when explanations seemed relevant and evidence-backed, a calibration risk for learners (ARXIV-2503.02065)"
  human_checkpoints:
    - "Analysts validate and decide (SPLUNK-CISCOLIVE-2026)"
  role_evolution: >-
    Ramp-up to Tier 2 work is shortened; Prophet's case study calls the agent's reasoning a 'master class in
    investigative thinking' (PROPHET-CABINET-2026).
  evidence_grade: B
  sources:
    - {ref: SPLUNK-CISCOLIVE-2026, title: "Machine Speed, Human Judgment: Inside the Cisco Live Agentic SOC", publisher: "Splunk", type: vendor, url: "https://www.splunk.com/en_us/blog/security/inside-the-cisco-live-agentic-soc.html", date: "2026-08-31", access: full, locator: "Paragraph beginning 'The SOC trained more than a dozen new analysts'"}
    - {ref: PROPHET-CABINET-2026, title: "Cabinetworks: Revolutionizing SOC efficiency with Prophet AI", publisher: "Prophet Security", type: vendor, url: "https://www.prophetsecurity.ai/case-studies/cabinetworks-revolutionizing-soc-efficiency-with-prophet-ai", date: "2026-04-30", access: full, locator: "Benefits section (date is sitemap last-modified)"}
    - {ref: ARXIV-2503.02065, title: "Too Much to Trust? Measuring the Security and Cognitive Impacts of Explainability in AI-Driven SOCs", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2503.02065", date: "2025-03-03", access: full, locator: "Abstract (survey of 248, 24 interviews)"}
  last_reviewed: "2026-10-17"
  notes: "From practice-09. Qualitative and vendor-authored."

- id: security-operations-12
  title: Agent-built, reproducible case file - an investigation notebook or schema-based timeline the analyst and agent share
  archetype: security
  module: operations
  function: technology-it
  work_types: [research-synthesis, document-production]
  pattern: end-to-end-case-agent
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Investigation means 20+ browser tabs across SIEM, threat intelligence and asset tools plus scratch notes, so context
    is lost and the chain of evidence is weak; AI-generated narratives must stand up to audit, regulatory or legal
    scrutiny.
  solution: >-
    The DNB Cyber Defense Center built marimo notebooks with SDKs that run native SPL and KQL and return typed tables;
    an agent writes and runs cells in the same live notebook, so the finished notebook is the case file, and domain
    skills for triage and hunting replace per-alert templates. Centene presented a six-layer pipeline on the Open
    Cybersecurity Schema Framework (OCSF, a common log schema) in which LLMs help with field inference, clustering and
    narrative while every transformation is versioned, hash verified and logged.
  outcomes:
    - {lever: quality, description: "Reproducibility and chain-of-evidence benefit stated qualitatively", figure: "none published", measures: "no figures in either source", provenance: self-reported, source_ref: CAUCHY-IRNB-2026}
  prerequisites:
    - "Query access to SIEM, XDR and warehouse platforms; security data exposed as dataframes (CAUCHY-IRNB-2026)"
    - "Logs normalised to OCSF, with confidence scoring, prompt traceability and workflow logging (FIRST-CON-2026)"
  risks_and_guardrails:
    - "Real cases are confidential, so DNB's published demo is a simplified scenario (CAUCHY-IRNB-2026)"
    - "Centene's abstract aligns the approach with evidentiary standards (it names Daubert, Frye and Durant); no external review is reported (FIRST-CON-2026)"
  human_checkpoints:
    - "The analyst works in the same notebook and owns conclusions (CAUCHY-IRNB-2026)"
    - "Human-in-the-loop controls so decision authority never leaves the analyst (FIRST-CON-2026)"
  role_evolution: >-
    Analyst and agent share one workspace (CAUCHY-IRNB-2026); analysts verify machine-built timelines against
    hash-verified source evidence (FIRST-CON-2026).
  evidence_grade: B
  sources:
    - {ref: CAUCHY-IRNB-2026, title: "Agentic incident response notebooks", publisher: "DNB Cyber Defense Center (Kyrre Wahl Kongsgard)", type: firm, url: "https://blog.cauchy.org/blog/incident-response-notebooks/", date: "2026-06-19", access: full, locator: "Opening; 'Why marimo fits'"}
    - {ref: DETENGWEEKLY-165-2026, title: "DEW #165 - Starved & Neglected Rules, Agentic IR Notebooks and Hacker Summer Camp", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-165-starved-and-neglected-rules", date: "2026-07-29", access: full, locator: "State of the Art, 'Agentic incident response notebooks'"}
    - {ref: FIRST-CON-2026, title: "38th Annual FIRST Conference program and session abstracts", publisher: "FIRST", type: conference, url: "https://www.first.org/conference/2026/program", date: "2026-06", access: full, locator: "Session 'From Logs to Living Timelines: AI-Assisted Incident Response in Hybrid Cloud Using OCSF' (Centene), abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-13 and governance-13. Overlaps the incident-response module; kept here for the investigation
    and case-management step. Centene's abstract describes a designed framework and does not say it is in production.

- id: security-operations-13
  title: Analyst copilot and chat assistants for queries, log analysis, threat explanation and incident summaries
  archetype: security
  module: operations
  function: technology-it
  work_types: [research-synthesis, document-production]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Analysts take time to gather and read incident information from many sources before they can resolve an incident,
    and most use AI individually without organisational structure or systematic validation.
  solution: >-
    A copilot built into the XDR portal aggregates incident information into readable form and answers natural-language
    queries (Microsoft Security Copilot). Swimlane's reading of the SANS AI survey is that adoption comes easiest in log
    analysis, explaining threats and report writing. Governance sources point to approved assistants grounded in the
    SOC's runbooks, with logging and a validation routine, in place of ad hoc personal use, and Hugging Face advises
    having a capable self-hostable model vetted before an incident.
  outcomes:
    - {lever: speed, description: "Copilot adoption was associated with lower mean time to resolution three months after adoption, compared with a control group", figure: "30.13% reduction", measures: "difference-in-differences on incident time to resolution, Defender XDR metadata from over 150 organisations across 180 days in 2024; association, not causal", provenance: vendor-published, source_ref: MSFT-BONO-2024}
    - {lever: capacity, description: "Use is widespread but not embedded", figure: "79% of SOCs use AI or ML tools; 36% have built them into a defined SOC workflow", measures: "SANS 2026 SOC Survey, 444 practitioners and 69 cyber leaders", provenance: independent, source_ref: SANS-SOC-2026}
  prerequisites:
    - "Copilot licensing and an XDR deployment (MSFT-BONO-2024)"
    - "An approved tool and a data-handling position on what alert and log data may leave the tenant"
    - "Runbooks and escalation criteria to ground the assistant (SANS-AI-2026)"
  risks_and_guardrails:
    - "The study authors say selection into treatment prevents causal identification (MSFT-BONO-2024)"
    - "SANS: most analysts use AI individually, without organisational structure or systematic validation (SANS-SOC-2026)"
    - "A BSides 2026 talk abstract reports safety filters blocked legitimate defender prompts hundreds of times while letting malicious ones through (BSIDESLV-2026)"
    - "Hosted-model safety filters blocked Hugging Face's forensic analysis of real attack commands; it ran an open-weight model on its own infrastructure, which also kept attacker data in its environment (HUGGINGFACE-INCIDENT-2026)"
    - "A law-firm summary of IBM's 2026 report says incidents involving employee shadow AI rose to 43% from 20%; it concerns staff generally, not SOC analysts (BAKERDONELSON-IBM-2026)"
  human_checkpoints:
    - "The analyst remains the decision-maker and the author of the work"
  role_evolution: >-
    Detection Engineering Weekly advises defenders to discuss open-weight models for investigation 'all the way up to
    your CSO' (DETENGWEEKLY-165-2026). Role change from assistants is not otherwise described.
  evidence_grade: A
  sources:
    - {ref: MSFT-BONO-2024, title: "Generative AI and Security Operations Center Productivity: Evidence from Live Operations", publisher: "arXiv (Microsoft authors)", type: academic, url: "https://arxiv.org/abs/2411.03116", date: "2024-11-05", access: full, locator: "Abstract; data and method section"}
    - {ref: SANS-SOC-2026, title: "SANS 2026 SOC Report: A Decade of Evolution in Cyber Defense", publisher: "SANS Institute", type: survey, url: "https://www.sans.org/research/security-operations-report", date: "2026", access: full, locator: "Top takeaways; FAQ (landing page; report body not opened)"}
    - {ref: SANS-AI-2026, title: "A SOC Leader's Guide to the 2026 SANS AI Survey", publisher: "Swimlane", type: vendor, url: "https://swimlane.com/blog/sans-ai-2026-soc-trust/", date: "2026-05-18", access: full, locator: "'The Gap Between Adoption and Maturity'; 'Trust Requires Context'"}
    - {ref: BSIDESLV-2026, title: "BSides Las Vegas 2026 talks: 'Agents Under Fire'", publisher: "BSides Las Vegas", type: conference, url: "https://bsideslv.org/talks", date: "2026-08", access: full, locator: "Talk abstract (Ground Truth track)"}
    - {ref: HUGGINGFACE-INCIDENT-2026, title: "Security incident disclosure - July 2026", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/security-incident-july-2026", date: "2026-07-16", access: full, locator: "Paragraphs on log analysis and 'The practical lesson for defenders'"}
    - {ref: BAKERDONELSON-IBM-2026, title: "Ten Takeaways from IBM's 2026 Cost of a Data Breach Report", publisher: "Baker Donelson", type: press, url: "https://www.bakerdonelson.com/ten-takeaways-from-ibms-2026-cost-of-a-data-breach-report", date: "2026", access: full, locator: "Takeaway 6"}
    - {ref: DETENGWEEKLY-165-2026, title: "DEW #165 - Starved & Neglected Rules, Agentic IR Notebooks and Hacker Summer Camp", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-165-starved-and-neglected-rules", date: "2026-07-29", access: full, locator: "'The Arguments Against Open Source AI are Very Bad'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-15, discourse-19, governance-17 (an idea, folded in as a guardrail) and discourse-15 (Hugging
    Face's self-hosted forensic model, also routed to incident-response). The Microsoft study uses 2024 data, is
    observational and vendor-authored, but is the largest live-operations measurement found for this module.

- id: security-operations-14
  title: Agent drafts the investigation report and case write-up for analyst sign-off
  archetype: security
  module: operations
  function: technology-it
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Analysts write structured reports for technical and non-technical readers after gathering evidence across tools,
    and report detail can decline with fatigue.
  solution: >-
    At Pan-American Life Insurance Group a Detection Analyzer Agent produces structured investigation reports with ATT&CK
    mapping (ATT&CK is MITRE's catalogue of attacker techniques): technical readouts for SOC and incident-response
    analysts and plain-language summaries for others. Elastic's Final Review agent writes the verdict to the case;
    Expel's Ruxie writes plain-language incident reports that people review and sign off. In 25 interviews, SOC
    practitioners valued report automation while rating incident analysis as not yet feasible for LLMs.
  outcomes:
    - {lever: speed, description: "Pan-American Life says reporting that once took hours now arrives automatically", figure: "none published", measures: "qualitative statement quoted by the vendor", provenance: vendor-published, source_ref: CROWDSTRIKE-AGENTWORKS-2026}
  prerequisites:
    - "Evidence already attached to the case; a report template or structure"
    - "Approved tool and data-handling policy for what may be connected"
  risks_and_guardrails:
    - "Elastic found its earlier long AI summaries inaccurate 40% of the time and analysts ignored them; report quality depends on verdict accuracy (ELASTIC-ACCURACY-2026)"
    - "Summarisation was the highest-risk task for log-borne prompt injection in one study (96% success without defences, 38% with constrained output), so drafts built from logs need the controls in the guardrails section (ARXIV-2605.24421)"
    - "Interviewed practitioners locate limits in SOC readiness and in human factors driving over-reliance (ARXIV-2608.00672)"
  human_checkpoints:
    - "People review and sign off before incident reports are final (EXPEL-RUXIE-2026)"
  role_evolution: >-
    Analysts review drafts instead of writing them; interview participants stress keeping a human in the loop
    (ARXIV-2608.00672).
  evidence_grade: B
  sources:
    - {ref: CROWDSTRIKE-AGENTWORKS-2026, title: "How AI-leading Security Teams Are Building the Agentic SOC", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/how-ai-leading-security-teams-are-building-the-agentic-soc/", date: "2026-07-06", access: full, locator: "Customer examples list, first bullet"}
    - {ref: EXPEL-RUXIE-2026, title: "Ruxie, Expel's AI for cybersecurity", publisher: "Expel", type: vendor, url: "https://expel.com/ai-automation/", date: "2026-10-14", access: full, locator: "Incident report paragraph (page modified date; first published 2025-07-31)"}
    - {ref: ELASTIC-ACCURACY-2026, title: "Inside Elastic's agentic SOC: How we took AI alert triage from 60% to 92% accuracy", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/alert-triage-agentic-soc-self-correcting-agents", date: "2026-08-25", access: full, locator: "'When your AI SOC analyst is wrong 40% of the time'"}
    - {ref: ARXIV-2608.00672, title: "From Chasing Ghosts to Missed Attacks: Perspectives and Perceptions of SOC Practitioners on LLM Integration, Risks, and Readiness", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2608.00672", date: "2026-08-01", access: full, locator: "Abstract (25 interviews)"}
    - {ref: ARXIV-2605.24421, title: "Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2605.24421", date: "2026-05-23", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-12 and governance-14. No named SOC reports measured time saved on reporting. The CSA study's
    drop in manual analysts' report detail is in security-operations-10.

- id: security-operations-15
  title: Scheduled AI hunts and always-on correlation that catch what detection rules miss, feeding the same alert queue
  archetype: security
  module: operations
  function: technology-it
  work_types: [research-synthesis, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Teams can write deterministic detections for major sources such as AWS and Okta but not for every SaaS audit log,
    and rules miss activity that no single alert flags, so false negatives go unseen.
  solution: >-
    Grow Therapy, a healthcare platform, runs daily agent hunts across about 15 log sources. Each hunt is a YAML
    objective with severity guidelines and known false positives; a five-phase flow (data gathering with a cheaper model,
    baseline comparison, context enrichment, confidence scoring, adversarial validation) writes findings into the same
    alerts table as the SQL detections, routed to Slack and Jira. Hugging Face says LLM-based triage in its
    anomaly-detection pipeline, and correlation of those signals, surfaced an intrusion. Microsoft documents an always-on
    Dynamic Threat Detection Agent that correlates alerts, events and threat intelligence and raises its own alerts.
  outcomes:
    - {lever: quality, description: "Staging the first CloudTrail hunt before it could alert cut its findings per run", figure: "15+ findings per run to 2-3", measures: "findings per run before and after signal-to-noise tuning in staging", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: cost, description: "Running cost of the whole hunting system", figure: "USD 320-510 per month", measures: "Grow Therapy cost table (model API, Snowflake compute, Fargate, Lambda/DynamoDB/NAT); existing Datadog spend counted as zero", provenance: self-reported, source_ref: GROWTHERAPY-HUNT-2026}
    - {lever: risk, description: "Hugging Face credits AI-assisted detection with surfacing the compromise", figure: "none published", measures: "no detection-rate figure", provenance: self-reported, source_ref: HUGGINGFACE-INCIDENT-2026}
  prerequisites:
    - "Logs already centralised in a warehouse and an observability tool (GROWTHERAPY-HUNT-2026)"
    - "A feedback loop where analysts mark false positives, built before deployment, and a staging mode for new hunts (GROWTHERAPY-HUNT-2026)"
  risks_and_guardrails:
    - "The one-shot first version produced vague findings; structuring the work as an analyst would fixed it (GROWTHERAPY-HUNT-2026)"
    - "Start with few tools: a large tool set can bloat context and lower signal-to-noise (GROWTHERAPY-HUNT-2026)"
    - "Detection that does not page anyone is not enough: after the event Hugging Face changed alerting so a high-severity signal pages a responder in minutes, any day (HUGGINGFACE-INCIDENT-2026)"
    - "Microsoft's documentation gives no accuracy or guardrail information (MSFT-DEFENDER-AGENTS-2026)"
  human_checkpoints:
    - "Analysts click false positive or escalate in Slack; Jira tracks state; 90 days of resolved alerts feed known false-positive patterns into later hunts (GROWTHERAPY-HUNT-2026)"
  role_evolution: >-
    Hunt definitions are drafted by the model from a one-paragraph description plus a conventions file, then reviewed by
    the security team (GROWTHERAPY-HUNT-2026).
  evidence_grade: A
  sources:
    - {ref: GROWTHERAPY-HUNT-2026, title: "Threat hunt AI: How we built an AI security analyst on AWS for under $500/month", publisher: "Grow Therapy engineering", type: firm, url: "https://engineering.growtherapy.com/post/threat-hunt-ai-how-we-built-an-ai-security-analyst-on-aws-for-under-500-month", date: "2026-08", access: full, locator: "Cost table; 'Handling noise: False positives & deduplication'; lessons list"}
    - {ref: HUGGINGFACE-INCIDENT-2026, title: "Security incident disclosure - July 2026", publisher: "Hugging Face", type: firm, url: "https://huggingface.co/blog/security-incident-july-2026", date: "2026-07-16", access: full, locator: "Paragraph beginning 'The attack was initially surfaced through AI-assisted detection'"}
    - {ref: MSFT-DEFENDER-AGENTS-2026, title: "Deploy AI agents in Microsoft Defender", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender", date: "2026-05-12", access: full, locator: "Dynamic Threat Detection Agent section"}
    - {ref: DETENGWEEKLY-167-2026, title: "DEW #167 - More Security Agentic Breaches, Cheap and Scalable Threat Hunting & Detection Skills", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-167-more-security-agentic-breaches", date: "2026-08-19", access: full, locator: "State of the Art, 'Threat hunt AI'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-05, discourse-14 and practice-20. Grow Therapy's page is undated; the newsletter featured it
    on 2026-08-19. Microsoft's agent is documentation only (announced). Generic threat-hunting assistants (Microsoft,
    CrowdStrike, Google, Dropzone) were routed to threat-intelligence by the practice file; hunting loops at Daylight
    Security and Con Edison (SANS DFIR Summit agenda titles, routed from incident-response) were not read beyond titles.

- id: security-operations-16
  title: AI drafts, translates and scores detection rules, with a separate judge model and human code review
  archetype: security
  module: operations
  function: technology-it
  work_types: [software-systems, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Turning each new high-severity CVE or threat report into a validated detection rule meant finding exploit code or
    report details, writing and tuning the rule against logs and waiting for peer review, so coverage had to be
    prioritised. Detection libraries must also move between query languages when platforms change, and crowdsourced
    rule repositories show uneven quality control.
  solution: >-
    Amazon's RuleForge ingests and scores public exploit code, runs parallel rule-generation agents, uses a separate
    judge model to score sensitivity and specificity, validates rules on synthetic and real traffic logs and sends the
    best candidate to human code review. Kroll's Detection Engineering Agent finds coverage gaps and translates SIEM
    logic from Splunk, Sentinel and Elastic into CrowdStrike's query language; Google previews a Detection Engineering
    agent that validates rules with synthetic events. Research benchmarks (CTI-REALM, SIGMERGE, AUTOSIGMA, Sublime
    Security's evaluation) score generated rules against human-written ones.
  outcomes:
    - {lever: speed, description: "Rules produced and validated faster than manually over the last four months of 2025, after confidence scoring was deployed in August 2025", figure: "336% faster", measures: "Amazon's productivity comparison with manual rule creation; the unit is not defined", provenance: self-reported, source_ref: AMAZON-RULEFORGE-2026}
    - {lever: quality, description: "The dedicated judge model reduced false positives while keeping the same true positives", figure: "67% fewer false positives", measures: "candidate rules with judge vs without, as stated by Amazon; test size not stated", provenance: self-reported, source_ref: AMAZON-RULEFORGE-2026}
    - {lever: quality, description: "Best overall reward among 16 frontier models on CTI-REALM", figure: "0.637 (second 0.624)", measures: "detection results and trajectory rewards on emulated attacks across Linux, cloud and AKS", provenance: independent, source_ref: ARXIV-2603.13517}
    - {lever: quality, description: "SIGMERGE rules accepted into the official Sigma repository", figure: "4 novel rules accepted", measures: "count of accepted contributions; evaluated on 23 metrics against 16 baselines and 13 LLMs", provenance: independent, source_ref: USENIX-SIGMERGE-2026}
  prerequisites:
    - "A corpus of exploit proofs of concept or machine-readable threat reports, real traffic logs for validation, and rules in a reviewable format (AMAZON-RULEFORGE-2026)"
    - "An existing detection library, a target query language and synthetic event testing"
  risks_and_guardrails:
    - "The generation model rated almost all its own rules as good, so Amazon separated generation from evaluation (AMAZON-RULEFORGE-2026)"
    - "Asking the judge for the probability that a rule fails improved calibration over asking if it succeeds (AMAZON-RULEFORGE-2026)"
    - "A study of the Sigma repository finds informal rule evaluation and divergences when rules migrate across SIEM vendors, so generated rules need the same review (USENIX-SIGMA-2026)"
  human_checkpoints:
    - "A security engineer reviews the best rule; human judgment is the final gate before production (AMAZON-RULEFORGE-2026)"
    - "Panelists at Expel's webinar keep detection engineering and remediation in the human column (EXPEL-3LEADERS-2026)"
  role_evolution: >-
    Analyst focus shifts from authoring rules to reviewing them (AMAZON-RULEFORGE-2026).
  evidence_grade: A
  sources:
    - {ref: AMAZON-RULEFORGE-2026, title: "How Amazon uses agentic AI for vulnerability detection at global scale", publisher: "Amazon Science", type: vendor, url: "https://www.amazon.science/blog/how-amazon-uses-agentic-ai-for-vulnerability-detection-at-global-scale", date: "2026-04-08", access: full, locator: "Key points; 'Multistage validation'; results paragraph"}
    - {ref: CROWDSTRIKE-AGENTWORKS-2026, title: "How AI-leading Security Teams Are Building the Agentic SOC", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/how-ai-leading-security-teams-are-building-the-agentic-soc/", date: "2026-07-06", access: full, locator: "Customer examples list, Kroll bullet"}
    - {ref: TECHINFORMED-GOOGLE-2026, title: "Google's SOC agent cuts alert review from 30 minutes to 60 seconds", publisher: "TechInformed", type: press, url: "https://techinformed.com/googles-soc-agent-cuts-alert-review-from-30-minutes-to-60-seconds/", date: "2026-06-16", access: full, locator: "Paragraph on the Detection Engineering agent (preview)"}
    - {ref: ARXIV-2603.13517, title: "CTI-REALM: Benchmark to Evaluate Agent Performance on Security Detection Rule Generation Capabilities", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2603.13517", date: "2026-03-13", access: full, locator: "Abstract"}
    - {ref: USENIX-SIGMERGE-2026, title: "From Texts to Rules: Generating Sigma Rules with Large Language Models from Cyber Threat Reports", publisher: "USENIX Security 2026", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/cai", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: USENIX-SIGMA-2026, title: "Credible Threat Detection? Measuring Contribution Dynamics and Quality Control in a Crowdsourced Threat Detection Ecosystem", publisher: "USENIX Security 2026", type: academic, url: "https://www.usenix.org/conference/usenixsecurity26/presentation/virkud", date: "2026-08", access: full, locator: "Abstract"}
    - {ref: EXPEL-3LEADERS-2026, title: "Why three security leaders still won't let AI make the call", publisher: "Expel", type: vendor, url: "https://expel.com/blog/why-three-security-leaders-still-wont-let-ai-make-the-call/", date: "2026-10-02", access: full, locator: "McIntyre quote on detection engineering and remediation"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-13, practice-14 and governance-12. RuleForge's scope is CVE-exploit rules in Amazon's own
    format for its honeypot and detection systems, not general SIEM content; it is adjacent to vulnerability-exposure.
    The Kroll example is stated without scale; Google's agent is in preview. AUTOSIGMA and Sublime Security's framework
    give no figures in their abstracts.

- id: security-operations-17
  title: Coding agents validate detections end to end - write the attack simulation, detonate it in a lab, query the SIEM and retry
  archetype: security
  module: operations
  function: technology-it
  work_types: [review-assurance, software-systems]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Rules pass code review but nobody checks that telemetry arrives and the detection fires, and driving labs by hand is
    slow. Detection Engineering Weekly names four ways rules 'run but can't see': disconnected, starved, missing fields
    and an ingest-lag blind window.
  solution: >-
    The DNB Cyber Defense Center repurposed coding agents with a plugin that writes TTPForge attack simulations, ships
    them to a lab host, detonates them, queries Splunk to confirm the detection matched and rewrites on failure. A
    person reviewed every generated simulation.
  outcomes:
    - {lever: quality, description: "Most generated simulations were fit for their detection, and the loop surfaced small mechanical pipeline issues that had passed code review", figure: "none published (numbers redacted)", measures: "DNB states numbers, volumes, detections and data sources were redacted or changed", provenance: self-reported, source_ref: CAUCHY-DETVAL-2026}
  prerequisites:
    - "A reproducible lab with golden images and deployment automation; baseline user activity modelled as well as malicious activity (CAUCHY-DETVAL-2026)"
    - "A detection-as-code pipeline"
  risks_and_guardrails:
    - "Detonating tooling in production can cause side effects; mirror the environment instead (DETENGWEEKLY-162-2026)"
    - "Synthetic telemetry can be forged: a researcher showed an EDR accepted fabricated local events, so end-to-end tests matter more than synthetic ingestion tests (DETENGWEEKLY-169-2026)"
  human_checkpoints:
    - "Every generated simulation reviewed by hand in DNB's run (CAUCHY-DETVAL-2026)"
  role_evolution: >-
    Detection engineers act more like site-reliability and software engineers (DETENGWEEKLY-162-2026).
  evidence_grade: B
  sources:
    - {ref: CAUCHY-DETVAL-2026, title: "End-to-end detection validation using coding agents", publisher: "DNB Cyber Defense Center (Kyrre Wahl Kongsgard)", type: firm, url: "https://blog.cauchy.org/blog/detection-validation/", date: "2026-06-16", access: full, locator: "Opening summary"}
    - {ref: DETENGWEEKLY-162-2026, title: "DEW #162 - Detonating TTPs with Agents, Writing Rules for Malicious Coding Agents & Skills Threat Models", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-162-detonating-ttps-with-agents", date: "2026-07-08", access: full, locator: "Detection Engineering Gem"}
    - {ref: DETENGWEEKLY-165-2026, title: "DEW #165 - Starved & Neglected Rules, Agentic IR Notebooks and Hacker Summer Camp", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-165-starved-and-neglected-rules", date: "2026-07-29", access: full, locator: "Detection Engineering Gem"}
    - {ref: DETENGWEEKLY-169-2026, title: "DEW #169 - Realistic AI SOC evaluation scenarios, tricking EDRs with fake telemetry and Anthropic/OAI cyber eval guardrails", publisher: "Detection Engineering Weekly", type: community, url: "https://www.detectionengineering.net/p/dew-169-realistic-ai-soc-evaluation", date: "2026-09-03", access: full, locator: "Item on fabricated EDR telemetry"}
  last_reviewed: "2026-10-17"
  notes: "From discourse-12. Cisco and Splunk also ran detection validation across more than 2,100 public detections during Black Hat 2026 (SPLUNK-BHUSA-2026; no figures on outcomes)."

- id: security-operations-18
  title: Triage-to-detection tuning loop - the agent drafts allowlist and rule-change pull requests after an analyst confirms a false positive
  archetype: security
  module: operations
  function: technology-it
  work_types: [software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Alerts keep firing for known-benign patterns until someone writes the suppression.
  solution: >-
    When an on-call engineer confirms a false positive in the thread, Figma's agent opens a draft pull request against
    the detections repository (an allowlist entry or a rule tune) and, for infrastructure or identity-provider
    configuration, against the monorepo; it responds to reviewer comments and rebases stale branches. Elastic's Pattern
    Finder files tuning requests against rules it sees over-firing.
  outcomes:
    - {lever: speed, description: "Figma says the step from understanding an alert to a pull request that fixes it saved the most time", figure: "none published", measures: "no figure", provenance: self-reported, source_ref: FIGMA-AGENTS-2026}
  prerequisites:
    - "Detections and key tool configuration stored as code (FIGMA-AGENTS-2026)"
  risks_and_guardrails:
    - "Every pull request is set to draft by a deterministic workflow step, and the agent cannot close or modify pull requests it did not author (FIGMA-AGENTS-2026)"
    - "Bot-authored changes hide context in version history, so Figma adds the requesting engineer's name and the Slack thread link (FIGMA-AGENTS-2026)"
  human_checkpoints:
    - "A human reviewer approves and merges the pull request (FIGMA-AGENTS-2026)"
  role_evolution: >-
    Detection tuning becomes a review task for engineers (FIGMA-AGENTS-2026).
  evidence_grade: B
  sources:
    - {ref: FIGMA-AGENTS-2026, title: "How we secure Figma's internal systems with agents", publisher: "Figma", type: firm, url: "https://www.figma.com/blog/how-we-secure-figmas-internal-systems-with-agents/", date: "2026-07-29", access: full, locator: "'From investigation to code changes'; 'Guardrails'"}
    - {ref: ELASTIC-ACCURACY-2026, title: "Inside Elastic's agentic SOC: How we took AI alert triage from 60% to 92% accuracy", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/alert-triage-agentic-soc-self-correcting-agents", date: "2026-08-25", access: full, locator: "'The AI feedback loop'"}
  last_reviewed: "2026-10-17"
  notes: "From discourse-11."

- id: security-operations-19
  title: SOC teams build their own agents from playbooks and SOPs in a no-code agent workspace
  archetype: security
  module: operations
  function: technology-it
  work_types: [software-systems, transaction-processing]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Each SOC has its own playbooks, asset criticality and escalation paths; that knowledge is lost to turnover, and
    generic automation does not capture it.
  solution: >-
    Analysts encode playbooks and SOPs into agents in plain language on CrowdStrike's Charlotte AI AgentWorks, choosing
    models per task. Named examples include the Detection Analyzer Agent at Pan-American Life Insurance Group, a
    Detection Engineering Agent at Kroll, and teams at Pegasystems, American Express Global Business Travel, Americas
    Styrenics and Infios. For each workflow teams set what is fully automated and what requires approval.
  outcomes:
    - {lever: speed, description: "One analyst reports building the same agent in four minutes in AgentWorks versus six to eight hours in Microsoft Copilot", figure: "6-8 hours vs 4 minutes", measures: "one unnamed analyst's build-time comparison, quoted by the vendor", provenance: vendor-published, source_ref: CROWDSTRIKE-AGENTWORKS-2026}
  prerequisites:
    - "Telemetry on the vendor's platform; knowledge bases of playbooks, SOPs and environment context (CROWDSTRIKE-AGENTWORKS-2026)"
  risks_and_guardrails:
    - "Agents are bounded in action scope, versioned, governed by role policies, cost-capped and traceable; teams benchmark agent versions on fixed datasets before promotion (CROWDSTRIKE-AGENTWORKS-2026)"
    - "CrowdStrike lists three reasons agentic SOC efforts fail: fragmented data, isolated agents giving late or wrong verdicts, and ungoverned automation (CROWDSTRIKE-AGSOC-2026)"
    - "Prophet's survey: 46% of teams that built their own AI tooling abandoned it, never reached production or replaced it (HNS-GARTNER-2026)"
  human_checkpoints:
    - "Per workflow, teams set what runs automatically and what needs approval (CROWDSTRIKE-AGSOC-2026)"
  role_evolution: >-
    Senior analysts encode their knowledge into agents; the Pan-American Life engineer says the hard part is deciding
    which problem to solve first (CROWDSTRIKE-AGENTWORKS-2026).
  evidence_grade: B
  sources:
    - {ref: CROWDSTRIKE-AGENTWORKS-2026, title: "How AI-leading Security Teams Are Building the Agentic SOC", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/how-ai-leading-security-teams-are-building-the-agentic-soc/", date: "2026-07-06", access: full, locator: "Customer examples list; governance paragraph"}
    - {ref: CROWDSTRIKE-AGSOC-2026, title: "CrowdStrike Delivers the Next Evolution of the Agentic SOC", publisher: "CrowdStrike", type: vendor, url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-delivers-next-evolution-of-agentic-soc/", date: "2026-09-18", access: full, locator: "Three reasons; unified agentic SOAR workspace (public preview)"}
    - {ref: HNS-GARTNER-2026, title: "Gartner: 70% of SOCs will pilot AI agents. Only 15% will see results (sponsored, Prophet Security)", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/09/09/prophet-security-evaluating-ai-soc-agents/", date: "2026-09-09", access: full, locator: "Survey section"}
  last_reviewed: "2026-10-17"
  notes: >-
    From practice-11. Customer statements are quoted by the vendor and give no outcome figures. Several features in the
    2026-09-18 post are labelled pre-beta or public preview. Pattern 'other': a team-built agent library.

- id: security-operations-20
  title: Agents propose containment and response actions that run only through a closed set of templated, validated commands
  archetype: security
  module: operations
  function: technology-it
  work_types: [transaction-processing, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Investigation is faster with agents, but response actions such as blocking, killing a process or isolating a host can
    cause harm if the agent is wrong or manipulated; a single adversarial alert can become a path to executing an action
    through the model's reasoning.
  solution: >-
    Google previews agentic containment that pairs agents (evidence and reasoning) with deterministic playbooks that keep
    high-impact actions under analyst control. A research design confines the model's output to a closed set of intents
    whose templated commands run on thin endpoint agents behind an argument validator, with a guardrail proxy screening
    the analyst model's inputs and outputs. Valvoline's CISO says containment actions became automatic on Torq's
    platform.
  outcomes:
    - {lever: risk, description: "A stock guardrail proxy raised injection recall at a fixed false-positive rate on a SOC-specific adversarial corpus", figure: "25.0% to 94.5% recall at 0.1% false positives", measures: "prompt-injection recall on the authors' released corpus; a live red-team exercise reported containment of observed failure modes; not a production measurement", provenance: independent, source_ref: ARXIV-2610.09906}
  prerequisites:
    - "Deterministic playbooks for the action itself; a defined list of permitted intents and argument checks (ARXIV-2610.09906)"
    - "Endpoint agents that execute templates only"
  risks_and_guardrails:
    - "Measured guardrail latency keeps inline control out of scope; the authors suggest human-in-the-loop or delayed operation (ARXIV-2610.09906)"
    - "Expel's panel treats context, executives and production changes as human-decided, but a routine 3am account lockout with guardrails might be automated (EXPEL-3LEADERS-2026)"
    - "One panelist's vendor automation deleted cloud accounts and the vendor struggled to explain why (EXPEL-3LEADERS-2026)"
  human_checkpoints:
    - "High-impact actions stay under analyst control (TECHINFORMED-GOOGLE-2026)"
    - "Human approval or a delay window before commands execute (ARXIV-2610.09906)"
  role_evolution: >-
    SOC engineers curate the permitted action vocabulary and analysts approve actions (ARXIV-2610.09906); Expel's panel
    prefers a human 'over the loop' watching the process (EXPEL-3LEADERS-2026).
  evidence_grade: C
  sources:
    - {ref: TECHINFORMED-GOOGLE-2026, title: "Google's SOC agent cuts alert review from 30 minutes to 60 seconds", publisher: "TechInformed", type: press, url: "https://techinformed.com/googles-soc-agent-cuts-alert-review-from-30-minutes-to-60-seconds/", date: "2026-06-16", access: full, locator: "Paragraph on agentic containment and response (preview)"}
    - {ref: ARXIV-2610.09906, title: "Constrained-Action AI Remediation for SIEM/XDR via a NeMo-Guardrails Proxy", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2610.09906", date: "2026-10-07", access: full, locator: "Abstract"}
    - {ref: EXPEL-3LEADERS-2026, title: "Why three security leaders still won't let AI make the call", publisher: "Expel", type: vendor, url: "https://expel.com/blog/why-three-security-leaders-still-wont-let-ai-make-the-call/", date: "2026-10-02", access: full, locator: "Trust-versus-impact discussion"}
    - {ref: TORQ-SERIESD-2026, title: "Torq Secures $140M Series D at $1.2B Valuation to Lead the AI SOC and Agentic AI Era", publisher: "Torq", type: vendor, url: "https://torq.io/news/torq-seriesD/", date: "2026-01-12", access: full, locator: "Valvoline CISO quote"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from practice-17 and governance-08. Evidence is a preview product, a research design and one customer quote.
    The paper's authors say the fit for operational technology is architectural, not a measured OT deployment.

- id: security-operations-21
  title: Per-action authority for SOC agents - score each action before it may run unattended, and keep agent activity observable, attributable and stoppable
  archetype: security
  module: operations
  function: technology-it
  work_types: [review-assurance, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    AI shortened investigation but not the distance from a validated incident to a safe, verified response (SACR, an
    independent analyst firm, calls this the 'action gap'). Defensive automation is held back by organisational risk,
    since a wrong block can take down the business, and teams lack a shared way to decide which actions an agent may
    take alone or to see what it did.
  solution: >-
    Grant authority one action at a time. The UK NCSC proposes scoring each candidate automation on potency (advice only
    up to code execution), scope, criticality, rollout confidence and recoverability, starting with low-potency
    advise-a-human actions and choosing human-in-the-loop, on-the-loop or out-of-the-loop per action. SACR's model sets
    evidence, policy, credential, scope and accountability requirements per action and keeps fixed logic separate from
    model reasoning. Agent activity is logged as security telemetry, attributable to an identity and owner, shown on a
    dashboard and stoppable (Cisco/Splunk built a Triage Agent dashboard in an afternoon at .conf26).
  outcomes:
    - {lever: risk, description: "Autonomy granted to AI in a vendor-run survey", figure: "57% require a human to review every AI decision before an alert is closed; 30% auto-execute low-risk actions; 13% medium-risk; no respondent grants full unsupervised autonomy", measures: "Prophet Security survey as quoted in a sponsored article; respondent base not given there", provenance: vendor-published, source_ref: HNS-GARTNER-2026}
    - {lever: risk, description: "Trust in autonomous action in an MDR provider's survey", figure: "14% say AI is central to their security-operations strategy; 53% trust AI even for narrow actions such as blocking a malicious IP", measures: "1,350 security and IT decision-makers (Sapio Research for Arctic Wolf), via a news summary", provenance: vendor-published, source_ref: LDS-ARCTICWOLF-2026}
    - {lever: risk, description: "Agent activity made visible on the event SOC dashboard", figure: "confidence bands 40-59: 13%, 60-79: 53%, 80-100: 34%", measures: "share of findings by average confidence band; model outputs not validated against outcomes", provenance: vendor-published, source_ref: CISCO-SPLUNK-CONF26-2026}
  prerequisites:
    - "An inventory of automated and proposed actions; test and rollback capability (digital twin, audit mode, ring deployment) (NCSC-AGENTICDEF-2026)"
    - "Agent identities that can be attributed and scoped, and a named owner for each agent's activity (NCSC-AGENTICRISK-2026)"
    - "Per-action evidence, approval routing, credential separation, audit records and outcome verification (SACR-TRUSTEDSOC-2026)"
  risks_and_guardrails:
    - "NCSC: where unintended activity would be significant, name responsible individuals or groups, keep human oversight and real-time monitoring, and evaluate judge agents independently (NCSC-AGENTICRISK-2026)"
    - "NCSC: log, audit and monitor agentic AI activity as part of security operations, make it easy to attribute, and keep emergency shutdown; this is interim advice to be superseded by formal guidance (NCSC-AGENTICRISK-2026)"
    - "NCSC notes existing remedial automation such as SOAR is deterministic: each rule is crafted and tested (NCSC-AGENTICDEF-2026)"
    - "Gartner, as quoted, distinguishes 'human in the loop' from 'human on the loop' (HNS-GARTNER-2026)"
    - "CISA, NIST and NSA practices (2026-10-16) cover limiting agent access, monitoring for unexpected activity, preserving evidence, shutdown and reporting near-misses; they target organisations training and evaluating highly capable agents (CISA-KEYPRACTICES-2026)"
  human_checkpoints:
    - "The accountable owner approves each autonomy level and can widen or withdraw it on evidence (NCSC-AGENTICDEF-2026, SACR-TRUSTEDSOC-2026)"
    - "Approval routing per action, with reversibility and proof of execution (SACR-BHUSA-2026)"
    - "Emergency shutdown of agents (NCSC-AGENTICRISK-2026)"
  role_evolution: >-
    Operators make a portfolio of narrow delegation decisions rather than one trust decision (SACR-TRUSTEDSOC-2026);
    NCSC advice implies a named individual or group owns each agent's activity (NCSC-AGENTICRISK-2026).
  evidence_grade: C
  sources:
    - {ref: NCSC-AGENTICDEF-2026, title: "One does not simply defend agentically", publisher: "UK National Cyber Security Centre", type: regulator, url: "https://www.ncsc.gov.uk/blogs/one-does-not-simply-defend-agentically", date: "2026-09-21", access: full, locator: "Risk table (Potency, Scope, Criticality, Rollout confidence, Recoverability); footnote on SOAR"}
    - {ref: NCSC-AGENTICRISK-2026, title: "Managing the cyber risk of agentic AI (interim blog)", publisher: "UK National Cyber Security Centre", type: regulator, url: "https://www.ncsc.gov.uk/blogs/managing-the-cyber-risk-of-agentic-ai", date: "2026-08-20", access: full, locator: "'Set the right level of oversight'; key considerations list"}
    - {ref: SACR-TRUSTEDSOC-2026, title: "AI SOC Technoscope Series: Building the Trusted SOC (Part 1)", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/ai-soc-technoscope-series-building", date: "2026-07-27", access: full, locator: "Key Actionable Summary; 'Defining Trusted Security Response Operations'"}
    - {ref: SACR-BHUSA-2026, title: "Black Hat USA 2026: Key Insights We're Observing For H2 2026", publisher: "Software Analyst Cyber Research", type: firm, url: "https://softwareanalyst.substack.com/p/black-hat-usa-2026-key-insights-were", date: "2026-08-21", access: full, locator: "'Security Operations Center (The SOC) Trends'"}
    - {ref: HNS-GARTNER-2026, title: "Gartner: 70% of SOCs will pilot AI agents. Only 15% will see results (sponsored, Prophet Security)", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/09/09/prophet-security-evaluating-ai-soc-agents/", date: "2026-09-09", access: full, locator: "Sections 1 and 5"}
    - {ref: LDS-ARCTICWOLF-2026, title: "Arctic Wolf Survey Finds AI Trust Gap", publisher: "Let's Data Science", type: press, url: "https://letsdatascience.com/news/arctic-wolf-survey-finds-ai-trust-gap-b12457e5", date: "2026-09-14", access: full, locator: "Key points"}
    - {ref: CISCO-SPLUNK-CONF26-2026, title: "Splunk .conf26: Tracking the Triage Agent in the Agentic SOC", publisher: "Cisco Blogs", type: vendor, url: "https://blogs.cisco.com/security/conf26-agentic-soc-triage-agent/", date: "2026-10-08", access: full, locator: "'Building the Triage Agent Dashboard in an Afternoon'; Dashboard Snapshot table"}
    - {ref: CISA-KEYPRACTICES-2026, title: "Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation", publisher: "CISA with NIST and NSA", type: regulator, url: "https://www.cisa.gov/resources-tools/resources/key-practices-incident-readiness-and-response-super-intelligence-training-and-evaluation", date: "2026-10-16", access: full, locator: "Summary of ten voluntary practices"}
    - {ref: ARXIV-2505.23397, title: "A Unified Framework for Human AI Collaboration in Security Operations Centers with Trusted Autonomy", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2505.23397", date: "2025-05", access: full, locator: "Abstract: five autonomy levels mapped to human roles and trust thresholds; simulated cyber range"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merged from discourse-18, governance-09 (an idea) and governance-10 (agent observability). Grade C: a regulator
    proposal, an analyst framework and vendor surveys; the Cisco dashboard is the only named deployment and covers
    observability only. No organisation reports running per-action scoring. CISA pages retrieved on 2026-10-17 show
    'AI' replaced by 'Super Intelligence (SI)' in titles.

- id: security-operations-22
  title: Measuring the SOC's AI - score verdicts against analyst outcomes, sample what it closes, and replay benchmarks before widening autonomy
  archetype: security
  module: operations
  function: technology-it
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Vendors give clean accuracy figures on curated alerts; teams need evidence on their own alerts, especially for false
    negatives. SOCs mostly report activity: 70% of SANS respondents still name incident count as their top metric, and AI
    closures remove alerts from human view without anyone checking the miss rate.
  solution: >-
    Record the AI verdict and the analyst's closure reason on every case and chart agreement on a dashboard (Elastic).
    Sample AI-closed cases for quality review (CyberProof). Before go-live and after each model or prompt change, run
    proofs of value on real production alerts, side-by-side bake-offs, fixed-dataset regression tests, or replay
    benchmarks with known ground truth (ALERT-BENCH, SIABench, SIR-Bench, unsecure.sh scenarios), and decide autonomy on
    the results.
  outcomes:
    - {lever: quality, description: "AI verdict agreement with analyst close reasons, tracked over time", figure: "60% to 92%", measures: "AI verdict compared with analyst close reason on cases", provenance: self-reported, source_ref: ELASTIC-ACCURACY-2026}
    - {lever: risk, description: "QA review sampling of closed cases at a managed SOC, unnamed client", figure: "zero hallucinations and no false negatives over 90 days", measures: "provider's QA review sampling; sample size not given in the summary read", provenance: vendor-published, source_ref: CYBERPROOF-CASE-2026}
    - {lever: risk, description: "In an independent replay benchmark every tool-using triage approach missed attack alerts", figure: "at least 40.4% of attack-related alerts missed by every approach", measures: "1,247 alerts from one multi-stage attack replayed through a live SIEM; five approaches", provenance: independent, source_ref: ARXIV-2610.10608}
    - {lever: risk, description: "Off-the-shelf frontier models on one hard intrusion scenario", figure: "5 of 7 models gave a false-positive or benign disposition; best weighted score 29%", measures: "seven models run twice each against one scenario with 16 weighted validation gates (August 2026); recall only", provenance: vendor-published, source_ref: UNSECURE-EVAL-2026}
    - {lever: quality, description: "Vendor bake-off with an unnamed customer", figure: "99.3% agreement with the in-house SOC team over 12,000 investigations in two weeks", measures: "vendor's own operating evidence", provenance: vendor-published, source_ref: UNDERDEFENSE-AISOC-2026}
  prerequisites:
    - "Analyst closure reasons captured as structured fields (ELASTIC-ACCURACY-2026)"
    - "A replayable alert set with expert-validated ground truth, and telemetry replay into a real or test SIEM (ARXIV-2603.06422, ARXIV-2604.12040)"
    - "A sampling protocol, reviewer capacity and someone accountable for acceptance thresholds"
  risks_and_guardrails:
    - "Attack alerts were more likely to be dismissed when searches returned no records, and same-context self-review had negative net correction (ARXIV-2610.10608)"
    - "Gartner, as relayed by vendors, warns of 'AI washing' and 'agent washing' and advises piloting against your own baseline; by 2028 70% of large SOCs will pilot AI agents but only 15% will see measurable improvement without structured evaluation (DROPZONE-GARTNERHC-2026, HNS-GARTNER-2026)"
    - "Benchmarks use replayed or synthetic data; SIR-Bench scores come from the authors' own agent and an LLM judge (ARXIV-2604.12040); the unsecure.sh scorecard has no penalty for wrong claims (UNSECURE-EVAL-2026)"
    - "Analysts accepted AI outputs even at lower accuracy when explanations seemed relevant, so agreement rates need independent checks (ARXIV-2503.02065); NCSC advises independent evaluation of judge agents (NCSC-AGENTICRISK-2026)"
  human_checkpoints:
    - "Analysts' closure reasons are treated as truth in Elastic's set-up (ELASTIC-ACCURACY-2026)"
    - "Senior analysts review the samples and own the miss-rate trend"
    - "Humans decide which actions are delegated and widen scope on evidence (SACR-TRUSTEDSOC-2026)"
  role_evolution: >-
    Detection and automation engineers own the measurement dashboards and tune context from override data
    (ELASTIC-ACCURACY-2026); Detection Engineering Weekly sees evaluation harnesses commoditising as teams build their
    own (DETENGWEEKLY-169-2026).
  evidence_grade: A
  sources:
    - {ref: ELASTIC-ACCURACY-2026, title: "Inside Elastic's agentic SOC: How we took AI alert triage from 60% to 92% accuracy", publisher: "Elastic Security Labs", type: vendor, url: "https://www.elastic.co/security-labs/alert-triage-agentic-soc-self-correcting-agents", date: "2026-08-25", access: full, locator: "Data paragraph; 'AI Incorrect?' field"}
