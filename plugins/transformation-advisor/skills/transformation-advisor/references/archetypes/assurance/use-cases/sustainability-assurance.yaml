- id: assurance-sustainability-assurance-08
  title: Preparer-side AI that checks disclosures against ESRS or ISSB and drafts narrative before assurance (Workiva agent; LLM drafting)
  archetype: assurance
  module: sustainability-assurance
  function: finance-accounting
  work_types:
  - review-assurance
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: "Reporting teams compare long standards with existing content line by line. Gaps that surface late, during executive, legal or assurance review, can force new data, evidence or approvals under deadline. CSRD narrative is also long and repetitive across frameworks and audiences. Teams want drafts quickly but fear unsupported statements that fail assurance."
  solution: "Workiva's Sustainability Disclosure Agent assesses selected content against chosen ESRS or ISSB requirements, marks each as present, partial or missing in a scorecard, and drafts a first version. It runs inside the platform, which the vendor says keeps audit trail and version control. A multi-agent design splits the tasks. Workiva presents it as supporting expert judgement; sign-off stays with the team. More broadly, preparers use LLMs to draft or adapt disclosure narrative from underlying data. Vendors say drafting is valuable only when each statement is tied to verified data, transparent sources and human review, so the text survives assurance."
  outcomes:
  - lever: speed
    description: "No time, accuracy or usage figure was published for the Workiva agent. Coverage describes features only."
    figure: none published
    measures: "Product description; availability is for customers on Workiva's advanced solution tiers"
    provenance: vendor-published
    source_ref: ITBRIEF-WORKIVA-2026
  - lever: speed
    description: none published
    figure: none published
    measures: "Vendor blogs and a sector site describe LLM narrative drafting; no time or error figure"
    provenance: vendor-published
    source_ref: IRIS-GENAI-2026
  prerequisites:
  - "Disclosure content and underlying data already held in the vendor's platform (for the Workiva agent)."
  - "Verified data and source documents the model can cite."
  - "A workflow in which the gap list and draft are reviewed by people with standards knowledge, including someone who can check each figure against its source."
  risks_and_guardrails:
  - "Agent output is a draft for review and is not an assurance conclusion; the vendor says interpretation and sign-off stay with the client team (ESGPOST-WORKIVA-2026)."
  - "ISSA 5000 warns that overreliance on automated tools can stop critical assessment of evidence (ISSA5000-2024, A91). The Workiva sources do not say how assurance providers treat agent-produced material."
  - "Hallucinated facts and numbers read smoothly, so a quick human fact-check is not enough (IRIS-GENAI-2026)."
  - "Hallucination is a threat where accuracy is legally material; organisations are adding human review workflows and audit trails (ESGSOURCE-2026, 'AI in ESG Reporting')."
  human_checkpoints:
  - "Reporting team reviews the scorecard and the first draft before they enter the report (ESGNEWS-WORKIVA-2026)."
  - "Human reviewer checks each AI-drafted statement against sources before publication (IRIS-GENAI-2026; BRIINK-2025)."
  role_evolution: "Workiva's product chief says finance, sustainability, risk and compliance teams are moving from execution to orchestration as agents take on more work (ITBRIEF-WORKIVA-2026). A vendor argues AI frees ESG analysts from reading and drafting so they can interpret and plan, in a market short of sustainability talent (BRIINK-2025)."
  evidence_grade: C
  sources:
