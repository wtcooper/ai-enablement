  - "The IAASB expects questions on the practitioner's understanding of the entity's information system and internal control, the reliability of information used as evidence, and estimates, assumptions and models as entities use complex systems and external data (IAASB-CATALOG-2026, Theme 10(a))."
  - "The IAASB's direction is to keep monitoring and wait for ISSA 5000 implementation experience before deciding whether sustainability-specific clarification is needed (IAASB-CATALOG-2026, Theme 10(a))."
  human_checkpoints:
