- id: assurance-controls-testing-18
  title: Orchestrated agent 'swarms' working alongside auditors in internal audit
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting, software-systems]
  pattern: other
  change_scope: process
  ladder: delegate
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Prompt libraries plateau: nobody owns the prompts or measures their output, routines are built one by one,
    and moving AI between systems adds overhead (described as a 'bridge tax'). One agent per task does not
    scale across an audit plan.
  solution: >-
    PayPal Internal Audit describes "swarm auditing": teams of agents orchestrated in parallel to run analytics
    and tests, under a defined framework for how agents and auditors collaborate. Practitioners advise keeping
    the knowledge base separate from the AI engine. Scripts and agents built in audit are handed to first- and
    second-line owners, who own and modify them. The team keeps a separate bucket of hours for experimentation
    within the audit plan.
  outcomes:
    - {lever: capacity, description: "No figures published; experimentation hours budgeted separately from the audit plan", figure: "not quantified", source_ref: IIA-SWARM}
  prerequisites:
    - "Data-science capability inside audit operations (PayPal has run analytics since 2016)"
    - "Prompt library and an agent permission model"
  risks_and_guardrails:
    - "Independence: lines of defence blur when internal audit shares agents; handled by transferring ownership to the business"
    - "Agent permissions and the 'lethal trifecta' security risk"
  human_checkpoints:
    - "Auditors remain the decision layer; agents are not replacing the team in the near term"
  role_evolution: >-
    New roles such as a data-science manager in audit operations; auditors orchestrate agents and shift toward
    judgment, ethics and strategic oversight.
  evidence_grade: B
  sources:
    - {ref: IIA-SWARM, title: "Preparing Audit Teams for Swarm Auditing (All Things Internal Audit, with PayPal CAE and Data Science Manager)", publisher: "The IIA", type: podcast, url: "https://www.theiia.org/en/content/podcast/all-things-internal-audit/2026/ep-0107/", date: "2026-01-28"}
    - {ref: SRA-SWARM, title: "How AI Agents are transforming internal audit (R. Penfill, PayPal)", publisher: "Speaking of Risk and Audit (Richard Chambers)", type: podcast, url: "https://srapodcast.podbean.com/e/swarm-auditing-how-ai-agents-are-transforming-internal-audit", date: "2026-02-11"}
    - {ref: AUDITPOD-296, title: "Ep 296: Why Every Auditor Needs to Learn How AI Agents Work w/ Richard Penfil (AssureSwarm)", publisher: "The Audit Podcast (Trent Russell)", type: podcast, url: "https://podcasts.apple.com/mx/podcast/the-audit-podcast/id1502796518", date: "2026-09-15"}
    - {ref: CPAPA-ZANIN, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents (A. Zanin)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=188703", date: "2026-08-18"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-19 and discourse-17. Pattern 'other': multi-agent orchestration with a defined
    human-agent collaboration layer across audit work. Described from podcast content and episode summaries;
    no figures. Verifier removed an unsourced 'vibe-coded tools' guardrail. By September 2026 the PayPal data-science lead had founded AssureSwarm (name spelled Penfill
    and Penfil in different sources).

- id: assurance-controls-testing-19
  title: In-sourcing previously outsourced SOX and ITGC testing to agents
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance]
  pattern: document-to-decision
  change_scope: model
  ladder: delegate
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Many SOX programmes buy testing hours from co-source providers; KPMG's 2025 survey found only 28% used
    outsourced providers for SOX testing, but 58% said outsourced providers made up over 20% of SOX budget. Testers change every year, which hurts consistency.
  solution: >-
    Internal audit teams have agents run the tests that were outsourced, starting with IT general controls and
    then business-process controls, under their own review process. Havertys expects external spend to shift
    from testing hours to advisory work.
  outcomes:
    - {lever: cost, description: "Havertys starts with outsourced IT controls because ROI was clearest; target is all IT SOX tests and part of business-process tests", figure: "not quantified", source_ref: OPTRO-HAVERTYS}
    - {lever: cost, description: "An unnamed Petual customer told the investor they cut SOX budget to a quarter of its prior level (anecdotal)", figure: "~75% budget reduction (claim)", source_ref: A16Z-PETUAL}
  prerequisites:
    - "Years of structured test history and documentation in the GRC platform"
    - "Ability to 'teach' tests the way one would brief a rotating third-party tester"
  risks_and_guardrails:
    - "Same manager review and approval as before ('humans in the loop')"
    - "Turnover at co-source providers is given as a reason to move"
  human_checkpoints:
    - "IT audit manager reviews every agent test result before acceptance"
  role_evolution: >-
    Co-source budget shifts from testing hours to advisory; internal auditors take on complex and non-standard
    controls, remediation and programme design.
  evidence_grade: B
  sources:
    - {ref: OPTRO-HAVERTYS, title: "Four years in, Havertys expands its use of Optro with agentic AI for controls testing", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/havertys-furniture-success-story", date: "2026-09-04"}
    - {ref: A16Z-PETUAL, title: "Investing in Petual", publisher: "Andreessen Horowitz", type: vendor, url: "https://a16z.com/announcement/investing-in-petual/", date: "2026-04-23"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-03. Havertys has announced and begun the move; no measured outcome yet. The Petual figure is
    from an unnamed customer via an investor.

- id: assurance-controls-testing-20
  title: Agent-delivered co-sourced and outsourced controls testing by audit and advisory firms
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, document-production, client-interaction]
  pattern: document-to-decision
  change_scope: model
  ladder: delegate
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Firms that sell SOX and internal audit testing as a labour-based service face fee pressure and clients
    in-sourcing to agents. Unstructured evidence of every file type still has to be read, matched to samples
    and documented with traceability.
  solution: >-
    Firms embed agents in their own delivery. RSM Beacon: upload evidence, automatic file and completeness
    validation, natural-language directed test steps, rules-based analysis such as user-access
    testing, and annotated outputs traced to source; auditors approve, refine or intervene at key stages, and
    scope covers SOX, internal audit, SOC and ICFR testing. In August 2026 RSM also announced an alliance to
    integrate Andera's AI into its audit platform. Riveron places different agents at specific
    workflow steps in co-sourced and outsourced engagements, with a professional reviewing every result before
    it enters the workpaper. AI-native start-ups such as Arden present themselves as internal audit firms.
  outcomes:
    - {lever: growth, description: "RSM positions Beacon as a new service for middle-market internal audit; Andera says multiple Fortune 500 companies use it across SOX, KYC, PCI, AML and cyber testing (unnamed)", figure: "not quantified", source_ref: CPAPA-RSM}
    - {lever: quality, description: "Riveron argues hours saved is not the main metric; it measures review-ready workpapers, shorter cycles and earlier issue visibility", figure: "not quantified", source_ref: RIVERON}
  prerequisites:
    - "Firm methodology encoded in prompts and templates ('RSM-embedded methodology and standard prompting')"
    - "Disciplined control metadata: test attributes, evidence requirements, sampling logic and exception rules"
    - "Firm certification of third-party agents; client data-sharing and confidentiality terms"
  risks_and_guardrails:
    - "Distinguish missing support from true exceptions (for example a review done in a meeting without a written record)"
    - "Riveron: general-purpose LLMs alone do not meet an 'audit-grade' standard for testing"
    - "FRC: where a tool's internal logic cannot be evaluated (as with LLMs), output testing in certification carries more weight; in its 2025 thematic only two of six firms recorded tool limitations in certification templates"
    - "NFRA: do not rely on vendor accuracy claims without independent evaluation"
  human_checkpoints:
    - "Approval at key workflow stages (RSM); professional review of every test result (Riveron)"
    - "Open items flagged to people for resolution"
  role_evolution: >-
    Provider staff shift from testing to review, challenge, exception analysis and stakeholder dialogue; firms
    sell testing capacity as a platform plus review service, and hourly pricing comes under pressure.
  evidence_grade: B
  sources:
    - {ref: CPAPA-RSM, title: "Andera and RSM US Partner to Create AI-Enabled Control Testing Platform for Internal Audit", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/26/andera-and-rsm-us-partner-to-create-ai-enabled-control-testing-platform-for-internal-audit/189130/", date: "2026-08-26"}
    - {ref: RSM-BEACON, title: "RSM Beacon: Automated control testing platform", publisher: "RSM US", type: firm, url: "https://rsmus.com/services/risk-fraud-cybersecurity/automated-control-testing.html", date: "2026"}
    - {ref: RIVERON, title: "AI in Internal Audit and SOX: Applying Methods that Work", publisher: "Riveron", type: firm, url: "https://riveron.com/ai-in-internal-audit-and-sox-applying-methods-that-work/", date: "2026-06-16"}
    - {ref: YC-ARDEN, title: "Arden: AI-native internal audit firm", publisher: "Y Combinator", type: vendor, url: "https://www.ycombinator.com/companies/arden", date: "2026"}
    - {ref: VERDANTIX, title: "What Goes Around Comes Around: KPMG's AI-Driven Fee Argument", publisher: "Verdantix", type: press, url: "https://www.verdantix.com/venture/blog/what-goes-around-comes-around--kpmg-s-ai-driven-fee-argument-raises-uncomfortable-questions-about-audit-pricing-models", date: "2026-02-10"}
    - {ref: FRC-THEMATIC, title: "Thematic Review: Certification of Automated Tools and Techniques", publisher: "Financial Reporting Council", type: regulator, url: "https://www.frc.org.uk/docs/8383/html/", date: "2025-06-26"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: NFRA-CAALLEY, title: "NFRA sets 10 principles for technology use in audits, says AI cannot replace auditor judgement", publisher: "CAalley", type: press, url: "https://caalley.com/news-updates/indian-news/nfra-sets-10-principles-for-technology-use-in-audits-says-ai-cannot-replace-auditor-judgement", date: "2026-07-24"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-04, discourse-10 and governance-04. No named RSM Beacon client or measured outcome was
    found. Verifier: the RSM-Andera announcement does not name Beacon, so 'Beacon built with Andera' was
    reworded. Lens and ladder follow discourse and governance (reinvent / delegate); practice had ladder augment.

- id: assurance-controls-testing-21
  title: Encoding SOX testing judgment into agent evaluation sets (practitioner-in-the-loop development)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [software-systems, expert-judgment]
  pattern: other
  change_scope: step
  ladder: assist
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    A model that is right 95% of the time is unusable if no one can tell which 5% to check, and agent
    conclusions must be repeatable and defensible under PCAOB review.
  solution: >-
    Vendors hire experienced SOX testers to write decision rules, run controls through agents, document failure
    modes, define ground truth per control type and build versioned evaluation sets. Engineers use those sets
    to run regression tests before changing prompts, models or tools.
  outcomes:
    - {lever: quality, description: "Fieldguide contract role for SOX AI specialists: 8-12 weeks, $60-80/hour, requires 4+ years of control testing", figure: "not quantified", source_ref: JOB-FG-SOX}
    - {lever: quality, description: "Nace.AI seeks Big Four (or equivalent) SOX experts to judge when AI output 'only looks right'", figure: "not quantified", source_ref: JOB-NACE}
  prerequisites:
    - "Real workpapers and labelled outcomes across control types (reconciliations, management review controls, access reviews, segregation of duties)"
  risks_and_guardrails:
    - "The same evidence should produce the same conclusion every time (Fieldguide engineering brief)"
  human_checkpoints:
    - "Expert sign-off on evaluation criteria before release"
  role_evolution: "New role: the SOX practitioner as AI evaluator or prompt engineer rather than client delivery."
  evidence_grade: B
  sources:
    - {ref: JOB-FG-SOX, title: "SOX AI Specialist (Contractor)", publisher: "Fieldguide (via Built In)", type: job-posting, url: "https://www.builtinla.com/job/sox-ai-specialist-contractor/10443759", date: "2026-08-24"}
    - {ref: JOB-FG-SWE, title: "Software Engineer, Internal Audit (All Levels)", publisher: "Fieldguide (via Jobicy)", type: job-posting, url: "https://jobicy.com/jobs/154197-software-engineer-internal-audit-all-levels", date: "2026-09-29"}
    - {ref: JOB-NACE, title: "SOX Audit Expert", publisher: "Nace.AI (General Catalyst job board)", type: job-posting, url: "https://jobs.generalcatalyst.com/companies/nace-ai-2/jobs/74116857-sox-audit-expert", date: "2026-04-13"}
    - {ref: CPAPA-ZANIN, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents (A. Zanin)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=188703", date: "2026-08-18"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-20. Pattern 'other': a human-labelled evaluation harness for audit agents. Job pages carry
    AI-generated summaries; only the posting text was used.

- id: assurance-controls-testing-22
  title: "Idea: AI-assisted deviation evaluation and deficiency classification, grounded in a deviation memory"
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [expert-judgment]
  pattern: grounded-knowledge-assistant
  change_scope: step
  ladder: assist
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Deciding whether a failure is a minor gap, a significant deficiency or a material weakness (the severity
    levels for control failures) depends on enterprise context that is often unwritten, and past rationales
    are scattered. IFIAR still records findings for failing to evaluate deficiency severity (11 in 2025).
  solution: >-
    Teams record why past exceptions were accepted in one repository. An agent checks new exceptions against
    it and drafts a classification once a human supplies the context.
  outcomes:
    - {lever: quality, description: "No deployment or measured outcome found (idea)", figure: "none", source_ref: OPTRO-FIRST}
  prerequisites:
    - "Central log of deviations and the rationale for each disposition"
  risks_and_guardrails:
    - "A general model asked the question cold gives a confident answer with no grounding (Optro)"
  human_checkpoints:
    - "Auditor makes the classification"
  role_evolution: "Judgment stays human; preparation of the analysis is assisted."
  evidence_grade: D
  sources:
    - {ref: OPTRO-FIRST, title: "Agentic AI in Internal Audit: What to Automate First", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/agentic-ai-internal-audit-controls", date: "2026-08-11"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
  last_reviewed: "2026-10-16"
  notes: "Idea. From discourse-16; discussed by Optro and Confluent's CAE in a webinar; no deployment found."

- id: assurance-controls-testing-23
  title: "Idea: screening control evidence for AI fabrication and embedded prompt injection before testing"
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance]
  pattern: intake-triage
  change_scope: step
  ladder: assist
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    GenAI makes convincing fake invoices, approvals and screenshots cheap to produce, and control owners who
    know auditors test with agents could hide instructions in evidence to steer the agent (prompt injection).
  solution: >-
    Regulators and practitioners call for authenticity procedures over evidence and alertness to adversarial
    AI use: obtain evidence from source systems where possible, and sanitise agent inputs and constrain
    outputs with schemas. No public deployment of a dedicated screening step for controls evidence was found.
  outcomes:
    - {lever: risk, description: "Internal audit leaders citing fabricated invoices or documents as an AI-enabled fraud concern; share saying their function is unprepared or minimally prepared", figure: "65%; 62%", source_ref: IIAF-FRAUD}
  prerequisites:
    - "Evidence obtained from source systems where possible"
    - "Agent input sanitisation and output schemas"
  risks_and_guardrails:
    - "IRBA: establish procedures to verify the authenticity of evidence and working papers"
    - "IFIAR 2026: be alert to documents generated or manipulated to circumvent controls"
    - "IAASB ED: reliability attributes of information include authenticity"
  human_checkpoints:
    - "Auditor escalates suspected manipulation under the fraud standards"
  role_evolution: "Forensic and IT specialists become involved in routine controls testing."
  evidence_grade: D
  sources:
    - {ref: IRBA, title: "Artificial Intelligence Audit Risks Mitigation Update", publisher: "IRBA (South Africa)", type: regulator, url: "https://www.irba.co.za/upload/40_%20Artificial%20Intelligence%20Audit%20Risks%20Mitigation%20Update.pdf", date: "2024-09-19"}
    - {ref: IFIAR-TTF26, title: "Use of technology in audits - Innovation and audit quality 2026", publisher: "IFIAR Technology Task Force", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: IIAF-FRAUD, title: "Internal Audit and AI-Enabled Fraud", publisher: "Internal Audit Foundation & AuditBoard", type: survey, url: "https://www.theiia.org/globalassets/site/content/research/foundation/2026/internal-audit-and-ai-enabled-fraud/ia-and-ai-enabled-fraud-report-en.pdf", date: "2026-02-17"}
    - {ref: IAASB-ED, title: "Proposed Revisions for Audit Evidence & Risk Response: ISA 330, ISA 500 & ISA 520", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/publications/proposed-revisions-audit-evidence-risk-response-isa-330-isa-500-isa-520", date: "2026-08-05"}
    - {ref: AUASB-CP, title: "Consultation Paper: IAASB Proposed International Standards on Audit Evidence & Risk Response", publisher: "AUASB (Australia)", type: standard-setter, url: "https://www.auasb.gov.au/media/fegpk4s5/auasb_cp_iaasbproposedintlstdonauditevidence__riskresponse1.pdf", date: "2026-08"}
  last_reviewed: "2026-10-16"
  notes: "Idea. From governance-15. IAASB ED texts are login-gated; the authenticity attribute was confirmed in the AUASB consultation paper (AUASB-CP)."

- id: assurance-controls-testing-24
  title: "Idea: external-auditor reliance on management's or internal audit's AI-enabled control testing"
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  change_scope: model
  ladder: assist
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Reliance on management's or internal audit's testing has been the main efficiency lever in SOX integrated
    audits, and internal audit spends much of its capacity on SOX (KPMG: 52% of departments spend over 40% of
    their hours on it). The reliance standards, PCAOB AS 2605 and ISA 610, predate analytics and AI, and no
    public case was found of an external auditor relying on agent-produced workpapers.
  solution: >-
    Practitioners and the IIA discuss reliance on AI-enabled testing performed by management or internal
    audit: parallel pilots with the external auditor, and equal criteria for supervising, documenting and
    evaluating AI-assisted work whoever performs it. KPMG argues the external auditor's own full-population
    tools could lower the value of relying on management's tests, or raise it if management's AI testing meets
    the evidential bar. Vendors already format workpapers for external-auditor reliance.
  outcomes:
    - {lever: cost, description: "No measured outcome (idea)", figure: "none", source_ref: K-SOX30}
  prerequisites:
    - "A modernised reliance standard (the IIA asks the PCAOB to modernise AS 2605)"
    - "A shared evidence standard for AI outputs (COSO's reliance definition)"
  risks_and_guardrails:
    - "IIA: 'reliance is not delegation'; the external auditor alone is responsible for the opinion"
    - "IFIAR: inadequate assessment of reliance on others' work recurs in inspections"
    - "No regulator view yet on reliance on agent-produced testing; after an NACD session with PCAOB board member Botic, Foley reported the regulator is still working out whether AI needs new standards"
    - "If the SEC filer-status proposal (May 2026) is adopted, roughly half of currently attested issuers would leave 404(b); 80.8% of reporting companies would be non-accelerated filers (from 51.9%), changing reliance economics"
  human_checkpoints:
    - "Engagement partner decides on reliance after evaluating competence, objectivity and the AI tool's certification"
  role_evolution: >-
    If reliance grows, internal audit becomes the testing engine and the external auditor re-performs and
    oversees; SOX teams invest in tooling to keep reliance, which KPMG frames as a race to meet the evidential
    bar.
  evidence_grade: D
  sources:
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: IIA-PCAOB, title: "IIA comments in response to PCAOB Release No. 2026-005 (standard setting)", publisher: "The Institute of Internal Auditors", type: professional-body, url: "https://www.theiia.org/globalassets/site/about-us/advocacy/iia-public-comment-letter-to-the-pcaob-standard-setting-project.pdf", date: "2026-08-07"}
    - {ref: CPAPA-ZANIN, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents (A. Zanin)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=188703", date: "2026-08-18"}
    - {ref: OPTRO-ACT, title: "Why autonomous controls testing will redefine internal audit", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/autonomous-controls-testing-internal-audit", date: "2026-06-15"}
    - {ref: UNIQUS, title: "What the SEC's Filer Status Overhaul Means for ICFR Governance", publisher: "Uniqus", type: firm, url: "https://uniqus.com/what-the-secs-filer-status-overhaul-means-for-icfr-governance/", date: "2026-06-04"}
    - {ref: FOLEY-BOTIC, title: "What Directors Should be Asking About the Audit and the Auditors Now (PCAOB board member G. Botic at NACD)", publisher: "Foley & Lardner", type: firm, url: "https://www.foley.com/insights/publications/2026/07/what-directors-should-be-asking-about-the-audit-and-the-auditors-now/", date: "2026-07-02"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea and open debate. Merged from discourse-18 and governance-16. Pattern 'other': cross-party reliance on
    AI-generated assurance evidence.

- id: assurance-controls-testing-25
  title: "Idea: synthetic transaction data and simulation agents to stress-test controls before an ERP go-live or acquisition"
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: other
  change_scope: process
  ladder: augment
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    The window between an ERP go-live or acquisition and a stable, well-tested control environment is among
    the highest-risk periods for ICFR; controls are untested against real volumes and edge cases.
  solution: >-
    KPMG proposes synthetic transaction populations that mirror real data, and agents that simulate users,
    transactions and adversarial conditions, to test access controls, approval workflows and automated rules
    before live data flows. COSO separately recommends test populations to validate AI accuracy and stress-test
    edge cases.
  outcomes:
    - {lever: risk, description: "No measured outcome (idea)", figure: "none", source_ref: K-SOX30}
  prerequisites:
    - "Representative synthetic data generation"
    - "Test environment mirroring production configuration"
  risks_and_guardrails:
    - "Synthetic results are not audit evidence of operating effectiveness; they supplement it and may miss real-world anomalies"
  human_checkpoints:
    - "ICFR lead or control designers approve scenarios and interpret failures"
  role_evolution: "Moves controls testing upstream into implementation; control testers work alongside data scientists."
  evidence_grade: D
  sources:
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/generative-ai", date: "2026-02-23"}
  last_reviewed: "2026-10-16"
  notes: "Idea. Merged from discourse-14 and governance-17; discussed by KPMG, no deployment found."
