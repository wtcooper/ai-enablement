- id: assurance-controls-testing-04
  title: Risk-scored sample, coverage and control targeting
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [data-reporting, expert-judgment]
  pattern: intake-triage
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Sample and coverage choices rely on static lists, geographic assumptions and judgment that is hard to
    explain or adapt. Testing effort is spread by rotation and habit rather than by where control breakdowns
    are likely.
  solution: >-
    Microsoft Internal Audit's Sample Selection Agent (M365 Copilot) scores items on revenue, discounts, country
    risk and control indicators to produce a defensible risk-based selection. AuditBoard (now Optro) offers AI
    risk-based sample selection for control testing, and Optro's agentic risk-assessment scoring recommends
    starting risk scores with evidence. KPMG describes predictive risk modelling that analyses historical data
    to predict where control breakdowns are most likely to occur. The FRC's contract-review example shows a tool that
    scores items and samples those above a threshold, with the risk indicators visible to the auditor.
  outcomes:
    - {lever: speed, description: "Microsoft Internal Audit: weeks of manual analysis cut to a single day", figure: "weeks -> 1 day", source_ref: MSFT-IA}
    - {lever: capacity, description: "Microsoft Internal Audit Sample Selection Agent, annual hours saved (self-reported; see notes)", figure: "~2K hours/year", source_ref: MSFT-IA}
  prerequisites:
    - "Risk indicators available as structured data"
    - "Documented scoring logic, threshold and selection rationale"
    - "Historical deficiency data, for predictive targeting"
  risks_and_guardrails:
    - "Statistical sampling rules (AS 2315 / ISA 530) still govern external-audit samples; agent scoring is an input"
    - "IFIAR: biased or non-representative samples remain an inspection finding category (11 in 2025)"
    - "FRC: document that an AI tool selected the sample, the criteria for appropriate use, the indicators each item showed and the testing performed"
    - "Scores need explainable evidence before they drive scoping decisions"
  human_checkpoints:
    - "Audit lead approves the selection basis, threshold and any untested residual population"
  role_evolution: >-
    Planning time moves from building selections to challenging the risk model; planning judgment is
    documented as data rather than memory.
  evidence_grade: A
  sources:
    - {ref: MSFT-IA, title: "AI solution overviews: Internal Audit", publisher: "Microsoft (Frontier Finance)", type: firm, url: "https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/mcaps/documents/fy26/Internal-Audit.pdf", date: "2026"}
    - {ref: AUDITBOARD-ACC, title: "AuditBoard Launches Accelerate, Delivering Enterprise-Grade AI Automation for GRC Teams", publisher: "AuditBoard (now Optro)", type: vendor, url: "https://auditboard.com/blog/auditboard-launches-accelerate-delivering-enterprise-grade-ai-automation-for-grc-teams", date: "2025-10-22"}
    - {ref: OPTRO-LAUNCH, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14"}
    - {ref: K-404A, title: "The 404(a) opportunity", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/404-opportunity.pdf", date: "2026-08"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
    - {ref: PCAOB-2024-007, title: "PCAOB Release No. 2024-007: Amendments related to aspects of designing and performing audit procedures that involve technology-assisted analysis", publisher: "PCAOB", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/rulemaking/docket-052/2024-007-adoptingrelease.pdf", date: "2024-06-12"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-18, discourse-08, governance-07 and discourse-20 (predictive targeting, grade C).
    Microsoft's agent supports internal-audit coverage across partner and compliance audits, not SOX
    statistical sampling. The ~2K hours/year figure was confirmed on the rendered PDF page (verifier, 2026-10-16;
    the text layer drops some glyphs). Microsoft PDFs are dated FY26. The PCAOB's 2024-007 release reports that
    all US global network firms used tools to select samples for testing (2023 inspection year).

- id: assurance-controls-testing-05
  title: Agentic attribute testing of SOX key controls against unstructured evidence, with workpapers drafted for review
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  change_scope: process
  ladder: delegate
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    For every sample, a tester opens PDFs, screenshots, tickets, spreadsheets and system exports, checks each
    control attribute (approval, date, threshold), tick-marks the evidence and documents it in Excel or Word in
    the format the external auditor expects. KPMG's 2025 SOX survey puts average testing time at 16 hours per
    control (FY2024, up from 12 in FY2022), with ITGCs (IT general controls over access, change and operations)
    and transactional controls taking longest. Mixed evidence formats broke earlier robotic process automation.
  solution: >-
    Specialised agents (evidence extraction, testing, review, documentation) read unstructured evidence, map it
    to samples, test each defined attribute, record pass, fail or open items with citations back to the source,
    and assemble workpapers in the external auditor's format, often through an Excel add-in with an approval
    workflow. Exceptions route to a human reviewer, who signs off. Reddit's internal audit built this on
    Midship (now Optro Autonomous Testing) across business-process, ITGC, interface and entity-level controls;
    Klaviyo (Optro) and Navan (Petual) are other named users. Practitioners automate bounded controls first,
    such as user-access and password ITGCs and three-way matches. Workiva launched evidence, attribute and
    testing agents for internal audit and GRC in September 2026.
  outcomes:
    - {lever: capacity, description: "Reddit internal audit automated testing of 175 controls (>40% of SOX scope) in its first three months; later expanded to >75% of SOX controls (expansion reported by Optro only)", figure: "175 controls; >40% then >75% of SOX scope", source_ref: OPTRO-LAUNCH}
    - {lever: speed, description: "Reddit: average testing time per control reduced (CAE's own post matches the vendor figure)", figure: "-60% per control", source_ref: REDDIT-POST}
    - {lever: capacity, description: "Petual-reported efficiency gain on existing SOX workflows (vendor claim)", figure: "68-80%", source_ref: FTG-PETUAL}
    - {lever: speed, description: "Midship users report time saved preparing a first-draft workpaper (vendor claim)", figure: "60%", source_ref: OPTRO-FIRST}
    - {lever: speed, description: "Midship founder: a SOX test falls from about 16 hours to under 15 minutes; up to 85% of SOX controls automatable, especially ITGCs (vendor claim)", figure: "16h -> <15 min (claim)", source_ref: SRA-16H}
  prerequisites:
    - "Control library with explicit attributes, evidence requirements and exception rules; vague criteria such as 'approval is required' break agents"
    - "Clean, structured prior-year test history and RCM in the GRC platform"
    - "Central record of previously accepted deviations, so new exceptions can be checked against it"
    - "Workpaper format and review trail agreed early with the external auditor"
  risks_and_guardrails:
    - "Every agent conclusion linked to cited evidence; human-in-the-loop review kept (Reddit)"
    - "Non-determinism: the same test can return slightly different answers on rerun"
    - "Time savings plateau when agents are pointed at the most judgment-heavy work (Optro)"
    - "Prompt injection: control owners could hide instructions in evidence to steer testing agents (KPMG)"
    - "COSO: where management relies on AI output, retain the prompt, configuration and model version, and the sampling rationale"
    - "A generic note that 'an AI tool was used' does not meet documentation standards (CalCPA)"
    - "34% of GRC and audit leaders say their organisation acted on an inaccurate agent output; 46% say staff spend more time validating AI output (vendor survey)"
  human_checkpoints:
    - "Auditor approves the test plan before execution"
    - "Reviewer signs off each conclusion and every exception"
    - "People own deviation evaluation, root cause and deficiency classification"
  role_evolution: >-
    In-house testers become reviewers and 'managers of AI agents', working on exceptions, ad hoc testing,
    remediation with control owners and control design. Reddit's CAE describes human review as essential, and Reddit advertised a role to build an 'AI-first' internal audit
    function starting with agentic SOX testing.
  evidence_grade: A
  sources:
    - {ref: OPTRO-LAUNCH, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14"}
    - {ref: REDDIT-POST, title: "How we used agentic AI to crack automated SOX testing at scale... in 90 days (M. Preedy, Reddit; mirror of r/RedditEng post)", publisher: "Tenu Tech Brief (mirror of reddit.com/r/RedditEng)", type: community, url: "https://cluster-site.onrender.com/posts/how-we-used-agentic-ai-to-crack-automated-sox-testing-at-scale...-in-90-days/", date: "2026-02-23"}
    - {ref: OPTRO-ACT, title: "Why autonomous controls testing will redefine internal audit", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/autonomous-controls-testing-internal-audit", date: "2026-06-15"}
    - {ref: OPTRO-FIRST, title: "Agentic AI in Internal Audit: What to Automate First", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/agentic-ai-internal-audit-controls", date: "2026-08-11"}
    - {ref: OPTRO-MIDSHIP, title: "Optro Leads the Global Audit Transformation with the Acquisition of AI-Native Midship", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-leads-the-global-audit-transformation-with-the-acquisition-of-ai-native-midship", date: "2026-05-06"}
    - {ref: OPTRO-SURVEY, title: "One in Three Organizations Say They Have Acted on Wrong Decisions Made by AI Agents", publisher: "Optro", type: survey, url: "https://optro.ai/blog/one-in-three-organizations-say-they-have-acted-on-wrong-decisions-made-by-ai-agents-optro-research-finds", date: "2026-10-08"}
    - {ref: SRA-16H, title: "From 16 Hours to 15 Minutes: Agentic AI Rewrites SOX Testing", publisher: "Speaking of Risk and Audit (Richard Chambers)", type: podcast, url: "https://srapodcast.podbean.com/e/from-16-hours-to-15-minutes-agentic-ai-rewrites-sox-testing/", date: "2026-05-28"}
