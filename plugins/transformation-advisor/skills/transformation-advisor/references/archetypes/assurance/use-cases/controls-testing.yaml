- id: assurance-controls-testing-06
  title: Two-agent ITGC change-management testing (attribute extraction plus evidence tick-marking)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: document-to-decision
  change_scope: process
  ladder: automate
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Testing SOX change-management controls means opening tickets across several ticketing systems with
    inconsistent formats to confirm testing, approval and timing relative to deployment. Attributes go into
    spreadsheets by hand and evidence is annotated sample by sample.
  solution: >-
    Microsoft Internal Audit built two agents on Copilot Studio. An Attribute Extraction Agent ingests ticket
    data, extracts tester, approver and dates into a standard table and pre-populates rule-based pass/fail
    logic. An Evidence Annotation (tick-marking) Agent marks each extracted field on the source evidence so the
    reviewer sees where each attribute was validated.
  outcomes:
    - {lever: capacity, description: "Annual time saved (self-reported by Microsoft)", figure: "850 hours/year", source_ref: MSFT-CM}
    - {lever: cost, description: "Annual cost saved (self-reported)", figure: "$185K/year", source_ref: MSFT-CM}
    - {lever: speed, description: "Time to build and launch", figure: "1-3 months", source_ref: MSFT-CM}
  prerequisites:
    - "Ticket data accessible to the agent across ticketing systems"
    - "Rule-based attribute criteria agreed with control owners and the external auditor"
    - "Completeness of the ticket population established (IPE: information produced by the entity)"
    - "Low-code agent platform inside the enterprise tenant (Copilot Studio / M365)"
  risks_and_guardrails:
    - "Pre-populated pass/fail logic is rules-based, not generative, and must itself be validated and reviewed (FRC favours output schemas and deterministic rules alongside LLMs)"
    - "ITGC testing remains a recurring inspection finding (39 listed-PIE findings in 2025, IFIAR)"
    - "AFM: auditors often give insufficient attention to ineffective IT general controls when concluding that a tool's input data are reliable"
  human_checkpoints:
    - "Auditor reviews the audit table, exceptions and judgment-based deviations"
    - "Reviewer samples the tick-marked evidence before sign-off"
  role_evolution: >-
    Testers move from opening and annotating each sample to exception analysis and judgment on SOX
    exceptions; IT audit specialists own the attribute rules. The agents were built by Microsoft's own Finance
    and Finance IT teams.
  evidence_grade: A
  sources:
    - {ref: MSFT-CM, title: "Innovation Story: SOX Change Management Testing Agent", publisher: "Microsoft (Frontier Finance)", type: firm, url: "https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/mcaps/documents/fy26/SOX-Change-Management-Testing-Agent.pdf", date: "2026"}
    - {ref: MSFT-IA, title: "AI solution overviews: Internal Audit", publisher: "Microsoft (Frontier Finance)", type: firm, url: "https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/mcaps/documents/fy26/Internal-Audit.pdf", date: "2026"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
    - {ref: AFM-12, title: "12 building blocks for controlled use of auditing tools", publisher: "AFM (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12-11"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-02, discourse-02 and governance-02. Correction: the figure is 850 hours/year. The
    landscape's '50 hours' was a text-extraction error (a dropped glyph in the PDF text layer); all three deep
    dives read 850 on the rendered PDFs. Self-reported by a company that also sells the platform; no quality
    measure published. Microsoft PDFs are dated FY26.

- id: assurance-controls-testing-07
  title: Matching client-provided evidence to selected samples with agents (sample-to-evidence matching)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: reconcile-exceptions
  change_scope: step
  ladder: automate
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Sample selections can run to hundreds of items. Each PBC document arrives in its own format (in PwC's
    words, the client "may hand you a napkin") and must be traced and vouched to its sample by hand. This
    backs up partner and engagement quality review.
  solution: >-
    Agents trace incoming documents to the requested samples, extract and validate values, and record match or
    exception status with links back to the source; the auditor works the exceptions. Products: PwC Evidence
    Match (used in substantive testing of cash, receivables and payables; in October 2025 PwC said its
    controls-testing automation would work the same way), Thomson Reuters Audit Intelligence Test (with
    Valid8), Fieldguide and DataSnipper. Firms using them include Sanville & Co, Oberlander Financial Services
    and RMF Audit & Control.
  outcomes:
    - {lever: speed, description: "Oberlander Financial Services (TR Audit Intelligence Test): sample-to-evidence testing per engagement", figure: "~16 hours -> 5-6 hours", source_ref: TR-AGENTIC}
    - {lever: speed, description: "RMF Audit & Control: samples of 60+ invoices take roughly half the time; also used for tests of controls", figure: "~50%", source_ref: DS-RMF}
    - {lever: growth, description: "Sanville & Co blended realisation on its lowest-margin engagements", figure: "$150-200/hr -> $250+/hr", source_ref: FG-SANVILLE}
    - {lever: quality, description: "Sanville's first PCAOB inspection on the platform (broker-dealer) returned zero comment forms", figure: "0 comment forms", source_ref: FG-SANVILLE}
    - {lever: speed, description: "Thomson Reuters early adopters of CoCounsel Document Analysis (a separate product): faster preparation and workpaper review (vendor claim)", figure: "up to 70%", source_ref: TR-AGENTIC}
  prerequisites:
    - "Clients upload PBC through a portal or tool the firm can read"
    - "Methodology templates in the platform; tool certified under the firm's quality management system"
  risks_and_guardrails:
    - "Accuracy is a binary yes/no metric for matching tools, so it can and should be measured (PwC)"
    - "A clean inspection cannot be attributed to AI alone; at Sanville it followed a full methodology overhaul"
    - "PCAOB AS 1105/2301 amendments (fiscal years beginning on or after 15 Dec 2025) specify how to evaluate the reliability of company-provided electronic information and investigate flagged items"
    - "The file must show the population covered, the items flagged and the follow-up"
  human_checkpoints:
    - "Auditor reviews each exception and signs off the test"
  role_evolution: >-
    Junior tick-and-tie shrinks and reviewer bandwidth is freed: at Sanville, first-year staff now do complex
    revenue testing under guidance. PwC hires engineers into assurance.
  evidence_grade: B
  sources:
    - {ref: TR-AGENTIC, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows.html", date: "2025-11-05"}
    - {ref: FG-SANVILLE, title: "How Sanville & Co passed a PCAOB inspection with zero comment forms in under a year with Fieldguide", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/case-studies/how-sanville-co-passed-a-pcaob-inspection-with-zero-comment-forms-in-under-a-year-with-fieldguide", date: "2026"}
    - {ref: DS-RMF, title: "RMF Audit & Control success story", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/rmf-audit-&-control", date: "2026"}
    - {ref: AT-PWC, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28"}
    - {ref: CFOBREW-PWC, title: "A look at PwC's 'next generation' audit", publisher: "CFO Brew", type: press, url: "https://www.cfobrew.com/stories/2025/11/05/a-look-at-pwc-s-next-generation-audit", date: "2025-11-05"}
    - {ref: FG-PCAOB, title: "PCAOB AI oversight: where the Board stands on AI in audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/pcaob-ai-audit-standards", date: "2026-08-06"}
    - {ref: PCAOB-2024-007, title: "PCAOB Release No. 2024-007: Amendments related to aspects of designing and performing audit procedures that involve technology-assisted analysis", publisher: "PCAOB", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/rulemaking/docket-052/2024-007-adoptingrelease.pdf", date: "2024-06-12"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-12 and discourse-05. Most cited figures are tests of details (substantive testing);
    shared with the substantive-testing module, since tests of controls use the same matching step. PwC's
    controls-testing variant was 'expected' in October 2025 with no later public confirmation; the discourse
    deep dive graded the controls-specific use C. Verifier downgraded A to B: the measured figures (Oberlander,
    RMF's ~50%, Sanville) are for tests of details; RMF and KPMG UK name controls use but publish no
    controls-specific measure.

- id: assurance-controls-testing-08
  title: Full-population testing of transactional and master-data controls instead of samples
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  change_scope: process
  ladder: automate
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Sample-based tests (for example 1 of 25 vendor bank-detail changes) limit the conclusion to the items
    examined and miss errors outside the sample; manual comparison of account numbers and contract terms is
    error-prone. IFIAR recorded 24 'insufficient sample' and 11 'biased or non-representative sample' findings
    in 2025 listed public-interest-entity audits.
  solution: >-
    Document-extraction and matching agents, paired with deterministic code for the calculations, test every
    item in the population and link each value to its source. Armanino (with DataSnipper) validates vendor
    bank and payment-method changes monthly across the full population, ties invoice charges to contract terms
    and matches deposits to reports; the auditor reviews each suggested match. Microsoft Internal Audit's agents
    run full-population testing on high-risk data sets. KPMG calls this one of the biggest methodology advances
    since computerised accounting, and Gartner says more mature internal audit teams are moving from samples
    to full populations.
  outcomes:
    - {lever: quality, description: "Armanino tests 100% of vendor master changes rather than a sample", figure: "100% of population", source_ref: DS-ARMANINO}
    - {lever: capacity, description: "Armanino estimate for one cash-receipts reconciliation test", figure: "25+ hours saved", source_ref: DS-ARMANINO}
    - {lever: capacity, description: "Microsoft Internal Audit (whole function, not controls testing alone): automated assurance coverage, internal quality-review effort and report issuance time", figure: "<30 -> ~100 services automated; QR effort ~-50%; reports 3 -> 2 weeks", source_ref: MSFT-IA}
  prerequisites:
    - "Complete, reliable population data; an incomplete population is a risk that full testing cannot fix"
    - "Capacity to follow up the extra exceptions that full coverage surfaces"
    - "A methodology that states how much evidence a population-level AI output provides"
  risks_and_guardrails:
    - "Do not market full-population testing as certainty; reasonable assurance still applies (expectation gap)"
    - "FRC: population-level AI outputs can be less conclusive per item; the methodology must not overstate their persuasiveness"
    - "NFRA: a tool's full-population run does not remove the need for risk assessment; periodically test its 'low-risk' classifications"
    - "PCAOB standards do not say what a clean full-population run means for sufficiency or how to set investigation thresholds (MindBridge comment letter)"
    - "PCAOB AS 1105/2301 amendments: items flagged in a test of details must be investigated; a procedure used for more than one purpose must meet each objective"
    - "IAASB ED-500 would require auditors to evaluate, not just consider, the relevance and reliability of information"
  human_checkpoints:
    - "Investigation thresholds set before seeing the output"
    - "Auditor investigates every flagged item or a justified subset"
    - "Engagement partner approves the evidential weight given to the population-level result"
  role_evolution: >-
    Time moves from tick-and-tie to investigating exceptions and judging their significance, with 'a person
    accountable for every conclusion'. Sampling expertise gives way to population-integrity skills.
  evidence_grade: A
  sources:
    - {ref: DS-ARMANINO, title: "Three use cases for AI in internal audit (Armanino)", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/three-use-cases-for-ai-in-internal-audit", date: "2026-08-12"}
    - {ref: MSFT-IA, title: "AI solution overviews: Internal Audit", publisher: "Microsoft (Frontier Finance)", type: firm, url: "https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/mcaps/documents/fy26/Internal-Audit.pdf", date: "2026"}
    - {ref: CPAPA-ADEWOLE, title: "Testing Every Transaction Changes the Audit - Here's What Firms Should Know Before They Sell It (T. Adewole, Ledgerline)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/15/testing-every-transaction-changes-the-audit-heres-what-firms-should-know-before-they-sell-it/191713/", date: "2026-10-15"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: MINDBRIDGE-PCAOB, title: "MindBridge's Response to the PCAOB's Strategic Priorities on AI Audit", publisher: "MindBridge", type: vendor, url: "https://www.mindbridge.ai/blog/pcaob-ai-audit-strategic-priorities/", date: "2026-07-06"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: NFRA-CAALLEY, title: "NFRA sets 10 principles for technology use in audits, says AI cannot replace auditor judgement", publisher: "CAalley", type: press, url: "https://caalley.com/news-updates/indian-news/nfra-sets-10-principles-for-technology-use-in-audits-says-ai-cannot-replace-auditor-judgement", date: "2026-07-24"}
    - {ref: PCAOB-2024-007, title: "PCAOB Release No. 2024-007: Amendments related to aspects of designing and performing audit procedures that involve technology-assisted analysis", publisher: "PCAOB", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/rulemaking/docket-052/2024-007-adoptingrelease.pdf", date: "2024-06-12"}
    - {ref: IAASB-ED, title: "Proposed Revisions for Audit Evidence & Risk Response: ISA 330, ISA 500 & ISA 520", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/publications/proposed-revisions-audit-evidence-risk-response-isa-330-isa-500-isa-520", date: "2026-08-05"}
    - {ref: AUASB-CP, title: "Consultation Paper: IAASB Proposed International Standards on Audit Evidence & Risk Response", publisher: "AUASB (Australia)", type: standard-setter, url: "https://www.auasb.gov.au/media/fegpk4s5/auasb_cp_iaasbproposedintlstdonauditevidence__riskresponse1.pdf", date: "2026-08"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
    - {ref: AT-GARTNER, title: "Audit teams' AI use common but most lack strategy (Gartner webinar poll)", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/audit-teams-ai-use-common-but-most-lack-strategy", date: "2026-08-17"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-09, discourse-06 and governance-06. Lens set to reinvent (two of three deep dives)
    because sampling is replaced; ladder automate. Armanino acts as a risk advisory provider on client SOX and
    internal audit work; its figures are practitioner estimates in a vendor story. KPMG says management's
    25-item sample adds little when the auditor can test 100%.

- id: assurance-controls-testing-09
  title: Continuous, year-round control testing and monitoring instead of point-in-time cycles
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  change_scope: process
  ladder: automate
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Testing bunched at interim and year-end finds failures months after they occur, often during the external
    audit, when remediation costs most and little time is left before the assessment date.
  solution: >-
    Agents test controls as evidence arrives through the year, and scheduled queries watch control data and
    route exceptions to owners (continuous controls monitoring). Snowflake Internal Audit runs queries on
    Snowflake data through the Optro connector, with results shown in each control's view; Klaviyo tests
    throughout the year with Optro Autonomous Testing; Fieldguide agents can start automatically when evidence
    is uploaded. Practitioners frame a three-lines split: the first line runs monitoring and internal audit
    tests how reliable that monitoring is. KPMG and Grant Thornton position continuous testing as the target
    SOX model.
  outcomes:
    - {lever: risk, description: "Klaviyo's internal audit VP: testing throughout the year catches issues earlier and speeds remediation with control owners (qualitative)", figure: "not quantified", source_ref: OPTRO-LAUNCH}
    - {lever: speed, description: "Snowflake Internal Audit: reduced controls testing time and earlier remediation (qualitative)", figure: "not quantified", source_ref: OPTRO-SNOW}
  prerequisites:
    - "Control-relevant data in a queryable store, with risk-to-control-to-data-source mappings"
    - "People who understand both the data and the risk design the queries; start with one or two high-impact use cases (Snowflake Head of Internal Audit)"
    - "Automated evidence feeds and alert routing to named owners"
  risks_and_guardrails:
    - "Precision thresholds to avoid alert noise; named owners and service levels for alerts (Grant Thornton)"
    - "Human-approved criteria for when AI may auto-clear an item and when it must route to review (Grant Thornton)"
    - "Independence: internal audit should test the first line's monitoring, not run it (KPMG)"
    - "Model drift can make an effective control ineffective with no visible system change (KPMG)"
    - "External auditors and regulators have not given blanket approval for AI-driven SOX compliance (Grant Thornton)"
  human_checkpoints:
    - "Owner triage of each alert"
    - "Periodic (for example quarterly) human review of exceptions and of agent configuration changes"
    - "Auditor conclusion on operating effectiveness"
  role_evolution: >-
    Internal audit moves from re-performance to assuring the first line's monitoring and advising on control
    design; the ICFR team monitors a running view of control health rather than working in cycles.
  evidence_grade: B
  sources:
    - {ref: OPTRO-SNOW, title: "How Snowflake Uses Continuous Monitoring to Proactively Identify Risk", publisher: "Optro (originally AuditBoard)", type: vendor, url: "https://optro.ai/blog/snowflake-success-story", date: "2024-02-27"}
    - {ref: OPTRO-LAUNCH, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14"}
    - {ref: GT-SOX, title: "The power of AI in efficient SOX compliance", publisher: "Grant Thornton", type: firm, url: "https://www.grantthornton.com/insights/articles/advisory/2025/the-power-of-ai-in-efficient-sox-compliance", date: "2026-07-21"}
    - {ref: FG-AGENTS, title: "Field Agents for Testing", publisher: "Fieldguide Help Center", type: vendor, url: "https://help.fieldguide.io/en/articles/12292640-field-agents-for-testing", date: "2026-06-24"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-10, discourse-07 and governance-05. Snowflake's monitoring is query-based analytics
    more than GenAI; it is included as the data base agentic testing builds on. The Snowflake page is dated
    27 Feb 2024 (verifier corrected the date from '2026'), so it predates agentic testing.

- id: assurance-controls-testing-10
  title: AI secondary review and multi-agent challenge of control-testing workpapers
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    CAE and manager review is a bottleneck, so small teams only re-review the riskiest workpapers and
    completeness and consistency errors slip through ("the fiftieth workpaper"). Judging whether a bundle of
    evidence is sufficient for a control needs scarce expertise. Auditors are also less skeptical of work done
    by tools than of the same work by a colleague (automation bias).
  solution: >-
    FJ Management Internal Audit connects Claude to its Optro audit record through MCP (a standard connector
    between AI tools and business systems). Versioned, activity-specific review prompts encode methodology,
    scope, severity taxonomy and evidence-sufficiency rules. Several models review the same walkthrough
    workpaper independently and a reconciliation prompt flags where they disagree; a human checks the memo
    before it is attached to the workstep. A research prototype, IntelliAudit, adds a 'defender' agent that
    looks for mitigating evidence and a 'judge' agent that resolves disagreements and absorbs auditor feedback.
  outcomes:
    - {lever: quality, description: "FJ Management: review memos attached to worksteps caught actual defects; plan to move to 100% secondary review (qualitative)", figure: "not quantified", source_ref: OPTRO-FJM}
    - {lever: quality, description: "IntelliAudit research prototype (ISO 27001, 14 controls, 4 simulated organisations): final statuses unchanged from the single auditor-agent label (an internal consistency measure, not accuracy against human auditors); judge use; auditors' rating of explanations", figure: "91.7% unchanged; judge invoked in 10.4% of cases, all revisions stricter; explanations rated 3.92/5", source_ref: INTELLIAUDIT}
    - {lever: capacity, description: "Microsoft Internal Audit: internal quality-review effort cut (not attributed to a specific tool)", figure: "~-50%", source_ref: MSFT-IA}
  prerequisites:
    - "Audit record held in structured fields, not Word or Excel attachments ('structured fields over attachments')"
    - "MCP or API access from enterprise AI tools to the audit system"
    - "A small set of benchmark evidence bundles to calibrate sufficiency judgments"
  risks_and_guardrails:
    - "Model disagreement is treated as a signal for human investigation"
    - "Prompt versioning so the applied review standard is auditable"
    - "FJ Management rule: 'AI drafts and detects, but people decide'"
    - "IntelliAudit: sufficiency judgments were the weakest area; auditor feedback corrected overly permissive results"
    - "Automation bias: in an experiment, a counter-arguing mindset intervention reduced auditors' loss of skepticism toward tool output (Peters)"
  human_checkpoints:
    - "Human reviews each AI memo before it is attached"
    - "Severity, materiality and sign-off stay with auditors"
    - "Reviewer forms an independent expectation before reading tool conclusions"
  role_evolution: >-
    CAE review shifts from line-by-line checking to judgment calls, with the aim of removing the CAE review
    bottleneck; auditors investigate model disagreements rather than read every artefact.
  evidence_grade: B
  sources:
    - {ref: OPTRO-FJM, title: "FJ Management advances its agentic audit strategy with Optro", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/fj-management-success-story", date: "2026-09-22"}
    - {ref: MSFT-IA, title: "AI solution overviews: Internal Audit", publisher: "Microsoft (Frontier Finance)", type: firm, url: "https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/mcaps/documents/fy26/Internal-Audit.pdf", date: "2026"}
    - {ref: INTELLIAUDIT, title: "IntelliAudit: Using Large Language Models to Evaluate Audit Controls", publisher: "arXiv (2608.07688)", type: academic, url: "https://arxiv.org/html/2608.07688v1", date: "2026-08-07"}
    - {ref: PETERS, title: "Auditor automation usage and professional skepticism (working paper)", publisher: "Tilburg University (C. Peters)", type: academic, url: "https://research.tilburguniversity.edu/en/publications/auditor-automation-usage-and-professional-skepticism/", date: "2022-12-09"}
    - {ref: ICAEW-FRC, title: "How helpful is FRC guidance on generative and agentic AI?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-11, governance-14 (IntelliAudit idea, grade D) and governance-19 (idea:
    structured skepticism prompts, folded in as a guardrail). IntelliAudit is not peer reviewed and used a
    small simulated sample. ICAEW notes the FRC guidance covers automation bias in a single paragraph.

- id: assurance-controls-testing-11
  title: AI-assisted testing in SOC 1 / SOC 2 / ISAE 3402 service-auditor engagements
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, document-production, coordination-scheduling]
  pattern: document-to-decision
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Service-auditor engagements (SOC reports on a service organisation's controls, used by its customers and
    their auditors) test high volumes of ITGC evidence such as change tickets and depend on control owners'
    time. KPMG UK says demand for controls assurance reports nearly doubled in a year (90% over 2023-24); in its benchmark of 180+ reports, 90% of operating-effectiveness exceptions fell on manual
    controls and 39% on system access and authorisation.
  solution: >-
    KPMG UK uses Clara AI custom agents for walkthrough preparation, test-plan drafting and collating reviewer
    comments on the description of service; DataSnipper to extract details from high volumes of IT change
    tickets into testing tables; M365 Copilot for meeting recaps, Excel analysis and workpaper drafting; and
    KPMG Clara Collaboration as an evidence portal. Fieldguide markets testing agents to SOC and HITRUST practices.
  outcomes:
    - {lever: speed, description: "KPMG UK recent engagements: testing time reduced by automating control analysis, evidence extraction and standard documentation", figure: "~18%", source_ref: K-UKCA}
    - {lever: speed, description: "KPMG UK engagement team using DataSnipper on controls testing", figure: "~15% less testing time", source_ref: K-UKCA}
  prerequisites:
    - "Firm-approved tools in a secure environment; risk-based access to client evidence"
  risks_and_guardrails:
    - "Teams check that outputs still reflect auditor judgment (KPMG UK)"
    - "AICPA TQA 9561 (Sep 2026) adds no AI-specific SOC criteria; scope follows how AI affects in-scope services"
  human_checkpoints:
    - "Service auditor reviews all extracted data and conclusions; the opinion is unchanged"
  role_evolution: >-
    Analysts spend less time extracting from tickets and more on judgmental areas and communication with
    engagement sponsors.
  evidence_grade: A
  sources:
    - {ref: K-UKCA, title: "Reimagining Controls Assurance with AI: Latest Insights for Leaders", publisher: "KPMG in the UK", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/uk/pdf/2026/01/reimagining-controls-assurance-with-ai.pdf.coredownload.inline.pdf", date: "2026-01"}
    - {ref: FG-FRAZIER, title: "Frazier Deeter reclaims the judgment work at the heart of HITRUST (search extract only; page returned 404)", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/case-studies/frazier-deeter-reclaims-the-judgment-work-at-the-heart-of-hitrust", date: "2026"}
    - {ref: SD-TQA, title: "AI in SOC Examinations: What the AICPA's New TQA Section 9561 Means for Service Organizations", publisher: "Schneider Downs", type: firm, url: "https://schneiderdowns.com/our-thoughts-on/ai-in-soc-examinations-what-the-aicpas-new-tqa-section-9561-means-for-service-organizations/", date: "2026-09-30"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-07. KPMG UK percentages are firm-reported for 'recent engagements' with no sample size given.
    search only: FG-FRAZIER (page returns 404; search extracts report HITRUST controls testing ~40% faster, 71
    hours). Verifier moved that figure out of the outcomes because it could not be opened, and removed an
    unsupported 'without a matching rise in staff' clause.

- id: assurance-controls-testing-12
  title: AI drafting in the SOC cycle (Section 3 system descriptions, evidence tracking, responses to deviations)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [document-production, coordination-scheduling]
  pattern: draft-review-loop
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Every SOC cycle, service organisations and their advisers draft and update the Section 3 system description
    (management's description of the system being examined), map it to the Trust Services Criteria (TSC, the
    AICPA criteria for SOC 2), collect evidence snapshots, and write management responses to deviations.
  solution: >-
    GenAI consolidates process and procedure documents into draft control descriptions and maps them to the
    TSC, drafts structured management responses (root cause, remediation, timelines), turns meeting notes into
    action items, tracks evidence collection and project status, and keeps continuous evidence snapshots.
  outcomes:
    - {lever: capacity, description: "Live poll at the 2026 EY SOC conference: share of attendees naming each as a top AI use case in SOC reporting (evidence collection / Section 3 updates / deviation responses / project management)", figure: "63% / 45% / 41% / 29%", source_ref: EY-SOC}
  prerequisites:
    - "Approved enterprise AI tool with confidentiality controls over client evidence"
    - "Prior SOC reports, policies and an AI inventory as source material"
  risks_and_guardrails:
    - "EY speakers: AI 'may invent details and fill in blanks' even when told not to; agents may change behaviour to work around anomalies"
    - "TQA 9561: AI is in scope only where it affects in-scope services and controls; avoid scope inflation"
    - "AICPA Peer Review Board: templated SOC 2 work is nonconforming"
  human_checkpoints:
    - "Management owns the description and responses"
    - "Service auditor tests independently and evaluates deviations"
  role_evolution: >-
    Drafting moves to review: client-side GRC staff do more of the first draft, and SOC managers check
    AI-drafted descriptions against the system as it actually operates.
  evidence_grade: C
  sources:
    - {ref: EY-SOC, title: "How AI assurance builds trust with SOC, attestation and certification (14th annual EY SOC, Attestation and Certification Conference highlights)", publisher: "EY", type: conference, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09"}
    - {ref: SD-TQA, title: "AI in SOC Examinations: What the AICPA's New TQA Section 9561 Means for Service Organizations", publisher: "Schneider Downs", type: firm, url: "https://schneiderdowns.com/our-thoughts-on/ai-in-soc-examinations-what-the-aicpas-new-tqa-section-9561-means-for-service-organizations/", date: "2026-09-30"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-08, discourse-11 and governance-11. The poll covers conference attendees with
    multiple selections allowed; it is not a representative survey. Mostly management-side work around the SOC
    examination.

- id: assurance-controls-testing-13
  title: AI review of third-party SOC reports for user-entity reliance (scope, deviations, CUECs)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: document-to-decision
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    SOX programmes and user auditors read many vendor SOC 1 and SOC 2 reports to extract scope, test results,
    exceptions, bridge letters and complementary user entity controls (CUECs, the controls the customer must
    run for the vendor's controls to work), then map them to their own risk assessment.
  solution: >-
    AI reads SOC reports, extracts control descriptions and test results, compares them with the user's risk
    assessment and prior periods, and calls out deviations (EY speakers). KPMG lists agents that manage SOC
    reports and extract control descriptions and test results.
  outcomes:
    - {lever: speed, description: "Described as a current application by EY and KPMG; no deployment figures found", figure: "not quantified", source_ref: EY-SOC}
  prerequisites:
    - "Repository of vendor SOC reports and a mapping of CUECs to the user's control matrix"
  risks_and_guardrails:
    - "Omission or distortion in summaries (FRC risk taxonomy)"
    - "IFIAR: failure to assess reliance on the work of others is a recurring finding category"
    - "Traditional SOC review was not designed for vendor AI risk (KPMG)"
  human_checkpoints:
    - "Auditor or control owner concludes on reliance, evaluates the effect of deviations and tests CUECs"
  role_evolution: "Third-party-risk and SOX staff move from extraction and reading to evaluation and vendor-risk judgment."
  evidence_grade: C
  sources:
    - {ref: EY-SOC, title: "How AI assurance builds trust with SOC, attestation and certification (14th annual EY SOC, Attestation and Certification Conference highlights)", publisher: "EY", type: conference, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09"}
    - {ref: K-AGENTIC, title: "Seize the future: The agentic shift in SOX compliance", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2025/seize-the-future-the-agentic-shift-in-sox-compliance.html", date: "2025-08"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
  last_reviewed: "2026-10-16"
  notes: "Merged from practice-16 and governance-12. Maturity set to piloting (practice said emerging, governance piloting). Verifier added K-SOX30 as the source for the vendor-AI SOC review guardrail."

- id: assurance-controls-testing-14
  title: Compliance-automation platforms feeding SOC 2 examiners with continuously pulled evidence
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  change_scope: process
  ladder: automate
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Clients submit dozens of screenshots and spreadsheets per SOC engagement, and SOC 2 is a gating requirement
    for enterprise sales, so speed is prized.
  solution: >-
    Compliance-automation tools connect to the client's systems and pull evidence into a real-time dashboard
    that the CPA examiner tests against. The debate is about where this automation replaces the examiner's
    own risk assessment and testing.
  outcomes:
    - {lever: speed, description: "SOC leaders agree the tools make the process quicker and more efficient (no figure)", figure: "not quantified", source_ref: JOFA-FAST}
  prerequisites:
    - "An independent examiner who designs their own procedures"
    - "A risk assessment tailored to each client"
  risks_and_guardrails:
    - "AICPA Peer Review Board reviewer alert (May 2026; enhanced oversight from 1 June 2026): identical reports, risk assessments, sample sizes or procedures across clients can be judged nonconforming"
    - "AICPA ethics guidance: watch engagement terms that shift control, judgment or evidence access to the tool provider"
    - "Delve allegations (unproven and denied): near-identical text in 493 of 494 reports and conclusions generated before observation periods ended"
    - "Peer reviewers may select about five engagements from different partners and look for identical procedures"
  human_checkpoints:
    - "A licensed CPA designs and executes the tests and signs the opinion"
  role_evolution: >-
    High-volume SOC practices face peer-review scrutiny; a member of the AICPA SOC 2 Working Group warns that
    full financial audits may be targeted next.
  evidence_grade: C
  sources:
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14"}
    - {ref: JOFA-PODSOC, title: "The risks of quick-turn SOC engagements and what CPAs should know (A. Pawlicki)", publisher: "Journal of Accountancy podcast (AICPA)", type: podcast, url: "https://www.journalofaccountancy.com/podcast/2026/apr/the-risks-of-quick‑turn-soc-engagements-and-what-cpas-should-know/", date: "2026-04-30"}
    - {ref: IANS-DELVE, title: "Delve Allegations Expose Weak Points in Compliance", publisher: "IANS Research", type: press, url: "https://www.iansresearch.com/resources/all-blogs/post/security-blog/2026/03/30/delve-allegations-expose-weak-points-in-modern-compliance", date: "2026-03-24"}
    - {ref: CCI-DELVE, title: "SOC 2 Is Broken. The Delve Scandal Is Showing Us How. (C. Chio)", publisher: "Corporate Compliance Insights", type: press, url: "https://www.corporatecomplianceinsights.com/soc-2-broken-delve-scandal-shows/", date: "2026-05-21"}
  last_reviewed: "2026-10-16"
  notes: >-
    From discourse-12. Included because it is the most contested change in SOC controls testing. The use case
    is real; the risk is automation replacing the examiner's own testing. The Delve allegations are unproven
    and denied. The JofA podcast URL contains a non-standard hyphen as given in the input.

- id: assurance-controls-testing-15
  title: Testing controls that AI performs (AI-enabled controls as a new ICFR and SOC test object)
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, software-systems, expert-judgment]
  pattern: other
  change_scope: process
  ladder: assist
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Clients now put GenAI and agents into ICFR-relevant processes (matching, reconciliations, postings,
    approvals, review controls, ERP agents), and service organisations embed AI in the services they deliver.
    Audit programmes mostly test around the AI, and there is no accepted method for testing a black-box
    control. KPMG also expects AI-driven preventive controls that detect and fix anomalies in real time, which
    a sample of manual reviews cannot test.
  solution: >-
    Auditors scope the AI components (model, data pipelines, orchestration, agents, platforms) per use case and
    decide whether management relies on AI output (COSO's reliance versus non-reliance). They extend access,
    change-management and operations ITGCs to those components, for example checking that ERP user-access
    reviews cover native, UI-driven and headless agents, and putting change control on prompts, thresholds and
    retrieval corpora. AI-specific evidence includes lineage, per-inference logs (model version, prompt hash,
    tool calls), drift monitoring, change tickets for model deployment and subprocessor risk. COSO supplies
    control-testing templates for eight capability types. For embedded, self-correcting controls, testing
    shifts to configuration, data logic and the conditions under which automation fails or is bypassed, with
    more weight on test of design. In SOC work, TQA 9561 says scope follows whether AI affects in-scope
    services, the SOC 1 description covers AI that is part of the services, and third-party AI providers that
    perform functions within the system are assessed under the subservice-organisation framework. KPMG UK is introducing a SOC 2+ opinion over AI governance and controls; the
    AICPA practice aid Part 1 helps auditors understand AI-affected controls.
  outcomes:
    - {lever: risk, description: "KPMG expects the first wave of AI-related material weaknesses as SOX programmes stop testing around AI", figure: "2027 (forecast)", source_ref: K-SOX30}
  prerequisites:
    - "Client AI inventory mapped to processes, assertions, key controls and the system boundary"
    - "Logging that produces evidence of agent actions"
    - "IT audit specialists who can read model and agent logs; updated subservice-organisation roster for SOC work"
  risks_and_guardrails:
    - "Model drift can make an effective control ineffective with no visible system change (KPMG)"
    - "A human approval that rubber-stamps AI output adds no control value (KPMG)"
    - "COSO: separate who configures the AI from who approves its outputs; where reliance exists, keep prompt, configuration, model version and sampling rationale"
    - "CSA: a clean SOC 2 Type II can carry zero tested controls on model accuracy or drift, and practitioner overlays are inconsistent"
    - "Agents acting without a human request create an accountability gap under access and change criteria (CSA)"
    - "Avoid scope inflation: productivity AI outside the system boundary stays out (TQA 9561)"
  human_checkpoints:
    - "Auditor's reliance decision on AI-dependent controls"
    - "IT audit specialist judgment on scoping and on model-validation evidence"
    - "Service auditor's scoping and description-criteria judgment"
  role_evolution: >-
    IT auditors need to be as comfortable in configuration and model logs as in a ledger; KPMG says these
    skills are not core to the CPA curriculum. SOC teams need AI-literate IT auditors.
  evidence_grade: C
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/generative-ai", date: "2026-02-23"}
    - {ref: JOFA-COSO, title: "COSO creates audit-ready guidance for governing generative AI", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/feb/coso-creates-audit-ready-guidance-for-governing-generative-ai/", date: "2026-02-26"}
    - {ref: AICPA-PA, title: "AICPA releases guidance to help auditors address the use of AI in financial reporting and auditing", publisher: "AICPA & CIMA", type: professional-body, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13"}
    - {ref: JOFA-EVAL, title: "A new frontier: CPAs as AI system evaluators", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/nov/a-new-frontier-cpas-as-ai-system-evaluators/", date: "2025-11-01"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: K-404A, title: "The 404(a) opportunity", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/404-opportunity.pdf", date: "2026-08"}
    - {ref: K-UKCA, title: "Reimagining Controls Assurance with AI: Latest Insights for Leaders", publisher: "KPMG in the UK", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/uk/pdf/2026/01/reimagining-controls-assurance-with-ai.pdf.coredownload.inline.pdf", date: "2026-01"}
    - {ref: BDO-ITGC, title: "Artificial Intelligence: IT Audit Considerations with Focus on Information Technology General Controls", publisher: "BDO USA", type: firm, url: "https://www.bdo.com/insights/assurance/artificial-intelligence-it-audit-considerations-with-focus-on-information-technology-general-control", date: "2026-07-20"}
    - {ref: CSA-SOC2, title: "The SOC 2 AI Gap: Auditors Improvise Where AICPA Has Not Acted", publisher: "Cloud Security Alliance", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-soc2-ai-controls-gap-20260830-csa-styled/", date: "2026-08-30"}
    - {ref: SD-TQA, title: "AI in SOC Examinations: What the AICPA's New TQA Section 9561 Means for Service Organizations", publisher: "Schneider Downs", type: firm, url: "https://schneiderdowns.com/our-thoughts-on/ai-in-soc-examinations-what-the-aicpas-new-tqa-section-9561-means-for-service-organizations/", date: "2026-09-30"}
    - {ref: KOKINA, title: "Challenges and opportunities for artificial intelligence in auditing: evidence from the field (abstract)", publisher: "International Journal of Accounting Information Systems 56", type: academic, url: "https://ideas.repec.org/a/eee/ijoais/v56y2025ics1467089525000107.html", date: "2025"}
    - {ref: UNIQUS, title: "What the SEC's Filer Status Overhaul Means for ICFR Governance", publisher: "Uniqus", type: firm, url: "https://uniqus.com/what-the-secs-filer-status-overhaul-means-for-icfr-governance/", date: "2026-06-04"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-15, discourse-13, governance-09, governance-10 (SOC scoping of AI) and discourse-15
    (idea: testing self-healing embedded controls). Pattern 'other': assurance over controls that AI performs;
    proposed as a new pattern. A field study of large audit firms (Kokina et al. 2025, 22 interviews) found
    'simple AI' such as document extraction widely used in audits while 'complex AI' tools were still being
    developed. Uniqus suggests companies with agentic AI in the close may want to keep a
    voluntary 404(b) attestation if the SEC filer-status proposal is adopted. TQA 9561 text was not read
    directly (known via Schneider Downs and CSA).

- id: assurance-controls-testing-16
  title: Firm-wide audit-platform agents extending into tests of controls in integrated audits
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  change_scope: process
  ladder: delegate
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    External auditors repeat walkthroughs and tests of controls every year across very large engagement
    portfolios at fixed or falling fees, and orchestrate tasks across many separate tools by hand.
  solution: >-
    Network-wide agent frameworks inside the firms' audit platforms extract data, analyse evidence, draft
    documentation and develop preliminary conclusions for professionals to review. Deloitte Omnia agents run
    such preliminary procedures; EY Canvas embeds a multi-agent framework in all audit phases; KPMG Clara has
    agents for substantive procedures, with controls-testing agents announced as next; PwC plans
    controls-testing automation on the Evidence Match pattern; Grant Thornton's Gtap platform starts with
    private-company audits.
  outcomes:
    - {lever: capacity, description: "EY: platform covers about 130,000 assurance staff and 160,000 engagements; end-to-end support targeted by 2028", figure: "130,000 staff; 2028", source_ref: CPAPA-EY}
    - {lever: capacity, description: "Deloitte: agentic framework in Omnia for about 85,000 practitioners", figure: "~85,000 practitioners", source_ref: DELOITTE-OMNIA}
