# Use cases: assurance / controls-testing
# Synthesised 2026-10-16 from the pilot landscape scan and the practice, discourse and governance deep dives
# (research/runs/pilot/). Source refs are canonical keys; the synthesis report maps each key back to the
# input files' own refs. Figures are self-reported or vendor-reported unless a note says otherwise.

- id: assurance-controls-testing-01
  title: AI-assisted walkthroughs that prepare, transcribe and draft process narratives from prior-year files
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Walkthroughs (tracing one transaction end to end to confirm how a control works) are repeated every year
    to confirm nothing changed, even when processes barely change. Following a transaction through a large
    organisation is laborious, documenting it is tedious, and the same system architecture is redrawn for
    every walkthrough.
  solution: >-
    PwC's Advanced Walkthrough Assistant ingests prior-year walkthroughs and current documents, drafts a
    tailored work plan, flags what is missing or changed, and drafts process and control documentation for
    review; PwC said it will be used on 2026 year-end audits. KPMG UK controls assurance teams use Clara AI to
    review control wording before the walkthrough and produce key attributes and a question list, and use
    Copilot to transcribe the walkthrough into flowcharts and process maps where permitted. AuditBoard (now
    Optro) turns walkthrough notes into narratives. KPMG's agentic SOX framework adds meeting scheduling and
    call transcription.
  outcomes:
    - {lever: experience, description: "KPMG UK: fewer meetings and follow-up requests for control owners (qualitative)", figure: "not quantified", source_ref: K-UKCA}
    - {lever: speed, description: "PwC: quicker work, but busy-season time savings are 'not that drastic yet' a year into its programme", figure: "not quantified", source_ref: CFODIVE-PWC}
  prerequisites:
    - "Prior-year walkthrough documentation and current process documents in machine-readable form"
    - "Firm methodology templates; tool certified for this use under ISQM 1 / QC 1000 (firm quality-management standards)"
    - "Client consent to record and transcribe meetings ('where permitted', KPMG UK)"
  risks_and_guardrails:
    - "FRC misinterpretation-of-output risk: auditors may read a tool's output as more complete than it is (the FRC's example is AI contract summaries; the same applies to AI-drafted narratives)"
    - "Change detection must not replace inquiry and observation; the auditor still confirms nothing changed"
    - "Transcription runs within Microsoft 365, not a separate AI system (KPMG UK)"
  human_checkpoints:
    - "Auditor performs or attends the walkthrough inquiry and observation"
    - "Reviewer approves the narrative, flowchart and design conclusion"
  role_evolution: >-
    Juniors move from transcribing narratives to verifying AI drafts against what they saw; reviewers focus on
    what changed against the prior year; more time goes on probing changes and challenging design.
  evidence_grade: B
  sources:
    - {ref: AT-PWC, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28"}
    - {ref: CFODIVE-PWC, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07"}
    - {ref: K-UKCA, title: "Reimagining Controls Assurance with AI: Latest Insights for Leaders", publisher: "KPMG in the UK", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/uk/pdf/2026/01/reimagining-controls-assurance-with-ai.pdf.coredownload.inline.pdf", date: "2026-01"}
    - {ref: AUDITBOARD-ACC, title: "AuditBoard Launches Accelerate, Delivering Enterprise-Grade AI Automation for GRC Teams", publisher: "AuditBoard (now Optro)", type: vendor, url: "https://auditboard.com/blog/auditboard-launches-accelerate-delivering-enterprise-grade-ai-automation-for-grc-teams", date: "2025-10-22"}
    - {ref: K-AGENTIC, title: "Seize the future: The agentic shift in SOX compliance", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2025/seize-the-future-the-agentic-shift-in-sox-compliance.html", date: "2025-08"}
    - {ref: OPTRO-ACT, title: "Why autonomous controls testing will redefine internal audit", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/autonomous-controls-testing-internal-audit", date: "2026-06-15"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-05, discourse-04 and governance-01. CFO Dive date taken from page metadata. KPMG's
    walkthrough agents (K-AGENTIC) are described without a named deployment.

- id: assurance-controls-testing-02
  title: Test-of-design support and AI-drafted control test plans
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [expert-judgment, document-production]
  pattern: draft-review-loop
  change_scope: step
  ladder: augment
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Breaking control descriptions into testable attributes and writing test plans is manual and uneven.
    Badly worded controls lead to follow-up requests and exceptions later. Design evaluation is
    judgment-heavy: IFIAR still records findings for failing to evaluate deficiency severity (11 in 2025)
    and for not adjusting testing after controls proved ineffective (6).
  solution: >-
    KPMG UK's Clara AI custom agents capture controls, draft a test plan for review, and score control
    descriptions against "what a good control looks like" as decision support, not a conclusion. Fieldguide
    agents draft test plans per row of the risk and control matrix (RCM, the list of risks and the controls
    that address them); Petual imports the RCM and runs the firm's own test procedures; PwC's dynamic controls
    testing generates test procedures that users review before execution (PwC page seen in search extracts only). The FRC uses AI evaluation of
    controls against design criteria, aggregated into an overall view of the control environment, as its
    worked example of task-specification risk; no public deployment of that aggregation step was found.
  outcomes:
    - {lever: quality, description: "KPMG UK: indicative control-wording score used as decision support; fuller attribute identification reduces follow-up requests", figure: "not quantified", source_ref: K-UKCA}
  prerequisites:
    - "Firm or internal audit methodology and 'good control' criteria written down for the model"
    - "Prompts that ask explicitly about interdependencies and shared points of weakness between controls (FRC)"
  risks_and_guardrails:
    - "The score is decision support only; the auditor owns the test-of-design conclusion (KPMG UK)"
    - "FRC: evaluating controls one by one and then aggregating may miss shared weaknesses and overstate control-environment effectiveness"
  human_checkpoints:
    - "Auditor approves the test plan before any testing runs"
    - "Auditor forms an independent view of design before comparing it with tool output (FRC review guidance)"
  role_evolution: >-
    Seniors edit, approve and challenge plans and design assessments instead of writing them; juniors start
    from a structured draft.
  evidence_grade: B
  sources:
    - {ref: K-UKCA, title: "Reimagining Controls Assurance with AI: Latest Insights for Leaders", publisher: "KPMG in the UK", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/uk/pdf/2026/01/reimagining-controls-assurance-with-ai.pdf.coredownload.inline.pdf", date: "2026-01"}
    - {ref: FG-AGENTS, title: "Field Agents for Testing", publisher: "Fieldguide Help Center", type: vendor, url: "https://help.fieldguide.io/en/articles/12292640-field-agents-for-testing", date: "2026-06-24"}
    - {ref: PETUAL-HOME, title: "Petual: Automate SOX Testing with AI (homepage)", publisher: "Petual", type: vendor, url: "https://www.petual.ai/", date: "2026"}
    - {ref: PWC-DCT, title: "Dynamic controls testing (search extract only; pwc.com blocked)", publisher: "PwC US", type: firm, url: "https://www.pwc.com/us/en/tech-effect/ai-analytics/dynamic-controls-testing.html", date: "2026"}
    - {ref: FRC-GENAI, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30"}
    - {ref: IFIAR-2025F, title: "2025 Survey of Inspection Findings (report)", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-06 and governance-13 (an idea, grade D, on AI test-of-design evaluation with
    aggregation). search only: PWC-DCT (pwc.com returns 403) was seen in search extracts only, including its claimed
    30-40% effort reduction, which is not used here; the entry's grade rests on KPMG UK. Verifier (2026-10-16) removed
    an unverifiable PwC version-control guardrail.

- id: assurance-controls-testing-03
  title: Agent-assisted evidence requests (PBC) and pre-submission evidence checks
  archetype: assurance
  module: controls-testing
  function: service-delivery
  work_types: [coordination-scheduling, client-interaction]
  pattern: intake-triage
  change_scope: step
  ladder: augment
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Chasing evidence is a main source of SOX delay. Testers spend weeks requesting, chasing and re-requesting
    evidence from control owners across 20+ systems, and screenshots are captured by hand each quarter (start-up
    Arden's description). A SOX-tooling CEO (Zanin) estimates about one in five PBC requests (items "provided by
    client") come back wrong the first time.
  solution: >-
    Agents draft requests, check submitted evidence for completeness, file integrity and format, flag gaps and
    help preparers fix them before submission. Vendors describe next steps as pulling evidence directly through
    integrations or computer-use navigation of legacy systems, capturing required screenshots, and messaging
    control owners in Slack or Teams with pre-filled context. KPMG argues automated evidence collection may pay
    back sooner than automated testing.
  outcomes:
    - {lever: speed, description: "Optro: agent reduces evidence follow-up by clarifying requests before submission (vendor claim; automated evidence collection 'upcoming')", figure: "not quantified", source_ref: OPTRO-LAUNCH}
    - {lever: speed, description: "Frazier & Deeter: evidence requests faster with Fieldguide (search extract only)", figure: "~8% faster (19 hours)", source_ref: FG-FRAZIER}
  prerequisites:
    - "Evidence embedded in workflows or stored in standard repositories that tools can read (KPMG)"
    - "System access for agents, with credentials governed like any other user"
  risks_and_guardrails:
    - "Completeness and accuracy of client-provided information remains the auditor's responsibility"
    - "Access and segregation of duties for agents holding system credentials"
    - "AICPA Peer Review Board (May 2026): identical risk assessments, sample sizes and tests across SOC 2 clients can lead peer reviewers to judge engagements nonconforming"
    - "The AICPA SOC 2 Working Group warns against automated dashboard extraction replacing inquiry and testing (via CSA)"
    - "Evidence authenticity: AI-fabricated documents are a growing concern"
  human_checkpoints:
    - "Control owner confirms submissions"
    - "Auditor determines sufficiency; the platform does not decide what evidence is enough"
  role_evolution: "Seniors spend less time chasing PBC lists and more on design questions and exceptions."
  evidence_grade: C
  sources:
    - {ref: OPTRO-LAUNCH, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14"}
    - {ref: RSM-BEACON, title: "RSM Beacon: Automated control testing platform", publisher: "RSM US", type: firm, url: "https://rsmus.com/services/risk-fraud-cybersecurity/automated-control-testing.html", date: "2026"}
    - {ref: K-SOX30, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24"}
    - {ref: CPAPA-ZANIN, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents (A. Zanin)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=188703", date: "2026-08-18"}
    - {ref: YC-ARDEN, title: "Arden: AI-native internal audit firm", publisher: "Y Combinator", type: vendor, url: "https://www.ycombinator.com/companies/arden", date: "2026"}
    - {ref: YC-MIDSHIP, title: "Midship - AI for SOX Testing (YC launch post)", publisher: "Y Combinator", type: vendor, url: "https://www.ycombinator.com/launches/OOf-midship-ai-for-sox-testing", date: "2025-09-15"}
    - {ref: FG-FRAZIER, title: "Frazier Deeter reclaims the judgment work at the heart of HITRUST (search extract only; page returned 404)", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/case-studies/frazier-deeter-reclaims-the-judgment-work-at-the-heart-of-hitrust", date: "2026"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14"}
    - {ref: IIAF-FRAUD, title: "Internal Audit and AI-Enabled Fraud", publisher: "Internal Audit Foundation & AuditBoard", type: survey, url: "https://www.theiia.org/globalassets/site/content/research/foundation/2026/internal-audit-and-ai-enabled-fraud/ia-and-ai-enabled-fraud-report-en.pdf", date: "2026-02-17"}
