- id: assurance-planning-risk-assessment-11
  title: Firm-platform agent frameworks that cover planning and risk identification (EY, Deloitte, KPMG, PwC, Grant Thornton)
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, expert-judgment, coordination-scheduling]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Separate point tools leave planning, risk assessment and testing disconnected, so risk views are not updated as
    work proceeds, and risk identification depends on what the team can read and analyse in the time available.
  solution: >-
    EY embedded a multi-agent framework in EY Canvas on 7 April 2026, saying it puts AI in all audit phases and
    addresses risks more dynamically, with end-to-end support expected by 2028. Deloitte says Omnia's agent network
    can analyse information to identify potential risk factors and develops preliminary conclusions for review. KPMG
    said GenAI integrated into KPMG Clara in July 2024 helps teams refine risk assessments, and said in April 2026 it
    would pilot orchestration agents from that summer on asset valuation and revenue-process testing. PwC expects a
    global agentic platform about 18 months after 2026, and Grant Thornton calls gtap the foundation for agents that
    orchestrate audit activity.
  outcomes:
    - {lever: capacity, description: "Reach, not effect: EY's platform covers the daily workflows of its assurance professionals and engagements", figure: "130,000 professionals; 160,000 engagements; 150+ countries and territories", measures: "population and engagements covered by EY Canvas per EY's release; not a measure of agent use or results", provenance: self-reported, source_ref: EY-CANVAS-2026}
    - {lever: capacity, description: "Adoption signal: the six large networks collectively reported growth in AI-enabled tools in 2025", figure: "about 30% year over year", measures: "year-over-year increase in AI-enabled tools reported collectively by the networks; IFIAR says reporting practices differ by network", provenance: independent, source_ref: IFIAR-TTF-2026}
  prerequisites:
    - "A single global platform and data foundation (EY Canvas on Microsoft Azure, Foundry and Fabric) (EY-CANVAS-2026)"
    - "A global training programme for audit and technology-risk staff (EY-CANVAS-2026)"
  risks_and_guardrails:
    - "IFIAR: as systems become more autonomous, auditors must keep responsibility to evaluate, validate and challenge decisions made by AI and explain key judgements (IFIAR-TTF-2026 p.5)"
    - "IFIAR members found it sometimes unclear whether monitoring responsibility sits with the network that built a tool or the member firm deploying it (IFIAR-TTF-2025)"
    - "EY says human judgment, scepticism and insight remain fundamental; KPMG says it maintains a high level of professional scepticism while deploying agents (EY-CANVAS-2026; KPMG-CLARA-2025)"
  human_checkpoints:
    - "Practitioners supervise and validate agent output; preliminary conclusions go to professionals for review (DELOITTE-OMNIA-2026)"
  role_evolution: >-
    EY describes a global upskilling programme for audit and technology-risk professionals (EY-CANVAS-2026); Deloitte
    adds a tutor mode for micro-training in the flow of work (DELOITTE-OMNIA-2026); PwC is hiring engineers it would
    not previously have hired into assurance (PWC-AT-2025).
  evidence_grade: B
  sources:
    - {ref: EY-CANVAS-2026, title: "EY launches enterprise-scale agentic AI to redefine the audit experience for the AI era", publisher: "EY", type: firm, url: "https://www.ey.com/en_ca/newsroom/2026/04/ey-launches-enterprise-scale-agentic-ai-to-redefine-the-audit-experience-for-the-ai-era", date: "2026-04-07", access: full, locator: "paragraphs 1-4 of the release"}
    - {ref: DELOITTE-OMNIA-2026, title: "Deloitte unveils connected agentic intelligence in Omnia to advance audit and assurance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/about/press-room/unveils-connected-agentic-intelligence-omnia-advance-audit-assurance.html", date: "2026-06-24", access: full, locator: "list of what the agents can do"}
    - {ref: KPMG-CLARA-2025, title: "KPMG advances AI integration in KPMG Clara smart audit platform", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/04/kpmg-advances-ai-integration-in-kpmg-clara-smart-audit-platform.html", date: "2025-04-22", access: full, locator: "section 'Today's announcement builds on', July 2024 item"}
    - {ref: BBL-KPMG-2026, title: "KPMG to test advanced AI agents in next phase for audits", publisher: "Bloomberg Law", type: press, url: "https://news.bloomberglaw.com/financial-accounting/kpmg-to-test-advanced-ai-agents-in-next-phase-for-audits", date: "2026-04-01", access: full, locator: "opening paragraphs (paywalled after the first section)"}
    - {ref: PWC-AT-2025, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28", access: full, locator: "paragraph on a global agentic platform within about 18 months"}
    - {ref: GT-GTAP-2026, title: "Grant Thornton launches gtap", publisher: "Grant Thornton LLP", type: firm, url: "https://www.grantthornton.com/insights/press-releases/2026/may/grant-thornton-launches-gtap-audit-transformation-us", date: "2026-05-07", access: full, locator: "paragraph beginning 'Grant Thornton built gtap to grow'"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "section 'Emergence of Agentic AI', p.5, and footnote 1"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "monitoring responsibility, pp.6-8"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-11 (B), discourse-08 (C) and the Deloitte and KPMG parts of governance-08 (C). The same
    platforms appear in assurance-controls-testing-16, which covers their use in tests of controls; this entry holds
    their planning and risk-identification use. Planning-specific agents are not itemised in any source beyond EY's
    'improve risk assessments' and Deloitte's 'identify potential risk factors' wording. EY: agents in all phases now,
    end-to-end by 2028. KPMG's orchestration is a pilot, read from an opening section only. The ladder (delegate)
    reflects the stated orchestration design, not a measured result.

- id: assurance-planning-risk-assessment-12
  title: "Idea: general-purpose chatbot drafts risks of material misstatement from the financial statements (tested, weak results)"
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Identifying risks of material misstatement at the financial-statement and assertion levels takes time, and a
    chatbot can produce a polished draft in seconds.
  solution: >-
    Idea tested by ICAEW, not a deployment: give a general-purpose chatbot the financial statements and ask for
    analytical review, red flags, risk identification and an ISA-referenced assessment. ICAEW's technical manager
    ran Copilot, Claude Sonnet 4 and Grok 3 once each on an AI-generated fictional retailer and concluded that the
    case for using chatbots to identify risks of material misstatement had not been made.
  outcomes:
    - {lever: quality, description: "None of three models performed risk assessment as a human auditor would. Copilot did not treat revenue as a risk area despite the ISA 240 presumption; Grok tied risks to assertions and ISAs and flagged going concern", figure: "0 of 3 separated financial-statement-level from assertion-level risks; 0 of 3 supplemented understanding through inquiry, observation or inspection; 3 of 3 rounded year-on-year changes inconsistently", measures: "counts of the three models tested, one run each on one fictional company; prompt wording changes results and a newer Grok version appeared after the test", provenance: independent, source_ref: ICAEW-PIERPOINT-2025}
    - {lever: speed, description: "Time to produce the risk and materiality report; not a quality measure", figure: "Copilot under 20 seconds; Grok about 1 min 15 s; Claude about 3.5 min", measures: "elapsed time per model for one report on one fictional retailer", provenance: independent, source_ref: ICAEW-PIERPOINT-2025}
  prerequisites:
    - "Prompts shaped with ICAEW's prompt guidance and a prompt enhancer, with added detail on rationale and output format (ICAEW-PIERPOINT-2025)"
  risks_and_guardrails:
    - "ISA (UK) 315 para 14 requires inquiries, analytical procedures, observation and inspection, and para 13 an approach not biased toward corroborative evidence; the chatbots could not supplement understanding through inquiry, observation or inspection (ISAUK315-2025 printed p.7; ICAEW-PIERPOINT-2025)"
    - "Polished output arrives fast, which can mask gaps (ICAEW-PIERPOINT-2025)"
    - "One model assumed a long-standing auditor relationship meant lower risk and missed a new finance director and high staff turnover as control-weakness indicators (ICAEW-PIERPOINT-2025)"
  human_checkpoints:
    - "ICAEW concludes human judgement is needed to interpret the output and decide the risks, because each model gave different answers (ICAEW-PIERPOINT-2025)"
  role_evolution: "Not addressed in the source."
  evidence_grade: D
  sources:
    - {ref: ICAEW-PIERPOINT-2025, title: "Testing Gen AI platforms: can they do audit work?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/testing-gen-ai-platforms-can-they-do-audit-work", date: "2025-09-24", access: full, locator: "sections 'Analytical review and risk of material misstatement' and conclusion"}
    - {ref: ISAUK315-2025, title: "ISA (UK) 315 (Revised July 2020): Identifying and Assessing the Risks of Material Misstatement, updated September 2025", publisher: "Financial Reporting Council", type: standard-setter, url: "https://media.frc.org.uk/documents/ISA_UK_315_Revised_July_2020_Updated_September_2025.pdf", date: "2025-09", access: full, locator: "paras 13-14, printed p.7"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea. Merged from practice-20 (D) and governance-09 (D). A practitioner-body test on fictional data, not a
    benchmark; models were from mid-2025. It is independent evidence of limits for the risk-identification step only.
    Publication date from the search listing and URL path.

- id: assurance-planning-risk-assessment-13
  title: "Idea: multi-agent restatement-risk scoring that fuses MD&A text, financial ratios and critical audit matters (research prototype)"
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Entity-level risk signals come from several evidence streams that can disagree, and point predictions say nothing
    about how well the streams agree.
  solution: >-
    Idea from a research preprint: UMAR uses three agents (MD&A text, financial ratios, critical audit matters), each
    giving a risk score with a calibrated uncertainty estimate, fused by an aggregator based on Dempster-Shafer
    evidence theory (a method for combining uncertain evidence) that also measures conflict between agents. The
    authors describe the output as potentially actionable and interpretable risk signals.
  outcomes:
    - {lever: quality, description: "On the authors' test set UMAR beat logistic regression, XGBoost, FinBERT and single- and dual-agent LLM baselines, with the lowest calibration error", figure: "AUROC 0.782; PR-AUC 0.341; expected calibration error 0.052", measures: "discrimination and calibration on 3,200 US 10-K firm-year observations (2019-2023), with financial restatement as the label; authors' own evaluation, not a live audit", provenance: independent, source_ref: ARXIV-UMAR-2026}
  prerequisites:
    - "Public-company filing text and ratios, and a restatement label for training, so as described it applies to listed US companies (ARXIV-UMAR-2026)"
  risks_and_guardrails:
    - "Preprint, not peer reviewed, abstract read only; the abstract reports no field test (ARXIV-UMAR-2026)"
    - "The label is a later restatement, not an auditor's planning judgement, so results do not show better planning decisions (deep dives' reading of the abstract)"
    - "FRC: output used as a conclusion rather than an input to judgement is a misuse risk (FRC-GENAI-2026 p.18)"
  human_checkpoints:
    - "Not described in the abstract (ARXIV-UMAR-2026)"
  role_evolution: "Not addressed in the source."
  evidence_grade: D
  sources:
    - {ref: ARXIV-UMAR-2026, title: "Multi-Agent Framework for Audit Risk Assessment with Explicit Uncertainty and Evidence Conflict Modeling", publisher: "arXiv (Wang et al.)", type: academic, url: "https://arxiv.org/abs/2606.15640", date: "2026-06-14", access: full, locator: "abstract"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, Mitigations and Illustrative Examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.18"}
    - {ref: ARXIV-FAB-2026, title: "FinancialAuditBench", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "abstract"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea. Merged from practice-22, discourse-12 and governance-06 (all D). Pattern 'other': multi-agent score fusion
    that produces a risk signal, not an audit workflow. The PR-AUC of 0.341 shows the precision ceiling. Companion
    benchmark: FinancialAuditBench (90 workpaper tasks, 11 frontier models) found agents complete much staff-level
    work but sometimes perform inappropriate procedures or write incorrect documentation; it covers workpaper work
    generally, not planning (ARXIV-FAB-2026).

- id: assurance-planning-risk-assessment-14
  title: GenAI as a sounding board in fraud risk assessment and fraud brainstorming
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Fraud risk assessment is vulnerable to cognitive bias, such as irrelevant information diluting the weight of
    relevant indicators, and brainstorming depends on the team's knowledge of schemes that have occurred elsewhere.
  solution: >-
    The AFM reports auditors at unnamed Dutch firms making their own fraud risk assessment for a sector or typology
    first, then using a GenAI tool to challenge it and remove blind spots. ISA (UK) 240 says automated tools may
    support the engagement team discussion, for example by identifying fraud risk factors through ratio benchmarking.
    A City of Charlotte internal auditor, presenting in a personal capacity at a state auditors' conference, showed a
    chatbot listing real cemetery and burial fraud cases (2018-2026) and drafting a table of schemes by likelihood,
    likely perpetrator, expected controls and audit tests for a cemetery-operations audit.
  outcomes:
    - {lever: quality, description: "Conference experiment: auditors' fraud risk ratings with and without ChatGPT when irrelevant information is added; the authors say ChatGPT 'neutralized' the dilution effect, which the means support only loosely", figure: "Without ChatGPT 8.00 vs 6.42 (p=0.007); with ChatGPT 8.91 vs 7.97", measures: "mean fraud risk rating on a 1-10 scale, relevant-only vs relevant-plus-irrelevant information, one client vignette, 66 auditors in an Indonesian professional programme; cell sizes conflict with the stated design, so weak evidence", provenance: independent, source_ref: INDO-ICOBUSS-2025}
    - {lever: quality, description: "none published for the practitioner demonstration", figure: "none published", measures: "the slides show outputs but no measure of quality, time or whether the outputs were used in an engagement", provenance: self-reported, source_ref: VLGAA-NUCCIO-2026}
  prerequisites:
    - "Auditors form their own assessment before consulting the tool (AFM-12BB-2025 p.31)"
    - "A policy on what client information may be entered into a GenAI tool (PCAOB-GENAI-2024 p.4)"
    - "Well-structured prompts (context, task, guidelines, output format) (VLGAA-NUCCIO-2026)"
  risks_and_guardrails:
    - "AS 2110 .49-.53 require key engagement team members, including the engagement partner, to discuss susceptibility to fraud, setting aside beliefs about management's honesty; a tool does not replace that discussion (governance deep dive's reading of AS2110-PCAOB-2026)"
    - "ISA (UK) 240 A9: automated tools do not replace the need to maintain scepticism and exercise judgement (ISAUK240-2026 printed p.22)"
    - "Auditors relying on work done by automated tools were less sceptical than when relying on the same work by a team member; a counterarguing mindset reduced the effect (PETERS-2022, working paper)"
    - "In ICAEW's test one model did not treat revenue recognition as a fraud risk, which ISA 240 presumes (ICAEW-PIERPOINT-2025)"
  human_checkpoints:
    - "Auditor makes the first assessment and uses the tool to test it (AFM-12BB-2025 p.31)"
    - "The auditor judges which schemes matter; the presenter's slides show the model did not explicitly apply COSO (VLGAA-NUCCIO-2026)"
  role_evolution: "Not addressed in the sources."
  evidence_grade: C
  sources:
    - {ref: AFM-12BB-2025, title: "12 building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "p.31, 'Good practice' box"}
    - {ref: ISAUK240-2026, title: "ISA (UK) 240 (Revised March 2026): The Auditor's Responsibilities Relating to Fraud in an Audit of Financial Statements", publisher: "Financial Reporting Council", type: standard-setter, url: "https://www.frc.org.uk/documents/9305/ISA_UK_240_Revised_March_2026_xuvAkap9.pdf", date: "2026-04-30", access: full, locator: "para 29 printed p.8; A9 p.22; A56 p.35"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "paras .49-.53"}
    - {ref: VLGAA-NUCCIO-2026, title: "Using Generative AI in Internal Audit (conference slides)", publisher: "Virginia Local Government Auditors Association (speaker, City of Charlotte NC)", type: conference, url: "https://vlgaa.starchapter.com/images/downloads/Documents/day_1___2___using_generative_ai_in_internal_audit___d._nuccio.pdf", date: "2026-04", access: full, locator: "slides 49-52 (Audit Planning: Fraud Brainstorming)"}
    - {ref: INDO-ICOBUSS-2025, title: "Artificial intelligence for fraud risk assessment in auditing (Sari and Noviyanti)", publisher: "5th International Conference on Business & Social Sciences (ICOBUSS), Surabaya", type: academic, url: "https://ojsicobuss.stiesia.ac.id/index.php/icobuss1st/article/download/684/618/1209", date: "2025-10", access: full, locator: "abstract; Tables 2 and 5"}
    - {ref: PETERS-2022, title: "Auditor automation usage and professional skepticism (working paper)", publisher: "Tilburg University", type: academic, url: "https://research.tilburguniversity.edu/en/publications/auditor-automation-usage-and-professional-skepticism/", date: "2022-12", access: full, locator: "abstract"}
    - {ref: ICAEW-PIERPOINT-2025, title: "Testing Gen AI platforms: can they do audit work?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/testing-gen-ai-platforms-can-they-do-audit-work", date: "2025-09-24", access: full, locator: "section on risk assessment (ISA 240 revenue recognition)"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff update on outreach activities related to the integration of generative AI in audits and financial reporting", publisher: "PCAOB staff", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p.4"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from governance-11 (C) and practice-18 (B). Graded C: the practice file graded the Charlotte slides B as a
    named practitioner, but the presenter speaks in a personal capacity, the setting is local-government internal
    audit, and the slides do not show the output was used on an engagement; the AFM observation names no firm. No
    external-audit firm is named using AI in fraud brainstorming, and no source describes AI inside a live
    brainstorming session. Open question for interviews. PDF creation date 13 April 2026 used for the slides.

- id: assurance-planning-risk-assessment-15
  title: "Idea: fraud risk assessment extended to AI-enabled fraud schemes and the authenticity of AI-generated evidence"
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Documents such as invoices and bank statements may now originate from or be altered by AI, and AI can be used to
    manipulate data or fabricate documents, which traditional fraud risk factors do not cover. In a survey of 373
    senior internal audit leaders, 85% rated AI-enabled fraud a moderate to high risk and 62% said their function was
    unprepared or minimally prepared to detect it.
  solution: >-
    Idea drawn from regulators and professional bodies: the fraud risk assessment and engagement team discussion add
    AI-enabled schemes (deepfake impersonation in wire authorisations, fabricated invoices, attempts to deceive
    auditors in confirmations, altered training data, models edited to classify fraudulent transactions as
    legitimate), consider whether AI or machine-learning algorithms initiate accounting entries (ISA (UK) 240 A101),
    and plan authenticity checks, including document authenticity technology where authenticity is in doubt (A36).
    The AICPA practice aid covers AI-enabled fraud risk (as reported), and the Anti-Fraud Collaboration, of which the
    CAQ is a member, had published a deepfake resource by April 2026.
  outcomes:
    - {lever: risk, description: "Survey of senior internal audit leaders on AI-enabled fraud (an adjacent population, not external audit)", figure: "85% moderate to high risk; 62% unprepared or minimally prepared; 36% moderately or very prepared", measures: "share of 373 senior internal audit leaders (372 for the preparedness question) responding to a Q4 2025 survey by the Internal Audit Foundation and Optro", provenance: independent, source_ref: IIAF-AIFRAUD-2026}
  prerequisites:
    - "Team members able to evaluate AI systems, with forensic and IT specialists where needed (ISAUK240-2026 A101)"
    - "Tools and skills: respondents cited lack of suitable tools (57%) and skills (55%) as the biggest obstacles (IIAF-AIFRAUD-2026, Figure 7 text)"
  risks_and_guardrails:
    - "IFIAR: auditors should be alert to deliberate or adversarial misuse of AI inside audited entities, including generating or manipulating data, documents or transactions (IFIAR-TTF-2026 p.10)"
    - "ISA (UK) 240 A101: AI or machine-learning algorithms that initiate accounting entries may raise susceptibility to management bias or other fraud risk factors (ISAUK240-2026 printed p.47)"
    - "IRBA warned that new AI tools can create more convincing false evidence or fabricated working papers (IRBA-AIUPDATE-2024 p.1)"
    - "Concern centres on visible threats such as phishing; synthetic identity fraud is less widely recognised (IIAF-AIFRAUD-2026)"
    - "ACFE benchmarking (via the CAQ): 7% of organisations feel more than moderately prepared to detect AI-powered fraud (CAQ-INSIDERMAY-2026)"
  human_checkpoints:
    - "Engagement team discussion with the engagement partner (ISAUK240-2026 para 29; AS2110-PCAOB-2026 .49-.53)"
  role_evolution: >-
    ISA (UK) 240 A101 says the auditor may assign forensic and IT specialists or more experienced individuals where AI
    or ML algorithms initiate entries (ISAUK240-2026). Survey respondents asked for continuous training and closer work
    with technology, cyber and risk teams (IIAF-AIFRAUD-2026).
  evidence_grade: D
  sources:
    - {ref: IIAF-AIFRAUD-2026, title: "Internal Audit and AI-Enabled Fraud (survey report)", publisher: "IIA Internal Audit Foundation with Optro", type: survey, url: "https://www.theiia.org/globalassets/site/content/research/foundation/2026/internal-audit-and-ai-enabled-fraud/ia-and-ai-enabled-fraud-report-en.pdf", date: "2026", access: full, locator: "executive summary; Figure 7 text; priority actions"}
    - {ref: ISAUK240-2026, title: "ISA (UK) 240 (Revised March 2026): The Auditor's Responsibilities Relating to Fraud in an Audit of Financial Statements", publisher: "Financial Reporting Council", type: standard-setter, url: "https://www.frc.org.uk/documents/9305/ISA_UK_240_Revised_March_2026_xuvAkap9.pdf", date: "2026-04-30", access: full, locator: "A36 printed p.30; A101 p.47"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.10"}
    - {ref: IRBA-AIUPDATE-2024, title: "Artificial intelligence audit risks mitigation update", publisher: "IRBA (South Africa)", type: regulator, url: "https://www.irba.co.za/upload/40_%20Artificial%20Intelligence%20Audit%20Risks%20Mitigation%20Update.pdf", date: "2024-09-19", access: full, locator: "p.1"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph on AI-enabled fraud risk"}
    - {ref: CAQ-INSIDERAPR-2026, title: "Audit Insider, April 2026", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/audit-insider-april-2026", date: "2026-04", access: full, locator: "item 'Fraud and Emerging Tech: The Deepfake Threat'"}
    - {ref: CAQ-INSIDERMAY-2026, title: "Audit Insider, May 2026", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/audit-insider-may-2026", date: "2026-05", access: full, locator: "item on ACFE benchmarking"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "paras .49-.53"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea. Merged from discourse-17 (D) and governance-12 (D). The survey is of internal audit leaders, not external
    audit teams. The IIAF report shows no release month (survey ran Q4 2025). Deepfakes used against auditors in
    confirmation procedures are routed to substantive-testing.

- id: assurance-planning-risk-assessment-16
  title: "Idea: general-purpose chatbot proposes the materiality benchmark, percentage and performance materiality"
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, data-reporting]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Setting overall and performance materiality needs a benchmark, a percentage and a rationale (ISA 320), and
    inspectors scrutinise year-on-year changes because fee pressure can push materiality up.
  solution: >-
    Idea tested by ICAEW, not a deployment: in the same single test as entry 12, three chatbots were asked to
    calculate financial-statement and performance materiality with their rationale. No firm, vendor or regulator
    source describes AI setting materiality in practice; MindBridge lists materiality as an input its risk assessment
    connects to, not a calculation it performs.
  outcomes:
    - {lever: quality, description: "Models proposed different benchmarks and factors for the same facts; Copilot's rationale may be a hallucination (its claim that revenue is less open to manipulation than operating profit) and it did not consider whether the entity was a public interest entity", figure: "Claude 5% of profit before tax; Copilot 0.75% of revenue", measures: "benchmark and percentage each model proposed for one fictional retailer in a single run; per-model performance-materiality figures are not reported because the article attributes both 60% and 75% to Claude", provenance: independent, source_ref: ICAEW-PIERPOINT-2025}
  prerequisites:
    - "Entity financials and context, with the prompt specifying rationale and output format (ICAEW-PIERPOINT-2025)"
  risks_and_guardrails:
    - "The answer depends on the model chosen and the prompt wording (ICAEW-PIERPOINT-2025)"
    - "Models rounded year-on-year percentage changes inconsistently (ICAEW-PIERPOINT-2025)"
    - "A tool could make a higher materiality look supported; PCAOB staff said 2025 inspections would evaluate significant year-over-year materiality changes and multi-location scoping because of fee pressure (PCAOB-PRIORITIES-2024 p.5; the staff statement does not mention AI)"
  human_checkpoints:
    - "ICAEW concludes human judgement is required to choose the benchmark and thresholds (ICAEW-PIERPOINT-2025)"
  role_evolution: "Not addressed in the sources."
  evidence_grade: D
  sources:
    - {ref: ICAEW-PIERPOINT-2025, title: "Testing Gen AI platforms: can they do audit work?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/testing-gen-ai-platforms-can-they-do-audit-work", date: "2025-09-24", access: full, locator: "sections on materiality and performance materiality"}
    - {ref: PCAOB-PRIORITIES-2024, title: "Spotlight: Staff priorities for 2025 inspections and interactions with audit committees", publisher: "PCAOB staff", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/documents/2025-priorities-spotlight_v3.pdf", date: "2024-12", access: full, locator: "p.5, 'Audit execution challenges'"}
    - {ref: MINDBRIDGE-ARA-2026, title: "MindBridge advances financial oversight for the agentic era with new platform capabilities", publisher: "MindBridge (Business Wire via BNN Bloomberg)", type: vendor, url: "https://www.bnnbloomberg.ca/press-releases/2026/09/22/mindbridge-advances-financial-oversight-for-the-agentic-era-with-new-platform-capabilities/", date: "2026-09-22", access: full, locator: "item 'Agentic Risk Assessment' (materiality listed among linked inputs)"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea. Merged from practice-21, discourse-15 and governance-10 (all D). The practice file reported Claude at 60%
    performance materiality; the discourse and governance files found the article internally inconsistent on that
    figure, so it is not used. Materiality is an unevidenced step: open question.

- id: assurance-planning-risk-assessment-17
  title: AI-supported scoping decisions, including group components
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, data-reporting]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Deciding which accounts, processes, locations and components are in scope is a judgment call made largely from
    prior-year files and team knowledge. In group audits, assessing risk across many entities, jurisdictions and
    systems with large data volumes is among the hardest parts.
  solution: >-
    PwC said in October 2025 it planned 'soon' to have a risk-assessment tool to help people make smarter decisions
    about what is scoped into the audit; the October 2026 follow-up article does not mention it. PCAOB staff reported
    in 2024 that firms saw scoping the audit as a potential area for GenAI. For group audits, Wolters Kluwer says
    automation can consolidate data from many systems, connected platforms can give a central view across the group,
    and AI can help prioritise exceptions and review unstructured documents so auditors focus on higher-risk areas;
    it describes no component-scoping method and names no customer.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "no source reports use or measurement", provenance: self-reported, source_ref: PWC-AT-2025}
  prerequisites:
    - "Risk-assessment data feeding the scoping decision (PWC-AT-2025)"
    - "Timely access to reliable data across components and coordination across component teams (WK-GROUP-2025)"
  risks_and_guardrails:
    - "PCAOB staff said 2025 inspections would evaluate the scoping of multi-location audits and materiality changes because fee pressure may lead auditors to cut hours (PCAOB-PRIORITIES-2024 p.5)"
    - "ICAEW notes regulators have criticised firms for raising materiality to reduce scope without adequate justification; the article makes no AI link (ICAEW-GROUP-2025)"
    - "The group engagement team remains responsible for evaluating results and deciding responses (WK-GROUP-2025)"
  human_checkpoints:
    - "PwC's tool 'helps people make decisions', so a person decides scope (PWC-AT-2025)"
    - "Group engagement team decides scoping and responses (WK-GROUP-2025)"
  role_evolution: >-
    Wolters Kluwer says tools let auditors spend more time on analysis, investigation and insight (WK-GROUP-2025).
  evidence_grade: C
  sources:
    - {ref: PWC-AT-2025, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28", access: full, locator: "paragraph beginning 'He added that PwC plans to soon have a tool'"}
    - {ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "absence of the tool in the October 2026 list"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff update on outreach activities related to the integration of generative AI in audits and financial reporting", publisher: "PCAOB staff", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p.4, list of potential areas"}
    - {ref: WK-GROUP-2025, title: "The future of group audits: How AI and technology are transforming audit quality", publisher: "Wolters Kluwer", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/group-audits-embracing-technology-and-adapting-to-change", date: "2025-04-03", access: full, locator: "sections on data management and on assessing risk and detecting fraud across entities"}
    - {ref: PCAOB-PRIORITIES-2024, title: "Spotlight: Staff priorities for 2025 inspections and interactions with audit committees", publisher: "PCAOB staff", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/documents/2025-priorities-spotlight_v3.pdf", date: "2024-12", access: full, locator: "p.5"}
    - {ref: ICAEW-GROUP-2025, title: "Auditing groups: a risk-based approach to component scoping", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/aug-2025/auditing-groups-a-risk-based-approach-to-component-scoping", date: "2025-08-29", access: full, locator: "article body (context only; no AI content)"}
    - {ref: IFIAR-SURVEY-2026, title: "Survey of inspection findings 2025", publisher: "IFIAR", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "PDF p.23, supplementary detail (group audit plan)"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-24 (C), discourse-06 (C), discourse-16 (C, group audits) and the PwC part of governance-08.
    No source on group-audit scoping mentions AI except one generic vendor article. IFIAR recorded three findings for
    failure to develop a group audit plan in each of 2024 and 2025, unrelated to AI (IFIAR-SURVEY-2026). Group scoping
    is an unevidenced step: open question. Fieldguide's internal-audit scoping agent is in entry 25.

- id: assurance-planning-risk-assessment-18
  title: Auto-populate the planning document from prior-year information and show what changed
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Planning documents are rebuilt each year from prior-year files, and auditors may not notice what has changed in
    the business. The FRC's 2026 annual review is reported to name over-reliance on prior-year approaches among the
    causes needing remediation.
  solution: >-
    PwC's Simplified Audit for Private Business ingests prior-year information and auto-populates a planning document
    that serves as a foundation for considering compliance with AICPA standards. It is built for private-company audits.
    PwC says it saves time and helps auditors ask better questions because they see what changed since the last audit;
    2025 was the first year PwC auditors used it in planning.
  outcomes:
    - {lever: speed, description: "PwC says the tool saves time and enables better questions", figure: "none published", measures: "qualitative statement by PwC's US assurance transformation leader at an October 2025 briefing", provenance: self-reported, source_ref: PWC-AT-2025}
    - {lever: speed, description: "Across PwC's audit tools, AI time savings so far are 'more of a shift' and 'not that drastic yet' (not specific to this tool)", figure: "none published", measures: "qualitative statement, October 2026", provenance: self-reported, source_ref: CFODIVE-PWC-2026}
  prerequisites:
    - "Prior-year audit information in a form the tool can ingest (PWC-AT-2025)"
  risks_and_guardrails:
    - "Roll-forward risk: in the CPA.com survey, 85% of firms prioritise rolling binders forward to save time and 60% carrying forward the prior-year risk assessment, while 64% prioritise challenging last year's procedures against the risk assessment (CPACOM-ATR-2025 PDF p.14)"
    - "AS 2110 .08 requires evaluating whether significant changes since prior periods affect the risks of material misstatement (AS2110-PCAOB-2026)"
    - "ISA (UK) 315 para 13 requires risk assessment procedures not biased toward corroborative evidence (ISAUK315-2025 printed p.7)"
    - "A risk rating should reflect the current engagement's circumstances, not carry forward the prior-year conclusion (WK-SAS145-2024); PwC does not discuss this failure mode"
  human_checkpoints:
    - "The document is a foundation for the auditor to consider; the source describes no review steps and planning judgments stay with the team (PWC-AT-2025)"
  role_evolution: >-
    In the same briefing PwC said it is hiring engineers into assurance and hopes for dual-track CPA and data-science
    entrants; that concerns PwC's wider AI programme, not this tool (PWC-AT-2025).
  evidence_grade: B
  sources:
    - {ref: PWC-AT-2025, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28", access: full, locator: "paragraphs 3-4 (Simplified Audit for Private Business)"}
    - {ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "section on where AI has an impact"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: "CPA.com (AICPA)", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p.14 (report p.13)"}
    - {ref: CPIA-ARAQ-2026, title: "Audit quality remains strong in 2026 - consistency is now the aim", publisher: "CPIA", type: press, url: "https://www.cpia.org.uk/news/frc-audit-quality-2026/", date: "2026-07-24", access: full, locator: "section 'Turning systems into better audits'"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "para .08"}
    - {ref: ISAUK315-2025, title: "ISA (UK) 315 (Revised July 2020): Identifying and Assessing the Risks of Material Misstatement, updated September 2025", publisher: "Financial Reporting Council", type: standard-setter, url: "https://media.frc.org.uk/documents/ISA_UK_315_Revised_July_2020_Updated_September_2025.pdf", date: "2025-09", access: full, locator: "para 13, printed p.7"}
    - {ref: WK-SAS145-2024, title: "SAS 145 risk assessment: How technology strengthens audit quality", publisher: "Wolters Kluwer", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/auditing-reimagined-sas-145-and-the-rise-of-technology-enabled-risk-management", date: "2024-03-19", access: full, locator: "section on documenting the risk assessment"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-04, discourse-03 and governance-03 (all B). PwC is a named firm describing the tool as in
    use; the statement is self-reported in a briefing report. Private-company audits under AICPA standards only. The
    FRC review finding is second-hand (CPIA commentary) and is not stated to concern AI.

- id: assurance-planning-risk-assessment-19
  title: In-file assistant that checks the planning file for gaps at planning review
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [review-assurance]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Gaps in the risk assessment, such as a variance no logged risk covers, are often found during fieldwork rather
    than at planning review.
  solution: >-
    In a scenario demonstrated at Caseware's CwX 2026, a reviewer opens a file for planning review and asks the Verity
    agent whether the team missed anything. The agent loads the trial balance, retrieves materiality, reviews the logged
    risks and flags a variance against the board minutes with no risk attached. Caseware describes it as a second set
    of eyes, with citation-backed suggestions and nothing written into the engagement without a person accepting,
    editing or rejecting it.
  outcomes:
    - {lever: speed, description: "Caseware reports early beta deployments cut indicative manual workflows from 15-20 minutes to under two minutes; not specific to planning review", figure: "15-20 min to under 2 min (up to 85% per interaction)", measures: "time for indicative manual workflows versus the same interaction with Verity in beta deployments", provenance: vendor-published, source_ref: CASEWARE-LAUNCH-2026}
    - {lever: quality, description: "Caseware reports accuracy on golden-dataset items captured from beta traces; not specific to planning", figure: "94%", measures: "accuracy on golden-dataset items, in the vendor's words; dataset size and scoring method not stated", provenance: vendor-published, source_ref: CASEWARE-LAUNCH-2026}
  prerequisites:
    - "Trial balance, materiality, risk log and board minutes held in the platform the assistant is embedded in (CASEWARE-AIDA-2026)"
    - "Firm methodology configured so the assistant follows it (CASEWARE-VERITY-2026)"
  risks_and_guardrails:
    - "Misinterpretation: a 'nothing missed' answer can be read as a complete risk assessment; the FRC lists misinterpretation of output and misunderstanding of methodology as distinct risks (FRC-GENAI-2026 p.18)"
    - "Accuracy and time figures are vendor-reported and not planning-specific (CASEWARE-LAUNCH-2026)"
  human_checkpoints:
    - "The reviewer accepts, edits or rejects each suggestion before anything enters the engagement (CASEWARE-AIDA-2026)"
  role_evolution: >-
    Caseware says juniors can reach standards and methodology in context and seniors can spend more time on
    higher-value review (CASEWARE-AIDA-2026). Partners from Withum, Citrin Cooperman and EisnerAmper piloted Verity on
    live engagements in the 2025 busy season (CASEWARE-VERITY-2026).
  evidence_grade: C
  sources:
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "planning review scenario paragraph; beta partner fireside chat"}
    - {ref: CASEWARE-AIDA-2026, title: "From AiDA to agentic: How Caseware's AI has evolved", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/resources/blog/from-aida-to-agentic-how-casewares-ai-has-evolved", date: "2026-07-28", access: full, locator: "sections 'Meet Caseware Verity' (CwX scenario) and 'Why it matters for your team'"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "paragraph beginning 'Early beta deployments'"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, Mitigations and Illustrative Examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp.18-19"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-03 (C) and governance-02 (C). The scenario is a conference demonstration; the named partners
    piloted Verity generally, not this scenario. Caseware states a goal of automating up to 50% of the engagement
    workflow across prepare, plan, validate and report (vendor goal, not a result) (CASEWARE-LAUNCH-2026).

- id: assurance-planning-risk-assessment-20
  title: Methodology-embedded, risk-based engagement platform with in-context AI guidance for mid-tier firms
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Mid-tier firms use disconnected tools and prior-year habits, and some surveyed firms say they still struggle to
    move from reliance on prior-year workpapers to a risk-driven approach.
  solution: >-
    EisnerAmper, Citrin Cooperman and PKF O'Connor Davies adopted the Dynamic Assurance Solution (DAS) suite, a
    risk-focused methodology built by the AICPA, CPA.com and Caseware that connects risk assessment, workpapers and
    reporting, now with Caseware Verity. PKF also joined an agentic pioneer programme to co-develop its own agents.
    EisnerAmper phased its roll-out with training.
  outcomes:
    - {lever: capacity, description: "Platform adoption, not an AI effect: EisnerAmper users and completed engagements on DAS", figure: "more than 1,100 professionals; over 1,500 engagements", measures: "EisnerAmper professionals using the DAS suite and client engagements completed on it, as of the 25 June 2026 release", provenance: vendor-published, source_ref: CASEWARE-EISNERAMPER-2026}
  prerequisites:
    - "Migration of data and methodology to the platform; each firm used CPA.com as implementation partner for planning, data migration, training and change management (CASEWARE-CITRIN-2026)"
    - "A phased roll-out with pilots and training; EisnerAmper says professional readiness came before speed (CASEWARE-EISNERAMPER-2026)"
  risks_and_guardrails:
    - "Caseware says AI outputs are traceable and explainable, within firm control and engagement boundaries (CASEWARE-VERITY-2026)"
    - "Firms cite training cost, documentation, planning time, senior involvement and client pushback as challenges of a risk-driven approach (CPACOM-ATR-2025)"
  human_checkpoints:
    - "Suggestions can be accepted, refined or overridden by the auditor (CASEWARE-LAUNCH-2026)"
  role_evolution: >-
    Citrin Cooperman's assurance innovation leader says seeing the reasoning behind procedures and conclusions helps
    staff build technical knowledge and judgment (CASEWARE-CITRIN-2026).
  evidence_grade: B
  sources:
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper leverages DAS powered by Caseware to unify audit and build an agentic future", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "paragraphs 1-6"}
    - {ref: CASEWARE-CITRIN-2026, title: "Citrin Cooperman adopts AI-enabled DAS suite powered by Caseware", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/citrin-cooperman-company-llp-adopts-ai-enabled-das-suite-powered-by-caseware-to-advance-audit-quality-professional-development-and-scalable-growth", date: "2026-07-13", access: full, locator: "paragraphs 1-6"}
    - {ref: CASEWARE-PKF-2026, title: "PKF O'Connor Davies adopts AI-enabled DAS suite powered by Caseware Verity and joins the Agentic Pioneer Program", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/pkf-oconnor-davies-adopts-ai-enabled-das-suite-powered-by-caseware-verity-and-joins-the-caseware-agentic-pioneer-program", date: "2026-10-08", access: full, locator: "paragraphs 1-4"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "paragraph on accepting, refining or overriding suggestions"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "paragraph on traceability and firm control"}
