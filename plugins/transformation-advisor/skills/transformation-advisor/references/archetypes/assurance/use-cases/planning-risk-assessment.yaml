# Use cases: assurance / planning-risk-assessment
# Synthesised 2026-10-16 from the wave 1 landscape scan and the practice, discourse and governance deep dives
# (research/runs/wave1/). Source refs follow PUBLISHER-SHORT-YYYY and reuse the input files' refs; where two inputs
# used different refs for one document, the synthesis report records the choice. Outcome figures are self-reported
# or vendor-published unless provenance says otherwise. No entry reaches grade A: no measured outcome from a named
# organisation was found for any planning or risk-assessment use of AI.
# Overlaps with the controls-testing pilot are referenced, not duplicated: walkthrough assistants are
# assurance-controls-testing-01, risk-scored coverage and sample targeting (including Optro's risk scoring) is
# assurance-controls-testing-04, and the PwC Australia AI-native pilot is assurance-controls-testing-17.

- id: assurance-planning-risk-assessment-01
  title: Summarise board minutes and other entity documents with cited output to focus risk identification
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Auditors read an entity's board minutes and similar documents to understand it and spot risk indicators.
    The volume is large, reading it all is slow, and relevant passages are easy to miss.
  solution: >-
    KPMG describes KPMG Clara AI assistants that review documents, for example meeting minutes, to flag possible
    accounting and financial risks (announced for 90,000 auditors in July 2024 and restated in April 2025). The
    FRC's worked example, written for a hypothetical firm, shows the design regulators expect: a tool segments and
    indexes the minutes with stable identifiers, summarises each meeting, looks across the whole period for themes,
    and writes a summary in which every point cites its source. Auditors use pre-written prompts from a central
    library and record on the file that the tool was used and how its output shaped further work. The Dutch AFM
    says nearly all firms it visited use GenAI, for example chatbots to summarise meeting minutes, without naming
    them.
  outcomes:
    - {lever: quality, description: "none published. KPMG gives no usage, accuracy or time figure; the FRC example sets none and names no firm", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: KPMG-CLARA-2024}
    - {lever: quality, description: "FRC: the tool need not be perfectly accurate to be certified, because the tolerance for output deficiencies is set by how much human review sits behind it", figure: "not quantified", measures: "design principle in a regulator's worked example, not a measurement", provenance: independent, source_ref: FRC-GENAI-2026}
  prerequisites:
    - "Minutes in digital form, segmented and indexed with stable identifiers so the tool can cite sources (FRC-GENAI-2026 p.44)"
    - "A central library of pre-written prompts maintained by specialists, tested at certification across entities of different sizes and sectors (FRC-GENAI-2026 pp.45-46)"
    - "Training on how to review the output, not only how to use the tool (FRC-GENAI-2026 p.46)"
    - "Access to engagement documents inside the firm platform (KPMG-CLARA-2024)"
  risks_and_guardrails:
    - "Omission, distortion and hallucination are the named output risks; the FRC example mitigates them with citation, staged summarisation, certification and review (FRC-GENAI-2026 p.44)"
    - "Misuse: auditors may read the summary as a complete account of the period and skip other risk assessment procedures; the mitigation is training on the output's scope (FRC-GENAI-2026 p.48)"
    - "The tool sounds fluent and confident even when wrong, so staff are trained on automation bias (the tendency to over-trust machine output) (FRC-GENAI-2026 p.46)"
    - "The FRC rates the non-compliant-methodology risk as relatively low here because the tool enhances an existing procedure and the rest of the methodology is unchanged (FRC-GENAI-2026 p.48)"
  human_checkpoints:
    - "The auditor reads the minutes to corroborate the completeness and accuracy of the output (FRC-GENAI-2026 p.46)"
    - "A closer read of the cited sections where output conflicts with prior understanding or bears on the risk assessment (FRC-GENAI-2026 p.46)"
    - "Review by a team member who understands the entity (FRC-GENAI-2026 p.46)"
  role_evolution: >-
    In the FRC example, training centres on reviewing outputs and resisting automation bias, because auditors use
    pre-written prompts and do not prompt the tool themselves (FRC-GENAI-2026 p.46). Team members become reviewers
    of a cited summary rather than first-pass readers of every minute (governance deep dive's reading of the example).
  evidence_grade: B
  sources:
    - {ref: KPMG-CLARA-2024, title: "KPMG announces AI integration into global smart audit platform, KPMG Clara", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2024/07/kpmg-announces-ai-integration-into-global-smart-audit-platform-kpmg-clara.html", date: "2024-07-29", access: full, locator: "bullet 'Refine risk assessments'"}
    - {ref: KPMG-CLARA-2025, title: "KPMG advances AI integration in KPMG Clara smart audit platform", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/04/kpmg-advances-ai-integration-in-kpmg-clara-smart-audit-platform.html", date: "2025-04-22", access: full, locator: "recap paragraph on the July 2024 GenAI integration"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, Mitigations and Illustrative Examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "Illustrative example 1, pp.42-48; misuse risk p.18"}
    - {ref: AFM-12BB-2025, title: "12 building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "p.31, use of (Gen)AI"}
    - {ref: BOARDAGENDA-FRC-2026, title: "Auditors warned they remain accountable despite use of AI", publisher: "Board Agenda", type: press, url: "https://boardagenda.com/2026/03/31/auditors-warned-they-remain-accountable-despite-use-of-ai/", date: "2026-03-31", access: full, locator: "paragraph listing current AI uses, including summarising minutes"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-01 (B), discourse-01 (D) and governance-01 (C). Grade B rests on KPMG's own present-tense
    statements that the capability is embedded for its auditors; KPMG gives no data on use of this feature. The
    discourse and governance files graded lower because the FRC example is hypothetical and the AFM names no firm.
    Board Agenda's listing of minutes summarisation among current uses is a journalist's summary of the FRC statement.
    The Newsfile copy of the April 2025 KPMG release is dated 23 April; the landscape and KPMG page give 22 April.

- id: assurance-planning-risk-assessment-02
  title: Enterprise and firm-grounded chat assistants for entity research and methodology questions during planning
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Building an understanding of the entity, its industry and its regulatory environment takes desk research and
    document reading before risk assessment can start (AS 2110 .07 and .11 expect it). Auditors also spend time
    finding firm-approved methodology and technical guidance and applying it consistently.
  solution: >-
    KPMG began deploying Copilot to audit partners and professionals in April 2024 and reported more than 2.175
    million Audit Chat conversations since its October 2023 launch, covering database search, contract extraction,
    document analysis and research. RSM says Microsoft 365 Copilot supports summarising information, drafting,
    meeting notes and document analysis, and its Ask Luca assistant answers questions grounded in firm-approved
    guidance. PwC describes ChatNational, a generative AI chatbot and research tool connected to its global research
    platform for accounting, auditing and reporting guidance. ICAEW notes auditors use simple chatbots to enhance
    their understanding of entities and their environments through research (no firm named), and PCAOB staff found
    in 2024 that firms' GenAI use focused on administrative and research activities.
  outcomes:
    - {lever: capacity, description: "Usage, not effect: KPMG partners and professionals held more than 2.175 million Audit Chat conversations", figure: "more than 2.175 million", measures: "Audit Chat conversations since the October 2023 launch, stated in May 2024 and recapped in April 2025; all uses, not planning-specific", provenance: self-reported, source_ref: KPMG-CLARA-2025}
    - {lever: speed, description: "RSM says Ask Luca helps auditors reduce research time and apply guidance more consistently", figure: "none published", measures: "qualitative statement by RSM's assurance digital leader", provenance: self-reported, source_ref: CAQ-RSM-2026}
    - {lever: capacity, description: "Adoption signal: tax and audit professionals who say they use AI tools regularly", figure: "81%", measures: "share of tax and audit respondents to Thomson Reuters Institute's 2026 Future of Professionals survey; sample size not given on the summary page", provenance: vendor-published, source_ref: TRI-FOP-2026}
  prerequisites:
    - "An approved enterprise tool under a use policy (CAQ-RSM-2026)"
    - "A curated corpus of firm-approved guidance for grounded answers (CAQ-RSM-2026)"
    - "Rules on what client information may be entered; PCAOB staff found some firms limit uploads and some bar GenAI on audit procedures for privacy and reliability reasons (PCAOB-GENAI-2024 p.4)"
    - "AI training before rollout; PwC says practitioners had training and model access for pre-approved work first (CFODIVE-PWC-2026)"
  risks_and_guardrails:
    - "More than one-third of tax and audit professionals admit using unauthorised AI tools (TRI-FOP-2026)"
    - "Hallucination can produce provisions that do not exist or differ from the source, a particular risk when interpreting law and accounting standards (FSA-DP-2025 p.13)"
    - "RSM says grounding in firm-approved guidance and experienced human review are vital (CAQ-RSM-2026)"
  human_checkpoints:
    - "The auditor owns the understanding of the entity; ICAEW's test found chatbots cannot perform inquiry, observation or inspection (ICAEW-PIERPOINT-2025)"
    - "Experienced human review of answers before they inform audit judgments (CAQ-RSM-2026)"
  role_evolution: >-
    RSM says tools like these free time for understanding client risks, analysis, scepticism and judgment
    (CAQ-RSM-2026). Thomson Reuters Institute urges firms to define early-career roles and keep supervision in
    place before automation erodes development opportunities (TRI-FOP-2026).
  evidence_grade: B
  sources:
    - {ref: KPMG-CLARA-2025, title: "KPMG advances AI integration in KPMG Clara smart audit platform", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/04/kpmg-advances-ai-integration-in-kpmg-clara-smart-audit-platform.html", date: "2025-04-22", access: full, locator: "recap paragraphs 'In May 2024' and 'In April 2024'"}
    - {ref: CAQ-RSM-2026, title: "Shaping the future of assurance: Advancing AI in the audit", publisher: "Center for Audit Quality (author: RSM assurance digital leader)", type: professional-body, url: "https://www.thecaq.org/aia-shaping-the-future-of-assurance-advancing-ai-in-the-audit", date: "2026-08-25", access: full, locator: "sections on Microsoft 365 Copilot and 'Ask Luca: trusted guidance where auditors work'"}
    - {ref: CFOBREW-PWC-2025, title: "A look at PwC's 'next generation' audit", publisher: "CFO Brew", type: press, url: "https://www.cfobrew.com/stories/2025/11/05/a-look-at-pwc-s-next-generation-audit", date: "2025-11-05", access: full, locator: "description of ChatNational"}
    - {ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "paragraph on training and pre-approved use"}
    - {ref: ICAEW-PIERPOINT-2025, title: "Testing Gen AI platforms: can they do audit work?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/testing-gen-ai-platforms-can-they-do-audit-work", date: "2025-09-24", access: full, locator: "introduction"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff update on outreach activities related to the integration of generative AI in audits and financial reporting", publisher: "PCAOB staff", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p.4"}
    - {ref: TRI-FOP-2026, title: "What the 2026 Future of Professionals Report says tax and audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "paragraphs 3-9"}
    - {ref: FSA-DP-2025, title: "Study on the potential utilization of generative AI in audit practices and challenges related to audit quality (DP2025-3)", publisher: "Financial Services Agency, Japan (Financial Research Center)", type: regulator, url: "https://www.fsa.go.jp/frtc/english/seika/discussion/2025/DP2025-3_Eng.pdf", date: "2025-07", access: full, locator: "pp.8, 13"}
    - {ref: CPAB-AI-2024, title: "The use of artificial intelligence in the audit: balancing innovation and risk", publisher: "CPAB (Canada)", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2024-use-of-artificial-intelligence-in-the-audit-en.pdf", date: "2024-09", access: full, locator: "p.1"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-13 (B), governance-17 (C) and discourse-02 (B, methodology copilots). None of the sources
    ties these assistants to planning specifically. The 2.175 million count dates from May 2024. The practice file
    routes RSM's Ask Luca (4,000-plus assurance users, CPAPA-ASKLUCA-2026) to quality-management as well. CPAB
    observed limited AI in the public-company audit files it had inspected as of September 2024 (CPAB-AI-2024).

- id: assurance-planning-risk-assessment-03
  title: Agents that scan media for emerging threats to the audited entity and draft staff memos
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Keeping up with news and events that bear on an audited entity's risk is manual and uneven.
  solution: >-
    Bloomberg Law reports that Deloitte auditors worldwide gained access to a suite of agents that can scan media
    reports for emerging threats and produce first drafts of staff memos. Deloitte's own release describes a unified
    agent network in Omnia for nearly 85,000 audit and assurance practitioners, with agents running preliminary
    procedures (extraction, evidence analysis, draft documentation, preliminary conclusions for review).
  outcomes:
    - {lever: speed, description: "A Deloitte leader expects the time from client documents arriving to being populated in working papers to shorten; an expectation, not a result", figure: "none published", measures: "stated expectation by a Deloitte US partner quoted by Bloomberg Law", provenance: self-reported, source_ref: BBL-DELOITTE-2026}
  prerequisites:
    - "Omnia platform upgrades to host the agent network (BBL-DELOITTE-2026)"
    - "Governance under Deloitte's Trustworthy AI framework (DELOITTE-OMNIA-2026)"
  risks_and_guardrails:
    - "Agents produce preliminary conclusions for professionals to review (DELOITTE-OMNIA-2026)"
  human_checkpoints:
    - "Practitioners supervise and validate agent output (DELOITTE-OMNIA-2026)"
  role_evolution: >-
    Deloitte's release describes a 'tutor mode' giving on-demand micro-training in the flow of work, plus an AI
    Academy and an AI learning assistant (DELOITTE-OMNIA-2026).
  evidence_grade: B
  sources:
    - {ref: BBL-DELOITTE-2026, title: "Deloitte adopts advanced AI to power corporate audits globally", publisher: "Bloomberg Law", type: press, url: "https://news.bloomberglaw.com/financial-accounting/deloitte-adopts-advanced-ai-to-power-corporate-audits-globally", date: "2026-06-29", access: full, locator: "paragraphs 1-4"}
    - {ref: DELOITTE-OMNIA-2026, title: "Deloitte unveils connected agentic intelligence in Omnia to advance audit and assurance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/about/press-room/unveils-connected-agentic-intelligence-omnia-advance-audit-assurance.html", date: "2026-06-24", access: full, locator: "paragraphs 1-6"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-10. The media-scanning capability is reported by Bloomberg Law; Deloitte's own release does not
    name it and speaks of enhanced insights and deep risk analysis. No figures are published.

- id: assurance-planning-risk-assessment-04
  title: Analyse audit-committee communications to surface issues earlier in audit preparation
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Issues raised in communications with the audit committee can reach the engagement team late in the audit
    preparation cycle.
  solution: >-
    PwC said in October 2026 that one of the tools it will use for 2026 year-end audits analyses audit-committee
    communications to surface issues that need handling sooner in the audit preparation cycle.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "the CFO Dive interview gives no figure for this tool", provenance: self-reported, source_ref: CFODIVE-PWC-2026}
  prerequisites:
    - "Access to audit-committee communications in a form the tool can read; the source does not describe the inputs (CFODIVE-PWC-2026)"
  risks_and_guardrails:
    - "AS 2110 .54 still requires inquiries of the audit committee, management, internal audit and others, and ISA (UK) 315 para 14(a) requires inquiries of management and others; a document-analysis tool does not satisfy these inquiries (governance deep dive's reading of AS2110-PCAOB-2026 and ISAUK315-2025)"
    - "The source gives no guardrails for this tool (CFODIVE-PWC-2026)"
  human_checkpoints:
    - "Not described in the source (CFODIVE-PWC-2026)"
  role_evolution: "Not described in the source."
  evidence_grade: C
  sources:
    - {ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "paragraph beginning 'For 2026 year-end audits'"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "para .54"}
    - {ref: ISAUK315-2025, title: "ISA (UK) 315 (Revised July 2020): Identifying and Assessing the Risks of Material Misstatement, updated September 2025", publisher: "Financial Reporting Council", type: standard-setter, url: "https://media.frc.org.uk/documents/ISA_UK_315_Revised_July_2020_Updated_September_2025.pdf", date: "2025-09", access: full, locator: "para 14(a), printed p.7"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-14, discourse-05 and governance-04 (all C). One sentence in one trade article; 'will be
    using' is a plan, so maturity is announced. AS2110-PCAOB-2026 is dated by access because the page shows no
    publication date. Discourse also routes this item to completion-reporting.

- id: assurance-planning-risk-assessment-05
  title: Tool-assisted understanding of the client's IT environment (access-rights analytics and guided IT-risk identification)
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, expert-judgment, review-assurance]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Understanding the entity's IT environment and general IT controls is a required part of risk assessment, but
    sampling user lists and access logs gives a partial picture. ISA 315 raises expectations for identifying IT
    risks, and mid-tier firms often lack formal IT audit teams.
  solution: >-
    The AFM saw external auditors using tools to identify and evaluate roles, access rights, and user and control
    activity in the client's IT system, giving an integrated view of expected activity (for example superuser
    accounts) and unauthorised activity to support the overall risk assessment and plan further procedures; these
    are analytics tools, not necessarily AI. An ICAEW viewpoint by the co-founder of a vendor says purpose-built
    agentic AI platforms can map risks to controls, analyse documents and system outputs, and produce documentation
    aligned with ISA 315 with human-in-the-loop review, alongside structured documentation that prompts generalists
    to consider the IT environment, training and designated tech champions.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "the AFM report and the ICAEW viewpoint give no figures", provenance: independent, source_ref: AFM-12BB-2025}
  prerequisites:
    - "Reliable, relevant input data; the AFM points to ISA 315 paras 25-26 and the annexes on understanding IT and general IT controls (AFM-12BB-2025 p.16)"
    - "Follow-up of the IT auditor's findings before relying on a tool (AFM-12BB-2025 p.17)"
    - "ISA 315 requirements embedded in firm methodology with prompts and frameworks, and training so generalists can read system flows (ICAEW-315-2025)"
  risks_and_guardrails:
    - "AFM bad practice: insufficient follow-up of identified risks and of the IT auditor's findings, and no evaluation of input data where general IT controls are ineffective (AFM-12BB-2025 p.17)"
    - "ISA (UK) 315 A57: the auditor may use automated tools to understand flows of transactions (ISAUK315-2025 printed p.28)"
    - "ACRA: understanding the entity's IT environment is a foundation for risk assessment and the design of responses (ACRA-APG1-2025 p.12)"
    - "The ICAEW viewpoint points to the FRC's expectation that tools are certified, documented and periodically reassessed (ICAEW-315-2025)"
  human_checkpoints:
    - "Auditor evaluates tool results against the IT auditor's findings (AFM-12BB-2025 p.17)"
    - "Auditors review, validate and challenge flagged issues and drafted documentation (ICAEW-315-2025)"
  role_evolution: >-
    The AFM saw tools taking over straightforward staff tasks and, at several firms, a tool ambassador or specialist
    attending planning meetings (AFM-12BB-2025 p.21). The ICAEW viewpoint urges tech champions or innovation task
    forces within teams (ICAEW-315-2025).
  evidence_grade: C
  sources:
    - {ref: AFM-12BB-2025, title: "12 building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "pp.16-17, 21"}
    - {ref: ICAEW-315-2025, title: "Meeting ISA 315 requirements without specialist IT teams", publisher: "ICAEW (author: co-founder of Platformed, a vendor)", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/oct-2025/meeting-isa-315-requirements-without-specialists-it-teams", date: "2025-10", access: full, locator: "paragraphs on purpose-built agentic AI platforms and 'human-in-the-loop'"}
    - {ref: ISAUK315-2025, title: "ISA (UK) 315 (Revised July 2020): Identifying and Assessing the Risks of Material Misstatement, updated September 2025", publisher: "Financial Reporting Council", type: standard-setter, url: "https://media.frc.org.uk/documents/ISA_UK_315_Revised_July_2020_Updated_September_2025.pdf", date: "2025-09", access: full, locator: "A57, printed p.28"}
    - {ref: ACRA-APG1-2025, title: "Audit Practice Guidance No. 1 of 2025: Delivering quality audits in a technology-driven environment", publisher: "ACRA (Singapore)", type: regulator, url: "https://www.acra.gov.sg/news-events/news-announcements/906/", date: "2025-12-26", access: full, locator: "PDF p.12"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from governance-14 (C, AFM good practice at unnamed firms) and practice-17 (C, vendor-authored viewpoint).
    The IFIAR counts of IT general and application control findings (29, 50, 65, 55 and 39 in the 2021-2025 surveys)
    concern controls testing and are not evidence for this entry.

- id: assurance-planning-risk-assessment-06
  title: "Idea: understanding the entity's own use of AI in financial reporting as a standard risk assessment procedure"
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [research-synthesis, review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Clients are adopting AI faster than they govern it: audit partners rated only 6% of their largest clients' AI
    governance as advanced and nearly 90% as developing or early stage (CAQ Spring 2026 Pulse). Auditors need to know
    where AI touches financial reporting before they can assess risk, yet the AS 2110 text has no AI-specific step and
    ISA 315 mentions AI once.
  solution: >-
    Guidance, not yet a measured practice: planning adds structured inquiry into how the entity uses AI in financial
    reporting and controls, the governance around it, and whether AI-generated documents feed audit evidence, then
    decides what that implies for team competence and responses. The AICPA practice aid (13 October 2026) covers this
    in Part 1: AI versus ordinary automation, data quality, AI-specific risks (data, model, hallucination,
    explainability, bias), AI-operated controls and service-organisation reports. ISA 315 Appendix 5 para 5 says
    emerging technologies such as AI in the information system may be included when identifying IT applications
    subject to IT risks. The CAQ's 2024 paper gives question sets, ACRA's 2025 guidance has an emerging-technologies
    checkpoint, and IFIAR says AI-generated source documents may be used as evidence.
  outcomes:
    - {lever: risk, description: "none published (idea): no firm has published results of this procedure", figure: "none published", measures: "not applicable", provenance: independent, source_ref: AICPA-PA-2026}
  prerequisites:
    - "Team competence: the AICPA says practitioners may need a blend of auditing expertise, AI knowledge, data skills, scepticism and specialist support (AICPA-PA-2026)"
    - "Management able to explain its AI use; the AICPA compares heavy AI reliance with complex valuation models, where management that cannot understand the model may lack the needed skills (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "ISA (UK) 315 App 5 para 5: responsibilities for IT applications and general IT controls 'remain unchanged' where AI is in the information system (ISAUK315-2025 printed p.96)"
    - "AICPA (as reported): a one-to-one translation of risks to the AI context cannot always be applied, and the strategy for controls operated by AI may differ from that for traditional automated controls (AT-AICPAPA-2026)"
    - "EY survey of 202 senior AI decision-makers at public companies with $1bn or more revenue: 47% bypassed AI governance for urgent deployments and 36% reported an AI incident with material impact (CAQ-INSIDERSEP-2026)"
    - "In the same survey, among agentic AI users, 85% said agents act without real-time human oversight and 26% cannot detect unauthorised agents (CAQ-INSIDERSEP-2026)"
    - "The AICPA says deeper guidance on assessing risk of material misstatement and evaluating evidence for AI-using companies will be added later (AICPA-PA-2026)"
  human_checkpoints:
    - "The engagement partner and team decide how the entity's AI affects the risk of material misstatement (JOFA-AIPA-2026)"
  role_evolution: >-
    The CAQ says teams may need extra training or an individual with the requisite GenAI knowledge (CAQ-GENAI-2024),
    and the AICPA stresses team competence and specialist support (AICPA-PA-2026). SEC accounting staff said at the
    December 2025 conference that existing auditing standards were not written with AI in mind, but that the
    foundations of risk assessment remain the same even if AI needs different responses (DART-SECPCAOB-2025).
  evidence_grade: D
  sources:
    - {ref: AICPA-PA-2026, title: "AICPA releases guidance to help auditors address the use of AI in financial reporting and auditing", publisher: "AICPA & CIMA", type: professional-body, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "section 'Considering an organization's use of AI' (release only; practice aid member-gated)"}
