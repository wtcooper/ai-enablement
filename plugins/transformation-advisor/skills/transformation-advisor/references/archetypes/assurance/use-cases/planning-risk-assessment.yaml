- id: assurance-planning-risk-assessment-07
  title: Standardised ERP data ingestion as the base for planning analytics
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, software-systems]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Fragmented tools and client data in many formats block analytics at the start of the audit. Surveyed US firms
    name poor client data (60%) and no access to client systems (53%) among the top blockers to audit transformation.
  solution: >-
    Grant Thornton's gtap is a cloud-based infrastructure that standardises how audit data is ingested, transformed
    and analysed from any ERP system, replacing fragmented tools. It supports full-population analysis and is
    described as opening the door to intelligent agents that surface risks and anomalies. It started with
    private-company audits, with public companies planned for the next year.
  outcomes:
    - {lever: quality, description: "Grant Thornton says it increases consistency across engagements and reduces variability and manual steps", figure: "none published", measures: "qualitative statement by Grant Thornton's CEO", provenance: self-reported, source_ref: GT-GTAP-2026}
    - {lever: capacity, description: "Adoption signal: surveyed US firms with automated trial-balance import and with automated data ingestion", figure: "35% (trial-balance import); 19% (data ingestion)", measures: "share of surveyed firms reporting an automated solution; the report's analysis covers 54 firms with complete data", provenance: independent, source_ref: CPACOM-ATR-2025}
  prerequisites:
    - "Client ERP access and data in a form that can be ingested (CPACOM-ATR-2025)"
  risks_and_guardrails:
    - "Grant Thornton says professionals supervise every step (GT-GTAP-2026)"
  human_checkpoints:
    - "Auditors maintain oversight of the risks and anomalies agents flag (GT-GTAP-2026)"
  role_evolution: >-
    Grant Thornton's CEO says teams will spend more time on professional scepticism, assessing risk and delivering
    insights (GT-GTAP-2026).
  evidence_grade: B
  sources:
    - {ref: GT-GTAP-2026, title: "Grant Thornton launches gtap", publisher: "Grant Thornton LLP", type: firm, url: "https://www.grantthornton.com/insights/press-releases/2026/may/grant-thornton-launches-gtap-audit-transformation-us", date: "2026-05-07", access: full, locator: "paragraphs 1-4"}
    - {ref: CPAPA-GT-2026, title: "Grant Thornton U.S. launches in-house audit transformation platform", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/05/08/grant-thornton-u-s-launches-in-house-audit-transformation-platform/183107/", date: "2026-05-08", access: full, locator: "article body"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: "CPA.com (AICPA)", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "automated-solutions chart (PDF p.10); blockers chart (PDF p.8)"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-15. The launch is the named deployment; agent features are prospective. Grant Thornton US operates
    under an alternative practice structure (landscape), which is an acceptance-independence topic.

- id: assurance-planning-risk-assessment-08
  title: Whole-population ledger analytics to identify risks, significant classes of transactions and unusual flows
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, review-assurance, expert-judgment]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Planning often starts from a trial balance, a few comparative schedules, last year's file and judgment, so
    significant classes and unexpected flows can stay hidden and anomalies surface only in substantive testing,
    when they cost more.
  solution: >-
    Firms run analytics over whole ledgers during risk assessment. RSM says its auditors review intelligent
    visualisations of journal entries for risk-assessment insight and anomaly detection. KPMG says Clara includes
    Transaction Scoring (from a 2023 alliance with MindBridge) over 100% of populations. Wolters Kluwer's CCH Axcess
    Engagement offers full-population journal-entry views, trend and ratio analysis early in the engagement, which it
    says are not agentic but give signals agents can use later. ISA 315 application material describes analysing an
    entire population with automated tools, for example to find a zero-balance account built from offsetting entries
    or a significant revenue class not previously identified (A203). ISA (UK) 240 adds ratio benchmarking to identify
    fraud risk factors (A56), and IFIAR lists predictive data analytics as usable in risk assessment and planning.
  outcomes:
    - {lever: risk, description: "Adoption signal, not a quality measure: IFIAR members who frequently observed automated tools and techniques in risk assessment", figure: "55% in 2024; 49% in 2023", measures: "share of 47 IFIAR members answering in 2024 (45 in 2023) who said 'frequently observed' for risk assessment; 13% never, 32% infrequently in 2024; covers all automated tools, not only AI; directional", provenance: independent, source_ref: IFIAR-TTF-2025}
    - {lever: risk, description: "Average share of tool use by audit area at six Dutch PIE firms", figure: "28% risk assessment; 51% tests of details", measures: "AFM chart of tool use by audit area (average) from its data request to six PIE firms; areas overlap so shares do not total 100%", provenance: independent, source_ref: AFM-12BB-2025}
    - {lever: risk, description: "US firms with an automated solution for risk assessment", figure: "22%", measures: "share of surveyed firms (74 registered, 54 with complete data; base for the chart not stated); self-reported", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: quality, description: "Among firms using automated risk assessment, every respondent reported a positive impact, many significant or transformational", figure: "every respondent", measures: "respondents using automated risk assessment who reported a positive impact; fewer than one-quarter of firms answered the question", provenance: independent, source_ref: CPACOM-ATR-2025}
  prerequisites:
    - "Complete ledger and sub-ledger data from the client's systems (CPACOM-ATR-2025)"
    - "Evaluation of the relevance and reliability of input data; the AFM makes input data the second of its four layers of building blocks (AFM-12BB-2025 p.1)"
    - "A documented expectation built from the auditor's understanding of the company (AS2110-PCAOB-2026 .48)"
  risks_and_guardrails:
    - "31% of IFIAR members reported findings that a tool was not used as intended in 2024 (29% in 2023); the most common were misread results and thin testing of outliers (IFIAR-TTF-2025 p.5)"
    - "AFM bad practice: using a tool without evaluating input data reliability when the client's general IT controls are ineffective (AFM-12BB-2025 pp.16-17)"
    - "NFRA staff paper (as reported): do not accept a tool's low-risk classification without periodically testing it; full-population testing does not remove the need for risk assessment (NFRA-CAALLEY-2026)"
    - "PCAOB: evaluating reliability of information used in risk assessment takes less effort than for substantive procedures, but a multi-purpose procedure must achieve each objective (PCAOB-TAA-2024 pp.25, 32)"
    - "AS 2110 .48 note: risk assessment analytics often use preliminary or aggregated data and lack substantive precision (AS2110-PCAOB-2026)"
    - "IAASB ED-520 would require considering how inconsistent results of risk-assessment analytical procedures affect the identification and assessment of risks (AUASB-CPED-2026 Appendix 1 para 10(c))"
    - "Japan FSA discussion paper: a GenAI tool might judge a transaction low risk when it is a significant fraud indicator (FSA-DP-2025 p.13)"
  human_checkpoints:
    - "Auditor interprets results and follows up outliers (IFIAR-TTF-2025 p.5)"
    - "Senior team members reflect on the overall use of technology in the file and whether scepticism was maintained (IFIAR-TTF-2026 p.7)"
  role_evolution: >-
    In the AICPA/CPA.com survey, firms furthest along in transformation spend the highest share of time in planning
    and less in fieldwork (CPACOM-ATR-2025). IFIAR expects training mapped to required competencies, covering how to
    evaluate outputs, understand limits and exercise judgement (IFIAR-TTF-2026 p.7).
  evidence_grade: B
  sources:
    - {ref: ISAUK315-2025, title: "ISA (UK) 315 (Revised July 2020): Identifying and Assessing the Risks of Material Misstatement, updated September 2025", publisher: "Financial Reporting Council", type: standard-setter, url: "https://media.frc.org.uk/documents/ISA_UK_315_Revised_July_2020_Updated_September_2025.pdf", date: "2025-09", access: full, locator: "A21 printed p.18; A31 p.20; A203 p.63"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.5, table of areas where tools are used; findings"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp.7, 9; Appendix A, predictive data analytics"}
    - {ref: AFM-12BB-2025, title: "12 building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "pp.1, 16-17, 27"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: "CPA.com (AICPA)", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p.8 (blockers); p.10 (automated solutions); p.20 (benefits); p.28 (method)"}
    - {ref: CPAPA-ASKLUCA-2026, title: "RSM US rolls out 'Ask Luca' GenAI tool for firm's auditors", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/01/09/rsm-us-rolls-out-ask-luca-genai-tool-for-firms-auditors/176104/", date: "2026-01-09", access: full, locator: "bullet 'Enhanced risk assessment'"}
    - {ref: KPMG-CLARA-2024, title: "KPMG announces AI integration into global smart audit platform, KPMG Clara", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2024/07/kpmg-announces-ai-integration-into-global-smart-audit-platform-kpmg-clara.html", date: "2024-07-29", access: full, locator: "recap bullet on the 2023 MindBridge alliance (Transaction Scoring)"}
    - {ref: WK-AGENTRA-2026, title: "The evolving role of agentic risk assessment in audit planning", publisher: "Wolters Kluwer", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/the-evolving-role-of-agentic-risk-assessment-in-audit-planning", date: "2026-03-02", access: full, locator: "section on data analytics in CCH Axcess Engagement"}
    - {ref: ISAUK240-2026, title: "ISA (UK) 240 (Revised March 2026): The Auditor's Responsibilities Relating to Fraud in an Audit of Financial Statements", publisher: "Financial Reporting Council", type: standard-setter, url: "https://www.frc.org.uk/documents/9305/ISA_UK_240_Revised_March_2026_xuvAkap9.pdf", date: "2026-04-30", access: full, locator: "A9 printed p.22; A56 p.35"}
    - {ref: AUASB-CPED-2026, title: "Consultation Paper: IAASB Proposed International Standards on Audit Evidence & Risk Response", publisher: "AUASB", type: standard-setter, url: "https://www.auasb.gov.au/media/fegpk4s5/auasb_cp_iaasbproposedintlstdonauditevidence__riskresponse1.pdf", date: "2026-08", access: full, locator: "Appendix 1, para 10(c)"}
    - {ref: PCAOB-TAA-2024, title: "Release No. 2024-007: Amendments related to aspects of designing and performing audit procedures that involve technology-assisted analysis", publisher: "PCAOB", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/rulemaking/docket-052/2024-007-adoptingrelease.pdf", date: "2024-06-12", access: full, locator: "printed pp.25, 32"}
    - {ref: NFRA-CAALLEY-2026, title: "NFRA sets 10 principles for technology use in audits, says AI cannot replace auditor judgement", publisher: "CAalley (reporting an NFRA staff paper)", type: press, url: "https://caalley.com/news-updates/indian-news/nfra-sets-10-principles-for-technology-use-in-audits-says-ai-cannot-replace-auditor-judgement", date: "2026-07-24", access: full, locator: "section 'Professional scepticism cannot be delegated to technology'"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "paras .46-.48 and note"}
    - {ref: FSA-DP-2025, title: "Study on the potential utilization of generative AI in audit practices and challenges related to audit quality (DP2025-3)", publisher: "Financial Services Agency, Japan (Financial Research Center)", type: regulator, url: "https://www.fsa.go.jp/frtc/english/seika/discussion/2025/DP2025-3_Eng.pdf", date: "2025-07", access: full, locator: "p.13"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-06 (B), governance-05 (B), discourse-10 (C, Wolters Kluwer) and governance-07 (D, idea on
    predictive and benchmark expectations for risk-assessment analytics). Grade B is capped: the IFIAR, AFM and CPA.com
    figures measure prevalence, not effect, and cover all automated tools. CPA.com is an AICPA affiliate that also
    implements the DAS platform (entry 20). Journal-entry testing itself (88% frequency in 2024) belongs to
    substantive-testing. The ED-520 text is login-gated; its content here comes from the AUASB summary.

- id: assurance-planning-risk-assessment-09
  title: Draft engagement-specific risk suggestions from the trial balance, prior-year file and board minutes
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Risk assessment starts from a blank page or from last year's risks, and is time-consuming (a customer's words).
  solution: >-
    Caseware's Verity-powered Risk Suggestion Agent, launched worldwide on 6 October 2026, uses current and prior-year
    financial information, existing risks, controls and selected supporting documents such as board minutes to
    suggest engagement-specific risks with a rationale. Auditors review, edit or reject each suggestion, and nothing
    enters the engagement file without a deliberate decision.
  outcomes:
    - {lever: quality, description: "In a CwX 2026 preview demonstration the agent surfaced five risks for review, one a gap between the trial balance and net profit reported in board minutes", figure: "5 risks; one $118,000 discrepancy", measures: "risks surfaced in one vendor demonstration on a sample engagement; not a live-engagement result", provenance: vendor-published, source_ref: CASEWARE-VERITY-2026}
    - {lever: speed, description: "A partner at GRF CPAs & Advisors says it gives teams a strong starting point and saves time for testing and follow-up", figure: "none published", measures: "customer testimonial supplied by Caseware; no measurement", provenance: vendor-published, source_ref: ITBRIEF-CASEWARE-2026}
  prerequisites:
    - "Engagement data held in the firm's Caseware environment; Caseware says engagement data is not used to train models (CASEWARE-RSA-2026)"
    - "Prior-year financials, logged risks and controls, and qualitative documents such as board minutes (CASEWARE-LAUNCH-2026)"
    - "A Caseware Verity licence; the agent is included at no extra charge (CASEWARE-RSA-2026)"
  risks_and_guardrails:
    - "Suggestions are drafts for independent review and cannot be incorporated without an explicit practitioner decision (CASEWARE-RSA-2026)"
    - "Anchoring on the suggested list and under-weighting risks the agent did not raise; the FRC names output taken as complete as a misuse risk (FRC-GENAI-2026 p.18)"
  human_checkpoints:
    - "Auditor accepts, edits or rejects every suggested risk (ITBRIEF-CASEWARE-2026)"
  role_evolution: >-
    Caseware says the goal is to give auditors more time for the testing and follow-up that identified risks require,
    citing a customer (ITBRIEF-CASEWARE-2026).
  evidence_grade: B
  sources:
    - {ref: CASEWARE-RSA-2026, title: "Caseware Verity-powered Risk Suggestion Agent launches to help auditors identify engagement-specific risks", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/caseware-verity-powered-risk-suggestion-agent-launches-to-help-auditors-identify-engagement-specific-risks", date: "2026-10-06", access: full, locator: "paragraphs 1-2 and 'Rather than beginning each engagement' section"}
    - {ref: ITBRIEF-CASEWARE-2026, title: "Caseware launches AI agents for audit risk and disclosure", publisher: "IT Brief UK", type: press, url: "https://itbrief.co.uk/story/caseware-launches-ai-agents-for-audit-risk-disclosure", date: "2026-10-13", access: full, locator: "paragraphs 1-4 and GRF CPAs quote"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "paragraph on the Risk Suggestion Agent (then advancing through alpha)"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "paragraph on the Risk Suggestion Agent preview"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, Mitigations and Illustrative Examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.18"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-02. Grade B rests on a worldwide launch plus one named customer statement, with no measured
    outcome. The May 2026 release called the agent 'advancing through alpha'. The demo figure is a demonstration,
    not a live result. No override or acceptance-rate data published.

- id: assurance-planning-risk-assessment-10
  title: Agentic risk assessment that links evidence, analytics, assertions, materiality and planned procedures
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, expert-judgment, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Risk scores from analytics often sit outside the workpaper tools and are hard to tie to assertions, materiality
    and firm methodology. Risk narratives vary in clarity by preparer, and linking risks to procedures is manual.
  solution: >-
    MindBridge announced Agentic Risk Assessment on 22 September 2026: it connects evidence, analytics, assertions,
    materiality and methodology to support planning decisions, plugs into customer-built and third-party workpaper
    tools, and comes with an MCP server (a standard connector) so compatible AI assistants can query results.
    Wolters Kluwer describes a future state in which an analytics engine flags late-period entries, margin
    compression and receivables ageing shifts, a risk-assessment agent drafts a cited risk narrative, and a second
    agent maps risks to procedures or flags areas for enhanced testing, with the auditor reviewing; it calls the full
    ecosystem a future-state vision. A CPA Journal article outlines a comparable framework in which machine-learning
    models classify inherent and control risk and GenAI drafts documentation, with illustrative, uncalibrated
    thresholds.
  outcomes:
    - {lever: quality, description: "MindBridge claims faster, better supported and more defensible planning decisions; no figure and no named customer", figure: "none published", measures: "the release gives no usage or accuracy figures and does not say whether the capability is generally available", provenance: vendor-published, source_ref: MINDBRIDGE-ARA-2026}
  prerequisites:
    - "Full-population transaction data analysed in the MindBridge platform and integrated with the firm's workpaper tools (MINDBRIDGE-ARA-2026)"
    - "Connected data and APIs, with approval gates, exception logs and evidence links on every agent step (WK-CONNECTED-2026)"
    - "A readiness assessment of data, IT, staff skills and governance before piloting (CPAJ-AIPLAN-2026)"
  risks_and_guardrails:
    - "ICAEW's test found chatbots name ISA risks without separating financial-statement-level from assertion-level risk; the test concerned chatbots, not these tools (ICAEW-PIERPOINT-2025)"
    - "FRC: the auditor may not understand that the tool's output was meant to inform judgement, not be the conclusion (FRC-GENAI-2026 p.18)"
    - "NFRA staff paper (as reported): do not accept a tool's low-risk classification without periodically testing it (NFRA-CAALLEY-2026)"
    - "The CPA Journal authors list black-box outputs, biased or stale training data and over-dependence among the risks, and say the auditor keeps full responsibility (CPAJ-AIPLAN-2026)"
    - "Wolters Kluwer calls agentic audits assistive, not autonomous, with human approval at each step (WK-CONNECTED-2026)"
  human_checkpoints:
    - "Auditor reviews and refines the draft narrative and the risk-to-procedure mapping (WK-AGENTRA-2026)"
    - "MindBridge says auditor judgement and control are preserved (MINDBRIDGE-ARA-2026)"
  role_evolution: >-
    Wolters Kluwer expects analytics to create signals, agents to interpret them and auditors to apply judgement and
    finalise conclusions (WK-AGENTRA-2026).
  evidence_grade: C
  sources:
    - {ref: MINDBRIDGE-ARA-2026, title: "MindBridge advances financial oversight for the agentic era with new platform capabilities", publisher: "MindBridge (Business Wire via BNN Bloomberg)", type: vendor, url: "https://www.bnnbloomberg.ca/press-releases/2026/09/22/mindbridge-advances-financial-oversight-for-the-agentic-era-with-new-platform-capabilities/", date: "2026-09-22", access: full, locator: "item 'Agentic Risk Assessment for audit & assurance'"}
    - {ref: CPAPA-MINDBRIDGE-2026, title: "MindBridge launches new AI capabilities for finance and audit", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=190850", date: "2026-09-30", access: full, locator: "paragraph on Agentic Risk Assessment"}
    - {ref: WK-AGENTRA-2026, title: "The evolving role of agentic risk assessment in audit planning", publisher: "Wolters Kluwer", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/the-evolving-role-of-agentic-risk-assessment-in-audit-planning", date: "2026-03-02", access: full, locator: "section on the next wave of agentic capabilities and the hypothetical scenario"}
    - {ref: WK-CONNECTED-2026, title: "The connected audit: A strategic framework for agentic workflows", publisher: "Wolters Kluwer", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/a-strategic-framework-for-agentic-audit-workflows", date: "2026-03-02", access: full, locator: "key takeaways; sections on governance and integration"}
