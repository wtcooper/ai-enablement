    - {ref: CAQ-INSIDERSEP-2026, title: "Audit Insider, September 2026", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/audit-insider-september-2026", date: "2026-09", access: full, locator: "item 'EY Survey Finds Autonomous AI Outpacing Oversight'"}
