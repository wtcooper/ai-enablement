- id: assurance-planning-risk-assessment-21
  title: Engagement-level plan for AI and tool use, with team competence checked at planning
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [coordination-scheduling, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Tools are adopted ad hoc, it is not always clear where GenAI was applied in an audit, and teams may use tools they
    are not trained for.
  solution: >-
    The audit plan states which tools will be used and for which risks or assertions, the engagement leader sets
    expectations for technology use at the outset, and the team's competence to use the tools is assessed at planning.
    The AFM saw audit plans at some firms stating which tools are used; IFIAR asks engagement leaders to set
    engagement-specific expectations at the outset; the AICPA practice aid recommends firm planning on intended AI use
    in specific engagements.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: AFM-12BB-2025}
  prerequisites:
    - "A firm policy on which audit phases tools may be used in and which assertions or risks they address (AFM-12BB-2025 p.13)"
    - "Engagement partners who understand the tools, confirm they are firm-approved and check staff use them correctly (AICPA-PA-2026)"
  risks_and_guardrails:
    - "AFM: it is not always clear where and how GenAI has been applied, and the auditor needs to know where it was used to take responsibility in review (AFM-12BB-2025 p.31)"
    - "AFM: conditions for using tools in risk assessment procedures may differ from those where audit evidence is obtained (AFM-12BB-2025 p.23)"
    - "NFRA staff paper (as reported): documentation should let an experienced auditor unconnected with the engagement see which tool processed a balance or assertion and the extent of human review (NFRA-CAALLEY-2026)"
  human_checkpoints:
    - "Engagement leader sets expectations at the outset; senior team members review the overall use of technology in the file (IFIAR-TTF-2026 p.7)"
  role_evolution: >-
    Engagement partners take on understanding the tools used and confirming approval and correct use (AICPA-PA-2026).
    NFRA differentiates training for preparers, reviewers and engagement partners (NFRA-CAALLEY-2026).
  evidence_grade: C
  sources:
    - {ref: AFM-12BB-2025, title: "12 building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "pp.13, 23, 31"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.7"}
    - {ref: AICPA-PA-2026, title: "AICPA releases guidance to help auditors address the use of AI in financial reporting and auditing", publisher: "AICPA & CIMA", type: professional-body, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "section 'Use of AI-related technological resources by audit firms'"}
    - {ref: NFRA-CAALLEY-2026, title: "NFRA sets 10 principles for technology use in audits, says AI cannot replace auditor judgement", publisher: "CAalley (reporting an NFRA staff paper)", type: press, url: "https://caalley.com/news-updates/indian-news/nfra-sets-10-principles-for-technology-use-in-audits-says-ai-cannot-replace-auditor-judgement", date: "2026-07-24", access: full, locator: "section 'Audit documentation and training to change'"}
  last_reviewed: "2026-10-16"
  notes: >-
    From governance-15 (C: AFM good practice at unnamed firms). Pattern 'other': a planning-governance step, not AI
    doing the work; kept because the module covers audit strategy and planning and regulators ask for it.

- id: assurance-planning-risk-assessment-22
  title: AI-supported staffing requests, budget planning and engagement-leader review
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Manual staffing and budgeting processes give leaders little visibility into engagement planning and resourcing.
  solution: >-
    RSM Luca Resourcing replaces manual processes with a connected collaboration tool that supports initial staffing
    requests, budget planning and engagement-leader review, and helps align the right resources to the right work at
    the right time. RSM presents it as one of three AI-related innovations added to its digital audit ecosystem in the
    past year; the source does not say what the AI does inside the tool.
  outcomes:
    - {lever: capacity, description: "RSM says the tool improves visibility into engagement planning and speeds staffing decisions", figure: "none published", measures: "qualitative statement; RSM does not state what share of engagements use the tool", provenance: self-reported, source_ref: CAQ-RSM-2026}
  prerequisites:
    - "Engagement planning data and staffing requests captured in one tool (CAQ-RSM-2026)"
  risks_and_guardrails:
    - "The source describes no tool-specific guardrails; engagement-leader review is the only control named (CAQ-RSM-2026)"
  human_checkpoints:
    - "Engagement-leader review of staffing and budget is a step in the tool (CAQ-RSM-2026)"
  role_evolution: >-
    RSM's assurance digital leader says the tool helps leaders make faster, more informed staffing decisions and
    streamlines workforce planning (CAQ-RSM-2026). Fieldguide's demo listing mentions real-time budget and workload
    visibility in its agent platform (FIELDGUIDE-DEMO-2026).
  evidence_grade: B
  sources:
    - {ref: CAQ-RSM-2026, title: "Shaping the future of assurance: Advancing AI in the audit", publisher: "Center for Audit Quality (author: RSM assurance digital leader)", type: professional-body, url: "https://www.thecaq.org/aia-shaping-the-future-of-assurance-advancing-ai-in-the-audit", date: "2026-08-25", access: full, locator: "section 'RSM Luca Resourcing'"}
    - {ref: CAQ-INSIDER-2026, title: "Audit Insider, July/August 2026", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/audit-insider-july-august-2026", date: "2026-09-01", access: full, locator: "description of RSM's three tools"}
    - {ref: FIELDGUIDE-DEMO-2026, title: "See Field Agents execute internal audit engagements live", publisher: "Fieldguide", type: vendor, url: "https://info.fieldguide.io/fieldguide-live-demo-internal-audit-mar17", date: "2026-10-20", access: full, locator: "bullet 'Findings and reporting, always current'; date is the scheduled webinar"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-12 (B) and discourse-13 (B). Pattern 'other': a planning workflow tool whose AI content is
    unconfirmed. The governance file could not re-open the CAQ post and wrote no entry.

- id: assurance-planning-risk-assessment-23
  title: AI efficiency gains negotiated into audit fees and engagement budgets
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [coordination-scheduling, client-interaction]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    If firms tell clients AI cuts hours, clients may ask why fees do not fall.
  solution: >-
    Reported case: KPMG International pressed its auditor, Grant Thornton UK, for a lower fee on the argument that AI
    should lower the cost of the audit, and the fee fell. The same article quotes PwC from 2025 saying clients know AI
    saves hours and are asking for discounts. Practitioners disagree on whether higher quality should instead support
    higher fees.
  outcomes:
    - {lever: cost, description: "Reported audit fee paid by KPMG International to its auditor, about 14% lower; second-hand and unconfirmed", figure: "$416,000 (2024) to $357,000 (2025)", measures: "audit fee paid by KPMG International to Grant Thornton UK, per a secondary report citing the Financial Times (not opened)", provenance: independent, source_ref: FINSTORY-KPMGFEE-2026}
  prerequisites:
    - "A fee and budget model that is not purely billable-hour (implied by the debate in FINSTORY-KPMGFEE-2026)"
  risks_and_guardrails:
    - "The PCAOB acting chair cited a study warning that profit pressure at private-equity-backed firms could bring cost-cutting and aggressive fee negotiation that strain staff and judgment (ACCTODAY-BOTIC-2025)"
    - "AI investment costs firms heavily, so fee cuts and build costs pull in opposite directions (FINSTORY-KPMGFEE-2026)"
  human_checkpoints:
    - "Partner pricing decisions (inferred by the discourse deep dive; not stated in the source)"
  role_evolution: >-
    The article asks whether the billable hour survives and reports no firm decision (FINSTORY-KPMGFEE-2026).
  evidence_grade: C
  sources:
    - {ref: FINSTORY-KPMGFEE-2026, title: "KPMG forced Auditor for a 14% AI Discount...Will the Billable Hour die?", publisher: "The Finance Story", type: press, url: "https://thefinancestory.com/kpmg-forced-auditor-for-a-14-ai-discount-will-the-billable-hour-die", date: "2026-02-12", access: full, locator: "sections 'KPMG asked its auditor for an AI discount' and 'Paradox facing the profession'"}
    - {ref: ACCTODAY-BOTIC-2025, title: "PCAOB warns auditors about AI and PE", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "Botic remarks on profitability pressure"}
  last_reviewed: "2026-10-16"
  notes: >-
    From discourse-14 (C). The only change-scope 'model' entry in this module. The landscape could not confirm these
    fee figures on the Verdantix commentary page it opened; this article states them but cites the FT,
    so treat as unconfirmed. Also touches acceptance-independence and the cross-cutting business-model lens.

- id: assurance-planning-risk-assessment-24
  title: Continuous risk assessment and dynamic planning that update risks and procedures as data arrives
  archetype: assurance
  module: planning-risk-assessment
  function: service-delivery
  work_types: [data-reporting, expert-judgment, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Risk assessment is a point-in-time planning step and is revised only when the team notices contradicting
    evidence, although AS 2110 .74 requires it to continue through the audit. Internal audit annual plans age
    in-year: 9% of CAEs reported adequate coverage of digital disruption and 23% rated their risk governance
    maturity for it as managed or optimised (Risk in Focus North America 2026/2027, as summarised).
  solution: >-
    Direction of travel, not yet practice. Thomson Reuters says client transactions flow continuously into AI-driven
    engines that flag issues as they occur. The CPA Journal authors expect AI-driven continuous auditing to update risk
    assessments during the period, if data integrity, exception thresholds and intervention protocols are in place.
    IFIAR names enhanced risk assessment using predictive analytics or real-time data as an example of how a
    human-led approach can improve quality. Grant Thornton designed gtap as the foundation for such a model, and
    Caseware's long-term aim includes AI that continuously assists planning and risk identification. In internal audit,
    practitioners describe living risk registers, 'continuous scoping' and agents scanning internal and external data
    for emerging risks (Deloitte, as summarised), AI risk scoring, surge capacity for micro audits and rolling
    multi-year plans (Wolters Kluwer).
  outcomes:
    - {lever: speed, description: "Thomson Reuters claims 80-90% complete deliverables by year-end with minimal human intervention; the claim is unsourced", figure: "80-90% complete deliverables by year-end", measures: "share of deliverables complete at year-end as stated by the vendor; no denominator, sample or method", provenance: vendor-published, source_ref: TR-CHALLENGES-2026}
  prerequisites:
    - "Real-time client data feeds and system access, with well-designed exception thresholds and auditor intervention protocols (CPAJ-AIPLAN-2026)"
    - "Data feeds and key risk indicators for the main risks (AUDITBOARD-RTRA-2025)"
    - "Flexible resourcing and board approval of significant plan changes under the IIA Standards (WK-MULTIYEAR-2026)"
  risks_and_guardrails:
    - "Testing more data surfaces more exceptions and can widen the expectation gap if sold as certainty; run new automation in shadow mode on completed engagements and ramp gradually (CPAPA-LEDGERLINE-2026)"
    - "NFRA staff paper (as reported): do not accept a tool's low-risk classification without periodically testing it (NFRA-CAALLEY-2026)"
    - "IFIAR: potential over-reliance on outputs without sufficient challenge (IFIAR-TTF-2026 p.3)"
    - "Wolters Kluwer says automation helps with repeated calculations but cannot judge an acquisition's risk or the right time to review a process (WK-MULTIYEAR-2026)"
  human_checkpoints:
    - "Engagement team decides whether to revise the risk assessment and planned procedures (AS2110-PCAOB-2026 .74)"
    - "Auditor intervention protocols when anomalies appear (CPAJ-AIPLAN-2026)"
    - "CAE and board approve significant changes to the internal audit plan (WK-MULTIYEAR-2026)"
  role_evolution: >-
    Thomson Reuters expects auditors to turn data anomalies into risk narratives and work on judgment-heavy procedures
    (TR-CHALLENGES-2026). Deloitte recommends rotational staffing, co-sourcing and digital specialists for internal
    audit (GRCREPORT-DELOITTE-2026).
  evidence_grade: C
  sources:
    - {ref: TR-CHALLENGES-2026, title: "Audit challenges and changes in 2026", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/challenges-and-changes-within-the-audit-industry/", date: "2026-02-02", access: full, locator: "section 'Continuous assurance and real-time auditing'"}
    - {ref: CPAJ-AIPLAN-2026, title: "Leveraging Artificial Intelligence in Audit Planning (Kasztelnik and Jermakowicz)", publisher: "The CPA Journal", type: academic, url: "https://www.cpajournal.com/2026/08/19/leveraging-artificial-intelligence-in-audit-planning/", date: "2026-08-19", access: full, locator: "section 'Future Directions for AI-Enabled Auditing'"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR Technology Task Force (FSA Japan copy)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.3 executive summary; Appendix A, predictive data analytics"}
    - {ref: AS2110-PCAOB-2026, title: "AS 2110: Identifying and Assessing Risks of Material Misstatement", publisher: "PCAOB", type: standard-setter, url: "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2110", date: "2026-10-16", access: full, locator: "para .74"}
    - {ref: GT-GTAP-2026, title: "Grant Thornton launches gtap", publisher: "Grant Thornton LLP", type: firm, url: "https://www.grantthornton.com/insights/press-releases/2026/may/grant-thornton-launches-gtap-audit-transformation-us", date: "2026-05-07", access: full, locator: "paragraph beginning 'Grant Thornton built gtap to grow'"}
    - {ref: CASEWARE-AIDA-2026, title: "From AiDA to agentic: How Caseware's AI has evolved", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/resources/blog/from-aida-to-agentic-how-casewares-ai-has-evolved", date: "2026-07-28", access: full, locator: "section 'What's next'"}
    - {ref: CPAPA-LEDGERLINE-2026, title: "Testing Every Transaction Changes the Audit: Here's What Firms Should Know Before They Sell It (Tunde Adewole, Ledgerline)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/15/testing-every-transaction-changes-the-audit-heres-what-firms-should-know-before-they-sell-it/191713/", date: "2026-10-15", access: full, locator: "sections 'The trap' and 'How to roll it out safely'"}
    - {ref: NFRA-CAALLEY-2026, title: "NFRA sets 10 principles for technology use in audits, says AI cannot replace auditor judgement", publisher: "CAalley (reporting an NFRA staff paper)", type: press, url: "https://caalley.com/news-updates/indian-news/nfra-sets-10-principles-for-technology-use-in-audits-says-ai-cannot-replace-auditor-judgement", date: "2026-07-24", access: full, locator: "section 'Professional scepticism cannot be delegated to technology'"}
    - {ref: AUDITBOARD-RTRA-2025, title: "Embracing real-time risk assessment: A practitioner's guide for internal audit teams in 2026", publisher: "AuditBoard (now Optro)", type: vendor, url: "https://auditboard.com/blog/embracing-real-time-risk-assessment-a-practitioners-guide-for-internal-audit-teams-in-2026", date: "2025-09-04", access: full, locator: "practical steps section"}
    - {ref: GRCREPORT-DELOITTE-2026, title: "Deloitte Sees Internal Audit Moving Closer to the Center of Enterprise Risk in 2026", publisher: "GRC Report", type: press, url: "https://www.grcreport.com/post/deloitte-sees-internal-audit-moving-closer-to-the-center-of-enterprise-risk-in-2026", date: "2026-05-19", access: full, locator: "paragraphs on continuous scoping and agentic AI"}
    - {ref: WK-DYNAMIC-2026, title: "Static to strategic: unlocking the benefits of dynamic audit planning", publisher: "Wolters Kluwer (TeamMate)", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/static-strategic-unlocking-benefits-dynamic-audit-planning", date: "2026-09-23", access: full, locator: "key takeaways"}
    - {ref: WK-MICRO-2026, title: "Real-time risk intelligence: How micro audits are redefining internal audit", publisher: "Wolters Kluwer (TeamMate)", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/risk-intelligence-micro-audits-redefining-internal-audit", date: "2026-07-29", access: full, locator: "key takeaways"}
    - {ref: WK-MULTIYEAR-2026, title: "Multi-year audit planning: Keeping an eye on tomorrow's risks", publisher: "Wolters Kluwer (TeamMate)", type: vendor, url: "https://wolterskluwer.com/en/expert-insights/multi-year-audit-planning", date: "2026-10-14", access: full, locator: "opening and assumptions sections"}
    - {ref: AUDITBOARD-RIF-2026, title: "Converging risks, competing priorities: Top takeaways from Risk in Focus, North America 2026/2027 (Richard Chambers)", publisher: "AuditBoard (now Optro)", type: vendor, url: "https://auditboard.com/blog/top-takeaways-from-risk-in-focus-north-america-2026-2027", date: "2026-09-15", access: full, locator: "section 4"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-23 (D), governance-16 (D), discourse-21 (C, external audit) and discourse-20 (C, internal
    audit). No firm describes live continuous risk assessment on external audits; the internal-audit material is
    vendor and consultancy framing, and the Deloitte item is a secondary summary. Graded C because the only figure is
    a vendor claim. The ladder (delegate) describes the stated design. The testing counterpart is
    assurance-controls-testing-09 (continuous control testing). IIA Standard 9.4 requires internal audit plans based
    on ongoing risk assessment (WK-DYNAMIC-2026).

- id: assurance-planning-risk-assessment-25
  title: AI-drafted risk considerations, risk-to-control scoping and work programs for internal audit engagements
  archetype: assurance
  module: planning-risk-assessment
  function: risk-compliance-legal
  work_types: [document-production, research-synthesis, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Internal audit teams plan many diverse audits with limited staff. Scoping, mapping risks to controls by hand
    before testing starts, is where teams lose the most time (Fieldguide's framing), and planning needs a view of risk
    areas built from prior findings and comparable audits.
  solution: >-
    Helvetia Baloise's group chief audit executive says the team uses AI to support audit work programs, summarise
    reports and policies and assist selected fieldwork such as anomaly identification. FJ Management's head of internal
    audit aims for a state where an auditor sets the audit objective and an agent plans procedures, pulls evidence,
    runs tests and drafts workpapers for review (a stated vision). Fieldguide's Field Agents map risks to controls and
    score them to give a scoped starting point, with the auditor making the final call; BDO's risk advisory practice is
    rolling out the platform, starting with internal audit and third-party assurance. A City of Charlotte internal
    auditor, presenting in a personal capacity, showed a chatbot finding peer audit reports, grouping their findings
    into themes and drafting a table of risk considerations for a planned audit.
  outcomes:
    - {lever: capacity, description: "none published; FJ Management plans to move from reviewing selected workpapers to a secondary review of every workpaper", figure: "none published", measures: "customer stories and demo listings give no figure", provenance: vendor-published, source_ref: OPTRO-FJ-2026}
  prerequisites:
    - "Audit record organised as structured 'atomic units' (risks, entities, processes, controls, observations, test procedures) that agents can use (OPTRO-FJ-2026)"
    - "A GRC platform as system of record, connected to AI tools through MCP (OPTRO-FJ-2026)"
    - "Engagement data and methodology configured in the platform (BDO-FIELDGUIDE-2026)"
    - "Prior audit findings and operational context supplied to the model (VLGAA-NUCCIO-2026)"
  risks_and_guardrails:
    - "FJ's rule: AI drafts and detects, people decide; several models review the same work and disagreement is a signal to investigate; start with one high-leverage, low-risk use case (OPTRO-FJ-2026)"
    - "Fieldguide says agents run under full human supervision with methodology applied consistently and traceability built in (BDO-FIELDGUIDE-2026)"
