# Use cases: assurance / substantive-testing
# Synthesised 2026-10-16 from the wave 1 landscape scan and the practice, discourse and governance deep dives
# (research/runs/wave1/). Source refs follow PUBLISHER-SHORT-YYYY; where the inputs used two refs for one
# document, the synthesis report names the canonical key. Figures are self-reported or vendor-published unless
# the outcome says `independent`. Cross-module overlaps: evidence-to-sample matching (#10) is the canonical home
# of the measured matching figures also quoted in assurance-controls-testing-07; full-population testing of
# balances (#24) complements assurance-controls-testing-08 (controls populations).

- id: assurance-substantive-testing-01
  title: Full-population journal-entry testing with machine-learning anomaly scoring (fraud and management-override response)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Testing the appropriateness of journal entries is a required fraud response under ISA 240 (Revised),
    paragraphs 47-48, and responds to the risk that management overrides controls. Teams filter very large
    ledgers with rules such as posting times or values, which can miss subtler patterns and flood the team with
    false positives: in one research benchmark a rules-based journal-entry test flagged 942 false positives on
    5,000 posting IDs. Large general ledgers held across many Excel files make sampling, searching and
    navigating slow (Buzzacott).
  solution: >-
    A tool scores every entry in the general ledger with machine-learning and statistical models, often run
    alongside rules-based routines, and shows which features made an item unusual. Auditors drill down by
    account, period and risk attribute and select entries for testing from the scored population. Named users:
    Buzzacott (started its MindBridge programme with journal entries), BDO UK (expanded MindBridge across its
    audit practice after a trial, June 2026), KPMG (MindBridge alliance feeding Clara, 2024) and EY (a
    general-ledger analyzer used in most audits per its assurance digital leader in 2024; EY Canvas processes
    more than 1.4 trillion journal-entry lines a year). The FRC's hypothetical example (June 2025) combines an
    unsupervised or deep-learning model with rules-based routines in one tool, weights them and sets a threshold
    above which the team must follow up.
  outcomes:
    - lever: quality
      description: "Regulator-observed adoption of automated tools in journal-entry testing; a prevalence measure, not an outcome or accuracy measure"
      figure: "88% (2024); 86% (2023); about 86% (2025, read from a chart without data labels)"
      measures: "Share of IFIAR members answering the annual survey that 'frequently observed' automated tools and techniques (AI and non-AI) in journal entry testing in audit files; 48 members answered in 2024 and 49 in 2023"
      provenance: independent
      source_ref: IFIAR-TTF-2025
    - lever: quality
      description: "All six U.S. global network firms reported tools that identify and select journal entries (adoption, not quality)"
      figure: "6 of 6 firms (2023 inspection year)"
      measures: "U.S. global network firms (BDO, Deloitte, EY, Grant Thornton, KPMG, PwC) reporting such tools to PCAOB staff"
      provenance: self-reported
      source_ref: PCAOB-TAA-2024
    - lever: capacity
      description: "Scale of journal-entry data processed on one Big Four platform; volume only, no time or quality result"
      figure: "more than 1.4 trillion lines a year"
      measures: "Lines of journal-entry data processed per year on EY Canvas, per the press report of EY's 7 Apr 2026 release (EY's 2024 interview gave more than 800 billion general-ledger line items a year for the GL analyzer)"
      provenance: self-reported
      source_ref: EY-CANVAS-2026
  prerequisites:
    - "A complete general-ledger extract reconciled to the trial balance and loaded in one place (BUZZACOTT-PRIME-2025)"
    - "Ledger data with date, time, poster, description, value and account references (FRC-AIAUDIT-2025, p.11)"
    - "Methodology and technology teams build the tool together; certification before use; version control so only the latest approved version runs (FRC-AIAUDIT-2025, pp.10-11)"
    - "A technical committee or equivalent that owns standards mapping, methodology and policy (BUZZACOTT-PRIME-2025)"
    - "Access to client systems and usable client data: 60% of surveyed US firms name poor client data and 53% lack of system access among top blockers (CPACOM-ATR-2025)"
  risks_and_guardrails:
    - "31% of IFIAR members reported findings that a tool was not used as intended in 2024 (29% in 2023); the most common were misreading results and thin testing of outliers (IFIAR-TTF-2025, pp.5-6)"
    - "An unsupervised model flags only items unusual relative to the population, so entries consistently posted to unusual accounts may not be flagged; the FRC example therefore runs rules-based routines alongside the AI tool (FRC-AIAUDIT-2025, p.10)"
    - "Fraud is a rare event, which is hard for pattern-based tools; an academic commentator suggests pairing fraud specialists with data-driven tools (NYENRODE-QUALITY-2026)"
    - "PCAOB AS 2301.49-.50 (fiscal years beginning on or after 15 Dec 2025) cover investigation of items identified by auditor-set criteria (PCAOB-TAA-2024; SEC-TAAORDER-2024)"
    - "Under the IAASB exposure draft, items that look unusual for the population need further investigation, with the extent depending on the purpose of the procedure (IAASB-ED500-2026, EM paras 63-64)"
    - "Buzzacott teams routinely run datasets with and without the tool to check findings against professional expectations (BUZZACOTT-PRIME-2025)"
    - "The six largest UK firms did no formal monitoring to quantify the audit-quality impact of automated tools (FRC-ATT-2025, p.20)"
  human_checkpoints:
    - "Team decides whether use criteria are met (data quality sufficient; fraud risk not already reduced to an acceptably low level by other procedures) and documents it (FRC-AIAUDIT-2025, p.11)"
    - "Auditor sets control-point weightings and decides how scored results are applied (BUZZACOTT-PRIME-2025)"
    - "Team follows up each high-risk item, considers why it was flagged and stays alert to signs that the tool is systematically flawed for the engagement (FRC-AIAUDIT-2025, p.11)"
    - "Auditor decides what is a misstatement (IAASB-ED500-2026, EM para 64)"
  role_evolution: >-
    RSM Australia describes the role moving from selecting samples to investigating and understanding
    exceptions, so quality depends on how exceptions are triaged (RSM-AUS-2026). In the FRC example, central
    technical and methodology teams own certification, calibration and documentation, while engagement teams
    decide when to use the tool and interpret its output (FRC-AIAUDIT-2025, pp.9-11). Buzzacott reports buy-in
    from new joiners to partners (BUZZACOTT-PRIME-2025).
  evidence_grade: B
  sources:
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.5 table (2023 and 2024); pp.5-6 inspection findings" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.10 trend chart (2023-2025)" }
    - { ref: PCAOB-TAA-2024, title: "Notice of Filing of Proposed Rules on Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 54922; carries Release 2024-007)", publisher: "PCAOB; SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-07-02/pdf/2024-14488.pdf", date: "2024-07-02", access: full, locator: "Economic analysis (current practice); discussion of AS 2301.49-.50" }
    - { ref: SEC-TAAORDER-2024, title: "Order Granting Approval of Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 68218)", publisher: "SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-08-23/pdf/2024-18986.pdf", date: "2024-08-23", access: full, locator: "Section II (summary; effective date)" }
    - { ref: EY-CANVAS-2026, title: "EY Rolls Out Agentic AI in Assurance Across Its Global Network of Accounting Firms", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/04/07/ey-rolls-out-agentic-ai-in-assurance-across-its-global-network-of-accounting-firms/181097/", date: "2026-04-07", access: full, locator: "paras 1-3" }
    - { ref: ACCTODAY-EY-2024, title: "EY beefs up use of AI amid $1B investment", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/ey-beefs-up-use-of-ai-amid-1b-investment", date: "2024-10-16", access: full, locator: "paras 3-4 (GL analyzer)" }
    - { ref: BUZZACOTT-PRIME-2025, title: "How Buzzacott's AI partnership is elevating audit quality", publisher: "PrimeGlobal (Buzzacott)", type: firm, url: "https://www.primeglobal.net/news/how-buzzacotts-ai-partnership-is-elevating-audit-quality", date: "2025-12-18", access: full, locator: "sections 'Implementation' and 'Building trust'" }
