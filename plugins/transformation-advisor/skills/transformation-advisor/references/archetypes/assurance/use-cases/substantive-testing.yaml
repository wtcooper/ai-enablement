- id: assurance-substantive-testing-14
  title: Language-model contract and lease review to target and support revenue and lease testing
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, research-synthesis]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Checking many contracts (a Thomson Reuters product head's example: 100 leases of which 15 differ slightly) or
    contracts spanning hundreds of pages is repetitive and slow. Revenue testing often samples contracts on a
    risk basis, and a tool that only screens for a term can be mistaken for a complete read (FRC-GENAI-2026,
    pp.18 and 49).
  solution: >-
    Thomson Reuters' CoCounsel Document Analysis, a spreadsheet-style AI grid integrated with its audit product,
    applies agentic AI to extract and review client documents at scale; it was in a US early-adopter programme
    with general availability planned for January 2026. TR's audit product head says AI can already do much of
    the lease-checking work. EY's assurance AI leader expects agents to catch inconsistencies in revenue
    contracts of hundreds of pages. RSM Australia says extraction of key terms from leases and contracts has
    reached mid-tier firms through vendors. CPA.com reports that some firms use AI to analyse client contracts,
    leases and debt agreements, without naming them. The FRC's illustrative design for revenue testing: contracts
    are chunked and indexed with stable identifiers; a model extracts risk indicators under prewritten prompts,
    unambiguous ones (bonus, contingent payment, refund, long term) and ones needing evaluation (distinct
    performance obligations, control transferring over time, constrained variable consideration), each evaluated
    by its own prompt; a computation step scores each contract, and those above a threshold form the sample the
    auditor tests.
  outcomes:
    - lever: speed
      description: "Early adopters of a document-analysis product report faster preparation and review; not specific to contract testing"
      figure: "up to 70% faster"
      measures: "Vendor's description of preparation and workpaper review time for unnamed early-adopter customers of CoCounsel Document Analysis; baseline, sample and what 'up to' covers are not stated"
      provenance: vendor-published
      source_ref: TR-AGENTIC-2025
    - lever: quality
      description: "Contract-validity test in the Polish study: models misread automatic-renewal clauses with basic prompts"
      figure: "ChatGPT erred in 5 cases; Gemini and Claude erred or over-flagged in 3 cases each"
      measures: "Cases in the contract-validity test where model results differed from the audit team's, within a 167-sample study of general chat models"
      provenance: independent
      source_ref: GRACZYK-2025
  prerequisites:
    - "A model chosen for audit and accounting knowledge, sector and language coverage, and a context window large enough for whole contracts (FRC-GENAI-2026, illustrative example 2)"
    - "Contracts digitised, chunked and indexed with stable identifiers so output can cite its source (FRC-GENAI-2026, p.51)"
    - "Prompts designed with specialist technical audit and accounting teams, and retrieval of curated firm technical resources for the evaluation step (FRC-GENAI-2026, p.52)"
    - "Certification on contracts from different sectors and terminology, with each risk indicator present and deliberately ambiguous cases to test escalation (FRC-GENAI-2026, illustrative example 2)"
  risks_and_guardrails:
    - "FRC lists four deficient-output risks: extraction prompt not fit for purpose, the model misses or adds content, the model misevaluates, and weights or threshold inappropriate (FRC-GENAI-2026, p.51)"
    - "An auditor may take a tool's lease summary as complete and skip other procedures to find present obligations such as provisions (FRC-GENAI-2026, p.18)"
    - "In the Polish study, models were over-cautious or wrong on automatic-renewal clauses, and ChatGPT treated partial-period coverage as valid (GRACZYK-2025, section 4)"
    - "RSM Australia advises being wary of tools marketed as auditing a balance or concluding (RSM-AUS-2026)"
  human_checkpoints:
    - "The tool escalates to a human at extraction and evaluation when uncertain; the auditor sees which indicators were present for each contract and tests the selected contracts (FRC-GENAI-2026, pp.49-51)"
    - "The file records that an AI tool selected the sample, the criteria met for its use, the contracts selected, the indicators and the testing done (FRC-GENAI-2026, p.50)"
    - "Auditor applies judgement to the AI's findings and decides what further procedures are needed (ICAEW-FRCVIEW-2026)"
  role_evolution: >-
    Thomson Reuters product leaders say time shifts from hours of document review toward analysis and judgment
    (TR-STATE-2026; vendor view). In the FRC example, technical audit and accounting teams set indicator weights
    and thresholds, and engagement auditors test the contracts the tool selects (FRC-GENAI-2026). A senior audit
    manager at Sensiba says the tool helps teams shift mindset to adopting AI responsibly (TR-AGENTIC-2025).
  evidence_grade: C
  sources:
    - { ref: TR-AGENTIC-2025, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows.html", date: "2025-11-05", access: full, locator: "CoCounsel Document Analysis paragraph; Notes to Editors" }
    - { ref: TR-STATE-2026, title: "The state of AI in audit in 2026: Interview with experts", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/state-of-ai-in-audit/", date: "2026-03-30", access: full, locator: "Question 2 (Cobbe: 100 leases, 15 slightly different)" }
    - { ref: CTRLCOUNCIL-WSJ-2026, title: "Why Audit Firms Are Rewriting the Role of the Modern Accountant (reproduces WSJ, 2026-04-10)", publisher: "Controllers Council", type: press, url: "https://controllerscouncil.org/why-audit-firms-are-rewriting-the-role-of-the-modern-accountant/", date: "2026-05-08", access: full, locator: "EY paragraphs (Jackson: contracts spanning hundreds of pages)" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.18 (misinterpretation risk); illustrative example 2, pp.49-56" }
    - { ref: RSM-AUS-2026, title: "AI in Audit and Accounting Firms: Use Cases and Risks", publisher: "RSM Australia", type: firm, url: "https://www.rsm.global/australia/insights/what-role-ai-audit-and-accounting-firms", date: "2026-08", access: full, locator: "section 'Fieldwork', paras 2-3" }
    - { ref: GRACZYK-2025, title: "Use of large language models (LLMs) in auditing as a tool to reduce information asymmetry and fraud risk in the shareholder-management relationship (Graczyk, Majek, Modzelewski)", publisher: "Yearbook of Auditing and Accounting 2025", type: academic, url: "https://pana.gov.pl/wp-content/uploads/2026/04/6.-YoAA_Use-of-large-language-models-LLMs-in-auditing-as-a-tool-o-reduce-information-asymmetry-and-fraud-risk-in-the-hareholder-management-relationship.pdf", date: "2025", access: full, locator: "section 4 error analysis (contract clauses)" }
