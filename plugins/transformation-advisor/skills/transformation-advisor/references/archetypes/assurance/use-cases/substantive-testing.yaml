    - { ref: CPACOM-ATR-2025, title: "Audit Transformation Report: 2025 CPA.com and AICPA Audit Benchmark Survey (54 US firms with complete data)", publisher: "CPA.com and AICPA", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "AI and audit section (contracts, leases and debt agreements)" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-12 (C), practice-13 (idea), governance-05 (C), discourse-05 (C) and the FRC part of
    discourse-04. The FRC example is a regulator's hypothetical design; the FRC says the examples are one way
    tools may be designed and do not describe approved practice. No named audit deployment with a measured
    result was found; the Polish evidence uses general chat models, not audit products. EY's remark is a
    forward-looking expectation.

- id: assurance-substantive-testing-15
  title: Agents applied to judgment-heavier substantive tests (complex revenue such as pharmaceutical rebates; memos checked against data)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Revenue with complex terms such as rebates needs judgment-heavy testing that routine tools did not cover, and
    management memos and analyses can describe something the underlying data does not support
    (CTRLCOUNCIL-WSJ-2026).
  solution: >-
    PwC's US assurance transformation leader said the firm was attempting to apply AI agents to assess whether US
    pharmaceutical rebate revenue was recorded properly, and expects agents to take on tasks with more judgment
    over time, with human oversight. EY's global and Americas assurance AI leader said agents will improve at
    spotting inconsistencies and called the ability to flag a memo not supported by the underlying data
    'incredibly powerful' (an expectation, not a reported result).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "Not applicable"
      provenance: self-reported
      source_ref: CTRLCOUNCIL-WSJ-2026
  prerequisites:
    - "Tools that ingest many client document types, and unstructured documents and structured data together (CTRLCOUNCIL-WSJ-2026)"
  risks_and_guardrails:
    - "PwC's leader said humans would continue to provide oversight as agents take on more judgment (CTRLCOUNCIL-WSJ-2026)"
    - "Probabilistic tools may not give the same output every time; RSM UK's audit data analytics director suggests a rules-based tool alongside AI for data analysis (ICAEW-FRCVIEW-2026)"
    - "In a benchmark of synthetic engagements, revenue workpapers had an average strict pass rate of 7.58% across eleven models (ARXIV-FAB-2026, Table 3)"
  human_checkpoints:
    - "Human oversight of agent testing; auditor reviews flagged inconsistencies (CTRLCOUNCIL-WSJ-2026)"
  role_evolution: >-
    Not described beyond oversight (CTRLCOUNCIL-WSJ-2026).
  evidence_grade: B
  sources:
    - { ref: CTRLCOUNCIL-WSJ-2026, title: "Why Audit Firms Are Rewriting the Role of the Modern Accountant (reproduces WSJ, 2026-04-10)", publisher: "Controllers Council", type: press, url: "https://controllerscouncil.org/why-audit-firms-are-rewriting-the-role-of-the-modern-accountant/", date: "2026-05-08", access: full, locator: "PwC paragraph (Panson, pharmaceutical rebates); EY paragraph (Jackson on inconsistencies)" }
    - { ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC's guidance on generative and agentic AI?", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "section 'Use the illustrative examples' (Bukowski-Kruszyna)" }
    - { ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (Huang, Babu et al.; UIUC, Stanford, Modus Audit Inc.)", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "Table 3" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from discourse-06 (B) and discourse-16 (idea). Grade B is generous: it rests on one sentence from a
    named PwC leader about an attempt ('attempting'), read through a republished copy of the WSJ article. The EY
    memo-checking part is an idea only (an expectation reported second-hand).

- id: assurance-substantive-testing-16
  title: Substantive analytical procedures with technology-built expectations from detailed or unstructured data
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [data-reporting, review-assurance]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Year-over-year comparisons dominate substantive analytics in many firms; only 11% of 54 US firms have an
    automated solution for substantive analytics and 89% say they are not using technology to enable it
    (CPACOM-ATR-2025). Standards say substantive analytical procedures alone are unlikely to be sufficient for
    significant risks, so whether a technology-assisted procedure counts as a test of details or an analytical
    procedure matters, and practice has diverged on the categories (PCAOB-TAA-2024; IAASB-EDOVERALL-2026, para 37).
  solution: >-
    Draft ISA 520's application material says tools may turn unstructured industry reports into structured
    information, or model the relationship between revenue and cost of sales with seasonal, price and volume
    variables, to build a more precise expectation (an expectation is the auditor's estimate of what the recorded
    amount should be). The draft says auditors commonly analyse entire populations with technological tools to
    sharpen risk identification, and that technology-enabled analysis may leave the risk of material misstatement
    in the rest of the population acceptably low. Firms that report using technology mention visualisation,
    full-population testing, AI anomaly detection, continuous testing, ratio analysis, and expense and revenue
    testing. Deloitte Netherlands (internal audit) and KPMG (SOX) describe 100% transaction coverage 'where data
    quality allows' or 'where appropriate'.
  outcomes:
    - lever: capacity
      description: "Adoption of automated solutions for substantive analytics among surveyed US firms; a prevalence figure, not an outcome"
      figure: "11% of firms (89% not using technology to enable substantive analytics)"
      measures: "Share of the 54 firms with complete data in the 2025 CPA.com and AICPA benchmark with an automated solution for substantive analytics; the 89% is the report's separate statement of firms not leveraging technology for it"
      provenance: independent
      source_ref: CPACOM-ATR-2025
    - lever: quality
      description: "Regulators frequently seeing automated tools in substantive procedures (revenue, inventory and similar accounts, not analytics alone)"
      figure: "55% (2024); 51% (2023); about 63% (2025, read from an unlabelled chart)"
      measures: "Share of IFIAR members 'frequently' observing automated tools and techniques in substantive audit procedures in audit files"
      provenance: independent
      source_ref: IFIAR-TTF-2025
  prerequisites:
    - "Disaggregated, reliable data and access to client data; even firms using analytics cite data access as a difficulty (CPACOM-ATR-2025, p.19)"
    - "Validated tools and models with traceable outputs (DELOITTE-NL-SAMPLE-2026)"
    - "Updated definitions: ED-330 and ED-520 propose new definitions of tests of details and substantive analytical procedures (IAASB-EDOVERALL-2026, paras 37 and 40)"
  risks_and_guardrails:
    - "The IAASB says generative tools may make it impossible to fully evaluate inputs or confirm the tool operates as designed, and chose guidance over a requirement (IAASB-ED500-2026, EM paras 67-69)"
    - "FRC: outputs on whole populations may be less conclusive for each item; professional judgment decides what conclusions follow (FRC-GENAI-2026, p.19)"
    - "Firm commenters on the PCAOB amendments preferred not to compare tests of details with analytical procedures; the Board's separate project on substantive analytical procedures was still pending when the amendments were approved (SEC-TAAORDER-2024, footnote 19)"
    - "In IFIAR's 2025 survey, 15 of 331 inspected listed public-interest-entity audits had a finding on substantive analytical procedures (5%); a baseline, not AI-specific (IFIAR-SURVEY-2026, Table B.2)"
  human_checkpoints:
    - "Auditor evaluates whether the expectation is precise enough, investigates differences and unusual items, and obtains evidence for management's explanations (IAASB-ED520-2026, A21-A23; EM para 23)"
  role_evolution: >-
    About a third of surveyed firms said they need at least one non-traditional skill, and about 20% had hired
    staff with non-traditional backgrounds such as data analysts and IT specialists (CPACOM-ATR-2025, Theme 3).
    Deloitte Netherlands says AI reduces the mechanical workload so experienced auditors can focus on judgement
    and investigation, in an internal-audit context (DELOITTE-NL-SAMPLE-2026).
  evidence_grade: C
  sources:
    - { ref: CPACOM-ATR-2025, title: "Audit Transformation Report: 2025 CPA.com and AICPA Audit Benchmark Survey (54 US firms with complete data)", publisher: "CPA.com and AICPA", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "automated-solutions chart (p.10); 'Risk-driven approach and technology' (p.19); Theme 3" }
    - { ref: IAASB-ED520-2026, title: "Exposure Draft: Proposed ISA 520 (Revised), Analytical Procedures, with explanatory memorandum", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-08/IAASB-Audit-Evidence-Risk-Response-ISA-520-Exposure-Draft.pdf", date: "2026-08-05", access: full, locator: "EM paras 5 and 23; application material A20-A23" }
    - { ref: IAASB-EDOVERALL-2026, title: "Explanatory Memorandum to the Exposure Drafts for the Audit Evidence and Risk Response Project (overall)", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-08/IAASB-Audit-Evidence-Risk-Response-Overall-Project-Exposure-Draft.pdf", date: "2026-08-05", access: full, locator: "paras 37, 39-40" }
    - { ref: IAASB-ED500-2026, title: "Exposure Draft: Proposed ISA 500 (Revised), Audit Evidence, with explanatory memorandum", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-08/IAASB-Audit-Evidence-Risk-Response-ISA-500-Exposure-Draft.pdf", date: "2026-08-05", access: full, locator: "EM section 1-F, paras 65-69" }
    - { ref: PCAOB-TAA-2024, title: "Notice of Filing of Proposed Rules on Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 54922; carries Release 2024-007)", publisher: "PCAOB; SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-07-02/pdf/2024-14488.pdf", date: "2024-07-02", access: full, locator: "Discussion of AS 2301.48 (test of details versus analytical procedures)" }
    - { ref: SEC-TAAORDER-2024, title: "Order Granting Approval of Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 68218)", publisher: "SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-08-23/pdf/2024-18986.pdf", date: "2024-08-23", access: full, locator: "Section III; footnote 19" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.19" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.5 (substantive audit procedures row)" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.10 trend chart (2025 substantive procedures)" }
    - { ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025 (14th annual survey)", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix B, Table B.2" }
    - { ref: DELOITTE-NL-SAMPLE-2026, title: "From sample to full-population examination: what AI changes for the third line", publisher: "Deloitte Netherlands", type: firm, url: "https://www.deloitte.com/nl/en/Industries/financial-services/perspectives/from-sample-to-full-population-examination.html", date: "2026-09-16", access: full, locator: "sections 'What broader coverage actually enables' and 'Transaction testing'" }
    - { ref: KPMG-SOX-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "Point of view #4: Scalable, AI-enabled testing" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-19, discourse-08 and governance-07. Change scope set to step (two of three). No named
    firm deployment of AI-built expectations was found. The IAASB drafts are exposure drafts (comments due 15 Dec
    2026), not final standards, and frame whole-population analysis mainly as aiding risk identification. The
    Deloitte NL and KPMG items describe internal audit and SOX respectively (adjacent). The IFIAR 2025 value is
    from IFIAR-TTF-2026, p.10.

- id: assurance-substantive-testing-17
  title: Digital confirmation platforms and direct, authenticated access to bank and third-party data
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [transaction-processing, review-assurance, coordination-scheduling]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Firms prepared and sent bank, lawyer, customer and supplier confirmation requests by hand, stored responses
    manually and chased late replies; one firm's earlier platform allowed only two mailings per third party and
    was distrusted by recipients. Much 'external' evidence reaches auditors as a screenshot, PDF, email or scanned
    letter, which can now be forged or intercepted cheaply (a confirmation vendor's view). Bank transaction data
    reached BDO NL as files that clients downloaded and sent, sometimes more than 156 per engagement, with risk
    of omission or manipulation. The PCAOB's confirmation standard was written over 30 years ago and changed
    little after 2003, while inspection findings and enforcement cases on auditors' control of the process
    continued.
  solution: >-
    Platforms create, send and track confirmation requests with standard templates, reminders, roll-forward of
    prior-year requests without fresh client authority, a status dashboard and an audit trail, and authenticate
    the source and path of each response. Named users of Circit: Moore Polska and Crowe Spain (confirmations,
    client document requests and AR/AP confirmations), Beever & Struthers, now Menzies (80-90% of its
    confirmations), and Kreston Iberaudit. Direct feeds: Rabobank customers consent, through Circit, to share
    transaction data directly with their auditor; BDO NL tested it and aims to rely less on sampling in favour of
    100% testing and, later, continuous auditing. Standards now recognise this: the PCAOB's new standard covers
    paper and electronic methods and requires confirming cash held by third parties or otherwise obtaining
    evidence by directly accessing external information; SAS No. 150 (published 13 Jul 2026, effective for
    periods ending on or after 15 Dec 2028) recognises direct access to a knowledgeable external source; ED-500
    lists confirmation through an electronic platform as an example of a technological tool.
  outcomes:
    - lever: capacity
      description: "A named audit department director reports hours saved per audit across confirmations, client document requests and AR/AP confirmations"
      figure: "up to 20 hours per audit; document PDF preparation from about 3 minutes to 3 seconds"
      measures: "Moore Polska's audit-team hours saved per audit across three Circit products, stated by its Director of the Audit Department in a vendor case study; method not stated"
      provenance: vendor-published
      source_ref: CIRCIT-MOORE-2026
    - lever: speed
      description: "Share of bank confirmations returned within three months of year-end rose against the firm's internal benchmark"
      figure: "improved; no figure published"
      measures: "Beever & Struthers' internal benchmark of bank confirmation responses received within three months of year-end; before and after rates not stated"
      provenance: vendor-published
      source_ref: CIRCIT-BEEVER-2026
    - lever: capacity
      description: "Adoption of automated confirmation solutions among surveyed US firms; a prevalence figure"
      figure: "39% of firms"
      measures: "Share of the 54 firms with complete data in the 2025 CPA.com and AICPA benchmark with an automated solution for confirmations (survey marketed to firms, not a random sample)"
      provenance: independent
      source_ref: CPACOM-ATR-2025
  prerequisites:
    - "Adoption work beyond licensing: training key users, internal communications, a consistent workflow (CIRCIT-BEEVER-2026)"
    - "Banks and other third parties responding through authenticated channels, and a bank that offers a consent-based feed with clients who grant consent (TR-BANKSTATE-2026; CIRCIT-RABOBANK-BDONL-2026)"
    - "Controls over how requests are sent and responses received, so the auditor keeps control of the process (PCAOB-CONFIRM-2023)"
    - "A platform or data connection the auditor can evaluate for reliability (IAASB-ED500-2026, Appendix 3)"
  risks_and_guardrails:
    - "The IAASB's March 2026 project proposal notes electronic or automated confirmation systems may lack sufficient authentication, and requests or responses may be intercepted or manipulated (IAASB-500SERIES-2026)"
    - "The PCAOB Board set the new standard's effective date as fiscal years ending on or after 15 June 2025, subject to SEC approval, which was not confirmed in this research (PCAOB-CONFIRM-2023)"
    - "Negative confirmation requests alone do not provide sufficient appropriate evidence (PCAOB-CONFIRM-2023); SAS No. 150 adds conditions for negative confirmations (JOFA-SAS150-2026)"
    - "Clients can grant and revoke bank-data consent at any time (CIRCIT-RABOBANK-BDONL-2026)"
    - "Mostly workflow automation and data connections, not AI models; Beever & Struthers describes AI and APIs as a next step (CIRCIT-BEEVER-2026)"
  human_checkpoints:
    - "Auditor keeps control of the confirmation request and judges the reliability of responses (IAASB-500SERIES-2026; PCAOB-CONFIRM-2023)"
    - "Auditor investigates the outliers, anomalies and risks that analytics on bank data flag (CIRCIT-RABOBANK-BDONL-2026)"
  role_evolution: >-
    Beever & Struthers staffed the work with a digital transformation lead on a university knowledge-transfer
    project (CIRCIT-BEEVER-2026); Kreston Iberaudit plans to extend use across its whole audit team
    (CIRCIT-KRESTON-2026). BDO NL describes a shift from visiting the client twice a year to more continuous work
    with earlier alerts, as an ambition (CIRCIT-RABOBANK-BDONL-2026).
  evidence_grade: A
  sources:
    - { ref: CIRCIT-MOORE-2026, title: "Moore Polska saves 20 hours per Audit with Circit's PBC and Confirmation requests", publisher: "Circit", type: vendor, url: "https://circit.io/case-study/moore-polska-case-study", date: "2026-05-13", access: full, locator: "sections 'The solution with Circit' and 'Implementing Circit'" }
    - { ref: CIRCIT-BEEVER-2026, title: "Why Beever & Struthers (now Menzies) Made Circit Central to Audit Delivery", publisher: "Circit", type: vendor, url: "https://circit.io/case-study/beever-struthers-case-study", date: "2026-06-26", access: full, locator: "sections 'Measurable ROI' and 'A critical platform for audit delivery'" }
    - { ref: CIRCIT-CROWE-2026, title: "How Crowe Spain boosted accuracy and improved response rates with Circit", publisher: "Circit", type: vendor, url: "https://circit.io/case-study/crowe-case-study", date: "2026-05-19", access: full, locator: "sections 'Before Circit' and 'Implementing Circit'" }
    - { ref: CIRCIT-KRESTON-2026, title: "How Kreston Iberaudit improved efficiency and control with Circit", publisher: "Circit", type: vendor, url: "https://circit.io/case-study/kreston-iberaudit", date: "2026-07-13", access: full, locator: "sections 'Before Circit' and 'Using Circit'" }
