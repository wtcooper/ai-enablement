- id: assurance-substantive-testing-11
  title: Firm-built Excel agents for cash, journal-entry and financial-statement testing, with reviewer-side agents (FGMK on DataSnipper)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Testing each selection means locating the right evidence, extracting values and comparing them with what
    was recorded; preparers build workpapers by hand and reviewers re-check them (DATASNIPPER-CONNECT-2026).
  solution: >-
    FGMK built agents in DataSnipper Excel Agents for cash testing, journal-entry testing and
    financial-statement testing and used them on busy-season work. Preparer-side agents build workpapers and
    snip source evidence; reviewer-side agents check consistency across a workbook and check that financial
    statements roll up. FGMK's QC department also runs financial statements through an agent alongside its own
    review. In 2026 FGMK joined the design-partner programme for Alwin, a cloud agent platform launched 22 Sep
    2026 that runs whole procedures across hundreds of documents with every step logged.
  outcomes:
    - lever: speed
      description: "DataSnipper reports that Excel Agents cut FGMK's testing time per selection"
      figure: "30-45 minutes to about 5 minutes per selection"
      measures: "Testing time per selection at FGMK before and after Excel Agents, as reported in DataSnipper's recap of its 2026 New York event; test type, sample and method not stated"
      provenance: vendor-published
      source_ref: DATASNIPPER-CONNECT-2026
  prerequisites:
    - "Agents built and approved by the firm, with control over who can create and who can use them (DATASNIPPER-FGMK-2026)"
    - "A contract term that client information does not train the models (DATASNIPPER-FGMK-2026)"
    - "Source documents the agent can snip, so every number traces to its source (DATASNIPPER-ALWIN-2026)"
  risks_and_guardrails:
    - "Every agent is versioned and approved before it runs; every result traces to its source document and the auditor signs off (DATASNIPPER-CONNECT-2026)"
    - "FGMK still reviews everything itself; the review agents are a second pass (DATASNIPPER-FGMK-2026)"
  human_checkpoints:
    - "Auditor signs off at the end; review notes are left on cells and sent in batches (DATASNIPPER-FGMK-2026)"
  role_evolution: >-
    FGMK splits agents by role (preparer, reviewer, QC) and manages who builds and who uses them
    (DATASNIPPER-FGMK-2026).
  evidence_grade: A
  sources:
    - { ref: DATASNIPPER-CONNECT-2026, title: "DataSnipper Connect New York 2026: 6 Takeaways on AI and Auditing", publisher: "DataSnipper", type: conference, url: "https://www.datasnipper.com/resources/the-6-biggest-takeaways-from-datasnipper-connect-new-york-2026", date: "2026", access: full, locator: "Takeaway 1 (page undated; refers to a September 2026 release)" }
    - { ref: DATASNIPPER-FGMK-2026, title: "FGMK Uses Alwin to Automate Larger, More Complex Audit Work Securely", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/fgmk-alwin-success-story", date: "2026", access: full, locator: "'Taking audit automation further' and Q&A (page undated)" }
    - { ref: DATASNIPPER-ALWIN-2026, title: "DataSnipper Launches Alwin: End-to-End Agentic Automation for Audit & Finance", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/datasnipper-launches-alwin-end-to-end-agentic-automation-for-audit-finance", date: "2026-09-22", access: full, locator: "paras 1-3 (Robbins, FGMK)" }
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-06 (single source). Graded A on one named firm's before-and-after figure, vendor-published,
    with no method. Alwin itself is an announced product; FGMK is a design partner. The QC-agent use is routed to
    quality-management. DataSnipper's vendor claims (600,000+ users in 175 countries, all Big Four as customers,
    $1.4B of productivity savings in 2025) are in #12's sources and are not independently measured.

- id: assurance-substantive-testing-12
  title: Excel-embedded evidence snipping and AI extraction for tie-out and vouching (DataSnipper)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: document-to-decision
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Auditors reconcile numbers from invoices, bank statements and inventory documents to transactions by hand,
    and reviewers must re-find the evidence (DATASNIPPER-ODP-2026).
  solution: >-
    The auditor 'snips' values from source documents into Excel, where they reconcile to the transaction and keep
    a link to the source, so a reviewer can click through. AI Extractions and DocuMine add extraction from
    unstructured documents across languages and a document question-and-answer tool. DataSnipper says AI
    pre-validated more than two million data points from client-provided documents in 2025 through its PBC
    product.
  outcomes:
    - lever: cost
      description: "DataSnipper cites a UK Parliament Public Accounts Committee hearing as referencing the National Audit Office reporting efficiency savings and faster routine work"
      figure: "GBP 400,000 of efficiency savings; routine audit work up to three times faster"
      measures: "Figures DataSnipper attributes to the NAO via a PAC hearing on the NAO Annual Report; the work covered, baseline and period are not stated, and the hearing record was not opened"
      provenance: vendor-published
      source_ref: DATASNIPPER-PRODUCTIVITY-2026
    - lever: capacity
      description: "Volume of client-document data points pre-validated by AI in the vendor's PBC product"
      figure: "more than 2 million data points (2025)"
      measures: "Data points from client-provided documents that DataSnipper says its AI pre-validated across customers in 2025; not an accuracy or audit-quality measure"
      provenance: vendor-published
      source_ref: DATASNIPPER-PRODUCTIVITY-2026
  prerequisites:
    - "Working papers in Excel and source documents that can be loaded into the tool (DATASNIPPER-PRODUCTIVITY-2026)"
    - "Regional data residency for enterprise customers; DataSnipper says it added U.S., EU and Australian data centres (DATASNIPPER-PRODUCTIVITY-2026)"
  risks_and_guardrails:
    - "Every number traces to its snip, giving reviewers a visible trail (DATASNIPPER-ALWIN-2026)"
    - "Company-provided external information still needs the source-and-handling analysis of AS 1105.10A (PCAOB-PS2025-004)"
  human_checkpoints:
    - "Auditor selects and snips the evidence; reviewer clicks through to the source (DATASNIPPER-ODP-2026)"
  role_evolution: >-
    The vendor says its audience widened in 2025 from external audit to internal audit and corporate finance,
    with new corporate customers up nearly 100% year over year (DATASNIPPER-PRODUCTIVITY-2026).
  evidence_grade: B
  sources:
    - { ref: DATASNIPPER-PRODUCTIVITY-2026, title: "DataSnipper Delivers $1.4B in Productivity Savings in 2025 as Audit and Finance Enter the AI Era", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/datasnipper-delivers-1-4b-in-productivity-savings-in-2025-as-audit-and-finance-enter-the-ai-era", date: "2026-01-14", access: full, locator: "sections 'Scaling AI-Powered Workflows Globally' and 'Measurable Productivity Savings'" }
    - { ref: DATASNIPPER-CHILE-2026, title: "DataSnipper Brings AI-Powered Audit Technology to Chile", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/datasnipper-brings-ai-powered-audit-technology-to-chile", date: "2026-03-25", access: full, locator: "para 2 (600,000+ users in 175 countries, vendor claim)" }
    - { ref: DATASNIPPER-ODP-2026, title: "DataSnipper Success Stories - The ODP Corporation", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/the-odp-corporation", date: "2026", access: full, locator: "'Using DataSnipper as an Internal Audit Reviewer' (undated internal-audit story)" }
    - { ref: DATASNIPPER-ALWIN-2026, title: "DataSnipper Launches Alwin: End-to-End Agentic Automation for Audit & Finance", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/datasnipper-launches-alwin-end-to-end-agentic-automation-for-audit-finance", date: "2026-09-22", access: full, locator: "paras 1-3" }
    - { ref: PCAOB-PS2025-004, title: "Policy Statement Regarding Implementation of Paragraph .10A of AS 1105, Audit Evidence (Release 2025-004)", publisher: "PCAOB", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/rulemaking/docket-052/pcaob-release-no-2025-004.pdf", date: "2025-09-18", access: full, locator: "p.1 and footnote 2" }
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-07 (single source). Capped at B: the only named-organisation figure (NAO) is second-hand and the
    type of work is not stated. The ODP Corporation story concerns internal audit (SOX and operational audits)
    and is cited only for the reviewer workflow. An undated Baker Tilly Germany story on the vendor site (40-50%
