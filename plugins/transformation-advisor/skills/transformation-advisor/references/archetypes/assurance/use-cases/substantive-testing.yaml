- id: assurance-substantive-testing-18
  title: Drone and imaging tools for inventory counts, reconciled to perpetual records
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [physical-field, review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Inventory observation needs auditors present at counts of large warehouses and outdoor stock, which is slow
    and disruptive to clients (EY-DRONE-JOFA-2018). ISA 501 is unclear whether 'attendance' at a count can
    include remote observation using technology (IAASB-500SERIES-2026). Inventory procedures had a finding in 26
    of 279 inspected listed public-interest-entity audits (9%) in IFIAR's 2025 survey (IFIAR-SURVEY-2026).
  solution: >-
    EY ran a proof of concept (2018) in which drones fly mapped routes autonomously, scan barcodes, QR codes,
    RFID and labels, and send the data to the audit platform to reconcile to the client's perpetual records. An
    academic design-science study tested drones with automated counting software on cattle and sheep. IFIAR lists
    drones and imaging tools among technologies firms continue to explore and deploy for physical observation,
    inventory counts and remote assets, and the IAASB's March 2026 project proposal names drones, scanners and
    camera systems as remote-observation tools.
  outcomes:
    - lever: speed
      description: "Drone counts were much faster than manual counts in an academic study"
      figure: "681 hours to 19 hours"
      measures: "Count time, manual versus drone with automated counting software, in a design-science study on cattle and sheep (homogeneous items)"
      provenance: independent
      source_ref: CHRIST-DRONE-2021
    - lever: quality
      description: "Error rates fell in the same study"
      figure: "0.15% to 0.03%"
      measures: "Count error rates, manual versus drone, in the same cattle-and-sheep study"
      provenance: independent
      source_ref: CHRIST-DRONE-2021
  prerequisites:
    - "Per-client set-up that teaches the drone what to scan; EY said this limits use to large clients (EY-DRONE-JOFA-2018)"
    - "Perpetual inventory records to reconcile to (EY-DRONE-JOFA-2018)"
    - "Revised standards or clear guidance on whether remote observation meets attendance requirements (IAASB-500SERIES-2026)"
  risks_and_guardrails:
    - "A missed label shows as a difference to the perpetual records; blocked RFID reads are a practical limit (EY-DRONE-JOFA-2018)"
    - "Interviews in the study found firms reluctant to be first movers and standard-setters slow to give guidance (CHRIST-DRONE-2021, abstract)"
    - "The IAASB wants to reinforce professional skepticism for inventory evidence (IAASB-500SERIES-2026)"
    - "IFIAR states its technology examples are illustrative and its usage observations directional (IFIAR-TTF-2026, Appendix A)"
  human_checkpoints:
    - "Auditor sets scan parameters and the sampling technique (100% scan or every fifth box) and reconciles results (EY-DRONE-JOFA-2018)"
    - "Auditor judges the sufficiency and appropriateness of evidence obtained by alternative means (IAASB-500SERIES-2026)"
  role_evolution: >-
    EY described a drone flying autonomously so no auditor has to fly it inside a client's warehouse, with less
    disruption to the client; no staffing change is reported (EY-DRONE-JOFA-2018).
  evidence_grade: B
  sources:
    - { ref: CHRIST-DRONE-2021, title: "Prepare for takeoff: improving asset measurement and audit quality with drone-enabled inventory audit procedures (Christ, Emett, Summers, Wood)", publisher: "Review of Accounting Studies", type: academic, url: "https://link.springer.com/article/10.1007/s11142-020-09574-5", date: "2021", access: full, locator: "abstract and note 1 (full text paywalled; abstract via text mirror)" }
    - { ref: EY-DRONE-JOFA-2018, title: "Using drones to enhance audits", publisher: "Journal of Accountancy podcast (EY global assurance digital leader)", type: podcast, url: "https://www.journalofaccountancy.com/podcast/using-drones-to-enhance-audits/", date: "2018-07-30", access: full, locator: "transcript (proof of concept; mistakes)" }
    - { ref: IAASB-500SERIES-2026, title: "Project proposal to revise audit evidence standards related to inventory and external confirmations (Agenda Item 4-D)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/20260316-Agenda-Item-4D-500Series-Project-Proposal-%28Approved%29.pdf", date: "2026-03-16", access: full, locator: "Inventory in ISA 501, items (a) and (b), PDF p.5" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "Appendix A, p.12" }
    - { ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025 (14th annual survey)", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix B, Table B.2" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-20 (B), discourse-13 (idea) and governance-12 (idea). Ladder follows the only entry that
    describes a working tool (the two idea entries said assist). Grade capped at B: the independent measure is
    for livestock, which the study chose because current technology suits homogeneous items, and EY's work was a
    2018 proof of concept. No 2025-26 firm deployment of AI-based counting was found; an unopened July 2026
    preprint on drone imagery (search snippet only) is not used.

- id: assurance-substantive-testing-19
  title: "Idea: AI-generated independent expectations and challenge for management's accounting estimates"
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Accounting estimates, including fair value, had the highest finding rate among inspection themes in IFIAR's
    2025 survey: 112 of 498 inspected listed public-interest-entity audits (22%) (IFIAR-SURVEY-2026, Table B.2).
    Researchers note firms are investing in AI to help auditors evaluate complex estimates (COMMERFORD-2022).
  solution: >-
    An AI system supplies contradictory evidence or an alternative estimate that the auditor weighs against
    management's estimate (COMMERFORD-2022). Specialists may use AI to support advice on estimates such as a
    fair-value discount rate (ICPAS-PEECHER-2026).
  outcomes:
    - lever: quality
      description: "Experiment: auditors who received contradictory evidence from their firm's AI system rather than a human specialist proposed smaller adjustments to management's complex estimates"
      figure: "direction of effect only; no percentage in the abstract"
      measures: "Controlled experiment on auditor judgements; the effect was stronger when management used relatively objective inputs"
      provenance: independent
      source_ref: COMMERFORD-2022
    - lever: quality
      description: "Experiment: auditors who first reflected on their weakest skills discounted AI-reliant specialist advice and accepted more aggressive estimates; a short exercise recalling their strongest skills reduced this"
      figure: "none published in the practitioner summary"
      measures: "Not applicable; the authors' summary gives no figures"
      provenance: independent
      source_ref: ICPAS-PEECHER-2026
  prerequisites:
    - "A firm-specific AI system whose evidence can be compared with management's inputs (COMMERFORD-2022)"
    - "Auditor digital-skills development alongside affirmation of core audit skills (ICPAS-PEECHER-2026)"
  risks_and_guardrails:
    - "Algorithm aversion: auditors discounted AI advice relative to identical human-specialist advice (COMMERFORD-2022)"
    - "IFIAR says AI tools tend to generalise on complex estimates and new or unprecedented events, so human context-specific judgement and scepticism matter most there (IFIAR-TTF-2025, p.8)"
    - "Defensive reactions weakened rather than strengthened skepticism in the experiment (ICPAS-PEECHER-2026)"
  human_checkpoints:
    - "Auditor evaluates the evidence, any specialist's advice and management's estimate, and decides on adjustments (COMMERFORD-2022; ICPAS-PEECHER-2026)"
  role_evolution: >-
    The authors of the identity-threat study argue the future is a 'duality' of traditional accounting and
    digital expertise (ICPAS-PEECHER-2026).
  evidence_grade: D
  sources:
    - { ref: COMMERFORD-2022, title: "Man Versus Machine: Complex Estimates and Auditor Reliance on Artificial Intelligence (Commerford, Dennis, Joe, Ulla)", publisher: "Journal of Accounting Research 60(1)", type: academic, url: "https://ideas.repec.org/a/bla/joares/v60y2022i1p171-201.html", date: "2022-03", access: full, locator: "abstract" }
    - { ref: ICPAS-PEECHER-2026, title: "What's Really Behind AI Aversion in Auditing?", publisher: "Illinois CPA Society (authors at UIUC and Erasmus University Rotterdam)", type: academic, url: "https://www.icpas.org/information/copy-desk/insight/article/digital-exclusive-2026/what-s-really-behind-ai-aversion-in-auditing", date: "2026-05-13", access: full, locator: "sections 'Research Overview' and 'How AI Aversion Can Undermine Audit Quality'" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.8 (complex estimates)" }
    - { ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025 (14th annual survey)", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix B, Table B.2" }
  last_reviewed: "2026-10-16"
  notes: >-
    Idea: discussed by researchers and a regulator; no firm deployment for estimates testing was found. Merged
    from discourse-14 and governance-13. Commerford et al. is a 2022, pre-generative-AI experiment; the Peecher
    et al. paper itself was not opened. The landscape's SSRN field experiment on inventory valuation could not be
    reached by any angle. Use of valuation specialists is routed to the specialists module.

- id: assurance-substantive-testing-20
  title: Agents run routine substantive tests (expense vouching, search for unrecorded liabilities), moving to orchestrated end-to-end runs
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Routine testing (payroll, expense vouching, cash, unrecorded liabilities, receivables) has meant pulling a
    finite sample, extracting data to a spreadsheet, applying audit guidance and marking pass or fail, which
    absorbs junior staff time (CTRLCOUNCIL-WSJ-2026). In most teams the auditor is both orchestrator and executor
    of each test, which keeps the time from evidence collection to finished workpaper long (FIELDGUIDE-ORCH-2026).
  solution: >-
    KPMG announced on 22 Apr 2025 agents in Clara that support and automate parts of substantive procedures,
    including expense vouching and the search for unrecorded liabilities and accrued expenses, aimed at more than
    95,000 auditors with a human in the loop; more agents were promised within 12 months. In April 2026 KPMG
    leaders described orchestration agents managing several testing agents, with a pilot in summer 2026 and full
    deployment on certain tests the following year; humans would still review, collect data and assess risk.
    Fieldguide's Field Orchestrator (announced 8 Jun 2026) lets the auditor direct an agent that plans the test,
    analyses the population, calculates the sample, prompts for evidence and coordinates specialised testing
    agents; its first end-to-end test is the search for unrecorded liabilities, tracing post-cutoff payments to
    bank statements, vendor invoices and payment records and flagging exceptions with context. DataSnipper
    describes prebuilt payables agents that check post-period payments for unrecorded liabilities.
  outcomes:
    - lever: capacity
      description: "Forecast only, not a measured result: some Big Four firm leaders estimate agents will contribute 20-30% of a typical financial audit by 2029"
      figure: "20-30% (forecast)"
      measures: "Estimated share of a typical financial audit's work contributed by agents by 2029, attributed by the WSJ to 'some Big Four firm leaders'"
      provenance: self-reported
      source_ref: CTRLCOUNCIL-WSJ-2026
    - lever: capacity
      description: "none published for KPMG's Clara agents"
      figure: "none published"
      measures: "Not applicable; the 95,000 is the auditor population the deployment is aimed at, not users or an effect"
      provenance: self-reported
      source_ref: KPMG-CLARA-2025
  prerequisites:
    - "Evidence ingestion that copes with many document formats (PWC-AT-2025)"
    - "Parallel runs alongside human testing to compare results (CTRLCOUNCIL-WSJ-2026)"
    - "Engagement documentation and methodology inside the platform; upskilling so staff keep professional skepticism (KPMG-CLARA-2025)"
    - "A population file and engagement context loaded in the testing workspace, with evidence collected and linked as the agent prompts (FIELDGUIDE-ORCH-2026)"
  risks_and_guardrails:
    - "The human auditor remains accountable under FRC guidance; Deloitte's stance in the same reporting is more conservative, stressing human judgment, skepticism and accountability (CTRLCOUNCIL-WSJ-2026)"
    - "KPMG says auditors stay in control of decision-making (KPMG-CLARA-2025); Fieldguide's agent stops at each major step for human review by design (FIELDGUIDE-ORCH-2026)"
    - "FRC: outputs on whole populations may be less conclusive for each item than traditional substantive work (FRC-GENAI-2026, p.19)"
    - "Adjacent benchmark evidence: synthetic accounts-payable workpapers had an average strict pass rate of 68.18%, and agents sometimes documented work on whatever was available when subsequent-period information was missing (ARXIV-FAB-2026, Table 3 and section 6.3)"
    - "KPMG's promised follow-on controls-testing agents were not confirmed as released in any source read (KPMG-CLARA-2025)"
  human_checkpoints:
    - "Humans review test results and handle data collection and risk assessment; a KPMG briefing slide showed only routine testing with no human team within two to three years (CTRLCOUNCIL-WSJ-2026)"
    - "Auditor confirms the plan, reviews outputs after each phase, reviews exceptions and signs off the conclusion (FIELDGUIDE-ORCH-2026)"
  role_evolution: >-
    KPMG's audit chief digital officer said he would not hire a graduate to create workpapers and wants people
    who can understand a workpaper's findings with AI help; KPMG describes 'lifting the pyramid up'
    (CTRLCOUNCIL-WSJ-2026). KPMG says agents free auditors for high-risk areas (KPMG-CLARA-2025). Fieldguide
    describes senior staff moving from running the procedure to reviewing results and evaluating exceptions
    (FIELDGUIDE-ORCH-2026; vendor view).
  evidence_grade: B
  sources:
    - { ref: CTRLCOUNCIL-WSJ-2026, title: "Why Audit Firms Are Rewriting the Role of the Modern Accountant (reproduces WSJ, 'In This Critical Part of Audits, the Accountant's Role Is Shrinking Fast', 2026-04-10)", publisher: "Controllers Council", type: press, url: "https://controllerscouncil.org/why-audit-firms-are-rewriting-the-role-of-the-modern-accountant/", date: "2026-05-08", access: full, locator: "KPMG paragraphs (orchestration agents, summer pilot); routine-testing paragraph; 20-30% by 2029 paragraph; read via text mirror" }
    - { ref: KPMG-CLARA-2025, title: "KPMG advances AI integration in KPMG Clara smart audit platform", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/04/kpmg-advances-ai-integration-in-kpmg-clara-smart-audit-platform.html", date: "2025-04-22", access: full, locator: "Highlights; paras 4-6" }
    - { ref: ACCTODAY-KPMG-2025, title: "KPMG builds AI agents into audit platform", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/kpmg-builds-ai-agents-into-audit-platform", date: "2025-04-24", access: full, locator: "para 2" }
    - { ref: FIELDGUIDE-ORCH-2026, title: "Introducing Field Orchestrator: The Intelligence Layer for Financial Audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/field-orchestrator", date: "2026-06-08", access: full, locator: "sections 'What Field Orchestrator actually does', 'The first test case', 'Human-in-the-loop by design'" }
    - { ref: DATASNIPPER-PAYABLES-2026, title: "5 AP Audit Procedures External Auditors Run With a Prebuilt Agent", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/5-payables-and-expenses-procedures-external-auditors-can-run-with-a-prebuilt-agent", date: "2026", access: full, locator: "unrecorded-liabilities procedure (page undated)" }
    - { ref: PWC-AT-2025, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28", access: full, locator: "paragraph on Evidence Match ('ingest 20 different kinds of documents')" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.19 (methodology risk: whole-population outputs)" }
    - { ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (Huang, Babu et al.; UIUC, Stanford, Modus Audit Inc.)", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "Table 3; section 6.3" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from discourse-02 (B), practice-03 (C), governance-11 (C) and practice-09 (C). Tense matters: KPMG's
    April 2025 release describes agents as deployed, but no usage figure, customer, inspection comment or outcome
    was found 18 months later; the orchestration phase is a pilot, with deployment on certain tests planned for
    2027. Field Orchestrator is a product post with no named customer. The WSJ text was read through a
    republished copy, so wording should be checked against the original before external use. A Bloomberg Tax
    headline of 1 Apr 2026 ('KPMG to Test Advanced AI Agents in Next Phase') was not opened.

- id: assurance-substantive-testing-21
  title: Auditor agents and client agents exchange evidence requests and support, with auditors reviewing the resulting workpapers (EY pilot)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Selecting items, requesting support from the client, chasing it and assembling workpapers is manual and slow
    (CTRLCOUNCIL-WSJ-2026).
  solution: >-
    EY described pilots in which its agents make preliminary selections of financial statement data and request
    supporting information; the client's agents collect the support and send it back; EY's agents prepare
    workpapers that humans review. Separately, EY says its multi-agent framework is embedded in all audit phases
    through EY Canvas, with support for all end-to-end activities expected by 2028.
  outcomes:
    - lever: speed
      description: "none published"
      figure: "none published"
      measures: "Not applicable"
      provenance: self-reported
      source_ref: CTRLCOUNCIL-WSJ-2026
  prerequisites:
    - "Clients with their own agents or digital evidence stores (CTRLCOUNCIL-WSJ-2026)"
  risks_and_guardrails:
    - "Agent-to-agent evidence exchange raises the authenticity questions practitioners raise about evidence generally (TR-BANKCONF-2026)"
  human_checkpoints:
    - "Humans review the workpapers the agents prepare (CTRLCOUNCIL-WSJ-2026)"
  role_evolution: >-
    Not described beyond review (CTRLCOUNCIL-WSJ-2026).
  evidence_grade: B
  sources:
    - { ref: CTRLCOUNCIL-WSJ-2026, title: "Why Audit Firms Are Rewriting the Role of the Modern Accountant (reproduces WSJ, 2026-04-10)", publisher: "Controllers Council", type: press, url: "https://controllerscouncil.org/why-audit-firms-are-rewriting-the-role-of-the-modern-accountant/", date: "2026-05-08", access: full, locator: "EY paragraphs (agents talking with clients' agents; 'changes being piloted now')" }
    - { ref: EY-CANVAS-2026, title: "EY Rolls Out Agentic AI in Assurance Across Its Global Network of Accounting Firms", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/04/07/ey-rolls-out-agentic-ai-in-assurance-across-its-global-network-of-accounting-firms/181097/", date: "2026-04-07", access: full, locator: "paras 3-4 (all phases now; end-to-end by 2028)" }
    - { ref: TR-BANKCONF-2026, title: "Audit in an AI World: AI is raising the stakes for electronic bank confirmations", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/why-ai-is-raising-the-stakes-for-bank-confirmations/", date: "2026-09-02", access: full, locator: "section 'Appearance is not authentication'" }
  last_reviewed: "2026-10-16"
  notes: >-
    From discourse-07 (single source). The WSJ text says the agent-to-agent exchange is among changes 'being
    piloted now'; EY's release says AI is embedded in all phases and expected to support all end-to-end
    activities by 2028. These are different claims and are not merged. Evidence-request agents on the controls
    side are in assurance-controls-testing-03.

- id: assurance-substantive-testing-22
  title: Firm-wide agent platforms that execute preliminary procedures and draft substantive workpapers for review (EY Canvas, Deloitte Omnia, Grant Thornton Gtap)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Global firms need consistent execution of methodology across thousands of engagements and have limited senior
    time for judgment-heavy work (DELOITTE-OMNIA-2026; EY-CANVAS-2026). Staff-level fieldwork on balances such as
    cash, payables, receivables, revenue and journal entries takes hours per workpaper: a benchmark team
    estimated 2-12 hours of manual completion per workpaper, excluding senior review and rework (ARXIV-FAB-2026,
    Table 3).
  solution: >-
    Deloitte (24 Jun 2026) says agents in Omnia execute preliminary procedures, including data extraction,
    evidence analysis, drafting documentation and preliminary conclusions for professionals to review. EY (7 Apr
    2026) says its multi-agent framework is embedded in all phases across 130,000 assurance professionals and
    160,000 engagements, with end-to-end support expected by 2028. Grant Thornton US (May 2026) says its platform
    has workflows and agents that identify risks and anomalies, with private-company audits first and public
    companies the following year. In the FinancialAuditBench benchmark, agents receive the audit plan, assessed
    risks, supporting documents and a workpaper template, then perform the procedures and write the workpaper.
  outcomes:
    - lever: quality
      description: "Best model on workpaper-completion tasks in a benchmark of synthetic engagements"
      figure: "69.17% strict pass in one attempt; 44.44% passing all eight attempts; partial credit 95.84%"
      measures: "Share of workpaper-completion tasks, averaged over tasks and eight runs each, in which every applicable rubric criterion (about ten scored checks per workpaper) was met; synthetic engagements, auditor-written rubrics"
      provenance: vendor-published
      source_ref: ARXIV-FAB-2026
    - lever: quality
      description: "Strict pass rate by workpaper area, averaged over eleven models and eight runs"
      figure: "accounts receivable 4.17%; revenue 7.58%; journal-entry risk testing 16.86%; cash 56.06%; accounts payable 68.18%; journal-entry completeness 94.51%"
      measures: "Average strict (all-criteria) pass rate across all evaluated models and runs on synthetic workpapers of each area"
      provenance: vendor-published
      source_ref: ARXIV-FAB-2026
    - lever: speed
      description: "Median agent runtime versus estimated manual completion time; the authors say this does not establish equivalent time savings"
      figure: "7-12 minutes versus 2-12 hours"
      measures: "Median runtime by workpaper area versus auditors' approximate manual estimates, which exclude senior review and corrective rework"
      provenance: vendor-published
      source_ref: ARXIV-FAB-2026
    - lever: speed
      description: "PwC (a related programme, not one of the three platforms) says time savings a year in are not dramatic yet"
      figure: "none published"
      measures: "Qualitative statement by PwC US's assurance transformation leader about busy-season time"
      provenance: self-reported
      source_ref: CFODIVE-PWC-2026
  prerequisites:
    - "A single global platform and methodology so agents apply consistently (DELOITTE-OMNIA-2026)"
    - "Training: EY's global programme for all audit and technology-risk professionals; Deloitte's 'tutor mode' for micro-training in the flow of work (EY-CANVAS-2026; DELOITTE-OMNIA-2026)"
    - "An organised engagement binder and a workpaper template that specifies the procedures (ARXIV-FAB-2026, section 3)"
    - "Certification of each model and prompt, tested against cases that probe known weaknesses (FRC-GENAI-2026, certification section)"
    - "Engagement leaders set expectations at the outset for how technology will be used (IFIAR-TTF-2026, p.7)"
  risks_and_guardrails:
    - "Benchmark failure analysis found four recurring errors: not considering downstream effects of changes, insufficient retrieval, inadequate evaluation of evidence sources, and reluctance to leave items open when information was missing (ARXIV-FAB-2026, section 6.3)"
    - "The benchmark's authors conclude that deploying agents without professional oversight is ill-advised (ARXIV-FAB-2026, section 6.2)"
    - "IFIAR asks firms to consult regulators early where AI makes judgements without human involvement, to keep auditors responsible for evaluating and challenging AI decisions, and to say what 'human-led' means in practice (IFIAR-TTF-2025, p.8; IFIAR-TTF-2026, pp.5 and 7)"
    - "Grant Thornton US attest services sit in a separate licensed firm under an alternative practice structure, which raises independence questions for the acceptance-independence module (GT-GTAP-2026)"
    - "Benchmark authors observed agents over-documenting and writing in fragments, which raises reviewer effort (ARXIV-FAB-2026, section 7)"
  human_checkpoints:
    - "Oversight at control points, such as when intermediate outputs are ready or the agent wants to take certain actions, set by professional judgement (FRC-GENAI-2026, p.38)"
    - "Professionals review preliminary conclusions; Grant Thornton says professionals supervise every step (DELOITTE-OMNIA-2026; GT-GTAP-2026)"
  role_evolution: >-
    Deloitte says professionals will 'supervise, validate, and work alongside AI' and adds tutor agents for
    on-demand training (DELOITTE-OMNIA-2026). EY expects its platform to support all end-to-end audit activities
    by 2028 (EY-CANVAS-2026).
  evidence_grade: C
  sources:
    - { ref: DELOITTE-OMNIA-2026, title: "Deloitte Unveils Connected Agentic Intelligence in Deloitte Omnia to Advance Audit & Assurance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/about/press-room/unveils-connected-agentic-intelligence-omnia-advance-audit-assurance.html", date: "2026-06-24", access: full, locator: "paras 1-4; 'Investing in upskilling' section" }
    - { ref: EY-CANVAS-2026, title: "EY Rolls Out Agentic AI in Assurance Across Its Global Network of Accounting Firms", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/04/07/ey-rolls-out-agentic-ai-in-assurance-across-its-global-network-of-accounting-firms/181097/", date: "2026-04-07", access: full, locator: "paras 2-3, 7" }
    - { ref: GT-GTAP-2026, title: "Grant Thornton launches AI platform for audit business", publisher: "Consultancy.org (Consulting.us)", type: press, url: "https://www.consulting.us/news/13378/grant-thornton-launches-ai-platform-for-audit-business", date: "2026-05-11", access: full, locator: "paras 1-3, 7-8" }
    - { ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (Huang, Babu et al.; UIUC, Stanford, Modus Audit Inc.)", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "sections 3, 6.2-6.4, 7; Tables 1 and 3; Figure 3" }
    - { ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "paras 8-9" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "certification; human in the loop review and oversight (pp.37-38)" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.8" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp.5 and 7" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-17 (C) and governance-09 (C). The firm items are announcements; no firm has published
    error or override rates for substantive agents. The benchmark is the only measured result: synthetic
    engagements, authors include Modus Audit Inc. employees (hence vendor-published), model names as reported in
    the paper. Grant Thornton's launch date is 7 May in the landscape; the opened article is dated 11 May 2026.
    The Bloomberg Tax report that RSM US plans to invest $1 billion over three years in agents is search-only and
    supports nothing here.

- id: assurance-substantive-testing-23
  title: "Idea: a second AI reviews AI-performed substantive work for errors and omissions"
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Senior auditors review staff workpapers, which takes time and can miss errors; the FRC lists tools that can
    review work to identify omissions or inconsistencies among AI tools that may be deployed on an engagement
    (FRC-AIAUDIT-2025, p.6).
  solution: >-
    The AICPA practice aid (as reported by Accounting Today) says one AI tool may be used to perform a procedure
    and another to review whether it was performed correctly and whether the result makes sense, without reducing
    the auditor's supervision and review duties. In FinancialAuditBench, an agent reviews a completed workpaper
    against the supporting files and corrects errors while preserving correct work.
  outcomes:
    - lever: quality
      description: "Review of agent-completed synthetic workpapers by the best reviewing model"
      figure: "strict pass 28.89% before review, 62.22% after; partial credit 87.34% to 94.57%"
      measures: "Share of 45 review tasks in which all rubric criteria were met; every reviewing model started from the same workpaper and was run once; some individual workpapers scored lower after review"
      provenance: vendor-published
      source_ref: ARXIV-FAB-2026
  prerequisites:
    - "Access to the same supporting files the preparer used, and a rubric or checklist of what the review must cover (ARXIV-FAB-2026, section 6.5)"
    - "Firm quality-management policies for authorising, monitoring and revalidating AI tools (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "Agent review improves workpaper quality but does not reliably resolve all errors (ARXIV-FAB-2026, section 6.5)"
    - "A PIA Group technology leader warns that using AI to validate AI can create a closed system in which errors are hard to detect (NYENRODE-QUALITY-2026)"
    - "Reviewers need the competence to find deficiencies, should apply scepticism and be aware of automation bias (FRC-GENAI-2026, p.37)"
  human_checkpoints:
    - "A human reviewer remains responsible for the reviewed workpaper (FRC-GENAI-2026, p.37); the second tool does not replace the auditor's supervision and review (AT-AICPAPA-2026)"
  role_evolution: >-
    Not studied; the benchmark treats agent review as a co-pilot role under professional oversight
    (ARXIV-FAB-2026, section 7).
  evidence_grade: D
  sources:
    - { ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (Huang, Babu et al.; UIUC, Stanford, Modus Audit Inc.)", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "section 6.5; Table 4; section 7" }
    - { ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph beginning 'The guidance also said that, in an audit of financial statements, one AI tool may be used'" }
    - { ref: FRC-AIAUDIT-2025, title: "AI in Audit: illustrative example and documentation guidance", publisher: "FRC (UK)", type: regulator, url: "https://media.frc.org.uk/documents/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "p.6 (scope of AI tools)" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p.37" }
    - { ref: NYENRODE-QUALITY-2026, title: "AI in auditing: balancing quality, professional skepticism, and responsibility", publisher: "Nyenrode Business University", type: academic, url: "https://www.nyenrode.nl/en/news/n/ai-auditing-quality-skepticism-responsibility", date: "2026-06-18", access: full, locator: "section 'When is AI reliable enough?'" }
  last_reviewed: "2026-10-16"
  notes: >-
    Idea: permitted in guidance and measured in a benchmark, but no deployment on substantive workpapers was
    found. Merged from governance-10 and discourse-15. Synthetic engagements; benchmark authors include Modus
    Audit Inc. employees. A deployed analogue on control-testing workpapers is assurance-controls-testing-10 (FJ
    Management).

- id: assurance-substantive-testing-24
  title: AI-native audit pilot where agents test balances on full populations and against third-party data instead of samples (PwC Australia)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Auditors spend time on data gathering and documentation rather than analysis, and sampling limits the
    scrutiny applied to balances (PWCAU-AT-2025). A practitioner commentary argues that sampling was the practical
    limit of what people could test in the hours an engagement allows (LEDGERLINE-CPAPA-2026).
  solution: >-
    PwC Australia said on 28 Oct 2025 it was rolling out an 'AI-native' platform as part of a global pilot, in
    which AI agents assess risk, design audit plans and workflows, and test balances and controls, with auditors
    in the loop. PwC says analysis would run in real time on full population sets and against trusted third-party
    data. The programme starts with five audit clients and plans to reach all audit clients by 2028, for 1,600
    auditors. The IAASB's exposure draft gives a matching example: agreeing all sales invoices of an online
    retailer to independent carrier shipping data. Full-population testing of control populations is
    assurance-controls-testing-08.
  outcomes:
    - lever: quality
      description: "None published. PwC says full-population analysis gives unprecedented scrutiny of judgments; no result is given"
      figure: "none published"
      measures: "Not applicable; announcement of a pilot on five audit clients"
      provenance: self-reported
      source_ref: PWCAU-AT-2025
    - lever: speed
      description: "PwC US's assurance transformation leader on time savings after a year of AI tools in assurance (firm-wide, not this pilot)"
      figure: "none published; 'not that drastic yet'"
      measures: "Qualitative statement about the busy-season time shift"
      provenance: self-reported
      source_ref: CFODIVE-PWC-2026
  prerequisites:
    - "Real-time access to client data and to third-party data (PWCAU-AT-2025)"
    - "A complete population and reliable data, with procedures to verify the relevance and reliability of the information used (AFM-BB-2025, building blocks 4-6; SEC-TAAORDER-2024, section II)"
    - "Independent third-party data to reconcile against, such as carrier tracking or bank activity (IAASB-ED500-2026, Appendix 2, para 3; TR-AGENTIC-2025)"
  risks_and_guardrails:
    - "FRC: whole-population outputs may be less conclusive per item; they need not match the persuasiveness of the procedure replaced if the methodology does not overstate them (FRC-GENAI-2026, risk of non-compliant methodology)"
    - "Under ED-500, when tools analyse a whole population to find items with risk characteristics, testing those items gives evidence only about them, and misstatements found cannot be projected to the rest (IAASB-ED500-2026, Appendix 2, para 7)"
    - "PCAOB commenters asked whether evidence is sufficient when whole-population analysis identifies nothing; the Board called the final requirements principles-based and applicable to all means of selecting items (PCAOB-TAA-2024, discussion of AS 2301.49-.50)"
    - "Testing 100% surfaces more exceptions, and marketing 'we test everything' widens the expectation gap because some risks, such as an incomplete population, sit outside the transaction data; run in shadow mode on completed engagements, then cut over gradually (LEDGERLINE-CPAPA-2026)"
    - "IFIAR suggests benchmarking technology-driven results against traditional methods (IFIAR-TTF-2026, p.9)"
    - "An RSM Australia partner cautions that over-reliance on AI over professional judgment could introduce errors and poorer audit quality (PWCAU-AT-2025)"
  human_checkpoints:
    - "Investigation of every item the analysis identifies, with auditor judgement on what a finding means (PCAOB-TAA-2024, discussion of AS 2301.49-.50)"
    - "A stand-back review by the engagement team of whether the tool achieved the overall objective (IFIAR-TTF-2025, p.8)"
    - "Auditors provide context, analysis and decisions; PwC says humans keep final judgments (PWCAU-AT-2025)"
  role_evolution: >-
    PwC says auditors spend less time on routine tasks and workflow management and more on analysis and judgment
    (PWCAU-AT-2025).
  evidence_grade: B
  sources:
    - { ref: PWCAU-AT-2025, title: "PwC Australia rolls out pilot program for AI-assisted full audits", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/pwc-australia-rolls-out-pilot-program-for-ai-assisted-full-audits", date: "2025-10-28", access: full, locator: "paras 1-6 and the RSM partner's comments" }
    - { ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "time-savings passage" }
    - { ref: IAASB-ED500-2026, title: "Exposure Draft: Proposed ISA 500 (Revised), Audit Evidence, with explanatory memorandum", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-08/IAASB-Audit-Evidence-Risk-Response-ISA-500-Exposure-Draft.pdf", date: "2026-08-05", access: full, locator: "Appendix 2, paras 3 and 6-8" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "risk of non-compliant methodology (p.19)" }
    - { ref: PCAOB-TAA-2024, title: "Notice of Filing of Proposed Rules on Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 54922; carries Release 2024-007)", publisher: "PCAOB; SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-07-02/pdf/2024-14488.pdf", date: "2024-07-02", access: full, locator: "Discussion of AS 2301.48-.50" }
    - { ref: LEDGERLINE-CPAPA-2026, title: "Testing Every Transaction Changes the Audit - Here's What Firms Should Know Before They Sell It (Tunde Adewole, CEO of Ledgerline)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/15/testing-every-transaction-changes-the-audit-heres-what-firms-should-know-before-they-sell-it/191713/", date: "2026-10-15", access: full, locator: "sections 'What full-population testing changes', 'The trap', 'How to roll it out safely'" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p.9 emerging practices" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.8" }
    - { ref: AFM-BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "AFM (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "building blocks 4-6" }
    - { ref: SEC-TAAORDER-2024, title: "Order Granting Approval of Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 68218)", publisher: "SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-08-23/pdf/2024-18986.pdf", date: "2024-08-23", access: full, locator: "Section II" }
    - { ref: TR-AGENTIC-2025, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows.html", date: "2025-11-05", access: full, locator: "Audit Intelligence Test section (bank activity)" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-16 (B, delegate) and governance-04 (B, automate). Ladder delegate because PwC describes
    agents that assess risk, design plans and test balances; pattern full-population-testing because the change
    to substantive work is replacing samples. No results, error rates or inspection outcome have been published
    and no follow-up reporting on the pilot was found. The ED-500 example is application material in an
    exposure draft, not a deployment. Shares its expectation-gap guardrail with assurance-controls-testing-08,
    which covers control populations (Armanino, Microsoft) and should be read alongside.

- id: assurance-substantive-testing-25
  title: AI-native specialist audit firm testing every transaction in employee-benefit-plan audits (Ledgerline)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: full-population-testing
  ladder: automate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    The annual 401(k) audit is described as a four-month chore of requests, reviews and follow-ups, and testing is
    a sample of contributions extrapolated to the plan (LEDGERLINE-CPAPA-2026; LEDGERLINE-SITE-2026).
  solution: >-
    The firm pulls payroll and recordkeeper data directly from systems instead of requesting it, reconciles
    contributions across payroll, trust and recordkeeper, and uses AI agents with deterministic code to check
    every deposit against payroll, every match against the plan formula and every distribution against its
    record. Agents read plan documents and cite the page and section for each provision tested.
  outcomes:
    - lever: speed
      description: "None published for the firm's engagements. The CEO asserts, in general terms, that work taking a junior associate 20 hours can run in minutes"
      figure: "none published"
      measures: "Not applicable; the 20-hours statement is generic and no study or engagement data is given"
      provenance: self-reported
      source_ref: LEDGERLINE-CPAPA-2026
  prerequisites:
    - "Connections to payroll providers (the site names Rippling, Gusto, ADP and Paychex) and recordkeepers (Fidelity, Empower, Vanguard) (LEDGERLINE-SITE-2026)"
    - "Shadow mode on completed engagements, then gradual cutover, per the CEO's advice (LEDGERLINE-CPAPA-2026)"
  risks_and_guardrails:
    - "Testing 100% surfaces more exceptions, so more follow-up and more judgment about materiality (LEDGERLINE-CPAPA-2026)"
    - "Reasonable assurance is not absolute; some risks sit outside the transaction data, such as an incomplete population, so 'we test everything' can widen the expectation gap (LEDGERLINE-CPAPA-2026)"
  human_checkpoints:
    - "A person stays accountable for every conclusion; agents produce work a reviewer can check, with sources cited (LEDGERLINE-CPAPA-2026)"
  role_evolution: >-
    The CEO says the hours saved move to investigating exceptions, assessing controls and deciding what a finding
    means (LEDGERLINE-CPAPA-2026).
  evidence_grade: B
  sources:
    - { ref: LEDGERLINE-CPAPA-2026, title: "Testing Every Transaction Changes the Audit - Here's What Firms Should Know Before They Sell It (Tunde Adewole, CEO of Ledgerline)", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/15/testing-every-transaction-changes-the-audit-heres-what-firms-should-know-before-they-sell-it/191713/", date: "2026-10-15", access: full, locator: "sections 'What full-population testing changes', 'The trap', 'How to roll it out safely'" }
    - { ref: LEDGERLINE-SITE-2026, title: "Ledgerline: Specialist 401(k) and 403(b) plan audits", publisher: "Ledgerline", type: firm, url: "https://ledgerlineaudit.com", date: "2026-10", access: full, locator: "'Our approach' section (undated site, read 2026-10-16)" }
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-15 (single source; governance-04 cites the same article for its warnings). Graded B on the
    firm's description of its operating model; there is no independent evidence of its audit quality, client
    count or inspection history. Included as a live example of a different service model (an audit firm built
    on data pulls and agents), not because outcomes are shown. The same article is cited in
    assurance-controls-testing-08.
