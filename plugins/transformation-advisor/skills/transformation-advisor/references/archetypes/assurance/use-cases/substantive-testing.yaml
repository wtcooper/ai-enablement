  notes: >-
    Merged from practice-01, discourse-01 and governance-01. Change scope set to process (two of three angles;
    governance said step). The IFIAR and PCAOB figures cover all automated tools, including non-AI analytics,
    so they show how mature tool-assisted journal-entry testing is, not how mature AI is. No detection-quality,
    false-positive, override-rate or parallel-run figure was found for any named firm. The MindBridge page for
    KPMG describes the alliance, not results. The FRC example is hypothetical.

- id: assurance-substantive-testing-02
  title: "Idea: language-model anomaly detection with written explanations, layered on journal-entry tests"
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Rule-based journal-entry tests generate many false positives and struggle with subtle irregularities, and
    machine-learning scores do not explain themselves (ARXIV-AUDITCOPILOT-2025, abstract).
  solution: >-
    Researchers prompt large language models with each ledger record plus dataset statistics and an Isolation
    Forest hint (a classical anomaly-detector score), and ask for a yes/no anomaly flag with a plain-language
    explanation the auditor can review. The authors prefer open-weight models because ledger data is
    confidential. They benchmarked the models against rules-based journal-entry tests and classical baselines on
    a synthetic ledger and one anonymised real ledger.
  outcomes:
    - lever: quality
      description: "Synthetic ledger: best language model versus rules-based journal-entry testing (JET)"
      figure: "Mistral-8B: 48 true positives, 12 false positives, 2 false negatives; JET: 50 true positives, 942 false positives, 0 false negatives; GPT-5-mini: 50 true positives, 466 false positives"
      measures: "Counts of posting IDs flagged against simulator-defined labels in a random subset of 5,000 posting IDs with 50 seeded anomalies; the paper's printed precision and recall columns do not reconcile to these counts"
      provenance: independent
      source_ref: ARXIV-AUDITCOPILOT-2025
    - lever: quality
      description: "Real anonymised ledger: Gemma-7B with the full prompt versus Isolation Forest, scored against pseudo-labels"
      figure: "Gemma-7B: 256 true positives, 32 false positives, 73 false negatives; Isolation Forest: 315 true positives, 719 false positives, 14 false negatives; removing the Isolation Forest hint raised Gemma-7B false positives from 32 to 1,973"
      measures: "Counts of records flagged against 329 pseudo-labelled anomalies; the pseudo-labels came from applying journal-entry testing rules, so rules-based JET is the reference, not a competitor, on this dataset"
      provenance: independent
      source_ref: ARXIV-AUDITCOPILOT-2025
  prerequisites:
    - "Structured ledger fields (amounts, accounts, users, dates) plus free-text memo fields, with global statistics and a classical anomaly-detector score added to the prompt (ARXIV-AUDITCOPILOT-2025, section 2)"
    - "Certification and testing of the model and an explainability approach suited to how the output is used (FRC-AIAUDIT-2025, p.9)"
  risks_and_guardrails:
    - "Authors' limits: one anonymised ledger plus a synthetic benchmark, pseudo-labels that may inherit rule-based biases, prompt sensitivity, explanations that may not reflect the decision boundary, hallucination, automation bias, prompt injection through free-text fields and non-reproducibility (ARXIV-AUDITCOPILOT-2025, Limitations)"
    - "A model's explanations can be approximate or post hoc and still be appropriate depending on use (FRC-AIAUDIT-2025, p.14)"
    - "Agent benchmarks on whole engagements find models sometimes perform inappropriate procedures or write incorrect documentation (ARXIV-FAB-2026, abstract)"
  human_checkpoints:
    - "Auditor reviews each flagged entry together with the model's explanation before treating it as an exception (ARXIV-AUDITCOPILOT-2025, abstract)"
  role_evolution: >-
    None studied. The authors picture auditors collaborating with foundation models rather than being replaced
    (ARXIV-AUDITCOPILOT-2025, abstract).
  evidence_grade: D
  sources:
    - { ref: ARXIV-AUDITCOPILOT-2025, title: "AuditCopilot: Leveraging LLMs for Fraud Detection in Double-Entry Bookkeeping (Kadir, Vasu, Nair, Sonntag; DFKI)", publisher: "arXiv 2512.02726", type: academic, url: "https://arxiv.org/abs/2512.02726", date: "2025-12-02", access: full, locator: "abstract; sections 2-4; Tables 1-2; Limitations" }
    - { ref: FRC-AIAUDIT-2025, title: "AI in Audit: illustrative example and documentation guidance", publisher: "FRC (UK)", type: regulator, url: "https://media.frc.org.uk/documents/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "pp.9 and 14 (explainability)" }
    - { ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (Huang, Babu et al.; UIUC, Stanford, Modus Audit Inc.)", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "abstract" }
  last_reviewed: "2026-10-16"
  notes: >-
    Idea: a research prototype with measured benchmark results but no deployment found. Merged from practice-02
    and governance-02. The paper's Table 1 is internally inconsistent (JET lists recall 0.90 yet 0 false
    negatives), so only counts are reported. The landscape's search extract about real-data precision falling
    without a statistical hint is superseded by the Table 2 counts above.

- id: assurance-substantive-testing-03
  title: Evidence-linked triage and explanation of items flagged by whole-population tests
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Whole-population tests surface more items to follow up. The PCAOB amendments require the auditor to
    investigate items identified by auditor-set criteria, and thin testing of outliers is among IFIAR members'
    most common technology findings (PCAOB-TAA-2024; IFIAR-TTF-2025, pp.5-6).
  solution: >-
    MindBridge announced on 22 Sep 2026 an Agentic Risk Assessment capability that links evidence, analytics,
    assertions, materiality and methodology, and says its platform combines full-population analysis with
    explainable risk detection. The FRC's journal example requires teams to understand why each high-risk item
    was flagged and to look for items the tool may have missed.
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "Not applicable; the MindBridge release gives no performance figure"
      provenance: vendor-published
      source_ref: MINDBRIDGE-ARA-2026
  prerequisites:
    - "Integration with the firm's workpaper tools; MindBridge says the capability works with customer-built and third-party workpaper solutions (MINDBRIDGE-ARA-2026)"
  risks_and_guardrails:
    - "An item flagged as unusual may be correct while similar unflagged items are the risky ones, so follow-up must go beyond the flagged list (FRC-AIAUDIT-2025, p.11)"
    - "IFIAR suggests monitoring false-positive and false-negative rates against a manual sample, rework rates and escalation incidence (IFIAR-TTF-2026, pp.8-9)"
  human_checkpoints:
    - "Auditor investigates and documents the rationale for concluding on flagged and additional items (FRC-AIAUDIT-2025, p.11)"
  role_evolution: >-
    MindBridge says judgement stays with the auditor (MINDBRIDGE-ARA-2026); in the FRC example, teams document
    the rationale for their follow-up conclusions (FRC-AIAUDIT-2025, p.11).
  evidence_grade: C
  sources:
    - { ref: MINDBRIDGE-ARA-2026, title: "MindBridge Advances Financial Oversight for the Agentic Era with New Platform Capabilities (press release)", publisher: "MindBridge (Business Wire via BNN Bloomberg)", type: vendor, url: "https://www.bnnbloomberg.ca/press-releases/2026/09/22/mindbridge-advances-financial-oversight-for-the-agentic-era-with-new-platform-capabilities/", date: "2026-09-22", access: full, locator: "Announcements list; Augmented Assurance paragraph" }
    - { ref: FRC-AIAUDIT-2025, title: "AI in Audit: illustrative example and documentation guidance", publisher: "FRC (UK)", type: regulator, url: "https://media.frc.org.uk/documents/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "Illustrative example p.11" }
    - { ref: PCAOB-TAA-2024, title: "Notice of Filing of Proposed Rules on Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 54922; carries Release 2024-007)", publisher: "PCAOB; SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-07-02/pdf/2024-14488.pdf", date: "2024-07-02", access: full, locator: "Discussion of AS 2301.49-.50" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp.5-6" }
    - { ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp.8-9" }
  last_reviewed: "2026-10-16"
  notes: >-
    From governance-15 (single source). Kept because exception follow-up is the step full-population testing
    moves work into, and no other entry covers it. Vendor announcement and regulator illustration only; no
    customer names, accuracy or time figures. Planning-stage use of the same product belongs to
    planning-risk-assessment.

- id: assurance-substantive-testing-04
  title: Corroborating and authenticating documents before relying on them, as AI makes forged evidence cheap
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    IRBA warned in September 2024 that AI tools can create more realistic false evidence or fabricated working
    papers. A clean-looking invoice or vendor file no longer signals legitimacy, because generative tools
    produce convincing documents, W-9 forms and vendor websites. IFIAR notes that order forms, shipment details,
    invoices, payment records and bank statements may originate from AI systems and be used as audit evidence.
  solution: >-
    Practitioners advise matching invoice details against bank records, vendor histories, approval logs and
    system metadata; scanning vendor masters for suspicious entries, such as a P.O. box address or a bank
    account shared by apparent vendors; and testing full populations because fraud can be automated and
    widespread. An ISACA author proposes a zero-trust starting point: verify authenticity, metadata and
    provenance independently before relying on a document. A forensic investigator notes mainstream tools can
    be asked to look for watermarks showing AI alteration and expects this in enterprise software. IRBA
    recommends procedures to verify the authenticity of evidence. Whether firms use automated
    authenticity-detection tools in substantive testing was not found.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "Not applicable; no source reports usage or detection rates"
      provenance: independent
      source_ref: IRBA-AI-2024
  prerequisites:
    - "Access to bank, vendor-master and approval-log data, and a tidy vendor master (JOFA-APFRAUD-2026)"
    - "Independent routes to the originating system or party (ISACA-EVIDENCE-2026)"
    - "Firm policy on AI use and a protocol to monitor it, as IRBA recommended in January 2023 (IRBA-AI-2024, p.1)"
  risks_and_guardrails:
    - "Technological defences carry their own attack paths, such as data poisoning and prompt injection (JOFA-APFRAUD-2026)"
    - "IFIAR says auditors need to evaluate the source and nature of information used as evidence, taking account of potentially unreliable AI output (IFIAR-TTF-2026, p.10)"
    - "AFM found auditors do not always verify the reliability of input data used in tools (AFM-BB-2025, Precondition 2)"
    - "A search-result summary of a Wolters Kluwer article says detection tools still need governance and human review (WOLTERSKLUWER-EVIDENCE-2026; page not opened)"
  human_checkpoints:
    - "Out-of-band verification of suspicious items (JOFA-APFRAUD-2026)"
    - "Auditor decides whether evidence is authentic enough to rely on (ISACA-EVIDENCE-2026)"
  role_evolution: >-
    A BDO forensic practitioner says AI will not testify in court or sign off financial statements, so the CPA's
    value remains skepticism and judgment (JOFA-APFRAUD-2026). The ISACA author says auditors must be equipped
    to challenge evidence that looks 'perfect' (ISACA-EVIDENCE-2026).
  evidence_grade: C
  sources:
    - { ref: MINDBRIDGE-FAKEINV-2025, title: "Fake Invoices, Real Risks: Why Auditors Must Rethink Their Approach in the Age of AI", publisher: "MindBridge", type: vendor, url: "https://www.mindbridge.ai/blog/fake-invoices-real-risks-why-auditors-must-rethink-their-approach-in-the-age-of-ai", date: "2025-04-15", access: full, locator: "section 'What This Means for Auditors and the Audit Process'" }
