- id: assurance-substantive-testing-05
  title: "Idea: substantive testing of AI-generated client information (entries, accruals, classifications), or tests of controls over it"
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    When a client uses AI to categorise expenses, prepare accruals or review entries for anomalies, the auditor
    may not be able to see how the output was produced (AT-AICPAPA-2026).
  solution: >-
    The AICPA practice aid (13 Oct 2026, as reported by Accounting Today) says an auditor may be able to test AI
    outputs substantively; if that alone cannot give sufficient evidence, the auditor should test controls.
    Where the process is a black box, the auditor may need to establish relationships between inputs and outputs
    and explore non-traditional evidence sources.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "Not applicable; published guidance on how to respond, not a reported audit"
      provenance: independent
      source_ref: AT-AICPAPA-2026
  prerequisites:
    - "Understanding of the AI mechanism behind a control or information source, including whether it is deterministic or probabilistic (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "Model drift, data governance and probabilistic outcomes mean testing strategies may differ from those for traditional automated controls (AT-AICPAPA-2026)"
    - "The practice aid notes AI-enabled fraud risks such as generating fictitious documents to support nonexistent transactions (AT-AICPAPA-2026)"
    - "Where substantive procedures alone are not sufficient, tests of controls are required (AS 2301.17), which matters when a client's AI cannot be independently verified (CAQ-GENAI-2024)"
  human_checkpoints:
    - "Auditor decides whether substantive tests alone suffice or controls must be tested (AT-AICPAPA-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: D
  sources:
    - { ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraphs on responding to AI risks and on audit evidence ('AI black box')" }
    - { ref: CAQ-GENAI-2024, title: "Auditing in the Age of Generative AI", publisher: "Center for Audit Quality", type: professional-body, url: "https://thecaq.wpenginepowered.com/wp-content/uploads/2024/04/caq_auditing-in-the-age-of-generative-ai__2024-04.pdf", date: "2024-04", access: full, locator: "section on future state (citing AS 2301.17)" }
  last_reviewed: "2026-10-16"
  notes: >-
    Idea: guidance on how to respond, not a reported audit. From discourse-17, with the CAQ point routed from
    governance. Pattern 'other': assurance over AI-produced entity information as a new substantive test object.
    The full practice aid sits behind an AICPA login and was not opened. The controls side of the same shift is
    assurance-controls-testing-15 (testing controls that AI performs).

- id: assurance-substantive-testing-06
  title: Generative AI assistant that helps teams design substantive procedures from engagement documentation (KPMG Clara)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Teams must tailor substantive procedures to assessed risks and the entity, which means reading engagement
    documents and methodology. In PCAOB staff's 2024 outreach, firms' generative AI use was mainly
    administrative and research; potential areas listed included risk assessment, scoping and disclosure
    completeness (PCAOB-GENAI-2024, pp.4-5).
  solution: >-
    KPMG said in July 2024 it had integrated generative AI into Clara for 90,000 auditors, interacting with
    engagement documentation and methodology to help teams refine risk assessments, develop substantive testing
    procedures and enhance documentation.
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "Not applicable; announcement only; the 90,000 is the number of auditors the integration was announced for"
      provenance: self-reported
      source_ref: KPMG-CLARA-2025
  prerequisites:
    - "Engagement documentation and methodology held in the platform (KPMG-CLARA-2025)"
    - "Firm-approved tools with data privacy and confidentiality safeguards on what can be uploaded (PCAOB-GENAI-2024, p.4)"
  risks_and_guardrails:
    - "Some firms barred generative AI in audit or attest procedures over data privacy and reliability concerns, and noted hallucinations (PCAOB-GENAI-2024, p.4; staff view, not Board policy)"
    - "In ICAEW's single test, three general chatbots did not separate financial-statement-level from assertion-level risk and none performed risk assessment as a human auditor would (ICAEW-PIERPOINT-2025)"
    - "Most IFIAR member inspections had seen minimal use of generative AI applications in public company audits (IFIAR-TTF-2025, p.7)"
  human_checkpoints:
    - "The engagement team member using the tool stays responsible for results and documentation; reviewers apply the same diligence as for other work (PCAOB-GENAI-2024, pp.4-5)"
    - "Auditors remain in control of decision-making (KPMG-CLARA-2025)"
  role_evolution: >-
    PCAOB staff recorded that firms investing in generative AI expected it to augment, not replace, auditors,
    and that some firms said their supervision and review policies had not changed (PCAOB-GENAI-2024).
  evidence_grade: C
  sources:
    - { ref: KPMG-CLARA-2025, title: "KPMG advances AI integration in KPMG Clara smart audit platform", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/04/kpmg-advances-ai-integration-in-kpmg-clara-smart-audit-platform.html", date: "2025-04-22", access: full, locator: "background paragraph (July 2024 integration)" }
    - { ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB staff", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "pp.4-5 (current use, limitations, supervision)" }
    - { ref: ICAEW-PIERPOINT-2025, title: "Testing Gen AI platforms: can they do audit work? (Helen Pierpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/testing-gen-ai-platforms-can-they-do-audit-work", date: "2025-09-24", access: full, locator: "analytical review and risk of material misstatement sections" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p.7" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-21 and governance-16. The July 2024 integration is reported in KPMG's April 2025
    release; the original July 2024 release was not opened. No named engagement result. ICAEW's test used a
    fictional retailer and three models and is not a benchmark.

- id: assurance-substantive-testing-07
  title: Agent in Excel cleans, validates and reconciles client general-ledger data to the trial balance before substantive procedures
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Raw client data arrives with mixed fields, inconsistent dates, blank rows and irrelevant headers, and
    preparing it for journal-entry and other testing is repetitive, slow and error-prone (JOFA-EXCELAGENT-2026).
    Only 19% of surveyed US firms have an automated data-ingestion solution (CPACOM-ATR-2025).
  solution: >-
    Two accounting academics (University of Akron) built a ChatGPT-for-Excel agent with a written 'skill' that
    forces a plan, asks for approval before changing data, uses reviewable spreadsheet formulas, reconciles to
    the trial balance and writes plain-English documentation for the reviewer. They name Claude for Excel and
    DataSnipper as similar tools.
  outcomes:
    - lever: speed
      description: "Simulated clean, validate and reconcile of a general-ledger extract took about ten minutes, against many hours manually according to the authors"
      figure: "about 10 minutes (59,157 rows)"
      measures: "Average time for the agent to clean, validate and reconcile 59,157 rows of simulated transaction-level general-ledger data to a trial balance; simulation adapted from a published case study, not a live engagement"
      provenance: independent
      source_ref: JOFA-EXCELAGENT-2026
  prerequisites:
    - "Enterprise-level licences for audit use (JOFA-EXCELAGENT-2026)"
    - "Client data access: US firms cite poor client data (60%) and no access to client systems (53%) as blockers (CPACOM-ATR-2025)"
  risks_and_guardrails:
    - "The authors require an agent-prepared plan and human approval before any data change, and reviewable formulas (JOFA-EXCELAGENT-2026)"
  human_checkpoints:
    - "Auditor approves the plan and reviews the reconciliation and the generated documentation (JOFA-EXCELAGENT-2026)"
  role_evolution: >-
    Managers and partners refine the agent's 'skills' from staff feedback, comparable to maintaining a
    procedure manual (JOFA-EXCELAGENT-2026).
  evidence_grade: C
  sources:
    - { ref: JOFA-EXCELAGENT-2026, title: "Using an Excel agent to clean, validate, and reconcile data", publisher: "Journal of Accountancy", type: press, url: "https://www.journalofaccountancy.com/issues/2026/oct/using-an-excel-agent-to-clean-validate-and-reconcile-data/", date: "2026-10-01", access: full, locator: "Introduction; 'The simulated case'; Steps 1-5" }
    - { ref: CPACOM-ATR-2025, title: "Audit Transformation Report: 2025 CPA.com and AICPA Audit Benchmark Survey (54 US firms with complete data)", publisher: "CPA.com and AICPA", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "Blockers and automated-solutions charts (PDF pp.9-10)" }
  last_reviewed: "2026-10-16"
  notes: >-
    From discourse-09 (single source). Authors are Gang (Ernest) Pan and Li Wang. A demonstration on simulated
    data, so capped at C; no firm deployment is named. Kept because it is the only entry on defining and
    validating the population, the step full-population testing depends on.

- id: assurance-substantive-testing-08
  title: "Technology-assisted selection of items to test: all items, specific high-risk items or a risk-targeted sample"
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    PCAOB standards specified responsibilities for audit samples but not for items identified when testing
    specific items or all items in a population, and the Board's research found auditors using technology to
    identify such items (PCAOB-TAA-2024, background).
  solution: >-
    Tools identify and select journal entries, specific high-risk items or samples for testing. The amended AS
    2301 applies its test-of-details and investigation requirements to every way of selecting items: all items,
    specific items or audit sampling. A Thomson Reuters customer (Oberlander Financial Services) says Audit
    Intelligence Test used with Audit Intelligence Analyze 'significantly' improves sample selection and
    testing. Risk-scored contract selection for revenue testing is covered in #14.
  outcomes:
    - lever: capacity
      description: "All six U.S. global network firms reported tools that select samples; average tools per firm rose"
      figure: "6 of 6 firms; about 13 to about 18 tools per firm (about 38%) between 2018 and 2023"
      measures: "U.S. global network firms reporting tools that assist in selecting samples, and average number of tools used by engagement teams per firm as reported to the PCAOB; about 90% of tools were for visualisation, summarisation, tabulation or modelling and under 7% used AI, blockchain or RPA"
      provenance: self-reported
      source_ref: PCAOB-TAA-2024
    - lever: quality
      description: "Practitioner says the tools improve sample selection; qualitative only"
      figure: "none published"
      measures: "Not applicable; a customer quotation in a vendor release"
      provenance: vendor-published
      source_ref: TR-AGENTIC-2025
  prerequisites:
    - "Clear criteria for item selection tied to the objective of the procedure (PCAOB-TAA-2024, discussion of AS 2301.48)"
    - "Reliable data and, where relevant, controls over the information used (SEC-TAAORDER-2024, section II)"
  risks_and_guardrails:
    - "Selecting specific items is not audit sampling; results cannot be projected to the rest of the population (IAASB-ED500-2026, Appendix 2, paras 6-7)"
    - "A risk-scored sample remains a sample; the FRC's example shows AI improving targeting, not replacing the sample (FRC-GENAI-2026, illustrative example 2)"
    - "IFIAR members' common technology findings include insufficient testing of outliers (IFIAR-TTF-2025, pp.5-6)"
    - "In IFIAR's 2025 survey, 46 of 420 inspected listed public-interest-entity audits where sampling was inspected had a finding (11%); not AI-specific (IFIAR-SURVEY-2026, Table B.2)"
  human_checkpoints:
    - "Auditor applies procedures appropriate to the objective to each selected item and investigates identified items (PCAOB-TAA-2024, discussion of AS 2301.48-.50)"
  role_evolution: >-
    The PCAOB's data show a growing toolset per firm but do not describe role changes (PCAOB-TAA-2024).
  evidence_grade: B
  sources:
    - { ref: PCAOB-TAA-2024, title: "Notice of Filing of Proposed Rules on Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 54922; carries Release 2024-007)", publisher: "PCAOB; SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-07-02/pdf/2024-14488.pdf", date: "2024-07-02", access: full, locator: "Background; discussion of AS 2301.48-.50; economic analysis" }
    - { ref: SEC-TAAORDER-2024, title: "Order Granting Approval of Amendments Related to Aspects of Designing and Performing Audit Procedures That Involve Technology-Assisted Analysis of Information in Electronic Form (89 FR 68218)", publisher: "SEC (Federal Register)", type: regulator, url: "https://www.govinfo.gov/content/pkg/FR-2024-08-23/pdf/2024-18986.pdf", date: "2024-08-23", access: full, locator: "Section II" }
    - { ref: TR-AGENTIC-2025, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows.html", date: "2025-11-05", access: full, locator: "Oberlander quote, Audit Intelligence Test section" }
    - { ref: IAASB-ED500-2026, title: "Exposure Draft: Proposed ISA 500 (Revised), Audit Evidence, with explanatory memorandum", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-08/IAASB-Audit-Evidence-Risk-Response-ISA-500-Exposure-Draft.pdf", date: "2026-08-05", access: full, locator: "Appendix 2, paras 1-9" }
    - { ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "Illustrative example 2, pp.49-59" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp.5-6" }
    - { ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025 (14th annual survey)", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix B, Table B.2" }
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from governance-08 and discourse-04 (the FRC contract-scoring part of discourse-04 moved to #14).
    Named firms are the six U.S. global networks as listed by the PCAOB; the data are firm-reported for the 2023
    inspection year and mostly describe non-AI analytics. The Oberlander statement is thin. Pattern follows the
    controls-side analogue, assurance-controls-testing-04 (risk-scored sample selection).

- id: assurance-substantive-testing-09
  title: AI risk scoring to cut substantive sample sizes under a firm-approved methodology (Cherry Bekaert on MindBridge)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Firms that rely only on a third-party audit methodology may have to obtain a large share of assurance from
    sampling, which in busy season means a senior spending hours on journal-entry selection or testing 200
    revenue items (MINDBRIDGE-CHERRY-2022).
  solution: >-
    Cherry Bekaert adopted MindBridge in 2020 and built the deployment deliberately: research, standards
    mapping, methodology and sampling-form development, QC validation and policy drafting, with a firm-wide
    policy for each use. The aim is to obtain more assurance from risk scoring of full populations and so need
    smaller samples.
  outcomes:
    - lever: cost
      description: "Firm demonstrated a sample-size reduction on an illustrative client at moderate risk of material misstatement"
      figure: "66% reduction in sample size"
      measures: "Reduction in sample size demonstrated by Cherry Bekaert for a moderate risk of material misstatement in an illustrative client (a worked demonstration, not measured across live engagements), per the vendor's case study"
      provenance: vendor-published
      source_ref: MINDBRIDGE-CHERRY-2022
  prerequisites:
    - "Standards mapping, sampling-form development and QC validation before roll-out (MINDBRIDGE-CHERRY-2022)"
    - "A firm-wide policy covering each use of the tool (MINDBRIDGE-CHERRY-2022)"
  risks_and_guardrails:
    - "The vendor says an independent algorithm audit by University College London Consulting found its algorithms operate as expected (MINDBRIDGE-CHERRY-2022; vendor-described, report not opened)"
    - "IFIAR reports findings on thin testing of outliers and misreading of tool results (IFIAR-TTF-2025, pp.5-6)"
  human_checkpoints:
    - "Associates keep autonomy to make decisions and exercise professional judgment (MINDBRIDGE-CHERRY-2022)"
  role_evolution: >-
    Cherry Bekaert partners describe differentiating value for clients and freeing senior time in busy season
    (MINDBRIDGE-CHERRY-2022). In June 2026 Cherry Bekaert chose Fieldguide as its strategic AI partner for
    financial audit, internal audit and SOC on one platform (FIELDGUIDE-CHERRY-2026).
  evidence_grade: B
  sources:
    - { ref: MINDBRIDGE-CHERRY-2022, title: "How Cherry Bekaert drove ROI for their audit engagements", publisher: "MindBridge", type: vendor, url: "https://www.mindbridge.ai/resources/case-studies/cherry-bekaert-llp-case-study", date: "2022", access: full, locator: "sections 'Redefining risk to save time' and 'The value of implementing a vision' (year inferred)" }
    - { ref: FIELDGUIDE-CHERRY-2026, title: "Cherry Bekaert Selects Fieldguide as Strategic AI Partner to Modernize Audit and Advisory Delivery", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/cherry-bekaert-fieldguide-financial-audit", date: "2026-06-03", access: full, locator: "paras 1-3" }
    - { ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution", publisher: "IFIAR (Japan FSA mirror)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp.5-6 (inspection findings)" }
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-14 (single source). The 66% is an illustration, so the entry stays at B. The case study's
    year is uncertain (inferred from image upload paths). The statement that a firm needs 60% of its assurance
    from sampling under a third-party methodology is a Cherry Bekaert director's quotation on the vendor page and
    is not independently checked.

- id: assurance-substantive-testing-10
  title: Agents match sampled items to supporting documents and bank activity (evidence-to-sample matching, or vouching)
  archetype: assurance
  module: substantive-testing
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Vouching means opening many differently formatted invoices, contracts and bank records and tracing each
    sampled amount by hand; a single customer payment can cover several invoices. A Thomson Reuters customer put
    the work at about two full days per engagement before the tool. PwC says auditors spend much of substantive
    testing gathering client information, matching it to systems and tracing and tying it before reaching the
    differences where judgment adds value. A small broker-dealer and fund auditor (Sanville & Co) faced sample
    selections of hundreds of transactions, with reviewers and the engagement quality reviewer absorbing the
    backlog.
  solution: >-
    Tools extract data from varied supporting documents, match each sampled item to its evidence, keep an
    evidence trail and flag gaps; the auditor works the exceptions. PwC Evidence Match, an agent-led module,
    covers cash, receivables, payables and fixed assets, ingests about 20 kinds of document (Oct 2025 account;
    30 in an Apr 2026 account) and connects to PwC's assurance skills library; its partner expects to use
    something like it across substantive testing. Thomson Reuters Audit Intelligence Test, built with Valid8
    Financial, matches samples to evidence and traces recorded transactions to bank activity, including one
    payment matched to several invoices. At Sanville & Co, Fieldguide's Field Auditor agents trace incoming
    client documents to the requested selections for revenue and related-party testing; the firm rebuilt its
    audit programmes as firm-wide templates in the same project. Tests of controls use the same step
    (assurance-controls-testing-07).
  outcomes:
    - lever: speed
      description: "A named sole practitioner reports engagement time for organising client material and running tests falling from about two days to five or six hours"
      figure: "about 16 hours to 5-6 hours per engagement"
      measures: "Oberlander Financial Services PLLC's own estimate, quoted in the vendor's press release, of hours per engagement before and after Audit Intelligence Test; no sample, scope, method or quality measure stated"
      provenance: vendor-published
      source_ref: TR-AGENTIC-2025
    - lever: speed
      description: "Partner says sample selections of hundreds of transactions that took hours often took minutes"
      figure: "hours to minutes, 'in many cases'"
      measures: "Sanville & Co partner's description of time to test sample selections of hundreds of transactions, before and after; no timings or counts given"
      provenance: vendor-published
      source_ref: FIELDGUIDE-SANVILLE-2026
    - lever: quality
      description: "First PCAOB inspection conducted entirely on the platform ended with no comment forms"
      figure: "zero comment forms"
      measures: "PCAOB comment forms on one inspected broker-dealer engagement, the firm's first fully clean broker-dealer inspection; platform and methodology were overhauled together"
      provenance: vendor-published
      source_ref: FIELDGUIDE-SANVILLE-2026
    - lever: growth
      description: "Blended realisation on the firm's lowest-margin engagements rose"
      figure: "$150-$200 an hour to $250 or more (up to $300-$350 in some cases)"
      measures: "Blended realisation per hour on Sanville's lowest-priced, lowest-margin engagements, as reported by the firm via the vendor"
      provenance: vendor-published
      source_ref: FIELDGUIDE-SANVILLE-2026
    - lever: quality
      description: "Adjacent evidence: five general-purpose chat models on document-based audit tests (some were internal-audit and anti-corruption reviews)"
      figure: "74-96% correct with basic prompts; 76-100% after prompt optimisation"
      measures: "Correct pass/fail answers out of 167 document samples across eight tests, with the audit team's result as ground truth; optimised prompts were written from phase-one errors on the same samples"
      provenance: independent
      source_ref: GRACZYK-2025
  prerequisites:
    - "Access to client systems and usable client data (53% and 60% of surveyed US firms name these as blockers) (CPACOM-ATR-2025)"
    - "Evaluation of the reliability of external information the company holds in electronic form, under AS 1105.10A, effective for fiscal years beginning on or after 15 Dec 2025 (SEC-TAAORDER-2024; PCAOB-PS2025-004)"
    - "Ingestion of many document types, 'the client may hand you a napkin' (PwC partner), and integration with the firm's skills library (PWC-AT-2025)"
    - "Audit programmes built as templates on the platform; a partner champion; Sanville's overhaul took under a year against an expected 18-24 months (FIELDGUIDE-SANVILLE-2026)"
  risks_and_guardrails:
    - "PwC names accuracy as the success measure for matching, because a match is a yes-or-no result, but publishes no figure (CFOBREW-PWC-2025)"
    - "IRBA warns generative tools can produce realistic false evidence; a match to a forged document is weak, so practitioners urge corroboration with bank records and vendor data (IRBA-AI-2024; MINDBRIDGE-FAKEINV-2025; TR-BANKCONF-2026)"
    - "AFM found auditors do not always verify the relevance and reliability of data fed to tools (AFM-BB-2025, Precondition 2)"
    - "In FinancialAuditBench, agents vouched receivables to a client-prepared cash receipts report instead of a bank statement (ARXIV-FAB-2026, section 6.3)"
    - "In the Polish study, ChatGPT passed 19 defective samples of 167 with basic prompts, and models ignored alternative evidence when a signature was missing (GRACZYK-2025, section 4)"
    - "A single clean inspection on one engagement is not evidence of tool accuracy (FIELDGUIDE-SANVILLE-2026)"
  human_checkpoints:
    - "Each match carries an evidence trail a reviewer can check against the documents (PWC-AT-2025)"
    - "Auditors analyse the anomalies and differences that matching surfaces (CFOBREW-PWC-2025)"
    - "Fieldguide agents stop at major steps for review and cite sources for each result; reviewers apply judgment to exceptions (FIELDGUIDE-FIELDAGENTS-2025; FIELDGUIDE-SANVILLE-2026)"
    - "Caseware says nothing is written into the engagement until a human reviews, accepts, edits or rejects it (CASEWARE-VERITY-2026)"
  role_evolution: >-
    PwC says AI systems need significant expertise to build, test and monitor, so some people move into those
    roles; it is hiring engineers it would not previously have hired into assurance and wants dual-track CPA and
    data-science recruits (CFOBREW-PWC-2025; PWC-AT-2025). At Sanville, first-year staff now do complex revenue
    testing because reviewers have bandwidth to guide them (FIELDGUIDE-SANVILLE-2026).
  evidence_grade: A
  sources:
    - { ref: TR-AGENTIC-2025, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows.html", date: "2025-11-05", access: full, locator: "section 'Introducing New AI-powered Audit Solutions' (Audit Intelligence Test; Oberlander quote)" }
