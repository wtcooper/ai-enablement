  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). Merged from practice-13 and discourse-10. The alliances are firm-announced facts from primary releases.
    That an independence consequence has occurred rests on secondary reports of an unopened Financial Times
    article. A PwC alliance appears only in those secondary reports. The SEC remarks of Dec 2025 predate the KPMG
    announcement. Disclosure: the research and synthesis model is made by Anthropic; its releases are used only for
