- id: assurance-acceptance-independence-20
  title: New regulated audit firms built around AI from the start; in the US, venture capital sits outside the attest entity
  archetype: assurance
  module: acceptance-independence
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Coverage of Repodo's launch says auditing has been slower than other professions to absorb automation and still
    relies on manual collection, matching and documentation (CFI-REPODO-2026). A venture-backed US audit start-up
    must keep the attest entity owned by licensed CPAs while the technology side raises outside capital
    (AT-PEEC-2026).
  solution: >-
    Repodo, a Copenhagen audit firm, raised EUR 8.2 million pre-seed, is authorised to issue statutory opinions
    through a licensed auditor co-founder, and plans to serve small and medium-sized Danish companies first; AI
    systems are meant to handle much of the repetitive work while qualified people keep judgment, oversight and the
    signature (CFI-REPODO-2026). Oath Verified describes itself as a modern audit firm running a continuous
    verification platform (OATH-2026). Its chief assurance officer, a former PCAOB board member, says it uses an APS
    because its platform company is venture-backed and state regulators require one to create an attest entity,
    and that she is building the methodology for an AI-native audit from the ground up (AT-PEEC-2026).
  outcomes:
    - {lever: growth, description: "Funding figure only; no client, quality or independence result is published", figure: "EUR 8.2 million pre-seed (Repodo)", measures: "amount raised as reported by the press; not an outcome of audit work", provenance: vendor-published, source_ref: CFI-REPODO-2026}
    - {lever: growth, description: "Funding figure only; no client, quality or independence result is published", figure: "about $10 million raised in total (Oath Verified)", measures: "amount raised as reported by the press; not an outcome of audit work", provenance: vendor-published, source_ref: AT-PEEC-2026}
  prerequisites:
    - "A licensed auditor who can sign opinions (CFI-REPODO-2026)"
    - "In the US, an attest entity set up inside an APS when a technology company has venture investors (AT-PEEC-2026)"
  risks_and_guardrails:
    - "Under the AICPA draft, an attest firm would be barred from attesting where an upstream entity of the non-attest entity is an affiliate of an attest client; Oath's chief assurance officer argues this is disproportionate for passive venture investors (AICPA-APSCL-2026, CL 16)"
    - "Client data is kept in separate per-client environments that do not train the model, per Oath's executive (AT-PEEC-2026)"
    - "The main source on Oath's structure is an executive of the firm who also comments on the rules that govern it (AT-PEEC-2026)"
  human_checkpoints:
    - "Licensed professionals keep final responsibility for the opinion (CFI-REPODO-2026; FINSTORY-OATH-2026)"
  role_evolution: >-
    Oath hires what it calls 'accountant engineers' (AT-PEEC-2026). The Finance Story notes that much of the work
    that would be automated is what junior auditors do in their early years (FINSTORY-OATH-2026).
  evidence_grade: C
  sources:
    - {ref: CFI-REPODO-2026, title: "Former Lunar Execs To Launch AI-enabled Audit Firm Repodo After Securing New Funding", publisher: "Crowdfund Insider", type: press, url: "https://www.crowdfundinsider.com/2026/08/302190-former-lunar-execs-to-launch-ai-enabled-audit-firm-repodo-after-securing-new-funding/", date: "2026-08-27", access: full, locator: "Paragraphs 1-12"}
    - {ref: OATH-2026, title: "Oath | Swear by your numbers (company website)", publisher: "Oath", type: firm, url: "https://www.oathverified.com/", date: "2026-10-16", access: full, locator: "'why oath' and 'services' sections (page undated; retrieval date)"}
    - {ref: AT-PEEC-2026, title: "AICPA weighs PE and tech impact on audit independence", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-weighs-pe-and-tech-impact-on-audit-independence-rules", date: "2026-08-31", access: full, locator: "Paragraphs on Oath's structure, funding and hiring; section on maintaining independence"}
    - {ref: AICPA-APSCL-2026, title: "Comment Letters: Alternative Practice Structures", publisher: "AICPA", type: standard-setter, url: "https://downloads.ctfassets.net/rb9cdnjh59cm/2k2SNDfzw8AbcvW0nfoiOs/bcfdc3e65de4e2c18a45be3e44e26900/Comment_letters_-_Alternative_practice_structures__APS_.pdf", date: "2026-05-14", access: full, locator: "CL 16 (dated 2026-04-22), section II"}
    - {ref: FINSTORY-OATH-2026, title: "Ex-PCAOB regulator QUITS...joins AI Audit startup targeting 80% Automation", publisher: "The Finance Story", type: press, url: "https://thefinancestory.com/ex-pcaob-regulator-joins-ai-native-audit-firm-oath", date: "2026-06-03", access: full, locator: "Paragraphs on what Oath is building"}
  last_reviewed: "2026-10-16"
  notes: >-
    Graded C: the firms and structures are real and named, but the use case (AI delivering the audit) is not
    evidenced for either firm. Oath's funding: $6.6 million seed in December 2025 and about $10 million in total
    (AT-PEEC-2026). Repodo's
    authorisation rests on press coverage, not the Danish register. A secondary relay of the Wall Street Journal
    says Oath aims to automate 80% of audit work by 2030 (FINSTORY-OATH-2026); that is a founder target, not an
    outcome.

- id: assurance-acceptance-independence-21
  title: Audit fee renegotiation justified by AI-enabled efficiency
  archetype: assurance
  module: acceptance-independence
  function: service-delivery
  work_types: [client-interaction, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Audit has been priced on hours, seniority and review depth; if AI speeds execution, clients may expect lower
    fees (VERDANTIX).
  solution: >-
    KPMG International negotiated a lower audit fee from its auditor, Grant Thornton UK, by arguing that AI would
    make the work cheaper and that savings should be passed on, according to people familiar with the matter cited
    in a Financial Times report syndicated by The Irish Times; KPMG International did not comment on confidential
    commercial matters and Grant Thornton declined to comment on the negotiations (IRISHTIMES-KPMG-2026).
    Commentators split between holding fees because humans still validate and sign off, and moving to
    subscription or continuous 'audit as a service' pricing (VERDANTIX).
  outcomes:
    - {lever: cost, description: "Audit fee change reported from KPMG International's filing; the link to AI rests on unnamed sources", figure: "14% lower ($416,000 to $357,000)", measures: "KPMG International's total audit fee for 2025 versus 2024, in dollars, per the filing cited by the report; the fee was paid in sterling", provenance: independent, source_ref: IRISHTIMES-KPMG-2026}
  prerequisites:
    - "Not stated in the source"
  risks_and_guardrails:
    - "A Verdantix analyst warns that trade-offs in audit integrity may be normalised in pursuit of efficiency (VERDANTIX)"
    - "Grant Thornton told the FT that its fees reflect the cost of its people and of the technology that supports them (IRISHTIMES-KPMG-2026)"
    - "The PCAOB's acting chair said PE-driven pressure on profitability could lead to cost-cutting and aggressive fee negotiations, citing Accountancy Europe research (AT-PCAOBPE-2025)"
  human_checkpoints:
    - "Not stated in the source"
  role_evolution: "Not stated in the source."
  evidence_grade: B
  sources:
    - {ref: IRISHTIMES-KPMG-2026, title: "KPMG pressed its auditor to pass on AI cost savings", publisher: "The Irish Times (Financial Times syndication)", type: press, url: "https://www.irishtimes.com/business/2026/02/06/kpmg-pressed-its-auditor-to-pass-on-ai-cost-savings/", date: "2026-02-06", access: full, locator: "Paragraphs 1-3 and the paragraphs on the filing and on comments from both firms"}
    - {ref: VERDANTIX, title: "What goes around comes around: KPMG's AI-driven fee argument raises uncomfortable questions about audit pricing models", publisher: "Verdantix", type: press, url: "https://www.verdantix.com/venture/blog/what-goes-around-comes-around--kpmg-s-ai-driven-fee-argument-raises-uncomfortable-questions-about-audit-pricing-models", date: "2026-02-10", access: full, locator: "Paragraphs 1-5"}
    - {ref: AT-PCAOBPE-2025, title: "PCAOB warns auditors about AI and PE", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "Botic's remarks on private-equity risks"}
