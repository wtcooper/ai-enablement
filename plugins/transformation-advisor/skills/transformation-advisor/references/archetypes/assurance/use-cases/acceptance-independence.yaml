- id: assurance-acceptance-independence-13
  title: "Idea: pre-adoption independence review of AI tool-vendor contracts and licences"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Tool vendors can shift control, judgment, fees, referrals or access to evidence away from the auditor, creating
    undue-influence and self-interest threats; AICPA ethics staff wrote this about SOC 2 tool providers and say it
    may also be relevant to other audit and attest services (JOFA-SOCETH-2026). A former PCAOB board member now at
    an AI-native audit firm says it remains unclear when licensing an AI audit tool becomes an independence issue
    (AT-PEEC-2026). As a licensing platform adds data pipelines, AI-generated workpaper drafts and exception
    flagging that structure the engagement, the line under the AICPA's draft becomes hard to draw
    (AICPA-APSCL-2026, CL 16).
  solution: >-
    Before adopting a vendor, review contracts for cross-referral concentration, vendor involvement in the work,
    vendor-driven deadlines, bundled fees, payment for evidence access, non-disparagement terms and marketing
    control (JOFA-SOCETH-2026). A commentator proposes documenting, for every tool that touches client work, who
    owns the vendor, whether it also serves the client, what the firm pays and whether payment depends on volume or
    referrals, and whether the vendor can use client data to train models (ACCWEEKLY-INDEP-2026). One comment letter
    proposes a safe harbour (subscription pricing with no revenue share, no leased personnel, the firm keeps
    governance, quality control and sign-off) and lists factors that would cross the line, including platform
    contractual rights over client acceptance (AICPA-APSCL-2026, CL 16). Other letters ask when investor-held
    technology contracts become participation in professional services (CL 25, Crete PA) and whether capital that
    accelerates the non-attest entity's technology signals close alignment (CL 54, PwC). No firm was found that has
    published such a review.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: JOFA-SOCETH-2026}
  prerequisites:
    - "A register of AI tools and vendor contracts across the firm, including vendors that also serve attest clients (JOFA-SOCETH-2026; ACCWEEKLY-INDEP-2026)"
    - "A PEEC decision on how the APS interpretation treats technology vendors; a second exposure draft was under discussion in Aug 2026 (JOFA-PEEC-2026)"
    - "Kingland markets a register of business, vendor and marketplace relationships overlaid on acceptance and conflict checks; it is not described as AI or as covering AI vendors specifically (KINGLAND-PA-2026)"
  risks_and_guardrails:
    - "If safeguards cannot eliminate significant threats, the firm should consider declining or discontinuing the engagement or the business arrangement (JOFA-SOCETH-2026)"
    - "IESBA's technology revisions strengthened independence provisions on self-review, assuming management responsibility and commercial dependencies (ICAS-IESBASNAP-2026)"
    - "IESBA staff say a vendor software update or algorithm change is new information requiring re-evaluation of threats (IESBA-NAM-2026, PDF p. 10); one of IESBA's May 2026 research questions asks how AI-driven commercial entanglement between firms and technology providers should be mapped (IESBA-EEA-2026)"
    - "Ambiguity could favour incumbents that build AI in-house over firms that license it, and none of the 81 comment letters came from a technology company, per the same commenter, who has a commercial interest (AT-PEEC-2026)"
