- id: assurance-acceptance-independence-14
  title: "Idea: clear firm-wide alliances with AI developers before accepting those developers, or companies that depend on them, as audit clients"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Large networks have firm-wide alliances with AI and cloud vendors: Deloitte is making Claude available to
    470,000 people (ANTHROPIC-DELOITTE-2025); KPMG is integrating it for more than 276,000 staff and will build
    Claude-powered products with Anthropic (ANTHROPIC-KPMG-2026); EY's assurance agent framework runs on Microsoft
    technology under a long-standing alliance (EY-CANVAS-2026). The SEC's chief accountant says the rules are
    fairly clear on direct business relationships with audit clients, but it becomes complicated when a firm
    partners with a non-audit client that uses an audit client in its service delivery (NYSSCPA-HOHL-2025).
  solution: >-
    Independence functions would map commercial relationships with AI vendors, including co-developed client
    offerings, against audit-client and affiliate lists, at network level before signing and again at each
    acceptance or continuance, and monitor how pervasive such relationships are. The SEC official says understanding
    that pervasiveness, and how it affects firms' monitoring, is a priority (NYSSCPA-HOHL-2025; STARLING-HOHL-2026).
    No firm process was found, and no opened source links a named alliance to a completed independence assessment.
  outcomes:
    - {lever: risk, description: "Context measure of alliance scale, not an outcome of any clearance step", figure: "470,000 people (Deloitte, Oct 2025); more than 276,000 employees (KPMG, May 2026)", measures: "number of each firm's people who will have access to Claude, per the announcements", provenance: vendor-published, source_ref: ANTHROPIC-KPMG-2026}
  prerequisites:
    - "A current register of audit clients, affiliates and commercial relationships, which IFIAR found some firms fail to maintain reliably (IFIAR-2025F)"
    - "A network-level register of alliances and co-developed offerings; no firm describes one in the sources"
  risks_and_guardrails:
    - "Press reports in Aug 2026, citing the Financial Times and not confirmed at source, say Big Four AI alliances leave EY as the likely auditor of Anthropic; neither the firms nor Anthropic have confirmed this in any source read (CRYPTOBRIEFING-ANTHROPICEY-2026; FOURTHWEB-ANTHROPICEY-2026; BIG4NEWS-2026)"
    - "The SEC's chief accountant said 'there's nothing in the works to loosen the independence rule' (STARLING-HOHL-2026) and that the rules must stay fit for purpose when AI is integrated into audit delivery (KPMG-HOHL-2026)"
    - "Low-authority commentary argues AI alliances create operational dependence not covered by rules written for industrial companies (FOURTHWEB-ANTHROPICEY-2026)"
  human_checkpoints:
    - "Not stated in the sources; the discourse angle suggests global independence leadership sign-off and audit-committee dialogue"
  role_evolution: "Not stated in the sources."
  evidence_grade: D
  sources:
    - {ref: ANTHROPIC-DELOITTE-2025, title: "Deloitte will make Claude available to 470,000 people across its global network", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/deloitte-anthropic-partnership", date: "2025-10-06", access: full, locator: "Opening paragraphs"}
    - {ref: ANTHROPIC-KPMG-2026, title: "KPMG integrates Claude across its core business and workforce of more than 276,000 in strategic alliance", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/anthropic-kpmg", date: "2026-05-19", access: full, locator: "Opening paragraphs; section on KPMG Digital Gateway"}
    - {ref: EY-CANVAS-2026, title: "EY Rolls Out Agentic AI in Assurance Across Its Global Network of Accounting Firms", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/04/07/ey-rolls-out-agentic-ai-in-assurance-across-its-global-network-of-accounting-firms/181097/", date: "2026-04-07", access: full, locator: "Paragraphs on Microsoft integration and strategic alliances"}
    - {ref: NYSSCPA-HOHL-2025, title: "SEC's Chief Accountant Discusses Audit Inspections, Conflict-of-Interest Rule Changes", publisher: "New York State Society of CPAs", type: press, url: "https://nysscpa.org/news/1045145-secs-chief-accountant-discusses-audit-inspections-conflict-of-interest-rule-changes-2025-12-12", date: "2025-12-12", access: full, locator: "Paragraphs on independence rules and AI partnerships"}
