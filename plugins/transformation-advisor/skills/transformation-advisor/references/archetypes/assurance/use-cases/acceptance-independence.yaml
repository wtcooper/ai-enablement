- id: assurance-acceptance-independence-15
  title: "Idea: permissibility gate for AI-related services and relationships (build, host, license, assure) offered to audit clients"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Firms are expanding AI services to clients they may also audit: Deloitte UK is expanding its AI assurance
    services (DELOITTE-UKTR-2025); KPMG Australia reports applying its Trusted AI Framework and receiving ISO AI
    accreditation (KPMG-AUTR-2025); KPMG and Anthropic will build Claude-powered products for private-equity
    portfolio companies (ANTHROPIC-KPMG-2026). AICPA ethics staff say developing or hosting an AI system for an
    attest client can raise independence concerns under the existing non-attest and information-systems rules
    (JOFA-ETHAI-2026).
  solution: >-
    Route every proposed AI-related service or relationship through the firm's existing pre-approval workflow
    before work starts, flagging build, host, licence and assurance engagements for review of self-review threats,
    assumption of management responsibility and commercial dependency (IESBA-SNAPSHOT-2026; JOFA-ETHAI-2026).
    Deloitte Ireland and Luxembourg describe a global entity database and a service-request pre-approval workflow
    integrated with it (DELOITTE-IE-TR-2026; DELOITTE-LU-TR-2026), and Deloitte UK says it strengthened assessment
    of independence when taking on non-audit engagements in FY2025 (DELOITTE-UKTR-2025); none of these is
    described as AI-specific. A joint IESBA and APESB guide works through technology scenarios, for example: for
    software licensed to an audit client, check that a competent client employee evaluates outputs; a black-box
    product the client had no part in developing makes that unlikely (IESBA-APESB-2023). Applying the gate to AI
    services is the idea; no firm describes it.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: IESBA-APESB-2023}
  prerequisites:
    - "A searchable entity database, a service-request workflow and a financial-relationship monitoring system (DELOITTE-IE-TR-2026)"
    - "Technology expertise in the service review, and an audit client with competent staff who can evaluate outputs; backtesting or parallel running can help them validate output (IESBA-APESB-2023, paras 43-44)"
  risks_and_guardrails:
    - "IESBA's technology revisions (effective for audits of periods beginning on or after 15 Dec 2024) reinforced independence provisions on self-review, assuming management responsibility and commercial dependencies (IESBA-TECHREV-2023; IESBA-SNAPSHOT-2026)"
    - "Frequent AI or analytics insights that the client relies on to make decisions or run controls risk assuming management responsibility or a self-review threat; for a PIE audit client, services creating a self-review threat are prohibited (IESBA-APESB-2023, paras 26-28)"
    - "SEC rules prohibit financial information system design and implementation services unless the results will not be subject to audit procedures (SEC-REGSX-2-01, (c)(4)(ii))"
    - "In the UK the FRC Ethical Standard, not the IESBA non-assurance provisions, governs auditors (ICAS-IESBASNAP-2026)"
    - "IESBA's director asked in May 2026 what happens to the substance of independence when firms provide technology services that are an input to what they also assure (IESBA-EEA-2026, slide 4)"
  human_checkpoints:
    - "Independence and conflicts teams review before take-on approval (DELOITTE-UKTR-2025, Appendix 5)"
    - "Audit partner evaluates threats and safeguards for each proposed non-audit service (IESBA-APESB-2023, Scenario 2)"
  role_evolution: "Not stated in the sources."
  evidence_grade: D
  sources:
    - {ref: DELOITTE-UKTR-2025, title: "2025 Transparency Report (Deloitte LLP and Deloitte Limited)", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report-accessible.pdf", date: "2025-11", access: full, locator: "Executive summary on AI assurance; ethics section on non-audit engagements; Appendix 5"}
    - {ref: KPMG-AUTR-2025, title: "KPMG Australia Transparency Report 2025", publisher: "KPMG Australia", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/au/pdf/2025/kpmg-australia-transparency-report-2025.pdf", date: "2025", access: full, locator: "Governance statement on the Trusted AI Framework and ISO AI accreditation"}
    - {ref: DELOITTE-IE-TR-2026, title: "2026 Transparency Report, Deloitte Ireland", publisher: "Deloitte Ireland", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/ie/en/docs/about/2026/deloitte-transparency-report-2026.pdf", date: "2026-09", access: full, locator: "Independence section: DESC, SRM and GIMS descriptions"}
    - {ref: DELOITTE-LU-TR-2026, title: "2026 Transparency Report, Deloitte Audit (Luxembourg)", publisher: "Deloitte Luxembourg", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/lu/en/docs/about/2026/lu_transparency_report-2026.pdf", date: "2026-09", access: full, locator: "Independence section: DESC, SRM and GIMS descriptions"}
    - {ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff author)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "Section 'AI services can raise independence concerns for attest clients'"}
    - {ref: IESBA-SNAPSHOT-2026, title: "IESBA Snapshot: Ethics and Independence Approach to the Use of Technology", publisher: "IESBA", type: standard-setter, url: "https://www.ethicsboard.org/news-events/2026-06/iesba-snapshot-ethics-and-independence-approach-use-technology", date: "2026-06-11", access: full, locator: "Q3 to Q5"}
    - {ref: IESBA-APESB-2023, title: "Applying the Code's Conceptual Framework to Independence: Practical Guidance for Auditors in Technology-Related Scenarios", publisher: "IESBA and APESB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2023-07/IESBA_APESB_Applying_the_Code_s_Conceptual_Framework_to_Independence_0.pdf", date: "2023-07-13", access: full, locator: "Paras 19-20, 26-30; Scenario 2, paras 41-47"}
