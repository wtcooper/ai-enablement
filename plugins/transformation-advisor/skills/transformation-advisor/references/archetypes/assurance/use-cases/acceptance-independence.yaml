- id: assurance-acceptance-independence-10
  title: "Idea: extend acceptance and continuance to assess how heavily a client relies on AI in financial reporting, and whether the team can audit it"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Clients increasingly use AI in financial reporting, sometimes in agent-run processes with no traceable
    workflow, so the auditor may not be able to gather evidence and management may not understand its own outputs
    (AT-AICPAPA-2026). The SEC's chief accountant says some companies that say they are not using AI are doing so
    when asked (KPMG-HOHL-2026).
  solution: >-
    The AICPA practice aid (13 Oct 2026), as summarised by Accounting Today, says an entity's AI use may affect
    acceptance or continuance through the nature and circumstances of the engagement, management's integrity and
    ethical values, management's skills, and the engagement team's competence. The more the entity relies on AI
    outputs, the more information the auditor may need, such as whether evidence can be gathered; heavy AI use may
    resemble reliance on external specialists and complex valuation models (AT-AICPAPA-2026). The AICPA release
    says auditors should address client AI reliance at the start of an engagement and check the team has the
    skills needed (AICPA-PA). This is a new human assessment step, not AI performing the task; no firm practice
    was found.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: AT-AICPAPA-2026}
  prerequisites:
    - "An engagement team with a blend of auditing expertise, AI knowledge, data skills, professional skepticism and specialist support (AICPA-PA)"
    - "A way to learn how the client uses AI, including AI used by its vendors and third parties (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "The entity's use of AI does not change management's responsibility for the financial statements (AT-AICPAPA-2026)"
    - "If management lacks the understanding needed to take responsibility for AI outputs, that may indicate a lack of appropriate skills and competencies (AT-AICPAPA-2026)"
    - "The practice aid is nonauthoritative; more guidance on risk of material misstatement and audit evidence is to be added (AICPA-PA)"
    - "The AICPA release lists data, model, hallucination, explainability and bias risks to consider (AICPA-PA)"
  human_checkpoints:
    - "Engagement partner and firm risk function make the acceptance or continuance decision; the practice aid lists factors and does not describe a tool (AT-AICPAPA-2026)"
  role_evolution: >-
    Engagement teams need AI knowledge and data skills alongside audit expertise and may need specialist support
    (AICPA-PA).
  evidence_grade: D
  sources:
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "Paragraphs on acceptance or continuance and on external specialists and complex valuation models"}
    - {ref: AICPA-PA, title: "AICPA Releases Guidance to Help Auditors Address the Use of AI in Financial Reporting and Auditing", publisher: "AICPA & CIMA", type: standard-setter, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "Section 'Considering an organization's use of AI'"}
    - {ref: JOFA-AIPA-2026, title: "AI and the audit: AICPA publishes practice aid to assist auditors", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/oct/ai-and-the-audit-aicpa-publishes-practice-aid-to-assist-auditors/", date: "2026-10-13", access: full, locator: "Paragraphs 1-4"}
    - {ref: KPMG-HOHL-2026, title: "Q&A with Kurt Hohl, SEC chief accountant", publisher: "KPMG Board Leadership Center (interview of an SEC official)", type: firm, url: "https://kpmg.com/us/en/board-leadership/articles/2026/qa-kurt-hohl-sec-chief-accountant.html", date: "2026-05-27", access: full, locator: "Answer on AI and audit committees"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). Merged from practice-07, discourse-04 and governance-07. The practice aid is member-gated and was not
    read by any angle; the acceptance wording is Accounting Today's paraphrase, which the discourse angle could not
    confirm from the AICPA release alone. Guidance issued three days before this synthesis. The AI is the client's;
    ladder and pattern are nominal.

- id: assurance-acceptance-independence-11
  title: "Idea: engagement terms that address the firm's AI use and client-data consent"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [document-production, client-interaction]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Firms use AI on client work, but it is unclear when the engagement letter or a consent must say so
    (AT-AICPAPA-2026). Some clients do not want AI used in their audits, according to Grant Thornton UK's chief
    executive (IRISHTIMES-GT-2026), and client data entered into some AI tools can be used to train models
    (JOFA-ETHAI-2026).
  solution: >-
    The AICPA practice aid says AU-C 210 (the US standard on agreeing audit terms) does not require the engagement
    letter to name AI tools, because the letter covers what the auditor does, not how; laws, regulations,
    contracts or firm policy may require disclosure, and some states require licensed professionals to disclose
    certain AI uses in advance, which may be done in the engagement letter (AT-AICPAPA-2026; CFODIVE-AICPAPA-2026).
    AICPA ethics staff say that before client data goes into an AI tool the firm should ask whether consent is
    needed and whether the client has specifically consented (JOFA-ETHAI-2026). IESBA says using client data for
    model training requires proper authorisation (IESBA-SNAPSHOT-2026). In 2023 the South African regulator
    recommended engagement letters cover AI tool use in audits (IRBA-AI-2023). No firm practice was found.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: AT-AICPAPA-2026}
  prerequisites:
    - "An inventory of which AI tools are used on which engagements, and a check of state disclosure laws (AT-AICPAPA-2026)"
    - "A firm policy on approved AI tools and data handling (JOFA-ETHAI-2026)"
  risks_and_guardrails:
    - "Pasting client data into a public AI tool may breach the Confidential Client Information Rule if consent was needed and not obtained (JOFA-ETHAI-2026)"
    - "Disclosure duties come from state law, contracts and firm policy, not from the auditing standard (CFODIVE-AICPAPA-2026)"
    - "Unauthorised use of client data for model training is a Code concern (IESBA-SNAPSHOT-2026, Q4)"
  human_checkpoints:
    - "Partner decides what the engagement letter says and whether consent has been obtained (AT-AICPAPA-2026; JOFA-ETHAI-2026)"
  role_evolution: "Not stated in the sources."
  evidence_grade: D
  sources:
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "Paragraphs on AU-C section 210 and the engagement letter"}
    - {ref: CFODIVE-AICPAPA-2026, title: "AICPA issues guidance for AI-assisted auditing", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/aicpa-issues-guidance-ai-assisted-auditing/832907/", date: "2026-10-13", access: full, locator: "FAQ paragraph on engagement letters"}
    - {ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff author)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "Confidentiality section"}
    - {ref: IESBA-SNAPSHOT-2026, title: "IESBA Snapshot: Ethics and Independence Approach to the Use of Technology", publisher: "IESBA", type: standard-setter, url: "https://www.ethicsboard.org/news-events/2026-06/iesba-snapshot-ethics-and-independence-approach-use-technology", date: "2026-06-11", access: full, locator: "Q4, Confidentiality"}
    - {ref: IRBA-AI-2023, title: "Artificial Intelligence Audit Risks Mitigation", publisher: "Independent Regulatory Board for Auditors (South Africa)", type: regulator, url: "https://www.irba.co.za/upload/report_files/02.-AI-Audit-Risks-Mitigation.pdf", date: "2023-01-12", access: full, locator: "Recommendations list"}
    - {ref: IRISHTIMES-GT-2026, title: "Grant Thornton's UK boss defends private equity ownership", publisher: "The Irish Times (Financial Times syndication)", type: press, url: "https://www.irishtimes.com/business/2026/09/22/grant-thorntons-uk-boss-defends-private-equity-ownership/", date: "2026-09-22", access: full, locator: "Final paragraphs on AI and graduate hiring"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). Merged from practice-06, discourse-05 and governance-08. The practice aid's position comes from press
    accounts that agree. The IRBA communique is older than 18 months and states it was itself generated by AI and
    then reviewed. A low-authority CPE commentary (LearnFormula) cited by discourse was dropped. The governance
    angle's adjacent 26% engagement-letter automation figure sits in entry 08.

