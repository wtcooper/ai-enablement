- id: assurance-acceptance-independence-17
  title: Screen prospective and continuing clients against the firm's investor group, and consult the regulator on grey areas
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    When a firm's owner or its funds hold stakes in companies, taking those or related companies as audit clients
    can fall into independence grey areas (IRISHTIMES-GT-2026). Under the AICPA draft, the attest firm would be
    barred from attesting where an upstream entity of the non-attest entity is an affiliate of an attest client
    (AICPA-APSED-2025), and commenters say mapping an investment adviser's funds and portfolio is hard when
    investors do not disclose it (AICPA-APSCL-2026, CL 16; CL 77).
  solution: >-
    At acceptance the firm checks whether the prospective client is linked to the investor's holdings, declines
    where independence is doubtful, and consults the regulator where the answer is unclear. Grant Thornton UK's
    chief executive said the firm would not audit a company in which its PE owner Cinven has invested, and that it
    took one prospective client to the FRC, agreed it was a 'grey area', and did not proceed (IRISHTIMES-GT-2026).
    In the UK, an audit firm acquired by a PE fund may not audit the fund, its portfolio companies or significant
    affiliates, and must assess whether the fund or its staff become covered persons (ICAEW-PE-2024). Commenters
    suggest firms may need contractual rights to real-time ownership data from investors (AICPA-APSCL-2026, CL 77)
    or investor disclosure of fund structure and holdings (CL 16). Intapp markets tagging of audit clients and
    links to employee investment data (INTAPP-CONFLICTS-2026). No source describes AI in this screening.
  outcomes:
    - {lever: risk, description: "One reported case: a prospective client was taken to the FRC, the regulator agreed it was a grey area, and the firm decided not to proceed", figure: "1 case", measures: "number of reported instances in which the firm consulted the FRC about taking on a client, per the chief executive", provenance: self-reported, source_ref: IRISHTIMES-GT-2026}
  prerequisites:
    - "A map of the investor, its funds, portfolio companies and the firm's attest and non-attest entities (ICAEW-PE-2024; JOFA-PE-2025)"
    - "Contractual access to investor ownership data (AICPA-APSCL-2026, CL 77)"
    - "A current list of attest clients and affiliates (INTAPP-CONFLICTS-2026)"
  risks_and_guardrails:
    - "The chief executive acknowledged complex ownership structures create uncertainty over how far independence restrictions extend (IRISHTIMES-GT-2026)"
    - "PEEC's 2025 discussion memorandum treated a PE investor and its portfolio companies as generally not network firms, with exceptions (JOFA-PE-2025)"
    - "The draft's 'knows or has reason to believe' standard is undefined, and a commenter asks for a threshold for the duty to investigate (AICPA-APSCL-2026, CL 16)"
    - "PEEC discussed in Aug 2026 a new interpretation barring attest-client investment in firms, which would add a client-to-owner check; not adopted (JOFA-PEEC-2026)"
    - "PCAOB inspectors said they will examine independence and quality control at firms that took PE or APS changes (AT-PCAOBPE-2025)"
  human_checkpoints:
    - "Independence and risk leaders assess whether the investor or its staff are covered persons, and keep the assessment under review (ICAEW-PE-2024)"
    - "Partner and independence-function decision, with regulator consultation on grey areas (IRISHTIMES-GT-2026)"
  role_evolution: "Not stated in the sources."
  evidence_grade: B
  sources:
    - {ref: IRISHTIMES-GT-2026, title: "Grant Thornton's UK boss defends private equity ownership", publisher: "The Irish Times (Financial Times syndication)", type: press, url: "https://www.irishtimes.com/business/2026/09/22/grant-thorntons-uk-boss-defends-private-equity-ownership/", date: "2026-09-22", access: full, locator: "Paragraphs 2-3 and the paragraph on consulting the FRC"}
    - {ref: ICAEW-PE-2024, title: "Private equity investment in audit firms", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/regulation/working-in-the-regulated-area-of-audit/audit-regulations-and-guidance/private-equity-investment-in-audit-firms", date: "2024-10-25", access: full, locator: "FRC confirmation and covered-person paragraphs (page marked 'Published: 25 Oct 2024')"}
    - {ref: AICPA-APSED-2025, title: "Exposure draft: Proposed revisions related to alternative practice structures", publisher: "AICPA Professional Ethics Division", type: standard-setter, url: "https://assets.ctfassets.net/rb9cdnjh59cm/3M0CFAUnOquO2oDNiH0VF5/b8adc950ef4775cbe359349dc706cbbe/ethics-ED-APS-2025.pdf", date: "2025-12-29", access: full, locator: "Explanatory material paras 23, 49 and 52-53; proposed .18b"}
    - {ref: AICPA-APSCL-2026, title: "Comment Letters: Alternative Practice Structures", publisher: "AICPA", type: standard-setter, url: "https://downloads.ctfassets.net/rb9cdnjh59cm/2k2SNDfzw8AbcvW0nfoiOs/bcfdc3e65de4e2c18a45be3e44e26900/Comment_letters_-_Alternative_practice_structures__APS_.pdf", date: "2026-05-14", access: full, locator: "CL 16 section III.B; CL 77 recommendation on upstream relationships"}
    - {ref: JOFA-PE-2025, title: "AICPA seeks feedback on independence rules related to private equity", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2025/mar/independence-rules-private-equity/", date: "2025-03-10", access: full, locator: "Network-firm paragraphs"}
    - {ref: JOFA-PEEC-2026, title: "PEEC to continue discussions on alternative practice structures", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/aug/peec-to-continue-discussions-on-alternative-practice-structures/", date: "2026-08-10", access: full, locator: "Paragraph 1"}
    - {ref: INTAPP-CONFLICTS-2026, title: "Conflicts and independence management for accounting firms", publisher: "Intapp", type: vendor, url: "https://intapp.com/accounting/conflicts", date: "2026-07-29", access: full, locator: "'Independence tracking'; 'Visibility into outside business interests' (date is the page's last-modified date)"}
    - {ref: AT-PCAOBPE-2025, title: "PCAOB warns auditors about AI and PE", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "Section 'PE warning'"}
  last_reviewed: "2026-10-16"
  notes: >-
    Grade B rests on a named firm stating the practice in an interview (a Financial Times piece syndicated by The Irish Times);
    no tooling or measurement is described. Pattern and ladder are nominal: matching client lists against investor
    holdings is the reconcile-exceptions shape if tooled, but no AI was found. CL 77 is from Florida State
    University and does not concern AI. A Bloomberg Tax report on PCAOB inspections of PE-backed firms was readable
    only in its opening paragraphs and is not relied on.

- id: assurance-acceptance-independence-18
  title: AI audit platform rolled out by a firm in an alternative practice structure, and governance of platforms shared across attest and non-attest entities
  archetype: assurance
  module: acceptance-independence
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Grant Thornton US has operated since New Mountain Capital's 2024 acquisition with attest services in Grant
    Thornton LLP and non-attest services in Grant Thornton Advisors (GT-GTAP-2026). In an APS the non-attest entity
    can supply the attest firm with staff, technology tools and services under the administrative services
    agreement (APESB-PE-2025), so a shared AI platform raises the question of who provides it and whether
    independence rules reach that arrangement.
  solution: >-
    Grant Thornton LLP announced on 7 May 2026 that it has launched gtap, a cloud audit infrastructure with AI-driven
    workflows and intelligent agents that surface risks, anomalies and insights. Grant Thornton Ireland developed it
    and enhanced it with Grant Thornton's US technology team; it will be introduced on private-company audits first
    and expand to public-company audits the next year (GT-GTAPPR-2026; GT-GTAP-2026). Idea (no firm describes it):
    treat AI and data platforms provided across attest and non-attest entities as part of the independence
    assessment: who builds, owns and controls them, how they are paid for, and whether access and judgment stay
    with the attest firm.
  outcomes:
    - {lever: quality, description: "The CEO says automating transactional work lets teams focus on judgment and increases consistency. No measured result", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: GT-GTAP-2026}
  prerequisites:
    - "An APS with attest and non-attest entities and a written administrative services agreement that addresses current and future resource needs (GT-GTAP-2026; JOFA-NILSEN-2025)"
  risks_and_guardrails:
    - "Neither the firm's release nor the press report says which entity owns or licenses gtap or how the arrangement was assessed for independence; the release quotes the chief information officer of Grant Thornton Advisors LLC, the non-attest entity, on the platform (GT-GTAPPR-2026; GT-GTAP-2026)"
    - "Attest and non-attest entities are kept separate for regulatory reasons (GT-GTAP-2026)"
    - "PEEC's discussion memorandum treated the non-attest entity as a network firm of the attest firm (JOFA-PE-2025); its exposure draft would add entities that control, or are controlled by, a network firm and cooperate to enhance its capabilities (JOFA-PEED-2025)"
    - "A commentator at a competing AI-native firm says technology businesses 'closely aligned' with audit firms could fall within APS scope (AT-PEEC-2026)"
    - "Accountancy Europe says questions remain about whether administrative services agreements always protect independence (AE-BEYONDPE-2025)"
    - "PCAOB inspectors will focus on independence, culture and resources at firms with PE or APS changes (AT-PCAOBPE-2025)"
  human_checkpoints:
    - "The firm says professionals supervise every step and remain in control of the decision-making process (GT-GTAP-2026; GT-GTAPPR-2026)"
    - "Suggested (idea, no firm describes it): attest-firm leadership approval of any shared-technology arrangement, with independence consultation"
  role_evolution: >-
    Teams focus on professional skepticism, judgment and risk assessment rather than transactional steps, per the
    CEO (GT-GTAP-2026).
  evidence_grade: C
  sources:
    - {ref: GT-GTAPPR-2026, title: "Grant Thornton launches gtap to transform audit", publisher: "Grant Thornton (US)", type: firm, url: "https://www.grantthornton.com/insights/press-releases/2026/may/grant-thornton-launches-gtap-audit-transformation-us", date: "2026-05-07", access: full, locator: "Press release paragraphs on launch, rollout, 'Built across borders' and the APS boilerplate"}
    - {ref: GT-GTAP-2026, title: "Grant Thornton launches AI platform for audit business", publisher: "Consulting.us", type: press, url: "https://www.consulting.us/news/13378/grant-thornton-launches-ai-platform-for-audit-business", date: "2026-05-11", access: full, locator: "Paragraphs 1-8"}
    - {ref: APESB-PE-2025, title: "Update on Private Equity Investment in Firms (agenda item 11)", publisher: "APESB (Australia)", type: standard-setter, url: "https://apesb.org.au/wp-content/uploads/2025/06/Agenda_Item_11_Update_on_Private_Equity_Investment_In_Firms.pdf", date: "2025-06", access: full, locator: "Section on the APS structure and administrative services agreement"}
    - {ref: JOFA-NILSEN-2025, title: "Navigating outside investors: Safeguarding ethics and independence in evolving practice structures", publisher: "Journal of Accountancy (AICPA staff author)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/oct/navigating-outside-investors-safeguarding-ethics-and-independence-in-evolving-practice-structures/", date: "2025-10-24", access: full, locator: "Administrative services agreement paragraph"}
    - {ref: JOFA-PE-2025, title: "AICPA seeks feedback on independence rules related to private equity", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2025/mar/independence-rules-private-equity/", date: "2025-03-10", access: full, locator: "Network-firm paragraph"}
    - {ref: JOFA-PEED-2025, title: "AICPA proposes changes to independence guidelines related to private equity", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2025/dec/aicpa-proposes-changes-to-independence-rules-related-to-private-equity/", date: "2025-12-19", access: full, locator: "Paragraph on network firm definition"}
    - {ref: AT-PEEC-2026, title: "AICPA weighs PE and tech impact on audit independence", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-weighs-pe-and-tech-impact-on-audit-independence-rules", date: "2026-08-31", access: full, locator: "Paragraphs on technology companies considered closely aligned"}
    - {ref: AE-BEYONDPE-2025, title: "Beyond private equity: third party ownership in the accountancy and audit sector (summary)", publisher: "Accountancy Europe", type: professional-body, url: "https://accountancyeurope.eu/wp-content/uploads/2025/11/251121-Beyond-Private-Equity-Third-Party-ownership-summary.pdf", date: "2025-11-21", access: full, locator: "Governance mechanisms section"}
    - {ref: AT-PCAOBPE-2025, title: "PCAOB warns auditors about AI and PE", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "Section 'PE warning'"}
  last_reviewed: "2026-10-16"
  notes: >-
    Grade C: the firm announces a launch and phased rollout, but no source shows use on named audits, and the
    shared-platform governance step is an idea. The firm's release is dated 7 May 2026; the trade-press report
    11 May 2026. The
    platform's audit functions belong to the planning and substantive modules; this entry covers the structural
    and independence angle only.

