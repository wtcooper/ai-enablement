- id: assurance-acceptance-independence-15
  title: "Idea: permissibility gate for AI-related services and relationships (build, host, license, assure) offered to audit clients"
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Firms are expanding AI services to clients they may also audit: Deloitte UK is expanding its AI assurance
    services (DELOITTE-UKTR-2025); KPMG Australia reports applying its Trusted AI Framework and receiving ISO AI
    accreditation (KPMG-AUTR-2025); KPMG and Anthropic will build Claude-powered products for private-equity
    portfolio companies (ANTHROPIC-KPMG-2026). AICPA ethics staff say developing or hosting an AI system for an
    attest client can raise independence concerns under the existing non-attest and information-systems rules
    (JOFA-ETHAI-2026).
  solution: >-
    Route every proposed AI-related service or relationship through the firm's existing pre-approval workflow
    before work starts, flagging build, host, licence and assurance engagements for review of self-review threats,
    assumption of management responsibility and commercial dependency (IESBA-SNAPSHOT-2026; JOFA-ETHAI-2026).
    Deloitte Ireland and Luxembourg describe a global entity database and a service-request pre-approval workflow
    integrated with it (DELOITTE-IE-TR-2026; DELOITTE-LU-TR-2026), and Deloitte UK says it strengthened assessment
    of independence when taking on non-audit engagements in FY2025 (DELOITTE-UKTR-2025); none of these is
    described as AI-specific. A joint IESBA and APESB guide works through technology scenarios, for example: for
    software licensed to an audit client, check that a competent client employee evaluates outputs; a black-box
    product the client had no part in developing makes that unlikely (IESBA-APESB-2023). Applying the gate to AI
    services is the idea; no firm describes it.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: independent, source_ref: IESBA-APESB-2023}
  prerequisites:
    - "A searchable entity database, a service-request workflow and a financial-relationship monitoring system (DELOITTE-IE-TR-2026)"
    - "Technology expertise in the service review, and an audit client with competent staff who can evaluate outputs; backtesting or parallel running can help them validate output (IESBA-APESB-2023, paras 43-44)"
  risks_and_guardrails:
    - "IESBA's technology revisions (effective for audits of periods beginning on or after 15 Dec 2024) reinforced independence provisions on self-review, assuming management responsibility and commercial dependencies (IESBA-TECHREV-2023; IESBA-SNAPSHOT-2026)"
    - "Frequent AI or analytics insights that the client relies on to make decisions or run controls risk assuming management responsibility or a self-review threat; for a PIE audit client, services creating a self-review threat are prohibited (IESBA-APESB-2023, paras 26-28)"
    - "SEC rules prohibit financial information system design and implementation services unless the results will not be subject to audit procedures (SEC-REGSX-2-01, (c)(4)(ii))"
    - "In the UK the FRC Ethical Standard, not the IESBA non-assurance provisions, governs auditors (ICAS-IESBASNAP-2026)"
    - "IESBA's director asked in May 2026 what happens to the substance of independence when firms provide technology services that are an input to what they also assure (IESBA-EEA-2026, slide 4)"
  human_checkpoints:
    - "Independence and conflicts teams review before take-on approval (DELOITTE-UKTR-2025, Appendix 5)"
    - "Audit partner evaluates threats and safeguards for each proposed non-audit service (IESBA-APESB-2023, Scenario 2)"
  role_evolution: >-
    Not stated in the sources. The discourse angle infers that independence staff will need enough technical
    understanding of AI services to classify them.
  evidence_grade: D
  sources:
    - {ref: DELOITTE-UKTR-2025, title: "2025 Transparency Report (Deloitte LLP and Deloitte Limited)", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report-accessible.pdf", date: "2025-11", access: full, locator: "Executive summary on AI assurance; ethics section on non-audit engagements; Appendix 5"}
    - {ref: KPMG-AUTR-2025, title: "KPMG Australia Transparency Report 2025", publisher: "KPMG Australia", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/au/pdf/2025/kpmg-australia-transparency-report-2025.pdf", date: "2025", access: full, locator: "Governance statement on the Trusted AI Framework and ISO AI accreditation"}
    - {ref: DELOITTE-IE-TR-2026, title: "2026 Transparency Report, Deloitte Ireland", publisher: "Deloitte Ireland", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/ie/en/docs/about/2026/deloitte-transparency-report-2026.pdf", date: "2026-09", access: full, locator: "Independence section: DESC, SRM and GIMS descriptions"}
    - {ref: DELOITTE-LU-TR-2026, title: "2026 Transparency Report, Deloitte Audit (Luxembourg)", publisher: "Deloitte Luxembourg", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/lu/en/docs/about/2026/lu_transparency_report-2026.pdf", date: "2026-09", access: full, locator: "Independence section: DESC, SRM and GIMS descriptions"}
    - {ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff author)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "Section 'AI services can raise independence concerns for attest clients'"}
    - {ref: IESBA-SNAPSHOT-2026, title: "IESBA Snapshot: Ethics and Independence Approach to the Use of Technology", publisher: "IESBA", type: standard-setter, url: "https://www.ethicsboard.org/news-events/2026-06/iesba-snapshot-ethics-and-independence-approach-use-technology", date: "2026-06-11", access: full, locator: "Q3 to Q5"}
    - {ref: IESBA-APESB-2023, title: "Applying the Code's Conceptual Framework to Independence: Practical Guidance for Auditors in Technology-Related Scenarios", publisher: "IESBA and APESB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2023-07/IESBA_APESB_Applying_the_Code_s_Conceptual_Framework_to_Independence_0.pdf", date: "2023-07-13", access: full, locator: "Paras 19-20, 26-30; Scenario 2, paras 41-47"}
    - {ref: IESBA-TECHREV-2023, title: "Final Pronouncement: Technology-related Revisions to the Code", publisher: "IESBA", type: standard-setter, url: "https://www.ethicsboard.org/publications/final-pronouncement-technology-related-revisions-code", date: "2023-04-11", access: full, locator: "Summary and effective-date paragraph"}
    - {ref: SEC-REGSX-2-01, title: "17 CFR 210.2-01 Qualifications of accountants", publisher: "US Securities and Exchange Commission (text via Cornell LII)", type: regulator, url: "https://www.law.cornell.edu/cfr/text/17/210.2-01", date: "2020-12", access: full, locator: "Paragraph (c)(4)(ii); date is the last amendment listed"}
    - {ref: ICAS-IESBASNAP-2026, title: "IESBA issues snapshot on the ethical implications of using technology, including AI", publisher: "ICAS", type: professional-body, url: "https://icas.com/news-insights-events/news/ethics/iesba-issues-snapshot-on-the-ethical-implications-of-using-technology-including-ai/", date: "2026-07-14", access: full, locator: "Section on technology-related revisions to the Code"}
    - {ref: IESBA-EEA-2026, title: "Ethics is not the constraint on AI assurance. It is the foundation (EAA Congress presentation)", publisher: "IESBA", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-06/EAA_IESBA_Presentation_final.pdf", date: "2026-05", access: full, locator: "Slide 4"}
    - {ref: ANTHROPIC-KPMG-2026, title: "KPMG integrates Claude across its core business and workforce of more than 276,000 in strategic alliance", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/anthropic-kpmg", date: "2026-05-19", access: full, locator: "Section on products for PE portfolio companies"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). Merged from practice-14, discourse-11 and governance-10. Discourse graded its entry B because
    Deloitte's pre-approval workflow is a named deployment; the synthesis grades the merged entry D because no
    source shows that workflow (or any other) applied to AI services, which is the change this entry describes.
    The service offerings are real; whether any buyer is an audit client is not stated. Transparency-report
    publication dates are not printed in the documents (Deloitte UK from file metadata; KPMG Australia year only).

- id: assurance-acceptance-independence-16
  title: Independence due diligence and governance safeguards before a firm takes private-equity or other outside investment (APS structuring)
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Private-equity (PE) investment, mostly through alternative practice structures (APS: attest work in a
    CPA-owned firm, other services in an investor-backed entity linked by an administrative services agreement),
    can create independence threats through investor holdings, network-firm status and shared services
    (JOFA-NILSEN-2025). The PCAOB's acting chair said PE capital can finance investment in technology including AI
    (AT-PCAOBPE-2025), and the SEC's chief accountant says APS can provide capital for new technology but introduce
    risk, particularly to independence (TR-HOHL-2026). IFAC says new governance layers can dilute audit partners'
    control or oversight of client selection and engagement performance (IFAC-AQ-2026).
  solution: >-
    Firms run a pre-transaction review with counsel and, where relevant, regulators: map which entities are network
    firms and which individuals are covered members, draft the administrative services agreement, set
    quality-management controls and investor education, then monitor (JOFA-NILSEN-2025). Grant Thornton UK's
    Cinven investment closed in early 2025 after regulatory approval, with the audit practice kept in its LLP and
    advisory and tax moved to a new entity (AE-PE-2026). IFAC's concern points to reserving acceptance and
    continuance authority to the audit entity so investor profit targets cannot decide client selection
    (IFAC-AQ-2026). This is a human control process, not AI doing the work.
  outcomes:
    - {lever: risk, description: "Context measure of structural change, not an outcome of the review step", figure: "385 transactions in 2025, 139 involving audit firms", measures: "transactions (direct investments and roll-overs) involving accountancy and audit firms identified across Europe in 2025; 139 involved audit firms", provenance: independent, source_ref: AE-PE-2026}
    - {lever: risk, description: "Context measure of PE reach into public-interest-entity (PIE) audit", figure: "46 firms owned directly; 52 further PIE audit firms rolled up into them", measures: "per IFAC, direct PE investment has produced equity ownership in 46 firms that audit PIEs, and 52 PIE audit firms were acquired or rolled up into those 46 (data as of 30 Jun 2026)", provenance: independent, source_ref: IFAC-AQ-2026}
  prerequisites:
    - "Counsel experienced in the Code and in state or national law; engagement with regulators and standard-setters; a draft administrative services agreement (JOFA-NILSEN-2025)"
    - "Governance documents that reserve client acceptance authority to the audit entity (discourse analyst's reading of IFAC-AQ-2026)"
  risks_and_guardrails:
    - "Where the Code does not address a structure, such as PE with significant influence but not control, apply the conceptual framework and document safeguards (JOFA-NILSEN-2025)"
    - "The AICPA exposure draft (Dec 2025; comments closed 30 Apr 2026) separates significant influence from control and widens the network-firm definition; a second exposure draft was under discussion in Aug 2026 (JOFA-PEED-2025; JOFA-PEEC-2026)"
    - "The FRC is not in principle against external private capital but says legal control requirements must be met in substance and form, and asks firms to engage early and candidly (FRC-PCLETTER-2024)"
    - "IFAC cites short-term incentives, a median PE holding period of about five years, secondary sales and capital leakage as pressures on quality management (IFAC-AQ-2026)"
    - "PCAOB officials warned that PE-driven profit pressure could reduce staffing and specialists, and that roll-ups may reduce the number of firms auditing public companies (AT-PCAOBPE-2025)"
    - "The SEC's chief accountant said some PE-backed small firms left the public-company market because it is too expensive (NYSSCPA-HOHL-2025)"
  human_checkpoints:
    - "Firm governance vote and regulator engagement before closing; independence consultation on the structure (discourse angle, from JOFA-NILSEN-2025 and AE-BEYONDPE-2025)"
    - "Audit-entity leadership decides acceptance; independent oversight of the administrative services agreement (discourse angle, from IFAC-AQ-2026)"
  role_evolution: >-
    Ethics and independence leaders add transaction work to their role; Accountancy Europe says firms need expert
    legal, governance and transaction support (AE-BEYONDPE-2025). Audit partners' standing in firm governance is
    IFAC's stated concern (IFAC-AQ-2026).
  evidence_grade: B
  sources:
    - {ref: JOFA-NILSEN-2025, title: "Navigating outside investors: Safeguarding ethics and independence in evolving practice structures", publisher: "Journal of Accountancy (AICPA staff author)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/oct/navigating-outside-investors-safeguarding-ethics-and-independence-in-evolving-practice-structures/", date: "2025-10-24", access: full, locator: "Paragraphs on due diligence, administrative services agreement and multipronged approach"}
    - {ref: AE-PE-2026, title: "Private Equity in European Accountancy and Audit Firms: an update on market activity, January 2025 - April 2026", publisher: "Accountancy Europe", type: professional-body, url: "https://accountancyeurope.eu/wp-content/uploads/2026/05/260629-Private-equity-investment-in-accountancy-and-audit-sector-in-EU-from-January-2025-to-April-2026.pdf", date: "2026-07", access: full, locator: "Market overview and Grant Thornton case"}
    - {ref: AE-BEYONDPE-2025, title: "Beyond private equity: third party ownership in the accountancy and audit sector (summary)", publisher: "Accountancy Europe", type: professional-body, url: "https://accountancyeurope.eu/wp-content/uploads/2025/11/251121-Beyond-Private-Equity-Third-Party-ownership-summary.pdf", date: "2025-11-21", access: full, locator: "Risks and governance mechanisms sections"}
    - {ref: IFAC-AQ-2026, title: "Audit Quality: Considerations and Implications", publisher: "IFAC", type: professional-body, url: "https://www.ifac.org/private-equity-investment-accountancy/audit-quality-considerations-and-implications", date: "2026-06", access: full, locator: "Intro data paragraph and 'Governance' challenge"}
    - {ref: JOFA-PEED-2025, title: "AICPA proposes changes to independence guidelines related to private equity", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2025/dec/aicpa-proposes-changes-to-independence-rules-related-to-private-equity/", date: "2025-12-19", access: full, locator: "Paragraphs 1-4"}
