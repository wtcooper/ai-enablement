# Use cases: assurance / acceptance-independence
# Synthesised 2026-10-16 from the wave 1 landscape scan and the practice, discourse and governance deep dives
# (research/runs/wave1/). Source refs are canonical keys; where the same document already has a key in the
# controls-testing file (AICPA-PA, FRC-GENAI, IFIAR-2025F, VERDANTIX, CPACOM-ATR) that key is reused. The synthesis
# report maps every key back to the input files' own refs.
# Two directions: entries 01-09 are AI or automation inside acceptance, KYC and independence work (thin, mostly
# vendor-described); entries 10-15 are new acceptance and independence steps created by AI use (ideas from
# guidance); entries 16-21 are structural change (private equity, alternative practice structures, AI-native firms,
# fees), where the evidence is stronger but the AI link is often indirect.
# No entry has a measured outcome for AI in acceptance, KYC or independence work. Where `ladder: assist` is used
# for a human control step, the AI belongs to the client, a vendor or the firm's structure, and the value is nominal.

- id: assurance-acceptance-independence-01
  title: AI-assisted conflicts and independence clearance across a multi-firm accounting platform
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    A private-equity-backed accounting network has to clear conflicts and independence across services performed
    at other member firms. The network's general counsel describes firms relying on spreadsheets, manual processes
    and long completion times before an engagement letter goes out (INTAPP-CRETE-2024).
  solution: >-
    Crete Professionals Alliance feeds all member-firm data into a consolidated data warehouse. Intapp Conflicts
    uses applied AI and predictive risk-scoring to search for and analyse potential conflicts and independence
    impairments, so the compliance team concentrates on high-risk results (INTAPP-CRETE-2024). Intapp's product
    page describes AI that surfaces potential issues for analysts and escalation of independence issues to
    partners (INTAPP-CONFLICTS-2026).
  outcomes:
    - {lever: speed, description: "Qualitative only: Crete PA executives say the approach will relieve staff and improve the firm's risk profile. No time, accuracy or error figure is published", figure: "none published", measures: "not applicable", provenance: vendor-published, source_ref: INTAPP-CRETE-2024}
  prerequisites:
    - "A central technology stack, so the tool does not have to be re-implemented for each new member firm (INTAPP-CRETE-2024)"
    - "Member-firm data consolidated into one warehouse (INTAPP-CRETE-2024)"
  risks_and_guardrails:
    - "The release says compliance staff act on high-risk results and remediate them; it does not describe how missed conflicts are detected (INTAPP-CRETE-2024)"
    - "Independence checking relies on complete family-tree and relationship data; IFIAR counted 11 findings in its 2025 survey on failing to implement a reliable system for tracking business relationships, financial interests and corporate family trees (IFIAR-2025F)"
  human_checkpoints:
    - "Compliance team reviews high-risk results and decides remediation (INTAPP-CRETE-2024)"
    - "Potential conflicts and independence issues are escalated to partners for review (INTAPP-CONFLICTS-2026)"
  role_evolution: >-
    The compliance team moves from searching and clearing to reviewing high-risk results and remediating
    (INTAPP-CRETE-2024).
  evidence_grade: B
  sources:
    - {ref: INTAPP-CRETE-2024, title: "Crete Professionals Alliance uses Intapp to drive innovation and rapid growth in the highly regulated accounting market", publisher: "Intapp", type: vendor, url: "https://www.intapp.com/news/crete-pa-intapp-conflicts/", date: "2024-10-15", access: full, locator: "Addressing conflicts clearance; Multiplying success sections (read via text mirror)"}
    - {ref: INTAPP-CONFLICTS-2026, title: "Conflicts and independence management for accounting firms", publisher: "Intapp", type: vendor, url: "https://intapp.com/accounting/conflicts", date: "2026-10-16", access: full, locator: "Opening description; 'AI-assisted review'; 'Independence tracking' (page undated; retrieval date; read via text mirror)"}
    - {ref: IFIAR-2025F, title: "IFIAR Survey of Inspection Findings 2025", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix A, Table A.3, p. A-3"}
  last_reviewed: "2026-10-16"
  notes: >-
    From practice-01. The only named, in-use AI acceptance or independence tool found in any angle. Vendor press
    release with customer quotes, dated October 2024, outside the 12-18 month window. Graded B (named deployment,
    no measurement). Intapp's claims of use at 16 of the top 20 firms (practice) and at 10+ top-25 firms
    (landscape) were seen only in snippets or blocked pages and are not used.

- id: assurance-acceptance-independence-02
  title: Risk-scored acceptance and continuance workflow with automated data pull, routing to reviewers and AI request summaries
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Acceptance and continuance decisions draw on independence, conflict, reputational and KYC information held in
    separate systems and often handled in Excel and email. Kingland's white paper says hundreds or even thousands of
    hours a year can be wasted on poorly configured workflows (KINGLAND-WP-2024).
  solution: >-
    Vendors sell configurable questionnaires, risk scoring and automated routing. Intapp Intake combines integrated
    data, risk-based questionnaires and scoring models, AI request summaries for each role, and independence
    tracking (INTAPP-INTAKE-2026). Kingland's acceptance solution pulls client data into one case, applies
    firm-set questions, thresholds and decision logic, aggregates independence, conflicts and reputational risk
    signals, embeds KYC and routes decisions to reviewers, for initial acceptance and continuance
    (KINGLAND-ACCEPT). Kingland describes its AI framework (several foundation models, version control, confidence
    scoring, human-in-the-loop oversight) in general terms, without saying which acceptance steps use AI
    (KINGLAND-ACCEPT; KINGLAND-PA-2026); its white paper describes rule-based escalation and roll-forward of
    acceptance records for continuance and does not describe AI (KINGLAND-WP-2024). A 2024 academic prototype
    combines a logistic regression on financial ratios, fuzzy weighting of reputation criteria and rule-based
    inference to output a client acceptance risk level as decision support (CEBI-2024).
  outcomes:
    - {lever: risk, description: "Vendor says the workflow aggregates independence, conflicts and reputational risk signals in one place and gives an audit trail. No customer result, time saving or error rate is published", figure: "none published", measures: "not applicable: descriptive vendor claim only", provenance: vendor-published, source_ref: KINGLAND-ACCEPT}
    - {lever: quality, description: "Research prototype: applicability illustrated by one case study; no accuracy figure in the abstract", figure: "none published", measures: "not applicable", provenance: independent, source_ref: CEBI-2024}
  prerequisites:
    - "Firm-defined questions, thresholds and decision logic (KINGLAND-ACCEPT)"
    - "Integration with the firm's existing systems so acceptance is triggered at the right time (KINGLAND-ACCEPT)"
    - "Reliable entity and relationship data (see entry 05)"
  risks_and_guardrails:
    - "Kingland frames acceptance and continuance as part of the firm's system of quality management, with independence, risk, ethics and conflicts processes orchestrated together (KINGLAND-WP-2024)"
    - "IESBA staff say a vendor may update software or change algorithms without full transparency, and that this is new information requiring the accountant to re-evaluate threats and safeguards (IESBA-NAM-2026, PDF p. 10)"
    - "IESBA lists overreliance on vendor assurances and limited transparency into vendor controls among circumstances that amplify threats where outputs are opaque (IESBA-NAM-2026, PDF p. 14)"
    - "No customer name, error rate or override rate is published for either product, so decision quality is unverified (KINGLAND-ACCEPT; INTAPP-INTAKE-2026)"
    - "The prototype reports a single illustrative case and no accuracy, override or parallel-run result (CEBI-2024); earlier archival work on one large firm found audit risk factors outweighed financial risk factors in its acceptance and continuance decisions (JB-JAR-2004)"
  human_checkpoints:
    - "Risk managers or risk teams review and approve when risk is detected in the workflow (KINGLAND-WP-2024)"
    - "Decisions route to reviewers for sign-off; higher-risk conflicts go to appropriate reviewers (KINGLAND-ACCEPT; KINGLAND-PA-2026)"
    - "In the prototype, the risk level guides the decision; the decision stays with the firm (CEBI-2024)"
  role_evolution: >-
    Intapp says partners' time is freed from routine acceptance tasks (INTAPP-INTAKE-2026); Kingland says routing
    lets a firm focus attention where risk is highest (KINGLAND-ACCEPT). No source measures either.
  evidence_grade: C
  sources:
    - {ref: INTAPP-INTAKE-2026, title: "Business acceptance and continuance solution for accounting firms", publisher: "Intapp", type: vendor, url: "https://intapp.com/accounting/client-onboarding-continuance/", date: "2026-10-16", access: full, locator: "Opening description; 'AI request summaries'; 'Independence tracking' (page undated; retrieval date; read via text mirror)"}
    - {ref: KINGLAND-ACCEPT, title: "Client & Engagement Acceptance", publisher: "Kingland", type: vendor, url: "https://www.kingland.com/client-engagement-acceptance", date: "2026-10-16", access: full, locator: "Solution description; 'AI Ecosystem' (page undated; retrieval date)"}
    - {ref: KINGLAND-WP-2024, title: "Solving for Acceptance & Continuance", publisher: "Kingland", type: vendor, url: "https://blog.kingland.com/hubfs/Whitepapers/Public%20Accounting/PA%20TL%20-%20Solving%20for%20Acceptance%20%26%20Continuance.pdf", date: "2024-12-03", access: full, locator: "Workflow Configurability; Risk Radar & Escalation; Roll-forward Continuance"}
    - {ref: KINGLAND-PA-2026, title: "Public Accounting", publisher: "Kingland", type: vendor, url: "https://www.kingland.com/public-accounting", date: "2026-10-16", access: full, locator: "Conflict Checking and AI framework sections (page undated; retrieval date)"}
    - {ref: IESBA-NAM-2026, title: "Emerging Technologies: A Characteristics-Based Approach to Ethical Considerations for Professional Accountants", publisher: "IESBA", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-07/Emerging-Technologies-Ethical-Considerations-for-Professional-Accountants.pdf", date: "2026-07-15", access: full, locator: "PDF pp. 10 and 14"}
    - {ref: CEBI-2024, title: "Development of a decision support system for client acceptance in independent audit process", publisher: "International Journal of Accounting Information Systems", type: academic, url: "https://avesis.cumhuriyet.edu.tr/yayin/cffa6431-8a21-4556-a92e-66d0ba2e1092/development-of-a-decision-support-system-for-client-acceptance-in-independent-audit-process", date: "2024-06", access: full, locator: "Abstract only (vol. 53, article 100683)"}
    - {ref: JB-JAR-2004, title: "Audit firm portfolio management decisions", publisher: "Journal of Accounting Research", type: academic, url: "https://academicnewsletter.sufe.edu.cn/info/413496", date: "2004-07-29", access: full, locator: "Abstract, via a third-party index page"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-03, governance-01 and governance-05 (an idea, grade D: the machine-learning acceptance
    scoring prototype, folded in here because it is the same change, risk-scored acceptance, and no firm uses it).
    Product descriptions only; no named customer for either product. Intapp's named customer for the related
    conflicts product is entry 01. JB-JAR-2004 is a pre-AI foundation study.

- id: assurance-acceptance-independence-03
  title: AI-powered client lifecycle platform joining KYC, client due diligence and engagement acceptance in one process
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [transaction-processing, review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Client onboarding, due diligence and engagement acceptance at a large audit and advisory firm sit in separate
    steps with manual hand-offs. The firm wants to cut onboarding time and meet regulatory requirements
    consistently (FENERGO-GT-2026; GT-FENERGO-2026).
  solution: >-
    Grant Thornton UK selected Fenergo's AI-powered client lifecycle management platform to centralise onboarding,
    due diligence and compliance, bringing KYC, client due diligence and engagement acceptance into one process
    (FENERGO-GT-2026). Neither the vendor's nor the firm's release describes which decisions the AI makes
    (GT-FENERGO-2026).
  outcomes:
    - {lever: capacity, description: "Vendor release says the new system removes thousands of hours of manual effort and lets clients start work faster", figure: "thousands of hours", measures: "manual effort removed by the new system, as stated in the vendor release; baseline, period and scope not stated", provenance: vendor-published, source_ref: FENERGO-GT-2026}
    - {lever: speed, description: "Firm says the platform will speed up the start of new engagements and cut unnecessary steps and hand-offs while keeping regulatory controls", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: GT-FENERGO-2026}
  prerequisites:
    - "Not stated in either release"
  risks_and_guardrails:
    - "The firm's release says the aim is faster onboarding 'without compromising on risk or compliance'; neither release states AI-specific controls, accuracy checks, false-positive data or review rules (GT-FENERGO-2026; FENERGO-GT-2026)"
  human_checkpoints:
    - "Not stated in either release; ask who signs off the acceptance decision and how AI scores are overridden"
  role_evolution: >-
    The vendor release says teams are freed to focus on higher-value work (FENERGO-GT-2026); the firm's COO frames
    the change as removing friction for clients and teams (GT-FENERGO-2026).
  evidence_grade: C
  sources:
    - {ref: FENERGO-GT-2026, title: "Grant Thornton UK Selects Fenergo to Streamline Client Onboarding and Drive Efficiency", publisher: "Fenergo", type: vendor, url: "https://www.fenergo.com/newsroom/grant-thornton-uk-selects-fenergo-to-streamline-client-onboarding-and-drive-efficiency", date: "2026-03-04", access: full, locator: "Paragraphs 1-3 and quoted statements"}
    - {ref: GT-FENERGO-2026, title: "Faster starts, stronger safeguards: Grant Thornton upgrades client onboarding with Fenergo", publisher: "Grant Thornton UK", type: firm, url: "https://www.grantthornton.co.uk/news-centre/fenergo---march-2026/", date: "2026-03-04", access: full, locator: "Press release, paragraphs 1-3"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from practice-02 and discourse-01. The firm is named but both releases say 'selected' or announce a
    partnership; go-live and use are not stated, so maturity is announced and the grade is C. The only named audit
    firm acceptance-tool announcement found.

- id: assurance-acceptance-independence-04
  title: AI-assisted AML onboarding at professional firms - document classification, client risk scoring and sanctions/PEP hit triage
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [transaction-processing, review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Onboarding information arrives by unstructured email and is often incomplete (ZYGOS-AISENSE-2026). Screening a
    prospective client or beneficial owner against sanctions and politically-exposed-person (PEP) lists produces
    false matches that staff clear by hand (ZYGOS-AISENSE-2026). ICAEW reviewers say some firms do more checks than
    needed, and that collecting more documents does not mitigate a higher-risk situation (ICAEW-AML-2026).
  solution: >-
    A vendor prototype entering pilot replaces email with document upload, OCR and AI document classification
    feeding a configurable client risk-scoring model mapped to EU anti-money-laundering directives and Cyprus
    rules; a language-model pipeline filters false positives from third-party screening results and presents the
    remaining hits as a plain-language assessment with a confidence score. Its pilot firms are law, accounting and
    corporate-service practices, not audit firms specifically (ZYGOS-AISENSE-2026). In the UK, the AML strategy of
    15 Sep 2026 expects digital identity and AI to play a larger part in customer due diligence and commits the FCA,
    HMRC and the Gambling Commission to encourage responsible AI use in AML compliance (UKGOV-AMLSTRAT-2026).
  outcomes:
    - {lever: quality, description: "Baseline problem measure from vendor user research, not a result of the tool", figure: "93% and 87%", measures: "Of 15 surveyed compliance professionals and managing partners: 93% still gathered onboarding information by unstructured email; 87% said clients routinely submitted incomplete information", provenance: vendor-published, source_ref: ZYGOS-AISENSE-2026}
    - {lever: capacity, description: "No accuracy, false-positive reduction or time-saving figure published; the vendor calls the false-positive filter its core innovation", figure: "none published", measures: "not applicable", provenance: vendor-published, source_ref: ZYGOS-AISENSE-2026}
  prerequisites:
    - "Clean, structured intake data before any AI screening layer; the vendor says it reshaped its architecture after the survey (ZYGOS-AISENSE-2026)"
    - "A commercial screening data provider (ZYGOS-AISENSE-2026)"
    - "In the UK, a digital identity service that meets the government's criteria for a reliable and independent source (UKGOV-AMLSTRAT-2026, para 84)"
  risks_and_guardrails:
    - "ICAEW reviewers say many electronic verification services focus on sanctions, PEPs and adverse media rather than true identity verification, so firms must understand what a system provides (ICAEW-AML-2026)"
    - "ICAEW says technology should support, not replace, professional judgement, and firms should periodically review whether software suits their client base (ICAEW-AML-2026)"
    - "ICAEW says the Money Laundering Regulations do not permit reliance on Companies House identity verification for AML purposes (ICAEW-AML-2026)"
    - "HMRC is to monitor implementation so supervised firms do not adopt disproportionate or blanket checks (UKGOV-AMLSTRAT-2026, para 71)"
    - "Prototype only, with a 15-person survey; no validation data (ZYGOS-AISENSE-2026)"
  human_checkpoints:
    - "Compliance officer decides on each screening case (ZYGOS-AISENSE-2026)"
    - "The money laundering reporting officer oversees compliance and decides on suspicious activity reports (ICAEW-AML-2026)"
  role_evolution: >-
    The vendor positions the compliance officer as reviewing pre-reasoned cases (ZYGOS-AISENSE-2026). ICAEW says AML
    works best when responsibility is embedded across the firm, and the reporting officer need not be a qualified
    accountant (ICAEW-AML-2026).
  evidence_grade: C
  sources:
    - {ref: ZYGOS-AISENSE-2026, title: "Artificial Intelligence in AML Compliance", publisher: "Zygos (Softline Computer Systems)", type: vendor, url: "https://getzygos.com/?p=49476", date: "2026-02-10", access: full, locator: "Sections on what AI-SENSE set out to do and what was delivered"}
    - {ref: UKGOV-AMLSTRAT-2026, title: "Anti-money laundering and asset recovery strategy: 2026 to 2029", publisher: "HM Treasury and Home Office (GOV.UK)", type: regulator, url: "https://www.gov.uk/government/publications/anti-money-laundering-and-asset-recovery-strategy-2026-to-2029", date: "2026-09-15", access: full, locator: "Paras 64-66, 70-72, 84-85"}
    - {ref: ICAEW-AML-2026, title: "AML latest updates and reviewer insights: key takeaways from our webinar", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/regulation/regulatory-news/regulatory-news-2026-06/aml-latest-updates-and-reviewer-insights-webinar", date: "2026-06", access: full, locator: "Companies House verification; Identity verification and ongoing monitoring; Technology and AI"}
    - {ref: TLT-AML-2026, title: "AML reform is accelerating: what firms should take from the UK's 2026-2029 strategy", publisher: "TLT LLP", type: press, url: "https://www.tlt.com/insights-and-events/insight/aml-reform-is-accelerating-what-firms-should-take-from-the-uks-2026-2029-strategy", date: "2026-09-18", access: full, locator: "Expected actions timeline"}
  last_reviewed: "2026-10-16"
  notes: >-
    Merged from discourse-02, discourse-03 and governance-06 (an idea, grade D, on regulator-encouraged digital ID
    and AI in customer due diligence). Grade C rests on the vendor pilot; the vendor serves small professional
    practices in Cyprus, not audit firms. No accountancy-firm deployment, error rate or false-positive rate was
    found. FCA good and poor practice examples on AI in AML are planned for 2026-27 (UKGOV-AMLSTRAT-2026, para 70);
    transfer of accountancy AML supervision to the FCA is expected in 2028/29 (TLT-AML-2026).

- id: assurance-acceptance-independence-05
  title: AI extraction of client ownership and subsidiary structures into family trees used for independence and conflict checks
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Independence and conflict checks depend on a complete map of a client's affiliates (its "family tree"), often
    built by hand from filings and client documents. EY UK's Global Independence System holds family-tree data
    validated by engagement teams (EY-TR-2025, p. 49). IFIAR counted 11 findings in 2025 on failing to keep a
    reliable tracking system for business relationships, financial interests and corporate family trees
    (IFIAR-2025F).
  solution: >-
    Kingland says its family-tree tool draws on internal client databases, third-party providers and public
    sources such as SEC filings, and uses AI to read client documents (PDFs or images) describing subsidiary
    relationships, extracting ownership details into a family tree that the user then completes. Its
    restricted-list tool holds entity records, ownership structures and affiliate relationships for use across
    acceptance, conflicts and service approval (KINGLAND-PA-2026).
  outcomes:
    - {lever: quality, description: "Vendor says a single source of truth for entity and affiliate records supports consistent identification of restrictions. No measured result", figure: "none published", measures: "not applicable: descriptive vendor claim only", provenance: vendor-published, source_ref: KINGLAND-PA-2026}
  prerequisites:
    - "Access to client documentation and third-party entity data (KINGLAND-PA-2026)"
    - "A firm restricted list and rules that the extracted structure feeds (KINGLAND-PA-2026)"
  risks_and_guardrails:
    - "A missed affiliate would pass through every downstream check; the vendor states no extraction accuracy figure (KINGLAND-PA-2026)"
    - "The SEC's chief accountant says problems arise when firms partner with non-audit clients that also rely on audit clients, and that how firms monitor this is top of mind (STARLING-HOHL-2026)"
  human_checkpoints:
    - "The tool walks professionals through building or updating a tree, so a person confirms the structure (KINGLAND-PA-2026)"
    - "Engagement teams validate family-tree data in EY UK's (non-AI) system (EY-TR-2025, p. 49)"
  role_evolution: >-
    Not stated in the sources. The governance analyst infers that independence staff would move from assembling
    trees to checking extracted ones.
  evidence_grade: C
  sources:
    - {ref: KINGLAND-PA-2026, title: "Public Accounting", publisher: "Kingland", type: vendor, url: "https://www.kingland.com/public-accounting", date: "2026-10-16", access: full, locator: "Client Data and Family Tree Management; Restricted List Management (page undated; retrieval date)"}
    - {ref: EY-TR-2025, title: "EY UK 2025 Transparency Report", publisher: "EY UK", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-uk/about-us/documents/ey-uk-2025-transparency-report.pdf", date: "2025-10", access: full, locator: "p. 49, independence systems"}
    - {ref: IFIAR-2025F, title: "IFIAR Survey of Inspection Findings 2025", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix A, Table A.3, p. A-3"}
    - {ref: STARLING-HOHL-2026, title: "US SEC Weighs Audit Oversight Changes", publisher: "Starling Insights (summary of a Wall Street Journal interview)", type: press, url: "https://insights.starlingtrust.com/content/observations/us-sec-weighs-audit-oversight-changes", date: "2026-01-22", access: full, locator: "Paragraphs 2-3"}
  last_reviewed: "2026-10-16"
  notes: >-
    From governance-02, with the EY UK baseline from the practice module notes. Vendor description only; no named
    customer. The Starling item summarises a Wall Street Journal interview with the SEC's chief accountant
    published the month before; the interview itself was not read.

- id: assurance-acceptance-independence-06
  title: Cross-system independence monitoring dashboards, breach management and personal-holdings checks
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Independence is checked at points in time (acceptance, annual confirmations), so emerging issues surface late.
    IFIAR's 2025 survey recorded 22 findings on failing to monitor firm and partner personal independence
    (IFIAR-2025F). The SEC's chief accountant says how firms monitor independence is top of mind
    (STARLING-HOHL-2026).
  solution: >-
    Kingland describes dashboards over a single data store joining independence, risk and engagement data to show
    trends for independence and risk leaders, a breach workflow that centralises intake, assessment, remediation
    and regulatory reporting, and a personal-independence tool that checks new holdings against the restricted
    list; it says the dashboards support advanced analytics but does not say AI drives these functions
    (KINGLAND-PA-2026). Firms already run non-AI systems: EY UK's Global Monitoring System requires staff to enter
    securities held by them and their immediate families and notifies them when a security becomes proscribed
    (EY-TR-2025, p. 49); Intapp sells brokerage-linked monitoring and pre-clearance (INTAPP-EMPCOMP-2026).
  outcomes:
    - {lever: risk, description: "Vendor says dashboards give real-time visibility of emerging issues instead of point-in-time review, and breach records are auditable. No measured result", figure: "none published", measures: "not applicable: descriptive vendor claim only", provenance: vendor-published, source_ref: KINGLAND-PA-2026}
    - {lever: speed, description: "Vendor figure for the personal-independence check; automation, not AI, as described", figure: "within 24 hours of a trade", measures: "time within which new holdings are checked against the restricted list, per the vendor page", provenance: vendor-published, source_ref: KINGLAND-PA-2026}
  prerequisites:
    - "Connected independence, risk and engagement data across the firm's business systems (KINGLAND-PA-2026)"
  risks_and_guardrails:
    - "A PCAOB inspection report says the number of firm-identified independence instances may reflect the design and effectiveness of the firm's monitoring, and cautions against comparing firms on that number (PCAOB-BOULAY-2026, Part I.C)"
    - "Intapp's employee-compliance page does not describe AI features (INTAPP-EMPCOMP-2026)"
  human_checkpoints:
    - "Independence, risk and service-line leaders act on the trends shown (KINGLAND-PA-2026)"
  role_evolution: "Not stated in the sources."
  evidence_grade: C
  sources:
