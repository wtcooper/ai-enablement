  human_checkpoints:
    - "The firm documents its evaluation and conclusion when safeguards are applied under the conceptual framework (JOFA-SOCETH-2026; JOFA-NILSEN-2025)"
    - "Independence partner conclusion, with written disclosure to the client where the firm finds something uncomfortable (ACCWEEKLY-INDEP-2026)"
  role_evolution: "Not stated in the sources."
  evidence_grade: D
  sources:
