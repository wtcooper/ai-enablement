    - "He says the SEC is in 'listening mode' on private equity and AI and is refreshing independence FAQs (TR-HOHL-2026)"
  human_checkpoints:
    - "Engagement leader communicates with the audit committee (KPMG-HOHL-2026)"
  role_evolution: "Not stated in the sources."
  evidence_grade: D
  sources:
    - {ref: KPMG-HOHL-2026, title: "Q&A with Kurt Hohl, SEC chief accountant", publisher: "KPMG Board Leadership Center (interview of an SEC official)", type: firm, url: "https://kpmg.com/us/en/board-leadership/articles/2026/qa-kurt-hohl-sec-chief-accountant.html", date: "2026-05-27", access: full, locator: "Answers on AI and auditor independence and on audit committees"}
    - {ref: TR-HOHL-2026, title: "SEC Chief Accountant Hohl Dispels Rumors of Weakening Auditor Independence Rules", publisher: "Thomson Reuters Checkpoint News", type: press, url: "https://tax.thomsonreuters.com/news/sec-chief-accountant-hohl-dispels-rumors-of-weakening-auditor-independence-rules/", date: "2026-06-05", access: full, locator: "Paragraphs 2-3"}
    - {ref: ICAS-ATI-2026, title: "Confidence in audit remains high, but stakeholder expectations are evolving (Audit Trust Index 2026)", publisher: "ICAS (summarising CPIA research)", type: survey, url: "https://icas.com/news-insights-events/news/audit-assurance/confidence-in-audit-remains-high-but-stakeholder-expectations-are-evolving/", date: "2026-10-13", access: full, locator: "Survey findings on AI"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). The KPMG page is a Q&A with a regulator hosted by a firm; it reports the
    regulator's views, not KPMG's practice. Context: the ICAS Audit Trust Index (257 UK finance leaders, audit
