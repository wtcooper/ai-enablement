    - {ref: ICAS-IESBASNAP-2026, title: "IESBA issues snapshot on the ethical implications of using technology, including AI", publisher: "ICAS", type: professional-body, url: "https://icas.com/news-insights-events/news/ethics/iesba-issues-snapshot-on-the-ethical-implications-of-using-technology-including-ai/", date: "2026-07", access: full, locator: "Page shows 'Last updated: 16 July 2026'; Section on technology-related revisions to the Code"}
    - {ref: IESBA-EEA-2026, title: "Ethics is not the constraint on AI assurance. It is the foundation (EAA Congress presentation)", publisher: "IESBA", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-06/EAA_IESBA_Presentation_final.pdf", date: "2026-05", access: full, locator: "Slide 4"}
    - {ref: ANTHROPIC-KPMG-2026, title: "KPMG integrates Claude across its core business and workforce of more than 276,000 in strategic alliance", publisher: "Anthropic", type: vendor, url: "https://www.anthropic.com/news/anthropic-kpmg", date: "2026-05-19", access: full, locator: "Section on products for PE portfolio companies"}
  last_reviewed: "2026-10-16"
  notes: >-
    Idea (D). Deloitte's pre-approval workflow is a named deployment, but the entry is graded D because no source
    shows that workflow (or any other) applied to AI services, which is the change this entry describes.
    The service offerings are real; whether any buyer is an audit client is not stated. Transparency-report
    publication dates are not printed in the documents (Deloitte UK from file metadata; KPMG Australia year only).

- id: assurance-acceptance-independence-16
  title: Independence due diligence and governance safeguards before a firm takes private-equity or other outside investment (APS structuring)
  archetype: assurance
  module: acceptance-independence
  function: risk-compliance-legal
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Private-equity (PE) investment enters the profession mainly through alternative practice structures (APS: attest
    work in a CPA-owned firm, other services in an investor-backed entity linked by an administrative services
    agreement), and the existing Code does not directly address some new structures (JOFA-NILSEN-2025). The PCAOB's acting chair said PE capital can finance investment in technology including AI
    (AT-PCAOBPE-2025), and Thomson Reuters, reporting the SEC chief accountant's remarks, notes that APS can provide
    capital for new technologies but can introduce risks, particularly to independence (TR-HOHL-2026). IFAC says new governance layers can dilute audit partners'
    control or oversight of client selection and engagement performance (IFAC-AQ-2026).
  solution: >-
    AICPA guidance describes pre-transaction due diligence with legal counsel, regulators and standard setters; an
    administrative services agreement drafted with regulation, ethics and compliance experts; quality-management
    controls such as monitoring independence; investor and employee education; and a multipronged independence
    evaluation that includes the network-firm interpretation (JOFA-NILSEN-2025). Grant Thornton UK's
    Cinven investment closed in early 2025 after regulatory approval, with the audit practice kept in its LLP and
    advisory and tax moved to a new entity (AE-PE-2026). IFAC is concerned that new governance layers can
    dilute audit partners' oversight of client selection (IFAC-AQ-2026); reserving acceptance authority to the
    audit entity is a suggested response (idea), not a described firm practice. This is a human control process,
    not AI doing the work.
  outcomes:
    - {lever: risk, description: "Context measure of structural change, not an outcome of the review step", figure: "385 transactions in 2025, 139 involving audit firms", measures: "transactions (direct investments and roll-overs) involving accountancy and audit firms identified across Europe in 2025; 139 involved audit firms", provenance: independent, source_ref: AE-PE-2026}
    - {lever: risk, description: "Context measure of PE reach into public-interest-entity (PIE) audit", figure: "46 firms owned directly; 52 further PIE audit firms rolled up into them", measures: "per IFAC, direct PE investment has produced equity ownership in 46 firms that audit PIEs, and 52 PIE audit firms were acquired or rolled up into those 46 (data as of 30 Jun 2026)", provenance: independent, source_ref: IFAC-AQ-2026}
  prerequisites:
    - "Legal counsel; engagement with regulators and standard setters; an administrative services agreement that addresses current and future resource needs (JOFA-NILSEN-2025)"
    - "Idea prompted by IFAC's governance concern (IFAC-AQ-2026): governance documents that reserve client acceptance authority to the audit entity"
  risks_and_guardrails:
    - "Where the Code does not address a structure, such as PE with significant influence but not control, apply the conceptual framework and document safeguards (JOFA-NILSEN-2025)"
    - "The AICPA exposure draft (Dec 2025; comments closed 30 Apr 2026) separates significant influence from control and widens the network-firm definition; a second exposure draft was under discussion in Aug 2026 (JOFA-PEED-2025; JOFA-PEEC-2026)"
    - "The FRC is not in principle against external private capital but says legal control requirements must be met in substance and form, and asks firms to engage early and candidly (FRC-PCLETTER-2024)"
    - "IFAC cites short-term incentives, a median PE holding period of about five years, secondary sales and capital leakage as pressures on quality management (IFAC-AQ-2026)"
    - "PCAOB officials warned that PE-driven profit pressure could reduce staffing and specialists, and that roll-ups may reduce the number of firms auditing public companies (AT-PCAOBPE-2025)"
    - "The SEC's chief accountant said some PE-backed small firms left the public-company market because it is too expensive (NYSSCPA-HOHL-2025)"
  human_checkpoints:
    - "Regulator engagement before closing: the FRC asks firms to engage early and with full candour, and Grant Thornton UK's deal closed after regulatory approval (FRC-PCLETTER-2024; AE-PE-2026)"
    - "Suggested (idea, no firm describes it): audit-entity leadership decides acceptance, with independent oversight of the administrative services agreement"
  role_evolution: >-
    Ethics and independence leaders add transaction work to their role; Accountancy Europe says firms need expert
    legal, governance and transaction support (AE-BEYONDPE-2025). Audit partners' standing in firm governance is
    IFAC's stated concern (IFAC-AQ-2026).
  evidence_grade: B
  sources:
