# Use cases: tax / controversy (audits, notices, appeals, disputes, plus tax-authority AI)
# Synthesised 2026-10-17 from research/runs/wave2/tax-controversy-{practice,discourse,governance}.md, the landscape
# scan, and items other tax deep dives routed to controversy. Every source was opened by the researchers (access:
# full) unless marked; several long reports were read only in part. Source refs are canonical keys; where the deep
# dives used different keys for one document, one key was kept (e.g. BLAW-TAXCT-2026 for the Bloomberg Law Tax Court
# article, WK-NOTICE-2026, BTAX-EYGRIP-2025, ICAS-HMRC-2025, PINSENT-HMRC-2026, GT-IE-OECD-2025).
# Entries 01-12 are practitioner and in-house side; 13-25 are tax-authority side (context for advisers).
# Practitioner-side evidence is thin: no firm or in-house team has published an error rate, override rate,
# parallel-run result or time saving for notice, examination or Appeals work. Cross-references to other tax modules
# use their synthesised ids as of 2026-10-17.

- id: tax-controversy-01
  title: AI reads and triages incoming IRS and state tax notices
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [transaction-processing]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    A notice (for example a CP2000, the IRS underreporter notice that flags a mismatch with third-party data) is
    written in technical language and carries a strict response deadline. Before anything can be drafted, someone
    must work out what changed, what the agency asks for and how to respond; that first read often takes longer
    than expected and varies from practitioner to practitioner. An Accounting Today commentator expects AI-generated
    notice volume to grow while IRS capacity to resolve notices has shrunk.
  solution: >-
    An uploaded notice is analysed to pull out the response deadline, amount due and underlying issue, and possible
    response paths (such as dispute or penalty abatement) are listed with when each may fit. Wolters Kluwer names
    CCH AnswerConnect Document Analysis and CCH Expert AI; Thomson Reuters lists IRS notices among documents
    CoCounsel Tax analyses. EY describes notice tracking and key-element extraction as early use cases. TEI's
    preliminary programme for its March 2026 Midyear Conference listed a 'Managing Tax Notices with AI' lab (title only). An Accounting Today author
    recommends a structured intake, power-of-attorney and deadline workflow without tying it to an AI tool.
  outcomes:
    - {lever: speed, description: "Vendor says summarising the notice and listing options shortens the time from receipt to action", figure: "none published", measures: "no measure given; no customer named", provenance: vendor-published, source_ref: WK-NOTICE-2026}
    - {lever: quality, description: "Vendor says every notice is evaluated with the same framework, reducing variation in response time, communication and documentation", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: WK-NOTICE-2026}
  prerequisites:
    - "Notices reach the firm quickly; Accounting Today advises filing a power of attorney right away and keeping a structured notice workflow (ACCTODAY-2026)"
    - "An approved AI tool with confidentiality protections; OPR says to use only secure, enterprise-approved AI for client data (IRS-OPR-2026)"
    - "In Australia, client permission before client information is entered into AI tools, depending on how the tool is configured and used (TPB-GS-2026)"
  risks_and_guardrails:
    - "Return information shared with an unsecured tool can engage IRC sections 6713 and 7216 and Circular 230 section 10.51(a)(15) (IRS-OPR-2026, Regulatory Framework item 6)"
    - "OPR says a practitioner must review everything the tool produces and cannot rely solely on it (IRS-OPR-2026)"
    - "A training vendor's suggested workflow says to check every number and the response deadline against the notice itself (FINDSKILL-2026)"
    - "EY's Americas Tax Innovation Leader describes most pilots as classification, summarisation and key-element extraction, that is, early-stage (EY-TAXRISK-2025)"
    - "No independent evaluation of notice-reading accuracy was found; the vendor pages are marketing"
  human_checkpoints:
    - "Practitioner checks the extracted deadline, amount and issue against the notice before acting"
    - "The reviewer chooses the course of action; the vendor page says the reviewer 'still determines' it (WK-NOTICE-2026)"
  role_evolution: >-
    Wolters Kluwer describes reviewers starting from a structured summary and a consistent baseline instead of
    reading each notice from scratch (WK-NOTICE-2026). An Accounting Today author argues the practitioner's role moves
    toward interpretation, client preparation and year-round risk advice; this is opinion, not measured
    (ACCTODAY-2026).
  evidence_grade: C
  sources:
    - {ref: WK-NOTICE-2026, title: "How to respond to IRS notices with a clear, structured workflow", publisher: "Wolters Kluwer Tax and Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/how-to-respond-to-irs-notices-with-a-clear-structured-workflow", date: "2026-07-06", access: full, locator: "sections 'Turning a notice into a clear summary', 'Clarifying response options', 'Creating a more consistent approach to notice handling'"}
    - {ref: WK-DOCAN-2026, title: "5 ways CCH AnswerConnect Document Analysis helps make tax work faster", publisher: "Wolters Kluwer Tax and Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/5-ways-cch-answerconnect-document-analysis-helps-make-tax-work-faster", date: "2026-07-06", access: full, locator: "section 'Turn IRS notices into clear action plans'"}
    - {ref: TR-COCOUNSEL-2026, title: "Meet CoCounsel Tax (on-demand demo page)", publisher: "Thomson Reuters", type: vendor, url: "https://taxprof.thomsonreuters.com/meet-cocounsel-tax-26", date: "2026", access: full, locator: "demo bullet list (page undated; year from URL)"}
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "section 'GenAI tools focused on tax controversy', Daren Campbell quote"}
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "section 'Enterprise Tax Functions', 'Tax notices' bullet"}
    - {ref: TEI-MIDYEAR-2026, title: "TEI Midyear Conference 2026 At a Glance agenda", publisher: "Tax Executives Institute", type: conference, url: "https://www.tei.org/sites/default/files/MY%202026%20At%20a%20Glance%20Agenda_rev3.2_0.pdf", date: "2026-03", access: full, locator: "preliminary program, Tuesday 17 March breakout 'TEI Tax Lab: Managing Tax Notices with AI' (title only)"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 1, 5 and 6; Best Practices"}
    - {ref: FINDSKILL-2026, title: "Tax Preparers: Turn a CP2000 Into a Client Answer in 15 Min", publisher: "FindSkill.ai", type: vendor, url: "https://findskill.ai/blog/tax-preparers-cp2000-ai-workflow/", date: "2026-08-01", access: full, locator: "'The 15-minute workflow', 'What it can't do'"}
    - {ref: ACCTODAY-2026, title: "What does an AI-driven IRS mean for small accounting firms?", publisher: "Accounting Today (AT Think opinion)", type: press, url: "https://www.accountingtoday.com/opinion/what-does-the-new-ai-driven-irs-mean-for-small-accounting-firms", date: "2026-07-02", access: full, locator: "'How small firms should respond', step 4"}
    - {ref: TPB-GS-2026, title: "TPB(GS) 55/2026 The use of Artificial Intelligence and the Code of Professional Conduct", publisher: "Tax Practitioners Board (Australia)", type: regulator, url: "https://www.tpb.gov.au/tpbgs-552026-use-artificial-intelligence-and-code-professional-conduct", date: "2026-07-22", access: full, locator: "Confidentiality section"}
  last_reviewed: "2026-10-17"
  notes: >-
    No named customer, accuracy figure or time measurement for any vendor notice tool was found. Accrual's Arc agent
    demo includes notice intake, response-letter drafting and a power-of-attorney step (ACCRUAL-ARC-2026); it is the
    only practitioner-side delegate-level signal and sits in that module (tax-compliance-individual-business-09).
    Indirect-tax notice intake: tax-indirect-tax-14. The author of ACCTODAY-2026 is operations manager at Ledger Labs,
    an outsourced accounting provider, and several of its claims could not be traced.

- id: tax-controversy-02
  title: AI drafts client explanations and formal replies to notices (CP2000 responses, penalty abatement requests)
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [document-production, client-interaction]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Once a notice is understood, the firm must explain it to the client in plain language and prepare a formal
    response, often within a short window. Both are usually drafted from scratch each time.
  solution: >-
    The tool generates a client-ready explanation and a draft agency response, such as a penalty abatement request,
    structured so client-specific facts can be added; drafts can become templates for similar notices (Wolters Kluwer,
    Thomson Reuters CoCounsel Tax). Blue J's Tax Writing lists a response to a tax authority among the drafts it
    produces. A training vendor's blog (FindSkill) shows the same pattern with a general chatbot on de-identified numbers:
    explainer, response skeleton, then manual verification. EY's survey says respondents automate or partly automate
    responses to tax authority enquiries.
  outcomes:
    - {lever: speed, description: "Vendor says drafts shorten the path from identifying the issue to resolving it and keep a consistent format", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: WK-NOTICE-2026}
    - {lever: quality, description: "Survey respondents report using GenAI to generate supporting evidence and documents in real time and to automate or partly automate responses to tax authority enquiries", figure: "none published", measures: "EY survey of 1,934 senior tax executives; the share using GenAI for these tasks is not stated in the page text read", provenance: vendor-published, source_ref: EY-TAXRISK-2025}
  prerequisites:
    - "De-identification, or an enterprise AI tool with a signed data-processing agreement (FINDSKILL-2026)"
    - "The practitioner decides the position (agree, disagree, partial agree, reasonable cause) before drafting"
  risks_and_guardrails:
    - "Models can get tax law wrong; the vendor's workflow says to use AI for structure and explanation, not citation, and to check every authority (FINDSKILL-2026)"
    - "OPR says billing for manual time not actually spent may violate Circular 230 section 10.27, depending on the facts (IRS-OPR-2026, item 2)"
    - "Circular 230 section 10.22 due diligence applies to documents sent to the IRS (IRS-OPR-2026, item 1)"
  human_checkpoints:
    - "Practitioner verifies numbers, deadline and substantiation, re-inserts identifiers locally and signs as the professional who owns the position (FINDSKILL-2026)"
  role_evolution: >-
    The reviewer "does not need to pause the workflow to write an explanation from scratch" (WK-NOTICE-2026). OPR
    says savings should be passed to clients openly and efficiency reflected in billing (IRS-OPR-2026, item 2).
  evidence_grade: C
  sources:
    - {ref: WK-NOTICE-2026, title: "How to respond to IRS notices with a clear, structured workflow", publisher: "Wolters Kluwer Tax and Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/how-to-respond-to-irs-notices-with-a-clear-structured-workflow", date: "2026-07-06", access: full, locator: "sections 'Translating technical issues into client-ready communication', 'Generating formal responses for the agency'"}
    - {ref: TR-COCOUNSEL-2026, title: "Meet CoCounsel Tax (on-demand demo page)", publisher: "Thomson Reuters", type: vendor, url: "https://taxprof.thomsonreuters.com/meet-cocounsel-tax-26", date: "2026", access: full, locator: "demo bullets: client letters and responses; reusable templates; 'IRS notice responses'"}
    - {ref: BLUEJ-WRITING-2026, title: "Tax Writing (Blue J product page)", publisher: "Blue J", type: vendor, url: "https://www.bluej.com/tax-writing", date: "2026-10-17", access: full, locator: "use-case list (page undated; access date used)"}
    - {ref: FINDSKILL-2026, title: "Tax Preparers: Turn a CP2000 Into a Client Answer in 15 Min", publisher: "FindSkill.ai", type: vendor, url: "https://findskill.ai/blog/tax-preparers-cp2000-ai-workflow/", date: "2026-08-01", access: full, locator: "'Step 0: De-identify'; 'The 15-minute workflow'; 'Minutes 13-15'"}
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "section 'How GenAI is changing tax controversy'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 1, 2 and 6"}
  last_reviewed: "2026-10-17"
  notes: >-
    General memo and client drafting, including Blue J Tax Writing, is covered in tax-research-advisory-14. The
    FindSkill article is a training-course vendor blog; its '45-minute call becomes a 5-minute email' line is an
    illustration, not a measurement.

- id: tax-controversy-03
  title: Weekly IRS transcript monitoring to act before CP2000 underreporter notices arrive
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    The IRS Automated Underreporter (AUR) flag appears on a client's account transcript before the CP2000 letter is
    sent, but few practitioners check transcripts regularly, so the client is surprised and penalties and interest
    accrue.
  solution: >-
    A practitioner obtains Form 8821 authorisations, pulls account transcripts for about 700 clients weekly with
    third-party software, and has the software highlight transcripts carrying the underreporting flag. He then
    compares the return with IRS wage and income data, amends if needed and can tell the AUR unit the error was
    self-discovered.
  outcomes:
    - {lever: risk, description: "The practitioner says knowing in advance lets him fix the return and bypass the associated penalties and interest; the notice is still sent", figure: "700 clients monitored weekly", measures: "clients whose transcripts the practitioner pulls once a week (his statement); he also cites over 6 million CP2000-type notices a year (2019, not checked)", provenance: self-reported, source_ref: ACCTODAY-2019}
  prerequisites:
    - "Form 8821 on every client with the box checked for IRS correspondence copies, and e-Services transcript access (ACCTODAY-2019)"
    - "Disclosure to the IRS that third-party software is used to pull transcripts (the practitioner's statement, ACCTODAY-2019)"
  risks_and_guardrails:
    - "The IRS does not check transcripts before the CP2000 is sent, so the letter still arrives (ACCTODAY-2019)"
    - "Client authorisations and disclosure are conditions of access (ACCTODAY-2019)"
  human_checkpoints:
    - "The professional reviews the flagged return and decides whether to amend"
  role_evolution: "The practitioner moves from reacting to a notice to acting on a data signal (ACCTODAY-2019)."
  evidence_grade: B
  sources:
    - {ref: ACCTODAY-2019, title: "Using AI to get ahead of the IRS", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/using-ai-to-get-ahead-of-the-irs", date: "2019-10-22", access: full, locator: "paragraphs 2-9 (Bill Nemeth, Atlanta practitioner)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Older than the review window; kept as the only named practitioner deployment found. The 'AI' label is the
    article's; the software checks transcripts for a flag code. The software (Tax Help) was designed by Nemeth's son,
    who made this capability a selling point, so the account is not independent. No 2025-2026 follow-up was found.

- id: tax-controversy-04
  title: Pre-filing audit-exposure review that reconciles returns to third-party data and flags audit-sensitive items
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Practitioners say IRS data matching now flags mismatches between filed returns and third-party reports (1099-K,
    1099-NEC, brokerage, K-1 and the new 1099-DA), so a technically correct return can still draw a notice if the
    numbers do not visibly reconcile. The IRS does not publish its selection criteria, and commentators argue that
    documentation which satisfied a human reviewer may not satisfy a model.
  solution: >-
    Before sign-off, AI reviews an uploaded return 'as though it were a partner-level signer' (Wolters Kluwer's
    words), lists major risk areas and a 'must-fix' list, and points to places in the return. Practitioner commentary
    recommends a reconciliation checklist and documented review trail, contemporaneous records, written business
    purpose and year-over-year consistency, and argues AI can run such checks across a client portfolio. PwC
    specialists, as reported through NYSSCPA, say examiners are weighting business purpose and contemporaneous
    documentation.
  outcomes:
    - {lever: risk, description: "No outcome published for any tool; the vendor page describes prioritised risks and 'must-fix' items for the reviewer", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: WK-DOCAN-2026}
  prerequisites:
    - "Client records and third-party forms in digital form before filing; records kept through the year"
    - "A firm workflow that makes reconciliation sign-off a condition of return completion, which TSCPA describes some firms adopting (TSCPA-2026)"
  risks_and_guardrails:
    - "TSCPA says no publicly available software replicates IRS audit selection, so any pre-filing screen is a proxy (TSCPA-2026)"
    - "The Accounting Today piece is opinion by an operations manager at an outsourced accounting firm and mixes sourced and unsourced claims; its audit-flag list is not an IRS standard (ACCTODAY-2026)"
    - "Confidentiality duties apply to client data entered into AI tools (IRS-OPR-2026; TPB-GS-2026)"
  human_checkpoints:
    - "Reviewer investigates each flagged item, decides what substantiation to request and signs the return"
  role_evolution: >-
    TSCPA describes preparers as responsible for making returns consistent with third-party data, not only
    technically correct (TSCPA-2026). Accounting Today argues small firms can reposition as year-round
    compliance-risk partners; NYSSCPA reports PwC specialists making a similar point about documentation. Neither
    measures the effect (ACCTODAY-2026; NYSSCPA-PWCWEBCAST-2026).
  evidence_grade: C
  sources:
    - {ref: WK-DOCAN-2026, title: "5 ways CCH AnswerConnect Document Analysis helps make tax work faster", publisher: "Wolters Kluwer Tax and Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/5-ways-cch-answerconnect-document-analysis-helps-make-tax-work-faster", date: "2026-07-06", access: full, locator: "section 'Review returns for red flags before sign-off'"}
    - {ref: TSCPA-2026, title: "AI at the IRS - What It Means for Practitioners", publisher: "Tennessee Society of CPAs", type: professional-body, url: "https://tscpa.com/ai-at-the-irs-what-it-means-for-practitioners/", date: "2026-05-26", access: full, locator: "section 'What This Means for Tax Preparers' and Conclusion (by two East Tennessee State University accounting faculty; dated 26 May 2026 on the page)"}
    - {ref: ACCTODAY-2026, title: "What does an AI-driven IRS mean for small accounting firms?", publisher: "Accounting Today (AT Think opinion)", type: press, url: "https://www.accountingtoday.com/opinion/what-does-the-new-ai-driven-irs-mean-for-small-accounting-firms", date: "2026-07-02", access: full, locator: "'Documentation standards have effectively increased'; steps 1-3 and 5"}
    - {ref: NYSSCPA-PWCWEBCAST-2026, title: "IRS Expands AI-Driven Enforcement While Adding New Taxpayer Relief", publisher: "NYSSCPA (summarising Reuters and a PwC webcast)", type: professional-body, url: "https://nysscpa.org/news/8725456-irs-expands-ai-driven-enforcement-while-adding-new-taxpayer-relief-2026-08-10", date: "2026-08-10", access: full, locator: "paragraphs 1-3 (date from URL slug)"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 6"}
    - {ref: TPB-GS-2026, title: "TPB(GS) 55/2026 The use of Artificial Intelligence and the Code of Professional Conduct", publisher: "Tax Practitioners Board (Australia)", type: regulator, url: "https://www.tpb.gov.au/tpbgs-552026-use-artificial-intelligence-and-code-professional-conduct", date: "2026-07-22", access: full, locator: "Confidentiality section"}
  last_reviewed: "2026-10-17"
  notes: >-
    Overlaps: tax-compliance-corporate-13, tax-compliance-individual-business-12 (including TaxGPT's return-review
    agent) and, for intercompany positions, tax-transfer-pricing-15. The authority-side analogue is ATO's lodgment
    prompts (tax-controversy-19). Unverified ACCTODAY-2026 claims (an IRM 10.24.1 description, a GAO finding on model
    validation, TIGTA workforce figures) are not used.

- id: tax-controversy-05
  title: Transfer pricing documentation checked against public data to anticipate authority challenge
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Authorities now use technology to review documentation; EY's controversy leader for international tax puts it as
    'documentation prepared today will be reviewed by the technology of tomorrow'. Inconsistencies between transfer
    pricing (TP) files and public data can invite challenge.
  solution: >-
    EY describes TP Doc Insights, a GenAI tool that finds discrepancies between existing TP documentation and publicly
    available data so teams can address areas likely to draw attention. KPMG says GenAI can help in TP controversy by
    reviewing historical documents and formulating responses.
  outcomes:
    - {lever: risk, description: "No outcome published; EY frames the tool as a move from reactive to defence-ready compliance", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: EY-TAXRISK-2025}
  prerequisites:
    - "Documentation and supporting data in a form the tool can read, and public data sources for comparison"
  risks_and_guardrails:
    - "An IRS LB&I official said AI can support but not replace legal, economic and factual judgment, expert witnesses should explain inputs, assumptions, methods and AI tools, and the IRS wants to see the formulas (IRS-LBI-TP-2026)"
    - "A PwC TP principal said the IRS still expects to see the underlying work when AI is used (TR-CHECKPOINT-2026)"
  human_checkpoints:
    - "TP professionals review flagged discrepancies; the IRS expects human judgment to remain (IRS-LBI-TP-2026)"
  role_evolution: "No role change is described in the sources."
  evidence_grade: C
  sources:
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "box 'Case study: How GenAI can make transfer pricing files consistent'"}
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph (publishDate metadata 2 Apr 2025; page metadata shows a 2026 update)"}
    - {ref: IRS-LBI-TP-2026, title: "Report on recent US international tax developments, 31 July 2026", publisher: "EY Tax News", type: firm, url: "https://taxnews.ey.com/news/2026-1658-report-on-recent-us-international-tax-developments-31-july-2026", date: "2026-07-31", access: full, locator: "paragraphs 1-2 (remarks of 29 Jul 2026)"}
    - {ref: TR-CHECKPOINT-2026, title: "AI-powered IRS audits are here but taxpayers have new relief options, tax pros say", publisher: "Thomson Reuters Checkpoint News", type: press, url: "https://tax.thomsonreuters.com/news/ai-powered-irs-audits-are-here-but-taxpayers-have-new-relief-options-tax-pros-say/", date: "2026-08-05", access: full, locator: "report on a 30 Jul 2026 PwC webcast"}
  last_reviewed: "2026-10-17"
  notes: >-
    Primarily a transfer-pricing item, kept here because it is framed as audit defence; documentation review against
    country requirements is tax-transfer-pricing-08 (see also -14), and TP audit defence drafting is
    tax-transfer-pricing-16. EY's survey also says 49% of respondents expect to tailor TP documentation to individual
    tax authorities; that is an expectation, not a deployment.

- id: tax-controversy-06
  title: In-house tax teams summarise legislation and dispute files and check consistency of data shared with authorities
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Controversy teams hold large volumes of internal opinions, memos and meeting minutes, must track proposed
    legislation, and need data given to different authorities to be consistent.
  solution: >-
    EY's survey says respondents use or expect to use GenAI for three purposes: analysing and summarising external tax
    information (especially new and proposed legislation), analysing and summarising internal tax information
    (opinions, memos, minutes), and making data shared with tax authorities more consistent.
  outcomes:
    - {lever: capacity, description: "Adoption of controversy-focused GenAI by respondents", figure: "39% built at least one tax risk or controversy-focused pilot or tool; 30% more have begun integrating GenAI into other key processes", measures: "share of 1,934 senior tax executives surveyed (12 industries, 48 jurisdictions), per the EY page", provenance: vendor-published, source_ref: EY-TAXRISK-2025}
    - {lever: experience, description: "Satisfaction with controversy management is higher among GenAI users; a correlation in a self-selected sample", figure: "46% very satisfied vs 31%", measures: "share very satisfied with their controversy management approach, among those integrating GenAI in tax controversy vs those not (EY page)", provenance: vendor-published, source_ref: EY-TAXRISK-2025}
  prerequisites:
    - "Data management; EY says GenAI is 'only showcasing' that collecting, cleansing, reporting and analysing data is key (EY-TAXRISK-2025)"
    - "Talent; securing people who can work with the technology is the top barrier, cited by 44% (EY-TAXRISK-2025)"
  risks_and_guardrails:
    - "EY says GenAI 'does not replace governance, it raises expectations of it': accountability, documented decision trails and control frameworks (EY-PAPERJAM-2026)"
    - "The survey is by a firm that sells controversy services, and answers are self-reported"
  human_checkpoints:
    - "EY says agentic outputs 'should be reviewed by humans' (EY-TAXRISK-2025)"
  role_evolution: "EY names talent as the leading barrier; no role redesign is described (EY-TAXRISK-2025)."
  evidence_grade: C
  sources:
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "sections 'How GenAI is changing tax controversy', 'GenAI tools focused on tax controversy'"}
    - {ref: EY-TAXRISKPR-2025, title: "EY 2025 Tax Risk and Controversy Survey: Tax leaders turn to AI to strengthen tax management as new risks loom", publisher: "EY Global newsroom", type: firm, url: "https://www.ey.com/en_gl/newsroom/2025/12/ey-2025-tax-risk-and-controversy-survey-tax-leaders-turn-to-ai-to-strengthen-tax-management-as-new-risks-loom", date: "2025-12-11", access: full, locator: "opening bullets"}
    - {ref: EY-TAXNEWS-2025, title: "Why AI is poised to make managing tax risk and controversy easier", publisher: "EY Tax News Update", type: firm, url: "https://taxnews.ey.com/news/2025-2478-why-ai-is-poised-to-make-managing-tax-risk-and-controversy-easier", date: "2025-12-11", access: full, locator: "paragraph 1"}
    - {ref: EY-PAPERJAM-2026, title: "Tax controversy in a GenAI world", publisher: "Paperjam (EY Luxembourg, promotional)", type: firm, url: "https://en.paperjam.lu/article/tax-controversy-in-a-genai-world", date: "2026-03-06", access: full, locator: "sections 'Key figures', 'A new approach to tax governance'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The press release says 70% have implemented or are integrating at least one GenAI tool for controversy management;
    the survey page splits 'nearly seven in 10' into 39% plus 30%, where the 30% is 'other key processes'. Use the
    split. The survey PDF was not opened.

- id: tax-controversy-07
  title: Agents draft responses to audit queries and track information document requests during an examination
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [document-production, coordination-scheduling]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    During an examination the taxpayer must answer a stream of information document requests (IDRs, the examiner's
    formal requests for records) under deadlines, often drawing on the same facts and files used for compliance.
    A speaker at TEI's 2026 Tax Technology Seminar said authorities in jurisdictions with mature
    continuous-transaction-control (e-invoicing) regimes arrive at audits with transaction data they have already analysed.
  solution: >-
    EY authors say tax agents can 'draft responses to audit queries' alongside monitoring rule changes and routing
    exceptions; EY's survey says respondents automate or partly automate responses to tax authority enquiries. A
    Miller & Chevalier CLE (25 Jun 2025) was billed to cover private use of AI in tax controversy with product
    demonstrations; no detail was published. EY India announced an AI Tax Hub with agents for research, compliance and litigation (18 Feb
    2026), without controversy detail.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: BTAX-EYGRIP-2025}
  prerequisites:
    - "Integration, data lineage traceability and human judgment; the EY authors say sophistication raises the bar on all three (BTAX-EYGRIP-2025)"
  risks_and_guardrails:
    - "Circular 230 due diligence and the court and OPR rules on verified submissions apply to anything sent to the IRS (IRS-OPR-2026; see tax-controversy-08)"
    - "Privilege for AI-assisted work in tax controversy is untested (see tax-controversy-09)"
  human_checkpoints:
    - "EY authors: 'AI should be used to improve the human's review, not to remove the need for the review' (BTAX-EYGRIP-2025)"
  role_evolution: "EY authors say tax departments shift from assembling information to applying judgment and conducting high-quality reviews (BTAX-EYGRIP-2025)."
  evidence_grade: C
  sources:
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "paragraph 5; sections 'People, Skills, Culture' and 'Questions for 2026'"}
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "section 'How GenAI is changing tax controversy'"}
    - {ref: MILLER-CLE-2025, title: "Leveraging AI, Big Data, IRS Online Services & Emerging Technology for Tax Controversy Professionals", publisher: "Miller & Chevalier", type: conference, url: "https://www.millerchevalier.com/event/leveraging-ai-big-data-irs-online-services-emerging-technology-tax-controversy-professionals", date: "2025-06-25", access: full, locator: "event description"}
    - {ref: TR-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "section 'End of the traditional model'"}
    - {ref: EY-INDIA-2026, title: "EY India strengthens tax technology leadership with the launch of AI-enabled enterprise tax solutions", publisher: "EY India", type: firm, url: "https://www.ey.com/en_in/newsroom/2026/02/ey-india-strengthens-tax-technology-leadership-with-the-launch-of-ai-enabled-enterprise-tax-solutions", date: "2026-02-18", access: full, locator: "AI Tax Hub announcement"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 1"}
  last_reviewed: "2026-10-17"
  notes: >-
    An IDR-tracking agent page (Cassidy) and a vendor case study claiming 28% fewer audit adjustments (CleverX)
    appeared only in search results and could not be opened; neither is used.

- id: tax-controversy-08
  title: AI-assisted research and drafting for Tax Court, tribunal and IRS submissions, with citation verification as the control
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [research-synthesis, document-production, review-assurance]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Counsel and self-represented (pro se) taxpayers under time and cost pressure use general models to find
    authorities and draft protests, briefs and motions, and models can invent plausible citations. In Clinco v.
    Commissioner (T.C. Memo. 2026-16) three of four cases cited for a 'wet signature' argument were apparently
    model-generated, and counsel repeated one after the IRS flagged it. In Khoja v. Commissioner a judge questioned an
    IRS attorney about a non-existent case in an IRS motion. UK tribunals have seen the same: in Harber nine cited
    decisions did not exist, and in Zzaman real cases were cited that did not support the argument.
  solution: >-
    Use is documented mainly through failures. The Journal of Accountancy article and OPR recommend written firm AI
    policies, treating AI text as a draft, human verification of every citation and calculation, citation-verification
    logs or a second reviewer for briefs, and documentation of the check. The Tax Court is weighing guardrails through
    its rules and disciplinary committees; Judge Holmes doubts a certification that AI was not used would make sense
    because legitimate uses exist.
  outcomes:
    - {lever: risk, description: "Hallucinated authorities seen by one Tax Court judge", figure: "fewer than a dozen instances; no sanctions by him as of 20 Mar 2026", measures: "Judge Holmes's recollection in an interview; a count, not a rate", provenance: independent, source_ref: BLAW-TAXCT-2026}
    - {lever: quality, description: "Authorities cited by counsel on one issue in Clinco that the court found apparently hallucinated", figure: "3 of 4", measures: "cases cited for the wet-signature argument that the court described as likely generated by a large language model (JofA summary)", provenance: independent, source_ref: TAXCT-CLINCO-2026}
    - {lever: risk, description: "Scale of hallucination decisions across courts and tribunals", figure: "about 2,200 decisions worldwide; 25 tagged tax as primary field", measures: "decisions listed in a public database of court and tribunal rulings on AI hallucinations, counted from the database", provenance: independent, source_ref: CHARLOTIN-DB-2026}
  prerequisites:
    - "Written firm AI policy with permitted tools, training, vendor vetting and documented verification (IRS-OPR-2026; TAXCT-CLINCO-2026)"
    - "Access to authoritative research databases to check citations against"
  risks_and_guardrails:
    - "Circular 230 sections 10.22, 10.35, 10.36 and 10.37 and AICPA SSTS section 1.4 (reliance on tools) keep responsibility for accuracy with the practitioner (IRS-OPR-2026; TAXCT-CLINCO-2026)"
    - "The Tax Court has no Rule 11 equivalent, but lawyers are bound by the ABA Model Rules under Tax Court Rule 201(a), and IRC section 6673 allows penalties up to $25,000 for frivolous or groundless positions (TAXCT-CLINCO-2026; BLAW-TAXCT-2026)"
    - "An existence check is not enough: in Zzaman the cited cases were real but did not support the proposition (ICAS-TAXTRIB-2026)"
    - "In Elden v HMRC the UK tribunal said the person who relies on AI bears responsibility for accuracy, and criticised a regulated accountancy firm's unverified skeleton argument (ICAS-TAXTRIB-2026)"
    - "The authority side is not immune: Khoja (IRS motion) (BLAW-TAXCT-2026); IRS counsel withdrew an IRS valuation expert's reports in Riddle Aggregates at trial after the taxpayer challenged hallucinated quotations (RIDDLE-TRANSCRIPT-2026; CHARLOTIN-DB-2026); an Indian Income Tax Appellate Tribunal order that the Karnataka High Court said prima facie appeared AI-driven was recalled by the tribunal (ITATONLINE-BUCKEYE-2025)"
    - "Over three-quarters of Tax Court cases are pro se, and court records hold Social Security and bank-account numbers that must not leak (BLAW-TAXCT-2026)"
  human_checkpoints:
    - "The signing practitioner independently verifies facts, authorities, citations and calculations before filing (IRS-OPR-2026)"
    - "Second reviewer or citation log for briefs (TAXCT-CLINCO-2026)"
  role_evolution: >-
    Responsibility stays with the practitioner; firms add supervisory review, citation logs and documentation
    (TAXCT-CLINCO-2026). A former DOJ Tax Division official expects the court to let pro se filers remake their
    arguments before sanctioning, and says AI misuse may add work for clerks (BLAW-TAXCT-2026). Chief Judge Urda says
    the judges are working through the topic and internal training continues (NTT-URDA-2026).
  evidence_grade: C
  sources:
    - {ref: TAXCT-CLINCO-2026, title: "A recipe for sanctions: AI-hallucinated citations in tax", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/", date: "2026-09-01", access: full, locator: "sections 'The apparitions in the briefing', 'A recipe for sanctions', 'Practical risk management', firm-policy sidebar"}
    - {ref: BLAW-TAXCT-2026, title: "Tax Court Navigates AI Misuse Rules for Self-Represented Filers", publisher: "Bloomberg Law (Daily Tax Report)", type: press, url: "https://news.bloomberglaw.com/daily-tax-report/tax-court-navigates-ai-misuse-rules-for-self-represented-filers", date: "2026-03-20", access: full, locator: "paragraphs 1-12; sections 'Arrow in Quiver', 'Feeling Our Way', 'Protecting Taxpayers'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "'Real-World Consequences of Improper AI Use'; Regulatory Framework items 1-5; Best Practices"}
    - {ref: MC-JORDAN-2026, title: "Katherine Jordan Quoted on Emerging AI Issues in U.S. Tax Court Filings in Tax Notes", publisher: "Miller & Chevalier", type: firm, url: "https://www.millerchevalier.com/publication/katherine-jordan-quoted-emerging-ai-issues-us-tax-court-filings-tax-notes", date: "2026-03-23", access: full, locator: "summary paragraph"}
    - {ref: NTT-URDA-2026, title: "Tax Court Chief Judge Talks AI and Transparency", publisher: "Tax Notes Talk (Tax Analysts)", type: podcast, url: "https://taxnotestalk.taxnotes.com/124942/episodes/18795544-tax-court-chief-judge-talks-ai-and-transparency", date: "2026-03-06", access: full, locator: "transcript, closing exchange"}
    - {ref: ICAS-TAXTRIB-2026, title: "AI at the tax tribunal", publisher: "ICAS", type: professional-body, url: "https://www.icas.com/news-insights-events/news/tax/ai-at-the-tax-tribunal/", date: "2026-01-26", access: full, locator: "Harber, Zzaman and Elden summaries"}
    - {ref: CHARLOTIN-DB-2026, title: "AI Hallucination Cases Database", publisher: "Damien Charlotin", type: academic, url: "https://www.damiencharlotin.com/hallucinations/", date: "2026-10-16", access: full, locator: "database counts and Riddle Aggregates outcome field"}
    - {ref: RIDDLE-TRANSCRIPT-2026, title: "Riddle Aggregates v. Commissioner, trial transcript vol. 3 (Docket 31104-21)", publisher: "US Tax Court (via Charlotin database)", type: regulator, url: "https://www.damiencharlotin.com/documents/1972/Riddle_Aggregates.pdf", date: "2026-03-18", access: full, locator: "pp. 604-618 (challenge pp. 606-608; withdrawal of Exhibits 9006-R and 9007-R p. 618)"}
    - {ref: ITATONLINE-BUCKEYE-2025, title: "Buckeye Trust v. Registrar, ITAT (Karnataka High Court) digest", publisher: "itatonline.org", type: press, url: "https://itatonline.org/digest/verdicts/buckeye-trust-v-registrar-itat/", date: "2025-10-29", access: full, locator: "digest summary and linked Karnataka High Court order in WP 25280/2025 dated 18 Sep 2025 (digest uploaded 29 Oct 2025)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: use is shown by incidents, not by a named firm's managed deployment, and no source reports verification
    error rates. JofA says Clinco appears to be the first Tax Court case on potential hallucinations; the
    determinations rested on a bank-deposit analysis, not the citation failure. Citation-resolution tooling and AI-use
    records sit in tax-research-advisory-19 and -20, screening of incoming AI-generated material in
    tax-research-advisory-18, and AI in TP expert reports in tax-transfer-pricing-17.

- id: tax-controversy-09
  title: "Idea: counsel-directed, enterprise-tool AI analysis to preserve privilege in controversy matters"
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [expert-judgment, research-synthesis]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    In United States v. Heppner (S.D.N.Y., 17 Feb 2026) the court held that AI-generated reports a defendant made with
    a consumer tool, without counsel's direction, were neither privileged nor work product, even though later given
    to counsel. Controversy clients are likely to use consumer AI on their own matters.
  solution: >-
    Law-firm guidance advises treating public AI tools as third parties by default, using enterprise tools with limits
    on training, disclosure and retention for sensitive matters, having counsel direct AI work and documenting that
    direction, and logging AI outputs. Miller & Chevalier's Sheri Dillon names AI ethics, privilege and
    confidentiality as a top 2026 challenge for tax practitioners and says they should educate clients.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: MOFO-HEPPNER-2026}
  prerequisites:
    - "Enterprise AI tools with contractual limits on training use, disclosure, retention and access (MOFO-HEPPNER-2026)"
    - "Engagement-letter and client-instruction practice covering consumer AI use"
  risks_and_guardrails:
    - "Heppner was a criminal case, not a tax case, and turned on a consumer tool used without counsel's direction (MOFO-HEPPNER-2026)"
    - "Privilege for AI-assisted work in tax controversy has not been tested in the sources found"
  human_checkpoints:
    - "Counsel decides what is run through AI and directs it"
  role_evolution: "Dillon says practitioners must independently confirm any AI results and educate clients about appropriate AI use (BLOOMBERG-DILLON-2026)."
  evidence_grade: D
  sources:
    - {ref: MOFO-HEPPNER-2026, title: "Privilege in the Age of AI: SDNY Holds AI-Generated Documents Are Not Privileged", publisher: "Morrison Foerster", type: firm, url: "https://www.mofo.com/resources/insights/260220-privilege-in-the-age-of-ai-sdny-holds", date: "2026-02-20", access: full, locator: "Practical Steps; Background; Key Holdings"}
    - {ref: BLOOMBERG-DILLON-2026, title: "Five Questions With Miller & Chevalier Tax Attorney Sheri Dillon", publisher: "Bloomberg Tax Daily Tax Report", type: press, url: "https://news.bloombergtax.com/daily-tax-report/five-questions-with-miller-chevalier-tax-attorney-sheri-dillon", date: "2026-10-09", access: full, locator: "answer on the top challenge for 2026"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. No firm is reported to have adopted a counsel-directed AI protocol for tax controversy.

- id: tax-controversy-10
  title: "Idea: value-based pricing for AI-accelerated controversy work, set against OPR's fee guidance"
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    AI shortens research and drafting time. OPR says billing for manual time not actually spent, or double billing for
    AI-assisted tasks, may violate Circular 230 section 10.27 (unconscionable fees), depending on the facts, and that
    savings should be passed on and AI use disclosed in general or specific terms.
  solution: >-
    The AICPA has asked the IRS for clarification, saying OPR's language does not appear to allow a value-pricing
    model and overlooks the cost and risk of implementing the technology. No firm is named as having changed its fee
    basis for controversy work.
  outcomes:
    - {lever: growth, description: "none published", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: AICPA-CART-2026}
  prerequisites:
    - "Engagement-letter language on AI use and fee basis"
  risks_and_guardrails:
    - "OPR says fee risk depends on facts such as a pattern across clients and the size of billing differentials (IRS-OPR-2026; ACCTODAY-OPR-2026)"
  human_checkpoints:
    - "Practitioner decides fee basis and disclosure"
  role_evolution: "Not evidenced for this module; pyramid and pricing shifts are discussed in the archetype-level workforce and economics files."
  evidence_grade: D
  sources:
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 2 (10.27(a) Fees)"}
    - {ref: AICPA-CART-2026, title: "AICPA, former IRS commissioner to lead initiative on AI in tax", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-former-irs-commissioner-to-lead-initiative-on-ai-in-tax/", date: "2026-09-23", access: full, locator: "paragraph on OPR guidelines and value pricing"}
    - {ref: ACCTODAY-OPR-2026, title: "IRS rolls out AI guidelines for tax pros", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/irs-rolls-out-introductory-ai-guidelines-for-tax-practitioners", date: "2026-06-24", access: full, locator: "paragraphs on 10.27(a)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. A live dispute, not a deployed model. Kept because it is the only model-scope evidence on the practitioner
    side. Same debate for compliance work: tax-compliance-corporate-16, tax-compliance-individual-business-22.

- id: tax-controversy-11
  title: "Idea: risk-register due diligence before deploying AI in tax administration or practice (Werfel framework)"
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Tax practitioners and administrators say they do not know which questions to ask to assess readiness for AI or to
    vet AI vendors, and the Tax Court, the IRS and professional bodies have each issued separate, narrower guidance.
  solution: >-
    Danny Werfel's framework, published through the AICPA, gives a 20-risk register for tax authorities and a 15-risk
    register for preparers, a three-tier priority scheme, an eight-step methodology (frame, screen, score, tier,
    controls, vendor questions, phased rollout, monitoring) and sample vendor contract terms. It was presented at Duke
    on 26 Mar 2026 and published on 31 Aug 2026. The AICPA launched the Council on AI Risk in Tax (CART) on 23 Sep
    2026 to test and refine it, with participants including the National Association of Enrolled Agents and the
    Federation of Tax Administrators.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "no use of the register by a named organisation was found", provenance: self-reported, source_ref: AICPA-WERFELART-2026}
  prerequisites:
    - "Inventory of AI use cases and a named owner for AI governance; the register flags a missing enterprise governance function as a risk (AICPA-WERFEL-2026)"
  risks_and_guardrails:
    - "The author states the views are his and not official AICPA policy; the framework is a starting point, not a standard (AICPA-WERFELART-2026)"
    - "Transparency can lower explainability risk while raising adversarial-manipulation risk (AICPA-WERFELART-2026)"
  human_checkpoints:
    - "Tier 1 risks must be addressed before a deployment launches; mandatory human approval for irreversible, financial or rights-affecting agent actions is an illustrative control (AICPA-WERFELART-2026; AICPA-WERFEL-2026, risk 14)"
  role_evolution: "The framework lists skill erosion (preparers) and workforce expertise erosion (authorities) as risks (AICPA-WERFELART-2026)."
  evidence_grade: D
  sources:
    - {ref: AICPA-WERFELART-2026, title: "A risk framework for AI use in tax administration and preparation", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "sections 'Risk registers for the use of AI in tax' to 'Innovate, but responsibly'"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices", publisher: "AICPA (Danny Werfel)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendices A (authorities), B (methodology) and C (preparers)"}
    - {ref: AICPA-CART-2026, title: "AICPA, former IRS commissioner to lead initiative on AI in tax", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-former-irs-commissioner-to-lead-initiative-on-ai-in-tax/", date: "2026-09-23", access: full, locator: "paragraphs 1-6"}
    - {ref: DUKE-WERFEL-2026, title: "Werfel Presents Risk Framework for the Use of Artificial Intelligence in Tax Administration and Practice Today at Duke", publisher: "TaxProf Blog", type: conference, url: "https://taxprofblog.aals.org/2026/03/26/werfel-presents-risk-framework-for-the-use-of-artificial-intelligence-in-tax-administration-and-practice-today-at-duke/", date: "2026-03-26", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. A published framework with no named adopter; the AICPA items are published by the body that backs it.
    Appendix PDF date from its upload path. Cross-cutting: applies to every tax module.

- id: tax-controversy-12
  title: "Idea: preventive controls and real-time data exchange with authorities in place of after-the-fact audit defence"
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: model
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Deloitte's scenario framework says that as authorities move to real-time, data-driven models ('Tax Administration
    3.0'), more frequent granular data requests and anomaly detection can lead to more audits, and detective controls
    and reactive issue management 'would become unsustainable'.
  solution: >-
    Deloitte says companies would need upstream data quality and preventive controls embedded in business processes,
    and links the scenario to authority AI progress. EY says the days of defending old positions in audits are giving
    way to real-time interactions, which may reduce flash points. OECD Forum on Tax Administration commissioners
    agreed in November 2025 to move to pilots of real-time automated sharing of secure information. Both firm pieces
    are discussion, not reported deployments.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "no measure given", provenance: vendor-published, source_ref: DELOITTE-TTT-2026}
  prerequisites:
    - "Upstream data quality, integration between tax, finance and operations, and AI validation capability (DELOITTE-TTT-2026, scenarios 3 and 4)"
  risks_and_guardrails:
    - "A scenario framework, not a forecast; explainability and audit trails are listed as requirements (DELOITTE-TTT-2026)"
  human_checkpoints:
    - "Deloitte says human judgment remains instrumental and experts validate AI outputs (DELOITTE-TTT-2026)"
  role_evolution: >-
    Deloitte's scenarios move talent toward data analytics, technology integration and project management (scenario
    3), and tax professionals from preparation to oversight, interpretation, policy interaction and dispute resolution
    (scenario 4) (DELOITTE-TTT-2026).
  evidence_grade: D
  sources:
    - {ref: DELOITTE-TTT-2026, title: "Riding the wave: A framework to plan for AI (Tax Transformation Trends, AI report part three)", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2026/dttl-deloitte-tax-transformation-trends-ai-report-2025-part-three.pdf", date: "2026-07", access: full, locator: "pp. 6-7, scenarios 3 and 4"}
    - {ref: EY-TAXRISK-2025, title: "2025 EY Tax Risk and Controversy survey", publisher: "EY", type: survey, url: "https://www.ey.com/en_gl/insights/tax/tax-risk-and-controversy-survey", date: "2025-12-11", access: full, locator: "introduction, paragraph on real-time interactions"}
    - {ref: OECD-FTA-2025, title: "Heads of tax administrations agree further work on collaborative projects to reduce compliance burdens and deepen co-operation in tackling tax gaps (FTA 18th Plenary)", publisher: "OECD Forum on Tax Administration", type: regulator, url: "https://www.oecd.org/en/about/news/announcements/2025/11/heads-of-tax-administrations-agree-further-work-on-collaborative-projects-to-reduce-compliance-burdens-and-deepen-co-operation-in-tackling-tax-gaps.html", date: "2025-11", access: full, locator: "announcement text (opened via a text mirror; blocked by a bot check on 2026-10-17, and the commitment was re-confirmed in the FTA Cape Town Plenary statement of outcomes, published at nta.go.jp/taxes/shiraberu/kokusai/fta/press/pdf/20251125_final.pdf)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Discussed by firms and authorities; no deployment found.

- id: tax-controversy-13
  title: IRS machine-learning selection of returns and issues for examination
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    The IRS must choose which returns and issues to examine with too few examiners. Selection under the older
    Discriminant Index Function (DIF) scoring produced a high share of examinations closing with no change (the
    no-change rate), especially for partnerships and corporations, burdening compliant taxpayers and wasting examiner
    time. For a representative, the first contact is a model-driven selection whose reasons are not disclosed.
  solution: >-
    The IRS integrated statistical and machine-learning techniques into return and issue selection, trained on current
    return data rather than historical exam results. LB&I has a Line Anomaly Recommender (mid-size corporate returns)
    and a Large Partnership Compliance model; SB/SE has a Form 1040 classification model that recommends the top three
    issues per return, and a Form 1040 selection model that was still in pilot. IRM 10.24.1 treats AI that informs or
    influences whether a taxpayer is audited as presumed high-impact, which triggers minimum practices including human
    oversight and consistent remedies or appeals. A speaker at a TP webinar said the IRS uses algorithms to find
    companies with unreasonable losses or very low margins.
  outcomes:
    - {lever: quality, description: "Form 1040 selection-model pilot: higher dollar assessment per exam hour but also higher no-change rates; no deployment decision. TIGTA found the IRS does not have sufficient processes to evaluate whether AI models perform better than prior processes, and LB&I had no exam-result data for the LAR and LPC models", figure: "not published (redacted)", measures: "pilot comparison of assessment per examination hour and no-change rate, described qualitatively by TIGTA", provenance: independent, source_ref: TIGTA-2025}
    - {lever: quality, description: "No-change rate for audited filers under $50,000 fell sharply while their no-response rate rose; TAS says greater AI use 'may reduce' the no-change rate but does not attribute this fall to AI, and warns it may reflect selecting taxpayers unlikely to respond", figure: "FY2025 almost half the FY2024 rate; no-response up more than 10 percentage points", measures: "IRS audit no-change rate and no-response rate for taxpayers with under $50,000 total positive income, FY2024 to FY2025 (TAS)", provenance: independent, source_ref: NTA-AR-2025}
    - {lever: cost, description: "Contract spend on selection models", figure: "$3.9 million (LAR, Sep 2018 to Sep 2021); $7.9 million (Form 1040 classification, Jul 2019 to Sep 2024)", measures: "amounts on two contracts each to develop and manage the models (TIGTA)", provenance: independent, source_ref: TIGTA-2025}
  prerequisites:
    - "Exam results fed back into model training and a measurement plan for drift; TIGTA recommended both and the IRS agreed, two recommendations subject to staffing and Treasury AI guidance (TIGTA-2025)"
    - "Skills; GAO found staff cuts left too few skilled employees and no AI workforce plan (GAO-2026)"
    - "AI governance under IRM 10.24.1: impact assessment, pre-deployment testing and monitoring for high-impact uses (IRM-10-24-1)"
  risks_and_guardrails:
    - "GAO: 126 active IRS AI use cases at June 2025 (10 in Aug 2022), 65 withheld as sensitive or exempt R&D, 61% in development, over 25% without benefit information, and no entity managing AI investment agency-wide (GAO-2026)"
    - "GAO says the IRS may lack audit-outcome data to retrain models if fewer audits follow staff reductions (GAO-2026)"
    - "Research with IRS data (2010-14 audits) found flexible ML selection shifts audit burden from high- to middle-income taxpayers, and fairness corrections cost performance (STANFORD-AUDIT-2022)"
    - "GAO (2024) found the Dependent Database had risk scores that varied by sex, had not been updated since 2001 and had not been reviewed for demographic equity (FEDSCOOP-GAOBIAS-2024)"
    - "GAO notes the no-change rate counts default audits (taxpayer non-response) as changes (GAO-EQUITY-2024)"
    - "Selection criteria are not published. GAO (2024) found the IRS had not documented key components of an AI pilot for sampling National Research Program audits; GAO has since recorded most of those documentation recommendations as implemented, with one partly addressed (GAO-TAXGAP-2024)"
  human_checkpoints:
    - "Human classifiers review Line Anomaly Recommender output before returns go to the field (TIGTA-2025)"
    - "Examiner and manager can add or remove the issues the Form 1040 classification model suggests (TIGTA-2025)"
  role_evolution: >-
    Examiners and classifiers shift from choosing cases by scoring formulas to reviewing and overriding model-suggested
    returns and issues (TIGTA-2025). TAS says the IRS needs staff who can train AI in ways that protect taxpayer rights
    (NTA-AR-2025). No source publishes a human-override rate.
  evidence_grade: B
  sources:
    - {ref: TIGTA-2025, title: "The IRS Could Leverage Examination Results in Artificial Intelligence Examination Case Selection Models and Improve Processes to Evaluate Performance (2025-308-022)", publisher: "Treasury Inspector General for Tax Administration", type: regulator, url: "https://www.tigta.gov/sites/default/files/reports/2025-08/2025308022fr.pdf", date: "2025-05-19", access: full, locator: "Highlights; pp. 3, 5-8, 13-14"}
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "Highlights; p. 26"}
    - {ref: NTA-AR-2025, title: "National Taxpayer Advocate 2025 Annual Report to Congress", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/01/ARC_Publication-2104_2025_Web.pdf", date: "2026-01", access: full, locator: "Preface, 'Taxpayer Service: Examination and Collection' (pdf p. 27)"}
    - {ref: IRM-10-24-1, title: "IRM 10.24.1 IRS Policy for Artificial Intelligence (AI) Governance", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/irm/part10/irm_10-024-001r", date: "2026-08-10", access: full, locator: "10.24.1.4.2 (presumed high-impact uses, audit selection); 10.24.1.4.3; current revision of 10 Aug 2026 supersedes the first issue of 10 Feb 2026"}
    - {ref: STANFORD-AUDIT-2022, title: "Algorithmic Fairness and Vertical Equity: Income Fairness with IRS Tax Audit Models", publisher: "Stanford Law School / FAccT 2022", type: academic, url: "https://law.stanford.edu/publications/algorithmic-fairness-and-vertical-equity-income-fairness-with-irs-tax-audit-models", date: "2022-06-20", access: full, locator: "abstract"}
    - {ref: FEDSCOOP-GAOBIAS-2024, title: "IRS's AI system to flag returns for audit may include unintended bias, report finds", publisher: "FedScoop", type: press, url: "https://fedscoop.com/irs-ai-systems-bias-audits-racial-disparities-gao-report/", date: "2024-05-23", access: full, locator: "paragraphs 1-6"}
    - {ref: GAO-EQUITY-2024, title: "Tax Enforcement: IRS Audit Selection Processes for Returns Claiming Refundable Credits Could Better Address Equity (GAO-24-106126)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-24-106126", date: "2024-04", access: full, locator: "Fast Facts; What GAO Found"}
    - {ref: GAO-TAXGAP-2024, title: "Tax Gap: IRS Should Take Steps to Ensure Continued Improvement in Estimates (GAO-24-106449)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-24-106449", date: "2024-05", access: full, locator: "Fast Facts; What GAO Found"}
    - {ref: TR-CHECKPOINT-2025, title: "Transfer Pricing Expert: 'Prepare Now' for Best Chance to Avoid Scrutiny", publisher: "Thomson Reuters Checkpoint News", type: press, url: "https://tax.thomsonreuters.com/news/transfer-pricing-expert-prepare-now-for-best-chance-to-avoid-scrutiny/", date: "2025-10-15", access: full, locator: "report on an Exactera webinar of 12 Sep 2025"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded B: TIGTA's figures are redacted and the NTA figures are not attributed to AI, so no measured AI outcome is
    published. TIGTA's report predates the 2025 staff cuts. Accounting Today's claim that pilots show the models
    'outperform' prior methods is not supported by TIGTA and is not used; EisnerAmper's statement that AI is in the
    DIF system is not supported by TIGTA either. The IRM URL opens in the form given; a variant URL returns 404.

- id: tax-controversy-14
  title: "Idea: outcome feedback, drift monitoring and disparity testing for AI audit-selection models"
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Selection models trained on current return data are not routinely tuned on exam results, and the IRS cannot
    readily show whether they beat earlier methods. Race-blind selection can still produce disparate audit rates:
    researchers estimated Black taxpayers were audited at 2.9 to 4.7 times the rate of others, driven mainly by EITC
    claimants, and GAO found refundable-credit selection reviews did not consider demographic equity.
  solution: >-
    Compare model-suggested issues with issues examiners actually pursued, review closed-case adjustment data by
    issue, track no-change rates and drift, and test selection models and their targets against group outcomes before
    and after deployment (using partial identification or third-party data where the authority lacks the variables).
    This is the control TIGTA recommended and researchers, GAO and Werfel's register describe; no implementation is
    published.
  outcomes:
    - {lever: risk, description: "Audit-rate disparity in IRS audits generally (measures the process, not a fairness test)", figure: "2.9 to 4.7 times", measures: "audit rate of Black relative to non-Black taxpayers, estimated by partial identification (working paper, Jan 2023)", provenance: independent, source_ref: SIEPR-AUDIT-2023}
    - {lever: risk, description: "Documentation gaps for high-impact IRS AI", figure: "4 of 5 lacked testing documentation; 2 of 5 lacked a documented impact assessment", measures: "TIGTA sample of five presumed high-impact IRS AI use cases (Sep 2026 report, read through press)", provenance: independent, source_ref: ACCTODAY-TIGTA-2026}
  prerequisites:
    - "Closed-case exam data linked back to the model's suggested issues, and enough ongoing audits to generate outcome data (TIGTA-2025; GAO-2026)"
    - "Demographic or proxy data to test against; Werfel notes tax data systems may not collect the needed variables (AICPA-WERFEL-2026)"
  risks_and_guardrails:
    - "Systems that learn from historical audit patterns can carry forward biases that are hard to see without outside review, an Electronic Frontier Foundation source told Tax Notes reporters (NTT-BIAS-2026)"
    - "The study finds that minimising the no-change rate and targeting erroneously claimed refundable credits raise the audit rate of Black taxpayers, so performance and fairness trade off (SIEPR-AUDIT-2023)"
    - "Disclosing model details to improve transparency can raise adversarial-manipulation risk (AICPA-WERFELART-2026)"
  human_checkpoints:
    - "TIGTA recommended that division commissioners make exam performance results part of model monitoring and refinement; the IRS agreed, subject to staffing and Treasury guidance (TIGTA-2025, Recommendation 1)"
    - "Werfel's register calls for human review of high-impact audit-selection decisions and periodic bias audits with documented findings (AICPA-WERFEL-2026, risk 7)"
  role_evolution: "Data scientists and examination leaders would share ownership of model quality, with exam outcomes as the evaluation signal (TIGTA-2025); the register lists workforce expertise erosion as a risk to doing this (AICPA-WERFEL-2026, risk 15)."
  evidence_grade: D
  sources:
    - {ref: TIGTA-2025, title: "The IRS Could Leverage Examination Results in Artificial Intelligence Examination Case Selection Models and Improve Processes to Evaluate Performance (2025-308-022)", publisher: "Treasury Inspector General for Tax Administration", type: regulator, url: "https://www.tigta.gov/sites/default/files/reports/2025-08/2025308022fr.pdf", date: "2025-05-19", access: full, locator: "pp. 9-14 (Recommendations 1-3 and responses)"}
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "p. 26"}
    - {ref: GAO-EQUITY-2024, title: "Tax Enforcement: IRS Audit Selection Processes for Returns Claiming Refundable Credits Could Better Address Equity (GAO-24-106126)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-24-106126", date: "2024-04", access: full, locator: "Fast Facts; What GAO Found"}
    - {ref: ACCTODAY-TIGTA-2026, title: "IRS's AI risk management needs to be improved", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/irs-ai-risk-management-needs-to-be-improved", date: "2026-09-28", access: full, locator: "paragraphs 4-8"}
    - {ref: SIEPR-AUDIT-2023, title: "Measuring and Mitigating Racial Disparities in Tax Audits", publisher: "Stanford Institute for Economic Policy Research", type: academic, url: "https://siepr.stanford.edu/publications/working-paper/measuring-and-mitigating-racial-disparities-tax-audits", date: "2023-01", access: full, locator: "abstract"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices", publisher: "AICPA (Danny Werfel)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix A, risks 7 and 15"}
    - {ref: AICPA-WERFELART-2026, title: "A risk framework for AI use in tax administration and preparation", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "section 'AI risk register for tax authorities'"}
    - {ref: NTT-BIAS-2026, title: "How AI Bias Affects State Audit Selection", publisher: "Tax Notes Talk (Tax Analysts)", type: podcast, url: "https://taxnotestalk.taxnotes.com/124942/episodes/19216367-how-ai-bias-affects-state-audit-selection", date: "2026-05-22", access: full, locator: "transcript, oversight discussion citing Haley Tsukayama (EFF)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. The TIGTA 2026 report returned 403, so its figures come from Accounting Today. The disparity estimate
    predates the 2025 AI expansion.

- id: tax-controversy-15
  title: AI risk targeting for audits and investigations at other tax authorities (HMRC, Austria, Hungary, US states)
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Authorities need to find inaccuracies and fraud across very large return and transaction populations with limited
    audit staff. For taxpayers, selection by models with unpublished criteria is faster than the channels for
    challenging it.
  solution: >-
    HMRC says AI and advanced analytics highlight where returns may contain inaccuracies, one of its main ways of
    choosing cases; Pinsent Masons says HMRC's Connect platform lets it use AI more to produce target lists. Austria's
    Predictive Analytics Competence Centre has applied machine-learning risk models to audits and fraud detection
    since 2014. Hungary's 2026 audit plan, as reported by two firms, says the authority uses AI-based models and
    real-time data to screen high-risk companies, with related-party pricing a focus. California's Franchise Tax Board
    put ML models into service in 2021 to help decide which returns to pursue; New York says its case-selection
    system is not AI, which others dispute. South Carolina's revenue department signed a $3.5 million, five-year
    contract in December 2025 to use AI in audit selection, starting with sales and use tax; officials say it applies
    the same criteria faster and will suggest rather than conduct audits. Withum's summary of
    SEATA 2026 says commissioners and revenue staff highlighted AI and analytics for audit selection, fraud detection
    and enforcement; several of its state-by-state lines are Withum's inference. HMRC consulted in
    April 2025 on a transaction schedule designed to enable automated TP risk assessment.
  outcomes:
    - {lever: capacity, description: "Tax that HMRC says AI and advanced analytics directly enabled it to protect and recover", figure: "GBP 10 billion (2025-26)", measures: "tax protected and recovered from compliance interventions HMRC says were directly enabled by AI and advanced analytics; method not published", provenance: self-reported, source_ref: HMRC-ARA-2026}
    - {lever: risk, description: "Austrian Ministry of Finance results for its risk models", figure: "about EUR 185 million additional revenue; about 6.5 million cases analysed (2023)", measures: "additional revenue the Ministry attributes to the models across income, corporate, VAT and customs; 375,000 of 27.5 million cases flagged for review; method not published (via OECD)", provenance: self-reported, source_ref: OECD-GOVAI-2025}
    - {lever: risk, description: "California oversight reporting", figure: "0 agencies reported a high-risk automated decision system", measures: "agencies reporting a high-risk system under AB 302 in the 2025 report, as described by Tax Notes reporters; experts told them this was not credible", provenance: independent, source_ref: NTT-BIAS-2026}
    - {lever: risk, description: "State agency AI adoption", figure: "22 of 36 responding agencies said they used no AI; 7 said they did", measures: "Tax Notes 2025 survey of 49 state and jurisdictional agencies, 36 responding", provenance: independent, source_ref: TAXNOTES-UNWATCHED-2026}
  prerequisites:
    - "Long-built data holdings and third-party data (HMRC Connect); HMRC appointed its first Chief AI Officer in April 2026 (HMRC-ARA-2026)"
    - "A specialised analytics unit and accurate training data; OECD stresses that risk-model reliability depends on it (OECD-GOVAI-2025)"
  risks_and_guardrails:
    - "In Elsbury v Information Commissioner the First-tier Tribunal rejected HMRC's refusal to confirm or deny whether it holds information on LLM use in R&D tax credit compliance, finding the claimed fraud risk unsubstantiated (ELSBURY-ICO-2025)"
    - "HMRC told the FT generative AI was not approved for generating taxpayer letters; the FT reported suggestions that some caseworkers may have used it without authorisation, which ICAS says raises confidentiality concerns (ICAS-HMRC-2025)"
    - "OECD cites the Dutch childcare benefits scandal, in which about 26,000 families were wrongly accused of fraud, as the harm skewed data and algorithmic errors can cause (OECD-GOVAI-2025)"
    - "Tax Notes reporters describe weak outside review of state systems, partly because it is unclear what counts as AI (NTT-BIAS-2026; TAXNOTES-UNWATCHED-2026); Werfel's register notes tax data systems may not collect the demographic variables needed for bias testing (AICPA-WERFEL-2026, risk 7)"
    - "Taxpayers worry that AI-assisted TP audits may mischaracterise legitimate arrangements; South Africa's revenue service has not openly confirmed GenAI in TP audits (BLOOMBERG-AFRICA-2026)"
  human_checkpoints:
    - "HMRC says skilled caseworkers make the final decisions where Copilot supports compliance work (HMRC-UPDATE-2026); the Permanent Secretary says AI augments staff (CSW-HMRC-2026)"
    - "Austrian cases flagged for further review (375,000 in 2023) go to staff (OECD-GOVAI-2025)"
    - "California's FTB reportedly runs internal checks for over-selection (NTT-BIAS-2026)"
  role_evolution: >-
    HMRC's Permanent Secretary expects HMRC to be broadly the same size in 2030 with AI assisting officials (CSW-HMRC-2026);
    HMRC is also recruiting 5,500 more compliance officers by 2030 (PINSENT-HMRC-2026). An Electronic Frontier
    Foundation source told Tax Notes that agencies invested in a system may be institutionally biased against finding
    its problems (NTT-BIAS-2026).
  evidence_grade: A
  sources:
    - {ref: HMRC-ARA-2026, title: "HM Revenue and Customs Annual Report and Accounts 2025 to 2026", publisher: "HM Revenue and Customs", type: regulator, url: "https://assets.publishing.service.gov.uk/media/6a4f66c406e7256c331df8a2/HMRC_annual_report_and_accounts_2025_to_2026.pdf", date: "2026-07", access: full, locator: "Chief Executive's foreword; 'AI focus - close the tax gap' box (around printed p. 21)"}
    - {ref: PINSENT-HMRC-2026, title: "UK firms warned following HMRC AI-powered tax crackdown", publisher: "Pinsent Masons (Out-Law)", type: firm, url: "https://www.pinsentmasons.com/out-law/news/uk-firms-warned-following-hmrc-ai-powered-tax-crackdown", date: "2026-07-14", access: full, locator: "paragraphs 1-4"}
    - {ref: ELSBURY-ICO-2025, title: "Thomas Elsbury v The Information Commissioner [2025] UKFTT 915 (GRC)", publisher: "First-tier Tribunal (General Regulatory Chamber)", type: regulator, url: "https://caselaw.nationalarchives.gov.uk/ukftt/grc/2025/915", date: "2025-08-02", access: full, locator: "decision given 2 Aug 2025 (heard 27 Jun 2025); reasons on the prejudice test, including 'unsubstantiated theoretical risk'"}
    - {ref: ICAS-HMRC-2025, title: "HMRC's plans for AI", publisher: "ICAS", type: professional-body, url: "https://www.icas.com/news-insights-events/news/tax/hmrc-s-plans-for-ai", date: "2025-10-29", access: full, locator: "section 'Potential pitfalls'"}
    - {ref: CSW-HMRC-2026, title: "HMRC perm sec says AI adoption won't reduce staff numbers", publisher: "Civil Service World", type: press, url: "https://www.civilserviceworld.com/news/article/hmrc-perm-sec-says-ai-adoption-wont-reduce-staff-numbers", date: "2026-01-15", access: full, locator: "paragraphs 2-8"}
    - {ref: OECD-GOVAI-2025, title: "Governing with Artificial Intelligence: The State of Play and Way Forward in Core Government Functions", publisher: "OECD", type: regulator, url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/06/governing-with-artificial-intelligence_398fa287/795de142-en.pdf", date: "2025-09", access: full, locator: "Chapter 5, Boxes 5.3 and 5.6"}
    - {ref: NTT-BIAS-2026, title: "How AI Bias Affects State Audit Selection", publisher: "Tax Notes Talk (Tax Analysts)", type: podcast, url: "https://taxnotestalk.taxnotes.com/124942/episodes/19216367-how-ai-bias-affects-state-audit-selection", date: "2026-05-22", access: full, locator: "transcript: New York and California case studies; oversight laws"}
    - {ref: TAXNOTES-UNWATCHED-2026, title: "Tax Notes Investigates States' Use of AI in Audit Selection (excerpting Tax Notes, 14 Apr 2026)", publisher: "TaxProf Blog", type: press, url: "https://taxprofblog.aals.org/?p=134442", date: "2026-05-02", access: full, locator: "excerpt"}
