- id: tax-controversy-21
  title: Tax-authority examiner and caseworker assistants that sort evidence, summarise cases and draft documents
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [review-assurance, research-synthesis, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Auditors and caseworkers must sort large volumes of receipts, invoices and case documents and draft routine
    requests and reports, with fewer staff.
  solution: >-
    The ATO's Chief Data Officer says the ATO built AI that reads receipts and invoices supplied to substantiate
    work-expense claims, suggests which documents relate to which claim, and orders them for auditors; it learns from
    feedback. HMRC says it uses natural language processing to help caseworkers scan large volumes of documents in
    complex cases, is trialling Copilot for caseworkers and is designing tools for rapid case summaries. EisnerAmper
    reports that IRS revenue agents are beginning to get generative AI for routine drafting such as IDRs and exam
    reports, which agents review and finalise; no IRS source confirms this. The National Taxpayer Advocate disclosed
    that parts of its FY2027 report to Congress were drafted with AI and verified by staff.
  outcomes:
    - {lever: speed, description: "ATO says the assistant saves time and makes claims easier to assess", figure: "none published", measures: "no measure given", provenance: self-reported, source_ref: ATO-SPEECH-2026}
  prerequisites:
    - "Data quality and lineage; the ATO CDO says 'AI doesn't fail, the data does' (ATO-SPEECH-2026)"
    - "Approved tools only: IRM 10.24.1 prohibits entering taxpayer information into unapproved AI and requires direct human review of outputs and disclosure of AI-assisted content as appropriate (IRM-10-24-1)"
  risks_and_guardrails:
    - "ANAO found ATO AI governance only partly effective, lacking effective arrangements for design, deployment and monitoring of models; the ATO accepted the recommendations (ANAO-ATO-2025)"
    - "A hallucinated citation in an IRS motion (Khoja) shows the failure mode for authority drafting (BLAW-TAXCT-2026)"
    - "HMRC told the FT generative AI was not approved for taxpayer letters, while the FT reported suggestions of unauthorised caseworker use (ICAS-HMRC-2025)"
  human_checkpoints:
    - "ATO auditors decide the validity of deduction claims (ATO-SPEECH-2026)"
    - "IRS revenue agents review and finalise drafts (EISNER-IRSAI-2026); TAS staff review, verify and approve all AI-assisted content (NTA-OBJ-2026)"
  role_evolution: >-
    ATO staff get an assistant in place of a 'randomly organised digital shoebox', and received much broader Copilot
    access during 2025 (ATO-SPEECH-2026). EisnerAmper says revenue agents can focus on complex audit areas
    (EISNER-IRSAI-2026).
  evidence_grade: B
  sources:
    - {ref: ATO-SPEECH-2026, title: "Speech to Australian Government Data Summit (Andrew Watson, Deputy Commissioner and Chief Data Officer)", publisher: "Australian Taxation Office", type: regulator, url: "https://www.ato.gov.au/media-centre/speech-to-australian-government-data-summit", date: "2026-04-22", access: full, locator: "section 'What changed with Generative AI - and what didn't'"}
    - {ref: ANAO-ATO-2025, title: "Governance of Artificial Intelligence at the Australian Taxation Office (Auditor-General Report No. 22 2024-25)", publisher: "Australian National Audit Office", type: regulator, url: "https://www.anao.gov.au/work/performance-audit/governance-of-artificial-intelligence-the-australian-taxation-office", date: "2025-02-28", access: full, locator: "Conclusion paras 8-11"}
    - {ref: HMRC-ARA-2026, title: "HM Revenue and Customs Annual Report and Accounts 2025 to 2026", publisher: "HM Revenue and Customs", type: regulator, url: "https://assets.publishing.service.gov.uk/media/6a4f66c406e7256c331df8a2/HMRC_annual_report_and_accounts_2025_to_2026.pdf", date: "2026-07", access: full, locator: "'AI focus - close the tax gap' box"}
    - {ref: EISNER-IRSAI-2026, title: "AI at the IRS: Transforming Tax Enforcement and the Future of Taxpayer Services", publisher: "EisnerAmper", type: firm, url: "https://eisneramper.com/insights/tax/ai-irs-transforming-0126", date: "2026-01-27", access: full, locator: "section 'AI in Audits'"}
    - {ref: IRM-10-24-1, title: "IRM 10.24.1 IRS Policy for Artificial Intelligence (AI) Governance", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/irm/part10/irm_10-024-001r", date: "2026-08-10", access: full, locator: "10.24.1.7.2 Prohibited Uses of GenAI (current revision of 10 Aug 2026; first issued 10 Feb 2026)"}
    - {ref: NTA-OBJ-2026, title: "National Taxpayer Advocate Fiscal Year 2027 Objectives Report to Congress", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/06/JRC27_FullReport.pdf", date: "2026-06", access: full, locator: "front matter, AI assistance statement"}
    - {ref: ICAS-HMRC-2025, title: "HMRC's plans for AI", publisher: "ICAS", type: professional-body, url: "https://www.icas.com/news-insights-events/news/tax/hmrc-s-plans-for-ai", date: "2025-10-29", access: full, locator: "closing section on the FOI case"}
    - {ref: BLAW-TAXCT-2026, title: "Tax Court Navigates AI Misuse Rules for Self-Represented Filers", publisher: "Bloomberg Law (Daily Tax Report)", type: press, url: "https://news.bloomberglaw.com/daily-tax-report/tax-court-navigates-ai-misuse-rules-for-self-represented-filers", date: "2026-03-20", access: full, locator: "section 'Protecting Taxpayers'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded B on the ATO and HMRC named deployments; the IRS revenue agent part is a single secondary claim (C on its
    own), and TAS's AI-assisted drafting is of a report to Congress, not casework, so it does not support the grade.
    The ANAO figures cover all ATO production models, not this tool.

- id: tax-controversy-22
  title: AI agents for case summaries and search in IRS Chief Counsel, Appeals and the Taxpayer Advocate Service
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    The units that resolve disputes (Chief Counsel, Appeals, TAS) handle document-heavy cases with reduced staff. The
    IRS workforce fell by about 25% in 2025; a law-firm commentary says Appeals lost 29% of its workforce and cases are
    stacking up.
  solution: >-
    Salesforce said Agentforce would be used across the Office of Chief Counsel, TAS and the Office of Appeals for case
    summaries and search. The vendor executive said the agents are built with guardrails and cannot make final
    decisions or disburse funds.
  outcomes:
    - {lever: speed, description: "Stated aim is to complete cases more quickly", figure: "none published", measures: "no usage or outcome figures found", provenance: vendor-published, source_ref: IRS-AGENTFORCE-2025}
  prerequisites:
    - "Modernised case-management platforms in each unit; Axios says the vendor had worked with the IRS for a few years on these (IRS-AGENTFORCE-2025)"
  risks_and_guardrails:
    - "Agents may not make final decisions or disburse funds (vendor executive, IRS-AGENTFORCE-2025)"
    - "No public statement on how summaries are checked, logged or disclosed to representatives; Werfel's register flags explainability and lack of auditability for appeals of AI-assisted determinations (AICPA-WERFEL-2026, risks 3 and 18)"
    - "The Appeals staffing commentary does not mention AI; do not read it as evidence about this tool (CPAPA-APPEALS-2026)"
  human_checkpoints:
    - "Staff make the decisions; the vendor says it does not advocate unreviewed AI processing (IRS-AGENTFORCE-2025)"
  role_evolution: >-
    A senior IRS Chief Counsel technology attorney said it would be 'negligence' not to use AI tools to go
    'head-to-head with some of the law firms', and that staff must adopt change or leave (IRS-AGENTFORCE-2025).
    EisnerAmper expects staff to spend less time on document search and more on taxpayer interaction
    (EISNER-IRSAI-2026).
  evidence_grade: C
  sources:
    - {ref: IRS-AGENTFORCE-2025, title: "Exclusive: IRS deploys AI agents", publisher: "Axios", type: press, url: "https://www.axios.com/2025/11/21/irs-deploys-ai-agents", date: "2025-11-21", access: full, locator: "'Driving the news', 'What they're saying', 'The bottom line' (opened via text mirror)"}
    - {ref: EISNER-IRSAI-2026, title: "AI at the IRS: Transforming Tax Enforcement and the Future of Taxpayer Services", publisher: "EisnerAmper", type: firm, url: "https://eisneramper.com/insights/tax/ai-irs-transforming-0126", date: "2026-01-27", access: full, locator: "section 'AI in Taxpayer Services'"}
    - {ref: CPAPA-APPEALS-2026, title: "A Matter of Balance: IRS Appeals Processes, Staffing Create Growing Concerns for Practitioners, Taxpayers", publisher: "CPA Practice Advisor (Frost Law authors)", type: press, url: "https://www.cpapracticeadvisor.com/2026/07/21/a-matter-of-balance-irs-appeals-processes-staffing-create-growing-concerns-for-practitioners-taxpayers/187095/", date: "2026-07-21", access: full, locator: "paragraphs on staffing and backlog"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices", publisher: "AICPA (Danny Werfel)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix A, risks 3 and 18"}
  last_reviewed: "2026-10-17"
  notes: >-
    Axios could not be opened when sources were checked on 2026-10-17 (403), so the Axios quotations (the vendor
    executive on guardrails, the Chief Counsel attorney) rest on an earlier read through a text mirror and were not
    re-checked. The core claim, Agentforce for document search and case summaries across Chief Counsel, TAS and
    Appeals, is independently stated by EisnerAmper (EISNER-IRSAI-2026), so the entry stays at C, the most a blocked
    source allows. An exclusive based on a vendor announcement plus one IRS attorney; whether it is live in Appeals
    was not confirmed, and no IRS document describes it. Appeals outcomes (cycle time, settlement rates) are not
    published. The Treasury inventory (Jan 2026) does not describe this deployment.

- id: tax-controversy-23
  title: Machine-learning clustering and routing of administrative tax-appeal files (Brazil)
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [transaction-processing, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: Brazil had around USD 140 billion in assessed taxes awaiting decisions in administrative tax appeals, and an appeal ruling took about six years.
  solution: >-
    Under the AI Litigation Project, supervised machine learning groups similar appeal files so they go to the same
    officers, to speed handling and decisions. Clustering was used to complete files in full or in part, and a web
    report assistant was being developed to help officers reuse blocks of text. Officers label files and paragraphs to
    improve later suggestions.
  outcomes:
    - {lever: quality, description: "First trials of supervised classification of similar-file groups (a model accuracy measure, not a speed or dispute outcome)", figure: "over 80% sensitivity and specificity", measures: "classification sensitivity and specificity on a sample of 2,000 manually labelled appeal files; no throughput or ruling-time result reported", provenance: self-reported, source_ref: OECD-GOVAI-2025}
  prerequisites:
    - "Manually labelled historical files and an officer labelling loop (OECD-GOVAI-2025)"
  risks_and_guardrails:
    - "OECD says taxpayers' rights to challenge decisions require AI-assisted decision processes to be explainable, transparent and accountable (OECD-GOVAI-2025)"
  human_checkpoints:
    - "Appeal officers handle the files and rulings; the tool groups files and suggests text (OECD-GOVAI-2025, Box 5.2)"
  role_evolution: "Officers specialise on grouped sets of similar files and reuse text blocks (OECD-GOVAI-2025, Box 5.2)."
  evidence_grade: B
  sources:
    - {ref: OECD-GOVAI-2025, title: "Governing with Artificial Intelligence: The State of Play and Way Forward in Core Government Functions", publisher: "OECD", type: regulator, url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/06/governing-with-artificial-intelligence_398fa287/795de142-en.pdf", date: "2025-09", access: full, locator: "Chapter 5, Box 5.2 and 'Managing risks and challenges'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The OECD box cites a 2022 OECD source, so the trial may predate 2025; current status not stated. Trial metrics are
    classification measures, not dispute outcomes. Graded B: the only figure is a model's sensitivity and specificity
    in first trials, which does not measure throughput, ruling time or any work outcome, and the deploying body is not
    named beyond 'Brazil'. The only appeals-stage AI with any measured result found.

- id: tax-controversy-24
  title: Announced agentic case management for tax-authority casework (ATO priorities, HMRC roadmap)
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [research-synthesis, document-production, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Case work is information-heavy, and isolated experiments ('a thousand flowers blooming', the ATO's phrase) risk
    duplication and weak assurance. HMRC aims for at least 90% digital customer interactions by 2030 (about 76% at the
    roadmap date) while reducing the tax gap.
  solution: >-
    The ATO executive prioritised seven enterprise AI use cases, including case profiling assistants that assemble
    facts and map them to legislation and policy, triage of unstructured taxpayer requests, drafting position papers
    and structured correspondence, and assistants that assemble evidence against policy criteria; its CDO calls
    agentic AI 'the next frontier'. HMRC's Transformation Roadmap, as summarised by ICAS, names agentic AI for case
    management and process automation and plans generative AI that summarises case documents and answers caseworker
    queries. A CIAT blog author argues tax administrations are moving from predictive risk models to agentic AI for
    end-to-end TP control, 'always under human supervision' (opinion).
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "no measure given", provenance: self-reported, source_ref: ATO-SPEECH-2026}
  prerequisites:
    - "Reusable platforms, assurance and ethics checks, business-led ownership and change management (ATO-SPEECH-2026)"
    - "Responsible-AI controls aligned with government AI frameworks and HMRC's Charter (ICAS-HMRC-2025)"
  risks_and_guardrails:
    - "ATO test: 'if we can't explain it, defend it, or audit it - we shouldn't deploy it'; human oversight is mandatory and accountability sits with people (ATO-SPEECH-2026)"
    - "ANAO found gaps in assurance, approval and monitoring of ATO AI models (ANAO-ATO-2025)"
    - "ICAS flags HMRC's transparency about AI use as a concern, citing the R&D letters FOI episode (ICAS-HMRC-2025)"
  human_checkpoints:
    - "Decisions remain with people and drafts stay subject to human review (ATO-SPEECH-2026)"
  role_evolution: "The ATO says AI 'is not about replacing people' and staff judgment and empathy stay at the core (ATO-SPEECH-2026). HMRC is introducing AI tools for telephony advisers to cut administrative time (ICAS-HMRC-2025)."
  evidence_grade: C
  sources:
    - {ref: ATO-SPEECH-2026, title: "Speech to Australian Government Data Summit (Andrew Watson, Deputy Commissioner and Chief Data Officer)", publisher: "Australian Taxation Office", type: regulator, url: "https://www.ato.gov.au/media-centre/speech-to-australian-government-data-summit", date: "2026-04-22", access: full, locator: "section 'From experimentation to industrialisation: 7 priority use cases'; Closing"}
    - {ref: ICAS-HMRC-2025, title: "HMRC's plans for AI", publisher: "ICAS", type: professional-body, url: "https://www.icas.com/news-insights-events/news/tax/hmrc-s-plans-for-ai", date: "2025-10-29", access: full, locator: "sections 'The strategic approach', 'Specific examples from the roadmap', 'Potential pitfalls'"}
    - {ref: HMRC-ROADMAP-2025, title: "HMRC's Transformation Roadmap", publisher: "HM Revenue and Customs", type: regulator, url: "https://www.gov.uk/government/publications/hmrc-transformation-roadmap", date: "2025-07-21", access: full, locator: "landing page only; roadmap text read through ICAS"}
    - {ref: ANAO-ATO-2025, title: "Governance of Artificial Intelligence at the Australian Taxation Office (Auditor-General Report No. 22 2024-25)", publisher: "Australian National Audit Office", type: regulator, url: "https://www.anao.gov.au/work/performance-audit/governance-of-artificial-intelligence-the-australian-taxation-office", date: "2025-02-28", access: full, locator: "Conclusion paras 8-11"}
    - {ref: CIAT-BLOG-2026, title: "Artificial Intelligence Agents in the control of Transfer Pricing", publisher: "CIAT (Inter-American Center of Tax Administrations)", type: regulator, url: "https://www.ciat.org/artificial-intelligence-agents-in-the-control-of-transfer-pricing/?lang=en", date: "2026-02-03", access: full, locator: "blog text (author's opinion)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Announced priorities, not deployments; the only delegate-level evidence in the module, and it is on the authority
    side.

- id: tax-controversy-25
  title: "Idea: LLM reasoning to detect and analyse abusive tax strategies (authority research)"
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [research-synthesis, expert-judgment]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: Well-advised taxpayers design tax-minimisation strategies that are hard for authorities to find and analyse across statutes, case law and guidance.
  solution: >-
    Researchers tested advanced LLMs on interpreting and verifying strategies, filling gaps in partly specified ones,
    and generating full strategies. They report that LLM-based reasoning found an apparently novel strategy and
    position LLMs as a tool for tax agencies. A paper with overlapping authors pairs LLMs with a symbolic solver to
    improve auditability.
  outcomes:
    - {lever: quality, description: "Authors report LLM-based reasoning identified an entirely novel tax strategy", figure: "none published", measures: "qualitative result in the abstract; no accuracy measure", provenance: independent, source_ref: JHU-TAXABUSE-2025}
  prerequisites:
    - "Expert review of generated strategies"
  risks_and_guardrails:
    - "The second paper's authors argue LLMs alone are poorly suited to tax calculation because errors incur penalties and systems need high accuracy and auditability (JHU-TAXREASON-2025)"
    - "Models that find avoidance strategies could also help taxpayers generate them (dual use); the abstract frames the use for agencies"
  human_checkpoints:
    - "Not described; academic experiment"
  role_evolution: "Not evidenced."
  evidence_grade: D
  sources:
    - {ref: JHU-TAXABUSE-2025, title: "Can LLMs Identify Tax Abuse?", publisher: "arXiv (Blair-Stanek, Holzenberger, Van Durme)", type: academic, url: "https://arxiv.org/abs/2508.20097", date: "2025-08-10", access: full, locator: "abstract; v2 of 21 Jan 2026"}
    - {ref: JHU-TAXREASON-2025, title: "Language Models and Logic Programs for Trustworthy Tax Reasoning", publisher: "arXiv (Jurayj, Holzenberger, Van Durme)", type: academic, url: "https://arxiv.org/abs/2508.21051", date: "2025-08-28", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Research paper, not a deployment; kept as a frontier signal. Practitioner-side anti-abuse screening:
    tax-research-advisory-10.
