    tax-transfer-pricing-23. An OECD speaker's claim that some administrations cut VAT investigations from about nine
    months to three is second-hand (SSL-OECDVAT-2026) and is not used as an outcome.

- id: tax-controversy-16
  title: AI fraud and identity-theft screening that flags returns and pauses refunds, with human review (IRS)
  archetype: tax
  module: controversy
  function: risk-compliance-legal
  work_types: [review-assurance, transaction-processing]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Refund fraud and identity theft at scale cannot be screened by hand, but a held refund creates a taxpayer problem
    that often ends in calls, identity verification and correspondence.
  solution: >-
    IRS models score returns for fraud or noncompliance risk; in most compliance and fraud use cases an IRS official
    reviews the score or recommendation. GAO found two fraud use cases that automate a decision without human review:
    one decides relief for taxpayers whose accounts were flagged for identity-theft risk, and one pauses refund
    issuance when a return looks like identity theft, after which an employee reviews the risk factors and decides
    whether to release it. Treasury's inventory lists a tool that checks several ML models' outputs against a
    confidence threshold to flag possible fraud for human review, and a synthetic data engine to simulate fraud cases.
  outcomes:
    - {lever: risk, description: "GAO counted use cases rather than measuring detection accuracy", figure: "18 of 43 operational", measures: "IRS AI use cases in the tax compliance and fraud detection category that were operational as of June 2025", provenance: independent, source_ref: GAO-2026}
    - {lever: experience, description: "Identity-theft verification phone line (context; the report does not isolate the effect of AI screening)", figure: "19% of nearly 2.4 million calls answered by an assistor; 20 minutes on hold", measures: "Taxpayer Protection Program line, filing season 2026 through 18 April (TAS)", provenance: independent, source_ref: NTA-OBJ-2026}
  prerequisites:
    - "Identity-verification process and phone capacity for taxpayers whose refunds are paused"
    - "IT capacity; a TIGTA memo cited by FedScoop says IT staffing fell 16% while at least 16 IRS AI use cases involve IT (TREAS-AIINV-2026)"
  risks_and_guardrails:
    - "GAO found over 25% of inventory entries did not describe the expected benefit, and some contracted tools were missing from the inventory (GAO-2026)"
    - "Werfel's register lists adversarial manipulation of detection models, irreversible agent actions and control dilution as risks (AICPA-WERFEL-2026, risks 13, 14, 17)"
    - "FedScoop notes a 2024 inventory listed a collections chatbot, while the new inventory shows no 'collections' or 'enforcement' entries (TREAS-AIINV-2026)"
  human_checkpoints:
    - "An IRS official reviews AI risk scores and recommendations before audits or investigations proceed in most use cases (GAO-2026)"
    - "An employee reviews identity-theft risk factors and decides whether a paused refund is issued (GAO-2026)"
  role_evolution: "Reviewers move from finding suspect returns to handling model flags and the verification work that follows (GAO-2026)."
  evidence_grade: B
  sources:
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "pp. 19-20; Highlights"}
    - {ref: TREAS-AIINV-2026, title: "IRS ramps up AI use amid staff cuts, Treasury inventory shows", publisher: "FedScoop", type: press, url: "https://fedscoop.com/treasury-irs-ai-use-case-inventory/", date: "2026-01-29", access: full, locator: "paragraphs 1-6 and 10-12"}
    - {ref: NTA-OBJ-2026, title: "National Taxpayer Advocate Fiscal Year 2027 Objectives Report to Congress, Review of the 2026 Filing Season", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/06/JRC27_FullReport.pdf", date: "2026-06", access: full, locator: "Figure 2.8 and following paragraph (only AI-related passages read)"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices", publisher: "AICPA (Danny Werfel)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix A, risks 13, 14 and 17"}
  last_reviewed: "2026-10-17"
  notes: >-
    No published error, false-positive or release-time rates for IRS fraud models were found. The 'Zero Paper AI
    Routing' mail tool (pre-deployment) belongs with compliance and the 'IRS IaaP Accelerator' with the
    data-technology module; neither is an entry here.

- id: tax-controversy-17
  title: AI and automation to speed IRS amended-return processing
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [transaction-processing]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    The IRS receives about 5 million amended returns a year, and backlogs push taxpayers into correspondence,
    follow-up calls and disputes. In February 2026 the IRS put about 1,500 IT and HR staff on involuntary details to
    frontline service, with duties including the amended-return backlog.
  solution: The IRS CIO told employees the agency is using AI to speed processing of 'hundreds of thousands' of amended returns. The method is not described.
  outcomes:
    - {lever: speed, description: "Processing time for an amended individual return, before and after AI and automation", figure: "from 12, 14 or 16 weeks to under three days", measures: "average processing time stated by the IRS CIO at an all-staff meeting, for the 'hundreds of thousands' of about 5 million a year where AI is applied; no methodology published", provenance: self-reported, source_ref: IRS-AIFIRST-2026}
  prerequisites:
    - "IT and data staff to build and maintain the tools; GAO reports 63 AI-related staff lost from one analytics group in 2025 (GAO-2026)"
  risks_and_guardrails:
    - "Unpublished methodology: it is unclear which returns were included and whether the figure covers complex cases (IRS-AIFIRST-2026)"
    - "No error or quality data; GAO and TIGTA do not cover this tool (GAO-2026)"
    - "A TIGTA memo cited by FedScoop reports IT staffing down 16% (TREAS-AIINV-2026)"
  human_checkpoints:
    - "Not described in the source"
  role_evolution: >-
    The IRS CEO told staff AI will make the workforce more productive and is 'not designed to eliminate jobs';
    headcount was about 74,000 at the start and end of 2026, after more than 4,000 hires (IRS-AIFIRST-2026).
  evidence_grade: B
  sources:
    - {ref: IRS-AIFIRST-2026, title: "Tax chief pushes 'AI-first IRS' to get more out of agency's workforce", publisher: "Nextgov/FCW", type: press, url: "https://www.nextgov.com/artificial-intelligence/2026/10/tax-chief-pushes-ai-first-irs-get-more-out-agencys-workforce/416389/", date: "2026-10-02", access: full, locator: "paragraphs on CIO Kaschit Pandya's remarks and CHCO Kweskin's headcount statement"}
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "What GAO Found (63 lost AI-related staff)"}
    - {ref: TREAS-AIINV-2026, title: "IRS ramps up AI use amid staff cuts, Treasury inventory shows", publisher: "FedScoop", type: press, url: "https://fedscoop.com/treasury-irs-ai-use-case-inventory/", date: "2026-01-29", access: full, locator: "paragraph on IT staffing"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded B: the only figure is an official's spoken remark (from a transcript and audio obtained by Government
    Executive, reported by Nextgov) with no method, sample or independent check. Pattern 'other': document-heavy
    transaction processing; the source does not describe whether the flow was redesigned, so change_scope is step.
    Adjacent to controversy.

- id: tax-controversy-18
  title: Voicebots and chatbots answering taxpayer calls, questions and payment plans (IRS and others)
  archetype: tax
  module: controversy
  function: customer-service
  work_types: [client-interaction, transaction-processing]
  pattern: service-agent-escalation
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Phone demand at the IRS far exceeds live-assistor capacity; taxpayers and practitioners in notice, balance-due and
    collection situations wait a long time. With staffing about 25% lower and a budget about 20% lower in FY2026, the IRS expects to rely more on technology.
  solution: >-
    The IRS runs authenticated and unauthenticated chatbots and voicebots for procedural and tax questions and for
    installment agreements (payment plans), plus an international-taxpayer chatbot; its June 2025 inventory lists 11
    voicebots and two chatbots. Callers can ask for a live assistor during regular hours, and callbacks are offered
    when waits are long. Grant Thornton Ireland says Singapore's government-wide 'Ask Jamie'
    chatbot halved call-centre inquiries (second-hand and not tax-specific).
  outcomes:
    - {lever: experience, description: "Voicebot completion and hand-off in filing season 2026", figure: "17% completed in the bot; about 46% transferred to an assistor; about 14% disconnected", measures: "share of voicebot volume on enterprise phone lines, filing season 2026 through 18 April (TAS, from IRS data)", provenance: independent, source_ref: NTA-OBJ-2026}
    - {lever: experience, description: "Chatbot usefulness responses", figure: "80% negative (Jan-Aug 2025); international chatbot 23 of 200 (11.5%) helpful", measures: "end-of-session yes/no usefulness question; TAS calls for a fuller quality-measurement framework to find the causes of negative responses", provenance: independent, source_ref: NTA-AR-2025}
    - {lever: capacity, description: "Installment agreements completed through chatbots", figure: "+68% chatbot agreements; -7% total agreements", measures: "number of installment agreements, FY2024 to FY2025 (TAS)", provenance: independent, source_ref: NTA-AR-2025}
    - {lever: capacity, description: "Sessions with IRS taxpayer-service bots", figure: "over 5 million (FS2024); nearly 25 million (FS2025)", measures: "voicebot and chatbot sessions per filing season, as reported by the IRS to GAO", provenance: self-reported, source_ref: GAO-2026}
  prerequisites:
    - "Authentication, transfer paths to live assistors, callback capacity, and outcome-based quality measures, which TAS says the IRS lacks (NTA-AR-2025; NTA-OBJ-2026)"
  risks_and_guardrails:
    - "Werfel's register lists chatbot hallucination, drift, over-trust and estoppel-type reliance claims; its scenarios are illustrative (AICPA-WERFEL-2026, risks 1-5)"
    - "TAS says voicebots help only if they accurately address what taxpayers need, and the high transfer rate shows more work is needed (NTA-OBJ-2026)"
    - "TAS recommends a service metric covering chatbot and voicebot experience by the end of FY2026 (NTA-AR-2025)"
    - "South Korea routes sensitive chatbot queries to staff (GT-IE-OECD-2025, summarising OECD)"
  human_checkpoints:
    - "Transfer to a live assistor on request; over 85% of callers who chose a callback in filing season 2026 reached an assistor (NTA-OBJ-2026)"
  role_evolution: >-
    Calls answered by assistors on enterprise lines fell 20% (12.4 million to 9.9 million) while voicebot volume rose
    4%; TAS does not say voicebots caused the rise in hold time from 8 to 14 minutes (NTA-OBJ-2026). TAS says reduced
    staffing may force taxpayers to self-service tools or leave issues unresolved (NTA-AR-2025).
  evidence_grade: A
  sources:
    - {ref: NTA-OBJ-2026, title: "National Taxpayer Advocate Fiscal Year 2027 Objectives Report to Congress, Review of the 2026 Filing Season", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/06/JRC27_FullReport.pdf", date: "2026-06", access: full, locator: "Figure 2.7 and following paragraph"}
    - {ref: NTA-AR-2025, title: "National Taxpayer Advocate 2025 Annual Report to Congress", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/01/ARC_Publication-2104_2025_Web.pdf", date: "2026-01", access: full, locator: "Preface (pdf p. 27); chatbot section (pdf p. 74); footnote 47 (pdf p. 147)"}
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "p. 20"}
    - {ref: BLOOMBERG-COLLECTION-2025, title: "IRS Modernizes Collection: What's Next for Tax Practitioners", publisher: "Bloomberg Tax (Tax Management Memo)", type: press, url: "https://news.bloombergtax.com/tax-management-memo/irs-modernizes-collection-whats-next-for-tax-practitioners", date: "2025-12-23", access: full, locator: "section 'Enhancing IRS Collection with Tech'"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices", publisher: "AICPA (Danny Werfel)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix A, risks 1-5"}
    - {ref: GT-IE-OECD-2025, title: "Governing with AI: The new face of tax authorities", publisher: "Grant Thornton Ireland", type: firm, url: "https://www.grantthornton.ie/insights/factsheets/governing-ai-tax-authorities/", date: "2025-09-19", access: full, locator: "sections 'Personalised and proactive taxpayer services', 'The trust factor'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded A on TAS measurements of IRS deployments; the measures are weak proxies for quality, as TAS itself says. A
    former SB/SE commissioner's claim that pay plans were worth at least ten times the $13 million programme cost has
    no stated method and is not used. TAS sits inside the IRS but reports independently to Congress.

- id: tax-controversy-19
  title: Real-time prompts during online filing that ask taxpayers to check unusual entries (ATO myTax)
  archetype: tax
  module: controversy
  function: service-delivery
  work_types: [review-assurance, client-interaction]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: Errors found after lodgment become reviews, notices, amendments and disputes; catching them at filing is cheaper for both sides.
  solution: >-
    ATO AI models in myTax compare amounts a taxpayer enters with expectations from similar taxpayers or prior years
    and prompt the taxpayer to check specific labels before lodging; the taxpayer can review and amend. Pre-filled
    data from employers, banks and others must be confirmed, and the ATO says it may adjust pre-filled data back if a
    taxpayer changes it and the ATO has high confidence in its information. Separate ATO risk models flag potential
    non-compliance or fraud for human review.
  outcomes:
    - {lever: risk, description: "Prompts issued and revenue the ATO reports they helped protect", figure: "more than 636,000 prompts; about AUD 78.9 million (2023-24)", measures: "prompts to individuals during return submission and revenue the ATO reported protected, relayed by the OECD; method not published", provenance: self-reported, source_ref: OECD-GOVAI-2025}
    - {lever: risk, description: "ANAO governance assessment of all ATO production AI models (not this tool specifically)", figure: "32 of 43 models (74%) had no completed data ethics assessment", measures: "ATO-built production models without a finalised data ethics assessment, 2024 data (ANAO)", provenance: independent, source_ref: ANAO-ATO-2025}
  prerequisites:
    - "Pre-filled third-party data and historical return data; ONENEWS cites over 600 million reported transactions a year (ONENEWS-2026)"
    - "Chief Data Officer as the accountable official under the Australian government's AI policy (ATO-AI-2026)"
  risks_and_guardrails:
    - "ANAO found ATO AI governance only partly effective, with no evidence of ongoing performance monitoring for the 14 models deployed between 1 July 2023 and 14 May 2024 (ANAO-ATO-2025, paras 15, 19)"
    - "For the work-related-expenses models ANAO found gaps in assessing ethical, privacy and legal considerations (ANAO-ATO-2025, para 16)"
    - "OneNews quotes the ATO saying it may adjust changed pre-filled figures back where it has high confidence in its own data (ONENEWS-2026)"
  human_checkpoints:
    - "Taxpayer reviews prompts and decides what to amend before lodging (ATO-AI-2026)"
    - "ATO says decisions adversely affecting taxpayer rights are made by a human, with a right of review (ATO-AI-2026)"
  role_evolution: >-
    Taxpayers and preparers who change pre-filled figures may see the ATO adjust them back (ONENEWS-2026). The ATO says AI frees staff
    for work needing human judgment (ATO-AI-2026); ANAO notes enterprise-wide monitoring of AI model performance was
    due by December 2026 (ANAO-ATO-2025, para 20).
  evidence_grade: A
  sources:
    - {ref: OECD-GOVAI-2025, title: "Governing with Artificial Intelligence: The State of Play and Way Forward in Core Government Functions", publisher: "OECD", type: regulator, url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/06/governing-with-artificial-intelligence_398fa287/795de142-en.pdf", date: "2025-09", access: full, locator: "Chapter 5, Box 5.5"}
    - {ref: ATO-AI-2026, title: "ATO AI transparency statement", publisher: "Australian Taxation Office", type: regulator, url: "https://www.ato.gov.au/about-ato/commitments-and-reporting/information-and-privacy/ato-ai-transparency-statement", date: "2026", access: full, locator: "sections 'AI governance', 'Examples of how we use AI: Tax time nudging'"}
    - {ref: ANAO-ATO-2025, title: "Governance of Artificial Intelligence at the Australian Taxation Office (Auditor-General Report No. 22 2024-25)", publisher: "Australian National Audit Office", type: regulator, url: "https://www.anao.gov.au/work/performance-audit/governance-of-artificial-intelligence-the-australian-taxation-office", date: "2025-02-28", access: full, locator: "Summary paras 8-20; para 2.87"}
    - {ref: ONENEWS-2026, title: "ATO using AI to scan tax returns: what it knows", publisher: "OneNews Australia", type: press, url: "https://www.onenewsaustralia.com/ato-ai-tax-return", date: "2026-08-10", access: full, locator: "section on third-party reporting and pre-fill"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grant Thornton Ireland rounds the OECD figures to 600,000 and close to AUD 80 million; the OECD primary is used.
    The ATO statement's update date is uncertain (27 Feb 2026 per a search result, 27 Jul 2026 per ONENEWS), so only
    the year is given. Australian Privacy Act automated-decision disclosure changes apply from 10 Dec 2026, per
    ONENEWS (not checked against the law).

- id: tax-controversy-20
  title: Agent-assist tools for tax-authority service staff (IRS Archie, California CDTFA, HMRC call summaries)
  archetype: tax
  module: controversy
  function: customer-service
  work_types: [client-interaction, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Authority phone and service staff must find the right guidance while a caller waits; wrong or slow answers feed
    later notices and disputes, and inconsistent call notes make disputes harder to reconstruct.
  solution: >-
    The IRS rolled out 'Archie', an AI-enabled tool that helps customer service representatives research the Internal
    Revenue Manual, as part of its Taxpayer 360 project. California's tax and fee agency (CDTFA) launched a generative
    AI tool on 22 August 2025 that drafts answers from department publications, law guides and web content; an agent
    decides whether to use the response. HMRC is piloting AI call summaries that draft notes for human review and
    testing complaint triage. France, per a summary of the OECD, uses AI to triage taxpayer emails and draft replies
    that staff validate.
  outcomes:
    - {lever: capacity, description: "Availability of Archie; no usage, accuracy or resolution data", figure: "about 12,000 CSRs with access", measures: "customer service representatives to whom the tool was available (TAS)", provenance: independent, source_ref: NTA-OBJ-2026}
    - {lever: capacity, description: "HMRC Copilot rollout (measures rollout, not use or benefit of call summaries)", figure: "more than 28,000 licences by March 2026; plan to reach 50,000 during 2026", measures: "Microsoft Copilot licences issued (HMRC)", provenance: self-reported, source_ref: HMRC-UPDATE-2026}
  prerequisites:
    - "Curated, searchable agency reference content; TAS says Taxpayer 360 had not delivered a single integrated taxpayer view by the 2026 filing season (NTA-OBJ-2026)"
    - "Synthetic-data test environments to test tools without customer data (HMRC-UPDATE-2026)"
  risks_and_guardrails:
    - "Experts asked whether taxpayers would be penalised for relying on bad AI-generated advice; CDTFA responses suggest taxpayers can challenge incorrect advice only if given in writing, and a civil-liberties advocate called it an 'extremely high-risk use case' (CDTFA-2025)"
    - "Werfel's register lists over-trust and unauthorised reliance, including a chatbot telling a taxpayer they qualify and the deduction later being disallowed on audit (AICPA-WERFEL-2026, risk 4)"
    - "Call summaries become part of the record of a taxpayer interaction; the register lists hallucination and control dilution for correspondence tools (AICPA-WERFEL-2026, risks 1 and 17)"
  human_checkpoints:
    - "The representative answers the taxpayer; the tool is for research (NTA-OBJ-2026)"
    - "A CDTFA agent decides when a drafted response is appropriate (CDTFA-2025)"
    - "A human reviews HMRC's AI-drafted call notes (HMRC-UPDATE-2026); French staff validate drafted replies (GT-IE-OECD-2025)"
  role_evolution: >-
    The FTA's chief operating officer expects training to be the main workforce need and says the technology is
    unlikely to take jobs soon (TAXNOTESTALK-2025). HMRC's Permanent Secretary describes the adviser still leading the
    call while the system summarises the outcome and next-best step (CSW-HMRC-2026).
  evidence_grade: B
  sources:
    - {ref: NTA-OBJ-2026, title: "National Taxpayer Advocate Fiscal Year 2027 Objectives Report to Congress, Review of the 2026 Filing Season", publisher: "Taxpayer Advocate Service", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2026/06/JRC27_FullReport.pdf", date: "2026-06", access: full, locator: "Taxpayer 360 passage (pdf p. 32)"}
