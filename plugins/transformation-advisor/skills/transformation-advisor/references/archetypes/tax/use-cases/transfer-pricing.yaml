- id: tax-transfer-pricing-10
  title: First-draft intercompany agreements from the TP policy, and clause extraction from contracts
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Intercompany agreements must match the risk allocation and pricing in the TP policy and the real flows. Plante
    Moran, writing for growing companies with new subsidiaries, distributors and shared-service centres, says drafting
    them often stalls for weeks.
  solution: >-
    AI produces a first draft of an agreement directly from the written TP policy, and qualified TP and legal
    professionals review and finalise it. BDO Canada lists drafting intercompany agreements among current uses.
    Exactera's interviewee says agents can read contracts and invoices and extract information, such as pricing,
    scope, IP and risk clauses, for checking against the policy. One vendor prices agreement drafting as a fixed-fee
    service delivered by its experts.
  outcomes:
    - {lever: speed, description: "Plante Moran says drafting from the policy turns a task that often stalls for weeks into something manageable within hours", figure: "weeks to hours (firm statement, not measured)", measures: "Plante Moran's general description of first-draft agreement time; no sample or baseline", provenance: self-reported, source_ref: PLANTEMORAN-2026}
  prerequisites:
    - "A written TP policy to draft from, and TP and legal reviewers (PLANTEMORAN-2026)"
    - "Agreements and risk allocation that actual conduct supports; the IRS says risk analysis should be consistent with intercompany agreements (IRS-TPFAQ-2026, Q4)"
  risks_and_guardrails:
    - "The draft is a starting point, not bespoke legal or tax advice (PLANTEMORAN-2026)"
    - "AI cannot determine whether contractual arrangements reflect practice (BDO-AIGOV-2026). KPMG authors say authorities look beyond written contracts and that AI systems can read contracts and highlight pricing, service-scope, IP and risk-allocation clauses during South African audit document review (BTAX-AFRICA-2026)"
    - "Confidentiality of agreements entered into public AI tools (IRS-OPR-2026, item 6)"
  human_checkpoints:
    - "Qualified TP and legal professionals review each draft against actual conduct before finalising (PLANTEMORAN-2026)"
  role_evolution: >-
    Not described in the sources beyond reviewers keeping responsibility (PLANTEMORAN-2026).
  evidence_grade: C
  sources:
    - {ref: PLANTEMORAN-2026, title: "Using AI in transfer pricing: Practical opportunities and pitfalls for growing companies", publisher: Plante Moran, type: firm, url: "https://plantemoran.com/explore-our-thinking/insight/2026/08/using-ai-in-transfer-pricing", date: "2026-08-05", access: full, locator: "item 'Drafting intercompany agreements'; 'Key takeaways'"}
    - {ref: BDO-AIGOV-2026, title: "AI governance in transfer pricing: Is your documentation CRA-ready?", publisher: BDO Canada, type: firm, url: "https://www.bdo.ca/insights/ai-governance-in-transfer-pricing-how-to-create-defensible-documentation", date: "2026-08-20", access: full, locator: "'How is AI being used' list"}
    - {ref: EXACTERA-2025, title: "AI is transforming transfer pricing (sponsored advertising supplement, Q&A with Exactera's COO)", publisher: "The Tax Adviser (AICPA) / Exactera", type: vendor, url: "https://www.thetaxadviser.com/issues/2025/sep/ai-is-transforming-transfer-pricing/", date: "2025-08-31", access: full, locator: "Q&A 2"}
    - {ref: COMMENDA-2026, title: "Commenda vs Aibidia for Transfer Pricing (2026)", publisher: Commenda, type: vendor, url: "https://www.commenda.io/transfer-pricing/commenda-vs-aibidia", date: "2026-06", access: full, locator: "pricing lines (intercompany agreements USD 1,500)"}
    - {ref: BTAX-AFRICA-2026, title: "South Africa and Nigeria Drive AI-Enabled Transfer Pricing Audits", publisher: "Bloomberg Tax (authors from KPMG South Africa and Nigeria)", type: press, url: "https://news.bloomberglaw.com/tax-insights-and-commentary/south-africa-and-nigeria-drive-ai-enabled-transfer-pricing-audits", date: "2026-06-08", access: full, locator: "South Africa section (audit initiation and document review)"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "Q4"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "item 6"}
  last_reviewed: "2026-10-17"
  notes: >-
    The multi-agent version of the same agreement work is tax-transfer-pricing-11. The Commenda price list (agreements
    USD 1,500) is a vendor price as of June 2026; it states experts do the work and does not say how much is
    AI-generated.

- id: tax-transfer-pricing-11
  title: Multi-agent review of intercompany agreements and transactions across TP, VAT, withholding tax and customs
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    The same intercompany transaction or agreement has legal, TP, VAT, withholding-tax and customs consequences that
    different teams normally review separately and in sequence, so inconsistencies show up late.
  solution: >-
    A TPMinds International 2026 example (organisation not named in Aibidia's recap) used multi-agent AI workflows
    that review the legal, TP, VAT and withholding-tax implications at the same time before producing draft
    agreements. A sponsored Nexdigm article says multi-agent workflows can review a transaction's TP, VAT, withholding
    tax and customs implications at once and identify inconsistencies across reporting lines before they become audit
    issues.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: AIBIDIA-TPMINDS-2026}
  prerequisites:
    - "Policy, tax rules and templates the agents can reference"
    - "Clean data across ERPs, entities and agreements (ITR-NEXDIGM-2026)"
  risks_and_guardrails:
    - "Speakers at the same conference were reported as unanimous that AI enhances expertise but does not replace it, and that data quality, governance and human oversight remain fundamental (AIBIDIA-TPMINDS-2026)"
    - "Both sources are vendor-written (a sponsor's conference recap and a sponsored article) with no named organisation or result; treat as an unverified capability claim"
  human_checkpoints:
    - "Not stated for the conference example; Nexdigm says professionals decide the resolution of any inconsistency (ITR-NEXDIGM-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: C
  sources:
    - {ref: AIBIDIA-TPMINDS-2026, title: "TPMinds International 2026: Five Strategic Shifts in Transfer Pricing", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/tpminds-international-2026-five-strategic-shifts-in-transfer-pricing", date: "2026-06", access: full, locator: "theme 2 'AI Is Transitioning from Concept to Practical Tool' (multi-agent example)"}
    - {ref: ITR-NEXDIGM-2026, title: "Transfer pricing at the crossroads: disruption, data, and the decade ahead (sponsored)", publisher: "International Tax Review (Nexdigm)", type: vendor, url: "https://www.internationaltaxreview.com/article/2gxa3xiio1u5wu2o18y68/sponsored/transfer-pricing-at-the-crossroads-disruption-data-and-the-decade-ahead", date: "2026-09-21", access: full, locator: "paragraph on new generation of AI-powered TP platforms"}
  last_reviewed: "2026-10-17"
  notes: >-
    The ladder is 'delegate' because the described agents run a multi-step review and drafting outcome; the human
    checkpoints are not described, which is itself a probe for advisers. The VAT and customs parts overlap the
    indirect-tax module (tax-indirect-tax-15 for indirect-tax decision records).

- id: tax-transfer-pricing-12
  title: "Automated operational TP: intercompany price calculation, segmented P&Ls, invoicing and posting"
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [transaction-processing, data-reporting]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Kemira calculated TP manually across 62 legal entities in 40 countries, which was heavy work for the tax team,
    the finance team and local organisations.
  solution: >-
    A tailored operational TP tool automates segmented P&Ls and LRD (limited-risk distributor) fee, agency fee,
    service fee and royalty calculations plus prospective resale-minus pricing. It uses forecasting methods to create
    price lists, with robotics sending invoices and posting entries to SAP monthly. The tax team uses it for
    monitoring and insight.
  outcomes:
    - {lever: capacity, description: "Kemira reports the automation saved work hours across several functions", figure: "hundreds of work hours saved", measures: "Work hours saved across functions, as stated in the case study title and text; no baseline or period given", provenance: vendor-published, source_ref: AIBIDIA-KEMIRA-2026}
  prerequisites:
    - "Centralised business models and harmonised TP policies since the early 2010s (AIBIDIA-KEMIRA-2026)"
    - "One common SAP system in all but one operating country (AIBIDIA-KEMIRA-2026)"
    - "About a year of co-development (2020) before go-live in January 2021 (AIBIDIA-KEMIRA-2026)"
  risks_and_guardrails:
    - "The tool is sensitive to business-model changes (Kemira cites an APAC change and an SAP S/4HANA migration) and needs continued joint maintenance (AIBIDIA-KEMIRA-2026)"
    - "In the vendor survey, 60% still rely primarily on Excel, email and other manual processes for operational TP and only 7% formally monitor transfer prices monthly, so Kemira's setup is unusual (AIBIDIA-LEADERS-2026)"
  human_checkpoints:
    - "Monthly close review of results and unusual movements (AIBIDIA-OTP-2026, describing practice at an interviewee's prior employer, not Kemira)"
  role_evolution: >-
    Kemira's Head of Taxes says a small tax team depends on automation and that the team now focuses on value-adding
    work instead of searching for data and manual calculation (AIBIDIA-KEMIRA-2026).
  evidence_grade: B
  sources:
    - {ref: AIBIDIA-KEMIRA-2026, title: "How Kemira automates transfer pricing calculations and saves hundreds of working hours", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/case-studies/kemira-x-aibidia", date: "2026-10-17", access: full, locator: "sections 'Kemira - A pioneer in automation and robotics' and 'transformed the way'; page undated, retrieval date used"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 3"}
    - {ref: AIBIDIA-OTP-2026, title: "Connected, Controlled and Audit-ready: That's the Future of Operational Transfer Pricing (interview)", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/connected-controlled-and-audit-ready-thats-the-future-of-operational-transfer-pricing", date: "2026-07-03", access: full, locator: "monthly close cycle answer"}
  last_reviewed: "2026-10-17"
  notes: >-
    Rules-based automation plus robotics, not generative AI. Included because it is the clearest named operational TP
    deployment and shows the prerequisites AI features would sit on. Graded B because there is no quantified result
    beyond 'hundreds of hours'. Pillar Two interplay with operational TP is covered in the provision-pillar-two
    module.

- id: tax-transfer-pricing-13
  title: In-year monitoring of intercompany margins against policy ranges, with deviation flags
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    TP positions are usually set annually and tested after year end, so margin drift against policy is found late. In
    Aibidia's 2026 survey, 38% described operational TP as well defined and managed, 60% rely mainly on Excel, email
    and manual processes, only 7% formally monitor transfer prices monthly, and half report moderately or very
    significant year-end adjustments.
  solution: >-
    Plante Moran describes loading raw data into an AI tool to build simple dashboards that track margins against
    target ranges through the year, flag unusual transactions or deviations and highlight higher-risk jurisdictions.
    A TPMinds recap says organisations already deploy AI to monitor operational outcomes and flag audit risks in real
    time, without naming any. A sponsored Nexdigm piece calls this 'agentic monitoring', and a journal article
    reviewing the literature reports multinationals applying machine learning to operational TP monitoring and
    predictive compliance controls. A competitor's comparison page describes ERP-connected drift monitoring for its
    own service and attributes it to Aibidia's 'Aurora', which Aibidia itself markets as a research assistant
    (COMMENDA-2026).
  outcomes:
    - {lever: risk, description: "Share of surveyed teams with the underlying monitoring discipline today (the gap the use case targets, not a result of AI)", figure: "7% formally monitor monthly; 60% rely primarily on Excel, email and manual processes; half report moderately or very significant year-end adjustments", measures: "Respondents to Aibidia's 2026 survey (97 in-house tax professionals per one Aibidia page; sample size stated inconsistently)", provenance: vendor-published, source_ref: AIBIDIA-LEADERS-2026}
    - {lever: risk, description: "The Intertax article lists faster benchmarking and documentation, predictive compliance controls and more consistent policy application as opportunities drawn from the literature", figure: "none published", measures: "Literature review abstract; no figures", provenance: independent, source_ref: INTERTAX-SIVA-2026}
  prerequisites:
    - "Granular, centralised data and clear ownership of loads, exception review and sign-off (AIBIDIA-OTP-2026)"
    - "A calculation layer under any language model, because LLMs are strong with language and weak with numbers (AIBIDIA-WEBINAR-2026)"
    - "Tax, finance and IT coordination, which 68% of vendor-survey respondents rank among their top three operational TP obstacles (AIBIDIA-SOTP-2026)"
    - "KPMG Greece advises automated data collection, cloud platforms and real-time data access to compute transfer prices and identify risk areas (KPMG-GR-2026)"
  risks_and_guardrails:
    - "AI output is not audit-ready without expert review; untested analyses can fall short on rationale in an audit (PLANTEMORAN-2026)"
    - "Controls must show what data was used, what changed, who reviewed and who approved (AIBIDIA-OTP-2026)"
    - "Absence of year-end adjustments is not always reassuring, because the policy may no longer reflect operations (AIBIDIA-LEADERS-2026)"
    - "The Intertax author concludes AI is a net opportunity only as decision support under human-in-the-loop safeguards with explainability, audit trails and periodic bias review (INTERTAX-SIVA-2026)"
  human_checkpoints:
    - "TP team investigates flagged deviations and decides adjustments; controllers and finance own execution (AIBIDIA-LEADERS-2026; AIBIDIA-OTP-2026)"
  role_evolution: >-
    Participants described wanting a real-time view of margin against policy benchmarks so teams act before year-end
    corrections, and noted that TP professionals can identify risk but do not always control the commercial decisions
    that create exposure (AIBIDIA-LEADERS-2026). Nexdigm argues the work shifts from annual retrospective
    justification to continuous compliance; this is a sponsor's view (ITR-NEXDIGM-2026).
  evidence_grade: C
  sources:
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "sections 1 and 3 (policy versus operational reality)"}
    - {ref: PLANTEMORAN-2026, title: "Using AI in transfer pricing: Practical opportunities and pitfalls for growing companies", publisher: Plante Moran, type: firm, url: "https://plantemoran.com/explore-our-thinking/insight/2026/08/using-ai-in-transfer-pricing", date: "2026-08-05", access: full, locator: "item 'Monitoring results and flagging risk'"}
    - {ref: AIBIDIA-OTP-2026, title: "Connected, Controlled and Audit-ready: That's the Future of Operational Transfer Pricing (interview)", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/connected-controlled-and-audit-ready-thats-the-future-of-operational-transfer-pricing", date: "2026-07-03", access: full, locator: "answers on the monthly OTP process and controls"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "paragraph 'LLMs and numbers don't mix well'"}
    - {ref: AIBIDIA-TPMINDS-2026, title: "TPMinds International 2026: Five Strategic Shifts in Transfer Pricing", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/tpminds-international-2026-five-strategic-shifts-in-transfer-pricing", date: "2026-06", access: full, locator: "theme 2"}
    - {ref: AIBIDIA-SOTP-2026, title: "Aibidia Report 2026: The State of Transfer Pricing (landing page)", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/reports/2026-the-state-of-transfer-pricing", date: "2026", access: full, locator: "challenges chart"}
    - {ref: COMMENDA-2026, title: "Commenda vs Aibidia for Transfer Pricing (2026)", publisher: Commenda, type: vendor, url: "https://www.commenda.io/transfer-pricing/commenda-vs-aibidia", date: "2026-06", access: full, locator: "comparison table row on ERP monitoring"}
    - {ref: ITR-NEXDIGM-2026, title: "Transfer pricing at the crossroads: disruption, data, and the decade ahead (sponsored)", publisher: "International Tax Review (Nexdigm)", type: vendor, url: "https://www.internationaltaxreview.com/article/2gxa3xiio1u5wu2o18y68/sponsored/transfer-pricing-at-the-crossroads-disruption-data-and-the-decade-ahead", date: "2026-09-21", access: full, locator: "section 'When AI enters - on both sides of the table'"}
    - {ref: INTERTAX-SIVA-2026, title: "AI in Transfer Pricing: Risk or Opportunity? (Pramod Siva)", publisher: "Intertax 54(6/7)", type: academic, url: "https://kluwerlawonline.com/journalarticle/Intertax/54.6/TAXI2026050", date: "2026-06-01", access: full, locator: "abstract (full text paywalled)"}
    - {ref: KPMG-GR-2026, title: "Ensuring Robust, Relevant, and Fit-for-Purpose Transfer Pricing", publisher: KPMG Greece, type: firm, url: "https://kpmg.com/gr/en/insights/2026/03/ensuring-robust-relevant-and-fit-for-purpose-transfer-pricing.html", date: "2026-03-02", access: full, locator: "closing recommendations paragraph"}
  last_reviewed: "2026-10-17"
  notes: >-
    No named deployment of AI-based monitoring; Kemira (tax-transfer-pricing-12) is the named non-AI precedent. Kept
    at 'augment', not 'automate', because every source leaves the decision on a flag with the TP team.

- id: tax-transfer-pricing-14
  title: Connected TP knowledge model linking policies, agreements, financials and evidence, with flagged inconsistencies
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [data-reporting, review-assurance, expert-judgment]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Policies, agreements, benchmarks, financial results, documentation and audit history sit in different systems and
    formats, so showing why a position is defensible needs extensive manual investigation.
  solution: >-
    Aibidia's TP Intelligence reads TP documents and data into a connected model, lets teams ask questions in natural
    language, flags inconsistencies between what is documented and what happened, estimates the financial impact of
    risks and traces findings to source evidence. Audit defence is the first use. A guided preview on a fictional
    multinational is open, and the first release is planned for December 2026. In a Helsinki demonstration the system
    identified and quantified a potential risk in one entity, linked it to the supporting agreement and proposed an
    action.
  outcomes:
    - {lever: risk, description: "Potential risk quantified in a vendor demonstration; not a client result", figure: "EUR 4.8 million potential risk in one entity (demo)", measures: "Output of a vendor demonstration at a Helsinki briefing; the data behind the demo is not stated. The later public preview uses a fictional group and sample data (AIBIDIA-TPINTEL-2026)", provenance: vendor-published, source_ref: AIBIDIA-LEADERS-2026}
  prerequisites:
    - "Connected, structured source material; only 22% say their TP data is clean enough for AI without manual work (AIBIDIA-TPINTEL-2026)"
    - "Domain-specific logic, guardrails and traceability to source (AIBIDIA-LEADERS-2026)"
    - "A step-by-step build; one-shot end-to-end agents are not expected on the first attempt (AIBIDIA-WEBINAR-2026)"
  risks_and_guardrails:
    - "The vendor says the goal is not autonomous AI making unsupported decisions (AIBIDIA-LEADERS-2026)"
    - "Announced product, not yet released (AIBIDIA-TPINTEL-2026)"
  human_checkpoints:
    - "Controller, reviewer or auditor follows each flag back to its source evidence (AIBIDIA-LEADERS-2026)"
  role_evolution: >-
    The vendor frames the shift as moving TP teams from completing tasks to controlling outcomes (AIBIDIA-TPINTEL-2026).
    Speakers say teams should decide where to build enduring internal understanding and where to rely on technology
    or external expertise (AIBIDIA-LEADERS-2026).
  evidence_grade: C
  sources:
    - {ref: AIBIDIA-TPINTEL-2026, title: "Aibidia introduces TP Intelligence, a new AI system of intelligence for transfer pricing", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/news/aibidia-introduces-tp-intelligence-a-new-ai-system-of-intelligence-for-transfer-pricing", date: "2026-10-15", access: full, locator: "paragraphs 3-9 (launch planned December 2026)"}
