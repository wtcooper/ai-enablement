- id: tax-transfer-pricing-07
  title: First-draft local file, master file and TP report narratives with expert review
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Local files (per-country TP reports) and master files (the group overview) for many entities repeat similar
    narrative sections, are country-specific and are updated every year. US taxpayers have 30 days to hand over
    documentation on IRS request, and an Exactera speaker called 'check-the-box' documents that lack substance, use
    generic or copied company descriptions or rely on outdated benchmarks 'the most common mistake'.
  solution: >-
    The professional supplies facts and context, a GenAI tool drafts the narrative (entity descriptions, industry
    and economic analysis, transaction-flow summaries), and the expert reviews, edits and approves. Participants at
    Aibidia briefings said they use Microsoft Copilot, ChatGPT and Claude to draft and review documentation. BDO
    Canada lists drafting intercompany agreements, summarising transaction flows and preparing functional analyses
    among current uses, and employers now list AI skills for TP documentation in job postings.
  outcomes:
    - {lever: quality, description: "BDO Canada reports recurring gaps in AI-generated TP outputs: functional profiles not reflecting operational reality, unsupported method selection, shallow benchmarking, oversimplified intangibles and DEMPE treatment, and documentation that looks complete but lacks audit-ready support", figure: "none published", measures: "Qualitative observation; no sample or rate", provenance: self-reported, source_ref: BDO-AIGOV-2026}
    - {lever: speed, description: "None published for AI drafting of TP narratives", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: AIBIDIA-WEBINAR-2026}
  prerequisites:
    - "Documented facts, functional profiles, intercompany agreements and policies the AI can be given, and implicit expert knowledge written down as reusable context (KPMG-KITP-2026)"
    - "Standardised, accessible data, mature internal TP processes, and functional analyses and agreements already in order (the 'four pillars', AIBIDIA-WEBINAR-2026)"
    - "A private or secured GenAI set-up (IBFD-ITPJ-2025); enterprise-approved AI only, with no client data on unsecured sites (IRS-OPR-2026, item 6)"
    - "Data supplied to the IRS in a functional format that preserves calculations, with a clear intercompany transaction summary (IRS-TPFAQ-2026, Q5 and Q6)"
  risks_and_guardrails:
    - "The US net adjustment penalty is avoided only if section 6662(e) documentation is adequate and timely, and the IRS can still find it inadequate (IRS-TPFAQ-2026, preamble); a Grant Thornton author reports the IRS asserting penalties where it judged documentation insufficient (BTAX-GT6662-2024). No source tests how AI-drafted documentation fares under these rules"
    - "A plausible answer is not enough in TP, because documentation forms the basis of an audit defence; output must be traceable to evidence (AIBIDIA-WEBINAR-2026)"
    - "KPMG Germany says benchmarking narratives should flag assumptions and open questions (KPMG-KITP-2026)"
    - "Written advice must rest on reasonable assumptions and verified inputs; opaque logic may make reliance unreasonable (IRS-OPR-2026, item 5)"
    - "EU AI Act and data protection treatment of AI in TP is described as unsettled (INTERTAX-SIVA-2026, abstract)"
  human_checkpoints:
    - "An accountable professional validates every AI output before it becomes part of the record (AIBIDIA-WEBINAR-2026)"
    - "Functional facts checked against how decisions and risks are actually handled, not contract wording (BDO-AIGOV-2026)"
    - "Sign-off on method selection and benchmarking"
  role_evolution: >-
    Twilio's TP manager posting asks the hire to lead integrating AI into the TP workflow (JOB-TWILIO-2026); Adobe's
    senior analyst posting lists applying AI tools to research, benchmarking, drafting and review of TP
    documentation (JOB-ADOBE-2026); dsm-firmenich asks for strong interest in tax technology, automation and AI
    (JOB-DSM-2026). BDO says people remain accountable for the judgment that makes documentation defensible
    (BDO-AIGOV-2026). Andersen asks who in a company will own AI-assisted documentation if the preparer is not a TP
    specialist (ANDERSEN-AI-2026).
  evidence_grade: C
  sources:
    - {ref: BDO-AIGOV-2026, title: "AI governance in transfer pricing: Is your documentation CRA-ready?", publisher: BDO Canada, type: firm, url: "https://www.bdo.ca/insights/ai-governance-in-transfer-pricing-how-to-create-defensible-documentation", date: "2026-08-20", access: full, locator: "'How is AI being used' and 'recurring gaps' lists"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "paragraph 'Documentation and narrative drafting'; 'Four Pillars for Readiness'"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 4"}
    - {ref: KPMG-KITP-2026, title: "AI in transfer pricing: Why even the best prompt isn't enough", publisher: KPMG Germany, type: firm, url: "https://kpmg.com/de/en/insights/digital-transformation/artificial-intelligence/ki-im-transfer-pricing.html", date: "2026-10-05", access: full, locator: "paragraphs on context engineering and benchmarking narratives"}
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: KPMG US, type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph"}
