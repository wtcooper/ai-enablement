  last_reviewed: "2026-10-17"
  notes: >-
    Capability claims and scheduled panels only; no product named for this specific function and no accuracy figure.
    Reptune says authorities are moving to near real-time data and AI to assess TP continuously (vendor marketing).
    Authority-side selection itself is tax-controversy-13 (IRS) and tax-controversy-15 (Hungary and other
    authorities). Overlaps: tax-controversy-05 (EY TP Doc Insights checks TP documentation against public data) and
    tax-compliance-corporate-13 (pre-filing audit-risk screening of returns).

- id: tax-transfer-pricing-16
  title: "Audit defence: drafting and stress-testing responses to tax-authority queries from prior documentation"
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [document-production, research-synthesis, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Audit and controversy responses need years of prior files read and consistent answers formulated under deadline.
    The vendor's 2025 survey says half of respondents spend 50-200 hours on audit response and half report costs of
    USD 50,000-500,000. A PwC TP principal says examiners now ask about intent and business purpose, which makes
    contemporaneous records important.
  solution: >-
    KPMG US says GenAI can contribute to TP controversy by reviewing historical documents and formulating responses.
    Participants at Aibidia briefings said they use general AI tools to stress-test responses to tax authorities. The
    PwC Singapore example of gathering information to explain margin changes was framed as support when engaging with
    authorities. The IRS says organised documentation with a summary of intercompany transactions helps examiners
    focus and can improve the chance of issue deselection.
  outcomes:
    - {lever: cost, description: "Size of the problem being addressed, not a result of AI", figure: "half of respondents spend 50-200 hours on audit response; an equal share report costs of USD 50,000-500,000", measures: "Shares of respondents to Aibidia's 2025 industry report; the vendor says these rose from a third and 39% the prior year", provenance: vendor-published, source_ref: AIBIDIA-SOTP-2025}
  prerequisites:
    - "Contemporaneous documentation and a clean data trail (AIBIDIA-OECD-2026; TR-CHECKPOINT-2026)"
    - "Organised historical files and calculations kept in functional formats (IRS-TPFAQ-2026, Q5)"
  risks_and_guardrails:
    - "The IRS LB&I treaty and TP operations director said AI should support but not replace legal, economic and factual judgment (IRS-LBI-TP-2026)"
    - "Taxpayers using AI for benchmarking or other analysis must still show the underlying work, with human judgment and oversight (TR-CHECKPOINT-2026)"
    - "Gaps in AI-assisted documentation can surface once the authority asks deeper questions (BDO-AIGOV-2026)"
    - "Filings need verified facts and citations (IRS-OPR-2026, items 1 and 5); in Clinco the Tax Court found three of four cited cases likely LLM hallucinations and issued a warning, not formal sanctions (TAXCT-CLINCO-2026)"
  human_checkpoints:
    - "Controversy lead reviews every statement of fact and every citation before submission"
    - "Accountable professional approves the submission"
  role_evolution: >-
    At a vendor-hosted London event, some in-house professionals said they still do much of the analysis while paying
    advisors mainly for external validation and risk absorption (AIBIDIA-LEADERS-2026).
  evidence_grade: C
  sources:
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: KPMG US, type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph (controversy sentence)"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 4 task list and section 1"}
    - {ref: AIBIDIA-SOTP-2025, title: "Aibidia Releases Industry Report on Transfer Pricing and Welcomes Former Thomson Reuters CEO & President to Board of Directors", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/news/aibidia-releases-industry-report-on-transfer-pricing-and-welcomes-former-thomson-reuters-ceo-president-to-board-of-directors", date: "2025-09-09", access: full, locator: "paragraph 'Transfer Pricing Under Pressure'"}
    - {ref: DDTC-WUTA-2026, title: "Challenges in Transfer Pricing Benchmarking Changes in the AI Era (report from the WU-TA Advanced Transfer Pricing Programme 2026, Singapore)", publisher: DDTCNews, type: press, url: "https://news.ddtc.co.id/en/insight/1822922/challenges-in-transfer-pricing-benchmarking-changes-in-the-ai-era", date: "2026-10-01", access: full, locator: "Jimit Parikh paragraph on glove manufacturing"}
