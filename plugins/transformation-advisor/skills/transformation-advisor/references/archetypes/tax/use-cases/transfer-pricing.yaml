# Use cases: tax / transfer-pricing
# Synthesised 2026-10-17 from the wave-2 practice, discourse and governance deep dives and the tax landscape scan
# (48 candidate entries in, 22 out). Source refs are canonical keys: where the angles used different keys for the
# same document, one key is kept (for example AIBIDIA-LEADERS-2026 = the discourse angle's AIBIDIA-STATETP-2026;
# BDO-AIGOV-2026 = BDO-2026 / BDO-CA-2026; DDTC-WUTA-2026 = DDTC-PWCSG-2026; WTS-HU-2026 = WTS-NAV-2026;
# AIBIDIA-OTP-2026 = AIBIDIA-OTPBLOG-2026). Almost every figure is vendor-published or a speaker's own claim; no
# error rate, override rate, parallel run or independent test of AI in transfer pricing (TP) was found. Aibidia
# case-study and product pages are undated; their date is the retrieval date (2026-10-17). Overlaps with other tax
# modules are cross-referenced by id in notes. Tax-authority AI for selecting TP audits (Hungary, IRS models, HMRC
# ICTS, South Africa and Nigeria) is not repeated here: see tax-controversy-13 and tax-controversy-15.

- id: tax-transfer-pricing-01
  title: Grounded TP research assistant for legislation, guidance, deadlines and local requirements
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Central TP teams cover dozens of jurisdictions, local subsidiaries touch TP about once a year, and regulations,
    guidelines and case law change constantly. General chatbots give answers without clear sourcing.
  solution: >-
    A question-and-answer assistant retrieves from a curated TP content set and returns cited answers on legislation,
    benchmarking guidance and compliance requirements. TP Aurora (Aibidia with IBFD data) was announced as available
    to all from 22 May 2025 with a free trial, and is positioned for heads of tax, TP managers and finance
    controllers as an alternative to general AI tools. Webinar speakers describe an always-on assistant for checking
    definitions, deadlines and local requirements. KPMG US lists scrutinising global tax and TP developments as a
    GenAI use.
  outcomes:
    - {lever: speed, description: "Vendor claims the assistant cuts research time and answers in seconds", figure: "90% less research time (vendor claim)", measures: "Product page states 'Cut research time by 90%'; baseline and method not given", provenance: vendor-published, source_ref: AIBIDIA-AURORA-2026}
  prerequisites:
    - "Licensed, up-to-date curated content as the grounding source (AIBIDIA-IBFD-2025)"
    - "Users who can check the cited source"
  risks_and_guardrails:
    - "Answers should be traceable to a source; practitioners say general model answers lack traceability (AIBIDIA-WEBINAR-2026)"
    - "Consumer-facing AI TP tools may oversimplify complex rules (PLANTEMORAN-2026)"
    - "Credibility and security of AI-generated outputs are the stated challenges in the IBFD journal article (IBFD-ITPJ-2025, abstract)"
    - "US practitioners must understand AI limits and verify citations (IRS-OPR-2026, items 1 and 3)"
    - "No independent accuracy test of a TP-specific assistant was found"
  human_checkpoints:
    - "User opens the cited source before relying on an answer"
  role_evolution: >-
    One webinar speaker valued quick checks of definitions, deadlines and local requirements; another described an
    always-on research assistant that brings every user up to speed without burdening the central team
    (AIBIDIA-WEBINAR-2026).
  evidence_grade: C
  sources:
    - {ref: AIBIDIA-IBFD-2025, title: "Aibidia and IBFD Launch TP Aurora: A Groundbreaking AI Transfer Pricing Research Assistant", publisher: "IBFD / Aibidia", type: vendor, url: "https://www.ibfd.org/news/aibidia-and-ibfd-launch-tp-aurora-groundbreaking-ai-transfer-pricing-research-assistant", date: "2025-05-22", access: full, locator: "paragraphs 1-6 and 'When is TP Aurora available?'"}
    - {ref: AIBIDIA-AURORA-2026, title: "TP Aurora: Your AI Research Assistant, Built on Trusted IBFD Data", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/tp-aurora", date: "2026-10-17", access: full, locator: "hero text and 'Why settle for ChatGPT' section; page undated, retrieval date used"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "paragraph 'Research and staying current'"}
    - {ref: AIBIDIA-SOTP-2026, title: "Aibidia Report 2026: The State of Transfer Pricing (landing page)", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/reports/2026-the-state-of-transfer-pricing", date: "2026", access: full, locator: "2025-edition summary on practical AI adoption"}
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: KPMG US, type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph"}
    - {ref: PLANTEMORAN-2026, title: "Using AI in transfer pricing: Practical opportunities and pitfalls for growing companies", publisher: Plante Moran, type: firm, url: "https://plantemoran.com/explore-our-thinking/insight/2026/08/using-ai-in-transfer-pricing", date: "2026-08-05", access: full, locator: "section 'Understanding AI's limits'"}
    - {ref: IBFD-ITPJ-2025, title: "Operationalizing Transfer Pricing with Generative Artificial Intelligence: Practical Applications and Challenges (D. Olzhabayeva)", publisher: "IBFD, International Transfer Pricing Journal 32(6)", type: academic, url: "https://shop.ibfd.org/journal/operationalizing-transfer-pricing-generative-artificial-intelligence-practical-applications", date: "2025-09-26", access: full, locator: "overview (abstract only; article paywalled)"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "items 1 and 3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Maturity 'announced' because no named customer use was found. The vendor's 2025 report page says practical AI
    adoption is in country-specific documentation requirements, researching TP methods, comparing jurisdictional rules
    and tracking compliance timelines (AIBIDIA-SOTP-2026). General tax research assistants are
    tax-research-advisory-01.

- id: tax-transfer-pricing-02
  title: General-purpose AI assistants used by in-house TP staff for drafting, research and stress-testing
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Small TP teams carry growing complexity with limited headcount, and routine drafting, research and data
    formatting take time away from analysis.
  solution: >-
    Individual staff use Microsoft Copilot, ChatGPT and Claude for drafting and reviewing documentation, research and
    idea development, formatting and summarising data, and stress-testing responses to tax authorities. Use is
    task-based and not integrated with company TP data.
  outcomes:
    - {lever: capacity, description: "Share of surveyed TP professionals using AI at all", figure: "93% use AI in some form; no-use share fell from 36% to 7% in one year", measures: "Respondents to Aibidia's State of Transfer Pricing 2026 survey (sample stated as 97 in-house tax professionals on one page and 138 professionals on another)", provenance: vendor-published, source_ref: AIBIDIA-LEADERS-2026}
    - {lever: capacity, description: "Share reporting regular AI use across TP processes", figure: "37% in 2026, up from 18% in 2025", measures: "Respondents reporting regular AI use across TP processes, per the vendor's report page", provenance: vendor-published, source_ref: AIBIDIA-SOTP-2026}
  prerequisites:
    - "Approved AI tools (the sources do not say how many teams have them)"
    - "Staff able to check outputs against agreements, policies and regulation"
  risks_and_guardrails:
    - "Participants raised hallucinations, overconfident answers and general models' inability to interpret company-specific TP data without context (AIBIDIA-LEADERS-2026)"
    - "KPMG Germany describes a 'jagged frontier': good results on one task and failure on a similar one, so teams must decide which steps AI supports (KPMG-KITP-2026)"
    - "Andersen Australia found a general chatbot's answers on Australian documentation requirements accurate but generic, leaving relevance and defensibility to the user (ANDERSEN-AI-2026)"
  human_checkpoints:
    - "An accountable professional validates every AI output before it becomes part of the record ('human oversight architecture', AIBIDIA-WEBINAR-2026)"
  role_evolution: >-
    A webinar speaker said AI will not take jobs but someone using AI might (AIBIDIA-WEBINAR-2026). KPMG Germany
    frames the choice of which steps AI supports as a management task (KPMG-KITP-2026).
  evidence_grade: C
  sources:
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 4 'AI adoption is accelerating but integration is lagging'"}
    - {ref: AIBIDIA-SOTP-2026, title: "Aibidia Report 2026: The State of Transfer Pricing (landing page)", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/reports/2026-the-state-of-transfer-pricing", date: "2026", access: full, locator: "'THE AI SHIFT' block"}
    - {ref: KPMG-KITP-2026, title: "AI in transfer pricing: Why even the best prompt isn't enough", publisher: KPMG Germany, type: firm, url: "https://kpmg.com/de/en/insights/digital-transformation/artificial-intelligence/ki-im-transfer-pricing.html", date: "2026-10-05", access: full, locator: "paragraphs 1-6"}
    - {ref: ANDERSEN-AI-2026, title: "AI in Transfer Pricing: Insight, Illusion and Risk", publisher: Andersen Australia, type: firm, url: "https://au.andersen.com/ai-in-transfer-pricing/", date: "2026-02-17", access: full, locator: "section 'Can AI Accurately Identify Australian Documentation Requirements?'"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "sections on obstacles and 'AI Won't Replace You'"}
  last_reviewed: "2026-10-17"
  notes: >-
    No named organization. The two Aibidia pages give different sample sizes (138 vs 97), and the earlier edition
    (140+ respondents) said roughly 40% described use as minimal; definitions differ, so treat the figures as
    indicative. Similar use in indirect tax: tax-indirect-tax-20. In-house research triage with general assistants
    across tax is tax-research-advisory-06.

- id: tax-transfer-pricing-03
  title: Self-service TP answers for non-specialists, with escalation to the TP team
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [client-interaction, research-synthesis]
  pattern: service-agent-escalation
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    TP teams are small, local finance contacts touch TP rarely, and recurring policy questions pull specialists away
    from analysis. Non-specialist finance staff and clients want a first answer before engaging a specialist.
  solution: >-
    Deloitte Poland offers a dedicated GenAI chatbot built on the organisation's own TP documentation, policies,
    guidelines and regulations. It answers simpler questions from stored materials and routes complex ones to a TP
    specialist, and the TP team can monitor questions to spot problem areas. Webinar speakers describe AI as a
    sparring partner for local contacts updating entity descriptions. Separately, businesses query general AI
    platforms about TP requirements; Andersen Australia tested one on Australian documentation requirements and found
    the answers well structured but warned the tool cannot own the conclusion.
  outcomes:
    - {lever: capacity, description: "none published for the Deloitte chatbot", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: DELOITTE-PL-2025}
    - {lever: experience, description: "Andersen reports that over six months more businesses turned to AI for technical expertise, and that an assistant produced a structured, risk-differentiated outline of documentation requirements", figure: "none published", measures: "Single-test transcript and firm observation; no sample", provenance: self-reported, source_ref: ANDERSEN-AI-2026}
  prerequisites:
    - "Current TP policy and guidance documents; Deloitte offers to help revise outdated policies (DELOITTE-PL-2025)"
    - "Data kept inside the organisation (DELOITTE-PL-2025)"
    - "A named owner who interrogates assumptions and signs off (ANDERSEN-AI-2026)"
  risks_and_guardrails:
    - "Deloitte says hallucinations can be limited by directing questions with no available answer to a specialist (DELOITTE-PL-2025)"
    - "False confidence: detailed, well-structured answers may be taken as accurate and definitive (ANDERSEN-AI-2026)"
    - "Possible oversight of subtle risk indicators or fact-specific misapplication (ANDERSEN-AI-2026)"
  human_checkpoints:
    - "Specialist handles escalated questions (DELOITTE-PL-2025)"
    - "Specialist review before any position or document is relied on"
  role_evolution: >-
    The TP team monitors inbound questions to identify problem areas for other tax teams and departments
    (DELOITTE-PL-2025). Andersen sees AI raising baseline client knowledge and the quality of questions put to
    advisers (ANDERSEN-AI-2026). Twilio's TP manager posting asks the hire to build self-service intercompany models
    (JOB-TWILIO-2026).
  evidence_grade: C
  sources:
    - {ref: DELOITTE-PL-2025, title: "A dedicated chatbot for your organisation: a modern GenAI solution for transfer pricing", publisher: Deloitte Poland, type: firm, url: "https://www.deloitte.com/pl/pl/services/tax/services/a-dedicated-chatbot-for-your-organisation-a-modern-GenAI-solution-for-transfer-pricing.html", date: "2025-06-02", access: full, locator: "body paragraphs 2-6"}
    - {ref: ANDERSEN-AI-2026, title: "AI in Transfer Pricing: Insight, Illusion and Risk", publisher: Andersen Australia, type: firm, url: "https://au.andersen.com/ai-in-transfer-pricing/", date: "2026-02-17", access: full, locator: "sections 'The Rise of AI-Assisted Expertise' and 'The Execution Gap'"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "paragraph 'Acting as a sparring partner for non-specialists'"}
    - {ref: JOB-TWILIO-2026, title: "Transfer Pricing Manager (Twilio)", publisher: "Twilio via CV Keskus", type: job-posting, url: "https://www.cvkeskus.ee/transfer-pricing-manager-kodukontori-voimalusega-twilio-estonia-ou-1048858", date: "2026-08-14", access: full, locator: "responsibilities bullet 1"}
  last_reviewed: "2026-10-17"
  notes: >-
    Combines an internal escalation chatbot with business-side use of general assistants: both give non-specialists a
    first answer before a specialist. Deloitte's page is a service offering with no client named; Andersen's test is a
    single conversation. Overlap: tax-research-advisory-17 (client-facing assistant that escalates to an adviser).

- id: tax-transfer-pricing-04
  title: AI-assisted aggregation and standardisation of intercompany data from several ERPs
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Year-end TP analysis is a scramble to pull, reconcile and standardise data from disconnected systems. In
    Aibidia's 2026 survey, 79% spend more than 10% of team time sourcing, cleaning and formatting data, 21% at least
    half, and nearly half operate four or more ERP or financial reporting systems.
  solution: >-
    Plante Moran says AI can aggregate information from several accounting and ERP platforms into a consistent
    format, reducing manual spreadsheet work without heavy IT investment. Webinar speakers say fragmented or manual
    data should be standardised first. Fortum's transaction-data pipeline (tax-transfer-pricing-09) is the named
    non-AI precedent.
  outcomes:
    - {lever: capacity, description: "none published for the AI approach", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: PLANTEMORAN-2026}
  prerequisites:
    - "Shared definitions and clear data ownership across tax, finance, controlling, IT and local teams (AIBIDIA-LEADERS-2026)"
  risks_and_guardrails:
    - "Only 22% of survey respondents believe their TP data is structured and clean enough for AI to use without manual intervention (AIBIDIA-LEADERS-2026)"
    - "Output reliability depends on input quality; advisers should review the AI input process (PLANTEMORAN-2026)"
    - "Vendor security practices warrant evaluation before sensitive financial data is shared (PLANTEMORAN-2026)"
  human_checkpoints:
    - "TP team or advisers review how inputs were prepared (PLANTEMORAN-2026)"
    - "Reconciliation to ledger and consolidated figures"
  role_evolution: >-
    The survey write-up says highly skilled TP professionals spend time reconstructing context instead of
    interpreting it (AIBIDIA-LEADERS-2026).
  evidence_grade: C
  sources:
    - {ref: PLANTEMORAN-2026, title: "Using AI in transfer pricing: Practical opportunities and pitfalls for growing companies", publisher: Plante Moran, type: firm, url: "https://plantemoran.com/explore-our-thinking/insight/2026/08/using-ai-in-transfer-pricing", date: "2026-08-05", access: full, locator: "item 'Aggregation and standardization of data'"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 2 (data wrangling) and section 4"}
    - {ref: AIBIDIA-WEBINAR-2026, title: "AI in Transfer Pricing: What's Working, What's Not, and What's Next", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/ai-in-transfer-pricing-whats-working-whats-not-and-whats-next", date: "2026-06", access: full, locator: "'The Challenges Are Real', paragraph 'Data quality is make-or-break'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Maturity 'emerging': the only support for AI doing the aggregation is one firm article. Practitioners treat data
    readiness as a prerequisite for AI more than a result of it. Data platforms in general belong to the
    tax-data-technology module. The general tax data layer is tax-data-technology-01.

- id: tax-transfer-pricing-05
  title: AI-drafted functional and industry analysis, including DEMPE support
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Functional, asset and risk analysis, DEMPE assessment of intangibles (who performs development, enhancement,
    maintenance, protection and exploitation) and industry analysis depend on interviews, documents and many outside
    sources, and are the parts of a TP file authorities most often probe.
  solution: >-
    The practitioner has the model gather and analyse information from various websites to explain commercial
    factors behind margin changes; the PwC Singapore example was the surge in glove-manufacturing margins during the
    pandemic, and the output was said to be usable when engaging with tax authorities. KPMG US says GenAI can
    automate the industry and functional analyses in TP documentation. BDO Canada lists functional analyses among
    current AI uses and says AI cannot determine whether arrangements reflect practice.
  outcomes:
    - {lever: quality, description: "BDO Canada says AI can draft documentation that aligns with contractual arrangements but cannot determine whether they reflect where key functions, risks and decisions sit in practice; it names tech, life sciences and manufacturing as sectors where the gap is likely to matter", figure: "none published", measures: "Qualitative statement; no sample", provenance: self-reported, source_ref: BDO-AIGOV-2026}
  prerequisites:
    - "Operational facts gathered from the business, not only contracts (BDO-AIGOV-2026)"
    - "Intercompany agreements and risk allocation that agree with the functional analysis; the IRS names inconsistency between risk analysis and agreements as a documentation weakness (IRS-TPFAQ-2026, Q4)"
    - "Detailed instructions to the model (DDTC-WUTA-2026)"
  risks_and_guardrails:
    - "Generic functional profiles that mirror contract form rather than operational reality (BDO-AIGOV-2026)"
    - "An AI system that misses one relevant factor may systematically mischaracterise legitimate arrangements; KPMG authors wrote this about authority-side AI (BTAX-AFRICA-2026)"
    - "A conference speaker cited an Italian tax court case where a draft decision was produced with AI without adequate review (case not identified) (DDTC-WUTA-2026)"
    - "Hallucination and wrong-prompt risk were named for large language models (DDTC-WUTA-2026)"
  human_checkpoints:
    - "TP professional validates the functional profile with business interviews"
    - "DEMPE conclusions reviewed by a senior practitioner"
    - "Human supervision, risk assessment and quality clean-up of AI draft analyses (DDTC-WUTA-2026)"
  role_evolution: >-
    A P&G head of tax likened AI to a junior associate whose drafts need supervision, risk assessment and quality
    clean-up (DDTC-WUTA-2026).
  evidence_grade: C
  sources:
    - {ref: DDTC-WUTA-2026, title: "Challenges in Transfer Pricing Benchmarking Changes in the AI Era (report from the WU-TA Advanced Transfer Pricing Programme 2026, Singapore)", publisher: DDTCNews, type: press, url: "https://news.ddtc.co.id/en/insight/1822922/challenges-in-transfer-pricing-benchmarking-changes-in-the-ai-era", date: "2026-10-01", access: full, locator: "Jimit Parikh paragraphs (glove manufacturing); fireside chat (Italian case; junior-associate analogy)"}
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: KPMG US, type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph"}
    - {ref: BDO-AIGOV-2026, title: "AI governance in transfer pricing: Is your documentation CRA-ready?", publisher: BDO Canada, type: firm, url: "https://www.bdo.ca/insights/ai-governance-in-transfer-pricing-how-to-create-defensible-documentation", date: "2026-08-20", access: full, locator: "'How is AI being used' list and 'Industry lens' section (read via text mirror)"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "Q4"}
    - {ref: BTAX-AFRICA-2026, title: "South Africa and Nigeria Drive AI-Enabled Transfer Pricing Audits", publisher: "Bloomberg Tax (authors from KPMG South Africa and Nigeria)", type: press, url: "https://news.bloomberglaw.com/tax-insights-and-commentary/south-africa-and-nigeria-drive-ai-enabled-transfer-pricing-audits", date: "2026-06-08", access: full, locator: "'Emerging AI dilemma' section"}
  last_reviewed: "2026-10-17"
  notes: >-
    Combines industry research with functional analysis. One named illustrative example from a conference report, a
    firm claim and a firm's list of uses; no figure.

- id: tax-transfer-pricing-06
  title: AI-assisted comparables search, screening and benchmarking draft
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [research-synthesis, data-reporting, document-production]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Benchmarking (finding independent companies or deals to set an arm's-length range) means searching databases or
    company websites one by one, screening on functional criteria, documenting each accept or reject decision,
    calculating ranges and writing the report. It takes hours or days.
  solution: >-
    The practitioner gives the model detailed screening instructions (one example given: companies that hold no
    intangibles such as brands or IP); the model gathers information from many sources at once and returns a
    candidate list, and the practitioner then runs recognised databases, a documented screen and comparability
    judgment. Products turn a prompt or functional profile into a search strategy, accept/reject justifications,
    ranges and a draft report: RoyaltyRange CompID AI (company comparables) and Royalty AI (royalty rates), and
    Exactera ExactMatch (ranking by functional profile rather than industry codes alone). A CIAT working paper gives
    the author's own example of a custom ChatGPT model reading a listed company's 10-K for comparability analysis.
  outcomes:
    - {lever: speed, description: "A PwC Singapore senior manager said analysis that once took up to 100 hours of manual work can, under certain conditions, be done in about 30 minutes", figure: "up to 100 hours to about 30 minutes", measures: "Hours of manual work for 'analysis' at stages from modelling to value-chain work, reported by DDTC from a conference talk; conditions, sample and method not stated; not specific to comparables searches", provenance: self-reported, source_ref: DDTC-WUTA-2026}
    - {lever: capacity, description: "A PwC Singapore TP partner said AI may complete approximately 80% of the work in comparability analysis that has historically consumed practitioners' time", figure: "approximately 80% (stated as 'may')", measures: "Share of comparability-analysis work; an opinion at a conference, not a measurement", provenance: self-reported, source_ref: DDTC-WUTA-2026}
    - {lever: speed, description: "Vendor claims the full benchmarking process runs in minutes", figure: "benchmarking 'in minutes' (vendor claim)", measures: "Vendor marketing statement; no study or customer cited", provenance: vendor-published, source_ref: ROYALTYRANGE-2026}
    - {lever: quality, description: "BDO Canada reports AI benchmarking outputs that lack depth, screening rationale or adjustments", figure: "none published", measures: "Qualitative observation of recurring gaps; no denominator", provenance: self-reported, source_ref: BDO-AIGOV-2026}
  prerequisites:
    - "Good data; the PwC partner's rule is that AI is good if the data is good (DDTC-WUTA-2026)"
    - "Licensed company-financial or royalty databases and a documented screening process (PLANTEMORAN-2026)"
    - "A secure or closed AI environment for confidential company data (DDTC-WUTA-2026)"
  risks_and_guardrails:
    - "An AI-generated list of comparables is a useful first pass but unlikely on its own to meet tax authority standards (PLANTEMORAN-2026)"
    - "The IRS expects documentation to address all comparability criteria, the effect of risk and function differences, and reasoned adjustments (IRS-TPFAQ-2026, Q4); inference, not stated by the IRS: an AI screen that cannot show why candidates were accepted or rejected would struggle to meet that expectation"
    - "An IRS LB&I official said AI can support but should not replace judgment and that the IRS wants to see the formulas (IRS-LBI-TP-2026); a PwC TP principal said the IRS expects to see the underlying work (TR-CHECKPOINT-2026)"
    - "US practitioners remain responsible for due diligence and for understanding AI limits under Circular 230 sections 10.22 and 10.35 (IRS-OPR-2026)"
    - "Vendors say steps must be visible, adjustable, repeatable and automatically documented because decisions must be justifiable to tax authorities (ROYALTYRANGE-2026)"
  human_checkpoints:
    - "Practitioner approves the search strategy, screening criteria and each rejection"
    - "Practitioner reviews comparability adjustments and the final arm's-length (interquartile) range"
  role_evolution: >-
    PwC Singapore speakers said the remaining crucial 20% still needs human perspective (DDTC-WUTA-2026). A webinar
    participant said 'the strength of the AI is data, the strength of the transfer pricing and tax professional is
    judgment' (AIBIDIA-WEBINAR-2026).
  evidence_grade: C
