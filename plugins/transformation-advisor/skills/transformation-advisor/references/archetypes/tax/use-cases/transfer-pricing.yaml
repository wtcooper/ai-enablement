    - {ref: AIBIDIA-SOTP-2026, title: "Aibidia Report 2026: The State of Transfer Pricing (landing page)", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/reports/2026-the-state-of-transfer-pricing", date: "2026", access: full, locator: "'THE AI SHIFT' block (expectation of AI first drafts)"}
    - {ref: AIBIDIA-TPMINDS-2026, title: "TPMinds International 2026: Five Strategic Shifts in Transfer Pricing", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/blog/tpminds-international-2026-five-strategic-shifts-in-transfer-pricing", date: "2026-06", access: full, locator: "theme 2 (contemporaneous documentation)"}
    - {ref: KPMG-TPPOD-2025, title: "How Can GenAI Improve Transfer Pricing Processes? (Exploring Transfer Pricing podcast)", publisher: KPMG US, type: podcast, url: "https://kpmg.com/us/en/podcasts/2025/genai-tp.html", date: "2025-11-14", access: full, locator: "episode description"}
    - {ref: IBFD-ITPJ-2025, title: "Operationalizing Transfer Pricing with Generative Artificial Intelligence: Practical Applications and Challenges (D. Olzhabayeva)", publisher: "IBFD, International Transfer Pricing Journal 32(6)", type: academic, url: "https://shop.ibfd.org/journal/operationalizing-transfer-pricing-generative-artificial-intelligence-practical-applications", date: "2025-09-26", access: full, locator: "overview (abstract)"}
    - {ref: TR-CHECKPOINT-2025, title: "Transfer Pricing Expert: 'Prepare Now' for Best Chance to Avoid Scrutiny (Exactera webinar of 12 September 2025)", publisher: Thomson Reuters Checkpoint News, type: press, url: "https://tax.thomsonreuters.com/news/transfer-pricing-expert-prepare-now-for-best-chance-to-avoid-scrutiny/", date: "2025-10-15", access: full, locator: "paragraphs on the 30-day window and 'check-the-box' documentation"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "preamble; Q4, Q5, Q6"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "items 1, 5, 6"}
    - {ref: BTAX-GT6662-2024, title: "IRS Transfer Pricing Enforcement Trend Calls for Self-Assessment", publisher: "Bloomberg Tax (Grant Thornton author)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/irs-transfer-pricing-enforcement-trend-calls-for-self-assessment", date: "2024-09-23", access: full, locator: "section on Section 6662 penalties"}
    - {ref: INTERTAX-SIVA-2026, title: "AI in Transfer Pricing: Risk or Opportunity? (Pramod Siva)", publisher: "Intertax 54(6/7)", type: academic, url: "https://kluwerlawonline.com/journalarticle/Intertax/54.6/TAXI2026050", date: "2026-06-01", access: full, locator: "abstract (full text paywalled)"}
    - {ref: ANDERSEN-AI-2026, title: "AI in Transfer Pricing: Insight, Illusion and Risk", publisher: Andersen Australia, type: firm, url: "https://au.andersen.com/ai-in-transfer-pricing/", date: "2026-02-17", access: full, locator: "section 'Our View on the Use of AI'"}
