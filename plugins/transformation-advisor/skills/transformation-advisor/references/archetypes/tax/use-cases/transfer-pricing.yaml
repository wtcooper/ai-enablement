  last_reviewed: "2026-10-17"
  notes: >-
    Job postings show employers expect the skill; they do not show results. The vendor survey page says 75% of
    respondents expect a first documentation draft to be handled by AI in two to three years (AIBIDIA-SOTP-2026; an
    expectation, not a result). The KPMG Germany item is search-only and supports nothing on its own.

- id: tax-transfer-pricing-08
  title: AI review of TP documentation against country requirements and for cross-report consistency
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Local files must meet country-specific rules that change often, and OECD guidelines are not law. Authorities
    compare figures across local files, master files, country-by-country (CbC) reports and income tax returns, and
    mismatches invite scrutiny.
  solution: >-
    Exactera describes a Word-based app (ExactReport) that reviews a draft against country-specific requirements and
    suggests real-time edits where sections are insufficient; its COO calls it 'Grammarly for transfer pricing' and
    says AI can flag inconsistent information and monitor shifting regulations. It was offered through an early
    adopter programme. KPMG South Africa and Nigeria authors advise reconciling data across financial statements,
    local and master files, CbC reports, VAT and income tax filings to avoid automated flags.
  outcomes:
    - {lever: quality, description: "none published; vendor describes capability only", figure: "none published", measures: "Product description in a sponsored supplement", provenance: vendor-published, source_ref: EXACTERA-2025}
  prerequisites:
    - "Draft documentation in Word and a maintained source of local requirements (EXACTERA-2025)"
    - "Consistent underlying data across financial statements, TP files, CbC reports, VAT and income tax returns (BTAX-AFRICA-2026)"
  risks_and_guardrails:
    - "A reviewer tool does not make documentation adequate; the IRS assesses even complete section 6662(e) documentation for adequacy and reasonableness (IRS-TPFAQ-2026)"
    - "An Exactera speaker says the IRS closely scrutinises the functional analysis and wants detailed reasons for the chosen method, data sources reviewed and methods rejected (TR-CHECKPOINT-2025)"
    - "Vendor claim in a sponsored supplement; not independently tested (EXACTERA-2025)"
  human_checkpoints:
    - "Preparer or TP lead accepts or rejects each suggested edit"
    - "Reconciliation breaks are explained by a person before filing"
  role_evolution: >-
    Exactera expects tax professionals to spend less time on repetitive tasks and more on analysis (EXACTERA-2025);
    this is the vendor's expectation.
  evidence_grade: C
  sources:
    - {ref: EXACTERA-2025, title: "AI is transforming transfer pricing (sponsored advertising supplement, Q&A with Exactera's COO)", publisher: "The Tax Adviser (AICPA) / Exactera", type: vendor, url: "https://www.thetaxadviser.com/issues/2025/sep/ai-is-transforming-transfer-pricing/", date: "2025-08-31", access: full, locator: "answers to questions 2-4 (ExactReport; early adopter programme)"}
    - {ref: TR-CHECKPOINT-2025, title: "Transfer Pricing Expert: 'Prepare Now' for Best Chance to Avoid Scrutiny (Exactera webinar of 12 September 2025)", publisher: Thomson Reuters Checkpoint News, type: press, url: "https://tax.thomsonreuters.com/news/transfer-pricing-expert-prepare-now-for-best-chance-to-avoid-scrutiny/", date: "2025-10-15", access: full, locator: "section 'Reliance on FAQs'"}
    - {ref: BTAX-AFRICA-2026, title: "South Africa and Nigeria Drive AI-Enabled Transfer Pricing Audits", publisher: "Bloomberg Tax (authors from KPMG South Africa and Nigeria)", type: press, url: "https://news.bloomberglaw.com/tax-insights-and-commentary/south-africa-and-nigeria-drive-ai-enabled-transfer-pricing-audits", date: "2026-06-08", access: full, locator: "'What Can Multinationals Do?' (data integrity and documentation consistency)"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "preamble"}
  last_reviewed: "2026-10-17"
  notes: >-
    No customer named and no result published. Exactera's own site returned 403, so current availability was not
    checked. Overlap: tax-controversy-05 (EY TP Doc Insights finds discrepancies between TP documentation and public
    data).

- id: tax-transfer-pricing-09
  title: Central transaction data feeding bulk local-file and master-file production
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [document-production, data-reporting]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Local files were built per entity from emailed data, linked Excel sheets and manual formatting, so small teams
    prioritised high-risk entities and reviewed each document three to four times (Trivium Packaging).
  solution: >-
    A platform imports the group's transaction and financial data once, stores policies, agreements and benchmarks,
    and generates editable Word local files for many entities from the same data; prior-year content rolls forward.
    The vendor (Aibidia) markets the platform as combining automation, AI and analytics; the case studies do not say
    which steps use AI.
  outcomes:
    - {lever: speed, description: "Trivium Packaging reports a simple local file now takes a few hours, versus 2-5 working days and up to six weeks when waiting on data and advisor review", figure: "80% time saving (case-study headline); up to six weeks to a few hours per local file", measures: "Time to prepare a simple local file, before versus after, as stated by Trivium's Manager EMEA Tax & Global Transfer Pricing; baseline is the team's own recollection", provenance: vendor-published, source_ref: AIBIDIA-TRIVIUM-2026}
    - {lever: capacity, description: "Fortum reports an automation rate for transactions and a larger transaction base in the model", figure: "65% automation rate for transactions in one year; over 8,000 transactions brought in versus 200", measures: "Fortum Manager Data Sourcing and Development, 'automation rate for transactions'; denominator not defined", provenance: vendor-published, source_ref: AIBIDIA-FORTUM-2026}
    - {lever: quality, description: "Trivium reports documentation coverage planned across nearly all legal entities instead of only high-risk ones, and fewer review rounds", figure: "coverage planned to grow from 18 to 25+ entities; previously 3-4 review rounds", measures: "Entities with documentation and review rounds per document, as stated by Trivium; not independently counted", provenance: vendor-published, source_ref: AIBIDIA-TRIVIUM-2026}
  prerequisites:
    - "Centralised, standardised intercompany data; in the vendor survey only 14% draw data directly from a single ERP and 79% spend more than 10% of TP time gathering and reconciling data (AIBIDIA-SOTP-2026)"
    - "Shared definitions and ownership between TP, controllers and local finance (AIBIDIA-LEADERS-2026)"
    - "Up-front setup effort to build the 'single source of truth' (AIBIDIA-MANUAL-2026)"
  risks_and_guardrails:
    - "Fortum says it has not automated everything yet (AIBIDIA-FORTUM-2026)"
    - "Tools are sensitive to business-model and ERP changes, as Kemira notes for its own tool (AIBIDIA-KEMIRA-2026)"
    - "All figures are customer statements on the vendor's site"
