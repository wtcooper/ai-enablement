    - {ref: TR-CHECKPOINT-2026, title: "AI-powered IRS audits are here but taxpayers have new relief options, tax pros say (30 July 2026 PwC webcast)", publisher: Thomson Reuters Checkpoint News, type: press, url: "https://tax.thomsonreuters.com/news/ai-powered-irs-audits-are-here-but-taxpayers-have-new-relief-options-tax-pros-say/", date: "2026-08-05", access: full, locator: "section 'Economic substance, transfer pricing lead compliance hot topics'"}
