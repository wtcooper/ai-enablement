- id: tax-transfer-pricing-15
  title: Taxpayer-side audit-risk screening of intercompany positions against authority indicators before filing
  archetype: tax
  module: transfer-pricing
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Authorities select TP audits on indicators such as routine entities running at a loss or very low profit, low
    income tax relative to revenue, or revenue almost wholly from related parties. A Checkpoint report on an Exactera
    webinar says the IRS uses algorithms to find companies with unreasonable losses or very low margins. Taxpayers
    rarely test their own positions against these signals before filing.
  solution: >-
    Taxpayer-side analytics score intercompany positions against known authority selection patterns and the IRS
    self-assessment suggestions (sensitivity analysis, several profit level indicators), so documentation can be
    strengthened before filing. Exactera says AI can predict where a company is most vulnerable to audits and
    adjustments. TPMinds International and the ABA May 2026 meeting scheduled sessions on AI for risk assessment and
    whether authorities will deploy similar tools.
  outcomes:
    - {lever: risk, description: "none published; Exactera claims prediction of audit vulnerability with no accuracy reported", figure: "none published", measures: "No measurement found", provenance: vendor-published, source_ref: EXACTERA-2025}
  prerequisites:
    - "Structured entity-level margins, transactions and documentation (see tax-transfer-pricing-04)"
    - "Knowledge of the indicators in use: Hungary's 2026 plan targets routine manufacturing, distribution or service entities at a loss or with extremely low profitability (WTS-HU-2026); the Philippine BIR order uses indicators such as sustained net losses with large revenue, income tax due below 2% of gross sales, and related-party-dependent revenue (GT-BIR-2026)"
  risks_and_guardrails:
    - "The IRS says self-assessment helps anticipate questions but its documentation features give no safe harbour against examination or penalties (IRS-TPFAQ-2026, Q2 and Q5)"
    - "Authority indicators come from secondary sources and may change; the Philippine framework is described as system-assisted analytics, not specified as AI (GT-BIR-2026)"
    - "Opaque model outputs and bias are risks flagged for AI-driven TP risk tooling (INTERTAX-SIVA-2026); a KPMG author warns of AI agents scrutinising every small transaction and an AI arms race among tax authorities with multinationals caught in the middle (KPMG-TNF-2024)"
  human_checkpoints:
    - "TP lead decides whether a flagged position needs more documentation, a price change, a defence or an APA"
  role_evolution: >-
    A webinar participant argued TP professionals should develop equivalent capability because authorities are
    already using AI (AIBIDIA-WEBINAR-2026).
  evidence_grade: C
  sources:
    - {ref: EXACTERA-2025, title: "AI is transforming transfer pricing (sponsored advertising supplement, Q&A with Exactera's COO)", publisher: "The Tax Adviser (AICPA) / Exactera", type: vendor, url: "https://www.thetaxadviser.com/issues/2025/sep/ai-is-transforming-transfer-pricing/", date: "2025-08-31", access: full, locator: "answer to question 1"}
    - {ref: TR-CHECKPOINT-2025, title: "Transfer Pricing Expert: 'Prepare Now' for Best Chance to Avoid Scrutiny (Exactera webinar of 12 September 2025)", publisher: Thomson Reuters Checkpoint News, type: press, url: "https://tax.thomsonreuters.com/news/transfer-pricing-expert-prepare-now-for-best-chance-to-avoid-scrutiny/", date: "2025-10-15", access: full, locator: "section 'IRS Cuts and Shift Towards AI'"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "Q1, Q2, Q5"}
    - {ref: WTS-HU-2026, title: "2026 tax inspection plan of the Hungarian tax authority", publisher: WTS Klient Hungary, type: firm, url: "https://wtsklient.hu/en/2026/03/12/2026-tax-inspection-plan-of-the-hungarian-tax-authority/", date: "2026-03-12", access: full, locator: "'Strengthening of transfer pricing audits'"}
    - {ref: KPMG-HU-2026, title: "Tax alert 2026-02-26 (Hungarian tax authority audit plan)", publisher: KPMG Hungary, type: firm, url: "https://kpmg.com/hu/en/insights/2026/02/taxalert-2026-02-26.html", date: "2026-02-26", access: full, locator: "text on AI screening and TP focus areas"}
