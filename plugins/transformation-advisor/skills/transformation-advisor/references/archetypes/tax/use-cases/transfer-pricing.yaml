    - {ref: ABA-TAXTIMES-2026, title: "Transforming compliance risk management (ABA Tax Times report on the AI and TP panel)", publisher: ABA Section of Taxation, type: professional-body, url: "https://www.americanbar.org/groups/taxation/resources/tax-times/2026/transforming-compliance-risk-management/", date: "2026", access: search-only, locator: "search extract only; page blocked"}
  last_reviewed: "2026-10-17"
  notes: >-
    Firm claims and vendor-reported participant practice; no named user or result. A search extract of the ABA Tax
    Times summary says panelists held that AI may increase speed and scale but does not change the legal framework
    (search-only; supports nothing on its own). Authority-side AI and the wider dispute process belong to the
    controversy module; overlaps are tax-controversy-07 (agents draft audit-query responses) and tax-controversy-05.

- id: tax-transfer-pricing-17
  title: AI-assisted economic analysis in TP litigation and expert reports, with disclosure of tools (idea)
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [expert-judgment, document-production]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Expert economists run benchmarking, valuation and allocation models for litigation and appeals. If AI is used,
    the reliability of the output becomes an evidence question.
  solution: >-
    Idea: experts may use AI for parts of the analysis, with full disclosure. The IRS LB&I official said experts must
    explain processes, including inputs, assumptions, methods and AI tools, and that the IRS wants to see formulas so
    it can test them. Proposed Federal Rule of Evidence 707 would require machine output offered without a sponsoring
    expert to meet the Rule 702 reliability criteria; the Standing Committee decided on 3-4 June 2026 not to recommend
    action at this time.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "No measurement; the sources are regulator remarks, a rulemaking status and a court record", provenance: independent, source_ref: IRS-LBI-TP-2026}
  prerequisites:
    - "Validation and explainability materials for any AI-based analysis offered in court (PROSKAUER-707-2026)"
    - "Spreadsheets or models that show formulas and preserve calculations (IRS-LBI-TP-2026; IRS-TPFAQ-2026, Q5)"
  risks_and_guardrails:
    - "The IRS official said AI can support but not replace legal, economic and factual judgment (IRS-LBI-TP-2026)"
    - "In Riddle Aggregates v. Commissioner, hallucinated citations in the IRS's (respondent's) valuation expert report were raised after voir dire; the Charlotin database records the report as withdrawn (RIDDLE-TRANSCRIPT-2026; CHARLOTIN-DB-2026)"
    - "The ABA panel scope included the reliability and defensibility of AI-generated analyses and the balance between GenAI automation and professional judgment (ABA-MAYMTG-2026)"
  human_checkpoints:
    - "The testifying expert must be able to explain and defend every input, assumption and method"
  role_evolution: >-
    The IRS expectation puts personal accountability on the expert, not the tool (IRS-LBI-TP-2026).
  evidence_grade: D
  sources:
    - {ref: IRS-LBI-TP-2026, title: "Report on recent US international tax developments, 31 July 2026 (IRS LB&I remarks of 29 July 2026)", publisher: "EY Tax News & Developments", type: firm, url: "https://taxnews.ey.com/news/2026-1658-report-on-recent-us-international-tax-developments-31-july-2026", date: "2026-07-31", access: full, locator: "paragraphs under the IRS AI in transfer pricing item"}
    - {ref: PROSKAUER-707-2026, title: "Machine-Generated Evidence Challenges the Federal Rules: Inside the Contested Proposed Federal Rule of Evidence 707", publisher: Proskauer Rose, type: firm, url: "https://www.proskauer.com/blog/machine-generated-evidence-challenges-the-federal-rules-inside-the-contested-proposed-federal-rule-of-evidence-707", date: "2026-07-29", access: full, locator: "timeline and 'Divided Opinions' sections"}
    - {ref: IRS-TPFAQ-2026, title: "Transfer pricing documentation best practices FAQs", publisher: IRS, type: regulator, url: "https://www.irs.gov/businesses/international-businesses/transfer-pricing-documentation-best-practices-frequently-asked-questions-faqs", date: "2026-06-28", access: full, locator: "Q5"}
    - {ref: RIDDLE-TRANSCRIPT-2026, title: "Riddle Aggregates v. Commissioner, trial transcript vol. 3 (Docket 31104-21)", publisher: "US Tax Court (via Charlotin database)", type: regulator, url: "https://www.damiencharlotin.com/documents/1972/Riddle_Aggregates.pdf", date: "2026-03-18", access: full, locator: "pp. 604-614"}
    - {ref: CHARLOTIN-DB-2026, title: "AI Hallucination Cases Database (web page and CSV)", publisher: "Damien Charlotin", type: academic, url: "https://www.damiencharlotin.com/hallucinations/", date: "2026-10-16", access: full, locator: "entry for Riddle Aggregates, found with the page search ?q=Riddle (outcome field 'Report withdrawn')"}
    - {ref: ABA-MAYMTG-2026, title: "ABA Section of Taxation May Meeting 2026 final program, session 'AI and Transfer Pricing Under §482'", publisher: ABA Section of Taxation, type: conference, url: "https://sitepilot11.firmseek.com/client/chamberlain/www/media/event/657_ABA_Section_of_Taxation_2026_May_Meeting_Agenda.pdf", date: "2026-05-08", access: full, locator: "p. 34, panel description"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (grade D): discussed by an IRS official, an ABA panel and a law-firm commentary; no deployment or measurement
    found. The IRS remark is reported second-hand by EY. The Riddle Aggregates item concerns a valuation expert
    report, and the source does not say the case is a TP case. Proskauer post dated 29 July 2026 on the page. Overlap:
    tax-controversy-08 (AI-assisted Tax Court submissions with citation checks).

- id: tax-transfer-pricing-18
  title: AI support for APA and MAP preparation, negotiation and outcome prediction (idea)
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [expert-judgment, research-synthesis, coordination-scheduling]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Advance pricing agreements (APAs, pre-agreed TP methods with authorities) and mutual agreement procedures (MAPs,
    authority-to-authority dispute resolution) are lengthy negotiations with case tracking and uncertain outcomes.
    KPMG authors expect APAs to become more attractive as audit technology advances.
  solution: >-
    Idea: a KPMG commentary (October 2024) suggests AI could improve case management, give data-driven negotiation
    support and predict outcomes from past cases, and floats an 'AI pre-pre-filing conference' in which a taxpayer
    feeds data to a model trained on historical MAP and APA data. Aprio says some authorities are developing
    proprietary AI models to predict MAP and APA outcomes, without naming any.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "No measurement", provenance: self-reported, source_ref: KPMG-TNF-2024}
  prerequisites:
    - "Authority-held historical MAP and APA data made available to taxpayers, as the commentary envisages (KPMG-TNF-2024)"
    - "Consistent documentation and data across reporting layers (BTAX-AFRICA-2026)"
  risks_and_guardrails:
    - "The same commentary warns AI could lead to scrutiny of every small transaction and an arms race among authorities (KPMG-TNF-2024)"
    - "Opacity of AI logic makes the arm's length principle difficult to validate; the claim about authority models is unattributed (APRIO-AI-2025)"
  human_checkpoints:
    - "Negotiation and position-setting remain with practitioners and competent authorities; Nexdigm's sponsored piece says no algorithm will sit opposite a revenue officer (ITR-NEXDIGM-2026)"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: D
  sources:
    - {ref: KPMG-TNF-2024, title: "AI May Take Transfer Pricing Up a Notch but Carries Some Risk (TaxNewsFlash reprint of a Bloomberg Tax commentary)", publisher: KPMG US, type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/taxnewsflash/pdf/2024/10/ai-transfer-pricing-risk-oct21-2024.pdf", date: "2024-10-21", access: full, locator: "paragraphs under 'But it isn't necessarily all bad news for taxpayers'"}
    - {ref: APRIO-AI-2025, title: "AI and the Future of Transfer Pricing: Risks and Opportunities", publisher: Aprio, type: firm, url: "https://www.aprio.com/ai-and-the-future-of-transfer-pricing-risks-and-opportunities-ins-article-intl/", date: "2025-08-14", access: full, locator: "section 'AI tools for worldwide taxing authorities'"}
    - {ref: BTAX-AFRICA-2026, title: "South Africa and Nigeria Drive AI-Enabled Transfer Pricing Audits", publisher: "Bloomberg Tax (authors from KPMG South Africa and Nigeria)", type: press, url: "https://news.bloomberglaw.com/tax-insights-and-commentary/south-africa-and-nigeria-drive-ai-enabled-transfer-pricing-audits", date: "2026-06-08", access: full, locator: "'What Can Multinationals Do?' (APA programs)"}
    - {ref: ITR-NEXDIGM-2026, title: "Transfer pricing at the crossroads: disruption, data, and the decade ahead (sponsored)", publisher: "International Tax Review (Nexdigm)", type: vendor, url: "https://www.internationaltaxreview.com/article/2gxa3xiio1u5wu2o18y68/sponsored/transfer-pricing-at-the-crossroads-disruption-data-and-the-decade-ahead", date: "2026-09-21", access: full, locator: "paragraph beginning 'None of this should be read as a claim'"}
    - {ref: TPMINDS-AM-2027, title: "TPMinds Americas 2027 event page (planned session list)", publisher: Informa Connect, type: conference, url: "https://informaconnect.com/tp-minds-americas-conference/", date: "2026-10-17", access: full, locator: "planned session list for the 1-3 March 2027 event (APAs and MAPs session; no AI link stated); page undated, retrieval date used"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (grade D). No APA or MAP deployment of AI was found. The TPMinds Americas 2027 page is undated (retrieval
    date used; event 1-3 March 2027) and does not tie APAs to AI. The UN draft protocol on dispute prevention (which
    lists APAs) is outside this module.

- id: tax-transfer-pricing-19
  title: TP policy modelling and planning-opportunity screening
  archetype: tax
  module: transfer-pricing
  function: strategy-planning
  work_types: [expert-judgment, research-synthesis]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Policy design and planning need analysis of how entity results, tax rates and new business models interact across
    jurisdictions.
  solution: >-
    KPMG US says GenAI can scrutinise global tax and TP developments to pinpoint planning prospects, parse financials
    and update calculations. Plante Moran says some companies are experimenting with lightweight models that test
    subsidiary financials against standardised country tax rates, and calls these a jump-start for a conversation
    with an adviser, not a self-contained answer.
  outcomes:
    - {lever: growth, description: "none published", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: PLANTEMORAN-2026}
  prerequisites:
    - "Subsidiary financials in structured form (PLANTEMORAN-2026)"
  risks_and_guardrails:
    - "Outputs work best as input to adviser discussion, not as conclusions (PLANTEMORAN-2026)"
    - "KPMG's episode covers where tax authorities are most likely to challenge intercompany arrangements tied to AI-driven value creation; this is TP of AI, not AI in TP (KPMG-TPPOD-2026, episode description; audio not heard)"
  human_checkpoints:
    - "Adviser and TP lead review the model's result before any policy or structure change"
  role_evolution: >-
    Only 8% of vendor-survey respondents expect AI to touch strategic policy design (AIBIDIA-SOTP-2026), so planning
    remains the least expected AI use in that survey.
  evidence_grade: C
  sources:
    - {ref: PLANTEMORAN-2026, title: "Using AI in transfer pricing: Practical opportunities and pitfalls for growing companies", publisher: Plante Moran, type: firm, url: "https://plantemoran.com/explore-our-thinking/insight/2026/08/using-ai-in-transfer-pricing", date: "2026-08-05", access: full, locator: "item 'Monitoring results and flagging risk', last sentences"}
    - {ref: KPMG-TP-2025, title: "GenAI Revolutionizes Transfer Pricing and Valuation", publisher: KPMG US, type: firm, url: "https://kpmg.com/us/en/articles/2025/genai-revolutionizes-transfer-pricing-valuation.html", date: "2025-04-02", access: full, locator: "opening paragraph"}
    - {ref: KPMG-TPPOD-2026, title: "Is Adoption of GenAI Redefining Value and Transfer Pricing? (Part 2)", publisher: KPMG US, type: podcast, url: "https://kpmg.com/us/en/podcasts/2026/gen-ai-value-tp-pt2.html", date: "2026-07-15", access: full, locator: "episode description (page text only; audio not heard)"}
    - {ref: AIBIDIA-SOTP-2026, title: "Aibidia Report 2026: The State of Transfer Pricing (landing page)", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/reports/2026-the-state-of-transfer-pricing", date: "2026", access: full, locator: "'THE AI SHIFT' block"}
  last_reviewed: "2026-10-17"
  notes: >-
    Kept at C because a firm states that some companies are experimenting, which is a claim of use without a named
    deployment. Advice on the TP of AI itself (pricing AI tools and AI-generated assets between affiliates) is outside
    this module (it is advice on AI, not AI in the work). Overlap: tax-research-advisory-10 (planning-alternative
    ideation).

- id: tax-transfer-pricing-20
  title: AI-use and verification log embedded in TP workpapers (idea)
  archetype: tax
  module: transfer-pricing
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    If an AI-assisted TP position is challenged, a firm or tax team may not be able to show what the AI suggested
    versus what a person verified.
  solution: >-
    Idea: keep a record of which AI tools were used, what inputs were given, and how outputs were reviewed and
    validated. BDO Canada, the IRS OPR alert and the Werfel preparer risk register all recommend variants of this. It
    is a governance control wrapped around AI-assisted work, not an automation, and is listed so advisers can ask
    whether it exists.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "Recommended control; no measurement", provenance: self-reported, source_ref: BDO-AIGOV-2026}
  prerequisites:
    - "A documented AI use policy covering disclosure, review requirements and documentation standards (AICPA-WERFEL-2026, Appendix C, risk 12)"
  risks_and_guardrails:
    - "Circular 230 section 10.36 expects firm procedures, training, vetting of third-party AI tools and documentation of adherence (IRS-OPR-2026, item 4)"
    - "The OPR alert says billing manual time not actually spent may violate section 10.27 and that savings should be credited openly; the AICPA has asked the IRS for clarification, saying the language does not seem to allow value pricing (IRS-OPR-2026, item 2; AICPA-CART-2026)"
    - "UK PCRT bodies issued AI guidance applying integrity, due care and confidentiality (ATT-PCRTAI-2026)"
  human_checkpoints:
    - "Reviewer attests to verification of each AI-assisted section"
  role_evolution: >-
    Werfel's preparer register lists skill erosion, vendor dependence and institutional knowledge loss as workforce
    risks, with controls such as capability assessments and documented manual workflows (AICPA-WERFEL-2026, Appendix
    C, risks 13-15).
  evidence_grade: D
  sources:
    - {ref: BDO-AIGOV-2026, title: "AI governance in transfer pricing: Is your documentation CRA-ready?", publisher: BDO Canada, type: firm, url: "https://www.bdo.ca/insights/ai-governance-in-transfer-pricing-how-to-create-defensible-documentation", date: "2026-08-20", access: full, locator: "'3 ways to build audit-ready AI practices', third principle"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "items 2 and 4; 'Best Practices for Responsible AI Use'"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risks 12-15"}
    - {ref: AICPA-CART-2026, title: "AICPA, former IRS commissioner to lead initiative on AI in tax", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-former-irs-commissioner-to-lead-initiative-on-ai-in-tax/", date: "2026-09-23", access: full, locator: "final paragraphs"}
    - {ref: ATT-PCRTAI-2026, title: "Professional bodies issue AI advice to members", publisher: "Association of Taxation Technicians (for the PCRT bodies)", type: professional-body, url: "https://www.att.org.uk/technical/news/professional-bodies-issue-ai-advice-members", date: "2026-01-19", access: full, locator: "news item body"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (grade D): recommended by a firm, a regulator alert and a risk framework; no evidence of adoption. Pattern
    'other': a control layer around AI-assisted work. The OPR alert is general to federal tax practice, not
    TP-specific. ATT-PCRTAI-2026 is the ATT news item; PCRT-AI-2026 is the ICAEW guidance page itself. Same control in
    other modules: tax-research-advisory-19, tax-compliance-corporate-19 and tax-indirect-tax-15.

- id: tax-transfer-pricing-21
  title: Insourcing recurring TP documentation onto a central data platform, with external advisors limited to review
  archetype: tax
  module: transfer-pricing
  function: finance-accounting
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    At Trivium, documentation cost over EUR 10,000-15,000 per entity, effort forced prioritising high-risk entities,
    and outside advisors 'do not know our company 100%', according to its TP manager.
  solution: >-
    Bring recurring documentation work in-house on a central data platform (tax-transfer-pricing-09) and use advisors
    for jurisdiction-specific, technical or high-risk matters and for review. Fortum's stated goal is to use external
    parties only to review local files.
  outcomes:
    - {lever: cost, description: "Trivium states its earlier per-entity documentation cost and says the platform gives a predictable cost while scaling entity coverage", figure: "over EUR 10,000-15,000 per entity previously; new cost not stated", measures: "Trivium's statement of earlier spend per entity; no current-cost figure published", provenance: vendor-published, source_ref: AIBIDIA-TRIVIUM-2026}
  prerequisites:
    - "Central data platform and an in-house TP owner (tax-transfer-pricing-09)"
  risks_and_guardrails:
    - "In-house teams keep ownership of data, judgment and institutional knowledge while buying specialist expertise where it adds value (AIBIDIA-LEADERS-2026)"
  human_checkpoints:
    - "Advisor review of local files (AIBIDIA-FORTUM-2026)"
  role_evolution: >-
    Hybrid resourcing is the most common model in the vendor's survey: 53% combine substantial internal capability
    with external support, up from 38% in 2024, and 63% have three or fewer dedicated TP professionals
    (AIBIDIA-LEADERS-2026). The source does not attribute the shift to AI.
  evidence_grade: B
  sources:
    - {ref: AIBIDIA-TRIVIUM-2026, title: "How Trivium Packaging Cut TP Documentation Time by 80% with Aibidia", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/case-studies/how-trivium-packaging-cut-tp-documentation-time-by-80-percent-with-aibidia", date: "2026-10-17", access: full, locator: "section 'Scaling Transfer Pricing Process'; page undated"}
    - {ref: AIBIDIA-FORTUM-2026, title: "How Fortum transforms their transfer pricing processes", publisher: Aibidia, type: vendor, url: "https://www.aibidia.com/case-studies/aibidia-helps-fortums-global-tax-team-transform-their-transfer-pricing-processes", date: "2026-10-17", access: full, locator: "section 'Achieving 65% automation'; page undated"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 1"}
  last_reviewed: "2026-10-17"
  notes: >-
    A change in who does the work, enabled by data automation rather than shown to be AI. Graded B because only the
    baseline cost is stated.

- id: tax-transfer-pricing-22
  title: Platform-plus-experts delivery of TP policy, benchmarking and documentation at fixed prices
  archetype: tax
  module: transfer-pricing
  function: service-delivery
  work_types: [document-production, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Traditional advisory engagements take months and cost heavily for work that groups with lean teams see as
    repeatable, and in-house teams question paying advisors mainly for validation and risk absorption.
  solution: >-
    Providers combine a software platform with their own experts to deliver policy, benchmarking, documentation and
    filing as a packaged service. Commenda advertises fixed per-item prices and about four weeks. Aibidia and BIP Law
    & Tax announced an exclusive Italian partnership with a joint task force of TP specialists, data engineers and
    technology experts for continuous TP management.
  outcomes:
    - {lever: cost, description: "Commenda contrasts its fixed prices and delivery time with a traditional-advisor figure, without a source for the latter", figure: "about 4 weeks and about USD 9,000 for a first set (vendor), versus USD 60K and six months for traditional advisors (vendor claim)", measures: "Vendor price list (COMMENDA-2026) and marketing comparison (COMMENDA-TP-2026); no customer or independent comparison", provenance: vendor-published, source_ref: COMMENDA-TP-2026}
  prerequisites:
    - "ERP integration and entity data (COMMENDA-2026)"
  risks_and_guardrails:
    - "Vendor claims; competing vendors compare each other. The BIP partnership says the model works 'without replacing professional judgement' (AIBIDIA-BIP-2026)"
  human_checkpoints:
    - "Provider experts review deliverables; the client explains the business and reviews output (COMMENDA-2026)"
  role_evolution: >-
    BIP and Aibidia state the model aims to maintain central control without expanding internal headcount
    (AIBIDIA-BIP-2026). In the vendor survey, 53% combine substantial internal capability with external support, up
    from 38% in 2024 (AIBIDIA-LEADERS-2026).
  evidence_grade: C
  sources:
    - {ref: COMMENDA-2026, title: "Commenda vs Aibidia for Transfer Pricing (2026)", publisher: Commenda, type: vendor, url: "https://www.commenda.io/transfer-pricing/commenda-vs-aibidia", date: "2026-06", access: full, locator: "pricing block and FAQ"}
    - {ref: COMMENDA-TP-2026, title: "Commenda transfer pricing page", publisher: Commenda, type: vendor, url: "https://www.commenda.io/transfer-pricing", date: "2026-10-17", access: full, locator: "sentence contrasting USD 60K and six months with four weeks; page undated"}
    - {ref: AIBIDIA-BIP-2026, title: "Redefining Transfer Pricing Delivery Models: Driving Innovation and Efficiency", publisher: "Aibidia / BIP Law & Tax", type: vendor, url: "https://www.aibidia.com/news/redefining-transfer-pricing-delivery-models-driving-innovation-and-efficiency-across-the-transfer-pricing-landscape", date: "2026-02", access: full, locator: "paragraphs 1-7; on-page date reads 3 July 2026 (apparently a site re-publication, as on other Aibidia news items); a secondary company profile dates the partnership to February 2026; exact day not confirmed"}
    - {ref: AIBIDIA-LEADERS-2026, title: "From information to intelligence: What senior TP leaders say must change", publisher: Aibidia, type: survey, url: "https://www.aibidia.com/blog/from-information-to-intelligence-what-senior-tp-leaders-say-must-change", date: "2026-09-23", access: full, locator: "section 1"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a platform-plus-experts managed service. Commenda says 'experts do the work; the platform keeps
    it live', and neither provider says which steps AI performs, so the ladder is set at 'augment' rather than
    'delegate', and no agent delivery is claimed. Similar managed-service models: tax-compliance-corporate-15 and
    tax-indirect-tax-19.
