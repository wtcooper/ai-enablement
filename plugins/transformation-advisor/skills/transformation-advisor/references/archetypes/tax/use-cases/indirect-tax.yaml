- id: tax-indirect-tax-05
  title: Grounded taxability and regulatory Q&A assistant inside the tax platform
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Staff spend time finding and interpreting taxability answers across jurisdictions and languages, and a general
    chatbot can be confidently wrong. In Avalara's own single test, a chatbot gave 10.3% for Bellevue, Washington in
    October 2025 when the rate was 10.2%, because it confused enactment and effective dates (AVALARA-LLMTEST-2025). A
    Florida sales tax attorney says a general AI first draft on Florida sales tax had about five serious errors
    (FLSALESTAX-AI-2026).
  solution: >-
    Assistants built into tax platforms answer questions in the flow of work from a curated knowledge base. Ask Sovi
    answers regulatory questions across 150+ countries from a base maintained by more than 100 Sovos specialists.
    Avalara Aviator explains taxability in plain language and supports research; its beta included Singer Equipment
    Company. Vertex Copilot answers questions from product documentation and release notes.
  outcomes:
    - {lever: quality, description: "A named beta customer (a senior tax accountant at Singer Equipment Company) says Aviator explains taxability in plain language, surfaces considerations she might have missed and gives research she can rely on", figure: "none published", measures: "not applicable; a single customer quotation in a vendor release", provenance: vendor-published, source_ref: AVALARA-AVIATOR-2026}
    - {lever: quality, description: "Avalara's own comparison: a general chatbot was wrong on one rate lookup and Avalara's engine was right", figure: "10.3% (chatbot) vs 10.2% (actual) for Bellevue, WA, Oct 2025", measures: "a single combined sales tax rate lookup (n=1) run by the vendor that sells the compared product", provenance: vendor-published, source_ref: AVALARA-LLMTEST-2025}
  prerequisites:
    - "A vendor knowledge base maintained by tax specialists (SOVOS-SOVI-2026)"
    - "Entity, registration and filing-history context if answers are to be business-specific (SOVOS-SOVI-2026)"
    - "Primary-source citation on each answer so users can verify and keep evidence (FONOA-CITATION-2026)"
  risks_and_guardrails:
    - "Fonoa argues general AI can give fluent but wrong answers on recent tax changes and that every answer should carry its primary source; this is a vendor's argument for its own product (FONOA-CITATION-2026)"
    - "Knowledge cutoffs, hallucination and treating all sources as equally authoritative are named failure modes of general models (FLSALESTAX-AI-2026)"
    - "Sovos says customer data stays inside its security perimeter and is not used to train external models (SOVOS-SOVI-2026)"
  human_checkpoints:
    - "The user decides what to do with an answer; Sovos plans to extend answers into guided, human-approved actions (SOVOS-SOVI-2026)"
  role_evolution: >-
    The Singer Equipment accountant describes using the tool to think about questions she had not asked, which she
    links to audit readiness (AVALARA-AVIATOR-2026). The Florida attorney says a growing number of business owners, and
    some tax professionals, use general AI tools for sales tax answers (FLSALESTAX-AI-2026).
  evidence_grade: B
  sources:
    - {ref: AVALARA-AVIATOR-2026, title: "Avalara Ushers in New Era of Agentic Tax and Compliance with Avalara Aviator", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/guest-articles/company-news/avalara-ushers-in-new-era-of-agentic-tax-and-compliance-with-avalara-aviator", date: "2026-09-23", access: full, locator: "quotation from Preya Chandan, Senior Tax Accountant, Singer Equipment Company"}
    - {ref: SOVOS-SOVI-2026, title: "Sovos Expands Sovi AI with New Capabilities for Tax Guidance, Intelligent Automation and Agent Interoperability", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-expands-sovi-ai/", date: "2026-03-24", access: full, locator: "paragraphs on Ask Sovi and the security perimeter"}
    - {ref: VERTEX-COPILOT-2025, title: "AI and the Customer Experience: How Vertex Copilot is Shaping the Future", publisher: "Vertex Inc.", type: vendor, url: "https://www.vertexinc.com/node/7552", date: "2025-05-06", access: full, locator: "section 'Vertex's latest AI-powered solution'"}
    - {ref: AVALARA-LLMTEST-2025, title: "Why AI not backed by tax expertise can get sales tax rates wrong", publisher: "Avalara", type: vendor, url: "https://www.avalara.com/blog/en/north-america/2025/11/ai-tax-expertise-accurate-sales-tax-rates.html", date: "2025-11-20", access: full, locator: "sections 'Testing Avalara vs. Google AI' and 'Why the LLM AI chatbot got the tax rate wrong'"}
    - {ref: FLSALESTAX-AI-2026, title: "Can I Trust AI for Florida Sales Tax Advice?", publisher: "floridasalestax.com (James H. Sutton Jr., CPA, Esq.)", type: firm, url: "https://www.floridasalestax.com/florida-tax-law-blog/2026/june/can-i-trust-ai-for-florida-sales-tax-advice-/", date: "2026-06-06", access: full, locator: "introduction; section 'Why AI and Florida sales tax are a dangerous combination'"}
    - {ref: FONOA-CITATION-2026, title: "Why Primary Source Citation Matters for Tax Audit Defense", publisher: "Fonoa", type: vendor, url: "https://www.fonoa.com/resources/blog/primary-source-tax-law-citation-audit", date: "2026-09-21", access: full, locator: "sections 'Why general AI can't be trusted for tax research' and 'Start with the primary source'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B rests on one named beta customer and no published measurement. Avalara says Aviator became generally
    available on 8 Oct 2026 (AVALARA-CRUSHEU-2026). Both quality examples come from parties that sell or advise on
    sales tax.

- id: tax-indirect-tax-06
  title: Retrieval-grounded VAT place-of-supply assistant whose answers a tax adviser verifies
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Clients describe VAT cases in free-text emails, and advisers must determine the place of supply (the country whose
    VAT applies) and justify it from statute and guidance. The authors note errors in legal interpretation carry
    significant financial consequences (LUKETINA-VAT-2026).
  solution: >-
    A language model answers the inquiry using retrieved passages of Austrian and EU VAT law (retrieval-augmented
    generation, RAG) and returns a place-of-supply decision with a justification citing the legal sources. A tax
    adviser checks the answer; the authors call this "verified decision-making".
  outcomes:
    - {lever: quality, description: "Place-of-supply accuracy on textbook cases, RAG versus the plain model", figure: "93.24% (RAG) vs 68.92% (plain GPT-4o)", measures: "share of 74 textbook VAT cases where the predicted place-of-supply country matched the expected country", provenance: independent, source_ref: LUKETINA-VAT-2026}
    - {lever: quality, description: "Correct analyses on real client inquiries from a tax consultancy", figure: "16 of 20 (80%) RAG; 14 of 20 (70%) fine-tuned; 11 of 20 (55%) RAG plus fine-tuning; 13 of 20 (65%) long-context GPT-4.1", measures: "number of 20 anonymised real-world VAT inquiries from ICON Wirtschaftstreuhand GmbH whose returned analysis was judged factually correct", provenance: independent, source_ref: LUKETINA-VAT-2026}
  prerequisites:
    - "An indexed corpus of the relevant VAT statute, guidance and cases"
    - "Structured background on each client (the authors suggest a knowledge graph), because advisers rely on implicit client knowledge and attachments the model never saw (LUKETINA-VAT-2026)"
  risks_and_guardrails:
    - "The authors write that a 20-30% error rate in VAT case decisions is unacceptable in practice and that LLM-only decision-making is insufficient (LUKETINA-VAT-2026, Sect. 9.2)"
    - "Justifications can cite the wrong paragraph or hallucinate added detail; chain transactions were the hardest pattern for fine-tuned set-ups (LUKETINA-VAT-2026, Sects. 8.1-8.2, 9.1)"
    - "Under the UK PCRT guidance a member remains responsible for work produced with AI and should be able to explain how a conclusion was reached (ICAEW-PCRT-2026)"
  human_checkpoints:
    - "A tax adviser approves the analysis before it reaches the client"
    - "The adviser checks every cited paragraph against the source"
  role_evolution: >-
    The authors describe the adviser as the human in the loop who verifies the answer and keeps ultimate
    responsibility; the tool supplies a first analysis and a cross-check (LUKETINA-VAT-2026).
  evidence_grade: A
  sources:
    - {ref: LUKETINA-VAT-2026, title: "Using Large Language Models for Legal Decision-Making in Austrian Value-Added Tax Law: A Comparative Study (arXiv 2507.08468 v2; Journal of Business Analytics 2026)", publisher: "University of Applied Sciences Upper Austria and Johannes Kepler University Linz", type: academic, url: "https://arxiv.org/abs/2507.08468", date: "2026-09-02", access: full, locator: "Sect. 4.2 (p. 14); Sect. 8.1 Table 5 (p. 27); Sect. 8.2 (pp. 30-32); Sect. 9.2 (pp. 33-34)"}
    - {ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01", access: full, locator: "'Key messages' and 'Fundamental principles'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade A is for a measured outcome by a named academic team on real cases from a named consultancy. It is a research
    prototype on one country's law, not a deployed tool. Small real-world sample (20); the RAG versus fine-tuning
    difference is not significant (McNemar p = 0.683). GPT-4o and a naive RAG design date the figures. Overlaps the
    research-advisory module's grounded research assistants; this entry is the only VAT-specific measured study.

- id: tax-indirect-tax-07
  title: Plain-language drafting of tax-engine rules, simulated on past transactions before activation
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [software-systems, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Configuring custom tax rules and mappings in a tax engine needs specialist knowledge of the product and the law,
    and changes can conflict with other rules. Implementations are described as largely partner-led, with timelines
    under pressure as mandates grow more complex (INNOVATETAX-VXE-2026).
  solution: >-
    The user describes a needed rule in plain language. Avalara's agent drafts the rule, simulates its impact on past
    transactions and flags conflicts with other rules; the customer reviews and approves before it is activated.
    Avalara also says Aviator can auto-generate tax matrices (AVALARA-CRUSHEU-2026). Vertex showed AI that updates tax
    rules and supports configuration logic in plain language (INNOVATETAX-VXE-2026), and reports a technical customer
    configured the product through its copilot (VERTEX-Q1CALL-2026).
  outcomes:
    - {lever: speed, description: "Avalara claims Aviator turns days of manual compliance work into minutes of oversight", figure: "days to minutes (qualitative)", measures: "general claim for the Aviator agent hub, not specific to rule drafting; no baseline or sample", provenance: vendor-published, source_ref: AVALARA-AVIATOR-2026}
  prerequisites:
    - "Historical transaction data in the engine to simulate against"
    - "A configuration layer that is auditable and reversible (INNOVATETAX-VXE-2026)"
    - "Role-based approval for tax-logic changes (TR-INSTITUTE-2025)"
  risks_and_guardrails:
    - "Misconfiguration changes tax outcomes for many transactions at once; Vertex's stated mitigation is explainability, reversibility, auditability and human oversight (INNOVATETAX-VXE-2026)"
    - "Thomson Reuters Institute advises segregation of duties, approval workflows for tax-logic changes and versioned prompts and outputs; this is advice, not a reported practice (TR-INSTITUTE-2025)"
  human_checkpoints:
    - "The customer reviews and approves the drafted rule before the agent activates it (AVALARA-AVIATOR-2026)"
  role_evolution: >-
    The Vertex Exchange Europe recap says partners are investing in enablement and AI-powered knowledge tools and that
    the future tax team is hybrid across legislation, systems, process design and data flows (INNOVATETAX-VXE-2026).
  evidence_grade: C
  sources:
    - {ref: AVALARA-AVIATOR-2026, title: "Avalara Ushers in New Era of Agentic Tax and Compliance with Avalara Aviator", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/guest-articles/company-news/avalara-ushers-in-new-era-of-agentic-tax-and-compliance-with-avalara-aviator", date: "2026-09-23", access: full, locator: "paragraph beginning 'For example, a customer can describe a needed tax rule...'"}
    - {ref: AVALARA-CRUSHEU-2026, title: "Avalara Helps Global Businesses Move Faster as Tax and Compliance Complexity Accelerates", publisher: "Avalara (PR Newswire)", type: conference, url: "https://www.webdisclosure.com/press-release/avalara-helps-global-businesses-move-faster-as-tax-and-compliance-complexity-accelerates-WEpMYuY5kxr", date: "2026-10-08", access: full, locator: "paragraph on Avalara Aviator"}
    - {ref: INNOVATETAX-VXE-2026, title: "What we learned from Vertex Exchange Europe 2026", publisher: "Innovate Tax", type: conference, url: "https://innovatetax.com/blog/what-we-learned-from-vertex-exchange-europe-2026/", date: "2026-05-06", access: full, locator: "sections 'AI is becoming a default expectation' and 'Partners and skills are now central to success'"}
    - {ref: VERTEX-Q1CALL-2026, title: "Vertex (VERX) Q1 2026 Earnings Transcript", publisher: "Vertex Inc. (Motley Fool transcript on Yahoo Finance)", type: vendor, url: "https://finance.yahoo.com/markets/stocks/articles/vertex-verx-q1-2026-earnings-203016568.html", date: "2026-05-07", access: full, locator: "analyst Q&A, answer on customer experience and copilot"}
    - {ref: TR-INSTITUTE-2025, title: "AI and the indirect tax department: From compliance to strategy", publisher: "Thomson Reuters Institute", type: vendor, url: "https://www.thomsonreuters.com/en/institute/articles/ai-indirect-tax", date: "2025-09-17", access: full, locator: "final controls paragraph"}
  last_reviewed: "2026-10-17"
  notes: >-
    Avalara's example is a described design; the release names no customer who used rule drafting. The Vertex
    capability is described second-hand in an implementation partner's conference recap.

- id: tax-indirect-tax-08
  title: E-invoice rejection diagnosis, with corrections executed after a user approves
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Under clearance e-invoicing (continuous transaction controls, where the authority must accept each invoice) an
    invoice has no legal force until the authority returns an identifier, so a wrong VAT ID, malformed schema or
    mismatched master data means rejection, and goods and payment can stall (TRINST-TEIAUDITOR-2026). Teams need to know
    why an invoice failed and which upstream process caused it; today this runs through support tickets and handoffs
    (SOVOS-SOVI-2026). In KPMG's survey e-invoicing is owned by Finance for 38%, Tax for 30% and IT for 11%
    (KPMG-INDIRECT-2026).
  solution: >-
    Sovi AI diagnoses root causes of e-invoice and filing errors, proposes specific fixes and executes corrections once
    a Sovos user approves, with every recommendation and action logged; Sovos lists e-invoice error diagnosis among
    pre-built agents in Sovi Agent Studio. Sovos says the Blue dot acquisition adds AI it intends to embed so diagnosis
    explains why the underlying business event was wrong. Thomson Reuters demonstrated AI-driven exception handling and
    VAT ID validation in ONESOURCE Indirect Compliance with CoCounsel (TR-WEBINAR-JLL).
  outcomes:
    - {lever: quality, description: "Sovos reports a 1.6% invoice rejection rate in live French production against its own estimate of about 20% market-wide; the release credits format validation, government connectivity and regulatory interpretation, not AI diagnosis", figure: "1.6% vs about 20%", measures: "invoice rejection rate in live production in France about three weeks after the 1 Sep 2026 mandate, as stated by Sovos; the market figure is Sovos's estimate; denominator and period not given", provenance: vendor-published, source_ref: SOVOS-FRANCE-2026b}
  prerequisites:
    - "Invoices in a structured format; the ViDA directive says e-invoices should in principle follow the European standard EN 16931 (EU-DIRECTIVE-2025-516)"
    - "Connectivity to the authority or approved platform so errors can be read and resubmitted (SOVOS-FRANCE-2026b)"
    - "Clean customer, registration and product master data, which e-invoicing exposes very quickly (INNOVATETAX-VXE-2026)"
    - "A clear owner across Finance, Tax and IT (KPMG-INDIRECT-2026)"
  risks_and_guardrails:
    - "Sovos says the AI is built within its security perimeter, customer data is not used to train external models, and workflows are designed with human oversight and auditability (SOVOS-SOVI-2026)"
    - "The Sovos release lists 'current and planned' capabilities; parts of the roadmap are forward-looking (SOVOS-SOVI-2026)"
    - "Sovos summarises French penalties as starting at 10% of VAT due for late submission, rising to 40% for repeat non-compliance and up to 80% for fraud, with per-invoice penalties capped at 25%; this is a vendor's summary of the law (SOVOS-FRANCE-2026)"
    - "About a third of KPMG respondents still rely on country-specific e-invoicing tools, which fragments control (KPMG-INDIRECT-2026, p. 11)"
  human_checkpoints:
    - "A user approves each proposed correction before it executes (SOVOS-SOVI-2026)"
    - "Tax review of recurring root causes"
  role_evolution: >-
    Sovos says the intent is resolution without support tickets or handoffs (SOVOS-SOVI-2026). A TEI panelist describes
    a shift "from us preparing returns to us answering notices on the data that's been shared" (TRINST-TEIAUDITOR-2026).
  evidence_grade: C
  sources:
    - {ref: SOVOS-SOVI-2026, title: "Sovos Expands Sovi AI with New Capabilities for Tax Guidance, Intelligent Automation and Agent Interoperability", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-expands-sovi-ai/", date: "2026-03-24", access: full, locator: "capability list, 'Problem-to-Resolution Guidance'; closing paragraph on availability"}
    - {ref: SOVOS-FLOWIE-2026, title: "Sovos Acquires Flowie, Launching the Industry's First Agentic Compliant Finance Orchestration Platform", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-acquires-flowie-launching-the-industrys-first-agentic-compliant-finance-orchestration-platform/", date: "2026-10-01", access: full, locator: "paragraph naming Sovi Agent Studio"}
    - {ref: SOVOS-BLUEDOT-2026, title: "Sovos Acquires Blue dot", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-acquires-blue-dot-expanding-ai-native-diagnostics-workflow-and-intelligence-capabilities-widening-sovos-tax-compliance-platform-technology-lead/", date: "2026-09-15", access: full, locator: "sections 'The Compliance Problem Getting Harder to Ignore' and 'Accelerating AI Across the Sovos Platform'"}
    - {ref: SOVOS-FRANCE-2026b, title: "Three Weeks into France E-Invoicing Mandate: Sovos Hits Unparalleled Production Scale", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/three-weeks-into-france-e-invoicing-mandate-sovos-hits-unparalleled-production-scale/", date: "2026-09-23", access: full, locator: "section 'Quality at Scale'"}
    - {ref: SOVOS-FRANCE-2026, title: "Sovos Brings Global 2000 Clients Live in France", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-brings-global-2000-clients-live-in-france-ahead-of-the-worlds-most-complex-e-invoicing-mandate/", date: "2026-08-18", access: full, locator: "paragraph on penalties"}
    - {ref: TR-WEBINAR-JLL, title: "Transforming indirect tax with AI (on-demand webinar with JLL)", publisher: "Thomson Reuters", type: vendor, url: "https://europe.thomsonreuters.com/on-demand-webinars/transforming-indirect-tax-ai", date: "2026-10-17", access: full, locator: "webinar description (page undated; retrieval date used)"}
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "section 'End of the traditional model'"}
    - {ref: KPMG-INDIRECT-2026, title: "Benchmarking Indirect Tax in a data-driven era (2026 KPMG Indirect Tax Benchmarking Survey)", publisher: "KPMG International", type: survey, url: "https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2026/05/benchmarking-indirect-tax-in-a-data-driven-era.pdf.coredownload.inline.pdf", date: "2026-05", access: full, locator: "pp. 6 and 11 (ERP fitness; e-invoicing ownership and solution approach)"}
    - {ref: EU-DIRECTIVE-2025-516, title: "Council Directive (EU) 2025/516 amending Directive 2006/112/EC as regards VAT rules for the digital age", publisher: "Council of the European Union", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025L0516", date: "2025-03-11", access: full, locator: "Recital (6) on EN 16931"}
    - {ref: INNOVATETAX-VXE-2026, title: "What we learned from Vertex Exchange Europe 2026", publisher: "Innovate Tax", type: conference, url: "https://innovatetax.com/blog/what-we-learned-from-vertex-exchange-europe-2026/", date: "2026-05-06", access: full, locator: "section 'Master data came up a lot'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The discourse angle graded this delegate/process; augment/step is used because each correction needs a user's
    approval. The 1.6% figure is adjacent to, not a measure of, AI diagnosis. Sovos's transaction volume differs between
    releases ('nearly 20 billion' a year in March 2026; 'more than 70 billion' in Aug and Sep 2026). Overlaps
    tax-data-technology research entries on e-invoicing remediation.

- id: tax-indirect-tax-09
  title: Continuous regulatory-change monitoring with alerts tied to primary sources
  archetype: tax
  module: indirect-tax
  function: risk-compliance-legal
  work_types: [research-synthesis]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Fonoa says more than 70 countries have added or changed e-invoicing rules since 2020, nexus, marketplace and
    digital-services rules keep shifting, and monitoring relies on one person watching a few countries, advisor digests
    and forwarded newsletters, so changes often surface at filing time (FONOA-MONITORING-2026).
  solution: >-
    Monitoring once, centrally, filtered to the company's jurisdictions and tax types, with every alert linked to the
    primary source (gazette entry or directive), a confidence score and proposals labelled as proposals (Fonoa
    Knowledge). Sovos describes regulatory intelligence that assesses how rule changes affect each customer's
    configuration. Avalara's research agents summarise primary sources with citations. Thomson Reuters Institute
    describes horizon scanning that maps rule changes to products and systems.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "no detection rate, false-alert rate or time-to-alert from Fonoa, Sovos or Avalara", provenance: vendor-published, source_ref: FONOA-MONITORING-2026}
  prerequisites:
    - "A profile of entities, jurisdictions and tax types in scope (FONOA-MONITORING-2026)"
    - "Access to primary legal sources in their languages; the Florida attorney notes many government sites are not accessible to AI engines (FLSALESTAX-AI-2026)"
  risks_and_guardrails:
    - "Fonoa says a summary is a reading of the law, not the law, and cannot be relied on alone in an audit (FONOA-CITATION-2026)"
    - "General models have knowledge cutoffs; the Florida attorney gives the Oct 2025 repeal of Florida's commercial lease sales tax as an example an older model would miss (FLSALESTAX-AI-2026; not verified against the statute)"
    - "Fonoa reports a confidence score on each alert; no accuracy of those scores is published (FONOA-CITATION-2026)"
  human_checkpoints:
    - "The tax team decides whether a surfaced change matters to the business (FONOA-MONITORING-2026)"
    - "Applying a summarised change may need a human's deterministic application (FONOA-STACK-2025)"
  role_evolution: >-
    Fonoa says coverage should stop depending on headcount (FONOA-MONITORING-2026). The Vertex Exchange Europe recap says
    staff will need to understand how rules are configured, explained, audited and defended (INNOVATETAX-VXE-2026).
  evidence_grade: C
  sources:
