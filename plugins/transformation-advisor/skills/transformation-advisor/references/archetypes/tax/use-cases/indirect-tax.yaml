# Use cases: tax / indirect-tax (VAT, GST, US sales and use tax, e-invoicing and continuous transaction controls,
# exemption certificates, registration and nexus, agentic commerce, indirect-tax audits).
# Merged from research/runs/wave2/tax-indirect-tax-practice.md, -discourse.md and -governance.md, plus items
# routed to indirect-tax from other wave 2 tax files. See research/runs/wave2/indirect-tax-synthesis-report.md.
# Figures are vendor-published unless the outcome says otherwise. No error rate, override rate or parallel-run
# result exists for any commercial indirect-tax AI tool in the sources read.
# Tax-authority AI (CDTFA agent assist, IRAS chatbot, Austrian risk models, state audit selection) is left to the
# controversy module; tax-team-built pipelines and three-way reconciliation are left to tax-data-technology.
# Canonical source keys: AVALARA-AGENTIC-2025 (= ACCTODAY-AVALARA-2025), AVALARA-AGENTIC-2025b (= ITWIRE-AVALARA-2025),
# FONOA-2026 (= FONOA-2026-SURVEY, FONOA-INDIRECT-2026), FONOA-176-2026 (governance file's FONOA-BLOG-2026),
# FONOA-CITATION-2026 (= FONOA-PRIMARY-2026), FONOA-MONITORING-2026 (= FONOA-REGMON-2026),
# TR-INDIRECT-2026 (= TR-INDIRECT-DATA-2026), TR-AGENTICIT-2026 (= TR-READYEXP-2026),
# BTAX-AGENTICCOMMERCE-2026 (= BTAX-AGENTIC-2026, BTAX-BAL-2026), SOVOS-FRANCE-2026b (discourse file's SOVOS-FRANCE-2026),
# EC-VIDA-2025 (= EC-VIDA-2026).

- id: tax-indirect-tax-01
  title: AI-proposed product tax codes with confidence scores, reviewed by a person
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Correct tax depends on each product being mapped to the right tax code. Mapping thousands of products by hand is
    slow and inconsistent between reviewers, and wrong mappings produce wrong tax at transaction time that is hard to
    defend in an audit (TR-CLASSIFICATION-2026). Dell's authors call HSN and SAC code determination (India's goods and
    services codes) a major tax-compliance use case (NATH-DELL-2025).
  solution: >-
    A model reads the product description and proposes a tax code with a confidence or similarity score; a person
    accepts, compares or overrides it. Vertex Smart Categorization covers US sales tax categories with a confidence
    score and an approval workflow. Thomson Reuters embeds CoCounsel in ONESOURCE Determination to return up to three
    suggestions. Sovos returns up to three ranked suggestions with a confidence level. Avalara lists mapping products to
    tax codes among Aviator's capabilities. Dell trained small encoder-decoder models that generate the hierarchical
    HSN or SAC code step by step with constrained decoding.
  outcomes:
    - {lever: quality, description: "Dell's best small model (T5) against codes assigned by tax and procurement experts", figure: "precision 70%, recall 61%, F1 65%", measures: "agreement of T5 predictions with expert-assigned HSN/SAC codes on a curated test set of 16,000 records; code level and averaging method not stated", provenance: self-reported, source_ref: NATH-DELL-2025}
    - {lever: speed, description: "Vertex's CEO says observed categorization time fell from more than a minute and a half to a few seconds per product", figure: ">1.5 minutes to a few seconds per product", measures: "observed categorization time per product for live Smart Categorization customers, as stated on an earnings call; customers, sample and method not given", provenance: vendor-published, source_ref: VERTEX-Q1CALL-2026}
    - {lever: speed, description: "Thomson Reuters states bulk classification of 100 SKUs takes about 5 minutes versus days of manual review", figure: "100 SKUs in 5 minutes", measures: "illustrative benefit statement for ONESOURCE Determination with CoCounsel; no customer, sample or baseline", provenance: vendor-published, source_ref: TR-CLASSIFICATION-2026}
    - {lever: quality, description: "none published for the commercial tools (no accuracy, override or error rate)", figure: "none published", measures: "not applicable", provenance: vendor-published, source_ref: VERTEX-SMARTCAT-2026}
  prerequisites:
    - "A digital product catalogue with complete, specific descriptions; Sovos says detail improves suggestions (SOVOS-DOCS-AICLASS)"
    - "A tax engine with a defined category tree and a master-data process that carries the chosen code through to invoicing (VERTEX-SMARTCAT-2026, INNOVATETAX-VXE-2026)"
    - "Expert-labelled records to test against, and monitoring for data drift (NATH-DELL-2025)"
  risks_and_guardrails:
    - "Sovos warns that a high confidence score does not guarantee the code is correct and tells users always to review suggestions before mapping (SOVOS-DOCS-AICLASS)"
    - "Thomson Reuters says generic models can express high confidence in wrong classifications (TR-CLASSIFICATION-2026)"
    - "Dell's best model reached 70% precision and 61% recall, so expert review stays necessary; Dell reports fluctuating agreement in later months and attributes it to data drift (NATH-DELL-2025, Sect. 3)"
    - "Vertex positions AI around a deterministic tax engine that remains the system of record (VERTEX-Q1CALL-2026)"
    - "Weak product classifications surface at the point of invoice under e-invoicing and real-time reporting (INNOVATETAX-VXE-2026)"
  human_checkpoints:
    - "A person confirms or overrides each suggested code; ONESOURCE lets the reviewer record a rationale of up to 500 characters (TR-HELP-PRODCLASS)"
    - "Low and very low confidence suggestions are reviewed or sent back for more product detail (SOVOS-DOCS-AICLASS)"
    - "Thomson Reuters suggests auto-processing items at 90% confidence and above and routing the rest to specialists; this is a suggested workflow, not a reported practice (TR-CLASSIFICATION-2026)"
  role_evolution: >-
    Thomson Reuters describes classifiers becoming reviewers who spend their time on low-confidence and nuanced cases
    (TR-CLASSIFICATION-2026). Vertex says every active customer is expected to send 100% of its catalogue through the
    tool (VERTEX-Q1CALL-2026).
  evidence_grade: A
  sources:
    - {ref: NATH-DELL-2025, title: "Domain-Adaptive Small Language Models for Structured Tax Code Prediction (arXiv 2507.10880)", publisher: "Dell Technologies (Nath, Wadhwa, Perez)", type: academic, url: "https://arxiv.org/abs/2507.10880", date: "2025-07-19", access: full, locator: "Abstract; Sect. 3, Table 1 and Cohen's kappa discussion"}
    - {ref: VERTEX-Q1CALL-2026, title: "Vertex (VERX) Q1 2026 Earnings Transcript", publisher: "Vertex Inc. (Motley Fool transcript on Yahoo Finance)", type: vendor, url: "https://finance.yahoo.com/markets/stocks/articles/vertex-verx-q1-2026-earnings-203016568.html", date: "2026-05-07", access: full, locator: "CEO prepared remarks, AI strategy (Smart Categorization paragraphs)"}
    - {ref: VERTEX-SMARTCAT-2026, title: "Vertex Smart Categorization data sheet", publisher: "Vertex Inc.", type: vendor, url: "https://www.vertexinc.com/sites/default/files/2026-05/202604-data-sheet-vertex-smart-categorization-v3.pdf", date: "2026-04", access: full, locator: "pp. 1-2 (confidence score; human in the loop)"}
    - {ref: TR-CLASSIFICATION-2026, title: "How AI can rescue product classification for indirect tax teams", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/blog/how-ai-can-rescue-product-classification-for-indirect-tax-teams/", date: "2026-04-10", access: full, locator: "sections 'How it works' and 'Practical benefits'"}
    - {ref: TR-HELP-PRODCLASS, title: "Review product classification results", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en-us/help/onesource-indirect-tax/indirect-tax-compliance/mappings/product-classification/review-product-classification-results", date: "2026-10-17", access: full, locator: "Review AI-generated suggestions; Confirm Your Selection and Rationale (page undated; retrieval date used)"}
    - {ref: SOVOS-DOCS-AICLASS, title: "About AI product classification", publisher: "Sovos", type: vendor, url: "https://docs.sovos.com/en/indirect-tax/indirect-tax-products/tax-determination/tax-determination/map-products-exemptions-and-locations/ai-product-classification/about-ai-product-classification", date: "2026-10-17", access: full, locator: "How it works; confidence level table; CAUTION note (page undated; retrieval date used)"}
    - {ref: AVALARA-AVIATOR-2026, title: "Avalara Ushers in New Era of Agentic Tax and Compliance with Avalara Aviator", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/guest-articles/company-news/avalara-ushers-in-new-era-of-agentic-tax-and-compliance-with-avalara-aviator", date: "2026-09-23", access: full, locator: "list of initial Aviator capabilities"}
    - {ref: INNOVATETAX-VXE-2026, title: "What we learned from Vertex Exchange Europe 2026", publisher: "Innovate Tax", type: conference, url: "https://innovatetax.com/blog/what-we-learned-from-vertex-exchange-europe-2026/", date: "2026-05-06", access: full, locator: "sections 'AI is becoming a default expectation' and 'Master data came up a lot'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade A rests only on Dell's measured test-set result (a named company measuring tax-code prediction); the paper
    does not say whether the model is in production. The commercial-tool figures are vendor claims at grade C level.
    Maturity is piloting: Vertex says customers have moved to production but names none. Thomson Reuters's 94/81/67%
    confidence figures in its blog illustrate the output format and are not measured accuracy. Harmonized System
    (customs) classification evidence is routed to tax-data-technology or a customs sub-topic.

- id: tax-indirect-tax-02
  title: Agent-prepared sales and use tax and VAT returns, filed only after human approval
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    US sales and use tax reporting spans more than 19,000 jurisdictions; data import, validation and return mapping
    consume the compliance cycle (TR-SUTAI-2026). Fonoa's survey of 176 indirect tax leaders found 71% of teams have
    not fully automated a single workflow end to end (FONOA-176-2026).
  solution: >-
    Agents ingest transaction data, validate it, apply jurisdiction rules, map it to returns and present the return for
    inspection, editing and approval; filing happens only after approval and each step is logged. Thomson Reuters's
    ONESOURCE Sales and Use Tax AI uses CoCounsel agents and markets "touchless compliance", with e-filing in 33 states
    plus Canada. Avalara's Returns AI calls its Returns APIs and files on the client's behalf upon approval, and its
    October 2025 release says it covers European VAT returns. Deloitte describes proof-of-concept agents that gather data
    and populate VAT returns with review built in. Both vendors keep the tax calculation in a rule-based engine
    (TR-AGENTICIT-2026).
  outcomes:
    - {lever: speed, description: "Thomson Reuters states routine reporting time falls by up to 65%", figure: "up to 65%", measures: "time spent on routine reporting, per the launch release; baseline, sample and customers not stated", provenance: vendor-published, source_ref: TR-SUTAI-2026}
    - {lever: speed, description: "Thomson Reuters states large-enterprise compliance cycles fall from 30 days to 11", figure: "30 days to 11 days", measures: "compliance cycle length for large enterprises, per the release; customers not named", provenance: vendor-published, source_ref: TR-SUTAI-2026}
    - {lever: risk, description: "Thomson Reuters says early customers report up to 75% lower audit exposure", figure: "up to 75%", measures: "reduction in audit exposure reported by early customers; the metric is not defined and customers are not named", provenance: vendor-published, source_ref: TR-SUTAI-2026}
    - {lever: cost, description: "Thomson Reuters gives annual savings for small and large enterprises", figure: "about $25,000 (small); $60,000 or more (large) per year", measures: "annual savings in time and efficiency, per the release; method not stated", provenance: vendor-published, source_ref: TR-SUTAI-2026}
    - {lever: capacity, description: "The earlier ONESOURCE+ release gave a lower range for preparation time saved", figure: "40-60%", measures: "preparation time saved, per the 5 Nov 2025 release; basis not stated and different from the later 65%", provenance: vendor-published, source_ref: TR-ONESOURCEPLUS-2025}
  prerequisites:
    - "Clean, complete transaction data reaching the tax engine; Deloitte says outcomes depend on data quality (DELOITTE-AGENTIC-2026)"
    - "A return platform with form and jurisdiction coverage, current content and e-filing connections (TR-SUTAI-2026)"
    - "A defined governance model; Thomson Reuters says oversight policies, audit-trail standards and review checkpoints do not write themselves (TR-AGENTICIT-2026)"
  risks_and_guardrails:
    - "Deloitte warns that poor implementation can cause filing errors and penalties, and relays its 2025 research finding that 77% of surveyed tax leaders require 90% or better accuracy before trusting AI (DELOITTE-AGENTIC-2026)"
    - "Avalara states nothing is submitted without explicit human consent and that steps are logged (AVALARA-AVI-2025)"
    - "TEI attendees reported that AI errors are increasingly quiet and technical, which makes review harder as volumes rise (TEI-TAXTECH-2026)"
    - "57.4% of Fonoa's 176 respondents are not confident they could defend AI-assisted decisions to a tax authority (FONOA-176-2026)"
    - "IRS OPR Alert 2026-19 covers federal tax practice under Circular 230; it does not address state sales tax or VAT filings (IRS-OPR-2026)"
  human_checkpoints:
    - "Final review and sign-off before filing (TR-SUTAI-2026)"
    - "Return presented for inspection, editing and approval before automatic filing (AVALARA-AVI-2025)"
    - "Agents notify a person for novel situations and key decisions that affect the compliance footprint (AVALARA-AGENTIC-2025)"
  role_evolution: >-
    Thomson Reuters says professionals shift from operations to advisory work, and that preparation taking days narrows
    to hours of review and sign-off (TR-SUTAI-2026, TR-AGENTICIT-2026; vendor projection). Deloitte says teams get
    clearer visibility into where judgment is applied (DELOITTE-AGENTIC-2026). In KPMG's survey 58% expect indirect-tax
    headcount to stay largely unchanged over five years because of AI (KPMG-INDIRECT-2026).
  evidence_grade: C
  sources:
    - {ref: TR-SUTAI-2026, title: "Thomson Reuters Launches AI Tax Compliance Solution That Saves Time and Reduces Risk (ONESOURCE Sales and Use Tax AI)", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2026/january/thomson-reuters-launches-ai-tax-compliance-solution-that-saves-time-and-reduces-risk", date: "2026-01-15", access: full, locator: "bullet list of measurable impact; 'Touchless Compliance' paragraph"}
    - {ref: TR-ONESOURCEPLUS-2025, title: "Thomson Reuters launches ONESOURCE+", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-onesource-plus-the-ai-powered-intelligent-compliance-network", date: "2025-11-05", access: full, locator: "product highlights, first bullet"}
    - {ref: TR-AGENTICIT-2026, title: "Is your tax department ready for the agentic AI explosion?", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/is-your-tax-department-ready-for-the-agentic-ai-explosion/", date: "2026-06-08", access: full, locator: "sections 'The governance gap' and 'Why the right partner matters'"}
    - {ref: AVALARA-AGENTIC-2025, title: "Avalara launches 'always on, always ready' AI agents", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/avalara-launches-always-on-always-ready-ai-agents", date: "2025-09-30", access: full, locator: "paragraphs on Returns AI and human review"}
    - {ref: AVALARA-AGENTIC-2025b, title: "Avalara Launches Agentic Tax and Compliance: AI Agents That Work for You", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/business-it-news/data/avalara-launches-agentic-tax-and-compliance-ai-agents-that-work-for-you", date: "2025-10-01", access: full, locator: "section 'Have Your Agent Call Our Agent' (VAT returns in Europe)"}
    - {ref: AVALARA-AVI-2025, title: "Avalara launches Avi AI agents for secure automated tax compliance", publisher: "IT Brief UK", type: press, url: "https://itbrief.co.uk/story/avalara-launches-avi-ai-agents-for-secure-automated-tax-compliance", date: "2025-11-04", access: full, locator: "sections 'Functions and agent network' and 'Agentic workflow'"}
    - {ref: DELOITTE-AGENTIC-2026, title: "Agentic AI and indirect tax: a practical view for tax directors", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/global/en/services/tax/perspectives/agentic-ai-and-indirect-tax-practical-view-for-tax-directors.html", date: "2026-07-01", access: full, locator: "section 2 'Filing'; section 'Mitigating risk and supporting accountability'"}
    - {ref: FONOA-176-2026, title: "What 176 Tax Leaders Have to Say About AI Adoption in Indirect Tax", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/blog/ai-adoption-indirect-tax-report", date: "2026-06-30", access: full, locator: "sections 'Most tax teams can't govern their AI outputs' and 'AI tax decisions face an audit defensibility gap'"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "section 'A very bad wizard'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "opening paragraph and Circular 230 discussion"}
    - {ref: KPMG-INDIRECT-2026, title: "Benchmarking Indirect Tax in a data-driven era (2026 KPMG Indirect Tax Benchmarking Survey)", publisher: "KPMG International", type: survey, url: "https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2026/05/benchmarking-indirect-tax-in-a-data-driven-era.pdf.coredownload.inline.pdf", date: "2026-05", access: full, locator: "pp. 5-7 (data quality, ERP fitness, headcount expectation)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Maturity is piloting: Thomson Reuters says the product is available now, but the public evidence is unnamed early
    customers (Thomson Reuters), early-access programmes (Avalara) and proof-of-concept work (Deloitte). Thomson Reuters
    figures disagree between releases (40-60% vs up to 65%). Avalara's 9 Apr 2026 "AI-executed" release could not be
    opened (search-only in the landscape). The governance angle graded this augment; delegate is used because the agent
    owns import-to-filing with an approval checkpoint.

- id: tax-indirect-tax-03
  title: AI validation and routing of exemption certificates as they arrive
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Exemption and resale certificates (customer documents that justify not charging sales tax) are one of the most
    manual areas of compliance, and certificate errors can lead to audit exposure and penalties (AVALARA-ECM-2026).
    Incomplete certificate data also causes problems at the point of invoice under e-invoicing (INNOVATETAX-VXE-2026).
  solution: >-
    Avalara says its Exemption Certificate Management product can ingest, classify, validate and route certificates
    with intelligent document processing, spot missing fields and flag potential errors, and search the certificate
    store in natural language (AVALARA-ECM-2026). Avalara lists validating exemption certificates among Aviator agent
    tasks and says customers can ask an agent to run certificate validations (AVALARA-AVIATOR-2026, AVALARA-AGENTIC-2025b).
  outcomes:
    - {lever: quality, description: "Avalara says AI review finds missing fields and errors faster and more accurately than manual review; no figure", figure: "none published", measures: "no error rate, volume or time figure published", provenance: vendor-published, source_ref: AVALARA-ECM-2026}
  prerequisites:
    - "Certificates captured in a system that can ingest documents and route them to a workflow (AVALARA-ECM-2026)"
    - "A certificate repository linked to complete customer master data (INNOVATETAX-VXE-2026)"
    - "State-specific acceptance and good-faith rules (not retrieved by the research)"
  risks_and_guardrails:
    - "A wrong validation exposes the seller to the audit and penalty risk the tool is meant to reduce (AVALARA-ECM-2026)"
    - "Certificate acceptance and good-faith rules were not retrieved, so the control standard for automating acceptance is unknown"
    - "The Sales Tax Institute warns that agents cannot apply an exemption to products they cannot classify (STI-AGENTIC-2026)"
  human_checkpoints:
    - "Flagged or failed certificates route to a person; the source describes routing but not the exact review step (AVALARA-ECM-2026)"
    - "Avalara says agents ask a human for novel situations (AVALARA-AGENTIC-2025)"
  role_evolution: >-
    Avalara says automation lets tax teams spend less time on paperwork and more on strategy (AVALARA-ECM-2026). No
    independent source describes a role change.
  evidence_grade: C
  sources:
    - {ref: AVALARA-ECM-2026, title: "How AI Improves Exemption Certificate Management", publisher: "Avalara", type: vendor, url: "https://www.avalara.com/blog/en/north-america/2026/02/ai-exemption-certificate-management.html", date: "2026-02-23", access: full, locator: "sections 'AI-powered certificate validation' and 'Intelligent document processing + automated workflows'"}
    - {ref: AVALARA-AVIATOR-2026, title: "Avalara Ushers in New Era of Agentic Tax and Compliance with Avalara Aviator", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/guest-articles/company-news/avalara-ushers-in-new-era-of-agentic-tax-and-compliance-with-avalara-aviator", date: "2026-09-23", access: full, locator: "capability list"}
    - {ref: AVALARA-AGENTIC-2025b, title: "Avalara Launches Agentic Tax and Compliance: AI Agents That Work for You", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/business-it-news/data/avalara-launches-agentic-tax-and-compliance-ai-agents-that-work-for-you", date: "2025-10-01", access: full, locator: "product list; 'From returns to tax calculations to certificate validations' passage"}
    - {ref: AVALARA-AGENTIC-2025, title: "Avalara launches 'always on, always ready' AI agents", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/avalara-launches-always-on-always-ready-ai-agents", date: "2025-09-30", access: full, locator: "paragraph on asking an agent to do tax work"}
    - {ref: INNOVATETAX-VXE-2026, title: "What we learned from Vertex Exchange Europe 2026", publisher: "Innovate Tax", type: conference, url: "https://innovatetax.com/blog/what-we-learned-from-vertex-exchange-europe-2026/", date: "2026-05-06", access: full, locator: "section 'Master data came up a lot'"}
    - {ref: STI-AGENTIC-2026, title: "Can AI Shopping Agents Apply Sales Tax Holidays?", publisher: "Sales Tax Institute", type: press, url: "https://www.salestaxinstitute.com/resources/ai-shopping-agents-sales-tax-holidays", date: "2026-07-29", access: full, locator: "closing checklist"}
  last_reviewed: "2026-10-17"
  notes: >-
    Vendor descriptions only; no named customer or measurement. A Wolters Kluwer CERTifyTax webinar and further Avalara
    webinars were seen only in search summaries and are not used. Full-population re-validation of an existing
    certificate store is a separate entry (tax-indirect-tax-04).

- id: tax-indirect-tax-04
  title: Full-population re-validation of the existing exemption certificate store
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [review-assurance, transaction-processing]
  pattern: full-population-testing
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Certificates are collected, stored and checked by hand, so invalid or expired certificates stay undiscovered until
    an audit.
  solution: >-
    Document intelligence extracts and validates every certificate on file rather than checking them one at a time as
    they arrive. Numeral says that when customers move existing certificates onto its platform it validates them and
    often finds a large share fail. Avalara describes exemption agents that cross-check certificates against
    authoritative registries to keep records accurate.
  outcomes:
    - {lever: quality, description: "Numeral reports that many certificates moved onto its platform fail validation", figure: "30% to 40%", measures: "share of customers' existing exemption certificates that fail validation when moved onto Numeral's platform ('often finds'); number of customers and certificates not given", provenance: vendor-published, source_ref: NUMERAL-2026}
    - {lever: capacity, description: "Numeral says its certificate management offering can save up to 400 hours a year per company", figure: "up to 400 hours a year", measures: "hours saved per company per year, per Numeral; basis not given", provenance: vendor-published, source_ref: NUMERAL-2026}
  prerequisites:
    - "Existing certificates digitised or uploadable (inferred)"
    - "Access to registries or validation sources for the jurisdictions in scope (Avalara names authoritative registries; the rest is inferred)"
  risks_and_guardrails:
    - "Certificates that fail validation indicate compliance issues that may not have been identified before (NUMERAL-2026), so findings need a remediation process, not just a report"
    - "Avalara says its agents run within its security perimeter and keep checkpoints for human review (AVALARA-AVI-2025)"
  human_checkpoints:
    - "Not described for certificate validation specifically; Avalara states human review and approval checkpoints exist at every stage of its agent platform (AVALARA-AVI-2025)"
  role_evolution: >-
    Not described beyond Avalara's general statement that agents handle scanning and cross-verification while people
    keep decisions (AVALARA-AVI-2025).
  evidence_grade: C
  sources:
    - {ref: NUMERAL-2026, title: "Numeral Raises $100 Million Series C to Expand AI-Powered Tax Compliance Across Industries", publisher: "Numeral", type: vendor, url: "https://www.numeralhq.com/blog/series-c", date: "2026-09-23", access: full, locator: "paragraph beginning 'Customers using Numeral can reduce...'"}
