- id: tax-indirect-tax-20
  title: General-purpose AI for first-pass analysis and month-end summaries in a sanctioned workspace
  archetype: tax
  module: indirect-tax
  function: finance-accounting
  work_types: [research-synthesis, document-production, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Small in-house indirect-tax teams cover many jurisdictions and cannot spend scarce time on recurring analysis and
    summaries (PLUSGRADE-JOB-2026). Meanwhile 60.8% of Fonoa's 176 organisations rely mainly on individuals using public
    AI tools without governance, oversight or audit trail (FONOA-176-2026).
  solution: >-
    Plusgrade's Tax Manager, Indirect posting says AI handles the first pass on recurring data analysis and month-end tax
    summaries so the manager focuses on judgment calls and multi-jurisdictional research; it asks candidates to have
    replaced recurring manual work with workflows they built and to tell trustworthy output from output needing
    judgment. Providing approved, grounded tools with logging and a use policy keeps this work in an environment the tax
    function can see.
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: PLUSGRADE-JOB-2026}
    - {lever: risk, description: "Organisations relying primarily on individuals using public AI tools without governance, oversight or audit trail", figure: "60.8%", measures: "share of 176 surveyed indirect tax organisations whose AI use rests mainly on individuals using public tools", provenance: vendor-published, source_ref: FONOA-176-2026}
    - {lever: risk, description: "Corporate professionals using AI tools their organisation has not sanctioned", figure: "36%", measures: "share of corporate professionals in Thomson Reuters' 2026 data; sample size not stated", provenance: vendor-published, source_ref: TR-INDIRECT-2026}
  prerequisites:
    - "Approved AI tools; Plusgrade says its teams are given AI tools and encouraged to use them thoughtfully (PLUSGRADE-JOB-2026)"
    - "A manager able to judge output quality (PLUSGRADE-JOB-2026)"
    - "An approved-use policy, vetting of third-party tools and an owner for tax AI (TEI-TAXTECH-2026)"
  risks_and_guardrails:
    - "Entering a client's data into a public model without consent is likely to breach confidentiality (ICAEW-PCRT-2026)"
    - "IRS OPR asks practitioners to use secure, enterprise-approved AI and not to upload sensitive data to unsecured sites; the alert addresses federal tax return information (IRS-OPR-2026)"
    - "The EU AI Act requires providers and deployers to take measures to ensure sufficient AI literacy of staff (EU-AIACT-2024, Art. 4)"
    - "44% of corporate professionals at organisations with a named AI strategy say day-to-day practice does not match it (TR-INDIRECT-2026)"
    - "TEI attendees described silent hallucinations and the difficulty of reviewing growing volumes of quiet, technical errors (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "The Tax Manager owns the final call on complex transactions and reviews AI output (PLUSGRADE-JOB-2026)"
    - "A reviewer checks AI research output against primary sources"
  role_evolution: >-
    The Plusgrade role is framed as architect of end-to-end indirect-tax processes and the face of the company in
    audits, with AI taking the first pass (PLUSGRADE-JOB-2026). Thomson Reuters Institute advises staff to become
    translators between tax and technology (TR-INSTITUTE-2025).
  evidence_grade: B
  sources:
    - {ref: PLUSGRADE-JOB-2026, title: "Tax Manager, Indirect (Plusgrade)", publisher: "Built In Toronto (Plusgrade posting)", type: job-posting, url: "https://builtintoronto.com/job/tax-manager-indirect/8736459", date: "2026-05", access: full, locator: "'What You'll Be Doing' and 'What You Bring'"}
    - {ref: FONOA-176-2026, title: "What 176 Tax Leaders Have to Say About AI Adoption in Indirect Tax", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/blog/ai-adoption-indirect-tax-report", date: "2026-06-30", access: full, locator: "section 'AI adoption pressure is near universal, clear targets are not'"}
    - {ref: TR-INDIRECT-2026, title: "What three years of data reveal about AI in corporate indirect tax", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/what-three-years-of-data-reveal-about-ai-in-corporate-indirect-tax/", date: "2026-08-27", access: full, locator: "Highlights; section '2026: The data caught up'"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "passages on governance vacuums and the ownership poll"}
    - {ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01", access: full, locator: "'Fundamental principles', Confidentiality"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "section 6713/7216 paragraph and best-practice list"}
    - {ref: EU-AIACT-2024, title: "Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (AI Act)", publisher: "European Parliament and Council", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689", date: "2024-06-13", access: full, locator: "Article 4 (AI literacy)"}
    - {ref: TR-INSTITUTE-2025, title: "AI and the indirect tax department: From compliance to strategy", publisher: "Thomson Reuters Institute", type: vendor, url: "https://www.thomsonreuters.com/en/institute/articles/ai-indirect-tax", date: "2025-09-17", access: full, locator: "section 'Elevating your profile'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B rests on one employer's job posting, a weak real-use signal, so no outcome is claimed. The posting date was
    not shown; 2026-05 is the month the job was removed. Merges the practice job-posting entry with the governance
    sanctioned-workspace idea. Thomson Reuters's 65% GenAI use and 26% ROI measurement figures have undefined
    denominators. Tax-analyst-built pipelines ('vibe coding') are left to tax-data-technology.

- id: tax-indirect-tax-21
  title: Ongoing indirect-tax exposure, accrual and scenario analysis by agents (idea)
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [expert-judgment, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Indirect-tax teams answer ad hoc business questions about supply-chain changes, new markets and pricing, and book
    conservative accruals because of data gaps (DELOITTE-AGENTIC-2026).
  solution: >-
    Idea discussed by practitioners: agents run ongoing scenario analysis for supply-chain or trade changes, give a view
    of exposures that may reduce conservative over-accruals, and flag transactions that create unmanaged exposure
    (Deloitte). Thomson Reuters Institute adds forecasting VAT/GST cash flows and quantifying audit exposure by country,
    product and customer segment.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "not applicable", provenance: self-reported, source_ref: DELOITTE-AGENTIC-2026}
  prerequisites:
    - "Consolidated transaction and customer data with product mapping (inferred)"
  risks_and_guardrails:
    - "Deloitte calls its examples illustrative and says tax professionals stay responsible for decisions (DELOITTE-AGENTIC-2026)"
  human_checkpoints:
    - "Structured input is provided for consideration by tax professionals (DELOITTE-AGENTIC-2026, section 3)"
  role_evolution: >-
    Tax engages earlier in decisions rather than validating after the fact (DELOITTE-AGENTIC-2026, section 3).
  evidence_grade: D
  sources:
    - {ref: DELOITTE-AGENTIC-2026, title: "Agentic AI and indirect tax: a practical view for tax directors", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/global/en/services/tax/perspectives/agentic-ai-and-indirect-tax-practical-view-for-tax-directors.html", date: "2026-07-01", access: full, locator: "section 2 (accruals) and section 3 (scenario analysis)"}
    - {ref: TR-INSTITUTE-2025, title: "AI and the indirect tax department: From compliance to strategy", publisher: "Thomson Reuters Institute", type: vendor, url: "https://www.thomsonreuters.com/en/institute/articles/ai-indirect-tax", date: "2025-09-17", access: full, locator: "paragraph beginning 'As AI takes on more processing'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. No deployment found. Kept because it is the only advisory-side (rather than compliance) frontier use case.

- id: tax-indirect-tax-22
  title: Deterministic rule engine that checks each step of LLM-agent VAT determination (idea)
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Model agents that classify, locate, rate, exempt and apply reverse charge can fail silently. In one study,
    retrieval-based and fine-tuned set-ups got 20-30% of real-world VAT analyses wrong (LUKETINA-VAT-2026).
  solution: >-
    Idea: split cross-border VAT determination into auditable steps (classification, jurisdiction, rate, exemption,
    reverse charge), let model agents handle the language and lookup steps, and check every step against a deterministic
    rule engine. The Austrian VAT study's authors and an agent-design pilot both point to language models plus law-based
    rules for the final decision. Vendors and practitioners describe the same split in general terms: deterministic
    engines do the tax math and AI handles reasoning and orchestration (TR-AGENTICIT-2026, FONOA-STACK-2025).
  outcomes:
    - {lever: quality, description: "None from a deployment. A preprint pilot on synthetic, oracle-labelled cases found a tuned single agent at 0.755 accuracy and the best orchestrated set-ups at 0.830; one schema-valid hallucinated record degraded every set-up", figure: "0.755 (single agent) vs 0.830 (best orchestrated); 4,400 runs", measures: "final-answer accuracy over 40 oracle-labelled synthetic cross-border VAT cases, five repeats per condition", provenance: independent, source_ref: SANTOS-VAT-2026}
  prerequisites:
    - "A maintained rule set that can act as the reference (oracle) for the cases in scope"
    - "Step-level logging so errors can be traced to jurisdiction or reverse-charge steps"
  risks_and_guardrails:
    - "The pilot is one workload, one model family and synthetic failure injection; the author calls the result directional (SANTOS-VAT-2026)"
    - "A single schema-conforming hallucinated record degraded all configurations and hit fragmented ones hardest (SANTOS-VAT-2026, abstract)"
    - "Frontier models compute fewer than a third of simplified US personal income tax returns correctly, which shows unaided models are weak at rule-heavy tax tasks (COLUMN-TAXCALCBENCH-2025; adjacent)"
  human_checkpoints:
    - "A tax expert approves outputs the rule engine cannot confirm"
    - "Review of rule-set changes"
  role_evolution: >-
    The function would own the rule set and its maintenance. No source describes role changes from a deployment.
  evidence_grade: D
  sources:
    - {ref: SANTOS-VAT-2026, title: "Right-Sizing LLM-Agent Decomposition in VAT Determination: A Pilot Controlled Sweep (arXiv 2608.23395, preprint)", publisher: "arXiv (Pedro Santos)", type: academic, url: "https://arxiv.org/abs/2608.23395", date: "2026-08-24", access: full, locator: "Abstract; Sect. 1 (pp. 1-2); Table 1 (p. 16)"}
    - {ref: LUKETINA-VAT-2026, title: "Using Large Language Models for Legal Decision-Making in Austrian Value-Added Tax Law: A Comparative Study (arXiv 2507.08468 v2; Journal of Business Analytics 2026)", publisher: "University of Applied Sciences Upper Austria and Johannes Kepler University Linz", type: academic, url: "https://arxiv.org/abs/2507.08468", date: "2026-09-02", access: full, locator: "Sect. 9.2 (p. 34)"}
    - {ref: TR-AGENTICIT-2026, title: "Is your tax department ready for the agentic AI explosion?", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/is-your-tax-department-ready-for-the-agentic-ai-explosion/", date: "2026-06-08", access: full, locator: "section 'A new kind of tool: One that uses other tools'"}
    - {ref: FONOA-STACK-2025, title: "Where AI Belongs in Your Tax Stack (And Where It Doesn't)", publisher: "Fonoa", type: vendor, url: "https://www.fonoa.com/resources/blog/where-ai-belongs-in-your-tax-stack", date: "2025-11-04", access: full, locator: "section 'The middle ground: layer AI assistance with deterministic final checks'"}
    - {ref: COLUMN-TAXCALCBENCH-2025, title: "TaxCalcBench: Evaluating Frontier Models on the Tax Calculation Task (arXiv 2507.16126)", publisher: "Column Tax", type: academic, url: "https://arxiv.org/abs/2507.16126", date: "2025-07-22", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: labelled D because no deployment was found. The accuracy figures come from a research pilot on synthetic cases
    by an independent researcher (preprint). Pattern 'other': a model proposes and a rule engine verifies each step.
    Overlaps the compliance and research-advisory modules' 'deterministic engine plus language model' entries.
