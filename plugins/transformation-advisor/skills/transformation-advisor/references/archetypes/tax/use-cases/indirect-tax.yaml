- id: tax-indirect-tax-10
  title: AI extraction and enrichment of invoice, receipt and expense data for VAT recovery and e-invoicing onboarding
  archetype: tax
  module: indirect-tax
  function: finance-accounting
  work_types: [transaction-processing, data-reporting]
  pattern: document-to-decision
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Input VAT on travel, expense and payables transactions is lost because receipts and invoices are fragmented and not
    validated or enriched with tax context (SOVOS-BLUEDOT-2026). Real-time e-invoicing regimes, which Vertex cites for
    Latin America, need onboarding, data mapping and invoice data extraction done accurately and with audit evidence
    (VERTEX-Q1CALL-2026).
  solution: >-
    Blue dot's platform extracts, cleanses, validates, enriches and contextualises invoice, receipt and expense data so
    eligible VAT can be identified and recovered. Sovos bought it on 15 Sep 2026 and intends to embed its models in the
    compliance flow and to reconcile structured B2B invoices with employee expenses and card transactions. Vertex bought
    Brinta in Q1 2026, an AI-first e-invoicing start-up targeting onboarding, data mapping, invoice data extraction and
    product classification. Avalara describes a connector that digitises invoices from Microsoft Outlook.
  outcomes:
    - {lever: quality, description: "Sovos states Blue dot has demonstrated high accuracy across VAT and taxable employee benefits lifecycles", figure: ">98%", measures: "accuracy 'across VAT and taxable employee benefits lifecycles' as stated by Sovos; metric definition, sample and period not given", provenance: vendor-published, source_ref: SOVOS-BLUEDOT-2026}
  prerequisites:
    - "Access to T&E and AP source systems (Blue dot is an SAP Concur Endorsed App)"
    - "Local clearance connectivity and certification for e-invoicing (inferred)"
  risks_and_guardrails:
    - "Integration into Sovos is stated as intent ('intends to embed'); nothing about the combined product is in production per the release (SOVOS-BLUEDOT-2026)"
    - "Vertex says in regions like Latin America accuracy, auditability and regulatory evidence are non-negotiable (VERTEX-Q1CALL-2026)"
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: "Not described."
  evidence_grade: C
  sources:
    - {ref: SOVOS-BLUEDOT-2026, title: "Sovos Acquires Blue dot", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-acquires-blue-dot-expanding-ai-native-diagnostics-workflow-and-intelligence-capabilities-widening-sovos-tax-compliance-platform-technology-lead/", date: "2026-09-15", access: full, locator: "paragraphs 'Expanding the Tax Compliance Platform into VAT Recovery' and 'Accelerating AI Across the Sovos Platform'"}
    - {ref: VERTEX-Q1CALL-2026, title: "Vertex (VERX) Q1 2026 Earnings Transcript", publisher: "Vertex Inc. (Motley Fool transcript on Yahoo Finance)", type: vendor, url: "https://finance.yahoo.com/markets/stocks/articles/vertex-verx-q1-2026-earnings-203016568.html", date: "2026-05-07", access: full, locator: "CEO remarks on the Brinta acquisition"}
    - {ref: AVALARA-AVI-2025, title: "Avalara launches Avi AI agents for secure automated tax compliance", publisher: "IT Brief UK", type: press, url: "https://itbrief.co.uk/story/avalara-launches-avi-ai-agents-for-secure-automated-tax-compliance", date: "2025-11-04", access: full, locator: "e-invoicing agents; section on Avi interfaces (Outlook)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merges two practice entries (Blue dot VAT recovery; Brinta onboarding and extraction) that make the same change:
    AI reads invoice-type documents into validated tax data. Sovos says Blue dot serves hundreds of enterprise customers,
    none named, so maturity is piloting. Acquisition and product descriptions only.

- id: tax-indirect-tax-11
  title: Pre-filing anomaly detection and exception triage across the full invoice and tax data population
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Misapplied rates, address mismatches and unusual swings in tax amounts are found at return time or after the
    authority asks (TR-BUSINESSCASE-2026). Manual review samples a small share of transactions, and under e-invoicing
    and digital reporting, gaps between reported transaction data and VAT return data become more visible to
    authorities (FONOA-ERRORRATE-2025). Fonoa found 85.8% of teams saw workload grow over two years (FONOA-176-2026).
  solution: >-
    Models flag outliers in tax data before filing and route exceptions to reviewers; Thomson Reuters gives an example
    of Pennsylvania sales tax jumping from about $3,000 to $10,000 in a month. Sovos lists proactive issue detection
    before filing deadlines. Thomson Reuters says some indirect tax teams use AI to triage invoice exceptions before
    they reach a reviewer (TR-INDIRECT-2026). An indirect tax consultant describes AI that validates invoices,
    reconciles VAT postings, identifies unusual transactions and improves VAT recovery accuracy (BTAX-VAT2026); Saffery
    held a webinar on AI for invoice reviews and anomaly detection. Fonoa recommends AI for anomaly detection across
    large invoice populations, with deterministic checks or human judgment for final decisions.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "no detection rate or measured result; Fonoa's comparison of a reviewer 97% accurate on 10% of transactions with a system 93% accurate on all is hypothetical", provenance: vendor-published, source_ref: FONOA-ACCURACY-2025}
  prerequisites:
    - "Consolidated, structured invoice and ledger data across entities and periods (BTAX-VAT2026)"
    - "Confidence thresholds that route uncertain items to people (FONOA-ACCURACY-2025)"
    - "Defined exception paths and override authority"
  risks_and_guardrails:
    - "False positives and negatives; Fonoa says thresholds and filters are needed to avoid alert fatigue (FONOA-ERRORRATE-2025)"
    - "Where a missed flag could mean a major fine, Fonoa says to keep deterministic logic as the backbone (FONOA-STACK-2025)"
    - "Fonoa says AI often adds a review step before it removes a manual one (FONOA-176-2026)"
    - "Thomson Reuters Institute recommends regular sampling of AI decisions with documented findings (TR-INSTITUTE-2025)"
  human_checkpoints:
    - "Flagged items go to review (TR-BUSINESSCASE-2026)"
    - "A tax manager verifies flags against known rules (FONOA-STACK-2025)"
  role_evolution: >-
    The Bloomberg Tax author says businesses will move from manual tasks to tech-driven VAT management supported by
    predictive analytics (BTAX-VAT2026). Fonoa found 31.2% of teams grew headcount while 85.8% saw workload grow
    (FONOA-176-2026).
  evidence_grade: C
  sources:
    - {ref: TR-BUSINESSCASE-2026, title: "How to build a business case for indirect tax process automation", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/blog/how-to-build-a-business-case-for-indirect-tax-process-automation/", date: "2026-02-05", access: full, locator: "section 'The AI revolution in indirect tax processes', predictive analytics bullet"}
    - {ref: TR-INDIRECT-2026, title: "What three years of data reveal about AI in corporate indirect tax", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/what-three-years-of-data-reveal-about-ai-in-corporate-indirect-tax/", date: "2026-08-27", access: full, locator: "section '2025: Strategy became the dividing line'"}
    - {ref: SOVOS-SOVI-2026, title: "Sovos Expands Sovi AI with New Capabilities for Tax Guidance, Intelligent Automation and Agent Interoperability", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-expands-sovi-ai/", date: "2026-03-24", access: full, locator: "'Proactive Issue Detection' bullet"}
    - {ref: BTAX-VAT2026, title: "Digital Mandates and AI Reshape VAT Compliance Landscape in 2026 (Eugen Trombitas)", publisher: "Bloomberg Tax", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/digital-mandates-and-ai-reshape-vat-compliance-landscape-in-2026", date: "2026-01-06", access: full, locator: "sections 'Growing AI Role' and 'E-Invoicing, Real-Time Reporting'"}
    - {ref: SAFFERY-VAT-2026, title: "Transforming VAT (webinar)", publisher: "Saffery", type: firm, url: "https://www.saffery.com/insights/videos-webinars/transforming-vat/", date: "2026-09-08", access: full, locator: "webinar topic list"}
    - {ref: FONOA-ACCURACY-2025, title: "AI Won't Make Your Tax Determinations Perfect (And That's Fine)", publisher: "Fonoa", type: vendor, url: "https://www.fonoa.com/resources/blog/ai-tax-determination-accuracy", date: "2025-10-29", access: full, locator: "sections 'Breadth of analysis can compensate for margin of error' and 'Confidence thresholds'"}
    - {ref: FONOA-ERRORRATE-2025, title: "Your 'Accurate' Tax Process Probably Has a 20% Error Rate", publisher: "Fonoa", type: vendor, url: "https://www.fonoa.com/resources/blog/accurate-tax-process-error-rate", date: "2025-11-11", access: full, locator: "sections 'Human tax processes fail more often' and 'AI catches different errors but introduces its own'"}
    - {ref: FONOA-STACK-2025, title: "Where AI Belongs in Your Tax Stack (And Where It Doesn't)", publisher: "Fonoa", type: vendor, url: "https://www.fonoa.com/resources/blog/where-ai-belongs-in-your-tax-stack", date: "2025-11-04", access: full, locator: "sections on determinism-critical use cases and layered AI"}
    - {ref: FONOA-176-2026, title: "What 176 Tax Leaders Have to Say About AI Adoption in Indirect Tax", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/blog/ai-adoption-indirect-tax-report", date: "2026-06-30", access: full, locator: "sections 'AI adoption hasn't reduced indirect tax workload' and 'Tax workload outgrew headcount'"}
    - {ref: TR-INSTITUTE-2025, title: "AI and the indirect tax department: From compliance to strategy", publisher: "Thomson Reuters Institute", type: vendor, url: "https://www.thomsonreuters.com/en/institute/articles/ai-indirect-tax", date: "2025-09-17", access: full, locator: "controls paragraph"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merges pre-filing anomaly detection (practice), full-population invoice review (discourse) and exception triage
    (governance). Maturity piloting rests only on a vendor blog's anecdotal statement that some teams triage exceptions
    with AI; no named organization. Fonoa's '20% error rate' headline is rhetorical and its spreadsheet-error studies were
    not opened. Overlaps compliance and tax-data-technology research entries on upstream anomaly flags.

- id: tax-indirect-tax-12
  title: Validation and repair of tax-relevant master and transaction data at the point of entry
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [data-reporting, software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Most indirect-tax errors start upstream (missing fields, inconsistent configuration, timing differences) and surface
    later as reconciliations, adjustments or audit questions (DELOITTE-AGENTIC-2026). In KPMG's survey of 53 large
    multinationals, 58% name data quality their biggest VAT/GST concern (44% in 2021), 61% correct data predominantly
    manually and 23% say their ERP is fit for purpose (KPMG-INDIRECT-2026).
  solution: >-
    Agents placed near master-data setup, accounts receivable and payable flows or tax determination extract, enrich and
    validate data as transactions occur, instead of at month end or return time; Deloitte describes proof-of-concept
    work in VAT. In KPMG's survey about 49% said their primary AI use case will be improving data quality. HMRC's
    roadmap observes that AI-enabled bookkeeping tools can now recommend tax categories using business context.
  outcomes:
    - {lever: quality, description: "none published for the AI use itself; 49% of KPMG respondents said improving data quality 'will be' their primary AI use case, which is an intention", figure: "none published", measures: "not applicable", provenance: independent, source_ref: KPMG-INDIRECT-2026}
  prerequisites:
    - "Access to ERP and billing master data and transaction flows"
    - "Controls embedded at source, KPMG's recommended action (KPMG-INDIRECT-2026)"
    - "Technology specialists in the team; about one third of KPMG respondents have none (KPMG-INDIRECT-2026, p. 7)"
    - "Basic data-management skills for tax staff (DELOITTE-AGENTIC-2026)"
  risks_and_guardrails:
    - "Fragmented, legacy ERP data makes AI harder to apply (KPMG-INDIRECT-2026, p. 6)"
    - "Fonoa finds AI use concentrated in research and drafting rather than the data reconciliation and return preparation where volume sits (FONOA-176-2026)"
    - "The OECD warns that poor data quality undermines AI reliability in tax administration, a risk equally relevant to taxpayers' data (OECD-GOVAI-2025, p. 173)"
  human_checkpoints:
    - "AI surfaces results for human review where judgment is required (DELOITTE-AGENTIC-2026)"
    - "The tax team approves rule changes that alter tax codes or party data"
  role_evolution: >-
    KPMG's foreword expects indirect-tax professionals to become data managers and gatekeepers of ERP changes;
    respondents see AI as a way to improve data quality, not to cut headcount (KPMG-INDIRECT-2026, pp. 2, 5).
  evidence_grade: C
  sources:
    - {ref: DELOITTE-AGENTIC-2026, title: "Agentic AI and indirect tax: a practical view for tax directors", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/global/en/services/tax/perspectives/agentic-ai-and-indirect-tax-practical-view-for-tax-directors.html", date: "2026-07-01", access: full, locator: "section 1 'Data: Reducing rework and late surprises'; 'What Agentic AI potentially changes'"}
    - {ref: KPMG-INDIRECT-2026, title: "Benchmarking Indirect Tax in a data-driven era (2026 KPMG Indirect Tax Benchmarking Survey)", publisher: "KPMG International", type: survey, url: "https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2026/05/benchmarking-indirect-tax-in-a-data-driven-era.pdf.coredownload.inline.pdf", date: "2026-05", access: full, locator: "foreword (p. 2); pp. 5-7, 15"}
    - {ref: HMRC-ROADMAP-2025, title: "HMRC's Transformation Roadmap", publisher: "HM Revenue & Customs", type: regulator, url: "https://www.gov.uk/government/publications/hmrc-transformation-roadmap", date: "2025-07-21", access: full, locator: "Section 6.1 case study 'AI-enabled products for tax purposes'"}
    - {ref: FONOA-176-2026, title: "What 176 Tax Leaders Have to Say About AI Adoption in Indirect Tax", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/blog/ai-adoption-indirect-tax-report", date: "2026-06-30", access: full, locator: "section 'AI adoption hasn't reduced indirect tax workload'"}
    - {ref: OECD-GOVAI-2025, title: "Governing with Artificial Intelligence: The State of Play and Way Forward in Core Government Functions (chapter 5, AI in tax administration)", publisher: "OECD", type: regulator, url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/06/governing-with-artificial-intelligence_398fa287/795de142-en.pdf", date: "2025-09", access: full, locator: "p. 173"}
  last_reviewed: "2026-10-17"
  notes: >-
    Merges a practice entry (C, Deloitte proof of concept) with a governance idea (D). The KPMG figure is stated intent
    in a survey of 53 large multinationals. Overlaps tax-data-technology research entries on preventive upstream
    controls; the archetype pass should keep one.

- id: tax-indirect-tax-13
  title: Nexus monitoring, nexus questions and registration agents
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, research-synthesis, coordination-scheduling]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Companies cross economic-nexus thresholds (the sales levels that create a duty to register in a US state), or start
    selling into new countries, without registering in time; registration is paper-heavy and multi-authority. Nexus,
    rates and filing thresholds shift quickly, and advisory firms must apply changes to each client (TRUSS-KINTSUGI-2026).
  solution: >-
    Avalara registration agents prepare and file registration documents with authorities and track the process to
    storage of signed documents; its launch release also describes agents that advise on compliance obligations.
    Numeral supports nexus monitoring and registrations alongside calculation and filing. Deloitte describes an agent
    that flags activity patterns relevant to registration when a business starts selling into a new jurisdiction.
    Thomson Reuters says some teams use AI to pre-screen nexus questions before a reviewer (TR-INDIRECT-2026). A Truss and
    Kintsugi webinar promised live examples of agents answering nexus questions across a client portfolio.
  outcomes:
    - {lever: speed, description: "Numeral states customers can reduce time on filings and registrations by up to 80%", figure: "up to 80%", measures: "reduction in time spent on tax filings and registrations, per Numeral; baseline, sample and customers not given", provenance: vendor-published, source_ref: NUMERAL-2026}
  prerequisites:
    - "Sales and transaction data by state or country, current enough to track thresholds (inferred)"
    - "Authority integrations or the vendor's filing channels (inferred)"
  risks_and_guardrails:
    - "TaxCloud notes a few stray orders from a new channel can push a seller past a state's nexus threshold (TAXCLOUD-2025)"
    - "Nexus answers carry registration and liability consequences; the webinar source describes no review control beyond a professional reading the output (TRUSS-KINTSUGI-2026)"
  human_checkpoints:
    - "Avalara states human review and approval checkpoints at every stage (AVALARA-AVI-2025)"
    - "Deloitte's agent flags patterns for tax professionals to consider (DELOITTE-AGENTIC-2026)"
  role_evolution: >-
    Deloitte describes tax teams engaging earlier in business decisions (DELOITTE-AGENTIC-2026, section 3).
  evidence_grade: C
  sources:
    - {ref: AVALARA-AVI-2025, title: "Avalara launches Avi AI agents for secure automated tax compliance", publisher: "IT Brief UK", type: press, url: "https://itbrief.co.uk/story/avalara-launches-avi-ai-agents-for-secure-automated-tax-compliance", date: "2025-11-04", access: full, locator: "registration agents; early access programmes"}
    - {ref: AVALARA-AGENTIC-2025, title: "Avalara launches 'always on, always ready' AI agents", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/avalara-launches-always-on-always-ready-ai-agents", date: "2025-09-30", access: full, locator: "paragraph on agents advising, initiating registrations and filing"}
    - {ref: NUMERAL-2026, title: "Numeral Raises $100 Million Series C to Expand AI-Powered Tax Compliance Across Industries", publisher: "Numeral", type: vendor, url: "https://www.numeralhq.com/blog/series-c", date: "2026-09-23", access: full, locator: "paragraphs on the compliance lifecycle and claimed savings"}
    - {ref: DELOITTE-AGENTIC-2026, title: "Agentic AI and indirect tax: a practical view for tax directors", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/global/en/services/tax/perspectives/agentic-ai-and-indirect-tax-practical-view-for-tax-directors.html", date: "2026-07-01", access: full, locator: "section 3 'Capacity', illustrative examples"}
    - {ref: TR-INDIRECT-2026, title: "What three years of data reveal about AI in corporate indirect tax", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/what-three-years-of-data-reveal-about-ai-in-corporate-indirect-tax/", date: "2026-08-27", access: full, locator: "section '2025: Strategy became the dividing line'"}
    - {ref: TRUSS-KINTSUGI-2026, title: "What's Changing in Sales and Business Tax - And How AI Can Help (webinar listing)", publisher: "Truss with Kintsugi", type: vendor, url: "https://gettruss.io/events/sales-business-tax-ai", date: "2026-09-17", access: full, locator: "About Event and Learning Objectives"}
    - {ref: TAXCLOUD-2025, title: "Agentic commerce is expanding ecommerce and your tax risk", publisher: "TaxCloud", type: vendor, url: "https://taxcloud.com/blog/agentic-commerce-is-expanding-ecommerce/", date: "2025-10-29", access: full, locator: "section 'AI is simply the next test for commerce and compliance' (read via text mirror)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Avalara said early access programmes were under way with select enterprise partners in Nov 2025; no registration
    outcome was published. Merges the practice registration entry with the discourse nexus-questions entry (augment,
    step); delegate is used for the registration agents. The webinar year is inferred from the page.

- id: tax-indirect-tax-14
  title: Intake, data extraction and routing of tax-authority notices
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, coordination-scheduling]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Tax-authority notices arrive in many forms and jurisdictions and must be received, classified, routed and tracked to
    deadlines (AVALARA-AVI-2025). State tax notices arrive in different formats every time (TRINST-TEIAUDITOR-2026).
  solution: >-
    Avalara describes notice-management agents that automate receipt, classification, routing and tracking of notices
    across jurisdictions. TEI attendees described using image-to-text AI to pull structured data out of state tax
    notices (TRINST-TEIAUDITOR-2026).
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "not applicable", provenance: vendor-published, source_ref: AVALARA-AVI-2025}
  prerequisites:
    - "Notices received in a channel the agent can read (inferred)"
  risks_and_guardrails:
    - "Avalara says agents run inside its existing security perimeter with audit trails (AVALARA-AVI-2025)"
    - "A pipeline built quickly may be deployed without review, documentation or anyone who can maintain it (TRINST-TEIAUDITOR-2026)"
  human_checkpoints:
    - "Avalara states review and approval checkpoints at every stage; notice-specific checkpoints are not described (AVALARA-AVI-2025)"
  role_evolution: "Not described."
  evidence_grade: C
  sources:
    - {ref: AVALARA-AVI-2025, title: "Avalara launches Avi AI agents for secure automated tax compliance", publisher: "IT Brief UK", type: press, url: "https://itbrief.co.uk/story/avalara-launches-avi-ai-agents-for-secure-automated-tax-compliance", date: "2025-11-04", access: full, locator: "section 'Functions and agent network', notice management agents"}
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "sections 'End of the traditional model' and 'Two ways to lose'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The TEI recap does not say which tax type the state notices concern. Maturity piloting reflects attendee practice
    without a named team. Overlaps notice-triage entries in the controversy and tax-data-technology research; drafting
    responses belongs to controversy.

- id: tax-indirect-tax-15
  title: Audit-ready decision records for AI-assisted determinations, overrides and filings
  archetype: tax
  module: indirect-tax
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    In Fonoa's survey of 176 indirect tax leaders, 57.4% would not be confident defending AI-assisted decisions to a tax
    authority, and only about a third run a formal documented human-in-the-loop sign-off (FONOA-2026, FONOA-176-2026).
    Audit support pulls experienced people off day-to-day work and documentation is reconstructed under time pressure
    (DELOITTE-AGENTIC-2026).
  solution: >-
    Log each AI-assisted determination, override and approval with the rule version, data inputs, rationale and
    reviewer as work happens, so the file can be assembled on demand; agents then retrieve, assess and summarise
    invoices, contracts or customs records when an authority asks (Deloitte's description). Fonoa markets Fonoa Audit
    for this. Thomson Reuters says it documents each agent decision with rationale, timestamps and reviewer sign-offs.
    Sovos lists full audit transparency for each recommendation, approval and action. Avalara says Aviator keeps an
    audit-defensible record for every action.
  outcomes:
    - {lever: risk, description: "Organisations with formal human-in-the-loop governance were more than twice as likely to be confident defending AI decisions as those with no defined process", figure: "more than 2x", measures: "relative likelihood of confidence in defending AI-assisted decisions, formal human-in-the-loop versus no defined process, among 176 surveyed indirect tax leaders", provenance: vendor-published, source_ref: FONOA-176-2026}
    - {lever: capacity, description: "Compliance workload fell at eight times the rate of other respondents among organisations that reached full formalisation", figure: "8x (2.8% of organisations reached full formalisation)", measures: "rate of decrease in compliance workload for the cohort with mandates, formal governance and measurement versus other respondents; the basis of the rate is not shown on the landing page or blog", provenance: vendor-published, source_ref: FONOA-176-2026}
  prerequisites:
    - "A defined validation process with named reviewers (FONOA-176-2026)"
    - "Leadership-set AI targets or KPIs; only 12.5% of respondents have them (FONOA-2026)"
    - "Actions and decisions captured in the workflow at the time they occur, plus access to invoices, contracts and customs records (DELOITTE-AGENTIC-2026)"
  risks_and_guardrails:
    - "The evidence is a vendor-sponsored survey and product claims; Fonoa sells an audit-trail product (FONOA-2026)"
    - "A BDO indirect-tax partner quoted by Fonoa says you are not defending a technology but demonstrating a process (FONOA-2026)"
    - "IRS OPR asks firms to document AI usage and verification and show adherence to Circular 230 section 10.36, for federal tax practice (IRS-OPR-2026)"
    - "The UK PCRT guidance expects members to be able to explain how a conclusion was arrived at (ICAEW-PCRT-2026)"
    - "Werfel's vendor-diligence questions ask whether the organisation can access a tamper-proof log of every output without relying on the vendor (AICPA-WERFEL-2026, Appendix B, Case Study 1, Step 6)"
    - "At the TEI seminar two hands in a room of more than 50 said the tax function owns AI implementation (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "A named human owner for each AI-supported decision, with sign-off at defined risk points"
    - "Tax professionals answer the authority; agents prepare the documentation (DELOITTE-AGENTIC-2026, section 4)"
  role_evolution: >-
    Fonoa's survey frames the leader's job as owning accountability structures, KPIs and audit trails around AI
    (FONOA-2026). Deloitte expects less reliance on institutional memory when questions arise (DELOITTE-AGENTIC-2026).
    OpenAI's indirect-tax technology manager posting shows the current human baseline: supporting audits with
    transaction-level data gathering, reconciliations and system documentation (OPENAI-JOB-2026).
  evidence_grade: C
  sources:
    - {ref: FONOA-2026, title: "State of Indirect Tax in the AI Era 2026 (landing page; full report gated)", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/guides/state-of-indirect-tax-in-the-ai-era-2026", date: "2026-06-17", access: full, locator: "landing-page sections on audit confidence, human-in-the-loop review, 'Why AI governance matters more than the AI model you choose' and Fonoa Audit"}
    - {ref: FONOA-176-2026, title: "What 176 Tax Leaders Have to Say About AI Adoption in Indirect Tax", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/blog/ai-adoption-indirect-tax-report", date: "2026-06-30", access: full, locator: "sections 'Most tax teams can't govern', 'audit defensibility gap' and 'AI accountability separates the leaders'"}
    - {ref: DELOITTE-AGENTIC-2026, title: "Agentic AI and indirect tax: a practical view for tax directors", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/global/en/services/tax/perspectives/agentic-ai-and-indirect-tax-practical-view-for-tax-directors.html", date: "2026-07-01", access: full, locator: "section 4 'Tax audit readiness'"}
    - {ref: TR-AGENTICIT-2026, title: "Is your tax department ready for the agentic AI explosion?", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/is-your-tax-department-ready-for-the-agentic-ai-explosion/", date: "2026-06-08", access: full, locator: "section 'Auditability by design'"}
    - {ref: SOVOS-SOVI-2026, title: "Sovos Expands Sovi AI with New Capabilities for Tax Guidance, Intelligent Automation and Agent Interoperability", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-expands-sovi-ai/", date: "2026-03-24", access: full, locator: "'Full Audit Transparency' bullet"}
    - {ref: AVALARA-CRUSHEU-2026, title: "Avalara Helps Global Businesses Move Faster as Tax and Compliance Complexity Accelerates", publisher: "Avalara (PR Newswire)", type: conference, url: "https://www.webdisclosure.com/press-release/avalara-helps-global-businesses-move-faster-as-tax-and-compliance-complexity-accelerates-WEpMYuY5kxr", date: "2026-10-08", access: full, locator: "paragraph on Avalara Aviator"}
