- id: tax-indirect-tax-16
  title: Tax engines callable by customers' own AI agents through MCP, agent-to-agent protocols and APIs
  archetype: tax
  module: indirect-tax
  function: technology-it
  work_types: [software-systems, transaction-processing]
  pattern: other
  ladder: automate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Tax calculation, classification, registration and filing sit inside tax applications. Avalara says compliance work
    won't always begin inside compliance software: it may start in an ERP, an e-commerce platform, a finance system or
    an AI agent (AVALARA-CRUSHEU-2026).
  solution: >-
    Vendors expose compliance functions as agent-callable tools, through MCP (Model Context Protocol, a standard way for
    AI agents to call software tools) and A2A (agent-to-agent protocols). Avalara's October 2025 launch described MCP
    servers and a "have your agent call our agent" model for validating taxes, classifying products, starting
    registrations and filing forms, and its NEXT developer event (26 Mar 2026) focused on agent-based architectures. Its
    Versori unit uses agents to build connectors. Sovos is developing an MCP Gateway for governed agent access and
    expects to support A2A orchestration over time. Taxually presented APIs for clients' internal AI ecosystems. Vertex
    says it is building agents on ERPs, with one announced for Microsoft.
  outcomes:
    - {lever: speed, description: "Avalara says Versori builds connectors in days rather than months", figure: "days instead of months", measures: "time to build production-grade connectors, per the vendor release; no baseline or sample", provenance: vendor-published, source_ref: AVALARA-CRUSHEU-2026}
  prerequisites:
    - "Agent identity, access control, data isolation and logging of every agent call"
    - "Configurations in the tax system that agents rely on; Avalara says 'those configurations still live in our system' (AVALARA-AGENTIC-2025)"
    - "Customer-side agent platforms (ERP, POS, e-commerce, productivity tools)"
  risks_and_guardrails:
    - "Sovos describes the MCP Gateway as infrastructure being developed and A2A as expected over time, not shipped (SOVOS-SOVI-2026)"
    - "Whether the calling agent is trusted and which party is liable for a wrong result is not addressed in the sources read"
    - "Werfel's vendor-diligence questions ask whether scope restrictions are enforced in the model and not only in the interface (AICPA-WERFEL-2026, Appendix B, Step 6)"
    - "NIST's AI RMF and its Generative AI Profile are voluntary frameworks for managing such risks (NIST-AIRMF-2023)"
  human_checkpoints:
    - "Avalara says agents notify a human for novel situations and decisions that affect the compliance footprint (AVALARA-AGENTIC-2025)"
  role_evolution: >-
    Sovos describes compliance consumed "not only through applications, but through trusted, interoperable agents"
    (SOVOS-SOVI-2026). No source describes role changes at customers.
  evidence_grade: C
  sources:
    - {ref: AVALARA-AGENTIC-2025b, title: "Avalara Launches Agentic Tax and Compliance: AI Agents That Work for You", publisher: "Avalara via iTWire", type: vendor, url: "https://itwire.com/business-it-news/data/avalara-launches-agentic-tax-and-compliance-ai-agents-that-work-for-you", date: "2025-10-01", access: full, locator: "sections 'Have Your Agent Call Our Agent' and 'Agentic Compliance: A New Operating Model'"}
    - {ref: AVALARA-AGENTIC-2025, title: "Avalara launches 'always on, always ready' AI agents", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/avalara-launches-always-on-always-ready-ai-agents", date: "2025-09-30", access: full, locator: "paragraphs on 'Have your agent call our agent', MCP and human-in-the-loop"}
    - {ref: AVALARA-NEXT-2026, title: "Avalara NEXT: The future of agentic tax and compliance", publisher: "Avalara", type: conference, url: "https://www.avalara.com/us/en/blog/avalara-next-2026-building-the-future-of-agentic-tax-and-compliance.html", date: "2026-03-04", access: full, locator: "event description (event held 26 Mar 2026 per the page)"}
    - {ref: AVALARA-CRUSHEU-2026, title: "Avalara Helps Global Businesses Move Faster as Tax and Compliance Complexity Accelerates", publisher: "Avalara (PR Newswire)", type: conference, url: "https://www.webdisclosure.com/press-release/avalara-helps-global-businesses-move-faster-as-tax-and-compliance-complexity-accelerates-WEpMYuY5kxr", date: "2026-10-08", access: full, locator: "paragraph on Versori by Avalara"}
    - {ref: SOVOS-SOVI-2026, title: "Sovos Expands Sovi AI with New Capabilities for Tax Guidance, Intelligent Automation and Agent Interoperability", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-expands-sovi-ai/", date: "2026-03-24", access: full, locator: "MCP Gateway paragraph"}
    - {ref: TAXUALLY-2026, title: "Taxually Launched New E-Invoicing and Tax Calculation Products at Taxually Connect 2026", publisher: "Taxually", type: vendor, url: "https://www.taxually.com/blog/taxually-connect-2026-new-e-invoicing-and-tax-calculation-products", date: "2026-10-12", access: full, locator: "paragraph on new API capabilities"}
    - {ref: VERTEX-Q1CALL-2026, title: "Vertex (VERX) Q1 2026 Earnings Transcript", publisher: "Vertex Inc. (Motley Fool transcript on Yahoo Finance)", type: vendor, url: "https://finance.yahoo.com/markets/stocks/articles/vertex-verx-q1-2026-earnings-203016568.html", date: "2026-05-07", access: full, locator: "analyst Q&A, comment on agents built on the ERPs"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation, Appendices A and B (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix B, Step 6"}
    - {ref: NIST-AIRMF-2023, title: "AI Risk Management Framework (AI RMF 1.0; Generative AI Profile NIST-AI-600-1, 26 Jul 2024)", publisher: "NIST", type: standard-setter, url: "https://www.nist.gov/itl/ai-risk-management-framework", date: "2023-01-26", access: full, locator: "Overview"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a vendor exposes capabilities for another party's agents to call. No customer use of MCP/A2A access
    was found. Avalara's 9 Apr 2026 MCP release was not reachable. Governance graded this process scope; model is used
    because the change is in how compliance services are consumed. The technical architecture overlaps
    tax-data-technology research entries on MCP and A2A; the archetype pass should keep one.

- id: tax-indirect-tax-17
  title: Tax determination and sales tax holiday rules at AI-agent-initiated checkout
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, expert-judgment]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    When an AI agent completes a purchase for a consumer there may be no human at checkout. Practitioners ask who must
    collect tax (BTAX-AGENTICCOMMERCE-2026). Sales tax holidays need correct timing (the holiday state's time zone),
    product category, price cap and destination sourcing, and autonomous agents can remove the human checkpoint while
    multiplying simultaneous transactions (STI-AGENTIC-2026).
  solution: >-
    Keep tax calculation in the merchant's or marketplace's existing tax engine and call it from the agent's checkout
    flow. The Sales Tax Institute says most agentic commerce models rely on merchants' tax systems and that Shopify
    structured its agentic commerce so tax calculation stays in the transaction flow. Its advice: make holiday rules
    current and machine-readable, give agents correct catalogue metadata, and ask the platform how tax is handled in
    agent-initiated checkout. A Stripe tax technology lead argues an app that authorises payment or transmits orders is
    likely to meet US marketplace-facilitator or EU deemed-supplier tests, so its operator may have to collect tax.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "no tax-compliance outcome published for agent-initiated checkout", provenance: independent, source_ref: STI-AGENTIC-2026}
  prerequisites:
    - "Machine-readable, current holiday rules and rates in the tax engine, not only point-of-sale configuration (STI-AGENTIC-2026)"
    - "Catalogue metadata that marks exempt or holiday-eligible items and price thresholds (STI-AGENTIC-2026)"
    - "Confirmation from the platform provider of how tax is calculated in agent flows (STI-AGENTIC-2026)"
  risks_and_guardrails:
    - "AI systems have no legal personality; liability attaches to a legal entity, possibly the company operating the agent (BTAX-AGENTICCOMMERCE-2026)"
    - "Small differences in checkout flow or payment authorisation can change the marketplace analysis (BTAX-AGENTICCOMMERCE-2026)"
    - "Automation can accelerate errors if thresholds or mappings are stale (STI-AGENTIC-2026)"
    - "The OECD's VAT forum (26-29 Jan 2026) called AI and the crypto economy emerging challenges for VAT administration (BTAX-OECDVAT-2026)"
  human_checkpoints:
    - "Agent checkout removes the checkpoint at purchase; the Sales Tax Institute says controls must move to the tax engine and data (STI-AGENTIC-2026)"
    - "Tax and e-commerce teams confirm configuration before peak and holiday events (STI-AGENTIC-2026)"
  role_evolution: >-
    Tax teams must assess checkout configurations built for machine buyers and ask platform providers specific
    questions about agent flows (STI-AGENTIC-2026).
  evidence_grade: C
  sources:
    - {ref: STI-AGENTIC-2026, title: "Can AI Shopping Agents Apply Sales Tax Holidays?", publisher: "Sales Tax Institute", type: press, url: "https://www.salestaxinstitute.com/resources/ai-shopping-agents-sales-tax-holidays", date: "2026-07-29", access: full, locator: "sections 'What Makes Sales Tax Holidays Uniquely Hard for a Machine', 'Where the Responsibility Actually Lands' and closing checklist"}
    - {ref: BTAX-AGENTICCOMMERCE-2026, title: "Artificial Intelligence Goes Shopping, Creates Tax Challenges (Aleksandra Bal, Stripe)", publisher: "Bloomberg Tax", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/artificial-intelligence-goes-shopping-creates-tax-challenges", date: "2026-02-24", access: full, locator: "sections 'EU Value-Added Tax', 'US Sales Tax' and 'Practical Takeaway'"}
    - {ref: TAXCLOUD-2025, title: "Agentic commerce is expanding ecommerce and your tax risk", publisher: "TaxCloud", type: vendor, url: "https://taxcloud.com/blog/agentic-commerce-is-expanding-ecommerce/", date: "2025-10-29", access: full, locator: "section 'AI is simply the next test for commerce and compliance' (read via text mirror)"}
    - {ref: BTAX-OECDVAT-2026, title: "OECD Identifies Crypto and AI As Challenges to VAT Systems (opening paragraphs; rest paywalled)", publisher: "Bloomberg Tax", type: press, url: "https://news.bloombergtax.com/daily-tax-report-international/oecd-identifies-crypto-and-ai-as-challenges-to-vat-systems", date: "2026-01-29", access: full, locator: "opening paragraphs"}
  last_reviewed: "2026-10-17"
  notes: >-
    Angles disagreed on grade (practice D, discourse C, governance B). C is used: the Shopify design is the Sales Tax
    Institute's second-hand description, not verified with Shopify, and no organization reports tax handling in agent
    checkout. The McKinsey estimate of $3-5 trillion in agent-orchestrated sales by 2030 is relayed by Bloomberg Tax and
    was not checked. Visa, Mastercard and American Express agentic commerce announcements are relayed by the Sales Tax
    Institute, unverified. Taxability of AI products themselves is tax on AI, not AI in tax work, and is kept as context.

- id: tax-indirect-tax-18
  title: Compliance-by-design finance agents that embed VAT and e-invoicing rules in AP, procure-to-pay and invoicing
  archetype: tax
  module: indirect-tax
  function: finance-accounting
  work_types: [transaction-processing, software-systems]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Sovos says companies that bolt separate finance and tax applications onto ERPs face integration and governance
    burdens, while tax authorities require real-time clearance against jurisdiction-specific rules (SOVOS-FLOWIE-2026).
  solution: >-
    Sovos bought Flowie (1 Oct 2026), whose agents run accounts payable, procure-to-pay, contracts, invoicing,
    collections and onboarding on top of an ERP. Sovos says the agents will draw on its tax compliance and regulatory data
    so each action is grounded in the rules of the jurisdiction it touches, and will work alongside its Sovi Agent Studio
    compliance agents. A planned "Sovos Graph" is described as an entity, transaction and regulatory-knowledge layer.
  outcomes:
    - {lever: cost, description: "Sovos cites an EY figure for end-to-end agentic finance implementations; the EY source was not opened", figure: "up to 40%", measures: "cost savings from end-to-end agentic AI implementation, as quoted by Sovos and attributed to EY; sample and method unknown", provenance: vendor-published, source_ref: SOVOS-FLOWIE-2026}
  prerequisites:
    - "An ERP the agents sit on top of"
    - "Integration of Sovos's regulatory data with the agents; the release uses future tense (SOVOS-FLOWIE-2026)"
  risks_and_guardrails:
    - "Announced 16 days before review; no deployment evidence, and control design for autonomous AP and invoicing agents is not described"
  human_checkpoints:
    - "Not described in the release"
  role_evolution: >-
    Flowie's CEO says the agents already run processes end to end; the release says CFOs and CIOs could retire dozens of
    surrounding applications (SOVOS-FLOWIE-2026). No source describes effects on tax or finance staff.
  evidence_grade: C
  sources:
    - {ref: SOVOS-FLOWIE-2026, title: "Sovos Acquires Flowie, Launching the Industry's First Agentic Compliant Finance Orchestration Platform", publisher: "Sovos", type: vendor, url: "https://sovos.com/press-releases/sovos-acquires-flowie-launching-the-industrys-first-agentic-compliant-finance-orchestration-platform/", date: "2026-10-01", access: full, locator: "opening paragraphs; sections 'The Inevitable Collision of AI, Tax Compliance, and Enterprise Finance Software' and 'The Sovos and Flowie Difference'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Single announcement, kept because it shows where a major indirect-tax vendor says the market is heading. The
    finance-operations part sits outside the tax archetype; placement against tax-data-technology is an archetype call.

- id: tax-indirect-tax-19
  title: AI-enabled managed sales tax and VAT compliance delivered as a service
  archetype: tax
  module: indirect-tax
  function: service-delivery
  work_types: [transaction-processing, client-interaction]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Fast-growing software, distribution and manufacturing companies face multi-state and multi-country obligations
    without in-house staff to register, calculate, file and manage certificates (NUMERAL-2026).
  solution: >-
    Providers such as Numeral run the compliance lifecycle (nexus monitoring, registration, calculation, filing,
    remittance, certificates, VAT/GST in more than 90 countries) as a service, with AI doing much of the work and named
    humans for complex issues. KPMG's survey shows the wider shift away from purely local preparation toward central
    hubs and external providers.
  outcomes:
    - {lever: growth, description: "Numeral reports transaction volume growth", figure: "327% year over year", measures: "increase in Numeral's total transaction volume year over year, per its Sep 2026 funding release; Numeral also expects to process more than 80 million transactions via its engine", provenance: vendor-published, source_ref: NUMERAL-2026}
    - {lever: growth, description: "Taxually reports client growth", figure: "almost 40%", measures: "growth in Taxually's active clients, per its own Oct 2026 post; period and base not stated", provenance: vendor-published, source_ref: TAXUALLY-2026}
    - {lever: capacity, description: "Adjacent measure, not an AI outcome: local in-house return preparation fell between KPMG's 2021 and 2026 surveys while co-sourced and outsourced models grew", figure: "44% to about 23% prepared locally", measures: "share of surveyed organizations preparing VAT/GST returns locally in-house (2021 vs 2026); 2026 split is 32% in-house centrally, 23% locally, 26% co-sourced, 19% outsourced (n=53)", provenance: independent, source_ref: KPMG-INDIRECT-2026}
  prerequisites:
    - "Billing and ERP connections (Numeral lists over 40 supported systems)"
  risks_and_guardrails:
    - "Numeral's CEO says customers need access to a person when a complex issue arises, so the escalation path is part of the offer (NUMERAL-2026)"
  human_checkpoints:
    - "Complex issues go to tax experts at the provider (NUMERAL-2026)"
  role_evolution: >-
    Preparation shifts from in-house local teams to central hubs and external partners (KPMG-INDIRECT-2026, p. 10).
  evidence_grade: C
  sources:
    - {ref: NUMERAL-2026, title: "Numeral Raises $100 Million Series C to Expand AI-Powered Tax Compliance Across Industries", publisher: "Numeral", type: vendor, url: "https://www.numeralhq.com/blog/series-c", date: "2026-09-23", access: full, locator: "milestones paragraph; CEO quotation"}
    - {ref: TAXUALLY-2026, title: "Taxually Launched New E-Invoicing and Tax Calculation Products at Taxually Connect 2026", publisher: "Taxually", type: vendor, url: "https://www.taxually.com/blog/taxually-connect-2026-new-e-invoicing-and-tax-calculation-products", date: "2026-10-12", access: full, locator: "section 'How is Taxually growing?'"}
