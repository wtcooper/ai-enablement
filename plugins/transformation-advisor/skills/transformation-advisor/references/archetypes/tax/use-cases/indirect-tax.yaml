    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "section 'A very bad wizard' (ownership poll)"}
    - {ref: OPENAI-JOB-2026, title: "Indirect Tax Technology Manager (OpenAI)", publisher: "Stripes job board (OpenAI posting)", type: job-posting, url: "https://jobs.stripes.co/companies/openai/jobs/78936040-indirect-tax-technology-manager", date: "2026-05-15", access: full, locator: "responsibilities: support indirect tax audits with transaction-level data gathering, reconciliations and system documentation"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': decision logging and evidence assembly. Merges three angles (practice augment, discourse augment,
    governance assist). Fonoa's full report is gated; figures come from its landing page and blog. The OpenAI posting
    does not mention AI doing audit work. Overlaps AI-use-log entries in compliance, research-advisory and
