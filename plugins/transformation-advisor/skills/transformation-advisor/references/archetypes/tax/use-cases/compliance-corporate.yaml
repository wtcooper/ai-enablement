# Use cases: tax / compliance-corporate
# Corporate direct-tax compliance in house and at large firms: federal, state and international income tax returns
# (1120, 5471/8858, state apportionment), return workpapers and review, credits and incentives (R&D credit, Form 6765
# Section G), estimated payments and the tax calendar. Sources checked 2026-10-17; every source was opened (access:
# full). No entry has a measured outcome from a named organisation (no grade A). Almost every figure is
# vendor-published or self-reported; say so when quoting. Source refs are shared with the other tax modules where the
# same document is cited.
# Overlaps are referenced by id in each entry's notes: individual and pass-through returns are in
# compliance-individual-business (for example tax-compliance-individual-business-02, -06, -12); stand-alone research
# is tax-research-advisory-01; ASC 740 and Pillar Two work is in provision-pillar-two; notices and tax-authority AI are
# in controversy (tax-controversy-04, -13).

- id: tax-compliance-corporate-01
  title: AI imports, validates and maps ledger and trial-balance data to the tax chart of accounts, with tie-out checks before the compliance load
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [data-reporting, transaction-processing]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Before a corporate return can be prepared, ledger data from many entities and countries has to be extracted,
    mapped to tax accounts and checked. EY describes this as taking weeks and several people for multinationals.
    A misread or misclassified figure can flow into the return without any alert, and the signer is accountable
    for it.
  solution: >-
    EY describes a GenAI-assisted tool that ingests extracted ledger data, standardises it and maps it using
    pre-vetted prompts, after which a qualified team member reviews the result. Thomson Reuters says its goal for
    ONESOURCE direct tax is agentic AI that handles data import, validation and mapping while tax professionals
    keep oversight. The AICPA-published preparer risk register lists independent verification of AI-extracted
    figures against source documents, and spot-check audits of extraction accuracy, as controls. Salesforce's
    earlier, rules-based approach (a tax data blueprint mapping ledger accounts to Corptax M codes) shows the same
    step done without AI.
  outcomes:
    - {lever: speed, description: "EY says the multi-country mapping step can become a two-day process with human review, in place of weeks of manual work; no client or measurement is named", figure: "two days (stated as achievable)", measures: "elapsed time to extract, map and review general-ledger accounts for tax across countries at a multinational; an illustrative example with no sample, baseline or method", provenance: vendor-published, source_ref: EY-COMPL-2024}
  prerequisites:
    - "A defined tax chart of accounts or M-code design that the mapping targets"
    - "Ledger extracts from each entity and country in a consistent format"
    - "Pre-vetted prompts or mapping rules signed off by tax"
    - "A tie-out sampling plan and an escalation rule for complex or ambiguous documents (Werfel register, risk 3)"
  risks_and_guardrails:
    - "Errors enter the return silently if extraction is not independently verified (AICPA-WERFEL-2026, Appendix C risk 3)"
    - "Circular 230 section 10.22 requires due diligence, including verifying the accuracy of facts, citations and calculations produced by AI (IRS-OPR-2026)"
    - "Treas. Reg. 1.6694-1(e)(1) lets a preparer rely in good faith on information furnished by the taxpayer or another adviser, but not ignore apparent errors; the sources do not say how this applies to AI-extracted data (ECFR-1694-1)"
    - "Bloomberg Tax, a vendor, says corporate tax calculation errors can compound in multi-entity structures (BTAX-CORPAI-2026)"
    - "TEI Tax Tech 2026 attendees described AI that fails quietly, and Alteryx workflows that nobody could explain after the builder left without documenting the logic (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "A qualified team member reviews the AI-produced mapping before it is loaded (EY)"
    - "Preparer ties out a sample of extracted figures to source documents"
    - "Complex or ambiguous source documents escalate to a person"
  role_evolution: >-
    Staff move from building mappings by hand to reviewing AI-proposed mappings, resolving exceptions and
    maintaining the rules; EY practitioners say tax departments should shift from assembling information to applying
    critical judgment and high-quality review (BTAX-EYGRIP-2025).
    The AICPA-published register warns that staff may build skill in operating the tool rather than in the
    underlying tax law (TAXADVISER-WERFEL-2026).
  evidence_grade: C
  sources:
    - {ref: EY-COMPL-2024, title: "AI and the transformation of tax compliance (page title: Tax transformation: Adopting AI to drive efficiencies)", publisher: "EY US", type: firm, url: "https://www.ey.com/en_us/insights/tax-compliance/ai-and-the-transformation-of-tax-compliance", date: "2024-07-22", access: full, locator: "Box 'AI in practice' on general-ledger account mapping; section on categorisation"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Thomson Reuters: From compliance to intelligent compliance', paragraph 1"}
    - {ref: CSC-SALESFORCE-2026, title: "Fragmentation to Integration: Salesforce Files Six Weeks Sooner (Corptax data blueprint and automation, not AI)", publisher: "CSC Corptax", type: vendor, url: "https://cscglobal.com/service/corptax/case-studies/salesforce/", date: "2026", access: full, locator: "Paragraph on the tax data blueprint mapping ledger accounts to Corptax M codes (page undated; 2026 is the retrieval year; the case describes the 2023 filing)"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risk 3 'Incorrect Document Extraction' (PDF p. 27)"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework, item 1 (section 10.22)"}
    - {ref: ECFR-1694-1, title: "26 CFR 1.6694-1, Section 6694 penalties applicable to tax return preparers", publisher: "eCFR (Treasury)", type: regulator, url: "https://www.ecfr.gov/current/title-26/section-1.6694-1", date: "2026-10-01", access: full, locator: "Paragraph (e)(1) (point-in-time version)"}
    - {ref: BTAX-CORPAI-2026, title: "AI for Corporate Tax: Verified Intelligence That Stands Up to Scrutiny", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/artificial-intelligence/ai-for-corporate-tax-verified-intelligence-for-complex-calculations-and-compliance/", date: "2026-05-18", access: full, locator: "Text on error compounding in multi-entity calculations"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Section 'A very bad wizard': silent failures and undocumented workflows"}
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way (opinion by Daren R. Campbell and Randy Carpenter, EY)", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "Section 'People, Skills, Culture'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade C: the only quantified statement is EY's own illustration and TR describes a goal. The EY page's own
    metadata (firstpublishdate) and on-page date are 22 Jul 2024; 2026-02-12 is a later republication timestamp, so
    the ref is EY-COMPL-2024. The Salesforce case is rules-based and is cited only for the prerequisite. K-1 intake is
    a separate entry (tax-compliance-corporate-02). Related: the tax data layer that feeds this step is
    tax-data-technology-02; trial balance to workpapers for pass-through returns is
    tax-compliance-individual-business-07.

- id: tax-compliance-corporate-02
  title: Agents interpret K-1 footnotes and mixed-format source items, map them to tax treatments with a confidence level, and learn from logged reviewer overrides
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [transaction-processing, expert-judgment, data-reporting]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    PwC's AI tax leader describes data arriving from several systems and third parties in different formats,
    sometimes unmapped or missing metadata. For K-1s, staff were trained with guides to interpret footnotes and map
    items, with heavy human review, OCR layered on top, and a group conferring when a footnote had not been seen before.
  solution: >-
    PwC says agents trained on how to treat different expenses and disclosures assess a footnote, say how they
    interpreted it and give a confidence level. A reviewer sees the flagged items; an override must come with a
    reason so the agent can learn from the correction. PwC's Agent OS manages which tools (data mapping, document
    extraction) each agent can use.
  outcomes:
    - {lever: capacity, description: "PwC's AI tax leader says one person reviews the output where three people might previously have gathered to decide an unfamiliar footnote; no time, volume or accuracy figure is published", figure: "none published", measures: "no measurement; an interview illustration of one reviewer replacing a group discussion on novel K-1 footnotes", provenance: self-reported, source_ref: PWC-MEGNA-2025}
  prerequisites:
    - "Historical treatment data to train agents, and continued retraining as new data arrives (PWC-MEGNA-2025)"
    - "A tool layer for document extraction and mapping, and an orchestration layer to manage and monitor agents (Agent OS)"
    - "A reviewer feedback loop for overrides"
    - "A firm-level governance committee that oversees how agent systems are built and used (PWC-MEGNA-2025)"
  risks_and_guardrails:
    - "PwC says confidence improves through feedback 'ideally to 100%, though that's rare', so residual error is expected (PWC-MEGNA-2025)"
    - "PwC says outputs stay inside a human-reviewed, multi-eye process, and approved processes are locked against ad hoc changes (PWC-MEGNA-2025)"
    - "Werfel's preparer register names incorrect document extraction (W-2, 1099, K-1) as a technical risk whose errors can flow silently into the return (TAXADVISER-WERFEL-2026)"
    - "No error rate or override rate is published (PWC-MEGNA-2025)"
  human_checkpoints:
    - "Reviewer checks flagged items and low-confidence interpretations"
    - "Every override carries a recorded reason, used to retrain the agent"
    - "Firm governance committee oversees how agents are built and used"
  role_evolution: >-
    Reviewers move from deciding novel items in a group to checking an agent's stated reasoning. PwC reports over
    3,200 AI champions, a workforce-transformation team embedded in tax, over 350,000 US training hours and about
    80% of people having taken some AI training (all self-reported, PWC-MEGNA-2025).
  evidence_grade: B
  sources:
    - {ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "Answers on K-1 data mapping, feedback and override, Agent OS, governance committee, AI champions and training"}
    - {ref: TAXADVISER-WERFEL-2026, title: "A risk framework for AI use in tax administration and preparation (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "Figure 3, technical risks: 'Incorrect document extraction'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The setting is K-1 intake in PwC's asset and wealth management tax work, which feeds partnership and
    corporate-investor returns; the interviewee says mapping happens 'across all our tax businesses', so use in
    corporate direct-tax compliance is inferred, not shown. Grade capped at B (named deployment, adjacent setting, no
    measurements). 'In production' reflects the reporter's paraphrase that agents are deployed beyond pilots. PwC also
    reports more than 800 custom GPTs and more than 250 agents firm-wide; whether these are in this workflow is not
    stated. The same K-1 footnote mapping change, with fuller evidence across individual and pass-through returns, is
    tax-compliance-individual-business-02.

- id: tax-compliance-corporate-03
  title: AI compares returns, source data and reconciliations year on year and flags anomalies for reviewers before filing
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Reviewers of corporate returns and workpapers compare against prior years and source schedules by hand. Deloitte
    says that where tax authorities run real-time analytics, finding and fixing errors after submission 'would no
    longer be sufficient', and that data fragmentation and manual controls erode resilience.
  solution: >-
    EY says AI-enabled comparison of US corporate income tax returns can speed data gathering and pinpoint
    inconsistencies, and anomaly scans can help the preparer decide where to spend review time. Baker Tilly describes
    AI flagging unusual effective tax rate movements and inconsistencies across entities. Corptax lists PDF comparison
    and tax code version tracking on its AI/ML roadmap. Deloitte gives AI agents that flag common anomalies in source
    data and account reconciliations for human review as an example of immediate risk mitigation in a low-adoption
    scenario, and preventive controls upstream in business processes where authorities run real-time analytics.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "no figure published; sources describe what AI can do or a roadmap, not a measured result", provenance: vendor-published, source_ref: EY-COMPL-2024}
  prerequisites:
    - "Prior-year returns and workpapers in a comparable, machine-readable form"
    - "Consistent entity and account structure across years"
    - "Reviewer-agreed thresholds for what counts as an anomaly"
    - "Better upstream data quality and links between tax, finance and operations (DELOITTE-TTT-2026)"
  risks_and_guardrails:
    - "TEI Tax Tech 2026 attendees worried about reviewing growing volumes when errors are quiet and technical (TEI-TAXTECH-2026)"
    - "Bloomberg Tax, a vendor, lists IRS examination exposure and SOX control failures among the risks of unverified AI output (BTAX-CORPAI-2026)"
    - "Deloitte says leaders may want a hybrid model and an audit trail for authorities not capable of real-time interaction (DELOITTE-TTT-2026)"
  human_checkpoints:
    - "Reviewer decides which flagged items matter"
    - "Preparer resolves each flagged inconsistency before sign-off"
  role_evolution: >-
    EY says AI can help reviewers focus on the items that add most value or carry the greatest risk (EY-COMPL-2024).
    Deloitte expects demand for data analytics, technology integration and project management skills where
    authorities are ahead of the company (DELOITTE-TTT-2026).
  evidence_grade: C
  sources:
    - {ref: EY-COMPL-2024, title: "AI and the transformation of tax compliance (page title: Tax transformation: Adopting AI to drive efficiencies)", publisher: "EY US", type: firm, url: "https://www.ey.com/en_us/insights/tax-compliance/ai-and-the-transformation-of-tax-compliance", date: "2024-07-22", access: full, locator: "Section on year-over-year data anomalies and AI-enabled comparison of US corporate income tax returns"}
    - {ref: BAKERTILLY-2026, title: "The new tax operating model: AI as a strategic partner", publisher: "Baker Tilly US", type: firm, url: "https://www.bakertilly.com/insights/the-new-tax-operating-model-ai-as-a-strategic-partner", date: "2026-02-20", access: full, locator: "Paragraph on flagging unusual ETR movements and inconsistencies across entities"}
    - {ref: CORPTAX-2026, title: "Webinar: Unlock the Power of Tax AI (AI and ML in Tax: Applications, Considerations, and Responsible Engagement), with ACT", publisher: "CSC Corptax", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "Corptax AI/ML roadmap list: PDF comparisons, audit prediction, tax code version tracking (page undated; 2026 copyright line)"}
    - {ref: DELOITTE-TTT-2026, title: "Riding the wave: A framework to plan for AI (Tax Transformation Trends AI report, part three)", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2026/dttl-deloitte-tax-transformation-trends-ai-report-2025-part-three.pdf", date: "2026-07", access: full, locator: "Scenario 1 and Scenario 3 sections (PDF pp. 4 and 6)"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Paragraph on reviewing increasing volumes when errors are quiet"}
    - {ref: BTAX-CORPAI-2026, title: "AI for Corporate Tax: Verified Intelligence That Stands Up to Scrutiny", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/artificial-intelligence/ai-for-corporate-tax-verified-intelligence-for-complex-calculations-and-compliance/", date: "2026-05-18", access: full, locator: "Risk list (restatement, IRS examination, SOX control failure)"}
  last_reviewed: "2026-10-17"
  notes: >-
    All sources describe capability, a roadmap or a scenario; no named corporate team or measured result was found.
    Taxpayer-side screening modelled on how authorities score returns is tax-compliance-corporate-13. Return review
    for individual and pass-through returns, with fuller evidence, is tax-compliance-individual-business-12.

- id: tax-compliance-corporate-04
  title: Validation agents critique other agents' output and reviewers do first-level review of automated outputs
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Reviewers face 'an ever-increasing volume of work' where errors are 'increasingly polite, quiet, and technical'
    (TEI-TAXTECH-2026). EY practitioners say reviewers who once checked subtotals now receive conclusions to review
    and must understand the process (BTAX-EYGRIP-2025).
  solution: >-
    A Thomson Reuters Institute recap says some TEI seminar attendees deploy validation agents to critique their own
    agents' outputs. Corptax's roadmap lists PDF comparisons to streamline document analysis. OpenAI's 2026 listing
    for a US tax operations manager includes first-level review and validation of automated provision outputs.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "no error-catch rate, override rate or reviewer time is published in any source read", provenance: self-reported, source_ref: TRINST-TEIAUDITOR-2026}
  prerequisites:
    - "A definition of what the reviewer checks (inputs, process, outputs), not only the arithmetic (BTAX-EYGRIP-2025)"
  risks_and_guardrails:
    - "Werfel names control dilution: review that does not scale with AI-driven volume gets weaker even if it stays unchanged on paper (TAXADVISER-WERFEL-2026)"
    - "EY warns of a divide between experienced staff who spot AI problems and newer staff who may over-rely on results (BTAX-EYGRIP-2025)"
    - "An AI agent told a TEI attendee it could not open the file and had been 'telling you what you wanted to hear' (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "A named reviewer signs off the compliance output"
    - "Reviewer samples both AI-flagged and unflagged items"
  role_evolution: >-
    EY says the profession shifts from assembling information to applying critical judgment and high-quality review
    (BTAX-EYGRIP-2025).
  evidence_grade: C
  sources:
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "Section 'End of the traditional model': validation agents critiquing their own outputs"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Sections 'A very bad wizard' and 'Going home'"}
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way (opinion by Daren R. Campbell and Randy Carpenter, EY)", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "Sections 'People, Skills, Culture' and 'Questions for 2026'"}
    - {ref: CORPTAX-2026, title: "Webinar: Unlock the Power of Tax AI (AI and ML in Tax: Applications, Considerations, and Responsible Engagement), with ACT", publisher: "CSC Corptax", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "Roadmap bullet: PDF comparisons"}
    - {ref: OPENAI-USTAXOPSJOB-2026, title: "Manager, US Tax Operations (OpenAI job listing)", publisher: "Glynn Capital job board (OpenAI)", type: job-posting, url: "https://jobs.glynncapital.com/companies/openai/jobs/74040402-manager-us-tax-operations", date: "2026-04-11", access: full, locator: "'In this role, you will': first-level review and validation"}
    - {ref: TAXADVISER-WERFEL-2026, title: "A risk framework for AI use in tax administration and preparation (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "Figure 3, practice risks: 'Control dilution'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Practitioner statements and one roadmap item; no named deployment with a result. The agent-critiques-agent claim
    is attributed to unnamed attendees in a recap by a vendor-owned institute.

- id: tax-compliance-corporate-05
  title: Preparation shifts to AI and staff review its output, with fewer review layers where outputs are consistent
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    EY describes the current model as a staff-level team member doing most compliance preparation, followed by
    layers of review.
  solution: >-
    EY says that in future AI will do much of the preparation, staff will monitor it and review initial outputs, and
    fewer review levels may be needed because AI output is consistent. PwC says complex outputs such as tax
    calculations keep multi-eye review, while simple diagnostics may not need three layers.
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "no figure published; a stated direction, not a measured result", provenance: vendor-published, source_ref: EY-COMPL-2024}
  prerequisites:
    - "Evidence that AI output is consistent enough to justify fewer review layers"
    - "Redefined review roles and sign-off levels"
    - "A record of what the AI did, so reviewers can rely on it (see tax-compliance-corporate-19)"
  risks_and_guardrails:
    - "Sala argues the corporate tax function is not a return-preparation pool, so large headcount effects from automating preparation are overstated, and AI cannot carry regulatory, ethical or financial culpability (SALA-TAXNOTES-2026)"
    - "IRS OPR says practitioners must review AI-created content before it reaches a client or the IRS (IRS-OPR-2026, section 10.22)"
    - "Only 2 of more than 50 attendees polled at TEI Tax Tech 2026 said tax owns AI implementation at their company (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "A qualified professional reviews AI-prepared output"
    - "Complex outputs keep multi-person review (PwC)"
  role_evolution: >-
    EY says the process, the roles and the ordering of tasks need to change, with staff monitoring AI
    (EY-COMPL-2024). Sala predicts AI will not shrink corporate tax teams much (SALA-TAXNOTES-2026). In KPMG
    Germany's survey, 58% expect stable domestic tax headcount and 72% abroad (KPMG-DE-2026).
  evidence_grade: C
  sources:
    - {ref: EY-COMPL-2024, title: "AI and the transformation of tax compliance (page title: Tax transformation: Adopting AI to drive efficiencies)", publisher: "EY US", type: firm, url: "https://www.ey.com/en_us/insights/tax-compliance/ai-and-the-transformation-of-tax-compliance", date: "2024-07-22", access: full, locator: "Section on operating model change, 'staff-level team member' passage"}
    - {ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "Answer on human-reviewed, multi-eye process and layers of review"}
