  last_reviewed: "2026-10-17"
  notes: >-
    A forward-looking statement by a firm, with a contrary academic view. No firm reports having removed a review
    layer. Pricing effects are tax-compliance-corporate-16.

- id: tax-compliance-corporate-06
  title: Agents roll forward prior-year workpapers and prepare review-ready business returns (1120, 1120-S, 1065), including book-to-tax and state apportionment
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [transaction-processing, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Business-return preparation involves unstructured and inconsistent client data, changing rules and
    review-heavy processes. Byron's founder says most CPA automation had focused on 1040 returns because business
    returns were too complex to automate reliably.
  solution: >-
    Byron says specialised agents roll forward prior-year returns and workpapers into a current-year Excel workbook,
    request missing client information and produce review-ready output covering book-to-tax adjustments,
    depreciation schedules, state apportionments and partnership allocations. Outputs are source-linked and
    confidence-scored, and approved data moves into existing tax software. Thomson Reuters says its Ready to Review
    agents handle 1040s now and will expand to business returns. RSM says myRSM Tax integrates generative AI into
    core tax workflows across entities and individuals.
  outcomes:
    - {lever: quality, description: "Byron says its extraction is more than 97% accurate across federal, state, K-3 and footnote extractions", figure: ">97% accuracy (company statement)", measures: "accuracy of data extraction across federal, state, K-3 and footnote extractions; no sample size, test set or definition of accuracy given; covers extraction, not return correctness", provenance: vendor-published, source_ref: BYRON-2026}
  prerequisites:
    - "Integration with the tax software and document systems the firm already uses"
    - "Prior-year workpapers in Excel"
    - "A client data intake process the agent can query for missing information"
    - "SOC 2 Type II and role-based access (Byron states it has these)"
  risks_and_guardrails:
    - "The accuracy statement is the company's and covers extraction only (BYRON-2026)"
    - "Byron says customer data is not used to train underlying models; firms still need to check this in contracts (BYRON-2026)"
    - "OPR says practitioners must use only secure, enterprise-approved AI for client data (IRS-OPR-2026)"
  human_checkpoints:
    - "Accountants verify outputs; each extracted number is source-linked and confidence-scored (Byron)"
    - "Professional final review before filing"
  role_evolution: >-
    Byron says agents prepare the work and accountants verify it, with firms focusing on review and judgment
    (BYRON-2026). Thomson Reuters says its approach lets teams take on more work without proportional hiring
    (TR-R2RBLOG-2025).
  evidence_grade: C
  sources:
    - {ref: BYRON-2026, title: "Byron Launches with AI Agents for Business Tax Preparation Workflows", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/05/27/byron-launches-with-ai-agents-for-business-tax-preparation-workflows/184034/", date: "2026-05-27", access: full, locator: "Paragraphs on agent workflow, accuracy statement and review model"}
    - {ref: TR-R2RBLOG-2025, title: "AI tax return preparation: how Ready to Review transforms the workflow", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-tax-return-preparation-how-ready-to-review-transforms-the-workflow/", date: "2025-12-19", access: full, locator: "Paragraph stating Ready to Review handles 1040s and will expand to business returns"}
    - {ref: RSM-MYRSM-2025, title: "RSM expands AI commitment with launch of myRSM Tax", publisher: "RSM US", type: firm, url: "https://rsmus.com/newsroom/2025/rsm-expands-ai-commitment-with-launch-of-myrsm-tax.html", date: "2025-06-16", access: full, locator: "Paragraphs 1-3"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 6 and best practices (secure, enterprise-approved AI)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Aimed at CPA firms preparing returns for clients, so firm-side, not in-house. No named customer firm and no
    independent test was found; Thomson Reuters' business-return statement is a plan. Byron is the only source
    describing AI in state apportionment. Agentic 1040 preparation (Ready to Review, Basis, Black Ore) is
    tax-compliance-individual-business-04 and -05; partnership, S corporation and trust returns, with fuller evidence,
    are tax-compliance-individual-business-06.

- id: tax-compliance-corporate-07
  title: An in-house tax team moves from outsourced preparation to agent-driven return computation on a version-controlled tax-logic library
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [transaction-processing, data-reporting, software-systems]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    A company that sends its income, gross receipts and property tax compliance to outside preparers must manage
    vendors, reconcile provision to return, run the compliance calendar and respond to notices through spreadsheets
    and email (OPENAI-TAXCOMPLIANCEJOB-2025).
  solution: >-
    OpenAI's tax team listed a 2025 role to move from outsourced return preparation to 'internal, logic-driven,
    agent-powered return computation' for consolidated 1120, 1065, 5471 and state returns, with modular,
    version-controlled tax-logic libraries, self-documenting engines for areas such as GILTI, CAMT and FDII, and a
    Corptax implementation feeding the agentic workflows; the listing describes multi-agent systems that 'classify,
    compute, reconcile, and report'. A separate listing asks for automation of ingestion, validation, compliance and
    reporting using AI-driven agents and SQL pipelines. A 2026 listing describes database-driven workflows where
    preparation is 'increasingly automated' and the manager focuses on review and validation. Four members of
    OpenAI's tax department demonstrated live automation pipelines at TEI Tax Tech 2026.
  outcomes:
    - {lever: cost, description: "none published; the 2025 listing states a goal of automating the tax stack in under 12 months", figure: "none published", measures: "no result for return cost, cycle time or error rate is published; the 12-month statement is a stated aim in recruiting copy", provenance: self-reported, source_ref: OPENAI-TAXCOMPLIANCEJOB-2025}
  prerequisites:
    - "A compliance engine already in operation (Corptax named; ONESOURCE Income Tax also accepted in one listing) and ERP data pipelines (Oracle, Workday named)"
    - "Tax staff who can codify positions as logic, with SQL, Python and metadata governance skills"
    - "Simulation and logic-testing environments (OPENAI-TAXCOMPLIANCEJOB-2025)"
    - "Documentation, best practices and training for tax and finance staff (OPENAI-TAXDATAJOB-2025)"
  risks_and_guardrails:
    - "The evidence is recruiting copy: the 2025 listing says the role will 'contribute to' Project Hive and 'build' the systems, so the capability is partly aspirational (OPENAI-TAXCOMPLIANCEJOB-2025)"
    - "An OpenAI panellist at TEI conceded that AI-built pipelines raise security questions when nobody else has reviewed or documented them (TRINST-TEIAUDITOR-2026)"
    - "Tax rarely owns AI implementation: 2 of more than 50 attendees polled at TEI said it does (TEI-TAXTECH-2026)"
  human_checkpoints:
    - "Manager oversees external vendors during the scope transition (OPENAI-TAXCOMPLIANCEJOB-2025)"
    - "Reviewer performs first-level review and validation of automated provision outputs and data pipelines (OPENAI-USTAXOPSJOB-2026)"
    - "Tax expertise applied to ensure regulatory adherence and accuracy in automated processes (OPENAI-TAXDATAJOB-2025)"
  role_evolution: >-
    The 2025 listing frames the role as moving 'from compliance executor to process architect'; the 2026 listing
    focuses the manager on 'review, validation, and improvement of tax outputs' and asks for comfort outside
    Excel-heavy workflows (OPENAI-TAXCOMPLIANCEJOB-2025; OPENAI-USTAXOPSJOB-2026). The data-automation listing
    combines 10+ years of corporate, partnership and international tax experience with SQL and Python
    (OPENAI-TAXDATAJOB-2025).
  evidence_grade: B
  sources:
    - {ref: OPENAI-TAXCOMPLIANCEJOB-2025, title: "Manager, Tax Compliance and Automation (OpenAI job listing)", publisher: "Omega Venture Partners job board (OpenAI)", type: job-posting, url: "https://jobs.omegavp.com/companies/openai/jobs/52055389-manager-tax-compliance-and-automation", date: "2025-06-05", access: full, locator: "About the Role; In this role you'll (posted 2025-06-05, valid through 2025-07-15)"}
    - {ref: OPENAI-TAXDATAJOB-2025, title: "Senior Manager, Tax Data Automation", publisher: "OpenAI (via Khosla Ventures job board)", type: job-posting, url: "https://jobs.khoslaventures.com/companies/openai/jobs/45083210-senior-manager-tax-data-automation", date: "2025-01-22", access: full, locator: "Responsibilities and qualifications (posted 2025-01-22, valid through 2025-03-11)"}
    - {ref: OPENAI-USTAXOPSJOB-2026, title: "Manager, US Tax Operations (OpenAI job listing)", publisher: "Glynn Capital job board (OpenAI)", type: job-posting, url: "https://jobs.glynncapital.com/companies/openai/jobs/74040402-manager-us-tax-operations", date: "2026-04-11", access: full, locator: "About the Team; About the Role; In this role, you will"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Section 'A very good man': four OpenAI tax department members demonstrate live pipelines; ownership poll"}
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "Section 'Two ways to lose': OpenAI panellist on security of unreviewed pipelines"}
    - {ref: BTAX-FORUM-2026, title: "Bloomberg Tax Leadership Forum to Examine AI, Policy Shifts, and Global Tax Risk (programme announcement for the 16 Jun 2026 forum)", publisher: "Bloomberg Tax", type: conference, url: "https://pro.bloombergtax.com/?p=17345", date: "2026-06-10", access: full, locator: "Panel 'Emerging Technologies and AI Integration' panellist list (OpenAI tax operations director)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Named in-house team, no published measurement, so grade B. Maturity is 'piloting' because the evidence is job
    listings and a demonstration. The recap says OpenAI sent four tax department members to the seminar; that is not
    the size of the department. An AI lab's own tax team is an unusual starting point, so transfer to other companies
    is not shown. The same OpenAI team, seen as an operating model, is tax-data-technology-22.

- id: tax-compliance-corporate-08
  title: Large firms build agent platforms ('agent factories') to create, deploy and manage tax agents, and let professionals and clients build their own
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [software-systems, transaction-processing, client-interaction]
  pattern: other
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Firms and clients need many agents for data collection, document analysis and compliance tasks and a way to track
    and coordinate them. PwC says it built Agent OS because dozens of unmanaged agents lack performance tracking and
    coordination. KPMG's US tax leader says building a client agent for changing tax rules used to take weeks and
    required switching between tools and chat windows.
  solution: >-
    EY says its Tax Agent Factory is a methodology, operating model and technology strategy to design, build, train,
    deploy and manage agents at scale, and that Tax Labs co-designs AI journeys with clients. KPMG and Anthropic
    announced Claude (including Cowork and Managed Agents) inside KPMG's Digital Gateway client platform, starting
    with tax clients and private equity, so professionals and clients can build agentic workflows. Bloomberg Tax
    reported in March 2025 that EY planned to roll out as many as 150 agents to 80,000 tax professionals.
  outcomes:
    - {lever: capacity, description: "EY said in March 2025 it planned to roll out as many as 150 agents to 80,000 tax professionals within three months; no usage or output data has been published", figure: "up to 150 agents, 80,000 tax professionals (planned)", measures: "count of agents planned and EY tax professionals, as stated by an EY executive to Bloomberg Tax; a plan, not a result", provenance: self-reported, source_ref: BTAX-BIG4-2025}
    - {lever: speed, description: "KPMG US's tax vice chair says building an agent to help clients adjust to changing tax regulations went from weeks to minutes", figure: "weeks to minutes", measures: "time to build a client agent for changing tax rules, as stated by a KPMG executive; no sample, task definition or method given", provenance: self-reported, source_ref: KPMG-ANTHROPIC-2026}
  prerequisites:
    - "Alliances with model and cloud providers"
    - "A governed platform where agents and tools are managed (Agent OS, Digital Gateway)"
    - "Firm tax data and domain knowledge to ground agents"
    - "Governance and assurance for AI systems (KPMG Trusted AI framework; PwC governance committee)"
  risks_and_guardrails:
    - "KPMG says cybersecurity, risk and AI assurance will be embedded in design and operation; no results are published (KPMG-ANTHROPIC-2026)"
    - "No announcement gives an error rate, override rate or quality result"
    - "Deloitte says agentic corrections to source data will need to be written back to the system of record to keep an audit-ready posture (DELOITTE-TTT-2026)"
  human_checkpoints:
    - "Human review of agent outputs inside client engagements"
    - "Firm-level governance committee oversight (PwC)"
  role_evolution: >-
    EY says agents free tax professionals for judgment work (EY-TAXLABS-2025). KPMG says 276,000 people will have
    access to Claude (KPMG-ANTHROPIC-2026). Bloomberg Tax noted the tools could dampen future staff needs
    (BTAX-BIG4-2025).
  evidence_grade: C
  sources:
    - {ref: BTAX-BIG4-2025, title: "Big Four Firms Roll Out AI That Can Handle Routine Tasks Solo", publisher: "Bloomberg Tax", type: press, url: "https://news.bloombergtax.com/financial-accounting/big-four-firms-roll-out-ai-that-can-handle-routine-tasks-solo", date: "2025-03-24", access: full, locator: "Paragraphs on EY's plan for 150 agents and 80,000 tax professionals"}
    - {ref: EY-TAXLABS-2025, title: "EY unveils suite of powerful AI capabilities to accelerate tax transformation and deliver strategic value", publisher: "EY Global", type: firm, url: "https://www.ey.com/en_gl/newsroom/2025/11/ey-unveils-suite-of-powerful-ai-capabilities-to-accelerate-tax-transformation-and-deliver-strategic-value", date: "2025-11-25", access: full, locator: "Paragraphs on Tax Labs and Tax Agent Factory"}
    - {ref: KPMG-ANTHROPIC-2026, title: "KPMG Partners with Anthropic for Digital Gateway Powered by Claude", publisher: "CPA Practice Advisor (KPMG/Anthropic release)", type: firm, url: "https://www.cpapracticeadvisor.com/2026/05/20/kpmg-partners-with-anthropic-for-digital-gateway-powered-by-claude/183743/", date: "2026-05-20", access: full, locator: "Digital Gateway description and quotation from Rema Serafi, Vice Chair, Tax, KPMG US"}
    - {ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "Answer on why PwC built Agent OS"}
    - {ref: DELOITTE-TTT-2026, title: "Riding the wave: A framework to plan for AI (Tax Transformation Trends AI report, part three)", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2026/dttl-deloitte-tax-transformation-trends-ai-report-2025-part-three.pdf", date: "2026-07", access: full, locator: "Scenario 2 (p. 5): write-back of agentic corrections"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a platform for building, deploying and governing many agents, not a single workflow. Firm
    announcements only; no corporate compliance return process is specified. An EY-NVIDIA '3 million compliance tasks'
    target seen in secondary coverage was not confirmed in a primary source and is not used. Related:
    tax-research-advisory-24 (advisers co-build client agents on firm platforms) and tax-data-technology-10
    (multi-agent provision-to-return workflows, an idea).

- id: tax-compliance-corporate-09
  title: 'R&D credit: AI builds contemporaneous qualified-research evidence from project, payroll and ledger systems and populates Form 6765, including Section G'
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [data-reporting, document-production, expert-judgment]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    The IRS instructions make Section G of Form 6765 (qualified research expenses, or QREs, reported by business
    component) optional for tax years beginning before 2026 and required for tax years beginning after 2025, with
    exceptions. A practitioner podcast says the IRS now wants in the return the detail it used to ask for only on
    examination. Thomson Reuters says interview-based, after-the-fact studies struggle to meet that standard, take
    over 200 hours a year of coordination and can draw audit adjustments of 10% or more.
  solution: >-
    Thomson Reuters says Neo.Tax connects to project-management, payroll, accounting and ERP systems by API, clusters
    ticket-level data into business components, applies the four-part test (the statutory test of whether research
    qualifies), reconciles payroll and ledger data to allocate costs, and passes the result into ONESOURCE Income Tax
    to populate Form 6765 including Section G. Baker Tilly and EY describe the same shift from interviews and
    timesheets to AI over ERP and project data, and EY practitioners say AI is being woven into R&D platforms to
    automate eligibility determination and documentation drafting. TEI's preliminary programme scheduled a Tax Lab on
    research credit automation for March 2026.
  outcomes:
    - {lever: speed, description: "Thomson Reuters says the integration reduces filing time from weeks to days", figure: "weeks to days", measures: "time to prepare the Form 6765 filing with Neo.Tax inside ONESOURCE; no sample or baseline stated", provenance: vendor-published, source_ref: TR-NEOTAX-2025}
    - {lever: cost, description: "Thomson Reuters says companies report 50-75% savings compared with accounting-firm fees", figure: "50-75% lower fees (reported)", measures: "R&D credit study cost against accounting-firm fees, which the post puts at $100k to $500k; 'companies report', with no sample count or method", provenance: vendor-published, source_ref: TR-NEOTAX-2025}
    - {lever: risk, description: "Thomson Reuters says companies report 20-30% lower FIN 48 reserves (reserves for uncertain tax positions) than with interview-driven studies", figure: "20-30% lower reserves (reported)", measures: "FIN 48 reserves compared with interview-driven studies; 'companies report', with no sample count or method", provenance: vendor-published, source_ref: TR-NEOTAX-2025}
    - {lever: capacity, description: "Thomson Reuters states up to 150+ hours saved annually; its product page says 150+ hours", figure: "up to 150+ hours a year", measures: "hours saved on R&D credit compliance; neither page says per team or per entity, or how it was measured (the blog's manual baseline is over 200 hours a year)", provenance: vendor-published, source_ref: TR-NEOTAX-2025}
  prerequisites:
    - "Project-management, payroll and accounting data that records R&D work as it happens"
    - "Tax-engine integration (ONESOURCE Income Tax) if the form is to be populated directly"
    - "Business-component names consistent with the books and records that substantiate the research (IRS-F6765-INSTR-2025, column 49(c))"
    - "Reconciliation of Section G totals to Section F and to payroll and the general ledger"
  risks_and_guardrails:
    - "Section G applies unless the filer is a qualified small business claiming the reduced payroll credit, or has controlled-group QREs of $1.5 million or less, average gross receipts of $50 million or less for the prior three years, and files an original return (IRS-F6765-INSTR-2025)"
    - "Filers report by business component at least 80% of total QREs or up to 50 components, in descending QRE order, with the remainder in aggregate (IRS-F6765-INSTR-2025)"
    - "Treas. Reg. 1.41-4(d) requires records in sufficiently usable form and detail to substantiate the credit (ECFR-141-4)"
    - "Strike Tax Advisory, which sells a competing human-led service, argues AI questionnaire tools can produce a number but not a defensible claim, cannot make the legal and technical judgments under Section 41, and that vendor liability is typically capped at fees paid (STRIKETAX-2026)"
    - "Sources describe the Section G timeline differently: Thomson Reuters says mandatory 'starting with tax year 2026 returns'; Cherry Bekaert and Strike Tax report final instructions in early February 2026; the IRS 'About Form 6765' page retrieved 2026-10-17 did not mention Section G. Use the IRS instructions for the filing year."
  human_checkpoints:
    - "R&D tax lead reviews whether each AI-clustered business component qualifies and confirms four-part-test conclusions"
    - "Engineers or project owners confirm project and time data; manual updates where people are missing from project tracking (Neo.Tax page)"
    - "Preparer reviews the 80%/top-50 selection, Section G narratives and cost allocation before filing"
  role_evolution: >-
    Thomson Reuters says teams rely less on engineer interviews and outside consultants (TR-NEOTAX-2025) and that
    Neo.Tax works from tools where R&D work is recorded as it happens, with no retrospective surveys (TR-CORPAI-2026).
    Baker Tilly says AI lets professionals redirect time from weeks of manual effort toward strategic planning
    (BAKERTILLY-2026).
  evidence_grade: C
  sources:
    - {ref: TR-NEOTAX-2025, title: "How to eliminate the burden of R&D tax credit compliance (ONESOURCE and Neo.Tax)", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/neo-tax-onesource-eliminating-the-triple-burden-of-rd-credit-compliance/", date: "2025-09-08", access: full, locator: "Sections 'The triple burden' and 'Advantages of a modern R&D tax credit process'; Form 6765 and Fin 48 paragraphs"}
    - {ref: TR-NEOTAXPAGE-2026, title: "ONESOURCE and Neo.Tax R&D tax credit calculation and claim (product page)", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/en/corporation-solutions/c/neotax", date: "2026", access: full, locator: "Page text on 150+ hours and manual updates for people missing from tracking data (page undated)"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Neo.Tax: Automating R&D credits under the new IRS rules'"}
    - {ref: BAKERTILLY-2026, title: "The new tax operating model: AI as a strategic partner", publisher: "Baker Tilly US", type: firm, url: "https://www.bakertilly.com/insights/the-new-tax-operating-model-ai-as-a-strategic-partner", date: "2026-02-20", access: full, locator: "Research tax credit example paragraph"}
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way (opinion by Daren R. Campbell and Randy Carpenter, EY)", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "Section 'Enterprise Tax Functions', item 'R&D credits and incentives'"}
