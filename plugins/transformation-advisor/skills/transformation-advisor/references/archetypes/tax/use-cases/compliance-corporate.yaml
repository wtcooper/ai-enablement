- id: tax-compliance-corporate-10
  title: An in-house tax team deploys a governed AI automation platform for tax workflows; the vendor's platform covers extraction, multi-system reconciliation and reporting with lineage
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [data-reporting, transaction-processing]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Kognitos, a vendor, argues the binding constraint in corporate tax is now data (assembling and reconciling source
    data from ledgers and systems), not the calculation, which engines such as ONESOURCE and Corptax handle once data
    is clean.
  solution: >-
    Savant says its platform turns 'raw, messy data' into governed, repeatable outputs with a complete audit trail.
    Its pre-event release says it would co-present a session with Oxford Industries at TEI Tax Tech on 28 April 2026
    on 'how Oxford's tax team deploys AI safely and at scale'. Separately, Savant's booth demonstrations covered
    multi-system reconciliation across ERPs and source documents, AI document extraction and validation, and reporting
    with data lineage; the release does not say which of these Oxford uses. Kognitos positions its agent platform as the layer
    that assembles, reconciles and validates source data for the tax engines. Deloitte says agentic corrections to
    source data will need to be stored back to the system of record to keep an audit-ready tax posture.
  outcomes:
    - {lever: quality, description: "none published for Oxford Industries", figure: "none published", measures: "the release gives no outcome and does not say which tax processes Oxford's deployment covers", provenance: vendor-published, source_ref: SAVANT-2026}
  prerequisites:
    - "Source systems (ERPs, document stores) reachable by the automation layer"
    - "Data-lineage and audit-trail capability, and integration that can write corrections back to the general ledger"
    - "Process documentation and ownership so workflows can be explained after staff turnover (TEI-TAXTECH-2026)"
  risks_and_guardrails:
    - "The release is a pre-event vendor announcement; the session content was not seen (SAVANT-2026)"
    - "At the same seminar attendees named silent failures, failed training rollouts and unexplained legacy workflows as the main obstacles, and raised rising token costs as a threat to the economics of automation (TEI-TAXTECH-2026)"
    - "Deloitte says accountability becomes harder to trace in AI-driven processes (DELOITTE-TTT-2026)"
  human_checkpoints:
    - "Tax staff review reconciliation exceptions and reconciled outputs"
    - "Data owner approves write-backs or reviews a log of them"
    - "Lineage and audit trail retained for reviewers and auditors"
  role_evolution: >-
    Savant's announced Oxford speaker is a Senior Director of Tax & Accounting, so the session was fronted by a tax
    leader (SAVANT-2026). The recap quotes a senior director: 'You will not survive in this field if you don't have
    a change mindset' (TEI-TAXTECH-2026). Deloitte expects tax functions to take part earlier in enterprise
    governance of AI-driven finance processes (DELOITTE-TTT-2026).
  evidence_grade: B
  sources:
    - {ref: SAVANT-2026, title: "Savant Brings Audit-Ready AI to Tax Leaders at TEI Tax Tech Seminar 2026", publisher: "Savant Labs", type: vendor, url: "https://savantlabs.io/press/tei-tax-tech-2026-ai-tax-automation/", date: "2026-04-16", access: full, locator: "Press release: session abstract, speakers (Savant CEO; Oxford Industries Senior Director of Tax & Accounting), demonstration list"}
    - {ref: KOGNITOS-2026, title: "AI for Corporate Tax and Provision Automation (2026)", publisher: "Kognitos", type: vendor, url: "https://www.kognitos.com/blog/ai-corporate-tax-provision-automation-2026/", date: "2026-06-17", access: full, locator: "Sections on data as the binding constraint and the engine versus data layer"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Paragraphs on governance, training failure, Alteryx workflows and token costs"}
    - {ref: DELOITTE-TTT-2026, title: "Riding the wave: A framework to plan for AI (Tax Transformation Trends AI report, part three)", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2026/dttl-deloitte-tax-transformation-trends-ai-report-2025-part-three.pdf", date: "2026-07", access: full, locator: "Scenario 2 (p. 5): write-back to the system of record; accountability"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B rests on one named in-house team in a vendor press release dated 2026-04-16; no outcomes and no workflow
    list for Oxford. The demonstration list belongs to Savant's booth, not the Oxford session, so the title and
    solution do not attribute those workflows to Oxford; the TEI recaps read do not mention the session, and no
    post-event case study was found. The demos also covered sales and use tax and VAT/GST, so relevance to direct-tax
    compliance is partial (the same scheduled multi-system reconciliation is tax-data-technology-09). Ladder is
    automate (exceptions go to people) because the pattern is reconciliation with exception routing. Savant's and
    Kognitos' customer lists in search results were not verified.

- id: tax-compliance-corporate-11
  title: Cited AI tax research inside the compliance engine and workpapers, with every authority verified before reliance
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Compliance staff leave their return, workpaper or tracking tool to research the question behind a position, and
    junior staff lean on outside advisers for harder ones. General chatbots can invent authorities, and a hallucinated
    citation in a memo or filing is a professional-conduct and credibility risk.
  solution: >-
    Thomson Reuters says it embedded CoCounsel Tax in ONESOURCE direct tax solutions in late 2024, grounded in
    Checkpoint content and returning structured, cited answers. Bloomberg Tax describes AI insights inside its
    Workpapers spreadsheets and an AI Assistant in its Compliance Tracker that summarises and analyses filings, with
    a Deep Thinking Mode for multi-step questions. TEI Midyear 2026 scheduled hands-on labs on AI tax research. Governance
    sources require the user to verify every cited authority.
  outcomes:
    - {lever: capacity, description: "Thomson Reuters says junior staff can handle more complex questions with cited sources and teams may need outside advisers less often for some; no figure published", figure: "none published", measures: "n/a; vendor statement", provenance: vendor-published, source_ref: TR-CORPAI-2026}
  prerequisites:
    - "Grounding in an authoritative tax library (Checkpoint, Bloomberg Tax Portfolios) with source links on every answer"
    - "Embedding in the tools where staff already work"
    - "A written policy on permitted uses and verification of authorities"
  risks_and_guardrails:
    - "In Clinco v. Commissioner (T.C. Memo. 2026-16) the Tax Court found three of four cited cases likely fabricated by a language model; the judge called it a recipe for sanctions but stopped short of formal sanctions (TAXCT-CLINCO-2026)"
    - "Circular 230 section 10.37: practitioners cannot rely on AI projections or authorities without independent verification, and reliance on opaque logic may be unreasonable (IRS-OPR-2026)"
    - "Bloomberg Tax, a vendor, warns that generic models can hallucinate and lack source traceability, and recommends human verification of citations (BTAX-LEVERAGE-2026)"
    - "45% of corporate tax departments had no relevant AI policy in Thomson Reuters' 2025 data (TR-TENSIONS-2025)"
  human_checkpoints:
    - "Preparer reads each cited authority before relying on it"
    - "Reviewer cross-checks authorities in memos that support return positions"
  role_evolution: >-
    Thomson Reuters says junior staff can work through more complex questions (TR-CORPAI-2026); the AICPA-published
    framework warns that staff may lose the ability to catch AI errors if they learn the tool but not the law
    (TAXADVISER-WERFEL-2026).
  evidence_grade: C
  sources:
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Thomson Reuters: From compliance to intelligent compliance', paragraph 2 (CoCounsel Tax in ONESOURCE, late 2024)"}
    - {ref: BTAX-ASC740-2026, title: "Accelerate your ASC 740 process (Bloomberg Tax Research, Provision and Workpapers product page)", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/products/accelerate-your-asc-740-process/", date: "2026-03-25", access: full, locator: "Paragraph on AI-powered insights in Workpapers (page undated; 2026 copyright)"}
    - {ref: BTAX-TOOLS-2026, title: "Bloomberg Tax Showcases Industry-Leading AI-Powered Tools at TEI Midyear 2026", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/company-news/bloomberg-tax-showcases-industry-leading-ai-powered-tools-at-tei-midyear-2026", date: "2026-03-09", access: full, locator: "Feature list: Deep Thinking Mode, AI Assistant in Compliance Tracker"}
    - {ref: TEI-MIDYEAR-2026, title: "TEI Midyear Conference 2026 at-a-glance agenda, preliminary (Washington DC, 15-18 Mar 2026)", publisher: "Tax Executives Institute", type: conference, url: "https://www.tei.org/sites/default/files/MY%202026%20At%20a%20Glance%20Agenda_rev3.2_0.pdf", date: "2026-02", access: full, locator: "Monday 16 March 2026: 'TEI Tax Lab: AI and Tax Research' sessions (preliminary programme; PDF created 2026-02-09)"}
    - {ref: BTAX-LEVERAGE-2026, title: "How to Leverage AI for Corporate Tax Success in 2026", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/tax-automation/how-to-leverage-ai-for-corporate-tax-success-in-2026/", date: "2026-03-18", access: full, locator: "Risk section on hallucination and oversight"}
    - {ref: TR-TENSIONS-2025, title: "5 GenAI tensions corporate tax departments should address (from the 2025 Generative AI in Professional Services Report)", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/the-corporate-tax-genai-evolution-five-key-tensions-your-department-should-address-tri/", date: "2025-06-24", access: full, locator: "Governance tension: policy coverage figures"}
    - {ref: TAXCT-CLINCO-2026, title: "A recipe for sanctions: AI-hallucinated citations in tax (analysis of Clinco v. Commissioner, T.C. Memo. 2026-16)", publisher: "Journal of Accountancy (AICPA)", type: press, url: "https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/", date: "2026-09-01", access: full, locator: "Sections 'The apparitions in the briefing', 'A recipe for sanctions', 'Circular 230, SSTSs, and professional responsibility'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 1, 3 and 5"}
    - {ref: TAXADVISER-WERFEL-2026, title: "A risk framework for AI use in tax administration and preparation (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "Figure 3, workforce risks (skill erosion)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Vendors and a conference programme only. Clinco involved an individual's Schedule C, not a corporate return; it is
    cited for the verification duty. Stand-alone cited research assistants, with fuller evidence, are
    tax-research-advisory-01; this entry covers research embedded in compliance engines and workpapers. No independent
    benchmark of commercial tax research tools was found.

- id: tax-compliance-corporate-12
  title: Agents track the filing calendar and form, instruction and rule changes, and send change reports to the tax team
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [coordination-scheduling, research-synthesis]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Corporate departments track federal, state and international due dates, extensions and rule changes across many
    entities, often in spreadsheets. Forms change often: the Form 6765 instructions were revised in 12/2025 and refer
    to new section 174A treatment from Public Law 119-21. Thomson Reuters says Section G and the first GloBE
    Information Return (due 30 June 2026) created an unusually compressed filing environment.
  solution: >-
    Bloomberg Tax announced an AI Assistant in its Compliance Tracker that answers workflow questions by summarising
    and analysing filings. Orbitax's XatBot 'Tax Flows' mode tracks regulatory changes across jurisdictions and
    proactively sends comparison reports to stakeholders. Corptax lists tax code version tracking on its AI/ML
    roadmap. HMRC expects generative-AI tax software to apply continuous monitoring, version control and timely
    updating as law and guidance change.
  outcomes:
    - {lever: risk, description: "none published; Bloomberg Tax says the assistant saves time and reduces risk, without a measurement", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: BTAX-TOOLS-2026}
  prerequisites:
    - "A single record of entities, jurisdictions and filing obligations, with an owner for each alert"
    - "Authoritative, current rule and due-date content"
  risks_and_guardrails:
    - "Missed or wrong dates carry penalties: Thomson Reuters found 56% of respondents who spent more than half their time on reactive work said their departments incurred penalties, against 31% of those mainly proactive (a survey association, not a tool effect) (TR-CORPTAX-2025)"
    - "A tool that summarises rule changes can present outdated guidance with confidence; Bloomberg Tax cites training cutoffs and fast-changing guidance (BTAX-HALLUC-2026)"
    - "The HMRC expectation applies to software developers serving UK customers, not to corporate tax departments (HMRC-GENAI-2026)"
    - "No source describes AI calculating or scheduling corporate estimated payments or extensions"
  human_checkpoints:
    - "Tax technical lead decides which changes affect the return or payment calendar before templates are updated"
    - "A person approves any filing or payment action"
  role_evolution: >-
    Orbitax's Tax Flows distributes comparison reports to stakeholders (TR-CORPAI-2026). An in-house compliance role is
    expected to keep a 'real-time, transparent compliance calendar' across entities and jurisdictions
    (OPENAI-TAXCOMPLIANCEJOB-2025).
  evidence_grade: C
  sources:
    - {ref: BTAX-TOOLS-2026, title: "Bloomberg Tax Showcases Industry-Leading AI-Powered Tools at TEI Midyear 2026", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/company-news/bloomberg-tax-showcases-industry-leading-ai-powered-tools-at-tei-midyear-2026", date: "2026-03-09", access: full, locator: "Feature list: AI Assistant in Compliance Tracker"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Orbitax: International tax intelligence and the Pillar Two deadline', 'Tax Flows'"}
    - {ref: CORPTAX-2026, title: "Webinar: Unlock the Power of Tax AI (AI and ML in Tax: Applications, Considerations, and Responsible Engagement), with ACT", publisher: "CSC Corptax", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "Roadmap: tax code version tracking"}
    - {ref: HMRC-GENAI-2026, title: "Guidelines for using generative artificial intelligence if you're a software developer", publisher: "HM Revenue & Customs (GOV.UK)", type: regulator, url: "https://www.gov.uk/guidance/guidelines-for-using-generative-artificial-intelligence-if-youre-a-software-developer", date: "2026-01-28", access: full, locator: "Section 'Using reliable source data'"}
    - {ref: IRS-F6765-INSTR-2025, title: "Instructions for Form 6765 (12/2025), Credit for Increasing Research Activities", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/instructions/i6765", date: "2025-12", access: full, locator: "What's New (section 174A paragraph)"}
    - {ref: TR-CORPTAX-2025, title: "The GenAI paradox: why most tax departments aren't using AI yet (2025 State of the Corporate Tax Department)", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/the-genai-paradox-why-most-tax-departments-arent-using-ai-yet-and-what-early-adopters-are-gaining-tri/", date: "2025-10-22", access: full, locator: "Penalty comparison paragraph (reactive versus proactive)"}
    - {ref: BTAX-HALLUC-2026, title: "AI Hallucinations in Tax: The Risks and How to Mitigate Them", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/artificial-intelligence/ai-hallucinations-in-tax-the-risks-and-how-to-mitigate-them/", date: "2026-05-11", access: full, locator: "Section 'Why does generative AI hallucinate?'"}
    - {ref: OPENAI-TAXCOMPLIANCEJOB-2025, title: "Manager, Tax Compliance and Automation (OpenAI job listing)", publisher: "Omega Venture Partners job board (OpenAI)", type: job-posting, url: "https://jobs.omegavp.com/companies/openai/jobs/52055389-manager-tax-compliance-and-automation", date: "2025-06-05", access: full, locator: "'In this role you'll': compliance calendar"}
  last_reviewed: "2026-10-17"
  notes: >-
    Product announcements and roadmap items only; no named user or measurement. Tax Flows is part of Orbitax's
    international tax product and is cited as a pattern. Overlaps: tax-research-advisory-23 (client-specific impact
    notes), tax-indirect-tax-09 (indirect-tax rule monitoring), tax-provision-pillar-two-08 (provision and Pillar Two)
    and tax-data-technology-15 (configuration impact).

- id: tax-compliance-corporate-13
  title: Pre-filing audit-risk prediction and anomaly screening of the return, informed by how authorities score returns
  archetype: tax
  module: compliance-corporate
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    The IRS already uses machine learning to score corporate returns: TIGTA describes a model that produces risk
    scores for each line item of Forms 1120 in a defined asset band. A TEI panel speaker said that in jurisdictions
    with continuous transaction controls (mostly indirect tax), authorities arrive at audits already holding
    structured data processed by their own analytics. Preparers get no equivalent
    signal before filing.
  solution: >-
    Corptax lists 'audit prediction to address potential triggers early' on its AI/ML roadmap. Deloitte's scenario
    framework crosses a company's AI adoption with its tax authority's AI progress and says low company adoption
    against a high-adoption authority brings heightened audit and dispute exposure. Taxpayer-side line-level
    screening modelled on authority scoring is not documented in the sources read.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "n/a; the Corptax item is a roadmap line", provenance: vendor-published, source_ref: CORPTAX-2026}
  prerequisites:
    - "Return and workpaper data at line level in analysable form"
    - "A history of notices and examination adjustments to calibrate against"
  risks_and_guardrails:
    - "TIGTA: LB&I deployed the Line Anomaly Recommender in March 2021 for Forms 1120 with total assets of $10 million to $250 million; it is unsupervised, human classifiers review its output, and LB&I has no specific data on its examination results (TIGTA-2025)"
    - "A prior TIGTA audit found nearly 50% of Form 1120 returns in the older discriminant-analysis workstream (FY2015 to FY2018) were closed with no change (TIGTA-2025)"
    - "Authority model details are largely redacted in the TIGTA report, so a taxpayer-side screen cannot replicate them (TIGTA-2025); no source reports an accuracy test of a taxpayer-side tool"
  human_checkpoints:
    - "Reviewer decides whether a flagged item is an error, a reportable position or a documentation gap"
    - "Tax decides whether to change a position or add disclosure"
  role_evolution: >-
    Not described in the sources. Deloitte's scenario view says human roles shift toward judgment and dispute
    resolution (DELOITTE-TTT-2026).
  evidence_grade: C
  sources:
    - {ref: CORPTAX-2026, title: "Webinar: Unlock the Power of Tax AI (AI and ML in Tax: Applications, Considerations, and Responsible Engagement), with ACT", publisher: "CSC Corptax", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "Corptax AI/ML roadmap: audit prediction"}
    - {ref: DELOITTE-TTT-2026, title: "Riding the wave: A framework to plan for AI (Tax Transformation Trends AI report, part three)", publisher: "Deloitte Global", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2026/dttl-deloitte-tax-transformation-trends-ai-report-2025-part-three.pdf", date: "2026-07", access: full, locator: "Framework diagram (p. 3); Scenario 1 (p. 4)"}
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "Section 'Outgunned'"}
    - {ref: TIGTA-2025, title: "The IRS Could Leverage Examination Results in Artificial Intelligence Examination Case Selection Models and Improve Processes to Evaluate Performance (2025-308-022)", publisher: "Treasury Inspector General for Tax Administration", type: regulator, url: "https://www.tigta.gov/sites/default/files/reports/2025-08/2025308022fr.pdf", date: "2025-05-19", access: full, locator: "Results of Review, LAR discussion (p. 7); Appendix IV (p. 20)"}
    - {ref: GAO-2026, title: "Artificial Intelligence: IRS Actions Needed to Address Skills Gaps, Information Quality, and Strategic Management (GAO-26-107522)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-26-107522", date: "2026-03-24", access: full, locator: "What GAO Found (126 active IRS AI use cases as of June 2025)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Roadmap-level only. Authority-side AI (audit selection, the 'AI-first IRS') is tax-controversy-13. The same
    taxpayer-side check against third-party data is tax-controversy-04, and for intercompany positions
    tax-transfer-pricing-15. The GAO date (24 Mar 2026) was confirmed from the report PDF through a text mirror.

- id: tax-compliance-corporate-14
  title: Continuously updated effective-tax-rate and cash-tax modelling with what-if scenarios
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Static spreadsheet models are slow to update when entity structure, transfer pricing or supply chains change, and
    the effect on cash taxes and provisioning is seen late.
  solution: >-
    Baker Tilly describes AI modelling engines that ingest financial data, deferred positions, intercompany activity
    and entity structures to calculate jurisdictional and consolidated effective rates continuously and run what-if
    scenarios on cash taxes, provisioning and financial statements. It also describes agents that download trial
    balances from the ERP, summarise them and compare them with prior calculations.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "n/a; capability description", provenance: vendor-published, source_ref: BAKERTILLY-2026}
  prerequisites:
    - "Integrated ERP and tax data"
    - "Defined entity structure and intercompany data"
    - "Standardised processes and data formats (Baker Tilly names standardisation as the backbone)"
  risks_and_guardrails:
    - "Scenario models are only as accurate as their inputs; Kognitos, a vendor, calls data the binding constraint (KOGNITOS-2026)"
    - "No source reports an error rate"
  human_checkpoints:
    - "Tax reviews scenario outputs before decisions"
  role_evolution: >-
    Baker Tilly says AI becomes a strategic partner when it amplifies decision making and frees people for judgment
    work (BAKERTILLY-2026).
  evidence_grade: C
  sources:
    - {ref: BAKERTILLY-2026, title: "The new tax operating model: AI as a strategic partner", publisher: "Baker Tilly US", type: firm, url: "https://www.bakertilly.com/insights/the-new-tax-operating-model-ai-as-a-strategic-partner", date: "2026-02-20", access: full, locator: "Sections on modelling engines and agentic trial-balance comparison"}
    - {ref: KOGNITOS-2026, title: "AI for Corporate Tax and Provision Automation (2026)", publisher: "Kognitos", type: vendor, url: "https://www.kognitos.com/blog/ai-corporate-tax-provision-automation-2026/", date: "2026-06-17", access: full, locator: "Data as binding constraint section"}
  last_reviewed: "2026-10-17"
  notes: >-
    Provision-heavy; the direct-compliance part is cash-tax forecasting ahead of estimated payments. No source
    describes AI computing or paying corporate estimated payments. Read with the provision module, which points here
    for ETR forecasting.

- id: tax-compliance-corporate-15
  title: Corporate compliance bought as an AI-enabled managed service, with in-house teams asking providers to disclose AI use and verification
  archetype: tax
  module: compliance-corporate
  function: procurement-supply-chain
  work_types: [transaction-processing, client-interaction, review-assurance]
  pattern: other
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    Corporate tax departments outsource return preparation and review. Thomson Reuters reports that 77% of business
    tax departments want their tax service providers to use GenAI, and in the same paragraph says 59% 'aren't sure if
    their companies are using GenAI', which the vendor presents as a transparency gap with providers.
  solution: >-
    Deloitte says some companies look to outsourcing to gain AI-powered solutions without capital outlay and upgrade
    costs. TEI Midyear 2026 scheduled a session on managed services and staffing for the tax capacity crisis. OPR says
    practitioners should disclose AI activities as appropriate and credit cost reductions; the AICPA-published risk
    register lists lack of transparency and client-trust risks and recommends engagement-letter language on AI use
    and responsibility. In-house teams can ask providers what AI is used, how output is verified and how fees reflect it.
  outcomes:
    - {lever: risk, description: "Baseline of the transparency gap, not an outcome", figure: "59% not sure", measures: "share of surveyed business tax departments not sure whether their providers use GenAI (77% want them to); the source sentence reads 'aren't sure if their companies are using GenAI' in a paragraph about providers; sample not stated in the summary", provenance: vendor-published, source_ref: TR-TENSIONS-2025}
  prerequisites:
    - "Procurement and engagement-letter language on AI use, verification and responsibility"
    - "Pricing not tied to hours (see tax-compliance-corporate-16)"
    - "A periodic provider assessment"
  risks_and_guardrails:
    - "Only 20% of organisations in the Thomson Reuters survey measure GenAI return on investment (TR-TENSIONS-2025)"
    - "UK PCRT guidance treats integrity and confidentiality as fundamental principles for AI use (ICAEW-PCRT-2026)"
  human_checkpoints:
    - "Client and provider agree what AI does and who reviews it"
    - "Tax director reviews provider disclosures at engagement renewal"
  role_evolution: >-
    Thomson Reuters reports that business tax departments lack insight into provider AI use (TR-TENSIONS-2025); OPR
    expects practitioners to disclose AI activities and credit cost reductions to clients (IRS-OPR-2026).
  evidence_grade: C
  sources:
    - {ref: TR-TENSIONS-2025, title: "5 GenAI tensions corporate tax departments should address (from the 2025 Generative AI in Professional Services Report)", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/the-corporate-tax-genai-evolution-five-key-tensions-your-department-should-address-tri/", date: "2025-06-24", access: full, locator: "Tension 1 (vendor transparency gap: 77% and 59%); tension 3 (ROI measurement)"}
    - {ref: DELOITTE-LU-2025, title: "AI-enabled Tax Transformation (Tax Transformation Trends 2025 analysis)", publisher: "Deloitte Luxembourg", type: survey, url: "https://www.deloitte.com/lu/en/services/tax/research/ai-enabled-tax-transformation.html", date: "2025-11-19", access: full, locator: "Paragraph on outsourcing as a route to AI-powered solutions"}
    - {ref: TEI-MIDYEAR-2026, title: "TEI Midyear Conference 2026 at-a-glance agenda, preliminary (Washington DC, 15-18 Mar 2026)", publisher: "Tax Executives Institute", type: conference, url: "https://www.tei.org/sites/default/files/MY%202026%20At%20a%20Glance%20Agenda_rev3.2_0.pdf", date: "2026-02", access: full, locator: "Session 'Solving the Tax Capacity Crisis: A Blueprint for Managed Services and Staffing'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 2 (section 10.27(a))"}
    - {ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW Insights (news item on the seven-body PCRT guidance)", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01-19", access: full, locator: "'Fundamental principles': integrity, confidentiality"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risks 8 to 12 (legal and business layers)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a sourcing model in which an outside provider delivers AI-enabled compliance under agreed
    disclosure and review terms. Survey, firm and conference evidence only; no published provider deployment or
    in-house disclosure requirement. Similar managed-service models: tax-data-technology-24, tax-indirect-tax-19 and
    tax-transfer-pricing-22.

- id: tax-compliance-corporate-16
  title: 'Idea: value-based or fixed-fee pricing of AI-enabled compliance work in place of hourly billing'
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    AI can cut the time needed for return preparation. IRS OPR's June 2026 guidance says billing for manual time
    that was not spent, or double billing AI-assisted tasks, may violate the Circular 230 fee rule depending on the
    facts, and that cost savings should be passed on openly.
  solution: >-
    Bloomberg Tax reports top firms exploring value- and outcome-based fees as AI cuts billable hours. The AICPA is
    seeking clarification from the IRS, saying the OPR language does not appear to allow value pricing and overlooks
    software, implementation, governance and training costs; its CEO says many CPAs have moved to value pricing.
  outcomes:
    - {lever: cost, description: "An RSM partner illustrated that a 20-hour tax advisory report could take 10 hours with generative AI and checking, raising the question of margin versus price reduction", figure: "20 hours to 10 hours (illustration)", measures: "hours to create certain tax advisory reports for clients; an example in an interview, not a measured result and not a compliance return", provenance: self-reported, source_ref: BTAX-PRICING-2026}
  prerequisites:
    - "Engagement terms that describe AI use, the fee basis and how efficiencies are shared"
    - "Time and activity records that show what the tool did and what people did"
  risks_and_guardrails:
    - "Section 10.27(a): billing for time not spent, or double billing for AI-assisted tasks, may violate the rule depending on facts such as a pattern across clients or the size of the differentials (IRS-OPR-2026)"
    - "Open question: whether value pricing is compatible with the OPR language; the AICPA's CEO calls the OPR language not authoritative and the IRS response was not found (AICPA-FEES-2026; AICPA-CART-2026)"
    - "About a third of tax and audit professionals surveyed report that their firms have not yet adapted commercial models (TR-FOP-2026)"
  human_checkpoints:
    - "Engagement partner or tax director sets the fee basis and approves disclosure language"
  role_evolution: >-
    Bloomberg Tax reports firm leaders rethinking pricing (BTAX-PRICING-2026). The OPR text covers practitioners
    before the IRS and does not address in-house teams (IRS-OPR-2026).
  evidence_grade: D
  sources:
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 2 (section 10.27(a))"}
    - {ref: AICPA-FEES-2026, title: "AICPA seeks IRS clarity on AI guidelines, CPA fees", publisher: "The Tax Adviser (AICPA)", type: press, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-seeks-irs-clarity-on-ai-guidelines-cpa-fees/", date: "2026-09-08", access: full, locator: "Whole article"}
    - {ref: AICPA-CART-2026, title: "AICPA, former IRS commissioner to lead initiative on AI in tax", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-former-irs-commissioner-to-lead-initiative-on-ai-in-tax/", date: "2026-09-23", access: full, locator: "Penultimate paragraph (AICPA request for clarification)"}
    - {ref: BTAX-PRICING-2026, title: "AI Efficiency Gains Push Accounting Firms to Reimagine Pricing", publisher: "Bloomberg Tax (Daily Tax Report)", type: press, url: "https://news.bloombergtax.com/financial-accounting/ai-efficiency-gains-push-accounting-firms-to-reimagine-pricing", date: "2026-03-05", access: full, locator: "Opening paragraphs on value-based pricing; RSM example"}
    - {ref: TR-FOP-2026, title: "What the 2026 Future of Professionals Report says tax & audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "Paragraph 'Many tax & audit professionals surveyed say client expectations are rising'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Pattern 'other': a pricing model, not a workflow. The debate concerns CPA practices broadly; no deployed
    pricing model tied to AI was confirmed for corporate compliance. The fuller entry on pricing is
    tax-research-advisory-25; see also tax-compliance-individual-business-22 and tax-controversy-10.

- id: tax-compliance-corporate-17
  title: Tax analysts build their own pipelines, automations and agents with low-code and AI coding tools instead of waiting in the IT queue
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [software-systems, data-reporting]
  pattern: bulk-transformation
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Data-integration pipelines would otherwise sit in an IT queue for about two months, as a TEI recap describes it
    (TRINST-TEIAUDITOR-2026). Only 50% of corporate tax departments provided technology training in 2025, down from
    59% (TR-TAXTALENT-2026).
  solution: >-
    Attendees at the 2026 TEI seminar described 'vibe-coding' (building software by prompting an AI tool) data-
    integration pipelines in about 15 minutes on platforms such as Alteryx, Power Platform, Snowflake, Databricks,
    Microsoft Fabric and Palantir Foundry. Google and Microsoft showed attendees how to build agents. Orbitax's
    Autopilot is a conversational workflow builder inside its international tax platform. TEI Midyear 2026 scheduled a
    lab titled 'Escaping Excel: Using AI to Analyze Excel Files for Accountants'.
  outcomes:
    - {lever: speed, description: "Time to build a data-integration pipeline, as attendees described it", figure: "about 15 minutes (against about two months in an IT queue)", measures: "the recap's description of what attendees do; no organisation, number of pipelines or measurement given", provenance: self-reported, source_ref: TRINST-TEIAUDITOR-2026}
  prerequisites:
    - "Approved enterprise tools and access to tax data in a platform the analyst can build on"
    - "Training; only 9% rate colleagues as very competent with technology (TR-TAXTALENT-2026)"
    - "Documentation standards and automation sustainment so workflows outlive their builders"
  risks_and_guardrails:
    - "The same recap says such tools let an analyst deploy something 'nobody else has reviewed, documented, or knows how to maintain'; an OpenAI panellist conceded the security point (TRINST-TEIAUDITOR-2026)"
    - "A tool meant to save two hours consumed a day when its users had not been consulted, and Alteryx workflows could not be explained after the builder left (TEI-TAXTECH-2026)"
    - "An agent that cannot open a file may still report on it (TEI-TAXTECH-2026); keep confidential data out of tools without enterprise-grade privacy controls (WK-CORPRES-2026)"
  human_checkpoints:
    - "Independent review and documentation of any pipeline before it feeds a return"
    - "A named owner for each automation"
  role_evolution: >-
    Tax professionals act as builders. Thomson Reuters' survey shows 62% of 2025 new hires emphasised tax expertise
    over technology skills, after 57% of new 2024 roles went to technology and IT expertise, with hybrid tax and
    technology roles rising (TR-TAXTALENT-2026).
  evidence_grade: C
  sources:
    - {ref: TRINST-TEIAUDITOR-2026, title: "2026 TEI Tax Technology Seminar: What the auditor already knows", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-auditor-already-knows", date: "2026-05-12", access: full, locator: "Sections 'End of the traditional model' and 'Two ways to lose'"}
    - {ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "Sections 'A very good man' and 'A very bad wizard'"}
    - {ref: TR-TAXTALENT-2026, title: "Why corporate tax tech is falling short and how talent development can fix it (2026 Corporate Tax Technology Report)", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/tax-tech-talent-development", date: "2026-05-01", access: full, locator: "Key insights; 'Tech competency remains a challenge'; 'Pendulum swing in hiring'"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Orbitax XatBot Autopilot description"}
    - {ref: TEI-MIDYEAR-2026, title: "TEI Midyear Conference 2026 at-a-glance agenda, preliminary (Washington DC, 15-18 Mar 2026)", publisher: "Tax Executives Institute", type: conference, url: "https://www.tei.org/sites/default/files/MY%202026%20At%20a%20Glance%20Agenda_rev3.2_0.pdf", date: "2026-02", access: full, locator: "Tuesday 17 March 2026: 'TEI Tax Lab: Escaping Excel'"}
    - {ref: WK-CORPRES-2026, title: "How controllers and corporate tax leaders can use AI for faster, defensible tax returns (corporate tax research guide)", publisher: "Wolters Kluwer Tax & Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/how-controllers-and-corporate-tax-leaders-can-use-ai-for-faster-defensible-tax-returns", date: "2026-04-02", access: full, locator: "Section 'The non-negotiables for purchasing decision-makers'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Unnamed attendees in a recap by a vendor-owned institute; no named department outcome and no quality evidence. The
    data-platform and control side of the same practice is tax-data-technology-07; an indirect-tax job posting showing
    it is tax-indirect-tax-20.

- id: tax-compliance-corporate-18
  title: A tax model explains its inputs, outputs and assumptions so the reasoning chain is the deliverable in place of a memo, and approved logic is locked
  archetype: tax
  module: compliance-corporate
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    CFOs ask whether AI-prepared tax work will hold up under IRS scrutiny. PwC's AI tax leader says explainability,
    traceability and auditability are the test: 'If you can't explain it, you can't trust it'.
  solution: >-
    PwC says a model it uses to calculate effective tax rates is trained to explain itself (inputs, output,
    assumptions), so the logic chain is part of the deliverable where a memo would previously have been written.
    Once something is approved it is locked, and people suggest improvements instead of making ad hoc changes.
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "interview statement only; no measurement of memo time or review findings", provenance: self-reported, source_ref: PWC-MEGNA-2025}
  prerequisites:
    - "A governance committee and responsible-AI toolkit built around explainability, traceability and auditability (PWC-MEGNA-2025)"
  risks_and_guardrails:
    - "PwC says oversight is stronger for complex outputs such as tax calculations, with multi-eye review (PWC-MEGNA-2025)"
    - "Werfel lists lack of transparency (no clear policy on how AI is used, disclosed and documented) as a preparer risk (TAXADVISER-WERFEL-2026)"
  human_checkpoints:
    - "Multi-eye human review of tax calculation outputs"
    - "An approval step before logic is locked"
  role_evolution: >-
    Staff review generated reasoning rather than write the memo; no headcount effect is published (PWC-MEGNA-2025).
  evidence_grade: C
  sources:
    - {ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "Answers on risk, regulatory review and trust"}
    - {ref: TAXADVISER-WERFEL-2026, title: "A risk framework for AI use in tax administration and preparation (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "Figure 3, business risks: 'Lack of transparency'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C, not B: the only named deployment is an effective-tax-rate model, which is provision work (an adjacent
    process this module excludes), so it cannot carry a B for compliance workpapers; no measurement is published.
    Relevant to compliance workpaper documentation by analogy; read with the provision module.

- id: tax-compliance-corporate-19
  title: A record of AI use and verification (prompt, output, sources, checks, conclusion) is kept with each AI-assisted item in the return workpapers
  archetype: tax
  module: compliance-corporate
  function: risk-compliance-legal
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Positions and calculations made with AI may be reviewed months later, handed to new staff, or challenged by an
    authority or auditor. If no record shows what the tool did and what a person checked, the team cannot show the
    process behind the output. EY practitioners say 'it's not just whether you used AI; it's what you did to validate
    the AI results'.
  solution: >-
    Wolters Kluwer advises recording the question or prompt, the output, the citations, the validation steps and the
    final conclusion. Thomson Reuters describes CoCounsel Tax as returning cited sources and a reasoning chain for
    each response. IRS OPR lists documenting AI usage and verification processes as a best practice and ties section
    10.36 compliance to documented procedures. A Journal of Accountancy firm-policy checklist adds documentation of
    AI use, review and citation verification; the AICPA-published framework asks for 100% logging of AI suggestions
    and preparer decisions.
  outcomes:
    - {lever: risk, description: "No published result. Baseline: in a vendor-run survey of indirect-tax leaders, more than half would not be confident defending AI-assisted decisions to an authority", figure: "57.4%", measures: "share of 176 surveyed indirect tax leaders not confident that AI-assisted decisions would hold up if challenged by a tax authority (indirect tax, adjacent to income tax)", provenance: vendor-published, source_ref: FONOA-2026}
  prerequisites:
    - "An approved-tool list and a standard log format (tool, version, prompt or task, output used, verifier, date)"
    - "Retention aligned with workpaper retention and with section 7216 confidentiality rules"
    - "A defined acceptable-use policy and escalation rules (WK-CORPRES-2026)"
  risks_and_guardrails:
    - "Section 10.36 requires firm procedures and documentation to show adherence; failure through willfulness, recklessness or gross incompetence can lead to discipline (IRS-OPR-2026)"
    - "Logs of prompts and client data are themselves return information; IRC 6713 and 7216 apply (IRS-OPR-2026)"
    - "Only about a third of surveyed indirect-tax organisations run formal human-in-the-loop review of AI outputs (FONOA-2026)"
    - "The Wolters Kluwer guide is vendor-written and about corporate tax research rather than return preparation (WK-CORPRES-2026)"
  human_checkpoints:
    - "Preparer records what was verified, against which source, and signs off the conclusion"
    - "Reviewer confirms the record exists for AI-assisted items before sign-off"
  role_evolution: >-
    OPR lists documenting AI usage and verification processes as a best practice (IRS-OPR-2026), and EY practitioners
    say what matters is 'what you did to validate the AI results' (BTAX-EYGRIP-2025). No source quantifies the effect.
  evidence_grade: C
  sources:
    - {ref: WK-CORPRES-2026, title: "How controllers and corporate tax leaders can use AI for faster, defensible tax returns (corporate tax research guide)", publisher: "Wolters Kluwer Tax & Accounting", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/how-controllers-and-corporate-tax-leaders-can-use-ai-for-faster-defensible-tax-returns", date: "2026-04-02", access: full, locator: "Sections 'Implementation playbook' and 'Checklist: using AI safely for corporate tax research'"}
    - {ref: BTAX-EYGRIP-2025, title: "AI Is Gaining Grip on Tax Compliance. Tax Pros Must Lead the Way (opinion by Daren R. Campbell and Randy Carpenter, EY)", publisher: "Bloomberg Tax (EY authors)", type: press, url: "https://news.bloombergtax.com/tax-insights-and-commentary/ai-is-gaining-grip-on-tax-compliance-tax-pros-must-lead-the-way", date: "2025-11-21", access: full, locator: "Section 'Questions for 2026'"}
    - {ref: TR-AGENTICCORP-2025, title: "How agentic AI is transforming corporate tax departments", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/how-agentic-ai-is-transforming-corporate-tax-departments/", date: "2025-11-11", access: full, locator: "Section 'Agentic AI: What is it, and why does it matter?'"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 4 (section 10.36) and 6 (IRC 6713, 7216); Best Practices"}
    - {ref: TAXCT-CLINCO-2026, title: "A recipe for sanctions: AI-hallucinated citations in tax (analysis of Clinco v. Commissioner, T.C. Memo. 2026-16)", publisher: "Journal of Accountancy (AICPA)", type: press, url: "https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/", date: "2026-09-01", access: full, locator: "Sidebar 'Firm policies for responsible AI use in tax practice'"}
