  last_reviewed: "2026-10-17"
  notes: >-
    Vendor, firm and regulator guidance; no named corporate deployment of AI-use logging with a result. The Fonoa
    figures are indirect-tax and vendor-sponsored. The fuller entry on citation verification and AI-use records is
    tax-research-advisory-19; the same control appears in tax-indirect-tax-15, tax-data-technology-19,
    tax-transfer-pricing-20 and tax-compliance-individual-business-13.

- id: tax-compliance-corporate-20
  title: Tax staff move to approved enterprise AI tools under vendor terms that bar training on company data, with revalidation when vendors change models
  archetype: tax
  module: compliance-corporate
  function: technology-it
  work_types: [software-systems, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Preparers use public AI tools with return data, so company or client data can be exposed or retained by the
    vendor; under IRC 7216 and 6713 unauthorised disclosure or use of return information carries civil and criminal
    exposure. Vendors also update models and content during the year, and a silent change in behaviour (drift) can
    alter outputs without any single failure that triggers review.
  solution: >-
    OPR says practitioners must use only secure, enterprise-approved AI for client data. In KPMG Germany's survey,
    company-wide standard AI tools were reported far more often than tax-specific applications. The AICPA-published
    framework lists illustrative contract terms for AI tax tools: an accuracy service level with a financial remedy,
    liability allocation for positions disallowed on audit, 60 days' notice of material model, training-data or
    citation-method changes with a revalidation window, audit rights, and 24-hour notice of systematic output errors.
    HMRC expects developers of AI tax software to apply continuous monitoring and version control.
  outcomes:
    - {lever: risk, description: "Company-wide standard AI tools are the most common type in German tax departments, ahead of tax-specific applications", figure: "89% (29% specialised tax applications)", measures: "share reported using company-wide standard AI solutions in tax departments; the release does not state the base or sample size", provenance: vendor-published, source_ref: KPMG-DE-2026}
  prerequisites:
    - "IT approval and data-protection review of each tool"
    - "Vendor terms prohibiting use of company data for model training (AICPA-WERFEL-2026, Appendix C risk 2)"
    - "An acceptable-use policy and training; a regression test set per form for revalidation"
  risks_and_guardrails:
    - "Hurdles named by KPMG Germany respondents: IT approvals 47%, data protection 41%, lack of knowledge about AI applications 41% (base and sample size not stated) (KPMG-DE-2026)"
    - "More than one-third of surveyed tax and audit professionals admit using unauthorised AI tools (TR-FOP-2026)"
    - "UK PCRT guidance says entering client data into a publicly available AI model without consent is likely to breach confidentiality (ICAEW-PCRT-2026)"
    - "A vendor contract cannot transfer the signing preparer's professional responsibility; the contract terms are illustrative from a worked example, not a market norm (AICPA-WERFEL-2026)"
  human_checkpoints:
    - "Tax director approves the tool list; IT, legal and procurement approve data and contract terms"
    - "Tax technology staff revalidate outputs after each notified vendor change"
  role_evolution: >-
    OPR expects firm procedures to cover staff training, secure data handling and vetting of third-party AI tools
    (IRS-OPR-2026); the Werfel worked example adds revalidation after notified vendor model changes
    (AICPA-WERFEL-2026). Which role owns this is not described in the sources.
  evidence_grade: C
  sources:
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 6 (IRC 6713 and 7216(a))"}
    - {ref: KPMG-DE-2026, title: "Tax departments are increasingly turning to artificial intelligence (KPMG Germany quick surveys)", publisher: "KPMG Germany", type: survey, url: "https://kpmg.com/de/en/media/press-releases/2026/05/tax-departments-are-increasingly-turning-to-artificial-intelligence.html", date: "2026-05-07", access: full, locator: "Paragraphs 'Tax departments are already making extensive use of AI' and 'AI boosts efficiency but requires clear organizational prerequisites'"}
    - {ref: TR-FOP-2026, title: "What the 2026 Future of Professionals Report says tax & audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "'Universal priorities for firm leaders', first bullet"}
    - {ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW Insights (news item on the seven-body PCRT guidance)", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01-19", access: full, locator: "'Fundamental principles', Confidentiality"}
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C risk 2 'Client Data Leakage'; Appendix D Step 6 'Contractual Requirements' (PDF p. 44)"}
    - {ref: HMRC-GENAI-2026, title: "Guidelines for using generative artificial intelligence if you're a software developer", publisher: "HM Revenue & Customs (GOV.UK)", type: regulator, url: "https://www.gov.uk/guidance/guidelines-for-using-generative-artificial-intelligence-if-youre-a-software-developer", date: "2026-01-28", access: full, locator: "'Using reliable source data', last paragraph"}
    - {ref: NIST-AI600-2024, title: "Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile (NIST AI 600-1)", publisher: "NIST", type: standard-setter, url: "https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence", date: "2024-07-26", access: full, locator: "Abstract (voluntary cross-sector profile; landing page only)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a governed tooling environment rather than a work pattern. Survey-level evidence only; no named
    organisation is described, and no vendor contract adopting the Werfel terms was found. The KPMG Germany sample
    covers German companies; the TR-FOP figure covers tax and audit professionals, not only corporate tax departments.
    The fuller entry on a firm-wide approved-tool standard is tax-research-advisory-07; for small firms see
    tax-compliance-individual-business-19.

- id: tax-compliance-corporate-21
  title: Gated rollout of AI-drafted return work, with full logging, override and error-rate thresholds, ROI baselines and unaided-competence checks
  archetype: tax
  module: compliance-corporate
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Faster AI-enabled preparation can make review less rigorous in practice while it stays unchanged on paper; a
    reviewer who accepts nearly every AI suggestion adds no independent check. Few teams measure what AI does, so
    they cannot show value or catch quality decline, and juniors who never prepare a first draft may not build the
    judgment to review one.
  solution: >-
    The AICPA-published framework sets out phased adoption (research and summarisation only, then AI-suggested
    deductions and credits, then AI-drafted positions), each phase with gate conditions: 100% logging of AI
    suggestions and preparer decisions, override rates reviewed by preparer, suspension or scope restriction when
    error rates cross thresholds, and an annual check that staff can still do AI-assisted tasks without the tool.
    Thomson Reuters suggests tracking baselines for cycle time, documentation hours and audit exposure.
  outcomes:
    - {lever: quality, description: "Few indirect-tax functions have AI targets or KPIs", figure: "12.5%", measures: "share of 176 surveyed indirect tax leaders whose functions have specific targets or KPIs for AI (indirect tax, adjacent)", provenance: vendor-published, source_ref: FONOA-2026}
    - {lever: cost, description: "Few organisations measure return on GenAI investment", figure: "20%", measures: "share of organisations measuring ROI in Thomson Reuters' 2025 professional-services report, as quoted by TR (professional services broadly)", provenance: vendor-published, source_ref: TR-TENSIONS-2025}
    - {lever: risk, description: "Under half apply governance controls before production", figure: "48%", measures: "share of RSM Middle Market AI Survey 2026 respondents applying governance controls before production (16% only after issues arise, 7% inconsistently); sample size not stated", provenance: vendor-published, source_ref: RSM-AISURVEY-2026}
  prerequisites:
    - "Baselines before rollout and agreed definitions of an error, an override and a rework cycle"
    - "A named AI governance owner with authority to restrict or suspend the tool"
    - "Engagement and vendor contract terms in place before the second phase (AICPA-WERFEL-2026, Appendix D steps 6 and 7)"
    - "Structured rotation of juniors through review and exception handling"
  risks_and_guardrails:
    - "Worked-example thresholds, not a standard: phase 2 needs a hallucination rate of 2% or less for 60 consecutive days; phase 3 needs a phase-2 error rate of 1% or less for 90 days; a preparer override rate below 5% triggers review as a sign of rubber-stamping (AICPA-WERFEL-2026)"
    - "Suspension in the worked example: automatic above 1% error in any 30-day window in phase 3, immediate above 2% (AICPA-WERFEL-2026)"
    - "Only 36% of RSM respondents cite model documentation and lineage tracking as a current practice (RSM-AISURVEY-2026)"
    - "Skill erosion and institutional knowledge loss are workforce risks in the preparer register (TAXADVISER-WERFEL-2026)"
  human_checkpoints:
    - "Signing preparer verifies every AI-drafted position before filing; novel or uncertain positions escalate to senior review regardless of AI confidence"
    - "Tax director or governance owner reviews indicators on a set cadence and decides on expansion, restriction or suspension"
    - "Managers run the annual unaided capability check"
  role_evolution: >-
    In the Werfel worked example, sign-off must show independent analysis, a designated AI governance owner can
    restrict or suspend the tool, and a quality review lead monitors override rates (AICPA-WERFEL-2026). RSM respondents expect a shift from compliance execution to strategic
    planning (48%), AI orchestration roles (44%) and hybrid roles (43%) (RSM-AISURVEY-2026).
  evidence_grade: C
  sources:
    - {ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C risk 6 (PDF p. 28); Appendix D Steps 5, 7 and 8 (PDF pp. 41, 45, 46)"}
    - {ref: TAXADVISER-WERFEL-2026, title: "A risk framework for AI use in tax administration and preparation (Danny Werfel)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/a-risk-framework-for-ai-use-in-tax-administration-and-preparation/", date: "2026-08-31", access: full, locator: "Sections 'AI risk register for tax preparers' and 'Innovate, but responsibly'; Figure 3 workforce risks; author disclaimer"}
    - {ref: AICPA-CART-2026, title: "AICPA, former IRS commissioner to lead initiative on AI in tax", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-former-irs-commissioner-to-lead-initiative-on-ai-in-tax/", date: "2026-09-23", access: full, locator: "Paragraphs 2-4 (CART purpose)"}
    - {ref: FONOA-2026, title: "State of Indirect Tax in the AI Era 2026 (landing page; full report gated)", publisher: "Fonoa", type: survey, url: "https://www.fonoa.com/resources/guides/state-of-indirect-tax-in-the-ai-era-2026", date: "2026-06-17", access: full, locator: "Section 'The AI mandate is real, but what leaders want is unclear'"}
    - {ref: TR-TENSIONS-2025, title: "5 GenAI tensions corporate tax departments should address (from the 2025 Generative AI in Professional Services Report)", publisher: "Thomson Reuters Tax & Accounting", type: survey, url: "https://tax.thomsonreuters.com/blog/the-corporate-tax-genai-evolution-five-key-tensions-your-department-should-address-tri/", date: "2025-06-24", access: full, locator: "Tension 3: the ROI measurement gap"}
    - {ref: RSM-AISURVEY-2026, title: "AI is working in tax. Scaling it is the hard part (RSM Middle Market AI Survey 2026)", publisher: "RSM US", type: survey, url: "https://rsmus.com/insights/services/business-tax/ai-is-working-in-tax-scaling-it-is-the-hard-part.html", date: "2026-07-21", access: full, locator: "Sections 'AI governance in tax: From policy to practice' and 'Tax AI and the workforce'"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "'Four steps to build AI momentum in corporate tax', step 3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a governance gate and measurement loop around AI-assisted preparation. The worked case is a
    preparer firm using the tool on client returns (individual examples: W-2, 1099, Schedule C), not a corporate
    return; the article says the views are the author's, not AICPA policy. Graded C on the vendor recommendation and
    surveys; no firm or department has published applying the thresholds. Overlaps:
    tax-compliance-individual-business-18 (phased adoption with parallel runs) and tax-data-technology-21 (acceptance
    thresholds and ongoing measurement).

- id: tax-compliance-corporate-22
  title: 'Idea: a deterministic tax engine computes the return while a language model translates rules into logic that is checked against test returns'
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [software-systems, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Language models asked to compute a return directly do not do it reliably, and returns must be computed exactly.
    Rule updates (new forms, instructions, provisions) must still reach the calculation engine.
  solution: >-
    Researchers propose using the model to translate statutes, forms and instructions into executable logic that is
    checked against test returns, then letting a symbolic solver or the existing deterministic engine compute. The
    IRS publishes Modernized e-File schemas and business rules (reject criteria) for Forms 1120 and others, which give
    a deterministic check on what is submitted.
  outcomes:
    - {lever: quality, description: "Best of four 2025 models, computing a simplified federal Form 1040 directly, got the whole return right in about a third of outputs", figure: "32.35%", measures: "strict correct-return rate on 51 tax-year-2024 Form 1040 test cases: share of outputs in which every evaluated line matched exactly (best model; 4 runs per model per thinking level)", provenance: vendor-published, source_ref: COLUMN-TAXCALCBENCH-2025}
    - {lever: quality, description: "A neuro-symbolic form-formalisation system matched all 51 held-out TaxCalcBench returns, against 66% for the strongest language model alone", figure: "100% vs 66%", measures: "cell-level and form-level accuracy on 51 held-out TaxCalcBench returns, against the 'accuracy' of the strongest LLM alone as the abstract states it (unit not stated)", provenance: independent, source_ref: HAN-LAWORDER-2026}
    - {lever: quality, description: "On a statutory-reasoning benchmark the best frontier models still fail many hard tasks", figure: "44.4%", measures: "best hard-subset score on SARA Numeric tasks in DeonticBench", provenance: independent, source_ref: DEONTICBENCH-2026}
  prerequisites:
    - "Reference returns or test cases per form and rule set, and a maintained rule library"
    - "A route into the IRS MeF XML schemas and business rules (IRS-MEF-2026)"
  risks_and_guardrails:
    - "TaxCalcBench's authors sell a deterministic tax engine, and the study covers personal income tax, so its results are adjacent to corporate returns (COLUMN-TAXCALCBENCH-2025)"
    - "TaxCalcBench found models misuse tax tables, make calculation errors and misjudge eligibility (COLUMN-TAXCALCBENCH-2025)"
    - "Jurayj et al. argue that automated tax systems need both high accuracy and auditability, which makes language models alone poorly suited; they pair a model with a symbolic solver (JHU-TAXREASON-2025)"
  human_checkpoints:
    - "Tax technology staff review generated logic and test coverage"
    - "Preparer reviews the computed return and flagged exceptions"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: D
  sources:
    - {ref: COLUMN-TAXCALCBENCH-2025, title: "TaxCalcBench: Evaluating Frontier Models on the Tax Calculation Task (arXiv 2507.16126)", publisher: "Column Tax authors (Bock, Molisee, Ozer, Shah), arXiv preprint", type: academic, url: "https://arxiv.org/abs/2507.16126", date: "2025-07-22", access: full, locator: "Abstract; section 4.2 'Takeaways' (results table)"}
    - {ref: JHU-TAXREASON-2025, title: "Language Models and Logic Programs for Trustworthy Tax Reasoning (arXiv 2508.21051; accepted to AAAI 2026)", publisher: "arXiv preprint (Jurayj, Holzenberger, Van Durme; Johns Hopkins University)", type: academic, url: "https://arxiv.org/abs/2508.21051", date: "2025-08-28", access: full, locator: "Abstract"}
    - {ref: HAN-LAWORDER-2026, title: "Law And Order: Tax Law Autoformalization (arXiv 2610.02792)", publisher: "arXiv preprint (Han, Takashima, Wei, Li, Genesereth)", type: academic, url: "https://arxiv.org/abs/2610.02792", date: "2026-10-02", access: full, locator: "Abstract"}
    - {ref: DEONTICBENCH-2026, title: "DeonticBench: A Benchmark for Reasoning over Rules (arXiv 2604.04443)", publisher: "arXiv preprint (Dou et al.)", type: academic, url: "https://arxiv.org/abs/2604.04443", date: "2026-04-06", access: full, locator: "Abstract"}
    - {ref: IRS-MEF-2026, title: "Modernized e-File (MeF) schemas and business rules", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/e-file-providers/modernized-e-file-mef-schemas-and-business-rules", date: "2026-05-29", access: full, locator: "Introductory paragraph and form list (Forms 1120 family)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea backed by published research results, all on individual-return or statutory-reasoning data. The Han et al.
    authors built the system they tested; 'independent' means a third-party academic source, not a replication. The
    TaxCalcBench figure is vendor-published because its authors work at a deterministic-engine vendor. Same design
    idea: tax-compliance-individual-business-10, tax-research-advisory-12 and tax-indirect-tax-22.

- id: tax-compliance-corporate-23
  title: 'Idea: an input-verification gate flags missing or contradictory facts and holds the case for a person before a model computes a tax result'
  archetype: tax
  module: compliance-corporate
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Real inputs are often incomplete or internally inconsistent. A model that computes straight through a
    contradiction returns a confident number with no sign that anything is wrong.
  solution: >-
    Researchers add one extra model call that checks the input for conflicts before the solve, and abstain when it
    finds one. The same model flagged most contradictions when asked to verify rather than to solve.
  outcomes:
    - {lever: quality, description: "Strong models computed through injected contradictions and returned the clean-input answer without any signal of the conflict", figure: "63% to 76%", measures: "share of injected-contradiction cases in which the strongest models (of six studied) returned the clean-input answer, on SARA-derived tax cases", provenance: independent, source_ref: SADOWSKI-VERIFY-2026}
    - {lever: quality, description: "The gate recovered most missed abstentions at a limited cost to clean-case accuracy", figure: "at most about 5 percentage points", measures: "loss in clean-input accuracy across all six models from adding the verification call, as the abstract reports", provenance: independent, source_ref: SADOWSKI-VERIFY-2026}
  prerequisites:
    - "Structured case facts, and a place in the workflow to hold a case for a person when a conflict is flagged"
  risks_and_guardrails:
    - "Evidence is from statutory benchmark cases (SARA, individual tax), not corporate returns (SADOWSKI-VERIFY-2026)"
    - "The abstract says high accuracy on well-formed inputs is an incomplete measure of reliability (SADOWSKI-VERIFY-2026)"
  human_checkpoints:
    - "A person resolves every case where the gate abstains"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: D
  sources:
    - {ref: SADOWSKI-VERIFY-2026, title: "Solving versus Verifying: Catching Contradictions in Tax Reasoning Systems (arXiv 2609.05928)", publisher: "arXiv preprint (Sadowski, Chudziak)", type: academic, url: "https://arxiv.org/abs/2609.05928", date: "2026-09-05", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. The arXiv page says the paper was accepted for ICTAI 2026 (IEEE); only the abstract was read. Related:
    tax-compliance-corporate-22 (deterministic engine after the gate).

- id: tax-compliance-corporate-24
  title: 'Idea: continuous, always-on compliance monitoring replaces periodic batch preparation'
  archetype: tax
  module: compliance-corporate
  function: finance-accounting
  work_types: [review-assurance, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Compliance is prepared in periodic batches, so issues surface at deadlines. In jurisdictions with continuous
    transaction controls, authorities see transactions as they happen and pre-fill returns; one panellist described
    the job shifting 'from us preparing returns to us answering notices'.
  solution: >-
    EY practitioners describe AI agents that analyse compliance metrics continuously and trigger alerts or
    remediation before deadlines, instead of batch filings. Deloitte's fourth scenario envisions continuous or near
    real-time compliance with preventive AI-driven controls.
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "forward-looking descriptions; no deployment or measurement", provenance: self-reported, source_ref: BTAX-EYGRIP-2025}
  prerequisites:
    - "Structured, near real-time transaction and ledger data (TRINST-TEIAUDITOR-2026)"
    - "Preventive controls built into upstream business processes, and mature data governance (DELOITTE-TTT-2026)"
  risks_and_guardrails:
    - "Deloitte notes a patchwork in which some authorities are not ready for real-time interaction, creating hybrid compliance burdens (DELOITTE-TTT-2026)"
    - "One panellist described companies padding numbers and treating audit as the cheaper cost; another said 'Do not do this' (TRINST-TEIAUDITOR-2026)"
    - "EY says agentic tools raise the bar for data lineage and human judgment (BTAX-EYGRIP-2025)"
  human_checkpoints:
    - "A person reviews alerts and decides on remediation"
  role_evolution: >-
    EY authors say tax professionals shift to judgment, exception management, model tuning and strategic insight
    (BTAX-EYGRIP-2025). Deloitte's fourth scenario moves them from preparation to oversight, interpretation, policy
    interaction and dispute resolution (DELOITTE-TTT-2026).
  evidence_grade: D
