    title: State of Indirect Tax in the AI Era 2026
    publisher: Fonoa
    type: survey
    url: https://www.fonoa.com/resources/guides/state-of-indirect-tax-in-the-ai-era-2026
    date: '2026-06-17'
    access: full
    locator: Sections on confidence, governance, diagnostic checklist and 'How Fonoa Intelligence helps'
