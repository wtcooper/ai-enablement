- id: tax-data-technology-24
  title: Tax operations co-sourced or run as a managed service on a provider's AI and data platforms, with AI-use due diligence
    on providers
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  - review-assurance
  pattern: other
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: In-house teams say they struggle to build their own solutions; a head of finance at a global e-commerce and cloud
    company told EY that internal builds would often have been better done with an external provider (BTAX-EYTFO-2026). In
    a Thomson Reuters 2025 report relayed by its tax blog, 77% of business tax departments wanted their tax service providers
    to use generative AI, yet 59% 'aren't sure if their companies are using GenAI', which the blog presents as a provider-transparency gap (TR-TENSIONS-2025).
  solution: Use a third party that invests in AI and data tooling, or a managed service where authorities cannot interact
    in real time. In EY's survey, 78% said a third-party provider with deep AI capabilities would moderately or significantly
    benefit their tax function (BTAX-EYTFO-2026). Deloitte lists 'a managed service or selective outsourcing with specialist
    resources' as an option (DELOITTE-TTT-2026). The Vertex Exchange recap says most large implementations are now partner-led
    (INNOVATETAX-VXE-2026). The AICPA-published risk register's illustrative controls include vetting AI vendors for data
    retention and training practices, contract terms that bar vendor training on client data, and protections for data portability
    and notice (AICPA-WERFEL-2026); IRS OPR says outsourced or third-party AI tools should be vetted (IRS-OPR-2026).
  outcomes:
  - lever: capacity
    description: Share of respondents reporting better focus on high-value work as co-sourcing grows
    figure: 85%
    measures: Respondents reporting improved ability to focus on high-value activities as use of co-sourcing grows (EY Tax
      and Finance Operations Survey, as written up by Bloomberg Tax; base not stated)
    provenance: vendor-published
    source_ref: BTAX-EYTFO-2026
  prerequisites:
  - Contract and procurement involvement, including terms on data use, portability and notice (AICPA-WERFEL-2026).
  - Knowing whether and how providers use AI; without it a department cannot measure efficiency gains or benchmark fees (TR-TENSIONS-2025).
  risks_and_guardrails:
  - EY sells these services; the survey and the write-up come from a provider with an interest in the result (BTAX-EYTFO-2026).
  - 'Accountability stays with the tax function: Deloitte says the function must stand behind outcomes that are accurate,
    compliant and defensible (DELOITTE-TTT-2026).'
  - The register lists vendor dependence, including a vendor discontinuing a core product at 30 days' notice, as a risk; it
    and the OPR alert are written for practitioners, not in-house departments (AICPA-WERFEL-2026; IRS-OPR-2026).
  human_checkpoints:
  - In-house review of provider output; the EY write-up says the business should apply critical human review (BTAX-EYTFO-2026).
  role_evolution: The EY write-up says co-sourcing frees internal teams to focus on advisory work (BTAX-EYTFO-2026). In Deloitte's fourth scenario routine tax operations are largely automated and the department puts more emphasis on strategic and advisory work (DELOITTE-TTT-2026).
  evidence_grade: C
  sources:
  - ref: BTAX-EYTFO-2026
    title: AI Era Requires Continuous Tax and Finance Transformation
    publisher: Bloomberg Tax Daily Tax Report (draws on the EY survey; byline not shown)
    type: press
    url: https://news.bloomberglaw.com/daily-tax-report/ai-era-requires-continuous-tax-and-finance-transformation
    date: '2026-02-09'
    access: full
    locator: '''Agentic AI: Promise and Practicalities'' (interviews) and ''Trust in Your People'''
