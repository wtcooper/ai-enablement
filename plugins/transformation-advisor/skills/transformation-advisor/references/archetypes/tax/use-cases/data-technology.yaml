- id: tax-data-technology-17
  title: Read-only MCP access lets general AI assistants answer questions from the company's own tax-compliance data
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - data-reporting
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: Finance and tax staff must log in to a compliance portal to see nexus, filings and registrations, and generic assistants
    answer from general knowledge rather than the company's numbers (KINTSUGI-MCP-2026).
  solution: Kintsugi's MCP server (MCP, the Model Context Protocol, is a standard way for AI assistants to call outside tools)
    gives Claude or ChatGPT read-only access to a customer's nexus, transactions, filings, registrations, products, connections
    and account data through 46 tools in nine areas, so users can ask questions such as which filings are due this month (KINTSUGI-MCP-2026).
    Avalara's 2025 blog describes an agent answering the status of a sales tax return through its MCP servers (AVALARA-MCP-2025).
    Anrok's product page says its MCP server both answers questions and takes actions such as mapping a product, adding a customer or updating a transaction, under scoped OAuth 2.1 credentials (ANROK-MCP-2026).
  outcomes:
  - lever: experience
    description: none published
    figure: null
    measures: null
    source_ref: KINTSUGI-MCP-2026
  prerequisites:
  - A login on the vendor platform and an MCP-capable AI client (KINTSUGI-MCP-2026).
  - OAuth 2.1 sign-in and scoped permissions (AVALARA-MCP-2026).
  risks_and_guardrails:
  - Kintsugi says every tool is read-only so the assistant cannot change anything or take action, and that human experts verify
    the numbers behind every filing (KINTSUGI-MCP-2026).
  - Avalara advises least-privilege scopes, periodic consent audits and logging of every tool call, since agents are nondeterministic
    (AVALARA-MCP-2026).
  human_checkpoints:
  - The assistant answers questions only; filings remain checked by the vendor's experts (KINTSUGI-MCP-2026).
  role_evolution: Not stated beyond partners and founders being able to query their own compliance picture without portal
    navigation (KINTSUGI-MCP-2026).
