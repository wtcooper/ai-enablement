- id: tax-data-technology-21
  title: Acceptance thresholds set before go-live, then ongoing accuracy, override-rate and cycle-time measurement for tax
    AI and automation
  archetype: tax
  module: data-technology
  function: risk-compliance-legal
  work_types:
  - review-assurance
  - data-reporting
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: 'Tax functions are told to adopt AI but not what good looks like: in Fonoa''s survey of 176 indirect tax leaders
    only 12.5% had specific AI targets or KPIs, and only a third ran formal human-in-the-loop review (FONOA-2026). In Deloitte''s
    survey, 77% of tax leaders required 90% or higher accuracy before entrusting AI with their tax processes (DELOITTE-LU-2025).'
  solution: Tax sets acceptance thresholds before go-live and monitors accuracy, override rates and cycle time afterwards.
    Commentary on COSO's guidance names transaction volume, transaction size and override percentages as drift indicators
    and calls for accuracy and reliability evaluations and root-cause analysis (DART-COSO-2026). Fonoa's diagnostic asks whether
    leadership has set AI KPIs, whether time saved, cost avoided or cycle-time reduction is measured by workflow, and whether
    a documented audit trail exists for AI-assisted decisions (FONOA-2026).
  outcomes:
  - lever: capacity
    description: A small cohort with accountability structures reported compliance workload falling faster than others (vendor
      survey, indirect tax)
    figure: 8x the rate of everyone else
    measures: Compliance workload decrease reported by the small cohort of surveyed indirect tax leaders that closed the AI
      accountability gap, relative to all other respondents; the cohort definition and measure are in the gated report
    provenance: vendor-published
    source_ref: FONOA-2026
  - lever: quality
    description: 'Baseline, not an outcome of the use case: tax leaders requiring high accuracy before trusting AI'
    figure: 77%
    measures: Tax leaders among Deloitte's Tax Transformation Trends respondents requiring 90% or higher accuracy before entrusting
      AI with their tax processes; sample size not stated
    provenance: vendor-published
    source_ref: DELOITTE-LU-2025
  prerequisites:
  - A baseline and a test set; Fonoa's checklist asks whether the AI is grounded in current rules, transaction data and the
    company's own context (FONOA-2026).
  risks_and_guardrails:
  - 'Silent failure: a TEI attendee described an agent that, when challenged, said it could not open the file and was telling
    the user what they wanted to hear (TEI-TAXTECH-2026).'
  - Only 20% of organisations across professional services measure return on investment, per the relayed Thomson Reuters report
    (TR-TENSIONS-2025).
  - 'By analogy only: TIGTA found the IRS had no process to evaluate whether its examination-selection AI models performed
    better than prior methods (TIGTA-2025).'
  human_checkpoints:
  - Formal human-in-the-loop review of AI outputs before they inform tax decisions, run by about a third of Fonoa's respondents
    (FONOA-2026).
  role_evolution: Tax leaders define KPIs and accountability structures (FONOA-2026); TEI attendees said reviewing a growing
    volume of quiet, polite errors is the unresolved question (TEI-TAXTECH-2026).
  evidence_grade: C
  sources:
