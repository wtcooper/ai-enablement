- id: tax-data-technology-07
  title: Tax analysts build data pipelines and small tools with AI coding and low-code agent tools, under review, documentation
    and inventory controls
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - software-systems
  - data-reporting
  pattern: bulk-transformation
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: Data integrations that tax needs can wait months in an IT queue (TRINST-TEIAUDITOR-2026). The same coverage warns
    that building them fast also lets an analyst deploy something nobody else has reviewed or documented (TRINST-TEIAUDITOR-2026).
  solution: 'Tax analysts use AI coding tools and low-code agent builders to create ingestion and transformation pipelines
    and small applications. When TEI attendees polled themselves on tooling, the answers included Alteryx, Power Platform,
    Snowflake, Databricks, Microsoft Fabric and Palantir Foundry; reported uses include agentic systems run against historical
    filings and validation agents that critique their own output (TRINST-TEIAUDITOR-2026). Four members of OpenAI''s tax department
    demonstrated live automation pipelines, and Google and Microsoft walked attendees through building agents (TEI-TAXTECH-2026).
    The TEI-SJSU panel deck (RSM, Grant Thornton, EY and OpenAI speakers) lists examples such as extracting XML from tax return
    files into SQL tables, automating monthly tax G/L reconciliations and scraping SEC tax footnotes for peer benchmarking
    (SJSU-TEIHTTI-2025). TEI''s November 2025 programme included ''Can Tax pro-code in No-Code: Python Integration into Excel''
    (TEI-TECHTAX-2025). COSO''s generative AI guidance names ingestion and transformation as capability types with their own
    control expectations (JOFA-COSO-2026).'
  outcomes:
  - lever: speed
    description: Pipeline build time against time in an IT queue, as the recap author describes attendees; anecdotal, no method
      given
    figure: about 15 minutes vs about two months
    measures: Time to build a data-integration pipeline with AI coding tools versus the time such a request 'would have sat
      in an IT queue'; the recap's characterisation of unnamed attendees, not a measured study
    provenance: self-reported
    source_ref: TRINST-TEIAUDITOR-2026
  prerequisites:
  - An approved environment and IT sign-off; in KPMG Germany's quick survey the biggest hurdles to expanding AI were IT approvals
    (47%), data protection requirements (41%) and lack of knowledge of AI applications (41%) (KPMG-DE-2026).
  - An inventory of AI use cases with clear ownership and escalation paths, which COSO's guidance emphasises to counter uncontrolled
    adoption ('shadow AI') (DART-COSO-2026).
  - Light scripting skills in tax staff (OPENAI-DIRECTTAXJOB-2026).
  risks_and_guardrails:
  - The recap warns that an analyst can deploy a pipeline nobody else has reviewed, documented or knows how to maintain; an
    OpenAI panelist conceded the point when asked about the security implications of vibe coding (building software by prompting
    an AI tool) (TRINST-TEIAUDITOR-2026).
  - Attendees described Alteryx workflows nobody could explain after the builder left (TEI-TAXTECH-2026).
  - The panel deck lists 'governance fog' and underdocumented processes as blockers and shadow usage as a risk (SJSU-TEIHTTI-2025).
  - The recap's key insights list rising token costs as a problem that could change the economic case for automation; no figures are given (TEI-TAXTECH-2026).
  human_checkpoints:
  - Review and documentation of any pipeline before it is relied on; the recap names unreviewed, undocumented pipelines as
    the failure mode (TRINST-TEIAUDITOR-2026).
  - Light runbooks and validation checks, as listed in OpenAI's posting (OPENAI-DIRECTTAXJOB-2026).
  role_evolution: Tax analysts become pipeline builders without an IT hand-off; the recap describes the job at the high end
    as 'as much a data science problem as an accounting one' (TRINST-TEIAUDITOR-2026). A senior director is quoted saying
    you will not survive in the field without a change mindset (TEI-TAXTECH-2026).
  evidence_grade: C
