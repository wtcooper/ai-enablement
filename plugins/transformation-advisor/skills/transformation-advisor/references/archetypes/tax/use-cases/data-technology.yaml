- id: tax-data-technology-23
  title: Central tax operations and technology team, built with finance and IT, owns tax data, automation and AI
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - coordination-scheduling
  - software-systems
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: In the 2026 Thomson Reuters Institute and TEI technology report, 64% placed their tax department at the chaotic
    or reactive end of a maturity curve (57% the year before) and 22% track no technology performance metrics (TR-REBRAND-2026).
    In the 2025 Thomson Reuters survey, 58% of corporate tax departments called themselves under-resourced, up from 51% (TR-CORPTAX-2025).
  solution: Set up a central team that owns tax technology, data and automation, often with a hub for standard processes.
    In a CIOT DITT Talk episode (2025-08-03), Anna Elphick, Global Head of Tax, Treasury and Insurance at Unilever Ice Cream, discussed Unilever's global tax transformation, including setting up a centralised tax operations centre to drive efficiency, accuracy
    and control across jurisdictions (CIOT-DITT-2025). A German head of tax interviewed by EY said his company has a dedicated
    AI team helping tax with compliance and reporting (BTAX-EYTFO-2026). In KPMG Germany's quick survey, 40% expect more use
    of shared service centres (KPMG-DE-2026). Deloitte advises close collaboration with finance and IT (DELOITTE-LU-2025).
  outcomes:
  - lever: experience
    description: Designated leadership for tax technology strategy, as context; the report does not link it to a result
    figure: 88% (from 51%)
    measures: Corporate tax departments with a designated person leading tax technology strategy (2026 Corporate Tax Department
      Technology Report, 170 tax leaders; share a year earlier in brackets)
    provenance: vendor-published
    source_ref: TR-REBRAND-2026
  - lever: risk
    description: Association between time mix and penalties; not shown to be caused by technology or team design
    figure: 31% vs 56%
    measures: Respondents who spend more than half their time on proactive work whose departments incurred penalties (31%),
      against those spending more than half their time reactively (56%); 2025 survey
    provenance: vendor-published
    source_ref: TR-CORPTAX-2025
  - lever: quality
    description: Correlation from a firm-published survey
    figure: 4-6x more likely
    measures: Organisations in the top quartile of 'tax readiness', compared with the bottom quartile, more likely to outperform
      peers on innovation, resilience, workforce capability and enterprise value; 2,084 senior leaders in 25 countries
    provenance: vendor-published
    source_ref: KPMG-READINESS-2026
  prerequisites:
  - Executive sponsorship; Thomson Reuters says a technology lead title only works when the team believes it belongs at the
    decision-making table (TR-REBRAND-2026).
  - A business case built on hard ROI and cost savings, the metrics Thomson Reuters says matter most to finance and IT (TR-REBRAND-2026).
  - Persona-based training; one organisation in a Thomson Reuters roundtable developed over two dozen user personas (TR-SAP-2025).
  - 'Skills: 45% of Deloitte''s respondents named AI-related skills their greatest need in one to two years (DELOITTE-LU-2025).'
  risks_and_guardrails:
  - A transformation director described a training programme across dozens of global clients that failed; a tool meant to
    save two hours cost a day because users had not been consulted (TEI-TAXTECH-2026).
  - 'Key-person risk: workflows nobody could explain after the builder left (TEI-TAXTECH-2026).'
  - Most surveyed tax leaders said upgrading tax technology is still a relatively low priority at their company (TR-CORPTECH-2026).
  human_checkpoints:
  - A governance framework with named owners, documented sign-off and internal reviews against a compliance calendar (TR-GOVERNANCE-2026).
  role_evolution: 'PwC Ireland expects new roles to emerge, formally or not: tax data leads, model governance leads and people
    who bridge tax requirements and technical delivery (PWC-IE-2026). In EY''s survey (as written up by Bloomberg Tax), 89%
    are upskilling existing staff, 81% are hiring people with skills other than tax technical capability and 62% are redefining
    roles (BTAX-EYTFO-2026). KPMG Germany: 58% expect domestic tax headcount to stay constant, 72% abroad (KPMG-DE-2026).
    Michael Sala argues in Tax Notes State that AI will not shrink corporate tax teams much because AI cannot bear culpability; only the abstract
    was read (SALA-TAXNOTES-2026).'
  evidence_grade: B
