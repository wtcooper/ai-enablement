  runtime_class: workflow-automation
  maturity: in-production
  problem: Month-end sales tax reconciliation between source transactions, tax-engine output and returns is done in manual
    spreadsheets (SAVANT-ROVER-2026).
  solution: 'Rover, a pet-care marketplace, rebuilt its monthly sales tax reconciliation in Savant: the workflow pulls data
    from systems including Avalara, reviews taxability, sourcing and tax-rate reasonability, matches transactions, reconciles
    and produces audit-ready outputs on a schedule (SAVANT-ROVER-2026). Savant also demonstrated multi-system reconciliation
    across ERPs and source documents with data lineage at the April 2026 TEI seminar (SAVANT-2026), and offers out-of-the-box
    agents for sales tax automation and close support (SAVANT-CLAUDE-2026).'
  outcomes:
  - lever: speed
    description: Rover reduced month-end close time after replacing manual spreadsheets with the governed workflow
    figure: 80%
    measures: Reduction in 'month-end close time' per the release's figure line; the same release's text says the company
      reduced its month-end sales tax reconciliation time, so what was timed is not clear; no baseline given
