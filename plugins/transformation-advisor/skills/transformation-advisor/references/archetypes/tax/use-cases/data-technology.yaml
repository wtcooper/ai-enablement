- id: tax-data-technology-16
  title: 'Idea: continuous reconciliation of calculated, invoiced, reported and authority-held transaction data, with exceptions
    routed to reviewers'
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - review-assurance
  - data-reporting
  pattern: full-population-testing
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: In jurisdictions with mature continuous transaction controls, authorities arrive at audits with structured transaction
    data they have already analysed; a panel speaker said they know more about the transactions than the company's own team (TRINST-TEIAUDITOR-2026).
    Indirect tax teams 'need to be able to show that what was calculated is exactly what was invoiced', and that what was
    invoiced was reported (INNOVATETAX-VXE-2026).
  solution: Idea. Reconcile every transaction across calculation, invoice, report and the authority's record continuously,
    an evolution from continuous transaction controls to 'continuous audit controls' discussed at Vertex Exchange Europe 2026
    (INNOVATETAX-VXE-2026). Deloitte's scenario paper describes, for a department with advanced AI adoption, an agent acting
    as a digital tax analyst that extracts, validates and cross-checks invoice data, continuously monitors transactions and
    routes exceptions to the right reviewer; it adds that agentic corrections to source data would need to be stored back
    in the system of record (DELOITTE-TTT-2026). Deloitte also describes heightened audit exposure when authority AI progress
    outruns the company's (DELOITTE-TTT-2026).
  outcomes:
  - lever: risk
    description: none published
    figure: null
    measures: null
    source_ref: DELOITTE-TTT-2026
  prerequisites:
  - Transaction-level data from the ERP, the e-invoicing platform and the authority response (VERTEX-VIDA-2026).
  - Data integrity and common data models, explainability, audit trails and clear ownership of AI-driven tax outcomes (DELOITTE-TTT-2026).
  risks_and_guardrails:
  - Accountability becomes harder to trace in AI-driven processes, so tax would need to engage earlier in governance (DELOITTE-TTT-2026).
  - Vertex-affiliated commentary warns that CTCs implemented in isolation amplify misaligned data models and brittle integrations
    (VERTEX-VIDA-2026).
  - The TEI recap reports hearing of companies that give up on compliance and pad their numbers with a safety margin; a panelist
