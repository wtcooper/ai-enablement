- id: tax-data-technology-18
  title: Company agents call tax engines through vendor MCP servers under least-privilege scopes and full tool-call logging
  archetype: tax
  module: data-technology
  function: technology-it
  work_types:
  - software-systems
  - transaction-processing
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: Each AI model and each tax system needs custom integration, so tax teams that build their own agents cannot call
    a compliance platform without bespoke work; Avalara says tasks that needed several APIs and custom orchestration can become
    standardised tool calls (AVALARA-MCP-2026). Calling a tax engine from an agent raises questions of authorisation, identity
    and logging (MCP-SPEC-2025).
  solution: Avalara says it ships MCP servers for AvaTax, Returns, E-Invoicing and Live Reporting, registrations and licences,
    exemption certificates, tax content, item classification and cross-border; its examples include an accounts-payable agent
    that validates a vendor invoice, checks for an exemption certificate and files the resulting use tax (AVALARA-AGENTIC-2025;
    AVALARA-MCP-2026). Avalara announced NEXT, a virtual developer and partner event on agentic tax and compliance scheduled for 2026-03-26 (AVALARA-NEXT-2026).
    Sovos says it is developing a Sovos MCP Gateway and expects agent-to-agent (A2A) orchestration over time (SOVOS-SOVI-2026).
    Vertex says its Dynamics 365 agent was built with MCP servers (VERTEX-DATASHEET-2025), and PwC's Agent OS connects agents
    to internal data through APIs or MCP (PWC-MEGNA-2025). Anrok says its MCP server can also act, for example mapping a product or updating a transaction (ANROK-MCP-2026). The MCP specification says servers must not accept tokens not issued
    for them and that proxy servers must guard against the confused deputy problem (MCP-SPEC-2025). MCP was contributed to
    the Linux Foundation's Agentic AI Foundation in December 2025 (LF-AAIF-2025) and A2A to the Linux Foundation in June 2025
    (LF-A2A-2025).
  outcomes:
  - lever: speed
    description: none published (Avalara's CEO says customers are cutting filing times from days to hours, without a named
      customer or method)
    figure: null
    measures: null
    source_ref: AVALARA-AGENTIC-2025
  prerequisites:
  - An active vendor subscription with entitlements to the services called, and an MCP-capable client that supports OAuth
    2.1 (AVALARA-MCP-2026).
  - Retry-safe (idempotent) agent flows for tools that file returns or commit transactions (AVALARA-MCP-2026).
  - Agent identity and authorisation; NIST's NCCoE published a draft concept paper on software and AI agent identity and authorisation
    for enterprise use cases (NIST-CAISI-2026).
  risks_and_guardrails:
  - 'Avalara''s production checklist: rate-limit handling and retry logic, logging every tool call with inputs and response
    status, least-privilege OAuth scopes with periodic consent audits, idempotent handling for filings (AVALARA-MCP-2026).'
  - The MCP security best-practice document names confused deputy, token passthrough, server-side request forgery and session
    hijacking as attack patterns (MCP-SPEC-2025).
  - OWASP publishes a Top 10 of the most critical security risks for agentic AI systems, developed with more than 100 experts
    (OWASP-AGENTIC-2025).
  - A Column Tax benchmark found frontier models computed fewer than one third of simplified federal individual returns correctly,
    so tax calculation should not rest on model arithmetic (COLUMN-TAXCALCBENCH-2025).
  human_checkpoints:
  - User consent to requested permissions during the OAuth flow, and periodic audit of consents (AVALARA-MCP-2026).
  - Not specified for Avalara's write tools beyond the advice on scopes and idempotency; Sovos plans governed, human-approved
    actions over time (AVALARA-MCP-2026; SOVOS-SOVI-2026).
  - Vertex's agent keeps human review checkpoints for high-impact changes (VERTEX-DATASHEET-2025).
  role_evolution: Avalara addresses its MCP primer to developers and partners, who would hold the scopes and logs (AVALARA-MCP-2026); no source says who in a tax department owns agent access. Sovos says it is architecting for compliance consumed through agents as well as applications (SOVOS-SOVI-2026).
  evidence_grade: C
  sources:
  - ref: AVALARA-AGENTIC-2025
    title: Avalara Extends AI Leadership with Avi Everywhere, MCP Servers, and Global Compliance Innovations
    publisher: Avalara (PR Newswire)
    type: vendor
    url: https://tools.prnewswire.com/en-us/live/20813/release/20251006EN90727
    date: '2025-10-06'
    access: full
    locator: '''MCP Servers: The Backbone of Intelligent Interoperable Compliance'' and CEO quote'
