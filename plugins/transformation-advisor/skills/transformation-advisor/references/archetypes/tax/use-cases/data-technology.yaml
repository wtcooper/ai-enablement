- id: tax-data-technology-19
  title: Decision log and audit trail for AI-assisted tax determinations, overrides and approvals, recorded as the work happens
  archetype: tax
  module: data-technology
  function: risk-compliance-legal
  work_types:
  - review-assurance
  - data-reporting
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Fonoa's 2026 survey of 176 indirect tax leaders found 57.4% would not be confident defending AI-assisted decisions
    to a tax authority, and that only about a third run formal human-in-the-loop review of AI output (FONOA-2026). Thomson
    Reuters writes that documentation must exist at the moment it is generated and not be reconstructed later (TR-GOVERNANCE-2026).
  solution: Record which AI-assisted outputs affected filings or determinations, the inputs and sources used, and which suggestions
    were accepted, modified or rejected, with data lineage, as work happens. Fonoa's checklist asks whether a team can produce
    a documented audit trail for AI-assisted decisions that affected filings in the last 12 months, and Fonoa markets an 'Audit'
    product that assembles the determination, override and approval trail on demand (FONOA-2026). The AICPA-published risk
    register lists documentation of which AI suggestions were accepted, modified or rejected as an illustrative control (AICPA-WERFEL-2026).
    Sovos says every recommendation, approval and action is documented (SOVOS-SOVI-2026). Thomson Reuters describes an unnamed
    European manufacturer that in 2023 received a seven-figure penalty because it could not show how it reached the right
    answer, not because the return was wrong (TR-GOVERNANCE-2026).
  outcomes:
  - lever: risk
    description: 'Baseline, not an outcome of the use case: the confidence gap an audit trail is meant to close'
    figure: 57.4%
    measures: Respondents (of 176 indirect tax leaders) who would not be confident that AI-assisted decisions would hold up
      if challenged by a tax authority
    provenance: vendor-published
    source_ref: FONOA-2026
  - lever: speed
    description: Fonoa describes its audit view as audit-ready 'in minutes, not weeks'; vendor claim, no sample
    figure: minutes, not weeks
    measures: Time to assemble the determination, override and approval trail on demand, as stated by Fonoa
    provenance: vendor-published
    source_ref: FONOA-2026
  prerequisites:
  - A defined process behind the output; Fonoa says this was the strongest predictor of audit confidence in its data (FONOA-2026).
  - US machine-sensible record rules already require documentation of the processes that create and modify retained records
    and of the internal controls over them (IRS-REVPROC-9825).
  - Logs of inputs, outputs and review decisions kept independently of the vendor; the register lists tamper-proof logging
    and audit-trail access independent of vendor cooperation as a control for tax authorities (AICPA-WERFEL-2026).
  risks_and_guardrails:
  - Fonoa's BDO interviewee says the defence is demonstrating a process, not defending a technology (FONOA-2026).
  - IRS OPR says practitioners using generative AI must verify facts, citations and calculations; the alert applies to practitioners
    before the IRS, not to in-house departments as such (IRS-OPR-2026).
  - The seven-figure penalty anecdote is unattributed and could not be checked (TR-GOVERNANCE-2026).
  human_checkpoints:
  - Formal human-in-the-loop review of AI output before it informs a tax decision (FONOA-2026).
  - Named ownership of each compliance decision and documented sign-off (TR-GOVERNANCE-2026).
  role_evolution: The register calls for mandatory human validation of AI-suggested positions and a record of which suggestions were accepted, modified or rejected (AICPA-WERFEL-2026); Thomson Reuters
    describes named ownership of each compliance decision with documented sign-off (TR-GOVERNANCE-2026).
  evidence_grade: C
  sources:
