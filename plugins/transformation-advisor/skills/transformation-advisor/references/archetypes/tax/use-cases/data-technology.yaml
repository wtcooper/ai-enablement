- id: tax-data-technology-02
  title: Agentic data layer that assembles, maps, validates and anomaly-checks ledger data before it reaches the provision
    and compliance engines
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - data-reporting
  - review-assurance
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: Vendors and commentators argue that data assembly and reconciliation, not the tax calculation, is the binding constraint,
    and that the close-to-provision handoff is a common source of delay and error (KOGNITOS-2026). EY's survey says internal
    tax staff spend 53% of their time on routine tax activities and would like that to be 21% (BTAX-EYTFO-2026).
  solution: An agentic layer beneath the engines pulls data from ledgers and financial statements across entities, maps accounts
    to tax categories, reconciles and validates it, flags anomalies for a person and hands clean data to the engines with
    an audit trail. Kognitos, a non-tax automation vendor, positions its product this way and states it is not a tax engine
    (KOGNITOS-2026). Thomson Reuters says its goal for ONESOURCE direct tax is agentic AI that handles 'data import, validation,
    and mapping' while professionals keep oversight (TR-CORPAI-2026). Deloitte suggests 'AI agents to flag common anomalies
    in source data and account reconciliations for human review' even for departments with limited AI adoption (DELOITTE-TTT-2026).
    PwC Ireland says AI can identify data discrepancies, duplicate transactions and unusual period-on-period movements (PWC-IE-2026).
    Savant's Spring 2026 release expands its Oracle Fusion and SAP S/4HANA connectors and adds a Microsoft Fabric Lakehouse connector (SAVANT-SPRING-2026).
  outcomes:
  - lever: quality
    description: none published
    figure: null
    measures: null
    source_ref: KOGNITOS-2026
  - lever: quality
    description: Expected impact, not a measured result
    figure: 81%
    measures: Survey respondents saying AI for data acquisition and cleansing in the next two years 'will have an impact'
      on their tax function (EY Tax and Finance Operations Survey, as written up by Bloomberg Tax)
    provenance: vendor-published
    source_ref: BTAX-EYTFO-2026
  prerequisites:
  - An established tax engine for calculation; the vendor says its layer sits beneath it (KOGNITOS-2026).
  - Access to ERP and ledger data across entities (KOGNITOS-2026; SAVANT-SPRING-2026).
  - Source data accessible in one place (see tax-data-technology-01) and agreed definitions of what counts as an anomaly (DELOITTE-TTT-2026).
  risks_and_guardrails:
  - Agentic corrections to source data should be stored back in the system of record to keep an audit-ready posture (DELOITTE-TTT-2026).
  - Audit trails for data preparation matter because the provision feeds audited financial statements (KOGNITOS-2026).
  - TEI attendees described errors from current tools as polite and silent, so review volume becomes the problem (TEI-TAXTECH-2026).
  - The vendor blog cites a 58% under-resourced figure without naming a survey; the same figure appears in Thomson Reuters'
    2025 corporate tax survey (KOGNITOS-2026; TR-CORPTAX-2025).
  human_checkpoints:
  - A person reviews every flagged exception (DELOITTE-TTT-2026).
  - Tax professionals keep oversight of mapped and imported data (TR-CORPAI-2026).
  - Kognitos says its agent reasons about exceptions but does not describe the human review step in detail (KOGNITOS-2026).
  role_evolution: 'Vendor claim: tax teams spend less time on data assembly and more on forecasting, modelling and advisory
    work (KOGNITOS-2026). EY''s authors write that tax departments should shift from assembling information to applying critical judgment and conducting high-quality reviews (BTAX-EYGRIP-2025); PwC Ireland says AI frees professionals for judgement, interpretation and challenging outputs (PWC-IE-2026).'
  evidence_grade: C
  sources:
