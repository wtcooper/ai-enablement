- id: tax-data-technology-03
  title: Agent keeps tax-engine configuration in sync with ERP master-data changes, with review checkpoints for high-impact
    changes
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - software-systems
  - transaction-processing
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: New legal entities, registrations, warehouse locations, products and customer exemptions set up in the ERP must
    also be set up in the tax engine; manual duplicate maintenance causes mismatches and delays tax collection in new locations
    (VERTEX-DATASHEET-2025).
  solution: Vertex Configuration Agent for Microsoft Dynamics 365 monitors master-data changes (business events) in Dynamics
    365 Finance and Supply Chain and triggers matching configuration updates in the Vertex O Series tax engine; it generates
    notices for each change and uses alerts and review checkpoints for high-impact changes. Vertex says it was built with
    Azure AI Foundry, Copilot Studio, MCP servers and various LLMs (VERTEX-CONFIGAGENT-2025; VERTEX-DATASHEET-2025). Avalara
    describes a browser agent that guides users through ERP configurations (AVALARA-AGENTIC-2025).
  outcomes:
  - lever: speed
    description: none published (the data sheet lists faster onboarding and reduced manual synchronisation as benefits, without
      figures)
    figure: null
    measures: null
    source_ref: VERTEX-DATASHEET-2025
  prerequisites:
  - Microsoft Dynamics 365 Finance and Supply Chain and the Vertex O Series tax engine (VERTEX-DATASHEET-2025).
  - 'Clean master data for the five covered areas: legal entities, registrations, warehouse locations, products and customer
    exemptions (VERTEX-DATASHEET-2025).'
  risks_and_guardrails:
  - Human-in-the-loop alerts and review checkpoints validate high-impact changes before they take effect in the tax engine
    (VERTEX-DATASHEET-2025).
  - The data sheet lists a traceable log of tax-impacting changes for audit readiness (VERTEX-DATASHEET-2025).
  - No named customer or figures in either vendor document (VERTEX-CONFIGAGENT-2025).
  human_checkpoints:
  - The tax team validates high-impact configuration changes before they reach the engine (VERTEX-DATASHEET-2025).
  role_evolution: Not stated in the sources; the vendor frames it as reduced manual oversight of configuration (VERTEX-DATASHEET-2025).
  evidence_grade: C
  sources:
  - ref: VERTEX-CONFIGAGENT-2025
    title: Vertex Configuration Agent for Microsoft Dynamics 365 Now Available in the Microsoft Marketplace
    publisher: Vertex Inc.
    type: vendor
    url: https://www.vertexinc.com/sites/default/files/2025-11/press-release-vertex-configuration-agent-for-microsoft-dynamics-365.pdf
    date: '2025-11-18'
    access: full
    locator: Paragraphs 1-2 (availability on 2025-11-18 and function)
  - ref: VERTEX-DATASHEET-2025
    title: Vertex Configuration Agent for Microsoft Dynamics 365 (data sheet)
    publisher: Vertex Inc.
    type: vendor
    url: https://www.vertexinc.com/sites/default/files/2025-11/202511-data-sheet-ai-agent-microsoft-d365.pdf
    date: 2025-11
    access: full
    locator: '''Real-Time Sync'', key features list, ''Human-in-the-Loop to Ensure Governance'''
  - ref: AVALARA-AGENTIC-2025
    title: Avalara Extends AI Leadership with Avi Everywhere, MCP Servers, and Global Compliance Innovations
    publisher: Avalara (PR Newswire)
    type: vendor
    url: https://tools.prnewswire.com/en-us/live/20813/release/20251006EN90727
    date: '2025-10-06'
    access: full
    locator: Section 'Avi Everywhere', browser extension bullet
  last_reviewed: '2026-10-17'
  notes: 'From practice-07. The engine is an indirect-tax determination engine, so the engine itself belongs to indirect-tax;
    this entry records the ERP-to-engine data flow. Related: validation and repair of master data at the point of entry, tax-indirect-tax-12.'
- id: tax-data-technology-04
  title: Tax data requirements and tax-engine integration built into an ERP migration from the start
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - software-systems
  - data-reporting
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Tax determination is often overlooked until late in an ERP project, which leads to delays and manual workarounds;
    one roundtable participant described managing tax across 40 separate billing systems, each with its own logic and exemption
    rules (TR-SAP-2025). Vertex's white paper says leaving tax out of early scoping creates urgent work after go-live, and
    that a shortage of tax staff can mean no tax manager is on the project team (VERTEX-S4-2026).
  solution: Put a tax expert on the migration team, clean the data before it moves, and integrate the tax engine natively
    with standard data flows and APIs so that real-time reporting and e-invoicing needs are met (VERTEX-S4-2026; TR-SAP-2025).
    At Vertex Exchange Europe 2026, Siemens Energy and Daimler Truck AG described implementing the Vertex tax engine in SAP;
    the recap says success depended on preparation, data quality, internal alignment and change management (INNOVATETAX-VXE-2026).
    Roundtable participants said they used AI for contract review, anomaly detection and dashboard generation, and warned
    that AI success depends on clean, structured data and strong governance (TR-SAP-2025).
  outcomes:
  - lever: risk
    description: 'Context for the problem, not a result: organisations that have completed the SAP S/4HANA migration'
    figure: less than 8%
    measures: Organisations that have completed the SAP S/4HANA migration (DMA-SAP-Vertex online survey as cited in the Vertex
      white paper; sample not stated)
    provenance: vendor-published
    source_ref: VERTEX-S4-2026
  prerequisites:
  - Tax representation in project scoping (VERTEX-S4-2026).
  - Data cleansing, including a look at custom code in the old ERP (VERTEX-S4-2026).
  - Named data ownership and consistent naming conventions between tax, finance and IT (TR-SAP-2025).
  risks_and_guardrails:
  - A 'lift and shift' gives short shrift to data quality and devalues the investment (VERTEX-S4-2026).
  - Sources are tax-engine vendors or their partners, and each has a product to sell (VERTEX-S4-2026; TR-SAP-2025).
  human_checkpoints:
  - A tax expert, internal or external, sits on the project team (VERTEX-S4-2026).
  role_evolution: Tax staff take part in ERP implementations and set data requirements for new business lines before launch
    (TR-GOVERNANCE-2026). The Vertex Exchange recap says the event's message was that the future tax team is hybrid, comfortable with ERP landscapes, data,
    automation and AI (INNOVATETAX-VXE-2026).
  evidence_grade: B
  sources:
  - ref: INNOVATETAX-VXE-2026
    title: What we learned from Vertex Exchange Europe 2026
    publisher: Innovate Tax (conference recap)
    type: conference
    url: https://innovatetax.com/blog/what-we-learned-from-vertex-exchange-europe-2026/
    date: '2026-05-06'
    access: full
    locator: Section 'Customer stories brought the challenges to life'
  - ref: VERTEX-S4-2026
    title: New Perspectives on SAP S/4HANA Migration (white paper with DMA)
    publisher: Vertex
    type: vendor
    url: https://www.vertexinc.com/sites/default/files/2026-03/202603-white-paper-new-perspectives-on-sap-s-4hana-migration-dma.pdf
    date: 2026-03
    access: full
    locator: pp. 2-4 (date from file path and PDF metadata)
  - ref: TR-SAP-2025
    title: How leaders automate tax compliance in SAP S/4HANA
    publisher: Thomson Reuters Tax & Accounting
    type: vendor
