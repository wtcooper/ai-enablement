- id: tax-data-technology-20
  title: Tax-owned AI and automation inventory, policy and accountability mapped into the enterprise control framework
  archetype: tax
  module: data-technology
  function: risk-compliance-legal
  work_types:
  - review-assurance
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: piloting
  problem: When TEI seminar attendees were asked whether the tax function owns AI implementation at their company, two hands
    went up out of more than 50 (TEI-TAXTECH-2026). In a Thomson Reuters 2025 report, as relayed by its tax blog, 17% of corporate
    tax departments had specific AI and data policies, 21% covered generative AI under general technology policies and 45%
    had no relevant policy (TR-TENSIONS-2025).
  solution: 'Tax keeps a live inventory of its AI and automation use cases with owners and escalation paths, a written policy,
    and control mapping to the enterprise framework. COSO''s February 2026 guidance on generative AI maps risks to the five
    components and 17 principles of its Internal Control-Integrated Framework and sets a six-step roadmap: govern, inventory,
    assess, design, implement, monitor (DART-COSO-2026). It sorts use cases into eight capability types, including ingestion,
    transformation, posting, orchestration and monitoring (JOFA-COSO-2026). TEI scheduled a session on ''AI Governance, Deployment
    and Current Regulation'' in November 2025 (TEI-TECHTAX-2025).'
  outcomes:
  - lever: risk
    description: 'Baseline, not an outcome of the use case: corporate tax departments with no relevant AI policy'
    figure: 45%
    measures: Corporate tax departments with no relevant policy for generative AI, in the Thomson Reuters 2025 Generative
      AI in Professional Services Report as relayed by its tax blog; sample not stated
    provenance: vendor-published
    source_ref: TR-TENSIONS-2025
  - lever: risk
    description: 'Baseline, not an outcome of the use case: TEI attendees saying tax owns AI implementation'
    figure: 2 of more than 50
    measures: Hands raised when attendees at the 2026 TEI Tax Technology Seminar were asked whether the tax function owns
      AI implementation at their company; informal poll
    provenance: self-reported
    source_ref: TEI-TAXTECH-2026
  prerequisites:
  - Management mandate and governance roles; COSO's roadmap starts with 'govern' (DART-COSO-2026).
  - Coordination with IT and data-protection owners, since IT approvals and data protection were the top hurdles in KPMG Germany's
    quick survey (KPMG-DE-2026).
  risks_and_guardrails:
  - COSO's guidance addresses rapid change, limited explainability and uncontrolled adoption, and stresses ongoing inventories,
    ownership and escalation paths (DART-COSO-2026).
  - 'By analogy only: GAO found the IRS''s own AI use-case inventory incomplete and over 25% of use cases did not say how
    they would benefit the agency (GAO-2026).'
  human_checkpoints:
  - Named ownership and escalation paths for each inventoried use case (DART-COSO-2026).
  role_evolution: Not described for tax specifically; COSO's roadmap is written for management, internal audit, IT risk, legal,
    the board and external auditors (DART-COSO-2026).
  evidence_grade: C
  sources:
