# Use cases: tax / data-technology (in-house tax operations and data architecture). Last reviewed 2026-10-17.
# Synthesised from the wave 2 landscape and the practice, discourse and governance deep dives.
- id: tax-data-technology-01
  title: Tax-owned data layer that pulls ERP, ledger and other data into one reconciled, documented source for tax work and
    AI
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - data-reporting
  - software-systems
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: Tax teams sit downstream of finance systems and often receive data that is aggregated, reclassified or stripped
    of detail (TR-GOVERNANCE-2026). EY's survey of 1,600 CFOs and senior finance and tax leaders reports 51% of tax and finance
    functions in the early stages of data management maturity (EY-TFO-2025); a Bloomberg Tax write-up of the same survey says
    80% see insufficient AI-ready data as a significant barrier and 91% say their data sits in too many silos (BTAX-EYTFO-2026).
    US recordkeeping rules require retained machine-sensible records to reconcile to the books and the return, with the data
    flow, internal controls and field definitions documented (IRS-REVPROC-9825).
  solution: The tax function owns or co-owns a central store of tax-relevant data fed from several ERP and financial systems,
    with data models, ingestion pipelines, documented lineage and reconciliations to the ledger and the return, so analytics,
    automation and AI tools read from one source. Snowflake's tax analytics posting describes building a unified data and
    knowledge layer as the single source of truth for tax (SNOWFLAKE-JOB-2026). Fortive and Apple advertise roles to architect
    or oversee the same thing; Fortive names Power Platform and Alteryx, Apple names pipelines, models and governance standards
    (FORTIVE-JOB-2026; APPLE-JOB-2026). OpenAI's 2025 posting lists SQL-based data pipelines and metadata repositories (OPENAI-TAXDATAJOB-2025).
    The Bloomberg Tax write-up of the EY survey says best-in-class organisations centralise data on platforms such as Databricks and Snowflake, and that these organisations are in the minority (BTAX-EYTFO-2026). Deloitte Tax and Databricks announced an expanded alliance on 2025-10-08 to build
    a 'unified tax data architecture' (DELOITTE-DATABRICKS-2025).
  outcomes:
  - lever: quality
    description: none published for any named team
    figure: null
    measures: null
    source_ref: SNOWFLAKE-JOB-2026
  - lever: quality
    description: 'Baseline, not an outcome of the use case: tax and finance functions early in data management maturity'
    figure: 51%
    measures: Tax and finance functions 'still in the early stages of data management maturity', among 1,600 CFOs and senior
      finance and tax leaders in 30 jurisdictions
    provenance: vendor-published
    source_ref: EY-TFO-2025
  prerequisites:
  - Tax is included in finance transformation and ERP upgrade decisions (KPMG-SNOWFLAKE-2023).
  - A named owner for data models, versioning and a verified-query or reconciliation library (SNOWFLAKE-JOB-2026).
  - Tax requirements captured at the source system, with direct feeds in place of manual extracts (TR-GOVERNANCE-2026).
  - Documentation of the processes that create, modify and maintain the records, including data flow, internal controls and
    charts of accounts (IRS-REVPROC-9825).
  risks_and_guardrails:
  - Fortive's posting requires solutions to be SOX-compliant and auditable; Apple's requires compliance with internal controls
    and data security policies, and documentation (FORTIVE-JOB-2026; APPLE-JOB-2026).
  - Retained records must reconcile to the books and return by account, carry transaction-level detail and be available to
    the IRS in a form that can be processed (IRS-REVPROC-9825).
  - Fewer than half of 170 surveyed tax leaders got a budget increase, so the build competes for scarce funding (TR-CORPTECH-2026).
  - The Bloomberg Tax write-up says 45% cite the lack of a sustainable data, AI and technology strategy as their top barrier
    (EY's own release says 44% name the inability to execute on a sustainable plan for data, AI and tech) (BTAX-EYTFO-2026; EY-TFO-2025).
  human_checkpoints:
  - Tax staff review reconciliations and the results of automated filing and reporting cycles (SNOWFLAKE-JOB-2026).
  - IT and tax agree ERP changes, upgrades and configurations (APPLE-JOB-2026).
  - Tax leadership signs off data requirements for new business lines before launch, and data quality is reviewed before filing
    deadlines (TR-GOVERNANCE-2026).
  role_evolution: Tax roles in these postings combine tax knowledge with data modelling, SQL or Python and ERP knowledge;
    the Snowflake posting asks the candidate to act as the translation layer between what models can do and what the tax function
    needs (SNOWFLAKE-JOB-2026). EY reports 73% of respondents prioritising the hiring of data scientists and tax technology
    experts (EY-TFO-2025). PwC Ireland expects roles such as 'tax data lead' to emerge (PWC-IE-2026).
  evidence_grade: B
  sources:
