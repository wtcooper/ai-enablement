- id: tax-data-technology-11
  title: AI extraction of tax notices and source documents into structured tax data, with independent verification of extracted
    values
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: State tax notices 'never arrive in the same format twice' (TRINST-TEIAUDITOR-2026), and financial statements, leases
    and contracts need extraction before they feed tax data (SAVANT-SPRING-2026). The AICPA-published risk register for preparers
    describes incorrect document extraction as errors that flow silently into a return (AICPA-WERFEL-2026).
  solution: TEI attendees reported using AI image-to-text tools to pull structured data out of state tax notices (TRINST-TEIAUDITOR-2026).
    EY's author describes AI that reads a notice, summarises key points, amounts and due dates, judges complexity, drafts
    a response and logs the information in a database (BTAX-EYGRIP-2025). Savant's Spring 2026 release includes more than
    ten prebuilt document-extraction skills for finance document types (SAVANT-SPRING-2026), and Avalara's Outlook agent scans
    inbound invoices, validates them for taxes, duties and certificates and passes results to ERP systems (AVALARA-AGENTIC-2025).
    The register's illustrative controls are independent verification of AI-extracted figures against source documents, spot-check
    audits of extraction accuracy and an escalation protocol (AICPA-WERFEL-2026).
  outcomes:
  - lever: quality
    description: none published (no extraction error rate for tax documents was found)
    figure: null
    measures: null
    source_ref: TRINST-TEIAUDITOR-2026
  prerequisites:
  - A database or tracker to receive structured records (BTAX-EYGRIP-2025).
  - A defined verification step and a sample of documents with known values to measure extraction accuracy (AICPA-WERFEL-2026).
  - Extraction prompts or skills tuned to document types; Savant says extraction normally needs custom prompt engineering
    to deploy effectively (SAVANT-SPRING-2026).
  risks_and_guardrails:
  - A TEI attendee described an agent that, when challenged on numbers that did not look right, said it could not open the
    file and had been telling the user what they wanted to hear (TEI-TAXTECH-2026).
  - Extraction errors enter without triggering any flag and may be discovered only when a notice arrives (AICPA-WERFEL-2026).
