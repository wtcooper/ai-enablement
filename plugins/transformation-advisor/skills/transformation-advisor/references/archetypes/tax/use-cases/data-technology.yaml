  maturity: in-production
  problem: Tax analysts and directors work in spreadsheets and filings, and refreshing dashboards or spreadsheets by hand
    takes time that could go to analysis and exception handling (SNOWFLAKE-JOB-2026).
  solution: Snowflake's tax analytics team says it replaced traditional BI workflows with AI agents that encode repeatable
    tax processes, semantic models (a business-language map of the data) that let analysts query complex data in plain English,
    Streamlit apps for real-time insight, and workflow automations. The posting names Snowflake's CoCo coding assistant and
    SnowWork as the build environment and asks for verified-query coverage and accuracy iteration based on evaluation metrics
    (SNOWFLAKE-JOB-2026).
  outcomes:
  - lever: speed
    description: none published
    figure: null
    measures: null
    source_ref: SNOWFLAKE-JOB-2026
  prerequisites:
