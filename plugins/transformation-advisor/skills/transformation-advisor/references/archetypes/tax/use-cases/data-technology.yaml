- id: tax-data-technology-08
  title: 'Tax automations run as controlled assets: version control, sign-off before production, evidence logs, run history
    and drift monitoring'
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - software-systems
  - review-assurance
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: Under SOX and internal-control frameworks, finance and tax teams must document what an automated process ran, when
    it changed and who approved it; Savant says most workflow tools do not keep native run history or version records (SAVANT-SPRING-2026).
    TEI attendees described Alteryx workflows nobody could explain after the builder left (TEI-TAXTECH-2026). A 2019 Pegasystems
    survey of more than 500 RPA and desktop-automation decision makers (not tax-specific) found 87% experienced some level
    of bot failures (PEGA-RPA-2019).
  solution: 'Savant''s Spring 2026 release added version control with timestamped snapshots, a sign-off step between development
    and production that enforces segregation of duties, and evidence logs with SOX and ICFR report templates that can be exported
    to GRC tools; Oxford Industries'' senior director of tax and accounting is quoted as saying Savant provided the governance
    controls and audit documentation to meet that standard (SAVANT-SPRING-2026). TEI''s November 2025 series listed a session
    titled ''Automation Sustainment: Ensuring Deployed Automation Continues to Deliver'' (TEI-TECHTAX-2025). Deloitte''s commentary
    on COSO''s guidance says ''set-and-forget'' does not work for generative AI in financial reporting and suggests monitoring
    transaction volume, transaction size and override percentages to detect drift (DART-COSO-2026).'
  outcomes:
  - lever: risk
    description: none published
    figure: null
    measures: null
    source_ref: SAVANT-SPRING-2026
  - lever: quality
    description: 'Baseline, not an outcome of the use case: bot failures in a cross-industry vendor survey'
    figure: 87%
    measures: Respondents among more than 500 decision makers using RPA or robotic desktop automation who experience some
      level of bot failures; vendor-sponsored, 2019
    provenance: vendor-published
    source_ref: PEGA-RPA-2019
  - lever: capacity
    description: 'Baseline, not an outcome of the use case: maintenance load of automations'
    figure: 41%
    measures: Respondents in the same survey saying ongoing bot management is taking more time and resources than expected
    provenance: vendor-published
    source_ref: PEGA-RPA-2019
  prerequisites:
  - Separate development and production environments and named control owners (SAVANT-SPRING-2026).
  - A named owner and documented logic for every automation (TEI-TAXTECH-2026).
  - KPIs for monitoring and an evaluation of accuracy and root causes such as prompt design, retrieval issues and vendor changes
    (DART-COSO-2026).
  risks_and_guardrails:
  - The control claims are a vendor's and have not been tested by an auditor in any source found (SAVANT-SPRING-2026).
  - Pegasystems found that on average only 39% of bots are deployed on schedule; the survey is from 2019, vendor-sponsored
    and cross-industry, so it only indicates direction for tax (PEGA-RPA-2019).
  - Savant's TEI session with Oxford Industries was billed as showing how Oxford's tax team deploys AI safely and at scale;
    no recap of the session was found (SAVANT-2026).
  human_checkpoints:
  - A designated manager or control owner approves before a workflow goes live (SAVANT-SPRING-2026).
  - Exceptions are routed for human review before results move downstream (SAVANT-CLAUDE-2026).
  - Accuracy and reliability evaluations and root-cause assessment after a drift signal (DART-COSO-2026).
  role_evolution: Analysts build and modify workflows in development; managers or control owners approve promotion to production,
    which makes tax automation owners part of the internal control environment (SAVANT-SPRING-2026).
  evidence_grade: B
