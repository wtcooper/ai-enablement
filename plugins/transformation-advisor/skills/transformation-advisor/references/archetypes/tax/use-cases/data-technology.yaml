- id: tax-data-technology-12
  title: Transaction-level real-time reporting to tax authorities replaces periodic return data, and tax data architecture
    is built around it
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  pattern: bulk-transformation
  ladder: automate
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: 'Periodic returns give authorities data weeks after the transaction. According to the Thomson Reuters Institute
    account of the 2026 TEI seminar, more than 60 jurisdictions have moved or are moving to continuous transaction controls
    (CTCs: the authority receives or clears invoice data as it is created), and in those regimes authorities see, validate
    and pre-fill from structured data as it happens (TRINST-TEIAUDITOR-2026). The EU adopted the ViDA package on 2025-03-11
    and will roll it out progressively until January 2035 (EC-VIDA-2026).'
  solution: Companies send invoice and transaction data to the authority as it is created and build their tax data architecture
    around that interface. ViDA digital reporting requirements for cross-border B2B transactions take effect from 2030-07-01,
    and by 2035-01-01 Member States with domestic real-time transaction reporting must align with the EU model (EC-VIDA-2026).
    The UK will introduce mandatory e-invoicing for all VAT invoices from 2029 (UK-EINV-2025); a trade-press report says the
    23 June 2026 UK announcement chose Peppol and initially has no e-reporting to HMRC (FISCAL-UK-2026). At their November 2025 plenary, heads of 49 tax administrations in the OECD Forum on Tax Administration agreed to deepen co-operation on real-time information sharing and backed the development of pilot projects (OECD-FTA-STATEMENT-2025).
  outcomes:
  - lever: quality
    description: 'Independent study of Peru''s staggered mandate: e-invoicing raised reported figures in the first year after
      adoption'
    figure: over 5%
    measures: Increase in reported firm sales, purchases and VAT liabilities in the first year after adopting e-invoicing,
      from quasi-experimental variation in the roll-out among about 53,000 firms; intent-to-treat increases of 7.4% in taxable
      sales and 5.5% in taxable purchases
    provenance: independent
    source_ref: BELLON-PERU-2022
  - lever: cost
    description: European Commission projection for ViDA digital reporting, not a measured outcome
    figure: up to EUR 11 billion a year less VAT fraud; over EUR 4.1 billion a year lower compliance costs
    measures: Commission statement that the move to e-invoicing will reduce VAT fraud by up to EUR 11 billion a year and bring
      down administrative and compliance costs for EU traders by over EUR 4.1 billion a year over the next ten years
    provenance: independent
    source_ref: EC-VIDA-2026
  prerequisites:
  - Master data, system integration and ownership across tax, IT and finance (TR-VIDA-2026).
  - Knowledge of each regime's timetable and scope; UK scope and phasing are expected in a roadmap at Budget 2026 (UK-EINV-2025).
  risks_and_guardrails:
  - In clearance regimes an invoice has no legal force until the authority returns its identifier (TRINST-TEIAUDITOR-2026).
  - The Commission reports a 2023 EU VAT compliance gap of 9.5% of the VAT total tax liability, 1.6 percentage points lower
    than in 2019; the page does not attribute the change to e-invoicing (EC-VATGAP-2025).
  - An IMF paper finds firm digitalisation associated with higher tax paid, strongest among high-risk taxpayers; it studies
    firms generally, not tax departments (IMF-WP-2025-089).
  human_checkpoints:
  - Not described in the sources for in-house teams; the TEI recap describes staff answering notices on data already shared
    with the authority (TRINST-TEIAUDITOR-2026).
  role_evolution: Tax teams move from preparing periodic returns to managing data pipelines and answering notices on shared
    data; one panelist called it 'a shift from us preparing returns to us answering notices' (TRINST-TEIAUDITOR-2026).
  evidence_grade: C
  sources:
  - ref: BELLON-PERU-2022
    title: 'Digitalization to improve tax compliance: Evidence from VAT e-invoicing in Peru'
    publisher: Journal of Public Economics (Bellon, Dabla-Norris, Khalid, Lima; PubMed Central copy)
    type: academic
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9168443/
