  - A verified query library and evaluation metrics for SQL generation accuracy, iterated with tax analyst feedback (SNOWFLAKE-JOB-2026).
  risks_and_guardrails:
  - The posting makes the owner responsible for the contract between the model and its consumers across each tax cycle, including
    versioning (SNOWFLAKE-JOB-2026).
