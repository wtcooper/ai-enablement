- id: tax-data-technology-13
  title: Invoice and master data validated before submission, with preventive controls built into the processes that create
    the data
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  - review-assurance
  pattern: full-population-testing
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: In clearance regimes an invoice has no legal force until the tax authority returns its identifier, so a wrong VAT
    ID, malformed schema or mismatched master data gets the invoice rejected; the recap adds that Italy charges 70% of the
    disputed VAT (TRINST-TEIAUDITOR-2026). A Thomson Reuters ViDA readiness survey found 86% of respondents familiar with
    ViDA but only 22% with a formal transition programme (TR-VIDA-2026). Deloitte says that when authorities expect upstream
    data quality, reliance on detective controls and reactive issue management becomes unsustainable (DELOITTE-TTT-2026).
  solution: 'Tax, finance and IT run an owned validation layer over ERP invoice data, checking identifiers, schema and master
    data before submission, with an exception queue for rejected or at-risk invoices. TEI attendees described deploying validation
    agents to critique their own outputs; the recap names no company and does not say those agents target outbound invoices
    (TRINST-TEIAUDITOR-2026). Deloitte''s third scenario describes ''proactive, AI-driven preventive controls'' upstream in
    business processes (DELOITTE-TTT-2026). Thomson Reuters makes the non-AI version of the point: influence how data is captured
    at source, build direct feeds, set reconciliation checkpoints and keep lineage so any figure can be traced (TR-GOVERNANCE-2026).'
  outcomes:
  - lever: risk
    description: 'Baseline, not an outcome of the use case: organisations with a formal ViDA transition programme'
    figure: 22%
    measures: Respondents to the Thomson Reuters Institute 2026 ViDA Readiness Survey whose organisations have a formal transition
      programme; 86% said they are familiar with ViDA; sample size not stated
    provenance: vendor-published
    source_ref: TR-VIDA-2026
  - lever: risk
    description: 'Outcome of pre-submission validation: none published'
    figure: null
    measures: null
    source_ref: TRINST-TEIAUDITOR-2026
  prerequisites:
  - Accurate master data, KYC processes and system integration; the survey blog says most finance, IT and operations respondents
    report low preparedness in these areas (TR-VIDA-2026).
  - A single accountable owner across tax, IT and finance; the blog describes a 'bystander effect' in which each function
    assumes another is leading (TR-VIDA-2026).
  - 'Regime timetable known: ViDA cross-border digital reporting from 2030-07-01 and domestic alignment by 2035-01-01 (EC-VIDA-2026);
    UK mandatory e-invoicing from 2029 (UK-EINV-2025).'
  - Tax part of ERP and new-business-line design (TR-GOVERNANCE-2026).
  risks_and_guardrails:
  - The respondents' top fear in the ViDA survey was rejected and unpaid invoices, ahead of fines (TR-VIDA-2026).
  - AI coding tools let an analyst deploy an integration pipeline nobody else has reviewed, documented or knows how to maintain
    (TRINST-TEIAUDITOR-2026).
  - In Deloitte's scenario, funding is linked to compliance and business continuity (DELOITTE-TTT-2026).
  human_checkpoints:
  - The sources do not describe a human checkpoint for invoice validation; they say accountability for ViDA is unclear in
    large organisations (TR-VIDA-2026).
  role_evolution: The TEI recap says the job at the high end has become as much a data science problem as an accounting one
    (TRINST-TEIAUDITOR-2026). Deloitte says the talent model in its third scenario would shift toward data analytics, technology
    integration and project management skills (DELOITTE-TTT-2026).
  evidence_grade: C
  sources:
