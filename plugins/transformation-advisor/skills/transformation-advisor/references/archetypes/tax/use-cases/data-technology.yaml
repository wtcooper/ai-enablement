- id: tax-data-technology-05
  title: Low-code data preparation and consolidation for tax (the pre-generative-AI baseline that AI-built pipelines replace)
  archetype: tax
  module: data-technology
  function: finance-accounting
  work_types:
  - data-reporting
  - transaction-processing
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: Large tax departments gather data from scattered sources by hand before provision and return work can begin. At one telecom and media client, over 200 tax managers filing over 260,000 returns a year worked above capacity, and documentation and tribal knowledge sat with individuals (CONCENTRIX-2020).
  solution: Not generative AI. Tools such as Alteryx and Microsoft Power Query consolidate and reconcile data, document themselves
    visually and feed tax engines. DuPont's global tax accounting manager described combining Alteryx with ONESOURCE to get
    one source of information during a stalled ERP upgrade and heavy M&A (DUPONT-TR-2021). At an automotive client RGP identified over 100 process streams for automation and designed Alteryx flows (BEAT, state NOL reporting, apportionment) with built-in controls (RGP-2024); Concentrix trained over 100 staff at a telecom and media client and consulted on more than 80 workstreams (CONCENTRIX-2020).
  outcomes:
  - lever: capacity
    description: Man-hours removed by automating routine tax processes at an automotive client
    figure: 1,100+ hours
    measures: Reduction in man-hours from automating tax processes, per RGP; client unnamed; period and baseline not stated
    provenance: vendor-published
    source_ref: RGP-2024
  - lever: capacity
    description: Hours a year saved at a telecom and media client
    figure: 500+ hours per year
    measures: Annual time savings from automating manual tax processes, per Concentrix; client unnamed; measurement method
      not stated
    provenance: vendor-published
    source_ref: CONCENTRIX-2020
  prerequisites:
  - Training for tax staff and ongoing support when source data changes (RGP-2024).
  - A planned path when tax engines or ERPs are upgraded; RGP's client plans to migrate the flows for planned Vertex and ONESOURCE
    upgrades (RGP-2024).
  risks_and_guardrails:
  - RGP designed controls inside the Alteryx processes to protect data integrity (RGP-2024).
  - Concentrix says visual workflows self-document, but TEI attendees in 2026 still described unexplained workflows left by
    departed builders (CONCENTRIX-2020; TEI-TAXTECH-2026).
  human_checkpoints:
  - Concentrix says the visual workflows can be verified by any reviewer; no review step is described (CONCENTRIX-2020).
  role_evolution: Concentrix says it trained business users and teams to build on the new capability themselves (CONCENTRIX-2020).
  evidence_grade: B
