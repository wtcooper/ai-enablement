  problem: OpenAI's postings describe moving recurring income tax work off spreadsheet preparation and spreadsheet trackers, and making handoffs and documentation easier to review and scale (OPENAI-USTAXOPSJOB-2026; OPENAI-DIRECTTAXJOB-2026).
  solution: OpenAI's tax team postings describe a move from a traditional compliance and provision function to a data-driven,
    AI-first model in which preparation is increasingly automated in database-driven workflows; staff focus on review, validation
    and improvement of tax outputs, build data models and light automation, and use AI tools for analysis and documentation (OPENAI-USTAXOPSJOB-2026); the direct tax posting adds reconciliations, mappings and exception handling (OPENAI-DIRECTTAXJOB-2026). The team also wants a leader who defines when AI can safely speed up work and when
    human review or extra controls are needed (OPENAI-DIRECTTAXJOB-2026). The TEI recap says OpenAI sent four members of its
    tax department to demonstrate live automation pipelines (TEI-TAXTECH-2026).
  outcomes:
  - lever: capacity
    description: none published
    figure: null
    measures: null
    source_ref: OPENAI-USTAXOPSJOB-2026
  prerequisites:
  - Tax, finance, data and technical teams partner on data quality and system integration (OPENAI-USTAXOPSJOB-2026).
  - Staff comfortable with SQL or databases and with working outside Excel-heavy workflows (OPENAI-USTAXOPSJOB-2026).
  - Experience operating a corporate income tax compliance or provision engine such as Corptax or OneSource Income Tax, as
    asked for in the 2025 posting (OPENAI-TAXDATAJOB-2025).
  risks_and_guardrails:
  - The March 2026 posting asks for familiarity with process design, controls and audit-sensitive environments (OPENAI-DIRECTTAXJOB-2026).
