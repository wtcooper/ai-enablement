  last_reviewed: "2026-10-17"
  notes: >-
    Pattern is other: a consent and disclosure control, not an AI task. The engagement-letter and consent design is an
    idea. No firm has published its AI consent wording; treat the legal interpretation as unresolved and take advice.
    The CNBC article (4 Aug 2026) was not opened, so no AICPA position is stated as fact. WCG requests a section 7216
    consent before the engagement letter for its offshore team (WCG-7216-2026), a practical consent-first model that
    concerns offshore staffing, not AI.

- id: tax-compliance-individual-business-22
  title: Reprice return work from hours to value or bundled fees as AI shortens preparation (idea)
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [client-interaction, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Hours-times-rate billing shrinks when AI cuts preparation time, and OPR has said that billing for manual time not
    spent, or double billing AI-assisted tasks, may violate the Circular 230 bar on unconscionable fees (section
    10.27(a)) depending on the facts.
  solution: >-
    Idea (under dispute). Price by value, bundle return preparation with advisory services, and disclose and credit AI
    efficiencies as OPR describes. The AICPA says the OPR language does not appear to allow a value-pricing model and
    overlooks software, implementation, governance and training costs; its chief executive said many CPAs have moved
    to value pricing, some bundle return preparation with advisory work at no extra charge, and the OPR language is not
    authoritative. The AICPA is working with the IRS on clarifying language and FAQs.
  outcomes:
    - lever: growth
      description: "none published. Context: Thomson Reuters Institute reports that about one-third of tax and audit professionals say their firms have yet to adapt commercial models, and nearly half feel pressure to generate financial gains from AI."
      figure: "none published"
      measures: "no fee, margin or realisation figure for AI-assisted return preparation was found"
      provenance: vendor-published
      source_ref: TR-FOP-2026
  prerequisites:
    - "Time and cost tracking that shows what AI saved and what it cost (AICPA-FEES-2026)"
    - "A pricing policy documented before AI savings accrue, and engagement letters stating the fee basis"
  risks_and_guardrails:
    - "OPR: where AI cuts research and drafting time, billing manual labour or time not spent, or double billing, may violate section 10.27 depending on facts such as a pattern across clients or the size of billing differences; practitioners should disclose AI activities as needed and fairly credit cost reductions (IRS-OPR-2026, item 2)."
    - "The AICPA's chief executive said the OPR language is not authoritative and could be 'overstepping a little bit' (AICPA-FEES-2026). As of 2026-09-08 no IRS clarification had been issued, and none was found since."
  human_checkpoints:
    - "Partner approves the fee basis; the client agrees it in the engagement letter"
  role_evolution: >-
    Fee conversations move from time spent to outcome. The AICPA encourages members toward advisory services and
    bundling (AICPA-FEES-2026); a vendor founder predicts a move from billable hours to outcome-based pricing
    (CPAPA-TAXGPT-2026).
  evidence_grade: D
  sources:
    - { ref: AICPA-FEES-2026, title: "AICPA seeks IRS clarity on AI guidelines, CPA fees", publisher: "The Tax Adviser (AICPA)", type: press, url: "https://www.thetaxadviser.com/news/2026/sep/aicpa-seeks-irs-clarity-on-ai-guidelines-cpa-fees/", date: "2026-09-08", access: full, locator: "paragraphs 1-4 and 8-9; paragraphs quoting Simpson, Lauridsen, Lewis and Koziel" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 2 (section 10.27(a))" }
    - { ref: TR-FOP-2026, title: "What the 2026 Future of Professionals Report says tax & audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "introductory paragraphs" }
    - { ref: CPAPA-TAXGPT-2026, title: "Why General AI is Not Suitable for Tax Research - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/why-general-ai-is-not-suitable-for-tax-research-accounting-technology-lab-podcast-june-2026/", date: "2026-06", access: full, locator: "episode description" }
    - { ref: JOFA-OPR-2026, title: "IRS outlines AI risks, Circular 230 duties for tax practitioners", publisher: "Journal of Accountancy", type: press, url: "https://www.journalofaccountancy.com/news/2026/jun/irs-outlines-ai-risks-circular-230-duties-for-tax-practitioners/", date: "2026-06-26", access: full, locator: "'Billing, written advice, and firm procedures'" }
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. The dispute between OPR and the AICPA is documented, but no firm has published how it prices AI-assisted
    preparation. Pattern is other: the change is commercial. Vendors' own pricing models differ (per page or per
    return for Black Ore, per WCG; engagement-fee tiers for Accrual), see tax-compliance-individual-business-05.
    Overlaps: tax-compliance-corporate-16, tax-research-advisory-25 and tax-controversy-10 (pricing).

- id: tax-compliance-individual-business-23
  title: Replace offshore or contract data entry and first-pass preparation with AI-prepared returns
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing]
  pattern: bulk-transformation
  ladder: automate
  change_scope: model
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Busy-season volume is met with outsourced staff, contractors and offshore preparers, with onboarding, quality and
    disclosure concerns. A trade-press article reports growing reliance on offshore staff as part of the current
    labour shortage.
  solution: >-
    Firms bring first-pass preparation onshore through AI products instead of staffing it offshore or with
    contractors. A vendor founder says users of his agent talk about bringing work back onshore, and a consultant says
    AI affects outsourcing more than onshore staff, because staff can contact clients directly.
  outcomes:
    - lever: cost
      description: "none published"
      figure: "none published"
      measures: "no source reports the share of preparation moved from outsourced staff to AI or the cost per return before and after"
      provenance: vendor-published
      source_ref: BLACKORE-2026
  prerequisites:
    - "Confidence in AI output at a level that allows removing the human data-entry layer; none of the sources sets that threshold"
  risks_and_guardrails:
    - "The firm's security and consent position still applies to AI vendors, as it did to offshore staff; offshore subprocessor access is among the questions OPR left open (IRS-OPR-2026, BARMORE-OPR-2026)."
  human_checkpoints:
    - "Partner review of the AI-prepared return (CPAPA-BLACKORE-2024)"
  role_evolution: >-
    A vendor founder predicts firms will reduce reliance on outsourcing and shift toward advisory work
    (CPAPA-TAXGPT-2026); a host of the 2024 podcast, Brian Tankersley, expects AI to affect outsourcing services more
    than onshore staff (CPAPA-BLACKORE-2024).
  evidence_grade: C
  sources:
    - { ref: CPAPA-TAXGPT-2026, title: "Why General AI is Not Suitable for Tax Research - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/why-general-ai-is-not-suitable-for-tax-research-accounting-technology-lab-podcast-june-2026/", date: "2026-06", access: full, locator: "episode description; transcript, founder's remarks on onshoring" }
    - { ref: CPAPA-BLACKORE-2024, title: "Review of Black Ore Tax Autopilot - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/review-of-black-ore-tax-autopilot-the-accounting-technology-lab-podcast-june-2024/", date: "2024-06", access: full, locator: "transcript, discussion of outsourcing and disclosures" }
    - { ref: BLACKORE-2026, title: "AI Tax Startup Black Ore Opens Platform to CPA Firms", publisher: "Sovereign Magazine", type: press, url: "https://www.sovereignmagazine.com/article/ai-tax-startup-black-ore-opens-platform-to-cpa-firms", date: "2026-04-29", access: full, locator: "section 'Black Ore and the Accountant Shortage'" }
    - { ref: BARMORE-OPR-2026, title: "The IRS Just Weighed In on AI", publisher: "AI Lab for Accountants (Charlie Barmore, CPA)", type: community, url: "https://ai-lab-for-accountants.beehiiv.com/p/the-irs-just-weighed-in-on-ai", date: "2026-06-24", access: full, locator: "section 'What OPR did NOT resolve' (offshore subprocessor point)" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 4 and 6" }
  last_reviewed: "2026-10-17"
  notes: >-
    No measured outsourcing displacement was found; the claim rests on commentators and a vendor founder.
    Bulk-transformation is the closest pattern for moving first-pass preparation volume from people to a model. Change
    scope is model because the change is who does the work (sourcing).

- id: tax-compliance-individual-business-24
  title: AI-native roll-ups acquire small tax practices and run them on in-house AI
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, expert-judgment]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Small tax practices carry high manual workloads and thin margins and find it hard to adopt new processes, while
    buyers look for recurring-revenue service businesses.
  solution: >-
    Multiplier (founded 2022) acquired Citrine International Tax, a 12-person boutique providing cross-border tax
    accounting, and applied AI tools it built in-house; it aims to buy high-recurring-revenue service firms and expand
    beyond personal tax compliance to compete with the Big Four. Its investor says small firms are more open to
    changing processes than a firm with 200 accountants.
  outcomes:
    - lever: cost
      description: "TechCrunch reports that Multiplier's AI tools helped Citrine more than double its profit margins."
      figure: "profit margins more than doubled"
      measures: "profit margins of one acquired 12-person tax accounting boutique; period, baseline and method not given"
      provenance: self-reported
      source_ref: MULTIPLIER-2025
  prerequisites:
    - "Capital to acquire practices and AI tools built in-house"
    - "A small, change-ready firm with high recurring revenue and leaders willing to integrate and customise AI"
  risks_and_guardrails:
    - "One acquired boutique is the only data point, and the figure is a margin claim by the buyer reported by the press, with no independent verification (MULTIPLIER-2025)."
  human_checkpoints:
    - "Not described in the source"
  role_evolution: >-
    TechCrunch says Multiplier's tools eliminated manual work at Citrine (MULTIPLIER-2025); roles in acquired firms
    are not described.
  evidence_grade: B
  sources:
    - { ref: MULTIPLIER-2025, title: "Multiplier, founded by ex-Stripe exec, nabs $27.5M to fuel AI-powered accounting roll-ups", publisher: "TechCrunch", type: press, url: "https://techcrunch.com/2025/06/18/multiplier-founded-by-ex-stripe-exec-nabs-27-5m-to-fuel-ai-powered-accounting-roll-up", date: "2025-06-18", access: full, locator: "paragraphs 3-4 and 6; Lightspeed partner quotes" }
  last_reviewed: "2026-10-17"
  notes: >-
    A summit podcast is not used as a source because its description does not mention AI-native firms or private
    equity. Capped at B: Citrine is a cross-border tax accounting boutique, adjacent to 1040 and small-business
    compliance, and the margin claim is unaudited. Other AI-native firms named in secondary coverage (Accrual, Gelt,
    Skalar, Limetax) were not verified as practice acquirers.

- id: tax-compliance-individual-business-25
  title: Taxpayer-side general-purpose agents draft or check returns, bypassing or second-guessing the preparer
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, client-interaction]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Self-filers face cost, time, forms and jargon, and some now ask general-purpose AI for help before, or instead of,
    hiring a preparer. The same capability could compete with low-end preparers.
  solution: >-
    Perplexity announced Computer for Taxes on 2 Apr 2026: it reviews uploaded documents, asks follow-up questions,
    maps inputs to IRS forms and drafts a federal return, with tax knowledge packaged as loadable modules updated
    independently of the model; it says it can also review a professionally prepared return and help filers form
    questions for their provider. Access requires a $17 per month Pro subscription. Individual taxpayers in forum
    threads describe using Claude, Gemini or ChatGPT to prepare or check their own returns, including a CPA's work.
  outcomes:
    - lever: experience
      description: "PYMNTS reports that about a quarter of US workers plan to use AI to help file taxes this year, more than double the 11 percent who said so last year."
      figure: "about 25 percent, up from 11 percent"
      measures: "share of US workers who said they plan to use AI to help file taxes, per PYMNTS's own survey; sample not given"
      provenance: vendor-published
      source_ref: PERPLEXITY-2026
    - lever: quality
      description: "A TaxSlayer test of four chatbots, reported by the New York Times and relayed by PYMNTS, found the tools miscalculated the refund or amount owed by an average of more than $2,000 across eight fictional scenarios."
      figure: "average error more than $2,000"
      measures: "average miscalculation across eight fictional scenarios and four chatbots, from a competitor tax-software vendor's test, relayed secondhand; chatbots, not this product"
      provenance: vendor-published
      source_ref: PERPLEXITY-2026
    - lever: experience
      description: "Taxfix reports that 59 percent of UK self assessment filers it surveyed plan to use AI tools to complete their returns, and 81 percent still want access to a qualified professional."
      figure: "59 percent plan to use AI; 81 percent want access to a professional"
      measures: "Taxfix survey of UK self assessment filers; sample size not stated"
      provenance: vendor-published
      source_ref: TECHRADAR-TAXFIX-2025
  prerequisites:
    - "A Pro subscription and uploaded personal documents (PERPLEXITY-2026)"
  risks_and_guardrails:
    - "NAEA tells taxpayers not to upload W-2s, Social Security numbers or other personal data into unsecured or unverified AI systems and says AI quite often gives faulty tax advice (NAEA-AI-2026)."
    - "TaxCalcBench found frontier models computed fewer than a third of simplified federal returns correctly without a tax engine (COLUMN-TAXCALCBENCH-2025)."
    - "In a UK example from Taxfix, a client wrongly applied the 1,000-pound trading allowance and a person caught it (TECHRADAR-TAXFIX-2025)."
    - "Forum commenters raise liability: a CPA can be sued for negligence while an LLM cannot (HN-ASK-2026)."
    - "In an experiment with a representative sample of US self-preparers, those shown aggressive AI advice reported more aggressively than those given none, though they relied less on AI than on CPA advice (SWIDER-2025)."
  human_checkpoints:
    - "None by design for self-filers; the filer reviews and files"
    - "Practitioners are asked to validate client-brought AI conclusions (TECHRADAR-TAXFIX-2025)"
  role_evolution: >-
    Taxfix says accountants will increasingly work with AI-informed clients and will need to validate, explain and
    possibly correct what they bring (TECHRADAR-TAXFIX-2025). A Drake Software tax analyst says tools that help people
    find answers quickly could reduce demand for simpler tax preparation over time (TAXADVISER-CLIENTS-2026).
  evidence_grade: C
  sources:
    - { ref: PERPLEXITY-2026, title: "Perplexity Launches AI Agent That Drafts Tax Returns", publisher: "PYMNTS", type: press, url: "https://www.pymnts.com/taxes/2026/perplexity-launches-ai-agent-that-drafts-tax-returns/", date: "2026-04-06", access: full, locator: "sections 'Chat to Execution' and 'Consumers Are Already at the Door'; paragraph on the TaxSlayer test" }
    - { ref: TECHRADAR-TAXFIX-2025, title: "The rise of the AI accountant: Cheaper. Faster. Riskier?", publisher: "TechRadar (written by Taxfix)", type: press, url: "https://www.techradar.com/pro/the-rise-of-the-ai-accountant-cheaper-faster-riskier", date: "2025-10-29", access: full, locator: "paragraphs 2-5, 'The impacts on accountants'" }
    - { ref: NAEA-AI-2026, title: "NAEA Highlights Find a Tax Expert Directory as Taxpayers Navigate AI-Driven Filing Season", publisher: "National Association of Enrolled Agents", type: professional-body, url: "https://lite.aol.com/tech/story/0022/20260326/9679339.htm", date: "2026-03-26", access: full, locator: "quotes from NAEA president; data-protection paragraph" }
    - { ref: HN-ASK-2026, title: "Ask HN: Why hasn't AI replaced Tax filing software", publisher: "Hacker News", type: community, url: "https://news.ycombinator.com/item?id=50004396", date: "2026-10-08", access: full, locator: "comments by arbol, gayaviswan, JohnFen, jfrbfbreudh" }
    - { ref: TAXADVISER-CLIENTS-2026, title: "What today's clients expect from their CPA and how firms are responding", publisher: "The Tax Adviser (interview with Bob Nolan, Drake Software)", type: press, url: "https://www.thetaxadviser.com/issues/2026/aug/what-todays-clients-expect-from-their-cpa-and-how-firms-are-responding/", date: "2026-08-31", access: full, locator: "last question and answer" }
    - { ref: COLUMN-TAXCALCBENCH-2025, title: "TaxCalcBench: Evaluating Frontier Models on the Tax Calculation Task (arXiv 2507.16126)", publisher: "Column Tax authors (Bock, Molisee, Ozer, Shah), arXiv preprint", type: academic, url: "https://arxiv.org/abs/2507.16126", date: "2025-07-22", access: full, locator: "abstract" }
    - { ref: SWIDER-2025, title: "CPAs vs. AI Tax Advisors: Evaluating Reliance Across Advisory Contexts", publisher: "Lucas A. Swider, University of Oklahoma; AAA Tax Section meeting paper", type: academic, url: "https://aaahq.org/portals/0/documents/meetings/2025/ATA/Papers/3.02_Swider.pdf", date: "2025", access: full, locator: "abstract; introduction" }
  last_reviewed: "2026-10-17"
  notes: >-
    Included because it affects the low-end preparer market this module serves. Perplexity's accuracy claims come from
    its own announcement, and no customer outcome was found. Forum comments are anonymous and anecdotal (one commenter
    says an LLM prepared a return more accurately than their accountant without saying how that was measured).
    Overlaps: tax-research-advisory-18 (triage of AI answers that clients bring).
