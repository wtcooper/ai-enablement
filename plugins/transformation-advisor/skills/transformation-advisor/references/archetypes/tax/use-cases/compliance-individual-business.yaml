- id: tax-compliance-individual-business-19
  title: Firm AI policy, approved-tool list under the written information security plan, and vendor due diligence (Circular 230 section 10.36)
  archetype: tax
  module: compliance-individual-business
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Staff use AI tools whether or not the firm has sanctioned them, nobody owns AI, and firms cannot show how outputs
    were verified. Return information is among the most sensitive data a firm holds, and the IRS and FTC already
    require a written security programme that covers service providers. Firms asked to buy agentic preparers have few
    independent figures to rely on.
  solution: >-
    OPR says firms should deploy AI policies covering staff training, secure data handling and AI accuracy
    monitoring, documented to show adherence to section 10.36, and its best practices add vetting third parties' AI
    offerings when or before purchasing. A Journal of Accountancy
    article recommends permitted and prohibited uses, an approved-tool list and request process, an AI lead or
    committee, human verification of all cited authorities, facts and calculations, and documentation in the client
    file of prompts, verification and reviewer. Client data is restricted to enterprise-approved AI under the firm's
    written information security plan (WISP); IRS Publication 5708 lists the FTC Safeguards Rule elements that apply to
    preparers. Werfel's case study adds vendor questions (documented error rates on the firm's return complexity,
    citation for every suggestion, notice before model updates) and illustrative contract terms: an accuracy SLA with
    a remedy, 60 days' notice of material model change, 24-hour incident notice and a right to commission independent
    accuracy testing.
  outcomes:
    - lever: risk
      description: "Thomson Reuters reports that more than one-third of tax and audit professionals use AI tools their firm has not sanctioned."
      figure: "more than one-third (34% in a Thomson Reuters blog)"
      measures: "share of respondents to the 2026 Future of Professionals survey of tax and audit professionals who use unauthorised AI tools; sample not stated on the page read"
      provenance: vendor-published
      source_ref: TR-FOP-2026
    - lever: risk
      description: "Wolters Kluwer's January 2025 survey found only a quarter of firms had AI policies, and firms with policies viewed AI more positively than those without."
      figure: "25% with policies; 84% vs 44% positive"
      measures: "share of surveyed firms with established AI policies, and share viewing AI positively with and without policies (over 2,300 global participants; a correlation, not a measured effect)"
      provenance: vendor-published
      source_ref: WK-FRA-2025
    - lever: risk
      description: "At the 2026 TEI Tax Technology Seminar, two hands of more than 50 went up when attendees were asked whether tax owns AI implementation."
      figure: "2 of more than 50"
      measures: "show-of-hands poll of corporate tax attendees, as reported in a Thomson Reuters Institute recap"
      provenance: vendor-published
      source_ref: TEI-TAXTECH-2026
  prerequisites:
    - "An AI lead or committee to review use cases, approve tools, monitor use and handle incidents (JOFA-AIPOLICY-2026)"
    - "An approved-tools list, a vendor review checklist (security, confidentiality, data-use terms) and a current WISP with a named qualified individual (IRS-PUB5708-2024)"
    - "Enterprise or business-tier tools with defined data terms; OPR names 'secure, enterprise-approved AI' without defining it (BARMORE-OPR-2026)"
    - "A firm test set of anonymised return types to run before purchase, counsel for contract terms and an exit plan (AICPA-WERFEL-2026)"
  risks_and_guardrails:
    - "Section 10.36 discipline requires willfulness, recklessness or gross incompetence plus a pattern or practice of non-compliance; it does not make every AI error a principal's violation (IRS-OPR-2026, item 4)."
    - "Competence under section 10.35 includes understanding how AI systems work, their limits and risks (IRS-OPR-2026, item 3)."
    - "For AICPA members, SSTS section 1.4 (Reliance on Tools) says tools may be reasonably relied on but do not remove responsibility (as summarised in TAXCT-CLINCO-2026)."
    - "OPR warns that uploading client data to unsecured or public AI systems risks unauthorised disclosure under sections 6713 and 7216 and says to use only secure, enterprise-approved AI (IRS-OPR-2026, item 6)."
    - "A vendor contract reduces exposure but does not change who is responsible for positions filed (AICPA-WERFEL-2026); a CPA-technology podcast says vendor indemnification from major AI providers generally does not remove confidentiality, professional-liability and accuracy exposures (CPAPA-AILIAB-2026, show notes only)."
    - "None of the IRS operational publications read (Publications 1345, 4557 and 5708, Form 8867 instructions) mention AI (IRS-PUB4557-2024, IRS-PUB5708-2024)."
  human_checkpoints:
    - "Principal or AI committee approves tools and use cases before use on client work"
    - "Managing partner and counsel sign off vendor contracts; periodic review of AI practices against evolving guidance"
  role_evolution: >-
    Partners and principals take on an explicit AI oversight duty under section 10.36 (IRS-OPR-2026); a new AI lead
    role appears (JOFA-AIPOLICY-2026). Practice administrators or IT leads take on AI vendor oversight alongside data
    security. Werfel names vendor dependence, where a vendor discontinues a product and the firm has no manual
    workflow, as a risk (AICPA-WERFEL-2026, Appendix C, risk 14).
  evidence_grade: C
  sources:
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 3, 4 and 6; best-practices recap (vetting third parties)" }
    - { ref: JOFA-AIPOLICY-2026, title: "Drafting an AI policy that actually works (Professional Liability Spotlight, Nicole L. Graham, Aon)", publisher: "Journal of Accountancy (Nicole L. Graham, Esq.)", type: press, url: "https://www.journalofaccountancy.com/issues/2026/jul/drafting-an-ai-policy-that-actually-works/", date: "2026-07-01", access: full, locator: "sections 'Governance', 'Documentation and Supervision'" }
    - { ref: IRS-PUB5708-2024, title: "Publication 5708: Creating a Written Information Security Plan for your Tax and Accounting Practice (Rev. 8-2024)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/p5708.pdf", date: "2024-08", access: full, locator: "'Requirements' (page 2): FTC Safeguards Rule elements" }
    - { ref: IRS-PUB4557-2024, title: "Publication 4557: Safeguarding Taxpayer Data (Rev. 5-2024; footer reads 6-2024)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/p4557.pdf", date: "2024-06", access: full, locator: "Safeguards program section: select service providers" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix D, Step 6 (questions and contract terms); Appendix C risks 7, 8 and 14" }
    - { ref: TR-FOP-2026, title: "What the 2026 Future of Professionals Report says tax & audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "'Universal priorities for firm leaders': govern the tools" }
    - { ref: TR-CHEAP-2026, title: "Why cheap AI for tax work costs more than you think", publisher: "Thomson Reuters Tax and Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/why-cheap-ai-for-tax-work-costs-more-than-you-think/", date: "2026-10-07", access: full, locator: "34 percent unauthorised-tool figure" }
    - { ref: WK-FRA-2025, title: "Wolters Kluwer releases inaugural report, the Future Ready Accountant", publisher: "Wolters Kluwer", type: survey, url: "https://www.wolterskluwer.com/en/news/wolters-kluwer-releases-inaugural-report-the-future-ready-accountant", date: "2025-01-14", access: full, locator: "'Barriers to Adoption' bullet (wolterskluwer.com blocks automated fetch; the same Business Wire release was read at dutchnews.nl/businesswire on 2026-10-17)" }
    - { ref: TEI-TAXTECH-2026, title: "2026 TEI Tax Technology Seminar: All eyes on the Man Behind the Curtain (recap of the 27-29 Apr 2026 seminar)", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/2026-tei-tax-tech-man-behind-the-curtain", date: "2026-05-04", access: full, locator: "paragraph on the poll of more than 50 attendees" }
    - { ref: BARMORE-OPR-2026, title: "The IRS Just Weighed In on AI", publisher: "AI Lab for Accountants (Charlie Barmore, CPA)", type: community, url: "https://ai-lab-for-accountants.beehiiv.com/p/the-irs-just-weighed-in-on-ai", date: "2026-06-24", access: full, locator: "'What to do Monday morning'; 'What OPR did NOT resolve'" }
    - { ref: TAXCT-CLINCO-2026, title: "A recipe for sanctions: AI-hallucinated citations in tax (analysis of Clinco v. Commissioner, T.C. Memo. 2026-16)", publisher: "Journal of Accountancy (AICPA)", type: press, url: "https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/", date: "2026-09-01", access: full, locator: "sections on Circular 230 and SSTS; sidebar on firm policies" }
    - { ref: CPAPA-AILIAB-2026, title: "AI Liability for Accounting Firms: Are You Covered? - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/ai-liability-for-accounting-firms-are-you-covered-microsoft-google-openai-anthropic-accounting-technology-lab-podcast-oct-2026/", date: "2026-10", access: full, locator: "episode description" }
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern is other: an enabling control, not an AI task. Combines policy and verification logs, a firm governance
    programme, approved tools under the WISP (written information security plan) and vendor diligence and contract
    terms (an idea). Prevalence figures come from vendor-run surveys with different samples; the TEI poll is from
    corporate tax departments, not small firms. The AICPA small-firm AI policy template (April 2026) was not opened.
    Publication 5708 text is from the August 2024 edition; check FTC rule detail before use. Overlaps:
    tax-compliance-corporate-20 and tax-research-advisory-07 (approved tools and governance).

- id: tax-compliance-individual-business-20
  title: Dedicated AI pod, champion network and competence training that protects the junior pipeline
  archetype: tax
  module: compliance-individual-business
  function: people-hr
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Tools are changing faster than firm processes; someone must test vendors, document practice and train staff.
    Regulators make competence personal: OPR reads section 10.35 to require understanding how AI works and its limits,
    and the UK PCRT guidance asks that staff be trained for any AI tool. Meanwhile AI automates entry-level tasks.
  solution: >-
    PwC reports a governance committee over how it builds and uses AI in tax, an Agent OS to manage which tools agents
    use, more than 3,200 AI champions across the firm (many in tax) and a My AI training programme. WCG says its AI Tax
    Prep Pod launches in November 2026 to design the workflow, test tools, document best practices and shape how
    AI-assisted preparation is used across the firm. Vendors hire accountants into product roles: Basis lists a
    "Member of Accounting Staff" role (4-10 years in audit and tax at a top firm) that shapes agent behaviour with
    engineers. Werfel's framework adds training on each tool's failure modes, tool-independent tax-law training and
    annual checks that staff can handle complex matters without the tool.
  outcomes:
    - lever: capacity
      description: "PwC reports more than 3,200 AI champions, more than 350,000 training hours in the US firm and about 80% of its people having taken some AI training. These are enablement measures, not tax work outcomes."
      figure: ">3,200 AI champions; >350,000 training hours; about 80% trained"
      measures: "firm-wide counts reported in an interview; the denominator for 80% is not stated beyond 'our people'"
      provenance: self-reported
      source_ref: PWC-MEGNA-2025
  prerequisites:
    - "Executive sponsorship, protected training time and a vendor-testing process"
    - "A training owner and escalation rules for novel positions regardless of AI confidence (AICPA-WERFEL-2026)"
    - "Governance principles of explainability, traceability and auditability (PwC's responsible AI toolkit)"
  risks_and_guardrails:
    - "OPR ties section 10.36 to firm procedures for AI: staff training, secure data handling and AI accuracy monitoring, all documented; vetting third parties' AI offerings appears in its best-practices recap (IRS-OPR-2026, item 4)."
    - "Werfel's register describes skill erosion (juniors who cannot analyse a novel partnership allocation without the tool) and institutional knowledge loss when senior preparers leave early; both are illustrative scenarios (AICPA-WERFEL-2026, Appendix C, risks 13 and 15)."
    - "Only 41.2% of AICPA survey respondents received any training in using their tax software, which is software training, not AI training (AICPA-TAXSW-2026)."
  human_checkpoints:
    - "Governance committee oversight; approved outputs are locked and changes controlled (PwC)"
    - "Annual capability assessment independent of AI tools (Werfel's proposal)"
  role_evolution: >-
    New roles appear: AI champions, agent managers, accounting-trained product and deployment staff (PWC-MEGNA-2025,
    BASIS-CAREERS-2026). Thomson Reuters Institute tells firms to ensure junior staff still build professional judgment
    and to keep supervision in place as tasks automate; it also reports that more than a quarter of professionals would
    not accept a job at a firm without professional-grade AI (TR-FOP-2026). CPA Trendlines (gated teaser) reports
    public accounting firms adding 3,930 accountant and auditor positions since 2021 against 12,250 sales
    representatives, 11,140 financial managers and 8,130 computer and information systems managers (CPATL-WORKFORCE-2026).
  evidence_grade: B
  sources:
    - { ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "answers on governance, 'AI champions' and 'My AI' training" }
    - { ref: WCG-PLAYBOOK-2026, title: "AI Tax Preparation and Automation: What It Means for You", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-preparation-and-automation-what-it-means-for-you/", date: "2026-07-05", access: full, locator: "Key Takeaways: AI Tax Prep Pod" }
    - { ref: BASIS-CAREERS-2026, title: "Careers at Basis: Member of Accounting Staff; Deployed Intelligence Strategist", publisher: "Basis", type: job-posting, url: "https://www.getbasis.ai/careers/member-of-accounting-staff-bf7e34d6", date: "2026-10-17", access: full, locator: "'About the Team', 'What you'll bring' (postings undated; retrieval date)" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 3 and 4" }
    - { ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW Insights (news item on the seven-body PCRT guidance)", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01-19", access: full, locator: "Fundamental principles: professional competence and due care" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C risks 13 and 15; Appendix D Step 7" }
    - { ref: AICPA-TAXSW-2026, title: "2026 tax software survey (1,808 AICPA members; AI adoption questions)", publisher: "The Tax Adviser and Journal of Accountancy (AICPA)", type: survey, url: "https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/", date: "2026-08-31", access: full, locator: "'Technical support and training'" }
    - { ref: TR-FOP-2026, title: "What the 2026 Future of Professionals Report says tax & audit firm leaders should be prioritizing now", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "introduction; 'Universal priorities for firm leaders'" }
    - { ref: CPATL-WORKFORCE-2026, title: "CPAs Not Wanted: Firms Build a New Workforce - without Accountants", publisher: "CPA Trendlines", type: press, url: "https://cpatrendlines.com/2026/05/29/cpas-not-wanted-firms-build-a-new-workforce-without-accountants", date: "2026-05-29", access: full, locator: "opening paragraphs (rest behind a membership wall)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern is other: organisational enablement, not a work pattern. Combines a dedicated AI team (named) with
    competence training (an idea). The PwC counts are firm-wide, not tax-specific, and come from a June 2025
    interview; the WCG pod is a plan. Graded B on the PwC interview. Overlaps: tax-research-advisory-08 (research
    training for junior staff).

- id: tax-compliance-individual-business-21
  title: Client disclosure, engagement-letter wording and section 7216 consent before AI touches return information
  archetype: tax
  module: compliance-individual-business
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Section 7216 requires written consent before preparers use or disclose return information for purposes outside
    the listed exceptions, and the exceptions have generally covered tax software. Whether an AI tool counts as
    software or as a third party is unsettled. Clients who learn after an error that AI drafted a position may dispute
    the fee or leave. No rule requiring disclosure of AI use was found.
  solution: >-
    Practitioners and the AICPA advise a signed, stand-alone AI disclosure or consent, an inventory of AI tools that
    touch client data, and AI governance folded into the WISP; other guidance suggests engagement-letter language on AI
    use as voluntary transparency. Under the regulations consent must be knowing and voluntary, signed and dated,
    identify the purpose and recipient, and cannot be retroactive; for Form 1040 filers Rev. Proc. 2013-14 sets
    mandatory wording and format, and one document cannot authorise both uses and disclosures. Australia's TPB says
    permission to put client information into AI tools may be given in a signed engagement letter. Werfel recommends
    engagement-letter language on AI use and responsibility allocation and a client disclosure policy.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "no source reports how many firms use AI-specific consent or what clients do with it"
      provenance: self-reported
      source_ref: BARMORE-OPR-2026
  prerequisites:
    - "An inventory of which AI tools staff use on client data, with their retention and training terms (VERITO-DISCL-2026)"
    - "A decision, with counsel, on which uses fall under a regulatory exception and which need consent"
  risks_and_guardrails:
    - "OPR cites sections 6713 and 7216(a) and Circular 230 section 10.51(a)(15) and tells practitioners to use only secure, enterprise-approved AI; it does not say whether AI use requires consent (IRS-OPR-2026)."
    - "Left unresolved by OPR, per a practitioner newsletter: whether a self-hosted model is a disclosure, whether cloud AI needs consent, what 'enterprise-approved' means, how Rev. Proc. 2013-14 forms apply, and offshore subprocessor access (BARMORE-OPR-2026)."
    - "Rev. Proc. 2013-14 states the penalties: section 7216 is a misdemeanor (up to one year, a $1,000 fine, or both) and section 6713 a civil penalty of $250 per disclosure, capped at $10,000 a year; amounts were not checked for later change (IRS-RP201314-2013)."
    - "Consent to disclose to a preparer outside the United States is required, and disclosing a Form 1040 filer's SSN abroad is restricted (TREAS-7216-2008, 301.7216-3(b)(4))."
    - "Guidance conflicts on form: a vendor blog says the AICPA told CNBC the consent must be a separate document for individual returns (not confirmed against CNBC), while a Journal of Accountancy article suggests disclosure language in all engagement letters (VERITO-DISCL-2026, JOFA-AIPOLICY-2026). CNBC reported the IRS guidance does not say whether preparers must tell clients (LDS-CNBC-2026, secondary summary)."
    - "UK PCRT guidance says entering client data into a publicly available AI model without consent is likely to breach confidentiality and suggests anonymised data (ICAEW-PCRT-2026)."
  human_checkpoints:
    - "Client signs and dates the consent before any disclosure or use"
    - "Counsel reviews the language before the tool is used on any client matter (AICPA-WERFEL-2026, Appendix D, Step 6)"
  role_evolution: >-
    Client onboarding gains a technology-disclosure conversation, and preparers and firm leaders take on an AI-tool
    inventory and consent-management task. The Journal of Accountancy notes practitioners are beginning to weigh when
    to disclose AI use (TAXCT-CLINCO-2026).
  evidence_grade: C
  sources:
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 6; footnote 1" }
    - { ref: BARMORE-OPR-2026, title: "The IRS Just Weighed In on AI", publisher: "AI Lab for Accountants (Charlie Barmore, CPA)", type: community, url: "https://ai-lab-for-accountants.beehiiv.com/p/the-irs-just-weighed-in-on-ai", date: "2026-06-24", access: full, locator: "section 'What OPR did NOT resolve'" }
