- id: tax-compliance-individual-business-06
  title: Agent prepares partnership, S corporation and trust returns (1065, 1120-S, 1041) through to K-1s for review
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Partnership and trust returns need trial-balance import, partner capital and allocations, depreciation, section
    199A and 163(j) calculations, basis tracking and K-1 tie-out, much of it built in spreadsheets. Entity returns are
    more varied than 1040s, and allocations, K-1s and state filings multiply the review burden.
  solution: >-
    Accrual describes preparing 1041 work from the governing instrument through to each beneficiary's K-1, and
    partnership returns from trial balance import to partner K-1s, computing depreciation, section 199A, section
    163(j), allocations and capital accounts deterministically and syncing workpapers to the firm's tax engine;
    Armanino is its named customer. Basis demonstrated an agent that autonomously completed a 1065, and The
    Accounting Podcast devoted an episode to it. A June 2026 summit recap says hosts discussed industry predictions
    that fully autonomous individual preparation may arrive by 2027, with autonomous entity preparation following
    shortly after.
  outcomes:
    - lever: speed
      description: "Quotes from named Armanino staff on Accrual's partnership page (Talita Rouvier; Enyioma Onuoha) say a workpaper that takes about three hours could potentially be set up in 10 or 15 minutes, and that an average preparer and reviewer could save four or five hours."
      figure: "about 3 hours to a potential 10-15 minutes for workpaper setup; potential 4-5 hours saved"
      measures: "estimated preparation time for a partnership workpaper, in customer quotes using 'could potentially' and 'could see'; estimates, not measurements"
      provenance: vendor-published
      source_ref: ACCRUAL-PARTNER-2026
    - lever: quality
      description: "The same page shows Armanino statistics: 100% of source values extracted without error, 86.5% of draft values matching the final return, 100% of drafted entries balancing and tying, and an estimated 50% reduction in federal preparation and review effort."
      figure: "86.5% of draft values matched the final return; estimated 50% less federal prep and review effort"
      measures: "vendor-page statistics about a named customer; sample, period and method not stated; the effort figure is labelled an estimate"
      provenance: vendor-published
      source_ref: ACCRUAL-PARTNER-2026
    - lever: capacity
      description: "Basis says only that it recently demonstrated an agent that autonomously completed a 1065; no accuracy, time or review data is given."
      figure: "none published"
      measures: "none published"
      provenance: vendor-published
      source_ref: BASIS-2026
  prerequisites:
    - "Prior-year data, trial balance, fixed-asset records and partnership agreement in the engagement"
    - "An existing tax engine that stays authoritative (Accrual syncs approved work to it)"
    - "Structured client data and K-1 inputs"
  risks_and_guardrails:
    - "WCG says business-entity returns involve book-to-tax adjustments, allocations and depreciation decisions that still belong in experienced human hands, and it begins AI preparation with individual 1040s (WCG-PLAYBOOK-2026)."
    - "Accrual's CEO said the product does not automate 100% of the work (ACCRUAL-LAUNCH-2026)."
    - "OPR expects the signing practitioner to verify facts, citations and calculations that AI produces (IRS-OPR-2026)."
    - "Control dilution and incorrect document extraction apply as for 1040 agents (AICPA-WERFEL-2026, Appendix C)."
  human_checkpoints:
    - "Review of the draft with open items and treatment decisions surfaced before anything commits"
    - "Approval of agent changes (Accrual shows proposed changes and asks for approval before applying them)"
    - "Practitioner review and signature"
  role_evolution: >-
    Accrual describes the shift as "from building workpapers to reviewing them"; Armanino's Jamie Dabu says that for a
    simple return the preparer's role would largely be dropping the information into Accrual, and Patrick Richardson
    says he is reviewing a workbook rather than building one (ACCRUAL-PARTNER-2026).
  evidence_grade: B
  sources:
    - { ref: ACCRUAL-PARTNER-2026, title: "Accrual: partnership returns", publisher: "Accrual", type: vendor, url: "https://www.accrual.com/tax/partnerships", date: "2026-10-17", access: full, locator: "sections 'From trial balance to partner K-1s' and 'From building workpapers to reviewing them' (Armanino statistics and named quotes; page undated)" }
    - { ref: ACCRUAL-INDIV-2026, title: "Accrual: individual (1040, 1041) tax preparation", publisher: "Accrual", type: vendor, url: "https://www.accrual.com/tax/individuals", date: "2026-10-17", access: full, locator: "section 'From governing instrument to beneficiary K-1'; 'From pilot to production in months' (Armanino)" }
    - { ref: BASIS-2026, title: "Basis Raises $100M to Deploy Automated Accounting Agents", publisher: "Built In NYC", type: press, url: "https://www.builtinnyc.com/articles/basis-raises-100m-series-b-20260226", date: "2026-02-26", access: full, locator: "paragraphs 1-2 (agent that autonomously completed a 1065)" }
    - { ref: ACCTPOD-477-2026, title: "The AI Agent That Can Do A Partnership Tax Return (episode 477, show notes)", publisher: "The Accounting Podcast (via CastFox)", type: podcast, url: "https://www.castfox.net/podcast/the-accounting-podcast-930492/episode/the-ai-agent-that-can-do-a-partnership-tax-return-140333", date: "2026-03-03", access: full, locator: "show notes only" }
    - { ref: BLACKORE-SUMMIT-2026, title: "2026 Black Ore AI Tax Summit - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/2026-black-ore-ai-tax-summit-accounting-technology-lab-podcast-june-2026/", date: "2026-06-17", access: full, locator: "episode description only (transcript needs sign-in)" }
    - { ref: WCG-PLAYBOOK-2026, title: "AI Tax Preparation and Automation: What It Means for You", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-preparation-and-automation-what-it-means-for-you/", date: "2026-07-05", access: full, locator: "Key Takeaways: 'Business entity returns still require human judgment'" }
    - { ref: ACCRUAL-LAUNCH-2026, title: "Tax platform Accrual launches with AI automation support for all forms", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/tax-platform-accrual-launches-with-ai-automation-support-for-all-forms", date: "2026-02-05", access: full, locator: "paragraphs on K-1 focus, 'not 100%' automation and plans beyond individual returns" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework, item 1" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risks 3 and 6" }
  last_reviewed: "2026-10-17"
  notes: >-
    Verification (2026-10-17): the partnership page now names the Armanino staff quoted and shows Armanino statistics;
    grade kept at B because the statistics are vendor-page figures without method. Armanino's role is shown on
    Accrual's own pages; its partnership release (2026-02-18) returned 403 and was not read. The Basis 1065 item is a
    demonstration, not a customer deployment. Accrual's CEO told Accounting Today its AI is 100% accurate (his claim),
    which sits against WCG's view that no vendor is yet end to end. The 2027 prediction is the podcast hosts' summary
    of industry predictions; the episode description does not name 1120-S returns or list other summit themes. No
    source describes 1120-S preparation in use, and trust (1041) evidence is limited to Accrual's pages. Overlaps:
    tax-compliance-corporate-06 (roll-forward agents for 1120, 1120-S and 1065 business returns).

- id: tax-compliance-individual-business-07
  title: Trial balance to tax workpapers for pass-through returns (account mapping, book-to-tax adjustments, fixed assets)
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Business returns (1120-S, 1065) start with mapping the client's trial balance to return lines and building
    book-to-tax (M-1) and fixed-asset workpapers by hand.
  solution: >-
    Basis's small-firm page shows agents mapping client accounts to the firm's chart with tax-return line references
    and flagging new or unmapped accounts, then drafting M-1 adjustment, fixed-asset roll-forward and tax trial
    balance workpapers with every figure cited to its source.
  outcomes:
    - lever: speed
      description: "A managing partner at Whitcomb & Sheridan LLP says the tool has probably saved 10 to 20 hours in a week and that a task taking two to three hours takes about 30 minutes. The quote is general and does not name this step."
      figure: "10-20 hours in a week; 2-3 hours down to about 30 minutes"
      measures: "managing partner's estimate of hours saved in one week and for one task, not specific to trial balance mapping"
      provenance: vendor-published
      source_ref: BASIS-SMALL-2026
  prerequisites:
    - "Trial balance and prior-year mapping uploaded; source documents attached"
    - "Firm chart of accounts and workpaper standards"
  risks_and_guardrails:
    - "WCG says business-entity work still needs experienced human judgment (WCG-PLAYBOOK-2026)."
  human_checkpoints:
    - "Staff review mapping exceptions and workpaper drafts"
  role_evolution: >-
    Staff review mapped output instead of building mappings; no firm-reported role changes were found.
  evidence_grade: C
  sources:
    - { ref: BASIS-SMALL-2026, title: "Basis for small firms", publisher: "Basis", type: vendor, url: "https://www.getbasis.ai/solutions/small-firms", date: "2026-10-17", access: full, locator: "example exchanges under 'Tax, client accounting, and everything in between'; Whitcomb & Sheridan quote (page undated)" }
    - { ref: WCG-PLAYBOOK-2026, title: "AI Tax Preparation and Automation: What It Means for You", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-preparation-and-automation-what-it-means-for-you/", date: "2026-07-05", access: full, locator: "Key Takeaways" }
  last_reviewed: "2026-10-17"
  notes: >-
    The workflow is shown as illustrative product examples; no named customer is tied to this step. Kept because it is
    the only entry on the trial-balance step of business returns.

- id: tax-compliance-individual-business-08
  title: Agent signs in to the firm's existing tax software and prepares the return there, documenting each entry
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Pre-preparation tools push data into the tax engine, which then recalculates and runs its own diagnostics, so
    the firm still does the final steps by hand. WCG's stated target is an AI that works inside Lacerte, Axcess or
    UltraTax the way a human preparer does.
  solution: >-
    TaxGPT's product page says its preparation agent works inside the tax software the firm already uses: it pulls
    client documents from the firm's systems, signs in, enters the data, works through diagnostics until the return is
    ready for review and documents every entry back to its source, and the firm's team reviews and signs off. TaxGPT
    launched its Tax Prep Agent on 24 Mar 2026; the launch release says it uses browser automation that works with
    web-based intake, preparation and delivery tools, and hands finished returns to a review agent.
  outcomes:
    - lever: speed
      description: "TaxGPT's product page claims a 50% reduction in first-pass preparation time."
      figure: "50% reduction in first-pass prep time"
      measures: "vendor statement on its product page; baseline, sample and method not stated"
      provenance: vendor-published
      source_ref: TAXGPT-SITE-2026
    - lever: speed
      description: "In the launch release TaxGPT says it sees a 90% reduction in first-pass prep time across the platform, and projects 45 minutes saved per 1040 and a 5x increase in review capacity for a 20-person firm processing 2,000 returns a season."
      figure: "90% reduction in first-pass prep time (platform claim); 45 minutes per 1040 (projection)"
      measures: "vendor claims in the launch release; the 45-minute figure is a projection for an illustrative firm, not a measurement, and it conflicts with the 50% figure on the product page"
      provenance: vendor-published
      source_ref: TAXGPT-2026
  prerequisites:
    - "Credentials and permissions for the agent in the firm's tax software"
    - "Zero data retention or equivalent controls and a vendor security review"
  risks_and_guardrails:
    - "WCG evaluated TaxGPT and called it the least prepared of the five vendors it tested: not ready for production at its scale, it used pixel recognition to navigate a web tool such as ProConnect, tied up the laptop and did not integrate with desktop Outlook. WCG also says UltraTax's integration capabilities make an agent manipulating it like a human unlikely (WCG-NOTREADY-2026)."
    - "The trade-press summary notes the approach raises questions about reliability and the CPA's responsibility (MYCPE-TAXGPT-2026)."
  human_checkpoints:
    - "CPA review and sign-off; the firm's software remains the system of record"
  role_evolution: >-
    The vendor positions the firm's preparers as reviewers of returns the agent has prepared inside the firm's own
    software, with the team making the judgment calls and giving final approval (TAXGPT-SITE-2026).
  evidence_grade: C
  sources:
