# Use cases: tax / compliance-individual-business
# Individual, trust, partnership and small-business return preparation (1040, 1041, 1065, 1120-S; UK self
# assessment) by CPA firms, enrolled agents and retail preparers. Synthesised 2026-10-17 from the wave 2 landscape
# scan and the practice, discourse and governance deep dives, plus items routed here from other tax deep dives.
# Every source was opened by the researcher who cited it (access: full) unless marked otherwise; several were read
# only as gated teasers or show notes, which the locator says. Almost every outcome figure is vendor-published or
# self-reported. No independent error rate, override rate or parallel-run result for AI-prepared returns exists in
# the inputs. Overlaps: research tools belong to the research-advisory module, notice response to controversy,
# corporate and in-house direct-tax compliance to compliance-corporate.

- id: tax-compliance-individual-business-01
  title: AI-prefilled organizers, tailored document requests, missing-information follow-up and automated chasing
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [client-interaction, coordination-scheduling]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Collecting information and documents from clients means repeated emails, missed files and late-arriving
    documents that disrupt preparation. Staff send the organizer, then spend weeks sending reminders by hand, and a
    practitioner article says a single missing brokerage statement can hold up the whole return. For returns
    claiming the earned income credit, child tax credit, American opportunity credit or head of household status,
    the preparer must also interview the client, document the questions and answers at the time and file Form 8867
    (the paid preparer's due-diligence checklist).
  solution: >-
    Canopy's Smart Intake offers AI-prefilled questionnaires and organizers that clients confirm or change, custom
    document request lists, and AI renaming and classification of files. Basis says its agents read the prior-year
    return, organise documents, surface data gaps and contact clients to resolve them. ApariPro (UK) describes
    automated client requests and reminders. A CPA Practice Advisor article recommends a request list built from last
    year's uploads, each new file checked against it, scheduled reminders that name the specific missing document,
    and a stop rule that hands the job to a person with a short summary; a model reads each upload to decide whether
    it is a W-2, a 1099-B or a property tax bill and pulls the payer and tax year. Columbia's TaxBench (in
    development) is built to test whether an agent asks only for the information it needs.
  outcomes:
    - lever: speed
      description: "Canopy says that in tax preparation scenarios firms can save as much as 20 minutes per client."
      figure: "as much as 20 minutes per client"
      measures: "vendor-stated maximum time saved per client in tax preparation scenarios; method not stated"
      provenance: vendor-published
      source_ref: CANOPY-SMARTINTAKE-2025
  prerequisites:
    - "Client data already stored in the practice-management system (Canopy's prefill draws on it)"
    - "A practice-management tool whose API and webhooks let outside systems read and update jobs (CPAPA-POSTEXT-2026)"
    - "Before-change measures, such as median days from organizer sent to documents complete (CPAPA-POSTEXT-2026)"
    - "Firm-defined naming conventions for classification"
  risks_and_guardrails:
    - "Prefilled answers need client confirmation; Canopy's design has the client confirm or change AI suggestions (CANOPY-SMARTINTAKE-2025)."
    - "The model will misread some documents, especially photos of crumpled paper and consolidated brokerage statements; low-confidence results go to a person and nothing extracted flows into a return without a preparer seeing it (CPAPA-POSTEXT-2026)."
    - "Automations only one or two people understand become a dependency (CPAPA-POSTEXT-2026)."
    - "Clients text photos of documents, which is not always secure and leads to follow-up questions (TAXADVISER-CLIENTS-2026)."
    - "The Form 8867 knowledge requirement is personal: the preparer interviews the taxpayer, asks adequate questions and documents them at the time. The instructions do not mention AI, and no source says whether AI-generated questions satisfy the requirement (IRS-I8867-2025)."
  human_checkpoints:
    - "Client confirms or edits prefilled answers"
    - "Staff review request lists, open items and documents that fail the stop rule"
    - "Preparer conducts the due-diligence interview and signs Form 8867"
  role_evolution: >-
    Admin and preparer time on chasing clients and sorting files falls. The CPA Practice Advisor article says that
    once status messages go out automatically, preparers stop being interrupted to read the job board aloud, and that
    some clients still need a call from someone they know (CPAPA-POSTEXT-2026). On Accrual's page an Armanino tax
    manager, Josh Karls, says not having to send 15 emails a week chasing documents made document collection probably
    the biggest win of the season; the page does not say the collection step uses AI (ACCRUAL-INDIV-2026).
  evidence_grade: C
  sources:
    - { ref: CANOPY-SMARTINTAKE-2025, title: "Canopy Unveils Native AI Powered Smart Intake Capability to Eliminate Client Friction", publisher: "Canopy (press release via Silicon UK)", type: vendor, url: "https://www.silicon.co.uk/press-release/canopy-unveils-native-ai-powered-smart-intake-capability-to-eliminate-client-friction", date: "2025-07-22", access: full, locator: "quote from the VP of Product; 'Key capabilities available now' list" }
    - { ref: BASIS-TAX-2026, title: "Basis for tax (solutions page)", publisher: "Basis", type: vendor, url: "https://www.getbasis.ai/solutions/tax", date: "2026-10-17", access: full, locator: "feature list: agents read prior-year return, surface data gaps, reach out to clients (page undated; retrieval date)" }
    - { ref: APARIPRO-2026, title: "ApariPro: AI powered tax preparation for accountancy firms", publisher: "ApariPro", type: vendor, url: "https://www.aparipro.com/", date: "2026-09-11", access: full, locator: "comparison table 'Traditional workflow' vs 'With ApariPro' (date is the page's modified time when re-read on 2026-10-17)" }
    - { ref: CPAPA-POSTEXT-2026, title: "The Post-Extension Window: How to Sequence Firm Automation Before Busy Season", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/16/the-post-extension-window-how-to-sequence-firm-automation-before-busy-season/191855/", date: "2026-10-16", access: full, locator: "sections 'Start with one workflow' and 'Use AI where it reads, not where it decides'" }
    - { ref: TAXADVISER-CLIENTS-2026, title: "What today's clients expect from their CPA and how firms are responding", publisher: "The Tax Adviser (interview with Bob Nolan, Drake Software)", type: press, url: "https://www.thetaxadviser.com/issues/2026/aug/what-todays-clients-expect-from-their-cpa-and-how-firms-are-responding/", date: "2026-08-31", access: full, locator: "question on communication preferences" }
    - { ref: IRS-I8867-2025, title: "Instructions for Form 8867: Paid Preparer's Due Diligence Checklist (Rev. November 2025)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/i8867.pdf", date: "2025-11", access: full, locator: "Due diligence requirements; Part VI" }
    - { ref: COLUMBIA-TAXBENCH-2026, title: "TaxBench (benchmark in development)", publisher: "Columbia University DAP Lab", type: academic, url: "https://daplab.cs.columbia.edu/benchmarks/taxbench/", date: "2026-07", access: full, locator: "'What it evaluates'; 'Dataset' (page says 'Updated July 2026')" }
    - { ref: ACCRUAL-INDIV-2026, title: "Accrual: individual (1040, 1041) tax preparation", publisher: "Accrual", type: vendor, url: "https://www.accrual.com/tax/individuals", date: "2026-10-17", access: full, locator: "'Collect' step; quote from Josh Karls, Tax Manager, Armanino, on document collection (page undated; retrieval date)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Combines three parts: an AI intake organizer (graded C on its own), document-request automation (an idea from a
    practitioner article) and AI-prompted due-diligence questions (an idea built from the Form 8867 rules and the
    TaxBench design). No named customer of Smart Intake was found; WCG uses Canopy for workflow but does not say it
    uses Smart Intake. The missing-information and due-diligence part has no deployment and remains an idea. The Form
    8867 penalty is $650 per credit (up to $2,600 for four) for a return filed in 2026, per the instructions.

- id: tax-compliance-individual-business-02
  title: Source-document classification, extraction and K-1 footnote mapping with confidence flags and exception review
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, review-assurance]
  pattern: document-to-decision
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    K-1 packages (the partner's share of partnership income, with footnotes and supplemental statements) and
    multi-tier partnerships defeat template OCR and manual keying, and mapping footnote items to tax treatments used
    to need group review. An extraction error can flow into a return without any flag. In the 2026 AICPA tax software
    survey, importing data and integration with other software were the lowest-rated software attributes.
  solution: >-
    CCH Axcess Scan (Wolters Kluwer) classifies and extracts W-2s, 1099s, brokerage statements and K-1s and
    "surfaces only exceptions for review". PwC says agents trained on how to treat K-1 footnote items assess each item,
    state how they interpreted it and a confidence level, and flag it for a reviewer, who gives a reason when
    overriding so the agent can learn; agents run on PwC's Agent OS, which manages the tools each agent can use.
    Intuit's ProConnect describes AI data import with side-by-side confirmation of each figure against the source.
    Werfel's preparer risk register proposes independent verification of AI-extracted figures against source
    documents for all returns, spot-check audits of extraction accuracy and an escalation protocol for complex or
    ambiguous documents.
  outcomes:
    - lever: speed
      description: "A named ProConnect user firm (Kulangy CPA, LLC) says the SmartReturn import-and-review workflow lets it complete returns in half the time."
      figure: "returns completed in half the time"
      measures: "relative time to complete returns, per a customer quote on the vendor page; baseline and sample not given"
      provenance: vendor-published
      source_ref: INTUIT-PROCONNECTAI-2026
    - lever: quality
      description: "Wolters Kluwer says K-1 extraction delivers on average 97.5% overall accuracy."
      figure: "97.5% average overall accuracy"
      measures: "vendor statement of average overall accuracy of automated K-1 extraction; test set, unit (field or document) and method not stated"
      provenance: vendor-published
      source_ref: WK-AXCESSSCAN-2026
    - lever: capacity
      description: "PwC says one person now reviews where three people used to gather to decide how to treat an unfamiliar K-1 footnote. No rates or counts are published."
      figure: "none published"
      measures: "qualitative interview statement: one reviewer instead of three people gathering to decide"
      provenance: self-reported
      source_ref: PWC-MEGNA-2025
  prerequisites:
    - "Historical treatment data and staff guides to train the agents; PwC keeps retraining on new data (PWC-MEGNA-2025)"
    - "A tool-management layer for agents (PwC's Agent OS) and reviewers who record override reasons"
    - "For Scan, the CCH Axcess platform, which receives the extracted data"
    - "Source documents retained and linkable to each extracted figure, and a sampling or full-verification procedure defined before go-live (AICPA-WERFEL-2026, Appendix C, risk 3)"
  risks_and_guardrails:
    - "PwC says confidence rarely reaches 100% and reviewers remain in the loop; 'it's not a complete handoff'. Simpler diagnostics may need fewer review layers, while complex outputs such as tax calculations keep multi-eye review (PWC-MEGNA-2025)."
    - "Werfel's illustrative scenario: a W-2 box 12 code is misclassified, a pre-tax health premium is treated as taxable wages, and the error surfaces only when the taxpayer receives a notice. It is hypothetical, not an observed incident (AICPA-WERFEL-2026, Appendix C, risk 3)."
    - "WCG judged K-1 and consolidated-1099 coverage a minimum bar for any vendor serving complex individual returns (WCG-NOTREADY-2026)."
    - "Under the section 7216 regulations a person who develops software used to prepare returns is itself a tax return preparer, and contractors receiving return information for software work must get written notice of sections 6713 and 7216. Whether a given AI vendor falls within those provisions is not answered by the sources (TREAS-7216-2008)."
  human_checkpoints:
    - "Reviewer inspects flagged items and overrides low-confidence mappings with a recorded reason"
    - "Preparer or reviewer compares extracted figures to source documents under the firm's verification policy"
    - "Escalation to senior review when a source document is complex or ambiguous"
  role_evolution: >-
    Preparers move from keying and interpreting footnotes to exception review and verification; PwC says reviewers'
    override explanations train the agents (PWC-MEGNA-2025). Werfel's register warns that junior staff can end up
    operating the tool without building the tax-law understanding needed to catch its errors (AICPA-WERFEL-2026,
    Appendix C, risk 13).
  evidence_grade: B
  sources:
    - { ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "answer to first question (K-1 mapping, confidence and override loop); answers on Agent OS and review layers" }
    - { ref: WK-AXCESSSCAN-2026, title: "CCH Axcess Scan", publisher: "Wolters Kluwer", type: vendor, url: "https://www.wolterskluwer.com/en/solutions/cch-axcess/scan", date: "2026-10-17", access: full, locator: "sections on complex K-1 extraction ('97.5% overall accuracy') and FAQ (page undated; read via r.jina.ai mirror)" }
    - { ref: INTUIT-PROCONNECTAI-2026, title: "AI-Powered Tax Prep Tools (ProConnect)", publisher: "Intuit", type: vendor, url: "https://accountants.intuit.com/tax-software/tax-online/ai-features/", date: "2026-10-17", access: full, locator: "SmartReturn and 'Intelligent data import' blocks with customer quotes (page undated)" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risks 3 and 13" }
    - { ref: AICPA-TAXSW-2026, title: "2026 tax software survey (1,808 AICPA members; AI adoption questions)", publisher: "The Tax Adviser and Journal of Accountancy (AICPA)", type: survey, url: "https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/", date: "2026-08-31", access: full, locator: "section 'Ratings': importing data and integration" }
    - { ref: TREAS-7216-2008, title: "26 CFR 301.7216-1, 301.7216-2 and 301.7216-3: disclosure or use of tax return information by tax return preparers", publisher: "U.S. Treasury (T.D. 9375, as amended), text read from eCFR", type: regulator, url: "https://www.ecfr.gov/current/title-26/section-301.7216-3", date: "2008-01", access: full, locator: "301.7216-1(b)(2)(i)(B); 301.7216-2(d)(2)" }
    - { ref: WCG-NOTREADY-2026, title: "AI Tax Prep in 2026: Not Quite There Yet", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-prep-in-2026-not-quite-there-yet/", date: "2026-07-24", access: full, locator: "vendor sections on K-1 and consolidated 1099 coverage" }
  last_reviewed: "2026-10-17"
  notes: >-
    Ladder kept at automate because the named products route only exceptions to people; a firm that adopts Werfel's
    control of verifying every extracted figure is running it as augment. PwC's K-1 example is from its asset and
    wealth management work, adjacent to individual and small-business returns, and the interview is from June 2025;
    this caps the grade at B. The Intuit and Wolters Kluwer figures are undated vendor-page claims. Overlaps:
    tax-compliance-corporate-02 uses the same PwC interview for the corporate lens.

- id: tax-compliance-individual-business-03
  title: Retail preparer offices replace manual data entry with AI to free appointment time for advice
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, client-interaction]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Preparers in assisted-tax offices spend much of an appointment collecting and entering information, leaving less
    time for advice.
  solution: >-
    H&R Block management said the company is "transforming how work gets done inside our offices by automating away
    the mechanical aspects of tax prep", from using AI to eliminate manual data entry to automating the initial review
    of prior-year returns. This supports an advice-focused office model run in pilot offices that will expand to a
    full designated market area for tax season 27.
  outcomes:
    - lever: experience
      description: "For the advice-focused pilot-office model (which management says technology enables), H&R Block reported higher client satisfaction, stronger belief in its expertise and value, and more engagement beyond tax season. No figures were given."
      figure: "none published"
      measures: "qualitative management statement about pilot offices; no counts or rates"
      provenance: self-reported
      source_ref: HRB-Q4CALL-2026
  prerequisites:
    - "Technology, talent and workflows refined in a larger market test (management's stated purpose of the tax season 27 expansion)"
  risks_and_guardrails:
    - "Management says AI alone is not sufficient for complex clients who seek confidence, judgment and accountability (HRB-Q4CALL-2026)."
  human_checkpoints:
    - "Tax pros remain responsible for the returns and the client guidance"
  role_evolution: >-
    Management says tax pros spend less time collecting and entering information and more on guidance, planning and
    advice; field leadership is being reshaped toward year-round development of associates (HRB-Q4CALL-2026).
  evidence_grade: B
  sources:
    - { ref: HRB-Q4CALL-2026, title: "H&R Block Q4 fiscal 2026 earnings call transcript", publisher: "H&R Block (transcript via earningswhispers.com)", type: firm, url: "https://earningswhispers.com/transcript/HRB/Q42026", date: "2026-08-11", access: full, locator: "management prepared remarks on pilot offices and 'automating away the mechanical aspects'" }
  last_reviewed: "2026-10-17"
  notes: >-
    The transcript is a third-party copy of the company call. Management also reported a 200 basis point conversion
    improvement and a 190 basis point retention gain in the season but did not attribute them to this AI change, so
    they are not used as outcomes. H&R Block also reported that AI TaxAssist (for paid DIY filers) supported 4.2
    million client interactions; that is a consumer feature, not this use case.

- id: tax-compliance-individual-business-04
  title: Agent drafts a simple 1040 from source documents and the prior-year return for CPA review
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Preparing even simple 1040s means sorting source documents, keying data and building the return by hand, which
    crowds out higher-value work in a short season. Thomson Reuters frames its launch around busy-season burnout and
    staffing strain.
  solution: >-
    Thomson Reuters' Ready to Review (on the CoCounsel Tax, Audit and Accounting platform) uses agents to process
    source documents and prior-year returns, extract and categorise data and generate returns ready for professional
    review. The product page says the draft includes verification links back to source documents, two-year
    comparisons and categorised diagnostics; the client portal, e-file and signature steps stay as before. The release
    announced an early-adopter program, and a later Thomson Reuters post says Ready to Review became generally
    available in the US from 15 Dec 2025.
  outcomes:
    - lever: speed
      description: "A partner at CLH CPAs and Consultants (Indiana), an early adopter, said it reduces return preparation time by about an hour on each simple 1040."
      figure: "approximately 1 hour per simple 1040"
      measures: "partner's estimate of reduced preparation time per simple 1040, quoted in the vendor release; no method, sample or baseline published"
      provenance: vendor-published
      source_ref: TR-COCOUNSEL-2025
  prerequisites:
    - "Source documents and the prior-year return uploaded to CoCounsel Tax; a firm-defined document intake process"
    - "A client portal for review and signature, and the firm's usual e-file process"
    - "A documented verification policy and logging before any client return is processed (AICPA-WERFEL-2026, Appendix D, Step 5)"
  risks_and_guardrails:
    - "WCG reported that at its 2026 evaluation Ready to Review did not handle K-1s or consolidated 1099 brokerage statements, and said both were on the vendor's roadmap for November 2026 (WCG's account, not confirmed by Thomson Reuters)."
    - "WCG noted the product works inside Thomson Reuters' own environment, which it said 'creates problems'; its post describes the reset risk of proprietary platforms, where a return the AI cannot finish cannot be moved into the firm's usual tax software (WCG-NOTREADY-2026)."
    - "OPR Alert 2026-19 ties AI output to Circular 230 section 10.22 (due diligence) and section 10.35 (competence); the signing preparer remains responsible (IRS-OPR-2026)."
    - "Unaided models calculate returns poorly (COLUMN-TAXCALCBENCH-2025); that benchmark does not test this product."
  human_checkpoints:
    - "Professional review of the agent-prepared draft, diagnostics and source links before delivery"
    - "Taxpayer reviews the return before signing the e-file authorisation (IRS-PUB1345-2025)"
  role_evolution: >-
    Thomson Reuters' president for tax says she expects firms to pair each CPA with at least one virtual agent and
    predicts fewer 80-hour weeks (TR-R2R-2025). The vendor positions staff time moving from data entry and document
    sorting to review and advisory work; no firm-reported role changes were found.
  evidence_grade: B
  sources:
    - { ref: TR-COCOUNSEL-2025, title: "Thomson Reuters Launches Agentic AI Solutions to Transform Tax, Audit and Accounting Workflows", publisher: "Thomson Reuters", type: vendor, url: "https://www.thomsonreuters.com/en/press-releases/2025/november/thomson-reuters-launches-agentic-ai-solutions-to-transform-tax-audit-and-accounting-workflows", date: "2025-11-05", access: full, locator: "section 'Transforming Tax Preparation with Agentic AI' (CLH quote); availability notes" }
    - { ref: TR-R2R-2025, title: "Transforming Busy Season: Introducing Ready to Review", publisher: "Thomson Reuters (Elizabeth Beastrom)", type: vendor, url: "https://www.thomsonreuters.com/en-us/posts/innovation/transforming-busy-season-introducing-ready-to-review-thomson-reuters-agentic-ai-for-1040-preparation/", date: "2025-12-15", access: full, locator: "paragraphs 2-3, 'The Next Step for 1040 Prep'" }
    - { ref: TR-RTR-2026, title: "Complete tax returns faster with Ready to Review (product page and FAQ)", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/en/products/ready-to-review", date: "2026-10-17", access: full, locator: "FAQ answers on workflow, verification and diagnostics (page undated; retrieval date)" }
    - { ref: WCG-NOTREADY-2026, title: "AI Tax Prep in 2026: Not Quite There Yet", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-prep-in-2026-not-quite-there-yet/", date: "2026-07-24", access: full, locator: "section 'Thomson Reuters Ready to Review'" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework, items 1 and 3" }
    - { ref: COLUMN-TAXCALCBENCH-2025, title: "TaxCalcBench: Evaluating Frontier Models on the Tax Calculation Task (arXiv 2507.16126)", publisher: "Column Tax authors (Bock, Molisee, Ozer, Shah), arXiv preprint", type: academic, url: "https://arxiv.org/abs/2507.16126", date: "2025-07-22", access: full, locator: "abstract; section 4 results table" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix D, Step 5" }
    - { ref: IRS-PUB1345-2025, title: "Publication 1345: Handbook for Authorized IRS e-file Providers of Individual Income Tax Returns (Rev. 12-2025)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/p1345.pdf", date: "2025-12", access: full, locator: "Form 8878/8879 signature authorisation section" }
  last_reviewed: "2026-10-17"
  notes: >-
    Black Ore is covered in tax-compliance-individual-business-05. Ready to Review alone produces a reviewable draft
    inside the preparation step, so it is kept at augment and step. Maturity stays piloting: the only named user is an
    early adopter and no firm confirms general use. The same release says early-adopter customers "saw up to 70%
    faster preparation and workpaper review", but that sentence sits in the audit section and does not say which
    product it covers, so it is not used.

- id: tax-compliance-individual-business-05
  title: Agent prepares individual returns end to end, including complex K-1-heavy returns, with workpapers for CPA sign-off
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Complex returns (many K-1s, brokerage statements, multi-state) take days of preparer and reviewer time, and firms
    are short of staff in busy season. Black Ore frames its launch around a shortage of qualified accountants.
  solution: >-
    Black Ore's Tax Autopilot (opened to CPA firms on 29 Apr 2026 after a two-year invitation-only pilot) ingests
    W-2s, 1099s, K-1s and brokerage statements, classifies and extracts the data, applies federal and state logic,
    builds workpapers and routes the return into the firm's tax software for human sign-off. Basis describes agents
    that gather client data, build workpapers and run quality controls so that "staff investigate exceptions,
    managers review". Accrual describes complex individual, trust and partnership returns "prepared end to end", and its 1040 page
    shows Armanino as a production customer. OpenAI describes Tax AI, built with Codex by OpenAI and Thrive Holdings
    for Crete's network of more than 30 accounting firms; it processed 7,000 1040 and 1041 returns across the Crete
    firms that took part in the pilot (the number of participating firms is not stated). Practitioners upload source
    files and notes and Tax AI creates a tax engine submission ready for review.
  outcomes:
    - lever: capacity
      description: "OpenAI's post on the Crete pilot says Tax AI saves practitioners about a third of their time on tax preparation, drafts returns with up to 97% accuracy and increases throughput by about 50%. It measures accuracy as the share of returns reaching 75%, 90% or 100% correct field completion: at launch a quarter of returns reached 75%, and 86% did within six weeks."
      figure: "about one third less preparation time; up to 97% accuracy; about 50% more throughput; 86% of returns at 75% correct field completion after six weeks (25% at launch)"
      measures: "pilot over 7,000 1040 and 1041 returns in the Crete firms that took part; accuracy is correct field completion compared with the filed return; the method behind the time and throughput figures is not described. Published by OpenAI, the co-developer, which RuntimeWire reports holds an ownership stake in Thrive Holdings, Crete's owner"
      provenance: vendor-published
      source_ref: OPENAI-CODEX-2026
    - lever: capacity
      description: "Accrual's 1040 page shows Armanino results: thousands of returns processed in 2026, six Armanino offices onboarded, a 60% reduction in preparation hours and a 15-minute median draft time."
      figure: "60% reduction in preparation hours; 15-minute median draft time"
      measures: "vendor-page statistics about a named customer; period, baseline, return mix and method not stated"
      provenance: vendor-published
      source_ref: ACCRUAL-INDIV-2026
    - lever: capacity
      description: "A partner at Boulay says returns with 60 or 70-plus K-1s that could take more than 100 preparation hours are now down to maybe 15 or 20 hours (Basis testimonial; Kevin Ellis, Partner, Boulay, as the visible page shows; the home page's structured data spells the name 'Kevin Elli')."
      figure: "from more than 100 hours to about 15-20 hours per return with 60-70+ K-1s"
      measures: "preparation hours on returns with 60 or 70-plus K-1s, as stated by the Boulay partner; an estimate ('maybe'), with no method, sample size or return form stated"
      provenance: vendor-published
      source_ref: BASIS-TAX-2026
    - lever: speed
      description: "Black Ore says Tax Autopilot achieved accuracy above 99 percent across tens of thousands of returns during the pilot and time savings of up to 98 percent on complex filings."
      figure: ">99% accuracy; up to 98% time savings"
      measures: "company statements as reported; accuracy (line, return or after review) and the time baseline are not defined"
      provenance: vendor-published
      source_ref: BLACKORE-2026
    - lever: speed
      description: "Kyle Parks of Maxwell Locke & Ritter is quoted saying a high-net-worth return could take several days to prepare and is now ready for review in minutes."
      figure: "from several days to minutes (one high-net-worth return type)"
      measures: "time to a review-ready high-net-worth return, per a customer quote in trade coverage of the launch; no sample or method"
      provenance: vendor-published
      source_ref: MYCPE-BLACKORE-2026
  prerequisites:
    - "Integration with the firm's tax software: Black Ore routes into it (WCG says it exports mapped inputs into Lacerte); Accrual integrates with CCH Axcess"
    - "Per-return or per-page pricing accepted: WCG reports Black Ore at $100 to $150 per return on average, built on $1 per scanned page and $3 per K-1 page, and estimated $200 to $250 for its own mix (WCG's account)"
    - "A firm complexity matrix and review model; Accrual prices against a firm's engagement fees by complexity tier (ACCRUAL-LAUNCH-2026)"
    - "Vendor security assurance: Black Ore states SOC 2 Type II; Basis says it does not train on client data and keeps data on US infrastructure (vendor statements); OPR's best practices include vetting third parties' AI offerings when or before purchasing (IRS-OPR-2026)"
    - "Start with simpler returns; one practitioner advised against putting the most complex or many-state returns in first (CPAPA-BLACKORE-2024)"
  risks_and_guardrails:
    - "WCG found the host tax software still re-runs its own calculations and diagnostics, so pre-preparation work is rechecked and the firm still handles diagnostics, e-file setup, Form 8879 and delivery (WCG's assessment of Black Ore)."
    - "Black Ore told Accounting Today that complex returns are about 98% touchless and that a CPA must attest to the return and resolve edge cases. Some firm leaders whose own past returns had been prepared at 'a higher level of abstraction' under workload pressure worried that the AI's more precise output would create a 'noticeable delta versus prior years' returns' and audit risk in the transition year (ACCTODAY-BLACKORE-2026)."
    - "Werfel's preparer register names incorrect document extraction that flows silently into the return, and control dilution, where AI-driven volume makes partner review less rigorous in practice even if unchanged on paper (AICPA-WERFEL-2026, Appendix C, risks 3 and 6)."
    - "On the TaxCalcBench tax year 2025 edition (50 cases), strict return-level correctness of unaided models ran from 0 to 71 percent depending on model and web search; this tests the calculation step only, not these products (COLUMN-TCBREPO-2026)."
    - "No independent audit of the accuracy or time claims was found."
  human_checkpoints:
    - "CPA review and sign-off before the return goes to the client and the IRS"
    - "CPA answers questions the system cannot resolve from documents (for example partnership ambiguities)"
    - "Tie-out of workpapers to source documents during review (CPAPA-BLACKORE-2024)"
  role_evolution: >-
    Black Ore says the platform is designed to compress the functions of admin, junior staff, senior staff and
    reviewers into one agentic workflow, and it has added seniors' tie-outs, downloadable binders and manager reviewer
    workflows (ACCTODAY-BLACKORE-2026). Basis positions staff at exception investigation and managers at review
    (BASIS-TAX-2026). WCG says Black Ore "replaces the first-level preparer, not the last mile" (WCG-NOTREADY-2026).
  evidence_grade: A
  sources:
