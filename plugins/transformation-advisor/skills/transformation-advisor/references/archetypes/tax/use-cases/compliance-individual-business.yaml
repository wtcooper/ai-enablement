- id: tax-compliance-individual-business-09
  title: General-purpose agents run practitioner-taught routines and build return workpapers
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [coordination-scheduling, transaction-processing]
  pattern: other
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Multi-source follow-up on a return (call notes, open issues, binders, signature requests) is done by hand across
    systems.
  solution: >-
    Accrual's Arc (unveiled 9 Sep 2026) takes an objective, drafts a plan, asks clarifying questions and, after
    approval, executes across the firm's systems. In the demo it read a Teams transcript to propose changes to a
    partnership return's open items, asked for approval and updated the workpaper with an audit trail; routines the
    practitioner teaches can be saved as replayable agents. Separately, The Accounting Podcast featured a practitioner,
    Sam Leon, using Claude Cowork (a general-purpose desktop agent) to prepare tax returns and build workpapers, with
    discussion of the "reviewer bottleneck".
  outcomes:
    - lever: speed
      description: "The episode title says Sam Leon uses Claude Cowork to prep tax returns 5x faster."
      figure: "5x faster"
      measures: "speed-up claimed in the episode title; show notes only, no method or baseline"
      provenance: self-reported
      source_ref: ACCTPOD-SAMLEON-2026
    - lever: capacity
      description: "none published for Arc"
      figure: "none published"
      measures: "none published"
      provenance: vendor-published
      source_ref: ACCRUAL-ARC-2026
  prerequisites:
    - "Connected firm systems and permissioned access to meeting transcripts and the engagement binder"
  risks_and_guardrails:
    - "In the Arc demo the agent proposed changes and waited for approval before updating the workpaper; the vendor reports an audit trail of sources, tools and actions (ACCRUAL-ARC-2026)."
    - "Review becomes the bottleneck as preparation speeds up (ACCTPOD-SAMLEON-2026, show notes)."
  human_checkpoints:
    - "Practitioner approves the plan and each proposed change"
  role_evolution: >-
    The Arc presenter describes moving from clicking buttons to reviewing the agent's work (ACCRUAL-ARC-2026).
  evidence_grade: C
  sources:
    - { ref: ACCRUAL-ARC-2026, title: "Accrual launches Arc AI for accounting workflows", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/accrual-launches-arc-ai-can-learn-from-and-replicate-accounting-workflows", date: "2026-09-22", access: full, locator: "paragraphs on the three task types and the Clarity Partners PPC demonstration" }
    - { ref: ACCTPOD-SAMLEON-2026, title: "How Sam Leon Uses Claude Cowork to Prep Tax Returns 5x Faster (episode listing and show notes)", publisher: "The Accounting Podcast (via Podscan)", type: podcast, url: "https://podscan.fm/e/ep_naq7xl2ng2awrm6e", date: "2026-07-25", access: full, locator: "episode introduction (Sam Leon, founder of The Millennial CPA, a firm of one); show notes on workpapers and 'review remains the bottleneck' (Podscan blocks direct fetch; read via r.jina.ai mirror and the CastFox episode listing)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern is other: a general agent harness that plans, asks for approval and executes multi-system tasks. Combines
    Accrual's Arc announcement (the demo used a theoretical client) with a practitioner podcast. Maturity is piloting
    because a named practitioner describes use, but only the show notes were read. The notice-sweep part of Arc
    belongs to the controversy module.

- id: tax-compliance-individual-business-10
  title: Route calculation to a deterministic tax engine and keep the language model for intake, explanation and orchestration
  archetype: tax
  module: compliance-individual-business
  function: technology-it
  work_types: [software-systems, transaction-processing]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    Unaided language models calculate returns unreliably, yet agentic preparers promise return drafts. Calculation
    errors, wrong tax tables and eligibility mistakes are costly and hard to audit.
  solution: >-
    Idea (researchers' recommendation; no deployment described): pair the model with a deterministic calculation
    engine or a symbolic solver. The TaxCalcBench authors conclude their findings point to a continued need for
    deterministic tax calculation engines and for added infrastructure and orchestration around models. A Johns
    Hopkins team (accepted to AAAI 2026) proposes translating rules into logic programs for a symbolic solver and
    reports lower cost, estimated from real-world penalties for tax errors, on a statutory reasoning dataset.
  outcomes:
    - lever: quality
      description: "On 51 hand-built simplified federal-only tax year 2024 cases, the best of four tested models (Gemini 2.5 Pro) computed 32.35% of returns correctly under the strict criterion; the others scored 27.45% (Claude Opus 4), 25.98% (Gemini 2.5 Flash) and 23.04% (Claude Sonnet 4)."
      figure: "32.35% best; 23.04% lowest (strict); 51.96% best (lenient, within $5 per line)"
      measures: "share of test cases where every evaluated line matched a traditional tax engine's output exactly, with document collection and preparation assumed correct"
      provenance: vendor-published
      source_ref: COLUMN-TAXCALCBENCH-2025
    - lever: quality
      description: "On the harder tax year 2025 edition (50 cases with PDF inputs and state returns), strict return-level correctness ran from 0 to 71.43 percent; the best row used web search, and the best row without web search scored 40.00 percent."
      figure: "0 to 71.43% strict; 40.00% best without web search"
      measures: "share of 50 cases fully correct at return level, by model and web-search setting; calculation step only"
      provenance: vendor-published
      source_ref: COLUMN-TCBREPO-2026
  prerequisites:
    - "A deterministic engine whose outputs the firm already trusts (its tax software)"
    - "Interfaces that let the model supply inputs and read results rather than compute them"
    - "A benchmark of the firm's own return types to test the combined system"
  risks_and_guardrails:
    - "The benchmark authors work for a company that sells a deterministic engine (Column Tax, reported as acquired by Aiwyn in 2025), hence vendor-published provenance; the 2025 paper used mid-2025 models and tests calculation only."
    - "The authors' error analysis: models misused tax tables, made calculation errors and misjudged eligibility (COLUMN-TAXCALCBENCH-2025)."
    - "Columbia's TaxBench, still in development, will score field by field against reviewed reference returns and test asking for missing information and rule precedence; no results yet (COLUMBIA-TAXBENCH-2026)."
  human_checkpoints:
    - "Preparer reviews the engine-calculated return and any model-supplied inputs"
  role_evolution: >-
    Preparers review inputs and eligibility judgments more than arithmetic. No source describes a role change in
    detail.
  evidence_grade: D
  sources:
    - { ref: COLUMN-TAXCALCBENCH-2025, title: "TaxCalcBench: Evaluating Frontier Models on the Tax Calculation Task (arXiv 2507.16126)", publisher: "Column Tax authors (Bock, Molisee, Ozer, Shah), arXiv preprint", type: academic, url: "https://arxiv.org/abs/2507.16126", date: "2025-07-22", access: full, locator: "abstract; section 4 results table; error analysis" }
    - { ref: COLUMN-TCBREPO-2026, title: "TaxCalcBench repository README and TY2025 leaderboard", publisher: "Column Tax (GitHub)", type: vendor, url: "https://github.com/column-tax/tax-calc-bench", date: "2026-06", access: full, locator: "Leaderboard, Tax Year 2025 table and notes" }
    - { ref: JHU-TAXREASON-2025, title: "Language Models and Logic Programs for Trustworthy Tax Reasoning (arXiv 2508.21051; accepted to AAAI 2026)", publisher: "arXiv preprint (Jurayj, Holzenberger, Van Durme; Johns Hopkins University)", type: academic, url: "https://arxiv.org/abs/2508.21051", date: "2025-08-28", access: full, locator: "abstract" }
    - { ref: COLUMBIA-TAXBENCH-2026, title: "TaxBench (benchmark in development)", publisher: "Columbia University DAP Lab", type: academic, url: "https://daplab.cs.columbia.edu/benchmarks/taxbench/", date: "2026-07", access: full, locator: "'What it evaluates'; 'Release status' (page says 'Updated July 2026')" }
    - { ref: BLACKORE-2026, title: "AI Tax Startup Black Ore Opens Platform to CPA Firms", publisher: "Sovereign Magazine", type: press, url: "https://www.sovereignmagazine.com/article/ai-tax-startup-black-ore-opens-platform-to-cpa-firms", date: "2026-04-29", access: full, locator: "paragraph on Column Tax and Aiwyn" }
  last_reviewed: "2026-10-17"
  notes: >-
    Idea, labelled as such: the measurements are of unaided models on one step, and no firm describes the hybrid
    design in production. In the tax year 2025 edition one case was excluded from the best row (49 of 50 cases)
    because the model copied the expected output from the repository (COLUMN-TCBREPO-2026). Overlaps:
    tax-compliance-corporate-22, tax-research-advisory-12 and tax-indirect-tax-22 describe the same model-plus-engine
    design.

- id: tax-compliance-individual-business-11
  title: Grounded assistant for preparers on code changes, unusual questions and return positions, with every authority verified
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Retail tax pros must stay current on tax code changes and answer unusual client questions during appointments.
    Preparers and reviewers also research positions for Schedule C, partnership and S corporation items, and general
    models can invent authorities: in Clinco v. Commissioner (T.C. Memo. 2026-16) the court said three of four cases
    cited by taxpayer's counsel appeared to be hallucinations from a large language model.
  solution: >-
    In April 2025 H&R Block and OpenAI said they were developing a generative AI tool for H&R Block tax pros, grounded
    in vetted data from H&R Block's Tax Institute, with large-scale deployment planned ahead of the 2026 season. On the
    August 2026 call management described "Sidekick, our AI TaxPro assistant" as having strong adoption across offices.
    More widely, practitioners use tax research assistants and general tools to find and summarise authority, then
    open and read each cited authority before it reaches a return position or client memo.
  outcomes:
    - lever: quality
      description: "H&R Block management said Sidekick saw strong adoption throughout the season and helped navigate complex tax questions more efficiently. No usage counts or accuracy figures were published."
      figure: "none published"
      measures: "qualitative adoption statement; no counts"
      provenance: self-reported
      source_ref: HRB-Q4CALL-2026
    - lever: capacity
      description: "Adoption benchmark, not an outcome: 65% of surveyed CPA preparers use AI for tax research."
      figure: "65%"
      measures: "share of respondents (1,808 AICPA members who prepared 2025 returns for a fee; surveyed 1-19 June 2026) who use AI in tax research; 16% said they have no plans to use AI, down from 24.3% a year earlier"
      provenance: independent
      source_ref: AICPA-TAXSW-2026
    - lever: quality
      description: "Adjacent-domain measurement: two vendors' retrieval-based legal research tools hallucinated between 17% and 33% of the time in a preregistered evaluation."
      figure: "17% to 33%"
      measures: "share of legal research queries (not tax) in which Lexis+ AI and Thomson Reuters's AI research tools produced hallucinated content, per the abstract"
      provenance: independent
      source_ref: STANFORD-HALLUC-2024
  prerequisites:
    - "A curated expert content base to ground answers (H&R Block's Tax Institute)"
    - "Source links the reviewer can open, and a rule that every cited authority is read before use"
    - "A firm policy on which tools may be used (see tax-compliance-individual-business-19)"
  risks_and_guardrails:
    - "Clinco: the court stopped short of sanctions but called fictitious caselaw 'a recipe for sanctions'; the Journal of Accountancy says it appears to be the first Tax Court case on possible AI hallucinations (TAXCT-CLINCO-2026)."
    - "OPR says practitioners must verify the accuracy of facts, citations and calculations produced by AI (IRS-OPR-2026)."
    - "Circular 230 section 10.34(a) bars signing a return the practitioner knows or should know contains a position lacking a reasonable basis; the OPR alert does not cite it (TREAS-C230-2014)."
    - "OpenAI told CNBC it does not train on customer data for the H&R Block work, and its chief economist called AI a force multiplier for human expertise rather than a replacement (CNBC-HRB-2025)."
  human_checkpoints:
    - "The tax pro decides how to answer the client; the assistant supports the pro"
    - "Reviewer opens and reads each cited authority; a second reviewer cross-checks authorities in litigation filings (TAXCT-CLINCO-2026)"
  role_evolution: >-
    Research shifts from searching to verifying. Werfel's register warns that junior staff may accept confident,
    well-formatted AI lists without checking authorities (AICPA-WERFEL-2026, Appendix C, risk 4). H&R Block frames
    the tax pro's value as judgment and advice (HRB-Q4CALL-2026).
  evidence_grade: B
  sources:
    - { ref: CNBC-HRB-2025, title: "ChatGPT for taxes? OpenAI and H&R Block have a plan for tax pros", publisher: "CNBC via NBC 7 San Diego", type: press, url: "https://www.nbcsandiego.com/news/business/money-report/chatgpt-for-taxes-openai-and-hr-block-have-a-plan-for-tax-pros/3804532/?amp=1", date: "2025-04-15", access: full, locator: "paragraphs on the project, the Tax Institute data, 2026 season timing and the ROI study" }
    - { ref: HRB-Q4CALL-2026, title: "H&R Block Q4 fiscal 2026 earnings call transcript", publisher: "H&R Block (transcript via earningswhispers.com)", type: firm, url: "https://earningswhispers.com/transcript/HRB/Q42026", date: "2026-08-11", access: full, locator: "CEO prepared remarks: 'Sidekick, our AI TaxPro assistant'" }
    - { ref: AICPA-TAXSW-2026, title: "2026 tax software survey (1,808 AICPA members; AI adoption questions)", publisher: "The Tax Adviser and Journal of Accountancy (AICPA)", type: survey, url: "https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/", date: "2026-08-31", access: full, locator: "section 'Use of AI and other technical tools'" }
    - { ref: TAXCT-CLINCO-2026, title: "A recipe for sanctions: AI-hallucinated citations in tax (analysis of Clinco v. Commissioner, T.C. Memo. 2026-16)", publisher: "Journal of Accountancy (AICPA)", type: press, url: "https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/", date: "2026-09-01", access: full, locator: "'The apparitions in the briefing'; 'A recipe for sanctions'; 'Litigation safeguards'" }
    - { ref: STANFORD-HALLUC-2024, title: "Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools (Magesh et al., arXiv 2405.20362)", publisher: "Magesh, Surani, Dahl, Suzgun, Manning and Ho (Stanford)", type: academic, url: "https://arxiv.org/abs/2405.20362", date: "2024-05-30", access: full, locator: "abstract" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Real-World Consequences; Regulatory Framework item 1" }
    - { ref: TREAS-C230-2014, title: "31 CFR 10.34, Circular 230 standards with respect to tax returns and documents", publisher: "U.S. Treasury (Circular 230, Rev. 6-2014), text read from eCFR", type: regulator, url: "https://www.ecfr.gov/current/title-31/section-10.34", date: "2014-06", access: full, locator: "10.34(a)(1)" }
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C, risk 4" }
  last_reviewed: "2026-10-17"
  notes: >-
    The transcript does not say Sidekick is the tool built with OpenAI; a search summary said so but was not opened,
    so the link is unconfirmed. Research products (Blue J, CoCounsel, Bloomberg Tax, CCH) and their accuracy are
    covered in the research-advisory module. Overlaps: tax-research-advisory-01 (cited research assistants) and
    tax-compliance-corporate-11.

- id: tax-compliance-individual-business-12
  title: AI-assisted return review with source tie-out, diagnostics, prior-year variance and audit-sensitive flags
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Reviewers must check figures against source documents and prior years, which takes senior time. Review becomes
    the bottleneck when preparation gets faster, and reviewers must catch extraction, mapping and eligibility errors
    across more returns.
  solution: >-
    Intuit's ProConnect runs an AI assistant against thousands of diagnostics. Basis ties every number in a draft
    return to its source, builds the prior-year variance list and flags exceptions. Accrual shows prepared values,
    open issues, changes and supporting work together, with every figure traced to its source. Thomson Reuters says
    agents verify inputs against source documents and provide two-year comparisons and categorised diagnostics.
    TaxGPT launched a return-review agent ("Agent Andrew") that surfaces audit-sensitive items, and a vendor founder
    says his company began by automating one review step before moving to preparation. PwC lists tax diagnostics
    among its deployed agents.
  outcomes:
    - lever: quality
      description: "Seed Money Consulting says knowing the AI is checking its work against thousands of diagnostics gives it confidence. No error counts are published."
      figure: "none published"
      measures: "qualitative customer quote on the vendor page; no counts of errors caught"
      provenance: vendor-published
      source_ref: INTUIT-PROCONNECTAI-2026
  prerequisites:
    - "Source documents linked to the return so figures can be traced"
    - "Prior-year return data for variance analysis"
  risks_and_guardrails:
    - "WCG notes the host tax software repeats its own diagnostics, so upstream pre-checks may be duplicated (WCG's assessment of one vendor architecture)."
    - "OPR Alert 2026-19 says practitioners must carefully review everything AI produces; AI review does not replace the practitioner's own section 10.22 due diligence (IRS-OPR-2026)."
    - "Control dilution: AI-driven volume can make review less rigorous in practice even if the process is unchanged on paper (TAXADVISER-WERFEL-2026)."
    - "TEI attendees described grappling with how to review a growing volume of work when AI errors are 'polite, quiet and technical' (TEI-TAXTECH-2026; corporate setting)."
    - "In an adjacent month-end close benchmark, in three of the four AI-assisted sessions that did not score perfectly, the AI had the correct figure at some point but it did not reach the final submission (ACCTODAY-AIBENCH-2026; accounting, not tax)."
  human_checkpoints:
    - "Reviewer inspects flagged exceptions and decides on treatments"
    - "Preparer or reviewer signs the return"
  role_evolution: >-
    Reviewers start from a prepared draft with open issues surfaced, rather than from scratch (ACCRUAL-INDIV-2026); an
    Armanino reviewer quoted on Accrual's partnership page says he is reviewing a workbook rather than building one
    (ACCRUAL-PARTNER-2026). The host of a CPA-technology podcast
    compares AI output to the work of a two-year associate that someone must go through in detail (CPAPA-TAXGPT-2026).
  evidence_grade: B
  sources:
    - { ref: INTUIT-PROCONNECTAI-2026, title: "AI-Powered Tax Prep Tools (ProConnect)", publisher: "Intuit", type: vendor, url: "https://accountants.intuit.com/tax-software/tax-online/ai-features/", date: "2026-10-17", access: full, locator: "'Diagnostics' block with Seed Money Consulting quote (page undated)" }
    - { ref: BASIS-SMALL-2026, title: "Basis for small firms", publisher: "Basis", type: vendor, url: "https://www.getbasis.ai/solutions/small-firms", date: "2026-10-17", access: full, locator: "example exchange: 'Upload the draft return and the supporting docs'" }
    - { ref: ACCRUAL-INDIV-2026, title: "Accrual: individual (1040, 1041) tax preparation", publisher: "Accrual", type: vendor, url: "https://www.accrual.com/tax/individuals", date: "2026-10-17", access: full, locator: "'Start with the work that needs your judgment' and 'Every figure traced to its source'" }
    - { ref: ACCRUAL-PARTNER-2026, title: "Accrual: partnership returns", publisher: "Accrual", type: vendor, url: "https://www.accrual.com/tax/partnerships", date: "2026-10-17", access: full, locator: "quote from Patrick Richardson, Armanino (page undated)" }
    - { ref: TR-RTR-2026, title: "Complete tax returns faster with Ready to Review (product page and FAQ)", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/en/products/ready-to-review", date: "2026-10-17", access: full, locator: "FAQ answer on verification, two-year comparisons and diagnostics" }
    - { ref: TAXGPT-2026, title: "TaxGPT Releases Autonomous Tax Workflow Agent", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/03/24/taxgpt-releases-autonomous-tax-workflow-agent/180159/", date: "2026-03-24", access: full, locator: "free portion of the page: return-review agent" }
    - { ref: CPAPA-TAXGPT-2026, title: "Why General AI is Not Suitable for Tax Research - Accounting Technology Lab Podcast", publisher: "CPA Practice Advisor", type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/why-general-ai-is-not-suitable-for-tax-research-accounting-technology-lab-podcast-june-2026/", date: "2026-06", access: full, locator: "transcript, founder's account of review then preparation agents" }
    - { ref: PWC-MEGNA-2025, title: "How PwC's tax team is using agentic AI (interview with Dom Megna, PwC US AI Tax Leader)", publisher: "CFO.com", type: press, url: "https://www.cfo.com/news/how-pwcs-dom-megna-tax-team-is-using-agentic-ai-agent-os-cpa-cfo-/750062/", date: "2025-06-06", access: full, locator: "introduction (tax diagnostics)" }
