- id: tax-compliance-individual-business-13
  title: Review controls for AI-assisted returns - decision logs, override-rate monitoring, scaled sampling and escalation (idea)
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    AI-assisted preparation raises volume. Werfel's register describes control dilution: partners spend less time per
    return reviewing AI-assisted work, so more returns get less scrutiny though the process is unchanged on paper.
    When an AI-assisted position is challenged, a firm with no record cannot show what the tool suggested and what the
    preparer verified.
  solution: >-
    Idea (published guidance and framework; no deployment found). Keep a full log of every AI suggestion and the
    preparer's decision (accept, modify, reject) with override rationale, retained for 7 years at the highest control
    level, and review override rates by preparer monthly. Require sign-off that evidences real analysis rather than
    approval, scale sampling and spot checks to volume, set workload thresholds, escalate novel or uncertain positions
    to senior review regardless of the AI's confidence, and at the highest level run a weekly quality review of
    AI-assisted returns plus real-time error-flag monitoring during busy season. Australia's TPB tells practitioners to
    verify AI content at each step, establish processes to contest AI outputs and document each step. OPR expects
    firms' AI procedures (training, secure data handling, accuracy monitoring) and the steps taken to be documented to
    show adherence to section 10.36.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "no figure published"
      source_ref: AICPA-WERFEL-2026
  prerequisites:
    - "A tool or workflow that records suggestions and user decisions in a retrievable form"
    - "Baseline review time and error data for pre-AI returns"
    - "A working definition of 'novel or uncertain' positions for escalation, and someone assigned to act on error patterns"
  risks_and_guardrails:
    - "Without a baseline a firm cannot tell whether review quality fell. The only human-error baseline found is old: a 2014 GAO study of 19 undercover visits found 2 of 19 preparers computed the correct refund, and GAO estimated errors in 60% of preparer-prepared returns against 50% of self-prepared ones for tax years 2006-2009. The sample cannot be generalised (GAO-14467T-2014)."
    - "Logs are firm records that may be produced in an IRS examination or client dispute, and they hold client return information under the firm's security duties (AICPA-WERFEL-2026; IRS-PUB5708-2024)."
    - "Override-rate monitoring is a proposal; there is no published evidence of what rate indicates good practice. Werfel's illustrative case study treats a per-preparer override rate below 5% as a trigger for review, because it suggests approval rather than analysis."
    - "Circular 230 section 10.36 expects principals to take reasonable steps to ensure firm procedures are followed (IRS-OPR-2026, item 4)."
  human_checkpoints:
    - "Monthly review of override rates by preparer and of error patterns"
    - "Senior review of novel positions; reviewer documents the analysis behind sign-off"
  role_evolution: >-
    Reviewers' decisions become auditable data, which is what the TPB expects to see under its Determination sections
    30 and 40 (TPB-GS55-2026). Reviewers move from catching keying errors to testing positions and auditing the tool;
    Werfel warns that experienced preparers may retire or leave earlier as AI reduces demand for their expertise,
    taking tacit client knowledge with them (AICPA-WERFEL-2026, Appendix C, risk 15).
  evidence_grade: D
  sources:
    - { ref: AICPA-WERFEL-2026, title: "A Risk Framework for the Use of AI in Tax Administration and Preparation: appendices A to D (risk registers and case studies)", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/wp-content/uploads/sites/2/2026/06/appendices-ai-tax-risk-framework.pdf", date: "2026-06", access: full, locator: "Appendix C risks 1, 4-7, 12 and 15; Appendix D Steps 5-7" }
    - { ref: TPB-GS55-2026, title: "TPB(GS) 55/2026 The use of Artificial Intelligence and the Code of Professional Conduct", publisher: "Tax Practitioners Board (Australia)", type: regulator, url: "https://www.tpb.gov.au/tpbgs-552026-use-artificial-intelligence-and-code-professional-conduct", date: "2026-07-22", access: full, locator: "Competency section, paragraph 10 and Table 1" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework item 4 (firm procedures 'documented to show adherence to section 10.36')" }
    - { ref: GAO-14467T-2014, title: "Paid Tax Return Preparers: In a Limited Study, Preparers Made Significant Errors (GAO-14-467T)", publisher: "U.S. Government Accountability Office", type: regulator, url: "https://www.gao.gov/products/gao-14-467t", date: "2014-04", access: full, locator: "Highlights: What GAO Found" }
    - { ref: IRS-PUB5708-2024, title: "Publication 5708: Creating a Written Information Security Plan for your Tax and Accounting Practice (Rev. 8-2024)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/p5708.pdf", date: "2024-08", access: full, locator: "Requirements" }
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Combines two ideas: decision logging and override monitoring, and review redesign against control dilution.
    The TPB paragraph is an Australian regulator's expectation, not a US requirement; Werfel's retention periods and
    thresholds are illustrative figures in a hypothetical case study. Overlaps: tax-compliance-corporate-19 and
    tax-research-advisory-19 (AI-use and verification records).

- id: tax-compliance-individual-business-14
  title: Automated look-back review of prior-year returns for missed opportunities, offered to every new client ("Second Look")
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [review-assurance, client-interaction]
  pattern: full-population-testing
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Second Look, a service that reviews a new client's last three years of returns for missed opportunities, was
    manual, so tax pros rarely offered it to new clients.
  solution: >-
    In an analyst Q&A answer, H&R Block management said that over about 18 months the company automated Second Look
    using newer AI capabilities, so a much higher share of new assisted clients opt in. The stated goal is for every
    new assisted client to get it.
  outcomes:
    - lever: growth
      description: "New clients who received Second Look returned at a rate more than 600 basis points higher than those who did not. The comparison is for the Second Look service, not for the AI automation alone, and is not controlled."
      figure: "more than 600 basis points higher return rate"
      measures: "return rate (retention) of new clients who received Second Look versus new clients who did not, 2026 season, per management"
      provenance: self-reported
      source_ref: HRB-Q4CALL-2026
  prerequisites:
    - "Access to the client's prior three years of returns"
    - "Newer AI capabilities (not named in the transcript)"
  risks_and_guardrails:
    - "Management declined to give opt-in figures; the share of new clients receiving Second Look is described only as close to the goal (HRB-Q4CALL-2026)."
  human_checkpoints:
    - "Tax pros focus on the returns with the greatest opportunity (management's wording)"
  role_evolution: >-
    Tax pros no longer carry the manual work of look-back reviews and can concentrate on the highest-opportunity
    returns (HRB-Q4CALL-2026).
  evidence_grade: B
  sources:
    - { ref: HRB-Q4CALL-2026, title: "H&R Block Q4 fiscal 2026 earnings call transcript", publisher: "H&R Block (transcript via earningswhispers.com)", type: firm, url: "https://earningswhispers.com/transcript/HRB/Q42026", date: "2026-08-11", access: full, locator: "prepared remarks on Second Look retention; analyst Q&A answer on automating Second Look" }
    - { ref: AICPA-TAXSW-2026, title: "2026 tax software survey (1,808 AICPA members; AI adoption questions)", publisher: "The Tax Adviser and Journal of Accountancy (AICPA)", type: survey, url: "https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/", date: "2026-08-31", access: full, locator: "planning-opportunity review tools (93% use none; 2% use Holistiplan)" }
  last_reviewed: "2026-10-17"
  notes: >-
    The 600 basis point figure measures an existing service's retention link and is shown for context; the AI
    automation's own effect is not measured. In the AICPA 2026 survey, 93% of respondents do not use other tools to
    review returns for planning opportunities (AICPA-TAXSW-2026), which shows how rare this is in CPA firms.

- id: tax-compliance-individual-business-15
  title: AI-drafted client communications - status updates, return explanations, narratives and plan comparisons, reviewed before sending
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [client-interaction, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Clients call to ask where their return stands, interrupting preparers. Preparers write cover letters, query
    responses and explanations of positions. Firms want to use filed or prior-year returns for advisory narratives
    and quotes but cannot paste client data into public AI tools.
  solution: >-
    Short messages generated when a job changes stage (documents received, in preparation, one question waiting,
    ready for signature, filed), once the job board is kept current. Practitioners use AI to draft correspondence. WCG
    says it will use a SOC 2-compliant, zero-data-retention sandbox from a vendor to upload tax returns for
    client-facing narratives, engagement quoting, tax-plan comparisons, strategy recommendations and internal
    training; it bought a block of 500 returns at $44 each to get access. Intuit lists an AI Client Briefing for
    ProConnect users.
  outcomes:
    - lever: experience
      description: "Adoption benchmark, not an outcome: 32 percent of respondents to the AICPA 2026 tax software survey use AI for client communication, the second most common use after tax research."
      figure: "32%"
      measures: "share of respondents (1,808 AICPA members who prepared 2025 returns for a fee, surveyed 1-19 June 2026) who use AI for client communication; the denominator for this question is not stated"
      provenance: independent
      source_ref: AICPA-TAXSW-2026
    - lever: growth
      description: "none published. WCG calls return-based narratives a legitimate, high-value use at the current capability level and says moving toward advisory work is its goal."
      figure: "none published"
      measures: "none published"
      provenance: self-reported
      source_ref: WCG-NOTREADY-2026
  prerequisites:
    - "Job stages in the practice tool kept current before status automation is added (CPAPA-POSTEXT-2026)"
    - "An approved tool with SOC 2 and zero data retention, or redaction or consent before client facts go into prompts"
    - "Prior-year returns available to upload, for advisory narratives"
  risks_and_guardrails:
    - "OPR warns against uploading sensitive data to unsecured or public systems and says only secure, enterprise-approved AI should be used with client data (IRS-OPR-2026, item 6)."
    - "Written advice must rest on reasonable factual and legal assumptions and cannot rely on unverified AI output (IRS-OPR-2026, item 5, section 10.37)."
    - "The UK PCRT guidance says members should review AI-prepared correspondence for appropriate tone and content (ICAEW-PCRT-2026)."
    - "A Taxpayer Advocate Service note cites an informal Washington Post test in which two tax software companies' consumer chatbots gave inaccurate or irrelevant answers up to 50% of the time on 16 complex questions (TAS-AIBLOG-2024; consumer chatbots, not drafting tools)."
    - "WCG says AI spend raises its technology stack cost by about 25% (WCG-PLAYBOOK-2026)."
  human_checkpoints:
    - "Preparer reads and edits every client communication before it is sent"
    - "A person takes over when a client needs a call from someone they know (CPAPA-POSTEXT-2026)"
  role_evolution: >-
    Fewer status interruptions (CPAPA-POSTEXT-2026). WCG says it wants to move off compliance work toward advisory, with
    fewer CPAs and tax professionals coming out of school (WCG-NOTREADY-2026).
  evidence_grade: C
  sources:
    - { ref: AICPA-TAXSW-2026, title: "2026 tax software survey (1,808 AICPA members; AI adoption questions)", publisher: "The Tax Adviser and Journal of Accountancy (AICPA)", type: survey, url: "https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/", date: "2026-08-31", access: full, locator: "section 'Use of AI and other technical tools'" }
    - { ref: CPAPA-POSTEXT-2026, title: "The Post-Extension Window: How to Sequence Firm Automation Before Busy Season", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/16/the-post-extension-window-how-to-sequence-firm-automation-before-busy-season/191855/", date: "2026-10-16", access: full, locator: "section 'Add status updates only when the board is current'" }
    - { ref: WCG-NOTREADY-2026, title: "AI Tax Prep in 2026: Not Quite There Yet", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-prep-in-2026-not-quite-there-yet/", date: "2026-07-24", access: full, locator: "sections 'What WCG Actually Is Doing' and Juno" }
    - { ref: WCG-PLAYBOOK-2026, title: "AI Tax Preparation and Automation: What It Means for You", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-preparation-and-automation-what-it-means-for-you/", date: "2026-07-05", access: full, locator: "section 'Let's Be Direct About What This Is'" }
    - { ref: INTUIT-PROCONNECTAI-2026, title: "AI-Powered Tax Prep Tools (ProConnect)", publisher: "Intuit", type: vendor, url: "https://accountants.intuit.com/tax-software/tax-online/ai-features/", date: "2026-10-17", access: full, locator: "resource list entry 'AI Client Briefing' (title only; page undated)" }
    - { ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Regulatory Framework items 5 and 6" }
    - { ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW Insights (news item on the seven-body PCRT guidance)", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01-19", access: full, locator: "Fundamental principles: professional behaviour" }
    - { ref: TAS-AIBLOG-2024, title: "Is AI Generated Tax Advice Making the Grade?", publisher: "Taxpayer Advocate Service (IRS)", type: regulator, url: "https://www.taxpayeradvocate.irs.gov/news/tax-tips/is-ai-generated-tax-advice-making-the-grade/2024/06/", date: "2024-06", access: full, locator: "paragraph on the Washington Post review" }
  last_reviewed: "2026-10-17"
  notes: >-
    WCG's plan is described in its own post; the post describes a plan rather than current use for narratives, quoting
    and plan comparisons, so maturity is set to piloting. No named firm or accuracy evidence exists for correspondence
    drafting. Overlaps: tax-research-advisory-14 (memo and client email drafting); notice replies are
    tax-controversy-02.

- id: tax-compliance-individual-business-16
  title: Return assembly, delivery, e-signature and Form 8879 e-file authorisation automation
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [coordination-scheduling, document-production]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Assembling the return package, collecting signatures (including Form 8879, the e-file signature authorisation,
    routed to more than one signer) and taking payment are manual and error-prone.
  solution: >-
    Delivery and e-signature workflow tools (Thomson Reuters names SafeSend for the client side and SurePrep for the
    firm side), with the vendor claiming AI that recognises documents, extracts data and flags discrepancies. The
    pattern is other: mostly workflow automation with an AI layer claimed by the vendor.
  outcomes:
    - lever: speed
      description: "Thomson Reuters says firms using SafeSend save about 15 minutes on every return, with assembly and delivery taking three to four minutes against 20 or more for a manual process."
      figure: "about 15 minutes per return; about $12,000 per 1,000 returns delivered"
      measures: "vendor's statement; sample, baseline and method not given, and the same article urges readers to ask who checked such numbers"
      provenance: vendor-published
      source_ref: TR-TRUST7-2026
  prerequisites:
    - "Integration with the tax software the firm already runs (TR-TRUST7-2026)"
  risks_and_guardrails:
    - "Edge cases (a spouse who cannot find the signing link, failed identity checks, an 8879 routed to two signers in two states) are where platforms differ, so test the exception path (TR-TRUST7-2026)."
    - "Taxpayers sign the e-file authorisation after reviewing the return, and an e-file provider that makes substantive changes to a collected return becomes a preparer (IRS-PUB1345-2025)."
  human_checkpoints:
    - "The preparer signs the return; the article stresses that the tool will not be in the room when a position is questioned"
    - "Taxpayer reviews the return before signing Form 8879"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: C
  sources:
    - { ref: TR-TRUST7-2026, title: "Can you trust it? 7 questions to ask any platform that claims to handle your entire tax workflow", publisher: "Thomson Reuters Tax and Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/can-you-trust-it-7-questions-to-ask-any-platform-that-claims-to-handle-your-entire-tax-workflow/", date: "2026-10-14", access: full, locator: "questions 2, 4 and 5" }
    - { ref: IRS-PUB1345-2025, title: "Publication 1345: Handbook for Authorized IRS e-file Providers of Individual Income Tax Returns (Rev. 12-2025)", publisher: "Internal Revenue Service", type: regulator, url: "https://www.irs.gov/pub/irs-pdf/p1345.pdf", date: "2025-12", access: full, locator: "signature, ERO and Responsible Official passages" }
    - { ref: WCG-NOTREADY-2026, title: "AI Tax Prep in 2026: Not Quite There Yet", publisher: "WCG CPAs & Advisors", type: firm, url: "https://wcginc.com/blog/ai-tax-prep-in-2026-not-quite-there-yet/", date: "2026-07-24", access: full, locator: "Black Ore section (final steps stay in the tax software)" }
  last_reviewed: "2026-10-17"
  notes: >-
    Vendor marketing for a competitive evaluation; treat the minutes-per-return figure as a claim and the AI element
    as asserted, not evidenced. WCG says the final steps (diagnostics, e-file setup, Form 8879, delivery) still sit in
    the tax software even with AI pre-preparation (WCG-NOTREADY-2026, cited in tax-compliance-individual-business-05).

- id: tax-compliance-individual-business-17
  title: UK self assessment (SA100) and Making Tax Digital preparation with AI document processing
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, client-interaction]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    UK firms chase clients for information, review documents manually and re-key data into tax software for SA100
    returns and quarterly Making Tax Digital submissions (HMRC's digital record-keeping and reporting regime).
  solution: >-
    ApariPro says it automates client information collection, AI document processing (P60s and others), return
    population and submission, integrating with Wolters Kluwer's CCH iFirm so the team reviews rather than prepares.
    The vendor says the team stays in control of reviewing and approving all information before submission.
  outcomes:
    - lever: capacity
      description: "none published as figures. Anonymous testimonials say manual data entry and administrative effort fell; the site offers a savings calculator."
      figure: "none published"
      measures: "none published"
      provenance: vendor-published
      source_ref: APARIPRO-2026
  prerequisites:
    - "Integration with the firm's tax software (CCH iFirm is named)"
  risks_and_guardrails:
    - "The PCRT AI guidance (19 Jan 2026) says members remain responsible for work produced with AI, and that entering client data into a publicly available AI model without consent is likely to breach confidentiality (ATT-PCRTAI-2026, ICAEW-PCRT-2026)."
    - "HMRC expects continuous monitoring, version control and timely updates of code and data sources in tax software that uses generative AI, with human oversight (HMRC-GENAI-2026)."
  human_checkpoints:
    - "Team review and approval before submission"
  role_evolution: >-
    The vendor positions staff at review and advisory ("Stop preparing tax returns. Start reviewing them") (APARIPRO-2026).
  evidence_grade: C
  sources:
    - { ref: APARIPRO-2026, title: "ApariPro: AI powered tax preparation for accountancy firms", publisher: "ApariPro", type: vendor, url: "https://www.aparipro.com/", date: "2026-09-11", access: full, locator: "hero, workflow comparison table, FAQ (date is the page's modified time when re-read on 2026-10-17)" }
    - { ref: ATT-PCRTAI-2026, title: "Professional bodies issue AI advice to members", publisher: "Association of Taxation Technicians (for the PCRT bodies)", type: professional-body, url: "https://www.att.org.uk/technical/news/professional-bodies-issue-ai-advice-members", date: "2026-01-19", access: full, locator: "announcement text on PCRT topical guidance" }
    - { ref: ICAEW-PCRT-2026, title: "Professional Conduct in Relation to Taxation bodies publish guidance on using AI in tax", publisher: "ICAEW Insights (news item on the seven-body PCRT guidance)", type: professional-body, url: "https://www.icaew.com/insights/tax-news/2026/jan-2026/professional-conduct-in-relation-to-taxation-bodies-publish-guidance-on-using-ai-in-tax", date: "2026-01-19", access: full, locator: "summary of the 'Confidentiality' principle and 'responsible for any work they produce'" }
    - { ref: HMRC-GENAI-2026, title: "Guidelines for using generative artificial intelligence if you're a software developer", publisher: "HM Revenue & Customs (GOV.UK)", type: regulator, url: "https://www.gov.uk/guidance/guidelines-for-using-generative-artificial-intelligence-if-youre-a-software-developer", date: "2026-01-28", access: full, locator: "testing and deployment processes; human oversight paragraphs" }
  last_reviewed: "2026-10-17"
  notes: >-
    Includes HMRC's software-developer guidelines. The ApariPro page carries only a modified time; the Wolters Kluwer
    partnership is shown on ApariPro's page only. An IRIS (UK) anomaly-check tool was seen only in a search summary
    and is not used. No HMRC guidance on agents' use of AI for self assessment was found.

- id: tax-compliance-individual-business-18
  title: Phased adoption - simple returns first, scope gates and parallel runs on prior-year returns before scaling
  archetype: tax
  module: compliance-individual-business
  function: service-delivery
  work_types: [transaction-processing, review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Firms adopt on vendor claims and cannot say whether time, quality or cycle time improved. Vendors package
    document extraction, deduction suggestion and position drafting together, and in Werfel's preparer case study the
    proposed tool had no scope restriction, no oversight requirement and no phase boundary.
  solution: >-
    Practitioners advise using an AI preparation product for easier, data-entry-heavy returns first and keeping
    complex multi-state returns with staff; one product is priced per schedule, so cost tracks complexity. They also
    suggest running last year's returns through the product to compare with what was filed, trialling new workflows on
    a few dozen engagements and recording cycle times before the change. Werfel's case study (an idea) authorises the
    tool in phases: summarisation, extraction and research first; then AI-suggested deductions under mandatory
    independent verification; then AI-drafted positions. Expansion depends on gate conditions, for example a
    hallucination rate of 2% or less on the firm's return types and a Phase 2 error rate of 1% or less for 90 days,
    with automatic suspension if the error rate exceeds 1% in any 30-day window.
  outcomes:
    - lever: quality
      description: "none published. No firm has published the result of a parallel run on prior-year returns or of a gated, phased rollout."
      figure: "none published"
      measures: "no source measures the effect of phased adoption, parallel runs or gate conditions"
      provenance: self-reported
      source_ref: CPAPA-BLACKORE-2024
  prerequisites:
    - "A way to classify return complexity at intake, by schedule and state count (CPAPA-BLACKORE-2024)"
    - "Prior-year returns and source documents, and baseline measures captured before the change, such as median days from organizer sent to documents complete (CPAPA-POSTEXT-2026)"
    - "A named owner with authority to restrict or suspend the tool, and Phase 1 gate conditions such as a tested verification policy, confirmed logging, counsel-approved engagement letters and a vendor contract with an accuracy SLA (AICPA-WERFEL-2026, Appendix D, Steps 6-7)"
  risks_and_guardrails:
    - "The reviewer in the 2024 podcast said AI can break down on, for example, a return with 30 states if it has seen too few training instances (CPAPA-BLACKORE-2024)."
    - "Werfel's thresholds are illustrative figures in a hypothetical case study, not standards; the article presents the framework as 'a starting point' to be improved collaboratively, and says the views are the author's, not official AICPA policy (TAXADVISER-WERFEL-2026)."
    - "Werfel advises piloting with limited scope and testing thoroughly before scaling, and says a tool restricted to summarisation would not trigger malpractice exposure at meaningful intensity because no filed position is involved (TAXADVISER-WERFEL-2026)."
    - "In an adjacent month-end close study run by Mercor, an AI data company, accountants working with Claude took about 15 times longer per task than Claude alone, and in one session the participant overrode Claude's initial correct advice (ACCTODAY-AIBENCH-2026; accounting, not tax)."
  human_checkpoints:
    - "Reviewer compares the AI's version of a prior-year return with what was filed, as a podcast host suggests (CPAPA-BLACKORE-2024)"
    - "Sign-off on each phase: managing partner for Phase 1, senior partner and counsel for Phase 2, managing partner and general counsel for Phase 3 in Werfel's case study"
  role_evolution: >-
    Adoption becomes a governed programme owned by a partner rather than a tool a preparer starts using; Werfel's Phase
    3 gates include an annual check that staff can perform AI-assisted tasks without the tool (AICPA-WERFEL-2026).
    Commentators expect the main labour effect on outsourced services (see tax-compliance-individual-business-23).
  evidence_grade: C
  sources:
