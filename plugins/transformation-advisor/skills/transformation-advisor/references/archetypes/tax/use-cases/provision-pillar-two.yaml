# Use cases: tax / provision-pillar-two
# Income tax accounting under ASC 740 and IAS 12 (the provision), ASU 2023-09 disclosures, and the OECD global minimum
# tax (Pillar Two): GloBE calculations, safe harbours, the GloBE Information Return (GIR) and its XML filing, QDMTTs,
# and the data pipeline and audit overlap.
# Merged 2026-10-17 from one combined wave-2 deep dive (16 candidates; low-evidence module) plus items routed from other
# tax deep dives, into 16 entries. Every source was opened by the analyst (access: full); none is search-only.
# GRADES ARE FOR AI USE. Entries -09, -11, -12, -13, -15 and -16 describe rules-based software that is in production at
# named organisations, but no source shows AI doing that work. They are graded C for AI use, and each note says what the
# software evidence alone would earn. No entry has a measured AI outcome from a named organisation (no A or B for AI).
# Overlaps (published ids): research inside tools tax-compliance-corporate-11 and tax-research-advisory-01; ledger
# mapping tax-compliance-corporate-01 and -10; R&D credits tax-compliance-corporate-09; law-change monitoring
# tax-compliance-corporate-12 and tax-research-advisory-23; effective-tax-rate modelling and explainable ETR models
# tax-compliance-corporate-14 and -18 (not duplicated here); managed service tax-compliance-corporate-15.

- id: tax-provision-pillar-two-01
  title: Cited research and AI insights embedded in the provision and direct-tax workflow
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    After accounting closes the books, tax teams face immediate pressure to finish the provision; Bloomberg Tax pitches
    research answers and current rates inside the spreadsheets to reduce interruptions [BTAX-ASC740-2026].
  solution: >-
    Vendors place an AI assistant where the provision work happens. Bloomberg Tax describes AI-powered insights and
    current rates inside its Workpapers spreadsheets [BTAX-ASC740-2026]. Thomson Reuters says CoCounsel Tax was
    embedded in ONESOURCE direct tax solutions in late 2024 and can research uncertain tax positions and R&D credit
    qualification, with links to primary sources [TR-CORPAI-2026, TR-AGENTICCORP-2025]. Neither source names a customer.
  outcomes:
    - lever: speed
      description: Thomson Reuters says research that used to take hours now takes minutes.
      figure: hours to minutes
      measures: General statement about research tasks; no sample, baseline or method is stated.
      provenance: vendor-published
      source_ref: TR-AGENTICCORP-2025
  prerequisites:
    - "Provision workpapers and calculations held in the same vendor suite as the assistant, with Workpapers outputs pushed to Provision [BTAX-ASC740-2026]."
    - "Access to the vendor's research content (Checkpoint for CoCounsel Tax) [TR-AGENTICCORP-2025]."
  risks_and_guardrails:
    - "TR states that 91% of tax professionals believe AI outputs should be more accurate than human work and 41% will not use AI without human review unless it is 100% accurate; the article does not name the survey behind these two figures [TR-AGENTICCORP-2025]."
    - "Bloomberg Tax (selling its own tools) warns that a single reasoning error can cascade through provision calculations, ETR analysis and disclosures, and that generic tools can invent citations [BTAX-HALLUC-2026]."
  human_checkpoints:
    - "The preparer reads the linked primary sources before relying on an answer; TR says each response links to them and shows the reasoning chain [TR-AGENTICCORP-2025]."
  role_evolution: >-
    TR says junior staff can handle research that previously needed senior review [TR-AGENTICCORP-2025], a vendor
    claim. Sala argues the corporate tax function does tax practice (engagement with authorities, auditors and
    executives), not only preparation, so AI will shrink teams less than predicted [SALA-TAXNOTES-2026].
  evidence_grade: C
  sources:
    - {ref: BTAX-ASC740-2026, title: "Accelerate your ASC 740 process (Bloomberg Tax Research, Provision and Workpapers product page)", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/products/accelerate-your-asc-740-process/", date: "2026-03-25", access: full, locator: "Section 'Get research answers directly in your spreadsheets'"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Thomson Reuters: From compliance to intelligent compliance', paragraph 2"}
    - {ref: TR-AGENTICCORP-2025, title: "How agentic AI is transforming corporate tax departments", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/how-agentic-ai-is-transforming-corporate-tax-departments/", date: "2025-11-11", access: full, locator: "Sections 'Agentic AI: What is it, and why does it matter?' and the CoCounsel Tax paragraphs"}
    - {ref: BTAX-HALLUC-2026, title: "AI Hallucinations in Tax: The Risks and How to Mitigate Them", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/insights/artificial-intelligence/ai-hallucinations-in-tax-the-risks-and-how-to-mitigate-them/", date: "2026-05-11", access: full, locator: "Section 'Why does generative AI hallucinate?', third reason"}
    - {ref: SALA-TAXNOTES-2026, title: "AI Won't Shrink Corporate Tax Teams Much. Here's Why. (Tax Notes State 121:189; abstract on TaxProf Blog)", publisher: "Michael V. Sala / Tax Analysts (via TaxProf Blog)", type: academic, url: "https://taxprofblog.aals.org/2026/07/20/ai-wont-shrink-corporate-tax-teams-much-heres-why/", date: "2026-07-20", access: full, locator: "Abstract, paragraph 2"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-01. Generic tax research with AI sits in tax-research-advisory-01; research inside the compliance
    engine in tax-compliance-corporate-11. This entry covers only the embedding inside provision and direct-tax tools.
    No customer, error rate or override rate is published.

- id: tax-provision-pillar-two-02
