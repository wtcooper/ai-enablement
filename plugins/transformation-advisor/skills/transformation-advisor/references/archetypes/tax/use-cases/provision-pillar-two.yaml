  notes: >-
    From combined-06. KPMG's statement concerns building agents for clients in general, not provision or Pillar Two
    specifically. Return-side rule and calendar monitoring is tax-compliance-corporate-12; adviser impact notes are
    tax-research-advisory-23.

- id: tax-provision-pillar-two-09
  title: Pillar Two data collection seeded from validated country-by-country reporting data (rules-based software; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting]
  pattern: bulk-transformation
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Pillar Two data drives actual tax, unlike country-by-country reporting (CbCR), and needs more granular data than
    finance and CbCR processes held [ORBITAX-LEAN-2026]. TR says the first GIR required more than 100 data points that
    many existing systems did not capture [TR-CORPAI-2026].
  solution: >-
    AMG Critical Materials uploaded its existing, validated CbCR XML into Orbitax's Pillar Two Compliance Accelerator
    as the starting point, then completed the extra Pillar Two information [ORBITAX-AMG-2026]. A Swiss-parented insurer
    likewise built on its CbCR templates and added data elements [ORBITAX-LEAN-2026]. The sources describe software
    automation; none claims AI for this step.
  outcomes:
    - lever: speed
      description: Orbitax's case study says the Accelerator shortened AMG's path to implementation to around 10 days.
      figure: around 10 days
      measures: Time for AMG to implement Pillar Two data collection after uploading its existing validated CbCR XML; no baseline stated.
      provenance: vendor-published
      source_ref: ORBITAX-AMG-2026
  prerequisites:
    - "An existing validated CbCR XML file [ORBITAX-AMG-2026]."
    - "Close collaboration with accounting and finance teams in each jurisdiction to collect entity-level data [ORBITAX-LEAN-2026]."
  risks_and_guardrails:
    - "Pillar Two needed data beyond CbCR; the insurer found entities in Latin American jurisdictions newly in scope through the UK income inclusion rule [ORBITAX-LEAN-2026]."
    - "Small inconsistencies, such as sign conventions for related-party amounts, can move a jurisdiction's effective tax rate [ORBITAX-LEAN-2026]."
  human_checkpoints:
    - "The tax team completes and reviews the additional Pillar Two information; AMG says it kept control of the financial data [ORBITAX-AMG-2026]."
    - "The insurer used the platform as an independent check on its own Excel calculations [ORBITAX-LEAN-2026]."
  role_evolution: AMG's vice president of tax and one manager handled this without added headcount [ORBITAX-AMG-2026].
  evidence_grade: C
  sources:
    - {ref: ORBITAX-AMG-2026, title: "How AMG Brought Pillar Two Compliance In-House with Orbitax (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/amg-pillar-two-compliance-case-study", date: "2026-09-28", access: full, locator: "Sections 'Accelerating Implementation with Existing CbCR Data' and 'Results'"}
    - {ref: ORBITAX-LEAN-2026, title: "How a lean global tax team completed Swiss and UK Pillar Two filings ahead of deadline (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/how-a-lean-global-tax-team-completed-swiss-and-uk-pillar-two-filings", date: "2026-08-10", access: full, locator: "Section 'Data Integrity and Compliance Obstacles'"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'The regulatory crunch hitting direct tax right now', paragraph 3"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-08 (graded A there). Graded C here for AI use: the named deployment is rules-based software and the
    case study claims no AI; the only AI link is vendor positioning (Thomson Reuters presents Orbitax's Pillar Two
    tooling under AI in corporate tax, and Orbitax offers its XatBot assistant to GMT users, see -14). As evidence of software
    automation alone it would be grade A (named customer, vendor-published figure without a baseline). Maturity
    describes the software. Read as the strongest named evidence in the module, not as evidence of AI effect.

- id: tax-provision-pillar-two-10
  title: AI-assisted mapping of ERP data to GloBE data points (idea)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, software-systems]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    The GloBE rules need jurisdiction-level calculations built from entity-level data held in several ERPs, which EY
    calls a substantial change from single-entity income tax work [EY-P2DATA-2024]. Mapping tax data into a compliant
    XML structure takes significant technical skill [LUCANET-2025].
  solution: >-
    Idea: AI helps map data from different ERP systems to common data standards. EY's global compliance and reporting
    technology leader says AI can assist in this mapping, but standardisation is long-term and needs governance; the
    same EY article says intrinsic data-quality issues still need human correction [EY-P2DATA-2024].
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: EY-P2DATA-2024
  prerequisites:
    - "Secure, standardised data processes first; EY says automation and AI should follow them [EY-P2DATA-2024]."
  risks_and_guardrails:
    - "EY says AI can quickly spot incomplete or incorrect entries, but manual review and correction are needed [EY-P2DATA-2024]."
  human_checkpoints:
    - "Manual review and correction of flagged data issues [EY-P2DATA-2024]."
  role_evolution: No source describes role change.
  evidence_grade: D
  sources:
    - {ref: EY-P2DATA-2024, title: "How to alleviate BEPS 2.0 Pillar Two data challenges", publisher: "EY", type: firm, url: "https://www.ey.com/en_gl/insights/tax/how-to-alleviate-beps-2-0-pillar-two-data-challenges", date: "2024-11-22", access: full, locator: "Sections on data standards and 'AI drives the need for data standards'"}
    - {ref: LUCANET-2025, title: "Pillar Two and XML: The Digital Backbone of GloBE Reporting", publisher: "Lucanet", type: vendor, url: "https://www.lucanet.com/en/insights/regulatory-insights/pillar-two-and-xml-digital-backbone-globe-reporting-05-12-2025/", date: "2025-12-05", access: full, locator: "Section 'The practical challenges for MNEs'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. From combined-09. The EY article is from November 2024, older than the preferred window. Intercompany data
    aggregation across ERPs for transfer pricing is tax-transfer-pricing-04.

- id: tax-provision-pillar-two-11
  title: Pillar Two computation with safe-harbour tests, scenarios and interim provision estimates (rules-based engines; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [transaction-processing, data-reporting]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    GloBE calculations must be run by jurisdiction, and the rules keep changing: the Side-by-Side package added a
    permanent simplified ETR safe harbour and extended the transitional CbCR safe harbour to 1 January 2027, and a
    revised GIR followed on 11 September 2026 [OECD-SBS-2026, OECD-P2-SEP-2026].
  solution: >-
    Purpose-built engines hold the rules, run safe-harbour tests, and run compliance, provision, modelling and scenario
    work from one data set. EY's GloBE Engine runs multiple projects (compliance, provision, modelling, scenario
    planning, CbCR) [EY-GLOBE-ENGINE-2026]. Deloitte's Pillar Two Agent covers safe-harbour calculations, accruals,
    estimates and compliance [DELOITTE-P2BROCH-2024]. AMG used Orbitax for first-year compliance [ORBITAX-AMG-2026].
    These are rules-based tools; the sources do not describe them as AI.
  outcomes:
    - lever: quality
      description: >-
        A Swiss-parented insurer (unnamed) ran the platform as an independent check on its Excel calculations; it says
        this surfaced data issues before filing and that it knew in December it was in a safe-harbour position in every
        jurisdiction.
      figure: null
      measures: "None; qualitative customer statement, and the organization is not named."
      provenance: vendor-published
      source_ref: ORBITAX-LEAN-2026
  prerequisites:
    - "Entity-level data collected and validated in the platform [ORBITAX-AMG-2026, EY-GLOBE-ENGINE-2026]."
    - "Tracking each OECD release (administrative guidance, safe-harbour rules, GIR technical artefacts), which Wolters Kluwer says affects calculations, safe-harbour eligibility and filing mechanics [WK-PILLAR2-2026]."
  risks_and_guardrails:
    - "Pillar Two calculations are sensitive to individual data elements [ORBITAX-LEAN-2026]."
    - "KPMG UK recommends early dialogue with auditors on financial reporting while Side-by-Side legislation is pending [OECD-SBS-2026]."
  human_checkpoints:
    - "EY's engine provides dashboards and reports for the team to review before filing [EY-GLOBE-ENGINE-2026]."
    - "In-scope groups must assess the Side-by-Side components themselves, including the end of the transitional CbCR safe harbour and the new ETR safe harbour [OECD-SBS-2026]."
  role_evolution: AMG ran this with a two-person tax function and no extra headcount [ORBITAX-AMG-2026].
  evidence_grade: C
  sources:
    - {ref: EY-GLOBE-ENGINE-2026, title: "Introducing EY GloBE Engine (slipsheet)", publisher: "EY", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/tax/documents/ey-gl-globe-engine-slipsheet-06-2026.pdf", date: "2026-06", access: full, locator: "Page 2, 'EY GloBE Engine: your Pillar Two command center'"}
    - {ref: DELOITTE-P2BROCH-2024, title: "Facilitating your Pillar Two compliance and reporting obligations (Pillar Two Agent brochure)", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2024/dttl-pillar-two-agent.pdf", date: "2024-05-15", access: full, locator: "Page 2, 'One-stop shop'"}
    - {ref: ORBITAX-AMG-2026, title: "How AMG Brought Pillar Two Compliance In-House with Orbitax (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/amg-pillar-two-compliance-case-study", date: "2026-09-28", access: full, locator: "Sections 'Choosing to Bring Pillar Two In-House' and 'Results'"}
    - {ref: ORBITAX-LEAN-2026, title: "How a lean global tax team completed Swiss and UK Pillar Two filings ahead of deadline (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/how-a-lean-global-tax-team-completed-swiss-and-uk-pillar-two-filings", date: "2026-08-10", access: full, locator: "Section 'Selecting Orbitax for Pillar Two Compliance'"}
    - {ref: OECD-SBS-2026, title: "Further details on the OECD Pillar Two 'Side-by-Side' package (KPMG UK Tax Matters Digest; the OECD package was released 5 January 2026)", publisher: "KPMG UK", type: firm, url: "https://kpmg.com/uk/en/insights/tax/tmd-further-details-on-the-oecd-pillar-two-side-by-side-package.html", date: "2026-01-21", access: full, locator: "Paragraphs 1-4"}
    - {ref: OECD-P2-SEP-2026, title: "OECD Releases New Pillar Two Guidance, Updated GIR And Framework For Legislative Reviews (Loyens & Loeff; the OECD package was released 11 September 2026)", publisher: "Loyens & Loeff via Mondaq", type: firm, url: "https://www.mondaq.com/oecd-releases-new-pillar-two-guidance-updated-gir-and-framework-for-legislative-reviews/1842556", date: "2026-09-14", access: full, locator: "Section 'Updated GIR'"}
    - {ref: WK-PILLAR2-2026, title: "BEPS Pillar Two Technology Procurement Guide", publisher: "Wolters Kluwer", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/beps-pillar-two-procurement-checklist", date: "2026-02-16", access: full, locator: "Section 'Why technology matters now'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-10 (graded B there). Graded C for AI use: deterministic automation, not AI; the pattern value
    describes the shape of the workflow, not an agent. As software evidence alone it would be grade B (AMG named,
    outcome qualitative). No error rate, parallel-run or override figure is published.

- id: tax-provision-pillar-two-12
  title: GloBE Information Return population, XML generation, validation and direct transmission (rules-based platforms; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, software-systems]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    For many groups the first GIR season (due 30 June 2026) was an XML problem more than a tax-law problem
    [FGS-GIR-2026]. Germany and the Netherlands adopted the OECD schema largely unchanged, while Luxembourg, France and
    Austria changed it, so vendors kept several country variants [FGS-GIR-2026]. National portals with business rules
    acted as gatekeepers; some opened days or weeks before the deadline, and the OECD schema itself held errors and
    conflicting rules [FGS-GIR-2026, BTAX-KPMG-GIR-2026]. KPMG International authors say that, based on KPMG's
    experience, only 20% of GIRs were filed successfully before the initial deadline in some jurisdictions, where the
    vast majority failed initial validation checks [BTAX-KPMG-GIR-2026]. The OECD issued guidance on 8 June 2026 with fixes, workarounds and switched-off validation
    rules [OECDPILLARS-GIRXML-2026].
  solution: >-
    Platforms populate the GIR from calculation outputs, generate the XML, validate it against schema and OECD content
    rules, and send it by machine-to-machine link where authorities allow. Orbitax reports an M2M GIR submission to the
    Netherlands (3 June 2026), support for UK, Canada, Germany and Dutch submissions, and ATO transmission of Australian
    returns [ORBITAX-NL-2026, ORBITAX-ATO-2026]. EY's engine and Deloitte's Pillar Two Agent generate XML files for
    filing [EY-GLOBE-ENGINE-2026, DELOITTE-P2BROCH-2024]. The sources describe rules-based tooling; none claims AI here.
  outcomes:
    - lever: capacity
      description: Orbitax says it prepared or submitted more than 1,700 Pillar Two filings across 34 jurisdictions.
      figure: "1,700+"
      measures: Pillar Two filings prepared or submitted through Orbitax's platform across 34 jurisdictions between November 2025 and June 2026; more than 60% of filing activity was notifications and self-assessment returns rather than GIRs.
      provenance: vendor-published
      source_ref: ORBITAX-SEASON-2026
    - lever: risk
      description: An unnamed Swiss-parented insurer filed Swiss and UK GIRs on 24 June 2026, six days before the 30 June deadline, after a first Swiss submission was rejected over an apostrophe in one entity name.
      figure: 6 days before the deadline
      measures: Date of successful Swiss and UK GIR filings against the 30 June 2026 deadline; customer not named.
      provenance: vendor-published
      source_ref: ORBITAX-LEAN-2026
  prerequisites:
    - "Validated entity data and a tested XML before the portal opens; FGS says Germany's test environment was available only briefly and many groups could not test under real conditions [FGS-GIR-2026]."
    - "Local credentials; AMG needed a Dutch certificate for submission [ORBITAX-AMG-2026]."
    - "Tracking OECD business-rule changes; four OECD rules (60025, 60026, 70092, 70028) were switched off after the first season [FGS-GIR-2026]."
  risks_and_guardrails:
    - "The OECD sets a 1% tolerance for calculation-based business rules, but FGS says some national implementations, notably Austria's, rejected technically correct files; in individual cases PDF submission was a fallback [FGS-GIR-2026]."
    - "Revised GIR for fiscal years commencing on or after 31 December 2025, with a revised XML schema expected [OECD-P2-SEP-2026]."
    - "Corrections are possible only against accepted messages and replace whole sections, not single fields [FGS-GIR-2026]."
  human_checkpoints:
    - "The tax team reviews validation results and resolves errors; the insurer called this the most demanding part of the season [ORBITAX-LEAN-2026]."
  role_evolution: >-
    Orbitax says understanding local filing obligations became as important as the calculations, and that teams still
    had reviews, approvals, validation checks and submissions to manage once calculations were done
    [ORBITAX-SEASON-2026]. Lucanet says mapping tax data into a compliant XML structure takes significant technical
    skill [LUCANET-2025].
  evidence_grade: C
  sources:
    - {ref: FGS-GIR-2026, title: "XML statt Steuerrecht: Die wahren Herausforderungen der ersten Pillar-2-Saison (German)", publisher: "Flick Gocke Schaumburg", type: firm, url: "https://www.fgs.de/news-and-insights/blog/detail/xml-statt-steuerrecht-die-wahren-herausforderungen-der-ersten-pillar-2-saison", date: "2026-08-03", access: full, locator: "Sections on country variants, business rules, schema gaps, deactivated rules and corrections"}
    - {ref: BTAX-KPMG-GIR-2026, title: "Pillar Two's First Real Test Has Lessons for 2027 Filing Season (Conrad Turley and Tam Do, KPMG International)", publisher: "Bloomberg Tax (Daily Tax Report)", type: firm, url: "https://news.bloombergtax.com/daily-tax-report/pillar-twos-first-real-test-has-lessons-for-2027-filing-season", date: "2026-08-21", access: full, locator: "Sections 'Filing template tribulations' and 'Tax authority filing portals late to go live'"}
    - {ref: OECD-GIR-XML, title: "GloBE Information Return (Pillar Two) XML Schema: User Guide for Tax Administrations", publisher: "OECD", type: regulator, url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/01/globe-information-return-pillar-two-xml-schema_3980638f/c594935a-en.pdf", date: "2025-01", access: full, locator: "Pages 6-8, field requirement and validation rules for the XML schema"}
    - {ref: OECDPILLARS-GIRXML-2026, title: "The OECD releases June 2026 Guidance on the use of the GIR XML Schema for first GloBE filings", publisher: "OECDPillars.com (independent site, not affiliated with the OECD)", type: press, url: "https://oecdpillars.com/2026/06/08/", date: "2026-06-08", access: full, locator: "Full post"}
    - {ref: ORBITAX-NL-2026, title: "Orbitax Completes First GIR Submission to the Netherlands and Expands Global Pillar Two Filing Readiness", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/solutions/global-minimum-tax-gmt/orbitax-completes-first-gir-submission-to-the-netherlands-and-expands-global-pillar-two-filing-readiness", date: "2026-06-03", access: full, locator: "Paragraphs 1-4"}
