    - {ref: OECD-P2-SEP-2026, title: "OECD Releases New Pillar Two Guidance, Updated GIR And Framework For Legislative Reviews (Loyens & Loeff; the OECD package was released 11 September 2026)", publisher: "Loyens & Loeff via Mondaq", type: firm, url: "https://www.mondaq.com/oecd-releases-new-pillar-two-guidance-updated-gir-and-framework-for-legislative-reviews/1842556", date: "2026-09-14", access: full, locator: "Section 'Updated GIR'"}
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Section 'Step 3: Deferred Tax Assets and Liabilities'"}
