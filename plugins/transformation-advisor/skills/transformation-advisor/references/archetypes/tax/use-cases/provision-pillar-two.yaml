    Idea. From combined-15. The TEI lab is a generic accountants' session, not provision-specific, and the source is a
    preliminary programme, so it shows what was scheduled, not what took place.

- id: tax-provision-pillar-two-03
  title: Provision data assembly and the close-to-tax handoff
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    The provision runs on financial data from the close. Kognitos (a vendor) calls the handoff from close to tax an
    often manual, error-prone junction and says tax accuracy is decided in the source data, not the calculation
    [KOGNITOS-2026]. Kognitos cites an unnamed analysis that 58% of tax departments are under-resourced; the same
    figure appears in Thomson Reuters' 2025 survey of 288 tax departments [TR-CORPTAX-2025].
  solution: >-
    Bloomberg Tax describes automated data cleansing, rollforwards and book-to-tax adjustments in Workpapers that push
    into Provision [BTAX-ASC740-2026]. Thomson Reuters says its aim is agentic AI that handles data import, validation
    and mapping while tax professionals keep oversight [TR-CORPAI-2026]. Kognitos positions an agentic layer upstream
    of the tax engines that pulls and reconciles ledger data with every step logged, and says it does not calculate
    the provision [KOGNITOS-2026].
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: KOGNITOS-2026
  prerequisites:
    - "Consistent chart-of-accounts mapping, clean entity hierarchies and documented lineage from ledger to provision input; this is Finrep's advice, not a measured requirement [FINREP-ASC740-2026]."
    - "Financial data that is final from the close [KOGNITOS-2026]."
  risks_and_guardrails:
    - "Finrep says AI inherits every error in the source data, and that teams that skip data cleanup can get a longer review list rather than a shorter one [FINREP-ASC740-2026]."
    - "Kognitos says its steps are logged so the data preparation is auditable, because the provision feeds audited statements [KOGNITOS-2026]."
  human_checkpoints:
    - "No source says who reviews the exceptions; Kognitos says its platform reasons about exceptions and logs every step before data reaches the provision engine [KOGNITOS-2026]."
    - "Direct tax professionals keep oversight of import, validation and mapping [TR-CORPAI-2026]."
  role_evolution: >-
    Kognitos says automation frees tax teams for forecasting, modelling and advisory work [KOGNITOS-2026], and TR says
    professionals keep oversight and focus on judgment-intensive work [TR-CORPAI-2026]; these are vendor statements
    with no measured change in roles.
  evidence_grade: C
  sources:
    - {ref: BTAX-ASC740-2026, title: "Accelerate your ASC 740 process (Bloomberg Tax Research, Provision and Workpapers product page)", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/products/accelerate-your-asc-740-process/", date: "2026-03-25", access: full, locator: "Sections 'Automate book-to-tax adjustments' and 'Clean, map, and export your data with ease'"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Thomson Reuters: From compliance to intelligent compliance', paragraph 1"}
    - {ref: KOGNITOS-2026, title: "AI for Corporate Tax and Provision Automation (2026)", publisher: "Kognitos", type: vendor, url: "https://www.kognitos.com/blog/ai-corporate-tax-provision-automation-2026/", date: "2026-06-17", access: full, locator: "Sections 'The split: tax engines vs the data layer' and FAQ 'How does AI help with the close-to-tax handoff?'"}
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Section 'Step 1: Book-to-Tax Difference Identification'"}
    - {ref: TR-CORPTAX-2025, title: "Why most tax departments aren't using AI yet (reporting the 2025 State of the Corporate Tax Department report)", publisher: "Thomson Reuters Tax & Accounting / Thomson Reuters Institute", type: survey, url: "https://tax.thomsonreuters.com/blog/the-genai-paradox-why-most-tax-departments-arent-using-ai-yet-and-what-early-adopters-are-gaining-tri/", date: "2025-10-22", access: full, locator: "Highlights, second bullet"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-02. Much of this is rules-based automation rather than generative AI; the sources use 'AI' loosely.
    The general ledger-to-tax mapping step is tax-compliance-corporate-01 and -10; this entry covers the provision
    input. A search extract of a ChatFin guide claimed a provision cycle cut from 5-7 to 2-4 business days; that page
    was not opened and the figure is excluded.

- id: tax-provision-pillar-two-04
  title: Pre-close anomaly flagging and document comparison in provision review
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [review-assurance]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Reviewers must catch outliers in deferred tax balances, rate reconciliation lines and source documents before the
    provision is final. Finrep describes comparing current-period deferred tax balances with historical patterns and
    flagging outliers for human review before close [FINREP-ASC740-2026].
  solution: >-
    CSC Corptax lists PDF comparison to streamline document analysis on its AI/ML roadmap [CORPTAX-2026]. Thomson
    Reuters advertised for a product specialist to develop, test and validate generative AI and intelligent automation
    for ONESOURCE Tax Provision, including document understanding, automated reconciliation, anomaly detection and
    AI-assisted review [TR-JOB-2026]. Both are development signals, not shipped features with named users.
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: TR-JOB-2026
  prerequisites:
    - "Clean source data first; Finrep says that without data cleanup, AI-assisted difference identification flags noise alongside signal and lengthens the review list [FINREP-ASC740-2026]."
  risks_and_guardrails:
    - "The TR posting asks for awareness of auditability, explainability and appropriate AI use in regulated accounting and tax settings [TR-JOB-2026]."
    - "Finrep says valuation allowance and uncertain tax position recognition remain human judgments that AI should not make [FINREP-ASC740-2026]."
  human_checkpoints:
    - "Flagged outliers go to human review before close [FINREP-ASC740-2026]."
  role_evolution: >-
    Thomson Reuters wants practitioners with 5-7 years of provision experience to judge AI accuracy and fitness for
    high-stakes tax work [TR-JOB-2026], so experienced provision staff are being hired to validate AI features.
  evidence_grade: C
  sources:
    - {ref: CORPTAX-2026, title: "AI and ML in Tax: Applications, Considerations, and Responsible Engagement (webinar page with Corptax AI/ML roadmap)", publisher: "CSC Corptax with ACT", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "'Corptax AI/ML roadmap' bullet list"}
    - {ref: TR-JOB-2026, title: "Senior Tax Product Specialist, ONESOURCE Tax Provision (job posting, via Ann Arbor USA job board)", publisher: "Thomson Reuters", type: job-posting, url: "https://jobs.annarborusa.org/companies/thomson-reuters/jobs/83860571-senior-tax-product-specialist", date: "2026-06-24", access: full, locator: "Section 'Product Roadmap Delivery & AI', second bullet; qualifications on generative AI and responsible AI"}
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Sections 'Step 1: Book-to-Tax Difference Identification' (pitfall) and 'Step 3: Deferred Tax Assets and Liabilities'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-03. Return-side anomaly flagging is tax-compliance-corporate-03. Corptax's roadmap also lists audit
    prediction (see tax-compliance-corporate-13 and the controversy module). Finrep's table classes anomaly detection
    as machine learning, not generative AI.

- id: tax-provision-pillar-two-05
  title: ASU 2023-09 rate reconciliation and income-taxes-paid disclosure assembly
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, document-production]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    ASU 2023-09 requires public business entities to give a tabular rate reconciliation in percentages and amounts by
    specific categories, with certain reconciling items at or above 5% of the statutory tax broken out by nature or
    jurisdiction, and income taxes paid split between federal, state/local and foreign [KPMG-ASU-2023]. It applies to
    public business entities for annual periods in fiscal years beginning after 15 December 2024 and to other entities
    after 15 December 2025 [KPMG-ASU-2023]. Thomson Reuters lists it among the pressures on corporate tax departments
    [TR-AGENTICCORP-2025].
  solution: >-
    Finrep says AI-assisted categorization of reconciling items from ERP and tax-system data is the practical answer,
    and says Bloomberg Tax Provision and ONESOURCE have adapted rate reconciliation modules [FINREP-ASC740-2026].
    Neither vendor's own page was found to confirm this.
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: FINREP-ASC740-2026
  prerequisites:
    - "Jurisdiction-level and category-level data for pre-tax income, tax expense and cash taxes paid, which Finrep says legacy Excel processes struggle to produce [FINREP-ASC740-2026]."
  risks_and_guardrails:
    - "Finrep says how reconciling items are classified and described for SEC comment-letter purposes stays a human judgment [FINREP-ASC740-2026]."
    - "Finrep says the SEC Division of Corporation Finance has a history of challenging rate-reconciliation explanations, so generic AI-categorised narratives carry comment-letter risk; this is the vendor's statement and was not checked against SEC letters [FINREP-ASC740-2026]."
  human_checkpoints:
    - "The tax director reviews and approves the categorisation and the narrative [FINREP-ASC740-2026]."
  role_evolution: No source describes a change in roles for this step.
  evidence_grade: C
  sources:
    - {ref: KPMG-ASU-2023, title: "FASB issues ASU to disaggregate income tax disclosures (Defining Issues)", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/frv/reference-library/2023/fasb-issues-asu-to-disaggregate-income-tax-disclosures.html", date: "2023-12", access: full, locator: "Sections 'Relevant dates' and 'Key Impacts'"}
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Section 'Step 6: Rate Reconciliation'"}
    - {ref: TR-AGENTICCORP-2025, title: "How agentic AI is transforming corporate tax departments", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/how-agentic-ai-is-transforming-corporate-tax-departments/", date: "2025-11-11", access: full, locator: "Section 'Navigating the perfect storm in tax', paragraph 1"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-04. The workload driver is well documented; the AI response is only a vendor's description. No
    public customer, accuracy or time figure was found.

- id: tax-provision-pillar-two-06
  title: Generative AI first draft of income tax footnote disclosures and rate-reconciliation narrative (idea)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Tax disclosures must be company-specific and consistent with the provision; Finrep says generic AI language risks
    SEC comment letters [FINREP-ASC740-2026].
  solution: >-
    Idea: generative AI drafts disclosure language from provision data and prior-year disclosures, and a tax
    professional reviews and approves it. Finrep describes this workflow and says Big Four firms are piloting it, but
    gives no source for that attribution [FINREP-ASC740-2026]. The PCAOB's outreach found preparers using GenAI for
    initial drafts of internal documents and for some account reconciliations, not specifically tax disclosures
    [PCAOB-GENAI-2024].
  outcomes:
    - lever: speed
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: FINREP-ASC740-2026
  prerequisites:
    - "Provision data and prior-year disclosures as inputs [FINREP-ASC740-2026]."
  risks_and_guardrails:
    - "Finrep says drafts may be accurate but generic, and miss company-specific judgments on valuation allowances or uncertain positions [FINREP-ASC740-2026]."
    - "PCAOB staff report that preparers raise the black-box nature of some GenAI tools and inconsistent output as audit-ability concerns [PCAOB-GENAI-2024]."
  human_checkpoints:
    - "A tax professional reviews, edits and approves every draft [FINREP-ASC740-2026]."
    - "PCAOB staff report that preparers stress human review of GenAI output [PCAOB-GENAI-2024]."
  role_evolution: No source describes role change.
  evidence_grade: D
  sources:
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Section 'Step 7: Footnote Disclosure Drafting'"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative Artificial Intelligence in Audits and Financial Reporting", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "Pages 5-6, 'Observations Related to GenAI Integration in Financial Reporting'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. From combined-05. The only tax-specific description is a vendor blog; its claim that Big Four firms are
    piloting this, and its 29% adoption figure attributed to an EY survey, could not be traced and are not used.

- id: tax-provision-pillar-two-07
  title: Live R&D credit data feeding provision estimates
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    TR says R&D credit amounts in the provision can rest on estimates or prior-year placeholders rather than live data
    [TR-CORPAI-2026]. The revised IRS Form 6765 adds business-component reporting that TR says becomes mandatory for
    tax year 2026 returns [TR-CORPAI-2026].
  solution: >-
    Neo.Tax connects to project-management and engineering tools, groups the data into candidate business components,
    applies the four-part test, and reconciles payroll and ledger data to allocate costs. TR says that, because the
    data is live, the credit can be visible in real time and this can reduce return-to-provision adjustments
    [TR-CORPAI-2026].
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: TR-CORPAI-2026
  prerequisites:
    - "Project-management and engineering tools where R&D work is recorded as it happens, plus payroll and ledger feeds [TR-CORPAI-2026]."
  risks_and_guardrails:
    - "TR says the credit position rests on contemporaneous documentation that meets IRS expectations [TR-CORPAI-2026]; a claimed benefit, not a tested one."
  human_checkpoints:
    - "No source describes the review step."
  role_evolution: No source describes role change.
  evidence_grade: C
  sources:
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Sections 'The regulatory crunch hitting direct tax right now' and 'Neo.Tax: Automating R&D credits under the new IRS rules', 'Real-time provision and prior-year audit support'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-07. The R&D credit study and Form 6765 work itself is tax-compliance-corporate-09; this entry covers
    only the claimed provision effect. Vendor description with no named customer.

- id: tax-provision-pillar-two-08
  title: Law-change and guidance monitoring feeding the provision and Pillar Two compliance
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [research-synthesis, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Enacted-law changes drive deferred tax remeasurement, and Pillar Two rules keep moving: the Side-by-Side package of
    5 January 2026 and a second OECD package with a revised GIR on 11 September 2026 [OECD-SBS-2026, OECD-P2-SEP-2026].
    Finrep notes that a rate change signed into law but not yet effective forces immediate remeasurement of deferred
    balances [FINREP-ASC740-2026].
  solution: >-
    Orbitax says its Tax Flows mode (formerly XatBot Monitor) tracks regulatory changes [ORBITAX-XATBOT-2026];
    Thomson Reuters adds that it distributes comparison reports to stakeholders [TR-CORPAI-2026]. CSC Corptax lists tax code version tracking on its roadmap
    [CORPTAX-2026]. KPMG US's tax vice chair says building an AI agent to help clients adjust to changing tax rules
    went from weeks to minutes on KPMG's Digital Gateway with Claude [KPMG-ANTHROPIC-2026].
  outcomes:
    - lever: speed
      description: KPMG says building an agent to help clients adjust to changing tax regulations now takes minutes rather than weeks.
      figure: weeks to minutes
      measures: Time to build an AI agent for adjusting to changing tax regulations, as stated by KPMG US's Vice Chair, Tax; no sample or baseline given.
      provenance: self-reported
      source_ref: KPMG-ANTHROPIC-2026
  prerequisites:
    - "For Orbitax Tax Flows, a XatBot subscription on the Orbitax International Tax Platform [ORBITAX-XATBOT-2026]."
  risks_and_guardrails:
    - "Orbitax adds a Verification tab that scores each key point High, Medium or Low against its database and live web sources [ORBITAX-XATBOT-2026]; this is a vendor control, not independently tested."
    - "Bloomberg Tax notes that models trained on static data can give outdated tax guidance [BTAX-HALLUC-2026]."
  human_checkpoints:
    - "No source describes the review step; TR says the comparison reports go to stakeholders [TR-CORPAI-2026]."
  role_evolution: No source describes role change.
  evidence_grade: C
  sources:
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Orbitax: International tax intelligence and the Pillar Two deadline', 'Tax Flows'"}
    - {ref: ORBITAX-XATBOT-2026, title: "XatBot's Latest Release: Autopilot, Deep Research, MCP Connections, and Intelligent Tax Skills", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/announcements/xatbots-latest-release-autopilot-deep-research-mcp-connections-and-intelligent-tax-skills", date: "2026-04-19", access: full, locator: "Introduction (three modes) and 'Verification Tab'"}
    - {ref: CORPTAX-2026, title: "AI and ML in Tax: Applications, Considerations, and Responsible Engagement (webinar page with Corptax AI/ML roadmap)", publisher: "CSC Corptax with ACT", type: vendor, url: "https://go.corptax.com/act-ai-ml-tax", date: "2026", access: full, locator: "'Tax code version tracking' roadmap bullet"}
    - {ref: KPMG-ANTHROPIC-2026, title: "KPMG Partners with Anthropic for Digital Gateway Powered by Claude", publisher: "CPA Practice Advisor (reproducing the KPMG and Anthropic announcement)", type: press, url: "https://www.cpapracticeadvisor.com/2026/05/20/kpmg-partners-with-anthropic-for-digital-gateway-powered-by-claude/183743/", date: "2026-05-20", access: full, locator: "Quote from Rema Serafi, Vice Chair, Tax at KPMG US"}
