- id: tax-provision-pillar-two-13
  title: GIR correction and amendment management with DocRefId tracking (rules-based app; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, coordination-scheduling]
  pattern: bulk-transformation
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    The GIR schema handles corrections through MessageTypeIndic, DocTypeIndic, DocRefId and CorrDocRefId (reference
    fields that link a correction to the original message); corrections work only against already accepted messages,
    and affected sections must be replaced in full [FGS-GIR-2026]. FGS expects the number of corrections to rise
    because of deactivated rules and later OECD clarifications, and says groups must document submitted XML history and
    references in an audit-proof way [FGS-GIR-2026].
  solution: >-
    FGS says its Pillar 2 Management App already supports correction returns and has largely automated the management
    and referencing of corrected DocRefIds [FGS-GIR-2026]. FGS names no client.
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: FGS-GIR-2026
  prerequisites:
    - "A versioned history of every XML file submitted and its reference IDs [FGS-GIR-2026]."
  risks_and_guardrails:
    - "A wrong reference to a corrected document breaks the correction chain; the schema allows no field-level correction [FGS-GIR-2026]."
  human_checkpoints:
    - "No source describes the review step."
  role_evolution: No source describes role change.
  evidence_grade: C
  sources:
    - {ref: FGS-GIR-2026, title: "XML statt Steuerrecht: Die wahren Herausforderungen der ersten Pillar-2-Saison (German)", publisher: "Flick Gocke Schaumburg", type: firm, url: "https://www.fgs.de/news-and-insights/blog/detail/xml-statt-steuerrecht-die-wahren-herausforderungen-der-ersten-pillar-2-saison", date: "2026-08-03", access: full, locator: "Sections 'Der nächste große Fokus: Korrekturerklärungen' and 'Fazit'"}
  last_reviewed: "2026-10-17"
  notes: From combined-12. One firm's own statement about its own app. Not AI.

- id: tax-provision-pillar-two-14
  title: Conversational copilot over live Pillar Two scenarios
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, research-synthesis, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    After the calculations are done, the work left is reviewing jurisdiction and entity data, answering finance and
    audit-committee questions, validating XML and documenting decisions; Orbitax calls these workflow problems, not
    research problems [ORBITAX-XATBOTPRO-2026, TR-CORPAI-2026].
  solution: >-
    Orbitax says its XatBot assistant can read a team's live GMT (global minimum tax) scenarios and answer questions in
    natural language (for example, which jurisdictions have a GloBE ETR below 15%), analyse uploaded CSV files for
    outliers, run Deep Research reports on Pillar Two questions, draft emails and PowerPoint updates for the audit
    committee, and, in Autopilot mode, create and navigate scenarios from a conversation [ORBITAX-XATBOTPRO-2026]. A
    Pillar Two and GloBE 'Skill' standardises answers across the team [ORBITAX-XATBOTPRO-2026]. Orbitax offered Pro+ at
    no extra cost to GMT users from the 4 May 2026 post until 30 June 2026 [ORBITAX-XATBOTPRO-2026].
  outcomes:
    - lever: speed
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: ORBITAX-XATBOTPRO-2026
  prerequisites:
    - "Scenarios and entity data already in the Orbitax platform [ORBITAX-XATBOTPRO-2026]."
    - "Optional MCP connections to data warehouses, document stores and ERPs [ORBITAX-XATBOT-2026]."
  risks_and_guardrails:
    - "Orbitax's Verification tab scores each key point against its database and the web, and Orbitax says High-confidence points can go into a filing file 'with appropriate professional judgment applied', without a separate manual verification step [ORBITAX-XATBOTPRO-2026]; this is the vendor's claim, not an independent test."
    - "Deep Research during the beta was limited to five requests a month [ORBITAX-XATBOTPRO-2026]."
  human_checkpoints:
    - "Autopilot lets the user review the generated workflow before it runs, or launch it immediately [ORBITAX-XATBOT-2026]."
    - "Professional judgment on anything entering a filing file [ORBITAX-XATBOTPRO-2026]."
  role_evolution: >-
    No source quantifies role change. Orbitax's case study says XatBot helped the unnamed insurer's lean team work
    through many day-to-day issues in the filing season [ORBITAX-LEAN-2026].
  evidence_grade: C
  sources:
    - {ref: ORBITAX-XATBOTPRO-2026, title: "XatBot Pro+ now free for Orbitax GMT Users to make your June 2026 Pillar Two filing season easier", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/announcements/xatbot-pro-now-free-for-orbitax-gmt-users-to-make-your-june-2026-pillar-two-filing-season-easier", date: "2026-05-04", access: full, locator: "Sections 'Autopilot', 'Live scenario analysis', 'Deep Research', 'Response Verification', 'CSV uploads'"}
    - {ref: ORBITAX-XATBOT-2026, title: "XatBot's Latest Release: Autopilot, Deep Research, MCP Connections, and Intelligent Tax Skills", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/announcements/xatbots-latest-release-autopilot-deep-research-mcp-connections-and-intelligent-tax-skills", date: "2026-04-19", access: full, locator: "Sections 'Automate Multi-Step Workflows with Autopilot', 'Connect XatBot to Your Entire Workflow with MCP'"}
    - {ref: ORBITAX-LEAN-2026, title: "How a lean global tax team completed Swiss and UK Pillar Two filings ahead of deadline (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/how-a-lean-global-tax-team-completed-swiss-and-uk-pillar-two-filings", date: "2026-08-10", access: full, locator: "Section 'Managing the Filing Season and Technical Hurdles', paragraph 1"}
    - {ref: TR-CORPAI-2026, title: "AI in corporate tax: 2026 key trends and use cases", publisher: "Thomson Reuters Tax & Accounting", type: vendor, url: "https://tax.thomsonreuters.com/blog/ai-in-corporate-tax-key-trends-use-cases-and-whats-next/", date: "2026-07-01", access: full, locator: "Section 'Orbitax', 'A workflow problem, not a research problem'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-13. The only generative-AI product found that is built into a Pillar Two engine. The customer using
    it is unnamed, so maturity stays 'announced'. No accuracy, hallucination or override measurement is published.

- id: tax-provision-pillar-two-15
  title: Firm-run Pillar Two platform with a specialist team, sold as co-sourcing or outsourcing (rules-based platforms; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: service-delivery
  work_types: [data-reporting, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Heads of Tax and Big Four or Tier 1 advisory teams must run Pillar Two compliance quickly and with audit-ready
    transparency [WK-PILLAR2-2026]. Deloitte's research of more than 500 tax leaders and CFOs says 70% expect to pay
    over US$500,000 a year to comply and 76% of CFOs expect to use technology to meet higher compliance cost at
    unchanged staffing [DELOITTE-P2AGENT-2024].
  solution: >-
    Deloitte offers its Pillar Two Agent only when clients work with its tax team under co-sourcing or outsourcing; the
    platform collects data by API or manually, calculates top-up tax, validates returns, and produces GIR and QDMTT
    (qualified domestic minimum top-up tax) filings, with Deloitte teams filing [DELOITTE-P2AGENT-2024,
    DELOITTE-P2BROCH-2024]. The platform won a 2025 ITR Americas award [DELOITTE-ITR-2025], and Deloitte Germany's
    notice for a 24 February 2026 webcast promised a live demonstration [DELOITTE-DE-TTI-2026].
    EY's slipsheet offers access to EY professionals with its GloBE Engine [EY-GLOBE-ENGINE-2026]. FGS runs its own
    Pillar 2 Management App for clients [FGS-GIR-2026]. The sources do not describe AI.
  outcomes:
    - lever: capacity
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: DELOITTE-P2AGENT-2024
  prerequisites:
    - "A co-sourcing or outsourcing engagement with Deloitte [DELOITTE-P2AGENT-2024]."
  risks_and_guardrails:
    - "AMG weighed outsourcing against in-house and chose in-house to keep ownership of its data, calculations and process [ORBITAX-AMG-2026]."
  human_checkpoints:
    - "The platform offers clients options for reviewing and signing off on data [DELOITTE-P2BROCH-2024]."
  role_evolution: >-
    No source describes how the client team's role changes. Deloitte's research lists technology skills as the third
    biggest talent gap in Pillar Two implementation [DELOITTE-P2AGENT-2024].
  evidence_grade: C
  sources:
    - {ref: DELOITTE-P2AGENT-2024, title: "Pillar Two Agent: Tech-powered compliance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/services/tax/services/tech-powered-compliance.html", date: "2024-07-26", access: full, locator: "Sections 'Supported by specialists' and the survey statistics list"}
    - {ref: DELOITTE-P2BROCH-2024, title: "Facilitating your Pillar Two compliance and reporting obligations (Pillar Two Agent brochure)", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/content/dam/assets-shared/docs/services/tax/2024/dttl-pillar-two-agent.pdf", date: "2024-05-15", access: full, locator: "Pages 1-2"}
    - {ref: DELOITTE-ITR-2025, title: "Deloitte Wins Big at 2025 ITR Americas Awards (press release)", publisher: "Deloitte US", type: firm, url: "https://www.deloitte.com/us/en/about/press-room/deloitte-announces-wins-at-2025-itr-americas-tax-awards.html", date: "2025-10-27", access: full, locator: "Paragraph on the Pillar Two Agent"}
    - {ref: DELOITTE-DE-TTI-2026, title: "Tax Technology Insights #69: Pillar 2 / SbS & Simplified Safe Harbour (webcast notice, German)", publisher: "Deloitte Germany", type: conference, url: "https://www.deloitte.com/de/de/services/tax/events/tax-technology-insights-69.html", date: "2026-02-24", access: full, locator: "Section 'Über den Webcast'"}
    - {ref: EY-GLOBE-ENGINE-2026, title: "Introducing EY GloBE Engine (slipsheet)", publisher: "EY", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/tax/documents/ey-gl-globe-engine-slipsheet-06-2026.pdf", date: "2026-06", access: full, locator: "Page 1, 'Access to EY professionals when you need it'"}
    - {ref: FGS-GIR-2026, title: "XML statt Steuerrecht: Die wahren Herausforderungen der ersten Pillar-2-Saison (German)", publisher: "Flick Gocke Schaumburg", type: firm, url: "https://www.fgs.de/news-and-insights/blog/detail/xml-statt-steuerrecht-die-wahren-herausforderungen-der-ersten-pillar-2-saison", date: "2026-08-03", access: full, locator: "Section 'Fazit'"}
    - {ref: WK-PILLAR2-2026, title: "BEPS Pillar Two Technology Procurement Guide", publisher: "Wolters Kluwer", type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/beps-pillar-two-procurement-checklist", date: "2026-02-16", access: full, locator: "Section 'Introduction'"}
    - {ref: ORBITAX-AMG-2026, title: "How AMG Brought Pillar Two Compliance In-House with Orbitax (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/amg-pillar-two-compliance-case-study", date: "2026-09-28", access: full, locator: "Section 'Choosing to Bring Pillar Two In-House'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-14 (graded B there). Graded C for AI use: despite the product name 'Agent', the sources do not
    describe generative or agentic AI; as evidence of a firm-run platform alone it would be grade B (named firms, no
    client, volume or outcome figure). Runtime changed from managed-agent-runtime to workflow-automation because no
    agent is described. The Deloitte page gives the survey sample as over 500 tax leaders and CFOs but not its date. AI-enabled managed compliance in
    general is tax-compliance-corporate-15.

- id: tax-provision-pillar-two-16
  title: Bringing Pillar Two compliance in-house on a platform instead of outsourcing it (rules-based software; no AI claimed)
  archetype: tax
  module: provision-pillar-two
  function: finance-accounting
  work_types: [data-reporting, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    AMG's tax function is small and could not add headcount for the Pillar Two workload; it had to choose between
    outsourcing to an accounting firm and building the capability itself [ORBITAX-AMG-2026].
  solution: >-
    AMG chose software run in-house, after learning that many accounting firms themselves used the same vendor's
    technology [ORBITAX-AMG-2026]. A Swiss-parented insurer with a lean global tax team also chose to file in-house,
    with local advisors supplying jurisdiction-specific expertise as needed [ORBITAX-LEAN-2026]. AMG was already a
    Thomson Reuters customer for tax provision and income tax [ORBITAX-AMG-2026]. The sources describe software, not AI.
  outcomes:
    - lever: capacity
      description: AMG's two-person tax function delivered first-year Pillar Two compliance across 70-80 entities in 25 jurisdictions with no additional headcount.
      figure: 2 people; 70-80 entities; 25 jurisdictions; no added headcount
      measures: Size of AMG's tax function against the entities and jurisdictions covered in its first-year Pillar Two compliance, as stated in the vendor's case study.
      provenance: vendor-published
      source_ref: ORBITAX-AMG-2026
  prerequisites:
    - "Existing CbCR data to seed the platform [ORBITAX-AMG-2026]."
    - "Support from the vendor; the insurer credits the support team for filing on time [ORBITAX-LEAN-2026]."
  risks_and_guardrails:
    - "First-year filings met unexpected hurdles, such as a Dutch certificate requirement for AMG and a Swiss portal rejection for the insurer [ORBITAX-AMG-2026, ORBITAX-LEAN-2026]."
    - "Orbitax's own data show more than 60% of filing activity was notifications and self-assessment returns, so local obligations add workload beyond the GIR [ORBITAX-SEASON-2026]."
  human_checkpoints:
    - "AMG's vice president of tax reviewed and filed; she says she is confident in the data and what she filed [ORBITAX-AMG-2026]."
  role_evolution: >-
    The in-house tax team keeps the data, calculations and process rather than handing them to a provider each year
    [ORBITAX-AMG-2026].
  evidence_grade: C
  sources:
    - {ref: ORBITAX-AMG-2026, title: "How AMG Brought Pillar Two Compliance In-House with Orbitax (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/amg-pillar-two-compliance-case-study", date: "2026-09-28", access: full, locator: "Introduction, 'Choosing to Bring Pillar Two In-House' and 'Results'"}
    - {ref: ORBITAX-LEAN-2026, title: "How a lean global tax team completed Swiss and UK Pillar Two filings ahead of deadline (case study)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/case-studies/how-a-lean-global-tax-team-completed-swiss-and-uk-pillar-two-filings", date: "2026-08-10", access: full, locator: "Section 'A lean global tax team takes on Pillar Two'"}
    - {ref: ORBITAX-SEASON-2026, title: "Inside the First Pillar Two Filing Season: Trends, Challenges, and Lessons (1,700+ filings)", publisher: "Orbitax", type: vendor, url: "https://orbitax.com/newsroom/solutions/global-minimum-tax-gmt/inside-the-first-pillar-two-filing-season", date: "2026-08-20", access: full, locator: "Section 'Beyond the GIR'"}
  last_reviewed: "2026-10-17"
  notes: >-
    From combined-16 (graded A there). Graded C for AI use: same named case study as -09; vendor-published, not
    independent, no baseline cost, and software, not AI. The insurer's case study does say the XatBot copilot helped
    its team with day-to-day issues in the filing season (see -14) [ORBITAX-LEAN-2026]. As evidence of software-enabled insourcing alone it would be
    grade A. Maturity describes the software. Comparable insourcing moves elsewhere are tax-compliance-corporate-07
    (agent-driven, OpenAI) and tax-transfer-pricing-21.
