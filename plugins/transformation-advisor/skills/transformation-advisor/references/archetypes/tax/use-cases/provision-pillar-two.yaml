  function: finance-accounting
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Many provision teams still build workpapers in Excel; Finrep, a vendor, calls an Excel-only provision a control
    risk that auditors are increasingly unwilling to accept [FINREP-ASC740-2026].
  solution: >-
    Idea: an AI assistant reads provision workbooks to explain formulas, check tie-outs and answer questions. TEI's
    preliminary Midyear 2026 programme scheduled a Tax Lab titled 'Escaping Excel: Using AI to Analyze Excel Files for
    Accountants' [TEI-MIDYEAR-2026].
    Bloomberg Tax describes AI-powered insights inside Workpapers spreadsheets [BTAX-ASC740-2026]. No source shows a
    provision team doing this.
  outcomes:
    - lever: quality
      description: none published
      figure: null
      measures: null
      provenance: vendor-published
      source_ref: TEI-MIDYEAR-2026
  prerequisites:
    - "No source states prerequisites."
  risks_and_guardrails:
    - "Finrep says AI tools embedded in provision workflows must be treated as controls for audit purposes; this is Finrep's reading, not a cited standard [FINREP-ASC740-2026]."
  human_checkpoints:
    - "No source describes the review step."
  role_evolution: No source describes role change.
  evidence_grade: D
  sources:
    - {ref: TEI-MIDYEAR-2026, title: "TEI Midyear Conference 2026 At a Glance Agenda (rev 3.2)", publisher: "Tax Executives Institute", type: conference, url: "https://www.tei.org/sites/default/files/MY%202026%20At%20a%20Glance%20Agenda_rev3.2_0.pdf", date: "2026-02", access: full, locator: "Page 3, Tuesday 17 March 2026, 'TEI Tax Lab: Escaping Excel: Using AI to Analyze Excel Files for Accountants'; preliminary programme, PDF created 2026-02-09"}
    - {ref: FINREP-ASC740-2026, title: "AI Tax Provision ASC 740 Reporting: A 2026 Practitioner Walkthrough", publisher: "Finrep (Gana Misra, CEO)", type: vendor, url: "https://www.finrep.ai/blog/ai-tax-provision-asc-740-reporting-a-2026-practitioner-walkthrough", date: "2026-09-30", access: full, locator: "Opening paragraph and section 'SOX 404 and PCAOB Audit Implications'"}
    - {ref: BTAX-ASC740-2026, title: "Accelerate your ASC 740 process (Bloomberg Tax Research, Provision and Workpapers product page)", publisher: "Bloomberg Tax", type: vendor, url: "https://pro.bloombergtax.com/products/accelerate-your-asc-740-process/", date: "2026-03-25", access: full, locator: "Section 'Get research answers directly in your spreadsheets'"}
  last_reviewed: "2026-10-17"
