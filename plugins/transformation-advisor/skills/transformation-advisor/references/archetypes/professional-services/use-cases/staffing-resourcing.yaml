  last_reviewed: "2026-10-19"
  notes: >-
    All vendor sources; no named customer for the staffing question use. Status and budget questions are
    professional-services-delivery-management-04 (zeb, a financial-services consultancy, on SAP).
- id: professional-services-staffing-resourcing-10
  title: Skills inventory kept current from profiles, project history and role descriptions
  archetype: professional-services
  module: staffing-resourcing
  function: people-hr
  work_types: [data-reporting, research-synthesis]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Self-reported skills profiles say little about how recently a skill was used, how complex the work was or the
    proficiency level (TSIA-RM-2026). 47.1% of Resource Management Institute respondents cite poor or fragmented
    skills, outcome, demand and capacity data (KANTATA-RMI-REPORT-2026). In BigHand's survey, 45% of law firms had only
    partial data on associates' skill sets (BIGHAND-DLAPR-2026).
  solution: >-
    AI suggests skills for a role from its title and description and matches related skills rather than exact
    keywords (CINODE-2026); a skills-based view of people is built across recruiting, mobility and staffing
    (EIGHTFOLD-DT-2025); Deltek describes certification tracking with skill-based matching (DELTEK-POLARIS-2026).
    TSIA's first maturity level has AI update consultant profiles from project data, certifications and delivery
    artefacts, and its 'skills genome' extends the same register to AI tools (reliability, known limitations, required
    oversight) (TSIA-RM-2026).
  outcomes:
    - lever: quality
      description: No outcome published for skills-inventory upkeep. Respondents selected skills intelligence as the second most-wanted AI support.
      figure: 67.7%
      measures: Share selecting 'Enhancing skills intelligence (inferring skills from work, highlighting adjacencies)' (multi-select, Q16; 44 organisations); a want, not a result
      provenance: vendor-published
      source_ref: KANTATA-RMI-REPORT-2026
  prerequisites:
    - A skills taxonomy and profile data per person (CINODE-2026; EIGHTFOLD-DT-2025)
    - A structured schema for proficiency, recency, industry and certifications, and access to project history (TSIA-RM-2026)
  risks_and_guardrails:
    - Skills inference about individuals is being tested in court in hiring; a class action filed on 20 January 2026 alleges Eightfold compiled 'hidden credit reports' and ranked applicants without meeting US consumer-reporting law, unresolved (FISHERPHILLIPS-EIGHTFOLD-2026)
    - The UK ICO's audit of AI recruitment tools found tools inferring gender and ethnicity from names and collecting more personal data than necessary (ICO-RECRUIT-2024; recruitment, not staffing)
    - EU employers must inform workers and their representatives before using a high-risk system at work (EU-AIACT-OJ-2024, Art. 26(7)); whether a skills inventory is high-risk is not settled by the sources
  human_checkpoints:
    - Not described in any source; a person confirming inferred skills would be a design choice, not a documented practice
  role_evolution: Not described in the sources.
  evidence_grade: C
  sources:
    - {ref: CINODE-2026, title: "The entire matching flow in Cinode: From email to booked consultant with AI", publisher: Cinode, type: vendor, url: "https://cinode.com/en/blog/cinode-en/the-entire-matching-flow-in-cinode-from-email-to-booked-consultant-with-ai/", date: "2026-05-13", access: full, locator: "Step 3, what the matching engine takes into account"}
    - {ref: EIGHTFOLD-DT-2025, title: "Deutsche Telekom seizes opportunity to apply AI to project staffing with Eightfold Resource Management (customer story; PDF undated, 2025-03 is its creation date)", publisher: Eightfold AI, type: vendor, url: "https://eightfold.ai/wp-content/uploads/deutsche-telekom-seizes-opportunity-ai-project-staffing-eightfold-resource-management.pdf", date: "2025-03", access: full, locator: "Solution section on becoming skills-based"}
    - {ref: DELTEK-POLARIS-2026, title: "Deltek Polaris (product page; undated, read 2026-10-19)", publisher: Deltek, type: vendor, url: "https://www.deltek.com/en/products/polaris/", date: "2026-10-19", access: full, locator: "Polaris FAQ on resource management"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "'Skills Data Becomes Outdated'; 'Build the Skills Genome'; maturity Level 1"}
    - {ref: KANTATA-RMI-REPORT-2026, title: "Resource Management in the Age of AI (full survey report; 44 organisations)", publisher: "Resource Management Institute (RTM Consulting) for Kantata", type: survey, url: "https://get.kantata.com/rs/677-LEJ-696/images/AI_in_Resource_Management_Survey.pdf", date: "2026-04", access: full, locator: "Key Observations p. 4; Q16 p. 18; Q19 p. 21"}
    - {ref: BIGHAND-DLAPR-2026, title: "DLA Piper Reports More Than 600 Hours Saved at Half-Year End with BigHand Resource Management (press release)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/news/dla-piper-bighand-resource-management-press-release/", date: "2026-06-18", access: full, locator: "Paragraph citing the Navigating the Million Dollar Problem report"}
    - {ref: FISHERPHILLIPS-EIGHTFOLD-2026, title: "Job Applicants Sue AI Screening Company for FCRA Violations: 5 Key Takeaways for Employers", publisher: Fisher Phillips LLP, type: firm, url: "https://www.fisherphillips.com/en/news-insights/job-applicants-sue-ai-screening-company-for-fcra-violations.html", date: "2026-01-26", access: full, locator: "Opening paragraphs"}
    - {ref: ICO-RECRUIT-2024, title: "ICO intervention into AI recruitment tools leads to better data protection for job seekers", publisher: "Information Commissioner's Office (UK)", type: regulator, url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2024/11/ico-intervention-into-ai-recruitment-tools-leads-to-better-data-protection-for-job-seekers/", date: "2024-11-06", access: full, locator: "'About the audits'"}
    - {ref: EU-AIACT-OJ-2024, title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal text", publisher: "European Parliament and Council of the European Union (EUR-Lex)", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689", date: "2024-07-12", access: full, locator: "Article 26(7)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: staffing and talent software vendors (Cinode, Eightfold, Deltek) and a professional association's
    maturity model (TSIA). Product descriptions and a professional-body maturity model; no professional services firm
    documents a deployed AI-inferred skills inventory. Function people-hr because skills data often sits in HR and
    talent systems; it feeds service-delivery staffing. Skills development itself is talent-learning. The RMI insights
    page rounds the 67.7% to 68%.
- id: professional-services-staffing-resourcing-11
  title: One matching view across employees, subcontractors, candidates and partner consultants
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Many systems match only internal employees while firms use subcontractors and partners to fill gaps; subcontractors
    contributed 10.4% of revenue across the SPI benchmark in 2025 (DELTEK-SPI-2026).
  solution: >-
    Cinode matches across employees, subcontractors, candidates and partner consultants in one view, lets candidates be
    booked without first converting them, and can post unfilled roles to partners (CINODE-2026). Kantata compares
    internal and external resources side by side on skills, availability and margin impact (KANTATA-FORECAST-2026) and
    holds external roles, rates and calendars (KANTATA-RM-2026).
  outcomes:
    - lever: capacity
      description: None published.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: CINODE-2026
  prerequisites:
    - External resources held as profiles with cost rates and availability (KANTATA-RM-2026)
  risks_and_guardrails:
    - Not described in the sources; client terms on subcontracting and data access apply as for any external resource
  human_checkpoints:
    - A staffer chooses and books (CINODE-2026)
  role_evolution: Not described in the sources.
  evidence_grade: C
  sources:
    - {ref: CINODE-2026, title: "The entire matching flow in Cinode: From email to booked consultant with AI", publisher: Cinode, type: vendor, url: "https://cinode.com/en/blog/cinode-en/the-entire-matching-flow-in-cinode-from-email-to-booked-consultant-with-ai/", date: "2026-05-13", access: full, locator: "Step 4, match your entire capacity"}
    - {ref: KANTATA-FORECAST-2026, title: "Resource Forecasting and Staffing (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/solutions/resource-forecasting-and-staffing", date: "2026-10-19", access: full, locator: "'Candidate Assignments' entry"}
    - {ref: KANTATA-RM-2026, title: "Resource Management, Scheduling and Forecasting (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/psa/resource-management-software", date: "2026-10-19", access: full, locator: "Section 'Managing your talent network'"}
    - {ref: DELTEK-SPI-2026, title: "2026 PSO Benchmarks: What We Learned and What's Next from the SPI Maturity Benchmark Report", publisher: "Deltek (summary of SPI Research's benchmark report)", type: vendor, url: "https://www.deltek.com/resources/articles/professional-services-benchmarks/", date: "2026-07-30", access: full, locator: "Section 3, Talent Dynamics"}
