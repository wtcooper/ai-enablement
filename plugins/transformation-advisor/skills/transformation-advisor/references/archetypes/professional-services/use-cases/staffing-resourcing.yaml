# Staffing and resourcing use cases (professional-services archetype, base layer). Sources checked 2026-10-19.
# Grades follow the 2026-10-17 rule: A needs a figure the named organisation reports as measured.
# Practice-specific staffing (audit team selection, independence, rotation) sits in the assurance archetype.
# Similar keys that name different documents: KANTATA-RMI-2026 (Kantata's release on the study) and
# KANTATA-RMI-REPORT-2026 (the full survey report); EU-AIACT-ANNEX3-2024 (an online reproduction of Annex III) and
# EU-AIACT-OJ-2024 (the Official Journal text); DELTEK-SPI-2026 and DELTEK-SPIKPI-2026 (two Deltek articles on the SPI
# benchmark); ACCEVERLAW-2025 (press release) and BLOOMBERGLAW-ACC-2025 (Bloomberg Law article, other modules).
# TR-FOP-REPORT-2026 is Thomson Reuters' full Future of Professionals Report 2026 (released 2026-06-22). The tax
# archetype's TR-FOP-2026 is a different document: TRI's paper on that report for tax and audit firms.

- id: professional-services-staffing-resourcing-01
  title: Ranked staff shortlists and recommendations inside the PSA or workflow tool, with the resource manager deciding
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Resource managers match people to roles from memory, spreadsheets and phone calls; familiarity and recency shape
    who gets picked and people with the right skills elsewhere are overlooked (PROJECTWORKS-2026). In a Dayshape
    survey of 400 UK and US senior leaders, 39% regularly staff projects by availability rather than best-fit skills
    (DAYSHAPE-ONREC-2026). In accounting-firm workflow tools the choice of preparer and reviewer still rests on
    familiarity, perceived availability and individual judgment (WK-CCHSTAFF-2026).
  solution: >-
    An agent or recommender inside the PSA (professional services automation: the system holding projects, people,
    time and billing) reads project, skills, availability and cost data and proposes ranked candidates with reasons;
    a resource manager confirms or overrides. Named uses: Basware, having automated billing first, is expanding into an
    agent built on the Kantata Expertise Engine that helps its services managers determine how to staff projects as
    timelines and requirements change (KANTATA-BASWARE-2026). Certinia reports that Nextview's Staffing Agent scans 150 colleagues for skills and
    availability, and that Diabsolut deployed a combined Customer Success and Staffing Agent (CERTINIA-CUSTOMERS-2026).
    zeb's case study includes a staffing agent that proposes and pre-books people (NTTDATA-ZEB-2026). An Icon Cloud
    Consulting solution architect says the agent removes the hunt for information so managers can 'make the right call'
    (CERTINIA-VEDA-2026). Products: Certinia Resourcing and Shortlisting agents (CERTINIA-VEDA-2026); Kantata ranked
    recommendations with reasoning (KANTATA-AGENT-2026); Deltek Polaris skills-based matching (DELTEK-POLARIS-2026);
    Wolters Kluwer CCH Axcess Workflow, which shows accounting firms a compatibility score built from historical
    assignments, client familiarity, role alignment and current workload, with weights the firm can set
    (WK-CCHSTAFF-2026); and an early preview of an AI resourcing agent for law firms shown by BigHand in June 2026
    (BIGHAND-CONF-2026).
  outcomes:
    - lever: capacity
      description: Certinia says Veda returns up to 10 hours a month to resource managers across staffing analysis, bench matching and work reallocation; no customer is named.
      figure: up to 10 hours per month
      measures: Hours of resource-manager capacity returned per month, per Certinia; no method, user count or baseline given; not broken out by task
      provenance: vendor-published
      source_ref: CPAPA-CERTINIA-2026
    - lever: quality
      description: Kantata states its customers see a 40% improvement in resource planning accuracy.
      figure: 40%
      measures: Improvement in resource planning accuracy as stated on the product page; no baseline, sample or definition
      provenance: vendor-published
      source_ref: KANTATA-AGENT-2026
    - lever: speed
      description: Nextview's Staffing Agent scans 150 colleagues for skills and availability in seconds, in Certinia's account.
      figure: seconds, across 150 colleagues
      measures: Vendor's description of the time to scan one firm's staff; no baseline or measurement method
      provenance: vendor-published
      source_ref: CERTINIA-CUSTOMERS-2026
    - lever: quality
      description: No acceptance, override or fit-quality rate for AI shortlists was found in any source; Basware publishes no staffing figure.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: KANTATA-BASWARE-2026
  prerequisites:
    - Skills, availability, project budgets and CRM data in one connected system; Projectworks says AI can help little if they sit in different places (PROJECTWORKS-2026)
    - Usable data; 47% of respondents in the Resource Management Institute study named poor or fragmented skills, outcome, demand and capacity data as a barrier, second to limited understanding of where AI applies (49%) (KANTATA-RMI-2026)
    - Basware automated billing before adding the resourcing agent (KANTATA-BASWARE-2026)
    - A defined rule for who may accept or change a shortlist, because the EU and California texts turn on human involvement (CPPA-CCPAREGS-2026)
  risks_and_guardrails:
    - Projectworks says the best tools are advisory and do not make changes on the user's behalf, and that client dynamics, internal politics and who works well together are inputs no model captures yet (PROJECTWORKS-2026)
    - Only 12% of leaders fully trust their systems data and 89% spend significant time verifying AI outputs (KANTATA-SOPSI-2026; Kantata-sponsored survey of 200 leaders)
    - EU AI Act Annex III point 4(b) lists AI intended to allocate tasks based on individual behaviour or personal traits or characteristics as high-risk (EU-AIACT-ANNEX3-2024); obligations apply from 2 December 2027 (EC-AIACT-2026). Whether a skills-and-availability matcher is in scope needs legal review
    - California's CCPA regulations list allocation or assignment of work for employees as a significant decision; automated decisionmaking technology used for one must comply by 1 January 2027, and human involvement means a reviewer who can interpret the output and has authority to change the decision (CPPA-CCPAREGS-2026, s.7001(e)(1), s.7001(ddd)(4)(B), s.7200)
    - California bar guidance warns that AI used in employment actions may present a risk of unlawful or unethical bias (CALBAR-GENAI-2026, p. 9)
    - Only 4% of Resource Management Institute respondents named ethical or compliance concerns as a gap (KANTATA-RMI-REPORT-2026, Q19)
    - A randomised field test of automated case assignment in a public agency found worse on-time completion than manager assignment (see professional-services-staffing-resourcing-13; IPA-PERU-2026)
  human_checkpoints:
    - The staffing team makes the decision from the ranked options; neither vendor describes the agent booking people on its own (KANTATA-AGENT-2026; CERTINIA-VEDA-2026)
    - In CCH Axcess Workflow the person assigning staff can pick anyone regardless of the recommendation and can open a justification view first (WK-CCHSTAFF-2026)
    - Whether the engagement lead or the person staffed also confirms is not described in any source
  role_evolution: >-
    Resource managers move from searching for candidates to choosing among ranked options (KANTATA-AGENT-2026;
    CERTINIA-VEDA-2026). In the Resource Management Institute study, 72% describe resource management as primarily or
    solely operational, the baseline the role is moving from (KANTATA-RMI-2026).
  evidence_grade: B
  sources:
    - {ref: KANTATA-BASWARE-2026, title: "Kantata takes Basware from AI experimentation to results (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-takes-basware-from-ai-experimentation-to-results", date: "2026-10-13", access: full, locator: "Section 'Smarter Resource Management'; opening quote"}
    - {ref: CERTINIA-CUSTOMERS-2026, title: "Certinia Customers Are Proving Veda AI Agents Deliver Real Results (blog; byline 'September 3' with no year; 2026 inferred from its reference to Dreamforce 14-17 Sep 2026 as upcoming)", publisher: Certinia, type: vendor, url: "https://certinia.com/blog/certinia-customers-are-proving-veda-ai-agents-deliver-real-results/", date: "2026-09-03", access: full, locator: "Nextview and Diabsolut sections"}
    - {ref: NTTDATA-ZEB-2026, title: "zeb: putting agentic AI into action", publisher: NTT DATA, type: vendor, url: "https://nttdata-solutions.com/br/success-stories/zeb-putting-agentic-ai-into-action/", date: "2026-05-07", access: full, locator: "Agent list (staffing agent)"}
    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: System of Action for Professional Services (product page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10-19", access: full, locator: "Plan-stage agent list (Resourcing, Shortlisting); Icon Cloud Consulting quote"}
    - {ref: CPAPA-CERTINIA-2026, title: "Certinia Unveils Veda, an AI Operations Engine for Professional Services", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/04/15/certinia-unveils-veda-an-ai-operations-engine-for-professional-services/181702/", date: "2026-04-15", access: full, locator: "Paragraph beginning 'For resource managers, Veda automates staffing analysis'"}
    - {ref: KANTATA-AGENT-2026, title: "Expertise Agent and Workflows (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/ai/expertise-agent-and-workflows", date: "2026-10-19", access: full, locator: "Section 'Proactive Resourcing' and the 40% statement"}
    - {ref: DELTEK-POLARIS-2026, title: "Deltek Polaris (product page; undated, read 2026-10-19)", publisher: Deltek, type: vendor, url: "https://www.deltek.com/en/products/polaris/", date: "2026-10-19", access: full, locator: "Intelligent Resource Management section"}
    - {ref: WK-CCHSTAFF-2026, title: "The staffing challenge most workflow systems don't solve (CCH Axcess Workflow staff recommendations)", publisher: Wolters Kluwer Tax and Accounting, type: vendor, url: "https://www.wolterskluwer.com/en/expert-insights/the-staffing-challenge-most-workflow-systems-dont-solve", date: "2026-08-12", access: full, locator: "Key Takeaways; how recommendations are generated; maintaining control"}
    - {ref: BIGHAND-CONF-2026, title: "BigHand Conference Signals a New Priority for Law Firms: Intelligence Before the Point of Decision (post-event release)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/news/bighand-conference-2026-post-event-press-release/", date: "2026-06-05", access: full, locator: "Highlights list ('early preview of its AI resourcing agent'); conference held the day before"}
    - {ref: PROJECTWORKS-2026, title: "How AI Is Changing Resource Planning for Consulting Firms", publisher: Projectworks, type: vendor, url: "https://www.projectworks.com/blog/how-ai-changes-resource-planning", date: "2026-06-25", access: full, locator: "Sections on matching people to roles and where AI resource planning is still early"}
    - {ref: DAYSHAPE-ONREC-2026, title: "Professional services firms lose work as capacity planning falls behind demand (Onrec summary of a Dayshape survey of 400 senior leaders, UK and US)", publisher: Onrec, type: press, url: "https://www.onrec.com/node/129428", date: "2026-10-13", access: full, locator: "Key figures panel"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services (Resource Management Institute study commissioned by Kantata)", publisher: Kantata (study by the Resource Management Institute), type: survey, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Paragraphs on barriers and on 72% operational"}
    - {ref: KANTATA-RMI-REPORT-2026, title: "Resource Management in the Age of AI (full survey report; 44 organisations)", publisher: "Resource Management Institute (RTM Consulting) for Kantata", type: survey, url: "https://get.kantata.com/rs/677-LEJ-696/images/AI_in_Resource_Management_Survey.pdf", date: "2026-04", access: full, locator: "Q19, p. 21"}
    - {ref: KANTATA-SOPSI-2026, title: "Kantata Survey Reveals that 87% of Professional Services Teams Plan to Manage AI Agents as Part of Their Workforce (Censuswide survey of 200 leaders)", publisher: "Kantata (survey by Censuswide, 200 leaders)", type: survey, url: "https://www.kantata.com/blog/article/kantata-survey-reveals-that-87-of-professional-services-teams-plan-to-manage-ai-agents-as-part-of-their-workforce", date: "2026-01-08", access: full, locator: "Paragraph on data trust"}
    - {ref: EU-AIACT-ANNEX3-2024, title: "Annex III: High-risk AI systems referred to in Article 6(2) (text of Regulation (EU) 2024/1689 of 13 June 2024; unofficial reproduction)", publisher: "European Union (text reproduced by the Future of Life Institute, artificialintelligenceact.eu)", type: regulator, url: "https://artificialintelligenceact.eu/annex/3/", date: "2024-06-13", access: full, locator: "Point 4(b)"}
    - {ref: EC-AIACT-2026, title: "AI Act: regulatory framework for AI (living page; last updated 2026-10-19)", publisher: European Commission, type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", date: "2026-10-19", access: full, locator: "Application timeline (Annex III from 2 December 2027)"}
    - {ref: CPPA-CCPAREGS-2026, title: "California Consumer Privacy Act Regulations, effective 1/1/2026 (Article 11, Automated Decisionmaking Technology)", publisher: California Privacy Protection Agency, type: regulator, url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf", date: "2026-01-01", access: full, locator: "s.7001(e)(1), s.7001(ddd)(4)(B), s.7200(b)"}
