- id: professional-services-staffing-resourcing-09
  title: Conversational resourcing assistant answers who has the skills and capacity, and drafts a plan
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Answering 'who has this experience and capacity in July' takes a morning of phone calls and spreadsheet checks,
    and staffing often depends on one or two people who hold the map of who is free and good at what
    (PROJECTWORKS-2026).
  solution: >-
    Natural-language questions over PSA data, plus multi-step actions such as flagging a resource conflict or generating
    a project plan from an SOW. Kantata launched Expertise Agent on 2026-06-16 as a 'superagent' for project, resource
    and financial questions (ERPTODAY-KANTATA-2026; KANTATA-AGENT-2026); Rocketlane markets a Nitro Resource Management
    Agent (ROCKETLANE-2026); Certinia lists an Ask Veda Agent and Project Assistant (CERTINIA-VEDA-2026).
  outcomes:
    - lever: speed
      description: Projectworks says a question that took a morning of calls returns in seconds; an illustration, not a measurement.
      figure: seconds versus a morning (illustrative)
      measures: Illustrative time to answer a skills-and-capacity question
      provenance: vendor-published
      source_ref: PROJECTWORKS-2026
  prerequisites:
    - Connected data across projects, people, financials and communications; Kantata says its knowledge graph links these (ERPTODAY-KANTATA-2026)
  risks_and_guardrails:
    - Kantata's own chief executive warns of 'fast, mediocre decisions' when generic tools lack business context (KANTATA-SUPERAGENT-2026)
    - Users need to see why; Kantata stresses recommendations with reasoning (KANTATA-AGENT-2026)
  human_checkpoints:
    - The person asking decides; Kantata says agents act within guardrails the firm defines (KANTATA-AGENT-2026)
  role_evolution: >-
    Resource managers and ops leaders query the system directly instead of relying on one person who holds the
    staffing map (PROJECTWORKS-2026; ROCKETLANE-2026).
  evidence_grade: C
  sources:
    - {ref: ERPTODAY-KANTATA-2026, title: "Kantata's Expertise Agent Targets the Professional Services Delivery Crunch", publisher: ERP Today, type: press, url: "https://erp.today/kantata-expertise-agent-psa-ai/", date: "2026-06-19", access: full, locator: "Opening paragraphs (launch on 16 June)"}
    - {ref: KANTATA-AGENT-2026, title: "Expertise Agent and Workflows (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/ai/expertise-agent-and-workflows", date: "2026-10-19", access: full, locator: "Expertise Agent and Agent Studio panels"}
    - {ref: KANTATA-SUPERAGENT-2026, title: "More Agents Won't Fix Unpredictable Projects: Why We Built a Superagent Instead", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/more-agents-wont-fix-unpredictable-projects-why-we-built-a-superagent-instead", date: "2026-06-16", access: full, locator: "Sections on fast versus accurate"}
