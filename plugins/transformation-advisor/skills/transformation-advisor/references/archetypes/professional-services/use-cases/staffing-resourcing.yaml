- id: professional-services-staffing-resourcing-05
  title: Staffing scenarios compared across projects, with margin impact shown at the point of decision
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, data-reporting]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Staffing choices are made with the financial consequence invisible until a later review (PROJECTWORKS-2026).
    Kantata pitches its optimiser as evaluating resource permutations 'beyond human capacity' (KANTATA-FORECAST-2026).
  solution: >-
    Kantata's Staffing Optimizer uses optimisation to model staffing scenarios across multiple projects and resource
    permutations, and Candidate Assignments compares internal and external resources side by side on skills,
    availability and margin impact (KANTATA-FORECAST-2026). Projectworks describes margin impact appearing when a
    contractor is added or the seniority mix changed (PROJECTWORKS-2026).
  outcomes:
    - lever: quality
      description: None published.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: KANTATA-FORECAST-2026
  prerequisites:
    - Rates, costs and budgets in the same system as resource plans (PROJECTWORKS-2026)
  risks_and_guardrails:
    - An independent randomised field test of an optimisation-based assignment rule in a public agency found worse on-time completion than manager discretion (IPA-PERU-2026; see professional-services-staffing-resourcing-13)
  human_checkpoints:
    - The ops leader or resource manager chooses among scenarios (KANTATA-FORECAST-2026; PROJECTWORKS-2026)
  role_evolution: >-
    Resource managers weigh cost and margin as well as availability; respondents in the Resource Management Institute
    study expect the role to shift from filling hours to maximising delivery success and profitability if outcome-based
    pricing spreads (KANTATA-RMI-2026).
  evidence_grade: C
  sources:
    - {ref: KANTATA-FORECAST-2026, title: "Resource Forecasting and Staffing (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/solutions/resource-forecasting-and-staffing", date: "2026-10-19", access: full, locator: "'Staffing Optimizer' and 'Candidate Assignments' entries"}
    - {ref: PROJECTWORKS-2026, title: "How AI Is Changing Resource Planning for Consulting Firms", publisher: Projectworks, type: vendor, url: "https://www.projectworks.com/blog/how-ai-changes-resource-planning", date: "2026-06-25", access: full, locator: "Section on utilisation and margin at the point of decision"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services (Resource Management Institute study commissioned by Kantata)", publisher: Kantata (study by the Resource Management Institute), type: survey, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Paragraph on outcome-based pricing"}
    - {ref: IPA-PERU-2026, title: "Automated Assignment and Bureaucrat Productivity: Evidence from a Field Experiment in Peru (working paper, Ferreira and Cermeno Leon)", publisher: "Innovations for Poverty Action / Southern Methodist University", type: academic, url: "https://poverty-action.org/sites/default/files/2026-07/main_assignment_enforcement_peru_2025.pdf", date: "2026-06-11", access: full, locator: "Abstract and introduction"}
  last_reviewed: "2026-10-19"
  notes: >-
    Product-page description only; no named customer or measurement. Consulting-firm framing (Projectworks).
    Engagement-level margin monitoring during delivery is professional-services-delivery-management-07.
- id: professional-services-staffing-resourcing-06
  title: Agent re-matches people and proposes replacements for work in flight when people or demand shift
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    Replacing a person mid-project means finding every assignment, then searching for a match on the same criteria and
    timeframes (CPAPA-CERTINIA-2026). Without pipeline visibility resource managers scramble when projects close or
    people move, causing delayed starts, overbooked top performers and underused staff (TSIA-RM-2026).
  solution: >-
    Certinia's Reallocation Agent identifies all of a person's assignments, searches for best-match replacements on
    the same criteria and timeframes, and proposes them to resource managers (CPAPA-CERTINIA-2026); Certinia says its
    matching re-matches when resources shift (CERTINIA-VEDA-2026). Rocketlane describes a Resource Management Agent,
    'currently in active rollout', that monitors allocation, flags people nearing over-capacity and ranks reallocation
    options by delivery impact and margin fit (ROCKETLANE-2026).
  outcomes:
    - lever: capacity
      description: Included in Certinia's combined 'up to 10 hours per month' claim for resource managers; not broken out by task.
      figure: up to 10 hours per month (combined)
      measures: Hours of capacity returned per month to resource managers, per Certinia; no method or sample
      provenance: vendor-published
      source_ref: CPAPA-CERTINIA-2026
    - lever: capacity
      description: No measured outcome, acceptance or override rate published for reallocation agents.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: ROCKETLANE-2026
  prerequisites:
    - Live assignment, skills, availability, cost and timesheet data in the PSA (CPAPA-CERTINIA-2026; ROCKETLANE-2026)
    - A rule for who approves a proposed replacement; not described by the vendors
  risks_and_guardrails:
    - diginomica notes humans are still needed to verify that agent-recommended actions are correct, and quotes Certinia saying accountability stays with humans (DIGINOMICA-CERTINIA-2026)
    - DLA Piper's senior resource manager says software helps find cover but the resource manager supplies the context (BIGHAND-DLA-2026)
    - EU AI Act Annex III point 4(b) also lists AI that monitors and evaluates worker performance and behaviour; an agent reallocating work on performance data may touch both limbs. Employers must inform workers and their representatives before using a high-risk system (Art. 26(7)) and keep logs for at least six months (Art. 26(6)) (EU-AIACT-OJ-2024)
  human_checkpoints:
    - The agent proposes or surfaces options; a resource manager decides (CPAPA-CERTINIA-2026; ROCKETLANE-2026)
  role_evolution: >-
    Resource managers review proposals instead of building replacement searches by hand, in the vendors' description
    (CPAPA-CERTINIA-2026; ROCKETLANE-2026).
  evidence_grade: C
  sources:
    - {ref: CPAPA-CERTINIA-2026, title: "Certinia Unveils Veda, an AI Operations Engine for Professional Services", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/04/15/certinia-unveils-veda-an-ai-operations-engine-for-professional-services/181702/", date: "2026-04-15", access: full, locator: "Bullet 'Reallocation Agent'"}
    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: System of Action for Professional Services (product page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10-19", access: full, locator: "Plan row (Work Reallocation Agent); 'Staff with confidence, not guesswork' panel"}
    - {ref: ROCKETLANE-2026, title: "AI for PS Resource Allocation: 2026 Guide", publisher: Rocketlane, type: vendor, url: "https://rocketlane.com/blogs/ai-for-ps-resource-allocation", date: "2026-07-22", access: full, locator: "Section on how Rocketlane Nitro reshapes resource allocation, Level 3 Workforce AI"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "'Staffing Decisions Become Reactive'"}
    - {ref: DIGINOMICA-CERTINIA-2026, title: "Certinia unveils Veda, its AI engine for Professional Services Automation", publisher: diginomica, type: press, url: "https://diginomica.com/certinia-unveils-veda-ai-engine-professional-services-automation", date: "2026-04-15", access: full, locator: "Paragraphs on 10 beta agents and 20+ lighthouse customers; 'My take'"}
    - {ref: BIGHAND-DLA-2026, title: "A Global Firm Needs a Global View: DLA Piper Scales Legal Resourcing Excellence with BigHand Resource Management (case study)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/case-studies/dla-piper-bighand-resource-management/", date: "2026-06-17", access: full, locator: "Alix Love quote, 'The Solution'"}
    - {ref: EU-AIACT-OJ-2024, title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal text", publisher: "European Parliament and Council of the European Union (EUR-Lex)", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689", date: "2024-07-12", access: full, locator: "Annex III 4(b); Article 26(6) and 26(7)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: PSA vendors (Certinia, Rocketlane) and their project-based services customers, none named for this agent.
    Maturity piloting: Certinia's 10 packaged agents were in beta at launch on 2026-04-15 with more than 20 lighthouse
    customers (DIGINOMICA-CERTINIA-2026); no named customer for this agent was found.
- id: professional-services-staffing-resourcing-07
  title: Bench gaps detected early and matched to open or unsold work, with soft-booking before contracts are signed
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Consultants sit idle between projects while the person staffing work does not see them, and the same people get
    tapped repeatedly (PROJECTWORKS-2026). Underused staff are found late, and bench time and overbooking sit side by
    side (TSIA-RM-2026).
  solution: >-
    Rocketlane describes an agent that surfaces a bench gap when confirmed allocation falls below target for the next
    two to three weeks and checks open pipeline and internal needs against that person's skill profile
    (ROCKETLANE-2026). Projectworks describes matching unassigned people to internal work, learning, pre-sales support
    or short fills (PROJECTWORKS-2026). Kantata's 'Skills Profiling on Unsold Work' lets firms soft-book resources
    before contracts are signed and see skills gaps early (KANTATA-FORECAST-2026). Certinia says its matching reduces
    bench time in real time (CERTINIA-VEDA-2026).
  outcomes:
    - lever: capacity
      description: No measured bench or utilisation result published for this step; Certinia states 'reducing bench time in real time' as a benefit, with no figure.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: CERTINIA-VEDA-2026
  prerequisites:
    - Confirmed allocation, pipeline and skills data in one place (ROCKETLANE-2026; PROJECTWORKS-2026)
  risks_and_guardrails:
    - Utilisation targets differ widely; TSIA's DiMuccio says most firms run between 55% and 65%, so thresholds need local setting (ACCELO-TSIA-2026)
    - Bench rules are a management lever with employee effects; TCS (a non-AI example) required associates to be allocated at least 225 business days in 12 months, about 35 days of permitted bench (CXODP-TCS-2025)
  human_checkpoints:
    - The agent surfaces a gap and candidate work; a manager redeploys (ROCKETLANE-2026; PROJECTWORKS-2026)
  role_evolution: >-
    Projectworks says the bench becomes a planning lever rather than a line item (PROJECTWORKS-2026); this is a vendor
    view.
  evidence_grade: C
  sources:
    - {ref: ROCKETLANE-2026, title: "AI for PS Resource Allocation: 2026 Guide", publisher: Rocketlane, type: vendor, url: "https://rocketlane.com/blogs/ai-for-ps-resource-allocation", date: "2026-07-22", access: full, locator: "Level 3 Workforce AI paragraph"}
    - {ref: PROJECTWORKS-2026, title: "How AI Is Changing Resource Planning for Consulting Firms", publisher: Projectworks, type: vendor, url: "https://www.projectworks.com/blog/how-ai-changes-resource-planning", date: "2026-06-25", access: full, locator: "Sections on bench management"}
    - {ref: KANTATA-FORECAST-2026, title: "Resource Forecasting and Staffing (product page; undated, read 2026-10-19)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/solutions/resource-forecasting-and-staffing", date: "2026-10-19", access: full, locator: "'Skills Profiling on Unsold Work'"}
    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: System of Action for Professional Services (product page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10-19", access: full, locator: "'Staff with confidence, not guesswork' panel"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "'Staffing Decisions Become Reactive'"}
    - {ref: ACCELO-TSIA-2026, title: "How AI Is Reshaping Resource Utilization and Capacity Management (write-up of a TSIA and Accelo conversation)", publisher: Accelo, type: vendor, url: "https://www.accelo.com/blog/ai-era-resource-utilization-capacity-management", date: "2026-06-03", access: full, locator: "'The New Capacity Management Equation'"}
    - {ref: CXODP-TCS-2025, title: "TCS Rolls Out Strict Talent Deployment Policy Amid AI Push and Cost Pressures", publisher: CXO Digitalpulse, type: press, url: "https://www.cxodigitalpulse.com/tcs-rolls-out-strict-talent-deployment-policy-amid-ai-push-and-cost-pressures/", date: "2025-06-23", access: full, locator: "Opening paragraphs on the 225-day rule"}
  last_reviewed: "2026-10-19"
  notes: >-
    Vendor product descriptions only; no customer named. TCS is an IT services firm; the article says the policy does
    not explicitly mandate AI.
- id: professional-services-staffing-resourcing-08
  title: Continuous utilisation and overallocation monitoring with early alerts against target bands
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Utilisation problems are found in last month's report, after they started weeks earlier (PROJECTWORKS-2026). SPI
    Research's benchmark puts average billable utilisation (the share of available time charged to clients) at 66.4%
    in 2025, the lowest in its survey history (DELTEK-SPI-2026); Deltek reports architecture and engineering (A&E)
    utilisation just under 60% (DELTEK-CLARITY-2026).
  solution: >-
    A background process monitors allocation and flags risks early, for example hours above target for two consecutive
    weeks or a team's utilisation below a threshold (PROJECTWORKS-2026). Rocketlane describes allocation-accuracy
    checks that flag anyone booked over 100% across several weeks (ROCKETLANE-2026). Deltek says Dela uses machine
    learning on past project performance and resource utilisation (DELTEK-DELA-2026). A Certinia analysis says
    utilisation has to be managed earlier, not only reported monthly (CERTINIA-SPIBENCH-2026).
  outcomes:
    - lever: capacity
      description: Baseline problem, not a result of monitoring. Average billable utilisation fell to 66.4% in 2025 from 68.9% in 2024.
      figure: 66.4% (2025)
      measures: Average billable utilisation across the 500+ firms in the 2026 SPI Professional Services Maturity Benchmark, as reported by Deltek, which sponsors the report
      provenance: vendor-published
      source_ref: DELTEK-SPI-2026
    - lever: capacity
      description: Level 5 (Optimized) organisations in the same benchmark exceed 80% billable utilisation.
      figure: above 80%
      measures: Billable utilisation of the benchmark's top maturity level
      provenance: vendor-published
      source_ref: DELTEK-SPIKPI-2026
  prerequisites:
    - Accurate time and allocation data; only 12% of leaders fully trust their systems data (KANTATA-SOPSI-2026)
  risks_and_guardrails:
    - Deltek's summary of the SPI benchmark gives a best-practice indicator of 70-75% or more, balanced against burnout and quality (DELTEK-SPIKPI-2026)
    - Utilisation targets applied to individuals are performance monitoring, which EU AI Act Annex III 4(b) lists as high-risk where AI evaluates performance and behaviour (EU-AIACT-ANNEX3-2024)
  human_checkpoints:
    - The ops leader or resource manager acts on alerts; alert-to-action practice is not described in any source (PROJECTWORKS-2026)
  role_evolution: >-
    Ops leaders move from waiting for monthly reports to acting on alerts, in a vendor's description, not evidenced
    (PROJECTWORKS-2026).
  evidence_grade: C
  sources:
    - {ref: PROJECTWORKS-2026, title: "How AI Is Changing Resource Planning for Consulting Firms", publisher: Projectworks, type: vendor, url: "https://www.projectworks.com/blog/how-ai-changes-resource-planning", date: "2026-06-25", access: full, locator: "Section on utilisation and margin monitoring"}
    - {ref: ROCKETLANE-2026, title: "AI for PS Resource Allocation: 2026 Guide", publisher: Rocketlane, type: vendor, url: "https://rocketlane.com/blogs/ai-for-ps-resource-allocation", date: "2026-07-22", access: full, locator: "Section on AI governance and allocation accuracy checks"}
    - {ref: DELTEK-DELA-2026, title: "Dela, the Deltek AI orchestrator (product page; undated, read 2026-10-19)", publisher: Deltek, type: vendor, url: "https://www.deltek.com/en/products/platform/dela/", date: "2026-10-19", access: full, locator: "Paragraph on machine learning and resource utilisation"}
    - {ref: CERTINIA-SPIBENCH-2026, title: "Analyzing the 2026 SPI Research Professional Services Maturity Benchmark Report (page undated; sitemap last-modified 2026-08-05)", publisher: Certinia, type: vendor, url: "https://certinia.com/blog/analyzing-the-2026-spi-research-professional-services-maturity-benchmark-report/", date: "2026-08", access: full, locator: "Section 'Utilization is becoming harder to protect'"}
    - {ref: DELTEK-SPI-2026, title: "2026 PSO Benchmarks: What We Learned and What's Next from the SPI Maturity Benchmark Report", publisher: "Deltek (summary of SPI Research's benchmark report)", type: vendor, url: "https://www.deltek.com/resources/articles/professional-services-benchmarks/", date: "2026-07-30", access: full, locator: "Section 2, Operational Inefficiencies Persist"}
