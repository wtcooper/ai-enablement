  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: Basware is a software company and this is its own services organisation (vendor release with Basware
    executive quotes; the release says Basware 'is expanding into' the staffing agent, so it may not yet be fully in
    production). Nextview is a Salesforce consulting partner in Northern Europe; Diabsolut a Salesforce and Certinia
    implementer; zeb a European financial-services consultancy; Icon Cloud Consulting a consulting firm. Grade B:
    several named deployments, no measured staffing result. Not used: Certinia's animated '50%+ faster staffing
    decisions' counter (page counters could not be mapped to labels) and Deltek's '40% improvement in time-to-hire',
    which measures hiring, not staffing. Audit staffing equivalents: assurance-planning-risk-assessment-22 and
    assurance-quality-management-11 (RSM Luca Resourcing; AI role unspecified).
- id: professional-services-staffing-resourcing-02
  title: Agents supplement the central professional-development staff who match consultants to client teams (McKinsey, announced)
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    McKinsey professional-development staff have matched consultants to clients behind the scenes for decades; as the
    firm has grown to almost 40,000 employees that process has become more complex (BLOOMBERGLAW-MCKINSEY-2026).
  solution: >-
    Bloomberg Law reports that McKinsey plans to use AI agents to help choose the consultants assigned to client teams,
    supplementing the professional-development employees. Its North America chief people officer is quoted saying the
    aim is to ensure "we get the best people in the right situations" (BLOOMBERGLAW-MCKINSEY-2026).
  outcomes:
    - lever: quality
      description: None published; the article describes a plan, with no result, pilot size or timeline in the readable part.
      figure: none published
      measures: n/a
      provenance: self-reported
      source_ref: BLOOMBERGLAW-MCKINSEY-2026
  prerequisites:
    - Not described in the readable part of the article (BLOOMBERGLAW-MCKINSEY-2026)
  risks_and_guardrails:
    - The article says the shift may surprise some of the firm's customers (BLOOMBERGLAW-MCKINSEY-2026)
    - EU AI Act Annex III point 4(b) lists AI used to allocate tasks based on individual behaviour or personal traits or characteristics as high-risk; scope needs legal review (EU-AIACT-ANNEX3-2024)
  human_checkpoints:
    - Agents supplement rather than replace the professional-development staff, per the opening paragraphs (BLOOMBERGLAW-MCKINSEY-2026)
  role_evolution: >-
    Professional-development staff keep the matching role, with agents added to their work; no role change is stated
    (BLOOMBERGLAW-MCKINSEY-2026).
  evidence_grade: C
  sources:
    - {ref: BLOOMBERGLAW-MCKINSEY-2026, title: "McKinsey Plans to Use AI Agents to Help Select Client Teams (paywalled; opening paragraphs only)", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/financial-accounting/mckinsey-plans-to-use-ai-agents-to-help-select-client-teams", date: "2026-05-01", access: full, locator: "Opening three paragraphs; rest paywalled"}
    - {ref: EU-AIACT-ANNEX3-2024, title: "Annex III: High-risk AI systems referred to in Article 6(2) (text of Regulation (EU) 2024/1689 of 13 June 2024; unofficial reproduction)", publisher: "European Union (text reproduced by the Future of Life Institute, artificialintelligenceact.eu)", type: regulator, url: "https://artificialintelligenceact.eu/annex/3/", date: "2024-06-13", access: full, locator: "Point 4(b)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Consulting firm (strategy consulting). Only the opening paragraphs were readable; treat it as a partial read. The
    word 'plans' is the source's. It is the only named large-firm AI staffing announcement found. The same change at
    mid-size firms through PSA products is professional-services-staffing-resourcing-01.
- id: professional-services-staffing-resourcing-03
  title: Staffing demand read from client emails, portals and signed SOWs, turned into roles and suggested assignments
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Consulting firms receive a constant stream of requests by email, procurement portals and RFPs. Someone reads the
    email, copies it into the pipeline, compares it with available consultants and checks with managers, and may not
    answer the same day (CINODE-2026). Once a deal closes, kickoff preparation, including building the plan and
    finding people, takes days (ROCKETLANE-2026).
  solution: >-
    Cinode's MailMatch reads incoming emails, follows links to procurement portals and reads PDF and Word attachments
    to extract roles, skills, dates, scope and location; it creates a pipeline project with one role per position,
    runs semantic matching weighted for must-haves, and lets the user book directly (CINODE-2026). Rocketlane's
    Workforce Agent turns a statement of work (SOW: the scope, deliverables and fees) into a draft plan with suggested
    resource assignments (ROCKETLANE-2026). Certinia lists agents that draft SOWs, build implementation plans and hand
    deals from sales to delivery (CERTINIA-VEDA-2026).
  outcomes:
    - lever: speed
      description: Rocketlane says kickoff preparation 'compresses from days to hours'; no baseline or customer given.
      figure: days to hours (qualitative)
      measures: Vendor's description of kickoff preparation time; no numerator or denominator
      provenance: vendor-published
      source_ref: ROCKETLANE-2026
    - lever: growth
      description: Cinode claims more won assignments and higher utilisation, with no figure.
      figure: none published
      measures: n/a
      provenance: vendor-published
      source_ref: CINODE-2026
  prerequisites:
    - Maintained consultant profiles with skills, certifications and availability, and a shared inbox and pipeline in the same system (CINODE-2026)
    - A signed SOW in structured form and a queryable skills matrix (ROCKETLANE-2026)
  risks_and_guardrails:
    - Suggested assignments rest on skills data that TSIA says is often self-reported and stale (TSIA-RM-2026)
    - Cinode says users keep the same flow and decide when AI becomes part of the process (CINODE-2026)
  human_checkpoints:
    - A staffer reviews matches and decides the booking (CINODE-2026)
    - The SOW output is a draft with suggested assignments; no automatic booking is described (ROCKETLANE-2026)
  role_evolution: >-
    Staffers stop re-keying emails and searching spreadsheets (CINODE-2026); no role change is described.
  evidence_grade: C
  sources:
    - {ref: CINODE-2026, title: "The entire matching flow in Cinode: From email to booked consultant with AI", publisher: Cinode, type: vendor, url: "https://cinode.com/en/blog/cinode-en/the-entire-matching-flow-in-cinode-from-email-to-booked-consultant-with-ai/", date: "2026-05-13", access: full, locator: "Steps 1 to 3 and the full-flow summary"}
    - {ref: ROCKETLANE-2026, title: "AI for PS Resource Allocation: 2026 Guide", publisher: Rocketlane, type: vendor, url: "https://rocketlane.com/blogs/ai-for-ps-resource-allocation", date: "2026-07-22", access: full, locator: "Level 3 Workforce AI paragraph"}
    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: System of Action for Professional Services (product page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10-19", access: full, locator: "Plan and Deliver agent lists"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "'Skills Data Becomes Outdated'"}
  last_reviewed: "2026-10-19"
  notes: >-
    Vendor product descriptions only; no named customer or result. Cinode is a Swedish consulting-staffing platform;
    Rocketlane sells to implementation and services teams. Plan drafting from the SOW belongs to
    professional-services-delivery-management-01; this entry keeps the role extraction and suggested assignment.
- id: professional-services-staffing-resourcing-04
  title: Rolling demand and capacity forecast from pipeline and delivery data, by role and skill, with what-if scenarios
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Pipeline lives in the CRM, capacity in a spreadsheet, and forecasting happens quarterly at best (PROJECTWORKS-2026).
    55% of firms in a Dayshape survey miss, delay or turn down client work because of capacity constraints, and only a
    small minority can accurately forecast workforce capacity more than 12 months ahead (DAYSHAPE-ONREC-2026). More than 66% of
    200 leaders in a Kantata-sponsored survey turned down work because of resourcing constraints (KANTATA-SOPSI-2026).
    In accounting firms, signals about open jobs, slow client documents and deadlines sit in different systems, so
    capacity planning is 'usually too late' (ENTERPRISEDNA-2026).
  solution: >-
    Connect the CRM and capacity plan into a rolling forecast that applies win rates and seasonal patterns and shows
    where demand will exceed supply by role, skill and period, updating when deals move (PROJECTWORKS-2026). Test cases
    such as two deals closing in the same month to see the capacity, utilisation and margin effect (ROCKETLANE-2026).
    Kantata customer Hakkoda moved from forecasting four weeks ahead to three to six months ahead (KANTATA-FORECAST-2026).
    For accounting firms, a vendor describes forecasting workload by client, deadline, service line, staff availability
    and job stage so a manager can move work before busy season (ENTERPRISEDNA-2026); a sponsored CPA Practice Advisor
    article by a Robert Half executive recommends an early capacity analysis with contract talent as a planned component
    (CPAPA-SAAH-2026).
    Refining forecasts from pipeline and delivery patterns was the AI support respondents most wanted (72.1%;
    KANTATA-RMI-REPORT-2026, Q16).
  outcomes:
    - lever: quality
      description: Kantata's product page lists results beside a Hakkoda customer quote.
      figure: 10% absolute improvement in average project margin; about 5% improvement in allocated resource utilisation rate
      measures: Improvements as listed on the vendor page; baseline, period and whether 'about 5%' is points or relative are not stated, nor whether the forecasting used AI
      provenance: vendor-published
      source_ref: KANTATA-FORECAST-2026
    - lever: quality
      description: Deltek states a 20% improvement in forecast accuracy from connecting people, projects and financials in one application.
      figure: 20%
      measures: Improvement in forecast accuracy as worded on the product page; no baseline or sample
      provenance: vendor-published
      source_ref: DELTEK-POLARIS-2026
    - lever: quality
      description: Among organisations using AI to optimise essential processes, 52% report improved forecast accuracy or utilisation.
      figure: 52%
      measures: Respondents reporting improved forecast accuracy or utilisation, from a Censuswide survey of 200 leaders for Kantata; the base of the AI-using subset is not stated
      provenance: vendor-published
      source_ref: KANTATA-SOPSI-2026
    - lever: quality
      description: 76% of leaders say AI is already improving resource-planning and allocation decisions.
      figure: 76%
      measures: Share of 400 UK and US senior leaders in the Dayshape survey, as summarised by Onrec
      provenance: vendor-published
      source_ref: DAYSHAPE-ONREC-2026
  prerequisites:
    - Pipeline (CRM), resource plan and financials connected, with win-rate history to weight opportunities (PROJECTWORKS-2026; DELTEK-POLARIS-2026)
    - Trusted data; only 12% of leaders fully trust their systems data, down from 24% a year earlier (KANTATA-SOPSI-2026)
    - For accounting firms, job status, task history, document receipt and due dates available to the forecast (ENTERPRISEDNA-2026)
  risks_and_guardrails:
    - Accelo's write-up says AI amplifies whatever foundation exists, so layering it on fragmented systems gives faster confusion; its CEO says that without the right data foundation it is hard to leverage AI (ACCELO-TSIA-2026)
    - In the Deltek government-contracting findings, 29% named inaccurate forecasts among top AI concerns (DELTEK-CLARITY-2026; adjacent population)
    - No error rate, backtest or accuracy measure for an AI capacity forecast was found in any source
    - Demand for Big Law hours rose 4.2% in H1 2026, so plans should not assume AI has reduced workload (BLOOMBERG-AICOST-2026; see professional-services-staffing-resourcing-20)
  human_checkpoints:
    - The ops leader reviews the forecast and decides hiring, contracting and bids; no source describes a forecast triggering these automatically (PROJECTWORKS-2026; TSIA-RM-2026)
    - Enterprise DNA says its tool does not replace the practice manager or team lead (ENTERPRISEDNA-2026)
  role_evolution: >-
    In Projectworks' description the ops leader opens each week with a rolling forward view instead of a quarterly
    forecast (PROJECTWORKS-2026). TSIA frames resource management as a strategic capability rather than an operational
    function filling open roles (TSIA-RM-2026).
  evidence_grade: C
  sources:
