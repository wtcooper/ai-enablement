- id: professional-services-staffing-resourcing-12
  title: Central, skills-based resourcing with open opportunity boards in place of partner-led or local allocation
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, data-reporting]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Work was allocated by partners calling around; at Womble Bond Dickinson a lawyer might agree to work and then lack
    capacity when a deadline moved, so the partner restarted the process (BIGHAND-WBD-2026). At DLA Piper, associates
    working closely with particular partners could be more visible for new matters (BIGHAND-DLA-2026). BigHand's survey
    figures: 43% of law-firm resourcing decisions are lawyer-led (BIGHAND-DLAPR-2026) and 37% of firms say partners
    resource on personal preference (BIGHAND-DLA-2026). At Deutsche Telekom each business ran its own staffing tool and
    project managers could only tap their local employee base, so best-fit people were overlooked (EIGHTFOLD-DT-2025).
  solution: >-
    A central resourcing team works from a skills and sectors matrix, an opportunities board where practice groups post
    open requests so associates can volunteer, and forecasting tools to compare workloads (BIGHAND-DLA-2026;
    BIGHAND-WBD-2026). Reed Smith's Smart Resourcing uses processes and AI toolsets for decision support on staffing
    client engagements, tracks work requests, identifies skills-development areas and calculates diversity, equity and
    inclusion metrics; lawyers can check whether their skills are underused (REEDSMITH-SMARTRES-2023). Deutsche Telekom
    planned to apply Eightfold's skills-based matching to project staffing across the group, piloting with a technology
    delivery organisation of about 1,000 people and later its consulting businesses, and to list projects in its internal
    opportunity marketplace so employees can apply (EIGHTFOLD-DT-2025). Projectworks describes development goals as a
    searchable field next to skills and availability (PROJECTWORKS-2026).
  outcomes:
    - lever: speed
      description: DLA Piper reports time saved finding resources at half-year end across its UK and Australian offices.
      figure: 600+ hours (about GBP 673,000 in stated value)
      measures: Hours saved on finding resources at half-year end, as reported by DLA Piper through BigHand; basis of the GBP value not stated
      provenance: vendor-published
      source_ref: BIGHAND-DLAPR-2026
    - lever: capacity
      description: BigHand reports a utilisation increase at Womble Bond Dickinson over two years since adopting the platform; the case-study body places it in the real estate practice group (5% a year).
      figure: 10%
      measures: Increase in utilisation over two years since implementation, in one practice group (real estate) per the case-study text; baseline and definition not given; not firm-wide
      provenance: vendor-published
      source_ref: BIGHAND-WBD-2026
    - lever: experience
      description: Womble Bond Dickinson reports higher staff retention within one practice group.
      figure: 33.3%
      measures: Increase in staff retention in data from one practice group using the platform; counts not given; not firm-wide
      provenance: vendor-published
      source_ref: BIGHAND-WBD-2026
  prerequisites:
    - Lawyers forecast their own workload weekly; WBD tells them the forecast is a starting point for conversation (BIGHAND-WBD-2026)
    - Dedicated resource managers and practice-group buy-in, with the system configured differently for different teams (BIGHAND-WBD-2026)
    - An internal opportunity marketplace and skills data (EIGHTFOLD-DT-2025)
  risks_and_guardrails:
    - DLA Piper's resource manager says people are still needed to understand the nuance of allocation and development (BIGHAND-DLA-2026)
    - All outcome figures are vendor-published case-study figures with no independent measurement (BIGHAND-DLA-2026; BIGHAND-WBD-2026)
    - EU AI Act Annex III 4(b) applies where AI allocates tasks based on individual behaviour or traits (EU-AIACT-ANNEX3-2024); an unresolved January 2026 class action targets applicant scoring by a skills platform (FISHERPHILLIPS-EIGHTFOLD-2026)
  human_checkpoints:
    - Resource managers hold a conversation with requesters on the opportunities board to ensure fair distribution (BIGHAND-WBD-2026)
    - Reed Smith describes its tool as decision support, so staffing decisions stay with people (REEDSMITH-SMARTRES-2023)
  role_evolution: >-
    Resourcing professionals become strategic partners balancing wellbeing and workforce planning (BIGHAND-DLA-2026);
    associates can volunteer for matters they would not have seen under a partner-led model (BIGHAND-WBD-2026). Reed
    Smith has a global director of Smart Resourcing (REEDSMITH-SMARTRES-2023).
  evidence_grade: B
  sources:
    - {ref: BIGHAND-DLA-2026, title: "A Global Firm Needs a Global View: DLA Piper Scales Legal Resourcing Excellence with BigHand Resource Management (case study)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/case-studies/dla-piper-bighand-resource-management/", date: "2026-06-17", access: full, locator: "'The Challenge: Mapping the Wild West'; 'The Solution'; 'Success by the Numbers'"}
    - {ref: BIGHAND-DLAPR-2026, title: "DLA Piper Reports More Than 600 Hours Saved at Half-Year End with BigHand Resource Management (press release)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/news/dla-piper-bighand-resource-management-press-release/", date: "2026-06-18", access: full, locator: "Paragraphs 1-3"}
    - {ref: BIGHAND-WBD-2026, title: "Womble Bond Dickinson Improves Utilization & Retention with BigHand Resource Management (case study)", publisher: BigHand, type: vendor, url: "https://www.bighand.com/en-us/resources/case-studies/womble-bond-dickinson-bighand-resource-management/", date: "2026-03-16", access: full, locator: "'Success by the Numbers'; 'The Challenge'; 'The Solution'"}
    - {ref: REEDSMITH-SMARTRES-2023, title: "Reed Smith Smart Resourcing team selected to CIO 100", publisher: Reed Smith, type: firm, url: "https://www.reedsmith.com/news/reed-smith-smart-resourcing-team-selected-to-cio-100/", date: "2023-03-27", access: full, locator: "Paragraphs 1-4"}
    - {ref: EIGHTFOLD-DT-2025, title: "Deutsche Telekom seizes opportunity to apply AI to project staffing with Eightfold Resource Management (customer story; PDF undated, 2025-03 is its creation date)", publisher: Eightfold AI, type: vendor, url: "https://eightfold.ai/wp-content/uploads/deutsche-telekom-seizes-opportunity-ai-project-staffing-eightfold-resource-management.pdf", date: "2025-03", access: full, locator: "Pages 2-4: challenge, solution, expected results, future pilot"}
    - {ref: PROJECTWORKS-2026, title: "How AI Is Changing Resource Planning for Consulting Firms", publisher: Projectworks, type: vendor, url: "https://www.projectworks.com/blog/how-ai-changes-resource-planning", date: "2026-06-25", access: full, locator: "Section on finding people for a role"}
    - {ref: EU-AIACT-ANNEX3-2024, title: "Annex III: High-risk AI systems referred to in Article 6(2) (text of Regulation (EU) 2024/1689 of 13 June 2024; unofficial reproduction)", publisher: "European Union (text reproduced by the Future of Life Institute, artificialintelligenceact.eu)", type: regulator, url: "https://artificialintelligenceact.eu/annex/3/", date: "2024-06-13", access: full, locator: "Point 4(b)"}
    - {ref: FISHERPHILLIPS-EIGHTFOLD-2026, title: "Job Applicants Sue AI Screening Company for FCRA Violations: 5 Key Takeaways for Employers", publisher: Fisher Phillips LLP, type: firm, url: "https://www.fisherphillips.com/en/news-insights/job-applicants-sue-ai-screening-company-for-fcra-violations.html", date: "2026-01-26", access: full, locator: "Opening paragraphs"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: DLA Piper and Womble Bond Dickinson are law firms; their BigHand platform is not described as AI, and
    the entry is included because it is the only named, figured law-firm resourcing deployment and the data layer AI
    resourcing needs. Reed Smith (law firm) is the named AI decision-support use, from a 2023 announcement; its 2026
    status was not confirmed. Deutsche Telekom is a telecom group with consulting businesses; its pilot was described as
    upcoming and no result was found. Grade B rests on named deployments; all figures are vendor-published. Stretch
    assignments and development effects belong to talent-learning (see professional-services-talent-learning-12).
- id: professional-services-staffing-resourcing-13
  title: Algorithm assigns cases to analysts in place of managers (randomised trial in a public enforcement agency)
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, transaction-processing]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Assigning legally complex, deadline-bound cases to analysts is a matching problem between case complexity and
    worker skill; managers use soft information about who fits which case, which is hard to put in data (IPA-PERU-2026).
  solution: >-
    Peru's environmental enforcement agency (OEFA) tested replacing manager assignment with case lists produced by a
    linear-optimisation algorithm that selects and orders cases given analyst capacity and expected stage times. It is
    optimisation, not machine learning, and the only randomised test of algorithmic assignment of expert work found for
    this module (IPA-PERU-2026). The authors cite an earlier field experiment (Bai et al. 2022) in which workers saw
    algorithmic assignment as fairer and became more productive, so results depend on setting (IPA-PERU-2026).
  outcomes:
    - lever: speed
      description: Analysts given algorithm-selected cases were about 5 percentage points less likely to conclude a case on time than those whose cases managers assigned.
      figure: about 5 percentage points lower (control about 40%)
      measures: Share of cases concluded on time, algorithm versus manager assignment, across 1,405 enforcement cases, 95 analysts, eight sectors
      provenance: independent
      source_ref: IPA-PERU-2026
    - lever: quality
      description: Fines, appeal rates and appeal outcomes did not differ.
      figure: no difference found
      measures: Enforcement quality proxies (fines, probability of appeal, appeal outcomes), same sample
      provenance: independent
      source_ref: IPA-PERU-2026
  prerequisites:
    - Capacity parameters per analyst and case-level complexity and expected processing times (IPA-PERU-2026)
  risks_and_guardrails:
    - The algorithm removed managers' soft information; managers used discretion to match complex cases to experienced analysts, and automated assignment broke this link (IPA-PERU-2026)
    - The authors say the experiment did not test algorithmic support with manager override, which may yield different outcomes (IPA-PERU-2026)
    - A tool like this would fall under California's 'allocation or assignment of work' rule unless human involvement meets the regulation's test (CPPA-CCPAREGS-2026)
  human_checkpoints:
    - None on the normal path in the automated arm, by design; managers kept assignment in the control arm (IPA-PERU-2026)
  role_evolution: >-
    Manager discretion proved valuable in this setting; workloads became more equal under the algorithm, which the
    authors say may improve perceived fairness, and they favour hybrid designs that keep discretion (IPA-PERU-2026).
  evidence_grade: B
  sources:
    - {ref: IPA-PERU-2026, title: "Automated Assignment and Bureaucrat Productivity: Evidence from a Field Experiment in Peru (working paper, Ferreira and Cermeno Leon)", publisher: "Innovations for Poverty Action / Southern Methodist University", type: academic, url: "https://poverty-action.org/sites/default/files/2026-07/main_assignment_enforcement_peru_2025.pdf", date: "2026-06-11", access: full, locator: "Abstract (p. 1); introduction (pp. 2-4)"}
    - {ref: CPPA-CCPAREGS-2026, title: "California Consumer Privacy Act Regulations, effective 1/1/2026 (Article 11, Automated Decisionmaking Technology)", publisher: California Privacy Protection Agency, type: regulator, url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf", date: "2026-01-01", access: full, locator: "s.7001(e)(1), s.7001(ddd)(4)(B)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Capped at B: independent, pre-registered randomised measurement, but of case assignment in a public agency, not a
    professional services firm, and of optimisation rather than generative AI. Working paper, not peer reviewed. The
    authors argue the setting resembles legal, consulting, audit and compliance work; that is their claim.
- id: professional-services-staffing-resourcing-14
  title: Suggested completion dates shown on cases while managers keep assignment (randomised trial in a public agency)
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Analysts working a backlog of deadline-bound cases need cues on sequencing; managers kept the assignment decision but
    lacked a scheduling prompt (IPA-PERU-2026).
  solution: >-
    The same OEFA system displayed suggested completion dates on randomly chosen cases, leaving case selection with
    managers or the algorithm: a light scheduling aid that keeps human discretion (IPA-PERU-2026).
  outcomes:
    - lever: speed
      description: Suggested completion dates raised timely completion, mostly among manager-assigned cases.
      figure: about 4 percentage points higher
      measures: Share of cases completed on time with versus without a suggested date (1,405 cases, 95 analysts); fines and appeals unaffected
      provenance: independent
      source_ref: IPA-PERU-2026
  prerequisites:
    - Case-level expected processing times for the main procedural stages (IPA-PERU-2026)
  risks_and_guardrails:
    - The nudge did not offset the negative effect of algorithmic case selection (IPA-PERU-2026)
    - "Reviewer note: shown for one agency and one case type; not tested on professional services work"
  human_checkpoints:
    - Managers keep case selection in the manager-assigned arm; dates are suggestions (IPA-PERU-2026)
  role_evolution: >-
    The authors read the result as favouring hybrid designs that keep managerial discretion with light-touch process
    support (IPA-PERU-2026).
  evidence_grade: B
  sources:
    - {ref: IPA-PERU-2026, title: "Automated Assignment and Bureaucrat Productivity: Evidence from a Field Experiment in Peru (working paper, Ferreira and Cermeno Leon)", publisher: "Innovations for Poverty Action / Southern Methodist University", type: academic, url: "https://poverty-action.org/sites/default/files/2026-07/main_assignment_enforcement_peru_2025.pdf", date: "2026-06-11", access: full, locator: "Abstract; introduction pp. 3-4"}
  last_reviewed: "2026-10-19"
  notes: >-
    Capped at B for the same reason as professional-services-staffing-resourcing-13: independent randomised measurement
    of an adjacent process (public-sector case scheduling). Working paper.
- id: professional-services-staffing-resourcing-15
  title: One professional working with AI staffed where a two-person team would have been (adjacent field experiment)
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Team composition rules assume AI is absent. If AI replaces some benefits of collaboration, staffing two people on a
    task may add cost without adding quality (NBER-DELLACQUA-2025).
  solution: >-
    Staff a single professional with AI where a pair would have been used. A pre-registered field experiment at Procter
    & Gamble randomly assigned 776 professionals to work with or without AI, alone or in two-person teams, on real
    product-development challenges (NBER-DELLACQUA-2025).
  outcomes:
    - lever: capacity
      description: Individuals with AI matched the performance of teams without AI.
      figure: performance matched (no ratio in the abstract)
      measures: 776 Procter & Gamble professionals randomly assigned with or without AI, alone or in pairs, on product innovation challenges
      provenance: independent
      source_ref: NBER-DELLACQUA-2025
  prerequisites:
    - Tasks resembling the experiment's; it was not run on client service delivery (NBER-DELLACQUA-2025)
  risks_and_guardrails:
    - "In a three-month trial with 133 patent lawyers at 11 US IP firms, the durable judgment advantage concentrated in senior lawyers and juniors' scores bifurcated; the trial was run and funded by Google, whose model was tested, and six of seven authors disclose Google ties (NBER-AUTOR-2026)"
    - Early-career employment in AI-exposed occupations was 19% below the less-exposed trend by June 2026 in ADP payroll data, driven by reduced hiring; the authors call this descriptive, not causal (STANFORD-CANARIES-2026)
    - A Danish study found no earnings or recorded-hours effects larger than 2% two years after ChatGPT's launch, while employers reorganised tasks (NBER-HUMLUM-2025)
  human_checkpoints:
    - Not described; the experiment compares conditions and is not a staffing policy (NBER-DELLACQUA-2025)
  role_evolution: >-
    AI-using professionals produced balanced solutions across R&D and commercial backgrounds, reducing functional silos
    (NBER-DELLACQUA-2025). Workforce shape and the pyramid are in professional-services-talent-learning-20.
  evidence_grade: B
  sources:
    - {ref: NBER-DELLACQUA-2025, title: "The Cybernetic Teammate: A Field Experiment on Generative AI Reshaping Teamwork and Expertise (NBER Working Paper 33641; Organization Science, online June 2026)", publisher: "National Bureau of Economic Research (Dell'Acqua et al.)", type: academic, url: "https://www.nber.org/papers/w33641", date: "2025-04", access: full, locator: "Abstract"}
    - {ref: NBER-AUTOR-2026, title: "Does AI Assistance Enhance or Erode Expertise? Evidence from a Three-Month Field Experiment in Patent Drafting (NBER Working Paper 35720)", publisher: "National Bureau of Economic Research (Autor, Rodchenko, Martin, Iscenko, Strand, Pearl, Ferere)", type: academic, url: "https://www.nber.org/papers/w35720", date: "2026-09-03", access: full, locator: "Abstract and disclosures"}
    - {ref: STANFORD-CANARIES-2026, title: "Canaries in the Coal Mine? Six Facts about the Recent Employment Effects of Artificial Intelligence (working paper, revised 2026-08-12)", publisher: "Stanford Digital Economy Lab (Brynjolfsson, Chandar, Chen)", type: academic, url: "https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine/", date: "2026-08-12", access: full, locator: "Abstract"}
    - {ref: NBER-HUMLUM-2025, title: "Still Waters, Rapid Currents: Early Labor Market Transformation under Generative AI (NBER Working Paper 33777)", publisher: "National Bureau of Economic Research (Humlum, Vestergaard)", type: academic, url: "https://www.nber.org/papers/w33777", date: "2025-05", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-19"
  notes: >-
    Capped at B: independent randomised evidence at a named organisation, but in consumer-goods product development, not
    professional services staffing; extrapolation to client work is the reader's judgement. The NBER disclosures say P&G
    gave gifts to the Harvard Business School institute behind the study and one author consulted for P&G in 2021-2022.
    Junior development effects belong to talent-learning (professional-services-talent-learning-11, -12).
    NBER-AUTOR-2026 provenance: vendor-published (run and funded by Google, whose model was tested; NBER working paper).
- id: professional-services-staffing-resourcing-16
  title: AI agents planned, allocated and costed alongside people as assignable capacity
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, data-reporting]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Capacity planning assumed people and hourly rates. 87% of 200 leaders plan to use AI agents as part of their
    workforce (KANTATA-SOPSI-2026), yet 52.7% of Resource Management Institute respondents are not equipped to manage
    hybrid human-agent teams and 4% feel well equipped (KANTATA-RMI-2026).
  solution: >-
    Treat agents as assignable resources with capacity and cost, and plan mixed teams. Planview announced Agent Resource
    Management to plan, govern and cost human and agent capacity, including scenario modelling of the human-to-agent mix
    and tracking agent spend and accountability, with availability from Fall 2026 (SDTIMES-PLANVIEW-2026). Accelo and
    TSIA describe separating structured, repeatable work (status reports, reconciliations, documentation) from work that
    needs people when staffing (ACCELO-TSIA-2026); TSIA's third maturity level optimises work across consultants,
    subcontractors, partners and AI agents in one model (TSIA-RM-2026). Kantata's chief product strategy officer predicts agents will be
    planned, allocated, measured and priced like capacity (KANTATA-FORBES-2026).
  outcomes:
    - lever: capacity
      description: No organisation in the study has agents operationalised as assignable resources; 10.7% are implementing formal pilots, 25.3% are in exploratory experiments and 32% do not have it on the roadmap.
      figure: 0% operational; 10.7% piloting
      measures: Shares of respondents by status in Q8 (44 organisations; the insights page rounds the pilot share to 11%)
      provenance: vendor-published
      source_ref: KANTATA-RMI-REPORT-2026
    - lever: capacity
      description: Leaders expect their systems to attribute work, costs and value across humans and AI agents.
      figure: 90%
      measures: Share of 200 leaders (Censuswide for Kantata)
      provenance: vendor-published
      source_ref: KANTATA-SOPSI-2026
    - lever: capacity
      description: Illustration only; a 200-hour engagement with 60 agent-eligible hours would need 140 human hours.
      figure: 200 to 140 hours (hypothetical)
      measures: Hypothetical engagement used by Accelo to explain the idea; not measured
      provenance: vendor-published
      source_ref: ACCELO-TSIA-2026
  prerequisites:
    - A register of agent capabilities, reliability and oversight needs alongside human skills (TSIA-RM-2026)
    - A rate, cost and capacity model for agents; 10% named unclear economics and value measurement of AI use as a gap, and 20% unclear ownership of AI decisions (KANTATA-RMI-REPORT-2026, Q19)
    - Playbooks and skills enablement before hybrid staffing is routine (KANTATA-RMI-2026)
  risks_and_guardrails:
    - Governance is open; ERP Today names the test as which agent actions are autonomous, which need approval, how AI work is costed and how decisions are audited (ERPTODAY-KANTATA-2026)
    - Kantata's Edwards asks how to schedule an agent, measure it beside consultants and keep hybrid delivery accountable, and says leaders must develop frameworks for this; she offers no tested answer (KANTATA-FORBES-2026)
    - California's guidance says the greater a system's autonomy, the greater the lawyer's duty to implement oversight (CALBAR-GENAI-2026, p. 5); ICMCI's code says consultants and firms remain accountable and should document significant AI-supported decisions (ICMCI-AICODE-2026, s.3.6)
    - Thomson Reuters Institute reports open questions over who manages AI agents and how human-AI team performance is evaluated (TRI-HUMANAGENT-2025)
    - The readiness data come from a small vendor-commissioned sample of 44 organisations (KANTATA-RMI-2026)
  human_checkpoints:
    - Accountability stays with humans, per Certinia (DIGINOMICA-CERTINIA-2026); how a resource manager signs off agent assignments is not described in any source
  role_evolution: >-
    Resource management takes on team composition, delivery risk and economics rather than filling hours if
    outcome-based pricing spreads, though one in two respondents are unsure their firm will adopt it (KANTATA-RMI-2026).
    TSIA describes the resource management office becoming a 'hybrid workforce command center' (TSIA-RM-2026).
  evidence_grade: C
  sources:
    - {ref: SDTIMES-PLANVIEW-2026, title: "Planview Launches Agent Resource Management, Redefining Portfolio Resource Management for the AI Era", publisher: SD Times, type: press, url: "https://sdtimes.com/agentic-ai/planview-launches-agent-resource-management-redefining-portfolio-resource-management-for-the-ai-era/", date: "2026-05-04", access: full, locator: "Announcement paragraphs and availability statement"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services (Resource Management Institute study commissioned by Kantata)", publisher: Kantata (study by the Resource Management Institute), type: survey, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Paragraphs on hybrid teams, outcome-based pricing and the sample"}
    - {ref: KANTATA-RMI-REPORT-2026, title: "Resource Management in the Age of AI (full survey report; 44 organisations)", publisher: "Resource Management Institute (RTM Consulting) for Kantata", type: survey, url: "https://get.kantata.com/rs/677-LEJ-696/images/AI_in_Resource_Management_Survey.pdf", date: "2026-04", access: full, locator: "Q8 p. 10; Q9 p. 11; Q19 p. 21"}
    - {ref: KANTATA-SOPSI-2026, title: "Kantata Survey Reveals that 87% of Professional Services Teams Plan to Manage AI Agents as Part of Their Workforce (Censuswide survey of 200 leaders)", publisher: "Kantata (survey by Censuswide, 200 leaders)", type: survey, url: "https://www.kantata.com/blog/article/kantata-survey-reveals-that-87-of-professional-services-teams-plan-to-manage-ai-agents-as-part-of-their-workforce", date: "2026-01-08", access: full, locator: "Paragraphs on agents in the workforce and attribution across humans and agents"}
    - {ref: ACCELO-TSIA-2026, title: "How AI Is Reshaping Resource Utilization and Capacity Management (write-up of a TSIA and Accelo conversation)", publisher: Accelo, type: vendor, url: "https://www.accelo.com/blog/ai-era-resource-utilization-capacity-management", date: "2026-06-03", access: full, locator: "'The Future of Capacity Is Work Allocation'; 200-hour engagement section"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "Maturity Level 3; 'From Resource Management Office to Hybrid Workforce Command Center'"}
    - {ref: KANTATA-FORBES-2026, title: "Professional Services 2026: When AI Becomes A Billable Team Member (Forbes Technology Council post by Kantata's Sarah Edwards, republished by Kantata)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/professional-services-2026-when-ai-becomes-a-billable-team-member", date: "2026-01-16", access: full, locator: "Prediction 1"}
    - {ref: ERPTODAY-KANTATA-2026, title: "Kantata's Expertise Agent Targets the Professional Services Delivery Crunch", publisher: ERP Today, type: press, url: "https://erp.today/kantata-expertise-agent-psa-ai/", date: "2026-06-19", access: full, locator: "Section 'Agentic PSA Tests New Operating Model'"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Competence and Diligence, p. 5"}
    - {ref: ICMCI-AICODE-2026, title: "Code of Responsible Use of Artificial Intelligence for the Management Consulting Profession, Version 1.0", publisher: International Council of Management Consulting Institutes (ICMCI), type: professional-body, url: "https://www.cmc-global.org/sites/default/files/public/code_of_responsible_use_of_artificial_intelligence.pdf", date: "2026-05", access: full, locator: "s.3.6 Accountability and documentation"}
    - {ref: TRI-HUMANAGENT-2025, title: "How companies are fostering the creation of human & AI agent teams", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/creating-human-ai-agent-teams", date: "2025-10-22", access: full, locator: "Section on challenges of merging HR and IT"}
    - {ref: DIGINOMICA-CERTINIA-2026, title: "Certinia unveils Veda, its AI engine for Professional Services Automation", publisher: diginomica, type: press, url: "https://diginomica.com/certinia-unveils-veda-ai-engine-professional-services-automation", date: "2026-04-15", access: full, locator: "Malhotra quotes on hybrid teams and accountability"}
  last_reviewed: "2026-10-19"
  notes: >-
    Announced products and readiness surveys only; the study shows no organisation operating assignable agents.
    Cross-references: costing agents per engagement is professional-services-delivery-management-16 (idea); engagement
    leads running people-and-agent teams is professional-services-delivery-management-14 (Thoughtworks, consulting);
    workforce shape is professional-services-talent-learning-20.
- id: professional-services-staffing-resourcing-17
  title: Experienced flexible talent used for overflow and to train and review AI tools
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Associates under billable pressure choose client work over AI training and innovation work even when offered
    credit, and knowledge management teams lack subject-matter experts to train tools, review output and build use
    cases (GEEK-LATITUDE-2026). In accounting firms, staffing and tools are adjusted after the core team is already
    stretched (CPAPA-SAAH-2026).
  solution: >-
    Firms bring in experienced attorneys on engagement terms to cover overflow, leave and projects, and to help train
    internal AI tools and review AI-generated work; Latitude's Alex Su describes this as 'outsourced leverage' (a
    colleague's term) for the middle layer of legal work (GEEK-LATITUDE-2026). The accounting piece recommends contract talent as a planned component of
    busy-season capacity (CPAPA-SAAH-2026).
  outcomes:
    - lever: capacity
      description: The provider says one law firm has dozens of its attorneys working for one rainmaker on high-volume work; no firm named and no metrics.
      figure: dozens of attorneys (one unnamed firm)
      measures: Provider's statement in a podcast; not independently confirmed
      provenance: vendor-published
      source_ref: GEEK-LATITUDE-2026
  prerequisites:
    - Remote and distributed working accepted by the firm (GEEK-LATITUDE-2026)
  risks_and_guardrails:
    - The speakers are a staffing provider with a commercial interest (GEEK-LATITUDE-2026)
    - Practitioners disagree on whether AI will cut or raise associate demand (GEEK-LATITUDE-2026; BLOOMBERGLAW-BAKER-2026)
    - ABA Formal Opinion 512 applies supervisory duties to generative AI use and, citing earlier outsourcing opinions, says lawyers must ensure third parties do the work capably and protect confidentiality (ABA-OP512-2024, Part E)
    - The accounting article is by an executive of Robert Half, a staffing provider (CPAPA-SAAH-2026)
  human_checkpoints:
    - Flexible lawyers review AI-generated work and do quality control (GEEK-LATITUDE-2026)
  role_evolution: >-
    Su says premium partner rates are unlikely to fall because of AI; the pressure lands on how firms structure the work
    beneath them (GEEK-LATITUDE-2026).
  evidence_grade: C
  sources:
    - {ref: GEEK-LATITUDE-2026, title: "Alex Su and Andy Chagui on Flexible Legal Talent, AI Pressure, and the Future of Law Firm Leverage (The Geek in Review podcast, with transcript)", publisher: "Legal Tech Monitor / The Geek in Review", type: podcast, url: "https://www.legaltechmonitor.com/2026/05/alex-su-and-andy-chagui-on-flexible-legal-talent-ai-pressure-and-the-future-of-law-firm-leverage/", date: "2026-05-18", access: full, locator: "Episode summary; transcript passages on associate credit and 'outsourced leverage'"}
    - {ref: CPAPA-SAAH-2026, title: "Avoiding 'Too Little, Too Late': How to Give Core Teams at CPA Firms Ample Support This Tax Season (sponsored content by Steve Saah, Robert Half)", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/01/27/avoiding-too-little-too-late-how-to-give-core-teams-at-cpa-firms-ample-support-this-tax-season/176902/", date: "2026-01-27", access: full, locator: "Step 3 on contract talent"}
    - {ref: BLOOMBERGLAW-BAKER-2026, title: "Baker Botts Leader Says AI Threatens Rivals' Associates, Not His", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/esg/big-law-leader-says-ai-threatens-rivals-associates-not-his", date: "2026-06-29", access: full, locator: "Opening paragraphs on associate hiring"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a LawNext copy; the ABA site blocks downloads)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part E Supervisory Responsibilities, pp. 10-11"}
  last_reviewed: "2026-10-19"
  notes: >-
    Law firms (legal flexible-talent provider) and accounting firms (sponsored article). Maturity emerging: the
    AI-support use is described only by the provider, with no named client. CLOC's 2025 data says alternative legal
    service providers are expanding into legal staffing (in-house context; CLOC-SOTI-2025, cited in the module).
- id: professional-services-staffing-resourcing-18
  title: "In-house: work reallocated between the internal legal team and outside counsel as AI lifts internal capacity"
  archetype: professional-services
  module: staffing-resourcing
  function: risk-compliance-legal
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    In-house legal teams decide what to do internally and what to send to outside counsel; AI changes what internal
    teams can absorb (ACCEVERLAW-2025).
  solution: >-
    Corporate legal departments insource work that generative AI makes manageable internally and reduce reliance on
    outside counsel for it. The survey records expectations, not a measured shift (ACCEVERLAW-2025).
  outcomes:
    - lever: capacity
      description: In-house respondents expecting to rely less on outside counsel.
      figure: 64%
      measures: Share of 657 in-house legal professionals in 30 countries (up from 58% in 2024, US respondents)
      provenance: vendor-published
      source_ref: ACCEVERLAW-2025
    - lever: capacity
      description: Respondents seeing an opportunity to insource drafting (contract management 71%, research 62%).
      figure: 78%
      measures: Share citing insourcing of drafting as an opportunity; same survey
      provenance: vendor-published
      source_ref: ACCEVERLAW-2025
  prerequisites:
    - Active generative AI use in the department; 52% in 2025 versus 23% in 2024 among US respondents (ACCEVERLAW-2025)
  risks_and_guardrails:
    - Only 9% said company policy prohibits generative AI use, down from 29% (ACCEVERLAW-2025)
    - ABA Formal Opinion 512 applies supervisory duties to generative AI use, including checking that outside providers work capably and protect confidentiality (ABA-OP512-2024, Part E); California's guidance asks managerial lawyers to set AI policies and supervise lawyers and nonlawyers (CALBAR-GENAI-2026, Duty to Supervise, p. 7)
  human_checkpoints:
    - The decision to insource or outsource a matter stays with the legal department; the survey does not describe a workflow (ACCEVERLAW-2025)
  role_evolution: >-
    61% of respondents plan to push for change in how law firms using generative AI deliver and price legal services
    (ACCEVERLAW-2025); no source describes changed roles inside legal departments.
  evidence_grade: C
  sources:
    - {ref: ACCEVERLAW-2025, title: "64% of In-House Counsel Expect GenAI to Reduce Reliance on Outside Counsel, 50% Expect Lower Outside Counsel Costs, ACC/Everlaw Survey Finds (press release)", publisher: "Everlaw and the Association of Corporate Counsel", type: survey, url: "https://www.everlaw.com.au/press/release/acc-report-2025", date: "2025-10-14", access: full, locator: "'Reliance on outside counsel is shrinking'; 'Barriers are falling fast'"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a LawNext copy; the ABA site blocks downloads)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part E Supervisory Responsibilities, pp. 10-11"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Duty to Supervise, p. 7"}
  last_reviewed: "2026-10-19"
  notes: >-
    In-house example (corporate legal departments). Grade C: a survey of expectations co-run with a vendor; no named
    department described. Function risk-compliance-legal because the in-house legal team is a support function. The
    client-side pricing push belongs to scoping-pricing. Named in-house teams keeping more drafting in-house with
    AI-first defaults are professional-services-work-production-19 (B); AI-savings terms in outside-counsel guidelines
    are professional-services-scoping-pricing-11.
- id: professional-services-staffing-resourcing-19
  title: "Idea: staff on delivery outcomes, using data on which people and agent combinations produce good results"
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [data-reporting, coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Resource managers are asked to support outcome-oriented delivery without outcome data. Only 7.3% of Resource
    Management Institute respondents say outcome data is easily accessible and routinely used in staffing; 24.6% say
    only major wins or failures are known informally and 24.6% say outcomes are not available to them
    (KANTATA-RMI-2026).
  solution: >-
    Idea: feed delivery outcomes (margin, client result, delivery risk) back into staffing so recommendations reflect
    which combinations of people or agents produce strong results. 73.4% of respondents say knowing this would be very
    or extremely valuable, and 50.9% say outcome experience already has high or very high influence on staffing for
    prospective deals (KANTATA-RMI-2026). Kantata's October 2025 release described a planned Sales Accelerator using
    delivery history to propose 'optimal human-AI resource mixes' (KANTATA-ENGINE-2025).
  outcomes:
    - lever: quality
      description: None published; the figure is the size of the gap, not a result.
      figure: 7.3%
      measures: Share of respondents (44 organisations) saying outcome data is easily accessible and routinely used in staffing decisions
      provenance: vendor-published
      source_ref: KANTATA-RMI-2026
    - lever: quality
      description: Respondents wanting proof of outcome surfaced for deal staffing.
      figure: 37%
      measures: Share selecting 'Surfacing proof of outcome' in Q16 (multi-select)
      provenance: vendor-published
      source_ref: KANTATA-RMI-REPORT-2026
  prerequisites:
    - Outcome data captured at project close and linked to team composition; 14% say outcomes exist but are hard to access (KANTATA-RMI-REPORT-2026, Q13)
    - Integrated PSA, CRM and HR data (TSIA-RM-2026)
  risks_and_guardrails:
    - Linking outcomes to named individuals is people analytics under the same worker-facing rules as other staffing AI; EU Annex III 4(b) monitoring and evaluation, Art. 26(7) worker information and Art. 86 right to an explanation (EU-AIACT-OJ-2024)
    - ICMCI's code says firms should, where practicable, test AI outputs for disparate impact and be cautious where data may not be representative (ICMCI-AICODE-2026, s.3.2)
    - One in two respondents are unsure their organisation will adopt outcome-based pricing, so the business case is not settled; sample of 44, vendor-commissioned (KANTATA-RMI-2026)
  human_checkpoints:
    - Not described; deal staffing stays with resource managers in the source's framing (KANTATA-RMI-2026)
  role_evolution: >-
    If outcome pricing spreads, respondents expect resource management to move from filling hours to maximising
    delivery success, with more responsibility for team composition and delivery risk (KANTATA-RMI-2026).
  evidence_grade: D
  sources:
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services (Resource Management Institute study commissioned by Kantata)", publisher: Kantata (study by the Resource Management Institute), type: survey, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Paragraphs on outcome data (7.3%, 24.6%, 73.4%, 50.9%) and on outcome-based pricing"}
    - {ref: KANTATA-RMI-REPORT-2026, title: "Resource Management in the Age of AI (full survey report; 44 organisations)", publisher: "Resource Management Institute (RTM Consulting) for Kantata", type: survey, url: "https://get.kantata.com/rs/677-LEJ-696/images/AI_in_Resource_Management_Survey.pdf", date: "2026-04", access: full, locator: "Q13 p. 15; Q15 p. 17; Q16 p. 18"}
    - {ref: KANTATA-ENGINE-2025, title: "Kantata unveils the Kantata Expertise Engine (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-unveils-the-kantata-expertise-engine-the-first-ai-platform-purpose-built-for-professional-services-transformation", date: "2025-10-09", access: full, locator: "Paragraph on the Sales Accelerator planned for early 2026"}
    - {ref: TSIA-RM-2026, title: "Professional Services Resource Management in the PS 2.0 Era (Bo DiMuccio)", publisher: TSIA, type: professional-body, url: "https://www.tsia.com/blog/professional-services-resource-management", date: "2026-05-27", access: full, locator: "'Create a Unified Resource Intelligence Layer'"}
    - {ref: EU-AIACT-OJ-2024, title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal text", publisher: "European Parliament and Council of the European Union (EUR-Lex)", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689", date: "2024-07-12", access: full, locator: "Annex III 4(b); Articles 26(7) and 86"}
    - {ref: ICMCI-AICODE-2026, title: "Code of Responsible Use of Artificial Intelligence for the Management Consulting Profession, Version 1.0", publisher: International Council of Management Consulting Institutes (ICMCI), type: professional-body, url: "https://www.cmc-global.org/sites/default/files/public/code_of_responsible_use_of_artificial_intelligence.pdf", date: "2026-05", access: full, locator: "s.3.2 Fairness and non-discrimination"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: professional-services organisations surveyed by the Resource Management Institute for Kantata, and a PSA
    vendor roadmap (Kantata). Idea, grade D: discussed in the study as a wish and a gap and on a vendor roadmap (Sales
    Accelerator release status not checked); no firm found using outcome data in staffing. The press release gives 50.9%
    for high influence; the report text gives 47.8% high plus 2.9% very high.
- id: professional-services-staffing-resourcing-20
  title: "Idea: check whether AI actually freed capacity, and re-base capacity plans on observed hours and demand"
  archetype: professional-services
  module: staffing-resourcing
  function: service-delivery
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Capacity models convert demand into hours per role. A Thomson Reuters Institute columnist, citing a Berkeley study
    at a 200-person technology company, argues AI intensifies work, so capacity freed by AI gets refilled
    (TRI-LAWPROF-2026). Demand for Big Law hours rose 4.2% in H1 2026 against about 1.5% normal growth, per Citi data
    quoted by Bloomberg Law (BLOOMBERG-AICOST-2026), and 59% of in-house respondents report no generative AI savings
    from their law firms yet (ACCEVERLAW-2025).
  solution: >-
    Idea: audit whether hours actually fell after AI adoption (TRI-LAWPROF-2026), check effort assumptions per task and
    role against measured hours and demand, and reset plans. SPI Research calls the gap between time AI saves and the
    revenue it generates 'the leak', and advises planning how to reprice or resell saved hours (SPI-AI-2026). Resourcing and timesheet data are the natural place to see it; no source names such a tool.
  outcomes:
    - lever: capacity
      description: Demand for lawyer time rose rather than fell in the first half of 2026.
      figure: 4.2%, against about 1.5% normal growth
      measures: Growth in demand for law-firm hours, from Citi's law-firm banking group as quoted by Bloomberg Law
      provenance: independent
      source_ref: BLOOMBERG-AICOST-2026
    - lever: capacity
      description: Share of firms saying AI saves them time; the matching revenue share is behind the paywall.
      figure: 84.8%
      measures: SPI 2026 survey of 245 organisations (landing page only)
      provenance: independent
      source_ref: SPI-AI-2026
  prerequisites:
    - Hours and allocation data from before and after AI adoption (TRI-LAWPROF-2026)
    - A view of whether freed hours are resold, repriced or redeployed (SPI-AI-2026)
  risks_and_guardrails:
    - The cited study covers one technology company, not a professional services firm; the columnist extends it to law by analogy (TRI-LAWPROF-2026)
    - Associates and non-equity partners absorbed most extra work in Q2 2026, and the ratio of non-equity to equity partner hours is the highest since late 2018 (TRI-LFFI-Q2-2026)
    - Hourly billing must reflect time actually spent, so AI-saved hours cannot be billed as worked (ABA-OP512-2024, Fees, p. 12)
    - The columnist notes firms may be using time AI saves for extra or more thorough work, so rising hours do not show that AI saved no time (BLOOMBERG-AICOST-2026)
  human_checkpoints:
    - Firm leaders audit whether associate hours actually fell or reclaimed time was refilled with more work (TRI-LAWPROF-2026)
    - Planners and practice leaders agree effort assumptions; not described in the sources
  role_evolution: >-
    Thomson Reuters's 'Scale' pathway describes AI addressing a capacity question without proportional headcount
    growth, with mid-career professionals taking management responsibility earlier (TR-FOP-REPORT-2026).
  evidence_grade: D
  sources:
    - {ref: TRI-LAWPROF-2026, title: "The AI Law Professor: When AI makes lawyers work more, not less (Tom Martin)", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/ai-law-professor-ai-makes-lawyers-work-more-not-less", date: "2026-03-03", access: full, locator: "Sections 'Three forms of intensification' and 'From productivity to purposeful practice'"}
    - {ref: BLOOMBERG-AICOST-2026, title: "Big Law AI Cost Savings Remain a Mystery as Billable Hours Jump (Big Law Business column)", publisher: Bloomberg Law, type: press, url: "https://news.bgov.com/business-and-practice/big-law-ai-cost-savings-remain-a-mystery-as-billable-hours-jump", date: "2026-09-03", access: full, locator: "Paragraphs on Citi demand data"}
    - {ref: ACCEVERLAW-2025, title: "64% of In-House Counsel Expect GenAI to Reduce Reliance on Outside Counsel, 50% Expect Lower Outside Counsel Costs, ACC/Everlaw Survey Finds (press release)", publisher: "Everlaw and the Association of Corporate Counsel", type: survey, url: "https://www.everlaw.com.au/press/release/acc-report-2025", date: "2025-10-14", access: full, locator: "'Clients will challenge the billable hour'"}
    - {ref: SPI-AI-2026, title: "The 2026 Impact of AI on Professional Services (report landing page; full report paid)", publisher: SPI Research, type: survey, url: "https://spiresearch.com/reports/2026-ai-professional-services-survey/", date: "2026-10", access: full, locator: "'The Leak' and Part III contents"}
    - {ref: TRI-LFFI-Q2-2026, title: "Q2 2026 LFFI: A heavier load, yet a faster crossing", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/lffi-q2-2026-heavy-load-picking-up-speed", date: "2026-08-10", access: full, locator: "Key takeaways; demand-by-title section"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a LawNext copy; the ABA site blocks downloads)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Fees section, p. 12"}
    - {ref: TR-FOP-REPORT-2026, title: "Future of Professionals Report 2026", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026-06-22", access: full, locator: "AI to Scale section (page undated; release date 22 June 2026 per press coverage)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea, grade D: the demand data is independent but describes the market, not a capacity-planning practice. Law firms
    (Big Law demand data) and in-house teams (ACC survey). The pricing side is in scoping-pricing and firm-finance.
- id: professional-services-staffing-resourcing-21
  title: "Idea: decision log, override tracking, disparate-impact testing and explanations for AI-assisted work allocation"
  archetype: professional-services
  module: staffing-resourcing
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Rules that name work allocation and assignment are arriving, yet only 4% of Resource Management Institute
    respondents name ethical or compliance concerns as a gap (KANTATA-RMI-REPORT-2026), and no source reports override
    or acceptance rates for staffing recommendations.
  solution: >-
    Idea: record each AI-assisted staffing recommendation and the human decision, test outcomes for disparate impact,
    and be able to explain the AI's role to an affected person. The controls are drawn from the legal texts and codes
    below; no firm was found operating this for staffing.
  outcomes:
    - lever: risk
      description: none published
      figure: none published
      measures: n/a
      provenance: self-reported
      source_ref: KANTATA-RMI-REPORT-2026
  prerequisites:
    - An inventory of which staffing tools use AI and what decisions they influence; the National Law Review lists inventorying AI tools across the employment lifecycle first (NATLAW-AIHIRING-2026)
    - A reviewer who meets California's human-involvement test (CPPA-CCPAREGS-2026, s.7001(e)(1))
  risks_and_guardrails:
    - EU deployers keep automatically generated logs for at least six months (Art. 26(6)), inform workers and representatives before use (Art. 26(7)), and affected persons can obtain explanations of the AI's role in certain Annex III decisions (Art. 86(1)) (EU-AIACT-OJ-2024); Annex III employment obligations apply from 2 December 2027 (EC-AIACT-2026)
    - California ADMT used for a significant decision, which includes allocation or assignment of work, must meet the regulation's requirements by 1 January 2027, with pre-use notice, opt-out and access provisions (CPPA-CCPAREGS-2026, ss.7200-7222)
    - UK Data (Use and Access) Act 2025 replaces UK GDPR Article 22 with Articles 22A-22D; a decision is solely automated if there is no meaningful human involvement; section 80 is fully in force from 5 February 2026 (S.I. 2026/82) (UK-DUAA-2025)
    - Illinois makes it a civil rights violation from 1 January 2026 to use AI with discriminatory effect in employment matters including terms, privileges or conditions of employment, or to fail to give notice; coverage of work assignment is not stated (ILLINOIS-HB3773-2024)
    - Colorado SB26-189, signed 14 May 2026, repeals and reenacts the state AI act for automated decision-making technology in consequential decisions including employment; the bill summary dates developer duties from 1 January 2027 and gives consumers a right to request human review after an adverse decision (COLORADO-SB26189-2026)
    - New York City requires bias audits and notice for automated employment decision tools (NYC-AEDT-2023); the State Comptroller found enforcement ineffective, with nine of 12 test calls not reaching the enforcing agency (OSC-LL144-2025). Scope over work assignment was not established
    - ICMCI's code treats uses that may materially affect employment as high-risk, requires a qualified individual able to intervene or override, testing for disparate impact where practicable and documentation of significant AI-supported decisions, and warns against oversight that is nominal because of volume, speed or incentives (ICMCI-AICODE-2026, ss.1.3, 3.1, 3.2, 3.6, 11.4)
  human_checkpoints:
    - A reviewer who can interpret, review and change the decision (CPPA-CCPAREGS-2026, s.7001(e)(1)); a qualified individual able to intervene in, override or discontinue a high-risk AI system (ICMCI-AICODE-2026, s.3.1)
  role_evolution: Not described in the sources.
  evidence_grade: D
  sources:
    - {ref: EU-AIACT-OJ-2024, title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal text", publisher: "European Parliament and Council of the European Union (EUR-Lex)", type: regulator, url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689", date: "2024-07-12", access: full, locator: "Annex III 4(b); Article 26(6), 26(7); Article 86(1)"}
    - {ref: EC-AIACT-2026, title: "AI Act: regulatory framework for AI (living page; last updated 2026-10-19)", publisher: European Commission, type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", date: "2026-10-19", access: full, locator: "Application timeline"}
    - {ref: CPPA-CCPAREGS-2026, title: "California Consumer Privacy Act Regulations, effective 1/1/2026 (Article 11, Automated Decisionmaking Technology)", publisher: California Privacy Protection Agency, type: regulator, url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf", date: "2026-01-01", access: full, locator: "s.7001(e), s.7001(ddd)(4), s.7200"}
    - {ref: UK-DUAA-2025, title: "Data (Use and Access) Act 2025, section 80 (automated decision-making; new UK GDPR Articles 22A-22D)", publisher: "UK Parliament (legislation.gov.uk)", type: regulator, url: "https://www.legislation.gov.uk/ukpga/2025/18/section/80", date: "2025-06-19", access: full, locator: "s.80, new Articles 22A-22C; commencement note (in force 5.2.2026)"}
    - {ref: ILLINOIS-HB3773-2024, title: "Public Act 103-0804 (HB 3773), amending the Illinois Human Rights Act; effective 1 January 2026", publisher: Illinois General Assembly, type: regulator, url: "https://www.ilga.gov/legislation/publicacts/fulltext.asp?Name=103-0804", date: "2026-01-01", access: full, locator: "Section 2-102(L)"}
    - {ref: COLORADO-SB26189-2026, title: "SB26-189 Automated Decision-Making Technology (signed by the Governor 2026-05-14)", publisher: Colorado General Assembly, type: regulator, url: "https://leg.colorado.gov/bills/sb26-189", date: "2026-05-14", access: full, locator: "Bill summary; status table"}
    - {ref: NYC-AEDT-2023, title: "Automated Employment Decision Tools (AEDT), Local Law 144 of 2021", publisher: New York City Department of Consumer and Worker Protection, type: regulator, url: "https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page", date: "2023-07-05", access: full, locator: "Page text on bias audit, publication and notice"}
    - {ref: OSC-LL144-2025, title: "Enforcement of Local Law 144 - Automated Employment Decision Tools (Report 2024-N-6)", publisher: Office of the New York State Comptroller, type: regulator, url: "https://www.osc.ny.gov/files/state-agencies/audits/pdf/sga-2026-24n6.pdf", date: "2025-12", access: full, locator: "Audit Highlights p. 1; Findings p. 8"}
    - {ref: ICMCI-AICODE-2026, title: "Code of Responsible Use of Artificial Intelligence for the Management Consulting Profession, Version 1.0", publisher: International Council of Management Consulting Institutes (ICMCI), type: professional-body, url: "https://www.cmc-global.org/sites/default/files/public/code_of_responsible_use_of_artificial_intelligence.pdf", date: "2026-05", access: full, locator: "s.1.3; s.3.1; s.3.2; s.3.6; s.11.4"}
    - {ref: NATLAW-AIHIRING-2026, title: "Patchwork AI Hiring Laws Create Rising Compliance Risks for Employers (written before Colorado SB26-189 was signed)", publisher: The National Law Review, type: press, url: "https://natlawreview.com/article/patchwork-ai-hiring-laws-create-rising-compliance-risks-employers", date: "2026-05-12", access: full, locator: "Recommended steps"}
    - {ref: KANTATA-RMI-REPORT-2026, title: "Resource Management in the Age of AI (full survey report; 44 organisations)", publisher: "Resource Management Institute (RTM Consulting) for Kantata", type: survey, url: "https://get.kantata.com/rs/677-LEJ-696/images/AI_in_Resource_Management_Survey.pdf", date: "2026-04", access: full, locator: "Q19, p. 21"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea, grade D: a control set derived from legal and professional texts, not a described deployment. Whether any text
    applies to a given staffing tool needs legal advice. Applies to law, consulting and accounting firms and in-house
    teams alike. Function risk-compliance-legal because the controls sit with risk and legal. The same employment-AI
    controls apply to hiring and evaluation tools in professional-services-talent-learning-14 and
    professional-services-talent-learning-17.
