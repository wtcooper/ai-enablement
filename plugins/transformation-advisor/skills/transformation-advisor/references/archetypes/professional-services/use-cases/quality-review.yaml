- id: professional-services-quality-review-17
  title: In-house legal teams set bounded, reviewable AI workflows and ask outside firms for evidence of AI use and quality
  archetype: professional-services
  module: quality-review
  function: risk-compliance-legal
  work_types: [review-assurance, client-interaction]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    In-house teams receive AI-assisted work from outside counsel and vendors and cannot see how it was checked. A
    corporate chief legal officer told Thomson Reuters that quality still has to be checked and humans held
    responsible, as with junior associate work. At Legalweek 2026 firm speakers said they were still gathering the data
    on AI savings.
  solution: >-
    A Casepoint report, as summarised by eDiscovery Today, says mature legal teams are moving to bounded workflows with
    known source materials, clear constraints and reviewable outputs, and treat prompts and AI-generated analyses as
    records; it cites Starbucks as moving from no AI use to controlled internal use while strictly restricting vendor
    and outside-counsel use. GSK's chief of staff for legal and compliance said clients now ask outside firms what they
    use, how, and how it generates savings. A Ropes & Gray director said clients are beginning to ask for line-item
    transparency on whether AI was used on a task.
  outcomes:
  - lever: quality
    description: Gap between what corporate clients want from AI and what they see from providers
    figure: "78% of corporate clients rate AI-enabled quality improvements very important or essential; 6% say most or all providers deliver them"
    measures: "Share of corporate-client respondents within 1,816 professionals surveyed by Thomson Reuters (March-April 2026)"
    provenance: vendor-published
    source_ref: TR-FOP-2026
  prerequisites:
  - A records policy that covers AI queries and outputs (EDT-CASEPOINT-2026)
  - Outside-counsel guidelines that address AI
  - Matter-level tracking of AI use on the firm side (TRI-LEGALWEEK-2026)
  risks_and_guardrails:
  - A federal agency leader found Copilot query and response files in mailbox collections during a legal hold, so AI outputs are discoverable records (EDT-CASEPOINT-2026).
  - Client guidelines conflict - some demand AI use while others forbid it without permission or demand unbiased-model warranties (TRI-LEGALWEEK-2026).
  - Starbucks is named only in a blog summary of a vendor-sponsored report that was not opened (EDT-CASEPOINT-2026).
  human_checkpoints:
  - Legal team checks output against the underlying material
  - Department approves vendor and outside-counsel AI use
  - Client and firm agree the measures to report (TRI-LEGALWEEK-2026)
  role_evolution: >-
    Greenberg Traurig's Chief Pricing and Innovation Officer said clients who had been silent on AI are now asking how
    it is used on their specific matters (TRI-LEGALWEEK-2026).
  evidence_grade: B
  sources:
  - {ref: EDT-CASEPOINT-2026, title: "From AI Hype to AI Accountability: A New Report from Casepoint", publisher: "eDiscovery Today (Doug Austin)", type: press, url: "https://ediscoverytoday.com/2026/07/23/from-ai-hype-to-ai-accountability-a-new-report-from-casepoint-artificial-intelligence-trends/", date: "2026-07-23", access: full, locator: "highlights 'Your AI Prompts are Now Official Records' and 'No Broad Permission Slips'"}
  - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "'Proving AI's path to saving clients money'; 'The contradictions in the room'"}
  - {ref: TR-FOP-2026, title: "Future of Professionals Report 2026", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026", access: full, locator: "'AI capability is now a procurement criterion' paragraph"}
  - {ref: TR-AIPS-2026, title: "2026 AI in Professional Services Report", publisher: "Thomson Reuters Institute", type: survey, url: "https://tax.thomsonreuters.com/content/dam/ewp-m/documents/thomsonreuters/en/pdf/reports/2026-ai-in-professional-services-report.pdf", date: "2026-01", access: full, locator: "client-firm gap section, CLO quote"}
  last_reviewed: '2026-10-19'
  notes: >-
    In-house (corporate legal departments: Starbucks, GSK; a federal agency). Merged from practice-16 (B) and
    discourse-17 (C). Grade B with caution: Starbucks and GSK are named, but Starbucks only through a blog summary of a
    Casepoint-sponsored report. Thomson Reuters is a vendor, so its survey figure is treated as vendor-published. Related:
    professional-services-acceptance-risk-11 (idea: register of client AI restrictions), professional-services-scoping-pricing-09
    and -11 (evidence of savings; AI-savings terms in guidelines).

- id: professional-services-quality-review-18
  title: Documented AI governance ready for professional indemnity insurers at proposal and renewal
  archetype: professional-services
  module: quality-review
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Professional indemnity policies mostly do not mention AI, but insurers are starting to ask how AI-enabled work is
    supervised, and a claim from unverified AI output raises coverage questions. The Law Society's agentic AI research
    reports that professional indemnity insurance rarely covers AI-related mistakes.
  solution: >-
    Firms keep a record of AI use, protocols, verification standards and audit trails to answer insurer questions at
    proposal and renewal. Insurers for CPA firms say they ask whether a firm uses AI, polices it and has protocols, and
    expect to formalise questions in a year or two. A broker says the renewal question is largely check-the-box for now.
  outcomes:
  - lever: cost
    description: Broker expectation, not a measured result
    figure: "Expected within 12 to 18 months: firms without documented protocols fall out of preferred-risk tiers"
    measures: "A senior broker's forecast as quoted by Independent Agent magazine (March 2026); not a tracked metric"
    provenance: self-reported
    source_ref: IAMAG-LAWPL-2026
  prerequisites:
  - A written AI protocol and the means to show it is followed (see professional-services-quality-review-01 and -03)
  risks_and_guardrails:
  - Coverage is uncertain for claims where the professional service was largely AI-produced and weakly supervised (DACB-PI-2026).
  - Aon's risk-control lead said insurers had seen no substantive AI claims at accounting firms yet, so underwriting questions are still informal (ACCOUNTINGTODAY-INSURERS-2026).
  - Insurer positions are reported second-hand and exclusion wording varies (IAMAG-LAWPL-2026).
  human_checkpoints:
  - Risk or general counsel signs off proposal-form answers on AI use
  role_evolution: >-
    DAC Beachcroft (law firm) advises policyholders to check whether proposal-form disclosures remain accurate
    (DACB-PI-2026).
  evidence_grade: C
  sources:
  - {ref: DACB-PI-2026, title: "Professional indemnity insurance: risk of AI hallucinations", publisher: "DAC Beachcroft", type: firm, url: "https://www.dacbeachcroft.com/en/what-we-think/professional-indemnity-insurance-risk-of-ai-hallucinations", date: "2026-09-28", access: full, locator: "paragraphs 8-12"}
  - {ref: IAMAG-LAWPL-2026, title: "How Generative AI Is Reshaping Professional Liability Risk for Law Firms", publisher: "Independent Agent magazine (IIABA)", type: press, url: "https://www.iamagazine.com/?p=32247", date: "2026-03-09", access: full, locator: "broker quotes on exclusions and underwriting"}
  - {ref: ACCOUNTINGTODAY-INSURERS-2026, title: "Insurers eyeing AI risk at CPA firms", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/insurers-eyeing-ai-risk-at-cpa-firms", date: "2026-04-21", access: full, locator: "Sterna, Raspante and Florian comments"}
  - {ref: LAWSOC-AGENTIC-2026, title: "Shaping the future of agentic AI in legal practice (full report)", publisher: "Law Society of England and Wales", type: professional-body, url: "https://www.lawsociety.org.uk/topics/research/the-future-of-agentic-ai-in-legal-practice", date: "2026-04-14", access: full, locator: "p.45"}
  last_reviewed: '2026-10-19'
  notes: >-
    Firm kind: law firms (US and UK) and CPA firms. From governance-14 (C), with insurer comments from discourse-06 and
    the Law Society point routed via acceptance-risk. Broker and law-firm commentary only. The acceptance-risk module
    points here for insurance detail. A search summary on named insurers' AI exclusions was not opened and is not used.
