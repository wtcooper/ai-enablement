  - {ref: ABA-LPT-SC-2026, title: "AI Hallucinations in Court - The Sullivan & Cromwell Lesson", publisher: "Law Practice Today podcast (ABA Law Practice Division)", type: podcast, url: "https://rss.buzzsprout.com/2268467.rss", date: "2026-06-30", access: full, locator: "feed item Buzzsprout-19424504, description"}
  last_reviewed: '2026-10-19'
  notes: >-
    Firm kind: legal AI vendors and consulting (community discussion of a KPMG report). Merged from discourse-16 (C)
    and practice-15 (C). Contested in the sources, so no outcome is claimed; the community suggestions are opinion.
    Related: assurance-quality-management-22 (idea: a second model or rules-based component cross-checks AI output).

- id: professional-services-quality-review-14
  title: After an AI error is found, disclose, correct and re-review the whole matter or the wider set of filings
  archetype: professional-services
  module: quality-review
  function: service-delivery
  work_types: [review-assurance, client-interaction]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Once one fabricated citation or reference is found, the client, court and firm need to know whether others exist,
    and the response shapes the consequence. White & Case describes a sanctioned large firm that resubmitted a revised
    brief still containing a half-dozen AI errors without disclosing AI's role; an Oregon appeals decision criticised
    a lawyer for a quiet correction without acknowledgment.
  solution: >-
    Sullivan & Cromwell's April 2026 letter to the court took responsibility, filed a corrected motion with a redline
    and a schedule of corrections, said it had reviewed how the errors occurred and re-reviewed all filings in the
    matter, and thanked opposing counsel who flagged the errors. Butler Snow retained outside counsel to review its
    filings. Deloitte Australia published a revised report that removed a fabricated court quote and non-existent
    references, disclosed Azure OpenAI use and agreed to repay the final instalment of the contract. EY Canada and KPMG
    withdrew reports pending review.
  outcomes:
  - lever: quality
    description: Butler Snow's outside look-back after the show-cause orders
    figure: "2,400+ citations in 330 filings across 40 federal dockets reviewed; no additional hallucinated or mischaracterised citations found"
    measures: "Citations in the firm's filings reviewed by outside counsel, per EDRM commentary on the court's order (primary order not opened)"
    provenance: self-reported
    source_ref: EDRM-JOHNSONDUNN-2025
  - lever: quality
    description: Sullivan & Cromwell's re-review of all filings in the matter
    figure: "No other AI-related issues found; additional non-substantive or clerical errors listed"
    measures: "Outcome stated in the firm's letter to the court, as reported by Canadian Lawyer (letter not opened)"
    provenance: self-reported
    source_ref: CANLAWYER-SC-2026
  prerequisites:
  - A named owner for incident response and a standing rule on disclosure to the court or client
  - The ability to list the affected filings or deliverables and pull their citations
  risks_and_guardrails:
  - Courts treat concealment as worse than the error (ABA-LPT-WILLIAMS-2026; WHITECASE-VERIFY-2026).
  - A clean look-back does not show the controls work; both law firms had policies when the incidents happened (EDRM-JOHNSONDUNN-2025; CANLAWYER-SC-2026).
  - Deloitte did not say whether AI generated the errors and said the matter was resolved directly with the client (CTV-DELOITTE-2025).
  - CPA Newfoundland and Labrador can suspend or restrict a firm's licence, refer it to discipline or counsel it after an investigation (INDEPENDENT-CPANL-2026).
  human_checkpoints:
  - Partner takes responsibility to the court; a Sullivan & Cromwell partner did so under the court's local equivalent of Rule 11 (CANLAWYER-SC-2026)
  - Independent or outside reviewer for the look-back (EDRM-JOHNSONDUNN-2025)
  - Client reviews the revised deliverable (CTV-DELOITTE-2025)
  role_evolution: >-
    Partners, not tools, answer to courts and clients; the Sullivan & Cromwell partner personally telephoned opposing
    counsel (CANLAWYER-SC-2026).
  evidence_grade: B
  sources:
  - {ref: CANLAWYER-SC-2026, title: "Sullivan & Cromwell apologizes to US bankruptcy judge for AI-generated errors in Prince Group case", publisher: "Canadian Lawyer", type: press, url: "https://www.canadianlawyermag.com/news/international/sullivan-cromwell-apologizes-to-us-bankruptcy-judge-for-aigenerated-errors-in-prince-group-case/394014", date: "2026-04-22", access: full, locator: "paragraphs 4-8"}
  - {ref: EDRM-JOHNSONDUNN-2025, title: "When AI Policies Fail: The AI Sanctions in Johnson v. Dunn", publisher: "EDRM (Hon. Ralph Artigliere, ret.)", type: community, url: "https://edrm.net/2025/07/when-ai-policies-fail-the-ai-sanctions-in-johnson-v-dunn-and-what-they-mean-for-the-profession/", date: "2025-07-31", access: full, locator: "paragraphs on remedial effort and sanctions"}
  - {ref: CTV-DELOITTE-2025, title: "Deloitte to partially refund Australian government for report with apparent AI-generated errors (Associated Press)", publisher: "CTV News / Associated Press", type: press, url: "https://www.ctvnews.ca/business/article/deloitte-to-partially-refund-australian-government-for-report-with-apparent-ai-generated-errors/", date: "2025-10-07", access: full, locator: "paragraphs 1-6 (refund, revised report, disclosure)"}
  - {ref: INDEPENDENT-CPANL-2026, title: "Accounting watchdog to investigate Deloitte over fake citations in $1.6M healthcare report", publisher: "The Independent (Newfoundland and Labrador)", type: press, url: "https://theindependent.ca/news/lji/accounting-watchdog-to-investigate-deloitte-over-fake-citations-in-1-6-million-healthcare-report/", date: "2026-03-07", access: full, locator: "opening paragraphs"}
  - {ref: WHITECASE-VERIFY-2026, title: "Verify, Guide, Train: Lessons From Emerging Attorney AI-Misuse Caselaw", publisher: "White & Case", type: firm, url: "https://www.whitecase.com/sites/default/files/2026-04/verify-guide-train-lessons-from-emerging-attorney-ai-misuse-case-law.pdf", date: "2026-04-15", access: full, locator: "'Establish Clear AI-Use Guidelines' (Lacey)"}
  - {ref: ABA-LPT-WILLIAMS-2026, title: "Avoiding AI Hallucinations in Legal Practice", publisher: "Law Practice Today podcast (ABA Law Practice Division)", type: podcast, url: "https://lawpracticetoday.buzzsprout.com/2268467/episodes/19275322-avoiding-ai-hallucinations-in-legal-practice", date: "2026-06-15", access: full, locator: "episode description"}
  - {ref: ACS-EY-2026, title: "EY retracts cyber report littered with AI errors", publisher: "Information Age (ACS)", type: press, url: "https://ia.acs.org.au/article/2026/ey-retracts-cyber-report-littered-with-ai-errors.html", date: "2026-05-19", access: full, locator: "paragraphs 2-5"}
  - {ref: TECHCRUNCH-KPMG-2026, title: "KPMG pulls report on AI usage due to apparent hallucinations", publisher: "TechCrunch", type: press, url: "https://techcrunch.com/2026/06/13/kpmg-pulls-report-on-ai-usage-due-to-apparent-hallucinations/", date: "2026-06-13", access: full, locator: "paragraphs 2-4"}
  last_reviewed: '2026-10-19'
  notes: >-
    Firm kind: law firms (Sullivan & Cromwell, Butler Snow; US) and consulting and accounting firms (Deloitte
    Australia, EY Canada, KPMG). Merged from practice-10, discourse-11 and governance-10. Grade B: firm-reported figures
    reached through secondary accounts. Press accounts differ on report length (Australia 237 pages; Canada 523 or 526
    pages). How buyers recover fees is professional-services-scoping-pricing-12.

- id: professional-services-quality-review-15
  title: Check incoming work, including authorities in opponents' filings and drafts from contractors or other lawyers
  archetype: professional-services
  module: quality-review
  function: service-delivery
  work_types: [review-assurance]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    In reported matters the fabricated authorities were found by opposing counsel, the opposing party or the judge,
    not by the filing firm. Errors also arrive through other people's work: in Deghani v. Castro a freelance attorney a
    lawyer had contracted returned a brief with hallucinated cases that he did not check, and the court upheld sanctions; Canadian
    Lawyer reports an Alberta appeal court holding counsel ultimately responsible for hallucinated citations in a
    factum drafted by a contractor. A California appellate court declined to award fees to opposing counsel who did not
    detect or report fabricated citations.
  solution: >-
    Litigation teams check the authorities cited against them as a routine step: Boies Schiller Flexner flagged the
    errors in Sullivan & Cromwell's filing; Haringey Council asked for copies of cases it could not find; respondents'
    counsel in a Dudley County Court appeal raised concerns. Work from contractors, juniors and counterparties is
    treated as unverified input. Tools are being marketed for this: BriefCatch for opponents' briefs, with a scan for
    concealed text such as white-on-white type and zero-width characters, and Thomson Reuters' Litigation Document
    Analyzer for misrepresentations of law across a whole brief. Putting verification and AI-disclosure terms into
    subcontracts is an idea; no source reports such clauses.
  outcomes:
  - lever: risk
    description: Court consequences in Noland v. Land of the Free (California)
    figure: "21 of 23 case quotations in the opening brief fabricated; $10,000 sanction on the filing attorney; opposing counsel's fee request denied"
    measures: "Fabricated quotations found by the Court of Appeal; sanction and fee ruling as reported"
    provenance: independent
    source_ref: LAWSITES-NOLAND-2025
  - lever: risk
    description: One court schedule of cited cases in the Haringey matter
    figure: "18 of 45 cited cases did not exist"
    measures: "Citations listed in the schedule referred to by the court, para 74; many cases that existed did not contain the attributed quotations or support the propositions"
    provenance: independent
    source_ref: EWHC-AYINDE-2025
  prerequisites:
  - Time and tools to look up authority cited by others
  - A protocol for raising suspected fabrication with the other side or the court
  - Contract terms and onboarding for outside providers
  risks_and_guardrails:
  - Noland is described as possibly the first decision to touch on a duty to detect an opponent's fake citations; its reach is unsettled (LAWSITES-NOLAND-2025).
  - The duty to check AI research covers relying on others who used it, like relying on a trainee; the signing professional cannot shift responsibility (EWHC-AYINDE-2025, para 8).
  - Courts apply an objective reasonableness standard, not good faith (TRI-HALLUC-2025).
  - The tool features are vendor announcements without named users (LAWSITES-BRIEFCATCH-2026; TR-CANTSIGN-2026).
  human_checkpoints:
  - Lawyer decides whether and how to raise suspected fabrication with the court
  - Supervising lawyer verifies everything a contractor or junior returns before signing (TRI-HALLUC-2025)
  role_evolution: >-
    In the cases read, outsiders found the errors; in-firm routines for checking incoming work are not documented
    (CANLAWYER-SC-2026; CCDUDLEY-RODNEY-2026).
  evidence_grade: B
  sources:
  - {ref: LAWSITES-NOLAND-2025, title: "A New Wrinkle in AI Hallucination Cases: Lawyers Dinged for Failing to Detect Opponent's Fake Citations", publisher: "LawSites (Robert Ambrogi)", type: press, url: "https://www.lawnext.com/2025/09/a-new-wrinkle-in-ai-hallucination-cases-lawyers-dinged-for-failing-to-detect-opponents-fake-citations.html", date: "2025-09-16", access: full, locator: "sections 'Fabricated Quotations' and 'The Twist: No Fees for Opposing Counsel'"}
  - {ref: EWHC-AYINDE-2025, title: "R (Ayinde) v London Borough of Haringey; Al-Haroun v Qatar National Bank [2025] EWHC 1383 (Admin)", publisher: "High Court of Justice, King's Bench Division (Divisional Court)", type: regulator, url: "https://www.judiciary.uk/wp-content/uploads/2025/06/Ayinde-v-London-Borough-of-Haringey-and-Al-Haroun-v-Qatar-National-Bank.pdf", date: "2025-06-06", access: full, locator: "paras 8, 74; paragraphs on requests for copies of cases"}
  - {ref: CCDUDLEY-RODNEY-2026, title: "Rodney v Gee'z Micro Bar & Pitstop, judgment on AI use by solicitors", publisher: "County Court at Dudley (HHJ Grimshaw)", type: regulator, url: "https://www.judiciary.uk/wp-content/uploads/2026/05/Transcript-of-judgment-re-contempt-M00DD215.pdf", date: "2026-04-23", access: full, locator: "paras 12-14"}
  - {ref: CANLAWYER-SC-2026, title: "Sullivan & Cromwell apologizes to US bankruptcy judge for AI-generated errors in Prince Group case", publisher: "Canadian Lawyer", type: press, url: "https://www.canadianlawyermag.com/news/international/sullivan-cromwell-apologizes-to-us-bankruptcy-judge-for-aigenerated-errors-in-prince-group-case/394014", date: "2026-04-22", access: full, locator: "paragraph on Boies Schiller Flexner; paragraph on Reddy v. Saroya"}
  - {ref: TRI-HALLUC-2025, title: "GenAI hallucinations are still pervasive in legal filings, but better lawyering is the cure", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en-us/posts/technology/genai-hallucinations/", date: "2025-08-18", access: full, locator: "Deghani v. Castro paragraphs"}
  - {ref: LAWSITES-BRIEFCATCH-2026, title: "BriefCatch Launches Unified Legal Writing Suite for the AI Era (press release)", publisher: "LawSites (Robert Ambrogi), reproducing a BriefCatch release dated 2026-09-09", type: press, url: "https://www.lawnext.com/2026/09/briefcatch-launches-unified-legal-writing-suite-for-the-ai-era.html", date: "2026-09-11", access: full, locator: "RealityCheck paragraph and opening statement on opponents' briefs"}
  - {ref: TR-CANTSIGN-2026, title: "If You Can't Verify It, You Can't Sign It", publisher: "Thomson Reuters Innovation Blog", type: vendor, url: "https://www.thomsonreuters.com/en-us/posts/innovation/if-you-cant-verify-it-you-cant-sign-it/", date: "2026-05-05", access: full, locator: "Litigation Document Analyzer sentence"}
  last_reviewed: '2026-10-19'
  notes: >-
    Firm kind: law firms and courts (US, England and Wales, Canada). Merged from practice-13, discourse-12,
    governance-15 (idea, D) and governance-16. Grade B rests on named matters showing the routine and the duty; the
    AI-tool part is announced only and on its own would be C. The Reddy v. Saroya holding is as reported by Canadian
    Lawyer; the decision was not opened. Related: professional-services-talent-learning-10 (junior AI-use disclosure
    and supervisor second-level review).

- id: professional-services-quality-review-16
  title: Tell clients when AI materially contributed and how the work was checked, and involve them in vetting tools
  archetype: professional-services
  module: quality-review
  function: service-delivery
  work_types: [client-interaction, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Clients increasingly ask whether and how AI was used on their work and are not consistently told: in Morae's
    survey, 73% say clients deserve full visibility into AI use on their matters and 21% deliver it. Some rules
    require disclosure and others leave it open, and firms worry that disclosing prompts could expose work product.
  solution: >-
    Forvis Mazars' policy requires disclosure when AI materially contributed to externally facing content, with review
    against its accuracy standards before release. The ICMCI code requires consultants to tell clients when AI
    materially contributes, while routine productivity tools need not be disclosed individually. ABA Formal Opinion 512
    requires disclosure if the client asks or the engagement terms require it; California asks lawyers to consider
    disclosing intended AI use and to follow client instructions that limit it. Deloitte Australia's revised report
    disclosed Azure OpenAI use. In a small e-discovery working-group survey, 10 of 19 respondents involve clients in
    vetting tools or give details on vendors and use cases. A CPA liability-insurance risk manager recommends
    engagement-letter language disclosing AI use, with a client opt-out.
  outcomes:
  - lever: risk
    description: Gap between what professionals think clients deserve and what they deliver
    figure: "73% say clients deserve full visibility; 21% deliver it"
    measures: "Share of 850 senior legal professionals surveyed by Morae"
    provenance: vendor-published
    source_ref: MORAE-ILR-2026
  - lever: risk
    description: Law firms whose GenAI policy requires client approval, by size
    figure: "8% (under 50 lawyers) to 38% (350-699 lawyers); 34% over 700"
    measures: "Percent of responding firms in each lawyer-count band selecting 'Must obtain client approval' in Q3.18"
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Client involvement in tool vetting in a small expert survey
    figure: "10 of 19 respondents; none disclosed GenAI use to opposing counsel or courts"
    measures: "Respondents in a self-selected, non-random EDRM GenAI working-group survey"
    provenance: independent
    source_ref: EDT-EDRMSURVEY-2026
  prerequisites:
  - A way to tell which deliverables AI touched, and a firm rule on what counts as material contribution (ACCOUNTINGTODAY-HALLUC2-2026)
  - A record of each client's AI instructions per matter (see professional-services-work-production-25)
  risks_and_guardrails:
  - Client instructions conflict - some demand AI use, others require permission, refuse to pay for AI-done work or demand warranties that models are unbiased (TRI-LEGALWEEK-2026).
  - Disclosure does not replace verification; Deloitte Australia's disclosure came after the errors were found (CTV-DELOITTE-2025).
  - Disclosure does not remove responsibility for the content (ICMCI-AICODE-2026, section 2.2).
  - California says the communication duty depends on the facts and the client's sophistication, and lawyers should check court rules on disclosure (CALBAR-GENAI-2026, pp.7 and 9).
  human_checkpoints:
  - The lawyer or consultant decides whether AI use is material and what the client is told
  - Partner confirms disclosure language and client instructions before delivery (CALBAR-GENAI-2026)
  role_evolution: >-
    DLA Piper's AI innovation head advises firms to lead the client conversation on AI value and terms rather than wait
    for clients (TRI-LEGALWEEK-2026). Thomson Reuters reports many partners have not discussed AI with most of their
    clients (TRI-STANDOUT-2026).
  evidence_grade: B
  sources:
  - {ref: MORAE-ILR-2026, title: "The Intelligence Gap: Why AI in Legal Isn't Delivering and What Needs to Change", publisher: "Morae", type: survey, url: "https://www.morae.com/insights/the-intelligence-gap-why-ai-in-legal-isnt-delivering-and-what-needs-to-change/", date: "2026-07-08", access: full, locator: "summary bullets"}
