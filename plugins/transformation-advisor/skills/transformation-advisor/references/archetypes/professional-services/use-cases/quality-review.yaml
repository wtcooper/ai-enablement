- id: professional-services-quality-review-13
  title: Independent machine cross-check of AI output before human review, by a second agent or a deterministic comparison engine
  archetype: professional-services
  module: quality-review
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: automate
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Checking every reference by hand is slow, and reviewers skimming sources can miss near-match citations, per a
    community discussion of the KPMG report. Litera argues lawyers who must recheck every AI-edited clause lose the
    time AI saved.
  solution: >-
    Hacker News commenters proposed a sub-agent that validates references and figures, or adversarial agents that
    build a reference table and check links, with people reviewing only low-confidence items. Harvey says its agent
    checks its own work against what the user asked. Litera announced in August 2026 that its Lito agent would build
    AI change management on top of its deterministic redline comparison engine, surfacing risky changes. Clearbrief
    says its checker uses non-generative AI so the check cannot add hallucinations.
  outcomes:
  - lever: quality
    description: none published
    figure: none published
    measures: "No accuracy or usage figure published for any cross-check design"
    provenance: vendor-published
    source_ref: HARVEY-GRAPH-2026
  prerequisites:
  - A rule for which items go to people; the commenters suggested people review only low-confidence items (HN-KPMG-2026)
  risks_and_guardrails:
  - A Thomson Reuters Labs scientist says systems that appear to check their own work are still predicting, so no number of verification loops guarantees accuracy (TRI-NEED2KNOW-2026).
  - Speakers on an ABA podcast say to verify citations in Lexis or Westlaw and not with AI (ABA-LPT-SC-2026).
  - The Litera release is marketing; its change-management workflow was due in late September 2026 and was not shown in use (LAWSITES-LITERA-2026).
  human_checkpoints:
  - People verify flagged and low-confidence references (HN-KPMG-2026)
  - Lawyer reviews flagged changes and proposed rewrites (LAWSITES-LITERA-2026)
  role_evolution: >-
    No source documents a role change.
  evidence_grade: C
  sources:
  - {ref: HN-KPMG-2026, title: "KPMG pulls report on AI usage due to apparent hallucinations (discussion thread)", publisher: "Hacker News", type: community, url: "https://news.ycombinator.com/item?id=48527297", date: "2026-06-14", access: full, locator: "comments on sub-agent validation and on manual review limits"}
  - {ref: HARVEY-GRAPH-2026, title: "Improving Agent Accuracy With Harvey Graph", publisher: "Harvey", type: vendor, url: "https://www.harvey.ai/blog/improving-agent-accuracy-with-harvey-graph", date: "2026-10-19", access: full, locator: "'What's in Harvey Graph Today'"}
  - {ref: LAWSITES-LITERA-2026, title: "Litera Connects Contract Drafting and Negotiation in One Trusted Legal AI Workflow (press release)", publisher: "LawSites (Robert Ambrogi), reproducing a Litera release", type: press, url: "https://www.lawnext.com/2026/08/litera-connects-contract-drafting-and-negotiation-in-one-trusted-legal-ai-workflow.html", date: "2026-08-18", access: full, locator: "opening and 'Act on what matters' paragraphs"}
  - {ref: LAWSITES-CLEARBRIEF-2025, title: "Clearbrief Launches Cite Check Report to Give Law Firm Partners an Audit Trail Against AI Hallucinations", publisher: "LawSites (Robert Ambrogi)", type: press, url: "https://www.lawnext.com/2025/12/clearbrief-launches-cite-check-report-to-give-law-firm-partners-an-audit-trail-against-ai-hallucinations.html", date: "2025-12-16", access: full, locator: "section 'How the Cite Check Report Works'"}
