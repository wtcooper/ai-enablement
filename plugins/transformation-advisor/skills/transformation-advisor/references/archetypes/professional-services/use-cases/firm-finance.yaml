- id: professional-services-firm-finance-14
  title: "Idea: model leverage, billing mix and partner income under scenarios in which AI takes over part of the work below equity partners"
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [data-reporting, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Associates and non-equity partners carry most of the extra demand while equity-partner demand slipped (TRI-LFFI-COSTS-2026). DLA Piper's AI head said some financial-contract due diligence is down to two hours from 15 to 20 (TRI-LEGALWEEK-CRISIS-2026)."
  solution: "Idea: scenario models of leverage, billing mix and partner income under different assumptions about how much junior and support work AI takes over. A Forrester analyst notes diamond-shaped and pod-like structures being proposed in place of the pyramid (FORRESTER-BLOG-2025), and Law Society interviewees expected top firms to shift toward fixed-fee or subscription models as billable hours erode (LAWSOC-AGENTIC-2026). Legalweek 2026 panels treated the associate, not the billable hour, as the open question (TRI-LEGALWEEK-CRISIS-2026). No firm describes using such a model."
  outcomes:
    - {lever: capacity, description: "Law-firm demand leverage", figure: "associates 1.55 (Q4 2025 record), 1.47 (Q1 and Q2 2026); non-equity partners 0.91 (Q2 2026)", measures: "TRI 'demand leverage': hours worked by associates (or non-equity partners) relative to hours worked by equity partners, in TRI Financial Insights data; not attributed to AI by the source", provenance: vendor-published, source_ref: TRI-LFFI-LEVERAGE-2026}
  prerequisites:
    - "Timekeeper-level hours, rates and cost data"
    - "Task-level evidence of how much AI compresses work, and a view on the training pipeline"
  risks_and_guardrails:
    - "Leverage rose before any measured AI effect, and TRI does not attribute it to AI (TRI-LFFI-LEVERAGE-2026)"
    - "In an NBER trial of 133 patent lawyers, AI raised work quality, but the later no-AI advantage was concentrated among senior lawyers and junior scores split (NBER-AUTOR-2026); this bears on the supply of future partners"
    - "Forrester says consultancies still need a talent pipeline to develop the next generation of expertise (FORRESTER-BLOG-2025)"
  human_checkpoints:
    - "Executive committee sets associate intake and non-equity partner policy"
  role_evolution: "Legalweek panellists described the associate role moving toward training, technological fluency and management skills (TRI-LEGALWEEK-CRISIS-2026). Law Society interviewees said junior lawyers may do less administrative work and more oversight (LAWSOC-AGENTIC-2026)."
  evidence_grade: D
  sources:
    - {ref: TRI-LFFI-LEVERAGE-2026, title: "Q2 2026 LFFI analysis: Law firm leverage just broke a 17-year record - and this time, it's not because of layoffs", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/q2-2026-lffi-analysis-law-firm-leverage", date: "2026-08-18", access: full, locator: "Key insights and 'The value of leverage'"}
    - {ref: TRI-LFFI-COSTS-2026, title: "Q2 2026 LFFI analysis: The rising costs lurking beneath law firm momentum", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/q2-2026-lffi-analysis-rising-costs", date: "2026-08-31", access: full, locator: "Paragraph on demand by title (associates +4.3%, non-equity partners +6.0%, equity partners -1.2%)"}
    - {ref: TRI-LEGALWEEK-CRISIS-2026, title: "Move over, 'Death of the billable hour,' Legalweek 2026 has found a new existential crisis", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-new-existential-crisis", date: "2026-03-19", access: full, locator: "'The question nobody wanted to ask out loud'; Barclay Blair quote"}
    - {ref: FORRESTER-BLOG-2025, title: "The Future Of AI Consulting Services Is Disruptively Bright", publisher: Forrester, type: press, url: "https://www.forrester.com/blogs/the-future-of-ai-consulting-services-is-disruptively-bright", date: "2025-09-15", access: full, locator: "Fourth position, 'Rethink their hiring, development, and organizational models'"}
    - {ref: LAWSOC-AGENTIC-2026, title: "Shaping the future of agentic AI in legal practice (full report)", publisher: Law Society of England and Wales, type: professional-body, url: "https://www.lawsociety.org.uk/topics/research/the-future-of-agentic-ai-in-legal-practice", date: "2026-04-14", access: full, locator: "p. 57; p. 59 (expected impact by firm type)"}
    - {ref: NBER-AUTOR-2026, title: "Does AI Assistance Enhance or Erode Expertise? Evidence from a Three-Month Field Experiment in Patent Drafting (NBER Working Paper 35720)", publisher: National Bureau of Economic Research (EconPapers record), type: academic, url: "https://econpapers.repec.org/RePEc:nbr:nberwo:35720", date: "2026-09", access: full, locator: "Abstract"}
  last_reviewed: "2026-10-19"
  notes: "Labelled idea. Firm kinds: law (TRI data, DLA Piper, Law Society interviewees), consulting (Forrester). Evidence of AI-driven change in leverage is absent; the data are context. Graduate intake and training are held in talent-learning. Merged from discourse-19 and governance-14."

- id: professional-services-firm-finance-15
  title: Accounting firms take private equity capital to fund talent and technology, separating attest from non-attest work and sharing ownership with staff
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Partnerships distribute most profit each year, leaving little capital for technology and talent. Blake Oliver argues that under hourly billing, AI productivity cuts revenue (BLAKEOLIVER-PE-2026)."
  solution: "Crowe, No. 12 in Accounting Today's 2026 Top 100 with $1.4 billion revenue and 539 partners, announced a KKR investment on 2026-06-11, to be used on talent, technology and innovation, and said it would separate attest and non-attest services into Crowe LLP and Crowe Advisory LLC, with KKR investing in Crowe Advisory (AT-CROWE-KKR-2026). The deal closed in August 2026, and Crowe then launched CroweONE, a shared ownership plan open to all employees without upfront investment (AT-CROWE-2026). Investors are also re-reading the model: per FT coverage of the SuperReturn conference reported by a Dutch trade outlet, an Apax co-CEO called bookkeeping-type firms that bill by the hour and do no regulated audit work vulnerable (VANMORGEN-SUPERRETURN-2026)."
  outcomes:
    - {lever: growth, description: "Use of the capital", figure: "none published", measures: "Not applicable: Crowe names talent, technology and innovation as uses; no AI-specific amount or result is given", provenance: self-reported, source_ref: AT-CROWE-KKR-2026}
    - {lever: risk, description: "UK mid-tier firms' AI plans", figure: "86% of 35 firms", measures: "Share of 35 UK mid-tier accounting firms with a technology strategy that includes AI adoption, in ICAEW's 2026 mid-tier research", provenance: independent, source_ref: ICAEW-MIDTIER-2026}
  prerequisites:
    - "Partner agreement on outside capital"
    - "For attest firms, a structure that meets independence rules; the AICPA's ethics committee sought comment in December 2025 on revising its alternative-practice-structure rules (NYSSCPA-APS-2025)"
    - "A plan for how technology spend turns into pricing and margin"
  risks_and_guardrails:
    - "Comments on the AICPA exposure draft were due 30 April 2026; adoption status was not confirmed in the sources read (NYSSCPA-APS-2025)"
    - "ICAEW's 2026 research found fewer independent mid-tier firms considering PE than in previous years, citing culture, autonomy and long-term incentives (ICAEW-MIDTIER-2026)"
    - "Blake Oliver argues PE finds efficiencies within an existing model but is not designed to reinvent it, and points to CBIZ, the only US-listed accounting firm, trading around $35 in June 2026 against about $90 in early 2025 (BLAKEOLIVER-PE-2026, commentary)"
    - "The sources do not tie Crowe's capital to AI specifically (AT-CROWE-KKR-2026)"
  human_checkpoints:
    - "Partners vote on the transaction and governance terms; leadership allocates the capital"
  role_evolution: "Crowe says CroweONE lets employees share in the firm's success without upfront investment (AT-CROWE-2026)."
  evidence_grade: B
  sources:
    - {ref: AT-CROWE-KKR-2026, title: "Crowe gets PE investment from KKR", publisher: Accounting Today, type: press, url: "https://www.accountingtoday.com/news/crowe-gets-pe-investment-from-kkr", date: "2026-06-11", access: full, locator: "Article body"}
    - {ref: AT-CROWE-2026, title: "Crowe launches shared ownership plan (URL slug: crowe-launches-esop-with-kkr-investment)", publisher: Accounting Today, type: press, url: "https://www.accountingtoday.com/news/crowe-launches-esop-with-kkr-investment", date: "2026-10-19", access: full, locator: "Article body and editorial note (CroweONE is not an ESOP)"}
    - {ref: VANMORGEN-SUPERRETURN-2026, title: "AI zet private-equityrekensom in accountancy onder druk (reports FT coverage of SuperReturn Berlin)", publisher: Accountancy Vanmorgen, type: press, url: "https://www.accountancyvanmorgen.nl/2026/06/16/ai-zet-private-equityrekensom-in-accountancy-onder-druk/", date: "2026-06-16", access: full, locator: "Paragraphs summarising the FT report"}
    - {ref: ICAEW-MIDTIER-2026, title: "Mid-tier firms focused on AI and consolidation", publisher: ICAEW, type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/mid-tier-firms-focused-on-ai-and-consolidation", date: "2026-05-22", access: full, locator: "Sections 'Consolidation activity remains high' and 'AI and operating models'"}
    - {ref: NYSSCPA-APS-2025, title: "AICPA Calls for Comments on Ethics Rules Update for Alternative Practice Structures in Private Equity", publisher: New York State Society of CPAs, type: professional-body, url: "https://nysscpa.org/news/1045198-aicpa-calls-for-comments-on-ethics-rules-update-for-alternative-practice-structures-in-private-equity-2025-12-22", date: "2025-12-22", access: full, locator: "Article body"}
    - {ref: BLAKEOLIVER-PE-2026, title: "The Private Equity Accounting Bet Is Starting to Look Shaky (Blake Oliver)", publisher: Blake Oliver (The Accounting Podcast), type: community, url: "https://www.blakeoliver.com/blog/private-equity-bet-on-accounting", date: "2026-06-11", access: full, locator: "Sections 'What Is the Market Saying?' and 'The Billing Model Problem'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: accounting (Crowe; UK mid-tier firms). Grade B for a named, closed deal; AI is implied only by 'technology and innovation'. Independence due diligence for PE-backed audit firms is held in the assurance archetype (assurance-acceptance-independence-16 and -17); this entry is the capital decision. Merged from practice-16, discourse-14, discourse-18 (investor view, idea) and governance-13 (accounting part)."

- id: professional-services-firm-finance-16
  title: Law firms bring in outside capital for technology and AI through management services organisations or licensed alternative business structures
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Law partnerships pay out nearly all profit and keep little cash for AI, and ABA Model Rule 5.4 remains the main barrier to non-lawyer ownership (HK-AMLAW-2026; BESTLAW-WSHB-2026)."
  solution: "In a management services organisation (MSO), the business side (technology, HR, marketing, finance, real estate) sits in a separate entity an investor can own, and the law firm pays it fees. Winston & Strawn's client alert lists technology and AI investment among four pillars of value creation and flags realisation below 85% as an improvement opportunity for investors (WINSTON-PE-2026). Best Law Firms reports that Charlesbank reportedly signed a letter of intent for a stake in Wood Smith Henning & Berman at a reported $700 million through an MSO (BESTLAW-WSHB-2026); Dudley DeBosier announced a partnership with the PE-backed Orion Legal in January 2026 (COLUMBIA-BREYDO-2026). Holland & Knight's summary of an American Lawyer article says AI platforms need substantial upfront investment (HK-AMLAW-2026). Arizona, which removed its ban on non-lawyer ownership, licenses alternative business structures (AZ-ABS-2025)."
  outcomes:
    - {lever: growth, description: "Reported valuation of the Wood Smith stake", figure: "about 15x-18x earnings", measures: "Multiple implied by the reported $700 million stake, using the FT's $46 million profit estimate or other reports' roughly $38 million EBITDA; a letter of intent, not a closed deal", provenance: independent, source_ref: BESTLAW-WSHB-2026}
    - {lever: growth, description: "Arizona alternative business structures", figure: "114 active at 31 Dec 2024; 51 granted in 2024", measures: "Licensed ABS entities active at year end and licences granted in the year; 47 of the 51 were traditional law firms", provenance: independent, source_ref: AZ-ABS-2025}
  prerequisites:
    - "A state regime that permits the structure"
    - "Separation of legal judgment from management control, fixed in a management services agreement"
    - "Partner agreement to share economics with investors"
  risks_and_guardrails:
    - "Colorado enacted a ban in August 2026 on lawyers sharing fees with non-lawyers and with alternative business structures; Illinois restricts non-lawyer interference and requires MSO disclosure to clients (BESTLAW-WSHB-2026)"
    - "A legal academic argues no state bar has issued model governance standards for law-firm MSOs, and that healthcare MSOs drifted toward investor control (COLUMBIA-BREYDO-2026)"
    - "Winston's alert cautions with UK ABS failures such as Slater and Gordon (WINSTON-PE-2026)"
  human_checkpoints:
    - "Lawyers keep exclusive control of legal matters (WINSTON-PE-2026)"
    - "Partners approve the MSO agreement; ethics counsel reviews the separation of business and practice"
  role_evolution: "Lawfront Group, a PE-backed UK consolidator of seven regional firms in four years, has a head of innovation and AI who spoke at ILTACON 2026 about token costs across inherited technology stacks (TRI-METER-2026)."
  evidence_grade: C
  sources:
    - {ref: WINSTON-PE-2026, title: "Law firms: The next frontier for private equity in professional services?", publisher: Winston & Strawn (now Winston Taylor), type: firm, url: "https://www.winston.com/en/insights-news/law-firms-the-next-frontier-for-private-equity-in-professional-services", date: "2026-03-19", access: full, locator: "Sections 'The Core Tension of Law Firm Economics', key metrics table and 'Four Pillars of Value Creation'"}
    - {ref: BESTLAW-WSHB-2026, title: "Private Equity's Biggest Law Firm Bet Yet: Inside the $700M Charlesbank-WSHB Deal (David L. Brown)", publisher: Best Law Firms, type: press, url: "https://www.bestlawfirms.com/articles/private-equity-law-firm-charlesbank-wood-smith-700-million/8482", date: "2026-09-16", access: full, locator: "Sections on the MSO structure, state rules and 'Expansion Plans'"}
    - {ref: COLUMBIA-BREYDO-2026, title: "Private Equity Is Coming for Law Firms - and the Rules Aren't Ready (Lev Breydo)", publisher: Columbia Law School Blue Sky Blog, type: academic, url: "https://clsbluesky.law.columbia.edu/2026/04/30/private-equity-is-coming-for-law-firms-and-the-rules-arent-ready/", date: "2026-04-30", access: full, locator: "Sections 'The Workaround' and 'The Governance Gap'"}
    - {ref: HK-AMLAW-2026, title: "Firms Need Capital to Pay for AI Tools. Could PE Investment Be the Solution? (summary of an American Lawyer article)", publisher: Holland & Knight, type: firm, url: "https://www.hklaw.com/en/news/intheheadlines/2026/04/firms-need-capital-to-pay-for-ai-tools-could-pe-investment", date: "2026-04-20", access: full, locator: "Summary paragraph quoting Joshua Porte"}
    - {ref: AZ-ABS-2025, title: "Annual Report of the Committee on Alternative Business Structures to the Arizona Supreme Court (calendar year 2024)", publisher: "Arizona Supreme Court, Committee on Alternative Business Structures", type: regulator, url: "https://www.azcourts.gov/Portals/0/26/ABS%20Committee%20Annual%20Report%20to%20Supreme%20Court%20for%202024%20(02_28_2025).pdf", date: "2025-04", access: full, locator: "Executive Summary; Background; Applications, Renewals and Licenses"}
    - {ref: TRI-METER-2026, title: "Ferraris for emails: At ILTACON 2026, the industry starts reading the meter", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2026-reading-the-meter", date: "2026-09-09", access: full, locator: "Paragraph quoting Lawfront's James Grice"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: US law firms (Wood Smith Henning & Berman, Dudley DeBosier), UK law (Lawfront Group). Grade C: a reported letter of intent, an announced partnership and law-firm commentary; AI is a stated reason for seeking capital, not a shown use. Cohen & Gresser (reported in talks) and McDermott Will & Schulte (reported exploring an MSO) appear in the Columbia essay; Orion Legal and Rafi Law Group MSO items seen only in search results are not used. Merged from practice-17, discourse-15 and governance-13 (Arizona part)."

- id: professional-services-firm-finance-17
  title: Start AI-native firms whose ownership and staffing are built around agents and experienced reviewers rather than the leverage pyramid
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [expert-judgment, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: "Incumbent economics depend on hourly rates and junior leverage; new entrants claim they can deliver at lower cost without that structure."
  solution: "General Legal, founded by Casetext's former chief technology officer, is described as an AI-native law firm that uses an MSO structure so an investable technology company can operate alongside the law firm; six months out of Y Combinator it reports about 400 clients, a new venture financing practice and an MCP server for clients' AI agents (LAWSITES-GENERAL-2026). A Bloomberg Law column by an in-house chief legal officer reports Norm Law taking Big Law work with private equity behind it, and Arceus (US) and Falcon (Europe) launching, Falcon pledging to 'bury the billable hour' (BLOOMBERGLAW-GCXAI-2026). In consulting, the FT (via Resultsense) reports Queen's Tower Advisory targeting '20 per cent humans, 80 per cent AI agents' (RESULTSENSE-2026). In accounting, Ascend, a PE-backed platform with a 30-person AI team, argues that owning the whole software layer allows automatic timekeeping, productivity comparison across projects and price recommendations from scope (AT-AINATIVE-2026)."
  outcomes:
    - {lever: growth, description: "General Legal client count", figure: "about 400 clients", measures: "Client count six months after Y Combinator, stated in the LawNext episode summary from the founder's account", provenance: self-reported, source_ref: LAWSITES-GENERAL-2026}
  prerequisites:
    - "Experienced lawyers or professionals to review agent work (LAWSITES-GENERAL-2026)"
    - "An investable structure such as an MSO, or capital from private equity"
    - "Technology built around the firm's workflows; Ascend's founder says the stack must be secure, scalable and auditable (AT-AINATIVE-2026)"
  risks_and_guardrails:
    - "The founder's claim that AI can automate 95% of routine legal work is an opinion, not a measured result (LAWSITES-GENERAL-2026)"
    - "MSO structures face growing state restrictions (BESTLAW-WSHB-2026)"
    - "The Norm Law, Arceus and Falcon claims come from one column and were not checked against firm sources (BLOOMBERGLAW-GCXAI-2026); Queen's Tower's figure is a target (RESULTSENSE-2026); Ascend's capabilities are the founder's description (AT-AINATIVE-2026)"
  human_checkpoints:
    - "Experienced lawyers review and take responsibility for agent work, as the founder describes (LAWSITES-GENERAL-2026)"
  role_evolution: "General Legal's chief executive, who is not a lawyer, says an AI-native firm depends on hiring highly experienced lawyers rather than supercharging juniors (LAWSITES-GENERAL-2026)."
  evidence_grade: B
  sources:
    - {ref: LAWSITES-GENERAL-2026, title: "LawNext: From Product to Practice - Why Casetext's Former CTO Founded General Legal, An AI Native Law Firm (episode description)", publisher: LawSites / LawNext podcast, type: podcast, url: "https://www.lawnext.com/2026/07/lawnext-from-product-to-practice-why-casetexts-former-cto-founded-general-legal-an-ai-native-law-firm.html", date: "2026-07-27", access: full, locator: "Episode summary paragraphs 1-2 (audio not heard)"}
    - {ref: BLOOMBERGLAW-GCXAI-2026, title: "GC x AI Retrospective: The Billable Hour, Like a Twinkie, Endures (column by Eric Dodson Greenberg, Cox Media Group)", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/business-and-practice/gc-x-ai-retrospective-the-billable-hour-like-a-twinkie-endures", date: "2026-10-19", access: full, locator: "Section 'What Hasn't Happened - Yet'"}
    - {ref: RESULTSENSE-2026, title: "AI dismantles consulting scale advantage as boutiques target Big Four (summary of FT and City AM)", publisher: Resultsense, type: press, url: "https://www.resultsense.com/news/2026-05-28-ai-consulting-big-four-reckoning/", date: "2026-05-28", access: full, locator: "Paragraph on Queen's Tower Advisory (secondary, FT)"}
    - {ref: AT-AINATIVE-2026, title: "The AI-native firm (On the Air with Accounting Today, with Ascend founder David Wurtzbacher)", publisher: Accounting Today, type: podcast, url: "https://www.accountingtoday.com/podcast/the-ai-native-firm", date: "2026-10-19", access: full, locator: "Transcript: AI-native closed loop and critical success factors (transcript machine-generated)"}
    - {ref: BESTLAW-WSHB-2026, title: "Private Equity's Biggest Law Firm Bet Yet: Inside the $700M Charlesbank-WSHB Deal (David L. Brown)", publisher: Best Law Firms, type: press, url: "https://www.bestlawfirms.com/articles/private-equity-law-firm-charlesbank-wood-smith-700-million/8482", date: "2026-09-16", access: full, locator: "Sections on MSO regulation"}
  last_reviewed: "2026-10-19"
  notes: "Firm kinds: law (General Legal; Norm Law, Arceus, Falcon per an in-house columnist), consulting (Queen's Tower Advisory, UK), accounting (Ascend). Grade B for General Legal, an operating firm with a self-reported client count; the others are claims or targets. Pricing of AI-native law firms is held in scoping-pricing (professional-services-scoping-pricing-21); AI-native audit firms are held in assurance (assurance-acceptance-independence-20). Merged from practice-18, discourse-16 and governance-17."
