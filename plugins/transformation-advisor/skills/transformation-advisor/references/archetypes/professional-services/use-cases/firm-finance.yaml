- id: professional-services-firm-finance-10
  title: Fund a firm-owned AI platform as a multi-year capital investment instead of only renting vendor tools
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [software-systems, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: "A firm that only licenses the same AI tools as its rivals has nothing distinctive, and rented tools leave it exposed to vendor pricing; at least one major model vendor changed rates in ten of the last 13 months (BAKERDONELSON-TOKENS-2026)."
  solution: "Kirkland & Ellis is building its own AI platform; Bloomberg Law and the Financial Times report a $500 million commitment, more than $100 million in the first year, and a multi-year relationship with Palantir. Its first tool is a fund formation engine. Bloomberg Law reports more than 180 AI engineers and data scientists, about 50 dedicated engineers engaged, more than 250 attorneys (including about 100 equity partners) in 'AI Pods', a model-agnostic design and nearly 40 AI and legal-technology openings (BLOOMBERGLAW-KIRKLAND-2026). AI Weekly, summarising the FT, adds that Clifford Chance launched an AI knowledge-management system with Microsoft and Epiq Advisory and A&O Shearman co-develops tools with Microsoft and Harvey, while Ropes & Gray's CIO said building proprietary tools did not appear to make sense for that firm at present (AIWEEKLY-KIRKLAND-2026)."
  outcomes:
    - {lever: growth, description: "Kirkland's AI commitment", figure: "$500 million; more than $100 million in year one", measures: "Commitment as reported by the Financial Times and Bloomberg Law; not actual spend or return. Kirkland did not provide ROI benchmarks", provenance: self-reported, source_ref: BLOOMBERGLAW-KIRKLAND-2026}
  prerequisites:
    - "A revenue base able to fund a multi-year build"
    - "Engineers and data scientists working alongside lawyers (BLOOMBERGLAW-KIRKLAND-2026)"
    - "Architecture that avoids lock-in to one model provider"
  risks_and_guardrails:
    - "Kirkland did not say what would make leadership reassess if AI capabilities commoditised faster than expected (BLOOMBERGLAW-KIRKLAND-2026)"
    - "Radiant Law, a fixed-fee legal services provider, argues a $500 million build only works for a firm of Kirkland's size (RADIANT-TOKENS-2026)"
  human_checkpoints:
    - "Equity partners take part in AI Pods that define custom builds (BLOOMBERGLAW-KIRKLAND-2026)"
  role_evolution: "Engineering roles appear inside the firm, including an 'AI Infrastructure Director' opening, and partners join product pods (BLOOMBERGLAW-KIRKLAND-2026)."
  evidence_grade: B
  sources:
    - {ref: BLOOMBERGLAW-KIRKLAND-2026, title: "Kirkland's $500 Million AI Gambit Requires a Cast of Hundreds", publisher: Bloomberg Law, type: press, url: "https://news.bgov.com/business-and-practice/kirklands-500-million-ai-gambit-requires-a-cast-of-hundreds", date: "2026-06-15", access: full, locator: "First four paragraphs, 'Now Hiring' section and final paragraph"}
    - {ref: AIWEEKLY-KIRKLAND-2026, title: "Kirkland Bets $500M on In-House AI, Partners With Palantir", publisher: AI Weekly, type: press, url: "https://aiweekly.co/alerts/kirkland-bets-500m-on-in-house-ai-partners-with-palantir", date: "2026-09-03", access: full, locator: "Body (Ropes & Gray remark; Clifford Chance and A&O Shearman examples; secondary summary of FT)"}
    - {ref: RADIANT-TOKENS-2026, title: "Legal has a token problem, and the industry is just starting to notice", publisher: Radiant Law, type: firm, url: "https://www.radiantlaw.com/resources/legal-has-a-token-problem-and-the-industry-is-just-starting-to-notice", date: "2026-10", access: full, locator: "Section 'BigLaw's answer: own the infrastructure' (undated page; retrieval month)"}
    - {ref: BAKERDONELSON-TOKENS-2026, title: "AI Tokenomics Guide: Understanding Token-Based AI Pricing for Legal Technology (Justin Daniels)", publisher: Baker Donelson, type: firm, url: "https://www.bakerdonelson.com/webfiles/Bios/Token-Pricing-Guide-for-Clients-August-2026.pdf", date: "2026-08-20", access: full, locator: "Section 3 (vendor rate changes)"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: large law firms. Grade B: a named firm with a disclosed budget and team, no measured return. The postings themselves were not opened. Selling firm-built tools to others (A&O Shearman, Debevoise) is held in scoping-pricing (professional-services-scoping-pricing-23). Merged from practice-14 and practice-15 (in part)."

- id: professional-services-firm-finance-11
  title: "Govern AI spend as usage-based pricing arrives: read the meter by user and tool, set model-choice defaults and budgets, and renegotiate contract terms"
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: "Firms budgeted per-seat AI fees, but usage-based charges depend on how lawyers prompt, which model they pick and how many agent steps run. Lawyers cannot see the spend and tend to choose the strongest model for small tasks (TRI-METER-2026)."
  solution: "At ILTACON 2026, knowledge and AI leads described reading consumption bills: Littler's knowledge management counsel found a single PowerPoint had cost $2; Barnes & Thornburg's knowledge and AI manager described lawyers choosing the largest model for the smallest task; Ogletree's chief data and AI officer said firms seem to be settling on AI at roughly 1% of revenue, and his firm was not there yet; Taft's innovation manager urged firms to ask whether an agent removes specific line items; Lawfront Group, a PE-backed UK consolidator, described several tool stacks inherited through acquisitions (TRI-METER-2026). Baker Donelson's guide advises contract transparency on model usage, allowances, overages and price-change rights (BAKERDONELSON-TOKENS-2026), and NetDocuments argues firms should track and train for token use (NETDOCUMENTS-TOKENS-2026)."
  outcomes:
    - {lever: cost, description: "Emerging AI spend level", figure: "about 1% of revenue", measures: "AI cost as a share of firm revenue, stated by Ogletree's chief data and AI officer as where firms are settling; not a surveyed or audited figure", provenance: self-reported, source_ref: TRI-METER-2026}
    - {lever: cost, description: "Per-lawyer cost of AI tools", figure: "$50-$350 per attorney a month; about 30% added to existing tool cost", measures: "Estimate by a Jackson Walker knowledge-management officer reported by Bloomberg Law; year of the estimate not stated", provenance: self-reported, source_ref: BLOOMBERGLAW-TEXAS-2026}
  prerequisites:
    - "Usage data by user, matter and model from each tool; in one ILTACON session about half the room had 10 or more AI tools in use or under evaluation, and about 1 in 6 had 20 or more (TRI-METER-2026)"
    - "Approved defaults for model choice, and training on prompting and model selection"
    - "Contract terms covering usage transparency, allowances, overages and price changes (BAKERDONELSON-TOKENS-2026)"
  risks_and_guardrails:
    - "Cutting back can reduce quality: lawyers pick the more accurate, more expensive option when accuracy matters (ARTLAW-HARVEY14X-2026)"
    - "'You cannot tell a client you ran out of tokens,' a Barnes & Thornburg speaker said (TRI-METER-2026)"
    - "Strong profits and rate growth make the meter easy to ignore (TRI-METER-2026)"
    - "At least one major model vendor changed rates in ten of the last 13 months (BAKERDONELSON-TOKENS-2026); vendors said little about consumption pricing when asked at ILTACON (EDISCOVERYTODAY-ILTACON-2026)"
    - "NetDocuments, a vendor, says vendors currently absorb token costs under subscriptions and that this will not last (NETDOCUMENTS-TOKENS-2026)"
  human_checkpoints:
    - "Knowledge and AI leads review spend by tool and user; finance approves budgets and contract terms"
  role_evolution: "Knowledge and innovation roles add AI cost management; TRI names roles such as head of innovation and AI, chief data and AI officer and knowledge and AI solutions manager, and one speaker called asking lawyers for restraint harder than adoption (TRI-METER-2026)."
  evidence_grade: B
  sources:
    - {ref: TRI-METER-2026, title: "Ferraris for emails: At ILTACON 2026, the industry starts reading the meter", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2026-reading-the-meter", date: "2026-09-09", access: full, locator: "Sections 'The receipt is not the cost', 'The $2 PowerPoint' and 'Ferraris for emails'"}
    - {ref: BAKERDONELSON-TOKENS-2026, title: "AI Tokenomics Guide: Understanding Token-Based AI Pricing for Legal Technology (Justin Daniels)", publisher: Baker Donelson, type: firm, url: "https://www.bakerdonelson.com/webfiles/Bios/Token-Pricing-Guide-for-Clients-August-2026.pdf", date: "2026-08-20", access: full, locator: "Executive summary; sections 2, 3 and 5"}
    - {ref: NETDOCUMENTS-TOKENS-2026, title: "Lawyer Tokenomics", publisher: "NetDocuments (ndMAX Studio, Applied AI Team)", type: vendor, url: "https://studio.netdocuments.com/post/lawyer-tokenomics", date: "2026-08-12", access: full, locator: "Sections 'Why AI Pricing Is Nothing Like Software Licensing' and 'What This Means for the P&L'"}
    - {ref: ARTLAW-HARVEY14X-2026, title: "Harvey Increases Token Use 14X in Just 6 Months", publisher: Artificial Lawyer, type: press, url: "https://artificiallawyer.com/2026/07/08/harvey-increases-token-use-14x-in-just-6-months", date: "2026-07-08", access: full, locator: "Analysis section"}
    - {ref: EDISCOVERYTODAY-ILTACON-2026, title: "My Five ILTACON 2026 Takeaways: Legal Technology Trends (Doug Austin)", publisher: eDiscovery Today, type: conference, url: "https://ediscoverytoday.com/2026/09/04/my-five-iltacon-2026-takeaways-legal-technology-trends/", date: "2026-09-04", access: full, locator: "Section 'Is tokengeddon looming for AI pricing?'"}
    - {ref: BLOOMBERGLAW-TEXAS-2026, title: "AI, Billing Emerge as Crossroads for Texas Law Firms and Clients", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/antitrust/ai-billing-emerge-as-crossroads-for-texas-law-firms-and-clients", date: "2026-04-21", access: full, locator: "Paragraph quoting the Jackson Walker knowledge-management officer"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (Littler, Barnes & Thornburg, Ogletree Deakins, Taft, Jackson Walker; Lawfront Group in the UK). Grade B: named firm staff describe practice at a conference; no firm publishes a measured saving. HIKE2's director said she has seen companies switch AI services off because use was not producing revenue (unnamed companies; anecdote). Merged from practice-07, discourse-08 and discourse-10."

- id: professional-services-firm-finance-12
  title: Meter consumption-priced AI by matter, then decide whether each cost stays in overhead or is recovered from the client, and re-test fixed-fee margins
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting, transaction-processing]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: "Under seat pricing, AI could sit in overhead. Agentic tools run many model calls per task, vendors are moving some products to consumption pricing, and cost now varies by matter, so firms must decide whether to absorb it or bill it while clients press for lower bills (NONBILLABLE-2026; TRI-LEGALWEEK-2026)."
  solution: "Legora announced on 2026-06-23 that its Agent Pro product is priced by consumption, with a dashboard by organisation, user or project, attribution of every run to a matter, thresholds, spending controls and alerts before a limit; the standard Legora Agent stays at no extra cost (LEGORA-CBP-2026). Harvey's co-founder reported a fourteen-fold rise in tokens processed in six months (ARTLAW-HARVEY14X-2026), and Non-Billable reports him contrasting about $20 in tokens for a simple drafting query with about $20,000 for agents reviewing 100,000 contracts (NONBILLABLE-2026). Baker Donelson advises asking vendors for itemised consumption by matter, user or task and whether list prices pass through 1:1 or are marked up (BAKERDONELSON-TOKENS-2026). On recovery, an Illinois State Bar newsletter opinion recommends absorbing ordinary AI use as overhead and raising rates or using flat fees instead of itemising tokens (ISBA-ELEFANT-2026). Idea, no firm described: re-run fixed-fee margins whenever AI consumption or vendor prices change."
  outcomes:
    - {lever: cost, description: "Growth in tokens processed on Harvey's platform", figure: "14x in six months", measures: "Increase in tokens processed on the Harvey platform over six months, excluding embedding tokens, per its co-founder as relayed by Artificial Lawyer; cost not published", provenance: vendor-published, source_ref: ARTLAW-HARVEY14X-2026}
  prerequisites:
    - "Matter-coded usage so AI cost can be allocated to clients (LEGORA-CBP-2026)"
    - "Fee-agreement language that discloses how AI costs are charged (CALBAR-GENAI-2026)"
    - "Spend controls and alert thresholds set by an administrator"
  risks_and_guardrails:
    - "California: general AI subscriptions are overhead; matter-specific AI costs may be charged only if the fee agreement discloses them, at actual cost, with no markup without informed written consent (CALBAR-GENAI-2026)"
    - "Texas: a lawyer will generally not recover more than the amount actually incurred and paid to the AI provider (TXETHICS-OP705-2025)"
    - "Practitioners disagree: Keypoint Law's chief executive expects clients to be annoyed by pass-through (LAWYERSWEEKLY-KEYPOINT-2026); a Ballard Spahr speaker said 'a line item you can trace is a line item you can bill' (TRI-METER-2026); Harvey's co-founder said pass-through might become more common (ARTLAW-HARVEY14X-2026)"
    - "Experts told Law360 any benefit for firms will not be automatic or immediate and raised whether clients will face new AI fees (LAW360-LEGORA-2026)"
    - "Clients may refuse to pay for AI-done work or ask for AI line items (TRI-LEGALWEEK-2026)"
  human_checkpoints:
    - "Finance decides whether to allocate or absorb each category of AI cost"
    - "Billing partner and client agree AI cost terms in the engagement letter (CALBAR-GENAI-2026)"
  role_evolution: "Non-Billable reports that firms may begin allocating AI costs to individual matters instead of absorbing them as overhead (NONBILLABLE-2026)."
  evidence_grade: C
  sources:
    - {ref: LEGORA-CBP-2026, title: "Introducing Consumption-Based Pricing", publisher: Legora, type: vendor, url: "https://legora.com/blog/consumption-based-pricing", date: "2026-06-23", access: full, locator: "'At a glance' and body"}
    - {ref: ARTLAW-HARVEY14X-2026, title: "Harvey Increases Token Use 14X in Just 6 Months", publisher: Artificial Lawyer, type: press, url: "https://artificiallawyer.com/2026/07/08/harvey-increases-token-use-14x-in-just-6-months", date: "2026-07-08", access: full, locator: "Body; paragraph quoting Pereyra on pass-through"}
    - {ref: NONBILLABLE-2026, title: "The $10 million AI bill is coming. Can law firms explain it?", publisher: Non-Billable, type: press, url: "https://www.nonbillable.co.uk/news/legal-ai-moves-usage-based-pricing-consumption-harvey-legora", date: "2026-07-09", access: full, locator: "Article body, Pereyra quotes"}
    - {ref: BAKERDONELSON-TOKENS-2026, title: "AI Tokenomics Guide: Understanding Token-Based AI Pricing for Legal Technology (Justin Daniels)", publisher: Baker Donelson, type: firm, url: "https://www.bakerdonelson.com/webfiles/Bios/Token-Pricing-Guide-for-Clients-August-2026.pdf", date: "2026-08-20", access: full, locator: "Sections 4, 5 and 7"}
    - {ref: ISBA-ELEFANT-2026, title: "The One About Passing AI Costs Through to Clients (MyShingle Ethics Opinion, Carolyn Elefant), Rural Practice newsletter", publisher: Illinois State Bar Association, type: professional-body, url: "https://www.isba.org/node/104199", date: "2026-07", access: full, locator: "Sections on overhead versus client expenses and the sample disclosure"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8, cost treatment paragraphs"}
    - {ref: TXETHICS-OP705-2025, title: "Opinion 705 (generative AI)", publisher: "Professional Ethics Committee for the State Bar of Texas", type: professional-body, url: "https://www.legalethicstexas.com/resources/opinions/opinion-705/", date: "2025-02", access: full, locator: "Fees section"}
    - {ref: LAWYERSWEEKLY-KEYPOINT-2026, title: "'Clients will get annoyed' if firms pass on AI costs, says Keypoint's CEO", publisher: Lawyers Weekly (Australia), type: press, url: "https://www.lawyersweekly.com.au/biglaw/44659-clients-will-get-annoyed-if-firms-pass-on-ai-costs-says-keypoint-s-ceo", date: "2026-07-15", access: full, locator: "Headline and visible portion"}
    - {ref: TRI-METER-2026, title: "Ferraris for emails: At ILTACON 2026, the industry starts reading the meter", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2026-reading-the-meter", date: "2026-09-09", access: full, locator: "'Ferraris for emails' section, Ballard Spahr remark"}
    - {ref: LAW360-LEGORA-2026, title: "Legora's New AI Pricing Model May Usher In Larger Changes", publisher: Law360 Pulse, type: press, url: "https://www.law360.com/articles/2494404", date: "2026-06-26", access: full, locator: "Opening paragraphs"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Section 'The contradictions in the room'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms and legal AI vendors. Grade C: vendor announcements, a firm's buying guide and practitioner opinion; no law-firm customer is named for consumption billing and no firm is reported to bill token cost through. The pass-through and fixed-fee margin parts are ideas. Fee-agreement wording on AI cost is held in scoping-pricing (professional-services-scoping-pricing-07). One input read Law360 only as a headline; another read the opening section. Merged from practice-06, practice-08 (idea), discourse-09 (idea), governance-07 (idea) and governance-08."

- id: professional-services-firm-finance-13
  title: Set partner expectations, credit and pay rules for AI adoption and non-hourly work, and give partners a plan to monetise AI
  archetype: professional-services
  module: firm-finance
  function: people-hr
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Partners decide billing and staffing, but law-firm recruiting and pay depend heavily on utilisation and billable hours (TRI-ILTACON-2025), and only 25% of stand-out lawyers strongly agree their firm has a plan to monetise AI use (TRI-STANDOUT-2026)."
  solution: "PwC's US chief executive told the FT that partners who resist AI 'have no place at the firm' and that no one gets a free pass (CPAPA-PWC-2026). TRI's 2026 Stand-out Lawyers Survey describes partners as the firm's commercial transmission mechanism, finds a gap between having an AI strategy and a plan to monetise it, and recommends accuracy information, use-case training and feedback loops (TRI-STANDOUT-2026). A GGI alliance article by an Offit Kurman lawyer urges firms to review origination credit, partner pay and write-off policy for work priced by value, outcome or retainer (MONDAQ-GGI-2026). Wipfli is introducing client satisfaction and cycle time as staff metrics (BLOOMBERGTAX-PRICING-2026). No firm reports a changed partner pay formula."
  outcomes:
    - {lever: growth, description: "Monetisation plans and AI impact among stand-out lawyers", figure: "25%; 9x", measures: "Share of client-nominated stand-out lawyers (2,527 interviews) who strongly agree their firm has a plan for monetising AI use; relative likelihood that AI-embedded versus minimal users report significant efficiency and quality impact", provenance: vendor-published, source_ref: TRI-STANDOUT-2026}
  prerequisites:
    - "Partner-level data on AI use and on matter economics"
    - "Training built on real use cases and clear information on tool accuracy (TRI-STANDOUT-2026)"
    - "Partner agreement on revised credit and write-off rules"
  risks_and_guardrails:
    - "Time to experiment alone is unlikely to raise adoption (TRI-STANDOUT-2026)"
    - "Among professionals who see an AI value gap, 24% are considering leaving within two years (TR-FOP-2026); TRI reports that perceived misalignment between a professional's AI preferences and firm strategy raises attrition risk (TRI-FOP-LAW-2026)"
    - "From 2 December 2027, AI used for employment and worker management in the EU is high-risk under the AI Act (EC-AIACT-2026); California flags bias risk in AI used for employment actions (CALBAR-GENAI-2026)"
    - "PwC's remark is a statement of intent reported second-hand through the FT (CPAPA-PWC-2026)"
  human_checkpoints:
    - "Compensation committee approves metric and credit changes; practice leaders review use"
  role_evolution: "PwC's US chief executive said senior staff not 'paranoid about being AI-first' would probably be replaced (CPAPA-PWC-2026). INSIDE Public Accounting expects partner tracks in operations, technology enablement and change management (IPA-2026)."
  evidence_grade: C
  sources:
    - {ref: CPAPA-PWC-2026, title: "PwC CEO Says Partners Who Resist AI 'Have No Place at the Firm' (reporting the Financial Times)", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/03/25/pwc-ceo-says-partners-who-resist-ai-have-no-place-at-the-firm/180245/", date: "2026-03-25", access: full, locator: "Opening paragraphs"}
    - {ref: TRI-STANDOUT-2026, title: "Turning law firm AI strategies into practice: Findings from the 2026 Stand-out Lawyers Survey", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/turning-law-firm-ai-strategies-into-practice", date: "2026-08-06", access: full, locator: "Key takeaways and 'AI strategy is visible, but confidence is weak'"}
