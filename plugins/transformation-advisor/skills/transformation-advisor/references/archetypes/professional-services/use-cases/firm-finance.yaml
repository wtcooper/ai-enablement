    - {ref: TRI-STANDOUT-2026, title: "Turning law firm AI strategies into practice: Findings from the 2026 Stand-out Lawyers Survey", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/turning-law-firm-ai-strategies-into-practice", date: "2026-08-06", access: full, locator: "'How to talk to clients about AI'"}
    - {ref: CTV-DELOITTE-2025, title: "Deloitte to partially refund Australian government for report with apparent AI-generated errors (Associated Press)", publisher: CTV News, type: press, url: "https://www.ctvnews.ca/business/article/deloitte-to-partially-refund-australian-government-for-report-with-apparent-ai-generated-errors/", date: "2025-10-07", access: full, locator: "Page description and headline (body did not load)"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Speaker list (Greenberg Traurig Chief Pricing and Innovation Officer)"}
    - {ref: RESULTSENSE-2026, title: "AI dismantles consulting scale advantage as boutiques target Big Four (summary of FT and City AM)", publisher: Resultsense, type: press, url: "https://www.resultsense.com/news/2026-05-28-ai-consulting-big-four-reckoning/", date: "2026-05-28", access: full, locator: "Paragraph beginning 'What AI is actually undoing' (secondary McKinsey figure)"}
  last_reviewed: "2026-10-19"
  notes: "Firm kinds: consulting (McKinsey), law (Keypoint Law, Australia; Clio's solo-to-enterprise law sample), in-house (a general counsel at a private-equity portfolio company; his baseline-price proposal is labelled an idea). Grade B rests on McKinsey's rounded media-briefing figure and Keypoint's stated practice; no firm publishes a measured margin or realisation effect of changing its fee mix. A secondary summary gives McKinsey's share as roughly a third (RESULTSENSE-2026); only the quarter was read at a primary report. Deal-level fee design is held in scoping-pricing: professional-services-scoping-pricing-15 (law flat fees), -16 (accounting and tax value pricing), -18 (Kopka Law KPI retainer), -19 (McKinsey outcome fees), -14 (choosing a structure). This entry is the firm-level revenue mix. Merged from practice-02, practice-04, practice-21; discourse-05; governance-10."

- id: professional-services-firm-finance-02
  title: Model how much AI will compress each type of work, to plan rates, capacity and alternative fees before the annual rate round
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Firms set rates and fee arrangements on averages, without a view of which work AI will shorten. Rates and results are moving apart: in Q1 2026 Am Law 100 worked rates grew almost 10% and demand 2.7%, yet the Law Firm Financial Index sat at its long-run average of 55 (TRI-LFFI-Q1-2026). TRI warns that premium billing tied to AI is sustainable only when clients clearly see added value (TRI-SOTLM-2026)."
  solution: "Legal Decoder, a legal spend analytics vendor, said on 2026-07-15 that it would soon release AI Replaceability (AIR), which sorts legal work into eight archetypes and applies expected AI-driven compression ratios to each, and an AFA builder that prices clusters of similar work (for example low, medium and high complexity depositions) rather than averages (LAWSITES-DECODER-2026). Two recruiter postings for unnamed global law firms ask pricing staff to model margins and fee structures for GenAI-assisted matters (AMBITION-PRICINGMANAGER-2026; AMBITION-PRICINGADVISOR-2026), and TRI's account of its 2025 COO & CFO Forum describes pricing teams that use AI and data (TRI-COOCFO-AI-2025). Idea, not described by any firm: feed this modelling into the annual rate round so rate rises and AI savings are decided together."
  outcomes:
    - {lever: cost, description: "none published", figure: "none published", measures: "Not applicable: AIR and the AFA builder were described on 2026-07-15 as due 'in the coming weeks'; no customer or result", provenance: vendor-published, source_ref: LAWSITES-DECODER-2026}
  prerequisites:
    - "LEDES billing exports (6, 12 or 24 months) down to timekeeper level (LAWSITES-DECODER-2026)"
    - "A defensible mapping of the firm's matters to work types"
    - "Agreement on who owns the compression assumptions: pricing, finance or practice leaders"
  risks_and_guardrails:
    - "The compression ratios are the vendor's expected values, not measured results at a named firm; treating them as forecasts could mis-set rates or fixed fees"
    - "Modelled compression cannot be used to bill hours not worked: hourly bills must reflect time actually spent (CALBAR-GENAI-2026)"
    - "Rate strategy differs by segment: in Q1 2026 large firms raised standard rates faster than worked rates and accepted deeper discounts, while Midsize firms did the opposite (TRI-LFFI-Q1-2026)"
  human_checkpoints:
    - "Pricing or finance leadership reviews the assumptions before rates or alternative fee arrangements change"
    - "Partners review the work clusters before they become fee schedules"
  role_evolution: "Recruiter postings for unnamed global law firms describe pricing roles that model margins and fee structures for GenAI-assisted matters (AMBITION-PRICINGMANAGER-2026). Greenberg Traurig's Chief Pricing and Innovation Officer spoke on AI value at Legalweek 2026 (TRI-LEGALWEEK-2026)."
  evidence_grade: C
  sources:
    - {ref: LAWSITES-DECODER-2026, title: "Legal Decoder Introduces Aperture, A Natural Language Interface for Querying Legal Billing Data", publisher: LawSites (Bob Ambrogi), type: press, url: "https://www.lawnext.com/2026/07/legal-decoder-introduces-aperture-a-natural-language-interface-for-querying-legal-billing-data.html", date: "2026-07-15", access: full, locator: "Section 'What's Ahead' (AIR and AFA builder)"}
    - {ref: AMBITION-PRICINGMANAGER-2026, title: "Pricing Manager - Gen AI, City of London (recruiter posting for an unnamed global law firm)", publisher: Ambition (recruiter), type: job-posting, url: "https://www.ambition.co.uk/job/pricing-manager-gen-ai-556277-1770801372", date: "2026-02-11", access: full, locator: "The Role"}
    - {ref: AMBITION-PRICINGADVISOR-2026, title: "Senior Pricing Advisor, London (Complex Matters and GenAI) (recruiter posting for an unnamed global law firm)", publisher: Ambition (recruiter), type: job-posting, url: "https://www.ambition.co.uk/job/senior-pricing-advisor-556300-1770890369", date: "2026-02-12", access: full, locator: "Key Responsibilities"}
    - {ref: TRI-COOCFO-AI-2025, title: "Law Firm COO & CFO Forum: As law firms push to offer solutions and demonstrate value, will AI get them there?", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/coo-cfo-forum-ai-solutions-demonstrating-value", date: "2025-11-03", access: full, locator: "Paragraph on pricing teams that use AI and data"}
    - {ref: TRI-LFFI-Q1-2026, title: "Q1 2026 LFFI: Strong inputs, average output - and the first drops of rain", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/lffi-q1-2026-strong-inputs-average-output", date: "2026-05-13", access: full, locator: "Key insights; 'The segments' strategy split'"}
    - {ref: TRI-SOTLM-2026, title: "State of the US Legal Market 2026 analysis: Will the AI bubble burst? A crucial warning for law firms", publisher: Thomson Reuters Institute with Georgetown Law CELP, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/legal-market-report-2026-analysis-ai-bubble", date: "2026-01-14", access: full, locator: "Sections on fees worked per lawyer and premium billing"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Speaker title for Matthew Beekhuizen, Greenberg Traurig"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (and in-house teams, which Legal Decoder says can use AIR to see what they should no longer expect to pay for). Announced products and anonymous recruiter postings only; no firm describes using AI efficiency evidence to set rates (the rate-round step is labelled an idea). Matter-level pricing tools and fee proposals from past matters are in scoping-pricing (professional-services-scoping-pricing-03). Merged from practice-01, governance-06 and discourse-11 (pricing-team capability)."

- id: professional-services-firm-finance-03
  title: Use passively captured work data to find revenue leakage and manage matter profitability, leverage and realisation while work is in flight
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: "Firms learn that a matter lost money after the bill is out. Recorded time differs from time worked, timekeepers rebuild their day from memory, and the cost of delivering a fixed fee is a guess."
  solution: "Laurel captures activity across applications and drafts time entries, and its Signal module turns the same data into firm-level views: recorded versus actual time to find leakage, billable and non-billable work to price fixed fees, cost against revenue as projects run, and where partners do routine work or associates are at capacity (LAUREL-SIGNAL-2026). Aprio's CFO says it shows hidden write-downs and how partner and senior time affects leverage (LAUREL-SIGNAL-2026); The Bonadio Group's CIO says it gives objective visibility into the true cost of delivery (LAUREL-WORKSTUDIO-2026). Laurel's customer story on Tonkon Torp, a Portland law firm, reports more time captured and faster collection (LAUREL-TONKON-2026); Warren Averett, an accounting firm of 750+ professionals, rolled Laurel out in its AI programme (LAUREL-WARREN-2026). On 2026-10-13 Legora and Laurel announced that tasks done in Legora will become draft time entries, with a second phase to measure Legora usage and the value of AI work (LAWSITES-LAUREL-2026; LEGORA-LAUREL-2026)."
  outcomes:
    - {lever: capacity, description: "Tonkon Torp after Laurel", figure: "21 min/day per lawyer; about $20,000 per timekeeper a year; 20% faster collection cycle", measures: "From Laurel's customer story: average extra minutes captured per attorney per day (the summary says 20, the text 21); approximate additional annual revenue per timekeeper; speed-up of the collection cycle. The page does not attribute the figures to a firm analysis", provenance: vendor-published, source_ref: LAUREL-TONKON-2026}
    - {lever: experience, description: "Law firms testing or piloting Laurel", figure: "51%", measures: "Share of respondent firms in ILTA's 2026 technology survey (508 firms) listing Laurel among products being tested or piloted, as reported by LawSites; not deployment or outcomes", provenance: independent, source_ref: LAWSITES-ILTASURVEY-2026}
  prerequisites:
    - "Passive capture across the firm's applications and a mapping from activity to client and matter"
    - "A taxonomy of tasks and projects built with the vendor, and defined KPIs with their systems of record (LAUREL-WORKSTUDIO-2026)"
    - "Staff and partner acceptance of activity capture"
  risks_and_guardrails:
    - "Capturing work activity raises employee privacy and trust questions; the vendor states single-tenant AI, no public LLMs and bring-your-own-key, which customers should verify (LAUREL-WORKSTUDIO-2026)"
    - "Time entries must reflect time actually spent on the matter (CALBAR-GENAI-2026)"
    - "The classification of activity into tasks and projects is itself AI-derived and needs checking against the firm's records"
  human_checkpoints:
    - "The timekeeper reviews and releases drafted entries (LAUREL-TONKON-2026)"
    - "Finance and practice leaders review profitability and leverage flags; partners decide on pricing, staffing and fixed-fee change orders"
  role_evolution: "Aprio's CFO describes using the data to staff more effectively, protect margins and plan (LAUREL-SIGNAL-2026)."
  evidence_grade: B
  sources:
    - {ref: LAUREL-SIGNAL-2026, title: "Laurel Signal (platform page)", publisher: Laurel, type: vendor, url: "https://www.laurel.ai/platform/signal", date: "2026-10", access: full, locator: "Sections 'Profitability & Pricing', 'Leverage & Resources' and Aprio quotation (undated page; retrieval month)"}
    - {ref: LAUREL-WORKSTUDIO-2026, title: "Laurel Work Studio (platform page)", publisher: Laurel, type: vendor, url: "https://www.laurel.ai/platform/work-studio", date: "2026-10", access: full, locator: "Bonadio quotation; 'Pricing' and 'Outcome metrics' sections; security statements (undated page)"}
    - {ref: LAUREL-TONKON-2026, title: "Tonkon Torp LLP embraces Laurel for superior client service and timekeeper happiness (customer story)", publisher: Laurel, type: vendor, url: "https://www.laurel.ai/customer-stories/tonkon-torp", date: "2026-10", access: full, locator: "'After Laurel' summary and 'Building trust with clients' (undated page)"}
    - {ref: LAUREL-WARREN-2026, title: "How Warren Averett turned time entry into a competitive advantage (customer story)", publisher: Laurel, type: vendor, url: "https://www.laurel.ai/customer-stories/warren-averett", date: "2026-10", access: full, locator: "Problem and rollout sections (undated page)"}
    - {ref: LAWSITES-LAUREL-2026, title: "Legora and Laurel Partner to Enable Automatic Time Capture; Will Later Develop Measures of Legora's Value to Firms", publisher: LawSites (Bob Ambrogi), type: press, url: "https://www.lawnext.com/2026/10/legora-and-laurel-partner-to-enable-automatic-time-capture-will-later-develop-measures-of-legoras-value-to-firms.html", date: "2026-10-13", access: full, locator: "Paragraphs on the second phase"}
    - {ref: LEGORA-LAUREL-2026, title: "Legora and Laurel partner to capture the time lawyers spend in Legora as they work", publisher: Legora, type: vendor, url: "https://legora.com/newsroom/legora-and-laurel-partner-to-capture-the-time-lawyers-spend-in-legora-as-they-work", date: "2026-10-13", access: full, locator: "Paragraphs on phase one and phase two"}
    - {ref: LAWSITES-ILTASURVEY-2026, title: "Which AI Product Is Most Popular Among Law Firms? Findings of ILTA's Tech Survey May Surprise You", publisher: LawSites (Bob Ambrogi), type: press, url: "https://www.lawnext.com/2026/09/which-ai-product-is-most-popular-among-law-firms-findings-of-iltas-tech-survey-may-surprise-you.html", date: "2026-09-14", access: full, locator: "List of products firms are testing or piloting"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
  last_reviewed: "2026-10-19"
  notes: "Firm kinds: accounting and advisory (Aprio, The Bonadio Group, Warren Averett), law (Tonkon Torp). Grade B: named users, but every statement and figure is on the vendor's pages and none is attributed to the firm's own tracked data. The time-entry drafting itself (capture to cash) belongs to billing-collections; this entry keeps the firm-level use of the data for realisation, profitability and leverage. Merged from practice-10 and practice-13; discourse-07 (Legora-Laurel) in part."

- id: professional-services-firm-finance-04
  title: Analyse every line of legal bills with machine learning and a plain-language query layer to police fees and manage panels (in-house and firm pricing teams)
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Billing codes (UTBMS) are unreliable, so finding block billing, skill-set mismatches or excessive time means reading narratives, and non-specialists find dashboard tools hard to query. Reviewers sample invoices rather than read every line."
  solution: "Legal Decoder takes LEDES exports, re-categorises every line item from its narrative using a library of more than 411,000 legal concepts, and applies 45 flags (block billing, skill-set mismatch, multi-staffed meetings, excessive time, vague entries). Its Aperture layer, launched 2026-07-15, lets users ask questions in plain language while the numbers come from the underlying engine; firm, timekeeper, matter and client names are replaced with session tokens before the LLM sees the data, and findings export to line items. Fee examiners in named bankruptcy cases (PG&E, Toys 'R' Us, Spirit Airlines, Purdue Pharma) disclose the tool as their methodology. Legal Decoder won an Association of Corporate Counsel Value Champion award in 2025 for work with UnitedLex reviewing UBS's highest-cost matters after the Credit Suisse acquisition (LAWSITES-DECODER-2026)."
  outcomes:
    - {lever: quality, description: "Fee examiners relying on the methodology", figure: "4 named cases", measures: "Bankruptcy matters the CEO cited in which fee examiners disclose Legal Decoder as their methodology; not a count of all uses and not a performance measure", provenance: vendor-published, source_ref: LAWSITES-DECODER-2026}
  prerequisites:
    - "LEDES billing data via secure transfer or API"
    - "An e-billing system alongside it; the vendor says it complements Brightflag or Legal Tracker and does not process payments (LAWSITES-DECODER-2026)"
    - "Agreement with outside firms on how findings are used"
  risks_and_guardrails:
    - "LLM answers can vary between runs; the vendor says only the narrative varies, not the numbers (LAWSITES-DECODER-2026)"
    - "Court use means fee examiners disclose the method, not that its accuracy has been measured; no error or override rate is published"
  human_checkpoints:
    - "Users can check findings against the invoices via CSV export (LAWSITES-DECODER-2026)"
    - "Legal operations or the fee examiner decides what to dispute"
  role_evolution: "Legal operations and pricing teams review flagged exceptions across all lines rather than sampled invoices. Legal Decoder won the True Value Partnering Institute's Legal Pricing Vendor of the Year award in 2025 and 2026; the institute's members include pricing professionals at large law firms (LAWSITES-DECODER-2026)."
  evidence_grade: B
  sources:
    - {ref: LAWSITES-DECODER-2026, title: "Legal Decoder Introduces Aperture, A Natural Language Interface for Querying Legal Billing Data", publisher: LawSites (Bob Ambrogi), type: press, url: "https://www.lawnext.com/2026/07/legal-decoder-introduces-aperture-a-natural-language-interface-for-querying-legal-billing-data.html", date: "2026-07-15", access: full, locator: "Sections 'AI Layered on Machine Learning', 'Tokenization Before the LLM', 'Court-Validated Analytics' and 'Complement to E-Billing'"}
  last_reviewed: "2026-10-19"
  notes: "In-house (UBS legal department via UnitedLex) and law-firm pricing teams; fee examiners in US bankruptcy cases. The machine-learning engine is in use; the LLM layer is new. Single interview-based source. Merged from practice-11."

- id: professional-services-firm-finance-05
  title: Finance-operations agents inside the billing system explain rates, handle governed rate requests and forecast the general ledger
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting, transaction-processing]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: "Finance teams spend time assembling context across billing, receivables, time and rate data, and on spreadsheet work to forecast and track rate changes."
  solution: "Aderant's Agent Center lists agents that use data already in licensed Aderant products. The Rates Agent explains which rates apply, tracks changes and supports governed requests, approvals and opt-outs. The GL Forecasting Agent combines recent actuals with forward estimates, confidence ranges and variance analysis and explains the main drivers. Aderant says agents prepare, prioritise and draft, and the team reviews and decides (ADERANT-AGENTS-2026)."
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "Not applicable: the page states aims such as forecasting faster; no customer or result", provenance: vendor-published, source_ref: ADERANT-AGENTS-2026}
  prerequisites:
    - "Licensed Aderant products holding billing, receivables, time, rate and financial data (ADERANT-AGENTS-2026)"
    - "Permissions and firm controls configured so the agents respect them"
  risks_and_guardrails:
    - "Aderant says agents follow product permissions and leave a record of the information used and work prepared; no independent evaluation is published (ADERANT-AGENTS-2026)"
    - "A forecast agent's explanation of drivers needs checking against ledger data"
  human_checkpoints:
    - "Rate requests go through governed approvals (ADERANT-AGENTS-2026)"
    - "Finance staff review forecasts and drafts before use"
  role_evolution: "Aderant describes its agents as preparing and drafting while the team reviews and decides (ADERANT-AGENTS-2026)."
  evidence_grade: C
  sources:
    - {ref: ADERANT-AGENTS-2026, title: "Aderant Agent Center: AI Agents for Legal Business Operations", publisher: Aderant, type: vendor, url: "https://www.aderant.com/aderant-agent-center/", date: "2026-10", access: full, locator: "'Meet the Aderant Agents' section (undated page; retrieval month; read through a text mirror)"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (Aderant's market). Product documentation only; no customer, availability date or result. The Time, Appeals and Collections agents on the same page belong to billing-collections. Merged from practice-12."

- id: professional-services-firm-finance-06
  title: Aim AI at the research and drafting time that partners write down, to raise realisation
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [research-synthesis, document-production, data-reporting]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: "Partners write down time that took too long or became too expensive; TRI puts the average partner's own write-downs at about 300 hours a year (TRI-EFFICIENCY-2025). Associates may write off research time clients are reluctant to pay for (LEXIS-FORRESTER-2025)."
  solution: "Start with a revenue-leakage analysis to find where hours are lost, then apply AI to those workflows as a first return on AI investment (TRI-EFFICIENCY-2025, written with the Chief Legal Operations Officer of Miles & Stockbridge; TRI-ROI-2025). A Forrester Consulting study commissioned by LexisNexis models, for a theoretical large law firm, part of previously written-off research time becoming billable (LEXIS-FORRESTER-2025). No firm reports doing this with measured results."
  outcomes:
    - {lever: growth, description: "Modelled recovery of written-off research fees", figure: "up to $6.2m over 3 years; up to 35% of written-off research hours billable", measures: "Modelled for a theoretical large law firm, built from interviews with large firms using Lexis+ AI; vendor-commissioned", provenance: vendor-published, source_ref: LEXIS-FORRESTER-2025}
  prerequisites:
    - "Write-down and realisation data by matter and timekeeper"
    - "A revenue-leakage analysis before choosing tools (TRI-EFFICIENCY-2025)"
  risks_and_guardrails:
    - "The figures are modelled for a theoretical firm in a study the product vendor commissioned (LEXIS-FORRESTER-2025)"
    - "Hourly bills must still reflect time actually spent, including time refining and checking AI output (CALBAR-GENAI-2026; TXETHICS-OP705-2025)"
    - "A July 2025 TRI piece says realisation rates have stayed just above 90% for three years (TRI-RETHINKING-2025)"
  human_checkpoints:
    - "Billing partners decide whether to write down time (TRI-EFFICIENCY-2025)"
  role_evolution: "LexisNexis says partners and senior associates may reallocate part of the saved time to high-value client work (LEXIS-FORRESTER-2025)."
  evidence_grade: C
  sources:
    - {ref: LEXIS-FORRESTER-2025, title: "How AI drives law firm profitability (summary of Forrester Consulting's Total Economic Impact of Lexis+ AI for Large Law Firms)", publisher: LexisNexis, type: vendor, url: "https://www.lexisnexis.com/community/insights/legal/b/thought-leadership/posts/how-ai-drives-law-firm-profitability", date: "2026-09", access: full, locator: "Sections on written-off research hours and senior-attorney drafting time"}
    - {ref: TRI-EFFICIENCY-2025, title: "The AI-driven future of legal efficiency: How can law firms reclaim millions in lost revenue while enhancing client value?", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/reports/ai-driven-legal-efficiency-white-paper-2025", date: "2025-04-14", access: full, locator: "Billing-inefficiency discussion"}
    - {ref: TRI-ROI-2025, title: "Finding a quicker ROI on law firms' investment in AI", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/law-firm-roi-ai-investment", date: "2025-05-19", access: full, locator: "Section 'Understanding where the time goes' and closing paragraphs"}
    - {ref: TRI-RETHINKING-2025, title: "From billable hours to agentic outcomes: Rethinking legal value in the age of AI", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/rethinking-legal-value", date: "2025-07-15", access: full, locator: "Paragraph on realisation rates above 90%"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
    - {ref: TXETHICS-OP705-2025, title: "Opinion 705 (generative AI)", publisher: "Professional Ethics Committee for the State Bar of Texas", type: professional-body, url: "https://www.legalethicstexas.com/resources/opinions/opinion-705/", date: "2025-02", access: full, locator: "Fees section"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: large US law firms (modelled); Miles & Stockbridge co-authored the TRI white paper. Customers in the Forrester study are not named. TRI's 300-hour figure is a baseline from its own billing research, not an AI outcome. Pre-bill mechanics belong to billing-collections. Merged from governance-04 and discourse-20 (idea)."

- id: professional-services-firm-finance-07
  title: Set a firm-level AI investment envelope and review it against the finance measures the CFO and board already track
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [data-reporting, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Spending is ahead of proof. US law-firm technology spend rose nearly 11% and knowledge-management spend about 10% in 2025 (TRI-SOTLM-2026), yet only 18% of professionals say their organisation tracks AI return on investment (TR-AIPS-2026), and law-firm COOs at a roundtable said few firms formally measure AI efficiency gains (WESTERNALLIANCE-COO-2026)."
  solution: "Firms set an AI budget and review spend against adoption and the finance measures leaders already watch; SPI's report page invites firms to tie AI to utilisation, margin, revenue per employee and EBITDA (SPI-AI-2026). PwC reports that its firms invested $3 billion across the network in AI and other key areas in the year to 30 June 2026, covering the initial rollout of PwC One, an AI-native assurance platform and a tax data platform (AT-PWC-2026). RSM US announced in June 2025 a commitment of $1 billion over three years in AI tools (BLOOMBERGTAX-PRICING-2026). KPMG tracks staff AI use with data from tools such as Microsoft Copilot and says the aim is to ensure use and measure the value of the investment (BLOOMBERG-KPMG-2025)."
  outcomes:
    - {lever: cost, description: "PwC network AI investment", figure: "$3 billion", measures: "Investment by PwC firms across the network in AI and other key areas in the year to 30 June 2026, as reported from PwC's results; the AI share is not given and no return is stated", provenance: self-reported, source_ref: AT-PWC-2026}
    - {lever: cost, description: "Law-firm technology and knowledge-management spend", figure: "nearly 11% and about 10% in 2025; 39.3% and 37.2% above 2021", measures: "Change in US law-firm technology and knowledge-management spending, from TRI's Financial Insights data", provenance: vendor-published, source_ref: TRI-SOTLM-2026}
    - {lever: risk, description: "Organisations tracking AI return", figure: "18% track; 40% do not know", measures: "Share of 1,500+ professionals across legal, tax, accounting, risk, fraud and government who say their organisation tracks AI ROI; share who do not know whether it is measured", provenance: vendor-published, source_ref: TR-AIPS-2026}
    - {lever: growth, description: "Strategy and return", figure: "22% have a GenAI strategy; 3.9x more likely to achieve ROI", measures: "As stated by a Thomson Reuters speaker at Legalweek 2026; base and ROI definition not given", provenance: vendor-published, source_ref: TRI-LEGALWEEK-2026}
  prerequisites:
    - "A named AI strategy that reaches day-to-day practice; 35% of professionals in organisations with one say practice does not match it (TR-FOP-2026)"
    - "Visibility of use: 34% of professionals use AI tools their organisation has not sanctioned (TR-FOP-2026)"
    - "Cost attribution by project; KPMG's US Vice Chair of Advisory notes AI cost often cannot be attributed to individual projects (BLOOMBERGTAX-PRICING-2026)"
  risks_and_guardrails:
    - "TRI warns firms using AI mainly to justify higher rates, without better outcomes, would be exposed if an AI bubble burst (TRI-SOTLM-2026)"
    - "PwC publishes no return on its $3 billion, and the report states no link between the spend and revenue growth (AT-PWC-2026)"
    - "In a Litera survey reported by LawSites, ROI ranked last among drivers of AI investment and 32% of firms said they could not show AI value to their most important client (LITERA-LAWSITES-2026)"
    - "ILTA says the 'high cost of technology' now shares top billing among leadership concerns (ILTA-TECHSURVEY-2026)"
  human_checkpoints:
    - "Executive committee or CFO approves the AI budget and reviews return measures before renewals"
  role_evolution: "TRI's ILTACON 2026 report notes vendors offering to help firms calculate ROI (TRI-ILTACON-IMPL-2026). More than 330,000 PwC people have taken AI training (AT-PWC-2026)."
  evidence_grade: B
  sources:
    - {ref: AT-PWC-2026, title: "PwC grows 2026 global revenue to $60.2B", publisher: Accounting Today, type: press, url: "https://www.accountingtoday.com/news/pwc-grows-2026-global-revenue-to-60-2b", date: "2026-10-19", access: full, locator: "Paragraph on the $3 billion investment, PwC One and training"}
    - {ref: BLOOMBERGTAX-PRICING-2026, title: "AI Efficiency Gains Push Accounting Firms to Reimagine Pricing (Nicola Trentmann)", publisher: Bloomberg Tax, type: press, url: "https://news.bloombergtax.com/financial-accounting/ai-efficiency-gains-push-accounting-firms-to-reimagine-pricing", date: "2026-03-05", access: full, locator: "Paragraphs on RSM US $1 billion and KPMG cost attribution"}
    - {ref: BLOOMBERG-KPMG-2025, title: "KPMG Staff to Be Rated on AI Usage in Yearly Performance Reviews", publisher: Bloomberg, type: press, url: "https://news.bgov.com/health-law-and-business/kpmg-staff-to-be-rated-on-ai-usage-in-yearly-performance-reviews", date: "2025-10-31", access: full, locator: "Paragraphs on usage tracking and measuring the value of the investment"}
    - {ref: SPI-AI-2026, title: "The 2026 Impact of AI on Professional Services (report landing page; report paid)", publisher: SPI Research, type: survey, url: "https://spiresearch.com/reports/2026-ai-professional-services-survey/", date: "2026-10", access: full, locator: "Report description: 'Tie AI to the KPIs your CFO and board already track'"}
    - {ref: TRI-SOTLM-2026, title: "State of the US Legal Market 2026 analysis: Will the AI bubble burst? A crucial warning for law firms", publisher: Thomson Reuters Institute with Georgetown Law CELP, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/legal-market-report-2026-analysis-ai-bubble", date: "2026-01-14", access: full, locator: "Paragraphs on technology and KM spend and bubble risk"}
    - {ref: TR-AIPS-2026, title: "2026 AI in Professional Services Report", publisher: Thomson Reuters Institute, type: survey, url: "https://tax.thomsonreuters.com/content/dam/ewp-m/documents/thomsonreuters/en/pdf/reports/2026-ai-in-professional-services-report.pdf", date: "2026-01", access: full, locator: "ROI findings (18% track; 40% do not know), also shown on the report landing page"}
    - {ref: WESTERNALLIANCE-COO-2026, title: "AI Is Driving Change, but the Hard Decisions Are Still Human (law firm COO roundtable on the 2026 Blickstein Group Law Firm COO Survey)", publisher: Western Alliance Bank, type: community, url: "https://www.westernalliancebancorporation.com/insights/ai-driving-change-hard-decisions-are-still-human", date: "2026-07-31", access: full, locator: "Measurement of AI gains"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Section on the strategy gap (Steven Petrie)"}
    - {ref: TR-FOP-2026, title: "Future of Professionals Report 2026", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026-09", access: full, locator: "Key findings on strategy and unsanctioned AI"}
    - {ref: LITERA-LAWSITES-2026, title: "85% of Law Firms Say Clients Are Driving AI Investment Decisions, New Litera Survey Finds", publisher: LawSites (Litera press release), type: survey, url: "https://www.lawnext.com/2026/05/85-of-law-firms-say-clients-are-driving-ai-investment-decisions-new-litera-survey-finds.html", date: "2026-05-20", access: full, locator: "Survey findings on investment drivers and showing value"}
    - {ref: ILTA-TECHSURVEY-2026, title: "ILTA Technology Survey 2026 Executive Summary", publisher: International Legal Technology Association, type: professional-body, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "p. 6, 'When GenAI Ambition Meets Budget Reality'"}
    - {ref: TRI-ILTACON-IMPL-2026, title: "ILTACON 2026: 'Does it make the boat faster?' How legal teams are finding AI implementation success", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2026-finding-ai-implementation-success", date: "2026-08-31", access: full, locator: "Sections 'Metrics that matter' and 'The definition of success'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kinds: accounting and advisory (PwC network, RSM US, KPMG), law (TRI, ILTA and Litera data; Blickstein COO survey). Grade B: named firms with self-reported spend or practice; spend is measured, return is not. Merged from discourse-13, governance-03, governance-12 and practice-09 (return measurement part); routed items from talent-learning (KPMG usage tracking), client-development (Litera, TR AI in Professional Services) and staffing-resourcing (COO roundtable)."

- id: professional-services-firm-finance-08
  title: Gate pilot-to-licence decisions on weekly active use measured on real matters
  archetype: professional-services
  module: firm-finance
  function: procurement-supply-chain
  work_types: [data-reporting]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: "Lawyers test AI tools on top of billable work, and few legal teams can show a reliable return, so licences risk becoming unused 'shelfware'."
  solution: "Holland & Hart runs pilots on real matters with the document management system connected and treats more than 70% weekly active users as the sign of real adoption, using usage as a go/no-go signal when ROI cannot yet be calculated (TRI-ILTACON-IMPL-2026). Vendors now sell usage analytics for this: Laurel Signal tracks AI tool use by department and rank across tools such as Copilot and Harvey (LAUREL-SIGNAL-2026), and Harvey launched a Command Center for managing enterprise AI adoption (LAWSITES-HARVEYDJ-2026)."
  outcomes:
    - {lever: cost, description: "Adoption threshold used as a purchase test", figure: "more than 70% weekly active users", measures: "Share of trial users active in a given week, used by Holland & Hart as a threshold; not a measured result for any named tool", provenance: self-reported, source_ref: TRI-ILTACON-IMPL-2026}
  prerequisites:
    - "A pilot long enough and on real matters; a Holland & Hart speaker said a trial that asks lawyers to work unpaid cannot be done in under eight weeks (TRI-ILTACON-IMPL-2026)"
    - "Document management integration so the trial uses firm documents (TRI-ILTACON-IMPL-2026)"
    - "A shared definition of the outcome the tool should achieve, agreed before the trial"
  risks_and_guardrails:
    - "Usage is an adoption signal, not a return signal; no attendee in a room of 50+ said their team had a strong AI ROI measure (TRI-ILTACON-IMPL-2026)"
    - "Laurel itself says ROI should be measured 'beyond input metrics' (LAUREL-SIGNAL-2026)"
    - "Trial time is taken from billable work, a cost the firm has to accept"
  human_checkpoints:
    - "Innovation or technology lead decides to buy, extend or stop based on trial use; the business owner confirms the goal"
  role_evolution: "Enterprise applications and innovation staff own adoption metrics and use early-access 'champions' to build buy-in (TRI-ILTACON-IMPL-2026)."
  evidence_grade: B
  sources:
    - {ref: TRI-ILTACON-IMPL-2026, title: "ILTACON 2026: 'Does it make the boat faster?' How legal teams are finding AI implementation success", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2026-finding-ai-implementation-success", date: "2026-08-31", access: full, locator: "Sections 'Metrics that matter' and 'Meet them where they are'"}
    - {ref: LAUREL-SIGNAL-2026, title: "Laurel Signal (platform page)", publisher: Laurel, type: vendor, url: "https://www.laurel.ai/platform/signal", date: "2026-10", access: full, locator: "'AI & Technology ROI' section (undated page)"}
    - {ref: LAWSITES-HARVEYDJ-2026, title: "Harvey Launches Command Center for Managing Enterprise AI Adoption and Partners with DeepJudge on Institutional Knowledge", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/harvey-launches-command-center-for-managing-enterprise-ai-adoption-and-partners-with-deepjudge-on-institutional-knowledge.html", date: "2026-05-20", access: full, locator: "Headline and Command Center paragraphs"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law (Holland & Hart, about 550 attorneys per the article). Stated practice and threshold, so B. Harvey Command Center was routed from knowledge-management and work-production and was not read in detail. Merged from discourse-01 and practice-09 (adoption part)."

- id: professional-services-firm-finance-09
  title: Track where AI-freed hours go, in utilisation, margin and revenue per head, and decide in advance whether to resell or reprice them
  archetype: professional-services
  module: firm-finance
  function: finance-accounting
  work_types: [data-reporting, expert-judgment]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "AI saves time, but unless freed hours are identified and sold, the firm is no more productive. SPI calls hours saved but not resold or repriced 'the leak' (SPI-AI-2026), and TRI notes freed-up time is not itself billable (TRI-CHARGING-2026)."
  solution: "Leaders decide before rollout how released capacity is used (new work, repricing or a lower price) and track the result in utilisation, margin and revenue per employee (SPI-AI-2026). Clio's blog says the fastest-growing firms built a plan for the time AI gives back (CLIO-SOLO-2026). A Consultancy.uk contributor argues firms should measure what happens to the time AI saves rather than counting tools or licences (CONSULTANCYUK-BONE-2026). No firm describes a tracking system."
  outcomes:
    - {lever: capacity, description: "Firms saying AI saves time", figure: "84.8%", measures: "Share of 245 professional-services organisations saying AI saves them time; the matching share saying AI generates revenue is withheld on the landing page", provenance: vendor-published, source_ref: SPI-AI-2026}
    - {lever: growth, description: "Small law firms growing revenue from AI", figure: "about one third", measures: "Approximate share of solo and small law firms using AI said to have grown revenue from it, per Clio's blog summary of its 2026 survey; exact denominator not stated", provenance: vendor-published, source_ref: CLIO-SOLO-2026}
  prerequisites:
    - "Utilisation, margin and revenue-per-head data by project or matter"
    - "Demand and capability to absorb freed capacity (new or advisory work)"
    - "AI cost attribution by project (CONSULTANCYUK-BONE-2026)"
  risks_and_guardrails:
    - "Under hourly billing, saved time cannot be billed as if spent (TXETHICS-OP705-2025; DCBAR-OP388-2024)"
    - "Whittlesey's managing partner said it has not been shown that AI leads to lower client bills because firms incur new technology cost; the firm spends about $30,000 a year on AI products (HBJ-BILLABLE-2026)"
    - "Capacity effects differ by size: Am Law 100 profit per FTE grew faster than revenue per FTE in Q2 2026 while Midsize productivity kept contracting (TRI-LFFI-Q2-2026)"
    - "SPI's full report (USD 1,495) was not read; only landing-page figures are used (SPI-AI-2026)"
  human_checkpoints:
    - "Practice leaders decide how freed hours are redeployed; finance reviews revenue and margin per head"
  role_evolution: "The Consultancy.uk contributor describes a workforce that blends staff, contractors, offshore teams and AI, which makes capacity harder to see (CONSULTANCYUK-BONE-2026)."
  evidence_grade: C
  sources:
    - {ref: SPI-AI-2026, title: "The 2026 Impact of AI on Professional Services (report landing page; report paid)", publisher: SPI Research, type: survey, url: "https://spiresearch.com/reports/2026-ai-professional-services-survey/", date: "2026-10", access: full, locator: "Headline figures; 'Part III: The Leak'; report description"}
    - {ref: TRI-CHARGING-2026, title: "If AI can do the work, then what are you actually charging for?", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/what-are-you-actually-charging-for", date: "2026-10-02", access: full, locator: "Key insights"}
    - {ref: CLIO-SOLO-2026, title: "Why Working Faster Isn't Making Your Solo Practice More Profitable (And What to Do About It)", publisher: Clio, type: vendor, url: "https://www.clio.com/blog/small-solo-law-firm-profitability/", date: "2026-05-20", access: full, locator: "Sections on adoption versus revenue gains"}
    - {ref: CONSULTANCYUK-BONE-2026, title: "Faster work doesn't automatically mean a more profitable professional services firm (contributed by Andrew Bone)", publisher: Consultancy.uk, type: press, url: "https://www.consultancy.uk/news/45863/faster-work-doesnt-automatically-mean-a-more-profitable-professional-services-firm", date: "2026-10-15", access: full, locator: "Paragraphs on 'What happens to the time AI saves?' and AI cost attribution"}
    - {ref: HBJ-BILLABLE-2026, title: "AI-driven efficiencies force law, accounting firms to rethink the billable hour", publisher: Hartford Business Journal, type: press, url: "https://hartfordbusiness.com/article/ai-driven-efficiencies-force-law-accounting-firms-to-rethink-the-billable-hour/", date: "2026-06-01", access: full, locator: "Whittlesey paragraphs"}
    - {ref: TRI-LFFI-Q2-2026, title: "Q2 2026 LFFI: A heavier load, yet a faster crossing", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/lffi-q2-2026-heavy-load-picking-up-speed", date: "2026-08-10", access: full, locator: "Paragraphs on productivity and profit per FTE"}
