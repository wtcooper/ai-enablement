# professional-services / firm-finance use cases (synthesised 2026-10-19 from research/runs/wave3)
# Firm-level finance and performance: fee mix, rates, realisation, profitability, AI investment and return,
# AI cost, partner economics and outside capital. Deal-level pricing lives in scoping-pricing.yaml.
# Firm kinds are named in each entry's notes. In-house examples are tagged "in-house".
# Thomson Reuters Institute (TRI) surveys and market data are labelled vendor-published: TRI belongs to a group that sells legal AI.

- id: professional-services-firm-finance-01
  title: Shift the firm's fee mix away from hours toward fixed, hybrid and outcome-linked fees as AI weakens the link between hours and effort
  archetype: professional-services
  module: firm-finance
  function: strategy-planning
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "When AI shortens a task, an hourly bill earns less for the same result, and clients ask what AI saved them. Yet about 90% of legal dollars still flow through hourly arrangements (TRI-SOTLM-REPORT-2026), and almost two-thirds of 736 law-firm professionals say their firm's pricing structure is unchanged despite client demand (TRI-FOP-LAW-2026)."
  solution: "Firm leaders set a target mix of pricing models across the portfolio rather than deal by deal. McKinsey says about a quarter of its global fees come from outcomes-based pricing, with clients often starting from the outcome they want (BI-MCKINSEY-2025). Keypoint Law's chief executive says the firm has priced on value and fixed fees 'since the start' and expects hybrid models: the known part fixed, the uncertain part hourly (LAWYERSWEEKLY-KEYPOINT-2026). A Stanford Digital Economy Lab paper argues AI pushes consulting toward hybrid and asset-based pricing, with attribution risk capping outcome fees (STANFORD-DEL-2026); a Forrester analyst writes that consultancies have moved toward putting fees at risk (FORRESTER-BLOG-2025). An in-house general counsel proposes, as an idea, a baseline price for repeat deal work built from shared past data, with time kept only to trigger an adjustment (BLOOMBERGLAW-BILLABLE-2026)."
  outcomes:
    - {lever: growth, description: "Share of McKinsey's global fees from outcomes-based pricing", figure: "about a quarter", measures: "McKinsey's stated share of global fees from outcomes-based pricing, given by its UK, Ireland and Israel managing partner at a November 2025 media briefing; period and calculation not stated. A McKinsey technology leader also referred to 20% as 'probably more recent'", provenance: self-reported, source_ref: BI-MCKINSEY-2025}
    - {lever: cost, description: "Law-firm pricing structures unchanged", figure: "almost two-thirds", measures: "Share of the 736 law-firm professionals surveyed who say their firm's pricing structure remains unchanged despite client demand for models reflecting AI-driven efficiencies", provenance: vendor-published, source_ref: TRI-FOP-LAW-2026}
    - {lever: cost, description: "Legal spend still hourly", figure: "about 90%", measures: "Share of legal dollars flowing through hourly billing arrangements, per the State of the US Legal Market report summary", provenance: vendor-published, source_ref: TRI-SOTLM-REPORT-2026}
    - {lever: growth, description: "Pricing unchanged since adopting AI, by firm size (law)", figure: "86% solo, 78% small, 51% mid-market, 46% enterprise", measures: "Share of law firms in each size band that have not changed pricing at all since starting to use AI, per Clio's blog summary of its 2026 survey of over 1,700 respondents", provenance: vendor-published, source_ref: CLIO-SOLO-2026}
  prerequisites:
    - "Cost-to-deliver data by matter and task, so a fixed fee can be set with a known margin"
    - "Measurement and clean attribution before outcome-linked fees; the Stanford paper's third rule is to invest in measurement first (STANFORD-DEL-2026)"
    - "A pricing function or officer; Greenberg Traurig has a Chief Pricing and Innovation Officer (TRI-LEGALWEEK-2026)"
  risks_and_guardrails:
    - "Attribution risk caps outcome pricing; where the firm's contribution is confounded with the client's other work, the paper expects hybrid contracts (STANFORD-DEL-2026)"
    - "McKinsey says its outcomes-based pricing did not start because of AI, so the AI link is partial (BI-MCKINSEY-2025)"
    - "Hourly bills must reflect time actually spent; California allows flat fees that build in AI savings and says fee agreements should explain how AI factors into rates (CALBAR-GENAI-2026). Flat-fee positions differ by state (see scoping-pricing module, Guardrails)"
    - "Leading with price cuts can train clients to expect discounts (TRI-STANDOUT-2026)"
    - "Fees are exposed when AI errors reach a deliverable: Deloitte Australia agreed to partially refund an AUD 440,000 contract after a report with apparent AI-generated errors (CTV-DELOITTE-2025)"
  human_checkpoints:
    - "Firm leadership sets the target fee mix; pricing leads and partners set each fixed or hybrid price"
    - "Partners and client executives agree an outcome scorecard; McKinsey describes scorecards built from investor targets, revenue or profit goals, operational measures and satisfaction scores (BI-MCKINSEY-2025)"
  role_evolution: "McKinsey's technology leader said straight strategy advice is now under 20% of the firm's work (BI-MCKINSEY-2025). The Stanford paper says firms should build hybrid pricing capability as a strategic competence (STANFORD-DEL-2026)."
  evidence_grade: B
  sources:
    - {ref: BI-MCKINSEY-2025, title: "AI is reshaping how McKinsey makes money (Polly Thompson; read via Yahoo Finance syndication)", publisher: Business Insider, type: press, url: "https://finance.yahoo.com/news/ai-reshaping-mckinsey-makes-money-195132745.html", date: "2025-11-17", access: full, locator: "Paragraphs quoting the UK managing partner (fee share) and the technology leader (20%, strategy share)"}
    - {ref: LAWYERSWEEKLY-KEYPOINT-2026, title: "'Clients will get annoyed' if firms pass on AI costs, says Keypoint's CEO", publisher: Lawyers Weekly (Australia), type: press, url: "https://www.lawyersweekly.com.au/biglaw/44659-clients-will-get-annoyed-if-firms-pass-on-ai-costs-says-keypoint-s-ceo", date: "2026-07-15", access: full, locator: "Visible (non-premium) portion: value and fixed-price billing, hybrid models"}
    - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives (Brynjolfsson and Petropoulos)", publisher: "Stanford Digital Economy Lab and USC Marshall", type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Abstract; p. 3; section 5.1 (p. 14); decision rules pp. 20-22"}
    - {ref: FORRESTER-BLOG-2025, title: "The Future Of AI Consulting Services Is Disruptively Bright", publisher: Forrester, type: press, url: "https://www.forrester.com/blogs/the-future-of-ai-consulting-services-is-disruptively-bright", date: "2025-09-15", access: full, locator: "Paragraph beginning 'Modify their economic models'"}
    - {ref: TRI-SOTLM-REPORT-2026, title: "2026 Report on the State of the US Legal Market: Peak prosperity and the fault lines below (executive summary page)", publisher: Thomson Reuters Institute with Georgetown Law CELP, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/state-of-the-us-legal-market-2026", date: "2026-01-07", access: full, locator: "'Structural business model conflict'"}
    - {ref: TRI-FOP-LAW-2026, title: "What the '2026 Future of Professionals Report' says law firm leaders should be doing now", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/future-of-professionals-law-firms-paper-2026", date: "2026-07-21", access: full, locator: "Key takeaways and section on pricing models"}
    - {ref: CLIO-SOLO-2026, title: "Why Working Faster Isn't Making Your Solo Practice More Profitable (And What to Do About It)", publisher: Clio, type: vendor, url: "https://www.clio.com/blog/small-solo-law-firm-profitability/", date: "2026-05-20", access: full, locator: "Section on pricing since adopting AI"}
    - {ref: BLOOMBERGLAW-BILLABLE-2026, title: "The Billable Hour Isn't Dead Yet, But AI Should Reshape Pricing (opinion by an unnamed general counsel)", publisher: Bloomberg Law, type: press, url: "https://news.bgov.com/business-and-practice/the-billable-hour-isnt-dead-yet-but-ai-should-reshape-pricing", date: "2026-06-29", access: full, locator: "Body (the three 'asks')"}
