    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: agentic intelligence for professional services (solutions page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10", access: full, locator: "SOW Drafter Agent entry; 'Seamless sales, handoff and alignment'"}
