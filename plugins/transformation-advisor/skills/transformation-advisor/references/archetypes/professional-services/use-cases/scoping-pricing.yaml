- id: professional-services-scoping-pricing-06
  title: "Hourly matters: build budgets on, and bill, the time AI-assisted work actually takes"
  archetype: professional-services
  module: scoping-pricing
  function: finance-accounting
  work_types: [expert-judgment, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: "Hourly budgets and quotes were built on how long tasks took before generative AI. Several bar opinions say an hourly fee must reflect time actually spent, so quoting or billing legacy task hours for AI-assisted work is a compliance risk. Large corporate clients ask how firms use AI to lower cost and what they do with the saved time."
  solution: "Norton Rose Fulbright says that on hourly matters it bills the hours actually worked, not what the work might have taken without AI, and expects lawyers to redirect recovered time to higher-value work on the same matter or other client matters; its lawyers have access to Harvey, Legora and Microsoft Copilot. Bar guidance sets the same basis for estimating: build the budget from the effort of AI-assisted work (crafting inputs, reviewing and editing outputs), bill actual time, and say in the fee agreement how AI factors into rates and costs."
  outcomes:
    - {lever: risk, description: "Billing policy that follows time actually spent; no savings or fee figure published", figure: "none published (about 1,000 AI licences; two-thirds of lawyers use the tools regularly, per the firm)", measures: "Licences held and share of lawyers who 'touch tech regularly', as reported by Norton Rose Fulbright to Bloomberg Law", provenance: self-reported, source_ref: BLOOMBERGLAW-TEXAS-2026}
  prerequisites:
    - "Time records that show actual time, including time spent crafting inputs and reviewing outputs [CALBAR-GENAI-2026; TXETHICS-OP705-2025]"
    - "A fee agreement that says how fees and costs are calculated and how far AI factors into rates [CALBAR-GENAI-2026]"
    - "A client-value or pricing lead who sets the policy (Norton Rose names a chief client value and innovation officer) [BLOOMBERGLAW-TEXAS-2026]"
  risks_and_guardrails:
    - "DC Opinion 388: under a time-only fee agreement the lawyer can bill only time spent [DCBAR-OP388-2024, section E]; Texas Opinion 705: no charge for time 'saved' by the tool [TXETHICS-OP705-2025]"
    - "North Carolina's worked example: three hours of drafting that now takes one hour cannot be billed as three [NCBAR-FEO1-2024, Opinion #6]"
    - "ABA Formal Opinion 512: hourly bills must reflect time actually spent [ABA-OP512-2024]"
    - "For US tax practitioners, the IRS Office of Professional Responsibility says billing for unspent manual time may breach the fee rule [IRS-OPR-2026, item 2]; see the tax archetype for Circular 230 detail"
    - "Bloomberg Law notes it is unclear whether large clients are seeing smaller bills [BLOOMBERGLAW-TEXAS-2026]"
  human_checkpoints:
    - "Billing partner reviews the pre-bill against time actually worked"
    - "The lawyer reviews, verifies and corrects AI outputs and remains responsible for them [CALBAR-GENAI-2026]"
  role_evolution: "Norton Rose Fulbright says time savings pass to the client on hourly matters and expects lawyers to redirect recovered time to higher-value work on the same matter or to other client matters [BLOOMBERGLAW-TEXAS-2026]."
  evidence_grade: B
  sources:
    - {ref: BLOOMBERGLAW-TEXAS-2026, title: "AI, Billing Emerge as Crossroads for Texas Law Firms and Clients", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/antitrust/ai-billing-emerge-as-crossroads-for-texas-law-firms-and-clients", date: "2026-04-21", access: full, locator: "Paragraphs on Norton Rose Fulbright statements and on the Texas ethics opinion"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "Competence section; 'Charging for Work Produced by Generative AI and Generative AI Costs', p. 8"}
    - {ref: DCBAR-OP388-2024, title: "Ethics Opinion 388 (generative AI in client matters)", publisher: District of Columbia Bar, type: professional-body, url: "https://www.dcbar.org/for-lawyers/legal-ethics/ethics-opinions-210-present/ethics-opinion-388", date: "2024-04", access: full, locator: "Section E, Fees"}
    - {ref: TXETHICS-OP705-2025, title: "Opinion 705 (generative AI)", publisher: "Professional Ethics Committee for the State Bar of Texas", type: professional-body, url: "https://www.legalethicstexas.com/resources/opinions/opinion-705/", date: "2025-02", access: full, locator: "Fees section"}
    - {ref: NCBAR-FEO1-2024, title: "2024 Formal Ethics Opinion 1 (use of artificial intelligence in a law practice)", publisher: North Carolina State Bar, type: professional-body, url: "https://www.ncbar.gov/for-lawyers/ethics/adopted-opinions/2024-formal-ethics-opinion-1/", date: "2024-11-01", access: full, locator: "Inquiry and Opinion #6"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a copy; ABA site blocked)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part II.F (fees)"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert, Issue 2026-19)", publisher: "Internal Revenue Service, Office of Professional Responsibility", type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Item 2"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (US); IRS point applies to tax practitioners. Pattern other: a billing and estimating rule applied by people, not an agent. Grade B rests on Norton Rose Fulbright's statement to Bloomberg Law about billing; no named firm describes re-basing its estimates, which the governance input graded as an idea (D). The firm-finance module also holds the Norton Rose policy. ABA 512 was read in full by the work-production and quality-review governance angles. Merged from governance-01 and the firm-finance item routed here."

- id: professional-services-scoping-pricing-07
  title: Fee agreements that state AI use, client approval and how AI costs are charged, including variable per-matter AI cost
  archetype: professional-services
  module: scoping-pricing
  function: risk-compliance-legal
  work_types: [document-production, client-interaction]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Fee agreements are often silent on whether AI is used and how its cost is treated, while regulators separate general overhead from matter-specific costs. Firms invest heavily in AI and look for ways to recover cost, but clients resist."
  solution: "Engagement letters say whether and how AI is used, whether client approval is required, and which AI costs are overhead absorbed in rates and which are billed at actual cost with disclosure. Idea for the next step: at ILTACON 2026 a possible move from seat-based to consumption-based AI vendor pricing was discussed among press attendees; pricing teams would then decide which AI cost sits in the fee, which is a disclosed pass-through at cost, and which is capped."
  outcomes:
    - {lever: risk, description: "Firms requiring client approval before using generative AI", figure: "8% (under 50 lawyers) to 38% (350-699 lawyers); 34% (over 700 lawyers)", measures: "Share of respondent firms in the ILTA 2026 survey, by firm size, reporting an official policy that requires client approval for generative AI tools (Q3.18); self-reported by firms, aggregated by ILTA", provenance: independent, source_ref: ILTA-TECHSURVEY-2026}
  prerequisites:
    - "A firm generative AI policy: formal policies exist at 57% of firms under 50 lawyers and 80-98% of larger size groups [ILTA-TECHSURVEY-2026, Q3.18]"
    - "Cost tracking per matter, and fee-agreement language that discloses AI costs may be billed separately [CALBAR-GENAI-2026]"
  risks_and_guardrails:
    - "California: general AI subscriptions are overhead; per-matter AI costs can be charged only if the fee agreement discloses it, at actual cost, with no markup without informed written consent [CALBAR-GENAI-2026, p. 8]"
    - "Texas: a lawyer will generally not recover more than the amount actually paid to the AI provider [TXETHICS-OP705-2025]; North Carolina: AI expenses billable if accurate, not clearly excessive and consented to, preferably in writing [NCBAR-FEO1-2024]"
    - "ABA Formal Opinion 512: before charging the client for GAI tools or services, the lawyer must explain the basis for the charge, preferably in writing [ABA-OP512-2024, Part II.F]"
    - "Client resistance and ethical considerations make traditional cost recovery hard for AI tools; the TRI article discusses new methods of cost recovery [TRI-AIBIZ-2025]. Kopka Law describes insurer clients refusing to pay for software or AI costs [TRI-KOPKA-2026]"
    - "Legal tech vendors did not raise consumption pricing unless asked and had little insight to share [EDISCOVERYTODAY-ILTACON-2026]"
  human_checkpoints:
    - "The lawyer decides on client disclosure case by case; North Carolina says ordinary tasks such as research generally need no disclosure [NCBAR-FEO1-2024, Opinion #5]"
    - "Billing partner confirms disclosure and client consent before AI costs are charged"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: ILTA-TECHSURVEY-2026, title: "ILTA Technology Survey 2026 Executive Summary", publisher: International Legal Technology Association, type: professional-body, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "Q3.18 table, p. 5 (document undated; file code 2606, PDF metadata 2026-08-14)"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "pp. 7-8"}
    - {ref: TXETHICS-OP705-2025, title: "Opinion 705 (generative AI)", publisher: "Professional Ethics Committee for the State Bar of Texas", type: professional-body, url: "https://www.legalethicstexas.com/resources/opinions/opinion-705/", date: "2025-02", access: full, locator: "Fees section"}
    - {ref: NCBAR-FEO1-2024, title: "2024 Formal Ethics Opinion 1 (use of artificial intelligence in a law practice)", publisher: North Carolina State Bar, type: professional-body, url: "https://www.ncbar.gov/for-lawyers/ethics/adopted-opinions/2024-formal-ethics-opinion-1/", date: "2024-11-01", access: full, locator: "Opinion #5 and Opinion #6"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a copy; ABA site blocked)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part II.F (fees), p. 12"}
    - {ref: TRI-AIBIZ-2025, title: "How AI is continuing to change the business of law", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/ai-business-of-law", date: "2025-08-20", access: full, locator: "Section 'Focusing on new methods of cost recovery'"}
    - {ref: TRI-KOPKA-2026, title: "How one law firm is challenging a broken status quo around billing", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/broken-status-quo-around-billing", date: "2026-04-30", access: full, locator: "Section 'Why the billable hour hates AI'"}
    - {ref: EDISCOVERYTODAY-ILTACON-2026, title: "My Five ILTACON 2026 Takeaways: Legal Technology Trends (Doug Austin)", publisher: eDiscovery Today, type: conference, url: "https://ediscoverytoday.com/2026/09/04/my-five-iltacon-2026-takeaways-legal-technology-trends/", date: "2026-09-04", access: full, locator: "Section 'Is tokengeddon looming for AI pricing?'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (US). Graded C: aggregated policy data plus guidance; no named firm describes a disclosed AI-cost pass-through. The consumption-cost step is an idea discussed at a conference (governance-15, D). Billing mechanics after the fee is agreed belong to billing-collections. Merged from governance-14, discourse-12 (idea) and governance-15 (idea)."

- id: professional-services-scoping-pricing-08
  title: Predictive alerts on matters heading over budget, with live work-in-progress tracked against the agreed budget
  archetype: professional-services
  module: scoping-pricing
  function: finance-accounting
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: "Budgets are set, but few firms manage them actively, so overruns become write-offs. In BigHand's survey, 23% of firms actively monitor and update budgets throughout the matter."
  solution: "Ayora monitors budgets, work in progress (WIP: time recorded but not yet billed), billing and collections against benchmarks from the firm's own past matters and issues predictive alerts on matters at risk of exceeding budget. Narrative describes live WIP against budget, automated outside-counsel-guideline compliance and catching overruns before write-off."
  outcomes:
    - {lever: quality, description: "Survey baseline on budget management", figure: "63% track budgets against actuals in a structured way (40% review at key milestones); 23% actively monitor and update throughout; of firms assigning matter budgets, 99% report some increase in billing realisation", measures: "Shares of BigHand survey respondents (800+ legal-finance professionals); the 99% counts any increase in realisation among firms that assign budgets, not an amount, and is not specific to AI", provenance: vendor-published, source_ref: BIGHAND-LF-2026}
  prerequisites:
    - "Enriched historical matter data for benchmarks [AYORA-LTH-2026]"
    - "Clear owners for acting on alerts"
  risks_and_guardrails:
    - "Vendor-described only; no named customer or accuracy data"
    - "The budget-realisation figure is not specific to AI [BIGHAND-LF-2026]"
  human_checkpoints:
    - "The matter team acts on alerts and agrees re-scoping with the client"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: AYORA-LTH-2026, title: "Ayora by BigHand (vendor profile; undated, read 2026-10-19)", publisher: Legaltech Hub, type: vendor, url: "https://www.legaltechnologyhub.com/vendors/ayora-by-bighand/", date: "2026-10", access: full, locator: "Feature list"}
    - {ref: NARRATIVE-ILTA-2026, title: "Narrative (ILTA Startup 2026 profile; undated, read 2026-10-19)", publisher: ILTA, type: vendor, url: "https://www.iltanet.org/resources/publications/pulse/startup26/narrative", date: "2026-10", access: full, locator: "Paragraph 5"}
    - {ref: BIGHAND-LF-2026, title: "AI is changing legal delivery, but 63% of firms default to standard rates or past matter pricing, BigHand research finds", publisher: Legal Futures (BigHand research), type: survey, url: "https://www.legalfutures.co.uk/associate-news/ai-is-changing-legal-delivery-but-63-of-firms-default-to-standard-rates-or-past-matter-pricing-bighand-research-finds", date: "2026-09-17", access: full, locator: "'Budgeting is widespread, but active management remains limited'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms. Overlaps delivery-management; kept here because budget setting and re-scoping close the pricing loop. Narrative also claims firms write off close to 18% of billed work, a vendor figure with no stated source (not used). Merged from discourse-10."

- id: professional-services-scoping-pricing-09
  title: Matter-level evidence of AI use and savings to answer clients' pricing questions
  archetype: professional-services
  module: scoping-pricing
  function: finance-accounting
  work_types: [data-reporting, client-interaction]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: "Clients ask how AI generates savings on their matters. At Legalweek 2026 firm panellists said they were still gathering the data and described return measurement as anecdotal. Time is reconstructed from memory, and AI work is hard to capture."
  solution: "Laurel and Legora announced on 2026-10-13 that each task a lawyer completes in Legora becomes a draft time entry on the right client and matter for the lawyer to review; a second phase will develop, with customers, measures of how Legora is used and the value AI-powered work brings. GSK's chief of staff (in-house) said GSK wants to partner with outside firms on use cases and on measuring savings. TRI's 2026 survey recommends moving from hours-saved measures to value measures such as turnaround, risk identification, consistency and client satisfaction."
  outcomes:
    - {lever: cost, description: "In-house counsel seeing no savings yet from outside counsel's generative AI use", figure: "nearly 60%", measures: "Share of about 650 in-house counsel and legal-operations respondents (fielded 18 June to 18 July 2025) reporting no noticeable savings; survey co-published by ACC (a professional body) and Everlaw (a vendor), as reported by Bloomberg Law", provenance: vendor-published, source_ref: BLOOMBERGLAW-ACC-2025}
    - {lever: quality, description: "Law firms with a GenAI strategy and their likelihood of achieving ROI", figure: "22% of firms; 3.9 times more likely to achieve ROI", measures: "As stated by a Thomson Reuters speaker at Legalweek 2026; basis not given", provenance: vendor-published, source_ref: TRI-LEGALWEEK-2026}
  prerequisites:
    - "Time and matter data in systems that can tag AI-assisted work [LEGORA-LAUREL-2026]"
    - "Agreement with the client on which value measures matter and how they are calculated [TRI-STANDOUT-2026]"
  risks_and_guardrails:
    - "The second phase is announced, not delivered, and applies only to firms using both platforms [LEGORA-LAUREL-2026]"
    - "Time entries must still reflect time actually spent [CALBAR-GENAI-2026, p. 8]"
    - "Some clients issue guidelines that they will not pay for certain services if AI performs them (DLA Piper panellist) [TRI-LEGALWEEK-2026]"
  human_checkpoints:
    - "The lawyer reviews each draft time entry before it is recorded [LEGORA-LAUREL-2026]"
  role_evolution: "Greenberg Traurig's Chief Pricing and Innovation Officer and DLA Piper's head of AI innovation spoke for their firms on client AI value at Legalweek 2026 [TRI-LEGALWEEK-2026]."
  evidence_grade: C
  sources:
    - {ref: LEGORA-LAUREL-2026, title: "Legora and Laurel partner to capture the time lawyers spend in Legora as they work", publisher: Legora, type: vendor, url: "https://legora.com/newsroom/legora-and-laurel-partner-to-capture-the-time-lawyers-spend-in-legora-as-they-work", date: "2026-10-13", access: full, locator: "Paragraphs 2-5 (phase descriptions)"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Sections 'Proving AI's path to saving clients money' and 'The contradictions in the room'"}
    - {ref: BLOOMBERGLAW-ACC-2025, title: "AI Does Little to Reduce Law Firm Billable Hours, Survey Shows (ACC-Everlaw survey)", publisher: Bloomberg Law, type: press, url: "https://news.bgov.com/business-and-practice/ai-does-little-to-reduce-law-firm-billable-hours-survey-shows", date: "2025-10-14", access: full, locator: "Opening paragraphs"}
    - {ref: TRI-STANDOUT-2026, title: "Turning law firm AI strategies into practice: Findings from the 2026 Stand-out Lawyers Survey", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/turning-law-firm-ai-strategies-into-practice", date: "2026-08-06", access: full, locator: "Recommendations, 'Moving to more value-based measurement'"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms; client view from in-house (GSK; ACC-Everlaw respondents). Pattern other: AI work captured as draft records plus value measures, not a full monitor-act loop. Graded C: a vendor announcement and panel remarks. No firm publicly reports a working matter-level AI savings report (practice-15 kept this as an idea). The 22% figure is used differently in TR-FOP-2026, so treat it with care. Time-capture mechanics belong to billing-collections. Merged from discourse-09, governance-10 and practice-15 (idea)."

- id: professional-services-scoping-pricing-10
  title: Partners lead the AI-value conversation with clients, including how gains are shared, before conceding on fees
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [client-interaction, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Few partners discuss AI with clients: more than one-third of stand-out lawyers in TRI's survey talked about it with under 20% of their clients. TRI research cited in a 2026 article says two-thirds of general counsel do not know how their outside firms approach AI. Clients who are not told the value default to treating AI as a cost-cutter."
  solution: "TRI recommends partners lead with what changed for the client (faster, clearer, safer, more predictable), agree with the client how AI will be used, and then discuss pricing, rather than opening with discounts. A TRI article sets out five questions firms and legal departments must answer together (value and pricing, including which side absorbs the productivity dividend; where work lives; trust and transparency; talent pipeline; ecosystem standards) and suggests putting one on the agenda of the next client meeting. DLA Piper's AI innovation head advised firms to lead the conversation before the client sets the terms."
  outcomes:
    - {lever: growth, description: "Partner AI conversations with clients", figure: "about one-third of embedded AI partners have discussed AI with at least 60% of their clients", measures: "Share of embedded AI partners among 2,527 client-nominated stand-out lawyers (65 countries) who said so; TRI also reports more than one-third of stand-out lawyers discussed AI with under 20% of clients", provenance: vendor-published, source_ref: TRI-STANDOUT-2026}
  prerequisites:
    - "Client data, competitive intelligence, approved talking points and guidance on billing implications for partners [TRI-STANDOUT-2026]"
    - "Partners willing to have the conversation: 35% of BigHand respondents name partner discomfort as the most common communication barrier [BIGHAND-LF-2026]"
    - "Matter-level evidence of savings (entry 09)"
  risks_and_guardrails:
    - "Leading with price concessions can train clients to expect discounts [TRI-STANDOUT-2026]"
    - "Firms still gathering data cannot yet answer clients' savings questions, and client postures are inconsistent [TRI-LEGALWEEK-2026]"
  human_checkpoints:
    - "The partner owns the client conversation [TRI-STANDOUT-2026]"
    - "Client general counsel and firm leadership agree any pilot terms"
  role_evolution: "TRI describes partners as the firm's commercial transmission mechanism for billing and staffing strategy [TRI-STANDOUT-2026]."
  evidence_grade: C
  sources:
    - {ref: TRI-STANDOUT-2026, title: "Turning law firm AI strategies into practice: Findings from the 2026 Stand-out Lawyers Survey", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/turning-law-firm-ai-strategies-into-practice", date: "2026-08-06", access: full, locator: "'How to talk to clients about AI'; methodology"}
    - {ref: TRI-INTERDEP-2026, title: "Interdependent by design: The AI conversation law firms and legal departments need to be having now", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/needed-ai-conversation", date: "2026-06-11", access: full, locator: "'Addressing 5 critical questions together'; communication-gap paragraph"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "'The contradictions in the room'"}
    - {ref: BIGHAND-LF-2026, title: "AI is changing legal delivery, but 63% of firms default to standard rates or past matter pricing, BigHand research finds", publisher: Legal Futures (BigHand research), type: survey, url: "https://www.legalfutures.co.uk/associate-news/ai-is-changing-legal-delivery-but-63-of-firms-default-to-standard-rates-or-past-matter-pricing-bighand-research-finds", date: "2026-09-17", access: full, locator: "Paragraph 3"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms and their in-house clients. Graded C: survey data from a vendor-affiliated institute; the co-design and value-sharing step is an idea, with no published firm-client agreement found. Overlaps client-development, which owns the conversation playbook. Merged from governance-16 and discourse-16 (idea)."

- id: professional-services-scoping-pricing-11
  title: Clients write AI-savings terms into outside-counsel guidelines and press suppliers to cut fees (in-house and corporate buyers)
  archetype: professional-services
  module: scoping-pricing
  function: procurement-supply-chain
  work_types: [client-interaction, data-reporting]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "In-house teams cannot see what AI savings they get, and firms cannot show them. Nearly 60% of surveyed in-house counsel saw no noticeable savings yet. A general counsel told a conference of 500+ in-house lawyers that firm AI use brings them no change and probably higher bills next year. In accounting, a mid-tier partner said a prospective client told them their junior hours were too high, they were not using AI enough, and they needed to cut junior hours and overall fees."
  solution: "In-house teams ask firms what AI they use and how it saves money on specific matters, ask for AI line items on invoices, and, per a Gartner analyst quoted by Bloomberg Law, add outside-counsel-guideline provisions asking that lower-risk tasks be done with AI and the time saved be reflected in billed hours. Some state they will not pay for certain AI-performed work. In one reported case KPMG pressed its own auditor, Grant Thornton, to cut its fee, arguing that AI should make the audit more efficient (it also cited a simple tax position); trade coverage of an FT report says the fee fell from about $416,000 to about $357,000."
  outcomes:
    - {lever: cost, description: "In-house view of savings from outside counsel's generative AI use", figure: "59% no savings yet; 61% plan to push for change in delivery and pricing; 64% expect to rely less on outside counsel", measures: "Shares of 657 in-house legal professionals in 30 countries (ACC-Everlaw release); Bloomberg Law reports the 64% as expecting to bring more work in-house", provenance: vendor-published, source_ref: ACCEVERLAW-2025}
    - {lever: cost, description: "Reported reduction in KPMG's audit fee from its auditor", figure: "14% (about $416,000 in 2024 to about $357,000 in 2025)", measures: "Reported change in the fee KPMG paid Grant Thornton for audit services, per trade coverage of an FT report; neither firm's own statement was read", provenance: independent, source_ref: YAHOO-KPMG-2026}
  prerequisites:
    - "Matter-level cost and AI-use data on the firm side (entry 09)"
    - "Legal-operations infrastructure and governance on the client side; general counsel describe tool proliferation without governance [TRI-STANDOUT-2026]"
  risks_and_guardrails:
    - "Client directives conflict: some demand AI savings, others require permission before any AI use or ask for warranties that models are unbiased [TRI-LEGALWEEK-2026]; a lawyer must follow client guidelines that restrict AI [CALBAR-GENAI-2026]"
    - "A client that refuses to pay paralegal time because it assumes AI replaces it can push work up to costlier timekeepers (a 2024 roundtable account) [TRI-LEADFOLLOW-2025]"
    - "Clients do not want to pay for junior-completed tasks and are bringing near-final work in-house [TRI-LAWYERDEV-2026]"
    - "Commentators say the KPMG precedent hands KPMG's own audit clients the same argument [YAHOO-KPMG-2026; ONLYCFO-KPMG-2026]; Yahoo Finance names KPMG's international division, while OnlyCFO says only 'KPMG'"
  human_checkpoints:
    - "Client general counsel or legal operations agree the guideline provisions"
    - "The billing partner reviews AI-related line items; fees are negotiated between buyer and supplier"
  role_evolution: "ACC's outgoing CEO said clients, not firms, will most likely drive the next shift in legal pricing [BLOOMBERGLAW-ACC-2025]."
  evidence_grade: B
  sources:
    - {ref: ACCEVERLAW-2025, title: "GenAI Strategic Value for Corporate Law Departments Survey (press release)", publisher: ACC and Everlaw, type: survey, url: "https://www.everlaw.com.au/press/release/acc-report-2025", date: "2025-10-14", access: full, locator: "Release body"}
    - {ref: BLOOMBERGLAW-ACC-2025, title: "AI Does Little to Reduce Law Firm Billable Hours, Survey Shows (ACC-Everlaw survey)", publisher: Bloomberg Law, type: press, url: "https://news.bgov.com/business-and-practice/ai-does-little-to-reduce-law-firm-billable-hours-survey-shows", date: "2025-10-14", access: full, locator: "Paragraphs quoting Gartner's Weston Wicks and ACC's Veta Richardson"}
    - {ref: AL-CLIENT-2026, title: "'We Get Nothing' From Law Firm AI Use, Says Client", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/02/12/we-get-nothing-from-law-firm-ai-use-client/", date: "2026-02-12", access: full, locator: "Opening paragraphs"}
    - {ref: ICAEW-EXPECT-2026, title: "Are businesses expecting too much of AI?", publisher: ICAEW, type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/feb-2026/are-businesses-expecting-too-much-of-ai", date: "2026-02-03", access: full, locator: "Paragraphs quoting an anonymous mid-tier partner"}
    - {ref: YAHOO-KPMG-2026, title: "Big Four accounting firm's bold demand is a warning about AI adoption", publisher: Yahoo Finance, type: press, url: "https://finance.yahoo.com/news/big-four-accounting-firms-bold-015348056.html", date: "2026-02-10", access: full, locator: "Paragraphs 1-4"}
    - {ref: ONLYCFO-KPMG-2026, title: "AI is Coming for Audit Fees: KPMG Just Proved It", publisher: OnlyCFO (newsletter), type: community, url: "https://www.onlycfo.io/p/ai-is-coming-for-audit-fees-kpmg", date: "2026-02-13", access: full, locator: "Paragraphs 1-4"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "'Proving AI's path to saving clients money'; 'The contradictions in the room'"}
