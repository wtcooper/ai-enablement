- id: professional-services-scoping-pricing-12
  title: Public-sector buyers recover consulting fees after AI errors and ask suppliers to declare planned AI use in quotes
  archetype: professional-services
  module: scoping-pricing
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: "A government-commissioned consulting report contained apparent AI-generated errors, including a fabricated quotation from a federal court judgment and references to nonexistent research papers. Government buyers cannot see whether a consultant's fee reflects AI use or whether AI-generated work is reliable."
  solution: "Deloitte reviewed the 237-page report; a revised version discloses use of a generative AI system, and the Australian department said Deloitte agreed to repay the final instalment under its contract. Australia's Public Service AI plan (unveiled 12 Nov 2025) says suppliers on whole-of-government management advisory and people panels will have to advise planned AI use when responding to requests for quotes, and new model clauses will state that consultants remain fully responsible for services regardless of generative AI use."
  outcomes:
    - {lever: risk, description: "Contract value and recourse", figure: "AUD 440,000 contract; final instalment repaid (amount to be made public)", measures: "Contract amount paid by the Australian government for the report; the department said Deloitte agreed to repay the final instalment", provenance: independent, source_ref: CTV-DELOITTE-2025}
  prerequisites:
    - "A contract with staged payments so a final instalment can be withheld or repaid [CTV-DELOITTE-2025]"
    - "A supplier process to state planned AI use in each quote response [CANBERRATIMES-APSAI-2025]"
  risks_and_guardrails:
    - "A senator called for a full refund of the AUD 440,000 [CTV-DELOITTE-2025]"
    - "In Canada, Newfoundland and Labrador's premier demanded accountability and a review of AI use by consultants was reported as ongoing [BNN-DELOITTE-2025]"
    - "Optional AI clauses already exist in the Digital Transformation Agency's ClauseBank and state that a provider's use of AI is approved by the buyer [CANBERRATIMES-APSAI-2025]"
  human_checkpoints:
    - "Deloitte reviewed the report and confirmed some footnotes and references were incorrect [CTV-DELOITTE-2025]"
  role_evolution: "Not described in the sources."
  evidence_grade: B
  sources:
    - {ref: CTV-DELOITTE-2025, title: "Deloitte to partially refund Australian government for report with apparent AI-generated errors (Associated Press)", publisher: CTV News, type: press, url: "https://www.ctvnews.ca/business/article/deloitte-to-partially-refund-australian-government-for-report-with-apparent-ai-generated-errors/", date: "2025-10-07", access: full, locator: "Body paragraphs on refund, disclosure and the senator"}
    - {ref: BNN-DELOITTE-2025, title: "Feds defend $1.1-million Deloitte contract for AI advice after firm admitted mistakes (Canadian Press)", publisher: BNN Bloomberg, type: press, url: "https://www.bnnbloomberg.ca/business/company-news/2025/12/18/feds-defend-11-million-deloitte-contract-for-ai-advice-after-firm-admitted-mistakes/", date: "2025-12-18", access: full, locator: "Paragraphs on Newfoundland and Labrador"}
    - {ref: CANBERRATIMES-APSAI-2025, title: "New AI plan for the APS sets out expectations for contractors", publisher: The Canberra Times, type: press, url: "https://www.canberratimes.com.au/story/9110516/new-ai-plan-for-the-aps-sets-out-expectations-for-contractors/", date: "2025-11-13", access: full, locator: "Paragraphs on whole-of-government panels, RFQ responses and ClauseBank"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: consulting (Big Four) selling to government buyers. Grade B rests on the named Deloitte refund; the APS declaration requirement is an announced policy (governance-13 graded it an idea, D) with implementation not confirmed. The AI system named in the revised report was Azure OpenAI. Quality-review owns the error analysis; this entry records how payment terms and disclosure let buyers recover. Merged from governance-12 and governance-13."

- id: professional-services-scoping-pricing-13
  title: Staff and partner performance metrics moved off billed hours so that pricing away from hours can work
  archetype: professional-services
  module: scoping-pricing
  function: people-hr
  work_types: [data-reporting, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: "When staff are paid and promoted on billed hours, AI efficiency is not rewarded and value pricing meets internal resistance. ILTACON 2025 coverage says law-firm recruiting and compensation hinge largely on utilisation (the share of available hours billed), which is why firms stay with hourly billing."
  solution: "Wipfli is introducing non-traditional metrics such as client satisfaction and cycle time as pricing and technology change. A compensation-data founder argues value pricing allows bonuses on revenue generated instead of hours. Resultsense reports PwC senior-staff bonuses will track revenue and margin per professional rather than hours billed (secondary report). A GGI commentary says compensation, origination credit and write-off policy must change if non-hourly pricing is to work."
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "No figure; Wipfli's statement of what it is introducing", provenance: self-reported, source_ref: BLOOMBERGTAX-PRICING-2026}
  prerequisites:
    - "A pricing model that does not depend on hours billed [BLOOMBERGTAX-PRICING-2026]"
    - "Cycle-time and client-satisfaction data per engagement [BLOOMBERGTAX-PRICING-2026]"
  risks_and_guardrails:
    - "Without new metrics, staff are told to embrace technology but judged on the same measures as a decade ago (Wipfli executive) [BLOOMBERGTAX-PRICING-2026]"
    - "Thomson Reuters' 2026 survey says performance frameworks and billing models signal what an organisation values; mismatches with the stated AI strategy undermine it [TR-FOP-2026]"
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: "A Big 4 compensation-data founder said people 'light up' at the prospect of firms with alternative pricing because efficiency is not rewarded under hourly billing [BLOOMBERGTAX-PRICING-2026]."
  evidence_grade: B
  sources:
    - {ref: BLOOMBERGTAX-PRICING-2026, title: "AI Efficiency Gains Push Accounting Firms to Reimagine Pricing (Nicola Trentmann)", publisher: Bloomberg Tax, type: press, url: "https://news.bloombergtax.com/financial-accounting/ai-efficiency-gains-push-accounting-firms-to-reimagine-pricing", date: "2026-03-05", access: full, locator: "Section 'Employee Incentives'"}
    - {ref: RESULTSENSE-PWC-2026, title: "PwC Warns Partners: Adopt AI or Face Exit", publisher: Resultsense, type: press, url: "https://www.resultsense.com/news/2026-03-19-pwc-ai-overhaul-partners-resist-technology/", date: "2026-03-19", access: full, locator: "Section 'From Hours to Outcomes'"}
    - {ref: MONDAQ-GGI-2026, title: "Still Selling Judgment: How Law Firms And Accounting Firms Must Prepare For AI-driven Pricing Change", publisher: GGI Global Alliance via Mondaq, type: press, url: "https://www.mondaq.com/unitedstates/management/1814268/still-selling-judgment-how-law-firms-and-accounting-firms-must-prepare-for-ai-driven-pricing-change", date: "2026-07-09", access: full, locator: "Paragraphs 4-9"}
    - {ref: TRI-ILTACON-2025, title: "ILTACON 2025: Pricing the future - AI's impact on the billable hour", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2025-billable-hour", date: "2025-09-02", access: full, locator: "'Will GenAI kill the billable hour in five years?'"}
    - {ref: TR-FOP-2026, title: "Future of Professionals Report 2026", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026-09", access: full, locator: "Closing recommendation on measuring behaviour change"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: accounting firms (Wipfli; PwC) with a law-firm panel view (ILTACON). Pattern other: an incentive-design change that enables pricing change; no agent. Named firm, statement of intent, no results. Detail on development routes to talent-learning. Merged from governance-07 with discourse role notes."

- id: professional-services-scoping-pricing-14
  title: "Idea: choose the fee structure from how observable outcomes and delivery costs are, and design baselines and attribution before any outcome fee"
  archetype: professional-services
  module: scoping-pricing
  function: strategy-planning
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: personal-assistant
  maturity: emerging
  problem: "Pricing models are chosen by convention. Internal AI makes hours a poor proxy for effort, but outcomes may still be hard to verify, and outcome data is rarely available: 7.3% of resource-management respondents say it is easily accessible and routinely used in staffing."
  solution: "Brynjolfsson and Petropoulos propose asking two questions per engagement: can the client verify results and attribute them to the firm (outcome observability), and can the client see the firm's true delivery cost (input-cost observability)? The answers map onto time-based, project, subscription, outcome or hybrid pricing, with four rules: match contract power to signal quality; let internal-augmentation versus client-embedded AI set the direction of change; invest in measurement before outcome pricing but check whether attribution is the binding constraint; treat hybrid as the equilibrium. At scoping, the team agrees ground-truth metrics, baselines and, where possible, randomised holdouts or controlled rollouts before any fee is tied to outcomes."
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "Theoretical framework; the authors call its fit to observed pricing qualitative plausibility, not confirmatory validation", provenance: independent, source_ref: STANFORD-DEL-2026}
  prerequisites:
    - "Telemetry and agreed ground-truth metrics; third-party verification where outcome fees are used [STANFORD-DEL-2026, Rule 3]"
    - "Outcome data that pricing and resource teams can reach; about 1 in 2 resource-management respondents are unsure their organisation will meaningfully adopt outcome-based pricing [KANTATA-RMI-2026]"
  risks_and_guardrails:
    - "Telemetry reduces measurement noise but not attribution risk; where the firm's contribution is confounded with the client's other initiatives, hybrid contracts are the destination [STANFORD-DEL-2026, Section 5.2 and Introduction]"
    - "Once outcomes are metered and priced, parties may act on the metrics rather than the work [STANFORD-DEL-2026, Section 5.2]"
    - "The authors disclose informal conversations with three Accenture executives and a general gift from Accenture to the lab; they say neither is evidence [STANFORD-DEL-2026, footnote]"
  human_checkpoints:
    - "Not applicable (idea); an executive would locate each engagement on the map and approve the structure"
  role_evolution: "The paper says firms should build hybrid pricing capability as a strategic competence [STANFORD-DEL-2026, Rule 4]. Resource managers expect their role to shift from filling hours to maximising delivery success if outcome pricing grows [KANTATA-RMI-2026]."
  evidence_grade: D
  sources:
    - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives (Brynjolfsson and Petropoulos)", publisher: "Stanford Digital Economy Lab and USC Marshall", type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Abstract; Sections 2, 5.1-5.2 and 7 (Rules 1-4)"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads (Resource Management Institute study commissioned by Kantata)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Paragraphs on outcome data and outcome-based pricing uncertainty"}
    - {ref: FORRESTER-TECHSVCS-2026, title: "The State Of Technology Services, 2026 (abstract page; report paywalled)", publisher: Forrester, type: survey, url: "https://www.forrester.com/report/the-state-of-technology-services-2026/RES192217", date: "2026-02-24", access: full, locator: "Summary: leaders lean into outcome-based pricing"}
    - {ref: SALESFORCE-AGENTFORCE-2026, title: "Salesforce Launches Agentforce Help Agent That Deploys in Minutes and Only Charges for Resolutions", publisher: Salesforce, type: vendor, url: "https://www.salesforce.com/news/press-releases/2026/06/25/agentforce-help-agent-announcement/", date: "2026-06-25", access: full, locator: "Paragraph 'And you only pay when it works'"}
  last_reviewed: "2026-10-19"
  notes: "Labelled idea: a conceptual principal-agent framework with desk-research examples, not a deployment. Firm kind: consulting. Cited pay-per-resolution cases (Salesforce, Palantir) are software vendors, used as comparators. Kantata study is vendor-commissioned (44 organisations). Merged from practice-17, discourse-08, governance-08 and governance-09."

- id: professional-services-scoping-pricing-15
  title: Flat and alternative fees for repeatable legal work, with expected AI savings built into the price
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [expert-judgment, document-production]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: emerging
  problem: "Under hourly billing an AI efficiency gain cuts the firm's own revenue: in a TRI author's arithmetic, a task cut from 1 hour to 0.2 hours removes 80% of that revenue. Clients doubt the hourly bill reflects value, and bar bodies disagree on whether the same flat fee stays reasonable when AI makes the work faster."
  solution: "Firms move predictable, repeatable matters to flat fees or other alternative fee arrangements (AFAs: any fee not based on hours) and build expected AI time savings into the price. Mature versions use phase-based scoping, milestone holdbacks and bonuses, and re-scoping. Pricing teams record why the fee is reasonable (experience, skill with the tool, value of the output) and explain it to the client. Two proposed variants: a general counsel's idea of a baseline price from a shared dataset of past matters, with time tracked only to trigger review at an illustrative 25% variance; and a managing director's idea of returning to a single 'services rendered' line item."
  outcomes:
    - {lever: growth, description: "How firms are pricing AI efficiencies", figure: "30% keep existing pricing and take the profit; 30% still evaluating; 25% offer discounts when clients permit AI use; 49% saw increased client demand for AFAs", measures: "Shares of BigHand survey respondents (800+ senior legal-finance professionals, UK and North America)", provenance: vendor-published, source_ref: BIGHAND-LF-2026}
    - {lever: growth, description: "UK firms expecting more fixed-fee billing", figure: "54%", measures: "Share of UK law firms expecting fixed-fee billing to increase over the next 12 months, from Clio UK Legal Trends 2025-26 as cited by CMS (Clio report not opened)", provenance: vendor-published, source_ref: CMS-TRENDS-2026}
  prerequisites:
    - "Clear scoping, historical benchmarks and willingness to share risk [LEGALIO-AFA-2025]"
    - "Partners trained in scoping and project management, and compensation not based mainly on utilisation [TRI-ILTACON-2025]"
    - "Client consent to the billing structure [NCBAR-FEO1-2024] and an explanation of the fee basis [VSB-LEO1901-2025]"
  risks_and_guardrails:
    - "California says flat fees may build AI time savings into rates, and fee agreements should say how far AI factors into rates [CALBAR-GENAI-2026, p. 8]"
    - "ABA Formal Opinion 512 says it may be unreasonable to charge the same flat fee when AI makes the work much faster [ABA-OP512-2024, Part II.F]; a TRI commentator argues this invites buyers' remorse [TRI-ABA512-2025]"
    - "Virginia LEO 1901 (approved 24 Nov 2025) says Rule 1.5 does not equate reduced time with proportionally reduced fees, and says contrary views from other jurisdictions fail to appreciate the value of advancing technology [VSB-LEO1901-2025]"
    - "Panellists disagreed whether a $100,000 AFA for work that would have cost $80,000 hourly leaves the client unhappy or satisfied; the billable hour was expected to persist for at least five years [TRI-ILTACON-2025]"
    - "The 25% variance trigger is explicitly an illustration, and the author cites ABA 512 as barring billing for time not spent [BLAW-ROBB-2026]; California guidance says fee agreements should explain how fees are calculated [CALBAR-GENAI-2026]"
  human_checkpoints:
    - "Partner and pricing team set scope, fee and re-scoping triggers"
    - "Client agrees success measures before the engagement"
  role_evolution: "Under AFAs the incentive shifts toward assigning work to the most efficient resource, which can limit junior training unless firms design around it [ILTA-PULSE-2025]."
  evidence_grade: C
  sources:
    - {ref: BIGHAND-LF-2026, title: "AI is changing legal delivery, but 63% of firms default to standard rates or past matter pricing, BigHand research finds", publisher: Legal Futures (BigHand research), type: survey, url: "https://www.legalfutures.co.uk/associate-news/ai-is-changing-legal-delivery-but-63-of-firms-default-to-standard-rates-or-past-matter-pricing-bighand-research-finds", date: "2026-09-17", access: full, locator: "'Key findings', AI pricing paragraph"}
    - {ref: CMS-TRENDS-2026, title: "The Trends Redefining Legal Service Delivery", publisher: CMS (law firm), type: firm, url: "https://cms.law/en/gbr/publication/the-trends-redefining-legal-service-delivery", date: "2026-02-12", access: full, locator: "Paragraph citing Clio UK Legal Trends"}
    - {ref: TRI-AFA-2024, title: "Pricing AI-driven legal services: Alternative fee arrangements are almost inevitable", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/pricing-ai-driven-legal-services-alternative-fee-arrangements", date: "2024-06-03", access: full, locator: "Arithmetic example"}
    - {ref: TRI-ILTACON-2025, title: "ILTACON 2025: Pricing the future - AI's impact on the billable hour", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/iltacon-2025-billable-hour", date: "2025-09-02", access: full, locator: "Sections 'Client value and billing' and 'Will GenAI kill the billable hour in five years?'"}
    - {ref: LEGALIO-AFA-2025, title: "AI Adoption Pushes Law Firms Toward Alternative Fees, But Change Will Be Incremental", publisher: Legal.io, type: press, url: "https://www.legal.io/articles/5771590/AI-Adoption-Pushes-Law-Firms-Toward-Alternative-Fees-But-Change-Will-Be-Incremental", date: "2025-12-23", access: full, locator: "Paragraphs 2-4 and 6"}
    - {ref: ILTA-PULSE-2025, title: "Bill(AI)ble Hour (ILTACON 2025 recap; page undated)", publisher: ILTA, type: professional-body, url: "https://iltanet.org/resources/publications/pulse/iltacon/2025/billaible-hour", date: "2025", access: full, locator: "Paragraphs 2-7 and 9"}
    - {ref: TRI-ABA512-2025, title: "Is ABA Formal Opinion 512 off the mark? And if so, what can law firms and GCs do about it?", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/aba-formal-opinion-512", date: "2025-04-02", access: full, locator: "Sections on hourly fees and fixed-fee reasonableness"}
    - {ref: VSB-LEO1901-2025, title: "Legal Ethics Opinion 1901, Reasonable Fees and the Use of Generative Artificial Intelligence", publisher: Virginia State Bar, type: regulator, url: "https://vsb.org/Site/news/rules-news/20250327-prop-1901-fees-ai.aspx", date: "2025-11-25", access: full, locator: "Adoption notice (approved 24 Nov 2025); linked Court order with the LEO text, Rule 1.5(a) analysis and Summary"}
    - {ref: NCBAR-FEO1-2024, title: "2024 Formal Ethics Opinion 1 (use of artificial intelligence in a law practice)", publisher: North Carolina State Bar, type: professional-body, url: "https://www.ncbar.gov/for-lawyers/ethics/adopted-opinions/2024-formal-ethics-opinion-1/", date: "2024-11-01", access: full, locator: "Opinion #6"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
    - {ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools (read via a copy; ABA site blocked)", publisher: "American Bar Association, Standing Committee on Ethics and Professional Responsibility", type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part II.F (fees), p. 12"}
    - {ref: BLAW-ROBB-2026, title: "The Billable Hour Isn't Dead Yet, But AI Should Reshape Pricing (opinion by a general counsel)", publisher: Bloomberg Law, type: community, url: "https://news.bgov.com/business-and-practice/the-billable-hour-isnt-dead-yet-but-ai-should-reshape-pricing", date: "2026-06-29", access: full, locator: "Sections 'Price our work based on what we both know' and 'Charge me a fixed price'"}
    - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Paragraph beginning 'Meanwhile, Zarwin Baum's Kaplan'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (US, UK); the baseline-price variant is an in-house proposal. No source names a firm that has done this with measured AI effects. Pattern other: a pricing-model change. Podcast show notes routed from firm-finance (Kerbis on subscriptions, Furlong on outcome pricing) were not used as evidence. Accounting and tax variants: entry 16 and tax-research-advisory-25, tax-compliance-individual-business-22. Merged from discourse-04, governance-02 (idea), discourse-15 (idea) and practice-16 (idea)."

- id: professional-services-scoping-pricing-16
  title: Accounting and tax firms pilot value-based, tiered and subscription pricing as AI shortens the hours behind a deliverable
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [expert-judgment, client-interaction]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: piloting
  problem: "AI can halve the time to produce a client report, forcing a choice between keeping the saving as margin or passing it on as a lower price. RSM's example: certain tax advisory reports fall from 20 hours to 10 with generative AI and checking. KPMG's US advisory vice chair said AI investment cannot usually be attributed to individual projects."
  solution: "Bloomberg Tax reports leaders at firms such as KPMG, PwC and RSM are brainstorming ways to charge on value and outcomes. RSM uses multiple pricing models and said it can cut prices in some areas but not others. PwC's US tax leader said early brainstorming may suit time-based pricing and later phases value-based. RKL is piloting a value-based model created by consultancy Fore LLC and has onboarded several dozen clients on it. TRI describes tiered packages (basic, standard, premium) with add-ons billed monthly or quarterly."
  outcomes:
    - {lever: growth, description: "Clients onboarded under RKL's value-based pilot", figure: "several dozen new clients", measures: "Count stated by an RKL tax partner; period and revenue not given", provenance: self-reported, source_ref: BLOOMBERGTAX-PRICING-2026}
    - {lever: capacity, description: "Illustrative time saving", figure: "20 hours to 10 hours", measures: "An RSM partner's example of time to create certain tax advisory reports with generative AI and checking; an illustration, not a study", provenance: self-reported, source_ref: BLOOMBERGTAX-PRICING-2026}
    - {lever: quality, description: "Pricing confidence by billing model (not AI-specific)", figure: "nearly one-third highly confident in subscription-first firms versus under 20% in hourly firms", measures: "Share of tax professionals highly confident their pricing matches value delivered, from TRI's 2025 Tax Firm Pricing Report as summarised by TRI", provenance: vendor-published, source_ref: TRI-ALTPRICING-2025}
  prerequisites:
    - "Advisory services that can be tailored and continued through the year, which an AICPA vice president said suit value-based models [BLOOMBERGTAX-PRICING-2026]"
    - "A productised service catalogue with defined add-ons and a value narrative for clients [TRI-ALTPRICING-2025]"
    - "Performance metrics that do not reward hours alone (entry 13)"
  risks_and_guardrails:
    - "AICPA Code 1.510.001: a member in public practice may not take a contingent fee from an audit, review, certain compilation or prospective-financial-information client, or for preparing an original or amended tax return for any client [AICPA-CODE-2026]. Outcome pricing cannot simply be copied from consulting"
    - "AICPA 1.230.030: other services to an attest client may not influence the attest fee, except that cost savings from experience on other services may be considered [AICPA-CODE-2026]"
    - "Only a small portion of engagements are subscription-based today [TRI-ALTPRICING-2025]"
  human_checkpoints:
    - "The partner prices on the value the client attaches to the work, for example by testing whether a proposed fee is fair for the value created (PwC US tax leader) [BLOOMBERGTAX-PRICING-2026]"
  role_evolution: "Firm leaders say AI frees time for advisory work; AICPA's firm-services lead says client advisory work suits value-based models [BLOOMBERGTAX-PRICING-2026]. GGI commentary says professionals must learn to scope, articulate value and negotiate with confidence [MONDAQ-GGI-2026]."
  evidence_grade: B
  sources:
