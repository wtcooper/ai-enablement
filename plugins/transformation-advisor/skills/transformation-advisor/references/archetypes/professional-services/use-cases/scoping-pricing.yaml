# professional-services / scoping-pricing use cases (synthesised 2026-10-19 from research/runs/wave3)
# Firm kinds are named in each entry's notes. In-house examples are tagged "in-house".

- id: professional-services-scoping-pricing-01
  title: Consultancy agents turn meeting transcripts and requirements into scoping and solution-architecture drafts
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Senior consultants spend hours writing technical plans and chasing spreadsheets instead of solving client problems (Diabsolut's account); scoping documents are built by hand from transcripts and requirements."
  solution: "Per Certinia's customer blog, Spaulding Ridge cut solution-architecture drafting from roughly 80 hours to under 20 with Certinia's Veda agents, and Diabsolut automated 'transcripts, requirements, backlogs, and scoping' with Veda agents in Slack, cutting documentation time by 70%. Certinia's summary says Diabsolut is shifting to fixed-fee, outcomes-based contracts; the body text says time-and-materials contracts did not match client conversations."
  outcomes:
    - {lever: speed, description: "Solution-architecture drafting time at Spaulding Ridge", figure: "roughly 80 hours to under 20", measures: "Hours to draft a solution architecture, per Certinia's customer blog; sample size and method not stated", provenance: vendor-published, source_ref: CERTINIA-CUSTOMERS-2026}
    - {lever: speed, description: "Documentation time at Diabsolut", figure: "70% cut", measures: "Reduction in documentation time after deploying Veda agents, per Certinia's customer blog; baseline and method not stated", provenance: vendor-published, source_ref: CERTINIA-CUSTOMERS-2026}
  prerequisites:
    - "Meeting transcripts and requirements captured where the agents can read them (Diabsolut used Slack with its PSA)"
    - "A baseline of documentation and admin time before deployment (Certinia's own advice) [CERTINIA-CUSTOMERS-2026]"
  risks_and_guardrails:
    - "The figures measure documentation and solution-architecture drafting, which sit next to estimating; they do not measure estimate accuracy or win rate [CERTINIA-CUSTOMERS-2026]"
  human_checkpoints:
    - "Review steps are not described in the source; Diabsolut says its architects now focus on outcomes rather than paperwork [CERTINIA-CUSTOMERS-2026]"
  role_evolution: "Diabsolut's architecture director says automation freed its 'outcomes architects' to focus on outcomes, not paperwork [CERTINIA-CUSTOMERS-2026]."
  evidence_grade: B
  sources:
    - {ref: CERTINIA-CUSTOMERS-2026, title: "Certinia Customers Are Proving Veda AI Agents Deliver Real Results (blog; no byline date; sitemap lastmod 2026-09-09; refers to Dreamforce 14-17 Sep 2026 as upcoming)", publisher: Certinia, type: vendor, url: "https://certinia.com/blog/certinia-customers-are-proving-veda-ai-agents-deliver-real-results/", date: "2026-09", access: full, locator: "Diabsolut section (paragraphs 2-3); Spaulding Ridge bullet; summary bullets"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: consulting and technology-implementation firms that are Certinia customers. Grade capped at B: vendor-published figures for a process next to scoping. A search summary attributed the 80-to-20-hour result to a different tool; Certinia's own blog attributes it to its agents, so attribution is unresolved. Merged from practice-13."

- id: professional-services-scoping-pricing-02
  title: PSA agents build engagement estimates from the actuals of prior engagements (vendor-described)
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [data-reporting, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Estimates for project-based services are built from templates or 'gut instinct', which Certinia says misses cost and risk exposure."
  solution: "Certinia's Veda agents run inside its Salesforce-native PSA (professional services automation software, the system that holds deals, projects, staffing and billing). The Estimate Creation Agent builds complex estimates and manages creation workflows; the Estimation Agent tracks estimates with tied expenses and risks. The page says estimates and pricing are grounded in the actuals of prior engagements rather than templates or gut instinct. Veda was launched on 2026-04-15."
  outcomes:
    - {lever: speed, description: "Vendor headline for time to create a proposal or SOW; not specific to the estimating agents", figure: "8 hours to 1 hour", measures: "Time to create a proposal or SOW as labelled on Certinia's page; customer, sample and baseline not stated", provenance: vendor-published, source_ref: CERTINIA-VEDA-2026}
  prerequisites:
    - "Prior engagement actuals (sales, delivery and cost) held in the same PSA [CERTINIA-VEDA-2026]"
    - "Usable data: 47% of resource-management respondents cite poor or fragmented data as a barrier to AI in their work [KANTATA-RMI-2026]"
  risks_and_guardrails:
    - "No accuracy, override or estimate-versus-actual data has been published for these agents"
    - "Fixed-price risk sits with the firm if an estimate is wrong; the vendor page describes no review controls [CERTINIA-VEDA-2026]"
    - "Certinia advises customers to baseline documentation and admin time before deploying agents [CERTINIA-CUSTOMERS-2026]"
  human_checkpoints:
    - "Not described on the vendor page"
  role_evolution: "The vendor positions experts as spending time on judgment calls rather than paperwork [CERTINIA-VEDA-2026]; no firm has described a role change."
  evidence_grade: C
  sources:
    - {ref: CERTINIA-VEDA-2026, title: "Veda AI: agentic intelligence for professional services (solutions page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10", access: full, locator: "Agent catalogue (Estimate Creation Agent, Estimation Agent); 'More gains across the lifecycle' panel"}
    - {ref: CPAPA-CERTINIA-2026, title: "Certinia Unveils Veda, an AI Operations Engine for Professional Services", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/04/15/certinia-unveils-veda-an-ai-operations-engine-for-professional-services/181702/", date: "2026-04-15", access: full, locator: "Launch article quote on estimation and resourcing"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services (Resource Management Institute study commissioned by Kantata)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Barrier percentages"}
    - {ref: CERTINIA-CUSTOMERS-2026, title: "Certinia Customers Are Proving Veda AI Agents Deliver Real Results", publisher: Certinia, type: vendor, url: "https://certinia.com/blog/certinia-customers-are-proving-veda-ai-agents-deliver-real-results/", date: "2026-09", access: full, locator: "Advice on baselining before deployment"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: project-based services firms using a PSA (consulting, IT services). No named customer for the estimating agents. The 11-23% margin and about 50% admin figures on Certinia's page are unattributed and not used. Merged from practice-11, discourse-02 (estimate part) and governance-18 (estimate part); the SOW part is entry 05."

- id: professional-services-scoping-pricing-03
  title: Fee proposals and matter budgets built from the firm's own comparable past matters and billing history
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [data-reporting, document-production]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Fee proposals are priced by habit, and firms struggle to answer clients who ask how AI will change the estimate. In BigHand's survey of 800+ legal-finance professionals, 35% say lawyers default to standard hourly rates and 28% copy a past matter's price without adjusting it."
  solution: "Vendors describe pricing tools that find comparable past matters in the firm's matter, time and financial records, adjust for staffing, scope and fee assumptions, and let the pricing team test scenarios before a proposal goes out (Ayora, now part of BigHand; Narrative). One of them says it also factors in how AI tooling changes the cost of the work. August's Genius Mode calculates flat fees from uploaded invoices and prior bills and builds a client presentation (vendor demo). Pricing job postings ask pricing staff to use AI and analytics to forecast matter profitability (McDermott Will & Schulte), to evaluate AI-driven tools for predictive pricing and cost estimation (Husch Blackwell), and for experience with AI tools (Pillsbury). An ABA Law Practice article describes fee scenarios from comparable-matter data in RFP responses without naming firms."
  outcomes:
    - {lever: quality, description: "Baseline the tools address: how lawyers price matters today", figure: "35% default to standard hourly rates; 28% copy a past matter's pricing unchanged; 1% use templates in a pricing tool", measures: "Share of BigHand survey respondents (800+ senior legal-finance professionals, UK and North America) reporting what lawyers most commonly do when pricing a matter", provenance: vendor-published, source_ref: BIGHAND-LF-2026}
    - {lever: growth, description: "Vendor claim for firms using its product", figure: "realisation up 2-4%; about 10% more new work won", measures: "Narrative's statement about firms using Narrative; baseline, sample, customers and period not stated", provenance: vendor-published, source_ref: NARRATIVE-ILTA-2026}
  prerequisites:
    - "Clean matter, time and financial history; Ayora describes enriching and classifying time-entry narratives and matter coding first [AYORA-LTH-2026]"
    - "Pricing and billing systems the tools can read; the postings name Elite 3E, Iridium, Aderant and Clocktimizer [HUSCH-JOB-2026; PILLSBURY-JOB-2026]"
    - "A pricing function that owns the tool and reviews outputs"
  risks_and_guardrails:
    - "Carrying forward old staffing or pricing assumptions can give the wrong result if AI changes delivery (a practitioner quoted in BIGHAND-LF-2026)"
    - "Time-entry narratives contain client information; Ayora says it anonymises them with a self-hosted small model before any third-party model sees them and does not train third-party models on customer data [AYORA-LTH-2026]"
    - "Firms report less real-time pricing capability than in 2025 in every scenario measured (for example 30% to 17% under competitive pressure); BigHand's president says pricing expertise does not always reach the lawyer when a price is set [BIGHAND-LF-2026]"
  human_checkpoints:
    - "The pricing team tests scenarios before a proposal is shared with the client [AYORA-LTH-2026]"
    - "Pricing managers advise partners on pricing strategy and structure; partners own the client conversation [MCDERMOTT-JOB-2026]"
    - "A lawyer drafts the client-facing email from the generated insights (August's demo) [ARTLAW-AUGUST-2026]"
  role_evolution: "Pricing roles combine modelling with AI-tool use and advice to partners; Husch Blackwell's posting also asks the analyst to train attorneys on pricing technology [HUSCH-JOB-2026]. A November 2024 TRI article on pricing legal-technology offerings describes pricing professionals moving toward a more commercial, client-facing role, with some firms hiring extra pricing staff to focus on that work [TRI-PRICINGPROS-2024]."
  evidence_grade: C
  sources:
    - {ref: AYORA-LTH-2026, title: "Ayora by BigHand (vendor profile; undated, read 2026-10-19)", publisher: Legaltech Hub, type: vendor, url: "https://www.legaltechnologyhub.com/vendors/ayora-by-bighand/", date: "2026-10", access: full, locator: "Product description; acquisition note (4 Aug 2026)"}
    - {ref: NARRATIVE-ILTA-2026, title: "Narrative (ILTA Startup 2026 profile; undated, read 2026-10-19)", publisher: ILTA, type: vendor, url: "https://www.iltanet.org/resources/publications/pulse/startup26/narrative", date: "2026-10", access: full, locator: "Paragraphs 2, 4 and 6"}
    - {ref: BIGHAND-LF-2026, title: "AI is changing legal delivery, but 63% of firms default to standard rates or past matter pricing, BigHand research finds", publisher: Legal Futures (BigHand research), type: survey, url: "https://www.legalfutures.co.uk/associate-news/ai-is-changing-legal-delivery-but-63-of-firms-default-to-standard-rates-or-past-matter-pricing-bighand-research-finds", date: "2026-09-17", access: full, locator: "Paragraphs 2-3 and 'Key findings'"}
    - {ref: ARTLAW-AUGUST-2026, title: "Product Walk Through: August - Genius Mode (vendor-supplied demo)", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/04/15/product-walk-through-august-genius-mode/", date: "2026-04-15", access: full, locator: "Article body (August explanation)"}
    - {ref: MCDERMOTT-JOB-2026, title: "Pricing Manager (job posting; posting date not shown, read 2026-10-19)", publisher: McDermott Will & Schulte via Built In NYC, type: job-posting, url: "https://www.builtinnyc.com/job/pricing-manager/10074034", date: "2026-10", access: full, locator: "Responsibilities list"}
    - {ref: HUSCH-JOB-2026, title: "Senior Pricing Analyst (job posting; posting date not shown, read 2026-10-19)", publisher: Husch Blackwell via Built In Austin, type: job-posting, url: "https://www.builtinaustin.com/job/senior-pricing-analyst/9648474", date: "2026-10", access: full, locator: "Essential job functions: AI-related bullets"}
    - {ref: PILLSBURY-JOB-2026, title: "Pricing Analyst, Nashville (job posting; posting date not shown, read 2026-10-19)", publisher: Pillsbury Winthrop Shaw Pittman via Talentify, type: job-posting, url: "https://www.talentify.io/pricing-analyst-nashville-us-pillsbury-winthrop-shaw-pittman", date: "2026-10", access: full, locator: "Summary; required knowledge and experience"}
    - {ref: TRI-PRICINGPROS-2024, title: "Pricing legal technology and the impact on the role of the pricing professional", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/legal-technology-pricing-professionals-changing-roles", date: "2024-11-19", access: full, locator: "Sections 'Changing roles' and 'Changing skills'"}
    - {ref: ABA-LPMRFP-2026, title: "How AI Is Changing the Process of Law Firm Request for Proposals (RFP)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/july-august-2026/how-ai-is-changing-the-law-firm-request-for-proposals", date: "2026-07", access: full, locator: "Pricing and staffing analysis; real-world scenarios"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firms (US and UK). No named customer for Ayora or Narrative; August's named customer (Hughes Hubbard & Reed) is quoted on firmwide deployment, not this feature. Job postings show expectations, not tools in use. BigHand sells matter-pricing software, so its survey is vendor-published. Merged from discourse-01, practice-03, practice-04 and the pursuit-proposals idea on fee scenarios routed here."

- id: professional-services-scoping-pricing-04
  title: Fixed-fee quotes benchmarked against anonymised market ranges before pricing a matter (law firm and in-house buyers)
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [data-reporting, expert-judgment]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Goodwin's Managing Director, Client Value says clients push for efficiency and predictability, and the firm wants to answer pricing and budgeting requests faster. Legal departments compare outside-counsel fee proposals by hand."
  solution: "Goodwin announced a global rollout of PERSUIT's Fixed-Fee Price Benchmarking. The release calls it AI-powered and built on anonymised, aggregated data from historical proposals and matters, subject to minimum data thresholds; it returns a range of typical fixed fees for comparable scopes. The vendor says it does not set or recommend prices. On the buyer side, PERSUIT's directory profile lists matter scoping, alternative fee structuring, rate benchmarking and a generative AI proposal-analysis tool for legal departments comparing law-firm submissions (in-house)."
  outcomes:
    - {lever: speed, description: "Goodwin says it can respond to pricing and budgeting requests more quickly and show fees are market-tested; no measurement published", figure: "none published", measures: "Qualitative statement by Goodwin's Managing Director, Client Value", provenance: self-reported, source_ref: GOODWIN-PERSUIT-2025}
  prerequisites:
    - "Enough historical proposal and matter data in the vendor dataset to clear its minimum thresholds for the scope [GOODWIN-PERSUIT-2025]"
    - "A pricing function that owns fixed-fee quoting (Goodwin names a Managing Director, Client Value) [GOODWIN-PERSUIT-2025]"
  risks_and_guardrails:
    - "Benchmarks are shown as ranges and never reveal firm- or client-specific pricing; the vendor states it does not set or recommend prices [GOODWIN-PERSUIT-2025]"
    - "Per a PERSUIT VP quoted in the release, firms and clients can both access the same benchmark data [GOODWIN-PERSUIT-2025]"
    - "No named in-house user, accuracy data or error rate was found for the proposal-analysis tool [LTHUB-PERSUIT-2026]"
  human_checkpoints:
    - "Lawyers and pricing staff choose the price within or outside the range; the client negotiates independently"
    - "Legal-department decision-makers choose the firm and approve the fee structure"
  role_evolution: "Pricing and client-value roles gain a market-data input to partner conversations; Goodwin's release names a Managing Director, Client Value as spokesperson [GOODWIN-PERSUIT-2025]."
  evidence_grade: B
  sources:
    - {ref: GOODWIN-PERSUIT-2025, title: "Goodwin Advances Legal Pricing with Global Rollout of PERSUIT's Fixed Fee Benchmarking", publisher: Goodwin (press release), type: firm, url: "https://www.goodwinlaw.com/en/news-and-events/news/2025/12/announcements-otherindustries-goodwin-advances-legal-pricing-with-global-rollout", date: "2025-12-17", access: full, locator: "Press release body (all four paragraphs)"}
    - {ref: LTHUB-PERSUIT-2026, title: "PERSUIT vendor profile (undated, read 2026-10-19)", publisher: Legaltech Hub, type: vendor, url: "https://www.legaltechnologyhub.com/vendors/persuit/", date: "2026-10", access: full, locator: "Vendor profile paragraph"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firm (Goodwin) and in-house legal departments (buyer side, tagged in-house). The press release is the only evidence of use; extent of use inside Goodwin is not stated. The buyer-side agent that scopes matters and compares proposals (Priori Scout) is held in the pursuit-proposals module. Merged from practice-01 and practice-02."

