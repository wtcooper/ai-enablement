  last_reviewed: "2026-10-19"
  notes: "Firm kind: accounting and tax firms (Big Four and mid-size: KPMG, PwC, RSM, RKL). Named firms, no results beyond a client count. Context: the AICPA 2025 survey (1,000+ firms) found median net hourly billing rate up nearly 7% over two years to $170 and recommended considering a faster move away from hourly billing (reported by Bloomberg Tax; AICPA report not opened). Tax-specific pricing entries: tax-compliance-corporate-16, tax-compliance-individual-business-22, tax-controversy-10, tax-research-advisory-25, tax-transfer-pricing-22. Merged from practice-10, discourse-13 and governance-06."

- id: professional-services-scoping-pricing-17
  title: "Deciding where the AI time dividend goes: pass it on, keep it as margin, resell it as advisory, or hold price on higher quality"
  archetype: professional-services
  module: scoping-pricing
  function: strategy-planning
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "AI saves delivery time, but if price stays tied to hours the saving is lost or handed to the client. SPI Research calls the gap between hours AI saves and hours resold or repriced 'the leak'; its figure for firms saying AI generates revenue is gated."
  solution: "Firms choose a path on purpose. TRI describes three for tax firms: redeploy people to advisory, serve more clients with the same headcount, or rebuild around continuous insight. Thomson Reuters' 2026 survey describes an 'Elevate' path, preferred by 52% of surveyed professionals, where firms position AI as raising quality, reinvest freed time in deeper work and hold or raise fees. SPI sells its 2026 report as guidance on how to reprice or resell the hours AI saves."
  outcomes:
    - {lever: capacity, description: "Firms saying AI saves them time", figure: "84.8%", measures: "Share of 245 surveyed professional-services organisations saying AI saves them time (SPI landing page); the matching share saying AI generates revenue is withheld", provenance: independent, source_ref: SPI-AI-2026}
    - {lever: growth, description: "Pricing model and margin in tax firms", figure: "78% of firms bill hourly; individual return preparation 28% profit margin versus 20-24% for advisory; highest-margin firms use value-based pricing 61% of the time versus 54% for the lowest-margin tier", measures: "Survey-reported shares and margins from TRI tax reports as summarised by TRI; sample sizes not stated; correlation, not cause", provenance: vendor-published, source_ref: TRI-CHARGING-2026}
  prerequisites:
    - "Matter- or project-level cost and time tracking; SPI says profit goes only to firms with four foundations (behind its paywall) [SPI-AI-2026]"
    - "Clear evidence to clients that quality has improved, if fees are held [TRI-SOTLM-2026]"
  risks_and_guardrails:
    - "Freed time is not itself billable; drifting between paths while still billing hourly is the failure mode [TRI-CHARGING-2026]"
    - "TRI says premium billing tied to AI adoption is sustainable only when clients clearly see added value, and warns that firms relying on premium pricing without measurable efficiency gains would be most exposed if client budgets tighten [TRI-SOTLM-2026]"
    - "78% of corporate clients call AI-enabled quality gains very important or essential, but 6% say most or all providers deliver them; 32% have reconsidered or plan to reconsider providers within 12 months [TR-FOP-2026]"
    - "Hourly bills must reflect time actually spent, so savings cannot be hidden inside hours [CALBAR-GENAI-2026, p. 8]"
  human_checkpoints:
    - "Partners and pricing leads decide whether savings become margin, price reduction or new services"
  role_evolution: "Thomson Reuters notes Elevate firms may serve a smaller market as price-sensitive clients leave, and newer professionals may find fewer chances to build foundational experience [TR-FOP-2026]."
  evidence_grade: C
  sources:
    - {ref: SPI-AI-2026, title: "The 2026 Impact of AI on Professional Services (report landing page; report paid)", publisher: SPI Research, type: survey, url: "https://spiresearch.com/reports/2026-ai-professional-services-survey/", date: "2026-10", access: full, locator: "'Part III: The Leak'; 'Protect margin as AI saves time'"}
    - {ref: TRI-CHARGING-2026, title: "If AI can do the work, then what are you actually charging for?", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/what-are-you-actually-charging-for", date: "2026-10-02", access: full, locator: "'Compliance work is commoditizing'; 'Clients are already grading firms'"}
    - {ref: TR-FOP-2026, title: "Future of Professionals Report 2026", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026-09", access: full, locator: "'AI to Elevate' description; client pressure findings"}
    - {ref: TRI-SOTLM-2026, title: "State of the US Legal Market 2026 analysis: Will the AI bubble burst? A crucial warning for law firms", publisher: Thomson Reuters Institute with Georgetown Law CELP, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/legal-market-report-2026-analysis-ai-bubble", date: "2026-01-14", access: full, locator: "Sections on AI hype and assessing the payoff"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p. 8"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: cross-sector (SPI covers professional-services organisations broadly; TRI data are tax and legal). Graded C: survey headlines and analyst framing; no named firm reports choosing a path with results. Firm-level economics belong to firm-finance. Merged from practice-14, discourse-14 and governance-17 (Elevate path, idea)."

- id: professional-services-scoping-pricing-18
  title: KPI-based monthly retainer or portfolio billing in place of hourly billing for repeat insurance-defence work
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [expert-judgment, client-interaction]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Under hourly billing, finishing a task in 30 minutes rather than three hours cuts the firm's own revenue, and insurer clients audit and cut bills line by line, which costs both sides administrative effort. Clients refuse to pay for software or AI costs while expecting the efficiency gains."
  solution: "Kopka Law moves defence-litigation clients to a monthly retainer or portfolio-based billing model judged on KPIs (key performance indicators): cycle time and case disposition, early evaluation and consistent communication, indemnity outcome relative to injury type, and collaboration. It uses the insurer's claim frequency and severity data and its own litigation-category data to set the arrangement."
  outcomes:
    - {lever: cost, description: "Firm reports freed capital and administrative resources for firm and client; no figures published", figure: "none published", measures: "Qualitative claim in the article", provenance: self-reported, source_ref: TRI-KOPKA-2026}
  prerequisites:
    - "Client data on claim frequency and severity plus the firm's own litigation-category data [TRI-KOPKA-2026]"
    - "Client willingness to negotiate away from line-item bill review; the firm is inviting carriers to do so [TRI-KOPKA-2026]"
  risks_and_guardrails:
    - "The firm's COO says alternative fees designed solely to save the client money are 'destined to fail' because they push firms to cut corners [TRI-KOPKA-2026]"
    - "Fear of being underpaid and not knowing how to measure value other than by the clock slow adoption [TRI-KOPKA-2026]"
  human_checkpoints:
    - "Performance is judged against the agreed KPIs rather than line-by-line bill review [TRI-KOPKA-2026]; how the KPIs are set and reviewed is not described"
  role_evolution: "The firm's COO says talent is leaving the defence side because of the tedium of capturing time; Kopka says firms like it built billing and appeals departments to counter insurers' bill audits, which the retainer model aims to dismantle [TRI-KOPKA-2026]."
  evidence_grade: B
  sources:
    - {ref: TRI-KOPKA-2026, title: "How one law firm is challenging a broken status quo around billing (Kopka Law)", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/institute/articles/broken-status-quo-around-billing", date: "2026-04-30", access: full, locator: "Sections 'Why the billable hour hates AI' and 'Data as the solution'"}
    - {ref: ATL-DEFENSE-2026, title: "The Defense Bar In The Age Of AI: Running A Red Queen's Race?", publisher: Above the Law, type: press, url: "https://abovethelaw.com/2026/10/the-defense-bar-in-the-age-of-ai-running-a-red-queens-race/", date: "2026-10-19", access: full, locator: "Sections on billing incentives and the recommendation for carriers"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: law firm (insurance defence); clients are insurers' in-house claims functions. AI is a stated reason but the model is not AI-specific; the article does not name AI tools. Grade B: named firm describing a real billing model, no published results. The Above the Law column argues contingency-fee plaintiffs' firms gain from AI efficiency while hourly defence firms lose. Merged from discourse-05 and governance-03."

- id: professional-services-scoping-pricing-19
  title: Management consultancy ties a share of fees to client outcomes as AI compresses analytical effort
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [expert-judgment, client-interaction]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Clients arrive with a result they want rather than a defined scope, and AI-compressed analytical work makes hours harder to defend."
  solution: "McKinsey says clients now bring a target outcome and the fee is mostly contingent on performance against a scorecard (investor targets, revenue or profit goals within a timeframe, operating measures, customer satisfaction), with some fixed components. Its UK managing partner said in November 2025 that about a quarter of global fees come from outcome-based pricing. A Forrester analyst note says consultancies have moved toward putting fees at risk and expects this to expand in AI consulting contracts."
  outcomes:
    - {lever: growth, description: "Share of McKinsey's fees on outcome-based pricing", figure: "about a quarter of global fees (the same article quotes McKinsey's AI leader using 20%; a secondary summary says roughly a third of work)", measures: "Share of McKinsey global fees from outcome-based pricing, stated at a November 2025 London media event; not audited, basis not stated", provenance: self-reported, source_ref: BI-MCKINSEY-2025}
  prerequisites:
    - "An agreed client scorecard; McKinsey says the model suits multi-year, multidisciplinary transformation work [BI-MCKINSEY-2025]"
    - "Measurement infrastructure before outcome pricing, and attribution clean enough to bear contractual weight [STANFORD-DEL-2026, Rule 3]"
  risks_and_guardrails:
    - "McKinsey's own technology and AI leader said outcome-based pricing did not start because of AI, so the share cannot be read as an AI effect [BI-MCKINSEY-2025]"
    - "Reporting does not explain how baselines are set, who judges whether a target was hit, or whether partner pay changes [AIWEEKLY-MCK-2026]"
    - "Accounting and audit variants face contingent-fee limits [AICPA-CODE-2026, 1.510.001]; no equivalent consulting fee rule was found"
  human_checkpoints:
    - "The scorecard is agreed with the client before work starts [BI-MCKINSEY-2025]; the client signs off results"
  role_evolution: "McKinsey says strategy advice is now under 20% of its work and clients want implementation expertise and multi-year support [BI-MCKINSEY-2025]."
  evidence_grade: B
  sources:
    - {ref: BI-MCKINSEY-2025, title: "AI is reshaping how McKinsey makes money (Polly Thompson; read via Yahoo Finance syndication)", publisher: Business Insider, type: press, url: "https://finance.yahoo.com/news/ai-reshaping-mckinsey-makes-money-195132745.html", date: "2025-11-17", access: full, locator: "Paragraphs quoting the UK managing partner (fee share) and the AI leader (scorecard, 20%)"}
    - {ref: AIWEEKLY-MCK-2026, title: "McKinsey Ties 25% of Fees to Outcomes as AI Erodes Billable Hours (summary of a WSJ report)", publisher: AI Weekly, type: press, url: "https://aiweekly.co/alerts/mckinsey-ties-25-of-fees-to-outcomes-as-ai-erodes-billable-hours", date: "2026-06-29", access: full, locator: "TL;DR bullet 1; caveat paragraph"}
    - {ref: RESULTSENSE-2026, title: "AI dismantles consulting scale advantage as boutiques target Big Four (summary of FT and City AM)", publisher: Resultsense, type: press, url: "https://www.resultsense.com/news/2026-05-28-ai-consulting-big-four-reckoning/", date: "2026-05-28", access: full, locator: "Paragraph beginning 'Three structural pillars'"}
    - {ref: FORRESTER-BLOG-2025, title: "The Future Of AI Consulting Services Is Disruptively Bright", publisher: Forrester, type: press, url: "https://www.forrester.com/blogs/the-future-of-ai-consulting-services-is-disruptively-bright", date: "2025-09-15", access: full, locator: "Paragraph beginning 'Modify their economic models'"}
    - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives (Brynjolfsson and Petropoulos)", publisher: "Stanford Digital Economy Lab and USC Marshall", type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Section 5.1 (p. 14); Section 7, Rule 3"}
    - {ref: AICPA-CODE-2026, title: "AICPA Code of Professional Conduct (updated through July 2026)", publisher: AICPA, type: standard-setter, url: "https://mn.gov/boa/assets/AICPA%20Code%20of%20Professional%20Conduct_tcm1233-764395.pdf", date: "2026-07", access: full, locator: "1.510.001"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: management consulting. Grade B, not A: 'about a quarter' is a rough figure stated to reporters. Ladder assist is nominal: AI changes delivery effort, not the pricing step. Business Insider's direct URL returned not found in one angle, so the syndicated copy is cited. EY's global managing partner for growth and innovation told Business Insider that AI agents may call for a 'service-as-a-software' outcome approach (month given, year not stated). BCG and Bain AI-revenue shares are not pricing figures and are not used. Merged from practice-07, discourse-06 and governance-04."

- id: professional-services-scoping-pricing-20
  title: IT services providers move contracts from hours to outcome measures and share AI-driven savings with clients
  archetype: professional-services
  module: scoping-pricing
  function: sales-marketing-bd
  work_types: [expert-judgment, client-interaction]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Clients demand price cuts and more productivity as AI lifts delivery efficiency, and billing large offshore workforces by the hour loses its logic. Persistent's CEO said clients were demanding the same work for 25% to 30% less."
  solution: "Reuters (2026-08-21) reports TCS, Infosys, Wipro, HCLTech and Cognizant increasingly tie fees to performance outcomes instead of hours worked. TCS's CEO said about 80% of contracts in its finance, HR and other business-services segment are now based on outcome performance measures. Citing people familiar with the terms, Reuters says a February 2026 Cognizant-Daimler Truck AI and automation deal splits AI-related cost savings between vendor and client, and a June 2025 HCLTech-E.ON cloud deal pays HCLTech nothing in year one, with payments from year two tied to efficiency gains and business outcomes."
  outcomes:
    - {lever: cost, description: "Share of contracts in one TCS segment using outcome performance measures", figure: "about 80%", measures: "Share of TCS contracts in its finance, HR and other business-services segment based on outcome performance measures, as stated by TCS's CEO to Reuters", provenance: self-reported, source_ref: REUTERS-ITSERVICES-2026}
    - {lever: cost, description: "Client price expectation reported by a provider", figure: "25% to 30% less", measures: "What Persistent Systems' CEO said clients were demanding for the same work; a demand, not a realised price change", provenance: self-reported, source_ref: REUTERS-ITSERVICES-2026}
  prerequisites:
    - "Contractable outcome metrics in the client's operations (the TCS segment is business-process work) [REUTERS-ITSERVICES-2026]"
    - "An agreed baseline of current cost and a way to attribute savings [STANFORD-DEL-2026, Rule 3]"
  risks_and_guardrails:
    - "Tech Mahindra's CEO said some rivals assume productivity gains of 70% to 80% over five to seven years and guarantee prices; his company chose not to take that risk [REUTERS-ITSERVICES-2026]"
    - "Infosys told analysts it walked away from contracts that were no longer economically viable [REUTERS-ITSERVICES-2026]"
    - "The savings-split and deferred-payment terms come from unnamed sources; Cognizant declined to comment on specific contracts [REUTERS-ITSERVICES-2026]"
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: "TCS is increasing engineers embedded with clients; a former Infosys CFO said the big IT firms will no longer need large ranks of entry-level engineers [REUTERS-ITSERVICES-2026]."
  evidence_grade: B
  sources:
    - {ref: REUTERS-ITSERVICES-2026, title: "AI reshapes India's IT services sector contracts as clients demand more for less (Reuters, syndicated copy)", publisher: Reuters via WHBL, type: press, url: "https://whbl.com/2026/08/20/ai-reshapes-indias-it-services-sector-contracts-as-clients-demand-more-for-less/", date: "2026-08-21", access: full, locator: "Opening paragraphs; TCS, Persistent, Tech Mahindra, Infosys, Cognizant and HCLTech passages"}
    - {ref: RESULTSENSE-ACCENTURE-2026, title: "Accenture's forecast lifts IT services stocks hit by AI fears (summary of Reuters)", publisher: Resultsense, type: press, url: "https://www.resultsense.com/news/2026-10-02-accenture-forecast-it-services-rally/", date: "2026-10-02", access: full, locator: "Paragraph 1 and commentary on price cuts"}
    - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives (Brynjolfsson and Petropoulos)", publisher: "Stanford Digital Economy Lab and USC Marshall", type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Section 7, Rule 3 (pp. 21-22)"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: IT services and business-process outsourcing, adjacent to consulting; included because the pricing response is the same mechanism. Grade B, not A: the 80% is a CEO's approximate interview statement. Accenture was reported (2026-10-01, secondary) to have said its prices were lower in many areas. Ladder assist is nominal. Merged from practice-08 and practice-09."

- id: professional-services-scoping-pricing-21
  title: AI-native law firms sell fixed-price bundles or per-document rates instead of hours
  archetype: professional-services
  module: scoping-pricing
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: "Routine commercial contract work is priced by the hour at traditional firms; Falcon's founders say straightforward work can cost SMEs EUR 3,000 to 4,000 a piece and take days or weeks."
  solution: "Falcon (Belgium; co-founded by former Allen & Overy senior partner Wim Dejonghe; reported 2026-10-02) offers review of six contracts a month for a flat EUR 1,000, each signed off by a qualified lawyer and returned the same day. Crosby's site advertises fixed rates by the document, with human attorneys reviewing all work and malpractice insurance carried. Non-Billable also names Moritz and Norm Law as AI-native firms."
  outcomes:
    - {lever: cost, description: "Published flat price against the founders' estimate of traditional cost", figure: "EUR 1,000 per month for six contracts (Falcon); EUR 3,000-4,000 per straightforward piece of work at a traditional firm (founders' estimate)", measures: "Falcon's published offer price and its founders' statement of what such work could cost; not a measured outcome", provenance: self-reported, source_ref: NONBILLABLE-FALCON-2026}
  prerequisites:
    - "Standardised, high-volume document types (Falcon starts with NDAs, data processing agreements, customer and supplier agreements) [NONBILLABLE-FALCON-2026]"
    - "Qualified lawyer sign-off on each piece of work [NONBILLABLE-FALCON-2026]"
  risks_and_guardrails:
    - "A fixed price puts delivery-cost risk on the firm; neither source discloses delivery cost or margin"
    - "Crosby states it carries full malpractice insurance [CROSBY-SITE-2026]"
  human_checkpoints:
    - "A qualified lawyer signs off each piece of work (Falcon); human attorneys review all work (Crosby)"
  role_evolution: "Crosby's site describes lawyers as reviewers and agent managers; Falcon keeps 'a qualified lawyer accountable for every piece of work' (founder) [NONBILLABLE-FALCON-2026; CROSBY-SITE-2026]."
  evidence_grade: B
  sources:
    - {ref: NONBILLABLE-FALCON-2026, title: "Former A&O boss launches AI-native law firm, minus the billable hour", publisher: Non-Billable, type: press, url: "https://www.nonbillable.co.uk/news/wim-dejonghe-launches-ai-native-law-firm-falcon", date: "2026-10-02", access: full, locator: "Opening paragraphs; founder-cost paragraph; AI-native firms paragraph"}
    - {ref: CROSBY-SITE-2026, title: "Crosby: The Agentic Law Firm Built for Execution (home page, read 2026-10-19)", publisher: Crosby, type: firm, url: "https://www.crosby.ai/", date: "2026-10", access: full, locator: "'Don't buy hours. Buy outcomes. Fixed rates by the document'; 'Human attorneys review all work'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: AI-native law firms (Belgium, US). Falcon is newly launched; Crosby is selling but publishes no prices or usage data on the page read. No quality, margin or volume figures. Garfield.Law was opened but no price was visible, so it is not used. Merged from practice-05."

- id: professional-services-scoping-pricing-22
  title: Big Four firm packages expertise into AI-delivered services priced by subscription or consumption (PwC One)
  archetype: professional-services
  module: scoping-pricing
  function: product-service-development
  work_types: [expert-judgment, document-production]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: "Hours-based billing, built on large teams of junior staff doing routine tasks, is threatened when AI can do much of that work; PwC leadership says some tax and consulting services will become tools clients use without a PwC person in the loop."
  solution: "PwC introduced PwC One on 2026-03-19. The New Stack describes clients describing a problem and agents performing the work, with PwC professionals reviewing outputs; still in beta in March 2026, with client use cases including financial statement analysis, tax incentives, transfer-pricing compliance, emissions anomaly detection and early-stage financial due diligence. Press coverage of the US CEO's FT interview says some services may be offered as automated tools clients access directly, potentially paid by annual subscription; Accounting Today says pricing will evolve and may involve subscription or consumption elements. PwC's own release gives no pricing."
  outcomes:
    - {lever: growth, description: "Services available at launch; no price, uptake or quality figure", figure: "six automated services, with more promised", measures: "Count of automated services at launch per the CEO interview reported by CPA Practice Advisor (not in PwC's release)", provenance: self-reported, source_ref: CPAPA-PWC-2026}
  prerequisites:
    - "Productisable service content: the firm's compliance frameworks and proprietary methodologies (PwC's AI principal) [NEWSTACK-PWC-2026]"
    - "Human touches designed in where agents do not yet perform at professional grade or where professional expectations require review [NEWSTACK-PWC-2026]"
  risks_and_guardrails:
    - "PwC says accountability sits with the firm and its professionals, with a human reviewer on every PwC One engagement [NEWSTACK-PWC-2026]"
    - "Pricing and liability are framed as open questions; PwC gave no price specifics [NEWSTACK-PWC-2026; STANFORD-DEL-2026, Section 5.2]"
    - "Secondary coverage says early access will test whether clients pay for subscription tools instead of bespoke advice [RESULTSENSE-PWC-2026]"
  human_checkpoints:
    - "A professional reviews outputs on every engagement, in the background rather than driving the work [NEWSTACK-PWC-2026]"
  role_evolution: "PwC's US CEO said partners who resist AI 'have no place at the firm' and senior staff who were not AI-first would probably be replaced [CPAPA-PWC-2026]. PwC's US tax leader said 'time's becoming less and less of relevance' [BLOOMBERGTAX-PRICING-2026], a remark the Stanford paper cites about pricing conversations [STANFORD-DEL-2026, Section 5.2]."
  evidence_grade: B
  sources:
