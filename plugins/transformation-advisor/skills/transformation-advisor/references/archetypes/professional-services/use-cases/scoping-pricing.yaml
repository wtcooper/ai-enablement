- id: professional-services-scoping-pricing-23
  title: Law firms license firm-built AI tools to clients and peers by subscription or revenue share
  archetype: professional-services
  module: scoping-pricing
  function: product-service-development
  work_types: [client-interaction, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: "Clients want AI-enabled service but see little of what firms do, and firms want to stay central as clients adopt AI themselves; hours are no way to charge for a tool."
  solution: "Firms package their knowledge into client-facing tools and charge for access. Debevoise's STAAR (Suite of Tools for Assessing AI Risk) gives clients the firm's guidance on AI governance and risk; ABA Journal reports STAAR 2.0 as a subscription platform built with Legora. A&O Shearman has a revenue-sharing arrangement with Harvey to license its tools to clients and other firms. Cooley made Cooley GO Lab, a Legora-built workspace, available free to a summer Y Combinator cohort. Legora's Portal product lets firms invite clients into a white-labelled workspace running firm-designed workflows."
  outcomes:
    - {lever: growth, description: "none published", figure: "none published", measures: "No usage, revenue or retention figure found for any of these offers", provenance: self-reported, source_ref: DEBEVOISE-BLOOMBERG-2026}
  prerequisites:
    - "Curated firm knowledge built on the collective experience of the firm's lawyers [DEBEVOISE-BLOOMBERG-2026]"
    - "A platform partner, and pricing and licensing decisions for client access [ABAJ-SHARE-2026]"
  risks_and_guardrails:
    - "A consultant told Law.com that firms fear clients using AI to do the work themselves, or licensing their 'secret sauce' to peers [ABAJ-SHARE-2026]"
  human_checkpoints:
    - "Debevoise says the tools draw on curated legal knowledge and complement the advice its lawyers give [DEBEVOISE-BLOOMBERG-2026]"
  role_evolution: "Partners contribute knowledge to firm products; the sources do not describe role changes in detail."
  evidence_grade: B
  sources:
    - {ref: ABAJ-SHARE-2026, title: "Should law firms share AI tools with their clients and peers?", publisher: ABA Journal, type: press, url: "https://www.abajournal.com/news/article/should-law-firms-share-ai-tools-with-their-clients-and-peers", date: "2026-07-14", access: full, locator: "Paragraphs 2-4"}
    - {ref: DEBEVOISE-BLOOMBERG-2026, title: "Bloomberg Law Features Debevoise's AI Strategy and STAAR Platform", publisher: Debevoise & Plimpton LLP, type: firm, url: "https://www.debevoise.com/news/2026/08/bloomberg-law-features-debevoises-ai", date: "2026-08-06", access: full, locator: "Body paragraphs 1-2"}
    - {ref: COOLEY-LAWCOM-2026, title: "Law Firms Are Building Their Own AI Tools. Should They Share Them? (press-mention page)", publisher: Cooley LLP, type: firm, url: "https://www.cooley.com/news/coverage/2026/2026-07-14-law-firms-are-building-their-own-ai-tools-should-they-share-them", date: "2026-07-14", access: full, locator: "Item text"}
    - {ref: LEGORA-PORTAL-2026, title: "Portal: the new standard in legal collaboration (product page; undated, read 2026-10-19)", publisher: Legora, type: vendor, url: "https://legora.com/product/portal", date: "2026-10", access: full, locator: "'Firm-powered AI solutions'; 'White-label user experience'"}
  last_reviewed: "2026-10-19"
  notes: "Firm kind: large law firms (US, UK). Routed from client-development, which holds the relationship effect of the same offers; this entry holds the priced-service model. No price, usage or revenue figure was found. Compare productised fixed-price delivery in tax (tax-transfer-pricing-22) and SOC services (assurance-soc-attestation-14)."
