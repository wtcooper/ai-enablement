- id: professional-services-knowledge-management-19
  title: Senior judgment and reviewers' corrections captured so less experienced staff work from them, with unaided skill checks
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - expert-judgment
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Judgment sits in senior people's heads; NetDocuments frames this as a senior lawyer retiring and decades of judgment
    leaving (NETDOCUMENTS-CONTEXTGRAPH-2026). Accountants learned client context by preparing returns repeatedly and
    hearing why a partner changed them (AT-AINATIVE-2026). 71% of professionals say early-career roles need structured
    support from experienced peers (TR-FOP-2026).
  solution: >-
    Ascend, a private-equity-backed accounting-firm platform, describes a 'closed loop' in which every workflow trace,
    field correction and client preference compounds into data its AI learns from, plus a chat inside the work product
    that lets staff ask what changed in a return and why the partner changed it (AT-AINATIVE-2026). A pre-registered trial
    at eleven US IP firms tested a purpose-built drafting assistant and then checked what lawyers could do without it
    (NBER-AUTOR-2026). Executives at Basware and Digital Commerce Bank describe the aim of making what the best people know
    available to others (KANTATA-BASWARE-2026; IMANAGE-DCB-2026).
  outcomes:
  - lever: quality
    description: Work quality with a purpose-built assistant (patent drafting, blinded expert scoring; adjacent process)
    figure: +0.34 SD at 10 days and +0.38 SD at 90 days
    measures: Standard deviations of blinded expert quality scores, treated versus control, 133 patent lawyers at 11 US IP firms; study run with a Google-built assistant
    provenance: vendor-published
    source_ref: NBER-AUTOR-2026
  - lever: quality
    description: Skill retained without AI after three months
    figure: +0.32 SD overall; seniors +0.45 SD; juniors no average gain, scores split
    measures: Standard deviations on a blinded-scored redline done without AI
    provenance: vendor-published
    source_ref: NBER-AUTOR-2026
  - lever: capacity
    description: Customer-support agents with a generative AI assistant (adjacent process, not professional services)
    figure: +14% issues resolved per hour; +34% for novice and low-skilled workers; minimal effect on experienced workers
    measures: Issues resolved per hour, 5,179 agents at one firm; the authors give suggestive evidence the tool spreads the practices of more able workers
    provenance: independent
    source_ref: NBER-BRYNJOLFSSON-2023
  prerequisites:
  - "A firm-controlled stack so corrections and communications are captured (AT-AINATIVE-2026)"
  - "Experienced professionals willing to get their knowledge out of their heads (AT-AINATIVE-2026)"
  - "A way to test what juniors can do unaided"
  risks_and_guardrails:
  - "Foundational expertise may be a prerequisite for durable skill from AI-assisted practice (NBER-AUTOR-2026)"
  - "A junior using a firm-trained assistant may deliver advanced output they may not be able to review (JOFA-LEARN-2026)"
  - "The Law Society warns of invisible substitution of professional judgment and expects junior roles to change first (LAWSOC-AGENTICFUTURE-2026)"
  - "Ascend's CEO says handing much institutional know-how and client context to outside vendors would leave a firm vulnerable (AT-AINATIVE-2026)"
  - "48% of professionals worry about the effect on independent judgment (TR-FOP-2026)"
  human_checkpoints:
  - "Partner review of the work remains the source of the explanation the assistant draws on"
  - "Senior review of junior work remains the main quality control, with periodic unaided exercises"
  role_evolution: >-
    In the trial, seniors kept most of the skill benefit and juniors' outcomes split (NBER-AUTOR-2026). Ascend's CEO says
    firms will want curious young people who can teach themselves from compounded firm know-how, and recounted one firm
    saying its busy-season interns reached staff level without extra training, an anecdote (AT-AINATIVE-2026). A BYU
    professor reports entry-level staff using an AI review tool to get detailed feedback without manager training time
    (JOFA-LEARN-2026).
  evidence_grade: B
  sources:
  - {ref: AT-AINATIVE-2026, title: "The AI-native firm (On the Air with Accounting Today; Ascend CEO; AI-generated transcript)", publisher: Accounting Today, type: podcast, url: "https://www.accountingtoday.com/podcast/the-ai-native-firm", date: "2026", access: full, locator: "Transcript at 01:16, 12:10, 15:20"}
  - {ref: NBER-AUTOR-2026, title: "Does AI Assistance Enhance or Erode Expertise? Evidence from a Three-Month Field Experiment in Patent Drafting (NBER Working Paper 35720)", publisher: "National Bureau of Economic Research (Autor, Rodchenko, Martin, Iscenko, Strand, Pearl, Ferere)", type: academic, url: "https://www.nber.org/papers/w35720", date: "2026-09", access: full, locator: "Abstract"}
  - {ref: NBER-BRYNJOLFSSON-2023, title: "Generative AI at Work (NBER Working Paper 31161)", publisher: "National Bureau of Economic Research (Brynjolfsson, Li, Raymond)", type: academic, url: "https://www.nber.org/papers/w31161", date: "2023-04", access: full, locator: "Abstract"}
  - {ref: KANTATA-BASWARE-2026, title: "Kantata takes Basware from AI experimentation to results (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-takes-basware-from-ai-experimentation-to-results", date: "2026-10-13", access: full, locator: "Section 'Where AI Meets Expertise'"}
  - {ref: IMANAGE-DCB-2026, title: "Digital Commerce Bank unifies diverse teams on one platform (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/digital-commerce-bank/", date: "2026-10-19", access: full, locator: "Final sentence of the Ask iManage governance paragraph"}
  - {ref: NETDOCUMENTS-CONTEXTGRAPH-2026, title: "NetDocuments Unveils the First Context Graph for Legal Work (press release)", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/company-news/netdocuments-unveils-context-graph-legal-platform/", date: "2026-05-14", access: full, locator: "Paragraph on the senior lawyer who retires"}
  - {ref: TR-FOP-2026, title: "Future of Professionals Report 2026", publisher: Thomson Reuters, type: survey, url: "https://www.thomsonreuters.com/en/institute/future-of-professionals-2026/report", date: "2026", access: full, locator: "Key finding 07; 'A generation of disrupted development'"}
  - {ref: LAWSOC-AGENTICFUTURE-2026, title: "The future of agentic AI in legal practice (report summary page)", publisher: Law Society of England and Wales, type: professional-body, url: "https://www.lawsociety.org.uk/topics/research/the-future-of-agentic-ai-in-legal-practice", date: "2026-04-14", access: full, locator: "'Summary of key findings'; 'Workforce and skills could be impacted'"}
  - {ref: JOFA-LEARN-2026, title: "How will accountants learn new skills when AI does the work?", publisher: Journal of Accountancy (AICPA & CIMA), type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/mar/how-will-accountants-learn-new-skills-when-ai-does-the-work/", date: "2026-03-01", access: full, locator: "'AI affects all rungs of the career ladder'; 'Theoretical understanding isn't enough' (routed from the talent-learning deep dive)"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: accounting-firm platform (Ascend), US IP law firms (unnamed, in the NBER trial), a software company's
    services team (Basware) and an in-house bank team (Digital Commerce Bank). Grade B: Ascend describes its own
    deployment (piloting, no measures), and the measured evidence is adjacent (patent drafting; customer support). NBER
    provenance follows professional-services-work-production-06, which holds the same trial as a drafting use case: Google
    built the assistant and supported the study. Learning effects belong to talent-learning; related
    tax-research-advisory-08 (AI-supported research coaching for juniors).

- id: professional-services-knowledge-management-20
  title: AI 'twins' or personas that capture an individual professional's judgment and make it available to colleagues
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - expert-judgment
  - research-synthesis
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    The most valuable knowledge is the context behind a document: why a decision was made, how a negotiation unfolded, who
    has relevant experience. It sits in emails, calls, notes and memories and leaves when people retire (AL-TWIN1-2026).
  solution: >-
    Twin1 (launched August 2026 after a $20m raise) builds an AI twin per person from their work and links the twins so
    expertise moves across the organisation without unrestricted access to private data; its CEO says it works with
    Linklaters, Orrick and Dechert (AL-TWIN1-2026). A KM leader describes building an AI persona from a partner's work
    product and structured interviews (AL-DIDOMENICO-2026).
  outcomes:
  - lever: capacity
    description: none published; the CEO gives a pipeline of more than 400 prospects, which is not an outcome
    figure: none published
    measures: n/a
    provenance: vendor-published
    source_ref: AL-TWIN1-2026
  prerequisites:
  - "Consent and a data-use policy for building a model of an individual; the sources describe neither"
  - "Permission-aware access so a twin does not leak another matter's information"
  risks_and_guardrails:
  - "The CEO says the product preserves privacy, permissions, compliance and human agency and does not train models on customer data; these are vendor statements (AL-TWIN1-2026)"
  - "California says lawyers remain responsible for configuring agentic systems consistently with confidentiality duties (CALBAR-GENAI-2026)"
  - "The sources do not say who owns a twin when the professional leaves"
  human_checkpoints:
  - "The individual reviews and approves what their twin may say"
  - "The colleague treats twin output as input to their own judgment"
  role_evolution: >-
    The Twin1 CEO frames the basic unit of knowledge in a professional organisation as a person, not a document
    (AL-TWIN1-2026). DiDomenico describes a knowledge manager who once ran expertise directories through annual surveys
    building such a persona (AL-DIDOMENICO-2026). No source reports the role change as having happened.
  evidence_grade: C
  sources:
  - {ref: AL-TWIN1-2026, title: "Interview with Twin1 CEO Lewis Liu", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/08/20/interview-with-twin1-ceo-lewis-liu/", date: "2026-08-20", access: full, locator: "Answers on why, customers and pipeline, privacy"}
  - {ref: AL-DIDOMENICO-2026, title: "Old Problems, New Tools: Maybe You Need a Knowledge Strategy (sponsored by LegalTech Connect)", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/10/15/old-problems-new-tools-maybe-you-need-a-knowledge-strategy/", date: "2026-10-15", access: full, locator: "Paragraph 3"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Confidentiality row"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firms (named by the vendor's CEO, not confirmed by the firms). Pattern 'other': a networked set of
    per-person agents answering from each person's work. The CEO also cites a Kirkland & Ellis AI spending plan, not
    verified there; the firm-finance deep dive covers Kirkland from Bloomberg Law.

- id: professional-services-knowledge-management-21
  title: "Idea: structured elicitation of tacit know-how, including from people about to retire, with AI-drafted stories reviewed by the expert"
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - expert-judgment
  - research-synthesis
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Lessons-learned documents capture facts but not judgment, and senior professionals' tacit knowledge leaves with them.
    A Thomson Reuters audit-business manager said 75% of audit partners are scheduled to retire within ten years, with no
    dataset given (TR-AUDIT-2026).
  solution: >-
    Idea discussed by practitioners. A KMWorld Europe 2026 workshop (13 April) taught pairwise interviews, generative-AI
    supported story prototypes and a Tacit Knowledge Canvas, embedded in communities of practice (KMWORLD-EUROPE-2026).
    The Accenture authors propose mapping where expertise resides before codifying it (CMR-ACCENTURE-2026). TechnipFMC (not
    a professional-services firm) built a knowledge-transfer plan per departing expert by interviewing experts and
    colleagues, with no AI described (KMWORLD-APQC-2026). The Twin1 CEO says AI twins could help preserve the knowledge of
    partners approaching retirement (AL-TWIN1-2026).
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: n/a
    provenance: self-reported
    source_ref: KMWORLD-EUROPE-2026
  prerequisites:
  - "Early identification of at-risk knowledge holders"
  - "Skilled interviewers, and willingness of senior people to be interviewed and have their work analysed"
  risks_and_guardrails:
  - "The workshop abstract says AI supports rather than replaces the interview (KMWORLD-EUROPE-2026)"
  - "The Accenture authors warn against flattening judgment into oversimplified rules (CMR-ACCENTURE-2026)"
  - "The retirement figure comes from a vendor blog interview and is unverified (TR-AUDIT-2026)"
  human_checkpoints:
  - "The expert approves the story or record of their judgment before it is shared"
  role_evolution: >-
    KM staff would act as interviewers and facilitators; no professional-services firm reports such a programme with AI.
    The Accenture authors describe an automaker whose retiring engineers' tacit knowledge had to be captured by agents
    (CMR-ACCENTURE-2026).
  evidence_grade: D
  sources:
  - {ref: KMWORLD-EUROPE-2026, title: "KMWorld Europe 2026 Full Programme Listing", publisher: KMWorld, type: conference, url: "https://www.kmworld.com/Europe/2026/Programme.aspx", date: "2026-04", access: full, locator: "Workshop KMW1 abstract (13 April 2026)"}
  - {ref: CMR-ACCENTURE-2026, title: "Tacit Knowledge Is Your Next Competitive Moat (Tung, Roussiere of Accenture)", publisher: California Management Review Insight, type: firm, url: "https://cmr.berkeley.edu/assets/documents/pdf/2026-03-tacit-knowledge-is-your-next-competitive-moat.pdf", date: "2026-03-16", access: full, locator: "'Map Tacit Knowledge'; 'Codify Tacit Knowledge Without Flattening It'"}
  - {ref: KMWORLD-APQC-2026, title: "The Next Edge in Knowledge Management: KM for the Modern Workforce and the Era of AI (Lynda Braksiek, APQC)", publisher: KMWorld, type: press, url: "https://www.kmworld.com/Articles/Editorial/Features/The-Next-Edge-in-Knowledge-Management-KM-for-the-Modern-Workforce-and-the-Era-of-AI-173630.aspx?pageNum=2", date: "2026-03-09", access: full, locator: "TechnipFMC paragraph"}
  - {ref: AL-TWIN1-2026, title: "Interview with Twin1 CEO Lewis Liu", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/08/20/interview-with-twin1-ceo-lewis-liu/", date: "2026-08-20", access: full, locator: "Answer on partners approaching retirement"}
  - {ref: TR-AUDIT-2026, title: "State of AI in audit", publisher: Thomson Reuters Tax & Accounting, type: vendor, url: "https://tax.thomsonreuters.com/blog/state-of-ai-in-audit/", date: "2026-03-30", access: full, locator: "Question 1"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea: no professional-services firm reports an AI-assisted elicitation or retirement-capture programme in the sources
    read. The workshop was not specific to professional services; only its abstract was read. The audit retirement figure
    is used only as a workforce statement; audit practice belongs to the assurance archetype.

- id: professional-services-knowledge-management-22
  title: Firm knowledge curated for a client-facing AI portal, sold by subscription, with partners as content gatekeepers
  archetype: professional-services
  module: knowledge-management
  function: product-service-development
  work_types:
  - client-interaction
  - document-production
  pattern: grounded-knowledge-assistant
  ladder: automate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Clients want direct access to the firm's accumulated work, and a general counsel at a conference of 500+ in-house
    lawyers said law firms' AI use gives clients nothing and probably higher bills (AL-CLIENT-2026). Oz Benamram of SKILLS
    argued firms have until the end of 2027 to set knowledge-sharing strategies before a 'drought' (AL-LAWPUNX-2025).
  solution: >-
    Debevoise built STAAR, a client-facing AI portal on the Legora platform trained on its AI-risk work, sold by
    subscription to a limited number of clients and in beta with about 10, including Blackstone, Capital One, Evercore, GSK
    and New York Life (BLOOMBERGLAW-DEBEVOISE-2026). Client questions outside the portal still go to lawyers, billed
    hourly. Artificial Lawyer says Legora has launched a Portal product and Eudia is developing a 'legal brain' strategy
    (AL-LAWPUNX-2025).
  outcomes:
  - lever: growth
    description: Subscription price for the STAAR beta; no usage, revenue or retention result reported
    figure: $150,000 a year per subscription (beta, about 10 clients)
    measures: Annual subscription price quoted by Debevoise; client count from the article
    provenance: self-reported
    source_ref: BLOOMBERGLAW-DEBEVOISE-2026
  prerequisites:
  - "Partners willing to contribute documents; the article ties this to Debevoise's lockstep culture (BLOOMBERGLAW-DEBEVOISE-2026)"
  - "Client consent to use anonymised documents (BLOOMBERGLAW-DEBEVOISE-2026)"
  - "KM capacity to keep content current; the partner calls himself the gatekeeper and says it takes a lot of time (BLOOMBERGLAW-DEBEVOISE-2026)"
  risks_and_guardrails:
  - "Licence terms and security testing were still to be worked out at the time of the article (BLOOMBERGLAW-DEBEVOISE-2026)"
  - "Content currency and accuracy depend on continuing partner effort (BLOOMBERGLAW-DEBEVOISE-2026)"
  - "Client-facing sharing raises confidentiality and privilege questions; California's confidentiality guidance applies to any agentic system with access to firm files (CALBAR-GENAI-2026)"
  human_checkpoints:
  - "A partner approves what enters the portal (BLOOMBERGLAW-DEBEVOISE-2026)"
  - "Questions outside the portal's scope go to lawyers"
  role_evolution: >-
    Partners become curators of firm knowledge, and a software play inside a law firm calls for new hires; the presiding
    partner floated, as a theory, that partners may find it harder to move between firms (BLOOMBERGLAW-DEBEVOISE-2026).
  evidence_grade: B
  sources:
  - {ref: BLOOMBERGLAW-DEBEVOISE-2026, title: "Debevoise Banks on Partner Loyalty to Build Curated AI Products", publisher: "Bloomberg Law (Big Law Business, Roy Strom)", type: press, url: "https://news.bloomberglaw.com/business-and-practice/debevoise-banks-on-partner-loyalty-to-build-curated-ai-products", date: "2026-08-06", access: full, locator: "Paragraphs on STAAR subscription, beta clients, licence and KM caveats (routed from the firm-finance deep dive)"}
  - {ref: AL-LAWPUNX-2025, title: "Law Punx: 'Law Firms Must Share Their Knowledge Via AI'", publisher: Artificial Lawyer, type: podcast, url: "https://www.artificiallawyer.com/2025/11/11/law-punx-law-firms-must-share-their-knowledge-via-ai/", date: "2025-11-11", access: full, locator: "Paragraphs 1-3 and bullet summary"}
  - {ref: AL-CLIENT-2026, title: "'We Get Nothing' From Law Firm AI Use, Says Client", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/02/12/we-get-nothing-from-law-firm-ai-use-client/", date: "2026-02-12", access: full, locator: "Opening paragraphs"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Confidentiality row"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firm (Debevoise & Plimpton) with corporate clients. The only model-scope entry; beta, no result. The
    priced-service side of the same offers is professional-services-scoping-pricing-23 (Debevoise, A&O Shearman, Cooley,
    Legora Portal); firm expertise packaged as agents is professional-services-work-production-21; shared client
    workspaces are professional-services-work-production-20. This entry holds the knowledge work: curating, anonymising
    and keeping current what clients see. The Law Punx item is a written summary of a video; the Legora Portal and Eudia
    statements are Artificial Lawyer's.

- id: professional-services-knowledge-management-23
  title: Measuring the knowledge layer with search analytics, reuse and value measures, and re-tests when tools change
  archetype: professional-services
  module: knowledge-management
  function: strategy-planning
  work_types:
  - data-reporting
  - review-assurance
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Firms spend more on knowledge management and AI but cannot show returns. APQC says KM impact is hard to measure for
    many organisations (APQC-KMEXEC-2026), and at Legalweek 2026 firms answering clients' savings questions often said they
    were still gathering data (TRI-LEGALWEEK-2026).
  solution: >-
    Usage and reuse data on knowledge assets and AI tools is joined to matter and financial data; iManage describes an
    index that reveals trends across matters, clients, jurisdictions and profitability (IMANAGE-INSIGHT-2026). An unnamed
    global law firm plans analytics on search terms and on content that is not surfacing (IMANAGE-EMEAFIRM-2026). Firms
    build test sets of real questions with reference answers and re-run them when models change; in the Vals study, law
    firms contributed the dataset used to score vendor tools against a lawyer baseline (VALS-VLAIR-2025).
  outcomes:
  - lever: cost
    description: Law-firm spending on knowledge management
    figure: KM investment up about 10% in 2025; up 37.2% from 2021 to 2025
    measures: Growth in law-firm KM investment, per Thomson Reuters Institute and Georgetown market data
    provenance: vendor-published
    source_ref: TRI-SOTLM-2026
  - lever: quality
    description: Size of the firm-contributed benchmark dataset (document tasks, adjacent to retrieval)
    figure: over 500 samples, primarily from Am Law 100 firms
    measures: Question-and-answer sets with indicia of correctness collected from consortium firms for the Vals report
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: Measurable benefit from AI in an adjacent field (architecture and engineering)
    figure: 38% report measurable positive business impact tied to AI use
    measures: Share of respondents to Deltek's Clarity A&E study
    provenance: vendor-published
    source_ref: DELTEK-CLARITY-2026
  prerequisites:
  - "Knowledge tools with usage logs, and matter and billing data linkable to them"
  - "Senior lawyers' time to write reference answers and pass marks"
  - "Agreement with clients on what evidence of AI savings they will accept"
  risks_and_guardrails:
  - "The Stanford paper warns that behavioural visibility can erode the validity of metrics once people know they are metered (STANFORD-DEL-2026)"
  - "California says competence includes periodic reassessment as AI systems change through updates or model changes (CALBAR-GENAI-2026, p. 5)"
  - "The Law Society tells firms to assess the evidence and benchmarks vendors use to demonstrate capabilities (LAWSOC-GENAI-2026)"
  - "In the Vals study, vendors could opt out of individual tasks, and Vals discloses a customer relationship with a participant (VALS-VLAIR-2025)"
  human_checkpoints:
  - "KM and finance leaders agree metric definitions before metrics are shown to partners or clients"
  - "A named owner signs off pass marks before go-live and after material model changes"
  role_evolution: >-
    APQC says KM leaders are asked to link measures to efficiency, productivity, decision quality and reduced rework
    (APQC-KMEXEC-2026). EDRM counted at least 14 Legalweek 2026 sessions on validation and measurement
    (EDRM-LEGALWEEK-2026).
  evidence_grade: C
  sources:
  - {ref: APQC-KMEXEC-2026, title: "2026 KM Priorities & Trends: Executive Summary", publisher: APQC, type: survey, url: "https://www.apqc.org/resource-library/resource/2026-km-priorities-trends-executive-summary/html", date: "2026-05-12", access: full, locator: "'How can KM leaders prove business value and impact?'"}
  - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "ROI measurement; 'We're still gathering the data'"}
  - {ref: IMANAGE-INSIGHT-2026, title: "iManage Insight+: Discover institutional knowledge (product page; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/imanage-products/knowledge-search-management/insightplus/", date: "2026-10-19", access: full, locator: "'Connecting your content with context'"}
  - {ref: IMANAGE-EMEAFIRM-2026, title: "Global law firm, EMEA region: Insight+ replaces an in-house knowledge platform (customer story, firm unnamed; read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/global-law-firm-emea-region/", date: "2026-10-19", access: full, locator: "Planned analytics paragraph"}
  - {ref: VALS-VLAIR-2025, title: "Vals Legal AI Report (VLAIR)", publisher: Vals AI, type: vendor, url: "https://www.vals.ai/industry-reports/vlair-2-27-25", date: "2025-02-27", access: full, locator: "Introduction; Methodology; Acknowledgments"}
  - {ref: TRI-SOTLM-2026, title: "State of the US Legal Market 2026 analysis: Will the AI bubble burst? A crucial warning for law firms", publisher: Thomson Reuters Institute with Georgetown Law CELP, type: survey, url: "https://www.thomsonreuters.com/en/institute/articles/legal-market-report-2026-analysis-ai-bubble", date: "2026-01-14", access: full, locator: "Technology and KM spend paragraphs"}
  - {ref: DELTEK-CLARITY-2026, title: "The Latest Deltek Clarity Industry Studies Highlight AI Challenges, Talent Strain, and Delivery Capacity Pressures", publisher: Deltek, type: survey, url: "https://www.deltek.com/company/news/latest-deltek-clarity-industry-studies-highlight-ai-challenges/", date: "2026-05-12", access: full, locator: "A&E study paragraph"}
  - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives", publisher: Stanford Digital Economy Lab (Brynjolfsson) and USC (Petropoulos), type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Section on digital trace data and measurement"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Duties of Competence and Diligence row, p. 5"}
  - {ref: LAWSOC-GENAI-2026, title: "Generative AI: the essentials", publisher: Law Society of England and Wales, type: professional-body, url: "https://www.lawsociety.org.uk/topics/ai-and-lawtech/generative-ai-the-essentials", date: "2026", access: full, locator: "Lifecycle considerations"}
  - {ref: EDRM-LEGALWEEK-2026, title: "Legalweek 2026: (Select) Educational Sessions Preview (titles listed before the event)", publisher: EDRM, type: conference, url: "https://edrm.net/2026/03/legalweek-2026-select-educational-sessions-preview/", date: "2026-03-06", access: full, locator: "'Validation and Measurement'; KM sessions"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firms (Vals consortium, including Reed Smith, Fisher Phillips, McDermott Will & Emery and Ogletree
    Deakins; an unnamed global firm); A&E firms (Deltek). Grade C: no firm publishes search-success, reuse or retrieval
    test results for its own knowledge base. Testing tools on the firm's own work is
    professional-services-work-production-23 and logging edits and overrides is professional-services-work-production-24;
    AI ROI at firm level belongs to firm-finance. This entry holds measurement of the knowledge layer itself.
