- id: professional-services-knowledge-management-09
  title: Governed connections that let approved AI tools and agents search firm knowledge and save work back, logged and under each user's permissions
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - software-systems
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Lawyers use several AI products. Without a shared connection, each needs its own export of firm content, and users
    re-upload materials when they switch tools. A lawyer wanting to know how a similar issue was handled may not know the
    filename, folder or search terms, and the answer may sit across several systems (HARVEY-AGENTICSEARCH-2026). Work done
    in public AI tools sits outside the firm record and may not be privileged (GOODWIN-HEPPNER-2026).
  solution: >-
    The repository exposes a Model Context Protocol (MCP: an open standard for connecting AI tools to other systems)
    server so approved tools can search and save back under each user's existing permissions, with every retrieval and
    write-back logged (IMANAGE-MCP-2026). Announced: Legora's connection to the iManage MCP Server (LEGORA-IMANAGE-2026);
    an iManage plug-in for ChatGPT Enterprise (LAWSITES-IMANAGECHATGPT-2026); NetDocuments' MCP connections, in private
    preview (NETDOCUMENTS-CONTEXTGRAPH-2026). Harvey's agentic search plans its own search across iManage, SharePoint and
    Google Drive, returns cited results and pauses for the lawyer to review (HARVEY-AGENTICSEARCH-2026). DeepJudge released
    an open Agent Handoff Protocol for moving a user's context between AI products (LAWSITES-DEEPJUDGE-2026).
  outcomes:
  - lever: experience
    description: none published
    figure: none published
    measures: No measurements published for agentic search or the MCP connections
    provenance: vendor-published
    source_ref: HARVEY-AGENTICSEARCH-2026
  prerequisites:
  - "A governed source-of-truth repository with per-user permissions that the agent inherits (HARVEY-AGENTICSEARCH-2026; LEGORA-IMANAGE-2026)"
  - "Client and matter-level flags for confidentiality and AI processing; Womble Bond Dickinson plans to apply them when iManage makes the capability available (IMANAGE-WOMBLE-2026)"
  - "Client and engagement terms that allow the chosen AI tools to see the content"
  - "Retention rules covering AI prompts and outputs"
  risks_and_guardrails:
  - "Harvey says search uses each person's permissions in the connected system (HARVEY-AGENTICSEARCH-2026); iManage and Legora say iManage permissions determine what each user can retrieve (LEGORA-IMANAGE-2026)"
  - "Chaffetz Lindsey's principle is that data stays in the document platform and tools reach in rather than pull content out (IMANAGE-CHAFFETZ-2026)"
  - "Every file the Harvey agent touches in a Vault is logged in an audit trail (HARVEY-VAULT-2026)"
  - "California's guidance says a lawyer must not deploy an agentic system that permits autonomous external transmission of client information without safeguards and human review (CALBAR-GENAI-2026)"
  - "A US district court (Heppner, 2026-02) held a defendant's self-directed chats with a public AI tool were neither privileged nor work product; Goodwin advises attorney-directed, documented use and enterprise deployments (GOODWIN-HEPPNER-2026)"
  - "No public test of permission inheritance through these connectors was found"
  human_checkpoints:
  - "IT or KM approves which tools get connectors and which workspaces they may reach"
  - "The agent pauses for the lawyer to review results when more are available (HARVEY-AGENTICSEARCH-2026)"
  - "The lawyer reviews work saved back as a new version before it becomes part of the record"
  role_evolution: >-
    The ABA Journal columnist's takeaway from ILTACON 2026 was that legal AI is no longer developing in separate silos
    (ABAJ-ILTACON-2026). Lawyers describe what they need in plain language rather than choosing files first
    (HARVEY-AGENTICSEARCH-2026).
  evidence_grade: C
  sources:
  - {ref: IMANAGE-MCP-2026, title: "Securely Connect to AI Tools with Model Context Protocol (product page; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/imanage-products/the-imanage-platform/ai/model-context-protocol/", date: "2026-10-19", access: full, locator: "'Governed & auditable access'; 'Read and write, both governed'"}
  - {ref: LEGORA-IMANAGE-2026, title: "Legora and iManage deepen integration through iManage MCP Server (press release)", publisher: Legora, type: vendor, url: "https://legora.com/newsroom/legora-and-imanage-deepen-integration-through-imanage-mcp-server", date: "2026-10-16", access: full, locator: "Paragraphs 2-4"}
  - {ref: LAWSITES-IMANAGECHATGPT-2026, title: "iManage to Deliver Governed AI-Powered Knowledge Work in ChatGPT Enterprise (press release reproduced)", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/09/imanage-to-deliver-governed-ai-powered-knowledge-work-in-chatgpt-enterprise.html", date: "2026-09-21", access: full, locator: "Paragraphs 1-5"}
  - {ref: NETDOCUMENTS-CONTEXTGRAPH-2026, title: "NetDocuments Unveils the First Context Graph for Legal Work (press release)", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/company-news/netdocuments-unveils-context-graph-legal-platform/", date: "2026-05-14", access: full, locator: "Paragraphs on AI agents working via MCP through ndConnect"}
  - {ref: HARVEY-AGENTICSEARCH-2026, title: "Introducing Agentic Search for Your Document Systems", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/agentic-search-document-management-systems", date: "2026-09-30", access: full, locator: "Sections on describing what you need, permissions, availability"}
  - {ref: HARVEY-VAULT-2026, title: "Agentic Vault Search and Organization", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/agentic-vault-search-and-organization", date: "2026-09-08", access: full, locator: "Agent permissions and audit trail"}
  - {ref: LAWSITES-DEEPJUDGE-2026, title: "DeepJudge Releases an Open Protocol for Passing Users and Their Context Between AI Products", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/08/deepjudge-releases-an-open-protocol-for-passing-users-and-their-context-between-ai-products-with-harvey-and-thomson-reuters-on-board.html", date: "2026-08-13", access: full, locator: "Paragraphs 1-6"}
  - {ref: IMANAGE-WOMBLE-2026, title: "Womble Bond Dickinson UK lays an AI-ready foundation (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/womble-bond/", date: "2026-10-19", access: full, locator: "Section 'Building outward from a governed core'"}
  - {ref: IMANAGE-CHAFFETZ-2026, title: "Governance is a powerful differentiator at Chaffetz Lindsey (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/chaffetz-lindsey/", date: "2026-10-19", access: full, locator: "Director's comments on tools reaching in and MCP"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Duty of Confidentiality row, pp. 5-6"}
  - {ref: GOODWIN-HEPPNER-2026, title: "AI Chatbots, Privilege, and Pitfalls (client alert on United States v. Heppner, S.D.N.Y.)", publisher: Goodwin Procter LLP, type: firm, url: "https://www.goodwinlaw.com/en/insights/publications/2026/03/alerts-practices-ai-chatbots-privilege-and-pitfalls", date: "2026-03-03", access: full, locator: "'Attorney-Client Privilege'; 'Work Product Doctrine'; 'Recommendations'"}
  - {ref: ABAJ-ILTACON-2026, title: "ILTACON 2026: The race to connect the dots and the data (Nicole Black column)", publisher: ABA Journal, type: press, url: "https://www.abajournal.com/columns/article/iltacon-2026-and-the-race-to-connect-the-dots", date: "2026-09-02", access: full, locator: "'Finding partners' and closing paragraphs"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law-firm platforms; Chaffetz Lindsey (law firm) and Womble Bond Dickinson UK (law firm) describe intent,
    not a live connector. Tense matters: Legora 'announced plans to connect'; Harvey says agentic search is available now
    but must be switched on by Harvey, with no customer named; DeepJudge says Harvey is building an integration and Thomson
    Reuters 'will support' it. Heppner is one district court's ruling on its facts. Merges the governance dive's 'AI work
    product in the matter record' candidate.

- id: professional-services-knowledge-management-10
  title: Agents with scoped, logged access to document systems and knowledge bases that file work and update metadata between review gates
  archetype: professional-services
  module: knowledge-management
  function: technology-it
  work_types:
  - coordination-scheduling
  - document-production
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Filing documents, updating metadata and carrying matter context between steps are manual KM and administrative tasks.
    Agents could do them but need access broad enough to be useful and narrow enough to be safe.
  solution: >-
    Agents act through a governed gateway under the same permissions, ethical walls and audit logging as a person: iManage
    says its MCP server lets AI draft documents, file them in the right workspace and update metadata (IMANAGE-MCP-2026).
    Harvey's Legal Work Orchestration lets agents execute defined tasks while lawyers review at designated gates
    (HARVEY-ORCH-2026).
  outcomes:
  - lever: capacity
    description: none published
    figure: none published
    measures: No results published; both sources are product announcements
    provenance: vendor-published
    source_ref: IMANAGE-MCP-2026
  prerequisites:
  - "Agent identities with least-privilege rights (only the access each task needs)"
  - "Review gates defined per task"
  - "Audit logs reviewed by a named owner"
  risks_and_guardrails:
  - "California's guidance says the more autonomous the system, the more oversight is needed, and agentic systems connected to document systems and knowledge bases may disclose confidential information across matters (CALBAR-GENAI-2026, pp. 3-6)"
  - "The Law Society's April 2026 report says solicitors remain responsible for agentic outputs they cannot fully audit, and errors may repeat across matters (LAWSOC-AGENTICFUTURE-2026)"
  - "The Law Society's guidance page reports that the April 2026 report found no evidence that agentic AI is currently used in legal practice (LAWSOC-GENAI-2026)"
  human_checkpoints:
  - "Lawyer review at each designated gate before the next task starts (HARVEY-ORCH-2026)"
  - "Periodic review of agent permissions and logs"
  role_evolution: >-
    Harvey names innovation and knowledge teams as the authors of template structure (HARVEY-ORCH-2026). California says
    supervision must correspond to the level of access and autonomy (CALBAR-GENAI-2026, p. 5).
  evidence_grade: C
  sources:
  - {ref: IMANAGE-MCP-2026, title: "Securely Connect to AI Tools with Model Context Protocol (product page; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/imanage-products/the-imanage-platform/ai/model-context-protocol/", date: "2026-10-19", access: full, locator: "'Read and write, both governed'"}
  - {ref: HARVEY-ORCH-2026, title: "Making Harvey the Orchestration Layer for Legal Work", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/legal-work-orchestration", date: "2026-10-15", access: full, locator: "Introduction; 'Keep Reviews and Next Steps Moving'"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Executive summary pp. 2-3; Confidentiality row pp. 5-6"}
  - {ref: LAWSOC-AGENTICFUTURE-2026, title: "The future of agentic AI in legal practice (report summary page)", publisher: Law Society of England and Wales, type: professional-body, url: "https://www.lawsociety.org.uk/topics/research/the-future-of-agentic-ai-in-legal-practice", date: "2026-04-14", access: full, locator: "'Accountability frameworks do not yet fit autonomous systems'; 'Risks need urgent clarity'"}
  - {ref: LAWSOC-GENAI-2026, title: "Generative AI: the essentials", publisher: Law Society of England and Wales, type: professional-body, url: "https://www.lawsociety.org.uk/topics/ai-and-lawtech/generative-ai-the-essentials", date: "2026", access: full, locator: "Agentic AI paragraph"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law-firm platforms; no customer named. The only delegate-rung entry, and announced products only. Matter
    templates with agent tasks and review gates as a work-production design are in
    professional-services-work-production-15; this entry holds the knowledge-side filing and metadata work.

- id: professional-services-knowledge-management-11
  title: Building a searchable precedent database from the firm's own deal history and benchmarking terms against it
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - data-reporting
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Executed agreements hold what counterparties actually accepted, but relevant deals are spread across matters, folders
    and systems, so lawyers rely on generic clause examples or build comparison spreadsheets by hand
    (HARVEY-INDEMNITY-2026).
  solution: >-
    Ropes & Gray's director of practice technology says generative AI helped build a precedent library for a private
    equity client by extracting, analysing and comparing historical deal terms into a searchable database, so drafting
    follows the client's customary practice (HARVEY-ROPES-2025). Harvey describes the method: pick comparable deals,
    extract caps, baskets and survival periods into a review table, verify against citations, and add the executed
    agreement back after closing (HARVEY-INDEMNITY-2026).
  outcomes:
  - lever: quality
    description: No measurement published; the stated aim is drafting that matches the client's customary practice
    figure: none published
    measures: n/a
    provenance: self-reported
    source_ref: HARVEY-ROPES-2025
  prerequisites:
  - "Executed agreements held in a collection that can be queried (HARVEY-INDEMNITY-2026)"
  - "A specific question and deal parameters (transaction type, size, jurisdiction, buyer or seller side) to select a comparable set (HARVEY-INDEMNITY-2026)"
  risks_and_guardrails:
  - "Harvey cautions that a larger precedent set is not automatically better: mixing deals with different economics, structures or governing law can obscure more than it shows (HARVEY-INDEMNITY-2026)"
  - "Older agreements may reflect a negotiating posture that has since changed, and outliers should be identified before they are treated as the norm (HARVEY-INDEMNITY-2026)"
  human_checkpoints:
  - "The lawyer frames the question, chooses the comparable set and decides the negotiating position (HARVEY-INDEMNITY-2026)"
  - "Users click through citations to verify extracted data against the underlying document (HARVEY-INDEMNITY-2026)"
  role_evolution: >-
    Harvey says the manual work in precedent benchmarking is rarely the legal judgment itself (finding agreements,
    locating provisions, pulling terms into a grid), and that this is what the tool takes on (HARVEY-INDEMNITY-2026).
  evidence_grade: B
  sources:
  - {ref: HARVEY-ROPES-2025, title: "Theresa Spartichino (Ropes & Gray) on driving innovation (Innovation Spotlight interview)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/theresa-spartichino-on-driving-innovation", date: "2025-10-02", access: full, locator: "Answer on use cases: precedent library for a private equity client"}
  - {ref: HARVEY-INDEMNITY-2026, title: "Benchmarking an indemnification clause against your own deal history", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/indemnification-clauses-against-deal-history", date: "2026-09-25", access: full, locator: "Building the cohort, review tables, citation checks, adding closed deals back"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firm (Ropes & Gray), in a vendor-published interview. Harvey's post is a how-to, not evidence of use.
    Bulk extraction into review tables is professional-services-work-production-03; this entry holds the reuse of the
    firm's own precedent as a maintained knowledge asset.

- id: professional-services-knowledge-management-12
  title: Curated, owned collections as the grounding set for AI, with senior review before entry and sanitisation of client detail
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - review-assurance
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI answers are only as good as what they retrieve. Stores mix drafts, executed deals, counterparty markups and
    outdated templates, and nobody records why a document was judged final or good (DRAFTWISE-PRECEDENT-2025;
    AL-DIDOMENICO-2026). APQC finds most KM programmes early in maturity, with a culture that does not reward sharing as
    the top threat (APQC-KM-2026).
  solution: >-
    Knowledge teams run a submit, enrich, publish, maintain and archive workflow for collections of vetted precedents and
    point assistants at those collections first (IMANAGE-INSIGHT-2026). Womble Bond Dickinson keeps curation with named
    owners and a knowledge profile tagging confidentiality, client and AI-processing status (IMANAGE-WOMBLE-2026).
    McKinsey's data stewards check accuracy and sanitise content for client confidentiality (MCKINSEY-LILLI-2023). Draftwise
    describes gold-standard collections limited to firm-authored final documents, with partner validation and a feedback
    loop (DRAFTWISE-PRECEDENT-2025). Accenture authors describe an unnamed professional-services firm that set rules such as
    a minimum number of client examples to protect anonymity and had senior reviewers judge which past proposals and
    deliverables were reusable (CMR-ACCENTURE-2026).
  outcomes:
  - lever: quality
    description: Baseline KM maturity (cross-industry, not a result of this use case)
    figure: 59% in the two earliest maturity stages; 21% optimizing or innovating
    measures: Share of 164 APQC survey participants by self-rated KM programme maturity (data collected November 2025)
    provenance: independent
    source_ref: APQC-KM-2026
  - lever: quality
    description: Cultural barrier to reuse
    figure: 40% say culture does not incentivise knowledge sharing and reuse (top-ranked threat)
    measures: Share of 162 APQC respondents ranking this as a threat to KM success
    provenance: independent
    source_ref: APQC-KM-2026
  - lever: quality
    description: Professionals' stated need for grounded tools, and the access gap
    figure: 94% say AI tools must ground outputs in authoritative content; 41% of AI users lack tools built on verified professional content
    measures: Shares of professionals in Thomson Reuters' survey of 1,816 (March-April 2026); base for the 94% not stated
    provenance: vendor-published
    source_ref: TR-FOP-2026
  prerequisites:
  - "Named owners and a review cycle for each collection (IMANAGE-WOMBLE-2026)"
  - "Sponsorship, incentives to contribute and a record of why a document was final; DiDomenico says these are not technology problems (AL-DIDOMENICO-2026)"
  - "Documented processes and a fixed information architecture; the TRI premortem lists fragmented storage and undocumented exceptions among causes of a fictional agentic pilot failing (TRI-PREMORTEM-2026)"
  - "Rules for anonymising client detail before material enters shared collections or templates"
  risks_and_guardrails:
  - "APQC says AI can accelerate KM but exposes weaknesses in content quality, governance, taxonomy and ownership (APQC-KMEXEC-2026)"
  - "The Law Society says client confidential and personal data should not be used to create templates or test a generative AI system; use fictional data instead (LAWSOC-GENAI-2026)"
  - "The Law Society's April 2026 report says errors in an agentic system can be repeated rapidly across multiple matters (LAWSOC-AGENTICFUTURE-2026)"
  - "California requires periodic reassessment of an AI system's capabilities and risks, including when it is deployed for new tasks (CALBAR-GENAI-2026, p. 5)"
  - "Draftwise claims its platform can classify final versus draft automatically so manual curation need not be a prerequisite; the claim is unverified (DRAFTWISE-PRECEDENT-2025)"
  human_checkpoints:
  - "A KM lawyer or senior reviewer approves each asset before it enters a collection"
  - "Collection owners retire or refresh assets on a set cycle"
  - "KM validates an AI-drafted answer before it is filed into a precedent or answer bank"
  role_evolution: >-
    KM lawyers and senior partners become curators who decide which work is exemplary (DRAFTWISE-PRECEDENT-2025).
    DiDomenico argues firms should grow existing KM, library and research staff and recruit practising lawyers into these
    roles, since a single person with legal, business, data and AI skills mostly does not exist (AL-DIDOMENICO-2026).
  evidence_grade: B
  sources:
  - {ref: IMANAGE-INSIGHT-2026, title: "iManage Insight+: Discover institutional knowledge (product page; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/imanage-products/knowledge-search-management/insightplus/", date: "2026-10-19", access: full, locator: "'Curation toolset'"}
  - {ref: IMANAGE-WOMBLE-2026, title: "Womble Bond Dickinson UK lays an AI-ready foundation (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/womble-bond/", date: "2026-10-19", access: full, locator: "'The solution' (controlled curation model, knowledge profile)"}
  - {ref: MCKINSEY-LILLI-2023, title: "Meet Lilli, our generative AI tool that's a researcher, a time saver, and an inspiration (alumni-site copy; date from URL)", publisher: McKinsey & Company, type: firm, url: "https://www.mckinsey.com/alumni/news-and-events/global-news/firm-news/2023-10-lilli", date: "2023-10", access: full, locator: "Paragraph on data stewards"}
  - {ref: DRAFTWISE-PRECEDENT-2025, title: "Garbage In, Garbage Out: How to Build a Precedent Database Lawyers Can Trust", publisher: Draftwise, type: vendor, url: "https://www.draftwise.com/blog/garbage-in-garbage-out-how-to-build-a-precedent-database-your-lawyers-can-trust", date: "2025-09-24", access: full, locator: "'Create Gold Standard Collections'; partner validation"}
