    itself. Harvey interviews are vendor-published but carry the named firms' own statements; the ILTA, Thomson Reuters
    and iManage figures describe prevalence of controls, not outcomes. The gated rollout as a work-production control is
    professional-services-work-production-22; firm-built playbooks and agents are professional-services-work-production-17;
    matter templates are professional-services-work-production-15. Related: assurance-quality-management-02 (curated prompt
