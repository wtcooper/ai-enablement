- id: professional-services-knowledge-management-18
  title: "Knowledge teams curate the firm's AI know-how: approved tools, use cases, playbooks, practice-group leads and gated rollout"
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - coordination-scheduling
  - review-assurance
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI adoption is uneven: Troutman Pepper Locke noticed inconsistencies in who adopted AI and how much value they
    extracted (TROUTMAN-KM-2026). Staff turn to public tools when sanctioned ones are missing: 34% of professionals use
    unsanctioned AI (TR-FOP-2026).
  solution: >-
    Knowledge management is applied to AI itself. Troutman Pepper Locke curates approved AI tools, best practices, use
    cases and lessons learned in one repository, backed by a knowledge management and AI partner in a practice group
    (TROUTMAN-KM-2026). Lewis Silkin put knowledge lawyers at the front of adoption, with a Harvey lead per team
    (HARVEY-LEWISSILKIN-2025). Ropes & Gray built one-page tech stacks per practice group with its legal KM team
    (HARVEY-ROPES-2025). Gowling WLG's national director of AI, innovation and knowledge aims for durable playbooks, prompt
    patterns and repeatable workflows (HARVEY-GOWLING-2025). Latham & Watkins' innovation attorney role helps maintain a
    catalogue of approved AI capabilities for client work (LATHAM-INNOVATIONATTY-2026). Firms pair this with a policy,
    approved tools and training before access (CALBAR-GENAI-2026, p. 7).
  outcomes:
  - lever: risk
    description: Share of law firms with a formal GenAI policy, by firm size
    figure: 57% (under 50 lawyers); 80%; 85%; 98% (350-699); 91% (over 700)
    measures: Share of responding firms in each size band selecting 'A formal policy is in place', ILTA Q3.18 (508 firms)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Share of law firms requiring training before use, and client approval, by firm size
    figure: training 11% (under 50) to 72% (over 700); client approval 8% (under 50) to 38% (350-699)
    measures: Share of responding firms in each size band selecting each control, ILTA Q3.18
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Policy violations and public-tool use (cross-industry knowledge work)
    figure: 36% have experienced a policy violation; 25% say end users use public AI with little oversight
    measures: Shares of respondents in iManage's survey of over 3,000 business and technical decision makers
    provenance: vendor-published
    source_ref: IMANAGE-BENCH-2026
  prerequisites:
  - "Responsible-use policies and required training before attorneys use AI tools (TROUTMAN-KM-2026)"
  - "An AI task force and innovation committee that test tools (TROUTMAN-KM-2026)"
  - "Practice-group champions or leads who share use cases (HARVEY-LEWISSILKIN-2025)"
  - "A sanctioned tool good enough to displace public tools"
  risks_and_guardrails:
  - "Troutman Pepper Locke says it wants 'no laggards, and no leaders' inside each practice (TROUTMAN-KM-2026)"
  - "Lewis Silkin treats the rollout as a big experiment without a fixed view of the end state (HARVEY-LEWISSILKIN-2025)"
  - "California says managerial lawyers should set clear AI policies, give training and update controls as tools become more autonomous (CALBAR-GENAI-2026, p. 7)"
  - "The Ayinde court said leaders such as managing partners must take practical and effective measures so everyone using AI understands their duties, and it may ask whether they did (EWHC-AYINDE-2025, para 9)"
  - "The Bar Standards Board lists properly implemented IT systems and data governance among its good-practice principles (BSB-AIGUIDANCE-2026)"
  - "The EU AI Act's AI-literacy obligations have applied since 2025-02-02 (EC-AIACT-2026)"
  human_checkpoints:
  - "Practice-group knowledge partners and leads decide which tools, use cases and playbooks become firm guidance"
  - "Periodic review of the approved-tool list and policy"
  role_evolution: >-
    New or widened roles: a knowledge management and AI partner (TROUTMAN-KM-2026); knowledge lawyers as Harvey leads
    (HARVEY-LEWISSILKIN-2025); a national director spanning AI, innovation and knowledge (HARVEY-GOWLING-2025). Eversheds
    Sutherland merged research and knowledge services into an AI-centric US innovation department (AL-EVERSHEDS-2026); K&L
    Gates created a Global AI and Innovation Partner role including data and knowledge management (AL-X4-2026); Gilchrist
    Connell added a chief AI and knowledge officer (LAWYERSWEEKLY-GILCHRIST-2026). Harvey names innovation and knowledge
    teams as authors of reusable matter templates (HARVEY-ORCH-2026).
  evidence_grade: B
  sources:
  - {ref: TROUTMAN-KM-2026, title: "A merger of the minds: the role of knowledge management in AI adoption", publisher: Troutman Pepper Locke, type: firm, url: "https://www.troutman.com/insights/a-merger-of-the-minds-the-role-of-knowledge-management-in-ai-adoption/", date: "2026-04-29", access: full, locator: "Paragraphs on the KM and AI partner and the AI knowledge repository"}
  - {ref: HARVEY-LEWISSILKIN-2025, title: "Alex Bazin (Lewis Silkin) on empowering teams with legal AI (Innovation Spotlight interview)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/alex-bazin-on-empowering-teams-with-legal-ai", date: "2025-11-27", access: full, locator: "Answers on adoption approach"}
  - {ref: HARVEY-ROPES-2025, title: "Theresa Spartichino (Ropes & Gray) on driving innovation (Innovation Spotlight interview)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/theresa-spartichino-on-driving-innovation", date: "2025-10-02", access: full, locator: "Answer on one-page tech stacks with Legal KM"}
  - {ref: HARVEY-GOWLING-2025, title: "Al Hounsell (Gowling WLG) on driving legal transformation that lasts (Innovation Spotlight interview)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/al-hounsell-on-driving-legal-transformation-that-lasts", date: "2025-10-30", access: full, locator: "Biography; answers on playbooks and prompt patterns"}
