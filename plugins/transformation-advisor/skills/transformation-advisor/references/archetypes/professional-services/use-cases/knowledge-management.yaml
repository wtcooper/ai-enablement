- id: professional-services-knowledge-management-13
  title: In-house legal department knowledge base of standards, precedents and prior decisions that AI draws on, governed by legal operations
  archetype: professional-services
  module: knowledge-management
  function: risk-compliance-legal
  work_types:
  - research-synthesis
  - coordination-scheduling
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    In-house legal teams hold years of documents and prior advice across fragmented systems, while pressure from the
    business for AI lands on legal operations (TRI-LDOR-2026).
  solution: >-
    BMW Group's legal function announced a Legora rollout for research, review and drafting, including first drafts based
    on approved internal standards and precedents, and says it is meant to strengthen knowledge management
    (LEGORA-BMW-2026). Rio Tinto's legal team moved 4.5 million documents to a cloud platform and is considering
    natural-language queries across them (IMANAGE-RIOTINTO-2026). Harvey describes a 'legal brain' in which a department's
    policies, prior decisions and outcomes feed agents (HARVEY-INHOUSE-2026). Legal operations selects and governs the tools
    and asks outside firms what AI they use; GSK says it is learning from its outside firms how they use generative AI
    (TRI-LEGALWEEK-2026).
  outcomes:
  - lever: experience
    description: Adoption of the document platform at Rio Tinto's legal team (not an AI feature)
    figure: 80% adoption after four months
    measures: Adoption of the iManage platform across 210 legal-team staff, per a vendor case study quoting Rio Tinto's digital transformation lead
    provenance: vendor-published
    source_ref: IMANAGE-RIOTINTO-2026
  - lever: capacity
    description: Shift of general counsel priorities toward technology
    figure: twice the share of GCs name technology their top strategic priority
    measures: General counsel respondents to the 2026 Legal Department Operations Report versus 2025, as summarised by the Thomson Reuters Institute (base not captured)
    provenance: vendor-published
    source_ref: TRI-LDOR-2026
  prerequisites:
  - "Approved internal standards and precedents to ground first drafts (LEGORA-BMW-2026)"
  - "A migrated, centralised document estate; Rio Tinto has legal assets going back 20 years (IMANAGE-RIOTINTO-2026)"
  - "Outside counsel guidelines that address AI use and reporting"
  risks_and_guardrails:
  - "BMW says the platform is implemented in line with its access, security and governance requirements (LEGORA-BMW-2026)"
  - "Harvey's vision has legal set what agents may resolve and when review is required, with a full audit log of agent and human actions (HARVEY-INHOUSE-2026)"
  - "An in-house chief legal officer asks whether departments will control, and be able to take with them, the 'legal memory' held in shared AI systems, or rent it (BLOOMBERGLAW-GCXAI-2026)"
  - "Clients differ: some demand AI savings and AI line items, others forbid AI use without explicit permission (TRI-LEGALWEEK-2026)"
  human_checkpoints:
  - "Legal decides what agents can handle and where people make the call (HARVEY-INHOUSE-2026)"
  - "Lawyers verify prior advice retrieved by AI before relying on it"
  role_evolution: >-
    BMW's group general counsel says the tools expand capacity to handle work in-house while keeping lawyers on the most
    complex matters (LEGORA-BMW-2026). At Rio Tinto the digital transformation team, rather than IT, manages the platform
    (IMANAGE-RIOTINTO-2026). The Thomson Reuters Institute describes legal operations as becoming its own practice area
    (TRI-LDOR-2026).
  evidence_grade: B
  sources:
  - {ref: LEGORA-BMW-2026, title: "Legora collaborates with BMW Group to advance AI-enabled legal services", publisher: Legora, type: vendor, url: "https://legora.com/newsroom/legora-collaborates-with-bmw-group-to-advance-ai-enabled-legal-services", date: "2026-10-08", access: full, locator: "Opening paragraph; first drafts from approved standards and precedents"}
  - {ref: IMANAGE-RIOTINTO-2026, title: "Rio Tinto makes institutional knowledge more accessible and actionable with iManage (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/rio-tinto/", date: "2026-10-19", access: full, locator: "Migration of 4.5 million documents, 80 percent adoption, AI plans"}
  - {ref: HARVEY-INHOUSE-2026, title: "Building a frontier in-house organization", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/building-a-frontier-in-house-organization", date: "2026-10-13", access: full, locator: "Paragraphs on the department's knowledge and review playbooks"}
  - {ref: TRI-LDOR-2026, title: "2026 Legal Department Operations Report", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/legal-department-operations-report-2026", date: "2026-09-22", access: full, locator: "Key takeaways"}
  - {ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: Firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "Remarks by GSK; 'The contradictions in the room'"}
  - {ref: IMANAGE-LEGALOPS-2026, title: "Global legal operations customer (customer story, organisation unnamed; read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/global-legal-operations-customer/", date: "2026-10-19", access: full, locator: "Paragraphs on evaluating AI and declining the module"}
  - {ref: BLOOMBERGLAW-GCXAI-2026, title: "GC x AI Retrospective: The Billable Hour, Like a Twinkie, Endures (in-house CLO column)", publisher: Bloomberg Law, type: press, url: "https://news.bloomberglaw.com/business-and-practice/gc-x-ai-retrospective-the-billable-hour-like-a-twinkie-endures", date: "2026-10-19", access: full, locator: "Section 'What Came True', paragraph on legal memory (routed from the client-development deep dive)"}
  last_reviewed: "2026-10-19"
  notes: >-
    In-house throughout (BMW Group, Rio Tinto, GSK). BMW's release is a vendor announcement quoting its general counsel,
    so maturity is 'announced'. Rio Tinto's figure concerns document-platform adoption and supports the prerequisite (a
    findable estate), not an AI effect. An anonymous in-house legal operations customer declined an expensive AI module
    after a cost-benefit analysis (IMANAGE-LEGALOPS-2026). AI-first in-house work is
    professional-services-work-production-19.

- id: professional-services-knowledge-management-14
  title: In-house legal decisions captured as reusable positions, each approved by an attorney before it takes effect
  archetype: professional-services
  module: knowledge-management
  function: risk-compliance-legal
  work_types:
  - expert-judgment
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    In-house legal teams make thousands of judgment calls a year; the answer to the next similar request depends on
    which attorney picks it up, and knowledge leaves when attorneys move on (AL-COHESO-2026).
  solution: >-
    Coheso Memory (an in-house legal front-door platform, launched October 2026) proposes positions from resolved
    requests, each with reasoning, conditions, exceptions and prior matters, and surfaces the precedent when a similar
    request arrives; nothing takes effect until an attorney approves it (AL-COHESO-2026).
  outcomes:
  - lever: quality
    description: none published; the vendor says answers become faster and more consistent
    figure: none published
    measures: n/a
    provenance: vendor-published
    source_ref: AL-COHESO-2026
  prerequisites:
  - "Requests and resolutions run through one system, so decisions are recorded as they happen"
  - "Attorney time to approve or reject proposed positions"
  risks_and_guardrails:
  - "Coheso says its engineering went into deciding whether a resolved request should become a position at all, and separating one matter's particulars from reusable guidance (AL-COHESO-2026)"
  human_checkpoints:
  - "An attorney approves each proposed position before it takes effect (AL-COHESO-2026)"
  role_evolution: >-
    Coheso says departments keep institutional knowledge when attorneys leave (AL-COHESO-2026); a vendor statement, not a
    reported outcome.
  evidence_grade: C
  sources:
  - {ref: AL-COHESO-2026, title: "Legal Front Door Coheso Launches 'Memory' (AL Interview)", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/10/08/legal-front-door-coheso-launches-memory-al-interview/", date: "2026-10-08", access: full, locator: "Paragraphs 1-6; answers on approval"}
  last_reviewed: "2026-10-19"
  notes: In-house product; no customer named. Intake routing itself belongs to acceptance-risk.

- id: professional-services-knowledge-management-15
  title: Engagement knowledge captured at close-out, with AI-drafted retrospectives and lessons learned filed to a searchable base
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - document-production
  - research-synthesis
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Lessons from finished engagements rarely reach the next team because writing them up is extra work at project close;
    too much expertise stays locked in decks or in consultants' heads (CERTINIA-VEDA-2026; KANTATA-ENGINE-2025).
  solution: >-
    Project capture is automated so outputs, tags and summaries flow into a searchable repository. At KMWorld Europe 2026,
    Alvarez & Marsal described a regional KM repository with automated project capture and defined KM roles; Simon-Kucher
    & Partners presented WeKnow, an automated knowledge-capturing system with intelligent tagging and semantic search; AECOM
    described a KM framework for programme management that includes adopting AI (KMWORLD-EUROPE-2026). Certinia lists a
    Retrospective Drafter agent and a Knowledge Base agent that organise lessons into a firm-wide base (CERTINIA-VEDA-2026);
    Kantata describes an engine in which each engagement strengthens the next (KANTATA-ENGINE-2025).
  outcomes:
  - lever: capacity
    description: none published; the session abstracts describe the work and lessons, not measurements
    figure: none published
    measures: n/a
    provenance: self-reported
    source_ref: KMWORLD-EUROPE-2026
  prerequisites:
  - "Engagement records (SOWs, meeting notes, decisions, outcomes) created in systems that capture them (CERTINIA-VEDA-2026)"
  - "Defined KM roles; the A&M abstract describes a grassroots culture where mandates are rare (KMWORLD-EUROPE-2026)"
  - "A sanitisation step so client-identifying detail does not enter a firm-wide base"
  risks_and_guardrails:
  - "A NYC Bar opinion says that even with consent a lawyer should avoid entering details that identify the client, and shared bases mixing clients can breach ethical walls (NYCBAR-OP2024-5-2024, pp. 2-4)"
  - "APQC's article says AI used for KM should be built on validated, trustworthy knowledge (KMWORLD-APQC-2026)"
  - "The Simon-Kucher abstract does not say whether generative AI is used (KMWORLD-EUROPE-2026)"
  - "Certinia says its agents act within the permissions, approval thresholds and auditability the organisation requires (CERTINIA-VEDA-2026)"
  human_checkpoints:
  - "The project lead and a responsible partner approve the retrospective before filing"
  - "The KM team reviews entries for client-identifying detail"
  role_evolution: >-
    The A&M abstract reports KM roles defined within three years without executive sponsorship; Buro Happold's KM team
    presented communities of practice as still vital for tacit insight despite AI (KMWORLD-EUROPE-2026).
  evidence_grade: B
  sources:
  - {ref: KMWORLD-EUROPE-2026, title: "KMWorld Europe 2026 Full Programme Listing", publisher: KMWorld, type: conference, url: "https://www.kmworld.com/Europe/2026/Programme.aspx", date: "2026-04", access: full, locator: "KMW203 (A&M, Simon-Kucher), KMW402 (AECOM), KMW102 (Buro Happold)"}
  - {ref: CERTINIA-VEDA-2026, title: "Certinia AI and Veda agents", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10", access: full, locator: "'Value capture & knowledge transfer'; Knowledge Base and Retrospective Drafter agents"}
  - {ref: KANTATA-ENGINE-2025, title: "Kantata unveils the Kantata Expertise Engine (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-unveils-the-kantata-expertise-engine-the-first-ai-platform-purpose-built-for-professional-services-transformation", date: "2025-10-09", access: full, locator: "Continuous learning paragraph"}
  - {ref: KMWORLD-APQC-2026, title: "The Next Edge in Knowledge Management: KM for the Modern Workforce and the Era of AI (Lynda Braksiek, APQC)", publisher: KMWorld, type: press, url: "https://www.kmworld.com/Articles/Editorial/Features/The-Next-Edge-in-Knowledge-Management-KM-for-the-Modern-Workforce-and-the-Era-of-AI-173630.aspx?pageNum=2", date: "2026-03-09", access: full, locator: "Paragraphs on lessons learned and AI in KM"}
  - {ref: NYCBAR-OP2024-5-2024, title: "Formal Opinion 2024-5: Ethical Obligations of Lawyers and Law Firms Relating to the Use of Generative Artificial Intelligence in the Practice of Law", publisher: "New York City Bar Association, Professional Ethics Committee", type: professional-body, url: "https://www.nycbar.org/wp-content/uploads/2024/08/20221329_GenerativeAILawPractice.pdf", date: "2024-08-07", access: full, locator: "Confidentiality and Conflicts rows, pp. 2-4"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: consulting and advisory (Alvarez & Marsal, Simon-Kucher & Partners), engineering (AECOM, Buro Happold).
    B reflects named firms describing deployed KM work in abstracts for sessions held 14-15 April 2026; only abstracts
    were read and whether generative AI is used at A&M and Simon-Kucher is unclear. Certinia and Kantata items are
    vendor catalogue entries. Kantata Converge (scheduled 2026-11-17) lists capturing expertise as an agenda question; not
    used for any grade. The delivery-management deep dives route the same Certinia agents here and hold the close-out step
    of delivery.

- id: professional-services-knowledge-management-16
  title: AI transcription and summaries of calls and meetings as a knowledge-capture source, within recording and consent rules
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - document-production
  - data-reporting
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Know-how stays in conversation. Meeting summaries could feed matter records and knowledge bases, but recording raises
    consent, confidentiality and tactical risks.
  solution: >-
    AI tools record, transcribe and summarise calls so notes and decisions can be filed to the matter or knowledge base;
    Certinia's feature list describes turning meeting conversations into clear summaries (CERTINIA-VEDA-2026).
  outcomes:
  - lever: capacity
    description: none published
    figure: none published
    measures: No time-saved or accuracy figures found for professional-services use
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  prerequisites:
  - "A consent practice for all call participants"
  - "A rule on where transcripts and summaries are stored and how long they are kept"
  - "A decision on which summaries may enter shared knowledge"
  risks_and_guardrails:
  - "NYC Bar Formal Opinion 2026-2 (2026-08-05) says an attorney should obtain all other parties' consent before recording and, by default, avoid recording non-client conversations absent good reason (NYCBAR-OP2026-2-2026)"
  - "Confidential client information must not go into AI systems that share it with third parties without informed consent (NYCBAR-OP2024-5-2024, pp. 2-3)"
  - "Chats with a public AI tool were held not privileged in Heppner, so transcripts held in consumer tools may be discoverable (GOODWIN-HEPPNER-2026)"
  human_checkpoints:
  - "The lawyer decides in each instance whether to record at all"
  - "The lawyer checks a summary before it is filed or shared"
  role_evolution: No role change reported in the sources.
  evidence_grade: C
  sources:
  - {ref: NYCBAR-OP2026-2-2026, title: "NYC Bar Association Releases Formal Opinion on Ethical Use of AI for Recording, Transcribing, and Summarizing Non-Client Conversations (press release for Formal Opinion 2026-2)", publisher: New York City Bar Association, type: professional-body, url: "https://www.nycbar.org/press-releases/nyc-bar-association-releases-formal-opinion-on-ethical-use-of-ai-for-recording-transcribing-and-summarizing-non-client-conversations/", date: "2026-08-17", access: full, locator: "Press release text (opinion issued 2026-08-05)"}
  - {ref: NYCBAR-OP2024-5-2024, title: "Formal Opinion 2024-5: Ethical Obligations of Lawyers and Law Firms Relating to the Use of Generative Artificial Intelligence in the Practice of Law", publisher: "New York City Bar Association, Professional Ethics Committee", type: professional-body, url: "https://www.nycbar.org/wp-content/uploads/2024/08/20221329_GenerativeAILawPractice.pdf", date: "2024-08-07", access: full, locator: "Duty of Confidentiality row, pp. 2-3"}
  - {ref: GOODWIN-HEPPNER-2026, title: "AI Chatbots, Privilege, and Pitfalls (client alert on United States v. Heppner, S.D.N.Y.)", publisher: Goodwin Procter LLP, type: firm, url: "https://www.goodwinlaw.com/en/insights/publications/2026/03/alerts-practices-ai-chatbots-privilege-and-pitfalls", date: "2026-03-03", access: full, locator: "'Key Takeaways'"}
  - {ref: CERTINIA-VEDA-2026, title: "Certinia AI and Veda agents", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10", access: full, locator: "'Frictionless operations & delivery' entry"}
  last_reviewed: "2026-10-19"
  notes: >-
    Mainly a constraint on a common capture step. The NYC Bar 2026 opinion covers non-client conversations; client calls
    fall under the 2024 opinion. Only the press release for Opinion 2026-2 was read.

- id: professional-services-knowledge-management-17
  title: Briefs from institutional memory when someone joins a live matter or prepares for a client call
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - client-interaction
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    A new team member on a complex matter spends time reconstructing context that already exists in documents, emails and
    prior decisions. At Basware's services organisation, customer success managers spent hours each day researching an
    account before each call (KANTATA-BASWARE-2026).
  solution: >-
    At Chaffetz Lindsey, an assistant that can search all matter documents summarises the matter and compares how similar
    matters were handled (IMANAGE-CHAFFETZ-2026). A Kantata release presents Basware's AI-enabled services approach as
    freeing managers from pre-call research, without naming the tool (KANTATA-BASWARE-2026). Platforms propose automatic
    briefs: NetDocuments' matter overview with parties, dates, team and timeline (LAWSITES-NETDOCS-2026), and Kantata's
    Expertise Agent, launched 2026-06-16, with a role-specific brief from SOWs, meeting notes and decisions
    (KANTATA-AGENT-2026; ERPTODAY-KANTATA-2026). Ascend's CEO says research, benchmarking and context can be generated
    from a calendar invite before a meeting (AT-AINATIVE-2026).
  outcomes:
  - lever: speed
    description: Chaffetz Lindsey's director says a new team member gets up to speed on an active trial faster; no measurement
    figure: days rather than weeks
    measures: Time to get a new team member up to speed on an active trial, as described in the vendor case study (qualitative)
    provenance: vendor-published
    source_ref: IMANAGE-CHAFFETZ-2026
  - lever: capacity
    description: Basware's Chief Customer Officer says time once spent on research is now spent on the phone with customers
    figure: four to five hours a day
    measures: Hours a day customer success managers previously spent researching before a call, per a Kantata press release quoting the executive (recollection; no method)
    provenance: vendor-published
    source_ref: KANTATA-BASWARE-2026
  prerequisites:
  - "A matter-centric repository where all work product is filed (IMANAGE-CHAFFETZ-2026)"
  - "Per-user permissions and ethical walls that carry through to the brief (NETDOCUMENTS-CONTEXTGRAPH-2026)"
  - "A services platform in place first: Basware began with billing automation before resourcing and delivery (KANTATA-BASWARE-2026)"
  risks_and_guardrails:
  - "The brief must not expose material behind an ethical wall; NetDocuments says its graph preserves permissions and walls (NETDOCUMENTS-CONTEXTGRAPH-2026)"
  - "No accuracy checks on generated matter summaries are published"
  - "The Basware statement that the capacity 'could' let the company double revenue with its existing team is the executive's view, not a result (KANTATA-BASWARE-2026)"
  human_checkpoints:
  - "The matter or engagement lead reviews the brief before the new joiner relies on it"
  - "The new team member still reads the key documents"
  role_evolution: >-
    Basware's managers shift from research to time on the phone with customers (KANTATA-BASWARE-2026). NetDocuments frames
    the matter overview as reducing a new associate's orientation time (LAWSITES-NETDOCS-2026).
  evidence_grade: B
  sources:
  - {ref: IMANAGE-CHAFFETZ-2026, title: "Governance is a powerful differentiator at Chaffetz Lindsey (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/chaffetz-lindsey/", date: "2026-10-19", access: full, locator: "Paragraph beginning 'Ask iManage transformed how the firm finds and uses knowledge'"}
  - {ref: KANTATA-BASWARE-2026, title: "Kantata takes Basware from AI experimentation to results (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-takes-basware-from-ai-experimentation-to-results", date: "2026-10-13", access: full, locator: "Section 'From Efficiency to Impact'"}
