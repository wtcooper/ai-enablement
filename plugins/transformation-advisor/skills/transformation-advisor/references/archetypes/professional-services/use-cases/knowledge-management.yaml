# Use cases: professional-services / knowledge-management
# Sources checked 2026-10-19. 23 entries: A 0, B 14, C 8, D 1. Merged from 48 candidates in three deep dives
# (practice 16, discourse 17, governance 15) plus items routed here from the acceptance-risk, client-development,
# delivery-management, firm-finance, pursuit-proposals, staffing-resourcing and talent-learning deep dives.
# No firm, consultancy or in-house team publishes a measured outcome (error rate, override rate, search success,
# permission-leakage test, parallel run) for its own knowledge base, enterprise search or precedent assistant, so no
# entry reaches grade A. Named examples are mostly law firms and in-house legal teams on vendor-hosted pages; consulting
# rests on McKinsey (second-hand figures), accounting on one podcast. Substantive drafting, extraction and review sit in
# work-production; audit, tax and security practice sit in their own archetypes. Overlaps are named by full id in notes.

- id: professional-services-knowledge-management-01
  title: AI search over a curated precedent and know-how library, under the firm's existing permissions
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Lawyers cannot quickly find the precedent or template they want in a growing collection; at Allens, browsing
    through SharePoint was meant only as an interim fix (IMANAGE-ALLENS-2026). ILTA's 2026 survey summary says
    knowledge infrastructure "remains dramatically underdeveloped" across enterprise search and expertise management
    (ILTA-TECHSURVEY-2026, p. 9).
  solution: >-
    The knowledge team keeps a curated library of precedents and templates, with a taxonomy (an agreed set of
    categories), inside the document management system (DMS: the firm's governed store of matter documents). An AI
    search layer surfaces relevant documents in context, with favourites and team-pinned standard documents. Allens and
    Womble Bond Dickinson UK use iManage Insight+ (IMANAGE-ALLENS-2026; IMANAGE-WOMBLE-2026). Comparable products were
    launched or announced in 2025-26: Litera Firm AI Search, Thomson Reuters CoCounsel Knowledge Search, NetDocuments
    SmartSearch (private preview) and DeepJudge with Harvey (LAWSITES-ILTACON4-2026; AL-TRKNOWLEDGE-2025;
    LAWSITES-NETDOCS-2026; LAWSITES-HARVEYDJ-2026).
  outcomes:
  - lever: experience
    description: Insight+ search extended to legal staff across Allens; positive feedback reported, no usage or time measures
    figure: 1,350 legal staff
    measures: Legal staff at Allens who 'now benefit from' the Insight+ search experience (an access count in a vendor case study)
    provenance: vendor-published
    source_ref: IMANAGE-ALLENS-2026
  - lever: experience
    description: Headline statistics on the Womble Bond Dickinson UK story; the text gives no share of lawyers using search
    figure: 1,250 Insight+ users; 600 lawyers
    measures: Figures labelled 'Insight+ users' and 'lawyers' in the vendor case study
    provenance: vendor-published
    source_ref: IMANAGE-WOMBLE-2026
  - lever: capacity
    description: Adoption snapshot from a live poll at one ILTACON 2025 knowledge session, not an outcome of search
    figure: 44 of 89 piloting AI tools; 16 in firmwide deployment; 6 not started
    measures: Attendees at one ILTACON 2025 session who answered a live poll, as reported by a vendor (Draftwise)
    provenance: vendor-published
    source_ref: DRAFTWISE-ILTACON-2025
  prerequisites:
  - "A curated library with an existing taxonomy; Allens' head of knowledge says the vendor's team was impressed by the curation and taxonomy already in place (IMANAGE-ALLENS-2026)"
  - "Womble Bond Dickinson cut a two-decade taxonomy to a maximum of four nodes before migration and added search facets and metadata tagging (IMANAGE-WOMBLE-2026)"
  - "Scanned and image-only files made searchable; iManage says its native OCR (text recognition) addresses this (LAWSITES-IMANAGE-2026)"
  - "Permissions and ethical walls (screens that keep named staff away from a matter's information) carried through to the search layer (LAWSITES-HARVEYDJ-2026)"
  - "Practice-group training and influential lawyer champions (IMANAGE-ALLENS-2026)"
  risks_and_guardrails:
  - "Allens' Chief Knowledge Officer says there is a risk lawyers take the path of least resistance rather than locating the most relevant template (IMANAGE-ALLENS-2026)"
  - "Womble Bond Dickinson's head of IT applications says AI will not necessarily distinguish good-quality content from content it should not serve up (IMANAGE-WOMBLE-2026)"
  - "A practitioner at ILTACON 2025 said language models are not good search engines: retrieve the top documents first, then pass them to the model (DRAFTWISE-ILTACON-2025)"
  - "Where an AI system uses client information, the firm must apply required ethical screens so a screened lawyer is not exposed through it (NYCBAR-OP2024-5-2024, pp. 3-4)"
  - "California's guidance says agentic systems that reach knowledge bases or document systems can disclose confidential information across matters if poorly configured; lawyers must limit and monitor access (CALBAR-GENAI-2026, pp. 5-6)"
  - "No search-success, precision or permission-leakage test results are published in any source read"
  human_checkpoints:
  - "Knowledge team curates, classifies and retires content before it is searchable (IMANAGE-WOMBLE-2026)"
  - "The lawyer chooses which retrieved precedent applies to the matter"
  - "IT and KM owners test that a user behind an ethical wall cannot retrieve that matter's material, before and after rollout"
  role_evolution: >-
    Allens' knowledge team spends more effort on curation, taxonomy, pinning standard documents, training and finding
    champions (IMANAGE-ALLENS-2026). In an unnamed global firm's story, knowledge lawyers still draft templates and answer
    queries while KM professionals run the systems (IMANAGE-EMEAFIRM-2026). ILTA reports that many firms anticipate added
    headcount in knowledge management among other functions (ILTA-TECHSURVEY-2026, p. 5).
  evidence_grade: B
  sources:
  - {ref: IMANAGE-ALLENS-2026, title: "Allens taps into goldmine of enterprise knowledge with Insight+ (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/allens-insightplus/", date: "2026-10-19", access: full, locator: "Intro; 'The business challenge'; 'The solution'"}
  - {ref: IMANAGE-WOMBLE-2026, title: "Womble Bond Dickinson UK lays an AI-ready foundation (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/womble-bond/", date: "2026-10-19", access: full, locator: "Headline statistics; 'The solution'; 'The business outcomes'"}
  - {ref: IMANAGE-EMEAFIRM-2026, title: "Global law firm, EMEA region: Insight+ replaces an in-house knowledge platform (customer story, firm unnamed; read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/global-law-firm-emea-region/", date: "2026-10-19", access: full, locator: "Paragraphs on go-live, user testers and planned analytics"}
  - {ref: ILTA-TECHSURVEY-2026, title: "2026 ILTA Technology Survey: Executive Summary", publisher: International Legal Technology Association (ILTA), type: survey, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "p. 9 'Curtain Call for the Data Center'; p. 5 headcount"}
  - {ref: LAWSITES-ILTACON4-2026, title: "ILTACON News Round-Up Part 4, The Business of Law", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/09/iltacon-news-round-up-part-4-the-business-of-law-litera-aderant-oddr-tre-ai-intapp.html", date: "2026-09-04", access: full, locator: "Litera section, Firm AI Search"}
  - {ref: AL-TRKNOWLEDGE-2025, title: "Thomson Reuters Launches CoCounsel Knowledge Search", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2025/07/09/thomson-reuters-launches-cocounsel-knowledge-search/", date: "2025-07-09", access: full, locator: "Paragraphs 1-3"}
  - {ref: LAWSITES-NETDOCS-2026, title: "NetDocuments Unveils Legal Context Graph to Map Legal Knowledge Alongside a Reimagined Platform", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/netdocuments-unveils-legal-context-graph-to-map-legal-knowledge-alongside-a-reimagined-platform.html", date: "2026-05-14", access: full, locator: "Feature list (SmartSearch)"}
  - {ref: LAWSITES-HARVEYDJ-2026, title: "Harvey Launches Command Center for Managing Enterprise AI Adoption and Partners with DeepJudge on Institutional Knowledge", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/harvey-launches-command-center-for-managing-enterprise-ai-adoption-and-partners-with-deepjudge-on-institutional-knowledge.html", date: "2026-05-20", access: full, locator: "DeepJudge partnership section"}
  - {ref: LAWSITES-IMANAGE-2026, title: "iManage Unveils Next Evolution of Platform at ConnectLive 2026 (press release reproduced)", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/imanage-unveils-next-evolution-of-platform-at-connectlive-2026-as-organizations-prepare-for-the-next-era-of-ai-ready-knowledge-work.html", date: "2026-05-22", access: full, locator: "Insight+ multi-region search and native OCR paragraphs"}
  - {ref: DRAFTWISE-ILTACON-2025, title: "Key Takeaways from ILTACON 2025", publisher: Draftwise, type: vendor, url: "https://www.draftwise.com/blog/key-takeaways-from-iltacon-2025-from-demos-to-day-to-day-impact", date: "2025-08-19", access: full, locator: "Section 1 'Search Is the Starting Line'; pilot poll paragraph"}
  - {ref: NYCBAR-OP2024-5-2024, title: "Formal Opinion 2024-5: Ethical Obligations of Lawyers and Law Firms Relating to the Use of Generative Artificial Intelligence in the Practice of Law", publisher: "New York City Bar Association, Professional Ethics Committee", type: professional-body, url: "https://www.nycbar.org/wp-content/uploads/2024/08/20221329_GenerativeAILawPractice.pdf", date: "2024-08-07", access: full, locator: "Confidentiality and Conflicts rows, pp. 2-4"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Duty of Confidentiality row, pp. 5-6"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firms (Allens; Womble Bond Dickinson UK); two further iManage stories are anonymous (a global law
    firm's EMEA region, six months to go live for the knowledge team with about 130 user testers and plans for search
    analytics; an independent regulatory body with about 15,000 precedent documents) and support notes only. All
    named-firm evidence is vendor-authored. The Litera, Thomson Reuters, NetDocuments and DeepJudge products are
    launches without named customers. Related: tax-research-advisory-05 (knowledge assistant over a tax function's own
    memos), assurance-quality-management-12 (guidance assistant grounded in audit manuals), security-operations-02
    (precedent retrieval of how similar alerts were closed).

- id: professional-services-knowledge-management-02
  title: Asking questions of the firm's own documents to find clauses and compare precedents, in the document system or in Word
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    A transactional lawyer remembers a good clause from a prior deal but loses time hunting through folders, and may
    land on an unexecuted draft or a counterparty's markup (DRAFTWISE-PRECEDENT-2025). Staff open files one by one or
    rely on remembering where a document sits (IMANAGE-BICALHO-2026).
  solution: >-
    An assistant built into the DMS answers plain-language questions against the firm's own documents and returns
    marked citations, without moving content outside the governed platform (Ask iManage at Chaffetz Lindsey, Bicalho
    Navarro and Digital Commerce Bank; NetDocuments markets a comparable ndMAX assistant) (IMANAGE-CHAFFETZ-2026;
    IMANAGE-BICALHO-2026; IMANAGE-DCB-2026; NETDOCUMENTS-NDMAX-2026). Inside Word, precedent tools search past documents
    for matching clauses and some rewrite them for the current deal: Spellbook Library, Litera One Precedent (beta, July
    2025) and SimpleDocs for in-house teams (LAWSITES-SPELLBOOK-2025; LAWSITES-LITERA-2025; LAWSITES-SIMPLEDOCS-2026).
  outcomes:
  - lever: speed
    description: Chaffetz Lindsey deployed the assistant to everyone in one window, with no staged rollout by practice group
    figure: two-month window
    measures: Elapsed deployment time, per the vendor case study
    provenance: vendor-published
    source_ref: IMANAGE-CHAFFETZ-2026
  - lever: speed
    description: Litera's claim for its whole Litera One platform, not for precedent search alone
    figure: 2-10 hours per week
    measures: Time saved per Litera One user, as stated by Litera; method and population not given
    provenance: vendor-published
    source_ref: LAWSITES-LITERA-2025
  prerequisites:
  - "A single governed repository with filing discipline: Chaffetz Lindsey reports 100 percent adoption of the platform and no shadow repositories (IMANAGE-CHAFFETZ-2026)"
  - "Matter-centric organisation with ethical walls already managed; more than 35 percent of Chaffetz Lindsey matters carry ethical screens (IMANAGE-CHAFFETZ-2026)"
  - "A way to tell final executed agreements from drafts and counterparty versions (DRAFTWISE-PRECEDENT-2025)"
  - "Written playbooks and fallback positions where policy is to be applied (LAWSITES-SIMPLEDOCS-2026)"
  risks_and_guardrails:
  - "Digital Commerce Bank's stated main risk is documents or information leaving the organisation in an uncontrolled way, so queries stay inside the governed platform (IMANAGE-DCB-2026)"
  - "Draftwise argues that poor source material undermines the reliability of suggestions and trust in the tool (DRAFTWISE-PRECEDENT-2025)"
  - "No accuracy or override figures are published for these assistants. In an independent task benchmark, document Q&A tools scored 89.6 and 94.8 against a lawyer baseline of 70.1, but that tests one supplied document, not a firm-wide estate (VALS-VLAIR-2025)"
  human_checkpoints:
  - "The lawyer reads the cited passage in the source document before relying on it"
  - "Librarians govern the repository and the assistant's use of it (IMANAGE-DCB-2026)"
  - "The lawyer decides whether a retrieved clause fits the deal and reviews any adapted wording"
  role_evolution: >-
    At Chaffetz Lindsey, non-timekeeping staff found clauses in precedents as fast as attorneys and became the
    assistant's champions (IMANAGE-CHAFFETZ-2026). A Bicalho Navarro partner says he asks the assistant to find a
    document rather than trying to remember where it is (IMANAGE-BICALHO-2026).
  evidence_grade: B
  sources:
  - {ref: IMANAGE-CHAFFETZ-2026, title: "Governance is a powerful differentiator at Chaffetz Lindsey (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/chaffetz-lindsey/", date: "2026-10-19", access: full, locator: "Paragraphs on the two-month deployment, Ask iManage use and ethical screens"}
  - {ref: IMANAGE-BICALHO-2026, title: "Bicalho Navarro Advogados: greater trust in knowledge search results in the iManage Cloud (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/bicalho-navarro/", date: "2026-10-19", access: full, locator: "Partner and IT manager quotes; 1.5 million documents"}
  - {ref: IMANAGE-DCB-2026, title: "Digital Commerce Bank unifies diverse teams on one platform (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/digital-commerce-bank/", date: "2026-10-19", access: full, locator: "Ask iManage use and librarians' governance role"}
  - {ref: NETDOCUMENTS-NDMAX-2026, title: "ndMAX legal AI suite (product page; undated, read 2026-10-19)", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/ndmax", date: "2026-10-19", access: full, locator: "Legal AI Assistant paragraph"}
  - {ref: LAWSITES-SPELLBOOK-2025, title: "Introducing Spellbook Library: Contract AI That Learns From Your Precedents", publisher: LawSites, type: press, url: "https://www.lawnext.com/2025/07/introducing-spellbook-library-contract-ai-that-learns-from-your-precedents.html", date: "2025-07-31", access: full, locator: "Opening paragraphs"}
  - {ref: LAWSITES-LITERA-2025, title: "Litera Expands Litera One Platform with New Drafting and Knowledge Management Features", publisher: LawSites, type: press, url: "https://www.lawnext.com/2025/07/litera-expands-litera-one-platform-with-new-drafting-and-knowledge-management-features.html", date: "2025-07-31", access: full, locator: "Precedent beta; adoption and time-saving paragraph"}
  - {ref: LAWSITES-SIMPLEDOCS-2026, title: "SimpleDocs Launches Contract Intelligence Layer", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/02/simpledocs-launches-contract-intelligence-layer-putting-policy-precedent-and-market-data-inside-microsoft-word.html", date: "2026-02-18", access: full, locator: "Three-source description; precedent paragraph"}
  - {ref: DRAFTWISE-PRECEDENT-2025, title: "Garbage In, Garbage Out: How to Build a Precedent Database Lawyers Can Trust", publisher: Draftwise, type: vendor, url: "https://www.draftwise.com/blog/garbage-in-garbage-out-how-to-build-a-precedent-database-your-lawyers-can-trust", date: "2025-09-24", access: full, locator: "Opening scenario; 'Start with Surgical Precision'"}
  - {ref: VALS-VLAIR-2025, title: "Vals Legal AI Report (VLAIR)", publisher: Vals AI, type: vendor, url: "https://www.vals.ai/industry-reports/vlair-2-27-25", date: "2025-02-27", access: full, locator: "Results table, Document Q&A row"}
  - {ref: IMANAGE-SEYFARTH-2026, title: "Seyfarth Shaw (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/seyfarth-shaw/", date: "2026-10-19", access: full, locator: "Paragraph on the evaluation of the assistant"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firms (Chaffetz Lindsey; Bicalho Navarro Advogados) and an in-house legal and technology team at a
    bank (Digital Commerce Bank, in-house); SimpleDocs targets in-house legal departments. Seyfarth Shaw's evaluation of
    Ask iManage was described as underway with no result (IMANAGE-SEYFARTH-2026). Drafting from
    retrieved precedent belongs to professional-services-work-production-05; cited Q&A over a supplied document set to
    professional-services-work-production-03.

- id: professional-services-knowledge-management-03
  title: Firm-wide knowledge assistant over a consulting firm's own intellectual property, with expert referral
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    At engagement kickoff, finding the most relevant research documents and experts is described as taking about two
    weeks of researching and networking, even for senior colleagues; analogues and comparables could take days of
    chasing experts (MCKINSEY-LILLI-2023).
  solution: >-
    McKinsey built its own assistant, Lilli, over more than 40 curated knowledge sources. It returns about five to seven
    relevant items with summaries and links, and names experts, with internal-knowledge and external-sources modes
    (MCKINSEY-LILLI-2023). Confidential client data is permitted in Lilli but not in public tools, per a Bloomberg
    interview as relayed (THEOUTPOST-LILLI-2025). Deloitte's PairD was launched for internal use in 2023, according to a
    Stanford Digital Economy Lab paper (STANFORD-DEL-2026). Infosys built an LLM-based search platform embedded in
    everyday tools so consultants can reuse project artifacts across silos (KMWORLD-APQC-2026).
  outcomes:
  - lever: capacity
    description: Usage reported by a named McKinsey executive in an August 2024 interview
    figure: over 4 million prompts; about 150,000 a week; over 75% of employees had tested it
    measures: Prompt requests since testing began in 2023 and weekly additions; employees who had tested Lilli (denominator not given)
    provenance: self-reported
    source_ref: BOERSEN-LILLI-2024
  - lever: capacity
    description: Usage and time saving relayed second-hand from a June 2025 Bloomberg interview (original not read)
    figure: over 75% of 43,000 employees monthly; 17 uses a week; over 500,000 prompts a month; 30% of time saved
    measures: Monthly users, uses per average user, prompts a month, and share of time otherwise spent gathering and synthesising information; no method for the 30%
    provenance: self-reported
    source_ref: THEOUTPOST-LILLI-2025
  - lever: quality
    description: Business Insider report relayed by a news site (original not opened)
    figure: 30% time saved; 20% improvement in content quality and accuracy
    measures: Not defined in the source
    provenance: self-reported
    source_ref: OFFICECHAI-LILLI-2025
  - lever: speed
    description: Infosys AI search platform, as described by an APQC researcher
    figure: search times reduced by 50%; user satisfaction up 80%
    measures: Stated without baseline, sample or who measured them
    provenance: self-reported
    source_ref: KMWORLD-APQC-2026
  prerequisites:
  - "Hundreds of data stewards who curate content, check accuracy and quality, sanitise it for client confidentiality and make it searchable (MCKINSEY-LILLI-2023)"
  - "A project team that grew from three to over 70 people, with input from legal, cyber security, risk and talent functions (MCKINSEY-LILLI-2023)"
  - "Upskilling users on prompt engineering and content validation (MCKINSEY-LILLI-2023)"
  risks_and_guardrails:
  - "McKinsey says the biggest challenge was bringing legal, cyber security, risk management and talent functions to the table quickly, not the technology (MCKINSEY-LILLI-2023)"
  - "McKinsey's executive said everything that goes out to a client must be reviewed by a person first (BOERSEN-LILLI-2024)"
  - "In the BCG field experiment, consultants using AI on a task selected to be outside AI's capability were 19% less likely to produce correct solutions (HBS-DELLACQUA-2023)"
  - "Deloitte Australia agreed to repay the final instalment of an AUD 440,000 contract after a report contained fabricated references; the revised report disclosed use of Azure OpenAI (CTV-DELOITTE-2025)"
  - "Brynjolfsson and Petropoulos argue internal AI augmentation can heighten information asymmetry between consultant and client (STANFORD-DEL-2026)"
  - "No independent evaluation of Lilli's accuracy was found"
  human_checkpoints:
  - "Consultants validate what the assistant returns; McKinsey lists content validation as a skill it trains (MCKINSEY-LILLI-2023)"
  - "A person reviews everything before it reaches a client (BOERSEN-LILLI-2024)"
  - "Data stewards curate and sanitise the underlying sources (MCKINSEY-LILLI-2023)"
  role_evolution: >-
    McKinsey's existing data stewards became central to quality (MCKINSEY-LILLI-2023), and over 120 people contribute
    part of their time to the platform (BOERSEN-LILLI-2024). McKinsey's technology and AI leader is quoted as saying Lilli
    could do work such as slide production that analysts used to do, without this necessarily meaning fewer analysts
    (THEOUTPOST-LILLI-2025).
  evidence_grade: B
  sources:
  - {ref: MCKINSEY-LILLI-2023, title: "Meet Lilli, our generative AI tool that's a researcher, a time saver, and an inspiration (alumni-site copy; date from URL)", publisher: McKinsey & Company, type: firm, url: "https://www.mckinsey.com/alumni/news-and-events/global-news/firm-news/2023-10-lilli", date: "2023-10", access: full, locator: "Paragraphs on 40+ sources, two-week kickoff search, data stewards, team of 70"}
  - {ref: BOERSEN-LILLI-2024, title: "AI in consulting: more than just creating slide presentations", publisher: Börsen-Zeitung, type: press, url: "https://boersen-zeitung.de/english/ai-in-consulting-more-than-just-creating-slide-presentations", date: "2024-08-26", access: full, locator: "Paragraphs 2-4"}
  - {ref: THEOUTPOST-LILLI-2025, title: "McKinsey embraces AI for consulting tasks, transforming junior roles (summary of a Bloomberg interview)", publisher: TheOutpost.ai, type: press, url: "https://theoutpost.ai/news-story/mc-kinsey-embraces-ai-for-consulting-tasks-transforming-junior-roles-16077/", date: "2025-06-03", access: full, locator: "Paragraphs on monthly use, prompts, 30% and client-data policy"}
  - {ref: OFFICECHAI-LILLI-2025, title: "McKinsey Has Built An Internet AI Chatbot Named Lilli Which Is Used By 70% Of Employees (relays Business Insider)", publisher: OfficeChai, type: press, url: "https://officechai.com/ai/mckinsey-has-built-an-internet-ai-chatbot-named-lilli-which-is-used-by-70-of-employees/", date: "2025-04-28", access: full, locator: "Paragraphs 2-4"}
  - {ref: KMWORLD-APQC-2026, title: "The Next Edge in Knowledge Management: KM for the Modern Workforce and the Era of AI (Lynda Braksiek, APQC)", publisher: KMWorld, type: press, url: "https://www.kmworld.com/Articles/Editorial/Features/The-Next-Edge-in-Knowledge-Management-KM-for-the-Modern-Workforce-and-the-Era-of-AI-173630.aspx?pageNum=2", date: "2026-03-09", access: full, locator: "Infosys paragraph"}
  - {ref: STANFORD-DEL-2026, title: "Pricing Consulting Services in the Age of Agentic AI: A Strategy Map for Executives", publisher: Stanford Digital Economy Lab (Brynjolfsson) and USC (Petropoulos), type: academic, url: "https://digitaleconomy.stanford.edu/app/uploads/2026/08/AI_Agents_and_Consulting_Service_Pricing.pdf", date: "2026-08-23", access: full, locator: "Abstract; section 5.1"}
  - {ref: HBS-DELLACQUA-2023, title: "Navigating the Jagged Technological Frontier (HBS Working Paper 24-013)", publisher: "Harvard Business School with Boston Consulting Group (Dell'Acqua, McFowland, Mollick, Lifshitz-Assaf, Kellogg, Rajendran, Krayer, Candelon, Lakhani)", type: academic, url: "https://www.hbs.edu/faculty/Pages/item.aspx?num=64700", date: "2023-09", access: full, locator: "Abstract"}
  - {ref: CTV-DELOITTE-2025, title: "Deloitte to partially refund Australian government for report with apparent AI-generated errors (AP)", publisher: CTV News / Associated Press, type: press, url: "https://www.ctvnews.ca/business/article/deloitte-to-partially-refund-australian-government-for-report-with-apparent-ai-generated-errors/", date: "2025-10-07", access: full, locator: "Article body"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: consulting (McKinsey; Deloitte) and an IT-services consultancy (Infosys). Grade B, not A: McKinsey's
    usage counts and time-saving claims are self-reported with no method, the current figures reach us through secondary
    relays, and mckinsey.com was blocked. The Stanford paper relays the 30% figure as 'up to 30 percent' (McKinsey n.d.).
    A landscape snippet (AI Weekly, late 2025) also cites 500,000+ prompts a month. Related:
    professional-services-work-production-07 (consulting analysis and deliverables).

- id: professional-services-knowledge-management-04
  title: "Finding who has done this before: expertise and experience location from matter, people and engagement records"
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - coordination-scheduling
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    NetDocuments frames the problem as a partner asking whether the firm has handled something similar, where the answer
    depends on who is in the room (NETDOCUMENTS-CONTEXTGRAPH-2026). A KM leader describes expertise directories once
    maintained through annual surveys (AL-DIDOMENICO-2026). ILTA's summary says expertise management is underdeveloped
    (ILTA-TECHSURVEY-2026, p. 9).
  solution: >-
    The assistant names experts alongside documents (McKinsey's Lilli) (MCKINSEY-LILLI-2023). Experience systems
    catalogue each lawyer's and engagement's experience and suggest relevant experience for a pursuit (Intapp DealCloud)
    (INTAPP-EXPERIENCE-2026). Intapp says Celeste, generally available from 2026-07-15, surfaces relevant matters, partner
    experience and pitch materials (INTAPP-CELESTEGA-2026). Litera's Firm AI Search queries matter, client and expertise
    data (LAWSITES-ILTACON4-2026). NetDocuments' context graph, in private preview, shows the people who have done the work
    before (NETDOCUMENTS-CONTEXTGRAPH-2026). CV and experience databases such as Arup People (engineering) feed bids and
    staffing (IKAUN-ARUP-2026).
  outcomes:
  - lever: speed
    description: The firm's own description of how long finding analogues took before Lilli; no measurement published
    figure: days (before Lilli)
    measures: Time to identify analogues or comparables by 'chasing down the right experts', as McKinsey describes it
    provenance: self-reported
    source_ref: MCKINSEY-LILLI-2023
  - lever: experience
    description: Arup's CV platform reach (the Arup page does not claim AI)
    figure: over 12,000 professionals engaged; about 7,000 CVs imported
    measures: Professionals who have actively engaged with the platform (Arup has over 18,000); CVs imported
    provenance: vendor-published
    source_ref: IKAUN-ARUP-2026
  - lever: quality
    description: Data barrier to outcome-aware expertise matching (resource managers, vendor-commissioned)
    figure: 47% cite poor or fragmented data; 7.3% say outcome data is easily accessible and routinely used in staffing
    measures: Shares of respondents to the Resource Management Institute study commissioned by Kantata
    provenance: vendor-published
    source_ref: KANTATA-RMI-2026
  prerequisites:
  - "Curated records of experts and past engagements; McKinsey describes a network of experts across 70 countries (MCKINSEY-LILLI-2023)"
  - "Experience data integrated with HR and financial systems (INTAPP-EXPERIENCE-2026)"
  - "A refresh habit: Arup built use of its CV platform into appraisals, onboarding and performance reviews (IKAUN-ARUP-2026)"
  - "Permissions and ethical walls preserved in the people-and-matter index (NETDOCUMENTS-CONTEXTGRAPH-2026)"
  - "A lawful basis and transparency to staff for using their work records, and a rule separating expertise search from performance evaluation"
  risks_and_guardrails:
  - "No source reports how accurate expert or experience suggestions are"
  - "Expertise surfaced from matter records may reflect confidential client work, so matter and ethical-wall rules carry over (CALBAR-GENAI-2026)"
  - "The EU AI Act lists AI for employment and management of workers as high-risk; Annex III obligations run from 2027-12-02 after the AI Omnibus extension (EC-AIACT-2026)"
  - "California's guidance warns that AI in employment actions or screening may present a risk of unlawful bias (CALBAR-GENAI-2026, p. 9)"
  human_checkpoints:
  - "The professional decides whom to contact and which experience to cite"
  - "A KM or practice leader confirms experience claims before staffing or pitching on them"
  - "Staff can correct their own expertise profiles"
  role_evolution: >-
    Not described beyond the assistant doing the first search that colleagues used to do by networking
    (MCKINSEY-LILLI-2023).
  evidence_grade: B
  sources:
  - {ref: MCKINSEY-LILLI-2023, title: "Meet Lilli, our generative AI tool that's a researcher, a time saver, and an inspiration (alumni-site copy; date from URL)", publisher: McKinsey & Company, type: firm, url: "https://www.mckinsey.com/alumni/news-and-events/global-news/firm-news/2023-10-lilli", date: "2023-10", access: full, locator: "Paragraphs on analogues, comparables and experts"}
  - {ref: INTAPP-EXPERIENCE-2026, title: "Experience management (Intapp DealCloud product page; undated, read 2026-10-19)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/dealcloud/experience-management/", date: "2026-10-19", access: full, locator: "Experience search, suggested experience, data-integration FAQ"}
  - {ref: INTAPP-CELESTEGA-2026, title: "Intapp announces general availability of Celeste, the expert AI coworker for professional firms", publisher: Intapp, type: vendor, url: "https://www.intapp.com/news/general-availability-celeste/", date: "2026-07-15", access: full, locator: "Paragraph on surfacing matters and partner experience (routed from the acceptance-risk deep dive)"}
  - {ref: LAWSITES-ILTACON4-2026, title: "ILTACON News Round-Up Part 4, The Business of Law", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/09/iltacon-news-round-up-part-4-the-business-of-law-litera-aderant-oddr-tre-ai-intapp.html", date: "2026-09-04", access: full, locator: "Litera Announces Firm AI Search, paragraphs 1-3"}
  - {ref: NETDOCUMENTS-CONTEXTGRAPH-2026, title: "NetDocuments Unveils the First Context Graph for Legal Work (press release)", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/company-news/netdocuments-unveils-context-graph-legal-platform/", date: "2026-05-14", access: full, locator: "Paragraph on opening an unfamiliar matter"}
  - {ref: IKAUN-ARUP-2026, title: "Leveraging Global Capability through Arup People (case study; undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/leveraging-global-capability-through-arup-people", date: "2026", access: full, locator: "Implementation + Rollout; Results (routed from the pursuit-proposals deep dive)"}
  - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads (Resource Management Institute study commissioned by Kantata)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "Barriers and outcome-data paragraphs"}
  - {ref: AL-DIDOMENICO-2026, title: "Old Problems, New Tools: Maybe You Need a Knowledge Strategy (sponsored by LegalTech Connect)", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/10/15/old-problems-new-tools-maybe-you-need-a-knowledge-strategy/", date: "2026-10-15", access: full, locator: "Paragraph 3"}
  - {ref: ILTA-TECHSURVEY-2026, title: "2026 ILTA Technology Survey: Executive Summary", publisher: International Legal Technology Association (ILTA), type: survey, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "p. 9"}
  - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Confidentiality row; Prohibition on Discrimination row, p. 9"}
  - {ref: EC-AIACT-2026, title: "AI Act: regulatory framework for AI", publisher: "European Commission, Digital Strategy", type: regulator, url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", date: "2026-10-19", access: full, locator: "High-risk list and application timeline"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: consulting (McKinsey), engineering (Arup), law firms (Intapp and Litera customers, unnamed). Grade B rests
    on McKinsey's own description of Lilli naming experts; Intapp, Litera and NetDocuments items are product claims.
    Ranking people for staffing (Kantata Expertise Agent) belongs to staffing-resourcing; experience and CV databases used
    to assemble bids (ikaun at GRSM, Stinson, Gowling WLG, Neudesic) belong to pursuit-proposals, which holds their
    proposal-time figures.

- id: professional-services-knowledge-management-05
  title: AI-assisted reclassification and summarisation of historic documents into an AI-ready knowledge bank
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - data-reporting
  - research-synthesis
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Decades of firm work sit in repositories with inconsistent metadata, so generative tools cannot be pointed at them
    safely or usefully.
  solution: >-
    Clifford Chance announced a Knowledge Bank built with Epiq Advisory for Law Firms and Microsoft: more than 400,000
    documents reclassified and summarised into a curated set, with natural-language search, summarisation, smart tagging,
    generative answers in the lawyer's workflow, and a Permissioned Search feature that applies metadata-driven
    permissions (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026).
  outcomes:
  - lever: capacity
    description: Documents already in the Knowledge Bank; no time, cost or quality measure given
    figure: 400,000+ documents
    measures: Documents reclassified and summarised, per the joint announcement as relayed by Artificial Lawyer
    provenance: self-reported
    source_ref: ARTIFICIALLAWYER-CLIFFORDCHANCE-2026
  prerequisites:
  - "A Microsoft 365 and Azure estate; the platform is described as built on SharePoint, Power Platform, Graph API and Azure AI Studio (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026)"
  - "Metadata-driven permissions aligned with client confidentiality (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026)"
  - "Significant customisation and engineering support, which Artificial Lawyer says Epiq provided (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026)"
  risks_and_guardrails:
  - "The announcement says the curated set ensures generative tools use only trusted internal materials; no accuracy or error data is given (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026)"
  - "A vendor viewpoint predicts professional support lawyers (lawyers who maintain know-how rather than bill clients) will have to review AI classifications, correct errors and identify gaps (KMWORLD-LEXSOFT-2025)"
  human_checkpoints:
  - "Predicted, not reported for Clifford Chance: knowledge professionals review AI classifications and curation (KMWORLD-LEXSOFT-2025)"
  role_evolution: >-
    The firm's Global Head of Knowledge & Training, a partner, calls the Knowledge Bank central to its client strategy
    (ARTIFICIALLAWYER-CLIFFORDCHANCE-2026). A vendor viewpoint predicts professional support lawyers become quality
    guardians over AI-generated metadata (KMWORLD-LEXSOFT-2025).
  evidence_grade: B
  sources:
  - {ref: ARTIFICIALLAWYER-CLIFFORDCHANCE-2026, title: "Clifford Chance launches AI KM platform with Microsoft and Epiq", publisher: Artificial Lawyer, type: press, url: "https://artificiallawyer.com/2026/07/20/clifford-chance-launches-ai-km-platform-with-microsoft-epiq", date: "2026-07-20", access: full, locator: "Feature list and quotes from the Global Head of Knowledge & Training"}
  - {ref: LAW360-CLIFFORDCHANCE-2026, title: "Clifford Chance launches AI knowledge management tech (lead paragraph only; paywalled)", publisher: Law360, type: press, url: "https://www.law360.com/articles/2503174", date: "2026-07-20", access: search-only, locator: "Lead paragraph"}
  - {ref: KMWORLD-LEXSOFT-2025, title: "Conversational AI interfaces and human-AI collaboration to transform legal knowledge management in 2026 (viewpoint by the CEO of Lexsoft Systems)", publisher: KMWorld, type: press, url: "https://www.kmworld.com/Articles/Editorial/ViewPoints/Conversational-AI-interfaces-and-human-AI-collaboration-to-transform-legal-knowledge-management-in-2026-172705.aspx", date: "2025-12-08", access: full, locator: "Paragraphs on professional support lawyers"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law firm (Clifford Chance). Maturity is 'announced' because the sources report a launch without showing
    use; grade B because a named firm reports the documents are already in the platform. Law360
    (LAW360-CLIFFORDCHANCE-2026, lead paragraph only) supports only the fact of the announcement. A Legal IT Insider interview with the firm's knowledge lead could not be opened. The
    firm-finance deep dive also notes this launch (via AI Weekly summarising the FT).

- id: professional-services-knowledge-management-06
  title: Automatic classification, extraction and summaries when a document is filed
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - data-reporting
  - research-synthesis
  pattern: bulk-transformation
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Document metadata and version notes are rarely entered by hand, so search and AI summaries run on poorly described
    content, and scanned files are invisible to search.
  solution: >-
    On filing, the system classifies the document, extracts parties, dates and clauses into the matter record, generates
    a matter overview and writes a summary of what changed between versions; NetDocuments describes these features in a
    private preview for select customers (LAWSITES-NETDOCS-2026). iManage describes native OCR so scanned files become
    searchable (LAWSITES-IMANAGE-2026). A KMWorld Europe 2026 session described combining LLM classification and
    extraction with taxonomies and ontologies (KMWORLD-EUROPE-2026).
  outcomes:
  - lever: speed
    description: NetDocuments says the matter overview can dramatically reduce a new associate's orientation time; no figure
    figure: none published
    measures: n/a
    provenance: vendor-published
    source_ref: LAWSITES-NETDOCS-2026
  prerequisites:
  - "A shared taxonomy; NetDocuments says its graph draws in part on the SALI and FOLIO legal data standards (LAWSITES-NETDOCS-2026)"
  - "Permissions and ethical walls preserved on derived summaries (LAWSITES-NETDOCS-2026)"
  risks_and_guardrails:
  - "NetDocuments says results remain subject to each user's permissions and ethical walls (LAWSITES-NETDOCS-2026)"
  - "The preview opened only on NetDocuments' enterprise AI tier for select customers, so scale and accuracy are unproven in public sources (LAWSITES-NETDOCS-2026)"
  human_checkpoints:
  - "A lawyer or paralegal confirms extracted parties, dates and clauses before they are relied on"
  - "KM samples machine-assigned labels against the taxonomy"
  role_evolution: >-
    The KMWorld Europe 2026 programme treats taxonomy and metadata as the base of AI systems (KMWORLD-EUROPE-2026); the
    sources do not report a role change.
  evidence_grade: C
  sources:
  - {ref: LAWSITES-NETDOCS-2026, title: "NetDocuments Unveils Legal Context Graph to Map Legal Knowledge Alongside a Reimagined Platform", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/netdocuments-unveils-legal-context-graph-to-map-legal-knowledge-alongside-a-reimagined-platform.html", date: "2026-05-14", access: full, locator: "Feature list: Matter Overview, AI-Generated Version History, Document Intelligence"}
  - {ref: LAWSITES-IMANAGE-2026, title: "iManage Unveils Next Evolution of Platform at ConnectLive 2026 (press release reproduced)", publisher: LawSites, type: press, url: "https://www.lawnext.com/2026/05/imanage-unveils-next-evolution-of-platform-at-connectlive-2026-as-organizations-prepare-for-the-next-era-of-ai-ready-knowledge-work.html", date: "2026-05-22", access: full, locator: "Native OCR paragraph"}
  - {ref: KMWORLD-EUROPE-2026, title: "KMWorld Europe 2026 Full Programme Listing", publisher: KMWorld, type: conference, url: "https://www.kmworld.com/Europe/2026/Programme.aspx", date: "2026-04", access: full, locator: "Session abstract on LLM classification with taxonomies and ontologies"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law-firm document platforms; no customer is named. The only entry at the automate rung; its evidence is a
    private preview. Only the KMWorld abstract was read.

- id: professional-services-knowledge-management-07
  title: "Repository clean-up: AI finds duplicates and proposes renaming and reorganisation, applied only after a person confirms"
  archetype: professional-services
  module: knowledge-management
  function: technology-it
  work_types:
  - data-reporting
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Documents scattered across inboxes, desktops, OneDrive, SharePoint and file servers leave no single authoritative
    version (IMANAGE-DCB-2026); incoming data rooms and productions arrive with inconsistent or numeric file names
    (HARVEY-VAULT-2026).
  solution: >-
    Digital Commerce Bank's legal and technology team uses Ask iManage to find all duplicates of a document so librarians
    can file them correctly and delete the extras, and to find what is missing (IMANAGE-DCB-2026). Harvey's Agentic Vault
    Organization (early access) proposes a folder or renaming plan in plain language, shows what it will change, and acts
    only after a person confirms, with undo (HARVEY-VAULT-2026).
  outcomes:
  - lever: capacity
    description: Ask iManage is live with a small group at the bank and planned for the whole user base
    figure: roughly 10 users now; 70 planned
    measures: Users in legal and technology at Digital Commerce Bank versus its 70-user base, per the vendor case study
    provenance: vendor-published
    source_ref: IMANAGE-DCB-2026
  prerequisites:
  - "A single governed platform and a new file structure to organise into (IMANAGE-DCB-2026)"
  - "For Harvey, documents in a Vault (a secure document collection the tool can query); the organisation feature is early access (HARVEY-VAULT-2026)"
  risks_and_guardrails:
  - "Harvey says the agent can move, rename and tag files but never edits their content, never runs a change without a person confirming, and recent changes can be undone (HARVEY-VAULT-2026)"
  - "Librarians control governance of AI use on the bank's repository (IMANAGE-DCB-2026)"
  human_checkpoints:
  - "Librarians file and delete duplicates (IMANAGE-DCB-2026)"
  - "A person confirms the proposed reorganisation plan (HARVEY-VAULT-2026)"
  role_evolution: >-
    Librarians at the bank move from finding duplicates by hand to directing and approving the assistant's findings
    (IMANAGE-DCB-2026).
  evidence_grade: B
  sources:
  - {ref: IMANAGE-DCB-2026, title: "Digital Commerce Bank unifies diverse teams on one platform (customer story; undated, read 2026-10-19)", publisher: iManage, type: vendor, url: "https://imanage.com/resources/customer-stories/digital-commerce-bank/", date: "2026-10-19", access: full, locator: "Paragraphs on duplicates and repository state"}
  - {ref: HARVEY-VAULT-2026, title: "Agentic Vault Search and Organization", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/agentic-vault-search-and-organization", date: "2026-09-08", access: full, locator: "Sections on Agentic Vault Organization"}
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: in-house legal and technology team at a bank (in-house). Harvey's organisation feature is early access;
    no Harvey customer is named for it.

- id: professional-services-knowledge-management-08
  title: Context graph that maps how matters, documents, communications and people connect, for lawyers and agents
  archetype: professional-services
  module: knowledge-management
  function: service-delivery
  work_types:
  - research-synthesis
  - data-reporting
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: piloting
  problem: >-
    Flat retrieval finds passages, not relationships: an agent cannot tell which draft controls, that a counterparty is
    the same entity under another name, or which precedent is the firm's most recent, and users re-explain the matter
    every session (HARVEY-GRAPH-2026). Harvey and DeepJudge call the gap a 'context tax' (LAWSITES-HARVEYDJ-2026).
  solution: >-
    A platform continuously maps relationships at document, matter and firm-wide levels under existing permissions and
    hands that structure to any AI tool at run time: NetDocuments Legal Context Graph (private preview from 2026-05-14),
    Harvey Graph, iManage Context Fabric (general availability announced for October) and Wolters Kluwer Libra over its
    own content (NETDOCUMENTS-CONTEXTGRAPH-2026; HARVEY-GRAPH-2026; LAWSITES-IMANAGE-2026; LAWSITES-ILTACON3-2026).
    Accenture authors describe a knowledge-graph approach at an unnamed professional-services firm (CMR-ACCENTURE-2026).
  outcomes:
  - lever: quality
    description: Harvey's own agent benchmark, with versus without the graph; values are maxima across tasks
    figure: up to 30% higher rubric pass rate; up to about 50% lower task cost
    measures: Rubric pass rate and task cost on tasks from Harvey's Legal Agent Bench; number of tasks and averages not given
    provenance: vendor-published
    source_ref: HARVEY-GRAPH-2026
  - lever: quality
    description: One firm-knowledge task (find the most recent secured financing and retrieve the executed agreements)
    figure: 0% without the graph vs 75% with it
    measures: Share of rubric criteria met on a single Legal Agent Bench task
    provenance: vendor-published
    source_ref: HARVEY-GRAPH-2026
  - lever: cost
    description: NetDocuments' internal benchmark on public matters; accuracy held almost constant
    figure: cost per correct answer fell from $0.68 to $0.36 (about 48% lower)
    measures: Dollars per credit-weighted correct answer, 300 questions across ten matters (874 documents) built from public filings, same model and harness with and without the graph
    provenance: vendor-published
    source_ref: NETDOCS-LCEB-2026
  prerequisites:
  - "Document repository, matter workspaces and permissions already governed (LAWSITES-NETDOCS-2026)"
  - "The graph follows each workspace's security settings and ethical walls (HARVEY-GRAPH-2026; NETDOCUMENTS-CONTEXTGRAPH-2026)"
  - "A baseline of the firm's own questions and answers; NetDocuments says its cost ratio is most trustworthy against a firm's own prior baseline (NETDOCS-LCEB-2026)"
  risks_and_guardrails:
  - "Harvey calls its results early and says relationships must be inferred, verified against the source and kept current (HARVEY-GRAPH-2026)"
  - "NetDocuments' questions and rubrics were model-generated and cross-checked by deterministic validations and human spot checks; no independent validation was found (NETDOCS-LCEB-2026)"
  - "No customer results are reported for any context graph"
  human_checkpoints:
  - "Answers remain verifiable through citations (HARVEY-GRAPH-2026)"
  - "KM or IT reviews how the graph resolves matter and client boundaries"
  role_evolution: >-
    The Accenture authors say firms that built reusable data and semantic structures could build new AI applications
    faster, reusing more than half of the semantic structure (CMR-ACCENTURE-2026).
  evidence_grade: C
  sources:
  - {ref: HARVEY-GRAPH-2026, title: "Improving agent accuracy with Harvey Graph", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/improving-agent-accuracy-with-harvey-graph", date: "2026-10-19", access: full, locator: "Experiments on Legal Agent Bench"}
  - {ref: NETDOCS-LCEB-2026, title: "2026 Legal Context Engineering Benchmark Report", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/?p=11503", date: "2026-08", access: full, locator: "Executive summary; methodology; cost per correct answer"}
  - {ref: NETDOCUMENTS-CONTEXTGRAPH-2026, title: "NetDocuments Unveils the First Context Graph for Legal Work (press release)", publisher: NetDocuments, type: vendor, url: "https://www.netdocuments.com/company-news/netdocuments-unveils-context-graph-legal-platform/", date: "2026-05-14", access: full, locator: "Opening paragraphs and capability list"}
