  last_reviewed: '2026-10-19'
  notes: >-
    Law firm (Gleiss Lutz) and in-house (Deutsche Telekom). Merged from practice-04, discourse-11 and
    governance-03. Graded B, not A: Vals and Stanford measure tools, not a named organization's deployment, and the
    only deployment figure is a partner's estimate. Question count differs: the Vals page says 200, LawSites says
    210. The Stanford study tests 2024 products. The law-student trial is an adjacent population. Related:
    tax-research-advisory-01 (cited tax research), tax-research-advisory-04 (multi-jurisdiction workflow, idea),
    tax-controversy-08 (research and drafting for tax tribunals).

- id: professional-services-work-production-02
  title: Summaries, chronologies, transcript analysis and first-pass translation over large record sets
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Summarising long records, building chronologies and reading transcripts take much of the orientation time on a
    matter or investigation. Foreign-language documents wait for colleagues with the right language or for outside
    translators, and document versions are compared by hand.
  solution: >-
    Tools summarise documents and transcripts, draft chronologies and produce first-pass translations that
    reviewers check. Grant Thornton UK's Forensic and Investigation Services team (accounting firm) runs
    multi-language sets through Legora for an initial translation followed by a quality check, builds tabular email
    summaries (sender, recipient, date, short summary) at the start of a case, and has the tool surface differences
    between document versions. Microsoft lists case chronologies among multi-file tasks lawyers can hand to Cowork,
    and DISCO launched an agentic fact-investigation application that drafts memos, deposition outlines and
    timelines.
  outcomes:
  - lever: quality
    description: 'Vals benchmark (February 2025): all evaluated tools scored above the lawyer baseline on summarisation'
    figure: lawyer baseline 50.3%; CoCounsel 77.2%; Harvey Assistant 72.1%; Oliver 62.4%; Vincent AI 58.9%
    measures: >-
      Share of checks passed against reference answers for the Document Summarization task; Vals says summary
      acceptability is subjective and limited to the consortium firms' reference answers
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: Transcript analysis above the baseline; chronology generation matched it at best
    figure: 'transcript analysis: baseline 53.7%, Harvey Assistant 77.8%, Vincent AI 64.8%; chronology: baseline 80.2%, Harvey Assistant 80.2%, CoCounsel 78.0%'
    measures: Share of checks passed against reference answers for the Transcript Analysis and Chronology Generation tasks
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: speed
    description: Grant Thornton's team says it can move into analysis earlier; no timing published
    figure: none published
    measures: no figure given
    provenance: self-reported
    source_ref: LEGORA-GRANTTHORNTON-2026
  prerequisites:
  - Source documents in a controlled workspace
  - Reviewers who know the matter well enough to judge relevance (Vals found judging relevance is where lawyers did better)
  - An established practitioner-led review process the tool plugs into (LEGORA-GRANTTHORNTON-2026)
  risks_and_guardrails:
  - Chronology required the most lawyer time, and deciding relevance may be easier for practising lawyers (VALS-VLAIR-2025)
  - Grant Thornton checks AI translations and summaries for accuracy and context as part of its normal quality assurance (LEGORA-GRANTTHORNTON-2026)
  - >-
    An ILTACON 2026 observer said validation principles from technology-assisted review (TAR: machine-learning
    document review with statistical checks) give a quantitative framework, with qualitative validation added for
    generative uses (EDT-CROWD2-2026)
  human_checkpoints:
  - Quality check of each translation and summary before analysis relies on it (LEGORA-GRANTTHORNTON-2026)
  - Lawyer checks key dates and source references in a chronology
  role_evolution: >-
    Grant Thornton's forensic director describes reaching judgment-led analysis earlier instead of starting from
    zero, with less dependence on scarce language specialists for first-pass reading (LEGORA-GRANTTHORNTON-2026).
    Litigation teams are shifting their focus to adoption, training and validating results (EDT-CROWD3-2026). No
    headcount effect is reported.
  evidence_grade: B
  sources:
  - ref: VALS-VLAIR-2025
    title: Vals Legal AI Report (VLAIR)
    publisher: Vals AI
    type: vendor
    url: https://www.vals.ai/industry-reports/vlair-2-27-25
    date: '2025-02-27'
    access: full
    locator: Document Summarization, Chronology Generation and Transcript Analysis sections; results table
  - ref: LEGORA-GRANTTHORNTON-2026
    title: How Grant Thornton UK is delivering sharp client insights in high-stakes forensic work
    publisher: Legora
    type: vendor
    url: https://legora.com/customers/grant-thornton
    date: '2026'
    access: full
    locator: From pilot to practice
  - ref: LAWSITES-MSFT-2026
    title: Microsoft Launches Copilot for Legal, Becoming the Fourth AI Giant in Five Months to Build Out a Legal Vertical
    publisher: LawSites (Bob Ambrogi)
    type: press
    url: https://www.lawnext.com/2026/10/microsoft-launches-copilot-for-legal-becoming-the-fourth-ai-giant-in-five-months-to-build-out-a-legal-vertical.html
    date: '2026-10-15'
    access: full
    locator: Cowork delegation paragraph
  - ref: LAWSITES-ILTACONROUND-2026
    title: 'ILTACON News Round-Up Part 1, E-Discovery: DISCO, Everlaw, Nuix, Relativity, Reveal'
    publisher: LawSites (Bob Ambrogi)
    type: press
    url: https://www.lawnext.com/2026/09/iltacon-news-round-up-part-1-e-discovery-disco-everlaw-nuix-relativity-reveal.html
    date: '2026-09-03'
    access: full
    locator: DISCO paragraphs
  - ref: EDT-CROWD2-2026
    title: Part Two of ILTACON 2026 Crowdsourced Observations
    publisher: eDiscovery Today
    type: community
    url: https://ediscoverytoday.com/2026/09/02/part-two-of-iltacon-2026-crowdsourced-observations-legal-technology-trends/
    date: '2026-09-02'
    access: full
    locator: Observation by Tiana Van Dyk, Epiq
  - ref: EDT-CROWD3-2026
    title: Part Three of ILTACON 2026 Crowdsourced Observations
    publisher: eDiscovery Today
    type: community
    url: https://ediscoverytoday.com/2026/09/03/part-three-of-iltacon-2026-crowdsourced-observations-legal-technology-trends/
    date: '2026-09-03'
    access: full
    locator: Observation on adoption, training and validating
  last_reviewed: '2026-10-19'
  notes: >-
    Accounting firm (Grant Thornton UK forensic) and law-firm litigation tools. Merged from practice-03,
    practice-11, discourse-12 and the summarisation part of discourse-02 and governance-04. The Vals benchmark
    tests 2024-25 product versions and is older than the 18-month window; it is the only independent task-level
    measure found. Grant Thornton's page shows a "joined 2026-09" label, not a confirmed publication date. The DISCO
    product is an announcement without measures. Related: assurance-planning-risk-assessment-01 (summarising board
    minutes), tax-controversy-06 (in-house tax teams summarise dispute files).

- id: professional-services-work-production-03
  title: Bulk extraction of clauses and fields, and cited question answering, over contract and document sets
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - data-reporting
  - research-synthesis
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Pulling clauses, dates and fields out of long agreements and answering questions across document sets is
    repetitive manual reading, tables built by hand are slow to check, and quality varies between reviewers.
  solution: >-
    Tools extract the text or fields a lawyer asks for, answer questions about a document set with citations, and
    return results in tables for review. Named uses: contract terms extraction (Goodwin, law firm); restating a
    four-year outsourcing agreement with 112 change notes (Dentsu, in-house); structured issue lists in contract
    review (CMS, law firm); a loan-review agent with extraction and comparison across portfolios (A&O Shearman, law
    firm, announced April 2025). Harvey describes extracting caps, baskets and survival periods from a firm's own
    executed deals into a review table and verifying each value against its source citation.
  outcomes:
  - lever: quality
    description: 'Vals benchmark (February 2025): document Q&A was the highest-scoring task'
    figure: lawyer baseline 70.1%; Harvey Assistant 94.8%; CoCounsel 89.6%; Oliver 74.0%; Vincent AI 72.7%
    measures: >-
      Share of checks passed against reference answers, LLM-judged; lawyer baseline from independent lawyers
      working to the same instructions; Vals discloses a customer relationship with one or more participants
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: Data extraction was close to the lawyer baseline
    figure: lawyer baseline 71.1%; Harvey Assistant 75.1%; CoCounsel 73.2%
    measures: Share of checks passed for the Data Extraction task (30 questions over 29 documents, 204 checks)
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: On the hardest extraction question results varied widely and the lawyer baseline was low
    figure: CoCounsel 61.7%; Vincent AI 40%; lawyer baseline 39.2%; Harvey Assistant 36.7%
    measures: Share of 40 requested fields across three credit agreements extracted accurately
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: speed
    description: A&O Shearman says its agents do in minutes what previously took several hours
    figure: none published (qualitative statement)
    measures: Statement by the firm's Global Head of AI Advisory about its Harvey-built agents; not a measured figure
    provenance: self-reported
    source_ref: AOSHEARMAN-HARVEY-2025
  prerequisites:
  - Documents loaded into a controlled workspace or vault
  - A defined list of fields or clauses (Vals found tools did well on named clauses, worse on concepts not stated verbatim, such as most-favoured-nation terms)
  - For precedent benchmarking, a specific question and deal parameters to pick a comparable cohort (HARVEY-INDEMNITY-2026)
  risks_and_guardrails:
  - Tools often stopped at one relevant clause when several were needed, and some missed terms of art (VALS-VLAIR-2025)
  - >-
    Vendors chose which tasks to enter and some withdrew, and the test treated products as text generators through
    an API rather than full workflows, so scores are not an all-vendor or workflow comparison (VALS-VLAIR-2025)
  - >-
    Firms requiring human review of GenAI work product range from 31% of firms under 50 lawyers to 79% of firms
    over 700 (ILTA-TECHSURVEY-2026)
  - Harvey cautions that mixing deals with different economics, structures or governing law can obscure more than it shows (HARVEY-INDEMNITY-2026)
  human_checkpoints:
  - Reviewer checks extracted fields against the source text through the returned citations
  - Spot checks on multi-clause questions, where Vals saw incomplete answers
  role_evolution: >-
    Goodwin describes dedicated staff building tailored workflows for client requirements (LEGORA-GOODWIN-2025). An
    ILTA respondent expects GenAI to compress the document review, research and drafting work that has powered the
    associate pyramid (ILTA-TECHSURVEY-2026). No firm publishes how staffing changed.
  evidence_grade: B
  sources:
  - ref: VALS-VLAIR-2025
    title: Vals Legal AI Report (VLAIR)
    publisher: Vals AI
    type: vendor
    url: https://www.vals.ai/industry-reports/vlair-2-27-25
    date: '2025-02-27'
    access: full
    locator: Data Extraction and Document Q&A sections; methodology and vendor sections
  - ref: LEGORA-GOODWIN-2025
    title: Goodwin rolls out Legora firmwide
    publisher: Legora
    type: vendor
    url: https://legora.com/customers/goodwin
    date: '2025'
    access: full
    locator: Paragraph on use cases
  - ref: HARVEY-DENTSU-2026
    title: How Dentsu's Legal and Compliance Team Turned Pressure Into Strategic Advantage With Harvey
    publisher: Harvey
    type: vendor
    url: https://www.harvey.ai/customers/dentsu
    date: '2026-05-06'
    access: full
    locator: Contract Analysis and Vault
  - ref: HARVEY-CMS-2026
    title: 'Turning AI Into a Daily Habit: How CMS Reached 95% Adoption With Harvey'
    publisher: Harvey
    type: vendor
    url: https://www.harvey.ai/customers/cms
    date: '2026-03-25'
