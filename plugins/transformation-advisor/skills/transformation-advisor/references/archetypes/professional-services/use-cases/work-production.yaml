- id: professional-services-work-production-24
  title: 'Idea: log edits, overrides and review findings on AI-assisted work to evidence quality and savings'
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - data-reporting
  - review-assurance
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Clients want matter-level proof that AI cut cost or improved quality, firms say they are still gathering data,
    and without records of when professionals correct AI a firm cannot tell whether a tool needs changing or people
    need guidance.
  solution: >-
    Idea. Tools log which tasks used AI, how much output was edited or rejected, and what review found; reasoning,
    sources and override decisions are documented so patterns by practice area become visible; the logs feed
    supervision, quality dashboards and client reporting. Thomson Reuters Institute proposes tracking override and
    challenge. Vendor-side telemetry already exists (Microsoft reports how many Legal Agent suggestions users kept),
    and Legora and Laurel say a second phase of their time-capture partnership will measure AI usage and value.
  outcomes:
  - lever: quality
    description: none published
    figure: none published
    measures: No firm publishes acceptance, edit, override or rework rates for AI-assisted work
    provenance: independent
    source_ref: TRI-LEGALWEEK-2026
  prerequisites:
  - Tools that record usage and edits, and a rule on what is logged, kept and shared with clients
  - Lightweight tracking that is not burdensome (TRI-STANDARDS-2026)
  risks_and_guardrails:
  - The Law Society advises documenting inputs, outputs and system errors where the tool keeps no history (LAWSOC-GENAI-2026)
  - Telemetry can raise how observable outcomes are without settling what the firm's work contributed (STANFORD-DEL-2026)
  - Logs may contain client confidential data (ABA-OP512-2024)
  - About 60% of in-house respondents had seen no noticeable savings from outside counsel's AI use (BLOOMBERGLAW-ACC-2025)
  human_checkpoints:
  - Supervising lawyer or review lead looks at override and error trends periodically
  - Finance and innovation leads decide what is reported to clients
  role_evolution: >-
    Quality, knowledge and innovation teams gain a measurement role and analyse override patterns
    (TRI-STANDARDS-2026).
  evidence_grade: D
  sources:
