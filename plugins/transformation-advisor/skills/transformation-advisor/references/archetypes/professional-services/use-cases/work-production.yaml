- id: professional-services-work-production-16
  title: Lawyers hand multi-file tasks to general-purpose agent workspaces, with checkpoints sized to risk
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  - coordination-scheduling
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Work that spans agreements, emails, meetings and files requires a lawyer to move between tools and carry context
    by hand, while professional duties require supervision of anything an agent produces.
  solution: >-
    Three general-purpose AI providers announced legal packages in 2026: Anthropic (Claude for Legal, 2026-05-12:
    connectors, 12 practice-area plugins that start with a setup interview on playbooks, and cookbooks deployable as
    Managed Agents), OpenAI (Astra for Law, 2026-09-17, offered to Am Law 200 firms through Trusted Access) and
    Microsoft (Copilot for Legal, 2026-10-15, with Cowork for multi-file tasks such as obligation tracking, term
    comparison and chronologies). The Law Society's example is a solicitor giving an agent a goal such as a
    settlement proposal; the agent reads the file, extracts facts, identifies issues, compares similar matters and
    drafts an advice note. California's guidance lists pleading revisions, discovery responses and coordinating
    document review as agentic examples.
  outcomes:
  - lever: capacity
    description: Anthropic says legal professionals have become the most engaged Cowork users of any knowledge-work function (LawSites report; no figure)
    figure: none published
    measures: Vendor statement with no stated basis
    provenance: vendor-published
    source_ref: LAWSITES-ANTHROPIC-2026
  - lever: risk
    description: The Law Society reports very limited use of fully autonomous agentic systems among the firms and suppliers it spoke to
    figure: none published
    measures: Professional body's account of its conversations; no count
    provenance: independent
    source_ref: LAWSOC-AGENTIC-2026
  prerequisites:
  - Connectors into document management, research and e-discovery tools; setup of playbooks and escalation chains
  - A permissions framework for tiers of agents, and checkpoints around higher-risk actions (LAWSOC-AGENTIC-2026)
  risks_and_guardrails:
  - Lawyers must not let agentic systems make substantive legal determinations, communicate advice or file pleadings without meaningful supervision (CALBAR-GENAI-2026)
  - Agentic tools must not send client data externally without safeguards and review (CALBAR-GENAI-2026)
  - Agents may access things they should not (LAWSOC-AGENTIC-2026)
  - OpenAI offers zero data retention to its Trusted Access programme (LAWSITES-OPENAI-2026)
  human_checkpoints:
  - Lawyer supervises and reviews outputs; checkpoints are designed around higher-risk actions rather than every step (LAWSOC-AGENTIC-2026)
  role_evolution: >-
    Review shifts from checking every output to designing checkpoints and permissions (LAWSOC-AGENTIC-2026). No firm
    has published results of delegating whole workstreams.
  evidence_grade: C
  sources:
