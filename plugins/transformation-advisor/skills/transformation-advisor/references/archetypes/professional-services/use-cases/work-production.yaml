    access: full
    locator: Paragraphs on deployed agents and lessons learned
  last_reviewed: '2026-10-19'
  notes: >-
    Big Four (PwC). From practice-18. Nineteen months old, outside the 12-18 month window; kept because it is the
    only firm-described agent deployment for document and data work in advisory delivery. Audit and tax technical
    agents belong to the assurance and tax archetypes (for example tax-data-technology-11).

- id: professional-services-work-production-14
  title: An agent reads a whole data room and writes the diligence memo (benchmark stage)
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - review-assurance
  - research-synthesis
  - document-production
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    A full data room can hold thousands of documents and tens of millions of tokens, more than a single model can
    read at once; chat tools read only a fraction.
  solution: >-
    Harvey describes a decomposition harness in which a root agent divides the data room by category, sub-agents
    review each part, and the root assembles a diligence memo with citations and recommended next steps, evaluated
    against expert rubrics on synthetic data rooms. No named customer describes using such an agent for a whole
    diligence.
  outcomes:
  - lever: quality
    description: On Harvey's synthetic benchmark, the decomposition harness raised the mean pass rate sharply over the standard tool loop
    figure: mean pass rate 23.3% (standard tool-loop harness) to 62.4% (decomposition harness) across seven models
    measures: Mean share of rubric criteria met by the memo on 50 held-out synthetic data rooms, judged by an LLM against expert rubrics
    provenance: vendor-published
    source_ref: HARVEY-RLM-2026
  - lever: quality
    description: Post-training the root agent raised the pass rate further
    figure: 29.9% to 63.0%
    measures: Rubric criteria pass rate, base root model against post-trained root, on the same 50 data rooms
    provenance: vendor-published
    source_ref: HARVEY-RLM-2026
  prerequisites:
  - Reference rubrics and data rooms to test against; secure access to the data room
  risks_and_guardrails:
  - Results are on synthetic data rooms judged by an LLM; they say nothing yet about recall on real matters
  - Agentic systems must not make substantive legal determinations without meaningful lawyer supervision (CALBAR-GENAI-2026)
  human_checkpoints:
  - Deal lawyers review the memo and decide what the findings mean for price, structure, representations and indemnities
  role_evolution: If it works, junior diligence review would become supervision of agent output; no firm reports having done this.
  evidence_grade: C
  sources:
