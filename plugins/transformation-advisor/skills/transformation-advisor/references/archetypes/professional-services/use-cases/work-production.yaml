    date: '2026-10-12'
    access: full
    locator: Section 'What standards should actually look like'
  last_reviewed: '2026-10-19'
  notes: >-
    Law firms (ILTA respondents, Reed Smith) and consultants (LexisNexis survey). Merged from discourse-09,
    governance-10 and governance-11. Graded B on Reed Smith's named certification requirement; the survey figures
    show how common the controls are, not their effect, and no source measures review effectiveness. ILTA's narrative
    says most firms require human review, but its size-band table shows 31% to 83%, so the table is used. ILTA
    also reports more than half of respondents issue Copilot licences only on request. Overlaps acceptance-risk and
    quality-review (cross-cutting governance).

- id: professional-services-work-production-23
  title: Test AI tools on the firm's own work against an expert baseline before relying on them, and re-test when they change
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - review-assurance
  - data-reporting
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Vendor claims are hard to compare and have been overstated; reading every AI output against its source removes
    the time saving, but relying on an untested tool breaches the competence duty; and firms say they cannot yet
    show quality or savings.
  solution: >-
    The firm tests candidate tools on a representative sample of its own tasks, scored against a lawyer baseline or
    a manual review by reviewers who do not see the tool's output, relies on a tool only for tasks where it passes,
    and repeats the test when the model or task changes. A consortium of eight law firms (Reed Smith, Fisher
    Phillips, McDermott Will & Emery, Ogletree Deakins and four unnamed) built the dataset for the Vals study. A
    Covington & Burling special counsel published a matter-level case study of test-set validation for GenAI
    document review. A PwC Legal posting and a London law-firm posting ask for sampling, testing and benchmarking
    skills.
  outcomes:
  - lever: quality
    description: An evaluation with a lawyer baseline exposed where tools trailed lawyers as well as where they led
    figure: 'redlining: lawyer baseline 79.7% versus best tool 65.0%; EDGAR research: lawyer baseline 70.1% versus 55.2%'
    measures: Task score against predefined criteria, from a study whose dataset was created by the law-firm consortium
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: Prompt refinement on curated test sets improved results on some issues but not all
    figure: two of nine issues reached perfect performance on Test Set 1 by round four; one kept a higher false-positive rate
    measures: Counts of true and false positives against senior-attorney tags per issue, four prompt rounds, 7,100 documents (chart values not read)
    provenance: self-reported
    source_ref: EDRM-EMORY-2025
  prerequisites:
  - A representative task set from the firm's own matters, a scoring method and an acceptance threshold
  - Time from senior reviewers who are independent of the tool output
  risks_and_guardrails:
  - The ABA says a lawyer may test a tool on a subset before relying on it, that the right level of verification depends on the tool and task, and that the lawyer stays fully responsible whatever level is chosen (ABA-OP512-2024)
  - California says the duty includes periodic reassessment as AI systems change (CALBAR-GENAI-2026)
  - The Law Society says to assess the evidence and benchmarks providers use to support capability claims (LAWSOC-GENAI-2026)
  - The Covington author says her test was not a defensibility-grade validation of recall (EDRM-EMORY-2025)
  - Benchmarks that treat products as text generators miss workflow design (VALS-VLAIR-2025)
  - A sample that is too small or unrepresentative gives false comfort; no source tests this
  human_checkpoints:
  - Innovation lead and practice partner approve the test set and the pass threshold
  - A lawyer compares sampled tool output with the manual result and decides whether to rely on the tool
  role_evolution: >-
    Knowledge and innovation staff become evaluators with a method, not only tool administrators; legal-engineer
    postings ask for review protocols, sampling and testing (PWC-LEGALJOB-2026; RW-LEGALENGINEER-2026). Senior
    attorneys' time moves upstream into building test sets (EDRM-EMORY-2025).
  evidence_grade: B
  sources:
  - ref: VALS-VLAIR-2025
    title: Vals Legal AI Report (VLAIR)
    publisher: Vals AI
    type: vendor
    url: https://www.vals.ai/industry-reports/vlair-2-27-25
    date: '2025-02-27'
    access: full
    locator: Acknowledgments (Consortium Firms); Methodology; results table
  - ref: EDRM-EMORY-2025
    title: 'Case Study: Practical Testing for Effectively Organizing Documents with GenAI Review (Tara S. Emory, Covington & Burling)'
    publisher: EDRM
    type: professional-body
    url: https://edrm.net/2025/06/case-study-practical-testing-for-effectively-organizing-documents-with-genai-review/
    date: '2025-06-24'
    access: full
    locator: Sections B (Curating Strategic Test Sets) and C (Prompt Iteration and Testing)
