- id: professional-services-work-production-10
  title: 'Idea: challenger role and an unaided-reasoning check for AI-structured team work'
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - review-assurance
  - expert-judgment
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    A coherent AI-structured draft invites continuation rather than challenge, so teams can approve work no one has
    independently reasoned through, and edits cluster on phrasing and tone rather than assumptions.
  solution: >-
    Idea. Thomson Reuters Legal proposes assigning challengers, having team members state the reasoning in their own
    words, returning to primary sources, and asking at key points whether the team could build and defend the
    analysis if AI disappeared.
  outcomes:
