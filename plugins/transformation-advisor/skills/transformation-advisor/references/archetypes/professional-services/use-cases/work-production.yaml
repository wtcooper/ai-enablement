  - Seniors kept the durable skill benefit of AI drafting help in the one trial, so juniors may need deliberate unaided practice (NBER-AUTOR-2026)
  human_checkpoints:
  - Challenger reviews framing and omissions
  - Pre-finalisation check that the team could defend the analysis without AI
  role_evolution: Reviewers act as challengers who test framing and omissions, not only editors of wording (TRI-JUDGMENT-2026).
