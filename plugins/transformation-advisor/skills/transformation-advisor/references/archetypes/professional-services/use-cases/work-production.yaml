- id: professional-services-work-production-19
  title: In-house legal teams set an AI-first-pass default for routine drafting and review, and keep more work in-house
  archetype: professional-services
  module: work-production
  function: risk-compliance-legal
  work_types:
  - document-production
  - review-assurance
  - research-synthesis
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Corporate legal departments face pressure to do more with the same team and to reduce outside counsel spend;
    drafts such as dispute responses and demand letters used to go to outside counsel to save in-house hours.
  solution: >-
    In-house teams set a default of using AI first on routine work and widen its scope. TC Energy introduced a
    "Harvey-First" directive during its pilot, then deployed Harvey across litigation, regulatory, corporate and M&A,
    commercial contracting and compliance work. GE Aerospace deployed Harvey across Legal and Compliance after a
    pilot. Dentsu lists reduced reliance on external counsel among its results. BMW Group is rolling out Legora
    across its legal department. A JLL panellist described uploading business background documents and getting a
    solid draft in minutes. All are in-house.
  outcomes:
  - lever: speed
    description: JLL Work Dynamics' general counsel recalls a very solid draft within five to ten minutes of uploading background documents, which may remove the need for outside counsel on some dispute work
    figure: 5 to 10 minutes (recollection)
    measures: Panellist's recollection; not a tracked metric
    provenance: self-reported
    source_ref: TRI-AIFORUM-2026
  - lever: cost
    description: Few in-house teams report receiving savings from their law firms' AI use, though many have mandated it
    figure: 48% of in-house teams have mandated their law firms to use AI; only one reported receiving cost savings
    measures: RSGI survey commissioned by Harvey, 87 respondents across 60 firms and 27 in-house teams, fielded April-June 2026
    provenance: vendor-published
    source_ref: LEGALIT-RSGI-2026
  prerequisites:
  - Security, privacy and data-location assessment (Deutsche Telekom required encryption and storage in Germany)
  - A clear directive on first-pass use and review expectations before anything leaves the team
  risks_and_guardrails:
  - Directives raise the verification burden; TC Energy's general counsel pairs Harvey with the judgment and expertise of its lawyers (HARVEY-TCENERGY-2026)
  - Lawyers remain responsible for their work whether or not AI is used (LAWSOC-AGENTIC-2026)
  - The RSGI survey is vendor-commissioned with a small in-house sample (LEGALIT-RSGI-2026)
  human_checkpoints:
  - In-house lawyer edits and approves the first pass; complex matters stay with senior lawyers
  role_evolution: >-
    In-house counsel handle more drafting themselves and value outside counsel for judgment and anticipating risk
    (TRI-AIFORUM-2026). GE Aerospace and TC Energy describe the aim as capacity and strategic advice
    (HARVEY-GE-2026; HARVEY-TCENERGY-2026). RSGI reports 94% of in-house teams in its sample are changing hiring
    criteria to prioritise AI skills (LEGALIT-RSGI-2026).
  evidence_grade: B
  sources:
