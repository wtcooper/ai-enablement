# Use cases: professional-services / work-production
# Sources checked 2026-10-19. 25 entries: A 3, B 15, C 5, D 2. Merged from 54 candidates in three deep dives
# (practice, discourse, governance) plus items routed here from the knowledge-management, firm-finance and
# quality-review deep dives. The named record is almost all legal (law firms and in-house legal teams); consulting
# and accounting evidence is thin. Independent measures (Vals, Stanford, NBER, HBS) test tools or run trials; no
# firm or in-house team publishes an error, override or parallel-run rate for AI-assisted work product.
# Benchmarks of tools in isolation (Vals, Stanford) are not counted as grade A on their own, matching the tax
# archetype: A needs a measured outcome of people working with AI at a named organization, or a named
# organization's tracked metric. Practice-specific work (audit procedures, tax technical work, security
# operations) lives in the assurance, tax and security archetypes; overlaps are noted by full id in notes.

- id: professional-services-work-production-01
  title: AI-assisted research with cited answers, checked against authoritative sources before use
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - research-synthesis
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Research memos need accurate answers with valid sources, but AI research tools can invent or misstate
    authority, vendors' "hallucination-free" claims have been hard to check, and buyers cannot easily tell which
    tools to trust.
  solution: >-
    Lawyers use legal-specific or general AI tools for research questions and first orientation in unfamiliar
    areas, then check every citation and conclusion against primary sources before relying on it. Deutsche
    Telekom's general counsel (in-house) and a Gleiss Lutz partner (law firm) both describe asking Harvey first in
    unfamiliar areas, then going deeper.
  outcomes:
  - lever: quality
    description: Vals research study (October 2025) found four AI products above the lawyer baseline
    figure: AI products 74%-78% average weighted score; lawyer baseline 69%; AI higher on 150 of 200 questions
    measures: >-
      Average weighted score across accuracy (50%), authoritativeness (40%) and appropriateness (10%) on US legal
      research questions; products tested were Alexi, Counsel Stack, Midpage and ChatGPT
    provenance: independent
    source_ref: VALS-VLAIRRES-2025
  - lever: quality
    description: Press report of the same study gives the accuracy criterion on its own
    figure: AI products 79%-81%; lawyer baseline 71%
    measures: Accuracy criterion score (50% of the weighted rubric), as reported by LawSites, which counts 210 questions
    provenance: independent
    source_ref: LAWSITES-VALSRESEARCH-2025
  - lever: quality
    description: Multi-jurisdiction questions scored lower
    figure: on average 14 points lower on 14 jurisdictionally complex questions
    measures: Difference in average score between multi-jurisdiction and single-jurisdiction questions, as Vals reports
    provenance: independent
    source_ref: VALS-VLAIRRES-2025
  - lever: risk
    description: Preregistered Stanford evaluation (2024) of research tools from two leading providers
    figure: each hallucinated between 17% and 33% of the time
    measures: >-
      Share of responses classed as hallucinated for Lexis+ AI, Westlaw AI-Assisted Research and Ask Practical Law
      AI over the authors' preregistered query set (202 queries per the governance deep dive)
    provenance: independent
    source_ref: STANFORD-MAGESH-2024
  - lever: risk
    description: Fabricated citations in a randomised law-student trial (adjacent population)
    figure: 'Vincent AI: 3; no AI: 4; o1-preview: 11'
    measures: >-
      Count of citations to entirely fabricated sources across all completed assignments, by condition (127
      students, six assignments each)
    provenance: independent
    source_ref: SCHWARCZ-APL-2025
  - lever: speed
    description: A Gleiss Lutz partner says Harvey gives most of the answer when he needs first orientation in an unfamiliar area
    figure: 85% to 90% (partner's estimate)
    measures: The partner's own estimate of how much of an orientation answer the tool provides; not a tracked metric
    provenance: self-reported
    source_ref: HARVEY-DTGLEISS-2026
  prerequisites:
  - Access to authoritative sources the tool can cite (Vals found access to proprietary databases gave legal AI a citation advantage)
  - >-
    A firm rule that tool output is a lead, not an authority. ILTA reports 25% of firms under 50 lawyers, and 55%
    to 60% of larger firms, require outputs to be cited or independently verified (ILTA-TECHSURVEY-2026)
  risks_and_guardrails:
  - Lawyers must review all AI output for accuracy, including citations, before submission to a court (CALBAR-GENAI-2026)
  - The English Divisional Court said lawyers who use AI for research must check it against authoritative sources (EWHC-AYINDE-2025)
  - >-
    Thomson Reuters and LexisNexis did not take part in the October 2025 Vals research study and vLex withdrew, so
    the largest research platforms were not measured (LAWSITES-VALSRESEARCH-2025)
  - Most participants did worse on multi-jurisdiction questions and 50-state surveys (VALS-VLAIRRES-2025)
  - Vendor claims of hallucination-free output were found overstated (STANFORD-MAGESH-2024)
  human_checkpoints:
  - Lawyer reads each cited authority and checks each conclusion before it goes into advice or a filing
  role_evolution: >-
    Research moves from finding authority to verifying it. Cal Bar says the duty to supervise extends to AI output
    used by subordinates (CALBAR-GENAI-2026). LawSites reports lawyers still did better on about one-third of
    question categories that needed deeper interpretive analysis (LAWSITES-VALSRESEARCH-2025).
  evidence_grade: B
  sources:
  - ref: VALS-VLAIRRES-2025
    title: VLAIR - Legal Research
    publisher: Vals AI
    type: vendor
    url: https://www.vals.ai/industry-reports/vlair-10-14-25
    date: '2025-10-14'
    access: full
    locator: Key conclusions 1-5; question-level analysis
  - ref: LAWSITES-VALSRESEARCH-2025
    title: Vals AI's Latest Benchmark Finds Legal and General AI Now Outperform Lawyers in Legal Research Accuracy
    publisher: LawSites (Bob Ambrogi)
    type: press
    url: https://www.lawnext.com/2025/10/vals-ais-latest-benchmark-finds-legal-and-general-ai-now-outperform-lawyers-in-legal-research-accuracy.html
    date: '2025-10-23'
    access: full
    locator: Overview of the Study; Key Findings; paragraphs on non-participating vendors
  - ref: STANFORD-MAGESH-2024
    title: Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools (arXiv 2405.20362)
    publisher: Stanford RegLab and HAI (Magesh, Surani, Dahl, Suzgun, Manning, Ho)
    type: academic
    url: https://arxiv.org/abs/2405.20362
    date: '2024-05-30'
