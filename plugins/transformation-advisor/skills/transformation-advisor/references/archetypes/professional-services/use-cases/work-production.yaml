    governance-04, plus HARVEY-INDEMNITY-2026 routed from the knowledge-management practice deep dive (the
    deal-history benchmarking use case itself stays in knowledge-management). Graded B: named deployments without
    published measurements; the Vals figures test tools in isolation. Goodwin's date is the Legora "joined" label.
    The A&O Shearman item is an April 2025 rollout announcement. Related: tax-data-technology-11 (extraction of tax
    notices), tax-transfer-pricing-10 (clause extraction), assurance-substantive-testing-14 (contract and lease
    review for audit testing).

- id: professional-services-work-production-04
  title: Regulatory horizon scanning and monitoring that feeds advice
  archetype: professional-services
