  function: service-delivery
  work_types:
  - data-reporting
  - document-production
  pattern: bulk-transformation
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Advisory teams extract information from documents and spreadsheets and move it into target formats by hand.
  solution: >-
    PwC (Big Four) said in March 2025 that it used its Agent OS across tax, assurance and advisory with 250 agents for
    specific tasks. Named agent types include Document Extraction and Processing agents (vector search plus
    user-defined search terms, then formatting) and Data Bridge agents that extract data from Excel files or PDFs,
    map it to a target format and validate values.
  outcomes:
  - lever: capacity
    description: PwC reports the number of task agents deployed (a count, not an outcome of work change)
    figure: 250 agents
    measures: Number of AI agents deployed across the firm for specific tasks, per PwC's technology officer as reported by Accounting Today
    provenance: self-reported
    source_ref: AT-PWC-AGENTOS-2025
  prerequisites:
  - Governance, monitoring and orchestration standards, which PwC formalised after more than a year of building agents
  risks_and_guardrails:
  - PwC found several agents in one conversation stream could produce inconsistent or unpredictable outputs and introduced deterministic routing between agents and their skills (AT-PWC-AGENTOS-2025)
  - PwC found overly negative reinforcement could confuse agents and moved to structured prompts (AT-PWC-AGENTOS-2025)
  human_checkpoints:
  - Not described in the source; exceptions and validation failures would need an owner
  role_evolution: Not described in the source.
  evidence_grade: B
  sources:
