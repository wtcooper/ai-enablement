- id: professional-services-work-production-20
  title: Shared AI workspaces where clients, co-counsel and advisers work from the same material
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - document-production
  - client-interaction
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Drafts, diligence analysis and regulatory work move between client, law firm and advisers by email, tracked
    changes and version control, losing context at each handoff.
  solution: >-
    Harvey Shared Spaces lets internal teams and outside parties, including non-Harvey customers, work in one
    workspace with a shared vault, workflows and permissions. O'Melveny (law firm) deploys Shared Spaces with
    clients; Dentsu (in-house) creates a vault and shares it with law-firm partners; Deutsche Telekom (in-house) and
    Gleiss Lutz (law firm) are exploring a move from parallel workstreams to shared work; PwC and IFS describe
    sharing deal analysis as issues are found.
  outcomes:
  - lever: experience
    description: Participants describe fewer handoffs and faster visibility; none publish measures
    figure: none published
    measures: no figure given
    provenance: self-reported
    source_ref: HARVEY-SHAREDSPACES-2026
  prerequisites:
  - Data residency and privacy assessment (Deutsche Telekom required encryption and storage in Germany)
  - Strict permissions and auditability across organisations
  risks_and_guardrails:
  - Client data crossing organisations raises confidentiality and privilege risks; agentic tools must not send client data externally without safeguards (CALBAR-GENAI-2026)
  human_checkpoints:
