- id: professional-services-work-production-17
  title: Legal engineers and practice teams package firm know-how into playbooks, vaults and custom agents
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - document-production
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A firm's best precedent and review standards sit with a few experts, juniors take years to absorb them, and
    each lawyer prompts AI from scratch, so results vary.
  solution: >-
    Firms package expertise into reusable playbooks, vaults (secure document collections the tool can query) and
    agents. Hogan Lovells Cadwalader lawyers built custom agents for knowledge management, capital markets and
    international arbitration and built playbooks collaboratively. Blank Rome built a brief-bank vault, an
    EEOC-charge playbook, a transactions playbook and a civil litigation toolkit for juniors. MinterEllison seconded
    staff from billable work into an accelerator that produced a network of "legal engineers" (lawyers who turn
    legal work into tool workflows) and more than 150 use cases. Duane Morris names practice-group AI champions who
    test tools on real work. All four are law firms.
  outcomes:
  - lever: capacity
    description: MinterEllison's accelerator identified use cases and workflows (counts, not results)
    figure: more than 150 use cases identified; over a thousand employees logged in on the first day
    measures: Use cases identified by accelerator participants; employees logging in on day one of the firm-wide rollout (Legora case study)
    provenance: vendor-published
    source_ref: LEGORA-MINTERELLISON-2026
  - lever: cost
    description: Blank Rome says about 95% of its AI training is built and delivered in-house
    figure: roughly 95%
    measures: Share of AI training delivered by in-house staff (Harvey case study)
    provenance: vendor-published
    source_ref: HARVEY-BLANKROME-2026
  - lever: capacity
    description: Hogan Lovells Cadwalader piloted Legora with over 1,300 lawyers in 18 practice teams before a global rollout
    figure: 1,300+ lawyers; 18 practice teams
    measures: Lawyers and practice teams in the pilot, per the vendor announcement; no outcome figures
    provenance: vendor-published
    source_ref: LEGORA-HLC-2026
  prerequisites:
  - Dedicated capacity (MinterEllison relieved participants of billable work)
  - Innovation, knowledge-management and practice-group sponsorship and a named AI leadership structure (Reed Smith - chief innovation officer, senior director of AI, director of change leadership)
  - Office hours, workshops and sessions with senior lawyers (HARVEY-HLC-2026)
  risks_and_guardrails:
  - Output quality is limited by playbook quality; the Robert Walters and PwC Legal postings both ask for evaluation and benchmarking skills (RW-LEGALENGINEER-2026; PWC-LEGALJOB-2026)
  - Mid-level associates build their own agents with or without firm training, so firms should shape use early (TRI-ONBOARD-2026)
  - Separately procured agents may start to join up without a conscious decision to adopt agentic systems (LAWSOC-AGENTIC-2026)
  human_checkpoints:
  - Practice experts own and update playbooks
  - Champions test tools on real matters before wider release (TRI-ONBOARD-2026)
  role_evolution: >-
    New roles appear: Harvey had 34 and Legora 54 postings with "Legal Engineer" or "Legal Engineering" in the title
    on their public job boards on 2026-10-19, some duplicates (HARVEY-JOBS-2026; LEGORA-JOBS-2026). Firm-side
    postings for legal engineers or AI-enabled legal delivery ask for prompts, workflows, playbooks, evaluation sets
    and agentic AI skills (PWC-LEGALJOB-2026; RW-LEGALENGINEER-2026). Mid-level associates become tool builders and
    champions (TRI-ONBOARD-2026).
  evidence_grade: B
  sources:
