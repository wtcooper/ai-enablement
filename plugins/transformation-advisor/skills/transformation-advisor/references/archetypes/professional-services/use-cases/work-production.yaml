    Consulting firms (BCG; Deloitte Australia) and law-firm sessions (ILTACON). Merged from practice-17,
    discourse-08, governance-07 and discourse-16 (task decomposition and agent-suitability triage). Grade A rests on
    a measured field experiment with a named consulting firm's staff; it is from September 2023 with GPT-4 on
    researcher-designed tasks, outside the 18-month window, so today's frontier differs. Practice capped this at B
    for that reason; two deep dives graded A. No consulting firm publishes deployment data on deliverable quality.
    McKinsey Lilli figures appeared only in conflicting secondary sources and are not used.

- id: professional-services-work-production-08
  title: Playbook-based first-pass contract review with suggested edits as tracked changes in Word
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - review-assurance
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Reviewing counterparty paper clause by clause against the team's preferred and fallback positions, and drafting
    the response redline, is slow and repetitive; consistency depends on who reviews, and the playbook (the written
    list of positions and fallbacks) often lives in people's heads.
  solution: >-
    An agent inside the document reviews an agreement against a playbook, flags non-conforming provisions,
    proposes edits as native tracked changes with citations to the source language, and the lawyer accepts or
    rejects each edit. Microsoft released its Legal Agent in Word to its Frontier early-access programme on
    2026-04-30 and made its legal skills generally available on 2026-10-15. Harvey, Legora and Anthropic (legal
    plugins that start with a setup interview on playbooks, escalation chains and house style) offer comparable
    functions. GE Aerospace (in-house) deployed Harvey across Legal and Compliance after a pilot and is a design
    partner for its Contract Intelligence product.
  outcomes:
  - lever: quality
    description: Users kept roughly seven in ten of the Legal Agent's suggested edits during the Frontier release
    figure: about 70% of suggestions kept; nearly 100,000 edits; more than 1,800 users
    measures: >-
      Microsoft's telemetry: since the April Frontier release, more than 1,800 users generated nearly 100,000
      edits and kept roughly seven in ten suggestions. Not a reviewer-graded error rate; LawSites notes no
      independent legal benchmark was released
    provenance: vendor-published
    source_ref: MSFT-COPILOTLEGAL-2026
  - lever: speed
    description: A Microsoft in-house senior corporate counsel says a review that might take an hour can often take several minutes
    figure: an hour to several minutes (one user's statement)
    measures: One lawyer's description of his own first-pass review time; no sample or method
    provenance: self-reported
    source_ref: MSFT-COPILOTLEGAL-2026
  - lever: quality
    description: 'Vals benchmark (February 2025): the lawyer baseline beat the AI tools on open-ended redlining, tested without a stored playbook'
    figure: lawyer baseline 79.7%; Harvey Assistant 59.4% in the text (65.0% in the results table); Vincent AI 53.6%
    measures: Share of checks passed on the Redlining task; Harvey was evaluated through its Assistant, not its redlining feature
    provenance: independent
    source_ref: VALS-VLAIR-2025
  - lever: quality
    description: Vendor-commissioned blind comparison of one attorney and two AI tools
    figure: human attorney 4.56; Ivo 4.52; Claude for Word (Opus 4.6) 3.50 (out of 10); attorney about 10 hours for 19 contracts, Ivo average 2 min 45 s per contract
    measures: Mean score of three blind judges on five criteria over 19 anonymised contracts with one reviewing attorney; times as stated in the release
    provenance: vendor-published
    source_ref: IVO-BENCH-2026
  prerequisites:
  - A written, machine-usable playbook with preferred and fallback positions
  - Documents in a managed environment (Microsoft says the agent runs inside Microsoft 365 security, compliance and governance controls)
  - A test on the team's own contracts, comparing AI redlines with the team's own
  risks_and_guardrails:
  - Microsoft says the Legal Agent gives no legal advice and users are solely responsible for reviewing and verifying output (MSFT-LEGALAGENT-2026)
  - A lawyer must review, verify and correct AI output, and professional judgment cannot be delegated (CALBAR-GENAI-2026)
  - Both 2026 contract-review benchmarks (Ivo, LegalOn) are run or commissioned by the vendor whose product leads; LegalOn's own CEO says buyers should treat vendor benchmarks with some scepticism (ARTLAW-LEGALON-2026)
  - General-purpose models missed the legal standard even when they found the right clause (ARTLAW-LEGALON-2026)
  human_checkpoints:
  - Lawyer accepts, edits or rejects each proposed edit before it goes to the counterparty (MSFT-LEGALAGENT-2026)
