  last_reviewed: '2026-10-19'
  notes: >-
    Unnamed US IP law firms (trial); Duane Morris and Blank Rome (law firms). Merged from practice-06,
    discourse-01 and governance-01. Grade A rests on one preregistered randomised field trial with blinded scoring
    in one practice (patent drafting); it is a September 2026 working paper, not peer reviewed, and generalisation
    to other document types is not shown. Patent drafting is IP-specific, but the step is first-draft production.
    Deep dives split on provenance (two said independent, one vendor-published); vendor-published is used because
    Google built the assistant and ran the study. An older study (Choi, Monahan and Schwarcz, 2023, via
    LEGALFUTURES-CHOI-2023) found GPT-4 gave speed gains of 12% to 32% but only slight, inconsistent quality gains
    in 60 law students. Junior-development detail belongs to the talent-learning module.

- id: professional-services-work-production-07
  title: Consulting analysis and first-draft deliverables with AI, with task-by-task rules on what stays human-first
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  - expert-judgment
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Consultants spend a large share of early-career time on research, data work and first-draft slides, and do not
    know which tasks AI helps with and which it makes worse, because the boundary is uneven and not obvious from the
    task description.
  solution: >-
    Consultants use GenAI for market-research briefs, first content for decks, documents and emails, and early
    structure for analysis, then validate and refine it. Teams keep complex judgment-heavy tasks human-first, with an
    extra check if AI is used. The best field evidence is the Harvard Business School experiment with 758 BCG
    consultants (2023, GPT-4). Deloitte Australia's revised report for an Australian government department disclosed
    that Azure OpenAI was used in writing it. In law, ILTACON 2026 sessions recommended breaking complex tasks into
    smaller AI-ready steps and having a panel judge which tasks suit agentic workflows and which stay human-led.
  outcomes:
  - lever: speed
    description: For 18 tasks inside AI's capability, consultants using AI completed more tasks and worked faster, with quality rated higher
    figure: 12.2% more tasks completed; 25.1% faster
    measures: Average over 18 realistic consulting tasks, 758 BCG consultants randomised to no AI, GPT-4, or GPT-4 with prompt guidance (HBS abstract)
    provenance: independent
    source_ref: HBS-DELLACQUA-2023
  - lever: quality
    description: On one complex task chosen to lie outside AI's capability, AI users were less likely to be right
    figure: 19% less likely to produce correct solutions
    measures: Likelihood of a correct solution on that task, AI users against the no-AI group
    provenance: independent
    source_ref: HBS-DELLACQUA-2023
  - lever: capacity
    description: Content creation was the most common GenAI use among surveyed consultants
    figure: 50% of consultants
    measures: Share naming content creation as a top GenAI use in the LexisNexis Future of Work 2026 Management Consulting report (denominator not stated in the blog summary)
    provenance: vendor-published
    source_ref: LEXISNEXIS-FOW-2026
  prerequisites:
  - Approved AI tools (54% of surveyed consultants report using tools without approval, per LEXISNEXIS-FOW-2026)
  - A way to classify tasks by AI capability, kept current as models change
  - A validation step before client delivery
  risks_and_guardrails:
  - AI worsened performance on the task outside its capability; the paper describes the frontier as uneven even between tasks of similar difficulty (HBS-DELLACQUA-2023)
  - Consultants should guard against over-reliance on AI, especially outside their own expertise, and seek specialist input in technical or regulated areas (ICMCI-AICODE-2026)
  - Fabricated quotes and nonexistent references reached a client report (CTV-DELOITTE-2025); see professional-services-work-production-11
  human_checkpoints:
  - Manager decides which tasks are AI-first and which are human-first
  - Consultant validates AI output; a qualified reviewer checks AI-influenced analysis before client release
  role_evolution: >-
    A former McKinsey consultant argues AI now does much of the research, data work and slide drafting that filled a
    junior's first year, and that validating AI output is now a big part of the junior job (STRATEGYCASE-JUNIOR-2026,
    community source). No consulting firm publishes a primary account of role change.
  evidence_grade: A
  sources:
  - ref: HBS-DELLACQUA-2023
    title: Navigating the Jagged Technological Frontier (HBS Working Paper 24-013)
    publisher: Harvard Business School with Boston Consulting Group (Dell'Acqua, McFowland, Mollick, Lifshitz-Assaf, Kellogg, Rajendran, Krayer, Candelon, Lakhani)
    type: academic
    url: https://www.hbs.edu/faculty/Pages/item.aspx?num=64700
    date: 2023-09
    access: full
    locator: Abstract
  - ref: LEXISNEXIS-FOW-2026
    title: 'Generative AI in professional services (blog on the LexisNexis Future of Work 2026: Management Consulting Industry Report)'
    publisher: LexisNexis
    type: vendor
    url: https://www.lexisnexis.com/blogs/amppage/30/generative-ai-professional-services
    date: '2026-04-16'
    access: full
    locator: Sections on research briefs and polished deliverables
