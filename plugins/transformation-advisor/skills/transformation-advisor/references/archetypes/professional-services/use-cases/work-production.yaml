  - Pilot scale and training; Hogan Lovells Cadwalader's Legora pilot covered more than 1,300 lawyers across 18 practice teams, including M&A and real estate (LEGORA-HLC-2026)
  risks_and_guardrails:
  - No source reports recall (missed-issue) rates from real diligence; on Harvey's synthetic benchmark, base models in a standard harness met no data room's full rubric (see professional-services-work-production-14)
  - AI output must be reviewed and verified, and agentic tools must not make substantive legal determinations without lawyer supervision (CALBAR-GENAI-2026)
  human_checkpoints:
  - Specialist lawyers review flagged issues and sign the diligence memo
  role_evolution: >-
    Hogan Lovells Cadwalader's lawyers built custom agents for knowledge management, capital markets and
    international arbitration (HARVEY-HLC-2026). Junior diligence hours are the work most often cited as compressed,
