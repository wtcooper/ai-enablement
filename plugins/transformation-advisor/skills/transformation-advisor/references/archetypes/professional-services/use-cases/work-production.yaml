- id: professional-services-work-production-21
  title: Firm expertise packaged as multi-step agents for complex work products, used internally and offered to others
  archetype: professional-services
  module: work-production
  function: product-service-development
  work_types:
  - document-production
  - review-assurance
  - expert-judgment
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    High-value matter types (filing analysis, fund formation, loan review) need multi-step reasoning over matter
    documents, and the know-how sits with senior lawyers.
  solution: >-
    A&O Shearman (law firm) and Harvey announced agents for antitrust filing analysis, cybersecurity, fund formation
    and loan review that break issues into plans and combine intermediate outputs into work products with oversight,
    to be used internally and sold to corporates, law firms and financial institutions by subscription or usage
    fees, with the firm sharing in software revenue. Bloomberg Law reports A&O Shearman plans to sell AI tools, in
    part focused on fund formation, to other firms, and that Fried Frank (law firm) is considering client use of its
    proprietary fund formation tool. Kirkland & Ellis (law firm) took the opposite route: its first tool on its own
    AI platform is a fund formation engine, and it has emphasised exclusivity.
  outcomes:
  - lever: speed
    description: A&O Shearman's head of AI advisory says the agents do in minutes what previously took several hours
    figure: none published (qualitative statement)
    measures: Statement by A&O Shearman's Global Head of AI Advisory and the Markets Innovation Group
    provenance: self-reported
    source_ref: AOSHEARMAN-HARVEY-2025
  - lever: growth
    description: No product, price or external customer has been published for firm-built tools offered to others
    figure: none published
    measures: Bloomberg Law's wording is "plans" and "contemplating"
    provenance: self-reported
    source_ref: BLOOMBERGLAW-KIRKLAND-2026
  prerequisites:
  - Practice experts to encode their method, and a platform able to run multi-step agents
  - Separation of confidential client data from the tool, and a commercial and support model unlike legal services
  risks_and_guardrails:
  - The Law Society found very limited use of fully autonomous agentic systems among firms and suppliers it spoke to (LAWSOC-AGENTIC-2026)
  - Human checkpoints should be proportionate to higher-risk actions (LAWSOC-AGENTIC-2026)
  - Selling tools to competitors changes the firm's competitive position; Kirkland's exclusivity stance is the contrast (BLOOMBERGLAW-KIRKLAND-2026)
  human_checkpoints:
  - Lawyers review agent outputs; the announcement refers to transparency and oversight (AOSHEARMAN-HARVEY-2025)
  - Firm leadership decides what is offered externally
  role_evolution: >-
    Senior lawyers' expertise becomes a product; a Stanford professor quoted by Vault describes firms racing to
    extract their lawyers' knowledge and embed it in AI workflows (VAULT-PYRAMID-2026).
  evidence_grade: C
  sources:
