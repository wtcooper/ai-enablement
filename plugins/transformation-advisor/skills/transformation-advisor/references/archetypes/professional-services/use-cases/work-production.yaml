- id: professional-services-work-production-25
  title: Record AI use per matter, disclose material use to clients, and apply each client's AI terms from matter opening
  archetype: professional-services
  module: work-production
  function: risk-compliance-legal
  work_types:
  - document-production
  - review-assurance
  - coordination-scheduling
  pattern: intake-triage
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Clients and regulators increasingly want to know when AI shaped advice or a deliverable, and undisclosed AI use
    is surfacing as a trust and contract issue. Client guidelines now conflict: some require firms to use AI and
    show savings, others bar AI without permission, and some say they will not pay for work done by AI.
  solution: >-
    Matter and engagement records capture where AI was used and how it was verified; deliverables carry a disclosure
    when AI materially shaped the analysis; AI-generated material is marked in client files. At matter opening, the
    client's AI terms (permitted tools, approval needed, billing treatment, reporting) are captured and fed into tool
    access and billing rules, so people do not have to remember them. Public Services and Procurement Canada (a
    government client) requires suppliers to identify any AI use in advance.
  outcomes:
  - lever: risk
    description: Firms requiring client approval for AI use, by firm size
    figure: 8% of firms under 50 lawyers; 20%; 24%; 38%; 34% of over 700
    measures: Share of responding firms per size band selecting 'Must obtain client approval' (ILTA survey Q3.18)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: cost
    description: In-house counsel seeing no savings yet from outside counsel's AI use
    figure: nearly 60% saw no noticeable savings yet
    measures: ACC-Everlaw survey of about 650 in-house counsel and legal operations staff, fielded June-July 2025, as reported by Bloomberg Law
    provenance: independent
    source_ref: BLOOMBERGLAW-ACC-2025
  - lever: risk
    description: Cost of an undisclosed, unchecked case; the revised Deloitte Australia report disclosed Azure OpenAI use
    figure: partial refund of an AUD 440,000 contract (final instalment)
    measures: Contract value and the department's statement, as reported by AP
    provenance: independent
    source_ref: CTV-DELOITTE-2025
  prerequisites:
  - A threshold for material AI use (the ICMCI code says routine productivity tools need not be individually disclosed)
  - A field for AI terms in matter intake and a place in the engagement record to log AI use
  - Agreement with the client on how AI savings will be shown
  risks_and_guardrails:
  - The ABA suggests marking AI-produced material when stored in client or firm files (ABA-OP512-2024)
  - Disclosure may be appropriate where AI materially affects decisions, and lawyers must follow client guidelines that limit AI use (CALBAR-GENAI-2026)
  - Consultants must tell clients when AI materially affects advice or deliverables, and must comply with client instructions about AI (ICMCI-AICODE-2026)
  - DLA Piper's head of AI innovation said "must use AI" and "cannot use AI without permission" directives arrive in the same inbox (TRI-LEGALWEEK-2026)
  - Billing for AI-assisted work must reflect actual time or the agreed fee basis (ABA-OP512-2024); detail belongs to billing-collections
  human_checkpoints:
  - Responsible partner or engagement lead confirms the client's AI terms at matter opening and records client approval where required
  - Engagement lead decides whether AI use is material and approves disclosure wording
  role_evolution: >-
    Engagement leads take on a record-keeping duty for AI use that did not exist in earlier sign-off. Firm-side
    voices on these terms at Legalweek included a chief pricing and innovation officer and an AI innovation head,
    not only matter partners (TRI-LEGALWEEK-2026).
  evidence_grade: B
  sources:
  - ref: ILTA-TECHSURVEY-2026
    title: '2026 ILTA Technology Survey: Executive Summary'
    publisher: International Legal Technology Association (ILTA)
    type: survey
    url: https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf
    date: 2026-06
    access: full
    locator: p. 5, table Q3.18
  - ref: BLOOMBERGLAW-ACC-2025
