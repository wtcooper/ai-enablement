- id: professional-services-work-production-06
  title: AI drafting assistant in a randomised trial with blinded expert scoring, and its effect on lawyers' own skill
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - document-production
  - review-assurance
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Drafting complex documents is slow, skilled work, and firms do not know whether AI help raises the quality of
    what lawyers deliver or weakens the expertise they would otherwise build by drafting it themselves.
  solution: >-
    In a preregistered randomised trial, 133 practising patent lawyers at eleven US IP firms used a custom AI
    patent-drafting assistant for three months. Expert patent attorneys scored the work blind, and the lawyers were
    then tested on a core task (redlining a patent application) without AI. In law-firm practice, Duane Morris
    states a first draft is never an acceptable final submission and leaves it to each lawyer how to use AI for
    first drafts.
  outcomes:
  - lever: quality
    description: AI access raised the quality of delivered drafting work, with larger gains for junior lawyers
    figure: +0.34 SD at 10 days; +0.38 SD at 90 days
    measures: >-
      Standard deviations of blinded expert scores on benchmark patent drafting tasks, AI-access group against
      control. The study was conducted and its direct costs funded by Google, and several authors are Google
      employees, so provenance is recorded as vendor-published although it is an NBER working paper
    provenance: vendor-published
    source_ref: NBER-AUTOR-2026
  - lever: quality
    description: Without AI after three months, treated lawyers redlined better than controls, but the advantage sat with seniors; juniors showed no average gain and their scores split
    figure: +0.32 SD overall; +0.45 SD for seniors; no average junior gain
    measures: Standard deviations on an expert-scored redlining task done without AI, treated against control
    provenance: vendor-published
    source_ref: NBER-AUTOR-2026
  - lever: speed
    description: In a separate randomised trial with law students (adjacent population), AI raised productivity on five of six tasks
    figure: Vincent AI 38% to 115%; o1-preview 34% to 140%
    measures: Productivity gains in the paper's own measure per task, 127 students from two law schools, six assignments, against the no-AI condition
    provenance: independent
    source_ref: SCHWARCZ-APL-2025
  prerequisites:
  - An assistant tailored to the document type (the trial used a custom drafting assistant)
  - A blinded expert-scoring method, so quality is measured rather than assumed
  - A task done without AI, to detect skill loss
  risks_and_guardrails:
  - The authors suggest foundational expertise may be a prerequisite for durable skill from AI-assisted practice (NBER-AUTOR-2026)
  - Teams may accept an AI-structured draft and edit only phrasing, leaving assumptions untested (TRI-JUDGMENT-2026)
  - Lawyers must review, verify and correct AI output and keep control of strategic judgment (CALBAR-GENAI-2026)
  - In the law-student trial the reasoning model produced more fabricated citations than the retrieval-based tool (SCHWARCZ-APL-2025)
  human_checkpoints:
  - Lawyer revises and owns the draft; a first draft is never the final submission (TRI-ONBOARD-2026)
  - Senior review of consequential output
  role_evolution: >-
    The value of AI drafting help differs by seniority: seniors kept the skill benefit and juniors' outcomes
    diverged (NBER-AUTOR-2026). 48% of professionals in the Thomson Reuters survey fear harm to independent
    judgment development (TR-FOP-2026). Blank Rome frames AI training for juniors as apprenticeship, not replacement
    (HARVEY-BLANKROME-2026); Duane Morris uses champions and mentorship tracks (TRI-ONBOARD-2026).
  evidence_grade: A
  sources:
  - ref: NBER-AUTOR-2026
    title: Does AI Assistance Enhance or Erode Expertise? Evidence from a Three-Month Field Experiment in Patent Drafting (NBER Working Paper 35720)
    publisher: National Bureau of Economic Research (Autor, Rodchenko, Martin, Iscenko, Strand, Pearl, Ferere)
    type: academic
    url: https://www.nber.org/papers/w35720
    date: 2026-09
    access: full
    locator: Abstract and disclosures (full PDF not readable)
  - ref: SCHWARCZ-APL-2025
    title: 'AI-Powered Lawyering: AI Reasoning Models, Retrieval Augmented Generation, and the Future of Legal Practice'
    publisher: University of Minnesota and University of Michigan law schools (Schwarcz, Manning, Barry, Cleveland, Prescott, Rich)
    type: academic
    url: https://www.law.berkeley.edu/wp-content/uploads/archive/2025/12/AI-Powered-Lawyering.pdf
    date: '2025'
    access: full
    locator: Abstract; Introduction
