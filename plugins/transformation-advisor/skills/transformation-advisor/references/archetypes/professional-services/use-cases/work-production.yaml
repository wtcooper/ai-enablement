- id: professional-services-work-production-15
  title: Reusable matter templates where agents run defined tasks and a named reviewer approves at each gate
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - document-production
  - coordination-scheduling
  - review-assurance
  pattern: draft-review-loop
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Each new matter's process is rebuilt from a checklist, a prior deal or memory; lawyers brief the AI, move
    outputs and track status by hand; and the supervision model for multi-step AI work is not yet settled.
  solution: >-
    Harvey's Legal Work Orchestration (announced 2026-10-15; tasks and notifications rolling out, templates in early
    access) ties phases, tasks, playbooks, people and review gates together in a reusable template. Each task carries
    its scope, inputs and reviewer, so an agent assigned a change-of-control review can produce a consent matrix and
    notify the partner, who approves before the next step starts. Certinia lists PMO Quality and Implementation Plan
    agents for project-based firms.
  outcomes:
  - lever: capacity
    description: No usage results yet; Harvey states an expectation
    figure: 'forecast: agents take on an additional 20% of workflow steps in six months, and that share triples within a year'
    measures: Harvey's forecast of the share of workflow steps executed by agents rather than prompted by lawyers; not a measurement
    provenance: vendor-published
    source_ref: HARVEY-ORCH-2026
  prerequisites:
  - A documented, repeatable process (phases, tasks, playbooks, reviewers) that innovation or knowledge teams define once
  - An audit trail of agent actions, and limits on the systems and data an agent may reach
  risks_and_guardrails:
  - Harvey says lawyers stay in control through review gates and agent work stays transparent and auditable (HARVEY-ORCH-2026)
  - Supervision must scale with system autonomy; agents must not file, communicate advice or send client information externally without lawyer review (CALBAR-GENAI-2026)
  - The Law Society defines agentic systems as able to decide and act with limited or no human supervision (LAWSOC-GENAI-2026)
  human_checkpoints:
  - Designated reviewer approves each gated task before the next begins (HARVEY-ORCH-2026)
  - Lawyer approval before any external transmission or filing
  role_evolution: >-
    Harvey says innovation and knowledge teams define templates, associates open matters from them, and partners
    see status without asking for it to be rebuilt from email (HARVEY-ORCH-2026, vendor view). Whether junior roles
    change is not measured.
  evidence_grade: C
  sources:
