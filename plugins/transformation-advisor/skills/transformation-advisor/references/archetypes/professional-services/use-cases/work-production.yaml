- id: professional-services-work-production-22
  title: 'Gated AI rollout for work production: written policy, approved tools, training before access and a human-review rule'
  archetype: professional-services
  module: work-production
  function: risk-compliance-legal
  work_types:
  - review-assurance
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI output looks complete and fluent, so reviewers may accept it untested and responsibility can diffuse. When
    approved tools are missing or weak, professionals use their own out of sight of the firm. Regulators and courts
    now expect leaders to show they took practical steps, yet policy and training coverage varies sharply by firm
    size.
  solution: >-
    The firm adopts a written AI policy, restricts use to approved, professional-grade tools grounded in
    authoritative content, requires training before access, requires a human to review AI-assisted work product and
    independent verification of citations, names who is accountable, and updates all of this as tools become more
    autonomous. Reed Smith (law firm) requires AI certification for all associates.
  outcomes:
  - lever: risk
    description: Firms with a formal GenAI policy, by firm size
    figure: 57% of firms under 50 lawyers; 80% of 50-149; 85% of 150-349; 98% of 350-699; 91% of over 700
    measures: Share of responding firms per size band selecting 'A formal policy is in place' (ILTA survey Q3.18, 508 firms)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Firms requiring training before use, and human review of work product, by firm size
    figure: 'training: 11% (under 50 lawyers) to 72% (over 700); human review: 31% (under 50) to 83% (350-699), 79% over 700'
    measures: Share of responding firms selecting 'Specific training required before use' and 'Work product must be reviewed by a human' (Q3.18)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Unsanctioned use and the access gap
    figure: 34% of professionals use AI tools their organisation has not sanctioned; 41% of those who use AI at work lack professional-grade tools
    measures: Share of 1,816 surveyed professionals (Thomson Reuters sells such tools)
    provenance: vendor-published
    source_ref: TR-FOP-2026
  - lever: quality
    description: Where an organisation has a named AI strategy, more professionals say AI meets expectations
    figure: 66% with a named strategy versus 22% with no active strategy
    measures: Share of surveyed professionals saying AI is meeting or exceeding expectations for creating value at work
    provenance: vendor-published
    source_ref: TR-FOP-2026
  prerequisites:
  - A named accountable partner or committee, an approved-tool list and a way to enforce it
  - Training that covers verification and override, not only tool features
  - Data-handling terms the firm has reviewed rather than marketing assurances (CALBAR-GENAI-2026)
  risks_and_guardrails:
  - Managing lawyers must set clear AI policies and ensure training (ABA-OP512-2024; CALBAR-GENAI-2026); California has proposed a rule duty to that effect (CALBAR-RULES-2026)
  - The English Divisional Court said it expects to ask whether leadership responsibilities were fulfilled (EWHC-AYINDE-2025)
  - The SRA reported 42 reports of potential AI misuse between July 2025 and July 2026, covering citations, supervision and confidentiality (LAWSOCIE-SRAWARN-2026)
  - EU AI literacy obligations have applied since 2 February 2025 (EC-AIACT-2026)
  - Free or consumer tools may reuse inputs for training (CALBAR-GENAI-2026; ABA-OP512-2024)
  - 54% of surveyed consultants report using AI tools without approval (LEXISNEXIS-FOW-2026)
  - Edits tend to cluster on phrasing and tone rather than assumptions (TRI-JUDGMENT-2026)
  human_checkpoints:
  - Partner or committee approves tools and policy; IT and risk approve the tool list
  - Individuals complete training before access
  - Human review of AI-assisted work product, with periodic re-checks as models change (CALBAR-GENAI-2026)
  role_evolution: >-
    Firm leaders take on a documented accountability role (EWHC-AYINDE-2025). Reviewer skill in knowing when to
    trust, verify or override becomes a trained capability (TRI-STANDARDS-2026). ILTA respondents expect to add
    headcount in IT, innovation, security, training, knowledge management and data science (ILTA-TECHSURVEY-2026).
  evidence_grade: B
  sources:
