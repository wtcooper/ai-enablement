- id: professional-services-work-production-05
  title: First drafts of documents and clauses from approved precedents and standards, edited by the lawyer
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Drafting clauses, memos and agreements from scratch repeats work the firm or department has already done,
    assembling from precedent and keeping formatting consistent is manual, and consistency with approved language
    depends on who drafts.
  solution: >-
    Lawyers use AI to produce initial drafts from approved precedents and standards, then edit. Goodwin (law firm)
    lists initial drafts of legal documents among its Legora uses. A Gleiss Lutz partner (law firm) says a very good
    associate uses Harvey two or three hours a day to draft clauses and review diligence reports. BMW Group's legal
    department (in-house) plans first drafts based on approved internal standards and precedents in Legora.
    Microsoft's Copilot for Legal drafts from approved precedents stored in SharePoint with structured placeholders;
    OpenAI made ChatGPT for Word generally available for proofreading, suggested edits and formatting flags; Litera
    announced first drafts from firm-approved precedent in its Lito agent.
  outcomes:
  - lever: capacity
    description: ILTA reports that nearly every responding firm is engaged with GenAI, and most engaged firms use it for drafting, research, summarisation and contract review
    figure: 94% of responding firms engaged with GenAI (up 14 points year on year)
    measures: Share of 508 responding firms engaged with GenAI; the use-type statement is ILTA's characterisation
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: capacity
    description: BMW Group's general counsel says Legora expands the department's capacity to handle work in-house
    figure: none published
    measures: Statement in a rollout announcement; no measurement
    provenance: vendor-published
    source_ref: LEGORA-BMW-2026
  prerequisites:
  - Approved precedents and standards in a form the tool can draw on (BMW internal standards; Microsoft SharePoint precedents)
  - Training before access; ILTA reports 11% of firms under 50 lawyers require it, rising to 72% of firms over 700 (ILTA-TECHSURVEY-2026)
  - Admin controls over data
  risks_and_guardrails:
  - A lawyer must review, verify and correct AI-generated output and may not delegate professional judgment (CALBAR-GENAI-2026)
  - None of the firm or in-house sources publish error rates for drafted text
  - Artificial Lawyer says it is unclear whether Microsoft's skills will be good enough to keep lawyers in Word (AL-COPILOT-2026)
  - OpenAI's Trusted Access programme offers zero data retention for its API (LAWSITES-OPENAI-2026)
  human_checkpoints:
  - Lawyer edits and approves every draft before it leaves the firm or department
  role_evolution: >-
    A Gleiss Lutz partner describes associates drafting with AI daily (HARVEY-DTGLEISS-2026). Reed Smith requires
    AI certification for all associates (HARVEY-REEDSMITH-2026). Artificial Lawyer expects light AI users to be most
    affected because the tool sits in the application they already use (AL-COPILOT-2026).
  evidence_grade: B
