  problem: Tracking regulatory change across jurisdictions is a continuous reading task done by people and bulletins.
  solution: >-
    Hogan Lovells Cadwalader (law firm) will be a design partner for Legora's Monitors, a regulatory
    horizon-scanning tool, guiding the sources, jurisdictions and alert logic for its global regulatory practice.
