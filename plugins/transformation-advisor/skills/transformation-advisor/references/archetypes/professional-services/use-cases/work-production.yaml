- id: professional-services-work-production-11
  title: Pre-release check of citations, references, quotations and internal consistency in AI-assisted documents
  archetype: professional-services
  module: work-production
  function: service-delivery
  work_types:
  - review-assurance
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI can produce fluent text that cites authorities or reports that do not exist or do not say what is claimed,
    and fabricated references have reached courts and clients. In long reports, keeping facts, dates and figures
    consistent is hard, and an inconsistent timeline can undermine credibility.
  solution: >-
    Before an AI-assisted document goes to a court, client or counterparty, every authority, quotation, reference
    and figure is checked against its source, and a named person records the check. Checking can be partly
    automated: Grant Thornton UK's forensic team (accounting firm) uses Legora as an extra layer beside its
    multi-reviewer quality control and gives one example where the tool flagged a date inconsistent with the
    documented timeline; the maintainer of a court-decision database built an automated reference checker,
    PelAIkan. The ICMCI code for management consultants bars submitting unreviewed AI output as finished work.
  outcomes:
  - lever: quality
    description: One reported catch of a timeline inconsistency; no catch or false-alarm rate published
    figure: none published
    measures: Anecdote of a single flagged date
    provenance: self-reported
    source_ref: LEGORA-GRANTTHORNTON-2026
  - lever: risk
    description: Scale of the failure the check targets (not an outcome of the check)
    figure: 2,202 decisions; 872 with a lawyer as the party; 1,267 with a pro se litigant (read 2026-10-19)
    measures: Decisions in which a court or tribunal found or implied reliance on hallucinated content, as catalogued in a live database; a count of found cases, not an error rate
    provenance: independent
    source_ref: CHARLOTIN-DB-2026
  - lever: risk
    description: Deloitte Australia agreed to repay the final instalment on a government contract after the department found incorrect footnotes and references; the revised report disclosed Azure OpenAI use
    figure: AUD 440,000 contract; 237-page report; a researcher reported up to 20 errors
    measures: Contract value, report length and errors claimed by the researcher who raised the issue, per the AP report
    provenance: independent
    source_ref: CTV-DELOITTE-2025
  prerequisites:
  - Access to authoritative sources (legislation databases, official law reports, publisher databases)
  - A written rule on who checks, what is checked and where the record is kept
  - Machine-readable references if the check is automated
  risks_and_guardrails:
  - Competence and candour duties apply to AI output whatever the tool (ABA-OP512-2024; CALBAR-GENAI-2026)
  - California proposed a rule comment saying the duty of candour includes verifying that cited authorities exist and are not misstated (CALBAR-RULES-2026)
  - Ireland's High Court practice direction HC 142, effective 1 September 2026, requires independent verification of AI-generated material (LAWSOCIE-HC142-2026)
  - The English Divisional Court said it expects to ask whether leaders have taken practical measures so every individual complies (EWHC-AYINDE-2025)
  - The ICMCI code requires independent verification of facts, calculations, citations and references (ICMCI-AICODE-2026)
  - A second Deloitte report, for a Newfoundland and Labrador department, drew similar concerns (ICAEW-AI2026-2026; BNN-DELOITTE-2025)
  - No independent measurement of an automated reference checker was found
  human_checkpoints:
  - The signing lawyer or engagement lead confirms each authority exists and supports the stated point
  - Supervising lawyer or quality partner confirms the check ran before release
  - Existing multi-reviewer quality control remains the control (LEGORA-GRANTTHORNTON-2026)
  role_evolution: >-
    Responsibility sits with the signing lawyer and with firm leaders for having measures in place
    (EWHC-AYINDE-2025). Grant Thornton positions the tool as an extra set of eyes that supports, never replaces,
    human review (LEGORA-GRANTTHORNTON-2026).
  evidence_grade: B
  sources:
  - ref: LEGORA-GRANTTHORNTON-2026
    title: How Grant Thornton UK is delivering sharp client insights in high-stakes forensic work
    publisher: Legora
    type: vendor
    url: https://legora.com/customers/grant-thornton
    date: '2026'
    access: full
    locator: From pilot to practice (quality assurance paragraph)
