- id: professional-services-work-production-18
  title: In-house lawyers build workflow agents for recurring assessments such as data protection impact assessments
  archetype: professional-services
  module: work-production
  function: risk-compliance-legal
  work_types:
  - review-assurance
  - document-production
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Recurring assessments such as data protection impact assessments (DPIAs) and non-compete checks consume legal
    time for each business request.
  solution: >-
    In-house lawyers build agents or workflows in the platform for recurring assessments. Dentsu's legal team
    (in-house) says a US-based media lawyer built a Harvey agent for DPIAs, and the team uses workflows for
    non-compete checks on new customers and for commercial compliance obligations. Harvey lists self-serve NDA review
    for business partners as a Shared Spaces use.
  outcomes:
  - lever: speed
    description: A lawyer-built DPIA agent is reported to have cut the process time
    figure: 75% reduction
    measures: Harvey's case study says the agent cut the process by 75%; it does not state what was timed, the sample, or who measured it
    provenance: vendor-published
    source_ref: HARVEY-DENTSU-2026
  - lever: capacity
    description: Dentsu estimates time saved per lawyer and reports high weekly use
    figure: 93% of lawyers use Harvey weekly; an estimated 4 to 10 hours saved per week per lawyer
    measures: Weekly use across a 250-person legal and compliance function; hours saved are described as an estimate
    provenance: vendor-published
    source_ref: HARVEY-DENTSU-2026
  prerequisites:
  - Lawyers with time and skill to build workflows, and vendor support (Dentsu says it works closely with Harvey because it has no large R&D team)
  - Integration with Outlook, Word and SharePoint so lawyers stay in their tools
  risks_and_guardrails:
