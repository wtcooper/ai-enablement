    publisher: Bloomberg Law
    type: press
    url: https://news.bloomberglaw.com/us-law-week/ai-does-little-to-reduce-law-firm-billable-hours-survey-shows
    date: '2025-10-14'
    access: full
    locator: Paragraphs on outside counsel guidelines and survey results
