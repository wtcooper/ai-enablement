    Sonsini; also Fosters Solicitors) and accounting and advisory firms (US: Warren Averett, GHJ; an unnamed Big Four tax
    division). Grade B, not A: every figure is on a vendor-authored page with no stated baseline or method; the only controlled
    comparison (Big Four) is unnamed; Lerners'' docket time is a recollection. An unnamed Am Law 200 firm''s head-to-head
    with Intapp Time (70% of users released more time; entries +24%; release more than 40% faster) and Ajax''s 42-61% uplift
    in recorded hours are vendor claims with no named customer. Vendor sizing of unrecorded time is not comparable: Laurel''s
    11% is the share of unsubmitted time (itself 28% of the workday) that should have been billed (LAUREL-SOW-2025), while
    Litify''s release (entry 02) says up to 30% of billable work goes unrecorded. No override or edit rate for drafted entries
    is published anywhere. Most Laurel customer pages carry the same page date (21 Aug 2026), which may reflect a site update.
    Firm-level use of the same data for leakage, profitability and leverage is held in professional-services-firm-finance-03.
    Merged from practice 01 and 02, discourse 01 and governance 01.'
- id: professional-services-billing-collections-02
  title: Work done inside AI platforms is turned into draft time entries with matter context and a narrative, for the lawyer
    to review
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - transaction-processing
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: As more of the working day moves into AI platforms, that work is hard to capture and easy to leave off the timesheet;
    Laurel says AI work has been among the hardest to capture, and firm leaders also want to see what the AI work returns
    (LEGORA-LAUREL-2026).
  solution: The AI platform passes completed tasks to the timekeeping system, which creates a draft entry with client, matter,
    duration and an AI-generated narrative; the lawyer reviews, edits and submits it through the firm's normal approval process.
    Aderant's iTimekeep integration with Harvey was announced as live on 2026-08-17 for firms using both; Laurel and Legora
    announced on 2026-10-13 that each Legora task will become a draft entry, with automated capture available first and a
    second phase to measure AI usage and value; Litify with Billables AI (2026-05-19) generates review-ready entries inside Litify;
    Laurel and Thomson Reuters (2026-08-05) cover CoCounsel Legal, Westlaw, Practical Law and HighQ activity (ADERANT-ITIMEKEEPHARVEY-2026;
    LEGORA-LAUREL-2026; LAWSITES-LITIFY-2026; TR-LAUREL-2026).
  outcomes:
  - lever: capacity
    description: none published
    figure: none published
    measures: 'not applicable: announcements with no deployment results'
    provenance: vendor-published
    source_ref: ADERANT-ITIMEKEEPHARVEY-2026
  prerequisites:
  - Firm licenses both the AI platform and the timekeeping product (ADERANT-ITIMEKEEPHARVEY-2026; LEGORA-LAUREL-2026)
  - Existing billing controls and approval workflow retained (ADERANT-ITIMEKEEPHARVEY-2026)
  risks_and_guardrails:
  - The sources do not say whether the duration on an auto-created entry is the lawyer's time or the AI task's run time. Hourly
    billing must reflect time actually spent (CALBAR-GENAI-2026, p. 8; DCBAR-OP388-2024, section E), and a lawyer may not
    bill time 'saved' by the tool (TXETHICS-OP705-2025, Fees). This is an open question for adopters, not a finding of the
    sources.
  - Lawyers may not charge a client for time spent learning a general AI tool (ABA-BLT-2024, Fees, summarising Formal Opinion
    512).
  - 'A client can bar pass-through of AI time: Zscaler''s guidelines say time and cost associated with AI-generated work product
    shall not be passed on (ZSCALER-OCG-2025, ''Artificial Intelligence (AI)'').'
  - Entry quality and guideline compliance are asserted by vendors and not measured publicly (LEGORA-LAUREL-2026; ADERANT-ITIMEKEEPHARVEY-2026).
  human_checkpoints:
  - Lawyer reviews, edits and submits each draft; the firm approval process applies (ADERANT-ITIMEKEEPHARVEY-2026; LEGORA-LAUREL-2026)
  role_evolution: Lawyers confirm drafts generated from their own AI-assisted work instead of reconstructing it (LEGORA-LAUREL-2026;
    described aim).
  evidence_grade: C
