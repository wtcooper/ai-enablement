- id: professional-services-billing-collections-08
  title: 'Idea: score pre-bills for write-down risk by matter, client and timekeeper so partners adjust or explain entries
    before the bill goes out'
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - data-reporting
  - expert-judgment
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: Write-downs happen late and unevenly. In TRI's 2023 survey, 43% of partners said they always or usually reduce a bill
    when the time spent exceeds their own expectations, and the average partner wrote off over 300 hours of their own potentially
    billable time after it was reported, nearly $190,000 of fees per partner (TRI-WRITEDOWNS-2023, pp. 2-3 and 12). TRI's 2026 rates report shows litigation
    with far more write-offs than transactional practices, and a long-term decline in realization since 2021 (TRI-RATES-2026,
    pp. 6, 10-11).
  solution: 'Idea: use historical realization, client guidelines and AI-assisted bill analysis to flag entries and matters
    likely to be reduced before the bill is issued. Perlin argues GenAI could help firms predict the cost of tasks and matters
    and reduce the ''granted reductions'' clients impose (GEORGETOWN-PERLIN-2025; LEGALFUTURES-PERLIN-2025). Laurel''s guideline-based
    flagging (entry 05) is the nearest product. No deployment found.'
  outcomes:
  - lever: cost
    description: none published
    figure: none published
    measures: 'not applicable: idea'
    provenance: independent
    source_ref: GEORGETOWN-PERLIN-2025
  prerequisites:
  - Several periods of realization data by timekeeper, client and matter type (TRI-RATES-2026 shows such data exist at firm
    level)
  risks_and_guardrails:
  - Some discounting protects client relationships; firms that push for full post-work realization risk damaging them (TRI-RATES-2026,
    p. 11).
  - Billing must stay accurate and reasonable whatever the prediction (CALBAR-GENAI-2026, p. 8).
  - TRI's 2023 write-down data predate current AI tools (TRI-WRITEDOWNS-2023).
  human_checkpoints:
  - Billing partner decides adjustments (existing step) (TRI-ROI-2025)
  role_evolution: Not described in the sources.
  evidence_grade: D
