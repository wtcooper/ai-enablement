- id: professional-services-billing-collections-14
  title: 'Idea: tag AI-assisted work in time entries and check it before billing against each client''s AI terms and the fee
    rules'
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - review-assurance
  - transaction-processing
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: Client terms already ask for this. Zscaler's guidelines say a timekeeper who uses generative AI for a discrete
    task should note it in the time entry and that AI time and cost shall not be passed on (ZSCALER-OCG-2025). At Legalweek
    2026 a Ropes & Gray innovation director said clients are starting to ask whether AI was used on a task and how much it
    saved, while DLA Piper's Barclay Blair said other clients will not pay for certain services performed by AI (TRI-LEGALWEEK-2026).
    In TRI's 2026 survey 68% of corporate legal professionals did not know whether their outside firms use AI (TRI-GREATDISCONNECT-2026).
    Bar opinions agree an hourly bill must reflect time actually spent but differ on flat fees and AI charges, and a billing
    partner has to apply them matter by matter (CALBAR-GENAI-2026; TXETHICS-OP705-2025; VACOURTS-LEO1901-2025).
  solution: 'Idea: the timekeeping tool records, or the AI platform reports (entry 02), which tasks were AI-assisted. Before
    invoicing, billing checks those entries against the client''s AI terms (write off, discount, disclose or report) and against
    the fee rules: hourly entries reflect time actually spent, including time refining and checking AI output; any AI charge
    is classed as overhead or a matter cost; flat fees get a reasonableness review. Everlaw suggests in-house teams put light-touch
    disclosure requirements into guidelines, RFPs or matter kickoffs (EVERLAW-BLOG-2026). No firm or vendor describes this
    check; the requirement is documented, the tooling is not.'
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: 'not applicable: idea'
    provenance: self-reported
    source_ref: ZSCALER-OCG-2025
  prerequisites:
  - Per-client AI terms held as rules (entry 03) and a record of which matters and tasks used AI; ILTA says tracking and compliance
    tools for work-product governance are in use at fewer than one in five firms (ILTA-TECHSURVEY-2026, p. 9)
  - Firm policy on which AI tools are overhead and which are billed, and fee-agreement wording on AI costs (CALBAR-GENAI-2026,
    p. 8)
  risks_and_guardrails:
  - 'California: hourly billing must reflect time actually spent; general AI subscriptions are overhead; matter-specific AI
    costs must reasonably reflect actual cost, with no markup without informed written consent; lawyers must follow client
    guidelines that restrict AI (CALBAR-GENAI-2026, pp. 7-8).'
  - 'Texas: an hourly lawyer may not bill time ''saved'' by AI, and per-use AI fees are generally not recoverable above the
    amount paid (TXETHICS-OP705-2025, Fees). DC: absent another arrangement, bill only time actually spent (DCBAR-OP388-2024,
    section E). North Carolina: a lawyer who now spends one hour instead of three may not bill three (NCBAR-FEO1-2024).'
  - 'Flat fees: ABA Formal Opinion 512, as quoted, says the same flat fee may be unreasonable if a tool makes the work much
    quicker (TRI-ABA512-2025); Virginia''s LEO 1901 disagrees (VACOURTS-LEO1901-2025).'
  - 'Tax practice: the IRS Office of Professional Responsibility says billing manual time not actually spent, or double billing
    for AI-assisted tasks, may violate Circular 230 section 10.27 depending on the facts (IRS-OPR-2026, item 2).'
  - 'Australia: solicitors should record and disclose, if the client requests, when and how AI was used and how it is reflected
    in costs (AUSLEG-AISTATEMENT-2024, p. 2). England and Wales: the SRA has no specific generative AI guidance on use or
    disclosure for client care (LAWSOC-GENAI-2026).'
  - Disclosure may invite fee cuts, since some clients use AI adoption as leverage to reduce fees (TRI-LEGALWEEK-2026). Layer3,
    a vendor, says most AI provisions require disclosure or consent and bar billing for AI-driven time savings, and that charging
    full hours for AI-accelerated work leads to write-offs (LAYER3-OCG-2026, summary and Clause 4).
  human_checkpoints:
  - Timekeeper confirms the AI tag; billing partner applies the client rule and judges reasonableness of flat fees (CALBAR-GENAI-2026,
    p. 8)
  - Client informed written consent before any markup on matter-specific AI costs (CALBAR-GENAI-2026, p. 8)
  role_evolution: Not described in the sources. Pricing and innovation leads (Greenberg Traurig's Chief Pricing and Innovation
    Officer, DLA Piper's AI innovation lead) handle client AI-value conversations (TRI-LEGALWEEK-2026).
  evidence_grade: D
