- id: professional-services-billing-collections-05
  title: AI checks pre-bills against client guidelines and billing history and proposes fixes that a billing partner accepts
    or rejects before the invoice goes out
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - review-assurance
  - transaction-processing
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Foley Mansfield's managing partner said partners spent an enormous amount of time reviewing pre-bills each month;
    Verify's product lead says some partners spend up to a week a month cleaning up invoices (LEGALIT-FOLEY-2024). Laurel
    relays firm anecdotes of a bill that took 210 emails between partners and billing, and of a partner spending 12 hours
    every first Sunday of the month on a 1,000-page pre-bill (LAUREL-BILLING-2026). Elite reports invoice rejection rates
    rising from 11% to 18% in 2025, and says 71% of firms in its study still manage guideline compliance mainly by hand (ELITE-REJECT-2026).
  solution: Foley Mansfield (law) went live firmwide with Verify from Zero Systems, which reads outside counsel guidelines
    and historical billing data held in Elite and Aderant, flags pre-bill entries that break rules such as block billing,
    vague narratives or excessive time, and suggests fixes accepted or rejected with one click (LEGALIT-FOLEY-2024). Aderant
    signed a deal on 2025-08-07 to acquire HerculesAI's legal technology assets, described as AI-driven billing compliance
    (ADERANT-HERCULES-2025). Elite Validate, Fulcrum GT's e-billing validation and Intapp Billstream take the same approach;
    Laurel Billing's Compliance agent, announced as coming soon, checks the whole bill against the guidelines and the work
    record, including duplicate billing across timekeepers, and attaches a reason and a written fix to each flag (ELITE-VALIDATE-2025;
    FULCRUM-ILTACON-2026; INTAPP-BILLSTREAM-2026; LAUREL-BILLING-2026; LAUREL-BILLINGPAGE-2026).
  outcomes:
  - lever: speed
    description: Foley's managing partner says reviewing the items the AI highlights replaced days of pre-bill review. A stage
      remark, not a tracked metric.
    figure: days to minutes (quote)
    measures: the managing partner's description of pre-bill review time before and after Verify; no figures
    provenance: self-reported
    source_ref: LEGALIT-FOLEY-2024
  - lever: cost
    description: Zero Systems' CEO says Verify recovers revenue that would otherwise be written off and cuts review time.
    figure: about 6% of revenue otherwise written off; about 50% less pre-bill review time
    measures: the vendor CEO's statements to the publication; basis, sample and period not given
    provenance: vendor-published
    source_ref: LEGALIT-FOLEY-2024
  prerequisites:
  - Guideline documents and historical billing data in the billing system (Elite or Aderant at Foley) (LEGALIT-FOLEY-2024)
  - Rules the firm accepts before enforcement (ELITE-VALIDATE-2025)
  - A billing workflow with preparer, billing partner and finance stages (LAUREL-BILLINGPAGE-2026)
  risks_and_guardrails:
  - An agent that rewrites narratives can drift from the work done, so reviewers need the work record beside each fix (AUSLEG-AISTATEMENT-2024,
    p. 1; CALBAR-GENAI-2026, p. 8).
  - No error, override or false-flag rate is published for any pre-bill tool.
  - Elite attributes the rise in rejections to client AI review without publishing causal evidence (it calls this 'the more
    likely explanation'), and it sells the tooling it recommends (ELITE-REJECT-2026; ELITE-IDEA-2026).
  - Verify runs its models locally and, per the vendor, data stays inside the firm perimeter (LEGALIT-FOLEY-2024); Laurel
    says nothing goes out without sign-off (LAUREL-BILLINGPAGE-2026). Laurel Billing is not yet available.
  - Perlin argues GenAI may help prepare bills that better conform to client guidelines, while also letting sophisticated
    clients scrutinise invoices in new ways (LEGALFUTURES-PERLIN-2025).
  human_checkpoints:
  - Billing partner or biller accepts or dismisses each flagged item and signs off the bill (LEGALIT-FOLEY-2024; LAUREL-BILLINGPAGE-2026)
  role_evolution: Partners review a short list of flagged items instead of whole pre-bills (LEGALIT-FOLEY-2024). Laurel describes
    preparers, billing partners and finance in one workspace, with partners 'approving decisions, not entries' (LAUREL-BILLINGPAGE-2026).
    Elite says billing teams should move from correcting rejected invoices to preventing rejections (ELITE-REJECT-2026).
  evidence_grade: B
