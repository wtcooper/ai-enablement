- id: professional-services-billing-collections-03
  title: Client billing guidelines are turned into rules and checked as each time entry is written, with suggested narratives
    and task codes
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - review-assurance
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: 'Outside counsel guidelines (OCGs: a client''s billing rules for the firms it hires) can run 15 to 100 pages per
    client (LAUREL-BILLING-2026), and a product lead at Zero Systems calls retaining hundreds of clients'' rules humanly impossible
    (LEGALIT-FOLEY-2024). Clients enforce them hard: Zscaler rejects block-billed lines (resubmit at a 15% reduction, or pay
    at a non-appealable 10% reduction at its discretion) and discounts invoices received more than 60 days late by 20% (ZSCALER-OCG-2025).
    E-billing systems reject invoices without valid LEDES or UTBMS codes (LAYER3-BILLINGOCG-2026). Intapp says revenue leaks
    when entries are coded inconsistently or returned in billing review (INTAPP-TIMERELEASE-2026).'
  solution: Guideline documents are read once into rules (prohibited activities, restricted words, narrative and format requirements,
    block billing) held at firm, client or matter level; an administrator approves them before they go live. Each entry is
    then checked as it is written, with suggested narratives and task codes the timekeeper accepts or edits. Intapp's May
    2026 Time release adds work-code prediction from the narrative and the matter's coding history and one-click narrative
    compliance; Laurel's compliance feature gives inline feedback, and Laurel says corrections made in its unreleased Billing product
    will feed back into narrative and code drafting; Aderant's Time Agent (early access, 2026-08-25) improves narratives, flags billing risk and recommends
    codes; Elite Validate (announced 2025-02-11) reads OCGs into billing rules and learns from past rejections (INTAPP-TIMERELEASE-2026;
    LAUREL-COMPLIANCE-2026; LAUREL-BILLING-2026; ADERANT-AGENTSEAP-2026; ELITE-VALIDATE-2025).
  outcomes:
  - lever: speed
    description: Pre-bill review time at one unnamed Laurel customer, which Laurel attributes to rules enforced at timekeeping.
    figure: 30-40% reduction
    measures: pre-bill review time at one customer, 'from that alone'; baseline, period and method not stated
    provenance: vendor-published
    source_ref: LAUREL-BILLING-2026
  - lever: speed
    description: Intapp headline for time-entry release speed.
    figure: 75% faster time entry release
    measures: Intapp heading; no numerator, denominator, sample or period stated
    provenance: vendor-published
    source_ref: INTAPP-TIME-2026
  - lever: cost
    description: Intapp's 'high-ROI' labels for Intapp Time plus Billstream.
    figure: 40% faster revenue cycles; 20% less time spent entering time; 10% reduction in write-offs
    measures: Intapp's labels; no sample, period or baseline stated
    provenance: vendor-published
    source_ref: INTAPP-TIMEBILL-2026
  prerequisites:
  - Each client's guidelines codified and kept current; Zscaler states it may modify its guidelines at any time (ZSCALER-OCG-2025,
    'Summary')
  - Administrator review of extracted rules before enforcement; enforcement set per rule as block, acknowledge, warn or awareness
    (LAUREL-COMPLIANCE-2026)
  - Matter coding history to learn from (INTAPP-TIMERELEASE-2026) and integration with the billing system (LAUREL-BILLING-2026)
  risks_and_guardrails:
  - A narrative drafted to satisfy a guideline must still describe work actually done (AUSLEG-AISTATEMENT-2024, p. 1; CALBAR-GENAI-2026,
    p. 8).
  - 'Clients give conflicting AI instructions: some want AI used and savings shown, others require permission before any AI
    use (TRI-LEGALWEEK-2026, DLA Piper panel), so rules need per-client AI terms as well as format rules (see entry 14).'
  - The UTBMS code-set index lists no AI-specific code set (LEDES-UTBMS-2026).
  - Elite Validate applies rules only after the firm accepts them; Aderant says users are the final decision makers in all
    agent workflows (ELITE-VALIDATE-2025; ADERANT-AGENTSEAP-2026).
  human_checkpoints:
  - Risk or billing administrator approves extracted rules (LAUREL-COMPLIANCE-2026)
  - Timekeeper accepts or edits suggested codes and narratives before release (INTAPP-TIMERELEASE-2026)
  role_evolution: Timekeepers review suggestions instead of looking up codes; risk and billing administrators approve machine-extracted
    rules instead of summarising guideline documents (INTAPP-TIMERELEASE-2026; LAUREL-COMPLIANCE-2026). Billers and coordinators
    are described moving from re-keying partner mark-ups to approving flagged fixes (LAUREL-BILLING-2026; vendor description).
  evidence_grade: C
