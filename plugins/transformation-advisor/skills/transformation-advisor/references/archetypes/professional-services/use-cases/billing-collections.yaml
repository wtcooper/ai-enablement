    firm and is credited to visibility rather than AI. Named accounting time-capture deployments (Warren Averett, GHJ) are
    in entry 01. Billing-model choices among tax practitioners belong to scoping-pricing (scoping-pricing-16). Discourse 12,
    with the Uku survey from the governance input.'
