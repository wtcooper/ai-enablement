- id: professional-services-billing-collections-11
  title: Overdue invoices are detected and chased automatically, with trained human collectors handling calls and escalations
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - transaction-processing
  - client-interaction
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: CollBox's co-founder, citing Clio data, said it takes law firms an average of 97 days to get paid and that no one
    owns accounts receivable inside firms (ABAJ-TECHSHOW-2026). Wells Fargo Legal Specialty Group data for H1 2026, as reported
    secondhand, show inventories up 17.7% and collection cycles slowing by 5% (LAWFUEL-WF-2026).
  solution: CollBox, winner of ABA Techshow 2026's Startup Alley, integrates with practice management systems, detects unpaid
    bills and chases them with email reminders and calls from trained accounts-receivable specialists. The ABA Journal headline
    calls it AI-powered; the pitch as reported describes detection and reminders plus human collectors (ABAJ-TECHSHOW-2026).
  outcomes:
  - lever: risk
    description: Revenue the company says it recovered for law firms.
    figure: more than $100 million in the past year
    measures: company-reported at a three-minute pitch; number of firms, period definition and basis not stated
    provenance: vendor-published
    source_ref: ABAJ-TECHSHOW-2026
  prerequisites:
  - Integration with the practice management system so unpaid bills are detected (ABAJ-TECHSHOW-2026)
  - A client-relationship rule for who may chase which client (not covered by the sources)
  risks_and_guardrails:
  - Some post-work discounting protects client relationships, and weak collections undermine the ability to push rates higher
    (TRI-RATES-2026, pp. 11-12).
  - No bar guidance on automated payment reminders or third-party collectors was found.
  human_checkpoints:
  - Trained collectors make calls and handle escalations (ABAJ-TECHSHOW-2026)
  role_evolution: The co-founder says no lawyer joined a firm to be a bill collector; collection moves to a service or to
    billing staff (ABAJ-TECHSHOW-2026).
