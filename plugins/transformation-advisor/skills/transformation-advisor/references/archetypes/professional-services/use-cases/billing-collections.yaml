- id: professional-services-billing-collections-04
  title: A firm-built tool checks time-entry narratives in bulk before billing and proposes corrections (Linklaters)
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - review-assurance
  - document-production
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Reviewing narrative time entries for the wrong workstream, typos and non-compliance with client requirements is
    laborious (NONBILLABLE-LINKLATERS-2025).
  solution: Linklaters' Narrative Checker is an Excel plugin that sends narratives to Laila, the firm's in-house chatbot,
    to find common time-recording issues and propose corrections that the user reviews. A managing associate built it as a
    side project; it was developed with the in-house development team, piloted globally over the summer and released to the
    whole firm on 1 September; the interview is dated 2025-10-09 (NONBILLABLE-LINKLATERS-2025).
  outcomes:
  - lever: speed
    description: Processing speed as described by the managing associate who built it.
    figure: around a thousand narratives a minute
    measures: narratives processed per minute, as stated by the builder; test conditions not given
    provenance: self-reported
    source_ref: NONBILLABLE-LINKLATERS-2025
  - lever: capacity
    description: Early use after the global launch.
    figure: used over 300 times across 13 offices in just over a week
    measures: number of tool uses, as stated by the builder; users and entries per use not given
    provenance: self-reported
    source_ref: NONBILLABLE-LINKLATERS-2025
  prerequisites:
  - An in-house, data-secure chatbot the firm already trusts (NONBILLABLE-LINKLATERS-2025)
  - Senior sponsorship, a six-month internal GenAI secondment and in-house developers to turn a prototype into an enterprise
    version (NONBILLABLE-LINKLATERS-2025)
  risks_and_guardrails:
  - No accuracy, false-positive or override data are published; the builder says the user reviews each suggestion and the
    aim is to keep humans in the loop (NONBILLABLE-LINKLATERS-2025).
  - The aim of saving hundreds or thousands of hours a year is a goal, not a result (NONBILLABLE-LINKLATERS-2025).
  human_checkpoints:
  - User accepts or rejects each suggested correction (NONBILLABLE-LINKLATERS-2025)
  role_evolution: The builder says the goal is to free lawyers, PAs and secretaries for more valuable work (NONBILLABLE-LINKLATERS-2025).
  evidence_grade: B
