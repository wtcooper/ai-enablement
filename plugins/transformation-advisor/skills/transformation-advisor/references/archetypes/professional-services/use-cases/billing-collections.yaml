# professional-services / billing-collections use cases (synthesised 2026-10-19 from research/runs/wave3)
# Time capture to cash: time entry, narratives and codes, client billing guidelines, pre-bill review, e-billing,
# rejections and appeals, collections, and the client-side (in-house) review of the bills. Firm-level realisation,
# profitability, AI cost and ROI live in firm-finance.yaml; deal-level pricing and fee terms in scoping-pricing.yaml.
# Firm kinds are named in each entry's notes. In-house examples are tagged "in-house".

- id: professional-services-billing-collections-01
  title: Professionals review AI-drafted time entries built from captured email, document, call and application activity instead
    of reconstructing time from memory (law and accounting firms)
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: Time is often written from memory at the end of a day or week, so short tasks are missed and recording time is
    itself unbillable work (LEGORA-LAUREL-2026). Lerners lawyers described stopping work to log time and mixing pink slips,
    Word files and dictation (LAUREL-LERNERS-2026). Warren Averett, an accounting firm, required daily time by 9:00 a.m.,
    so each day began by reconstructing the previous one (LAUREL-WARREN-2026). A defense-firm COO links the tedium of time
    capture to talent leaving defense work (TRI-KOPKA-2026).
  solution: 'A capture layer records activity in email, documents, calls, meetings and applications, assigns it to a client
    and matter, and drafts entries with narratives; the professional reviews, groups, edits and releases them. Laurel is named
    at Lerners (integrated with Elite 3E), Obermayer, Tonkon Torp and Berger Singerman (integrated with Aderant) among law
    firms, and at Warren Averett and GHJ among accounting firms; Allens, Wilson Sonsini and Fosters Solicitors are announced
    selections or rollouts with no results. A Big Four firm''s tax division (unnamed) rolled it out to 1,000 timekeepers.
    Billables AI (inside Litify), Ajax and Intapp Time sell comparable capture (LAUREL-LERNERS-2026; LAUREL-BERGER-2026; LAUREL-WARREN-2026;
    LAUREL-GHJ-2026; LAUREL-BIGFOURTAX-2026; LAWSITES-LITIFY-2026; LAWSITES-AJAX-2025; INTAPP-TIMEKEEPING-2026). Pattern ''other'':
    passive activity capture, classification and drafting, with a person reviewing.'
  outcomes:
  - lever: capacity
    description: 'Lerners: additional billable time captured per lawyer per day after adopting Laurel.'
    figure: +0.48 billable hours per lawyer daily
    measures: '''billable hours captured per lawyer daily'' (customer-story key fact); baseline, period and sample not stated'
    provenance: vendor-published
    source_ref: LAUREL-LERNERS-2026
  - lever: speed
    description: Lerners' Firm Chair says her daily dockets take about five minutes including clean-ups, against 30 to 45
      minutes before. A personal recollection, not a tracked metric.
    figure: about 5 minutes versus 30 to 45 minutes
    measures: time the Firm Chair says she spends on daily dockets (her own estimate)
    provenance: self-reported
    source_ref: LAUREL-LERNERS-2026
  - lever: capacity
    description: 'Tonkon Torp: extra time captured, revenue per timekeeper and entries per day.'
    figure: 21 minutes a day (key facts; the body says 20); about $20,000 more revenue per timekeeper a year; 18% more entries
      per day
    measures: 'Laurel''s wording: ''average lift in daily billable hours per Laurel timekeeper'', revenue per timekeeper,
      entries released per day; the managing partner mentions the firm''s own analytical work but it is not shown; no baseline'
    provenance: vendor-published
    source_ref: LAUREL-TONKON-2026
  - lever: speed
    description: 'Tonkon Torp: the page says the collection cycle is 20% faster; the key facts call it a 20% increase in release
      velocity.'
    figure: 20% faster
    measures: collection cycle or release velocity (the page uses both); definition and baseline not stated
    provenance: vendor-published
    source_ref: LAUREL-TONKON-2026
  - lever: capacity
    description: 'Berger Singerman (law): billable time recovered and faster completion of entries.'
    figure: nearly 15 minutes per attorney per day; entries completed about two days faster
    measures: average billable time recovered by attorneys each day; time-entry completion time; method not stated
    provenance: vendor-published
    source_ref: LAUREL-BERGER-2026
  - lever: capacity
    description: 'GHJ (accounting): billable time and fees recovered per timekeeper.'
    figure: 0.42 billable hours per timekeeper per day; $16,128 billable fees per timekeeper a year; 0.02 fewer days to time
      submission
    measures: Laurel key-facts wording; baseline and period not stated
    provenance: vendor-published
    source_ref: LAUREL-GHJ-2026
  - lever: capacity
    description: 'Unnamed Big Four tax division: first 1,000 adopters against a random control group balanced by sub-service
      line and rank; Laurel says the firm audited and verified the method. The firm is unnamed, so this does not raise the
      grade.'
    figure: +2.3 chargeable hours per timekeeper per week
    measures: chargeable hours per timekeeper per week attributable to Laurel against a random control group (adopter cohort
      of 1,000)
    provenance: vendor-published
    source_ref: LAUREL-BIGFOURTAX-2026
  prerequisites:
  - Integration with the billing system and Microsoft tools (Elite 3E at Lerners; Aderant at Berger Singerman) (LAUREL-LERNERS-2026;
    LAUREL-BERGER-2026)
  - 'Switching off the legacy timekeeping route: Obermayer turned off its old system within weeks of launch, and GHJ turned
    off its legacy system after the pilot (LAUREL-OBERMAYER-2026; LAUREL-GHJ-2026)'
  - Training from day one (Lerners trains every new partner, associate and student) and a rollout plan for early adopters,
    the majority and holdouts (Warren Averett) (LAUREL-LERNERS-2026; LAUREL-WARREN-2026)
  - Client-centred file and matter naming so activity maps to the right matter (an Obermayer attorney changed his naming after
    seeing the activity log) (LAUREL-OBERMAYER-2026)
  - A way for timekeepers to pause capture for personal matters; Ajax describes one (LAWSITES-AJAX-2025)
  - 'Security attestation: Laurel calls SOC 2 Type II the minimum bar and says ISO 42001 is increasingly relevant (LAUREL-TIMESHEETS-2026)'
  risks_and_guardrails:
  - Hourly bills must reflect time actually spent; billed time must accurately represent the work done (CALBAR-GENAI-2026,
    p. 8; AUSLEG-AISTATEMENT-2024, p. 1). A drafted entry is a proposal; the stories do not describe how captured activity
    is checked against effort.
  - A Lerners partner says a challenged entry can be defended because it is 'literally AI saying how long I worked' (LAUREL-LERNERS-2026);
    the regulator texts place the duty on the lawyer, so the lawyer's review stays the control.
  - Capture reads email, documents and calls, so it monitors workers. The UK ICO has worker-monitoring guidance, marked under
    review (ICO-MONITORING-2026). The EU AI Act lists AI intended to monitor and evaluate workers' performance and behaviour
    as high-risk (EU-AIACT-ANNEX3-2024, point 4(b)), with Annex III obligations extended to 2 December 2027 (EC-AIACT-2026).
    No source says whether time-capture tools fall in scope; it depends on intended use.
  - On US federal time-and-materials contracts, vouchers must be substantiated by individual daily job timekeeping records
    or other approved substantiation (FAR-52.232-7, paragraph (a)); no source addresses whether passively captured time meets
    that.
  - 'Review burden is a design question: Ajax claims Laurel needs 50-75 activities reviewed a day against 10-20 for Ajax;
    a competitor''s unverified claim (LAWSITES-AJAX-2025). A rival vendor''s sponsored post calls screen monitoring imprecise
    and invasive (LAWSITES-BILLABLESAI-2025).'
  - Laurel states no public LLMs, single-tenant AI and customer-supplied keys; a vendor claim not independently tested (LAURELSITE-2026).
  human_checkpoints:
  - The timekeeper reviews, edits and releases each drafted entry (LAUREL-TONKON-2026; LAUREL-LERNERS-2026; LAUREL-WARREN-2026)
  - Billing partner review of the bill built from the entries (existing step; not described in the stories)
  role_evolution: Timekeepers move from writing time from memory to reviewing a system record (LEGORA-LAUREL-2026). Obermayer's
    controller led the rollout and messaging (LAUREL-OBERMAYER-2026); Warren Averett has an AI Strategy Manager who described
    the rollout (LAUREL-WARREN-2026). Berger Singerman says less time-entry administration frees professional staff for other
    work (LAUREL-BERGER-2026).
  evidence_grade: B
