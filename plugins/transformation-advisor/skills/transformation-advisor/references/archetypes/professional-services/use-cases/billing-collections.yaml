- id: professional-services-billing-collections-16
  title: Consulting and project-based firms use agents in their professional services platform to complete, chase and check
    timesheets
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - transaction-processing
  - coordination-scheduling
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: Certinia describes timekeeping as a chronically low-adoption workflow, leading to less compliance and more unbilled
    time (CERTINIA-VEDA-2026). Professional services staff spend time on documentation and entering billable time that they
    would rather spend with customers (ITBRIEF-KANTATA-2026).
  solution: Certinia's Veda positions 'conversational timekeeping' on its professional services automation (PSA) platform,
    without describing mechanics or a customer (CERTINIA-VEDA-2026); its Winter 2026 Project Assistant Agent, offered through
    an early-adopter programme, flags missing time cards to the project manager but does not create entries (IA-CERTINIA-2025).
    Certinia's chief product officer says its agents apply determinism to policies such as how a timecard should look (SILICONANGLE-CERTINIA-2026).
    Kantata's Agent Studio lets practice leads describe agents in plain language; Basware, an invoice-software company, is
    named as using it to reduce administration, and its quote about billable-time entry is a statement of intent (ITBRIEF-KANTATA-2026).
    NTT DATA's success story for zeb, a European financial-services consultancy, mentions a timesheet agent among its SAP
    agents without describing it (NTTDATA-ZEB-2026).
  outcomes:
  - lever: capacity
    description: none published
    figure: none published
    measures: 'not applicable: no billing-specific figure'
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  prerequisites:
  - A system of record holding project, time and financial data (SILICONANGLE-CERTINIA-2026; NTTDATA-ZEB-2026)
  - Delivery standards written down in plain language so an agent can follow them (ITBRIEF-KANTATA-2026)
  risks_and_guardrails:
  - Mechanics, review step and data handling of conversational timekeeping are not described (CERTINIA-VEDA-2026).
  - Certinia says models are probabilistic and need a reasoning layer for determinism (SILICONANGLE-CERTINIA-2026).
  - On US federal time-and-materials contracts, vouchers need individual daily job timekeeping records or other approved substantiation
    (FAR-52.232-7, paragraph (a)).
  human_checkpoints:
  - Project manager acts on missing-time flags; the agent does not change records (IA-CERTINIA-2025)
  - Each person confirms their own time
  role_evolution: Kantata says its aim is firms that compound expertise, not just cut cost (ITBRIEF-KANTATA-2026). No role
    change is described for billing staff.
  evidence_grade: C
