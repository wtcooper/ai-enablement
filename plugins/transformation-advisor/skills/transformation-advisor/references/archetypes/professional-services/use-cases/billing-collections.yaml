- id: professional-services-billing-collections-17
  title: Accounting firms use AI on time, work-in-progress and invoicing to flag WIP problems early and shorten the time from
    finished work to bill
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - transaction-processing
  - data-reporting
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: 'Time capture, work-in-progress (WIP: work done but not yet billed) review, billing and collections in many accounting
    firms still run on spreadsheets, email and legacy systems, and few managing partners can pull realization, write-down
    rate and bill-to-collect cycle on demand (AIWYN-2026). In a vendor survey of accounting firms, 15% named slow or inaccurate
    billing as their biggest operational headache; missing deadlines led at 32% (UKU-AIACCOUNTING-2026).'
  solution: Aiwyn's general manager says AI already changes time and billing through automated time capture, anomaly detection
    that flags WIP problems early, and predictive billing that surfaces engagement-level profitability (AIWYN-2026). The Journal
    of Accountancy notes fewer mistakes mean fewer write-offs in client accounting services (JOFA-CAS-2026).
  outcomes:
  - lever: speed
    description: One unnamed firm shortened the gap between finishing work and sending the bill; the article credits visibility
      of the metric, not AI.
    figure: 29 to 18 days in a single month
    measures: WIP-to-invoice time at one unnamed firm, per the vendor; sample of one
    provenance: vendor-published
    source_ref: AIWYN-2026
  prerequisites:
  - Realization, write-down rate, bill-to-collect cycle and WIP-to-invoice time defined and visible by partner and service
    line (AIWYN-2026)
  risks_and_guardrails:
  - The article warns AI efficiency will not fix an opaque billing process and may speed up client confusion (AIWYN-2026).
  - Hourly billing is entrenched; in a Blue J/CPA.com poll of tax practitioners, 28% plan to keep hourly billing but raise
    realization (ACCTODAY-BLUEJ-2026; 1,000 US accountants who do tax research, surveyed 12-23 March 2026).
  - 'Trust: 62% of firms in Uku''s survey said trust depends on a human approving before anything is sent, and none said they
    fully trust AI yet; 26% would hand ''draft and send invoices'' to an autonomous agent (UKU-AIACCOUNTING-2026, vendor survey
    of dozens of firms in 8 countries).'
  human_checkpoints:
  - A person reviews WIP before the bill goes out (existing step; the article names WIP review as part of the workflow but
    describes no AI checkpoint) (AIWYN-2026)
  role_evolution: Firms are asked to decide where people should spend the time AI frees (AIWYN-2026).
  evidence_grade: C
  sources:
  - ref: AIWYN-2026
    title: 'Time & Billing for Accounting Firms: What AI Is About to Change (The dirty secret about time billing and what
      AI is about to expose)'
