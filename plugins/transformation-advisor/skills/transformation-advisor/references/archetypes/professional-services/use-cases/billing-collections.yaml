- id: professional-services-billing-collections-07
  title: Fixed-fee matters get scope-creep flags while the bill is assembled, so a change order can be raised before the matter
    closes
  archetype: professional-services
  module: billing-collections
  function: finance-accounting
  work_types:
  - data-reporting
  - review-assurance
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: On fixed-fee matters, work that drifts outside the engagement is absorbed as a write-down at close instead of raised
    as a change order (LAUREL-BILLING-2026). Thomson Reuters and Laurel describe extra research, drafting and review hours
    accumulating on a fixed-fee engagement until the write-down is locked in (TR-LAUREL-2026, a hypothetical scenario).
  solution: Laurel Billing's Scope agent will track budget burn against the engagement and flag hours that have drifted outside
    it, totalled in dollars, each flag with a proposed fix; approved corrections feed back into timekeeping (LAUREL-BILLING-2026;
    LAUREL-BILLINGPAGE-2026). Laurel's home page makes the same claim for consulting ('Scope creep surfaces immediately,
    not at close') (LAURELSITE-2026).
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: 'not applicable: product not yet available'
    provenance: vendor-published
    source_ref: LAUREL-BILLINGPAGE-2026
  prerequisites:
  - Fixed-fee budgets and scope recorded against the matter, and complete, timely time capture, since alerts depend on time
    data (TR-LAUREL-2026)
  risks_and_guardrails:
  - The agent is unreleased; claims such as a shorter bill review each month are statements of intent (LAUREL-BILLINGPAGE-2026).
  - 'Flat-fee rules differ by state: North Carolina allows a flat fee that is not clearly excessive with client consent (NCBAR-FEO1-2024);
    ABA Formal Opinion 512, as quoted, says the same flat fee may be unreasonable if a tool makes the work much quicker (TRI-ABA512-2025);
    Virginia disagrees (VACOURTS-LEO1901-2025, pp. 2-4). A change order priced on hours AI compressed meets this split.'
  - Fee agreements should say how fees are calculated and how far AI factors into rates (CALBAR-GENAI-2026, p. 8).
  human_checkpoints:
  - Billing or matter partner approves or dismisses each flag and decides whether to raise a change order, adjust staffing
    or tell the client (LAUREL-BILLINGPAGE-2026; TR-LAUREL-2026)
  role_evolution: Billing partners are described as approving decisions rather than reading entries (LAUREL-BILLINGPAGE-2026);
    firm leaders see matter performance while the matter runs (TR-LAUREL-2026).
