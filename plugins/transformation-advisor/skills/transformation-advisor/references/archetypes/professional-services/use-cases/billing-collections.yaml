  maturity: emerging
  problem: At Legalweek 2026 Zarwin Baum's Mitchell Kaplan said that when AI compresses hours into minutes, an itemised hourly
    bill undersells the value delivered (TRI-LEGALWEEK-2026). Kopka Law's founder calls the billable hour 'a gigantic waste
    of time for everyone involved' (TRI-KOPKA-2026).
  solution: 'Idea: replace itemised time entries with a single ''services rendered'' line, which Kaplan noted predates the
    billable hour, and asked whether clients would accept it (TRI-LEGALWEEK-2026). The sources describe no AI tool that writes
    such a summary and no firm that has adopted it. Pattern ''other'': an invoice-format change.'
  outcomes:
  - lever: cost
    description: none published
    figure: none published
    measures: 'not applicable: idea'
    provenance: self-reported
    source_ref: TRI-LEGALWEEK-2026
  prerequisites:
  - Client agreement to a non-itemised format; clients whose guidelines require one task per line cannot accept it (ZSCALER-OCG-2025,
    'Block Billing')
  risks_and_guardrails:
  - Where fees are time-based, billing must reflect time actually spent, so a summarised bill still needs underlying records
    (CALBAR-GENAI-2026, p. 8).
  - Virginia's opinion requires the fee basis to be adequately explained, particularly where AI reduces time (VACOURTS-LEO1901-2025,
    pp. 3-4; VALAWYER-2026).
  - Perlin argues alternative fee arrangements have mostly supplemented rather than replaced hourly billing (LEGALFUTURES-PERLIN-2025).
  human_checkpoints:
  - Billing partner agrees the format with the client
  role_evolution: Rapoport and Tiano predict firms will move from input-based billing towards outputs and that the pyramid
    will be pressured (WJLTA-RAPOPORT-2025, abstract).
  evidence_grade: D
