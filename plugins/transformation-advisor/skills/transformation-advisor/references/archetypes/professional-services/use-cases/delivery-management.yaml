      Team ''26 Europe, Amsterdam)'
    publisher: Atlassian
    type: conference
    url: https://events.atlassian.com/teameurope/session/4417894/the-agentic-pmo-scaling-delivery-with-rovo-and-claude
    date: '2026-10-08'
    access: full
    locator: Session abstract, paragraph 2
