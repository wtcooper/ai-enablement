- id: professional-services-delivery-management-03
  title: Agent-drafted status reports, client updates and steering-committee packs from live project data
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - document-production
  - data-reporting
  - client-interaction
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Project managers assemble status packs by hand from budgets, task lists, emails and notes, then reformat them
    for each client or committee. Wellingtone's report summary states that 72% spend half a day or more collating reports
    every month; the page does not define the base (WELLINGTONE-SOPM-2026). One interviewed IT project-management consultant
    named reporting as the primary pain point (EINF-2026, section 4.4.1 p.10).
  solution: A model grounded in the engagement's own data drafts the status report, client update or steering pack in a
    standard format; the project manager edits and sends it. Nextview, a Salesforce consulting partner in Northern Europe,
    runs a Project Assistant Agent in Slack that assembles steering-committee reports with budget, risk and project health
    (CERTINIA-CUSTOMERS-2026). Automation Consultants lists status reporting among the tasks of its 12-agent PMO estate
    (ATLASSIAN-TEAM26-AC-2026). PwC US markets Intelligent Status Insights, which combines open-source language models with
    retrieval over project data to produce standardized, client-ready status reports; the page does not say whether it runs
    on PwC's own engagements (PWC-STATUS-2026). Oracle describes AI-generated program summaries that flag risks (ORACLE-PPM-2026),
    and Certinia listed configurable AI project summaries in an early-adopter release (IA-CERTINIA-2025). A vendor guide
    describes a scheduled agent that drafts a weekly client email from team channels, the shared drive and the calendar
    (EDNA-STATUS-2026).
  outcomes:
  - lever: speed
    description: Nextview says steering-committee reports that used to take hours of manual assembly now generate with a
      click.
    figure: none published (qualitative)
    measures: 'Certinia''s wording about one customer: reports ''used to take hours'' and now generate with a click; no
      baseline, sample or period.'
    provenance: vendor-published
    source_ref: CERTINIA-CUSTOMERS-2026
  - lever: capacity
    description: PwC states its offering can lower administrative project overhead; the page names no client and describes
      the figures as estimates and projections.
    figure: about 40%; 120 hours a year per resource; USD 7,000-24,000 a year per resource (projected)
    measures: 'PwC''s wording: reduction in ''administrative project overhead'' in PMO environments; denominator, sample
      and method are not stated.'
    provenance: vendor-published
    source_ref: PWC-STATUS-2026
  prerequisites:
  - Project, budget and risk data in a system the agent can read; Certinia ties its results to a single connected data foundation
    (CERTINIA-SOA-2026).
  - A written report template and tone the draft can follow (EDNA-STATUS-2026); Nextview's pack covers budget, risk and
    project health (CERTINIA-CUSTOMERS-2026).
  - A baseline of time spent before deployment (CERTINIA-CUSTOMERS-2026, Pro Tips).
  - Client and security policies that let engagement data reach the model; interviewees avoided sharing confidential material
    with generative AI tools under NDAs (EINF-2026, Table 6 p.14).
  risks_and_guardrails:
  - No error, correction or override rate has been published for AI-drafted status reports. PwC says grounding in source
    data gives 'more accurate, explainable updates'; this is a design claim (PWC-STATUS-2026).
  - Drafting a summary is reversible, but an agent replying to clients without review is a one-way door (TRI-AGENTIC-2026).
  - Interviewees found AI email drafts needed substantial editing, and one abandoned low-quality output for manual work
    (EINF-2026, section 4.2 p.8 and section 4.4.5 p.11).
  - A report to a client is a communication about the representation; the duty to keep the client reasonably informed and
    to consider AI disclosure applies (ABA-OP512-2024, Part II.C pp.8-9; CALBAR-GENAI-2026, p.7).
  - 'Client-facing AI errors cost fees: Deloitte Australia agreed to repay the final instalment of an AUD 440,000 contract
    after a report (a deliverable, not a status report) had incorrect footnotes and references, including a fabricated court
    quote (CTV-DELOITTE-2025).'
  human_checkpoints:
  - Project manager reviews the draft before it goes to the steering committee or client.
  - Approval gate before anything reaches a client inbox (ATLASSIAN-TEAM26-AC-2026).
  - Engagement lead spot-checks figures against the PSA (professional services automation system) or time system.
  role_evolution: Nextview's delivery director describes steering-committee preparation becoming a 'quality information
    gathering exercise' (CERTINIA-CUSTOMERS-2026). PwC says the time freed goes to oversight, risk management and issue
    resolution (PWC-STATUS-2026). A project-management newsletter argues PMO value moves from producing reports to interpreting
    them and that project managers who mainly consolidate reports 'should be concerned'; this is opinion (VARGAS-NEWS-2026).
  evidence_grade: B
  sources:
  - ref: CERTINIA-CUSTOMERS-2026
    title: Certinia Customers Are Proving Veda AI Agents Deliver Real Results
    publisher: Certinia
    type: vendor
    url: https://certinia.com/blog/certinia-customers-are-proving-veda-ai-agents-deliver-real-results/
    date: 2026-09
    access: full
    locator: Section 'Nextview Puts Agents to Work in Slack'; Pro Tips
