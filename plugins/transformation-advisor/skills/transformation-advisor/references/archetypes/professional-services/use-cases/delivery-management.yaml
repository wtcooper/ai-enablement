- id: professional-services-delivery-management-12
  title: Self-built PMO agent estate with an orchestrating agent and a human approval gate
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - coordination-scheduling
  - data-reporting
  - document-production
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: 'Portfolio reporting is described as one of the last manual processes in many delivery organisations: assembled
    by hand, often late, and open to challenge (ATLASSIAN-TEAM26-AC-2026).'
  solution: 'Automation Consultants, an IT consultancy, built a 12-agent estate across Jira, Confluence, Loom and Tempo,
    with Atlassian Rovo at the centre and Anthropic''s Claude as the reasoning layer. The agents cover knowledge capture,
    risk and issue management, budget tracking, status reporting, lessons learnt, resourcing, project provisioning and proposal
    drafting. A single orchestrating ''super agent'' screens every finding, and a human approval gate sits before anything
    reaches Jira, Confluence or a client inbox; agent memory is kept in state files so the set-up can be rebuilt or moved
    between models (ATLASSIAN-TEAM26-AC-2026). PSA vendors sell agent builders for firms to do the same: Productive with
    per-agent permissions, schedules and approval before output goes out (PRODUCTIVE-AGENTS-2026), and Kantata''s Agent
    Studio, launched 2026-10-07, in which practice leads and PMO owners describe an agent''s work in plain language, with
    validation checks before publishing (ITBRIEF-KANTATA-2026; KANTATA-AGENT-2026).'
  outcomes:
  - lever: capacity
    description: The presenting firm reports delivery capacity released and throughput tripled across 11 concurrent client
      engagements.
    figure: roughly 25% of delivery capacity released; throughput tripled
    measures: 'Session abstract wording: ''releasing roughly 25% of delivery capacity, and tripling throughput without adding
      headcount''. Basis, baseline and period are not stated; the talk itself was not reviewed.'
    provenance: self-reported
    source_ref: ATLASSIAN-TEAM26-AC-2026
  prerequisites:
  - Delivery data already in the team's work tools (Jira, Confluence, Loom and Tempo in this case) (ATLASSIAN-TEAM26-AC-2026).
  - An orchestration layer and a memory design that lets agents be retired or rebuilt (ATLASSIAN-TEAM26-AC-2026).
  - Defined access for each agent to read and change parts of the platform (PRODUCTIVE-AGENTS-2026).
  - Delivery standards written down so an agent can follow them (ITBRIEF-KANTATA-2026).
  risks_and_guardrails:
  - Sponsored session; the capacity and throughput figures are the presenter's own and no independent check was found. The
    session lists which PMO disciplines are safest to automate first as a topic; the answer is not in the abstract (ATLASSIAN-TEAM26-AC-2026).
  - Kantata's chief executive warns that fast agent answers without full business context risk 'fast, mediocre decisions'
    (KANTATA-SUPERAGENT-2026).
  - Governance needs to say which agent actions are autonomous, which need approval, how AI work is costed and how decisions
    are audited (ERPTODAY-KANTATA-2026).
  human_checkpoints:
  - Human approval gate before output reaches Jira, Confluence or a client inbox (ATLASSIAN-TEAM26-AC-2026).
  - Orchestrating agent screens findings for severity and scope before they reach the gate (ATLASSIAN-TEAM26-AC-2026).
  - A person triggers each Agent Studio agent, or an automated workflow does (ITBRIEF-KANTATA-2026).
  role_evolution: The PMO moves from compiling reports to designing, governing and approving an agent estate; the presenter
    is a senior project manager at the consultancy (ATLASSIAN-TEAM26-AC-2026).
  evidence_grade: B
  sources:
