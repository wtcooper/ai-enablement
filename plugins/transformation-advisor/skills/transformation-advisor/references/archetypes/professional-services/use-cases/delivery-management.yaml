- id: professional-services-delivery-management-16
  title: 'Idea: engagement economics that count AI, with agent cost and output tracked per engagement, AI spend attributed
    to the matter, and effort checked against the fee basis'
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - data-reporting
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: workflow-automation
  maturity: emerging
  problem: When agents do part of the delivery, utilization and time-and-materials metrics no longer describe who did the
    work or what it cost, and resource managers lack the readiness and outcome data to manage blended teams (KANTATA-RMI-2026).
    Firms bought AI tools by the seat but are increasingly billed by usage across many tools and background agents nobody
    watches, and a flat subscription cannot be traced to a client (TRI-METER-2026). When AI shortens a task, an hourly bill
    must show actual time and a flat fee may become unreasonable (ABA-OP512-2024, Part II.F p.12).
  solution: 'Idea. Meter AI use per matter so its cost is attributable to a client and can be budgeted, controlled and possibly
    passed through like e-discovery charges (TRI-METER-2026). Track agents as team members with their own margin: Basware''s
    chief customer officer and Kantata''s chief executive were scheduled to speak on 2026-10-20 in a session titled ''Congratulations,
    You Hired an AI Agent! Now Who''s Managing Its Margin?'' (KANTATA-BASWARE-2026). Certinia commits to every workflow
    in its system being executable by an agentic capability or a human by year-end (CERTINIA-SOA-2026), and Planview''s
    agent resource-management launch covers costing agents and compute spend (SDTIMES-PLANVIEW-2026). During delivery, compare
    actual effort, AI-assisted effort and fee basis, and flag fixed-fee work where effort has fallen well below the fee
    basis; California says flat fees may build in AI savings and fee agreements should say how fees and costs are calculated
    (CALBAR-GENAI-2026, p.8).'
  outcomes:
  - lever: cost
    description: AI budgeting norm stated by one law firm's chief data and AI officer at ILTACON 2026.
    figure: roughly 1% of revenue
    measures: AI cost as a share of firm revenue; the speaker said most people are settling on it and his own firm was not
      there yet; a panel remark, not a survey.
    provenance: self-reported
    source_ref: TRI-METER-2026
  - lever: cost
    description: Survey expectation that systems will need to attribute work, cost and value across humans and AI agents.
    figure: 90% of leaders
    measures: Share of 200 professional-services leaders who say their systems will need to do this 'in the near future'
      (Censuswide survey for Kantata).
    provenance: vendor-published
    source_ref: KANTATA-SOPSI-2026
  prerequisites:
  - Usage-level metering from tool vendors and a way to tag usage to a matter or client code (TRI-METER-2026).
  - Outcome data tied to the people and agents that produced it; only 7.3% of RMI respondents say outcome data are easily
    accessible and routinely used in staffing (KANTATA-RMI-2026).
  - Fee agreements that say how AI affects the fee (CALBAR-GENAI-2026, p.8; ABA-OP512-2024, Part II.F pp.11-14).
  risks_and_guardrails:
  - Lawyers cannot see how many tokens they spend and reach for the largest model for small tasks (TRI-METER-2026).
  - General AI subscriptions are overhead; matter-specific AI costs may be billed only if disclosed in the fee agreement,
    at actual cost, without markup absent informed written consent (CALBAR-GENAI-2026, p.8).
  - Telemetry improves measurement but not attribution of results to the consultant's work (STANFORD-DEL-2026, p.3).
  - The RMI study covered 44 organisations and was commissioned by Kantata; treat it as indicative (KANTATA-RMI-2026).
  - 'Seen in search only: law-firm AI leaders surveyed by The American Lawyer see slowing adoption as a bigger risk than
    price rises (AMLAW-CONSUMPTION-2026).'
  human_checkpoints:
  - Pricing and finance leaders decide what AI cost is passed through to clients (TRI-METER-2026).
  - Pricing or finance partner reviews flagged engagements before any fee change is raised with the client.
  role_evolution: 52.7% of RMI respondents say they are not equipped to manage hybrid human and AI teams and 4% feel well
    equipped; resource managers expect to shift from filling hours toward delivery success, profitability and outcomes if
    outcome pricing spreads (KANTATA-RMI-2026). Knowledge and innovation managers take on AI cost control (TRI-METER-2026).
  evidence_grade: D
