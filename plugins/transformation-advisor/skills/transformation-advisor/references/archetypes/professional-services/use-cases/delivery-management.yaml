  - Raising a change order is a commercial and relationship decision for a person.
  human_checkpoints:
  - Project manager makes the final call on every flagged request (EDNA-SCOPE-2026).
  - Engagement lead decides whether to open a scope conversation with the client, re-resource or push back (EDNA-SCOPE-2026).
  role_evolution: The guide says project managers keep the decision but make it earlier and with fuller information; no
    data (EDNA-SCOPE-2026).
