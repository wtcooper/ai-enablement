- id: professional-services-delivery-management-13
  title: Agents take on the repeatable tasks of implementation delivery and send routine project documentation to customers
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - software-systems
  - document-production
  - coordination-scheduling
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: Implementation and services teams are asked to deliver more go-lives with the same team size, and billable utilization
    is at a record low in SPI's benchmark (DELTEK-SPI-2026). Basware's chief customer officer described a services organisation
    that was low-margin, slow to scope, slow to staff, and unsure whether its own software was working (KANTATA-BASWARE-2026).
  solution: Basware, a software company whose own services organisation delivers customer implementations (in-house; SPI
    calls such teams embedded service organisations, SPI-AI-2026), implemented Kantata's PSA, automated billing first, and
    is expanding into an agent that helps services managers staff projects as timelines change, AI embedded across the platform
    to take on the repetitive work standard to every implementation, and AI that generates and sends project documentation
    to customers (KANTATA-BASWARE-2026). Rocketlane is described as offering agents that execute repeatable billable tasks
    such as migrations, configurations, documentation and testing (TANDEM-2026); Kantata describes self-executing workflows
    (ERPTODAY-KANTATA-2026). Trade press says consulting firms are repositioning around agents and subscription-style products
    (MARKETSCALE-2026).
  outcomes:
  - lever: capacity
    description: Rocketlane's claim for early deployments, as characterised by a competitor.
    figure: up to 50% lower delivery effort
    measures: Tandem's description of Rocketlane's claim, attributed to an Insight Partners piece that was not opened; 'early
      deployments'; baseline, customers and task mix not stated.
    provenance: vendor-published
    source_ref: TANDEM-2026
  prerequisites:
  - A PSA platform already in place, with billing automated first in Basware's case (KANTATA-BASWARE-2026).
  - Rule-heavy, repeatable task types that an agent can run end to end with approval (TANDEM-2026).
  - Governance on which agent actions are autonomous, which need approval, how AI work is costed and how decisions are audited
    (ERPTODAY-KANTATA-2026).
  risks_and_guardrails:
  - Basware's release does not say what review applies to documentation sent to customers; no quality data are given (KANTATA-BASWARE-2026).
  - Buyers should ask what happens when the agent is wrong and who approves before an agent touches a customer environment
    (TANDEM-2026).
  - Per-seat pricing plus consumption credits can change total cost as agent usage grows (TANDEM-2026).
  human_checkpoints:
  - Human gate and audit trail for every agent action touching a customer environment (TANDEM-2026, a vendor's evaluation
    criterion).
  - People handle the tasks unique to each customer (KANTATA-BASWARE-2026).
  role_evolution: Basware's chief customer officer says the aim is to scale the expertise of its people across every project,
    with AI doing the routine work (KANTATA-BASWARE-2026). ERP Today says firms will need governance models for mixed human-and-agent
    workforces (ERPTODAY-KANTATA-2026). Trade press reports the Big Four hiring technologists and PwC creating an engineering
    career track, citing Business Insider (MARKETSCALE-2026, secondary).
  evidence_grade: C
