- id: professional-services-delivery-management-01
  title: Delivery plan, solution design and handoff brief drafted from the SOW, deal record and call transcripts
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - document-production
  - coordination-scheduling
  - research-synthesis
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: 'Context is lost between the deal team and the delivery team: plans are rebuilt by hand from a signed statement
    of work (SOW, the document fixing scope, deliverables and fees) and a salesperson''s recollection, and each new team
    member is briefed by hand. Kantata''s chief product strategy officer says firms can no longer afford to rely on one
    experienced 20-year project manager to know the customer and spot risk (KANTATA-SUPERAGENT-2026). Deltek''s summary
    of the SPI benchmark lists streamlining the sales-to-delivery handoff as a way to convert pipeline into delivered work
    (DELTEK-SPI-2026). Architects spend large blocks of time writing solution-design and plan documents before delivery
    can start.'
  solution: An agent drafts the delivery plan, phased roadmap, solution-architecture document or new-joiner brief from the
    SOW, deal record, call transcripts and project history; the delivery lead or architect reviews it. Spaulding Ridge,
    a cloud advisory and implementation firm, deployed a Moonnox agent to draft solution architecture documents (CERTINIA-MOONNOX-2026).
    Certinia lists Sales-to-Delivery Handoff, Solution Architect and Implementation Plan agents (CERTINIA-VEDA-2026). Kantata
    says its Expertise Agent holds SOWs, meeting notes, past decisions and client history so each new resource gets a role-specific
    brief and project plans on day one, and that it can generate plans from SOWs and briefings (KANTATA-AGENT-2026; ERPTODAY-KANTATA-2026).
    Rocketlane describes generating a project plan from a SOW (ROCKETLANE-AGENTIC-2026). Interviewed Finnish IT project
    managers use generative AI to structure work phases; one tested Gemini on a migration-project framework but did not
    put it into practice (EINF-2026).
  outcomes:
  - lever: speed
    description: Spaulding Ridge's executive chair says the agent made drafting solution architecture documents four times
      faster.
    figure: about 80 hours to under 20 hours per document
    measures: 'The chair''s statement in Certinia''s release: ''approximately 80 hours to under 20 hours''. Number of documents,
      period and method are not stated, so this is an estimate.'
    provenance: self-reported
    source_ref: CERTINIA-MOONNOX-2026
  - lever: speed
    description: Certinia's results panel lists faster client onboarding without naming the agent or customer.
    figure: 60% faster client onboarding
    measures: Vendor aggregate; no baseline, sample or definition of onboarding is given.
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  prerequisites:
  - Deal, scope and SOW held as structured records the agent can read (CERTINIA-VEDA-2026).
  - Captured requirements, call transcripts and SOW text in a store the agent can reach (CERTINIA-MOONNOX-2026).
  - Engagement terms that address the scope of AI use, allocation of responsibilities, data protection and any agreed AI
    restrictions (ICMCI-AICODE-2026, section 7.3).
  risks_and_guardrails:
  - Interviewees said generative AI struggles to grasp organisational context and can hallucinate, so plans need human review
    (EINF-2026, Table 6 p.14).
  - No review-time, correction-rate or defect data accompany the 80-to-20-hour figure; Certinia's chief executive says teams
    must be able to trust output 'without manual rework' (CERTINIA-MOONNOX-2026).
  - Plans and SOW-derived scope statements are commitments; consultants who present AI-assisted output bear the same responsibility
    as for their own work (ICMCI-AICODE-2026, section 2.2).
  - Government buyers may require approval of AI use, quality checks on AI outputs and records of AI use; Australia's model
    clauses do so (AGS-AIMODELCLAUSES-2025, Section 1).
  - No source publishes error data for handoff briefs; a brief that omits a commitment could reset client expectations.
  human_checkpoints:
  - Solution architect reviews and signs off a design draft before it goes to the client or the delivery team.
  - Engagement lead and delivery lead approve the handoff pack and plan against the signed SOW; the project manager approves
    the plan before kickoff (EINF-2026, section 5.5 p.15).
  - Client sign-off on the plan where the contract requires it.
  role_evolution: Spaulding Ridge's chair says consultants are freed to focus on high-value work (CERTINIA-MOONNOX-2026).
    Delivery leads receive a structured brief instead of reconstructing it; Kantata frames this as moving senior project
    managers' tacit knowledge into the platform (KANTATA-SUPERAGENT-2026).
  evidence_grade: B
  sources:
