- id: professional-services-delivery-management-05
  title: Agents watch project and portfolio data and flag slipping milestones, missing time entries, deliverable discrepancies
    and health risk
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - data-reporting
  - coordination-scheduling
  - review-assurance
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: 'Risk is found in periodic reviews, after margin has already eroded; project managers chase missing time entries
    and overdue tasks by hand, and red-amber-green ratings depend on each project manager''s judgment. Siemens Digital Industries''
    SVP of global customer success says the imperative is to identify deliverable discrepancies early across thousands of
    projects and a workforce of 4,500 (CERTINIA-VEDA-2026). The data underneath is weak: 47% of resource-management respondents
    cite poor or fragmented data as a top barrier to AI (KANTATA-RMI-2026).'
  solution: Agents scan project records on a schedule, score health and route alerts to the project manager or PMO. Siemens'
    SVP says Certinia's Project Agent, built on Salesforce, is making early discrepancy identification a reality (CERTINIA-VEDA-2026).
    Certinia's Project Assistant flags missing time cards, overdue items and milestones nearing critical status (IA-CERTINIA-2025);
    its PMO Quality agent scans project scope regularly to score health sentiment and a PMO Leadership agent gives portfolio
    oversight (CERTINIA-VEDA-2026). Kantata describes continuous portfolio monitoring that routes alerts to the right people
    (KANTATA-AGENT-2026); Deltek and Rocketlane describe surfacing risks early (DELTEK-POLARIS-2026; ROCKETLANE-AGENTIC-2026).
    A competing vendor says most 2026 'agentic' PSA launches are summarisation or scoring rather than execution (TANDEM-2026).
  outcomes:
  - lever: quality
    description: Deltek says firms on its platform see more on-time delivery by surfacing risks early; the page does not
      say how this was measured.
    figure: 16% increase in on-time project delivery
    measures: Deltek's wording; unnamed firms, no baseline, period or sample; not specific to AI.
    provenance: vendor-published
    source_ref: DELTEK-POLARIS-2026
  - lever: risk
    description: Certinia's results panel lists less margin lost to rework and quality issues without naming the agent responsible.
    figure: 11-23% less margin lost to rework and quality issues
    measures: Vendor aggregate; denominator, sample and period are not stated.
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  prerequisites:
  - Clean, connected project, time and finance data; an IDC analyst quoted by Certinia says AI deployed without a unified
    data environment produces unreliable output and eroding trust (CERTINIA-GSD-2026).
  - 'Time-entry discipline: the agent flags gaps but does not create the entries (IA-CERTINIA-2025).'
  - A PMO that owns the scoring method and acts on it (VARGAS-NEWS-2026); where decisions live in calls and chat, a PSA-only
    scan sees a partial picture (TANDEM-2026).
  risks_and_guardrails:
  - 'Alert quality is unmeasured: no false-positive, missed-risk or accuracy rate for any health score was found.'
  - Kantata warns that agents deployed in silos each optimise one team's view while the business-wide picture fragments
    (KANTATA-SUPERAGENT-2026).
  - Sentiment scoring reads client and team communications, which raises confidentiality risk, including across matters
    (CALBAR-GENAI-2026, pp.5-6); the more autonomy a system has, the more oversight and periodic reassessment are needed
    (CALBAR-GENAI-2026, pp.4-5).
  - The EU AI Act lists AI used to monitor and evaluate workers' performance and behaviour as high-risk (EU-AIACT-ANNEX3-2024,
    Annex III point 4(b)), with those obligations applying from 2 Dec 2027 (EC-AIACT-2026). No source addresses whether
    delivery-health scoring is in scope.
  - 'Seen in search only: a Gartner abstract warns that PMOs deploying AI agents without solid foundations risk poor autonomous
    decisions at scale (GARTNER-PMO-2026).'
  human_checkpoints:
  - Project manager acts on each flag; the agent surfaces anomalies but does not change records (IA-CERTINIA-2025).
  - PMO leader or engagement lead decides the intervention; the score informs and does not trigger action (CERTINIA-VEDA-2026).
  - Periodic check of the agent's flags against actual engagement outcomes (CALBAR-GENAI-2026, pp.4-5).
  role_evolution: PMO leaders move from periodic reviews to responding to continuous alerts, and Kantata says senior project
    managers' pattern recognition is meant to be encoded and shared (KANTATA-SUPERAGENT-2026). Certinia says the agent 'elevates'
    project managers by reducing administrative overhead (IA-CERTINIA-2025). No data on changed workload was found.
  evidence_grade: B
  sources:
  - ref: CERTINIA-VEDA-2026
    title: 'Veda AI: System of Action for Professional Services (agent catalogue and results panel)'
    publisher: Certinia
    type: vendor
    url: https://certinia.com/solutions/ai
    date: 2026-10
    access: full
    locator: Customer quote block (Siemens); 'Margin protection & risk management'; Plan and Manage agent lists; results
      panel
