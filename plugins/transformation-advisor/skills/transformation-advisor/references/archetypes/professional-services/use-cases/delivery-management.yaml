- id: professional-services-delivery-management-04
  title: Ask for project status, budget consumption and anomalies in plain language over PSA or ERP data
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - data-reporting
  - coordination-scheduling
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: At zeb, project managers had to navigate the right paths and apps in SAP to find project information, often in
    a different context from their question (NTTDATA-ZEB-2026). Partners and PMO leads ask team members to reconstruct status
    from email threads and separate checklists (HARVEY-ORCH-2026); Certinia calls this 'manual status-chasing' (CERTINIA-VEDA-2026).
  solution: zeb, a European financial-services consultancy, worked with NTT DATA to build an orchestrator agent and specialist
    agents on SAP. A project-information agent answers natural-language questions on owners, timelines and current status
    from S/4HANA project data, forecasts budget consumption and flags potential anomalies; financial agents answer cost
    and invoice questions for a project (NTTDATA-ZEB-2026). Certinia lists a Project Assistant that gives digests on financials,
    risks and timeline variances and a PMO Leadership agent for portfolio oversight (CERTINIA-VEDA-2026); Deltek (Ask Dela)
    and Oracle describe comparable assistants (DELTEK-DELA-2026; ORACLE-PPM-2026). Kantata describes an Expertise Agent
    that answers cross-functional business questions across project, resource and financial systems (ERPTODAY-KANTATA-2026).
    For law firms, Planning Blox lists agentic requests for matter financials and task status through conversational prompts
    (LTH-PLANNINGBLOX-2026).
  outcomes:
  - lever: speed
    description: zeb's head of SAP solutions says the implementation took only a few weeks and delivered excellent results.
    figure: none published
    measures: Quote on build time; no measure of the agents' effect on delivery is given.
    provenance: vendor-published
    source_ref: NTTDATA-ZEB-2026
  - lever: capacity
    description: The case study says the agents reduce manual effort and free consultants for strategic work.
    figure: none published (qualitative)
    measures: Integrator's description; no baseline or sample.
    provenance: vendor-published
    source_ref: NTTDATA-ZEB-2026
  prerequisites:
  - Project, timesheet and finance data consolidated in the ERP, with an integration layer between agents and ERP; zeb used
    SAP BTP and S/4HANA services (NTTDATA-ZEB-2026).
  - Access controls that keep one client's matter data out of another's answers (CALBAR-GENAI-2026, p.6).
  - 'Data people trust: in a vendor-sponsored survey only 12% of leaders fully trust their systems'' data (KANTATA-SOPSI-2026).'
  risks_and_guardrails:
  - Answers depend on data quality; no source publishes an accuracy or error rate.
  - Among the top AI concerns of IT and security respondents in Deltek's government-contractor study are inaccurate forecasts
    (29%) and difficulty validating AI-provided insights (26%) (DELTEK-CLARITY-2026).
  - 89% of surveyed leaders say they spend significant time verifying AI outputs, which offsets the speed claim (KANTATA-SOPSI-2026).
  - Information from one matter may reach people who should not see it unless access is configured (ABA-OP512-2024, Part
    II.B p.7).
  human_checkpoints:
  - The project manager or leader reads the answer and decides; the agent retrieves and forecasts. The zeb case study does
    not describe formal review steps.
  - Engagement lead checks any digest before it goes to a client.
  role_evolution: Project managers ask questions instead of navigating apps; zeb says consultants spend more time on strategic
    work (NTTDATA-ZEB-2026). A project-management newsletter says PMO analysts shift from collecting data to interpreting
    it; no data (VARGAS-NEWS-2026).
  evidence_grade: B
