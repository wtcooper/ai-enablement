- id: professional-services-delivery-management-02
  title: Meeting and call capture turned into summaries, decisions, action items, requirements and backlogs, with consent
    controls
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - document-production
  - coordination-scheduling
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Consultants spend hours writing call notes, requirements and technical plans, and minutes and action lists are
    written after the fact, so commitments slip. Diabsolut, a Salesforce and Certinia implementer, says senior consultants
    spent hours writing technical plans and chasing spreadsheets (CERTINIA-CUSTOMERS-2026). A testimonial on Rocketlane's
    page, speaker not identified, says complex implementations take 10-15 hours of decision and requirements documentation
    (ROCKETLANE-AGENTIC-2026).
  solution: AI turns meeting transcripts into summaries, decisions, action items, requirements and backlogs, and a person
    checks them before they circulate. Diabsolut deployed a Project Assistant and other agents in Slack; its technical-architecture
    director says the automated steps were 'transcripts, requirements, backlogs, and scoping' (CERTINIA-CUSTOMERS-2026).
    The project-management team that onboards new franchise stores at EarthWise Pet (in-house team, not a services firm)
    uses Rocketlane's AI Fills for call summaries and action items (ROCKETLANE-EARTHWISE-2026). Deloitte lists a meeting-insights
    and status-update agent in its Agent Fleet on AWS Marketplace, naming no client (DELOITTE-AWS-2026). Certinia lists
    a Project Assistant that turns meeting conversations into summaries (CERTINIA-VEDA-2026). In an interview study of 12
    Finnish IT project-management consultants, two used meeting transcription, one created action points from transcripts,
    and two used AI in whiteboard tools to group workshop results (EINF-2026).
  outcomes:
  - lever: speed
    description: Diabsolut cut documentation time by 70%, according to Certinia's account of the deployment.
    figure: 70% less documentation time
    measures: 'Certinia''s wording: ''cut documentation time by 70%''. Baseline, sample, task definition and period are
      not stated.'
    provenance: vendor-published
    source_ref: CERTINIA-CUSTOMERS-2026
  - lever: experience
    description: EarthWise Pet's project-management VP says AI call summaries save time and remove 'he said, she said' disputes
      because commitments are documented.
    figure: none published (qualitative)
    measures: One customer's statement; no sample or baseline.
    provenance: vendor-published
    source_ref: ROCKETLANE-EARTHWISE-2026
  - lever: speed
    description: Interviewee-reported effects, not measurements.
    figure: none
    measures: One participant said action points from transcripts were sometimes better than manual ones but needed verification;
      two said workshop-result processing took less time; two said meeting-note quality varied with meeting complexity (section
      4.2 pp.7-8).
    provenance: independent
    source_ref: EINF-2026
  - lever: speed
    description: 'Adjacent cross-industry evidence: workers who used a generative AI tool built into email, meeting and
      writing apps spent less time on email (not meeting time).'
    figure: two fewer hours on email per week
    measures: Among the 80% of treated workers who used the tool, weekly email time in the second half of a six-month randomised
      experiment; 66 firms and 7,137 knowledge workers; not specific to professional services.
    provenance: independent
    source_ref: NBER-DILLON-2025
  prerequisites:
  - A recording-consent practice for every participant, including clients, and vendor data terms that are reviewed rather
    than accepted by click-through (CALBAR-GENAI-2026, p.5).
  - 'A rule for what may be recorded in client engagements: consultants must follow client instructions on AI and not enter
    confidential data into tools that may reuse it (ICMCI-AICODE-2026, sections 3.4 and 5.4); client organisations largely
    decide which tools consultants may use (EINF-2026, section 5.5 p.15).'
  - A baseline of documentation time before deployment, as Certinia advises (CERTINIA-CUSTOMERS-2026, Pro Tips).
  risks_and_guardrails:
  - A US federal class action filed in August 2025 alleges Otter.ai's meeting assistant recorded and transcribed conversations
    without participants' consent; these are allegations (KJZZ-OTTER-2025).
  - A lawyer needs a client's informed consent before putting client information into a self-learning tool that could disclose
    it to others (ABA-OP512-2024, Part II.B p.7).
  - Output quality varies, and interviewees treat it as needing verification and avoid sharing confidential material (EINF-2026,
    Table 6 p.14).
  - Certinia asserts that generic AI tools can leave teams spending as much time verifying and correcting output as they
    save; this is a vendor claim with no data (CERTINIA-MOONNOX-2026).
  human_checkpoints:
  - Meeting organiser confirms consent and the permitted tool before recording starts.
  - Owner checks the summary and action list before they go to the client; the project manager verifies action points (EINF-2026,
    section 4.2 p.8).
  role_evolution: Diabsolut's director says the automation frees outcomes architects to focus on outcomes rather than paperwork
    (CERTINIA-CUSTOMERS-2026). Interviewees converged on AI as an 'assistant not replacement' (EINF-2026, abstract). The
    NBER experiment detected no shift in the quantity or composition of workers' tasks (NBER-DILLON-2025).
  evidence_grade: B
  sources:
