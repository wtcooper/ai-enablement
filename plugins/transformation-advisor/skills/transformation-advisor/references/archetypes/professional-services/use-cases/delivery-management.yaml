- id: professional-services-delivery-management-11
  title: 'Matter run from a reusable template: tasks routed to agents and people, named review gates, and status visible
    without reconstruction'
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - coordination-scheduling
  - review-assurance
  - client-interaction
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: For recurring work such as an M&A transaction, the process is reconstructed for each matter from a checklist,
    a previous deal or someone's memory; lawyers carry context between steps and track progress themselves, and partners
    ask associates to reconstruct status from email (HARVEY-ORCH-2026).
  solution: 'Harvey''s Legal Work Orchestration, announced 2026-10-15, connects a matter''s phases, tasks, people and review
    points. A reusable template pre-loads phases, tasks, playbooks, agents, collaborators and review gates, and each task
    carries its scope, inputs and reviewer. When an agent finishes a task (Harvey''s example is a change-of-control consent
    matrix), the designated partner is notified and approval starts the next step. Lawyers can close or start tasks by replying
    to email, partners see progress without asking an associate, and a task can go to another lawyer or be shared with the
    client; the post does not describe how client access is limited. Tasks, comments and notifications are rolling out;
    templates are in early access. Harvey says the structure fits any matter run more than once, with a quarterly compliance
    review as a second example (HARVEY-ORCH-2026). An ILTA article proposes a chain of agents from staffing to billing as
    a concept (ILTA-RISE-2025); Legalweek 2026 listed an in-house session titled ''Agentic Ops: Building a Self-Orchestrating
    Legal Department'' (EDRM-LEGALWEEK-2026).'
  outcomes:
  - lever: capacity
    description: Harvey's expectation, not a measured result.
    figure: expects agents to take on an additional 20% of workflow steps within six months, and that share to triple within
      a year
    measures: Share of workflow steps agents execute versus steps lawyers prompt; no baseline share; the sentence is ambiguous
      about whether 'that share' means the additional 20%.
    provenance: vendor-published
    source_ref: HARVEY-ORCH-2026
  prerequisites:
  - 'Innovation or knowledge teams define the template once: phases, playbooks, review gates (HARVEY-ORCH-2026).'
  - A firm policy on permissible AI use, training for supervisors and subordinates, and monitoring (ABA-OP512-2024, Part
    II.E pp.10-11).
  - Governed data, documented processes and clear integrations; agents are less forgiving of undocumented workflows (TRI-PREMORTEM-2026).
  - 'Per-client access controls: agentic tools must not transmit client data externally without safeguards and human review
    (CALBAR-GENAI-2026, p.6).'
  risks_and_guardrails:
  - Harvey says agent work stays transparent and auditable and that lawyers still prompt the majority of steps today; no
    audit, error or gate-skipping data are published (HARVEY-ORCH-2026).
  - 'Panel advice: allow use cases that are reversible, require an audit trail and decision tracing, and do not let individual
    lawyers create new agents on their own (TRI-AGENTIC-2026).'
  - A fictional premortem shows review turning into 'theater' when reviewers approve workflows they cannot parse (TRI-PREMORTEM-2026).
  - Supervision must scale with autonomy; no document may go to a court without lawyer review, and AI must not file on the
    lawyer's behalf (CALBAR-GENAI-2026, pp.3, 9).
  - Sophisticated tracking and compliance tools are in use at fewer than one in five law firms (ILTA-TECHSURVEY-2026, p.9).
  - Information from one matter may reach people who should not see it (ABA-OP512-2024, Part II.B p.7).
  human_checkpoints:
  - Designated reviewer approves each gated task before the next step begins (HARVEY-ORCH-2026).
  - Engagement lead decides which tasks and outputs are visible to the client.
  role_evolution: Harvey says lawyers will focus on directing the matter, reviewing consequential outputs and exercising
    judgment, with innovation and knowledge teams authoring templates (HARVEY-ORCH-2026). An Artificial Lawyer guest post
    forecasts that agents able to orchestrate workflow erode the mid-level associate role, which it calls the legal world's
    project managers (AL-LADDER-2026). California's guidance says professional judgment cannot be delegated to AI (CALBAR-GENAI-2026,
    p.4).
  evidence_grade: C
  sources:
