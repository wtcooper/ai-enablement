  problem: Delivery planning assumes work is divided among people; a firm that uses AI for analysis, scenario modelling
    and documentation must decide what goes to agents and who checks it.
  solution: Thoughtworks' postings for an Engagement Lead (Singapore) and a Principal Engagement Lead (London) call them
    the delivery and solution leaders for 'AI-native advisory engagements'. They structure each engagement across team members,
    AI agents and client stakeholders; design how AI is used for analysis, scenario modelling, code and workflow generation
    and documentation; delegate to AI while keeping quality and judgment; and capture reusable delivery patterns and AI
    workflows in a shared library (TW-JOB-8138525-2026; TW-JOB-7995201-2026).
