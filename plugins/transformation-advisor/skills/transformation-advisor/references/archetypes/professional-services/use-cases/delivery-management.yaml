- id: professional-services-delivery-management-10
  title: 'Idea: predictive monitoring of dependencies, deviations and risks from historical project data'
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - data-reporting
  - coordination-scheduling
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: External project managers find dependency management and early-warning signals hard to keep up by hand; progress
    is analysed against baselines only when someone compiles the data (EINF-2026).
  solution: Idea. Interviewees envisioned an assistant that watches data from several sources against baselines, detects
    when dependencies cannot be met on schedule, proposes coordination actions and drafts risk assessments from historical
    project data. One interviewee tested Gemini on a migration-project framework and found it identified typical risks,
    but did not put this into practice (EINF-2026). A project-management commentator describes portfolio agents that look
    for patterns across hundreds of projects (VARGAS-NEWS-2026).
  outcomes:
  - lever: risk
    description: none published
    figure: none
    measures: not applicable
    provenance: independent
    source_ref: EINF-2026
  prerequisites:
  - Historical project data and consistent baselines (EINF-2026, section 4.4.4 p.11).
  - Integration across the tools where project information lives (EINF-2026, abstract).
  risks_and_guardrails:
  - Interviewees say human verification stays mandatory for error detection (EINF-2026, sections 4.4.3 and 4.4.4).
  - Multi-step agent consistency falls over repeated runs (TANDEM-2026, citing tau-bench; not opened).
  human_checkpoints:
  - Project manager reviews alerts and recommended actions.
  role_evolution: Vargas argues project managers' value moves toward judgment, context and leadership as monitoring is automated
    (VARGAS-NEWS-2026). Interviewees see agents as supportive assistants, not peer project managers (EINF-2026, section
    5.5 p.15).
  evidence_grade: D
  sources:
