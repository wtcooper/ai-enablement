- id: professional-services-delivery-management-07
  title: Engagement margin, budget burn and forecast monitoring with alerts on overruns, unbilled time and missing timesheets
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - data-reporting
  - coordination-scheduling
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: Margin leaks during delivery (underbids, unrecovered scope, wrong-rate staffing, unlogged time), but leadership
    sees it in a report after month-end; Teamwork calls this the 'erosion gap' (TEAMWORK-2026). Matter budgets and plans
    are built by hand and overruns are seen late, which leads to write-offs (BIGHAND-MATTERPRICING-2026). In SPI's 2026
    benchmark of 500+ firms, billable utilization was 66.4% in 2025, on-time delivery 73.8% and project overrun 10.7% (DELTEK-SPI-2026).
  solution: Agents watch actuals against plan and flag exceptions early. Rocketlane describes agents that hunt for missing
    timesheets, un-invoiced hours and budget overruns before they become margin surprises (ROCKETLANE-AGENTIC-2026). Certinia's
    Project Assistant digests financials, risks and timeline variances (CERTINIA-VEDA-2026); Kantata describes finding at-risk
    projects before margins erode (ERPTODAY-KANTATA-2026); Deltek claims better forecast accuracy from connecting people,
    projects and financials (DELTEK-POLARIS-2026). For law firms, BigHand Matter Pricing is marketed with near-real-time
    actual-versus-budget monitoring, AI analysis of raw time entries and automated overrun alerts, and Planning Blox lists
    AI-assisted plan and budget generation with alerts (BIGHAND-MATTERPRICING-2026; LTH-PLANNINGBLOX-2026).
  outcomes:
  - lever: quality
    description: Deltek attributes better forecast accuracy to connecting people, projects and financials in one application;
      the claim is about integration, not AI.
    figure: 20% improvement in forecast accuracy
    measures: Deltek's wording; unnamed firms, no baseline or sample.
    provenance: vendor-published
    source_ref: DELTEK-POLARIS-2026
  - lever: quality
    description: In a Certinia-commissioned survey, fully integrated organisations report higher forecast confidence than
      partially aligned ones.
    figure: 78% vs 38% report high forecast confidence
    measures: Share of each alignment group reporting high confidence in resource, demand and revenue forecasts; 1,000 leaders,
      June 2026, Sapio Research. Self-assessed confidence, not forecast error; 75% of fully siloed organisations also report
      high confidence.
    provenance: vendor-published
    source_ref: CERTINIA-GSD-2026
  - lever: risk
    description: The baseline these tools address, across surveyed firms (not an AI result).
    figure: project overrun 10.7% in 2025 (11.3% in 2024); on-time delivery 73.8%; project margin 37.7%
    measures: SPI Research 2026 Professional Services Maturity Benchmark, 500+ firms; SPI treats overrun above 10% as damaging
      to client relationships.
    provenance: vendor-published
    source_ref: DELTEK-SPI-2026
  - lever: risk
    description: Self-reported budget misses in a vendor-sponsored survey.
    figure: 54% say at least 10% of their projects miss budget goals
    measures: Share of 200 professional-services leaders (Censuswide survey for Kantata).
    provenance: vendor-published
    source_ref: KANTATA-SOPSI-2026
  prerequisites:
  - Timesheet, billing and plan data in one system, captured promptly; Rocketlane and Certinia both position unified data
    as the base.
  - 'Integrated systems: SPI reports firms on a project-based ERP had faster revenue growth and higher EBITDA (DELTEK-SPI-2026).'
  - For law firms, integration with practice-management, time and billing systems (BIGHAND-MATTERPRICING-2026; LTH-PLANNINGBLOX-2026).
  risks_and_guardrails:
  - Forecast agents inherit data problems; 29% of Deltek's government-contractor IT and security respondents worry about
    inaccurate forecasts (DELTEK-CLARITY-2026).
  - Leaders rate their forecasting confidence 24 points higher than practitioners do, so confidence is a weak proxy for
    accuracy (CERTINIA-GSD-2026).
  - SPI links deeper AI use with growth and on-time delivery but publishes no figure for the link in the article, and it
    is a survey association (DELTEK-SPI-2026).
  - Teamwork says AI compresses billable hours faster than it cuts cost, which widens the erosion problem (TEAMWORK-2026).
  - Neither law-firm listing gives evidence on forecast accuracy or alert precision.
  human_checkpoints:
  - Project or finance lead acts on each alert; invoicing decisions stay with people.
  - 'Delivery leader decides the intervention: re-scope, re-staff or change order (CERTINIA-VEDA-2026).'
  - Lawyer and pricing professional agree the budget with the client and respond to alerts.
  role_evolution: Project managers receive exception lists instead of reconciling actuals by hand. Pricing professionals
    and legal project managers get first-draft plans and can query matter data in natural language (LTH-PLANNINGBLOX-2026).
  evidence_grade: C
