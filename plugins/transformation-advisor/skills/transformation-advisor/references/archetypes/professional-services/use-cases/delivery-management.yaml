- id: professional-services-delivery-management-08
  title: Agent project manager that keeps the plan current and chases tasks as milestones move
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - coordination-scheduling
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: Plans go stale when milestones slip, and a project manager must reconcile task, calendar and time data by hand.
  solution: Certinia lists a Project Manager Agent that keeps teams organised, on schedule and driving forward (CERTINIA-VEDA-2026).
    Kantata says project plans update automatically when milestones shift and that timesheet compliance can be checked against
    calendars (KANTATA-SUPERAGENT-2026). Rocketlane says plans stay current, updates are sent automatically, and agents
    do the heavy work while the team approves and intervenes when needed (ROCKETLANE-AGENTIC-2026). Planview announced Agent
    Resource Management, with project-manager and backlog agents, stating availability from Fall 2026 with early access
    (SDTIMES-PLANVIEW-2026).
  outcomes:
  - lever: capacity
    description: Certinia's aggregate claim about admin time recovered; no basis is given.
    figure: about 50% of project time historically lost to admin recovered
    measures: Vendor aggregate in the results panel; the denominator (project time) and method are not stated.
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  - lever: capacity
    description: Certinia's product chief says its agents could save a project manager time each month.
    figure: up to 20 hours a month per project manager
    measures: Interview statement of potential, not a measured customer result.
    provenance: vendor-published
    source_ref: SILICONANGLE-CERTINIA-2026
  prerequisites:
  - Integrated task, calendar and project data.
  - Written rules for which agent actions run without approval (ERPTODAY-KANTATA-2026).
  risks_and_guardrails:
  - A 20-month case study of ChatGPT acting as sole project manager for six projects at an unnamed European software firm
    reports deadlines were largely met, but ambiguous or domain-specific requests were misread, producing misprioritised
    tasks or scheduling errors; no figures are given (IPM-CHATGPT-PM-2026, section 4).
  - Multi-step agent reliability falls over repeated runs; one vendor cites a benchmark of about 61% single-attempt success
    falling to about 25% consistency by the eighth trial (TANDEM-2026, citing tau-bench; not opened).
  - Certinia says models are probabilistic and need a reasoning layer to apply policies deterministically (SILICONANGLE-CERTINIA-2026).
  human_checkpoints:
  - Team approves and intervenes on agent actions (ROCKETLANE-AGENTIC-2026).
  role_evolution: Kantata argues the project manager's role shifts toward amplified expertise while routine reconciliation
    moves to the system (KANTATA-SUPERAGENT-2026).
  evidence_grade: C
