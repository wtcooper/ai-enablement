- id: professional-services-delivery-management-06
  title: Scope-drift detection against the SOW, with prompts to raise a change order
  archetype: professional-services
  module: delivery-management
  function: service-delivery
  work_types:
  - review-assurance
  - client-interaction
  - data-reporting
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: Scope expands through chat messages, hallway asks and emails that start 'quick question'; change orders are often
    written after the extra work is done, and the in-scope call is subjective (EDNA-SCOPE-2026). One project-management
    vendor names unrecovered scope creep as one of four leak points in delivery margin (TEAMWORK-2026).
  solution: 'An agent holds the SOW, plan and deliverable list, reads client requests as they arrive and compares them with
    agreed scope: clear in-scope requests pass, clearly out-of-scope ones notify the project manager, and ambiguous ones
    are surfaced with context for a person; it also tracks cumulative drift and alerts the engagement lead when margin is
    at risk. A vendor guide describes this (EDNA-SCOPE-2026). Certinia''s PMO Quality agent scans project scope on a regular
    basis, and its margin-protection capability runs automated scope scans (CERTINIA-VEDA-2026; CERTINIA-MOONNOX-2026).
    Oracle mentions AI-driven change management; the page does not say whether this covers client change requests (ORACLE-PPM-2026).
    A competing vendor suggests testing products by introducing a scope change agreed by email and watching which system
    notices (TANDEM-2026).'
  outcomes:
  - lever: cost
    description: Illustrative scenario in a vendor guide, not a measured result.
    figure: USD 120,000 project scoped at 400 hours that ran to 520 hours, described as USD 36,000 of margin given back
