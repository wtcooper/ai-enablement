  problem: Lessons from completed engagements are rarely written up in a form the next team can find; Certinia describes
    organising lessons learned into a searchable, firm-wide knowledge base (CERTINIA-VEDA-2026).
  solution: Certinia lists a Retrospective Drafter agent that captures learnings and outcomes from completed projects and
    a Knowledge Base agent that organises documentation into a searchable resource (CERTINIA-VEDA-2026); its Moonnox capability
    list includes value capture and knowledge transfer (CERTINIA-MOONNOX-2026). Automation Consultants lists lessons learnt
    among its agents' tasks (ATLASSIAN-TEAM26-AC-2026).
