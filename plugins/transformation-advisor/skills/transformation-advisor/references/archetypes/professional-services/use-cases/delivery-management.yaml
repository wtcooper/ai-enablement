  prerequisites:
  - Project records, time and financial data, and communications that can be summarised without breaching confidentiality
    (CALBAR-GENAI-2026, p.6).
  risks_and_guardrails:
  - Lessons drawn from one client's matter may expose confidential or privileged material when reused across matters (CALBAR-GENAI-2026,
    p.6; ABA-OP512-2024, Part II.B p.7).
  - For templates or testing, the Law Society advises fictional data rather than client confidential information (LAWSOC-GENAI-2026).
  human_checkpoints:
