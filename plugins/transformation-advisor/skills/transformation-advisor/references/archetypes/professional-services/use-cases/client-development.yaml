- id: professional-services-client-development-17
  title: In-house legal teams add an AI addendum to outside counsel guidelines and AI questions to panel reviews
  archetype: professional-services
  module: client-development
  function: procurement-supply-chain
  work_types:
  - review-assurance
  - document-production
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: Existing outside counsel guidelines predate AI and give clients no control over which AI tools firms
    use, how output is reviewed or what is disclosed. Two-thirds of general counsel say they do not know how their
    outside firms approach AI.
  solution: In-house legal teams add an AI addendum or section to their guidelines (permitted and prohibited tools,
    no training on client data, written consent for pass-through AI charges, human review, records, audit rights)
    and add AI questions to panel and performance reviews. Firms must read and act on these as account requirements.
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: Advice articles; no survey of how many clients have AI addenda was found
    provenance: vendor-published
    source_ref: CONVENTUS-2026
  prerequisites:
  - 'Legal-operations capacity: TRI says legal operations has become the default first line of defence for AI pressure
    on legal departments (TRI-LDOR-2026)'
  - Compliance with the addendum made a condition of engagement (LOUBAR-2025, Tip 1)
  risks_and_guardrails:
  - Advisers recommend that a qualified lawyer review AI-generated content before it reaches the client, that client
    data not go to external AI without prior approval, and that firms keep records of AI use (CONVENTUS-2026)
  - AI platform charges should pass through only with advance written consent, and AI training time should not be
    billed unless agreed in advance (LOUBAR-2025)
  - Some clients still send 2023-style directives, such as warranties that models are unbiased, alongside demands
    for savings (TRI-LEGALWEEK-2026)
  human_checkpoints:
  - Legal operations and the responsible lawyer decide which tools and uses are permitted for each firm
  - Periodic spot-checks of AI-assisted work product and billing (LOUBAR-2025, Tip 6)
  role_evolution: TRI says many legal operations leaders see their function becoming its own practice area and the
    first line of defence for AI pressure (TRI-LDOR-2026).
