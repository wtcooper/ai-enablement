- id: professional-services-client-development-03
  title: Client-health scores and at-risk relationship alerts for relationship owners
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - data-reporting
  - client-interaction
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Relationship owners lose touch, miss job changes and news, and notice a cooling relationship only after
    work has moved. Information reaching managing partners is historical and filtered through partner updates, Introhive
    says. In accounting, a vendor-linked post cites net promoter scores of 37 for clients of 6 to 9 years against
    84 for clients of 15 years or more.
  solution: The CRM layer watches contact frequency, communication velocity, meeting density and external signals
    (news, role changes), turns them into relationship-health scores and alerts the owner or BD team when a relationship
    cools. Law firm Howes Percival says DealCloud dashboards and alerts help it keep in touch with clients at the
    right frequency; law firm Thomson Snell & Passmore lists real-time client health and job-change tracking. Certinia's
    Customer Success Assistant analyses account playbooks, health scores and client activities (vendor listing).
    At ILTACON 2026 an Introhive speaker gave the example of an agent watching call and email patterns for a change
    in a client relationship when a partner leaves.
  outcomes:
  - lever: experience
    description: Proactive client service at Howes Percival, described qualitatively
    figure: none published
    measures: The firm's BD and marketing director describes more proactive service through dashboards and alerts;
      no retention, satisfaction or frequency figure is given
    provenance: vendor-published
    source_ref: INTAPP-HOWESPERCIVAL-2025
  - lever: risk
    description: Partners ranking at-risk relationship alerts among the most valuable uses of combined firm data
    figure: 49%
    measures: Share of 123 surveyed partners ranking 'alerts on at-risk relationships' among the top items; a preference,
      not an outcome
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  - lever: risk
    description: Client retention exposure reported by buyers of professional services
    figure: 32% reconsidering; one-third of those estimate more than $1 million of annual work at risk
    measures: Corporate clients who have reconsidered, or plan within 12 months to reconsider, relationships with
      firms they feel are falling behind on AI; the client subset size is not stated
    provenance: vendor-published
    source_ref: TR-FOP-2026
  prerequisites:
  - Relationship data capture across the portfolio (entry 01)
  - Agreed contact-frequency standards for key clients and a shared health view visible to every service-line partner
    on the account (INTROHIVE-ACCTXSELL-2026)
  - A defined route from each alert to a named owner and action
  risks_and_guardrails:
  - Alert quality depends on data quality; the vendor CEO says automated outreach prompts need accurate data (INTROHIVE-LAWSITES-2026)
  - Activity metadata is a proxy for relationship strength; no source tests how well the scores predict client departure,
    so thresholds are unvalidated
  - Introhive says a red-scored account is not a cross-sell opportunity (INTROHIVE-ACCTXSELL-2026)
  - Drafted follow-up messages that carry client information should not be sent without review (CALBAR-GENAI-2026,
    p. 6)
  human_checkpoints:
  - The relationship owner decides whether and how to act on each alert
  - Leadership and account partners decide what a cooling key relationship needs
  role_evolution: Account leadership shifts from partner-reported updates to a continuously updated portfolio view,
    per Introhive (INTROHIVE-ACCTXSELL-2026); partners are prompted to act on signals instead of relying on memory
    (INTROHIVE-LAWSITES-2026). No source reports a change in job titles.
  evidence_grade: B
  sources:
  - ref: INTAPP-HOWESPERCIVAL-2025
    title: Howes Percival uses Intapp DealCloud as its all-in-one platform for CRM, relationship intelligence and
      email marketing (client story)
    publisher: Intapp
    type: vendor
    url: https://www.intapp.com/case-study/howes-percival-dealcloud/
    date: '2025-02-24'
    access: full
    locator: Sections 'Relationship intelligence that supports strong client relationships' and 'Executive summary'
