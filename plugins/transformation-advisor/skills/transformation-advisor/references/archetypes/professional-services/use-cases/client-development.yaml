  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: Partners do not follow up consistently, and BD teams are asked to do more outreach with the same people.
  solution: 'Idea discussed by practitioners, not a found deployment: an agent chooses contacts, drafts messages
    and schedules or sends them within defined limits, escalating replies to a person. CMBDO panelists described
    BD as a good place to start agentic experiments, and partners in a vendor survey expect AI-driven BD to grow.'
  outcomes:
  - lever: growth
    description: none published
    figure: none published
    measures: 'Survey expectation only: respondents expecting to run AI-driven BD rise from 8 to 40 of 123 within
      18-24 months'
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  prerequisites:
  - Accurate relationship data and permissions (INTROHIVE-LAWSITES-2026)
  - A written limit on what the agent may send without review; Oregon calls it prudent to subject autonomous actions
    to lawyer approval (OSB-FO-2026-208, section III.D)
  risks_and_guardrails:
  - A lawyer must not deploy an agentic system so that it autonomously transmits client information externally,
    including automated communications, without safeguards and human review (CALBAR-GENAI-2026, p. 6)
  - Lawyers must not let agentic systems communicate legal advice or act in a representative capacity without meaningful
    supervision (CALBAR-GENAI-2026, Executive Summary p. 2)
  - An agent could send an engagement letter on its own, which a prospect could read as forming a relationship (OSB-FO-2026-208)
  - An unreviewed reply to a client is a 'one-way door' in the ILTACON panel's reversibility test (TRI-AGENTIC-2026)
  - In the US, AI-generated voices fall under the Telephone Consumer Protection Act and generally need the called
    party's prior express consent (FCC-24-17, paragraph 2); its reach to calls to business contacts was not examined
  - Law Society research says many solicitors confuse agentic AI with AI agents and stay responsible for outputs
    they cannot fully audit (LAWSOC-AGENTIC-2026)
  human_checkpoints:
  - The partner approves the target list and message templates
  - A person reviews replies and any message that contains client information or advice
  role_evolution: Not evidenced. If built, BD professionals would supervise sequences and partners would stay the
    voice of the relationship; no source describes this in practice.
  evidence_grade: D
