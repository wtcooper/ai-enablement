- id: professional-services-client-development-13
  title: Website chatbot or AI agent that answers prospective clients, gathers facts and routes leads
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - transaction-processing
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: Prospects contact firms outside office hours and intake is slow, but a conversational tool can create
    a client relationship by accident or mislead.
  solution: A chatbot (rule-based or AI-powered, possibly with agent features) answers visitors' questions, gathers
    factual information and routes leads to a lawyer. California gives 'autonomously facilitating client intake'
    as an example of agentic AI. Oregon's opinion says far more chatbots are in use without agent features than
    with them.
  outcomes:
  - lever: speed
    description: none published
    figure: none published
    measures: The sources are bar-body opinions, not deployments
    provenance: independent
    source_ref: OSB-FO-2026-208
  prerequisites:
  - Monitoring and the ability to modify chatbot responses, so a lawyer can review communications and correct misstatements
    (OSB-FO-2026-208, section II)
  - Vendor due diligence, including underlying software vendors, repeated periodically (OSB-FO-2026-208, section
    II)
  - Automatic notification so a responsible lawyer can promptly review each interaction and decide whether a relationship
    formed (OSB-FO-2026-208, section III.A)
  risks_and_guardrails:
  - A chatbot that sounds like a lawyer can lead a prospect to believe a lawyer-client relationship has formed;
    disclaimers must be clear (OSB-FO-2026-208, section III.A)
  - A chatbot that does not identify itself could be misleading under Rule 7.1 and must not give legal advice (OSB-FO-2026-208,
    section III.B); Florida says prospects must be told they are communicating with an AI program (FLBAR-OP241-2024)
  - Information from prospects is protected under Rule 1.18; disqualifying information obtained through a chatbot
    should go promptly into the conflict system (OSB-FO-2026-208, section III.C)
  - Autonomous actions such as sending an engagement letter should be subject to lawyer approval (OSB-FO-2026-208,
    section III.D)
  - 'EU AI Act Article 50(1): systems that interact directly with people must tell them they are dealing with AI
    unless obvious (AIACT-ART50)'
  human_checkpoints:
  - A responsible lawyer reviews each interaction and decides whether to proceed or tell the prospect no relationship
    will follow
  - Lawyer approval before any autonomous communication goes out
  role_evolution: Oregon says review of chatbot interactions may be delegated to trained staff, and that supervisory
    duties under Rule 5.3 may reach third parties that provide chatbot services (OSB-FO-2026-208).
  evidence_grade: C
