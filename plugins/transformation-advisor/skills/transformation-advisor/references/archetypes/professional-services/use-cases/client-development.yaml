- id: professional-services-client-development-15
  title: Matter-level evidence of AI use and its effect on time and value, shown to clients
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - data-reporting
  - client-interaction
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: Clients ask what AI did on their matters and what it saved; firms mostly cannot answer from records.
    A Ropes & Gray panelist described AI ROI measurement as resting more on conventional wisdom than hard evidence.
    Some clients ask for line-item AI transparency on invoices while others set guidelines refusing to pay for AI-done
    work.
  solution: 'Capture AI-assisted work automatically against client and matter so account teams can show where AI
    was used, what was reviewed and what changed, as the basis for a value conversation. Legora and Laurel announced
    on 2026-10-13 that Laurel will turn each task done in Legora into a draft time entry with client, matter and
    narrative, and that a second phase will jointly develop measures of AI usage and value. TRI recommends value
    metrics beyond hours saved: turnaround, risk identification, consistency and client satisfaction.'
  outcomes:
  - lever: experience
    description: Organisations collecting ROI metrics from AI
    figure: 18%
    measures: Respondents whose organisations collect ROI metrics from AI; most metrics are internal, such as cost
      savings or usage
    provenance: vendor-published
    source_ref: TR-AIPS-2026
  - lever: experience
    description: Corporate legal respondents who know whether their firms use AI
    figure: 54% say firms should; 29% know it is used; 67% do not know
    measures: Corporate legal respondents who say firms should use AI on their matters / know it is used / do not
      know (infographic 8)
    provenance: vendor-published
    source_ref: TR-AIPS-2026
  - lever: experience
    description: Firms and legal departments not measuring AI return
    figure: 85% of law firms; 75% of corporate legal departments
    measures: Respondents not collecting AI ROI data or unsure
    provenance: vendor-published
    source_ref: TRI-GREATDISCONNECT-2026
  prerequisites:
  - Automatic capture of AI usage and time at matter level (LEGORA-LAUREL-2026)
  - Value measures agreed with the client beyond hours saved (TRI-STANDOUT-2026, 'Moving to more value-based measurement')
  - Partner training to hold the conversation (entry 14)
  risks_and_guardrails:
  - Hourly bills must reflect time actually spent; flat fees may build in AI savings; AI costs billed as expenses
    must be actual cost with no markup without informed written consent (CALBAR-GENAI-2026, p. 8)
  - Under ABA Opinion 512 as summarised, firms may not bill general overhead or time learning a tool they will use
    regularly (FMG-ABA512-2024)
  - Client guidelines may restrict or prohibit AI use or charges, and firms must follow them (CALBAR-GENAI-2026,
    p. 7; LOUBAR-2025)
  - Firm leaders said measurement is still anecdotal (TRI-LEGALWEEK-2026); a Bloomberg Law column notes demand for
    Big Law lawyers' time rose 4.2% in H1 2026, so AI has not yet visibly reduced the hours clients buy (BLOOMBERG-AICOST-2026)
  human_checkpoints:
  - Lawyers review draft time entries (LEGORA-LAUREL-2026)
  - The billing partner approves any AI-related line item or credit; partner and client agree how value is shared
  role_evolution: Client-relationship, pricing and finance roles share ownership of AI value reporting; the Ropes
    & Gray technology innovation director described client requests for line-item transparency as beginning (TRI-LEGALWEEK-2026).
  evidence_grade: C
