- id: professional-services-client-development-09
  title: AI call and meeting summaries and call coaching written into the account record
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - document-production
  - client-interaction
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Notes from client calls and meetings are lost or never reach the account record.
  solution: A call summary agent turns call conversations into meeting summaries, and a call coach agent analyses
    recordings to improve communication; both feed the account record held in a professional services automation
    (PSA) system. Certinia lists both agents in its Veda catalogue.
  outcomes:
  - lever: capacity
    description: none published
    figure: none published
    measures: Vendor product listing only; no named customer, error rate or time saving
    provenance: vendor-published
    source_ref: CERTINIA-VEDA-2026
  prerequisites:
  - Participant consent for recording and transcription, which depends on state or national consent rules (BLOOMBERGLAW-OTTER-2026)
  - A decision on retention and where transcripts are held, since AI notes create a new category of discoverable
    documents (BLOOMBERGLAW-OTTER-2026)
  risks_and_guardrails:
  - In In re Otter.ai Privacy Litigation, plaintiffs who were not account holders allege an AI notetaker recorded
    meetings without consent under California's wiretapping statute; Bloomberg Law's analysis says the safest course
    is to disclose the tool and get all participants' consent (BLOOMBERGLAW-OTTER-2026)
  - The article lists nine all-party-consent jurisdictions, including California, Florida, Illinois and Pennsylvania
    (BLOOMBERGLAW-OTTER-2026)
  - Whether a vendor counts as a tool or a third-party eavesdropper is unsettled, and a vendor with data-mining
    rights can expose the customer to vicarious liability (BLOOMBERGLAW-OTTER-2026)
  - Client confidential information may not go into tools with material confidentiality risks without informed consent
    (CALBAR-GENAI-2026, p. 5)
  human_checkpoints:
  - The account lead reviews the summary before it is shared or filed
  - The notetaker is disclosed at the start of the meeting
  role_evolution: No source found describes role changes from AI call summaries or coaching.
  evidence_grade: C
