- id: professional-services-client-development-16
  title: AI disclosure and consent terms in engagement letters, client guideline responses and renewals
  archetype: professional-services
  module: client-development
  function: risk-compliance-legal
  work_types:
  - document-production
  - client-interaction
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Clients ask how AI is used on their work and set terms about it, while professional-body guidance says
    boilerplate consent is not enough.
  solution: Firms standardise AI terms (what AI may be used for, human review, no confidential data to public AI
    systems without written consent, notice of changes) in engagement letters, answer client AI addenda, and reopen
    the terms at renewal. A CPA-firm consultancy's sample clause says the firm will consider 26 USC 7216 before
    disclosing tax return data.
  outcomes:
  - lever: risk
    description: Law firms whose policy requires client approval for GenAI use, by firm size
    figure: 8% (under 50 lawyers), 20% (50-149), 24% (150-349), 38% (350-699), 34% (over 700)
    measures: Share of surveyed firms in each band selecting 'Must obtain client approval' among options describing
      their official GenAI policies (more than one option allowed)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  - lever: risk
    description: Law firms with a formal GenAI policy, by size
    figure: 57% (under 50 lawyers) to 98% (350-699)
    measures: Share of surveyed firms in each band selecting 'A formal policy is in place'
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  prerequisites:
  - A firm position on which AI uses are material to the client; the NYC Bar notes routine embedded tools such as
    grammar checks need not be disclosed (NYCBAR-OP2024-5, footnote 21)
  - Awareness of statutory consent rules for tax data (WOODARD-2025)
  risks_and_guardrails:
  - General boilerplate in engagement letters is not sufficient consent under ABA Opinion 512, as summarised (JOA-DISCLOSE-2025;
    2CIVILITY-ABA512-2024)
  - 'Disclosure carries a trust cost: across 13 experiments people who disclosed AI use were trusted less, and being
    exposed later by someone else was worse (SCHILKE-OBHDP-2025; SCHILKE-CONVERSATION-2025)'
  - The SRA has no specific guidance on disclosing AI use for client care; the Law Society advises firms and clients
    to decide together whether and how tools will be used (LAWSOC-GENAI-2026)
  - The ICMCI code requires consultants to tell clients when AI materially affects advice, analysis or deliverables,
    and encourages engagement terms on AI scope (ICMCI-AICODE-2026, sections 3.3, 7.1 and 7.3)
  - For CPAs, no federal law or CPA standard specifically mandates disclosure of gen AI use, though some states
    have disclosure-related laws (JOA-DISCLOSE-2025)
  human_checkpoints:
  - A partner or risk lead approves the AI terms offered to or accepted from each client
  - Terms are reviewed annually as guidance evolves (WOODARD-2025)
  role_evolution: No source found describes role changes. Woodard's slides recommend updating AI clauses annually
    (WOODARD-2025).
  evidence_grade: B
