  prerequisites:
  - A governed relationship system of record (DealCloud or similar) and an implementation partner (Epiq for Wotton
    Kearney) (INTAPP-WOTTONKEARNEY-2026)
  - 'A sanctioned alternative to consumer chatbots: 41% of professionals who use AI at work lack access to AI tools
    built for professional work (TR-FOP-2026)'
  - 'Policy and training: training before access is required by 11% of the smallest law firms and 72% of the largest
    (ILTA-TECHSURVEY-2026, Q3.18)'
  - Ethical walls and need-to-know restrictions applied to the assistant
  risks_and_guardrails:
  - A lawyer must not enter client confidential information into a tool with material confidentiality or security
    risks without informed consent (CALBAR-GENAI-2026, p. 5)
  - ABA Opinion 512, as summarised, asks lawyers to understand a tool's terms and whether it is self-learning before
    entering client information (FMG-ABA512-2024)
  - Intapp says the same walls, restrictions and audit requirements that apply to staff apply to Celeste (LAWSITES-CELESTE-2026);
    this is a vendor statement
  - An Intapp executive told investors that MCP creates repositories of business information outside a firm's professional
    compliance controls (INTAPP-Q3CALL-2026)
  - Agents are limited by the data and tools they are given, CMBDO panelists warned (TRI-CMBDO-2026)
  - All firm selections found are announcements; no firm has published BD results
  human_checkpoints:
  - The partner reviews every outbound message and checks claims about the client or the firm
  - Staff review answers before acting on them
  role_evolution: BD professionals and lawyers ask questions in plain language rather than navigate dashboards (INTAPP-WOTTONKEARNEY-2026).
    Introhive's CEO says partners now take on BD tasks that once sat with marketing, and that AI purchasing in firms
    is often led by IT or innovation groups rather than BD (INTROHIVE-LAWSITES-2026). California expects managerial
    lawyers to set clear AI policies and training (CALBAR-GENAI-2026, p. 7).
