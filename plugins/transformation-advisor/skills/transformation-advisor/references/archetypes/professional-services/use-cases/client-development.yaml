- id: professional-services-client-development-19
  title: Revenue-linked attribution of business-development activity
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - data-reporting
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: Most firms cannot connect BD activity to revenue, so they cannot show whether relationship tools or AI
    pay back.
  solution: Relationship, pipeline and billing data are joined so introductions, meetings, cross-sell and influenced
    pipeline can be attributed to mandates and revenue, replacing login and usage counts as the measure of return.
    Intapp lists 'outcome attribution' in DealCloud.
  outcomes:
  - lever: growth
    description: Measurement gap in BD return
    figure: 63% have no revenue-linked way to measure BD ROI; 15% can track revenue with strong attribution
    measures: Share of firms, as reported by 123 surveyed partners; survey run by Thinktiv for Introhive
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  - lever: growth
    description: What firms track instead
    figure: 28% intermediate metrics; 22% usage and logins; 13% no formal measurement
    measures: 'As the source states it, of firms without a revenue-linked measure: share tracking introductions
      and meetings; usage and logins; nothing formal (the three add to the 63%)'
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  prerequisites:
  - Reliable relationship and activity data (entry 01)
  - Shared identifiers across CRM, matter and billing systems
  - Agreement on what counts as influenced revenue
  risks_and_guardrails:
  - 'Introhive''s CEO concedes attribution is contested: lawyers say the relationship, not the data, produced the
    business, and the ''if I had only known'' case is ''not a slam dunk'' (INTROHIVE-LAWSITES-2026)'
  - Efficiency metrics that track only hours saved miss client value; TRI recommends turnaround, risk identification,
    consistency and client satisfaction (TRI-STANDOUT-2026)
  human_checkpoints:
  - BD and finance leaders agree attribution rules before results are used, especially in partner compensation
  role_evolution: Not evidenced beyond the measurement gap; TRI says partners are the 'commercial transmission mechanism'
    of the firm (TRI-STANDOUT-2026).
  evidence_grade: C
  sources:
