# professional-services / client-development use cases (synthesised 2026-10-19 from research/runs/wave3)
# Firm kinds are named in each entry's notes. In-house examples are tagged "in-house".

- id: professional-services-client-development-01
  title: Zero-entry capture and enrichment of contacts, meetings and emails into the firm's CRM
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - data-reporting
  - client-interaction
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: Relationship data sits in individual inboxes, calendars and spreadsheets because fee-earners rarely log
    contacts and meetings by hand, so the CRM (client relationship management system) is incomplete. Introhive's
    CEO describes CRM adoption at law firms as 'negligible' because a CRM needs professionals to spend time entering
    data.
  solution: 'Software reads email and calendar data and creates or updates contact, company and activity records
    in the firm''s CRM (Salesforce, Dynamics, HubSpot or DealCloud) without manual entry, and enriches the records.
    Named in vendor case studies: accounting firms Schneider Downs and LBMC (Dynamics), KSM (Salesforce, deployed
    ahead of the CRM rollout) and Grassi (HubSpot); law firm Howes Percival uses DealCloud with an Outlook integration.
    Introhive says its platform processes email metadata only, and that users can set deny lists and subject-line
    keywords such as ''confidential'' or ''privileged'' that block processing.'
  outcomes:
  - lever: capacity
    description: Volume of activity captured automatically into the CRM at Schneider Downs
    figure: 3,120,627 meetings and emails ingested; 71,948 new contacts identified, 26,891 of them executive-level
    measures: Meetings and emails automatically ingested into Dynamics CRM; new contacts identified (the case study's
      own labels). Activity counts, not business results
    provenance: vendor-published
    source_ref: INTROHIVE-SCHNEIDERDOWNS-2026
  - lever: cost
    description: Time-saving return claimed for LBMC
    figure: $197,115
    measures: '''Total ROI from time savings'' as labelled on the case study; the calculation basis is not shown'
    provenance: vendor-published
    source_ref: INTROHIVE-LBMC-2024
  - lever: quality
    description: Data accuracy claimed for the enrichment service
    figure: 90%
    measures: Home page says 'data accuracy of 90% across a wide range of clients'; what is checked against what
      is not defined
    provenance: vendor-published
    source_ref: INTROHIVE-HOME-2026
  - lever: quality
    description: CRM data accuracy quoted by an unnamed international law firm
    figure: 97%
    measures: A customer's own statement of its CRM data accuracy rate, quoted anonymously on the vendor's landing
      page for a Forrester study the vendor commissioned; not independently checked
    provenance: vendor-published
    source_ref: INTROHIVE-FORRESTER-2024
  prerequisites:
  - Access to firm email and calendar data
  - A CRM system of record, or a data foundation laid ahead of one (KSM did this before its Salesforce rollout)
    (INTROHIVE-KSM-2026)
  - A passive implementation that adds no steps for professionals, the stated aim at Thomson Snell & Passmore and
    Schneider Downs (INTROHIVE-TSP-2026; INTROHIVE-SCHNEIDERDOWNS-2026)
  - 'Privacy settings the firm controls: deny lists and keyword exclusions set before data is processed (INTROHIVE-PRIVACY-2024)'
  - 'A governance position partners accept: 83% of surveyed partners said yes or maybe to AI tools reading email
    content when the firm controls governance (INTROHIVE-PARTNER-2026)'
  risks_and_guardrails:
  - 'Automated records must be accurate: Introhive''s CEO says the old tolerance for bounced mailing-list entries
    no longer holds once outreach is automated (INTROHIVE-LAWSITES-2026)'
  - Persistent AI access to email and client files raises acute confidentiality questions; a lawyer must limit the
    scope of access and keep monitoring and access controls in place (CALBAR-GENAI-2026, p. 6)
  - Client billing data was the most sensitive category for partners in the Introhive survey, especially in legal
    and accounting (INTROHIVE-PARTNER-2026)
  - The vendor states compliance with GDPR, PIPEDA and CCPA and an annual SOC 2 Type II audit; this is a vendor
    statement and no regulator or professional-body analysis of firm-wide email-metadata capture was found (INTROHIVE-PRIVACY-2024)
  - All outcome figures are vendor-published activity counts or ROI claims; no independent measure of accuracy,
    override or correction rates was found
  human_checkpoints:
  - Professionals review newly found contacts before they are added to the CRM (KSM case study) (INTROHIVE-KSM-2026)
  - Users or administrators set deny lists and keyword exclusions before processing (INTROHIVE-PRIVACY-2024)
  role_evolution: Fee-earners are no longer expected to log contacts and meetings by hand. Introhive's CEO describes
    AI as becoming 'the new user interface' that prompts lawyers instead of asking them to log in (INTROHIVE-LAWSITES-2026).
  evidence_grade: B
  sources:
