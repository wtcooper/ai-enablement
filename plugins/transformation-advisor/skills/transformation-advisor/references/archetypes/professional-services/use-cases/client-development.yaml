- id: professional-services-client-development-02
  title: Relationship maps and strength scores for warm paths, cross-practice coverage and partner succession
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - research-synthesis
  - client-interaction
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Firms cannot see who knows whom across practice groups or how strong each relationship is. Cross-sell
    is missed, outreach is duplicated, and relationships can leave with departing partners. In a vendor-commissioned
    survey of 123 partners, 78% say relationship data at their firm is hard to act on.
  solution: 'Captured relationship data (entry 01) is turned into relationship maps and strength scores. Teams use
    them to find warm introductions into clients, coordinate across practices and service lines, and plan for succession,
    departures and lateral hires. Named: law firm Thomson Snell & Passmore and accounting firm Grassi (Introhive,
    both listing succession or lateral onboarding among deliverables); law firm Howes Percival (DealCloud alerts
    and an Outlook panel showing who knows the contact and the relationship score). Pattern ''other'': relationship-graph
    analytics.'
  outcomes:
  - lever: growth
    description: Employees connected to the firm's Top 50 accounts at Thomson Snell & Passmore
    figure: 47 to 97 employees (+106%)
    measures: Employees connected to the firm's Top 50 accounts, as reported on the vendor case study; period not
      stated. Counts connections, not fees
    provenance: vendor-published
    source_ref: INTROHIVE-TSP-2026
  - lever: growth
    description: Practice groups interacting with Top 50 accounts at Thomson Snell & Passmore
    figure: 3 to 5 practice groups (+67%)
    measures: '''Average department interaction'' with Top 50 accounts, as labelled on the case study'
    provenance: vendor-published
    source_ref: INTROHIVE-TSP-2026
  - lever: growth
    description: Vendor-reported increases in referrals, cross-sell revenue and win rates
    figure: 30% increase in internal referrals and cross-sell revenue; 36% increase in win rates
    measures: Home-page claims with no cohort, baseline, period or number of firms
    provenance: vendor-published
    source_ref: INTROHIVE-HOME-2026
  - lever: experience
    description: What partners rank as most valuable from combining firm information
    figure: Cross-sell opportunities 54%; at-risk relationship alerts 49%; relationship mapping 46%
    measures: Share of 123 partners (42 legal, 42 accounting, 39 other) ranking each item among the most valuable;
      a preference, not an outcome; survey run by Thinktiv for Introhive
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  prerequisites:
  - Clean, firm-wide relationship data from email and calendar capture (entry 01)
  - Agreement across practice groups on shared visibility of key accounts; Howes Percival advises consulting each
    practice group on its customisations (INTAPP-HOWESPERCIVAL-2025)
  - A defined list of key accounts
  risks_and_guardrails:
  - Scores and maps are model outputs; Laing O'Rourke (a construction company using the same tool) says the aim
    is to back human knowledge with data, not replace it (INTROHIVE-LAINGOROURKE-2025)
  - ABA Opinion 512, as quoted by in-house advisers, warns that even tools siloed within a firm may expose information
    to people behind an ethical wall (LOUBAR-2025, Tip 3)
  - Confidentiality duties extend to prospective and former clients (Model Rules 1.18(b) and 1.9(c)), per ABA Opinion
    512 as summarised (FMG-ABA512-2024)
  - No independent evidence that mapping raised revenue or retention was found; the vendor's referral and win-rate
    figures have no stated basis (INTROHIVE-HOME-2026)
  human_checkpoints:
  - Partners and BD staff decide whom to contact and what to say; Akin Gump's client-intelligence director says
    outcomes still depend on relationship quality and execution (AKIN-MONEYBALL-2026)
  role_evolution: BD and marketing teams use shared relationship data to coordinate cross-practice outreach; the
    Thomson Snell & Passmore story lists onboarding intelligence for senior lateral hires and succession planning
    for departing lawyers among its deliverables (INTROHIVE-TSP-2026).
  evidence_grade: B
  sources:
  - ref: INTROHIVE-TSP-2026
    title: Thomson Snell & Passmore Doubles Firm-Wide Account Connectivity with Introhive (client story)
    publisher: Introhive
    type: vendor
    url: https://www.introhive.com/resource/client-story/thomson-snell-passmore-law-firm-relationship-intelligence/
    date: '2026-08-05'
    access: full
    locator: '''Mapped Relationships Deliverables''; ''Measurable business impact'' panel'
