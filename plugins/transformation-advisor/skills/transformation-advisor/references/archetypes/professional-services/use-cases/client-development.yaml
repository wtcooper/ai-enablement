- id: professional-services-client-development-20
  title: 'Co-creating AI with key clients: client AI labs and jointly defined use cases and measures'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: piloting
  problem: Clients want evidence that a firm's AI helps them, but talk about AI rarely turns into shared work, and
    neither side has a shared way to measure or split AI savings. Parker Poe says the interactions that shape the
    relationship are often ones that never appear on a bill.
  solution: 'Law firm Parker Poe held an invitation-only workshop on 2026-09-10 in Charlotte where general counsel,
    legal operations, compliance and business executives sat with its lawyers and built and tested AI assistants
    in teams of four to six on the Lega AI Builder Lab. Tracks were company research, risk disclosure updates and
    executive legal briefings, as part of the firm''s ''Moments That Matter'' client-experience programme; the release
    says a similar lab with Fasken in Canada came first. At Legalweek, GSK''s chief of staff for legal and compliance
    said the company learns from its outside firms about their GenAI use and looks to partner on new use cases.
    The fuller version: key clients and firms agree how AI will be used on the client''s work, test use cases together
    and define savings measures jointly.'
  outcomes:
  - lever: experience
    description: Participant choice in the Parker Poe lab
    figure: about 90% chose the executive briefing track
    measures: Share of participants choosing the executive legal briefing track; a participation figure, not an
      outcome
    provenance: self-reported
    source_ref: PARKERPOE-LAWSITES-2026
  prerequisites:
  - A client-experience programme and clients willing to attend and share business context
  - A lab platform, facilitator and knowledge sources prepared and approved in advance
  - Agreed definitions of savings and quality for joint use cases
  risks_and_guardrails:
  - A single event with no published follow-up on whether participants use the assistants; the release is promotional
    and describes production use as future (PARKERPOE-LAWSITES-2026)
  - One participant, the head of legal at Symphonic Distribution, said the skill is building repeatable AI processes
    a team can run without the firm (PARKERPOE-LAWSITES-2026)
  - The firm must follow client instructions that restrict AI use, and joint use of client data engages confidentiality
    and informed-consent duties (CALBAR-GENAI-2026, pp. 5 and 7)
  human_checkpoints:
  - Lawyers and client staff jointly judge which outputs are useful
  - Client and firm leads sign off on use case, data scope and measure before joint work starts
  role_evolution: Parker Poe's chief marketing and BD officer frames the lab as client-experience work, with lawyers
    and clients as co-designers (PARKERPOE-LAWSITES-2026). Pricing and innovation officers, such as Greenberg Traurig's
    chief pricing and innovation officer, span both sides of joint use-case work (TRI-LEGALWEEK-2026).
  evidence_grade: B
  sources:
  - ref: PARKERPOE-LAWSITES-2026
    title: Parker Poe Clients & Attorneys Build AI Assistants Together to Help Deliver Better Outcomes (firm press
      release dated 2026-09-11, carried by LawSites)
