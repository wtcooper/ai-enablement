- id: professional-services-client-development-21
  title: Firm-built AI tools and client portals offered to clients as relationship assets
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - software-systems
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: Clients want AI-enabled service but see little of what firms do, and firms want to stay central as clients
    adopt AI themselves. Practitioners expect clients to reach legal services through their own AI tools, so firm
    knowledge that AI cannot reach may be bypassed.
  solution: Law firms package their knowledge into client-facing tools. Debevoise's STAAR (Suite of Tools for Assessing
    AI Risk) gives clients the firm's guidance on AI governance and risk; ABA Journal reports STAAR 2.0 as a subscription
    platform built with Legora. Cooley made Cooley GO Lab, a Legora-built startup workspace, available free to a
    summer Y Combinator cohort. A&O Shearman has a revenue-sharing arrangement with Harvey to license its tools
    to clients and other firms. Legora's Portal lets firms invite clients into a white-labelled workspace to run
    firm-designed workflows without seeing prompts or logic; a Linklaters partner is quoted on the product page.
    A Law Punx contributor and an in-house chief legal officer describe the next step as firms and clients working
    inside shared AI environments.
  outcomes:
  - lever: growth
    description: none published
    figure: none published
    measures: No usage, revenue or retention figure was found for any of these offers
    provenance: self-reported
    source_ref: DEBEVOISE-BLOOMBERG-2026
  prerequisites:
  - Curated firm knowledge that partners agree to contribute (Debevoise cites its collaborative culture) (DEBEVOISE-BLOOMBERG-2026)
  - A platform partner whose terms allow sharing or resale
  - Pricing and licensing decisions for client access (see professional-services-scoping-pricing-23)
  - Knowledge management that AI can use, with client permissions and data controls (LAWPUNX-2025)
  risks_and_guardrails:
  - A consultant told Law.com that firms fear clients using AI themselves or licensing their 'secret sauce' to peers,
    and asked why clients would still pay firms (ABAJ-SHARE-2026)
  - An in-house CLO asks whether legal departments will control, and be able to take with them, the 'legal memory'
    held in shared AI systems, or rent it (BLOOMBERGLAW-GCXAI-2026)
  - Fee and disclosure rules apply to matter-specific AI costs, and confidentiality limits sharing across clients
    (CALBAR-GENAI-2026, pp. 6 and 8)
  human_checkpoints:
  - Firm lawyers curate and review the guidance the tools draw on; Debevoise says STAAR complements lawyers' advice
    (DEBEVOISE-BLOOMBERG-2026)
  role_evolution: Cooley's partner said the aim includes being seen as providing best-in-class information (ABAJ-SHARE-2026).
    The CLO columnist notes 'legal engineer' has emerged as a profession, often held by non-lawyers (BLOOMBERGLAW-GCXAI-2026).
  evidence_grade: B
  sources:
