- id: professional-services-client-development-22
  title: 'Client AI enablement: client-facing innovation roles that scope, support and advise on clients'' own AI
    adoption'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - expert-judgment
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Clients ask what the firm's AI means for them and bring their own AI to their advisers, but partners
    lack the time or knowledge to scope AI engagements and answer technology questions. A Ravical survey reported
    that 54% of accountancy firms had to amend guidance clients obtained from ChatGPT and 51% met clients asking
    whether AI could replace their services.
  solution: A dedicated innovation team supports partners and clients. Latham & Watkins' 'Innovation Attorney -
    Client Team Enablement' scopes and delivers client-specific AI engagements (workflows, pilots, workshops), advises
    partners and clients on capabilities and limits, works with BD on panels, pitches and RFPs, and tracks client
    interactions in firm repositories. Search summaries show similar postings at Latham, Baker McKenzie (Client
    AI Risk Lead) and Wolf Greenfield. In accounting, an ENGAGE 2026 session covered AI conversations and integration
    with CPA clients; Source Global Research asks where consultants add most value for clients around AI.
  outcomes:
  - lever: growth
    description: none published
    figure: none published
    measures: A job description reports no outcomes
    provenance: self-reported
    source_ref: LATHAM-INNOVATIONATTY-2026
  - lever: growth
    description: Accountants reporting client demand for technology guidance
    figure: 62%
    measures: Share of 725 US professionals reporting clients need more guidance on technology management (59% on
      business planning and strategy); Intuit-sponsored survey
    provenance: vendor-published
    source_ref: CPAPA-TECHSURVEY-2026
  prerequisites:
  - An AI and innovation function, with an approved catalogue of AI capabilities the role helps maintain (LATHAM-INNOVATIONATTY-2026)
  - Firm-level AI literacy, a stance on tools and risk, and a repeatable framework for client AI conversations (KARBON-ENGAGE-2026)
  - Security and confidentiality controls for client-specific work
  risks_and_guardrails:
  - The Latham posting requires delivery with appropriate quality, documentation, confidentiality and information
    security, in line with firm and client requirements (LATHAM-INNOVATIONATTY-2026)
  - Advice on AI tools is itself an area where the firm can be wrong; the Ravical article does not state its sample
    size (RAVICAL-ACCOUNTANT-2025)
  - For CPA firms, developing or hosting an AI system for an attest client can raise independence concerns (JOA-ETHICS-2026);
    see assurance-acceptance-independence-15
  - The ICMCI code includes a part on advising clients on AI and bars overstating AI expertise (ICMCI-AICODE-2026)
  human_checkpoints:
  - Client AI work is delivered with the human oversight the role advises clients on (LATHAM-INNOVATIONATTY-2026)
  - Partner-led advice on which tools, risks and use cases suit the client
  role_evolution: New hybrid roles sit between innovation, client service and BD (LATHAM-INNOVATIONATTY-2026). The
    Ravical CEO says accountants can redefine their role as trusted advisers who help clients adopt AI responsibly
    (RAVICAL-ACCOUNTANT-2025).
  evidence_grade: B
  sources:
