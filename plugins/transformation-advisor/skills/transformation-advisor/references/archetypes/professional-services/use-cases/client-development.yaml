- id: professional-services-client-development-14
  title: Partner-led AI value conversations with key clients, prepared with evidence and approved language
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - expert-judgment
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: 'Clients want AI-enabled quality and savings but hear little, and partners rarely raise the subject.
    Firms get contradictory instructions: some clients require AI use and others prohibit it or will not pay for
    AI-done work. At Legalweek 2026, firm-side answers to ''how much is AI saving us?'' were that they were still
    gathering the data.'
  solution: 'Firms prepare partners with talking points, client-specific insight, approved language on risks and
    limits, and billing guidance, and sequence the conversation: what changed in the work, what changed for the
    client, what value that created, then how pricing should reflect it. A DLA Piper panelist advised firms to set
    the meeting rather than wait for the client to set terms; Greenberg Traurig''s chief pricing and innovation
    officer said clients that were silent about AI now ask how it is used on their matters. AI''s role is preparation
    and evidence (entries 06 and 15); the conversation is human.'
  outcomes:
  - lever: experience
    description: Heavy AI-user partners who have discussed AI with most clients
    figure: about one-third
    measures: Share of 'embedded AI' partners among client-nominated stand-out lawyers who had discussed AI with
      at least 60% of their clients (2,527 lawyers, 116 leader interviews)
    provenance: vendor-published
    source_ref: TRI-STANDOUT-2026
  - lever: experience
    description: Stand-out lawyers who rarely have the conversation
    figure: more than one-third
    measures: Share of stand-out lawyers who had talked about AI with fewer than 20% of their clients
    provenance: vendor-published
    source_ref: TRI-STANDOUT-2026
  - lever: risk
    description: Gap between client expectation and delivery
    figure: 78% vs 6%
    measures: Corporate clients saying AI-enabled quality improvements are very important or essential vs saying
      most or all providers deliver them; client subset size not stated
    provenance: vendor-published
    source_ref: TR-FOP-2026
  - lever: risk
    description: In-house views of law-firm AI savings
    figure: 59% no savings yet; 24% satisfied; 61% plan to push for change
    measures: Share of 657 in-house respondents in 30 countries reporting no GenAI savings from law firms yet; satisfied
      with outside counsel's GenAI cost effectiveness; planning to push for change in delivery and pricing
    provenance: vendor-published
    source_ref: ACCEVERLAW-2025
  - lever: experience
    description: Law firms receiving opposite instructions from clients
    figure: 41%
    measures: Law-firm respondents who received direction from their client base both to use and not to use AI on
      different projects
    provenance: vendor-published
    source_ref: TR-AIPS-2026
  - lever: experience
    description: Firms that say they raised AI efficiencies against clients who say they were approached
    figure: 61% of law firms vs 4% of in-house teams
    measures: Law firms saying they proactively discussed Harvey efficiencies with clients, against in-house teams
      saying their firms approached them; Harvey-commissioned RSGI survey of 87 respondents
    provenance: vendor-published
    source_ref: LEGALIT-RSGI-2026
  - lever: risk
    description: Partner discomfort as a barrier, and rising client demand
    figure: 35%; 56%
    measures: Legal-finance respondents naming partner discomfort as the most common communication barrier; respondents
      seeing more client demand for AI-driven efficiencies or AI-use transparency (BigHand, 800+ respondents)
    provenance: vendor-published
    source_ref: BIGHAND-LF-2026
  - lever: experience
    description: Accountants who volunteer how they use AI
    figure: 33%
    measures: Respondents in Intuit's 725-person survey who proactively explain how AI supports their work (49%
      only when asked; 60% say clients ask for proof of AI data protection always or frequently)
    provenance: vendor-published
    source_ref: INTUIT-AT-2026
  prerequisites:
  - 'Partners who use AI themselves: embedded users are about nine times more likely than minimal users to report
    significant impact on efficiency and quality (TRI-STANDOUT-2026)'
  - 'A GenAI strategy: a Thomson Reuters speaker said firms with one are 3.9 times more likely to achieve ROI and
    that 22% of firms have one (TRI-LEGALWEEK-2026)'
  - Evidence of what changed on the client's matters (entry 15) and a record of each client's AI instructions
  - 'Support for firms opening the conversation: 77% of respondents to TR''s 2026 AI in Professional Services Report
    say firms should take the initiative (TRI-CMBDO-2026, citing TR-AIPS-2026)'
  risks_and_guardrails:
  - California says a lawyer must consider disclosing intended AI use and its benefits and risks, and must follow
    client instructions limiting AI use (CALBAR-GENAI-2026, p. 7); hourly billing must reflect time actually spent
    (p. 8)
  - Under ABA Opinion 512 as summarised, a lawyer must consult the client about AI use where it bears on the basis
    or reasonableness of fees (FMG-ABA512-2024)
  - Leading with price concessions before showing value may train clients to expect discounts (TRI-STANDOUT-2026)
  - Consultants must not overstate AI expertise in client discussions (ICMCI-AICODE-2026, section 11.2)
  - 'Clients do not speak with one voice: some want line-item AI transparency, some refuse to pay for AI-done work,
    and some still ask for warranties that models are unbiased (TRI-LEGALWEEK-2026)'
  - Brynjolfsson and Petropoulos argue AI used internally is likely at first to heighten information asymmetries
    between firm and client (STANFORD-DEL-2026)
  human_checkpoints:
  - The partner leads the conversation and owns what is claimed about AI use and savings
  - Pricing or value-sharing proposals go through the firm's pricing function before they are offered
  role_evolution: TRI calls partners the firm's 'commercial transmission mechanism' and finds technology leadership
    and change management rank near the bottom of qualities stand-out lawyers want in a leader (TRI-STANDOUT-2026).
    Pricing and innovation leaders (Greenberg Traurig's chief pricing and innovation officer; DLA Piper's senior
    managing director of AI innovation) now speak in client conversations (TRI-LEGALWEEK-2026).
  evidence_grade: B
  sources:
  - ref: TRI-STANDOUT-2026
    title: 'Turning law firm AI strategies into practice: Findings from the 2026 Stand-out Lawyers Survey'
    publisher: Thomson Reuters Institute
    type: survey
    url: https://www.thomsonreuters.com/en/institute/reports/turning-law-firm-ai-strategies-into-practice
    date: '2026-08-06'
    access: full
    locator: Sections 'AI strategy is visible, but confidence is weak', 'Getting on the same page' and 'How to talk
      to clients about AI'; Methodology
