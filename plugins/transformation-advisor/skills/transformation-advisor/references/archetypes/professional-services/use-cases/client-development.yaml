- id: professional-services-client-development-12
  title: AI capability claims in marketing, credentials and thought leadership, drafted with AI under editorial
    control
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: Clients expect AI-savvy firms, and silence or vague messaging is a missed opportunity; but claims about
    AI are regulated as marketing statements and AI-generated content has its own transparency rules.
  solution: Firms describe their AI capabilities and results in marketing, credentials and thought leadership, grounded
    in verifiable facts, and use AI to help draft that content under human editorial control.
  outcomes:
  - lever: growth
    description: Share of law firms that actively market their use of GenAI tools, by size
    figure: 2% (under 50 lawyers), 8% (50-149), 19% (150-349), 27% (350-699), 52% (over 700)
    measures: Share of surveyed firms in each lawyer-count band selecting 'Use of GAI tools actively marketed' among
      options describing their official GenAI policies (ILTA Q3.18)
    provenance: independent
    source_ref: ILTA-TECHSURVEY-2026
  prerequisites:
  - 'Claims that are objectively verifiable: the Florida opinion says lawyers may advertise their use of generative
    AI but cannot claim superiority unless objectively verifiable (FLBAR-OP241-2024)'
  - A shared firm position on AI; TRI warns mixed signals leave partners unable to turn aspiration into behaviour
    (TRI-STANDOUT-2026, 'A clearer AI positioning')
  risks_and_guardrails:
  - Management consultants must not overstate AI expertise, credentials or experience in proposals, marketing, credentials
    presentations or client discussions (ICMCI-AICODE-2026, section 11.2)
  - EU AI Act Article 50(4) requires deployers publishing AI-generated text to inform the public on matters of public
    interest to disclose it, unless it had human review and a person holds editorial responsibility (AIACT-ART50);
    the Commission says transparency rules apply from August 2026 (EC-AIACT-2026)
  - Whether firm thought leadership counts as informing the public on matters of public interest is not addressed
    in the sources found
  human_checkpoints:
  - A named editor or partner holds editorial responsibility for each piece before publication
  - Marketing or ethics review of any claim about AI capability or results
  role_evolution: Marketing and BD teams take on claim substantiation alongside content production; no source names
    a new role for it.
  evidence_grade: B
