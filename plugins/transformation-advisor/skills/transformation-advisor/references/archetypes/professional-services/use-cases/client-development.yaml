- id: professional-services-client-development-18
  title: 'AI-analysed client listening: feedback, win-loss and matter-close debriefs, including feedback on AI-enabled
    service'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - data-reporting
  - client-interaction
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Client feedback programmes are periodic, siloed and reach few clients; informal feedback in meetings
    and emails goes unrecorded. A 2024 article citing Thomson Reuters data says 27% of clients had been invited
    to a feedback programme. A 2026 survey of UK consumer clients found 84% satisfied but only about two-thirds
    leaving a review. In-house, 86% of general counsel say their department contributes significantly to organisational
    objectives against 17% of the C-suite.
  solution: 'AI themes free-text feedback from interviews, surveys, pitch debriefs and informal comments into one
    view. UK law firm Shoosmiths announced in May 2023 that it would use MyCustomerLens to centralise feedback across
    departments and offices; law firm Tozers is quoted on the vendor''s home page. Koji offers AI-moderated client
    interviews for client experience, win-loss, matter-close debriefs and in-house stakeholder feedback. An Accounting
    Today opinion piece suggests feeding emails, surveys and reviews to a chatbot to cluster comments and propose
    actions. Two ideas extend this: asking clients specifically about AI-enabled service (comfort by use, transparency,
    value), and in-house teams applying the same method to business stakeholders.'
  outcomes:
  - lever: experience
    description: Efficiencies reported by Shoosmiths, described qualitatively
    figure: none published
    measures: The firm's senior client culture manager cites 'a number of efficiencies' and deeper insight; no figure
      given
    provenance: vendor-published
    source_ref: EDINBURGHNEWS-SHOOSMITHS-2023
  - lever: experience
    description: UK client attitudes to AI in law firms
    figure: none published for AI items
    measures: 'Survey of 642 UK clients (Q4 2025): most see AI as supportive, with unease about its use in case
      management and administration; no percentages for AI items'
    provenance: vendor-published
    source_ref: SJ-LFMC-2026
  prerequisites:
  - Feedback sources collected in a consistent form, and a named owner who reports to senior decision makers (EDINBURGHNEWS-SHOOSMITHS-2023)
  - Data security and AI-use policies before client records go into AI tools (AT-DECODE-2026)
  - Value measures defined with clients for AI-enabled work (TRI-STANDOUT-2026)
  risks_and_guardrails:
  - Surveys suffer confirmation bias, the MyCustomerLens CEO argues in an advertorial-style piece (SJ-LISTENING-2024)
  - Inferring personality from email language, which the opinion piece suggests, raises privacy questions the source
    does not address (AT-DECODE-2026)
  - Disclosing AI use can lower trust, so wording in AI-specific feedback requests can shift answers (SCHILKE-OBHDP-2025)
  - Client information put into AI tools engages confidentiality duties (CALBAR-GENAI-2026, p. 5)
  human_checkpoints:
