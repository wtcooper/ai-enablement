- id: professional-services-client-development-05
  title: 'Opportunity scouting: scheduled AI scans of courts, news, filings and internal data for origination and
    cross-sell'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - research-synthesis
  - data-reporting
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: Finding new mandates and cross-sell openings means manual searching of court records, news and filings
    that busy lawyers cannot do consistently.
  solution: Firms run scheduled or built-in intelligence tools that combine internal relationship and matter data
    with external sources and return a scored list of opportunities. Law firm Akin Gump built 'Moneyball' in-house
    to identify and evaluate opportunities from internal and external intelligence. At a Thomson Reuters session,
    law firm Quinn Emanuel showed daily deep-research prompts that scan appellate decisions and verdicts and score
    matters for 'who pays' and intervention windows. Willkie Farr & Gallagher showed a 'battlecard' that positions
    the firm against research on a target.
  outcomes:
  - lever: quality
    description: Change in internal BD conversations at Akin Gump
    figure: none published
    measures: Qualitative statement by the firm's senior director of marketing and client intelligence that discussion
      moved from reviewing information to deciding what to do with it; no count of opportunities, wins or revenue
    provenance: self-reported
    source_ref: AKIN-MONEYBALL-2026
  prerequisites:
  - Internal data on clients, matters and relationships
  - A firm view of client-development priorities (Akin built its own layer for this) (AKIN-MONEYBALL-2026)
  - A BD or client-intelligence team able to tune prompts and scoring
  risks_and_guardrails:
  - Akin says the tool 'doesn't create opportunities' by itself; outcomes depend on relationship and execution (AKIN-MONEYBALL-2026)
  - Quinn Emanuel's prompts use pass/fail filters, quantified scoring, an exclusion log, primary-source verification
    and labels for fact, allegation or inference (TR-NAVIGATING-2026)
  - No hit rates, false-positive rates or revenue attribution were found
  human_checkpoints:
  - Lawyers and BD staff evaluate and decide which opportunities to pursue (AKIN-MONEYBALL-2026)
  role_evolution: Akin has a senior director of marketing and client intelligence who owns the tool's design (AKIN-MONEYBALL-2026);
    Quinn Emanuel runs an AI and data analytics group with a prompt library and mandatory AI training (TR-NAVIGATING-2026).
    CMBDO panelists called BD an ideal starting point for agentic AI because workflows are less rigid and feedback
    is faster (TRI-CMBDO-2026).
  evidence_grade: B
