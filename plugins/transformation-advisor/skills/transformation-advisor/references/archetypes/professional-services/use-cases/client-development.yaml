- id: professional-services-client-development-08
  title: 'Proactive outreach: nudges when a relationship goes quiet, with tailored client notes and alerts drafted
    for the partner'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - client-interaction
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Partners know they should contact clients regularly but do not find the time or a reason. CMBDO panelists
    said senior lawyers often do not send regular client notes because writing them takes time from billable work,
    and Harvey says generic newsletters do not show a client what a change means for its own operations. Introhive's
    CEO says lawyers will not log into a separate system to write to someone they have not contacted in 90 days.
  solution: The relationship system prompts the partner inside the daily workflow when a relationship has gone quiet
    and supplies a draft; the Introhive CEO's example is a prompt after 35 days without contact, with a script.
    Intapp sells DealCloud Activator, which nudges and coaches partners toward 'Activator' behaviours, with metrics
    and leaderboards for leaders. For content, AI pulls news, regulatory developments, earnings calls, relationship
    data and, at one panel, what clients are reading, and drafts conversation openers, client alerts, sector risk
    briefings, prospect 'issues to watch' reports and board-ready summaries (Harvey). At Parker Poe, clients and
    lawyers built assistants that tailor one legal update to different executives (entry 20).
  outcomes:
  - lever: growth
    description: Partner BD performance linked to 'Activator' behaviours, from a DCM Insights study with Intapp
    figure: up to 32%
    measures: 'Intapp''s wording: leaning into Activator behaviours can raise the average partner''s BD performance
      ''up to 32%''. The metric is not defined, and the study concerns behaviours, not the tool'
    provenance: vendor-published
    source_ref: INTAPP-ACTIVATOR-2026
  prerequisites:
  - Accurate contact and interaction data, integrated with email and calendar (entry 01)
  - Firm agreement on which BD behaviours to encourage (Intapp points to DCM Insights programmes) (INTAPP-ACTIVATOR-2026)
  - Authoritative legal and news sources with citations, and partner training in using drafts (TRI-CMBDO-2026)
  risks_and_guardrails:
  - Automated outreach has to be accurate; the Introhive CEO says the old tolerance for a few bounced Christmas
    cards is gone (INTROHIVE-LAWSITES-2026)
  - Use AI output to start a conversation, not as a script (TRI-CMBDO-2026); a podcast guest advised gauging each
    client's interest rather than making AI the centre of every conversation (LPT-FEDER-2026)
  - Citations and facts in client-facing alerts need human verification; no accuracy evidence was found for client-note
    tools
  - Messages that carry client information should not go out without review (CALBAR-GENAI-2026, p. 6)
  - No named customer and no measurement of the nudging tools themselves were found; how partners react to activity
    leaderboards is not addressed in the sources
  human_checkpoints:
  - The partner chooses whether to send, and edits the draft
  - A lawyer reviews each client alert before it is sent
  role_evolution: BD teams 'plant' tailored prompts for partners, in one panelist's words, while partners keep the
    relationship voice (TRI-CMBDO-2026). Introhive's CEO expects partners to act on prompts rather than maintain
    a CRM (INTROHIVE-LAWSITES-2026); leaders get activity and collaboration metrics (INTAPP-ACTIVATOR-2026).
  evidence_grade: C
