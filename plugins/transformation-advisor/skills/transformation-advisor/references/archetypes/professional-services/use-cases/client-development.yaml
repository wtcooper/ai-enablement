- id: professional-services-client-development-06
  title: AI-prepared pre-meeting client briefs and client intelligence for partners and new teams
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - research-synthesis
  - client-interaction
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Preparing for a client or prospect meeting means searching the CRM, inboxes, news and filings by hand,
    and partners with little non-billable time arrive underprepared. Knowledge about a client sits in closed matters,
    emails and legacy systems that new teams must rebuild. At a TRI forum, one firm executive described a lawyer
    who found the client's in-house team had already used AI to study its own market position.
  solution: A brief or digest is generated before a meeting from relationship history, recent account activity,
    company news, role changes and, in some tools, firm matter history and public filings. Introhive client stories
    name pre-meeting digests or briefs at accounting firms Grassi and LBMC and law firm Thomson Snell & Passmore.
    Law firm Practus and Auxana chose DealCloud with Celeste, which Intapp says surfaces such briefs in seconds.
    Harvey describes briefs built from its Vault and EDGAR filings, and agents that extract a client's shifting
    priorities from each newly opened matter so new teams get up to speed. Certinia lists account summaries, success
    plans and business reviews drafted from account history. For CPA firms, an Accounting Today opinion piece describes
    condensing client emails, meeting notes and history into pre-meeting notes.
  outcomes:
  - lever: speed
    description: Brief preparation time, Practus and Auxana deployment
    figure: Intapp says briefs 'that would otherwise require hours of research can be surfaced in seconds'; no measurement
      given
    measures: Vendor description of expected preparation time; deployment announced with 'will deploy' wording,
      not yet reported on
    provenance: vendor-published
    source_ref: INTAPP-PRACTUS-2026
  - lever: speed
    description: 'Sales preparation time at a financial-services data and risk firm (adjacent: not a professional-services
      firm)'
    figure: Up to 50% faster sales preparation cycles
    measures: '''Sales preparation cycles'', as labelled by the implementation partner for a Salesforce Agentforce
      meeting-preparation assistant; baseline and method not shown'
    provenance: vendor-published
    source_ref: BRIDGENEXT-AGENTFORCE-2026
  prerequisites:
  - Relationship and activity data in a CRM (entry 01) and access to news and filings sources
  - Matter documents reachable by the tool under ethical-wall rules, plus data cleansing and location of proprietary
    data, which COO and CFO forum participants called the real challenge (TRI-COOCFO-AI-2025)
  - Bespoke, one-to-one partner training on using briefs; CMBDO panelists said broad one-size-fits-all sessions
    are not enough (TRI-CMBDO-2026)
  risks_and_guardrails:
  - Briefs are a foundation, not a script; one law-firm technology specialist put the AI contribution at about 90%
    and said the rest needs human judgment (TRI-CMBDO-2026)
  - Quinn Emanuel's research-brief prompt requires primary-document verification and labels each claim as fact,
    allegation or inference (TR-NAVIGATING-2026)
  - Poorly configured agentic systems may disclose confidential information across matters (CALBAR-GENAI-2026, p.
    6)
  - Public AI tools should not receive sensitive client information without safeguards (AT-DECODE-2026)
  - No error, correction or partner override rates were found for any brief tool
  human_checkpoints:
  - The partner reads, interprets and personalises the brief before using it with a client (TRI-CMBDO-2026)
  - Account partners review priorities extracted from matters
  role_evolution: Panelists said AI shifts partners from blank-page preparation to reviewing a tailored starting
    point, with training as the main adoption lever (TRI-CMBDO-2026). Stand-out lawyers rank client-specific insight
    and competitive intelligence as top needs whatever their AI usage (TRI-STANDOUT-2026).
  evidence_grade: B
  sources:
