- id: professional-services-client-development-04
  title: Key-account plans and cross-sell opportunity lists built from relationship, matter and client data
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - research-synthesis
  - data-reporting
  - expert-judgment
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: announced
  problem: Key-account programmes depend on account plans that need data from many practices, and partners say knowing
    where to focus (50%) and identifying cross-sell (43%) are among their biggest BD frictions. Harvey says firms
    ask busy partners to audit past matters by hand and that a BD plan takes dozens of non-billable hours. In accounting,
    a vendor-linked post reports that 91% of clients want proactive advisory while 4% describe their firm as primarily
    advisory.
  solution: AI combines email, calendar, CRM records, matter history and client news to produce account relationship
    summaries, a list of clients to contact and an 'opportunity matrix' that pairs a client's needs with firm capabilities,
    as a starting point for the account team. Intapp lists key-account programmes with AI-revealed cross-sell; Introhive's
    guide for architecture, engineering and construction firms describes AI relationship summaries for strategic
    account planning; Harvey describes analysing historical work product against a client's regulatory exposure
    and drafting the parts of a growth plan. For accounting firms, an opinion piece suggests scanning client communications
    for signs a client may want advisory services, with relationship health deciding which accounts are ready.
  outcomes:
  - lever: growth
    description: Partners ranking cross-sell opportunities as the top benefit of combining firm information
    figure: 54%
    measures: Share of 123 surveyed partners; a preference, not an outcome
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  - lever: growth
    description: Partners naming cross-sell and expansion revenue as the most convincing proof of BD value
    figure: 44%
    measures: Share of surveyed partners
    provenance: vendor-published
    source_ref: INTROHIVE-LAWSITES-2026
  prerequisites:
  - Unified relationship and matter data across practices and service lines (entries 01-02)
  - Named key accounts and account teams
  - A shared client view across audit, tax and advisory teams in accounting firms (INTROHIVE-ACCTXSELL-2026)
  - Partner training on using AI briefs and matrices as a foundation, not a script (TRI-CMBDO-2026)
  risks_and_guardrails:
  - 'Timing: Introhive argues a cross-sell raised before the relationship has depth signals that the firm sees the
    client as a revenue target (INTROHIVE-ACCTXSELL-2026)'
  - For CPA firms, AI-related nonattest services to an attest client (for example developing or hosting an AI system)
    can raise independence concerns; existing nonattest rules still apply (JOA-ETHICS-2026). See assurance-acceptance-independence-15
  - Confidentiality duties extend to prospective and former clients, per ABA Opinion 512 as summarised (FMG-ABA512-2024)
  - Introhive's claim that up to 90% of firms fail to grow key accounts because of fragmented data has no stated
    source or method (INTROHIVE-SAM-2025)
  - Harvey's time-saving claim for BD plans is vendor-authored and unmeasured (HARVEY-BD-2026)
  human_checkpoints:
  - The account team decides plan content and owners
  - Partners on the account decide whether and when to raise a new service
  - Risk or ethics staff check independence and conflicts before a new service is proposed to an attest or conflict-sensitive
    client
  role_evolution: BD professionals curate opportunity lists and conversation openers and partners interpret them;
    CMBDO Forum panelists said AI may get about 90% of the way and the rest depends on judgment and relationship
    skills (TRI-CMBDO-2026). Tax, audit and advisory partners coordinate timing from the same relationship data,
    per Introhive (INTROHIVE-ACCTXSELL-2026).
  evidence_grade: C
