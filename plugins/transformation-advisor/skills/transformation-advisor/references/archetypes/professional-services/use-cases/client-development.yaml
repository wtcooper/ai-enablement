- id: professional-services-client-development-07
  title: 'BD research and drafting assistants: from general-purpose chatbots to assistants grounded in firm relationship
    data'
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - research-synthesis
  - document-production
  - client-interaction
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: Partners are asked to take on BD work that marketing staff once did, with little time, and they do not
    log into the CRM. Among partners already using AI for BD, 68% rely only on general-purpose tools such as ChatGPT,
    Copilot or Gemini, which cannot see firm relationship data. 34% of professionals say they use AI their organisation
    has not sanctioned.
  solution: 'Today many partners research clients and draft messages in general-purpose chatbots outside the firm''s
    data. Vendors now connect assistants to governed relationship data: Introhive announced an MCP server (a standard
    connector that lets AI assistants query a system) in commercial preview on 2026-04-16, described as generally
    available on 2026-10-13, so assistants such as Claude, Harvey, ChatGPT and Copilot can query a firm''s relationship
    data under each user''s existing permissions. Intapp''s Celeste (generally available 2026-07-15) answers plain-language
    questions over relationship history and pipeline. Law firm Practus and Auxana, law firm Wotton Kearney and advisory
    firm Forvis Mazars Capital Advisors announced selection of DealCloud with Celeste; Intapp says Ropes & Gray
    bought Celeste and DealCloud.'
  outcomes:
  - lever: experience
    description: Partners using AI for BD who rely only on general-purpose tools, and their satisfaction
    figure: 68%; satisfaction 6.7 out of 10
    measures: Share of surveyed partners already using AI for BD who rely only on general-purpose tools; mean satisfaction
      out of 10. Subgroup size not given
