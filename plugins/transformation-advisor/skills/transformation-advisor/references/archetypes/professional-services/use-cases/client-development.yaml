- id: professional-services-client-development-10
  title: Agentic origination and BD playbooks run by a 'Firm AI' product over relationship and intake data
  archetype: professional-services
  module: client-development
  function: sales-marketing-bd
  work_types:
  - coordination-scheduling
  - research-synthesis
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: Intapp argues that most legal AI speeds up the practice of law for the individual but not the business
    behind it; LawSites' editor says large-firm business workflows are often inefficient, partly because firm data
    is proprietary.
  solution: Intapp's Celeste, generally available from 2026-07-15, runs multi-step playbooks covering origination,
    business development, intake, conflicts, pricing, fundraising and lateral hiring, with a no-code builder so
    firms encode their own methods. Intapp says it can surface relevant matters, partner experience and prior pitch
    materials for an urgent client request in minutes rather than hours. Selections announced by law firms Practus
    and Wotton Kearney and by Forvis Mazars Capital Advisors (entry 07).
  outcomes:
  - lever: speed
    description: Time to respond to an urgent client request with matters, experience and pitch material
    figure: minutes rather than hours
    measures: Intapp's description; no sample, baseline or measurement is given
    provenance: vendor-published
    source_ref: LAWSITES-CELESTE-2026
  prerequisites:
  - Intapp systems of record for intake, conflicts and relationship data
  - Playbooks that encode the firm's own methods, defined by the firm
  - A decision on which steps an agent may take without review; an ILTACON 2026 panel suggested defining permissible,
    reversible use cases with an audit trail (TRI-AGENTIC-2026)
  risks_and_guardrails:
  - Intapp says the same ethical walls, need-to-know restrictions and audit requirements apply to Celeste and that
    firms can produce a record of every AI action (LAWSITES-CELESTE-2026); vendor statement
  - A lawyer must not deploy an agent that autonomously transmits client information externally without safeguards
    and human review (CALBAR-GENAI-2026, p. 6)
  - 'ILTACON panel ''two-way door'' test: an agent drafting a summary is reversible, an agent replying to a client
    without review is not (TRI-AGENTIC-2026)'
  - CMBDO panelists warned against assuming agents are smarter or more autonomous than they are (TRI-CMBDO-2026)
  human_checkpoints:
  - Review points inside BD playbooks are not described in the sources; firms define the playbooks the agent runs
  role_evolution: LawSites reports no role changes. Intapp's chief product officer described a conflicts team clearing
    ten times the matters as a new business model rather than saved time (LAWSITES-CELESTE-2026).
  evidence_grade: C
