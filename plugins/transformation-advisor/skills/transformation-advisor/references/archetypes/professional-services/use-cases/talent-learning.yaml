    - {ref: HIGHFLIERS-GM-2026, title: "The Graduate Market in 2026 (report page)", publisher: "High Fliers Research", type: survey, url: "https://highfliers.co.uk/publication-the-graduate-market-report", date: "2026-02-05", access: full, locator: "section 'An Unprecedented Drop in Graduate Jobs'"}
    - {ref: STANFORD-CANARIES-2026, title: "Canaries in the Coal Mine? Six Facts about the Recent Employment Effects of Artificial Intelligence", publisher: "Stanford Digital Economy Lab", type: academic, url: "https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine/", date: "2026-08-12", access: full, locator: "abstract (revised version)"}
    - {ref: VAULT-PYRAMID-2026, title: "The Compressed Pyramid: What AI Means for the Associate Career Ladder", publisher: "Vault", type: press, url: "https://legacy.vault.com/blogs/vaults-law-blog-legal-careers-and-industry-news/the-compressed-pyramid-what-ai-means-for-the-associate-career-ladder", date: "2026-08-11", access: full, locator: "sections 'The Numbers Behind the Shift' and 'How Firms Are Responding'"}
    - {ref: CONSULTANCYUK-PYRAMID-2026, title: "AI may up-end the consulting pyramid", publisher: "Consultancy.uk", type: press, url: "https://www.consultancy.uk/news/43210/ai-may-up-end-the-consulting-pyramid", date: "2026-02-19", access: full, locator: "sections 'The shape of things to come' and 'The graduate question'"}
    - {ref: TRI-CMBDO-2026, title: "Chief Marketing & Business Development Officer Forum 2026: Law firms need to play the long game on talent", publisher: "Thomson Reuters Institute", type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/cmbdo-forum-2026-long-game-on-talent", date: "2026-02-06", access: full, locator: "section on lateral integration"}
