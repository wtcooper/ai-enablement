  last_reviewed: "2026-10-19"
  notes: >-
    Merged from practice 10 and governance 17; Forrester routed from firm-finance. The only entry at the delegate rung:
    the evidence is firms' expectations and a CEO statement, not a described hybrid team at work, so it stays C and
    emerging. Law360 defines leverage as the ratio of equity partners to all other lawyers, which looks inverted against
    the usual definition. A secondary summary reports an AI-native UK consultancy targeting '20 per cent humans, 80 per
    cent AI agents' (RESULTSENSE-2026 in the landscape); not verified at source. Staffing mechanics belong to the
    staffing-resourcing area; this entry keeps the workforce-design and manager-skills angle.

- id: professional-services-talent-learning-21
  title: "Talent strategy of upskilling plus compressed-timeline exits where reskilling is not viable (Accenture)"
  archetype: professional-services
  module: talent-learning
  function: people-hr
  work_types: [coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    For some staff, reskilling is not a viable path to the skills the firm needs, and the CEO says strategy, structure
    and ways of measuring performance were not aligned (FORTUNE-ACCENTURE-2025).
  solution: >-
    Accenture (consulting and technology services) announced a six-month business optimisation programme with up to
    USD 865 million of related charges (including two divestitures) and a three-part talent strategy: invest in upskilling, exit people on a
    compressed timeline where reskilling is not a viable path for the skills needed, and drive operating efficiencies.
    Its CEO said savings above USD 1 billion are expected, to be reinvested, and that headcount is still expected to
    rise overall (FORTUNE-ACCENTURE-2025). AI and data staff nearly doubled to 77,000 in two years
    (CIODIVE-ACCENTURE-2025).
  outcomes:
    - lever: cost
      description: "Expected savings and related charges of the optimisation programme"
      figure: "USD 1bn+ savings; up to USD 865m charges"
      measures: "Expected values stated by the CEO, relayed by Fortune; not measured results"
      provenance: self-reported
      source_ref: FORTUNE-ACCENTURE-2025
  prerequisites:
    - "A view of which skills the firm needs and where reskilling is not viable (FORTUNE-ACCENTURE-2025)"
    - "Training capacity for the upskilling leg (CIODIVE-ACCENTURE-2025)"
  risks_and_guardrails:
    - "The CEO described emotional and strategic difficulty in the departures of senior team leaders and the restructuring (FORTUNE-ACCENTURE-2025)"
    - "Reviewer note: selection criteria for exits were not published"
  human_checkpoints:
    - "None stated in the sources"
  role_evolution: >-
    Employees are called 'reinventors', and leaders must build new skills to shape AI-enabled business strategy
    (FORTUNE-ACCENTURE-2025). The CEO told investors people who could not adapt would be 'exited', as reported by
    Decrypt (DECRYPT-ACCENTURE-2026).
  evidence_grade: B
  sources:
    - {ref: FORTUNE-ACCENTURE-2025, title: "Accenture's $865 million reinvention includes saying goodbye to people without the right AI skills", publisher: "Fortune", type: press, url: "https://www.fortune.com/2025/09/27/accenture-865-million-reinvention-exiting-people-ai-skills", date: "2025-09-27", access: full, locator: "paragraphs 1-2 and interview sections"}
    - {ref: CIODIVE-ACCENTURE-2025, title: "Accenture completes 'reinvention' as generative AI revenues roll in", publisher: "CIO Dive", type: press, url: "https://www.ciodive.com/news/accenture-generative-ai-revenue-skills-training-data-modernization/761161/", date: "2025-09-25", access: full, locator: "paragraph on AI and data professionals"}
    - {ref: DECRYPT-ACCENTURE-2026, title: "Accenture Is Tracking Whether Employees Use AI, and Promotions Are on the Line", publisher: "Decrypt", type: press, url: "https://decrypt.co/358616/accenture-tracking-employees-use-ai-promotions", date: "2026-02-19", access: full, locator: "paragraphs 5-6"}
  last_reviewed: "2026-10-19"
  notes: >-
    From practice 19. Figures are expected values from a company announcement; there are no outcome data on retraining
    success or exits. Search-summary figures on headcount changes are not used.

- id: professional-services-talent-learning-22
  title: "Support-function roles re-scoped as AI and hub operations take routine work (Clifford Chance, Baker McKenzie)"
  archetype: professional-services
  module: talent-learning
  function: people-hr
  work_types: [transaction-processing, document-production]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Finance, HR, IT, marketing and secretarial support teams carry routine work that AI and hub operations can take over
    (CITYAM-CC-2025; LEGALCHEEK-BAKERMCK-2026).
  solution: >-
    Clifford Chance (law firm) told London business-services staff that greater use of AI and reduced demand for some
    services meant jobs had to go, with work also done in hubs such as Poland and India (CITYAM-CC-2025). Baker
    McKenzie's (law firm) spokesperson said a review of its business professionals functions, rethinking how it works
    including through AI, means some roles will likely be phased out and others will evolve, subject to consultation
    (LEGALCHEEK-BAKERMCK-2026).
  outcomes:
    - lever: cost
      description: "Clifford Chance London business-services employees set to lose their jobs"
      figure: "about 10% of 550"
      measures: "Employees in the London business services team expected to be made redundant (Financial Times, relayed by City AM)"
      provenance: independent
      source_ref: CITYAM-CC-2025
  prerequisites:
    - "Consultation processes in the relevant jurisdictions (LEGALCHEEK-BAKERMCK-2026)"
    - "Hub capacity for work that moves rather than disappears (CITYAM-CC-2025)"
  risks_and_guardrails:
    - "Legal Cheek states Baker McKenzie's numbers ambiguously ('less than 10% - or roughly 600 positions') and the firm has not confirmed them (LEGALCHEEK-BAKERMCK-2026)"
    - "Employees were unhappy about the timing of the announcement before Christmas (CITYAM-CC-2025)"
    - "Cause is mixed: Clifford Chance cites AI and reduced demand; Baker McKenzie lists AI among several factors (CITYAM-CC-2025; LEGALCHEEK-BAKERMCK-2026)"
  human_checkpoints:
    - "Consultation processes in applicable jurisdictions before changes are final (LEGALCHEEK-BAKERMCK-2026)"
  role_evolution: >-
    Some support roles disappear and others evolve toward the roles that best serve clients (LEGALCHEEK-BAKERMCK-2026).
    Legal Cheek notes Freshfields and Irwin Mitchell have also announced paralegal layoffs (LEGALCHEEK-BAKERMCK-2026).
  evidence_grade: B
  sources:
    - {ref: CITYAM-CC-2025, title: "Clifford Chance AI-driven redundancies hit London business service roles", publisher: "City AM", type: press, url: "https://www.cityam.com/?p=2380354", date: "2025-11-21", access: full, locator: "paragraphs 1-4"}
    - {ref: LEGALCHEEK-BAKERMCK-2026, title: "Baker McKenzie to cut business services roles as AI use grows", publisher: "Legal Cheek", type: press, url: "https://www.legalcheek.com/2026/02/baker-mckenzie-to-cut-business-services-roles-as-ai-use-grows/", date: "2026-02-06", access: full, locator: "paragraphs 1-6"}
  last_reviewed: "2026-10-19"
  notes: >-
    From practice 20; the support-staff side of the pyramid. Press-reported; the firms did not publish counts.
    A&O Shearman's reported cuts appear only in search summaries and are excluded. This entry concerns roles and
    capacity, not headcount targets.

- id: professional-services-talent-learning-23
  title: "Idea: new junior operational roles (AI compliance, legal data analysis, knowledge curation) as an apprenticeship route"
  archetype: professional-services
  module: talent-learning
  function: people-hr
  work_types: [data-reporting, software-systems]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    If drafting and research are cheap, the junior's bottleneck-relieving work moves to operations, data and
    verification, and firms need a defined route into those tasks (TRI-AILAWPROF-JUNIOR-2026).
  solution: >-
    Idea from a TRI columnist: rotate first- and second-year lawyers through roles such as AI compliance specialist
    (usage policy, vendor claims, audit trails), legal data analyst (turning matter history into playbooks and outcome
    tags), knowledge operations curator (keeping clause libraries and precedent reliable) and a lawyer who prototypes
    workflows in software (TRI-AILAWPROF-JUNIOR-2026). A related suggestion is rotations through knowledge management,
    professional development and technology functions (TRI-LDEV-2026).
  outcomes:
    - lever: capacity
      description: "none published"
      figure: "none published"
      measures: "No firm reports running these rotations (A&O Shearman's innovation seats, use case 04, are the nearest)"
      provenance: self-reported
      source_ref: TRI-AILAWPROF-JUNIOR-2026
  prerequisites:
    - "Firm KM and data infrastructure that juniors can curate (TRI-AILAWPROF-JUNIOR-2026)"
    - "New metrics and compensation for junior performance (the columnist's call) (TRI-AILAWPROF-JUNIOR-2026)"
  risks_and_guardrails:
    - "The roles are described as transitional, a pathway rather than a destination (TRI-AILAWPROF-JUNIOR-2026)"
    - "A messy period is expected in which juniors are asked to double-check outputs without being taught how (TRI-AILAWPROF-JUNIOR-2026)"
  human_checkpoints:
    - "Supervised progression to strategic roles (TRI-AILAWPROF-JUNIOR-2026)"
  role_evolution: >-
    The junior becomes 'a hybrid of lawyer, analyst, builder, and quality controller' (TRI-AILAWPROF-JUNIOR-2026). ILTA
    reports firms anticipating added headcount in training, KM and data science (ILTA-TECHSURVEY-2026).
  evidence_grade: D
  sources:
    - {ref: TRI-AILAWPROF-JUNIOR-2026, title: "The AI Law Professor: When AI forces us to rethink how we train junior lawyers", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/ai-law-professor-train-junior-lawyers", date: "2026-02-02", access: full, locator: "section 'The AI-accelerated apprenticeship'"}
    - {ref: TRI-LDEV-2026, title: "Rethinking lawyer development in future AI-enabled law firms", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/lawyer-development-ai-enabled-law-firms", date: "2026-04-16", access: full, locator: "section 'Aligning the talent model to the future business model'"}
    - {ref: ILTA-TECHSURVEY-2026, title: "ILTA Technology Survey 2026 Executive Summary", publisher: "International Legal Technology Association", type: survey, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "p.5"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea (grade D), from discourse 10: a columnist's prediction, with no firm named as running these rotations.

- id: professional-services-talent-learning-24
  title: "Idea: milestone-based progression, deliberate-mistake exercises and performance measures beyond billable hours"
  archetype: professional-services
  module: talent-learning
  function: people-hr
  work_types: [expert-judgment, data-reporting]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Time-served progression assumed judgment would emerge from repetition; if the repetition goes, firms need another way
    to develop and certify readiness (TRI-TAAP2030-2026; TRI-DESIGNL-2026). Junior work 'has always served two purposes:
    billing and training', so removing billable junior tasks removes both the fee and the training vehicle
    (VAULT-PYRAMID-2026).
  solution: >-
    Idea discussed by practitioners and academics. A consultant proposes progression built on milestones (what the
    person must know and do, who teaches it, how often they practise, what evidence shows readiness), with early-career
    staff starting nearer where today's seniors begin and learning through deliberate exposure: returns with buried
    issues, plausible-but-wrong AI recommendations, and client meetings followed by debriefs (TRI-TAAP2030-2026). A LexisNexis survey found law-firm leaders
    rank revenue growth (55%) and client feedback (49%) above billable hours (38%) as success measures, while associates
    rank billable hours and client feedback equally (54% each) (LEXIS-MENTORPR-2026).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "No firm reports a milestone-based model, a change to training funding or new performance metrics with outcome data"
      provenance: self-reported
      source_ref: TRI-TAAP2030-2026
  prerequisites:
    - "Competency definitions per role and level, and feedback loops that turn experience into judgment (TRI-TAAP2030-2026)"
    - "Managers who can teach and give specific, timely feedback rather than only review (CPAPA-STOP-2026)"
    - "Firm economics that can absorb non-billable development time"
  risks_and_guardrails:
    - "A profession built around getting things right is uncomfortable with deliberate mistakes, so learning needs safe, controlled settings, not live client work (TRI-TAAP2030-2026)"
    - "Hourly billing must reflect time actually spent, and general AI subscriptions are overhead (CALBAR-GENAI-2026, p.8)"
    - "A lawyer billing hourly may not charge for time saved by AI (TXBAR-OP705-2025, quoting D.C. Opinion 388)"
    - "The AICPA's 'Profession Ready' research on early-career roles is not expected to report until 2027 (JOA-TRAINING-2026)"
  human_checkpoints:
    - "Debrief questions after meetings and simulations ask what the person noticed, missed and would do differently (TRI-TAAP2030-2026)"
    - "Partner and talent-committee approval of new metrics"
  role_evolution: >-
    Entry-level staff start closer to senior-level work (TRI-TAAP2030-2026); Withum reports pushing tasks down from
    seniors to juniors (JOA-TRAINING-2026). Seyfarth's chair and managing partner, writing for TRI, argues leaders must
    become systems design architects, because beliefs about how repetitive work builds judgment are 'largely
    inferential' (TRI-DESIGNL-2026).
  evidence_grade: D
  sources:
    - {ref: TRI-TAAP2030-2026, title: "The tax, accounting & audit firm of 2030: Building the people of tomorrow's tax firm", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/tax-audit-accounting-firm-of-2030-building-people-for-tomorrow", date: "2026-10-16", access: full, locator: "sections 'Start training through experience' and 'The first 2 years need to look completely different'"}
    - {ref: TRI-DESIGNL-2026, title: "Designing lawyers: Attorney growth in the age of AI-fueled practice", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/designing-lawyers-professional-growth", date: "2026-05-11", access: full, locator: "sections 'A new model for learning' and 'Leadership in an AI age'"}
    - {ref: VAULT-PYRAMID-2026, title: "The Compressed Pyramid: What AI Means for the Associate Career Ladder", publisher: "Vault", type: press, url: "https://legacy.vault.com/blogs/vaults-law-blog-legal-careers-and-industry-news/the-compressed-pyramid-what-ai-means-for-the-associate-career-ladder", date: "2026-08-11", access: full, locator: "section 'Why This Is a Training Problem'"}
    - {ref: LEXIS-MENTORPR-2026, title: "AI Is Speeding Up Junior Lawyers' Work but Raising Questions About How Judgment Is Learned (press release on The mentorship gap report)", publisher: "LexisNexis Legal & Professional", type: survey, url: "https://www.lexisnexis.com/community/amp-pressroom/ai-is-speeding-up-junior-lawyers-work-but-raising-questions-about-how-judgment-is-learned", date: "2026-02-02", access: full, locator: "paragraph on how success is measured"}
    - {ref: CPAPA-STOP-2026, title: "Stop Training CPAs for Yesterday's Work", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/09/02/stop-training-cpas-for-yesterdays-work/189548/", date: "2026-09-02", access: full, locator: "paragraphs 3-7"}
    - {ref: JOA-TRAINING-2026, title: "How will accountants learn new skills when AI does the work?", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/mar/how-will-accountants-learn-new-skills-when-ai-does-the-work/", date: "2026-03-01", access: full, locator: "sections 'From memorization to conceptual mastery' and 'Upskilling at scale inside firms'"}
    - {ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, COPRAC", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p.8, Charging for Work Produced by Generative AI"}
    - {ref: TXBAR-OP705-2025, title: "Opinion 705: lawyer's use of generative artificial intelligence", publisher: "Professional Ethics Committee for the State Bar of Texas", type: professional-body, url: "https://www.legalethicstexas.com/resources/opinions/opinion-705/", date: "2025-02", access: full, locator: "section 'Fees'"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea (grade D). Merged from practice 25, discourse 07 and governance 14. The milestone model is attributed to Dr
    Rachel Anevski of Matters of Management in a consultant's column; no firm has published a milestone-based model or a
    change to performance metrics with data. The LexisNexis percentages are vendor-published survey results kept as
    context. LEXIS-MENTORPR-2026 is the press release; LEXIS-MENTORSHIP-2026 is the report page.

- id: professional-services-talent-learning-25
  title: "Idea: residency-style supervised practice and a funded profession-wide formation system"
  archetype: professional-services
  module: talent-learning
  function: people-hr
  work_types: [expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Law schools teach how to think and firms teach how to practise, but AI reduces the availability of traditional first
    jobs, and the profession has no agreed definition of legal judgment or standards for AI use in training
    (TRI-HONING-2026).
  solution: >-
    Idea: a Thomson Reuters Institute white paper proposes work-based learning modelled on medical residencies (building
    on an earlier Brookings Institution proposal), decomposing legal judgment into teachable micro-skills and using AI as
    a thinking partner throughout, with funding possibly from a small percentage of legal services revenue. Existing
    models cited are Northeastern Law's near-year of guaranteed work experience and UNH Franklin Pierce's Daniel Webster
    Scholar programme (TRI-HONING-2026).
  outcomes:
    - lever: experience
      description: "none published"
      figure: "none published"
      measures: "Proposal only; no deployment"
      provenance: self-reported
      source_ref: TRI-HONING-2026
  prerequisites:
    - "Coordination among law schools, legal employers and state supreme courts as regulators (TRI-HONING-2026)"
    - "A funding mechanism (TRI-HONING-2026)"
  risks_and_guardrails:
    - "Implementation needs unprecedented coordination and funding (TRI-HONING-2026)"
  human_checkpoints:
    - "Supervised postgraduate practice as part of licensure (proposed) (TRI-HONING-2026)"
  role_evolution: >-
    Juniors would be formed through structured supervised practice rather than billable repetition (TRI-HONING-2026).
  evidence_grade: D
  sources:
    - {ref: TRI-HONING-2026, title: "Honing legal judgment: The AI era requires changes to how lawyers are trained during and after law school", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/honing-legal-judgment-training-lawyers", date: "2026-04-02", access: full, locator: "opening paragraph; Pillar 1"}
  last_reviewed: "2026-10-19"
  notes: >-
    Idea (grade D), from discourse 20. Partly a regulatory and legal-education proposal; no firm or regulator has
    adopted it.
