  notes: >-
    Merged from practice 08 (B) and 09 (C), discourse 15 (B), 16 (C) and 17 (C), and governance 08 (C), 09 (B) and 10
    (C). Graded B: named firms and independent hiring datasets, but no measure isolates AI as the cause. Ladder is set to
    automate because the premise is AI taking over entry-level tasks; no AI tool makes the intake decision. City AM's
    headline range ('as much as 29 per cent') does not match its own KPMG figures, which imply about a third. McKinsey's
    12% is North American workforce growth, not graduates. The SurePoint and BCG Attorney Search originals were not
    opened. An anonymous estimate that UK graduate recruitment would fall by about half is secondary and excluded.

- id: professional-services-talent-learning-20
  title: "Leverage and workforce model redesigned for hybrid human-and-agent teams (pyramid to diamond or pod)"
  archetype: professional-services
  module: talent-learning
  function: strategy-planning
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: delegate
  change_scope: model
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    The pyramid model uses many junior hours to produce work that partners review; AI compresses the junior layer and
    clients are reluctant to pay for tasks done by junior associates (TRI-LDEV-2026). Resource managers are being asked
    to staff teams that mix experts and AI agents without outcome data or playbooks (KANTATA-RMI-2026).
  solution: >-
    Firms are beginning to plan for changed leverage and for agents doing part of the work. The Citi/Hildebrandt report
    found a quarter of law firms expect leverage changes by 2027 and 63% by 2035 (LAW360-CITI-2025). In a General
    Assembly survey of 258 leaders of consulting, accounting and legal firms, 74% of law firms plan flat headcount using
    AI for efficiency and 14% expect to move to a model where AI agents do most work (LAW360-GA-2026). McKinsey's chief
    executive has said it has 20,000 agents working alongside 40,000 staff (GUARDIAN-MCKINSEY-2026). A Forrester analyst
    notes diamond-shaped and pod-like structures proposed in place of the pyramid (FORRESTER-BLOG-2025). The Resource
    Management Institute study for Kantata calls for playbooks, skills enablement and workflow changes before hybrid
    staffing is routine (KANTATA-RMI-2026).
  outcomes:
    - lever: cost
      description: "Share of large law firms expecting AI to affect professional staffing models in the next two years doubled year on year"
      figure: "36%"
      measures: "Large firms expecting AI to affect their professional staffing models within two years (Citi/Hildebrandt report, as summarised by Law360 Pulse)"
      provenance: independent
      source_ref: LAW360-CITI-2025
    - lever: capacity
      description: "Law firms planning flat headcount with AI efficiency, a model where agents do most work, or more hiring"
      figure: "74%; 14%; 6%"
      measures: "Law-firm respondents in a Feb 2026 General Assembly survey of 258 UK and US firm leaders; the base for 14% and 6% is not restated and the law-firm subset size is not stated"
      provenance: vendor-published
      source_ref: LAW360-GA-2026
    - lever: capacity
      description: "Readiness of resource managers to manage hybrid human-and-agent teams; use of outcome data in staffing"
      figure: "52.7% not equipped; 28.4% slightly; 4% well equipped; 7.3% routinely use outcome data"
      measures: "Respondents to the RMI study commissioned by Kantata (44 organisations across several industries)"
      provenance: vendor-published
      source_ref: KANTATA-RMI-2026
  prerequisites:
    - "Agreement on a business model (billable, value-based or other scenarios) before the talent model can be set (TRI-LDEV-2026)"
    - "Skills and outcomes data in one place, and playbooks for team composition (KANTATA-RMI-2026)"
  risks_and_guardrails:
    - "Designing a talent model for an unknown business model is difficult; timing is the unknown (TRI-LDEV-2026)"
    - "A veteran ILTA respondent noted earlier 'transformative' innovations produced minimal change (ILTA-TECHSURVEY-2026)"
    - "Forrester says consultancies still need a talent pipeline to develop the next generation of expertise (FORRESTER-BLOG-2025)"
    - "AI-assisted staffing and task-allocation decisions fall under EU high-risk employment rules from 2 December 2027 (EC-AIACT-2026)"
    - "General Assembly is an AI training provider with a commercial interest; Kantata sells PSA software (LAW360-GA-2026; KANTATA-RMI-2026)"
  human_checkpoints:
    - "Partners and management committees decide structure"
    - "Resource managers approve team composition (KANTATA-RMI-2026)"
  role_evolution: >-
    Firms will likely add data scientists and technologists (a Major Lindsey & Africa executive), and product managers,
    pricing experts, project managers and AI governance practitioners are named as increasingly prominent
    (LAW360-CITI-2025). General Assembly's head of professional services argues mid-level professionals should become
    'workflow engineers' (LAW360-GA-2026). 72% of RMI respondents say resource management is primarily operational today,
    and the study frames a shift toward strategic team composition (KANTATA-RMI-2026). TRI cites a survey in which 64% of
    IT leaders expect HR and IT to merge within five years (TRI-HUMANAGENT-2025).
  evidence_grade: C
  sources:
    - {ref: LAW360-CITI-2025, title: "Law Firms' Junior Roles At Risk From AI, Report Says", publisher: "Law360 Pulse", type: press, url: "https://www.law360.com/articles/2422148/law-firms-junior-roles-at-risk-from-ai-report-says", date: "2025-12-15", access: full, locator: "paragraphs 4-8"}
    - {ref: LAW360-GA-2026, title: "AI Set To Transform Junior Lawyer Roles, Survey Finds", publisher: "Law360 UK", type: press, url: "https://www.law360.com/articles/2456965/ai-set-to-transform-junior-lawyer-roles-survey-finds", date: "2026-03-24", access: full, locator: "paragraphs 1-12"}
    - {ref: GUARDIAN-MCKINSEY-2026, title: "McKinsey asks graduates to use AI chatbot in recruitment process", publisher: "The Guardian", type: press, url: "https://www.theguardian.com/business/2026/jan/14/mckinsey-graduates-ai-chatbot-recruitment-consultancy", date: "2026-01-14", access: full, locator: "paragraph on agents and staff"}
    - {ref: FORRESTER-BLOG-2025, title: "The Future Of AI Consulting Services Is Disruptively Bright", publisher: "Forrester", type: press, url: "https://www.forrester.com/blogs/the-future-of-ai-consulting-services-is-disruptively-bright", date: "2025-09-15", access: full, locator: "fourth position, 'Rethink their hiring, development, and organizational models'"}
    - {ref: KANTATA-RMI-2026, title: "New Study Finds Resource Management at a Strategic Crossroads as AI and Outcome-Based Delivery Reshape Professional Services", publisher: "Kantata (study by the Resource Management Institute)", type: survey, url: "https://www.kantata.com/blog/article/new-study-finds-resource-management-at-a-strategic-crossroads-as-ai-and-outcome-based-delivery-reshape-professional-services", date: "2026-04-09", access: full, locator: "body of the release"}
    - {ref: TRI-LDEV-2026, title: "Rethinking lawyer development in future AI-enabled law firms", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/lawyer-development-ai-enabled-law-firms", date: "2026-04-16", access: full, locator: "sections 'Planning around 3 law firm business models' and 'Aligning the talent model'"}
    - {ref: TRI-HUMANAGENT-2025, title: "How companies are fostering the creation of human & AI agent teams", publisher: "Thomson Reuters Institute", type: press, url: "https://www.thomsonreuters.com/en/institute/articles/creating-human-ai-agent-teams", date: "2025-10-22", access: full, locator: "whole article"}
    - {ref: ILTA-TECHSURVEY-2026, title: "ILTA Technology Survey 2026 Executive Summary", publisher: "International Legal Technology Association", type: survey, url: "https://higherlogicdownload.s3.amazonaws.com/ILTANET/ce7f3e74-fb70-402e-a1b3-5dc0abe72260/UploadedImages/Misc%20PDFs/2606_ILTA_Executive_Summary_FINAL__1_.pdf", date: "2026-06", access: full, locator: "section 'The Curtain Rises on Enterprise-Scale Adoption'"}
