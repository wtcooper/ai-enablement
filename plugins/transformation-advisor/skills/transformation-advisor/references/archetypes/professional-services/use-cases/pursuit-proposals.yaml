  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: law (GRSM, Stinson, Gowling WLG), IT consulting and systems integration (Neudesic), engineering design
    (Arup). None of the ikaun case-study pages shows a publication date; 2026 is the access year (GRSM's go-live was
    November 2025). The GRSM headline says 50% in four months while the quote says over 50% in the first quarter after
    go-live. Gowling WLG has no outcome figures and is context only (IKAUN-GOWLING-2026). Ladder 'automate' describes template assembly from
    structured data; tailoring stays with people. Experience location as a knowledge asset is
    professional-services-knowledge-management-04. Merged from practice-03 and governance-17.

- id: professional-services-pursuit-proposals-04
  title: Lawyer bios regenerated from time records, the knowledge system and public sites as the credential feed for pitches
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Baker Botts's COO searched the web for the best lawyers in Houston and found the firm listed alongside attorneys
    who had retired from it more than five years earlier. Generic bios also did not surface well in search.
  solution: >-
    Law firm Baker Botts's data science team built a tool, using secure and vetted AI tools, that draws on lawyer time
    sheets, the Foundation knowledge management platform and public websites to build a fuller picture of what each
    lawyer actually does. The team set guardrails and asked the tool to optimise the output for answer engines (AI
    search tools that answer questions directly).
  outcomes:
    - lever: quality
      description: >-
        The speaker said the firm went from 'really generic bios' to bios more likely to be picked up through answer
        engine optimisation. No measurement of search visibility is reported.
      figure: "none published"
      measures: "Qualitative statement by Baker Botts's associate director for competitive intelligence at a conference panel"
      provenance: self-reported
      source_ref: TRI-INSIDELEGALAI-2025
  prerequisites:
    - "Time-sheet data, a knowledge management platform and a current lawyer roster (TRI-INSIDELEGALAI-2025)"
    - "Guardrails agreed with the firm; the article does not detail them (TRI-INSIDELEGALAI-2025)"
  risks_and_guardrails:
    - "Compiled bios must not pull out-of-date information, and awards and success stories must be verified (ABA-LPMAI-2026, Cautions)"
    - "Who approves a generated bio is not stated in the source"
  human_checkpoints:
    - "Not described in the source; ask who signs off a regenerated bio before it feeds the website and pitches"
  role_evolution: "The article does not describe role changes (TRI-INSIDELEGALAI-2025)."
  evidence_grade: B
  sources:
    - { ref: TRI-INSIDELEGALAI-2025, title: "Beyond legal practice: How GenAI is transforming law firm business operations", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en-us/posts/technology/inside-legal-ai-genai-transformation/", date: "2025-12-15", access: full, locator: "Use case 4: Website bio generation" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "Cautions" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law (Baker Botts), reported from a conference panel. The bio system serves the website and AI-search
    visibility (a client-development concern; see professional-services-client-development-12 for AI claims in
    marketing) and is also the credential feed for pitches. From discourse-04.

- id: professional-services-pursuit-proposals-05
  title: Reconcile duplicate and stale people and project records before AI retrieval for proposals
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [data-reporting, research-synthesis]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    The same person, project or client appears under different names and dates across resumes, case studies and
    qualification forms, so a retrieval tool returns stale or duplicate records, such as the resume of someone who has
    left. In US federal architect-engineer qualification forms (SF-330), one invented project citation can mean
    disqualification, per the vendor.
  solution: >-
    Before retrieval, the tool extracts roles, timelines and costs from each document, matches records that describe the
    same person, project or client (exact match, then similarity search, then a second AI pass that gives a verdict and
    a confidence score) and checks against systems of record. Thresholds differ for people, projects and clients. Staff
    can merge, split or correct any record, and a detail a person has verified is not overwritten.
  outcomes:
    - lever: risk
      description: >-
        The vendor says one large contractor group used its platform on a bid already disqualified and it caught a
        disqualifying issue the team had missed; the customer is not named and no count is given.
      figure: "none published"
      measures: "A single unnamed-customer anecdote told by the vendor"
      provenance: vendor-published
      source_ref: KANTIV-TRUST-2026
    - lever: quality
      description: Confidence in the data feeding AI tools at AEC (architecture, engineering and construction) firms
      figure: "29% have high confidence"
      measures: "Share of surveyed AEC firms reporting high confidence in the data underneath their AI tools; sample size not stated"
      provenance: vendor-published
      source_ref: BDC-UNANET-2026
  prerequisites:
    - "Access to proposals, resumes, case studies and systems of record (the vendor names Deltek, Vantagepoint, Unanet and a CRM) (KANTIV-TRUST-2026)"
    - "Named owners who resolve disputed records (KANTIV-TRUST-2026)"
  risks_and_guardrails:
    - "The vendor says every large-language-model system can hallucinate and positions its tool as 'a first-draft accelerator, not a final-product generator' (KANTIV-TRUST-2026)"
    - "Wrongly merging two people is treated as worse than leaving two records apart, which is why thresholds differ by record type (KANTIV-TRUST-2026)"
    - "74% of surveyed law firms have no single current source of truth for matter experience (IKAUN-BENCH-2026)"
  human_checkpoints:
    - "Staff review and correct merges and splits; verified details are locked (KANTIV-TRUST-2026)"
    - "A person reviews every draft before it goes out (KANTIV-TRUST-2026)"
  role_evolution: >-
    The source implies pursuit staff move from searching for records to correcting them; it describes no role changes
    (KANTIV-TRUST-2026).
  evidence_grade: C
  sources:
    - { ref: KANTIV-TRUST-2026, title: "What's Under the Slab: How AI Trust Actually Gets Built in AEC", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/ai-trust-ai-proposal-software-for-aec", date: "2026-07-21", access: full, locator: "sections on hallucination and reconciliation" }
    - { ref: BDC-UNANET-2026, title: "AEC report reveals firms are in the throes of AI transition (Unanet, on the 2026 AEC Inspire Report)", publisher: Building Design + Construction, type: survey, url: "https://www.bdcnetwork.com/aec-tech/news/55386606/aec-report-reveals-firms-are-in-the-throes-of-ai-transition", date: "2026-06-25", access: full, locator: "data confidence paragraph" }
    - { ref: IKAUN-BENCH-2026, title: "ikaun Releases The State of Winning Work in Law Firms: A 2026 Benchmark Report", publisher: ikaun, type: survey, url: "https://www.ikaun.com/news/ikaun-releases-the-state-of-winning-work-in-law-firms-a-2026-benchmark-report", date: "2026-07-14", access: full, locator: "paragraph 4" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: AEC firms, through a vendor blog with unnamed customers (for example a CIO at a large architecture and
    engineering firm complaining that AI picks resumes of people who no longer work there). Maturity 'announced'
    because no customer is named. Document-repository de-duplication in general is
    professional-services-knowledge-management-07. From discourse-02.

- id: professional-services-pursuit-proposals-06
  title: RFP requirement extraction, compliance matrix and red-flag review of the solicitation
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Long RFPs bury mandatory requirements, deadlines and attachments (insurance, diversity metrics, security terms).
    Misses cost disqualification, compliance checking is done late and by hand, and teams can spend weeks on a proposal
    before learning that the requirements favour an incumbent.
  solution: >-
    The tool reads the solicitation, lists every requirement, deadline and mandatory clause in a matrix (a compliance
    matrix), and later checks the drafted response against it. Engineering firm Benesch says first drafts can be
    checked for compliance against RFP requirements. In a US government-contracting workshop, an agent also flags
    requirements tied to one vendor's tools or certifications, unusually specific key-personnel terms, tight response
    windows and heavy emphasis on transition risk, cites the page for each flag and drafts clarification questions.
  outcomes:
    - lever: quality
      description: "none published; Benesch describes the capability and gives no figure"
      figure: "none published"
      measures: "Qualitative statement from Benesch's marketing communications manager in the vendor case study"
      provenance: vendor-published
      source_ref: KANTIV-BENESCH-2026
  prerequisites:
    - "Digitised solicitation documents and a defined review step after extraction (ABA-LPMAI-2026, item 1)"
    - "Handling rules checked first: some solicitation material restricts where it may be stored, so check the tool's terms and the solicitation's rules before upload (BIDLAB-2026, FAQ)"
  risks_and_guardrails:
    - "UK guidance suggests buyers set controls so bidders do not use confidential tender documents as AI training data (PPN-017-2025, para 9)"
    - "Extraction can miss or misread clauses; check every word of the response (ABA-LPMAI-2026, Cautions)"
    - "A red flag is a reason to investigate, not proof that an award is predetermined (G2X-CAPTURE-2026)"
  human_checkpoints:
    - "Human validation of AI output for compliance, legal and factual accuracy before submission (RANDSTAD-PROPOSALMGR-2026)"
    - "The capture or bid team investigates each flag and decides whether to pursue (G2X-CAPTURE-2026)"
  role_evolution: >-
    A posting titles the role 'Proposal Manager (RFX and AI Orchestration)', combining drafting with AI tools and
    validation of the output; the employer is not named (RANDSTAD-PROPOSALMGR-2026). The ABA column describes bid
    coordinators spending less time on manual review of the pack (ABA-LPMAI-2026, item 1).
  evidence_grade: B
  sources:
    - { ref: KANTIV-BENESCH-2026, title: "Benesch's Pursuit AI Evolution: Smarter Search, Faster Content and Greater Efficiency", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/case-study/beneschs-ai-evolution-smarter-search-faster-content-and-greater-efficiency", date: "2026-06", access: full, locator: "The Result, Expedited Deliverable Production" }
    - { ref: RANDSTAD-PROPOSALMGR-2026, title: "Proposal Manager (RFX and AI Orchestration), Brentford", publisher: Randstad, type: job-posting, url: "https://www.randstad.com/jobs/proposal-manager_brentford_47525616/", date: "2026-09-30", access: full, locator: "responsibilities list" }
    - { ref: G2X-CAPTURE-2026, title: "Capture Agent Build-Along: Is This RFP Wired?", publisher: "G2X and ProposalTeam Partners (Luma event page)", type: conference, url: "https://luma.com/xcwn65gt", date: "2026-10-07", access: full, locator: "What you'll build" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 1; Cautions" }
    - { ref: AUTOGENAI-BIG4-2025, title: "How the Fastest Growing Big 4 Professional Services Firm Optimised Competitive Tendering with AutogenAI (unnamed firm)", publisher: AutogenAI, type: vendor, url: "https://autogenai.com/wp-content/uploads/2025/07/Professional-Services-Firm-Case-Study.pdf", date: "2025-07", access: full, locator: "p.2" }
    - { ref: BIDLAB-2026, title: "Using AI RFP Solutions: Dos and Don'ts (AI and RFPs: Disclosure Rules, Risk and What You Certify)", publisher: The Bid Lab, type: vendor, url: "https://thebidlab.com/learning-center/using-ai-rfp-solutions-dos-and-donts/", date: "2026-08", access: full, locator: "FAQ on uploading a solicitation" }
    - { ref: PPN-017-2025, title: "Procurement Policy Note 017: Improving transparency of AI use in procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/67af7ba0e270ceae39f9e279/PPN_017_Improving_transparency_of_AI_use_in_procurement.pdf", date: "2025-02-17", access: full, locator: "para 9" }
    - { ref: IKAUN-STINSON-2026, title: "Winning More Time for Strategy: How Stinson is Transforming RFP and Proposal Responses with ikaun (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/winning-more-time-for-strategy-how-stinson-is-transforming-rfp-and-proposal-responses-with-ikaun", date: "2026", access: full, locator: "Results (next steps)" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: engineering (Benesch); an unnamed Big 4 senior bid writer, quoted by AutogenAI, credits an extraction
    tool with time savings on a security-service proposal (AUTOGENAI-BIG4-2025; vendor quote, unnamed firm); law-firm marketing column
    (ABA). Grade B rests on one named firm describing a capability with no measure. The red-flag agent comes from a
    vendor-led US government-contracting workshop held 2026-10-07 (adjacent); no results were published. Stinson says it
    is preparing to adopt agentic capabilities for compliance validation and scoring, not yet in use (IKAUN-STINSON-2026). Merged from
    practice-04, discourse-06 and governance-11.

- id: professional-services-pursuit-proposals-07
  title: Go/no-go qualification informed by experience data and the firm's own win and loss history
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [expert-judgment, data-reporting]
  pattern: document-to-decision
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Teams answer more RFPs with less selectivity. In Loopio's survey go/no-go use (the formal decision whether to bid)
    is at its lowest since 2021 while submissions rise; in Unanet's AEC survey 92% have some go/no-go process but 47%
    follow a formal one (LOOPIO-TRENDS-2026; BDC-UNANET-2026). Decisions run on impressions, and firms cannot quickly tell whether they have done similar work.
  solution: >-
    Experience data tied to financial records lets the team see at once whether the firm has handled similar matters
    before deciding to pursue (law firm Stinson). Practitioners and vendors also describe scoring 30 to 40 past pursuits
    against the firm's criteria with an AI assistant, comparing average scores for wins and losses, and reweighting the
    criteria; an ABA column describes a predictive version comparing a new RFP with past performance, client history
    and resource availability.
  outcomes:
    - lever: quality
      description: "Stinson says its team can make faster, more data-driven go/no-go decisions because experience data is visible; no figure"
      figure: "none published"
      measures: "Qualitative statement in the vendor case study"
      provenance: vendor-published
      source_ref: IKAUN-STINSON-2026
    - lever: risk
      description: Go/no-go use and selectivity across bid teams (all industries)
      figure: "75% use a go/no-go process (81% of top performers); 55% of RFPs received were responded to"
      measures: >-
        Share of 1,533 respondents using a go/no-go process; top performers win more than 50% of RFPs they answer; 55%
        is the share of RFPs responded to in 2025
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: quality
      description: Leaders were more likely than Novices to use AI for go/no-go decisions; a usage difference, not a result
      figure: "37% vs 26%"
      measures: "Share of 'Leaders' (over 25% year-on-year revenue growth) vs 'Novices' using AI for go/no-go; 726 respondents across industries"
      provenance: vendor-published
      source_ref: RESPONSIVE-SRM-2025
  prerequisites:
    - "Matter or project experience linked to finance data (IKAUN-STINSON-2026)"
    - "Records of 30 to 40 formally pursued opportunities from the last two or three years, including losses, scored on what was known at decision time (KANTIV-GONOGO-2026, vendor method)"
    - "A view of delivery capacity: 55% of firms in a Dayshape survey miss, delay or turn down work for capacity reasons (DAYSHAPE-ONREC-2026)"
  risks_and_guardrails:
    - "Incomplete or inaccurate bid history can skew win probabilities, and past wins may favour low-profit work (ABA-LPMAI-2026, Cautions)"
    - "Thirty pursuits give a firmer starting point, not scientific certainty; hindsight can inflate the scores of winning pursuits (KANTIV-GONOGO-2026)"
    - "No source tests AI-supported go/no-go against outcomes (LOOPIO-TRENDS-2026, Ch.1 pp.17-20)"
  human_checkpoints:
    - "Leadership decides whether to bid; the ABA column's illustration is whether an 8% chance of winning justifies $35,000 of partner time (ABA-LPMAI-2026, item 4)"
    - "People sanity-check the AI's scoring and own the judgement calls (KANTIV-GONOGO-2026)"
  role_evolution: >-
    Top-performing teams are more likely to be seen as strategic contributors to deal strategy (60% against 47% of the
    average) and to run a go/no-go matrix (LOOPIO-TRENDS-2026, Ch.7 pp.83-84).
  evidence_grade: B
  sources:
    - { ref: IKAUN-STINSON-2026, title: "Winning More Time for Strategy: How Stinson is Transforming RFP and Proposal Responses with ikaun (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/winning-more-time-for-strategy-how-stinson-is-transforming-rfp-and-proposal-responses-with-ikaun", date: "2026", access: full, locator: "Results; Top 3 Results" }
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Ch.1 pp.17-20; Ch.7 pp.83-84" }
    - { ref: RESPONSIVE-SRM-2025, title: "B2B Revenue Leaders Are Winning Big With AI, And They're Hiring, Not Downsizing (release for the 2025 State of Strategic Response Management Report)", publisher: "Responsive with APMP (via Silicon UK)", type: survey, url: "https://www.silicon.co.uk/press-release/b2b-revenue-leaders-are-winning-big-with-ai-and-theyre-hiring-not-downsizing", date: "2025-05-08", access: full, locator: "Key findings, third item" }
    - { ref: BDC-UNANET-2026, title: "AEC report reveals firms are in the throes of AI transition (Unanet, on the 2026 AEC Inspire Report)", publisher: Building Design + Construction, type: survey, url: "https://www.bdcnetwork.com/aec-tech/news/55386606/aec-report-reveals-firms-are-in-the-throes-of-ai-transition", date: "2026-06-25", access: full, locator: "highlights list" }
    - { ref: KANTIV-GONOGO-2026, title: "How to calibrate your go/no-go matrix using your own wins and losses", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/blog-go-no-go-scorecard-matrix", date: "2026-10-15", access: full, locator: "weighting section" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 4 (Bid/No-Bid Predictive Analysis); Cautions" }
    - { ref: DAYSHAPE-ONREC-2026, title: "Professional services firms lose work as capacity planning falls behind demand (Onrec summary of Dayshape's survey of 400 senior leaders, UK and US)", publisher: Onrec, type: press, url: "https://www.onrec.com/node/129428", date: "2026-10-13", access: full, locator: "Key figures panel" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: law (Stinson, ABA), AEC (Unanet), cross-industry surveys (Loopio, Responsive). Stinson is in
    production on experience search; predictive bid/no-bid scoring is described only by the ABA column and a vendor
    blog, so that part is an idea. The Kantiv win/loss table is a hypothetical example and is not used. The Dayshape
    figure is vendor-published and was routed from staffing-resourcing. Merged from practice-05, discourse-07 and
    governance-05.

- id: professional-services-pursuit-proposals-08
  title: Pitch research brief on the client's needs, history and competing firms
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [research-synthesis, client-interaction]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Preparing to talk to a client or prospect took hours of gathering documents and data. Teams rarely know which firms
    handle a client's major matters or whether the client rewards low cost or premium expertise, so positioning is
    guesswork.
  solution: >-
    Law firm Baker Botts's data science team built a tool in Google's environment using Gemini that combines public
    information, financial data and proprietary firm information into background on a client and a low, medium or high
    score for the client's or prospect's anticipated legal needs in a practice area; business developers and lawyers
    run it themselves. An ABA column and governance sources describe extending such briefs to which firms handle the
    client's significant matters and how the client has rewarded work.
  outcomes:
    - lever: speed
      description: >-
        Baker Botts's associate director for competitive intelligence said the preparation work previously took 24
        hours of research and the team's first task was to cut that by more than half; users get a readout with a score
        after about two minutes of querying.
      figure: "24 hours of research cut by more than half; readout in about 2 minutes"
      measures: "Hours of research to prepare, as recalled at a conference panel; the article does not say how the later figure was measured"
      provenance: self-reported
      source_ref: TRI-INSIDELEGALAI-2025
    - lever: capacity
      description: Partners using AI for business development mostly use general tools that cannot see firm relationship data
      figure: "68% rely only on general-purpose tools; 78% of all partners say relationship data is hard to act on"
      measures: "68%: share of partners using AI for BD; 78%: share of all 123 surveyed partners (42 legal, 42 accounting, 39 other)"
      provenance: vendor-published
      source_ref: INTROHIVE-LAWSITES-2026
  prerequisites:
    - "A data science or competitive-intelligence team able to join public, financial and internal firm data in a secured environment (TRI-INSIDELEGALAI-2025)"
    - "Accurate relationship data with permissions applied per user (INTROHIVE-LAWSITES-2026)"
  risks_and_guardrails:
    - "The needs score is a model output and the article gives no accuracy check on it (TRI-INSIDELEGALAI-2025)"
    - "Confidentiality duties extend to former and prospective clients' information (ABA-OP512-2024, p.6)"
    - "63% of firms in the Introhive survey have no revenue-linked way to measure BD return, so claimed gains are hard to verify (INTROHIVE-LAWSITES-2026)"
  human_checkpoints:
    - "The lawyer or business developer reads the readout and decides how to use it in the conversation (TRI-INSIDELEGALAI-2025)"
    - "The pursuit lead decides how competitive intelligence shapes positioning (ABA-LPMAI-2026, item 7)"
  role_evolution: >-
    Lawyers and business developers run the search themselves, moving some research from specialists to the pursuit
    team (TRI-INSIDELEGALAI-2025). An LMA 2026 session advises using AI as a fact-finding tool without losing the human
    narrative (LMA-DECENT-2026).
  evidence_grade: B
  sources:
    - { ref: TRI-INSIDELEGALAI-2025, title: "Beyond legal practice: How GenAI is transforming law firm business operations", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en-us/posts/technology/inside-legal-ai-genai-transformation/", date: "2025-12-15", access: full, locator: "Use case 3: Opportunity spotting" }
    - { ref: INTROHIVE-LAWSITES-2026, title: "Partners Want AI to Help Them Find New Business, But Most Are Running It on Data They Can't Use, Introhive Survey Finds", publisher: LawSites (Robert J. Ambrogi), type: press, url: "https://www.lawnext.com/2026/10/partners-want-ai-to-help-them-find-new-business-but-most-are-running-it-on-data-they-cant-use-introhive-survey-finds.html", date: "2026-10-13", access: full, locator: "survey summary; 'Measuring Return'" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 7 (Competitive Intelligence and Benchmarking)" }
    - { ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools", publisher: American Bar Association, type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part II.B p.6" }
    - { ref: LMA-DECENT-2026, title: "From Decent to Great: How to Develop a Compelling Proposal Response (session abstract)", publisher: Legal Marketing Association, type: conference, url: "https://www.legalmarketing.org/Purchase/from-decent-to-great-how-to-develop-a-compelling-proposal-response-mch", date: "2026-05-01", access: full, locator: "session description and learning outcomes" }
    - { ref: SOURCE-PRECISION-2026, title: "Precision segmentation: How consulting firms can target clients' sector and functional AI budgets", publisher: Source Global Research, type: survey, url: "https://sourceglobalresearch.com/market-update/precision-segmentation-how-consulting-firms-can-target-clients-sector-and-functional-ai-budgets", date: "2026-09-28", access: full, locator: "buyer segmentation section (as routed from client-development practice)" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: law (Baker Botts; Introhive's survey spans law, accounting and other firms); consulting buyer research
    (Source Global Research says C-suite, finance and IT buyers want different AI help and that 60% of enterprise tech
    buyers cite data quality and governance as the largest bottleneck; SOURCE-PRECISION-2026). The article is ambiguous about whether the
    24-hour figure was for onboarding a new attorney or for client preparation. Competitor and client-reward analysis is
    an idea (ABA column), not a deployment. Relationship intelligence and pre-meeting briefs belong to
    professional-services-client-development-05, -06 and -07. Merged from discourse-03, governance-12 and discourse-14.

- id: professional-services-pursuit-proposals-09
  title: Urgent pitch and RFP responses drafted by partners from firm archives on a legal AI platform
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [research-synthesis, document-production]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A competitive or urgent request needs experience, prior pitch language and client context pulled from several
    practice groups and systems. Partners cobble this together by hand, often over days.
  solution: >-
    Partners query internal archives and external filings through a legal AI platform to draft a pitch or response and
    prepare for the client meeting. Harvey says law firm Lynn Pinker Hurst & Schwegmann used Harvey to answer an urgent
    client request and won the new business. Relationship tools also offer connectors: Introhive's MCP server (a
    standard way for AI assistants to query another system) lets assistants such as Copilot read relationship strength
    and past interactions for pitch preparation.
  outcomes:
    - lever: speed
      description: Harvey's account of Lynn Pinker Hurst & Schwegmann's response to an urgent client request
      figure: "under 48 hours; one won pitch"
      measures: "Elapsed time for one urgent request at one firm, as told by the vendor; a single anecdote"
      provenance: vendor-published
      source_ref: HARVEY-BD-2026
  prerequisites:
    - "Firm documents and archives in the platform's secure repository (HARVEY-BD-2026)"
    - "For relationship context, a usable relationship-data foundation: 78% of surveyed partners find firm relationship data hard to act on (INTROHIVE-LAWSITES-2026)"
  risks_and_guardrails:
    - "Introhive says its MCP server returns only the context needed for the question and inherits existing permissions and governance; a vendor statement on a commercial preview (INTROHIVE-MCP-2026)"
    - "The Lynn Pinker example is vendor-told, with no firm-side confirmation (HARVEY-BD-2026; HARVEY-LPHS-2025)"
  human_checkpoints:
    - "Lawyers refine and customise the draft for the client; the ABA describes this as the pattern without naming a firm (ABA-LPMRFP-2026)"
  role_evolution: >-
    Harvey describes partners drafting responses themselves from firm archives rather than waiting for BD staff to
    assemble materials (HARVEY-BD-2026). Latham & Watkins' Innovation Attorney - Client Team Enablement role works with
    BD on panels, pitches and RFPs (LATHAM-INNOVATIONATTY-2026).
  evidence_grade: B
  sources:
    - { ref: HARVEY-BD-2026, title: "How Law Firms Use AI for Business Development and Client Intelligence", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/blog/ai-for-law-firm-business-development", date: "2026-06-23", access: full, locator: "section 3, Help Partners Respond Faster to RFP Opportunities" }
    - { ref: HARVEY-LPHS-2025, title: "Sharpening the Edge: How LPHS Uses Harvey to Win Smarter, Faster (customer story)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/customers/lphs", date: "2025-04-24", access: full, locator: "customer story (as routed from client-development practice)" }
    - { ref: INTROHIVE-MCP-2026, title: "Introhive Announces MCP Server for Legal AI", publisher: Introhive, type: vendor, url: "https://www.introhive.com/news/introhive-announces-mcp-server-for-legal-ai-enables-copilots-and-ai-agents-with-real-time-relationship-intelligence/", date: "2026-04-16", access: full, locator: "release body, Client Pitch Preparation" }
    - { ref: INTROHIVE-LAWSITES-2026, title: "Partners Want AI to Help Them Find New Business, But Most Are Running It on Data They Can't Use, Introhive Survey Finds", publisher: LawSites (Robert J. Ambrogi), type: press, url: "https://www.lawnext.com/2026/10/partners-want-ai-to-help-them-find-new-business-but-most-are-running-it-on-data-they-cant-use-introhive-survey-finds.html", date: "2026-10-13", access: full, locator: "paragraphs on survey findings" }
    - { ref: ABA-LPMRFP-2026, title: "How AI Is Changing the Process of Law Firm Request for Proposals (RFP)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/july-august-2026/how-ai-is-changing-the-law-firm-request-for-proposals", date: "2026-07", access: full, locator: "Real-World Scenarios" }
    - { ref: LATHAM-INNOVATIONATTY-2026, title: "Job description: Innovation Attorney - Client Team Enablement (last updated 2026-02-26)", publisher: Latham & Watkins LLP, type: job-posting, url: "https://www.lw.com/admin/upload/SiteAttachments/Innovation-Attorney-Client-Team-Enablement.pdf", date: "2026-02-26", access: full, locator: "Essential Duties" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kind: law. The Lynn Pinker example appears in a 2025 Harvey customer story and in Harvey's 2026 BD guide
    (routed from client-development); it is a vendor anecdote, graded B as a named deployment without measurement. The
    Introhive MCP server was a commercial preview when announced. Relationship intelligence belongs to
    professional-services-client-development-07. From practice-06 plus routed items.

- id: professional-services-pursuit-proposals-10
  title: Executive summaries, win themes and one consistent voice across multi-author proposals
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Proposals assembled by several partners across departments read as inconsistent; an ABA column calls multi-partner
    RFPs 'Frankenstein' documents. Executive summaries and strategy sections take senior time.
  solution: >-
    AI drafts executive summaries, rewrites sections to a consistent voice and brand guidelines, and suggests proposal
    strategy points, which the bid lead edits. In Loopio's survey 39% of teams use AI for executive summaries, 28% to
    follow brand and voice guidelines and 21% to suggest proposal strategy. Speakers at an SMPS New York programme
    described AI streamlining outlining and copy editing.
  outcomes:
    - lever: quality
      description: Share of bid teams using AI for each narrative task
      figure: "39% executive summaries; 28% brand and voice; 21% strategy recommendations"
      measures: "Share of 1,533 respondents selecting each AI use (multiple answers allowed)"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: quality
      description: >-
        Adjacent evidence: on mid-level professional writing tasks in a preregistered online experiment, ChatGPT access
        cut time taken and raised rated quality
      figure: "time down 0.8 SD; quality up 0.4 SD"
      measures: "Difference between ChatGPT-exposed and control professionals, in standard deviations; 444 college-educated professionals (working paper, March 2023)"
      provenance: independent
      source_ref: NOY-ZHANG-2023
  prerequisites:
    - "Brand and voice guidelines and approved win themes the AI can follow (LOOPIO-TRENDS-2026, Ch.5 p.57)"
  risks_and_guardrails:
    - "The final draft must be more than AI boilerplate (ABA-LPMAI-2026, Cautions)"
    - "If many bidders prompt AI with the same criteria, responses may converge (BROWNEJACOBSON-AIPROC-2025)"
    - "The writing experiment found ChatGPT mostly substituted for worker effort and compressed differences between workers (NOY-ZHANG-2023, abstract)"
  human_checkpoints:
    - "The bid lead or partner edits the executive summary and win themes before submission (ABA-LPMAI-2026, item 3)"
    - "A person approves the final document; AI cannot replace human reading of client expectations, differentiators and authenticity (NYREJ-SMPSNY-2026)"
  role_evolution: >-
    The writing experiment found tasks restructured toward idea generation and editing and away from rough drafting
    (NOY-ZHANG-2023). SMPS New York presenters urged proposal professionals to build skills in strategic thinking,
    storytelling, quality control and problem-solving (NYREJ-SMPSNY-2026).
  evidence_grade: C
  sources:
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Ch.5 p.57" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "items 3 and 5; Cautions" }
    - { ref: NOY-ZHANG-2023, title: "Experimental Evidence on the Productivity Effects of Generative Artificial Intelligence (working paper)", publisher: "Shakked Noy and Whitney Zhang (MIT)", type: academic, url: "https://economics.mit.edu/sites/default/files/inline-files/Noy_Zhang_1.pdf", date: "2023-03-02", access: full, locator: "abstract" }
    - { ref: BROWNEJACOBSON-AIPROC-2025, title: "Use of AI in public sector procurements", publisher: Browne Jacobson, type: firm, url: "https://www.brownejacobson.com/insights/use-of-ai-in-public-sector-procurements", date: "2025-01-27", access: full, locator: "'AI used for evaluation of tender submissions'" }
    - { ref: NYREJ-SMPSNY-2026, title: "SMPS NY hosts 'Humans at the Helm: Guiding AI in Proposal Management' virtual program", publisher: New York Real Estate Journal, type: press, url: "https://nyrej.com/smps-ny-hosts-humans-at-the-helm-guiding-ai-in-proposal-management-virtual-program", date: "2026-06-30", access: full, locator: "paragraphs 3-4" }
  last_reviewed: "2026-10-19"
  notes: >-
    No named firm describes this use, so maturity is 'emerging' under the vocabulary's named-organisation rule even
    though the survey shows wide use. Firm kinds: cross-industry survey; AEC proposal professionals (SMPS); law (ABA).
    The 2023 experiment covers general professional writing, not proposals. Merged from governance-15 and the voice
    part of discourse-09.

- id: professional-services-pursuit-proposals-11
  title: AI-assisted accuracy, compliance and quality check of a proposal before submission
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Proposals assert credentials, past performance, contract values, awards and staff that a buyer may rely on or test.
    AI drafting adds plausible but false content, reviewers who have read a response for hours miss gaps, and in some
    formal bids a single invented credential is disqualifying.
  solution: >-
    AI compares draft claims against source records and the solicitation, scores sections against the stated
    evaluation criteria, flags unanswered or unsupported content, and leaves sign-off to a named reviewer. In Loopio's
    survey 38% of teams use AI to analyse proposal quality and 34% to check the accuracy of responses.
  outcomes:
    - lever: quality
      description: Survey-reported use only; top performers are described as more likely than average to use AI this way
      figure: "38% analysing proposal quality; 34% ensuring accurate responses"
      measures: "Share of 1,533 respondents selecting each AI use (multiple answers allowed); top performers win 50% or more of RFPs"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: quality
      description: Top performers report spending slightly more time per RFP than average
      figure: "35 hours versus 33 hours"
      measures: "Average hours per RFP for top-performing teams versus all teams"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: risk
      description: "Adjacent, independent: hallucination in leading AI legal research tools in a preregistered test; no equivalent measure for bid content exists"
      figure: "17% to 33% of answers"
      measures: "Frequency of hallucination for the tools tested on legal research queries"
      provenance: independent
      source_ref: STANFORD-MAGESH-2024
  prerequisites:
    - "A system of record for credentials, past performance and contract values to check against; a wrong contract value is not excused because a model produced it (BIDLAB-2026)"
    - "Stated evaluation criteria and a reviewer who can judge the AI's scoring (LOOPIO-BLOG-2026)"
  risks_and_guardrails:
    - "UK guidance's example disclosure questions ask bidders to confirm AI-assisted tender responses were checked and verified; the questions are for information and not scored (PPN-017-2025, Annex B)"
    - "Verify success stories, awards and bios (ABA-LPMAI-2026, Cautions)"
    - "The SEC settled charges against two investment advisers (USD 400,000 in total penalties) for telling clients and prospects they used AI in ways they did not, and the FTC says there is no AI exemption from existing law; cited as principles for AI claims to prospects (SEC-2024-36; FTC-AICOMPLY-2024)"
    - "In an SF-330, one invented project citation can mean disqualification, per a vendor (KANTIV-TRUST-2026)"
  human_checkpoints:
    - "A named person signs off each factual claim before submission (BIDLAB-2026)"
    - "Where a solicitation asks, the bidder confirms AI-assisted text was checked and verified (PPN-017-2025, Annex B)"
  role_evolution: >-
    The reviewer's job shifts from reading for style to verifying claims against records; Loopio reports top performers
    track granular metrics such as section scores and cost per bid (LOOPIO-TRENDS-2026, Ch.3 p.39).
  evidence_grade: C
  sources:
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Ch.5 pp.57, 59, 67; Ch.3 p.39; Ch.7 p.83" }
    - { ref: LOOPIO-BLOG-2026, title: "AI and the Future of Proposal Management: A Look at Industry Trends", publisher: Loopio, type: vendor, url: "https://loopio.com/blog/how-are-proposal-teams-adopting-ai/", date: "2026-04-14", access: full, locator: "item 5, Analyze Proposal Quality" }
    - { ref: STANFORD-MAGESH-2024, title: "Hallucination-Free? Assessing the Reliability of Leading AI Legal Research Tools (arXiv 2405.20362)", publisher: Stanford RegLab and HAI (Magesh et al.), type: academic, url: "https://arxiv.org/abs/2405.20362", date: "2024-05-30", access: full, locator: "abstract" }
    - { ref: PPN-017-2025, title: "Procurement Policy Note 017: Improving transparency of AI use in procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/67af7ba0e270ceae39f9e279/PPN_017_Improving_transparency_of_AI_use_in_procurement.pdf", date: "2025-02-17", access: full, locator: "Annex B" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 5; Cautions" }
    - { ref: BIDLAB-2026, title: "Using AI RFP Solutions: Dos and Don'ts (AI and RFPs: Disclosure Rules, Risk and What You Certify)", publisher: The Bid Lab, type: vendor, url: "https://thebidlab.com/learning-center/using-ai-rfp-solutions-dos-and-donts/", date: "2026-08", access: full, locator: "'What Are You Certifying When You Submit?'" }
    - { ref: SEC-2024-36, title: "SEC Charges Two Investment Advisers with Making False and Misleading Statements About Their Use of Artificial Intelligence (press release 2024-36)", publisher: U.S. Securities and Exchange Commission, type: regulator, url: "https://www.sec.gov/newsroom/press-releases/2024-36", date: "2024-03-18", access: full, locator: "press release body" }
    - { ref: FTC-AICOMPLY-2024, title: "FTC Announces Crackdown on Deceptive AI Claims and Schemes (Operation AI Comply)", publisher: U.S. Federal Trade Commission, type: regulator, url: "https://www.ftc.gov/news-events/news/press-releases/2024/09/ftc-announces-crackdown-deceptive-ai-claims-schemes", date: "2024-09-25", access: full, locator: "chair statement" }
    - { ref: KANTIV-TRUST-2026, title: "What's Under the Slab: How AI Trust Actually Gets Built in AEC", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/ai-trust-ai-proposal-software-for-aec", date: "2026-07-21", access: full, locator: "hallucination section" }
  last_reviewed: "2026-10-19"
  notes: >-
    No named professional-services firm using AI quality scoring or claims verification was found, so maturity is
    'emerging'. The SEC and FTC items concern investment advisers and consumer schemes, cited for principle. A vendor
    says one unnamed customer caught a disqualifying issue on an already-disqualified bid (KANTIV-TRUST-2026; anecdote).
    Pre-release checks of citations in AI-assisted deliverables are professional-services-work-production-11. Merged
    from practice-09, governance-03 and the review part of discourse-09.

- id: professional-services-pursuit-proposals-12
  title: Firm-approved AI assistants in place of personal chatbots for proposals, awards and survey submissions
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Proposal and BD staff reach for general chatbots the firm does not control, while bid content (past RFPs, pricing,
    client details, solicitation material) is confidential or restricted. At Ballard Spahr leadership would not allow
    open public chat tools, so staff had no safe way to use AI for writing such as awards submissions within a text limit.
  solution: >-
    The firm provides approved tools with no-training terms and access controls, bans pasting restricted material into
    others, and runs retrieval only over content each user may see. Law firm Ballard Spahr built 'Ask Ellis', a
    proprietary assistant used for emails, plain-language rewrites, and answering surveys and awards submissions within
    a text limit.
  outcomes:
    - lever: experience
      description: Active users of Ballard Spahr's Ask Ellis across all uses, not only awards and surveys
      figure: "900 active users"
      measures: "Active users as stated by Ballard Spahr's senior director of technology innovation; period and definition of 'active' not given"
      provenance: self-reported
      source_ref: TRI-INSIDELEGALAI-2025
    - lever: risk
      description: Many bid teams still use general tools; fewer use AI inside RFP software
      figure: "57% ChatGPT; 57% Microsoft Copilot; 43% RFP software with built-in AI (up from 33%)"
      measures: "Share of 1,533 respondents using each AI tool in their RFP process (multiple answers allowed)"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: risk
      description: Partners using AI for BD mostly rely on general-purpose tools
      figure: "68% general-purpose tools only; satisfaction 6.7 out of 10"
      measures: "Share of partners using AI for business development, among 123 surveyed partners"
      provenance: vendor-published
      source_ref: INTROHIVE-LAWSITES-2026
    - lever: risk
      description: Professionals who use AI at work but lack tools meeting the report's three conditions
      figure: "41%"
      measures: "Share reporting no access to tools that safeguard confidential data, ground outputs in authoritative content and explain reasoning; 1,816 respondents"
      provenance: vendor-published
      source_ref: TR-FOP-2026
  prerequisites:
    - "An approved-tools list and a rule on what may never be pasted in: client data, pricing, NDA material, anything a solicitation marks restricted (BIDLAB-2026)"
    - "Role-specific use cases and training; Ballard Spahr tells staff Ask Ellis is not a legal research tool (TRI-INSIDELEGALAI-2025)"
  risks_and_guardrails:
    - "California guidance says a lawyer must not input confidential client information into a tool with material confidentiality or security risk without informed consent, and general marketing assurances are not enough (CALBAR-GENAI-2026, p.5)"
    - "UK guidance suggests buyers set controls so bidders do not use confidential tender documents as AI training data (PPN-017-2025, para 9)"
    - "A US funder bars its reviewers from uploading proposal content to non-approved generative AI tools (NSF-GENAI-2023), an evaluator-side analogue"
    - "A law-firm commentary on the SRA's 2026-08-17 warning notice suggests tool approval should sit with the firm, not individual fee earners (JMW-SRA-2026)"
  human_checkpoints:
    - "The firm, not the individual, decides which tools are approved (JMW-SRA-2026)"
    - "Before upload, the user checks the tool's terms and the solicitation's own handling rules (BIDLAB-2026, FAQ)"
  role_evolution: >-
    Tool choice becomes a firm decision rather than an individual one (JMW-SRA-2026). Loopio reports enterprise and
    mid-market teams about 10 points more likely than small businesses to use AI, and suggests software that protects
    sensitive data is the reason (LOOPIO-TRENDS-2026, Ch.5 p.56).
  evidence_grade: B
  sources:
    - { ref: TRI-INSIDELEGALAI-2025, title: "Beyond legal practice: How GenAI is transforming law firm business operations", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en-us/posts/technology/inside-legal-ai-genai-transformation/", date: "2025-12-15", access: full, locator: "Use case 2: AI assistant" }
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Ch.5 pp.56 and 58" }
    - { ref: INTROHIVE-LAWSITES-2026, title: "Partners Want AI to Help Them Find New Business, But Most Are Running It on Data They Can't Use, Introhive Survey Finds", publisher: LawSites (Robert J. Ambrogi), type: press, url: "https://www.lawnext.com/2026/10/partners-want-ai-to-help-them-find-new-business-but-most-are-running-it-on-data-they-cant-use-introhive-survey-finds.html", date: "2026-10-13", access: full, locator: "'What Partners Say They Want'" }
