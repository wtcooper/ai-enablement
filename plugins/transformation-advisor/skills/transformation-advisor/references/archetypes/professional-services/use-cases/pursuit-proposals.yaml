- id: professional-services-pursuit-proposals-18
  title: Idea - keep a register of AI used in each bid and answer buyers' AI-disclosure questions consistently
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Buyers increasingly ask how AI was used in a bid or will be used in delivery, and the form of the ask varies. UK
    central government offers optional disclosure questions; California requires a clause for generative-AI
    deliverables; a US funder encourages proposers to say how AI was used; the Bid Lab says no general US federal rule
    requires disclosure of AI used in drafting as of August 2026.
  solution: >-
    Idea: the bid team records which AI tools touched which sections and what checks were done, and reuses a reviewed
    statement for disclosure questions, certifications and AI-in-delivery declarations. Pattern 'other': a compliance
    register.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "No firm's AI-use register or disclosure workflow was found"
      provenance: self-reported
      source_ref: PPN-017-2025
  prerequisites:
    - "A kickoff step to read the solicitation's representations and certifications for AI clauses (BIDLAB-2026)"
    - "A record of what AI was used for, so an answer takes minutes rather than a reconstruction (BIDLAB-2026)"
  risks_and_guardrails:
    - "UK guidance says its example AI disclosure questions are for information, should not be scored, and should not be used to discriminate between suppliers (PPN-017-2025, Annex B)"
    - "California's required clause says failure to report generative AI may result in disqualification; it covers AI provided as, or used to complete, a deliverable, not AI used to write the bid (CALDGS-SCM2302-2025)"
    - "A US funder says proposers remain responsible for accuracy and authenticity (NSF-GENAI-2023)"
    - "GSA published a draft clause on safeguarding government data in LLM systems for comment on 2026-06-17; it concerns AI delivered under contract (FEDREG-GSA-2026)"
    - "Australia's Public Service AI plan (unveiled 2025-11-12) says suppliers on whole-of-government management advisory and people panels will have to advise planned AI use when responding to requests for quotes (CANBERRATIMES-APSAI-2025)"
  human_checkpoints:
    - "The bid lead reviews the disclosure answer against the register before submission (no deployment describes this)"
  role_evolution: >-
    A compliance-owner role for bid managers is a plausible extension, not described in a source. Browne Jacobson
    tells buyers not to score AI-use answers and to plan for more tenders and clarification questions
    (BROWNEJACOBSON-AIPROC-2025).
  evidence_grade: D
  sources:
    - { ref: PPN-017-2025, title: "Procurement Policy Note 017: Improving transparency of AI use in procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/67af7ba0e270ceae39f9e279/PPN_017_Improving_transparency_of_AI_use_in_procurement.pdf", date: "2025-02-17", access: full, locator: "para 9; Annex B" }
    - { ref: PPN-0224-2024, title: "Procurement Policy Note 02/24: Improving Transparency of AI use in Procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/66019771a6c0f7bb15ef9252/PPN_02_24_Improving_Transparency_of_AI_use_in_Procurement.pdf", date: "2024-03-25", access: full, locator: "para 7 (predecessor text)" }
    - { ref: CALDGS-SCM2302-2025, title: "State Contracting Manual, Solicitations - GenAI Requirements (section 2302)", publisher: California Department of General Services, type: regulator, url: "https://www.dgs.ca.gov/PD/Resources/SCM/TOC/23/2302", date: "2025-02", access: full, locator: "required solicitation language" }
    - { ref: NSF-GENAI-2023, title: "Notice to Research Community: Use of Generative Artificial Intelligence Technology in the NSF Merit Review Process", publisher: U.S. National Science Foundation, type: regulator, url: "https://www.nsf.gov/news/notice-to-the-research-community-on-ai", date: "2023-12-14", access: full, locator: "'Use of generative AI in proposal preparation'" }
    - { ref: FEDREG-GSA-2026, title: "General Services Acquisition Regulation; Acquisition of Information and Communication Technology; Notice of Listening Sessions and Request for Comments (FR doc. 2026-12205)", publisher: U.S. General Services Administration (Federal Register), type: regulator, url: "https://www.federalregister.gov/documents/2026/06/17/2026-12205/general-services-acquisition-regulation-acquisition-of-information-and-communication-technology", date: "2026-06-17", access: full, locator: "abstract" }
    - { ref: BIDLAB-2026, title: "Using AI RFP Solutions: Dos and Don'ts (AI and RFPs: Disclosure Rules, Risk and What You Certify)", publisher: The Bid Lab, type: vendor, url: "https://thebidlab.com/learning-center/using-ai-rfp-solutions-dos-and-donts/", date: "2026-08", access: full, locator: "'Do You Have to Disclose That You Used AI?'" }
    - { ref: BROWNEJACOBSON-AIPROC-2025, title: "Use of AI in public sector procurements", publisher: Browne Jacobson, type: firm, url: "https://www.brownejacobson.com/insights/use-of-ai-in-public-sector-procurements", date: "2025-01-27", access: full, locator: "'AI used for answering tender submissions'" }
