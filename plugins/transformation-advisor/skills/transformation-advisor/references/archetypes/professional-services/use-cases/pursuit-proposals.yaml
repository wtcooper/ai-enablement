- id: professional-services-pursuit-proposals-13
  title: Tailor each response with AI while keeping the proposal useful as evidence of fit
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, client-interaction]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Tailoring to the buyer has been a costly signal of quality. Once AI makes tailored text cheap, buyers may stop
    treating it as evidence of fit. 41% of QorusDocs respondents already name personalisation as a pain point (QORUSDOCS-ITBRIEF-2026).
  solution: >-
    AI drafts text aligned to the RFP; bidders spend the saved effort on editing, evidence and relationship-specific
    content, and buyers use other checks (clarifications, presentations, references) to test claims.
  outcomes:
    - lever: quality
      description: >-
        Adjacent, independent: on an online labour platform that introduced an AI cover-letter tool, access raised
        alignment between letters and job posts and raised callbacks; time spent editing AI drafts correlated with
        hiring success; afterwards the link between alignment and callbacks weakened and employers shifted to other
        signals such as work histories.
      figure: "51% fall in the correlation between alignment and callbacks"
      measures: "Change in correlation between cover-letter textual alignment and employer callbacks after the tool's introduction; difference-in-differences on platform data"
      provenance: independent
      source_ref: CUI-DIAS-YE-2025
    - lever: risk
      description: "Adjacent, model-simulated: if written applications stop signalling ability, hiring becomes less meritocratic"
      figure: "top-quintile workers hired 19% less often; bottom-quintile 14% more often"
      measures: "Model-simulated change in hiring rates by ability quintile versus the pre-LLM equilibrium, Freelancer.com coding jobs; a counterfactual, not an observed outcome"
      provenance: independent
      source_ref: GALDIN-SILBERT-2025
  prerequisites:
    - "Buyer-side checks that do not depend on tailored prose: clarification questions, supplier presentations, site visits or supporting documents (PPN-017-2025, para 9)"
    - "Real client-specific input (relationships, values, context) that AI cannot supply from a library (ABA-LPMAI-2026, item 3)"
  risks_and_guardrails:
    - "If bidders feed AI similar criteria from the same invitation to tender, responses could become very similar or identical, so buyers need skilled evaluators (BROWNEJACOBSON-AIPROC-2025)"
    - "Tailored text works as a signal only while it is costly to produce (GALDIN-SILBERT-2025)"
    - "Selection committees are said to recognise generic AI output; a vendor summary calls this the 'AI slop' backlash (KANTIV-SMPSQ2-2026, secondary)"
  human_checkpoints:
    - "The bid lead or partner edits the draft for specific evidence and relationship content; in the platform study editing time correlated with hiring success (CUI-DIAS-YE-2025)"
  role_evolution: >-
    Bid writers move from composing to editing and evidencing. Loopio says top performers spend about two hours more per
    RFP and links this, as likely rather than proven, to personalisation and storytelling (LOOPIO-TRENDS-2026, Ch.7 p.83).
  evidence_grade: B
  sources:
    - { ref: CUI-DIAS-YE-2025, title: "Signaling in the Age of AI: Evidence from Cover Letters (arXiv 2509.25054)", publisher: "Jingyi Cui, Gabriel Dias, Justin Ye", type: academic, url: "https://arxiv.org/abs/2509.25054", date: "2025-09-29", access: full, locator: "abstract" }
    - { ref: GALDIN-SILBERT-2025, title: "Making Talk Cheap: Generative AI and Labor Market Signaling (arXiv 2511.08785)", publisher: "Anais Galdin and Jesse Silbert", type: academic, url: "https://arxiv.org/abs/2511.08785", date: "2025-11-11", access: full, locator: "abstract; introduction" }
    - { ref: QORUSDOCS-ITBRIEF-2026, title: "AI shapes RFP proposal teams as revenue pressure grows (reporting a QorusDocs benchmark survey)", publisher: IT Brief UK, type: press, url: "https://itbrief.co.uk/story/ai-shapes-rfp-proposal-teams-as-revenue-pressure-grows", date: "2026-02-25", access: full, locator: "'Proof of value' section" }
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Ch.7 p.83" }
    - { ref: PPN-017-2025, title: "Procurement Policy Note 017: Improving transparency of AI use in procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/67af7ba0e270ceae39f9e279/PPN_017_Improving_transparency_of_AI_use_in_procurement.pdf", date: "2025-02-17", access: full, locator: "para 9" }
    - { ref: BROWNEJACOBSON-AIPROC-2025, title: "Use of AI in public sector procurements", publisher: Browne Jacobson, type: firm, url: "https://www.brownejacobson.com/insights/use-of-ai-in-public-sector-procurements", date: "2025-01-27", access: full, locator: "'AI used for evaluation of tender submissions'" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 3" }
    - { ref: KANTIV-SMPSQ2-2026, title: "What the SMPS Q2 AI Report Means for AEC Pursuit Teams", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/smps-q2-ai-report", date: "2026-07-13", access: full, locator: "second finding (AI slop)" }
  last_reviewed: "2026-10-19"
  notes: >-
    Grade capped at B: the independent measurements come from adjacent processes (freelance job applications on online
    labour platforms; the platform in GALDIN-SILBERT-2025 introduced an AI proposal writer in April 2023), not
    professional-services RFPs. No equivalent study of professional-services bids was found. From governance-10.

- id: professional-services-pursuit-proposals-14
  title: Proposal agents inside professional services platforms that draft from delivery, finance and experience data
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    Estimates, bids and call notes sit apart from delivery actuals and experience records, so proposals rely on
    templates or judgment rather than what past engagements really cost and delivered, and too much expertise is locked
    in decks or consultants' heads.
  solution: >-
    Vendors of PSA systems (professional services automation: the software that holds deals, projects, staffing and
    billing) and experience platforms announce agents that draft proposals from that data. Certinia lists an RFP
    Responder agent that drafts tailored responses and a Deal Coach among its Veda agents, and says agents act within
    the permissions and approval thresholds an organisation sets. Kantata announced a Sales Accelerator, planned for
    early 2026, to turn delivery history into proposals that highlight case studies, risks and human-AI resource mixes.
    Intapp says DealCloud searches lawyer, engagement and client experience and generates pitch documents
    (INTAPP-EXPERIENCE-2026), and its DealCloud page lists 'knowledge and proposal readiness' (INTAPP-DEALCLOUD-2026).
  outcomes:
    - lever: speed
      description: Vendor headline for time to create a proposal or SOW; not tied to a named customer or to the RFP agent
      figure: "8 hours to 1 hour"
      measures: "Time to create a proposal or statement of work as labelled on Certinia's page; customer, sample and baseline not stated"
      provenance: vendor-published
      source_ref: CERTINIA-VEDA-2026
    - lever: speed
      description: "A consulting customer (FOIL) in Kantata's launch release says its experience becomes reusable and proposals 'practically build themselves'; no measurement"
      figure: "none published"
      measures: "Customer quote in a vendor press release"
      provenance: vendor-published
      source_ref: KANTATA-ENGINE-2025
  prerequisites:
    - "A single governed data foundation across sales, delivery, customers and financials (CERTINIA-VEDA-2026)"
    - "Defined permissions and approval thresholds for what an agent may do or send (CERTINIA-VEDA-2026)"
    - "Experience data connected to HR and financial systems (INTAPP-EXPERIENCE-2026)"
  risks_and_guardrails:
    - "California guidance says the greater the autonomy, the greater the oversight, and agentic systems must not act in a representative capacity without meaningful lawyer supervision (CALBAR-GENAI-2026, pp.2 and 5)"
    - "The same guidance bars agentic systems that autonomously transmit client information externally without safeguards and human review, and warns persistent access may expose information across matters (CALBAR-GENAI-2026, p.6)"
    - "The Bar Standards Board's guidance, as described by a law firm, treats AI use as outsourcing under which the barrister stays responsible (MONDAQ-BSB-2026)"
    - "No vendor source discusses the risk of reusing confidential client material in proposals (KANTATA-ENGINE-2025; INTAPP-EXPERIENCE-2026)"
  human_checkpoints:
    - "Approval thresholds set by the organisation before an agent takes a step (CERTINIA-VEDA-2026)"
    - "Human review of any external communication or transmission of client information (CALBAR-GENAI-2026, p.6)"
  role_evolution: >-
    Not described by the vendors. California guidance expects supervising lawyers to set clear policies, training and
    updates for agentic tools (CALBAR-GENAI-2026, p.7).
  evidence_grade: C
  sources:
    - { ref: CERTINIA-VEDA-2026, title: "Veda AI: agentic intelligence for professional services (solutions page; undated, read 2026-10-19)", publisher: Certinia, type: vendor, url: "https://certinia.com/solutions/ai", date: "2026-10", access: full, locator: "'Meet the Veda agent team' (Sell); 'Agentic action, your way'; page headline figures" }
    - { ref: KANTATA-ENGINE-2025, title: "Kantata unveils the Kantata Expertise Engine (press release)", publisher: Kantata, type: vendor, url: "https://www.kantata.com/blog/article/kantata-unveils-the-kantata-expertise-engine-the-first-ai-platform-purpose-built-for-professional-services-transformation", date: "2025-10-09", access: full, locator: "Paragraphs on the Sales Accelerator and the customer quote from FOIL" }
    - { ref: INTAPP-EXPERIENCE-2026, title: "Experience management (Intapp DealCloud product page; undated, read 2026-10-19)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/dealcloud/experience-management/", date: "2026-10-19", access: full, locator: "Section on proposal and report generation" }
    - { ref: INTAPP-DEALCLOUD-2026, title: "Intapp DealCloud (page undated)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/dealcloud/", date: "2026", access: full, locator: "AI to power your pipeline and win rates (Knowledge and proposal readiness)" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative AI in the Practice of Law (2026 version)", publisher: State Bar of California, COPRAC, type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "pp.2, 5, 6, 7" }
    - { ref: MONDAQ-BSB-2026, title: "The BSB Have Released AI Guidance. Should The SRA Follow Suit?", publisher: "Mondaq (contributor: PCB Byrne)", type: firm, url: "https://www.mondaq.com/the-bsb-have-released-ai-guidance-should-the-sra-follow-suit/1825730", date: "2026-08-03", access: full, locator: "'What Does the BSB Guidance Cover?'" }
    - { ref: CERTINIA-SOA-2026, title: "Certinia Unveils the System of Action for Services, and the Largest Expansion of Veda AI to Date", publisher: Certinia, type: vendor, url: "https://www.certinia.com/blog/certinia-unveils-system-of-action-for-services-and-largest-expansion-of-veda-ai-to-date/", date: "2026-09-09", access: full, locator: "claim relayed in the delivery-management practice routing notes; not re-read here" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: project-based consulting and IT services firms on PSA platforms (Certinia, Kantata; FOIL is a
    consultancy) and law and advisory firms (Intapp). No customer story was found for the RFP Responder agent. The
    delivery-management practice file relays a Certinia release claim of handling 15 times more RFPs
    (CERTINIA-SOA-2026, 2026-09-09); it was not checked here and is not used as an outcome. Delivery of Kantata's
    Sales Accelerator plan was not confirmed. Estimate agents are professional-services-scoping-pricing-02 and SOW
    drafting is -05. Ladder 'augment' because the vendors describe drafting, not autonomous submission. Merged from
    practice-14, governance-04 and items routed from knowledge-management and delivery-management.

- id: professional-services-pursuit-proposals-15
  title: Agentic pursuit workflows in which people direct agents across qualification, drafting and review
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, coordination-scheduling]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    AI help is mostly one paragraph at a time. Pursuit work spans qualification, requirements, drafting, review and
    handoff, and context built in one person's AI session does not reach the rest of the team.
  solution: >-
    Agents carry out multi-step proposal tasks while people direct and review. A Kantiv summary of the SMPS Foundation
    Q2 2026 report says agentic AI for proposals was the highest-scored trend in its AI section. Intapp says its Celeste
    product, generally available from 2026-07-15, can surface relevant matters, partner experience and prior pitch
    material for an urgent client request in minutes rather than hours. Law firm Stinson says it is preparing to adopt
    agentic capabilities for compliance validation and scoring (IKAUN-STINSON-2026).
  outcomes:
    - lever: capacity
      description: Firms building their own agentic workflows, and leaders' use of AI to orchestrate bid work
      figure: "17% of AEC firms developing their own agentic workflows; 41% vs 17% (Leaders vs Novices)"
      measures: >-
        Unanet: share of AEC respondents developing their own agentic workflows (sample size not stated). Responsive
        (RESPONSIVE-SRM-2025): share of Leaders vs Novices using AI to orchestrate workflows and assignments, 726
        respondents across industries
      provenance: vendor-published
      source_ref: BDC-UNANET-2026
    - lever: speed
      description: "Intapp's claim that pitch material can be surfaced in minutes rather than hours; no measurement"
      figure: "minutes rather than hours (vendor claim)"
      measures: "Time to surface matters, partner experience and prior pitch material for an urgent request; vendor statement"
      provenance: vendor-published
      source_ref: LAWSITES-CELESTE-2026
  prerequisites:
    - "Structured firm knowledge ('context engineering' in the SMPS report's words, per Kantiv): capability files, project taxonomies, win and loss intelligence (KANTIV-SMPSQ2-2026)"
    - "Shared memory or context across the pursuit team (KANTIV-SMPSQ2-2026)"
  risks_and_guardrails:
    - "A home-built tool needs an owner for prompt governance, permissions and data freshness, and token-based pricing can produce unexpectedly high bills; vendor opinion (KANTIV-TRUST-2026)"
    - "A consultant's newsletter reports APMP conference attendees moving away from do-it-yourself GenAI as too costly and unfocused (HINZ-BPCNASHVILLE-2025; mostly government-contracting audience)"
    - "Intapp says the same ethical walls, need-to-know restrictions and audit requirements that apply to people apply to Celeste (LAWSITES-CELESTE-2026)"
    - "California guidance: more autonomy needs more oversight (CALBAR-GENAI-2026, p.2)"
  human_checkpoints:
    - "People direct the agents and review outputs at defined points; no source specifies the gates (KANTIV-SMPSQ2-2026)"
  role_evolution: >-
    Proposal staff move from doing tasks to directing and reviewing agents, per Kantiv's summary of the SMPS report
    (KANTIV-SMPSQ2-2026, secondary).
  evidence_grade: C
  sources:
    - { ref: KANTIV-SMPSQ2-2026, title: "What the SMPS Q2 AI Report Means for AEC Pursuit Teams", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/smps-q2-ai-report", date: "2026-07-13", access: full, locator: "first finding and AI-memory finding" }
    - { ref: BDC-UNANET-2026, title: "AEC report reveals firms are in the throes of AI transition (Unanet, on the 2026 AEC Inspire Report)", publisher: Building Design + Construction, type: survey, url: "https://www.bdcnetwork.com/aec-tech/news/55386606/aec-report-reveals-firms-are-in-the-throes-of-ai-transition", date: "2026-06-25", access: full, locator: "paragraph on in-house models and agentic workflows" }
    - { ref: RESPONSIVE-SRM-2025, title: "B2B Revenue Leaders Are Winning Big With AI, And They're Hiring, Not Downsizing (release for the 2025 State of Strategic Response Management Report)", publisher: "Responsive with APMP (via Silicon UK)", type: survey, url: "https://www.silicon.co.uk/press-release/b2b-revenue-leaders-are-winning-big-with-ai-and-theyre-hiring-not-downsizing", date: "2025-05-08", access: full, locator: "Key findings, third item" }
    - { ref: LAWSITES-CELESTE-2026, title: "Intapp makes Celeste generally available, calling it an AI coworker to run the business side of law firms", publisher: LawSites (LawNext), type: press, url: "https://www.lawnext.com/2026/07/intapp-makes-celeste-generally-available-calling-it-an-ai-coworker-to-run-the-business-side-of-law-firms.html", date: "2026-07-16", access: full, locator: "paragraphs on playbooks and early adopters" }
    - { ref: IKAUN-STINSON-2026, title: "Winning More Time for Strategy: How Stinson is Transforming RFP and Proposal Responses with ikaun (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/winning-more-time-for-strategy-how-stinson-is-transforming-rfp-and-proposal-responses-with-ikaun", date: "2026", access: full, locator: "Results (next steps)" }
    - { ref: KANTIV-TRUST-2026, title: "What's Under the Slab: How AI Trust Actually Gets Built in AEC", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/ai-trust-ai-proposal-software-for-aec", date: "2026-07-21", access: full, locator: "article body (vendor opinion on home-built tools)" }
    - { ref: HINZ-BPCNASHVILLE-2025, title: "Volume 78: Special Edition. BPC Nashville - More Than Just a Conference!", publisher: Hinz Sight newsletter (Hinz Consulting), type: community, url: "https://hinzsight.beehiiv.com/p/volume-78-special-edition-bpc-nashville-more-than-just-a-conference-a-time-to-reconnect-reflect-and", date: "2025-06-02", access: full, locator: "paragraph after 'What people were saying'" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative AI in the Practice of Law (2026 version)", publisher: State Bar of California, COPRAC, type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "p.2" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: AEC (SMPS, Unanet), law (Intapp, Stinson), cross-industry (Responsive). Ladder 'delegate' describes what
    the sources discuss; no firm is shown running a pursuit agent end to end, and no Celeste early adopter is reported
    using it for pitches or RFPs (BakerHostetler's focus is intake and conflicts). The SMPS report is members-only and
    was read through a vendor summary. Celeste's origination and BD playbooks are
    professional-services-client-development-10. Merged from discourse-12 and practice-07.

- id: professional-services-pursuit-proposals-16
  title: Win/loss and proposal-performance analytics that show what separates wins from losses, including AI use
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [data-reporting, research-synthesis]
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Firms judge proposal success by whether they won. Debrief notes, client feedback and past responses sit apart, so
    lessons rarely reach the next bid, and teams adopt AI without measuring its effect on wins: QorusDocs reports more
    than a quarter of respondents find proposal effectiveness hard to measure (QORUSDOCS-ITBRIEF-2026).
  solution: >-
    Tag each bid with outcome, stage reached, section scores, cost, loss reasons and how AI was used, then use an
    assistant to read proposals, debriefs and win/loss notes together and surface what separated wins from losses. An
    LMA 2026 session teaches judging proposal success beyond winning (client feedback, message resonance, internal
    alignment). Vendors also sell AI-moderated post-pitch interviews that feed this analysis.
  outcomes:
    - lever: quality
      description: Leaders were more likely than Novices to use AI to surface insights from win/loss data; a usage difference, not a result
      figure: "37% vs 18%"
      measures: "Share of Leaders vs Novices using AI to surface insights from win/loss data; 726 respondents across industries"
      provenance: vendor-published
      source_ref: RESPONSIVE-SRM-2025
    - lever: quality
      description: "none published for AI-moderated win/loss interviews; the vendor asserts that firms running systematic win/loss research win more of later pitches, with no data"
      figure: "none published"
      measures: "Unsupported vendor assertion"
      provenance: vendor-published
      source_ref: KOJI-PSDOCS-2026
  prerequisites:
    - "Outcome and stage data per bid; 95% of Loopio respondents track success metrics, most often win rate (LOOPIO-TRENDS-2026, Ch.3 p.39)"
    - "Debriefs and win/loss notes captured consistently (LMA-DECENT-2026)"
  risks_and_guardrails:
    - "Self-reported loss reasons differ by seniority: associates more often blame price and competition, directors and above product fit; verify against buyer debriefs (LOOPIO-TRENDS-2026, Ch.2 p.32)"
    - "Win/loss notes are recollections; score on what was known at the time (KANTIV-GONOGO-2026)"
    - "63% of firms in the Introhive survey have no revenue-linked way to measure BD return (INTROHIVE-LAWSITES-2026)"
    - "Use of buyer feedback or personal data is subject to the firm's privacy and confidentiality duties; not addressed in the sources read"
  human_checkpoints:
