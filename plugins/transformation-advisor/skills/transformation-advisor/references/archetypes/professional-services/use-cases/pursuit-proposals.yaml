    GSK spoke as a client at Legalweek (in-house). The Litera post is sponsored vendor content citing Litera's own
    survey. Overlaps held elsewhere: partner value conversations professional-services-client-development-14,
    matter-level evidence shown to clients -15, AI terms in engagement letters -16; pricing use of the same evidence
