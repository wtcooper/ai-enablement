- id: professional-services-pursuit-proposals-17
  title: Idea - answer clients' RFP questions on the firm's AI use, governance and savings from a reviewed answer bank backed by matter evidence
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, client-interaction]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Many law-firm RFPs now ask which AI tools a firm uses, how they are governed, whether client data trains models,
    what safeguards protect confidentiality and what savings resulted (ABA-LPMRFP-2026). Clients add AI usage clauses
    to RFPs and guidelines while few firms give hard data (LAWFUEL-2025); a Parker Poe partner says firms that cannot
    answer at matter level can only talk about policy (PARKERPOE-TR-2026), and a Litera CEO's sponsored post says
    clients want metrics and proof (LAWSITES-LITERA-2026).
  solution: >-
    Idea discussed by practitioners: keep a reviewed bank of answers on AI strategy, policies, tools, data handling,
    savings evidence and roadmap; adapt it per RFP; back savings claims with a short matter-level evidence pack (tool,
    workflow, human review, guardrails, measured effect); and flag conflicts with the client's own AI restrictions.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "No firm reports running such an answer bank or evidence pack"
      provenance: self-reported
      source_ref: ABA-LPMRFP-2026
  prerequisites:
    - "A written firm AI policy and approved-tools list the answers can cite (CALBAR-GENAI-2026, Duty to Supervise row, p.7)"
    - "Matter-level data on where AI was used and what review took place; clients want matter-level proof and firms at Legalweek 2026 said they were still gathering data (TRI-LEGALWEEK-2026)"
    - "A record of which clients' guidelines restrict AI or require disclosure (ABA-OP512-2024, p.8)"
  risks_and_guardrails:
    - "Lawyers must disclose AI practices if a client asks or the engagement agreement or outside counsel guidelines require it (ABA-OP512-2024, p.8), and must follow client instructions that restrict AI (CALBAR-GENAI-2026, p.7)"
    - "Claims about AI use must be true and substantiated (SEC-2024-36; FTC-AICOMPLY-2024); consultants must not overstate AI expertise, credentials or experience in proposals (ICMCI-AICODE-2026, s.11.2); Florida lets lawyers advertise generative AI use but not claim superiority unless objectively verifiable (FLBAR-OP241-2024)"
    - "Leading with price concessions before showing value can train clients to expect discounts (TRI-STANDOUT-2026)"
    - "At Legalweek a DLA Piper speaker said firms receive both demands that AI be used to hit savings targets and directives that AI not be used without permission (TRI-LEGALWEEK-2026)"
  human_checkpoints:
    - "Partners and risk leaders approve statements about AI use and savings before they enter a bid (no deployment describes this)"
  role_evolution: >-
    An ABA article says answering well requires explaining how technologies fit into legal workflows, not listing tools
    (ABA-LPMRFP-2026). A scheduled January 2027 TRI forum session casts marketing and BD chiefs as shaping the firm's AI
    story for pitches and proposals (TRI-CMBDO34-2027; scheduled, not yet given).
  evidence_grade: D
  sources:
    - { ref: ABA-LPMRFP-2026, title: "How AI Is Changing the Process of Law Firm Request for Proposals (RFP)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/july-august-2026/how-ai-is-changing-the-law-firm-request-for-proposals", date: "2026-07", access: full, locator: "'AI Questions Being Asked of Law Firms in RFPs'" }
    - { ref: PARKERPOE-TR-2026, title: "From permission to performance: What clients now expect from AI-enabled law firms", publisher: Thomson Reuters (interview with Parker Poe), type: vendor, url: "https://legal.thomsonreuters.com/blog/from-permission-to-performance-what-clients-now-expect-from-ai-enabled-law-firms/", date: "2026-08-14", access: full, locator: "'Building client trust'; 'Assessing meaningful AI integration'" }
