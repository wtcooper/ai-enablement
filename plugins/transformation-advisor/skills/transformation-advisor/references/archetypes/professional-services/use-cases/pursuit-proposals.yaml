  notes: >-
    Idea: buyer requirements are documented by regulators, but no firm's register was found. Firm kinds: any firm
    bidding for public-sector work (UK, California, US federal, Australia); the NSF item is a grant-funder analogue.
    PPN 017 updates PPN 02/24 (PPN-0224-2024) for the Procurement Act 2023. Search-only and unverified: a US Commerce framework of sample AI clauses and a Vermont AI-use disclosure form. The
    public-sector declaration and fee-recovery entry is professional-services-scoping-pricing-12; a register of client
    AI restrictions at matter opening is professional-services-acceptance-risk-11. From governance-07.

- id: professional-services-pursuit-proposals-19
  title: Idea - flag deal-breaker terms in RFPs and outside counsel guidelines against the firm's standard terms before bidding
  archetype: professional-services
  module: pursuit-proposals
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Client outside counsel guidelines (OCGs, a client's rules for the firms it hires) and RFP terms carry billing,
    staffing, data-security, insurance and indemnity provisions, and increasingly AI restrictions. They can be
    deal-breakers and are reviewed late and by hand under a short turnaround.
  solution: >-
    Idea from an ABA marketing column: AI cross-references a client's guidelines or RFP terms against the firm's
    standard terms and produces a dashboard of clauses that are standard, need review, or are potential deal-breakers
    (for example indemnifying the client beyond the firm's control).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "A listed capability with no result"
      provenance: self-reported
      source_ref: ABA-LPMAI-2026
  prerequisites:
    - "The firm's standard terms and AI policy in a form the tool can compare (ABA-LPMAI-2026, item 6)"
  risks_and_guardrails:
    - "Guidelines may restrict or require disclosure of AI use; lawyers must follow client limits and disclose where guidelines require it (CALBAR-GENAI-2026, p.7; ABA-OP512-2024, p.8)"
    - "At Legalweek a DLA Piper speaker described directives demanding warrants that models are unbiased and declarations that firms cannot use AI without explicit permission (TRI-LEGALWEEK-2026)"
    - "A Litera post urges general counsel to add AI-disclosure, data-handling and accuracy questions to RFP technology sections (LITERA-GCRFP-2026; vendor)"
    - "Same cautions as other AI proposal uses: a tool that does not train on firm data, and output checked (ABA-LPMAI-2026, Cautions)"
  human_checkpoints:
    - "A lawyer reviews flagged clauses and decides whether to bid or negotiate (ABA-LPMAI-2026, item 6)"
  role_evolution: "No source describes role changes."
  evidence_grade: D
  sources:
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 6 (Compliance and Risk Flagging); Cautions" }
    - { ref: TRI-LEGALWEEK-2026, title: "Couples counseling at Legalweek 2026: firms and clients confront the AI value divide", publisher: Thomson Reuters Institute, type: conference, url: "https://www.thomsonreuters.com/en/institute/articles/legalweek-2026-firm-client-divide", date: "2026-03-13", access: full, locator: "'The contradictions in the room'" }
    - { ref: LITERA-GCRFP-2026, title: "What General Counsel Should Ask About AI in Legal Vendor RFPs", publisher: Litera, type: vendor, url: "https://www.litera.com/node/1585", date: "2026", access: full, locator: "TL;DR and 'Why AI Belongs in Your Legal Vendor RFP'" }
    - { ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools", publisher: American Bar Association, type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "p.8" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative AI in the Practice of Law (2026 version)", publisher: State Bar of California, COPRAC, type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05", access: full, locator: "Communication row, p.7" }
  last_reviewed: "2026-10-19"
  notes: >-
    Idea; no firm using it was found. Firm kind: law. Kept here because the check happens inside the bid; extraction
    and enforcement of client terms once work is accepted is professional-services-acceptance-risk-10, and a register
    of client AI restrictions is professional-services-acceptance-risk-11. The Litera page date is not on the page.
    Merged from practice-13, discourse-15 and governance-16.

- id: professional-services-pursuit-proposals-20
  title: In-house buyers scope RFPs and compare law-firm and consultancy proposals with AI (in-house)
  archetype: professional-services
  module: pursuit-proposals
  function: procurement-supply-chain
  work_types: [review-assurance, research-synthesis]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    In-house legal teams and enterprise buyers scatter the information needed to choose outside firms across systems,
    receive long narrative proposals from many firms, and struggle to scope work so bids are comparable. As suppliers
    use AI to bid more often, buyers face more, and more similar, responses without more evaluation capacity.
  solution: >-
    Priori announced Scout, an agent that analyses a matter, recommends a sourcing path (in-house, alternative legal
    service provider, panel or RFP), builds the RFP, collects responses and compares proposals in a structured
    evaluation. An ABA article describes legal operations teams starting to use AI to summarise and compare
    submissions, flag pricing outliers and staffing differences, and draft follow-up questions for panel interviews
    (ABA-LPMRFP-2026; TGC-WK-2025).
    Advisers to buyers of IT systems-integration services recommend using AI to audit compliance and consistency, then
    applying experienced commercial judgement.
  outcomes:
    - lever: quality
      description: >-
        Adjacent, independent: three reasoning models were compared with human procurement professionals on 123 State of
        Ohio IT supplier bids from 31 projects; the models were consistent and aligned with humans on compliance signals
        and showed high scoring volatility on competitive signals such as value-add claims.
      figure: "123 bids, 31 projects, 3 models; no accuracy percentage in the abstract"
      measures: "Consistency and human alignment on compliance signals; scoring volatility on competitive signals (January 2023 to December 2024 bids)"
      provenance: independent
      source_ref: JBL-MCKINLEY-2026
    - lever: speed
      description: "none published for Priori Scout; announcement only"
      figure: "none published"
      measures: "No figure"
      provenance: vendor-published
      source_ref: PRIORI-SCOUT-2026
  prerequisites:
    - "Defined rules of engagement, panel strategy and pricing guidelines, with historical billing and firm data in the platform (PRIORI-SCOUT-2026)"
    - "Approved tools that keep submitted proposals confidential; NSF bars its reviewers from uploading proposals to non-approved generative AI tools (NSF-GENAI-2023)"
    - "Evaluators skilled in telling near-identical responses apart, and scoring that allows nuance (BROWNEJACOBSON-AIPROC-2025)"
  risks_and_guardrails:
    - "Polished AI-assisted proposals can hide weaker economics; in one practitioner's example an LLM rated a statement of work's off-ramps client-friendly without testing whether they could be used (UPPEREDGE-PROPTRAP-2026)"
    - "Buyer advice: require disclosure of AI use, validate in live discussion, bind AI-written commitments into the contract and train procurement staff; the adviser sells advisory services (UPPEREDGE-SI-2025)"
    - "A 2026 legal commentary says US federal evaluators may use generative AI to summarise proposals without telling offerors, creating bid-protest risk (NATLAW-BRADLEY-2026); commentary, not evidence of widespread practice"
    - "NIH reported one applicant submitting more than 40 applications in a round, now limits applicants to six a year and says it uses AI-detection technology; a grant-funder analogue (NIH-NOTOD25132-2025)"
  human_checkpoints:
    - "The legal team makes the final firm selection (PRIORI-SCOUT-2026)"
    - "Humans assess differentiation, value-add and commercial terms; the study treats scoring volatility as the signal that oversight is needed (JBL-MCKINLEY-2026)"
  role_evolution: >-
    Legal operations staff move from reading each submission to reviewing structured comparisons and differences
    between firms (ABA-LPMRFP-2026). Proposal writers face two audiences, a human panel and a model (UPPEREDGE-PROPTRAP-2026).
