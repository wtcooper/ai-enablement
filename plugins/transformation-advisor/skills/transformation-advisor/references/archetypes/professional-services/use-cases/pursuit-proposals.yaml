# professional-services / pursuit-proposals use cases (synthesised 2026-10-19 from research/runs/wave3)
# Covers RFP and RFI responses, proposals, pitches, credentials, go/no-go and win/loss analysis.
# Firm kinds are named in each entry's notes. In-house examples are tagged "in-house".
# Cross-references to other modules use full ids; nothing here duplicates their entries.

- id: professional-services-pursuit-proposals-01
  title: First drafts of RFP and bid answers from an approved content library, reviewed and tailored by people
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, research-synthesis]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Proposal teams answer hundreds of repeated questions in requests for proposals (RFPs) by copy-pasting from old
    files and chasing subject-matter experts (SMEs). In Loopio's cross-industry survey, teams submitted an average of
    166 RFPs in the year (153 the year before) and 50% ranked bandwidth as a top challenge.
  solution: >-
    Approved answers, bios and service descriptions sit in one tagged library with named owners. The tool retrieves
    the closest approved answer for each question and drafts or adapts a response; senior people review and tailor
    the parts that matter. Accounting firm Cherry Bekaert uses a bought platform (Loopio); IT services firm Versent
    built its own retrieval tool on Azure services. Government-services provider Serco piloted a generative
    bid-writing platform (AutogenAI) as one of its Impact Pilots, and an unnamed Big 4 firm replaced an in-house
    knowledge tool and a private ChatGPT with the same platform (AUTOGENAI-BIG4-2025). In Loopio's survey 62% of teams
    use AI to generate specific answers and 52% to write a first draft (LOOPIO-TRENDS-2026).
  outcomes:
    - lever: speed
      description: >-
        A Cherry Bekaert manager says a government audit RFP that once took about eight hours to draft now takes
        about two; the case study also says drafting overall went from about eight hours to two to four.
      figure: "8 hours to 2 hours (government audit RFP); 8 hours to 2-4 hours (general)"
      measures: >-
        Hours to draft a response, as stated by Cherry Bekaert's Sr. Manager, Pursuit and Sales Asset Leader. No
        baseline method or sample is given, so this is a recollection or estimate.
      provenance: self-reported
      source_ref: LOOPIO-CHERRYBEKAERT-2026
    - lever: capacity
      description: Cherry Bekaert's scale on the platform, as stated in the vendor case study
      figure: "80% automation rate; about 550 RFPs a year; about 600 professionals engaged"
      measures: >-
        'Automation rate' is not defined in the source; 550 is the annual count of RFPs the proposal team supports;
        600 is the number of professionals the case study says it engages across the firm
      provenance: vendor-published
      source_ref: LOOPIO-CHERRYBEKAERT-2026
    - lever: speed
      description: Versent projects an annual time saving from its internal Bid Assistant; the page states a projection
      figure: "600 hours per year (projected)"
      measures: "Projected annual hours saved by Versent bid teams. A projection, not a measured result"
      provenance: self-reported
      source_ref: VERSENT-BIDASSISTANT-2025
    - lever: speed
      description: >-
        AutogenAI's Serco case study reports an efficiency gain in proposal writing and knowledge management and a
        rise in win rates. Serco's own quote says only that the functionality was used more than 6,000 times.
      figure: "85% efficiency gain; 5% increase in win rates"
      measures: "Undefined: the PDF gives no numerator, denominator or period for either figure"
      provenance: vendor-published
      source_ref: AUTOGENAI-SERCO-2025
    - lever: speed
      description: >-
        Average time to complete an RFP response, start to finish, across survey respondents. The report does not
        isolate AI's effect on the two-hour reduction.
      figure: "33 hours per RFP (two hours faster than the year before)"
      measures: "Average hours reported per RFP response; 1,533 respondents, all industries"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: speed
      description: Benefits teams name for AI in the RFP process; improved win rate is cited far less than speed
      figure: "47% reduced response time; 40% improved quality or consistency; 17% improved win rate"
      measures: "Share of 1,533 respondents selecting each benefit (multiple answers allowed)"
      provenance: vendor-published
      source_ref: LOOPIO-TRENDS-2026
    - lever: capacity
      description: Proposal professionals' own view of AI's effect on volume and wins
      figure: "60% say AI increased volume handled; 35% credit higher win rates and revenue"
      measures: >-
        Share of 297 surveyed proposal professionals (26% professional services, 24% legal services) reporting each
        impact, as reported by IT Brief; the base for the AI-using subgroup is not stated
      provenance: vendor-published
      source_ref: QORUSDOCS-ITBRIEF-2026
  prerequisites:
    - "A curated library with ownership and freshness tracking; Cherry Bekaert governs nearly 2,500 content assets across service-line libraries with industry tags (LOOPIO-CHERRYBEKAERT-2026)"
    - "For an in-house build: data preparation, a chunking strategy and an evaluation baseline before deployment (VERSENT-BIDASSISTANT-2025)"
    - "An AI tool whose terms prohibit training on inputs, an approved-tools list, and a kickoff step to read each solicitation's AI and certification clauses (BIDLAB-2026)"
  risks_and_guardrails:
    - "Cherry Bekaert says it cannot make certain claims, so it extracts validated content from its library and sends output back through review (LOOPIO-CHERRYBEKAERT-2026, Solution)"
    - "An ABA Law Practice column calls drafting RFP responses on public LLMs that train on firm inputs an 'absolute no-no' and says to check every word, including success stories, awards and bios (ABA-LPMAI-2026, Cautions)"
    - "UK procurement guidance warns that LLM content may include plausible but false statements; its example disclosure question asks bidders to confirm AI-assisted tender responses were checked for accuracy (PPN-017-2025, para 15 and Annex B)"
    - "ABA Formal Opinion 512 says informed consent is needed before putting information relating to a representation into a self-learning tool, boilerplate consent is not enough, and confidentiality extends to prospective clients (ABA-OP512-2024, pp.6-7)"
    - "Win-rate effect is unproven: only 17% of teams name improved win rate as a benefit, which Loopio says may mean they are not measuring it (LOOPIO-TRENDS-2026, Ch.5 p.59)"
  human_checkpoints:
    - "Senior professionals review a project in the shared workspace 'with an auditor mentality', then go into detail on the parts that matter (LOOPIO-CHERRYBEKAERT-2026)"
    - "A named individual, not 'the team', traces every factual claim to a source before submission (BIDLAB-2026)"
    - "Lawyers or bid leads tailor strategy and nuance to the client before submission (ABA-LPMAI-2026, item 3)"
  role_evolution: >-
    Cherry Bekaert built a dedicated proposal function in place of RFPs as a side-of-desk marketing task; the team
    builds first drafts from the library and senior staff review targeted parts (LOOPIO-CHERRYBEKAERT-2026). In
    Loopio's survey 32% say leadership expects new responsibilities and 42% better results because of AI, and 16% say
    they replaced internal people resources with AI (LOOPIO-TRENDS-2026, Ch.5 p.61). Stinson partners argue the saved
    time should be reinvested in understanding the client (STINSON-LAW360-2026).
  evidence_grade: B
  sources:
    - { ref: LOOPIO-CHERRYBEKAERT-2026, title: "How Cherry Bekaert Scaled to 550 RFPs a Year, With Loopio", publisher: Loopio, type: vendor, url: "https://loopio.com/case-study/cherry-bekaert/", date: "2026-10-08", access: full, locator: "Results; Solution; quote on guardrails" }
    - { ref: VERSENT-BIDASSISTANT-2025, title: "Accelerating RFP Response with GenAI (page undated; year from image paths)", publisher: Versent, type: firm, url: "https://versent.com.au/case-studies/accelerating-rfp-response-with-genai/", date: "2025", access: full, locator: "Solution; Outcome / Key Outcomes" }
    - { ref: AUTOGENAI-SERCO-2025, title: "Serco Increases Efficiency by 85% and Global Revenue by 5% with AutogenAI", publisher: AutogenAI, type: vendor, url: "https://autogenai.com/wp-content/uploads/2024/09/Serco-Increases-Efficiency-by-85-and-Global-Revenue-by-5-with-AutogenAI.pdf", date: "2025-03", access: full, locator: "The Solution; Results" }
    - { ref: AUTOGENAI-BIG4-2025, title: "How the Fastest Growing Big 4 Professional Services Firm Optimised Competitive Tendering with AutogenAI (unnamed firm)", publisher: AutogenAI, type: vendor, url: "https://autogenai.com/wp-content/uploads/2025/07/Professional-Services-Firm-Case-Study.pdf", date: "2025-07", access: full, locator: "pp.1-3 (image-only PDF, read from page renders)" }
    - { ref: LOOPIO-TRENDS-2026, title: "2026 RFP Response Trends & Benchmarks Report", publisher: "Loopio, in partnership with APMP", type: survey, url: "https://link.loopio.com/hubfs/Content%20Pieces/FY26%20Trends%20Report/trends-report-2026-digital-Master.pdf", date: "2026-03", access: full, locator: "Overview pp.5-8; Ch.5 pp.56-61" }
    - { ref: QORUSDOCS-ITBRIEF-2026, title: "AI shapes RFP proposal teams as revenue pressure grows (reporting a QorusDocs benchmark survey)", publisher: IT Brief UK, type: press, url: "https://itbrief.co.uk/story/ai-shapes-rfp-proposal-teams-as-revenue-pressure-grows", date: "2026-02-25", access: full, locator: "'Automation uneven' section" }
    - { ref: ABA-LPMAI-2026, title: "Leveraging AI to Respond to Requests for Proposals (RFPs) (Marketing Column)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/march-april-2026/leveraging-ai-to-respond-to-rfps", date: "2026-03", access: full, locator: "item 3; Cautions" }
    - { ref: BIDLAB-2026, title: "Using AI RFP Solutions: Dos and Don'ts (AI and RFPs: Disclosure Rules, Risk and What You Certify)", publisher: The Bid Lab, type: vendor, url: "https://thebidlab.com/learning-center/using-ai-rfp-solutions-dos-and-donts/", date: "2026-08", access: full, locator: "risk table; internal AI policy section" }
    - { ref: PPN-017-2025, title: "Procurement Policy Note 017: Improving transparency of AI use in procurement", publisher: UK Cabinet Office, type: regulator, url: "https://assets.publishing.service.gov.uk/media/67af7ba0e270ceae39f9e279/PPN_017_Improving_transparency_of_AI_use_in_procurement.pdf", date: "2025-02-17", access: full, locator: "para 15; Annex B" }
    - { ref: ABA-OP512-2024, title: "Formal Opinion 512: Generative Artificial Intelligence Tools", publisher: American Bar Association, type: professional-body, url: "https://www.lawnext.com/wp-content/uploads/2024/07/aba-formal-opinion-512.pdf", date: "2024-07-29", access: full, locator: "Part II.B Confidentiality, pp.6-7" }
    - { ref: STINSON-LAW360-2026, title: "Scheck and Valdivia Examine How AI Is Reshaping Law Firm RFPs in Law360", publisher: Stinson LLP, type: firm, url: "https://www.stinson.com/newsroom-news-scheck-and-valdivia-examine-how-ai-is-reshaping-law-firm-rfps-in-law360", date: "2026-09-11", access: full, locator: "second paragraph" }
    - { ref: ABA-LPMRFP-2026, title: "How AI Is Changing the Process of Law Firm Request for Proposals (RFP)", publisher: ABA Law Practice magazine, type: professional-body, url: "https://www.americanbar.org/groups/law_practice/resources/law-practice-magazine/2026/july-august-2026/how-ai-is-changing-the-law-firm-request-for-proposals", date: "2026-07", access: full, locator: "How Law Firms Are Using AI in RFP Responses" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: accounting (Cherry Bekaert), IT services (Versent), government services (Serco, adjacent to the
    archetype), an unnamed Big 4 firm, and law (Stinson, ABA). Grade B rests on named deployments whose figures are
    recollections, projections or undefined vendor figures. AutogenAI's customer page says Serco's global revenue rose
    5%; the Serco PDF says win rates rose 5%. The Loopio blog says 47% expect better results; the report says 42%
    (report used). An ABA article relays a Responsive/APMP figure that some organisations cut 30-40% of manual proposal
    effort (ABA-LPMRFP-2026); the report was not opened. The ABA column's '70-80% complete first draft' is an assertion,
    and vendor accuracy claims seen only in search results (Tribble) are not used. Merged from practice-01, practice-08,
    governance-01 and discourse-05.

- id: professional-services-pursuit-proposals-02
  title: Search and chat over the firm's archive of past proposals and RFPs, with drafting from it
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [research-synthesis, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Firms hold hundreds of past proposals, project descriptions and resumes across file servers, project systems and
    SharePoint. In a large law firm RFPs differ by client, practice and office, so there is little standardisation;
    people re-ask marketing for old language and resume versions multiply.
  solution: >-
    Past RFPs and proposals are loaded into a searchable store with chat and tagging, so staff find and reuse prior
    answers and draft from them. Law firm Ballard Spahr's technology team built 'X-Ray' on Microsoft cloud and generative
    AI (up to 2,000 RFP documents per instance); its IP group used it to keep control of its own RFPs while drawing on
    firm-wide knowledge, and other practice groups asked for the same. Engineering firm Benesch loaded almost 1,000
    proposals into a pursuit platform (Kantiv) that finds content by document, person and project and drafts technical
    approaches, bios and case studies; engineering firm Woodard & Curran uses it to find the right resume version.
  outcomes:
    - lever: speed
      description: Partner estimate of time saved per RFP at Ballard Spahr because of tagging
      figure: "about 2 hours saved per RFP (partner estimate)"
      measures: >-
        Hours per RFP partners estimate they save, as stated at a conference panel by Ballard Spahr's senior director of
        technology innovation; no baseline method or sample
      provenance: self-reported
      source_ref: TRI-INSIDELEGALAI-2025
    - lever: speed
      description: Benesch's marketing communications manager recounts one engineer new to AI writing a technical approach
      figure: "2 hours versus 6-8 hours (one anecdote)"
      measures: "Hours for one engineer to write one technical approach; one person, one proposal"
      provenance: self-reported
      source_ref: KANTIV-BENESCH-2026
    - lever: speed
      description: Woodard & Curran's estimate of time saved per proposal from faster search and retrieval
      figure: "30-40% per proposal (estimate)"
      measures: "The firm's own estimate of time saved per proposal on searching and retrieving content; method not stated"
      provenance: self-reported
      source_ref: KANTIV-WOODARD-2026
    - lever: capacity
      description: Scale of use at Benesch, with the vendor's summary claim
      figure: "almost 1,000 proposals; 34 marketing staff; nearly 400 technical staff; 'triple productivity in certain use cases'"
      measures: "Counts of proposals loaded and of users, as stated; the tripling claim has no stated measure"
      provenance: vendor-published
      source_ref: KANTIV-BENESCH-2026
  prerequisites:
    - "A consolidated set of past RFPs and proposals that practices are willing to share, with a tagging scheme someone owns (TRI-INSIDELEGALAI-2025)"
    - "A firm-specific taxonomy of services and project types; a vendor argues a generic assistant pointed at SharePoint lacks it (KANTIV-COPILOT-2026, vendor opinion)"
    - "Security and compliance review; Woodard & Curran says the tool met its cybersecurity standards (KANTIV-WOODARD-2026)"
  risks_and_guardrails:
    - "Ballard Spahr addresses privacy by building proprietary tools rather than using open public ones (TRI-INSIDELEGALAI-2025, key insights)"
    - "A repository is only as reliable as what is loaded: 74% of law firms in ikaun's survey have no single current source of truth for matter experience (IKAUN-BENCH-2026)"
    - "Selection committees are said to recognise generic AI output, so grounding in real project history matters (KANTIV-SMPSQ2-2026, vendor summary of the SMPS Q2 2026 report)"
    - "Project facts such as square footage or contract value should be checked against the system of record; a vendor claim about general assistants (KANTIV-COPILOT-2026)"
  human_checkpoints:
    - "Practice groups and lawyers decide what to reuse and edit the response for the client (TRI-INSIDELEGALAI-2025)"
    - "First drafts are checked against RFP requirements and reviewed by the marketing team (KANTIV-BENESCH-2026)"
  role_evolution: >-
    A practice group (IP) took more ownership of its own RFPs while drawing on firm-wide knowledge
    (TRI-INSIDELEGALAI-2025). Technical staff pulled into a proposal at short notice can draft a technical approach
    themselves, and marketing is asked less for old language (KANTIV-BENESCH-2026; KANTIV-ROBINS-2026).
  evidence_grade: B
  sources:
    - { ref: TRI-INSIDELEGALAI-2025, title: "Beyond legal practice: How GenAI is transforming law firm business operations", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en-us/posts/technology/inside-legal-ai-genai-transformation/", date: "2025-12-15", access: full, locator: "Use case 1: RFP repository; key insights" }
    - { ref: KANTIV-BENESCH-2026, title: "Benesch's Pursuit AI Evolution: Smarter Search, Faster Content and Greater Efficiency", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/case-study/beneschs-ai-evolution-smarter-search-faster-content-and-greater-efficiency", date: "2026-06", access: full, locator: "Summary; The Result" }
    - { ref: KANTIV-WOODARD-2026, title: "How Kantiv Transformed Pursuit Management at Woodard & Curran", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/case-study/a-strategy-to-streamline-how-kantiv-transformed-proposal-management-at-woodard-curran", date: "2026-06", access: full, locator: "The Result, items 1-2" }
    - { ref: KANTIV-ROBINS-2026, title: "Robins & Morton: Unlocking Institutional Knowledge with Kantiv", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/case-study/robins-morton-unlocking-institutional-knowledge-with-kantiv", date: "2026-06", access: full, locator: "The Result" }
    - { ref: KANTIV-SMPSQ2-2026, title: "What the SMPS Q2 AI Report Means for AEC Pursuit Teams", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/smps-q2-ai-report", date: "2026-07-13", access: full, locator: "findings list" }
    - { ref: KANTIV-COPILOT-2026, title: "Custom Copilot Agents: What it actually takes to build agents that can handle pursuits", publisher: Kantiv, type: vendor, url: "https://www.kantiv.com/blog/copilot-custom-agent-for-aec-proposals", date: "2026-09-26", access: full, locator: "Four Critical Gaps" }
    - { ref: IKAUN-BENCH-2026, title: "ikaun Releases The State of Winning Work in Law Firms: A 2026 Benchmark Report", publisher: ikaun, type: survey, url: "https://www.ikaun.com/news/ikaun-releases-the-state-of-winning-work-in-law-firms-a-2026-benchmark-report", date: "2026-07-14", access: full, locator: "paragraphs 3-5" }
  last_reviewed: "2026-10-19"
  notes: >-
    Firm kinds: law (Ballard Spahr) and engineering (Benesch, Woodard & Curran); Robins & Morton is a construction
    contractor (adjacent) and its award-entry figure (30 hours to 6) is a quote not used as an outcome. Ballard Spahr's
    speaker also said the IP department, the smallest, had the highest RFP win rate; the article does not say AI caused
    this and gives no figure. The Kantiv case-study pages carry the same metadata date (2026-06-20), so first
    publication may be earlier. Experience and expertise location as a knowledge asset is
    professional-services-knowledge-management-04. Merged from discourse-01 and practice-02.

- id: professional-services-pursuit-proposals-03
  title: Pitchbooks, proposals and CVs generated from structured bio, matter-experience and CV data
  archetype: professional-services
  module: pursuit-proposals
  function: sales-marketing-bd
  work_types: [document-production, data-reporting]
  pattern: bulk-transformation
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Pitches are assembled by hand from Word bios, practice overviews and matter lists; bios drift from the website,
    experience sits in spreadsheets and consultants' CVs go stale. In ikaun's 2026 law-firm survey only 7% said it is
    'very easy' to find relevant experience for a proposal and a third said experience data is not centralised at all (IKAUN-BENCH-2026).
  solution: >-
    An experience-management platform holds bios, matter experience, CVs and project history as structured data fed
    from the website, finance and HR systems, and generates pitches, proposals and CVs from templates. Law firms Gordon
    Rees Scully Mansukhani (GRSM), Stinson and Gowling WLG, IT consultancy Neudesic and engineering-design firm Arup use
    one such platform (ikaun); GRSM also loads an approved-answer library and uses an Answer Agent for RFPs. People then
    tailor the generated draft. An ABA article says many firms review prior submissions and extract relevant experience
    and formatting this way.
  outcomes:
    - lever: speed
      description: >-
        GRSM's marketing manager says proposal generation time fell by more than half in the first quarter after
        go-live (November 2025), across about 60 proposals; pitches that took up to an hour now take minutes.
      figure: "more than 50% reduction; about 60 proposals; up to an hour to minutes"
      measures: >-
        Proposal generation time as stated by GRSM's Marketing Manager; baseline and method not given. The firm handles
        about 200 pitchbooks and RFPs a year
      provenance: self-reported
      source_ref: IKAUN-GRSM-2026
    - lever: speed
      description: Neudesic's listed reductions in resume and proposal preparation time
      figure: "75% (resumes) and 50% (proposals)"
      measures: "Resume and proposal preparation time, stated in the solutions list; the source does not say whether these are results or goals"
      provenance: vendor-published
      source_ref: IKAUN-NEUDESIC-2026
    - lever: quality
      description: Arup says its CV platform doubled the time bid teams can spend tailoring CVs
      figure: "doubled tailoring time; over 12,000 professionals engaged; about 7,000 CVs; more than 10,000 bids a year"
      measures: "Tailoring time has no stated baseline; 12,000 counts professionals who actively engaged (Arup has over 18,000)"
      provenance: vendor-published
      source_ref: IKAUN-ARUP-2026
  prerequisites:
    - "Data clean-up: GRSM consolidated about 22 hearing-type values in a trial spreadsheet of over 1,100 matters before import (IKAUN-GRSM-2026)"
    - "Feeds from source systems: website bios (GRSM), the finance system (Stinson), HR and billing data (Neudesic) (IKAUN-GRSM-2026; IKAUN-STINSON-2026; IKAUN-NEUDESIC-2026)"
    - "A refresh cadence: Neudesic set quarterly consultant updates with automated reminders; Arup built use into appraisals, onboarding and reviews (IKAUN-NEUDESIC-2026; IKAUN-ARUP-2026)"
    - "Clearance for credentials drawn from matter information; confidentiality duties extend to former and prospective clients (ABA-OP512-2024, p.6)"
  risks_and_guardrails:
    - "GRSM says verification remains important; it flags confidential trial data and keeps a pitch-specific practice overview with experience not published on the web (IKAUN-GRSM-2026)"
    - "ABA Formal Opinion 512 notes that using information developed in one representation to inform another may breach duties to current and former clients (ABA-OP512-2024, p.2 n.4)"
    - "Verify success stories, awards and accolades, and check compiled bios do not pull out-of-date information (ABA-LPMAI-2026, Cautions)"
    - "Much of this is data-driven document generation: the Arup page does not claim AI, while ikaun labels parts of its product AI-powered (IKAUN-ARUP-2026; IKAUN-NEUDESIC-2026)"
  human_checkpoints:
    - "Lawyers and consultants maintain their own experience entries; talent managers customise resumes (IKAUN-NEUDESIC-2026)"
    - "The team tailors the generated draft to the opportunity (IKAUN-GRSM-2026)"
    - "A lawyer or practice lead confirms each matter reference is accurate and cleared for use (ABA-LPMAI-2026, Cautions)"
  role_evolution: >-
    GRSM says proposal work once concentrated in a small group is now spread more evenly across the team; Stinson's
    proposal and experience manager oversees content governance and data (IKAUN-GRSM-2026; IKAUN-STINSON-2026). An ABA
    article says proposal teams spend less time searching and more time tailoring (ABA-LPMRFP-2026).
  evidence_grade: B
  sources:
    - { ref: IKAUN-GRSM-2026, title: "ikaun Helps Am Law 100 Firm GRSM Cut Proposal Time by 50% in Four Months (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/ikaun-helps-am-law-100-firm-grsm-cut-proposal-time-by-50-in-four-months", date: "2026", access: full, locator: "The BD Problem at Scale; Implementation; Results" }
    - { ref: IKAUN-NEUDESIC-2026, title: "ikaun Transforms Sales Operations and Redefines Efficiencies for Neudesic (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/ikaun-transforms-sales-operations-and-redefines-efficiencies-for-neudesic", date: "2026", access: full, locator: "Solutions powered by ikaun; Results and Next Steps" }
    - { ref: IKAUN-ARUP-2026, title: "Leveraging Global Capability through Arup People (case study; undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/leveraging-global-capability-through-arup-people", date: "2026", access: full, locator: "Implementation + Rollout; Results" }
    - { ref: IKAUN-STINSON-2026, title: "Winning More Time for Strategy: How Stinson is Transforming RFP and Proposal Responses with ikaun (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/winning-more-time-for-strategy-how-stinson-is-transforming-rfp-and-proposal-responses-with-ikaun", date: "2026", access: full, locator: "Background; Results" }
    - { ref: IKAUN-GOWLING-2026, title: "ikaun's World Class Experience Management Solution Drives Business Value Throughout Global Law Firm, Gowling WLG (page undated)", publisher: ikaun, type: vendor, url: "https://www.ikaun.com/case-studies/ikauns-world-class-experience-management-solution-drives-business-value-throughout-global-law-firm-gowling-wlg", date: "2026", access: full, locator: "Challenges; Results" }
