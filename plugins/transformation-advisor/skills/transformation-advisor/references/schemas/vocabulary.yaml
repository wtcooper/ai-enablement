# Controlled vocabulary for the transformation advisor (spec §6).
# Single source of truth for ids used in plans, opportunities and use cases.
# scripts/validate.py reads this file; research/briefs/templates/vocabulary.md mirrors it for researchers.

work_types:
  - review-assurance
  - transaction-processing
  - expert-judgment
  - research-synthesis
  - document-production
  - client-interaction
  - coordination-scheduling
  - data-reporting
  - software-systems
  - physical-field

patterns:
  - intake-triage
  - document-to-decision
  - research-brief
  - draft-review-loop
  - full-population-testing
  - monitor-diagnose-act
  - reconcile-exceptions
  - service-agent-escalation
  - grounded-knowledge-assistant
  - end-to-end-case-agent
  - bulk-transformation
  - other

# How much the AI does (autonomy).
ladder: [assist, augment, automate, delegate]
# What changes: one step, the whole process, or the business / service / operating model.
change_scope: [step, process, model]
# The four Reimagine lenses are conversation prompts that map onto ladder + change_scope:
#   improve the step  = assist|augment, step
#   automate the flow = automate, step|process
#   delegate the outcome = delegate, process
#   reinvent the work = any ladder, model (or a process that stops existing)

runtime_classes:
  - personal-assistant
  - shared-team-skills
  - workflow-automation
  - background-agent
  - managed-agent-runtime

maturity: [in-production, piloting, announced, emerging]
evidence_grades: [A, B, C, D]
# Who measured an outcome figure.
provenance: [self-reported, vendor-published, independent]
# Whether a source was opened and read, or seen only in search results.
access: [full, search-only]
value_levers: [capacity, speed, quality, growth, cost, risk, experience]

source_types:
  - conference
  - regulator
  - standard-setter
  - professional-body
  - firm
  - vendor
  - academic
  - survey
  - press
  - podcast
  - community
  - job-posting

functions:
  - strategy-planning
  - sales-marketing-bd
  - product-service-development
  - service-delivery
  - customer-service
  - people-hr
  - technology-it
  - finance-accounting
  - procurement-supply-chain
  - risk-compliance-legal

journey_stages: [curious, experimenting, adopting, scaling, ai-native]
