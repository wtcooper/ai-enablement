- id: assurance-completion-reporting-16
  title: "Idea: an LLM checks XBRL tagging and cross-document consistency in filed statements (benchmark research)"
  archetype: assurance
  module: completion-reporting
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Fieldguide says tagging errors, such as sign flips on credit balances and custom tags where a standard tag
    existed, still draw SEC comments, and that one person should own the tagging review; auditors do not attest the
    XBRL in that setting. The benchmark authors frame XBRL filings as a structured extraction and reasoning problem
    across concepts, taxonomy relations and documents.
  solution: >-
    FinAuditing, a benchmark of 1,102 instances built from real XBRL filings (averaging over 33,000 tokens each),
    tests whether LLMs can match concepts, extract taxonomy relations and reason mathematically across documents.
  outcomes:
    - lever: quality
      description: "Thirteen models showed substantial gaps in concept retrieval, taxonomy-aware relation modelling and consistent cross-document reasoning"
      figure: "1,102 instances; 13 models; no headline score in the abstract"
      measures: "Count of annotated benchmark instances and models evaluated; per-task scores not read."
      provenance: independent
      source_ref: ARXIV-FINAUDITING-2025
  prerequisites:
    - "Filings in XBRL with a taxonomy the tool can use (ARXIV-FINAUDITING-2025)."
  risks_and_guardrails:
    - "Current models fail on cross-document reasoning in the benchmark; the authors call for realistic, structure-aware benchmarks (ARXIV-FINAUDITING-2025)."
  human_checkpoints:
    - "A named reviewer owns the tagging review (FIELDGUIDE-DISC-2026)."
  role_evolution: "Not described in the sources."
  evidence_grade: D
  sources:
    - {ref: ARXIV-FINAUDITING-2025, title: "FinAuditing: A Financial Taxonomy-Structured Multi-Document Benchmark for Evaluating LLMs", publisher: "arXiv (accepted at SIGIR 2026 Resource Track)", type: academic, url: "https://arxiv.org/abs/2510.08886", date: "2025-10-10", access: full, locator: "abstract; last revised 2026-05-17"}
    - {ref: FIELDGUIDE-DISC-2026, title: "The 2026 audit disclosure checklist: What to add, and where judgment takes over", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/audit-disclosure-checklist-2026", date: "2026-08-06", access: full, locator: "section 'XBRL'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (research only). The Fieldguide piece describes human review of tagging and does
    not propose AI for it.

- id: assurance-completion-reporting-17
  title: "Idea: a reviewing agent checks the preparing agent's work before the human reviewer and partner sign"
  archetype: assurance
  module: completion-reporting
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    As agents prepare more of the file, human review becomes the bottleneck and the main control.
  solution: >-
    The AICPA practice aid (13 October 2026) says one AI tool may be used to help the auditor evaluate whether another
    is performing correctly, without reducing supervision and review duties. The FRC guidance lists 'critic' among
    an LLM's roles and says reviews may be done by humans, other LLMs or rules-based protocols. A DataSnipper
    conference panel asked what a human attests to when one agent prepares, another reviews and a person signs.
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "No measurement found."
      provenance: independent
      source_ref: AT-AICPAPA-2026
  prerequisites:
    - "A defined audit methodology the agents run inside, with traceable outputs."
    - "Evaluation sets showing the reviewer agent catches what a person would."
  risks_and_guardrails:
    - "The second tool does not take the place of the auditor's supervision and review (AT-AICPAPA-2026)."
    - "In DataSnipper's survey of 200+ audit and finance professionals, 80% were comfortable with AI extracting data and 38% with AI signing off (DATASNIPPER-AIREPORT-2026)."
    - "A reviewer agent built on similar models may share the first agent's blind spots; no source tests this."
  human_checkpoints:
    - "The human reviewer and partner still sign (AT-AICPAPA-2026; DATASNIPPER-CONNECT-2026)."
  role_evolution: >-
    On the ICAEW podcast, Grant Thornton's director of audit and professional standards expected AI reviewing 'a few
    years down the line' (ICAEW-POD-2025).
  evidence_grade: D
  sources:
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph beginning 'The guidance also said that, in an audit of financial statements, one AI tool may be used'"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "table of LLM roles; mitigations (human in the loop review)"}
    - {ref: KN-FRC-2026, title: "Navigating Generative and Agentic AI: The FRC's Latest Expectations for Auditors", publisher: "Kingsley Napley", type: press, url: "https://www.kingsleynapley.co.uk/insights/blogs/regulatory-blog/navigating-generative-and-agentic-ai-the-frcs-latest-expectations-for-auditors", date: "2026-04-22", access: full, locator: "mitigations list, first item (reviews by humans, other LLMs or rules-based protocols)"}
    - {ref: DATASNIPPER-CONNECT-2026, title: "The 6 Biggest Takeaways from DataSnipper Connect New York 2026", publisher: "DataSnipper", type: conference, url: "https://www.datasnipper.com/resources/the-6-biggest-takeaways-from-datasnipper-connect-new-york-2026", date: "2026-09", access: full, locator: "2026 audit trends panel section"}
    - {ref: DATASNIPPER-AIREPORT-2026, title: "2026 AI Report: Everyone says AI is essential. Almost no one has embedded it.", publisher: "DataSnipper", type: survey, url: "https://www.datasnipper.com/resources/ai-report-2026-ai-in-audit-and-finance", date: "2026-06", access: full, locator: "landing-page summary of findings; month approximate"}
    - {ref: ICAEW-POD-2025, title: "Behind the Numbers: How should audit firms use AI? (transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "section 'Understanding explainability and the need for human oversight'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (D). Discussed by a standard-setter's practice aid, a regulator and practitioners, but no
    named deployment was found. The DataSnipper survey is a vendor survey; its sample method is not stated beyond
    '200+ audit and finance professionals'. The AICPA practice aid itself is behind a login; its content here comes
    from Accounting Today's quotation.

- id: assurance-completion-reporting-18
  title: "Idea: an agent completes and reviews staff-level workpapers across the engagement file (benchmark research)"
  archetype: assurance
  module: completion-reporting
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    Preparing and cleaning up workpapers consumes staff time before a reviewer can look at the file, and limited
    access to proprietary audit data has constrained measurement of where agents can be relied on.
  solution: >-
    FinancialAuditBench sets 90 workpaper completion and review tasks across six synthetic engagements (about 179
    files each) and evaluates eleven frontier models. Caseware has a Document Intelligence Agent in closed beta that
    extracts information from source documents into workpapers.
  outcomes:
    - lever: quality
      description: "Agents completed substantial portions of staff-level tasks well but sometimes performed inappropriate procedures or produced incorrect documentation"
      figure: "90 tasks; 6 engagements of about 179 files; 11 models; no score in the abstract"
      measures: "Counts of benchmark tasks, synthetic engagements, average files per engagement and models evaluated."
      provenance: independent
      source_ref: ARXIV-FAB-2026
  prerequisites:
    - "Firm-specific evaluation sets, since a public synthetic benchmark does not show performance on the firm's own files."
  risks_and_guardrails:
    - "Inappropriate procedures and incorrect documentation are the failure modes named (ARXIV-FAB-2026)."
  human_checkpoints:
    - "Professional review remains necessary where agents are not reliable (ARXIV-FAB-2026, abstract)."
  role_evolution: >-
    Fieldguide argues that review, not preparation, becomes the core of the job and that review hours rise at first
    (FIELDGUIDE-REVIEW-2026); a vendor argument, not measured.
  evidence_grade: D
  sources:
    - {ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors", publisher: "arXiv 2609.32835", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "abstract"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: "Caseware", type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "paragraph on the Document Intelligence Agent, in closed beta"}
    - {ref: FIELDGUIDE-REVIEW-2026, title: "Review Is the New Prepare: The Auditor's Job in an Agent-First World", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/review-is-the-new-prepare", date: "2026-07-29", access: full, locator: "paragraphs 5-6 (review hours) and the developmental-objection section; on-page date label"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea (D). The benchmark's tasks are generic workpaper tasks, not
    completion-stage steps, and the engagements are synthetic (built from differentially private statistics of
    historical audits); no real engagement was tested.
