- id: assurance-soc-attestation-12
  title: Flagging templated SOC reports by comparing language and tests across reports (vendor-announced; peer-review use is an idea)
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Templated, look-alike reports are hard to spot one engagement at a time. After the Delve allegations (denied by
    Delve), Whistic told buyers that a report is the start of a conversation, not the end of one, and to ask vendors
    for operational answers that templates cannot produce.
  solution: >-
    Whistic says its AI surfaces overly uniform language, thin operational detail and gaps between policy and
    questionnaire answers, and that its bulk assessment reaches a whole vendor portfolio with targeted questions.
    AICPA peer reviewers, when risk is elevated, may compare about five engagements from different partners for
    identical risk assessments, sample sizes and procedures; that is a manual procedure. An anonymous investigator
    ran text-frequency analysis across a leaked set of one vendor's reports. No source says AI performs the
    peer-review comparison; using it there is an idea.
  outcomes:
    - {lever: risk, description: "No detection rate or false-positive figure was found", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: WHISTIC-DELVE-2026}
    - {lever: quality, description: "No finding rates for SOC engagements at national level; two state administering-entity reports for 2025 show zero SOC engagements reviewed", figure: "0 SOC engagements reviewed (Oregon; Louisiana)", measures: "SOC 1 and SOC 2 rows (Oregon) and SOC Reports row (Louisiana) in 2025 peer review activity reports; not an AI result", provenance: independent, source_ref: OSCPA-PR-2026}
  prerequisites:
    - "Access to several reports from the same firm, or a vendor inventory with the named auditor and report period for each report"
    - "A tiering of vendors by risk; a clean report from a credible auditor may be enough for low-risk vendors (WHISTIC-DELVE-2026)"
  risks_and_guardrails:
    - "The JofA links the May 2026 reviewer alert to a Peer Review Board decision, but the Reviewer Alert page says its content is not approved by the Board and is not 'other guidance' (JOFA-PRB; AICPA-REVALERT-2026)"
    - "A secondary summary stresses that the alert is not a finding against compliance platforms and does not invalidate issued reports (CYBERSECIFY-2026)"
    - "Analysis of a leaked set of reports by an anonymous author is not independent evidence, and the vendor disputes it (DEEPDELVER-2026)"
    - "Buyer checklists that flag audit firms named in the allegations rest on unproven claims that are denied (WHISTIC-DELVE-2026)"
    - "A clean report does not answer every risk question; a report with findings can say more (KPMG-CHECKBOX-2026, p.5)"
  human_checkpoints:
    - "Vendor-risk analyst decides on follow-up; higher-risk vendors get a conversation and an operational answer to a specific control question (WHISTIC-DELVE-2026)"
    - "Peer review team captain decides whether elevated risk exists; the reviewer decides whether an engagement is nonconforming (JOFA-PRB)"
  role_evolution: >-
    KPMG says the responsibility for assessing report quality rests with the vendor-risk function: receiving a report
    is the beginning of due diligence (KPMG-CHECKBOX-2026, p.5). Peer reviewers of firms with SOC 2 practices are
    asked to understand the firm's use of technology, timelines and tailoring (JOFA-PRB).
  evidence_grade: C
  sources:
    - {ref: WHISTIC-DELVE-2026, title: "Your Vendor Has a SOC 2 Report. Now What?", publisher: Whistic, type: vendor, url: "https://www.whistic.com/resources/blog/your-vendor-has-a-soc-2-report-now-what", date: "2026-03", access: full, locator: "'How Whistic helps'; 'What to do right now'"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14", access: full, locator: "sections 'Responding when elevated risks are identified' and 'A new monitoring and outreach process'"}
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01", access: full, locator: "quote by Terry O'Brien (Schellman) on comparing five reports"}
    - {ref: DEEPDELVER-2026, title: "Delve - Fake Compliance as a Service - Part I (anonymous allegations; unverified)", publisher: "DeepDelver (pseudonymous Substack)", type: community, url: "https://deepdelver.substack.com/p/delve-fake-compliance-as-a-service", date: "2026-03-19", access: full, locator: "section 5, analysis of leaked reports"}
    - {ref: AICPA-REVALERT-2026, title: "Reviewer Alert, combined editions February 2021 to September 2026 (landing page; content behind free login, not read)", publisher: "AICPA & CIMA Peer Review Program", type: standard-setter, url: "https://www.aicpa-cima.com/resources/article/reviewer-alert", date: "2026-09-23", access: full, locator: "disclaimer on the landing page"}
    - {ref: CYBERSECIFY-2026, title: "AICPA Flags Cookie-Cutter SOC 2 as Nonconforming", publisher: "Cybersecify (penetration-testing vendor)", type: vendor, url: "https://cybersecify.com/blog/aicpa-nonconforming-soc2-peer-review-2026/", date: "2026-08-22", access: full, locator: "'What this does not mean'"}
