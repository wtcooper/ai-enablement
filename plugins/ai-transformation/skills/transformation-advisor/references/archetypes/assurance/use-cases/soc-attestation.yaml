  last_reviewed: "2026-10-17"
  notes: >-
    Graded C on Whistic's vendor claim (announced; no named user). The peer-review use of AI comparison remains an
    idea. General AI review of received SOC reports (scope, deviations, CUECs) is assurance-controls-testing-13.
    Louisiana's report (LASCPA-PR-2026) also shows 0 SOC reports reviewed.

- id: assurance-soc-attestation-13
  title: Platform-curated auditor networks and audit hubs that route SOC buyers to audit firms
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: intake-triage
  ladder: assist
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Examination timelines slip on evidence requests, access provisioning and coordination between the service
    organisation and the auditor. Buyers increasingly reach SOC 2 through tool vendors, which now dominate online
    search for SOC 2 services.
  solution: >-
    Platforms run an auditor portal with scoped access and comments and keep a list of audit-firm partners. Vanta
    says more than 100 audit firms work with it, describes an integrated auditor portal that limits evidence to what
    auditors need, and says it works with a trusted network of audit firms or an organisation's own auditor. Drata
    describes a partner ecosystem with quality expectations and the ability to remove firms, and says it has never
    bundled audits. The AICPA SOC 2 Working Group chair describes vendors acting as a front door for SOC 2, some
    cultivating firm networks.
  outcomes:
    - {lever: growth, description: "Audit firms and audits on Vanta's partner page", figure: "100+ audit firms; 26,000+ audits", measures: "audit firms working with Vanta and audits completed through it, as stated by Vanta", provenance: vendor-published, source_ref: VANTA-AUDITORS-2026}
    - {lever: speed, description: "A-LIGN's strategic alliances lead says organizations using Vanta cut audit completion time", figure: "50%", measures: "reduction in audit completion time, stated by an A-LIGN executive in a quote on Vanta's page; method not stated", provenance: vendor-published, source_ref: VANTA-AUDITORS-2026}
  prerequisites:
    - "Auditor selected on independence from the platform"
    - "Written clarity on who owns scope, sampling and drafting"
  risks_and_guardrails:
    - "Cross-referral concentration between a tool provider and a CPA firm is a named independence threat (JOFA-SOCETH-2026)"
    - "Peer reviewers are told to look at the firm's use of external SOC platforms and the reasonableness of timelines (JOFA-PRB)"
    - "A customer that left Delve said it assessed the new auditor's independence from its GRC platform before signing (WISPR-2026)"
    - "Drata states four pillars (independence, quality over speed, oversight of its audit ecosystem, transparency about who the auditor is); these are vendor statements (DRATA-INTEGRITY-2026)"
  human_checkpoints:
    - "Buyer asks the CPA, in writing, about referral or revenue arrangements with the platform (SOC2AUD-DELVE-2026 buyer checklist)"
    - "The CPA firm sets scope, sampling and fee"
  role_evolution: >-
    Vanta says in-platform collaboration replaces email chains between client and auditor (VANTA-AUDITORS-2026).
    Drata is hiring an alliances manager for enterprise audit firms (DRATA-JOBS-2026). The sources give no headcount
    effects.
  evidence_grade: B
  sources:
    - {ref: VANTA-AUDITORS-2026, title: "Vanta for Auditors: Become a Vanta auditor (partner page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/partners/auditors", date: "2026-10", access: full, locator: "'100+ audit firms' and '26,000+ audits' statistics; 'Integrated auditor workflows'; the A-LIGN quote"}
