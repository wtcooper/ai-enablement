# Use cases: assurance / soc-attestation
# Source refs are canonical keys: documents already cited in controls-testing.yaml keep that file's key (EY-SOC,
# JOFA-FAST, JOFA-PRB, JOFA-PODSOC, SD-TQA, CSA-SOC2, IANS-DELVE). Figures are self-reported or vendor-published unless a note says otherwise.
# SOC testing, SOC-cycle drafting, reading vendor SOC reports, platform-fed examiners and evidence-fabrication
# screening already live in controls-testing (assurance-controls-testing-11, assurance-controls-testing-12, assurance-controls-testing-13,
# assurance-controls-testing-14, assurance-controls-testing-23) and are not repeated.
# Everything about Delve is allegation: Delve denies it and no regulator finding exists.
# Sources checked 2026-10-17: every cited URL was opened and checked against the claims.
# Entries 17-18 added 2026-10-21 (wave 6, mid-market): the AICPA and AIUC joint SOC 2 plus AIUC-1 offering, and a
# regional firm pairing AI governance advisory with its SOC practice.

- id: assurance-soc-attestation-01
  title: AI support for client acceptance, sample selection and scheduling of concurrent audits at a SOC specialist firm
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [coordination-scheduling, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A SOC practice must decide which engagements to accept, select samples, and schedule many concurrent audits.
  solution: >-
    Linford & Company, an IT-audit specialist firm, says it uses AI for client acceptance, sampling of results and
    scheduling concurrent audits, alongside report review (see -09). The post gives no detail on tools or methods.
  outcomes:
    - {lever: quality, description: "Firm says the uses make audits more thorough, not faster", figure: "none published", measures: "n/a (opinion statement by the firm)", provenance: self-reported, source_ref: LINFORD-ASSURE-2026}
  prerequisites:
    - "Not stated in the source"
  risks_and_guardrails:
    - "The same post warns about low-cost audits with testing offshored to unqualified staff, no walkthroughs and no partner review of the report (LINFORD-ASSURE-2026)"
  human_checkpoints:
    - "Acceptance and sampling decisions remain with the firm (the post presents AI as a support)"
  role_evolution: "Not described in the source."
  evidence_grade: B
  sources:
    - {ref: LINFORD-ASSURE-2026, title: "AI Made Compliance Cheaper. It Didn't Make Assurance Cheaper.", publisher: "Linford & Company", type: firm, url: "https://linfordco.com/blog/ai-compliance-vs-assurance/", date: "2026-09-23", access: full, locator: "section 'What Actually Got Cheaper'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': AI decision support across acceptance, sampling and scheduling, which the source lists in one
    sentence; split if a firm gives separate detail. Acceptance and independence questions belong to the
    acceptance-independence module. The post cites 2025 PCI Security Standards Council guidance that an AI system
    cannot act as assessor; that guidance was not opened.

- id: assurance-soc-attestation-02
  title: Compliance platforms draft policies, risk assessments and system descriptions for SOC 2 preparers
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    A service organisation preparing for a first SOC 2 must write policies, a risk assessment, control narratives and
    a system description (the "Section 3" description of the system being examined, which management owns). Generic
    templates produce look-alike documents.
  solution: >-
    Platforms supply policy templates and predefined risk-assessment questions. Vanta's agent drafts tailored policies
    and compares policies with what is happening in the environment, and Vanta's comparison page describes an
    auto-generated SOC 2 system description. Comp AI says its AI learns a company's stack, processes and risk tolerance to
    generate policies and assessments specific to that company; its CEO says an agent may draft a policy but a person approves
    it. Management is expected to edit the drafts.
  outcomes:
    - {lever: speed, description: "Comp AI's home page promises 'Compliance in days' and 'SOC 2 audit-ready in weeks'", figure: "not quantified beyond the slogans", measures: "not defined on the page; no customer, baseline or sample", provenance: vendor-published, source_ref: COMPAI-2026}
    - {lever: speed, description: "Vanta's page describes auto-generation of the system description and policy support; no time saving stated", figure: "none published", measures: "no figure in source", provenance: vendor-published, source_ref: VANTA-VS-2026}
  prerequisites:
    - "Platform access to the company's systems to read its configuration"
    - "Management reviews and adapts every draft to its own services and risks"
  risks_and_guardrails:
    - "Templated policies and predefined risk questions may not cover a client's own industry risks, so significant risks can go unidentified (LINFORD-FAQ-2022)"
    - "The AICPA SOC 2 Working Group chair raises templated, look-alike reports as a quality concern (JOFA-FAST)"
    - "Delve says its templates, such as board-meeting notes, are starting points and not pre-filled evidence; anonymous allegations, which Delve denies, say customers adopted templates as evidence of processes that did not happen (TC-DELVEYC-2026, TC-DELVE-2026, DEEPDELVER-2026)"
    - "Tool-provider involvement in the examination can create self-interest or undue-influence threats for the CPA (JOFA-SOCETH-2026)"
  human_checkpoints:
    - "A person reviews and approves each draft policy (TC-COMPAI-2026)"
    - "Management owns and adopts the description and assertion"
    - "The service auditor tests whether the description fairly presents the system and whether controls operate, not whether a policy exists"
  role_evolution: >-
    Readiness consultants and preparers move from drafting to adapting and challenging generated text; the sources
    describe no headcount change. Vanta presents its agent as a GRC engineer the customer never had to hire
    (VANTA-AI-2026).
  evidence_grade: C
  sources:
    - {ref: VANTA-AI-2026, title: "Vanta AI: Your 24/7 GRC engineer for security and compliance (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/ai", date: "2026-10", access: full, locator: "'Policies and practices in sync'"}
    - {ref: VANTA-VS-2026, title: "Vanta vs. Drata vs. Delve", publisher: Vanta, type: vendor, url: "https://vanta.com/resources/vanta-vs-drata-vs-delve", date: "2026-03-22", access: full, locator: "audit-readiness and AI sections (competitor claims are marketing)"}
    - {ref: COMPAI-2026, title: "Comp AI: AI compliance software for SOC 2, ISO 27001 and HIPAA (home page)", publisher: Comp AI, type: vendor, url: "https://trycomp.ai/", date: "2026-10", access: full, locator: "hero; 'How it works' steps 1-2"}
    - {ref: TC-COMPAI-2026, title: "Comp AI sets eyes on a continuously agentic future for security and compliance", publisher: TechCrunch, type: press, url: "https://techcrunch.com/2026/09/17/comp-ai-sets-eyes-on-a-continiously-agentic-future-for-security-and-complaince/", date: "2026-09-17", access: full, locator: "paragraphs quoting the CEO on human approval"}
    - {ref: LINFORD-FAQ-2022, title: "AICPA FAQs on SOC 2 Automation Tools: Insights from an Auditor", publisher: "Linford & Company", type: firm, url: "https://linfordco.com/blog/soc-2-automation-tools-aicpa-faqs", date: "2022-06-15", access: full, locator: "section on risks of SOC 2 automation tools"}
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01", access: full, locator: "section 'What's the issue?'"}
    - {ref: TC-DELVEYC-2026, title: "Embattled startup Delve has 'parted ways' with Y Combinator", publisher: TechCrunch, type: press, url: "https://techcrunch.com/2026/04/04/embattled-startup-delve-has-parted-ways-with-y-combinator/", date: "2026-04-04", access: full, locator: "paragraph on templates as starting points"}
    - {ref: TC-DELVE-2026, title: "Delve accused of misleading customers with 'fake compliance'", publisher: TechCrunch, type: press, url: "https://techcrunch.com/2026/03/21/delve-accused-of-misleading-customers-with-fake-compliance/", date: "2026-03-21", access: full, locator: "Delve's response paragraphs"}
    - {ref: DEEPDELVER-2026, title: "Delve - Fake Compliance as a Service - Part I (anonymous allegations; unverified)", publisher: "DeepDelver (pseudonymous Substack)", type: community, url: "https://deepdelver.substack.com/p/delve-fake-compliance-as-a-service", date: "2026-03-19", access: full, locator: "opening summary of allegations"}
    - {ref: JOFA-SOCETH-2026, title: "SOC engagements: Ethics risks with tool providers", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/apr/soc-engagements-ethics-risks-with-tool-providers/", date: "2026-04-06", access: full, locator: "section 'Common threats'"}
  last_reviewed: "2026-10-17"
  notes: >-
    General-purpose AI drafting of Section 3 and of management responses to deviations is
    assurance-controls-testing-12 (EY poll: 45% and 41% of attendees); this entry covers drafts generated inside
    compliance platforms. Comp AI raised a $34M Series A on 17 Sep 2026 (TechCrunch) and says its software does not
    replace independent audit review.

- id: assurance-soc-attestation-03
  title: AI-generated remediation of failing controls before the examination, with expert approval
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [software-systems]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Readiness work surfaces failing tests (misconfigured access, missing encryption), and engineers must fix them
    before the observation period (the period a Type 2 report covers).
  solution: >-
    Vanta's agent generates remediation snippets for tools such as Terraform, AWS CLI and CloudFormation; Secureframe
    sells 'Comply AI for Remediation'. Oneleet says its AI fixes gaps and an expert approves every fix before it
    counts as done.
  outcomes:
    - {lever: speed, description: "No outcome measure published for remediation specifically", figure: "none published", measures: "n/a", provenance: vendor-published, source_ref: VANTA-AI-2026}
  prerequisites:
    - "Integration with the cloud and code environment"
    - "Engineers who can apply and approve changes"
  risks_and_guardrails:
    - "Oneleet routes every fix to an expert so that 'green' means verified, not just marked done (ONELEET-2026)"
    - "Linford, a SOC audit firm, writes from its own experience that tools 'can't remediate controls for clients'; clients still need to do that (LINFORD-FAQ-2022)"
    - "Allegations about fabricated evidence at another platform, which that company denies, show the risk of marking controls as done without operating evidence (TC-DELVE-2026)"
  human_checkpoints:
    - "Engineer or expert approves each change (ONELEET-2026)"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: VANTA-AI-2026, title: "Vanta AI: Your 24/7 GRC engineer for security and compliance (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/ai", date: "2026-10", access: full, locator: "'Faster remediation'"}
    - {ref: SECUREFRAME-2026, title: "Secureframe: build trust, unlock growth (home page)", publisher: Secureframe, type: vendor, url: "https://secureframe.com/", date: "2026-10", access: full, locator: "AI section ('Comply AI for Remediation')"}
    - {ref: ONELEET-2026, title: "Oneleet: security-first compliance (home page)", publisher: Oneleet, type: vendor, url: "https://www.oneleet.com/", date: "2026-10", access: full, locator: "'How it works'"}
    - {ref: LINFORD-FAQ-2022, title: "AICPA FAQs on SOC 2 Automation Tools: Insights from an Auditor", publisher: "Linford & Company", type: firm, url: "https://linfordco.com/blog/soc-2-automation-tools-aicpa-faqs", date: "2022-06-15", access: full, locator: "sections on integrations and risks"}
    - {ref: TC-DELVE-2026, title: "Delve accused of misleading customers with 'fake compliance'", publisher: TechCrunch, type: press, url: "https://techcrunch.com/2026/03/21/delve-accused-of-misleading-customers-with-fake-compliance/", date: "2026-03-21", access: full, locator: "paragraph on fabricated-evidence allegations and Delve's response"}
  last_reviewed: "2026-10-17"
  notes: "Vendor descriptions only; no named customer outcome."

- id: assurance-soc-attestation-04
  title: AI mapping of controls, customer commitments and evidence across SOC 2 and other frameworks
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Service organisations hold several frameworks at once (SOC 2, ISO 27001, HIPAA and others), and customers write
    their own commitments into contracts. Mapping each to controls and collecting evidence again for each is
    repetitive and a place where scope gaps arise.
  solution: >-
    EY conference speakers say AI can compare an organisation's control data sets with frameworks, laws and
    regulations. Vanta says it supports 35+ frameworks with cross-mapping, and its November 2025 release describes a
    "Customer Commitments" feature that maps customer obligations to controls, plus AI-powered scoping for
    multi-entity organisations. A-LIGN's audit platform maps a client's existing evidence to additional frameworks
    and deduplicates requests. Wispr Flow's new audit, after it left Delve, is planned to cover SOC 2, HIPAA and ISO
    27001 with one auditor. The Cloud Security Alliance (CSA) describes "SOC 2+" reports that add further criteria to
    a SOC 2 examination.
  outcomes:
    - {lever: capacity, description: "A-LIGN's average hours saved when existing evidence is reused for an additional framework", figure: "about 15 hours per framework", measures: "hours saved per additional framework by reusing evidence, as stated by A-LIGN; basis and sample not stated", provenance: vendor-published, source_ref: ALIGN-ASCEND-2026}
    - {lever: growth, description: "Frameworks Vanta says it supports with cross-mapping", figure: "35+ frameworks", measures: "number of frameworks supported (comparison page); not time saved", provenance: vendor-published, source_ref: VANTA-VS-2026}
  prerequisites:
    - "A maintained control library and an inventory of customer commitments"
    - "Each framework's own scope and criteria confirmed with each auditor; evidence that meets the strictest framework"
  risks_and_guardrails:
    - "Standardised mappings may not reflect an organisation's own data flows and logic without configuration and interpretation (KPMG-CHECKBOX-2026, p.3)"
    - "Scope accuracy is a human decision; automation collects against whatever scope was defined, correctly or not (SCRUT-EVIDENCE-2026)"
    - "A SOC 2 report is an examination-level attestation covering one to five trust services categories, not a certification (JOFA-PODSOC)"
    - "ISO 42001 is a separate certification engagement; a SOC 2 or SOC 2+ report does not provide the certificate (SOC2AUD-AICOS-2026)"
  human_checkpoints:
    - "Management decides the scope and the controls to adopt"
    - "The auditor for each framework decides what evidence it accepts"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
    - {ref: EY-SOC, title: "How AI assurance builds trust with SOC, attestation and certification (14th annual EY SOC, Attestation and Certification Conference highlights)", publisher: EY, type: conference, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09", access: full, locator: "p.5, paragraph on framework and control mapping"}
    - {ref: VANTA-HNS-2025, title: "Vanta's Agentic Trust Platform redefines how enterprises earn, prove, and scale trust", publisher: "Help Net Security (Vanta release)", type: press, url: "https://www.helpnetsecurity.com/2025/11/19/vanta-agentic-trust-platform/", date: "2025-11-19", access: full, locator: "Organizations Center and Customer Commitments paragraphs"}
    - {ref: VANTA-VS-2026, title: "Vanta vs. Drata vs. Delve", publisher: Vanta, type: vendor, url: "https://vanta.com/resources/vanta-vs-drata-vs-delve", date: "2026-03-22", access: full, locator: "'Framework coverage' paragraph"}
    - {ref: ALIGN-ASCEND-2026, title: "A-SCEND: audit management platform with EvidenceIQ (product page)", publisher: A-LIGN, type: firm, url: "https://www.a-lign.com/a-scend", date: "2026-10", access: full, locator: "section 'Audit intelligence'"}
    - {ref: WISPR-2026, title: "Our path to a new, independent audit", publisher: "Wispr Flow (customer company blog)", type: firm, url: "https://wisprflow.ai/post/new-independent-audit", date: "2026-03-27", access: full, locator: "paragraphs 3-4"}
    - {ref: CSA-SOC2, title: "The SOC 2 AI Gap: Auditors Improvise Where AICPA Has Not Acted", publisher: "Cloud Security Alliance (AI Safety Initiative)", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-soc2-ai-controls-gap-20260830-csa-styled/", date: "2026-08-30", access: full, locator: "strategic considerations; SOC 2+ precedent"}
    - {ref: SCRUT-EVIDENCE-2026, title: "Automated evidence collection: How it actually works and where it fails", publisher: Scrut, type: vendor, url: "https://www.scrut.io/post/how-automated-evidence-collection-works", date: "2026-05-11", access: full, locator: "evidence-quality table; steps 2-4"}
    - {ref: KPMG-CHECKBOX-2026, title: "Beyond the Checkbox: How Confident Are You in Your SOC 2 Reports?", publisher: KPMG US, type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/beyond-checkbox.pdf", date: "2026-07", access: full, locator: "p.3"}
    - {ref: JOFA-PODSOC, title: "The risks of quick-turn SOC engagements and what CPAs should know (podcast with Amy Pawlicki, AICPA)", publisher: "Journal of Accountancy (AICPA)", type: podcast, url: "https://www.journalofaccountancy.com/podcast/2026/apr/the-risks-of-quick%E2%80%91turn-soc-engagements-and-what-cpas-should-know/", date: "2026-04-30", access: full, locator: "Pawlicki on the scope of trust services criteria"}
    - {ref: SOC2AUD-AICOS-2026, title: "SOC 2 for AI Companies (2026): Scope, Controls & AICPA Guidance", publisher: "SOC2Auditors.org (comparison site)", type: vendor, url: "https://soc2auditors.org/insights/soc-2-for-ai-companies/", date: "2026-10-13", access: full, locator: "table on SOC 2, SOC 2+ and ISO 42001"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': cross-framework control mapping fits none of the listed patterns. Change scope is step because
    the deployed change is the mapping, not a redesigned flow. The Customer Commitments feature is only announced;
    maturity is in-production on Vanta's and A-LIGN's live cross-mapping.

- id: assurance-soc-attestation-05
  title: Continuous control monitoring and agent-collected evidence on compliance platforms (service-organisation side)
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Preparing for a SOC 2 or SOC 1 examination meant collecting screenshots and spreadsheets from many systems each
    period. A Type 2 report tests a period, but controls drift between annual cycles and gaps surface at fieldwork;
    the work falls on small security teams.
  solution: >-
    Compliance-automation platforms such as Vanta and Drata connect to cloud, identity, HR and ticketing systems, run
    continuous tests, pull evidence on a schedule and show control status in a dashboard the service auditor can
    later use. AI agents were added in 2025 and 2026 to collect and validate evidence, draft and update policies and
    flag gaps, with people deciding: Vanta's agent launched in July 2025 and was relaunched as "AI Agent 2.0" in
    November 2025, and Vanta launched compliance, third-party-risk and customer-trust agents in March 2026. EY
    speakers describe continuous evidence collection for "real-time compliance snapshots". Named users include Snyk
    and WorkJam (Vanta) and Wispr Flow (Drata). Much of the monitoring is rules-based; only vendor pages describe AI
    inside it.
  outcomes:
    - {lever: speed, description: "Less time spent per audit, which Vanta attributes to an IDC finding that customers reduce audit prep time", figure: "82%", measures: "'less time spent per audit' (page headline); the IDC study, sample and baseline are not shown", provenance: vendor-published, source_ref: VANTA-AUDIT-2026}
    - {lever: capacity, description: "Average time saved per customer per week from automating evidence collection and streamlining policy management", figure: "4 hours per week (average)", measures: "average weekly time saved per customer by the Vanta AI Agent, as stated by Vanta; sample and method not stated", provenance: vendor-published, source_ref: VANTA-HNS-2025}
    - {lever: capacity, description: "WorkJam's CISO says weekly compliance effort fell", figure: "about 1 hour a week instead of 7 or 8", measures: "weekly hours on compliance tasks, as estimated by the customer's CISO and published by Vanta", provenance: vendor-published, source_ref: VANTA-AI-2026}
    - {lever: speed, description: "SOC practitioners say the tools make the examination process quicker and more efficient", figure: "none published", measures: "practitioner statement in a trade article; not a measured result", provenance: self-reported, source_ref: JOFA-FAST}
  prerequisites:
    - "Integrations to every in-scope system; a broken connection leaves stale data in the tool (LINFORD-FAQ-2022)"
    - "A current, specific risk assessment; without one the metrics 'may be unreliable' (KPMG-CHECKBOX-2026, p.3)"
    - "A control set mapped to the Trust Services Criteria (TSC, the AICPA criteria for SOC 2) and a named control owner who reviews and remediates findings"
    - "A CPA firm that is independent of the tool provider"
  risks_and_guardrails:
    - "Tools confirm that configuration exists for the assets they monitor; more governance is needed to know the right assets are monitored and exceptions are acted on (KPMG-CHECKBOX-2026, p.3)"
    - "An integration scoped to part of the environment is reported as complete, a broken integration can leave the dashboard green, and mapped reports can cover the wrong population, such as access lists missing service accounts (SCRUT-EVIDENCE-2026)"
    - "Dashboards do not show that access reviews used the correct population or that exceptions were resolved; a tool cannot operate controls for management, validate design, determine operating effectiveness or form conclusions (BAKERTILLY-TRUST-2026)"
    - "'Continuous compliance' is not continuous assurance: a Type II report still covers a set period and is issued once (LINFORD-ASSURE-2026); 'compliance' is not a SOC 2 term and a SOC 2 report is not a certification (JOFA-FAST; JOFA-PODSOC)"
    - "The service auditor must understand and test what the tool collects (coverage, reliability, consistency, gaps) and perform procedures beyond it (LINFORD-TOOLS-2021, summarising the AICPA FAQ); ISAE 3402 requires other procedures in combination with enquiry (XRB-3402-2026, para 25(a))"
    - "AICPA staff and peer review warn that some firms lean too heavily on platforms without applying professional judgement (JOFA-PRB)"
    - "A tool provider that supplies vital operations to the service organisation may itself be a candidate subservice organisation, in one practitioner's view (LINFORD-TOOLS-2021)"
  human_checkpoints:
    - "Control owners decide on flagged exceptions, approve policies and remediation, and document the rationale"
    - "The service auditor checks that tool coverage matches the system description and re-evaluates scope, population completeness and exceptions at fieldwork"
  role_evolution: >-
    Scrut says retrieval and mapping automate while scoping, exception decisions and their documented rationale stay
    human work (SCRUT-EVIDENCE-2026, step 6). Vanta describes its agent as a GRC engineer the customer never had to hire
    (VANTA-AI-2026), and VantaCon 2026 speaker titles include 'GRC Engineer' (VANTACON-2026).
  evidence_grade: B
  sources:
    - {ref: VANTA-AUDIT-2026, title: "Compliance audit software: Streamline your audit experience (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/audit", date: "2026-10", access: full, locator: "hero statistics and 'Stay audit-ready with continuous compliance'"}
    - {ref: VANTA-AI-2026, title: "Vanta AI: Your 24/7 GRC engineer for security and compliance (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/ai", date: "2026-10", access: full, locator: "customer quotes (WorkJam)"}
    - {ref: VANTA-HNS-2025, title: "Vanta's Agentic Trust Platform redefines how enterprises earn, prove, and scale trust", publisher: "Help Net Security (Vanta release)", type: press, url: "https://www.helpnetsecurity.com/2025/11/19/vanta-agentic-trust-platform/", date: "2025-11-19", access: full, locator: "Vanta AI Agent 2.0 section; Snyk quote"}
    - {ref: VERDICT-VANTA-2026, title: "Vanta introduces automation tools to streamline enterprise compliance", publisher: Verdict, type: press, url: "https://www.verdict.co.uk/vanta-introduces-automation-tools/", date: "2026-03-20", access: full, locator: "paragraphs on the three agent types"}
    - {ref: WISPR-2026, title: "Our path to a new, independent audit", publisher: "Wispr Flow (customer company blog)", type: firm, url: "https://wisprflow.ai/post/new-independent-audit", date: "2026-03-27", access: full, locator: "paragraphs 2-3 (engaged Drata for continuous, automated monitoring)"}
