    - {ref: VANTA-AUDIT-2026, title: "Compliance audit software: Streamline your audit experience (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/audit", date: "2026-10", access: full, locator: "network of audit firms or own auditor"}
    - {ref: DRATA-INTEGRITY-2026, title: "SOC 2 Audit Integrity: Why Independence Matters (read through a text mirror because the host returned 403)", publisher: Drata, type: vendor, url: "https://drata.com/blog/soc-2-audit-integrity", date: "2026-01-09", access: full, locator: "four pillars"}
    - {ref: DRATA-JOBS-2026, title: "Senior SI and Audit Firm Alliances Manager; Senior Product Engineer 2, Audit (job postings)", publisher: Drata, type: job-posting, url: "https://jobs.ashbyhq.com/drata/739d3f1a-4305-4ad3-88d4-b1b5713b67a3", date: "2026-09-08", access: full, locator: "job summaries"}
