  notes: >-
    The auditor-API side of the same platforms is assurance-controls-testing-14. Change scope is model: the change
    is who routes buyers to auditors. Ladder is assist: no source describes AI or automated routing; buyers choose
    from the network or bring their own auditor (VANTA-AUDIT-2026). EY poll: 29% of attendees chose project
    management as an AI use.

- id: assurance-soc-attestation-14
  title: "Bundled 'SOC-as-a-service': readiness platform, referred CPA firm, fixed fee and timeline (contested; Delve allegations denied)"
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [review-assurance, document-production, transaction-processing]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    SOC 2 became a gate for enterprise sales, so startups want a report fast and cheaply, and fast-turnaround offers
    compete on speed and price.
  solution: >-
    Tool vendors, numbering in the dozens, promise results in weeks or hours and act as a front door or intermediary,
    sometimes through networks of small CPA firms, with marketing that alludes to thousands of reports a year. Some
    sell readiness, evidence collection and the examination as one package at a quick, flat price; the AICPA says some
    vendors "automate the service entirely". Delve describes its own flow as a platform that gives auditors a
    dashboard and produces a draft report for the customer to edit, after which licensed auditors test and issue the
    final report. The named case: in March 2026 an anonymous whistleblower alleged that Delve generated evidence, test
    procedures and auditor conclusions before independent review, routed virtually all customers through two audit
    firms and hosted inaccurate trust pages. Delve denies the allegations, says it does not conduct audits and that
    only licensed auditors issue opinions. The author is anonymous, and no regulator or court finding was found as of
    2026-10-17. The AICPA says it is looking into anonymously published allegations about an unnamed compliance
    vendor.
  outcomes:
    - {lever: cost, description: "Median ballpark SOC 2 Type 2 price quoted to AI companies by listed firms (describes the market, not Delve)", figure: "$9,500 median (middle half $7,000 to $13,500)", measures: "median of ballparks listed firms sent to buyers requesting Type 2 quotes through the directory in Jul-Sep 2026, before scoping; asking prices, not final fees", provenance: vendor-published, source_ref: SOC2AUD-FIRMS-2026}
    - {lever: speed, description: "Shortest fieldwork-to-report time listed by any firm in the directory", figure: "1 week minimum", measures: "shortest listed fieldwork-to-report time among the 26 firms compared; a listing, not an observed result", provenance: vendor-published, source_ref: SOC2AUD-FIRMS-2026}
    - {lever: risk, description: "Named Delve customers TechCrunch reported as having moved after the allegations", figure: "2 moved (LiteLLM, Context AI); 1 more (Lovable) said it left in late 2025", measures: "count of customers named by TechCrunch; LiteLLM and Context AI said they moved to Vanta and new, independent audits", provenance: independent, source_ref: TC-CONTEXT-2026}
  prerequisites:
    - "A licensed CPA firm enrolled in peer review that sets its own scope, timing, fee and evidence access"
    - "A written account of who drafted the opinion and test results, and when"
    - "Written disclosure of referral fees where payments to or from the tool provider are in substance referral fees (JOFA-SOCETH-2026)"
  risks_and_guardrails:
    - "AICPA ethics staff: terms that shift control, judgement, fees or evidence access to the tool provider can create independence and objectivity threats, including concentrated cross-referrals, vendor-set deadlines, bundled packages that set the fee and non-disparagement clauses; the CPA must set the fee (JOFA-SOCETH-2026, citing ET 1.230.030)"
    - "Where threats are significant and safeguards cannot reduce them, performing or continuing the examination is not appropriate; a tool provider that is the 'responsible party' requires independence from it too (JOFA-SOCETH-2026)"
    - "Guaranteeing outcomes ('clean audit', '100% pass rate') may breach the advertising rule, and a CPA cannot outsource misleading marketing to a vendor (JOFA-SOCETH-2026)"
    - "Engagements with identical reports, risk assessments, sample sizes and procedures can be judged nonconforming in peer review; reviewers may compare about five engagements from different partners (JOFA-PRB)"
    - "The AICPA's Amy Pawlicki: CPAs in peer review who do this should expect deficiencies; licensed CPAs outside peer review, or unlicensed signatories, who sign such reports violate state law (JOFA-PODSOC)"
    - "A Dec 2022 AICPA alert, as summarised by Grant Thornton, said non-CPA tool providers contracting with CPA firms to deliver an examination from tool data may create a self-review threat (GT-SOC2-2023)"
    - "After the allegations Delve apologised, said it would rebuild its auditor network, remove firms that do not meet its standards and halt automation that interacts with audit workflows, and offered re-audits (DELVE-RECORD-2026; DELVE-CHANGES-2026)"
  human_checkpoints:
    - "The licensed CPA firm designs and runs its own tests, authors the conclusions before any opinion is drafted, and signs"
    - "Buyer vets the signing firm's licence and peer review result (CPAverify, state board, peer review public file)"
    - "The engagement letter states who sets scope, sampling and fee"
  role_evolution: >-
    Middle-market firms face intense fee pressure and must be able to tell clients why a properly scoped and executed
    SOC 2 costs more; the Working Group chair says the response sets a precedent if tool vendors go after financial
    audits (JOFA-FAST). Under the alleged pattern the signing CPA's role would shrink to a signature, which the AICPA
    treats as a breach (JOFA-PODSOC).
  evidence_grade: B
  sources:
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01", access: full, locator: "'What's the issue?'; 'Risks for CPAs'; 'How can SOC examiners respond?'"}
