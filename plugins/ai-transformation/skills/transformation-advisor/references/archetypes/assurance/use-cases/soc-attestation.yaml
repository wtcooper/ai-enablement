- id: assurance-soc-attestation-06
  title: SOC firm's audit platform screens client evidence against audit intent before fieldwork (A-LIGN A-SCEND)
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Clients submit evidence that fails the control's intent, which causes rework during fieldwork, and evidence is
    re-requested for each framework.
  solution: >-
    A-LIGN's audit platform (A-SCEND with EvidenceIQ) evaluates a client's evidence against audit intent before
    auditors review it, shows coverage and gaps with explanations, maps existing evidence to additional frameworks
    and deduplicates requests. A-LIGN says customers can switch AI features on or off and that auditors remain
    accountable. It also says its auditors can work behind the scenes while clients stay in their preferred GRC
    (governance, risk and compliance) platform.
  outcomes:
    - {lever: speed, description: "Named customer (Teleperformance) reports evidence gathering and validation time reduced", figure: "about 30-40%", measures: "reduction in evidence gathering and validation time in a testimonial attributed to a named Teleperformance employee; method not stated", provenance: vendor-published, source_ref: ALIGN-ASCEND-2026}
    - {lever: capacity, description: "Same customer reports overall audit preparation effort reduced", figure: "about 25%", measures: "reduction in overall audit preparation effort in the same testimonial; method not stated", provenance: vendor-published, source_ref: ALIGN-ASCEND-2026}
  prerequisites:
    - "Client uploads evidence once to the platform or works from a connected GRC platform"
    - "Multi-framework engagements make reuse worthwhile"
  risks_and_guardrails:
    - "A-LIGN states auditors remain accountable for every decision and that the platform enforces documentation standards (ALIGN-ASCEND-2026)"
    - "The AICPA FAQ, as summarised by Linford, says a service organisation's use of a tool does not change the service auditor's responsibilities (LINFORD-TOOLS-2021)"
  human_checkpoints:
    - "Auditor review and validation precede the final report (page process list)"
  role_evolution: "Fewer repeated evidence requests reach client staff, and prior-year evidence rolls forward automatically (ALIGN-ASCEND-2026)."
  evidence_grade: B
  sources:
    - {ref: ALIGN-ASCEND-2026, title: "A-SCEND: audit management platform with EvidenceIQ (product page)", publisher: A-LIGN, type: firm, url: "https://www.a-lign.com/a-scend", date: "2026-10", access: full, locator: "sections 'Audit intelligence', 'Accelerate audits with responsible AI', 'Work where you already work' and the customer testimonial"}
    - {ref: LINFORD-TOOLS-2021, title: "How Does the Usage of SOC 2 Software Tools Affect SOC 2 Audits?", publisher: "Linford & Company", type: firm, url: "https://linfordco.com/blog/using-soc-2-software-tools-for-audit-compliance", date: "2021-12-22", access: full, locator: "section 'Does SOC 2 Compliance Software Affect an Individual Auditor's Responsibilities?'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B, not A: the figures are an approximate customer testimonial and are published by A-LIGN without a
    method, and part of the effect comes from evidence reuse, which is not AI. A-LIGN's 15-hours-per-framework reuse
    figure is in -04. Overlaps assurance-controls-testing-03 (pre-submission evidence checks in SOX); kept here
    because it is a SOC specialist firm's own platform. A-LIGN reports serving over 6,400 organizations
    (vendor-published). The page is undated; the date is the access month.

- id: assurance-soc-attestation-07
  title: Engagement platform and client portal replace spreadsheet and email workflows in an attestation practice (Weaver)
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Evidence collection and review in attestation and internal audit engagements ran on spreadsheets, email chains
    and manual trackers, with multiple versions of documents.
  solution: >-
    Weaver, a firm with its own third-party attestation and internal audit methodologies, adopted Fieldguide as a
    single engagement workspace and client portal while keeping its methodology. The firm says its next step is to
    embed the platform's AI agents, with a phased rollout.
  outcomes:
    - {lever: growth, description: "Weaver reports an increase in realization in the first year", figure: "10-12%", measures: "increase in realization in year one after adopting the platform; baseline and engagement mix not stated", provenance: vendor-published, source_ref: FIELDGUIDE-WEAVER-2026}
  prerequisites:
    - "Firm methodology configurable in the platform"
    - "Clients willing to use a portal"
  risks_and_guardrails:
    - "Weaver says AI does not replace professional experience and judgement and its staff validate the work (FIELDGUIDE-WEAVER-2026)"
    - "The firm used a phased rollout and kept risk management and review standards intact (FIELDGUIDE-WEAVER-2026)"
  human_checkpoints:
    - "Reviewers work from the latest version and validate engagement output"
  role_evolution: "Reviewers always see current information; staff shift from administrative tasks to higher-value advisory work, per the firm (FIELDGUIDE-WEAVER-2026)."
  evidence_grade: B
  sources:
    - {ref: FIELDGUIDE-WEAVER-2026, title: "Weaver scales GRC services with Fieldguide to deliver transparency and accelerate growth (case study)", publisher: Fieldguide, type: vendor, url: "https://www.fieldguide.io/case-studies/weaver-scales-grc-services-with-fieldguide-to-deliver-transparency-and-accelerate-growth", date: "2026-10", access: full, locator: "'The Results' and 'The Road Ahead' sections (undated page; date is the access month)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': engagement workflow and client-portal platform. Grade capped at B because the measured effect
    (realization) comes from a workflow platform, not from AI; embedding AI agents is described as under way. A
    vendor case study with no date on the page or in the sitemap; the date is the access month.

- id: assurance-soc-attestation-08
  title: "Agent-executed SOC engagement: planning, evidence requests, testing, exception drafting and orchestration"
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [review-assurance, document-production, coordination-scheduling]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: >-
    SOC examinations repeat the same request, test and document cycle for every control, and firms with a growing SOC
    practice are capacity-bound.
  solution: >-
    Fieldguide describes four agents for SOC work: a planner that builds the engagement plan from methodology, scope
    and prior-year workpapers; an auditor agent that sends client requests, validates evidence and runs test
    procedures; a reviewer agent that surfaces exceptions and judgement calls; and an orchestrator that coordinates
    them. A live demonstration of an agent-run SOC 2 engagement was scheduled for 13 October 2026.
  outcomes:
    - {lever: capacity, description: "Vendor figures listed under 'real results from firms' on the SOC page", figure: "55% reduction in engagement hours; 90% time savings on testing; 4x engagement capacity", measures: "not defined on the page: no firm, engagement type, baseline or sample is given", provenance: vendor-published, source_ref: FIELDGUIDE-SOC-2026}
    - {lever: capacity, description: "Vendor claim in a job posting about customers' manual tasks and capacity", figure: "up to 75% of time on manual tasks saved; over 4x capacity", measures: "not defined in the posting", provenance: vendor-published, source_ref: FIELDGUIDE-JOBS-2026}
  prerequisites:
    - "Firm methodology configured in the platform (Fieldguide is hiring an Audit Methodology Lead to integrate methodology partners, FIELDGUIDE-JOBS-2026)"
    - "Prior-year workpapers and client evidence in the client portal"
  risks_and_guardrails:
    - "Fieldguide's own posting for an audit transformation director (a financial-audit role) says someone must decide which procedures suit agent execution and how output is documented to withstand regulatory inspection (FIELDGUIDE-JOBS-2026)"
    - "AICPA staff warn that some firms lean too heavily on third-party SOC platforms without the professional judgement the standards require (JOFA-PRB); SOC leaders warn that a rushed or overly automated report may rely too heavily on inquiry (JOFA-FAST)"
  human_checkpoints:
    - "Practitioner reviews drafted exceptions (FIELDGUIDE-WEBINAR-2026)"
    - "Reviewer agent routes judgement calls to a practitioner (FIELDGUIDE-SOC-2026)"
  role_evolution: >-
    Fieldguide says practitioner time shifts to judgement, review and the client relationship
    (FIELDGUIDE-WEBINAR-2026), and it is hiring a director to lead 'the shift from traditional audit execution to an
    agentic operating model' for its financial audit agents (FIELDGUIDE-JOBS-2026).
  evidence_grade: C
  sources:
    - {ref: FIELDGUIDE-SOC-2026, title: "SOC audits: Field Agents execute across the SOC engagement (solution page)", publisher: Fieldguide, type: vendor, url: "https://fieldguide.io/solutions/soc-audits", date: "2026-08-11", access: full, locator: "'Field Agents execute across the SOC engagement' and 'Real results from firms'"}
    - {ref: FIELDGUIDE-WEBINAR-2026, title: "See Field Agents Execute SOC 2 Engagements Live (webinar page)", publisher: Fieldguide, type: vendor, url: "https://info.fieldguide.io/live-demo-soc-mar10", date: "2026-10-13", access: full, locator: "webinar description"}
    - {ref: FIELDGUIDE-JOBS-2026, title: "Director, Audit Transformation; Audit Methodology Lead (job postings)", publisher: Fieldguide, type: job-posting, url: "https://jobs.ashbyhq.com/fieldguide/df0e17ea-85bc-45bc-b939-fe54426fb170", date: "2026-10-02", access: full, locator: "'About us' and 'About the role' sections of the Director, Audit Transformation posting"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14", access: full, locator: "section 'A heightened focus on SOC 2 quality'"}
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01", access: full, locator: "section 'What's the issue?'"}
  last_reviewed: "2026-10-17"
  notes: >-
    No named SOC firm is tied to the figures, so grade C and maturity announced. Search only (not opened, not used):
    a Fieldguide page claiming firms saved 36-50 hours per SOC engagement and a customer cut test-procedure drafting
    time by 66%. Weaver (-07) says it plans to embed these agents. Fieldguide's SOX-side testing agents are covered
    in controls-testing.

- id: assurance-soc-attestation-09
  title: AI review of draft SOC reports for errors and inconsistencies
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Draft SOC reports are long, and a reviewer can miss a detail buried deep in the document.
  solution: >-
    Linford & Company says it uses AI for reviewing reports, among other uses. It says the aim is a more thorough
    job, such as finding things on a late page of a long report, and that the AI does not save the firm time.
  outcomes:
    - {lever: quality, description: "Firm states the AI helps it catch details a human might miss and does not save time", figure: "none published", measures: "n/a (opinion statement by the firm)", provenance: self-reported, source_ref: LINFORD-ASSURE-2026}
  prerequisites:
    - "An approved AI tool and a draft report in reviewable form"
  risks_and_guardrails:
    - "The author states AI cannot judge whether a control reduces the risk it was designed for and does not replace professional skepticism (LINFORD-ASSURE-2026)"
  human_checkpoints:
    - "The post names missing walkthroughs and no partner review of the report as signs of a bargain-basement audit (LINFORD-ASSURE-2026)"
  role_evolution: "The firm frames AI as a way to raise thoroughness, not to cut hours (LINFORD-ASSURE-2026)."
  evidence_grade: B
  sources:
    - {ref: LINFORD-ASSURE-2026, title: "AI Made Compliance Cheaper. It Didn't Make Assurance Cheaper.", publisher: "Linford & Company", type: firm, url: "https://linfordco.com/blog/ai-compliance-vs-assurance/", date: "2026-09-23", access: full, locator: "sections 'What Actually Got Cheaper' and 'What AI Can't Do'"}
  last_reviewed: "2026-10-17"
  notes: >-
    One sentence in an opinion post by a named firm; no tool, volume or error-catch rate is reported. Related to AI
    secondary review of workpapers (assurance-controls-testing-10).

- id: assurance-soc-attestation-10
  title: Security questionnaire answers drafted from issued SOC reports and approved answer libraries
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    A SOC report is meant to reduce customer questionnaires, but sales deals still trigger long questionnaires that
    ask for the same facts and that security teams answer by hand.
  solution: >-
    EY conference speakers list drafting tailored questionnaire responses that learn from issued SOC reports and
    approved answers. Vanta's AI suggests answers from a tagged knowledge base of policies, evidence and previous
    responses, and its release says the agent "takes the first pass at questionnaires" and flags gaps.
  outcomes:
    - {lever: capacity, description: "Vanta says AI-suggested questionnaire answers are accepted at a high rate", figure: "95% acceptance", measures: "share of AI-suggested answers accepted by users, as stated by Vanta; sample and period not stated", provenance: vendor-published, source_ref: VANTA-AI-2026}
    - {lever: speed, description: "Vanta's comparison page on questionnaire automation", figure: "up to 81% faster; up to 73% coverage; up to 95% acceptance", measures: "the page does not define numerators, denominators or baseline for 'faster', 'coverage' or 'acceptance'", provenance: vendor-published, source_ref: VANTA-VS-2026}
  prerequisites:
    - "A maintained, tagged library of approved answers tied to the current report and controls"
    - "A reviewer who signs off answers before they are sent"
  risks_and_guardrails:
    - "EY leaders say AI outputs still need human oversight because AI may invent details, even when told not to (EY-SOC, p.5)"
    - "Answers must agree with the report and with what the controls actually do; trust pages and questionnaire answers should be spot-checked against reality (IANS-DELVE)"
    - "Answers inherit any gap between the policy library and what is implemented; the Delve allegations, which Delve denies, concern exactly that gap (DEEPDELVER-2026)"
    - "Vendor figures are 'up to' maxima from a comparison page that also criticises competitors (VANTA-VS-2026)"
  human_checkpoints:
    - "The user reviews and submits each answer set (VANTA-AI-2026)"
    - "Security owner approves answers before they go to the customer"
  role_evolution: "Security and compliance staff review suggested answers instead of writing them (VANTA-AI-2026)."
  evidence_grade: C
  sources:
    - {ref: EY-SOC, title: "How AI assurance builds trust with SOC, attestation and certification (14th annual EY SOC, Attestation and Certification Conference highlights)", publisher: EY, type: conference, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09", access: full, locator: "p.4 area 5"}
    - {ref: VANTA-AI-2026, title: "Vanta AI: Your 24/7 GRC engineer for security and compliance (product page)", publisher: Vanta, type: vendor, url: "https://www.vanta.com/products/ai", date: "2026-10", access: full, locator: "'Questionnaire responses in seconds'"}
    - {ref: VANTA-HNS-2025, title: "Vanta's Agentic Trust Platform redefines how enterprises earn, prove, and scale trust", publisher: "Help Net Security (Vanta release)", type: press, url: "https://www.helpnetsecurity.com/2025/11/19/vanta-agentic-trust-platform/", date: "2025-11-19", access: full, locator: "'Automate security questionnaires' bullet"}
    - {ref: VANTA-VS-2026, title: "Vanta vs. Drata vs. Delve", publisher: Vanta, type: vendor, url: "https://vanta.com/resources/vanta-vs-drata-vs-delve", date: "2026-03-22", access: full, locator: "'Questionnaire automation' paragraph"}
    - {ref: IANS-DELVE, title: "Delve Allegations Expose Weak Points in Modern Compliance", publisher: IANS Research, type: press, url: "https://www.iansresearch.com/resources/all-blogs/post/security-blog/2026/03/30/delve-allegations-expose-weak-points-in-modern-compliance", date: "2026-03-24", access: full, locator: "recommendations ('If you are not a Delve customer')"}
    - {ref: DEEPDELVER-2026, title: "Delve - Fake Compliance as a Service - Part I (anonymous allegations; unverified)", publisher: "DeepDelver (pseudonymous Substack)", type: community, url: "https://deepdelver.substack.com/p/delve-fake-compliance-as-a-service", date: "2026-03-19", access: full, locator: "introduction"}
  last_reviewed: "2026-10-17"
  notes: >-
    Customer-assurance work beside the SOC examination, not part of it. Delve said, in its own defence, that the
    anonymous critic acknowledged its AI automated 70% of a security questionnaire (as reported by TechCrunch); a
    company claim, not used.

- id: assurance-soc-attestation-11
  title: Trust centre with an AI chatbot as the buyer-facing front end for the SOC report and control documentation
  archetype: assurance
  module: soc-attestation
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: grounded-knowledge-assistant
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Buyers ask each vendor for its report, policies and answers by email and NDA, repeatedly, and want current proof
    between annual reports. Public trust pages can also overstate what is in place.
  solution: >-
    A trust centre (a public or gated page showing a company's reports, policies and control status) publishes the
    material from a single source. Vanta's page describes a trust centre with an AI chatbot answering buyer
    questions, CRM-based gating and NDA automation. Whistic sells one for vendors and says customers see real material
    "not just a claim". Chiaro gives a trust centre free with any audit.
  outcomes:
    - {lever: experience, description: "Vanta says the Trust Center and AI chatbot deflect inbound reviews", figure: "70-87% deflection", measures: "not defined on the page (no numerator, denominator, sample or period); from Vanta's comparison table", provenance: vendor-published, source_ref: VANTA-VS-2026}
  prerequisites:
    - "Only controls that are implemented and monitored appear on the page"
    - "A clear label that a trust page is not an attestation, and a rule that nothing on it claims more than the report supports"
  risks_and_guardrails:
    - "The anonymous allegations, which Delve disputes, say some customers hosted trust pages listing measures that were never implemented (DEEPDELVER-2026; TC-DELVE-2026)"
    - "IANS advises narrowing or removing public security claims until they are validated if a report is in doubt (IANS-DELVE)"
    - "The AICPA says a SOC 2 report is not a certification, and that compliance and certification badges imply every engagement is the same (JOFA-PODSOC)"
  human_checkpoints:
    - "Security owner approves each published claim"
  role_evolution: "Not described in the sources."
  evidence_grade: C
  sources:
