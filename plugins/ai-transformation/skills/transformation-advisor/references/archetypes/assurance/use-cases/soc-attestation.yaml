    - {ref: IANS-DELVE, title: "Delve Allegations Expose Weak Points in Modern Compliance", publisher: IANS Research, type: press, url: "https://www.iansresearch.com/resources/all-blogs/post/security-blog/2026/03/30/delve-allegations-expose-weak-points-in-modern-compliance", date: "2026-03-24", access: full, locator: "key points (allegation figures repeated as allegations)"}
    - {ref: GT-SOC2-2023, title: "What businesses need to know about SOC 2 developments", publisher: Grant Thornton US, type: firm, url: "https://www.grantthornton.com/insights/articles/advisory/2023/what-businesses-need-to-know-about-soc-2-developments", date: "2023-02-16", access: full, locator: "section 'Focus on tools'"}
    - {ref: SOC2AUD-FIRMS-2026, title: "SOC 2 auditors for AI companies: 26 firms compared (lead-generation directory)", publisher: SOC2Auditors.org, type: vendor, url: "https://soc2auditors.org/soc-2-auditors-ai/", date: "2026-10-09", access: full, locator: "'What firms quoted' chart and summary strip"}
    - {ref: SOC2AUD-DELVE-2026, title: "Delve Review (2026): Who Actually Audits You?", publisher: "SOC2Auditors.org (comparison site)", type: vendor, url: "https://soc2auditors.org/insights/delve-review/", date: "2026-10-13", access: full, locator: "dispute table and later events (secondary; court details not independently checked)"}
  last_reviewed: "2026-10-17"
  notes: >-
    Cautionary entry, not a recommended practice. Grade B rests on named vendors openly operating the bundled model
    and on customer moves reported by TechCrunch, not on the allegations. Everything about Delve's conduct is
    allegation; Delve disputes it, and one of the audit firms named also denies wrongdoing (SOC2AUD-DELVE-2026,
    secondary). Allegation figures from the anonymous author, unverified and disputed: in 575 leaked files (494
    attributed as SOC 2 reports), one test-procedure string in 493 of 494 reports and one auditor-conclusion
    sentence in 259 of 259 Type II reports (DEEPDELVER-2026; repeated by IANS-DELVE). Delve's $32M Series A at a
    $300M valuation is reported by TechCrunch. Secondary reporting lists two federal suits filed in April 2026 with
    no ruling on the allegations; dockets were not checked. No AICPA or state-board outcome was found as of
    2026-10-17. Delve price points of $6,000-$15,000 appear only in unopened secondary sources and are not used.

- id: assurance-soc-attestation-15
  title: "Licensed CPA firm and compliance platform sold as one 'auditor-led' service (Thoropass, A-LIGN)"
  archetype: assurance
  module: soc-attestation
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Readiness software and the audit are bought separately, so evidence is collected twice and the client manages two
    relationships.
  solution: >-
    Thoropass combines a compliance platform with a licensed CPA firm (Thoropass Assurance) and says it uses AI to map
    controls, identify gaps and organise evidence, so the audit runs in the same platform; it says the platform
    enforces consistency in evidence collection and control validation. A-LIGN pairs its own audit platform with a
    PCAOB-registered CPA firm.
  outcomes:
    - {lever: growth, description: "Customer base Thoropass claims; no time or cost measure", figure: "1,000+ customers", measures: "number of customers claimed on Thoropass's home page; period not stated", provenance: vendor-published, source_ref: THOROPASS-2026}
  prerequisites:
    - "Client adopts the vendor's platform, or runs it beside its own"
  risks_and_guardrails:
    - "AICPA ethics staff say an arrangement where the tool provider is in the auditor's network or an alternative practice structure needs an independence evaluation of its relationships with attest clients, and bundles that set the examination fee can impair independence (JOFA-SOCETH-2026)"
    - "The AICPA's peer review guidance asks reviewers to look at engagement timelines and tailoring (JOFA-PRB)"
  human_checkpoints:
    - "Licensed auditors perform the examination and sign the report (THOROPASS-2026)"
  role_evolution: "Thoropass describes the model as 'auditor-led' and lists assurance leaders formerly at KPMG, EY, Accenture and Coalfire (THOROPASS-2026)."
  evidence_grade: B
  sources:
    - {ref: THOROPASS-2026, title: "Thoropass: auditor-led, AI-powered audits (home page)", publisher: Thoropass, type: vendor, url: "https://www.thoropass.com/", date: "2026-10", access: full, locator: "hero statement, team list, FAQ on how the audit differs from a traditional firm, footer on the licensed firm"}
    - {ref: ALIGN-ASCEND-2026, title: "A-SCEND: audit management platform with EvidenceIQ (product page)", publisher: A-LIGN, type: firm, url: "https://www.a-lign.com/a-scend", date: "2026-10", access: full, locator: "platform and firm description"}
    - {ref: ALIGN-BENCH-2026, title: "2026 Compliance Benchmark Report (landing page; report download not opened)", publisher: A-LIGN, type: survey, url: "https://www.a-lign.com/resources/2026-compliance-benchmark-report", date: "2026-01", access: full, locator: "landing page statistics (read from an image)"}
    - {ref: JOFA-SOCETH-2026, title: "SOC engagements: Ethics risks with tool providers", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/apr/soc-engagements-ethics-risks-with-tool-providers/", date: "2026-04-06", access: full, locator: "'Network firm considerations'"}
    - {ref: JOFA-PRB, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14", access: full, locator: "bullets on technology and timelines"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern 'other': a platform and a licensed firm sold as one service. This entry records a structure, not a
    finding: the sources do not say either arrangement raises an independence issue; the AICPA article describes
