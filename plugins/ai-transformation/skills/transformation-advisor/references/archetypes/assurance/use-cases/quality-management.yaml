    - {ref: PCAOB-BOTICIOWA-2026, title: "The Role of the Financial Statement Auditor, and Thoughts on the PCAOB Inspection Process and Its Contemplated Transformation (speech, G. Botic; read via text mirror)", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/news-events/speeches/speech-detail/the-role-of-the-financial-statement-auditor--and-thoughts-on-the-pcaob-inspection-process-and-its-contemplated-transformation", date: "2026-10-05", access: full, locator: "section 'Attributes of an Effective Financial Statement Auditor'"}
  last_reviewed: "2026-10-17"
