- id: assurance-quality-management-18
  title: "Human control points built into agentic audit workflows, with escalation and approval before results are used"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Agents run multi-step procedures, so there is no single output to review: intermediate decisions, tool calls
    and escalations matter. Without defined review points errors compound, and reviewers either redo everything
    or accept plausible output. KPMG says a human approval step that rubber-stamps every AI recommendation
    provides no real control value (KPMG-SOX-2026, p. 14). The FRC identifies control-point decisions, including
    automation bias, as a source of deficient output (FRC-GENAI-2026, p. 16).
  solution: >-
    The FRC separates review of final outputs from oversight at control points, which occur when set criteria
    are met (for example an intermediate output is ready, the tool wishes to take certain actions, or time
    passes); choosing control points is an important professional judgement, and its contract-review example
    lets the tool escalate when uncertain (FRC-GENAI-2026, pp. 37-38, 55). IFIAR asks firms to assign specific
    engagement personnel to decision checkpoints and to review autonomous decisions overall (IFIAR-TTF-2026, p.
    7). IAASB roundtable participants called human-in-the-loop oversight non-negotiable, even as systems become
    more autonomous (IAASB-TQM-2026, p. 4). Deloitte UK says its engagement teams critically assess, corroborate
    and approve agent results before they are used (DELOITTE-UKTR-2026), and Deloitte says Omnia agents carry
    out preliminary procedures and draft preliminary conclusions for professionals to review
    (DELOITTE-OMNIA-2026). KPMG says agents in KPMG Clara perform audit tasks 'in concert with human review'
    under its Trusted AI framework (KPMG-TR-2025).
  outcomes:
    - {lever: quality, description: "None published. Deloitte UK and KPMG describe the control as design intent; neither reports review results or control-point catches", figure: "none", measures: "no measure published", provenance: self-reported, source_ref: DELOITTE-UKTR-2026}
  prerequisites:
    - "Agents that log actions and cite sources with stable references, so reviewers can check them"
    - "Defined escalation criteria and named decision owners; certification results showing where deficient output is likely, to place control points (FRC-GENAI-2026, p. 38)"
    - "Reviewers with competence in the use case, sometimes specialist expertise (FRC-GENAI-2026, p. 37)"
  risks_and_guardrails:
    - "The FRC and NFRA name automation bias as a main risk in review and oversight (FRC-GENAI-2026, pp. 37-38; NFRA-STAFF-2026)"
    - "CPAB: stating that a human is in the loop is not enough; firms need a behaviour shift and clear articulation of involvement at each stage (CPAB-EVOLVING-2025, p. 5)"
    - "IFIAR asks firms to consult its members early where AI makes judgements or decisions without human involvement (IFIAR-TTF-2025, p. 8)"
    - "KPMG says defining when human judgement adds real risk reduction needs careful thought and ongoing experimentation (KPMG-SOX-2026, p. 14)"
    - "IFIAR 2024 survey: 31% of reporting members had findings that a tool was not used as intended; common findings were misread results and thin testing of outliers (IFIAR-TTF-2025, p. 5)"
  human_checkpoints:
    - "Authorising the agent to continue or take specified actions at control points"
    - "Review of intermediate and final outputs by a competent engagement-team member"
    - "Dynamic escalation when the agent flags uncertainty"
    - "Approval of preliminary conclusions before use"
  role_evolution: >-
    Staff move from preparing to overseeing agent work and deciding at control points (IFIAR-TTF-2026, p. 7;
    DELOITTE-UKTR-2026). Holmstrom and Peters propose, without results, that the move from preparing to
    reviewing may reduce auditors' autonomy and skill-building (HOLMSTROM-2024).
  evidence_grade: B
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 16, 37-38; example 2, pp. 50-55"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p. 7"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution (2025 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp. 5, 8"}
    - {ref: IAASB-TQM-2026, title: "Technology Quality Management Roundtables: Outcomes and Next Steps", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-02/IAASB-Technology-Quality-Management-Roundtables-Feedback.pdf", date: "2026-02-10", access: full, locator: "p. 4 (future state)"}
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "Appendix 5, Technology, PDF p. 48"}
    - {ref: DELOITTE-OMNIA-2026, title: "Deloitte unveils connected agentic intelligence in Deloitte Omnia to advance audit and assurance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/about/press-room/unveils-connected-agentic-intelligence-omnia-advance-audit-assurance.html", date: "2026-06-24", access: full, locator: "capabilities list"}
    - {ref: KPMG-TR-2025, title: "KPMG International Transparency Report 2025: Building trust through quality and innovation", publisher: "KPMG International", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/12/transparency-report-fy25.pdf", date: "2025-12", access: full, locator: "PDF p. 16, 'AI in the audit now and in the future'"}
    - {ref: KPMG-SOX-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24", access: full, locator: "p. 14 ('The human-in-the-loop imperative')"}
    - {ref: CPAB-EVOLVING-2025, title: "The evolving use of technology in the audit (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2025-evolving-use-of-technology-in-the-audit-en.pdf", date: "2025-12-16", access: full, locator: "Clearly defining the role of auditors, p. 5"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "Principle 4, p. 4"}
    - {ref: HOLMSTROM-2024, title: "How Does Generative AI Automation Affect Auditors' Motivation and Judgment Quality? (registered report proposal; date from PDF metadata)", publisher: "PCAOB conference materials (Holmstrom and Peters)", type: academic, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/economicandriskanalysis/conference/conference---spring/session_5_holmstrom_peters.pdf", date: "2024-06", access: full, locator: "Introduction"}
  last_reviewed: "2026-10-17"
  notes: >-
    Two named firms (Deloitte, KPMG) describe the design in transparency reports and a press release, with no
    published figure. Deloitte UK's agentic network is stated as integrated in early FY2027, i.e. from June 2026;
    'in production' reflects the firms' own wording. KPMG-SOX-2026 concerns AI in controls (adjacent). The FRC
    examples are illustrative, not named firms.

- id: assurance-quality-management-19
  title: "Review mechanics for AI output: citations and run traces, tie-back to source, and confirmation gates in the workflow"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A confident, well-formatted AI output can pass review with less challenge than a junior's work; the AFM
    calls this a 'halo effect' and notes outputs can appear convincing (AFM-12BB-2025, pp. 31-32). Fluent output
    without sources cannot be checked efficiently, which weakens review and the inspection trail.
  solution: >-
    The FRC says review should assess whether output is appropriate for use, complete, accurate, internally
    consistent and consistent with the reviewer's understanding of the entity (FRC-GENAI-2026, p. 37). Its
    worked examples have the tool segment documents with stable identifiers and cite them for every extract,
    which both reduces fabrication and supports review (FRC-GENAI-2026, pp. 44, 51). CPAB's example has the
    auditor compare extracted contract data back to the original contract (CPAB-AI-2024, p. 4). The AFM saw good
    practice where each step in a fixed workflow can be completed only after the auditor confirms the output was
    reviewed and supported by underlying evidence (AFM-12BB-2025, pp. 31-32). PwC describes each Evidence Match
    result as carrying a clear evidence trail (PWC-AT-2025); Fieldguide says each agent run produces a Trace of
    inputs, outputs and reasoning kept with the engagement record (FIELDGUIDE-PCAOB-2026); RSM and Andera say
    their platform generates annotated documentation with full traceability to source
    (CPAPRACTICE-RSMANDERA-2026).
  outcomes:
    - {lever: quality, description: "No measured detection or override rate published. The AFM calls out as bad practice a tool that presents a convincing conclusion that the auditor immediately includes in the file without clarity on data or reliability", figure: "none published", measures: "n/a", provenance: independent, source_ref: AFM-12BB-2025}
    - {lever: quality, description: "Vendor says the Trace record supports inspection conversations; no measure", figure: "none", measures: "no measure published", provenance: vendor-published, source_ref: FIELDGUIDE-PCAOB-2026}
  prerequisites:
    - "Tool design that requires citations to source passages"
    - "Workflow gates that require reviewer confirmation, and defined review activities per tool in methodology"
    - "Reviewers trained to check citations"
  risks_and_guardrails:
    - "A citation shows where text came from, not that the reading is right; the FRC still expects review against source (FRC-GENAI-2026, p. 37)"
    - "Review effectiveness depends on reviewers' competence to spot deficiencies; the nature and extent of review is a judgement based on residual risk (FRC-GENAI-2026, p. 37)"
    - "The FRC's contract-review example does not require the auditor to review every contract classification, only whether the output is consistent with their understanding of the entity (FRC-GENAI-2026, p. 55)"
    - "The AFM expects GenAI results to be traceable or replicable (AFM-2025)"
  human_checkpoints:
    - "Reviewer confirmation gate on each AI-assisted step"
    - "Reviewer checks cited sources, with closer reading where output conflicts with prior understanding"
    - "Specialist review where the use case needs it"
  role_evolution: >-
    Reviewers spend more time checking AI output against sources and less on drafting; PCAOB staff reported in
    2024 that firms expected the same diligence in review whether or not GenAI was involved (PCAOB-GENAI-2024,
    p. 5).
  evidence_grade: C
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 37, 44, 51, 55"}
    - {ref: CPAB-AI-2024, title: "The use of artificial intelligence in the audit: balancing innovation and risk (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2024-use-of-artificial-intelligence-in-the-audit-en.pdf", date: "2024-09-12", access: full, locator: "p. 4 (example)"}
    - {ref: AFM-12BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "pp. 30-32 (building block 12)"}
    - {ref: AFM-2025, title: "12 building blocks for controlled use of advanced (Gen)AI auditing tools (press release)", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/en/sector/actueel/2025/dec/pb-12-bouwstenen-beheerst-gebruik-audit-tooling", date: "2025-12-11", access: full, locator: "'Humans remain ultimately responsible' paragraph"}
    - {ref: PWC-AT-2025, title: "PwC expects end-to-end AI audit automation within 2026", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/pwc-expects-end-to-end-ai-audit-automation-within-2026", date: "2025-10-28", access: full, locator: "paragraph on Evidence Match"}
    - {ref: FIELDGUIDE-PCAOB-2026, title: "PCAOB AI oversight: where the Board stands on AI in audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/pcaob-ai-audit-standards", date: "2026-08-06", access: full, locator: "final section"}
    - {ref: CPAPRACTICE-RSMANDERA-2026, title: "Andera and RSM US Partner to Create AI-Enabled Control Testing Platform for Internal Audit", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/26/andera-and-rsm-us-partner-to-create-ai-enabled-control-testing-platform-for-internal-audit/189130/", date: "2026-08-26", access: full, locator: "paragraph beginning 'By entering into this strategic alliance'"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB (staff)", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p. 5"}
  last_reviewed: "2026-10-17"
  notes: >-
    The AFM good practice was observed at an unnamed firm; FRC and CPAB examples are hypothetical. PwC Evidence
    Match is a substantive-testing tool and the RSM/Andera capability is an announced internal-audit
    controls-testing alliance, so the named items are adjacent.

- id: assurance-quality-management-20
  title: "Idea: structured scepticism for reviewers: form an independent view first and argue against the tool's answer"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    In an experiment, auditors relying on work done by automated tools were less sceptical than when relying on
    the same work done by a team member (PETERS-2022). NFRA staff say fluent, well-presented machine
    output invites automation bias, so plausible results get less challenge than a human-prepared equivalent
    would (NFRA-STAFF-2026). A counter-bias also exists: auditors who received contradictory evidence
    from their firm's AI system proposed smaller adjustments to management's complex estimates than when it came
    from a human specialist (COMMERFORD-2022).
  solution: >-
    Idea in regulator guidance and research. The FRC says review may involve forming an independent view to
    compare against, for example reading the source material to confirm a GenAI summary, or identifying risks of
    material misstatement oneself before comparing with an AI-generated list (FRC-GENAI-2026, p. 37). In the
    Peters experiment a counter-arguing mindset intervention alleviated the loss of scepticism, and no spillover
    to a later task was found (PETERS-2022). The AFM saw auditors make their own fraud-risk assessment first and
    then use a GenAI tool to challenge it (AFM-12BB-2025, p. 31). A registered-report design will test whether
    an autonomous-motivation prompt offsets harm to judgement from GenAI automation; no results are published
    (HOLMSTROM-2024). NFRA says engagement teams and reviewers must consciously counter the tendency
    (NFRA-STAFF-2026).
  outcomes:
    - {lever: quality, description: "Independent experiment on automated tools in general (not GenAI): auditors were less sceptical relying on automated work than on a team member's; a counter-arguing mindset intervention alleviated the effect. No effect size in the abstract", figure: "no figure in abstract", measures: "experiment with auditor participants; sample size not stated in the abstract read", provenance: independent, source_ref: PETERS-2022}
  prerequisites:
    - "Reviewer templates with an independent-view or argue-against step"
    - "Time in the engagement plan for the extra work (JOFA-5IMP-2026)"
    - "Reviewer training on automation bias (FRC-GENAI-2026, p. 35), and a culture where challenging the tool is rewarded"
  risks_and_guardrails:
    - "The Peters work is a 2022 working paper on automated tools, not GenAI, read from its abstract (PETERS-2022)"
    - "Independent review adds time and may reduce the efficiency gain; the FRC says the nature and extent of review is a matter of professional judgement based on residual risk (FRC-GENAI-2026, p. 37)"
    - "ICAEW's technology faculty chair says the FRC covers automation bias in a single paragraph on page 35 despite long-term effects on judgement (ICAEW-FRCVIEW-2026)"
    - "A Group CIO interviewed by Nyenrode says users need to ask AI explicitly to challenge assumptions or it tends to agree (NYENRODE-2026)"
  human_checkpoints:
    - "Reviewer records an independent view before opening the AI output"
    - "Supervisor spot-checks the quality of challenge"
  role_evolution: >-
    Reviewers act as independent challengers rather than approvers (FRC-GENAI-2026, p. 37).
  evidence_grade: D
  sources:
