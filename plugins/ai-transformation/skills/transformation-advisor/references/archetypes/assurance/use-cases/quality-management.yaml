    - {ref: ICAS-SANDBOX-2026, title: "Driving audit innovation with FRC sandboxes and forums", publisher: "ICAS", type: professional-body, url: "https://icas.com/news-insights-events/news/audit-assurance/driving-audit-innovation-with-frc-sandboxes-and-forums/", date: "2026-07-07", access: full, locator: "section 'Audit tech and AI'"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "Key findings and recommendations, p. 4"}
    - {ref: FRC-AIAUDIT-2025, title: "AI in audit: Illustrative example and documentation guidance", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8384/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "pp. 13-15"}
    - {ref: CPAB-EVOLVING-2025, title: "The evolving use of technology in the audit (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2025-evolving-use-of-technology-in-the-audit-en.pdf", date: "2025-12-16", access: full, locator: "pp. 1-2"}
    - {ref: PCAOB-BOTICSF-2026, title: "Smaller Audit Engagements, Significant Impact: Audit Quality, Investor Protection, and the Future of the Profession (speech, G. Botic; read via text mirror)", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/news-events/speeches/speech-detail/smaller-audit-engagements--significant-impact--audit-quality--investor-protection--and-the-future-of-the-profession", date: "2026-09-22", access: full, locator: "section 'Expanding Use of Technology in Audits'"}
    - {ref: FRC-GENAINEWS-2026, title: "Innovative new guidance supports audit firm adoption of emerging AI technologies (news release)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/news-and-events/news/2026/03/innovative-new-guidance-supports-audit-firm-adoption-of-emerging-ai-technologies/", date: "2026-03-30", access: full, locator: "news release"}
    - {ref: PCAOB-PRIORITIES-2024, title: "Spotlight: Staff Priorities for 2025 Inspections and Interactions With Audit Committees", publisher: "PCAOB (staff)", type: regulator, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/documents/2025-priorities-spotlight_v3.pdf", date: "2024-12", access: full, locator: "p. 5 ('Technology used in the audit'); cover note on staff views"}
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, McConnon answer on objectives for the guidance"}
    - {ref: FIELDGUIDE-PCAOB-2026, title: "PCAOB AI oversight: where the Board stands on AI in audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/pcaob-ai-audit-standards", date: "2026-08-06", access: full, locator: "section 'What the PCAOB Spotlight says about GenAI in audits'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The Gunia remarks reach us through press summaries of Accounting Today, not the PCAOB text. 'Piloting' reflects
    the sandbox's first round; outputs not yet published. The IMC materials are staff drafts, not Board policy.

- id: assurance-quality-management-14
  title: "Idea: use AI in the firm's own quality monitoring, root-cause analysis and triage of inspection findings"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Inspectors find firms' own monitoring weak. IFIAR counted 21 findings in 2025 for failing to identify audit
    performance issues when performing internal inspections (6 in 2024) and 10 findings on root-cause analysis
    or remedial actions; monitoring and remediation was the second most common firm-level theme, with 42 firms
    (32%) having at least one finding (IFIAR-SURVEY-2026). The PCAOB Chairman says engagement-level deficiencies
    are often symptoms of earlier issues in training, supervision, methodology, governance or resource
    allocation (PCAOB-LOGOQC-2026).
  solution: >-
    Idea raised by regulators. The SEC's chief accountant said the SEC asks auditors how they use AI to improve
    engagement-level audit quality and how they use AI to monitor their system of quality control
    (KPMG-HOHL-2026). NFRA's staff paper calls for root-cause analysis of technology-related
    findings to feed the annual evaluation of the system of quality management (NFRA-STAFF-2026). The FRC
    noted that firms' tool use may sometimes be captured in other activities such as root-cause analysis,
    without saying AI does the analysis (FRC-ATT-2025). No firm example was found.
  outcomes:
    - {lever: quality, description: "none published", figure: "none", measures: "no measure published", provenance: independent, source_ref: KPMG-HOHL-2026}
  prerequisites:
    - "Structured inspection, internal-review and engagement data, and a defined root-cause taxonomy"
  risks_and_guardrails:
    - "IFIAR's 2025 survey shows no AI-specific category in firm-wide quality-management findings (IFIAR-SURVEY-2026, Appendix A)"
    - "IFIAR says inspection results do not provide a complete measure of audit quality (IFIAR-SURVEY-2026, p. 2)"
    - "PCAOB staff drafts say about 90% of registration and inspection data are unstructured, a limit on automation at the regulator too (STARLING-IMC-2026)"
  human_checkpoints:
    - "Quality leadership decides which root causes are real and owns conclusions on the system"
    - "Remediation owners sign off actions"
  role_evolution: >-
    Quality staff would move from compiling findings to interpreting AI-surfaced patterns; the SEC's question
    suggests regulators will ask how firms use AI this way (KPMG-HOHL-2026).
  evidence_grade: D
  sources:
    - {ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "p. 2; Appendix A, Tables A.2 and A.3"}
    - {ref: PCAOB-LOGOQC-2026, title: "Statement on the Adoption of QC 1000 Amendments (Chairman D. Logothetis; read via text mirror)", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/news-events/speeches/speech-detail/statement-on-the-adoption-of-qc-1000-amendments", date: "2026-09-09", access: full, locator: "section 'The Hinge Opening the Door to Inspection Modernization'"}
    - {ref: KPMG-HOHL-2026, title: "Q&A with Kurt Hohl, SEC chief accountant", publisher: "KPMG US Board Leadership Center", type: firm, url: "https://kpmg.com/us/en/board-leadership/articles/2026/qa-kurt-hohl-sec-chief-accountant.html", date: "2026-05-27", access: full, locator: "answer on AI and quality control monitoring"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "p. 7 (monitoring and internal inspection)"}
    - {ref: STARLING-IMC-2026, title: "Modernizing US PCAOB Audit Inspections", publisher: "Starling Insights", type: press, url: "https://insights.starlingtrust.com/content/observations/modernizing-us-pcaob-audit-inspections", date: "2026-09-01", access: full, locator: "paragraph on technology"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Monitoring the use and impact of ATTs"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Hohl asked the question; no firm reports doing it. IFIAR figures are counts of findings across member
    firms inspected, as reported by members. The '90% unstructured' figure concerns PCAOB data and is reported
    second-hand from staff materials the Board has not adopted.

- id: assurance-quality-management-15
  title: "Idea: independent third-party validation or assurance of audit firms' own AI tools"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    Smaller firms without in-house expertise may want someone to confirm that a tool works as intended. The
    FRC's head of assurance technology described the market for assurance over AI tools as fragmented, with many
    types of provider and no regulation in the traditional sense, like sustainability assurance a few years
    earlier (ICAEW-POD-2025).
  solution: >-
    Idea discussed on an ICAEW podcast. Deloitte's Martin Brown said third-party providers should be doing
    testing and evaluation for the use case. Grant Thornton UK's Jon Morris said smaller firms would probably
    take more comfort from a provider partnering with a large firm than from a SOX-type report, though it is
    early days (ICAEW-POD-2025).
  outcomes:
    - {lever: risk, description: "none published", figure: "none", measures: "no measure published", provenance: independent, source_ref: ICAEW-POD-2025}
  prerequisites:
    - "Recognised criteria for what a validation covers"
    - "Providers with the independence and competence to assess tools"
  risks_and_guardrails:
    - "Morris expected the market to decide rather than any formal scheme, and called the situation early days (ICAEW-POD-2025)"
    - "The FRC says third-party assurance on a component may inform testing, but the firm may still test it for its use case (FRC-GENAI-2026, p. 32)"
  human_checkpoints:
    - "Firm decides what weight to give a third-party validation when approving a tool"
  role_evolution: >-
    New providers, including some audit firms and boutique assurers, are moving into assurance of AI tools, per
    the FRC's head of assurance technology (ICAEW-POD-2025).
  evidence_grade: D
  sources:
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, final third (independent assurance question)"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p. 32"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea. Assurance over clients' AI is covered by the assurance-over-ai module; this entry concerns validation of
    the auditor's own tools. Change scope is model because it would add a new sourcing route for tool assurance.

- id: assurance-quality-management-16
  title: "Firm-wide audit programmes on an AI-enabled platform, updated centrally to remediate inspection findings"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Sanville & Company, a 20-person firm on a legacy platform, found its methodology limited it; sample-heavy
    testing created bottlenecks at the partner and at engagement quality review, and QC 1000 (the PCAOB's new
    quality-control standard) was approaching (FIELDGUIDE-SANVILLE-2026).
  solution: >-
    Sanville built its audit programmes in Fieldguide, referencing PCAOB standards in each step, and sent
    templates to every engagement at once. Agentic testing handled sample-heavy tracing of incoming client
    support. After an earlier PCAOB exam flagged an issue, the partner updated the programme and pushed it to
    every open engagement the next morning (FIELDGUIDE-SANVILLE-2026).
  outcomes:
    - {lever: quality, description: "First PCAOB inspection conducted entirely on the platform (a broker-dealer engagement) had zero comment forms", figure: "0 comment forms", measures: "comment forms on the firm's first PCAOB inspection on Fieldguide", provenance: vendor-published, source_ref: FIELDGUIDE-SANVILLE-2026}
    - {lever: speed, description: "Platform and methodology overhaul completed in under a year, against an expected 18 to 24 months", figure: "under 1 year vs 18-24 months expected", measures: "time to complete the platform and methodology overhaul, per the partner", provenance: vendor-published, source_ref: FIELDGUIDE-SANVILLE-2026}
    - {lever: growth, description: "Blended realisation on the firm's lowest-margin engagements rose", figure: "$150-200/hr to $250+/hr", measures: "blended realisation per hour on the firm's lowest-margin engagements, per the vendor's customer story", provenance: vendor-published, source_ref: FIELDGUIDE-SANVILLE-2026}
  prerequisites:
    - "A methodology-agnostic platform where the firm writes its own audit programmes"
    - "A small, aligned team willing to move to the platform at once"
  risks_and_guardrails:
    - "One inspection and one firm; a zero-comment result does not isolate AI as the cause, and the figures come from a vendor customer story (FIELDGUIDE-SANVILLE-2026)"
    - "The PCAOB statement about the firm's AI use is quoted by the partner, not published by the PCAOB (FIELDGUIDE-SANVILLE-2026)"
  human_checkpoints:
    - "Partners update programmes; reviewers approve work on the platform"
  role_evolution: >-
    The partner says first-year staff now do complex revenue testing because reviewers have bandwidth to guide
