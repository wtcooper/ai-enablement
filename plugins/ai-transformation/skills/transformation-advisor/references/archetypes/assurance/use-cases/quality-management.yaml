# Use cases: assurance / quality-management
# Part A (entries 01-16) is firm-level AI tool governance under ISQM 1 / PCAOB QC 1000; Part B (17-25) is
# engagement-level supervision, review and documentation of AI output. Sources checked 2026-10-17.
# No entry is graded A: no firm or regulator has published a measured outcome of AI tool governance or review.

# ---- Part A: firm-level AI tool governance ----

- id: assurance-quality-management-01
  title: "Certify each AI tool in the context of a use case, approve it through a central board, and recertify on defined triggers"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Firm quality-management processes were built mainly for transparent, deterministic tools. The IAASB's action
    plan describes AI tools as opaque (limited explainability), non-deterministic (outputs vary for similar
    inputs) and adaptive (behaviour changes over time), which makes it hard to decide how much testing is enough
    before deployment and how to monitor afterwards (IAASB-TQMPLAN-2026). The FRC found trigger identification
    for recertification generally informal at the six largest UK firms (FRC-ATT-2025).
  solution: >-
    The FRC treats the unit of certification as a tool in the context of a use case. Certification evaluates
    inputs (library prompts, information sources), architecture and component logic, then tests outputs on
    default, edge, diverse and known-weakness cases, often with structured criteria; tolerance for deficient
    output is set together with the planned human review. Recertification may be triggered by a material change
    to components or inputs, a materially different use case, observed performance issues, changed standards or
    policies, or elapsed time (FRC-GENAI-2026). At Deloitte UK a Technology Controls Board, set up in April
    2026, reviews technology artefacts before they are approved for pilot and deployment, drawing on the FRC's
    2025 thematic review and ISQM (UK) 1 (DELOITTE-UKTR-2026). An academic reading of 2024 UK transparency
    reports says EY routes technology concepts through a global committee (PREPRINT-AIJGDI-2026). IAASB
    roundtable participants described tiered certification, iterative testing, dynamic monitoring and escalation
    procedures, and said adoption varies significantly across firms (IAASB-TQM-2026). NFRA's staff paper says model updates, data-source changes and vendor changes should trigger revalidation
    (NFRA-STAFF-2026).
  outcomes:
    - {lever: risk, description: "Deloitte UK states that all new tools are subject to quality assessment before deployment as part of its system of quality management; no measure is given", figure: "none published", measures: "n/a (qualitative statement)", provenance: self-reported, source_ref: DELOITTE-UKTR-2025}
    - {lever: risk, description: "FRC: most of the six largest UK firms had well-established certification processes for automated tools; some were less mature and not backed by documented policy; firms were still updating them for AI-specific risks", figure: "most firms (count not given)", measures: "firms among the six largest UK audit firms reviewed (BDO, Deloitte, EY, Forvis Mazars, KPMG, PwC); count per observation not stated", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: risk, description: "FRC: recertification was typically formal only on change; two firms had tool owners confirm annually that no change needed recertification; one firm enforced a minimum three-year recertification", figure: "2 firms (annual confirmation); 1 firm (three-year backstop)", measures: "firms among the six largest UK audit firms reviewed by the FRC", provenance: independent, source_ref: FRC-ATT-2025}
  prerequisites:
    - "An inventory of tools and use cases, a named owner for each, and a decision on the unit of certification (tool alone, or tool in a use case) (FRC-GENAI-2026, p. 30)"
    - "Test sets of representative cases from the target engagements, with structured scoring criteria"
    - "Methodology-team sign-off built into the certification record"
    - "Recertification triggers built into change management, including vendor and model updates (FRC-ATT-2025)"
  risks_and_guardrails:
    - "Training data and component logic usually cannot be obtained from third-party providers, which shifts weight to output testing (FRC-GENAI-2026, pp. 30-32)"
    - "The FRC says LLMs' inherent limitations mean some risk of deficient output always remains, so certification is paired with human review or oversight (FRC-GENAI-2026, p. 26)"
    - "The FRC thematic review is a snapshot from Q2 2024 information requests, when GenAI at the six firms was limited to productivity aids such as chatbots, and firms were still planning AI-specific changes to certification (FRC-ATT-2025)"
    - "Only two of the six firms captured tool limitations in certification templates (FRC-ATT-2025)"
    - "The firm, not the network or vendor, keeps responsibility for approving and monitoring tools (IAASB-TQMPLAN-2026, para 29)"
    - "CPAB suggests a policy on how often tool effectiveness is reassessed, for example when a new version of the underlying LLM is introduced (CPAB-EVOLVING-2025, p. 3)"
  human_checkpoints:
    - "Tool owner, methodology and business approval of the certification"
    - "Central board approval before pilot and again before deployment (Deloitte UK)"
    - "Judgement on tolerance for output deficiencies, linked to the review that will follow"
    - "Quality leadership decision to recertify after a trigger event"
  role_evolution: >-
    Central technology and methodology teams take on certification as a defined role: methodology teams sign off
    in the certification record at most of the six UK firms (FRC-ATT-2025), and the FRC asks methodology staff
    to understand tool limits so guidance matches what outputs can support (FRC-GENAI-2026, p. 40). Deloitte UK
    has created a dedicated board for technology risk (DELOITTE-UKTR-2026). ICAEW notes the FRC guidance is
    aimed mainly at system managers at audit firms (ICAEW-FRCVIEW-2026).
  evidence_grade: B
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 26, 30-33 (certification, recertification), p. 40"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Certification and implementation; Maintenance and monitoring; Appendix C"}
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "Appendix 5, Technology Controls Board, PDF p. 48"}
    - {ref: DELOITTE-UKTR-2025, title: "Deloitte UK annual review 2025: Audit transparency report (year ended 31 May 2025)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report.pdf", date: "2025-09", access: full, locator: "PDF p. 95 (quality assessment before deployment)"}
    - {ref: PREPRINT-AIJGDI-2026, title: "Professional Judgment and AI Governance in Audit and Sustainability Assurance: Public Evidence from the UK Big Four (later published in J. Risk Financial Management 2026, 19(9), 675)", publisher: "Preprints.org", type: academic, url: "https://www.preprints.org/manuscript/202607.1693/v1", date: "2026-07", access: full, locator: "sections 4.2-4.3"}
    - {ref: IAASB-TQMPLAN-2026, title: "Technology Quality Management Workstream: Action Plan to Develop Non-Authoritative Material (Agenda Item 3-F, approved March 2026)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/0260316-Agenda-Item-3F-Approved-Tech-QM-Action-Plan.pdf", date: "2026-03", access: full, locator: "paras 5-10, 20, 29"}
    - {ref: IAASB-TQM-2026, title: "Technology Quality Management Roundtables: Outcomes and Next Steps", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-02/IAASB-Technology-Quality-Management-Roundtables-Feedback.pdf", date: "2026-02-10", access: full, locator: "p. 4 (emerging practices)"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "Principle on validation and revalidation, p. 5"}
    - {ref: CPAB-EVOLVING-2025, title: "The evolving use of technology in the audit (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2025-evolving-use-of-technology-in-the-audit-en.pdf", date: "2025-12-16", access: full, locator: "Firm and network-level considerations, p. 3"}
    - {ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC guidance on generative and agentic AI? (viewpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "intro and 'Smaller firms' sections"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B rests on one named mechanism (Deloitte UK's Technology Controls Board) with no published measure; the
    FRC findings concern automated tools generally (adjacent for GenAI) and are not attributed to named firms.
    Ladder is assist because the governance process is run by people. The EY detail is second-hand via the preprint
    (EY's 2024 report was not opened).

- id: assurance-quality-management-02
  title: "Risk-tiered permitted-use policy: approved tools, pre-approved and barred uses, triage of proposals and a curated prompt library"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Staff will use general AI tools unless the firm says which are allowed and for what. Most of the six largest
    UK firms applied the same certification process to every tool in scope for central certification, regardless
    of its assessed risk or impact (FRC-ATT-2025). Free
    choice of prompts and use cases makes a tool harder to test and to train staff on (FRC-GENAI-2026, p. 35).
  solution: >-
    The firm lists permitted tools and uses, bars some uses and scales validation to risk. PwC US gave staff AI
    training and LLM access for pre-approved work such as administrative tasks before launching audit-specific
    AI (CFODIVE-PWC-2026). Deloitte UK describes GenAI use-case governance with risk thresholding, triage and a
    clearing house within a globally consistent Trustworthy AI framework (DELOITTE-UKTR-2025). PCAOB staff
    outreach in 2024 found some firms barred GenAI in audit or attest procedures while others allowed it for
    administrative tasks and initial drafts (PCAOB-GENAI-2024). NFRA's staff paper says validation
    should be proportionate and distinguish low-risk translation aids from agentic tools that select and test
    samples (NFRA-STAFF-2026). The FRC sets out options: curate a narrow range of use cases or leave staff to
    judge; control prompts centrally, require prompts from a library validated in certification, or let teams
    write their own. Library prompts may have been validated but cannot match the diversity of bespoke prompts
    (FRC-GENAI-2026, pp. 35-36). Deloitte's Martin Brown described firms working out how to approve tools and
    how to balance expectations between central functions and engagement teams (ICAEW-POD-2025).
  outcomes:
    - {lever: risk, description: "No measured outcome. Some firms barred GenAI in audit or attest procedures; others allowed it for administrative tasks and initial drafts", figure: "some firms (count not given)", measures: "audit firms in PCAOB staff outreach, mainly larger firms; count not stated", provenance: independent, source_ref: PCAOB-GENAI-2024}
    - {lever: risk, description: "Deloitte UK lists risk thresholding and triage among its responses to a rated GenAI risk; no result published", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: DELOITTE-UKTR-2025}
  prerequisites:
    - "An approved-tool list and a data-handling rule on what may be uploaded"
    - "A tier definition tied to the effect of a wrong output on audit evidence or conclusions"
    - "A clearing-house owner with authority to say no, and a central owner of any prompt library"
  risks_and_guardrails:
    - "FRC: narrow use-case lists make tools easier to design, test and teach, but cap the value obtained (FRC-GENAI-2026, p. 35)"
    - "FRC lists factors that may call for a more prescriptive approach, including testing that shows performance is sensitive to prompt variations and pilots showing teams do not use the tool consistently (FRC-GENAI-2026, p. 36)"
    - "Tiering relies on judging an output's role correctly; the FRC notes an LLM can play several roles at once depending on the prompt (FRC-GENAI-2026, p. 9)"
    - "Some firms restrict what information may be uploaded to firm GenAI tools for confidentiality reasons (PCAOB-GENAI-2024, p. 4)"
    - "IRBA gives examples of firm policies: permit only certain tools, set minimum qualifications to use them, mandate training, specify the engagement partner's responsibilities (IRBA-SPA11-2025, section B)"
  human_checkpoints:
    - "Clearing-house decision on the tier before build or purchase"
    - "Methodology owner approves each permitted use case and prompt set"
    - "Engagement partner responsible for appropriate use of approved tools (IRBA-SPA11-2025, paras 19-20)"
  role_evolution: >-
    A central risk or clearing-house function decides which proposals proceed and at what depth of testing
    (DELOITTE-UKTR-2025); specialists write and validate prompts that audit teams then use (FRC-GENAI-2026, p.
    36).
  evidence_grade: B
  sources:
    - {ref: CFODIVE-PWC-2026, title: "PwC exec ushers in AI-assisted audits, awaits bigger time savings", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/pwc-exec-ushers-ai-assisted-audits-awaits-bigger-time-savings/832412/", date: "2026-10-07", access: full, locator: "paragraph beginning 'Prior to last year's launch'"}
    - {ref: DELOITTE-UKTR-2025, title: "Deloitte UK annual review 2025: Audit transparency report (year ended 31 May 2025)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report.pdf", date: "2025-09", access: full, locator: "PDF p. 101 (Generative AI risk: key responses)"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB (staff)", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "Observations Related to GenAI Integration in Audits, pp. 4-5"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "Principle on proportionate validation, p. 4"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 9, 35-36"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Certification and implementation: application of certification processes"}
    - {ref: IRBA-SPA11-2025, title: "Staff Audit Practice Alert 11: integration of generative AI into the audit process", publisher: "Independent Regulatory Board for Auditors (South Africa)", type: regulator, url: "https://www.irba.co.za/upload/Staff%20Practice%20Alert%2011%20Sep%202025.pdf", date: "2025-09", access: full, locator: "section B, paras 14-21"}
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, Brown answer after the McConnon remarks on objectives"}
  last_reviewed: "2026-10-17"
  notes: >-
    Pattern is other (a governance gate). Two named firms (PwC US, Deloitte UK), one line of description each, no
    measurement. The PCAOB material is staff outreach from mid-2024, not Board policy; NFRA is read through a press
    report of a staff paper.

- id: assurance-quality-management-03
  title: "Authorised-tool inventory and preventive controls that keep unapproved or outdated AI tools off engagements"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [software-systems, review-assurance]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    AI tools multiply faster than firms approve them, and staff can reach public chatbots. The FRC found firms
    generally did not monitor that teams used only authorised, current tools (FRC-ATT-2025). In a Thomson
    Reuters Institute survey, more than a third of tax and audit professionals admitted using unauthorised AI
    tools (TRI-FOP-2026). The IAASB notes engagement teams may use tools outside the firm's approval channels
    (IAASB-TQMPLAN-2026, para 25).
  solution: >-
    Firms keep directories or inventories of current certified tools and versions and rely on preventive
    controls: authorised software repositories, removal of outdated versions, blocking unauthorised installs,
    remote removal, licence management, and online delivery that makes it easier to offer only the current
    certified version (FRC-ATT-2025). IFIAR asks networks to deploy tools only on approved engagements and to
    run oversight programmes that catch non-approved or decommissioned tools in use, with ongoing coaching on
    proper use (IFIAR-TTF-2026, p. 6). PCAOB board member Botic lists maintaining an inventory of AI tools as
    part of governance (PCAOB-BOTICSF-2026). The IAASB plan covers pre-use evaluation where teams propose tools
    the firm has not approved (IAASB-TQMPLAN-2026, Table 1).
  outcomes:
    - {lever: risk, description: "Most of the six firms kept directories or inventories of current certified tools; usage monitoring covered a subset of widely used tools and mainly counted teams using them, typically for licensing", figure: "most firms (count not given)", measures: "FRC observations at the six largest UK audit firms; count per observation not stated", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: risk, description: "More than a third of surveyed tax and audit professionals admit to using unauthorised AI tools", figure: "more than one-third", measures: "share of professionals in the Thomson Reuters Institute survey who admit using unauthorised AI tools; the page gives no exact figure or sample size", provenance: vendor-published, source_ref: TRI-FOP-2026}
  prerequisites:
    - "A central register of tools, versions and approved use cases, with an owner for each (FRC-ATT-2025)"
    - "Software-distribution, endpoint and network controls"
    - "Approved enterprise AI alternatives and a clear acceptable-use policy on confidential data"
  risks_and_guardrails:
    - "FRC: firms generally relied on preventive controls and did not monitor that teams used only authorised and current tools (FRC-ATT-2025)"
    - "Banning tools without approved alternatives pushes use out of sight; TRI says establishing governance, approving secure tools and giving usage guidance are essential (TRI-FOP-2026)"
    - "AFM asks firms to ensure confidential client data used as tool input is processed, transferred and stored safely (AFM-12BB-2025, p. 3)"
    - "Botic's lifecycle expectations are one PCAOB board member's view, not Board policy (PCAOB-BOTICSF-2026)"
    - "PCAOB staff heard in 2024 that some firms did not allow GenAI for audit or attest procedures, citing data privacy and reliability (PCAOB-GENAI-2024, p. 4)"
  human_checkpoints:
    - "Escalation when an unapproved or outdated tool is found in use"
    - "Exceptions approved by a named function"
    - "Periodic engagement reviews for incorrect or unapproved use (IFIAR-TTF-2026, p. 6)"
  role_evolution: >-
    IFIAR asks networks to deploy tools only on approved engagements and to run oversight programmes that
    catch non-approved or decommissioned tools (IFIAR-TTF-2026, p. 6); the FRC asks firms to define where
    monitoring responsibility sits for globally deployed tools (FRC-ATT-2025).
  evidence_grade: C
  sources:
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Maintenance and monitoring: certified tool repositories; restricting access to unapproved or outdated ATTs"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "Network-wide and member firm-level considerations, p. 6"}
    - {ref: PCAOB-BOTICSF-2026, title: "Smaller Audit Engagements, Significant Impact: Audit Quality, Investor Protection, and the Future of the Profession (speech, G. Botic; read via text mirror)", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/news-events/speeches/speech-detail/smaller-audit-engagements--significant-impact--audit-quality--investor-protection--and-the-future-of-the-profession", date: "2026-09-22", access: full, locator: "section 'Expanding Use of Technology in Audits'"}
    - {ref: IAASB-TQMPLAN-2026, title: "Technology Quality Management Workstream: Action Plan to Develop Non-Authoritative Material (Agenda Item 3-F, approved March 2026)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/0260316-Agenda-Item-3F-Approved-Tech-QM-Action-Plan.pdf", date: "2026-03", access: full, locator: "para 25(c); Table 1"}
    - {ref: TRI-FOP-2026, title: "Future of Professionals Report 2026: what tax and audit firm leaders should be prioritizing now (summary page)", publisher: "Thomson Reuters Institute", type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "Universal priorities: 'Govern the tools being used'"}
    - {ref: AFM-12BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "p. 3"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB (staff)", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p. 4"}
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "Appendix 5, p. 48; leadership biographies"}
    - {ref: PREPRINT-AIJGDI-2026, title: "Professional Judgment and AI Governance in Audit and Sustainability Assurance: Public Evidence from the UK Big Four (later published in J. Risk Financial Management 2026, 19(9), 675)", publisher: "Preprints.org", type: academic, url: "https://www.preprints.org/manuscript/202607.1693/v1", date: "2026-07", access: full, locator: "sections 4.2 and 4.3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: the inventory and preventive controls are observed by the FRC across six firms without attribution to
    any one firm, and the evidence covers automated tools generally rather than GenAI. Deloitte UK's Technology
    Controls Board and Chief AI Officer (DELOITTE-UKTR-2026) and the preprint's account of EY's and Deloitte's
    approval processes (PREPRINT-AIJGDI-2026) concern approval rather than inventory and are carried in entries 01
    and 08. The TRI figure is vendor-published, with no exact figure or sample size on the page.

- id: assurance-quality-management-04
  title: "Evaluation sets, benchmarks and parallel running before and during limited deployment of an AI tool"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Tolerance for deficient outputs is a professional judgement, tests of LLM outputs are often qualitative, and
    no public benchmark or firm result says how often an audit agent's output is wrong in live use
    (FRC-GENAI-2026, p. 32). A tool released to a few teams before certification is complete may produce more
    deficient outputs, because training, guidance and prompt libraries are not yet refined (FRC-GENAI-2026, p.
    33).
  solution: >-
    Firms build representative test sets and score tool output against them before release and after model
    changes. IFIAR lists emerging practice such as internal benchmarking of tool-driven results against traditional
    methods, and thematic reviews with metrics such as false-positive and false-negative rates versus a manual
    sample, rework rates and escalation incidence (IFIAR-TTF-2026, pp. 8-9). The FRC says firms may release a tool to a limited number of teams for feedback
    before full certification, and that teams often perform the alternative procedures in full, in parallel with
    the AI-enabled procedure (FRC-GENAI-2026, p. 33); its thematic review adds that pilots often precede full
    deployment, and some firms run them on lower-risk non-PIE audits or pick audits by business unit or sector
    (FRC-ATT-2025). The AUASB suggests running a tool in parallel
    with other procedures in its first year on an engagement (AUASB-AI-2025).
  outcomes:
    - {lever: quality, description: "Independent benchmark, not a firm result: eleven frontier models on audit workpaper completion and review tasks complete substantial portions of staff-level work but sometimes perform inappropriate procedures or write incorrect documentation; no pass rate in the abstract", figure: "no figure in abstract", measures: "90 tasks across six synthetic engagements (about 179 files each); eleven models evaluated", provenance: independent, source_ref: ARXIV-FAB-2026}
    - {lever: risk, description: "No results of parallel runs are published", figure: "none", measures: "no measure published", provenance: independent, source_ref: FRC-GENAI-2026}
  prerequisites:
    - "A held-out set of engagements or contracts with known answers (synthetic or de-identified)"
    - "Scoring criteria agreed before testing, and a failure rate that blocks release"
    - "Willingness to carry the cost of doing the work twice during the pilot"
  risks_and_guardrails:
    - "Synthetic tasks may not reflect live client data; the benchmark authors built theirs from differentially private statistics of historical audits (ARXIV-FAB-2026)"
    - "A passed test does not remove the need for review; the FRC ties tolerance for output deficiencies to the extent of human review (FRC-GENAI-2026, p. 32)"
    - "Parallel runs could give measurements of tool error against human work, but none are public (FRC-GENAI-2026, p. 33)"
  human_checkpoints:
    - "Methodology and technical audit specialists agree the pass criteria"
    - "Quality or methodology team decides when a pilot can end and the tool can be released"
  role_evolution: >-
    Evaluation becomes a standing task for technical audit specialists alongside methodology work; the FRC says
    outputs are often tested qualitatively with structured criteria (FRC-GENAI-2026, p. 32).
  evidence_grade: C
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 32-33 (certification testing; limited deployment)"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Deployment"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp. 8-9 (examples of emerging practices)"}
    - {ref: AUASB-AI-2025, title: "Impact of AI on Auditors (web guidance)", publisher: "Auditing and Assurance Standards Board (Australia)", type: standard-setter, url: "https://www.auasb.gov.au/publications/impact-of-ai-on-auditors/", date: "2025-07", access: full, locator: "Considerations: alternative procedures"}
    - {ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    'Piloting' rests on the FRC's statement that teams often run procedures in parallel during limited deployment;
    no firm is named and no parallel-run result is public. Parallel runs are the main route to an independent
    error-rate measure. The benchmark is an arXiv preprint read from its abstract.

- id: assurance-quality-management-05
  title: "Embed methodology in AI-tool design and validate how much assurance an AI-enabled procedure contributes"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [expert-judgment, document-production]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    The FRC names non-compliant methodology as a risk: the firm's methodology may permit approaches that fail
    auditing standards even when the tool works and is used as specified (FRC-GENAI-2026, pp. 6, 18-19). IFIAR
    members' most frequent technology findings in 2023 and 2024 were misreading tool results and thin testing of
    outliers (IFIAR-TTF-2025, pp. 5-6).
  solution: >-
    Methodology teams join tool development, and certification validates the supporting methodology against
    auditing standards (FRC-GENAI-2026, p. 40). In the FRC's contract-review example the assurance from the
    AI-enabled procedure is linked to confidence in the tool's risk indicators and sampling, which sets the
    substantive testing still needed (FRC-GENAI-2026, p. 56). NFRA's staff paper says a tool's
    low-risk classification should be periodically tested and full-population testing does not remove risk
    assessment (NFRA-STAFF-2026). CPAB saw tools used as the primary evidence source with limited validation
    of input data, and one tool where testing was limited to flagged items (CPAB-EVOLVING-2025, p. 1).
  outcomes:
    - {lever: risk, description: "FRC: most of the six largest UK firms capture methodology-team input and sign-off in certification documents", figure: "most of six", measures: "firms among the six reviewed whose certification documents capture methodology input", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: risk, description: "IFIAR: members reporting findings that a tool was not used as intended", figure: "31% (2024); 29% (2023)", measures: "percentage of IFIAR members reporting such findings; denominator not stated in the text read", provenance: independent, source_ref: IFIAR-TTF-2025}
  prerequisites:
    - "Methodology representatives on the tool project team"
    - "A written statement of what the tool's output can and cannot support"
    - "Residual-testing rules for items the tool rates low risk"
  risks_and_guardrails:
    - "NFRA staff caution against relying on vendor accuracy claims without independent evaluation (NFRA-STAFF-2026)"
    - "NFRA staff say technology-generated information has no separate, lower evidentiary bar and becomes evidence only after the auditor evaluates its relevance and reliability (NFRA-STAFF-2026)"
    - "The FRC says AI outputs need not exactly match the persuasiveness of the procedure they replace, provided the methodology does not overstate it and the overall approach meets auditing standards (FRC-GENAI-2026, p. 19)"
  human_checkpoints:
    - "Methodology team approves how tool output is used as evidence"
    - "Engagement team tests data inputs and a sample of low-risk-rated items"
  role_evolution: >-
    A methodology specialist works alongside engineers at the design stage; RSM UK's audit data analytics
    director, who sat on the FRC technology working group, urged technology teams to secure auditor buy-in
    (ICAEW-FRCVIEW-2026).
  evidence_grade: C
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 6, 18-19, 40, 55-56"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Integration with audit methodology"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution (2025 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp. 5-6"}
    - {ref: CPAB-EVOLVING-2025, title: "The evolving use of technology in the audit (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2025-evolving-use-of-technology-in-the-audit-en.pdf", date: "2025-12-16", access: full, locator: "p. 1"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "pp. 4, 6 (evidentiary bar; don'ts)"}
    - {ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC guidance on generative and agentic AI? (viewpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "section 'Encouraging audit and tech teams to collaborate'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The IFIAR and CPAB findings concern automated tools generally and are not specific to GenAI, so the grade is
    capped at C. NFRA's paper is staff material, not Authority policy.

- id: assurance-quality-management-06
  title: "Due diligence, contracting and revalidation for third-party AI tools and foundation models, scaled for smaller firms"
  archetype: assurance
  module: quality-management
  function: procurement-supply-chain
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Firms generally obtain the foundation model from a third party and often cannot evaluate its training data
    or component logic (IAASB-TQMPLAN-2026, para 25; FRC-GENAI-2026, pp. 30-31). Smaller firms lean heavily on
    third-party providers and lack the technology and methodology specialists the FRC guidance assumes
    (ICAEW-FRCVIEW-2026). The AFM found vendor management and information-security frameworks needed formalising
    at several firms (AFM-12BB-2025, p. 5).
  solution: >-
    All six largest UK firms considered vendor control environments, data security and confidentiality when
    selecting a third-party tool, using supplier questionnaires or assurance reports; one firm piloted several
    vendors before choosing (FRC-ATT-2025). Where information cannot be obtained, the FRC says the firm may rely
    on independent assurance and may test more itself (FRC-AIAUDIT-2025, pp. 13-15; FRC-GENAI-2026, pp. 30-32).
    CPAB points to a SOC 2 report over IT general controls for off-the-shelf tools (CPAB-AI-2024). NFRA's staff paper calls for contract terms on data protection, IP, explainability documentation, audit
    rights and business continuity (NFRA-STAFF-2026). For smaller firms, Grant Thornton UK's Jon Morris
    advised starting small with granular, easily checked tasks and Deloitte's Martin Brown advised asking
    providers what testing they have done for the use case (ICAEW-POD-2025); Botic said the question for smaller
    firms is whether a tool addresses a real audit need and can be governed effectively (PCAOB-BOTICSF-2026).
    The IAASB says its guides will aim to be scalable and proportionate (IAASB-TQMPLAN-2026, para 16).
  outcomes:
    - {lever: risk, description: "All six firms considered vendor control environments, data security and confidentiality when selecting third-party tools; no outcome published", figure: "6 of 6 firms (practice described; no result)", measures: "the six largest UK audit firms reviewed by the FRC", provenance: independent, source_ref: FRC-ATT-2025}
  prerequisites:
    - "A vendor questionnaire covering model changes, logging and sub-processors"
    - "A contract right to notice of material model updates, and a rule for when independent assurance is required"
    - "A named owner for tool oversight, even in a small firm"
  risks_and_guardrails:
    - "NFRA staff warn against relying on vendor accuracy claims without independent evaluation, and say a firm cannot rely on a vendor's terms of service, without validation, to protect client data (NFRA-STAFF-2026)"
    - "Third-party assurance on a component may inform testing, but the firm may still test it for the use case (FRC-GENAI-2026, p. 32)"
    - "ICAEW's technology faculty chair says the FRC guidance gives little on questions to put to vendors, although most audit AI tools are features added to existing products (ICAEW-FRCVIEW-2026)"
    - "IAASB stakeholders raised an uneven playing field: larger firms are better able than small and medium practices to govern such tools (IAASB-TQMPLAN-2026, para 11)"
    - "The AFM says some larger firms lead on policies and risk management and there is room for improvement at all firms (AFM-2025)"
  human_checkpoints:
    - "Procurement, information security and methodology approve the vendor before onboarding"
    - "Firm re-approves the tool when the vendor changes the model"
    - "In small firms, a partner decides whether a tool is fit for a defined use case"
  role_evolution: >-
    IT, procurement and information-security teams join methodology teams in approving tools (FRC-ATT-2025);
    smaller firms without technology and methodology specialists lean on third-party providers
    (ICAEW-FRCVIEW-2026).
  evidence_grade: C
  sources:
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Design or selection: sourcing an ATT from a third party"}
    - {ref: FRC-AIAUDIT-2025, title: "AI in audit: Illustrative example and documentation guidance", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8384/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "pp. 13-15 (third-party considerations)"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 30-32"}
    - {ref: CPAB-AI-2024, title: "The use of artificial intelligence in the audit: balancing innovation and risk (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2024-use-of-artificial-intelligence-in-the-audit-en.pdf", date: "2024-09-12", access: full, locator: "p. 2, fn. 3"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "pp. 5-7 (data protection; don'ts; vendor oversight)"}
    - {ref: AFM-12BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "p. 5"}
    - {ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC guidance on generative and agentic AI? (viewpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "sections 'Smaller firms may have specific considerations' and 'Misinterpretation or misuse...'"}
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, final third (off-the-shelf solutions)"}
    - {ref: PCAOB-BOTICSF-2026, title: "Smaller Audit Engagements, Significant Impact: Audit Quality, Investor Protection, and the Future of the Profession (speech, G. Botic; read via text mirror)", publisher: "PCAOB", type: regulator, url: "https://pcaobus.org/news-events/speeches/speech-detail/smaller-audit-engagements--significant-impact--audit-quality--investor-protection--and-the-future-of-the-profession", date: "2026-09-22", access: full, locator: "section 'Expanding Use of Technology in Audits'"}
    - {ref: IAASB-TQMPLAN-2026, title: "Technology Quality Management Workstream: Action Plan to Develop Non-Authoritative Material (Agenda Item 3-F, approved March 2026)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/0260316-Agenda-Item-3F-Approved-Tech-QM-Action-Plan.pdf", date: "2026-03", access: full, locator: "paras 11, 16, 25"}
    - {ref: AFM-2025, title: "12 building blocks for controlled use of advanced (Gen)AI auditing tools (press release)", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/en/sector/actueel/2025/dec/pb-12-bouwstenen-beheerst-gebruik-audit-tooling", date: "2025-12-11", access: full, locator: "press release text"}
  last_reviewed: "2026-10-17"
  notes: >-
    Regulator-observed for non-GenAI tools at firms not named per finding; principle-level otherwise. The
    smaller-firm advice comes from named practitioners on an ICAEW podcast.

- id: assurance-quality-management-07
  title: "Monitor AI tools' use and audit-quality impact with defined metrics and dashboards, and settle who monitors network-built tools"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [data-reporting, review-assurance]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Firms count usage, mostly for licensing, but do not quantify how tools affect audit quality: the six largest
    UK firms did no formal monitoring to quantify audit-quality impact and generally had no KPIs on tool usage
    (FRC-ATT-2025). A Dutch review found usage estimated rather than measured for most tools (AFM-12BB-2025).
    Tools are built by networks, but ISQM 1 applies to each member firm; IFIAR members said it is sometimes
    unclear who monitors a globally developed tool (IFIAR-TTF-2025, p. 6), and networks organise this
    differently, with a risk of fragmented coverage (IFIAR-TTF-2026, p. 8).
  solution: >-
    IFIAR's examples of emerging practice are thematic reviews across engagements with defined metrics
    (engagement coverage, false-positive and false-negative rates against a manual sample, rework rates,
    escalation incidence), dashboards of usage trends, and internal benchmarking against traditional methods
    (IFIAR-TTF-2026, pp. 8-9). The FRC guidance says monitoring should cover output quality and consistency,
    patterns of failure and unexpected behaviour, and the effect on audit quality (FRC-GENAI-2026, p. 33). The
    AFM describes one unnamed firm whose dashboard lets a board member see deviations and outliers found by an
    audit tool and how the auditor handled them (AFM-12BB-2025, p. 15). On ownership, two of the six largest UK
    firms required a UK owner and UK-level certification for globally certified tools, relying partly on global
    steps (FRC-ATT-2025); the IAASB plan maps responsibilities across network, firm and engagement team and says
    the firm keeps responsibility for approval and monitoring wherever the work is done (IAASB-TQMPLAN-2026,
    paras 28-29).
  outcomes:
    - {lever: quality, description: "AFM: for most auditing tools, engagement-level usage was estimated rather than measured", figure: "74% estimated; 20% actual data; 6% unclear", measures: "share of auditing tools by how engagement-level usage is monitored, from the AFM's collected data (on-site study of 11 non-PIE and 2 PIE audit firms plus a data request to six PIE firms; population behind the chart not stated)", provenance: independent, source_ref: AFM-12BB-2025}
    - {lever: quality, description: "FRC: no formal monitoring to quantify audit-quality impact at the six firms; one firm reported usage against targets for certain key tools", figure: "0 of 6 quantified impact; 1 of 6 reported usage against targets", measures: "firms among the six largest UK audit firms reviewed by the FRC", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: risk, description: "FRC: firms requiring a UK owner and UK-level certification of globally certified tools; practice ranged from full UK-level certification to none", figure: "2 of 6", measures: "firms among the six reviewed", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: quality, description: "Academic, adjacent and pre-generative-AI: across the 36 largest audit firms, a one-standard-deviation change in AI investment (proxied by AI-worker employment) is associated with lower restatement likelihood and fees", figure: "-5.0% likelihood of an audit restatement; -0.9% audit fees", measures: "association from resume data on more than 310,000 individuals at 36 firms; not a measure of any one tool", provenance: independent, source_ref: FEDYK-2022}
  prerequisites:
    - "Tools that log use and outputs by engagement"
    - "A manual or independent baseline to compare against, and KPIs agreed with quality leadership (IFIAR-TTF-2026, p. 9)"
    - "A responsibility matrix per tool (network, firm, engagement) and a feedback route from member firms to the network tool owner"
    - "Linkage to internal and external inspection findings and root-cause analysis"
  risks_and_guardrails:
    - "Usage monitoring is not impact monitoring: firms mainly counted teams using a tool, typically for licensing (FRC-ATT-2025)"
    - "IFIAR says technology use should be assessed as part of the whole system of quality management, not standalone, and the metrics themselves reviewed periodically (IFIAR-TTF-2026, pp. 8-9)"
    - "IFIAR's observations rest on information shared with it and are not a comprehensive assessment of firms or tools (IFIAR-TTF-2026, p. 3)"
    - "ISQM 1 requires the firm to consider the effect of network monitoring on its own monitoring (IAASB-TQMPLAN-2026, fn. 7 and para 29)"
    - "The Fedyk association concerns AI-worker investment before generative AI and cannot be read as the effect of any tool (FEDYK-2022)"
  human_checkpoints:
    - "Quality leadership reviews tool-impact metrics periodically and decides to restrict, retrain or recertify"
    - "Member-firm quality leader accepts a network-built tool for the firm's system of quality management"
    - "Technical experts review sampled engagements for incorrect use"
  role_evolution: >-
    Quality and methodology staff gain a data-analysis task, reading tool telemetry alongside inspection
    findings (AFM-12BB-2025, p. 15); two of the six largest UK firms assign a UK owner to globally deployed tools (FRC-ATT-2025).
  evidence_grade: C
  sources:
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Maintenance and monitoring: monitoring the use and impact of ATTs; Global versus UK certification"}
    - {ref: BOARDAGENDA-FRC-2026, title: "Auditors warned they remain accountable despite use of AI", publisher: "Board Agenda", type: press, url: "https://boardagenda.com/2026/03/31/auditors-warned-they-remain-accountable-despite-use-of-ai/", date: "2026-03-31", access: full, locator: "paragraph on last year's FRC review of six firms' monitoring of automated tools"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p. 33 (monitoring)"}
    - {ref: AFM-12BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "pp. 14-15 (building block 3)"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution (2025 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "pp. 5-6 (ISQM 1 perspectives, point 1)"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp. 3, 8-9"}
    - {ref: IAASB-TQMPLAN-2026, title: "Technology Quality Management Workstream: Action Plan to Develop Non-Authoritative Material (Agenda Item 3-F, approved March 2026)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/0260316-Agenda-Item-3F-Approved-Tech-QM-Action-Plan.pdf", date: "2026-03", access: full, locator: "paras 28-29, fn. 7, Table 1"}
    - {ref: FEDYK-2022, title: "Is artificial intelligence improving the audit process? (abstract page)", publisher: "Review of Accounting Studies (via RePEc)", type: academic, url: "https://ideas.repec.org/a/spr/reaccs/v27y2022i3d10.1007_s11142-022-09697-x.html", date: "2022", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    'Piloting' is inferred from IFIAR's statement that some firms have started oversight committees and internal
    protocols to validate tool effectiveness, and from the AFM's single unnamed good-practice dashboard. No firm has
    published any of the metrics IFIAR suggests. Board Agenda reports the FRC review as finding that none of the six
    firms monitored tools' impact on audit quality (BOARDAGENDA-FRC-2026). The FRC's own wording is narrower:
    monitoring mainly counted teams using tools, there was no formal monitoring to quantify audit-quality impact, and
    firms were developing capabilities to monitor usage and impact (FRC-ATT-2025, executive summary and p. 20). Quote
    the FRC wording ('0 of 6 quantified impact'), not the press summary.

- id: assurance-quality-management-08
  title: "Leadership and independent board oversight of AI in the firm's quality plan, with an AI oversight committee and escalation channels"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    ISQM 1 places governance and leadership at the centre of the system of quality management, and the IAASB
    records that using AI-enabled tools reaches beyond the technological-resources objective into governance,
    resources, acceptance, ethics and engagement performance (IAASB-TQMPLAN-2026, para 9). Unexpected AI outputs
    or failures may be noticed by engagement teams but not reach the tool owner or quality function.
  solution: >-
    Deloitte UK's independent Audit Governance Board reviewed the firm's Single Quality Plan, which had evolved
    to cover AI, and discussed governance of increasing AI use in audit with a 'human in the loop' central to
    the approach; the firm's UK Chief AI Officer is responsible for embedding responsible AI governance across
    client services and internal operations (DELOITTE-UKTR-2026). IFIAR suggests formal escalation pathways for
    unexpected outputs or operational failures, user feedback on whether tools are fit for purpose, ethical
    governance structures such as AI oversight committees, and whistleblowing procedures covering AI use
    (IFIAR-TTF-2026, pp. 6-7), and notes some firms have started oversight committees and internal protocols to
    validate tool effectiveness (p. 8). CPAB lists escalation and whistleblowing processes to identify anomalies
    in tools (CPAB-EVOLVING-2025, p. 3). IAASB roundtable participants described escalation procedures for
    anomalous tool behaviour as an emerging practice (IAASB-TQM-2026, p. 4).
  outcomes:
    - {lever: risk, description: "No outcome published. The governance bodies and the board's AI-related discussions are described in the firm's transparency report", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: DELOITTE-UKTR-2026}
  prerequisites:
    - "A quality plan that names AI as a risk theme, with a standing agenda item and reporting metrics"
    - "A tool owner with authority to withdraw or restrict a tool"
    - "A cross-functional group covering methodology, technology, ethics and quality, and a channel for teams to report issues (IFIAR-TTF-2026, pp. 6-7)"
  risks_and_guardrails:
    - "IFIAR says practices vary significantly across jurisdictions and firms (IFIAR-TTF-2026, p. 8)"
    - "The FRC found firms' monitoring mainly counted teams using tools, typically for licensing, and did not quantify audit-quality impact (FRC-ATT-2025)"
    - "Escalation pathways, feedback loops and whistleblowing channels are presented by regulators as practices to consider; no firm is named as running them (IFIAR-TTF-2026; CPAB-EVOLVING-2025)"
  human_checkpoints:
    - "Board reviews AI governance themes in the quality plan"
    - "Committee or tool owner decides to pause, restrict or re-approve a tool after an incident"
    - "Escalation path from tool owners to the board"
  role_evolution: >-
    A chief AI officer role appears in the firm's governance report and non-executives discuss AI governance in
    audit (DELOITTE-UKTR-2026); IFIAR suggests ethical governance structures, such as AI oversight
    committees, to monitor responsible use (IFIAR-TTF-2026, p. 7).
  evidence_grade: B
  sources:
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "PDF pp. 7, 27, 48"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp. 6-8"}
    - {ref: CPAB-EVOLVING-2025, title: "The evolving use of technology in the audit (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2025-evolving-use-of-technology-in-the-audit-en.pdf", date: "2025-12-16", access: full, locator: "Firm and network-level considerations, p. 3"}
    - {ref: IAASB-TQM-2026, title: "Technology Quality Management Roundtables: Outcomes and Next Steps", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-02/IAASB-Technology-Quality-Management-Roundtables-Feedback.pdf", date: "2026-02-10", access: full, locator: "p. 4"}
    - {ref: IAASB-TQMPLAN-2026, title: "Technology Quality Management Workstream: Action Plan to Develop Non-Authoritative Material (Agenda Item 3-F, approved March 2026)", publisher: "IAASB", type: standard-setter, url: "https://www.iaasb.org/_flysystem/azure-private/2026-03/0260316-Agenda-Item-3F-Approved-Tech-QM-Action-Plan.pdf", date: "2026-03", access: full, locator: "para 9"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Maintenance and monitoring: monitoring the use and impact of ATTs"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B rests on Deloitte UK's board review and Chief AI Officer only, described in a firm-authored regulatory
    disclosure. The escalation, feedback and whistleblowing components remain regulator suggestions with no named
    adoption.

- id: assurance-quality-management-09
  title: "ISO/IEC 42001 certification of the firm's own AI management system"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Firms need external reference points for governing their own AI use. SEC staff said at the December 2025
    AICPA conference that there is no single authority or framework for AI governance; that remark concerned
    preparers, not audit firms (RSM-SECPCAOB-2025).
  solution: >-
    KPMG announced in November 2025 that it had achieved ISO 42001 certification, which it described as
    independent validation that its internal AI management systems align with emerging global standards and as a
    necessary precursor to providing AI assurance services. KPMG said it is the first Big Four firm to achieve
    it. The announcement does not say which KPMG entity was certified (AT-KPMGISO-2025).
  outcomes:
    - {lever: risk, description: "Certification achieved; no quality measurement published", figure: "none", measures: "no measure published", provenance: self-reported, source_ref: AT-KPMGISO-2025}
  prerequisites:
    - "An accredited certification body and a documented AI management system"
  risks_and_guardrails:
    - "A management-system certificate shows governance, not that any tool's output is reliable on an engagement"
    - "Fieldguide, a vendor, says it also holds ISO 42001 certification (FIELDGUIDE-PCAOB-2026)"
  human_checkpoints:
    - "Not described in the sources"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: B
  sources:
    - {ref: AT-KPMGISO-2025, title: "Tech News: KPMG hails ISO 42001 certification", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/list/tech-news-kpmg-hails-iso-42001-certification", date: "2025-11-21", access: full, locator: "first item"}
    - {ref: FIELDGUIDE-PCAOB-2026, title: "PCAOB AI oversight: where the Board stands on AI in audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/pcaob-ai-audit-standards", date: "2026-08-06", access: full, locator: "section 'How firms should evaluate AI tools under PCAOB expectations'"}
    - {ref: RSM-SECPCAOB-2025, title: "Insights from the 2025 AICPA Conference on Current SEC and PCAOB Developments", publisher: "RSM US", type: conference, url: "https://rsmus.com/content/dam/rsm/insights/financial-reporting/1pdf/insights-from-the-2025-aicpa-conference-on-current-sec-and-pcaob-developments-12-25.pdf", date: "2025-12", access: full, locator: "section 2.1, 'Controls and governance'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The 'first of the Big Four' claim is KPMG's, reported by Accounting Today via a KPMG spokesperson. KPMG ties it
    to AI assurance services, which the assurance-over-ai module covers.

- id: assurance-quality-management-10
  title: "Role-differentiated AI training gated to tool access, with in-workflow micro-training"
  archetype: assurance
  module: quality-management
  function: people-hr
  work_types: [coordination-scheduling, review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Reviewers who cannot judge when AI output is wrong cannot review it. The FRC says that if a tool is known to
    sound confident when it is wrong, staff must know this, and treats education as ongoing rather than a launch
    task (FRC-GENAI-2026, pp. 34-35). In a survey of 54 US CPA firms of varying sizes, untrained staff was the
    top-ranked blocker to audit transformation (CPACOM-ATR-2025).
  solution: >-
    Training is differentiated by user group and mapped to competencies, with records and refresher intervals
    proportionate to risk (IFIAR-TTF-2026, p. 7). The FRC says it should cover when and how to use a tool, how
    to review and oversee it, automation bias (over-trusting machine output) and known tool weaknesses
    (FRC-GENAI-2026, pp. 34-35). NFRA's staff paper: preparers trained on safe use, reviewers on
    critical evaluation and bias awareness, engagement partners on governance and disclosure judgement
    (NFRA-STAFF-2026). Per an academic reading of 2024 UK transparency reports, PwC made GenAI fundamentals
    training mandatory before access to ChatPwC and KPMG trained all auditors in prompt engineering at its 2024
    Audit University (PREPRINT-AIJGDI-2026). Deloitte UK describes AI fluency programmes with bespoke plans for
    different user groups (DELOITTE-UKTR-2025), a pilot reskilling programme in responsible AI use, and graduate
    training with audit simulations in which trainees apply traditional methods alongside AI-assisted techniques
    (DELOITTE-UKTR-2026). EY says it has built a global training programme to upskill its audit and technology
    risk professionals (EY-CANVAS-2026). Deloitte announced on 24 June 2026 a 'tutor mode' in Omnia giving
    on-demand micro-training in the context of the work being performed (DELOITTE-OMNIA-2026).
  outcomes:
    - {lever: risk, description: "Context, not a training result: staff not trained in advanced approaches or methodologies was the top-ranked blocker in a small and mid-size firm survey", figure: "66%", measures: "share of the 54 surveyed US CPA firms with complete data ranking 'staff are not trained in advanced approaches or methodologies' among top blockers; the report says the survey is not representative", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: quality, description: "No measure of training's effect on review quality is published; tutor mode is announced without evidence of use", figure: "none", measures: "no measure published", provenance: self-reported, source_ref: DELOITTE-OMNIA-2026}
  prerequisites:
    - "Role definitions for preparers, reviewers and partners"
    - "Access control that ties tool access to training completion, with training records"
    - "A catalogue of known tool performance issues fed by certification and monitoring (FRC-GENAI-2026, p. 35)"
  risks_and_guardrails:
    - "Prompt skill alone is not professional competence, in the preprint author's view (PREPRINT-AIJGDI-2026, section 4.4)"
    - "ICAEW's technology faculty chair stresses training on judgement and scepticism over outputs, not only how to use the software, and says the FRC covers automation bias in a single paragraph (ICAEW-FRCVIEW-2026)"
    - "Researchers flag deskilling risk as work shifts from preparing to reviewing; no results are published (HOLMSTROM-2024)"
  human_checkpoints:
    - "Tool access conditional on completed training"
    - "Training mapped to required competencies, with learning outcomes assessed and records kept (IFIAR-TTF-2026, p. 7)"
    - "Reviewer competence matched to the use case (FRC-GENAI-2026, p. 37)"
  role_evolution: >-
    Graduates start AI-assisted work earlier but must still learn the underlying method; Deloitte UK describes
    simulations that combine both (DELOITTE-UKTR-2026), and Deloitte says professionals will supervise, validate
    and work alongside AI (DELOITTE-OMNIA-2026).
  evidence_grade: B
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "Staff education and governance, pp. 34-37"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "p. 7"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "p. 7 (training and competence)"}
    - {ref: PREPRINT-AIJGDI-2026, title: "Professional Judgment and AI Governance in Audit and Sustainability Assurance: Public Evidence from the UK Big Four (later published in J. Risk Financial Management 2026, 19(9), 675)", publisher: "Preprints.org", type: academic, url: "https://www.preprints.org/manuscript/202607.1693/v1", date: "2026-07", access: full, locator: "section 4.4"}
    - {ref: DELOITTE-UKTR-2025, title: "Deloitte UK annual review 2025: Audit transparency report (year ended 31 May 2025)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report.pdf", date: "2025-09", access: full, locator: "PDF p. 101 (training plans)"}
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "PDF p. 5; risk response lists, 'Firmwide AI learning'"}
    - {ref: EY-CANVAS-2026, title: "EY Rolls Out Agentic AI in Assurance Across Its Global Network of Accounting Firms", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/04/07/ey-rolls-out-agentic-ai-in-assurance-across-its-global-network-of-accounting-firms/181097/", date: "2026-04-07", access: full, locator: "final paragraphs on training"}
    - {ref: DELOITTE-OMNIA-2026, title: "Deloitte unveils connected agentic intelligence in Deloitte Omnia to advance audit and assurance", publisher: "Deloitte", type: firm, url: "https://www.deloitte.com/global/en/about/press-room/unveils-connected-agentic-intelligence-omnia-advance-audit-assurance.html", date: "2026-06-24", access: full, locator: "section 'Investing in upskilling for an AI-enabled future'"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report (CPA.com and AICPA 2025 Audit Benchmark Survey)", publisher: "CPA.com / AICPA", type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p. 8 (chart of top-ranked blockers); introduction (54 firms)"}
    - {ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC guidance on generative and agentic AI? (viewpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "section 'Misinterpretation or misuse will take the most work'"}
    - {ref: HOLMSTROM-2024, title: "How Does Generative AI Automation Affect Auditors' Motivation and Judgment Quality? (registered report proposal; date from PDF metadata)", publisher: "PCAOB conference materials (Holmstrom and Peters)", type: academic, url: "https://assets.pcaobus.org/pcaob-dev/docs/default-source/economicandriskanalysis/conference/conference---spring/session_5_holmstrom_peters.pdf", date: "2024-06", access: full, locator: "Introduction"}
  last_reviewed: "2026-10-17"
  notes: >-
    PwC and KPMG details are second-hand via the preprint's reading of their 2024 UK transparency reports, which
    were not opened. Tutor mode and the EY programme are announcements (grade C on their own). Grade B rests on
    Deloitte UK's own report descriptions; no training-effect measure exists.

- id: assurance-quality-management-11
  title: "Connected engagement resourcing: staffing requests, budgets and engagement-leader review in one tool (AI role unspecified)"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    ISQM 1 requires firms to assign personnel with the competence and capacity to perform engagements. RSM
    describes replacing manual staffing and budgeting processes (CAQ-RSM-2026). IFIAR found human-resources
    findings at 32 member firms (24%) in its 2025 survey (IFIAR-SURVEY-2026).
  solution: >-
    RSM describes Luca Resourcing as a connected collaboration tool supporting initial staffing requests, budget
    planning and engagement-leader review, giving teams visibility of engagement planning. The post lists it
    among RSM's recent AI-related investments but does not say what AI does inside it (CAQ-RSM-2026). IRBA lists
    resource optimisation using AI to analyse staff profiles and experience as an example of AI in audit
    planning, drawn from the IAASB's digital technology market scan (IRBA-SPA11-2025).
  outcomes:
    - {lever: capacity, description: "No outcome published; the post says the tool improves visibility into engagement planning", figure: "none published", measures: "n/a", provenance: self-reported, source_ref: CAQ-RSM-2026}
  prerequisites:
    - "Competence, skills and availability data per person in a structured system"
    - "Engagement risk and complexity indicators"
  risks_and_guardrails:
    - "A resourcing tool must not assign staff without the competence to review AI output; the FRC says reviewers need appropriate competence, sometimes specialist expertise (FRC-GENAI-2026, p. 37)"
    - "Botic, then acting PCAOB chair, said at the December 2025 AICPA conference that firms should schedule sufficient staff time, even if formal sign-off is delayed (JOFA-5IMP-2026)"
    - "The PCAOB's inspections director cited assigning personnel on the basis of engagement needs as a feature of high-quality audits, per a Deloitte conference recap (DART-SECPCAOB-2025)"
    - "The source gives no data on staffing quality or time allowed for audits (CAQ-RSM-2026)"
  human_checkpoints:
    - "Engagement leader reviews and approves the staffing plan and budget (CAQ-RSM-2026)"
  role_evolution: >-
    Engagement leaders review staffing and budgets inside a shared tool rather than through separate requests
    (CAQ-RSM-2026).
  evidence_grade: C
  sources:
    - {ref: CAQ-RSM-2026, title: "Shaping the future of assurance: Advancing AI in the audit (blog post by RSM's Assurance Digital Leader)", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/aia-shaping-the-future-of-assurance-advancing-ai-in-the-audit", date: "2026-08-25", access: full, locator: "section 'RSM Luca Resourcing: connecting people, projects and execution'"}
    - {ref: IRBA-SPA11-2025, title: "Staff Audit Practice Alert 11: integration of generative AI into the audit process", publisher: "Independent Regulatory Board for Auditors (South Africa)", type: regulator, url: "https://www.irba.co.za/upload/Staff%20Practice%20Alert%2011%20Sep%202025.pdf", date: "2025-09", access: full, locator: "section B table, 'Planning the audit'"}
    - {ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Table A.2"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p. 37"}
    - {ref: JOFA-5IMP-2026, title: "5 imperatives for auditors from the PCAOB chair", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/jan/5-imperatives-for-auditors-from-the-pcaob-chair/", date: "2026-01-12", access: full, locator: "imperative 4 ('Time isn't always of the essence')"}
    - {ref: DART-SECPCAOB-2025, title: "Heads Up: Highlights of the 2025 AICPA & CIMA Conference on Current SEC and PCAOB Developments", publisher: "Deloitte DART", type: conference, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2025/aicpa-cima-conference-sec-pcaob-developments-2025-key-takeaways", date: "2025-12-12", access: full, locator: "remarks of the PCAOB Division of Registration and Inspections director"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: the deployment is named, but the source does not say what AI does in it, so it is weak evidence for an
    AI use case; the CAQ post says only that it replaces manual processes. IFIAR's 24% is the share of member firms
    inspected with at least one human-resources finding; per-theme denominators are not stated.

- id: assurance-quality-management-12
  title: "Firm-approved guidance assistant for audit research and consultation, grounded in the firm's own manuals"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Auditors spend time finding and applying the firm's own assurance manuals, practice aids and technical
    accounting guides, and may apply them inconsistently; RSM links its launch to busy season, when speed and
    accurate guidance both matter (RSM-ASKLUCA-2026). Generic chatbots can produce hallucinations, omissions and
    distortions (FRC-GENAI-2026, p. 8).
  solution: >-
    RSM US launched Ask Luca on 8 January 2026 inside its RSM Luca audit ecosystem. It gives guidance drawn from
    RSM's assurance manuals, practice aids and technical accounting guides to the firm's 4,000+ assurance
    professionals, and RSM says it lays a foundation for later assurance-focused agents (RSM-ASKLUCA-2026;
    CPAPA-LUCA-2026). RSM's assurance digital leader writes that grounding comparable tools in firm-approved
    guidance and experienced human review is vital (CAQ-RSM-2026). Deloitte UK launched a Research Assistant
    chatbot for audit research across its international content (DELOITTE-UKTR-2025). PCAOB staff heard in 2024
    that some firms had built tools to research internal accounting and auditing guidance (PCAOB-GENAI-2024).
    Mid-market example: Plante Moran piloted Thomson Reuters CoCounsel for technical research with 140+ participants;
    the vendor's case study describes new AI security protocols and software controls at the firm and reports an
    anonymous internal survey of the pilot (TR-PLANTEMORAN-2025).
  outcomes:
    - {lever: capacity, description: "RSM states the tool's reach; no time, accuracy or consistency measure is published", figure: "4,000+ assurance professionals with access", measures: "number of RSM assurance professionals the release says the tool serves (reach, not usage)", provenance: self-reported, source_ref: RSM-ASKLUCA-2026}
    - {lever: speed, description: "Most Plante Moran pilot respondents said the tool was faster than traditional research methods; a smaller share reported significant time savings in technical research", figure: "91% faster; 62% significant savings", measures: "respondents to an anonymous internal survey of the firm's 140+ pilot participants; respondent count not stated on the page", provenance: vendor-published, source_ref: TR-PLANTEMORAN-2025}
  prerequisites:
    - "A curated, version-controlled corpus of the firm's own manuals, practice aids and technical guides"
    - "Citations back to source passages, and a route to escalate unanswered questions to technical consultation"
  risks_and_guardrails:
    - "CPAB expects auditors to verify the accuracy of any reference to professional standards or firm guidance obtained by querying a GPT model (CPAB-AI-2024, p. 3)"
    - "RSM says grounding such tools in firm-approved guidance and experienced human review is vital; no accuracy or usage results are published (RSM-ASKLUCA-2026; CAQ-RSM-2026)"
  human_checkpoints:
    - "Auditor checks the source guidance and applies own judgement; RSM calls experienced human review vital (CAQ-RSM-2026)"
    - "Technical consultation remains the route for complex or novel questions"
  role_evolution: >-
    RSM says auditors spend less time searching and more attention on analysis, scepticism and judgement
    (RSM-ASKLUCA-2026; CAQ-RSM-2026).
  evidence_grade: B
  sources:
    - {ref: RSM-ASKLUCA-2026, title: "RSM US Launches Ask Luca, Expanding AI Capabilities in the Audit (news release)", publisher: "RSM US", type: firm, url: "https://www.rsmus.com/newsroom/2026/rsm-launches-ask-luca.html", date: "2026-01-08", access: full, locator: "release text, paras 2-3"}
    - {ref: CPAPA-LUCA-2026, title: "RSM US Rolls Out 'Ask Luca' GenAI Tool for Firm's Auditors", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/01/09/rsm-us-rolls-out-ask-luca-genai-tool-for-firms-auditors/176104/", date: "2026-01-09", access: full, locator: "paras 1-4"}
    - {ref: CAQ-RSM-2026, title: "Shaping the future of assurance: Advancing AI in the audit (blog post by RSM's Assurance Digital Leader)", publisher: "Center for Audit Quality", type: professional-body, url: "https://www.thecaq.org/aia-shaping-the-future-of-assurance-advancing-ai-in-the-audit", date: "2026-08-25", access: full, locator: "section 'Ask Luca: trusted guidance where auditors work'"}
    - {ref: DELOITTE-UKTR-2025, title: "Deloitte UK annual review 2025: Audit transparency report (year ended 31 May 2025)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report.pdf", date: "2025-09", access: full, locator: "PDF p. 94"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB (staff)", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p. 4"}
    - {ref: CPAB-AI-2024, title: "The use of artificial intelligence in the audit: balancing innovation and risk (CPAB Exchange)", publisher: "Canadian Public Accountability Board", type: regulator, url: "https://cpab-ccrc.ca/docs/default-source/thought-leadership-publications/2024-use-of-artificial-intelligence-in-the-audit-en.pdf", date: "2024-09-12", access: full, locator: "p. 3"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "p. 8"}
    - {ref: TR-PLANTEMORAN-2025, title: "Thomson Reuters CoCounsel at Plante Moran", publisher: "Thomson Reuters", type: vendor, url: "https://tax.thomsonreuters.com/en/insights/case-studies/thomson-reuters-cocounsel-at-plante-moran", date: "2025-11-20", access: full, locator: "Key outcomes"}
  last_reviewed: "2026-10-21"
  notes: >-
    Named firms: RSM US, Deloitte UK and Plante Moran; no measured effect on consistency or error rate. Firm kinds:
    RSM describes itself as a provider to the middle market (RSM-ASKLUCA-2026); the vendor describes Plante Moran as
    one of the nation's largest audit and accounting firms (TR-PLANTEMORAN-2025). The Plante Moran survey covers
    general audit research, is vendor-published, and is a share of respondents, so the grade stays B. It sits on the
    boundary between quality management (methodology and consultation) and service delivery; the sources do not
