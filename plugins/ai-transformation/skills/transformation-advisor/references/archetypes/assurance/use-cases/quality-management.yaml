  last_reviewed: "2026-10-17"
  notes: >-
    Idea. The AFM observed one unnamed firm doing the independent fraud-risk step; no firm has measured the effect.
    Entry assurance-controls-testing-10 carries the same counter-arguing guardrail.

- id: assurance-quality-management-21
  title: "AI review of engagement files and workpapers for omissions and inconsistencies before reviewer sign-off"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Reviewers spend time on completeness and consistency checks that cost attention needed for judgemental
    areas, and review is a bottleneck. IFIAR recorded 31 findings in 2025 on failures to establish policies for
    sufficient, timely engagement supervision and review, up from 10 in 2024 (IFIAR-SURVEY-2026, Table A.3).
    PCAOB staff heard in 2024 that firms saw potential in AI evaluating the completeness of audit documentation
    against requirements (PCAOB-GENAI-2024, p. 4).
  solution: >-
    Deloitte UK reports that Smart Review, an in-house GenAI-based audit review tool in its Omnia platform, was
    fully deployed in the year to 31 May 2025 to drive consistency and quality in testing of internal controls,
    and that all FTSE audits have access to it (DELOITTE-UKTR-2025). KPMG says agents in KPMG Clara can assist
    teams by reviewing engagement documentation (KPMG-TR-2025). PIA Group's Group CIO describes AI running
    hundreds, in some cases more than a thousand, checks on a single engagement file that previously went
    unperformed or were merely ticked off (NYENRODE-2026). The FRC lists tools that review work for omissions or
    inconsistencies among 'other tools that use AI' needing documentation (FRC-AIAUDIT-2025, p. 6). Neither firm
    describes how human reviewers use the output. For a named internal-audit example of several models reviewing
    the same workpaper (FJ Management), see assurance-controls-testing-10.
  outcomes:
    - {lever: capacity, description: "Deloitte UK: reach of the tool within its audits; no accuracy or time measure", figure: "all FTSE audits have access", measures: "audits in the firm's FTSE population with access to Smart Review, as the report states", provenance: self-reported, source_ref: DELOITTE-UKTR-2025}
    - {lever: quality, description: "PIA Group's Group CIO: checks AI can run on one engagement file; an interview claim, not a measured result", figure: "hundreds, in some cases more than 1,000 checks per file", measures: "number of quality checks AI can run on a single engagement file, per the interviewee", provenance: self-reported, source_ref: NYENRODE-2026}
  prerequisites:
    - "Workpapers in structured, machine-readable form on a platform that holds the engagement file"
    - "Firm-defined review criteria (methodology encoded so the tool can check against it)"
    - "A rule for how reviewer sign-off treats AI-raised exceptions"
  risks_and_guardrails:
    - "No source reports false-positive or false-negative review comments, detection rates or rework"
    - "The AICPA says a second AI tool does not reduce the auditor's supervision and review responsibility (AT-AICPAPA-2026)"
    - "The Nyenrode interviewee says perfect accuracy is not necessary for value but warns that AI validating AI risks a closed system (NYENRODE-2026)"
    - "Benchmark evidence shows agents sometimes produce incorrect documentation (ARXIV-FAB-2026)"
  human_checkpoints:
    - "Reviewer resolves every AI-raised exception"
    - "Reviewer still reviews judgemental areas and remains responsible for review conclusions"
  role_evolution: >-
    Deloitte UK says AI frees auditors' time for the highest-impact areas where human judgement is most
    needed (DELOITTE-UKTR-2025, p. 95), and the PIA Group interviewee says AI now runs checks that were
    previously skipped or merely ticked off (NYENRODE-2026); Deloitte says practitioners remain responsible for
    challenging and validating technology outputs (DELOITTE-UKTR-2026).
  evidence_grade: B
  sources:
    - {ref: DELOITTE-UKTR-2025, title: "Deloitte UK annual review 2025: Audit transparency report (year ended 31 May 2025)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2025/deloitte-uk-annual-review-2025-audit-transparency-report.pdf", date: "2025-09", access: full, locator: "PDF pp. 7, 15, 94-95"}
    - {ref: DELOITTE-UKTR-2026, title: "Deloitte UK annual review 2026: Audit transparency report (year ended 31 May 2026)", publisher: "Deloitte LLP (UK)", type: firm, url: "https://www.deloitte.com/content/dam/assets-zone2/uk/en/docs/about/2026/deloitte-uk-annual-review-2026-audit-transparency-report.pdf", date: "2026-09", access: full, locator: "Appendix 5, p. 48"}
    - {ref: KPMG-TR-2025, title: "KPMG International Transparency Report 2025: Building trust through quality and innovation", publisher: "KPMG International", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/xx/pdf/2025/12/transparency-report-fy25.pdf", date: "2025-12", access: full, locator: "PDF p. 16"}
    - {ref: NYENRODE-2026, title: "AI in auditing: balancing quality, professional skepticism, and responsibility (interview with the Group CIO of PIA Group and a Nyenrode professor)", publisher: "Nyenrode Business University", type: press, url: "https://www.nyenrode.nl/en/news/n/ai-auditing-quality-skepticism-responsibility", date: "2026-06-18", access: full, locator: "section 'More checks mean better quality, right?'"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB (staff)", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "p. 4"}
    - {ref: FRC-AIAUDIT-2025, title: "AI in audit: Illustrative example and documentation guidance", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8384/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "p. 6"}
    - {ref: IFIAR-SURVEY-2026, title: "Survey of Inspection Findings 2025", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/ifiar/2025SurveyReport.pdf", date: "2026-04-01", access: full, locator: "Appendix A, Table A.3 (engagement performance)"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph on one AI tool evaluating another"}
    - {ref: ARXIV-FAB-2026, title: "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors (abstract read)", publisher: "arXiv", type: academic, url: "https://arxiv.org/abs/2609.32835", date: "2026-09-26", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    Smart Review's stated scope is internal-controls testing, so this overlaps assurance-controls-testing-10, which
    is referenced rather than duplicated. No detection, false-positive or rework measure is published. The IFIAR
    supervision-and-review finding count is a baseline, not linked to AI.

- id: assurance-quality-management-22
  title: "Idea: a second model or rules-based component cross-checks AI output, with a human at the end"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    Generative tools are probabilistic: the FRC's head of assurance technology notes the same prompt can give
    different outputs at different times (ICAEW-POD-2025), and an RSM UK analytics director says no tool can be
    guaranteed to give the right output every time (ICAEW-FRCVIEW-2026). Human reviewers cannot catch every
    deficiency in high-volume AI output.
  solution: >-
    Idea in regulator guidance. The FRC lists as design mitigations one LLM reviewing another's work (a
    different model may have different biases, and the same model can be given different priorities), several
    LLMs attempting a task with an LLM or human selecting, and rules-based or predictive components evaluating
    LLM outputs, for example by checking a schema (FRC-GENAI-2026, pp. 25-26). The AICPA practice aid, as
    reported, says one AI tool may check whether another performed a procedure correctly, but the second tool
    does not reduce or replace the auditor's supervision and review responsibility (AT-AICPAPA-2026). Grant
    Thornton UK's Jon Morris put AI reviewing AI 'a few years down the line' (ICAEW-POD-2025). RSM UK's Konrad
    Bukowski-Kruszyna advises building a rules-based tool alongside GenAI when data must be analysed
    (ICAEW-FRCVIEW-2026). For a named internal-audit deployment of several models reviewing the same workpaper
    (FJ Management), see assurance-controls-testing-10.
  outcomes:
    - {lever: quality, description: "none published", figure: "none", measures: "no measure published", provenance: independent, source_ref: FRC-GENAI-2026}
  prerequisites:
    - "Two or more components with different capabilities and biases (FRC-GENAI-2026, p. 25)"
    - "Rules for what happens when components disagree (FRC-GENAI-2026, p. 26)"
    - "Evidence of the checker's own performance from certification"
  risks_and_guardrails:
    - "The FRC says LLM review does not remove the need for human oversight (FRC-GENAI-2026, pp. 25-26)"
    - "A Group CIO interviewed by Nyenrode warns that using AI to validate AI can create a closed system in which errors become hard to detect (NYENRODE-2026)"
    - "FRC: combining components brings risks of amplification, information distortion and interface errors (FRC-GENAI-2026, p. 14)"
    - "No source tests whether cross-checks catch more errors than single review (ICAEW-POD-2025; FRC-GENAI-2026)"
  human_checkpoints:
    - "Escalation to a human when components disagree or the checker is unsure"
    - "Auditor still supervises and reviews the outcome (AT-AICPAPA-2026)"
  role_evolution: >-
    The FRC's head of assurance technology describes comparing several AI answers while keeping a human at the
    end of the process (ICAEW-POD-2025); the auditor's review duties stay (AT-AICPAPA-2026).
  evidence_grade: D
  sources:
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "pp. 9, 14, 25-26"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph on one AI tool evaluating another"}
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, segment after time code 13'49\" (oversight and explainability)"}
    - {ref: ICAEW-FRCVIEW-2026, title: "How helpful is FRC guidance on generative and agentic AI? (viewpoint)", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2026/may-2026/how-helpful-is-frc-guidance-on-generative-and-agentic-ai", date: "2026-05-06", access: full, locator: "section 'Use the illustrative examples'"}
    - {ref: NYENRODE-2026, title: "AI in auditing: balancing quality, professional skepticism, and responsibility (interview with the Group CIO of PIA Group and a Nyenrode professor)", publisher: "Nyenrode Business University", type: press, url: "https://www.nyenrode.nl/en/news/n/ai-auditing-quality-skepticism-responsibility", date: "2026-06-18", access: full, locator: "section 'When is AI reliable enough?'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea for external audit files. The AICPA point is read through Accounting Today; the practice aid text was not
    opened. The named internal-audit deployment sits in assurance-controls-testing-10 (grade B there) and is not
    duplicated here.

- id: assurance-quality-management-23
  title: "Document AI use in two places: a central record for each tool and a structured record on the engagement file"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Inspectors and senior reviewers cannot challenge AI-assisted work if the file does not show where AI was
    used and how the team responded; the AFM found it not always clear or visible where GenAI had been applied
    (AFM-12BB-2025, p. 31). A GenAI-drafted memo can read well while the file does not show prompts, sources or
    where the reviewer's judgement entered; Foley & Lardner's notes from a PCAOB event for directors say a
    machine may make a judgement but it must still be documented in a way that satisfies an auditing standard
    (FOLEY-PCAOB-2026).
  solution: >-
    The FRC's June 2025 guidance splits documentation: the tool's purpose, development, certification, training
    and explainability sit centrally, while the audit file holds a description, the tool and model version (or a
    pointer to a control that limits use to the latest approved version), configuration, data or prompts, the
    team's assessment of fitness, approval evidence and how outputs informed conclusions (FRC-AIAUDIT-2025, pp.
    13-16). In the FRC's board-minutes example the auditor records that a GenAI tool was used and how its output
    informed further work (FRC-GENAI-2026, p. 43). IFIAR asks firms to identify uses of GenAI in critical audit
    areas, including where evidence was prepared by AI (IFIAR-TTF-2025, p. 9), and to be able to explain how
    auditor judgement was applied to AI outputs (IFIAR-TTF-2026, p. 5). NFRA's staff paper calls for a move
    toward a structured format showing which tool processed a balance and the extent of human review
    (NFRA-STAFF-2026). Baker Tilly's synthesis of the IIA's March 2026 conference recommends a named human
    reviewer who documents why they agreed or disagreed (BAKERTILLY-GAM-2026). An academic reading of PwC UK's
    2024 transparency report says PwC requires clear documentation where approved GenAI use cases are used
    (PREPRINT-AIJGDI-2026).
  outcomes:
    - {lever: risk, description: "FRC: firms with processes for engagement-specific tools all required templates to be kept on the audit file, but some template wording made completion look optional", figure: "none published beyond 'most firms'", measures: "firms (of six) with engagement-specific ATT templates retained on file", provenance: independent, source_ref: FRC-ATT-2025}
    - {lever: risk, description: "None of the four UK Big Four firms' 2024 transparency reports stated model-level performance, override frequency or drift monitoring (a limit of public disclosure, not proof of absence)", figure: "0 of 4 reports", measures: "UK Big Four 2024 transparency reports coded by the preprint author", provenance: independent, source_ref: PREPRINT-AIJGDI-2026}
  prerequisites:
    - "A file template with fields for tool, version, configuration, inputs and review"
    - "A central register of approved tool versions and certification records"
    - "A rule for what is documented centrally and what goes on the file"
  risks_and_guardrails:
    - "The FRC says over-documentation can divert time from audit quality; where all outputs of an LLM research tool are checked back to cited sources, less documentation about the tool may be appropriate (FRC-AIAUDIT-2025, p. 6)"
    - "A state CPA society author says a generic note that an AI tool was used would not meet AU-C 230 (CALCPA-AISTD-2026)"
    - "The same author reports, unverified, a PCAOB board member's warning that demanding every detail of AI models could make AI procedures costlier to defend than manual sampling (CALCPA-AISTD-2026)"
    - "The PCAOB has issued no AI-specific rule, and its 2024 technology amendments did not cover AI, per vendor commentary (FIELDGUIDE-PCAOB-2026)"
  human_checkpoints:
    - "Engagement team completes the file record"
    - "Named reviewer records the conclusion and reasons for each AI-assisted procedure"
    - "Senior team members reflect on the overall use of technology on the file (IFIAR-TTF-2026, p. 7)"
  role_evolution: >-
    Documentation shifts from describing procedures to recording tool use and review, and for widely used tools
    the FRC expects the balance to shift toward the central record (FRC-AIAUDIT-2025, p. 16); reviewers carry a documentation
    duty, as in Baker Tilly's named-reviewer protocol (BAKERTILLY-GAM-2026).
  evidence_grade: C
  sources:
    - {ref: FRC-AIAUDIT-2025, title: "AI in audit: Illustrative example and documentation guidance", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8384/AI_in_Audit.pdf", date: "2025-06-26", access: full, locator: "pp. 5-6, 13-16"}
    - {ref: FRC-GENAI-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://media.frc.org.uk/documents/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03-30", access: full, locator: "example 1, p. 43; p. 39"}
    - {ref: FRC-ATT-2025, title: "Thematic Review: Certification of Automated Tools and Techniques (PDF; an AI-converted HTML version is at https://www.frc.org.uk/docs/8383/html/)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/documents/8383/Thematic_Review_on_the_Certification_of_Automated_Tools_and_Techniques.pdf", date: "2025-06-26", access: full, locator: "Documentation; engagement-specific ATTs"}
    - {ref: IFIAR-TTF-2025, title: "Use of technology in audits: observations, risks and further evolution (2025 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2025TTFReport.pdf", date: "2025-03-27", access: full, locator: "p. 9 (Transparency)"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp. 5, 7"}
    - {ref: NFRA-STAFF-2026, title: "NFRA Staff Series on Technology in Audit 01: General Principles for Technology Adoption in Audit (staff paper, not a policy or statement of the Authority)", publisher: "National Financial Reporting Authority (India)", type: regulator, url: "https://cdnbbsr.s3waas.gov.in/s3e2ad76f2326fbc6b56a45a56c59fafdb/uploads/2026/07/202607231927160337.pdf", date: "2026-07", access: full, locator: "p. 7 (structured, inspectable documentation)"}
    - {ref: BAKERTILLY-GAM-2026, title: "Strategy in motion: Internal audit's 2026 execution mandate (IIA GAM 2026 takeaways)", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/internal-audit-2026-execution-mandate", date: "2026-04-10", access: full, locator: "takeaway 3, 'AI review protocol'"}
    - {ref: PREPRINT-AIJGDI-2026, title: "Professional Judgment and AI Governance in Audit and Sustainability Assurance: Public Evidence from the UK Big Four (later published in J. Risk Financial Management 2026, 19(9), 675)", publisher: "Preprints.org", type: academic, url: "https://www.preprints.org/manuscript/202607.1693/v1", date: "2026-07", access: full, locator: "sections 4.2 and 4.3"}
    - {ref: AFM-12BB-2025, title: "12 Building blocks for controlled use of auditing tools", publisher: "Autoriteit Financiele Markten (Netherlands)", type: regulator, url: "https://www.afm.nl/~/profmedia/files/rapporten/2025/12-building-blocks-for-controlled-use-of-auditing-tools.pdf", date: "2025-12", access: full, locator: "p. 31"}
    - {ref: FOLEY-PCAOB-2026, title: "What Directors Should be Asking About the Audit and the Auditors Now (read via text mirror)", publisher: "Foley & Lardner", type: firm, url: "https://www.foley.com/insights/publications/2026/07/what-directors-should-be-asking-about-the-audit-and-the-auditors-now/", date: "2026-07-02", access: full, locator: "section 'AI arrived before the rules did'"}
    - {ref: CALCPA-AISTD-2026, title: "AI Standard Setting, Regulation in Audit: Part 1", publisher: "CalCPA (S. Gadzhieva)", type: professional-body, url: "https://www.calcpa.org/whats-happening/articles/ai-standard-setting-regulation-in-audit-part-1", date: "2026-08-12", access: full, locator: "sections 'Inspection Findings: The Documentation Gap' and 'Documentation (meeting AU-C 230)'"}
    - {ref: FIELDGUIDE-PCAOB-2026, title: "PCAOB AI oversight: where the Board stands on AI in audit", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/pcaob-ai-audit-standards", date: "2026-08-06", access: full, locator: "section 'What existing PCAOB expectations still require'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: the only named firm practice (PwC UK requiring documentation where approved GenAI use cases are used)
    is known second-hand from the preprint's reading of PwC UK's 2024 transparency report, which could not be opened
    (access denied). FRC, NFRA and IFIAR material is guidance, and the FRC observations concern conventional
    automated tools at unnamed firms. Baker Tilly's protocol concerns internal audit; Fieldguide is a vendor with a
    commercial interest in documentation tooling.

- id: assurance-quality-management-24
  title: "Disclose AI use to clients and audit committees through engagement-letter terms and routine questions"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Clients worry about where their data goes and whether it trains models. A Grant Thornton UK director said
    some clients were nervous and a few would not sign up (ICAEW-POD-2025).
  solution: >-
    Grant Thornton UK's Jon Morris said the firm uses clear engagement-letter terms about what AI will be used
    for and in some cases ring-fences the work so it is not used to train other models. Deloitte's Martin Brown
    said very few clients had specifically asked the firm not to use GenAI, and that transparency and education
    matter (ICAEW-POD-2025). A Foley article from a PCAOB event for directors suggests audit committees ask what
    the auditor is doing with AI, under what controls, and how AI-assisted judgements are documented
    (FOLEY-PCAOB-2026). IFIAR says communicating how technology is used supports audit committee oversight
    (IFIAR-TTF-2026, pp. 7-8).
  outcomes:
    - {lever: risk, description: "No measure published; client refusals described only as a very limited number", figure: "none", measures: "no measure published", provenance: self-reported, source_ref: ICAEW-POD-2025}
  prerequisites:
    - "Firm policy on data handling and model training, agreed with the technology function"
    - "Standard wording for engagement letters and audit committee communications"
  risks_and_guardrails:
    - "Some clients may decline; Morris said AI can still be used in a ring-fenced way (ICAEW-POD-2025)"
    - "The AICPA says AU-C 210 does not require naming AI tools in the engagement letter, though state laws, contracts or firm policy may (AT-AICPAPA-2026)"
  human_checkpoints:
    - "Engagement leader agrees AI-use terms with the client and the audit committee"
  role_evolution: >-
    Engagement leaders add AI use to client and audit committee conversations (FOLEY-PCAOB-2026).
  evidence_grade: B
  sources:
    - {ref: ICAEW-POD-2025, title: "How should audit firms use AI? (Beyond Finance podcast transcript)", publisher: "ICAEW", type: podcast, url: "https://www.icaew.com/insights/podcast/beyond-finance/how-should-audit-firms-use-ai/transcript", date: "2025-11-11", access: full, locator: "transcript, between time codes 04'50\" and 13'49\" (client data)"}
    - {ref: FOLEY-PCAOB-2026, title: "What Directors Should be Asking About the Audit and the Auditors Now (read via text mirror)", publisher: "Foley & Lardner", type: firm, url: "https://www.foley.com/insights/publications/2026/07/what-directors-should-be-asking-about-the-audit-and-the-auditors-now/", date: "2026-07-02", access: full, locator: "'Five questions to take back to your auditor', question 2"}
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "pp. 7-8 ('Transparency of Use and for Those Charged with Governance')"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "section on audit firms' use of AI"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B: Grant Thornton and Deloitte practices are described by named firm representatives on a 2025 ICAEW
    podcast, with no measurement. Overlaps acceptance-independence (engagement terms) and completion-reporting
    (audit committee communication).

- id: assurance-quality-management-25
  title: "Redesign supervision and early-career development as juniors move from preparing work to reviewing AI output"
  archetype: assurance
  module: quality-management
  function: people-hr
  work_types: [coordination-scheduling, review-assurance]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    If tools do the first-pass work juniors used to do, juniors lose the practice that built judgement while
    firms lean on them to review tool output. Botic, as reported, cited research that AI tools can erode
    critical thinking and scepticism and said new paths for juniors to gain these skills will be needed
    (NYSSCPA-BOTIC-2025; CAALLEY-PCAOBPE-2025). PCAOB staff heard in 2024 from some firms that their supervision
    and review policies had not changed despite GenAI (PCAOB-GENAI-2024, pp. 4-5).
  solution: >-
    PwC's AI assurance leader said in August 2025 that new hires would function like managers within three years
    because they would oversee AI performing routine tasks, and that assurance training is moving to 'back to
    basics' fundamentals with earlier time on critical thinking, negotiation and professional scepticism
    (BI-PWC-2025). IFIAR asks firms to prioritise supervision training and consider how supervision may need to
    change as AI is integrated (IFIAR-TTF-2025, p. 8). The Thomson Reuters Institute's firm-leader paper says
    firms must ensure junior staff still get structured development and supervision before automation erodes
    these opportunities (TRI-FOP-2026). CPAB asks firms how to develop junior auditors' critical thinking
    (CPAB-EVOLVING-2025, p. 3). Botic added critical thinking and communication to the attributes he wants
    entrants to build (PCAOB-BOTICIOWA-2026).
  outcomes:
    - {lever: risk, description: "none published", figure: "none", measures: "no measure published", provenance: self-reported, source_ref: BI-PWC-2025}
    - {lever: quality, description: "Baseline, not an AI measure: findings on failure to establish policies for sufficient, timely engagement supervision and review", figure: "31 findings in 2025; 10 in 2024", measures: "number of findings (not firms) reported to IFIAR in the theme", provenance: independent, source_ref: IFIAR-SURVEY-2026}
  prerequisites:
    - "Visibility of which work is AI-produced"
    - "Revised direction, supervision and review policy under ISA 220 (Revised) or the local equivalent"
    - "Rotation or training that keeps early-career exposure to unautomated tasks"
  risks_and_guardrails:
    - "ICAEW reports the Big Four cut 2025 graduate intake by as much as 6% to 29%, and large-firm partners worry seniors end up doing remedial work for AI shortfalls (ICAEW-EXPECT-2026)"
    - "The reports name only 'a recent MIT study'; the best-known MIT study on this, an EEG study of essay writing by 54 participants, is not an audit study (KOSMYNA-2025)"
    - "A survey of experienced auditors at a German Big 4 firm found concern about over-reliance and possible loss of skills alongside gains on standardised tasks (FABIAN-2026)"
    - "Registered-report designs on motivation and judgement quality report no results yet (HOLMSTROM-2024)"
    - "The IAASB notes AI tools complicate the engagement partner's direction, supervision and review where outputs are hard to explain or need specialised skills (IAASB-TQMPLAN-2026, para 10)"
  human_checkpoints:
    - "Senior review of work by juniors who are themselves reviewing AI output"
    - "Engagement leader reviews how AI-assisted work was supervised"
  role_evolution: >-
    Entry-level roles shift to review and supervision of AI work (BI-PWC-2025); The Accounting Podcast, in an
    AI-generated summary, describes lean senior teams overseeing automated systems in place of large junior
    cohorts (PODWISE-ACCTPOD-2026).
  evidence_grade: C
  sources:
    - {ref: BI-PWC-2025, title: "PwC is training junior accountants to be like managers, because AI is going to be doing the entry-level work", publisher: "Business Insider via Yahoo Finance", type: press, url: "https://finance.yahoo.com/news/pwc-training-junior-accountants-managers-170001522.html", date: "2025-08-08", access: full, locator: "paras 1-12"}
    - {ref: NYSSCPA-BOTIC-2025, title: "PCAOB's Botic Flags Opportunities and Risks in AI (summarising Accounting Today)", publisher: "NYSSCPA", type: professional-body, url: "https://nysscpa.org/news/1051584-pcaobs-botic-flags-opportunities-and-risks-in-ai-2025-12-10", date: "2025-12-10", access: full, locator: "paras 2-5"}
    - {ref: CAALLEY-PCAOBPE-2025, title: "PCAOB warns auditors about AI and PE (citing Accounting Today)", publisher: "CAalley.com", type: press, url: "https://caalley.com/news-updates/international-news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "paras 3-4"}
