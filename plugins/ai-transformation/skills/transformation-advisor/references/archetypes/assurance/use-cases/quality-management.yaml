  evidence_grade: B
  sources:
    - {ref: FIELDGUIDE-SANVILLE-2026, title: "How Sanville & Co passed a PCAOB inspection with zero comment forms in under a year with Fieldguide (page undated; year inferred)", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/case-studies/how-sanville-co-passed-a-pcaob-inspection-with-zero-comment-forms-in-under-a-year-with-fieldguide", date: "2026", access: full, locator: "Key Results at a Glance; sections 'A Methodology That Was Fighting the Firm' to 'A Clean Inspection and a Faster Path'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B, not A: the figures are named and measured but vendor-published and measure an adjacent change (a
    platform and methodology overhaul), not the AI component. The page has no publication date; 2026 is inferred
    (the vendor's sitemap shows a July 2026 update). The same customer story appears in
    assurance-substantive-testing-10 for its testing figures.

# ---- Part B: engagement-level supervision and review of AI output ----

- id: assurance-quality-management-17
  title: "Idea: engagement leader plans AI use at the outset, and senior team members stand back and review it before sign-off"
  archetype: assurance
  module: quality-management
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    ISA 220 (Revised) makes the engagement partner responsible for direction, supervision and review; IAASB
    stakeholders said tool outputs that are hard to explain, need specialised skills to evaluate or invite
    over-reliance complicate this (IAASB-TQMPLAN-2026, para 10). IFIAR says firms need to make clear what a
    'human-led' audit means in practice (IFIAR-TTF-2026, p. 7).
  solution: >-
    Idea in regulator and professional-body guidance. IFIAR asks engagement leaders to set expectations at the
    outset for how technology will be used, including engagement-specific planned uses of AI, and senior team
    members to reflect at the end on the overall use of technology in the file and whether scepticism was
    maintained (IFIAR-TTF-2026, p. 7; CPAB-EVOLVING-2025, pp. 5-6). The AICPA practice aid recommends planning
    intended AI use on specific engagements and says partners must understand the tools, ensure the firm has
    approved them and that staff use them correctly (AICPA-PA-2026); it suggests teams may brainstorm at
    planning where AI could improve quality or efficiency (AT-AICPAPA-2026). IRBA places responsibility for
    appropriate use on the engagement partner (IRBA-SPA11-2025).
  outcomes:
    - {lever: quality, description: "none published", figure: "none", measures: "no measure published", provenance: independent, source_ref: IFIAR-TTF-2026}
  prerequisites:
    - "A firm-approved tool list per engagement type the partner can check against (AICPA-PA-2026)"
    - "A planning template with an AI-use section, and partner training on the tools in use"
  risks_and_guardrails:
    - "The AICPA says the auditor remains responsible for the audit and the opinion (JOFA-AIPA-2026)"
    - "CPAB says firms often state the audit will remain human-led, but effective adoption needs a behaviour shift and clear articulation of involvement at each stage (CPAB-EVOLVING-2025, pp. 5-6)"
    - "The AICPA says AU-C 210 does not require naming AI tools in the engagement letter, though laws, contracts or firm policy may (AT-AICPAPA-2026)"
  human_checkpoints:
    - "Engagement leader approves the planned AI uses"
    - "Senior team reflection on technology use and scepticism before sign-off"
  role_evolution: >-
    Engagement partners take on explicit duties to understand, approve and supervise AI use (AICPA-PA-2026;
    IFIAR-TTF-2026, p. 7).
  evidence_grade: D
  sources:
    - {ref: IFIAR-TTF-2026, title: "Use of technology in audits: Innovation and audit quality (2026 report)", publisher: "IFIAR (copy hosted by Japan FSA)", type: regulator, url: "https://www.fsa.go.jp/cpaaob/sonota/kokusai/2026TTFReport.pdf", date: "2026-04-20", access: full, locator: "Defining the role of auditors in a technology-enabled audit, p. 7"}
