- id: assurance-quality-management-13
  title: "Engage regulators early on novel AI tools and keep an inspection-ready file for each tool"
  archetype: assurance
  module: quality-management
  function: risk-compliance-legal
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Standards do not yet address AI directly, and regulators say they will inspect AI use: PCAOB staff said at
    the December 2025 AICPA conference that firms' AI adoption will be an area of focus for inspectors
    (DART-SECPCAOB-2025), and PCAOB guests at a directors' event (board member Botic and a colleague) said, per
    Foley & Lardner's notes, that the regulator is still working out whether AI needs new standards or
    documentation rules (FOLEY-PCAOB-2026). Inspectors are turning to the firm's system:
    the FRC puts the system of quality management 'at the heart' of supervision from April 2026 for the largest
    firms (FRC-SUPERVISION-2026), and PCAOB staff discussion materials would centre inspections on each firm's
    quality control system (STARLING-IMC-2026).
  solution: >-
    The PCAOB's inspections director said inspectors meet firms, generally larger ones, to understand their AI
    use, and that many firms invited inspectors to demonstrations while piloting (CAALLEY-PCAOBPE-2025). The
    FRC's Audit Tech & AI Sandbox, opened 4 June 2026, gives selected UK-registered firms about three engagement
    meetings with FRC experts over three to four months to test adoption against ISQM 1 and FRC guidance, with
    no endorsement or approval; first-round applications closed in July 2026 (FRC-SANDBOX-2026;
    FRC-SANDBOXPAGE-2026; ICAS-SANDBOX-2026). IFIAR encourages early engagement with local regulators and IFIAR
    where technology may significantly alter the nature of audit work (IFIAR-TTF-2026, p. 4). The
    inspection-ready file draws on the FRC's split of documentation, which keeps a tool's purpose, development,
    certification and training in a central record (FRC-AIAUDIT-2025, pp. 13-15). PCAOB staff said in December
    2024 they would continue to inquire about the use of technology in audit procedures (PCAOB-PRIORITIES-2024).
    The FRC's head of assurance technology said an overarching goal of its AI guidance was to show the regulator
    is fine in principle with firms using AI, provided it is done sensibly, and that the FRC works with firm
    representatives on a working group (ICAEW-POD-2025).
  outcomes:
    - {lever: risk, description: "CPAB 2025 inspections: tools used as the primary source of evidence with limited validation of data inputs in some instances; one tool where testing was limited to flagged items", figure: "no count published", measures: "instances in CPAB's 2025 inspections; number and denominator not stated", provenance: independent, source_ref: CPAB-EVOLVING-2025}
    - {lever: risk, description: "No outcome published; sandbox participants not named", figure: "none", measures: "no measure published", provenance: independent, source_ref: FRC-SANDBOXPAGE-2026}
  prerequisites:
    - "A firm view of which tools are in pilot and which are certified (CAALLEY-PCAOBPE-2025)"
    - "Central documentation, version and approval history per tool that can be produced on request"
    - "Ability to explain a tool and how it was validated (PCAOB-BOTICSF-2026), and a single owner for regulator queries"
  risks_and_guardrails:
    - "Sandbox participation gives no approval, endorsement or compliance guarantee (FRC-SANDBOXPAGE-2026)"
    - "PCAOB staff publications state they give staff views, not necessarily the Board's (PCAOB-GENAI-2024; PCAOB-PRIORITIES-2024); Fieldguide, a vendor, calls the July 2024 GenAI spotlight staff views rather than binding rules (FIELDGUIDE-PCAOB-2026)"
    - "Regulators' stated focus includes how firms' quality control addresses AI at firm level as well as what appears in selected files (CAALLEY-PCAOBPE-2025)"
    - "The FRC says its March 2026 guidance is not a response to identified quality deficiencies (FRC-GENAINEWS-2026)"
  human_checkpoints:
    - "Quality leadership decides what to bring to regulators and when"
    - "Tool owners answer inspector questions from the central file"
  role_evolution: >-
    Quality and regulatory-relations leaders add AI tool briefings to inspection preparation
    (CAALLEY-PCAOBPE-2025); the FRC says its sandbox gives participants direct access to regulatory expertise on
    how standards apply to new technology (FRC-SANDBOX-2026).
  evidence_grade: C
  sources:
    - {ref: CAALLEY-PCAOBPE-2025, title: "PCAOB warns auditors about AI and PE (citing Accounting Today)", publisher: "CAalley.com", type: press, url: "https://caalley.com/news-updates/international-news/pcaob-warns-auditors-about-ai-and-pe", date: "2025-12-09", access: full, locator: "paras 8-9 (Gunia remarks)"}
    - {ref: DART-SECPCAOB-2025, title: "Heads Up: Highlights of the 2025 AICPA & CIMA Conference on Current SEC and PCAOB Developments", publisher: "Deloitte DART", type: conference, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2025/aicpa-cima-conference-sec-pcaob-developments-2025-key-takeaways", date: "2025-12-12", access: full, locator: "Executive summary, AI paragraph"}
    - {ref: FOLEY-PCAOB-2026, title: "What Directors Should be Asking About the Audit and the Auditors Now (read via text mirror)", publisher: "Foley & Lardner", type: firm, url: "https://www.foley.com/insights/publications/2026/07/what-directors-should-be-asking-about-the-audit-and-the-auditors-now/", date: "2026-07-02", access: full, locator: "section 'AI arrived before the rules did'"}
    - {ref: FRC-SUPERVISION-2026, title: "FRC introduces evolved approach to audit supervision (news release)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/news-and-events/news/2026/03/frc-introduces-evolved-approach-to-audit-supervision/", date: "2026-03-25", access: full, locator: "news release"}
    - {ref: STARLING-IMC-2026, title: "Modernizing US PCAOB Audit Inspections", publisher: "Starling Insights", type: press, url: "https://insights.starlingtrust.com/content/observations/modernizing-us-pcaob-audit-inspections", date: "2026-09-01", access: full, locator: "paras 1-5"}
    - {ref: FRC-SANDBOX-2026, title: "FRC invites firms and companies to experiment, innovate and reduce burdens through new sandbox programmes (news release)", publisher: "Financial Reporting Council (UK)", type: regulator, url: "https://www.frc.org.uk/news-and-events/news/2026/06/frc-invites-firms-and-companies-to-experiment-innovate-and-reduce-burdens-through-new-sandbox-programmes/", date: "2026-06-04", access: full, locator: "news release"}
