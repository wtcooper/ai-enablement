- id: assurance-private-company-17
  title: "Preparation, compilation and review (SSARS) engagements on the same AI-enabled platform as audits, with AI drafting and disclosure checks as the next step (platform adoption named; AI inside SSARS work not described)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Reviews and compilations are high-volume at small firms and are a large part of peer-review samples. Across Tennessee, Connecticut, Minnesota and Missouri in 2025, 43 of 295 reviews (15%) and 14 of 482 compilation and preparation engagements omitting disclosures (3%) were nonconforming [TSCPA-PEERREVIEW-2025; CTCPA-PEERREVIEW-2025; MNCPA-PEERREVIEW-2025; MOCPA-PEERREVIEW-2025]. No AI-specific practice material was found for this work."
  solution: "Citrin Cooperman, Withum and EisnerAmper adopted the DAS suite including DAS PCR, the preparation, compilation and review module [CASEWARE-CITRIN-2026; CASEWARE-WITHUM-2026; CASEWARE-EISNERAMPER-2026]. The DAS PCR product page describes templates, checklists and draft statements and note disclosures that populate from imported data, and makes no AI claim of its own [CASEWARE-DASPCR-2026]. Caseware's Disclosure Checklist Agent returns citation-backed answers that the auditor accepts, refines or overrides, but it is described in the audit workflow [CASEWARE-LAUNCH-2026]. A Journal of Accountancy small-firm article, citing a 2025 CPA.com report, says AI tools are used to automate bank reconciliations, transaction coding, month-end close and reporting, which feed the statements firms prepare or compile [JOFA-REALLIFE-2026]."
  outcomes:
    - {lever: capacity, description: "Adoption counts for the whole DAS suite, not an AI effect or a result for compilations and reviews", figure: "more than 1,100 professionals; over 1,500 client engagements", measures: "EisnerAmper professionals using the DAS suite and engagements completed on it as of 25 June 2026, per Caseware; not split by engagement type", provenance: vendor-published, source_ref: CASEWARE-EISNERAMPER-2026}
    - {lever: quality, description: "none published", figure: "none published", measures: "no SSARS-specific AI result found", provenance: vendor-published, source_ref: CASEWARE-DASPCR-2026}
  prerequisites:
    - "An engagement platform that covers preparation, compilation and review work, not only audits"
    - "A clean trial balance, disclosure checklists in a form an agent can read, and a firm rule on when AI-drafted statements may be issued"
  risks_and_guardrails:
    - "No AICPA, Accounting and Review Services Committee or state-board guidance on AI in SSARS engagements was found; 2026 CPE on these engagements lists SSARS 22 to 27, fraud-related and going-concern responsibilities with no AI objective [NYSSCPA-PCR-2026]"
    - "The sources do not say which agents, if any, run in the PCR module [CASEWARE-LAUNCH-2026; CASEWARE-DASPCR-2026]"
    - "Firms in the small-firm article said they keep client data out of public AI platforms and have a person review output [JOFA-REALLIFE-2026]"
    - "SSARS 27 lets statements prepared as part of a consulting engagement fall outside AR-C 70, effective for periods ending on or after 15 December 2026; it does not mention AI [CPACOM-SSARS27-2025]"
  human_checkpoints:
    - "The accountant reviews and signs the compilation or review report"
    - "Reviewer clears each overridden or disputed disclosure answer"
  role_evolution: "Not stated for SSARS work. Citrin Cooperman's assurance innovation leader says seeing the reasoning behind procedures builds judgment [CASEWARE-CITRIN-2026]."
  evidence_grade: C
  sources:
    - {ref: CASEWARE-CITRIN-2026, title: "Citrin Cooperman & Company, LLP Adopts AI-Enabled DAS Suite Powered by Caseware to Advance Audit Quality, Professional Development, and Scalable Growth", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/citrin-cooperman-company-llp-adopts-ai-enabled-das-suite-powered-by-caseware-to-advance-audit-quality-professional-development-and-scalable-growth", date: "2026-07-13", access: full, locator: "Paragraph 2 (DAS Audit, DAS PCR, DAS EBP)"}
    - {ref: CASEWARE-WITHUM-2026, title: "Withum Fully Adopts DAS Powered by the Caseware Verity AI Platform to Drive its Future-Ready Audit Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/withum-fully-adopts-das-powered-by-the-caseware-verity-ai-platform-to-drive-its-future-ready-audit-practice", date: "2026-06-03", access: full, locator: "Paragraph 2 (DAS, DAS PCR, DAS EBP)"}
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper Leverages DAS Powered by Caseware to Unify Audit and Build an Agentic Future Across Its Multi-Vertical Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "Paragraph 1 (modules, 1,100 professionals, 1,500 engagements)"}
    - {ref: CASEWARE-DASPCR-2026, title: "DAS PCR (formerly OnPoint PCR)", publisher: Caseware, type: vendor, url: "https://www.caseware.com/us/products/das-pcr", date: "2026", access: full, locator: "Product description bullets on draft statements and note disclosures"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "Disclosure Checklist Agent paragraph"}
    - {ref: JOFA-REALLIFE-2026, title: "Real-life ways small firms use AI", publisher: Journal of Accountancy, type: press, url: "https://www.journalofaccountancy.com/issues/2026/aug/real-life-ways-small-firms-use-ai/", date: "2026-08-01", access: full, locator: "Introduction (citing a 2025 CPA.com report on reconciliations, coding, close and reporting)"}
    - {ref: NYSSCPA-PCR-2026, title: "Annual Update and Practice Issues for Preparation, Compilation and Review Engagements (webcast listing)", publisher: NYSSCPA, type: conference, url: "https://nysscpa.org/catalog/events/1020413-annual-update-and-practice-issues-for-preparation-compilation-and-review-engagements-webcast-2026-23-07", date: "2026-07-23", access: full, locator: "Course objectives"}
    - {ref: CPACOM-SSARS27-2025, title: "SSARS standard clarification: frequently asked questions (SSARS 27)", publisher: CPA.com, type: professional-body, url: "https://www.cpa.com/sites/cpa/files/2025-08/SSARS_Standard_Clarification_FAQ.pdf", date: "2025-08", access: full, locator: "FAQ on scope and effective date"}
    - {ref: TSCPA-PEERREVIEW-2025, title: "Annual Report on Peer Review Activities 2025", publisher: Tennessee Society of CPAs, type: professional-body, url: "https://tscpa.com/wp-content/uploads/2026/03/Annual-Report-on-Peer-Review-Activities-2025-final.pdf", date: "2026-03-31", access: full, locator: "Section II.2(c), reviews 13 of 99; compilations 2 of 44 and 5 of 175; Tennessee"}
    - {ref: CTCPA-PEERREVIEW-2025, title: "Annual Report on Peer Review Activities, 2025 (Connecticut)", publisher: Connecticut Society of CPAs, type: professional-body, url: "https://www.ctcpas.org/storage/assets/PDFs/Annual%20Report%20on%20PR%20Activities.pdf", date: "2026-01-12", access: full, locator: "Reviews 5 of 63; compilations 4 of 47 and 2 of 67"}
    - {ref: MNCPA-PEERREVIEW-2025, title: "2025 Annual Report on Peer Review Activities (Minnesota and North Dakota)", publisher: Minnesota Society of CPAs, type: professional-body, url: "https://www.mncpa.org/mncpa/media/Documents-Shared/peer-review/2025-MNCPA-annual-report-on-peer-review-activities.pdf", date: "2026-02", access: full, locator: "Reviews 14 of 75; compilations 5 of 51 and 4 of 138"}
    - {ref: MOCPA-PEERREVIEW-2025, title: "2025 Annual Report on Peer Review Activities (Missouri)", publisher: Missouri Society of CPAs, type: professional-body, url: "https://www.mocpa.org/storage/assets/MOCPA/Peer%20Review%20Annual%20Report%202025.pdf", date: "2026-02-25", access: full, locator: "Reviews 11 of 58; compilations 1 of 20 and 3 of 102"}
  last_reviewed: "2026-10-21"
  notes: "Three strands: an idea for SSARS drafting, PCR on the audit platform, and the SSARS workflow. Grade C: named firms adopted the platform, but AI inside preparation, compilation and review is a vendor-adjacent claim and the drafting step is an idea. The 43 of 295 and 14 of 482 figures are sums of four state tables (Tennessee, Connecticut and Minnesota report compilations and preparations together; the Missouri figure is compilations only, with preparations omitting disclosures a separate 2 of 18); rates differ by state and are not a sample of AI users. The bookkeeping and close side belongs to a future accounting and client advisory archetype."

- id: assurance-private-company-18
  title: "Decide and explain where AI savings go: margin, capacity, fees or value reporting to CFOs and audit committees"
  archetype: assurance
  module: private-company
  function: strategy-planning
  work_types: [client-interaction, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: emerging
  problem: "Efficiency gains in audits can be competed away through fees. In the FERF survey of 95 finance leaders, opinion was evenly split on whether the auditor's AI has improved audit quality, and the lead researcher says CFOs are asking where the savings go [FEIDAILY-FERF-2026]. Most of the 54 firms in the AICPA benchmark anticipate raising fees (74%) while 13% track the share of engagements on value-billing agreements [CPACOM-ATR-2025]; 78% of tax, audit and accounting respondents in a Thomson Reuters survey mainly bill hourly [TR-SOTP-2026]."
  solution: "A vendor case study says a small firm's tools freed capacity to serve more clients without raising fees [TR-SAMBROWN-2026]; another small firm says it can maintain or raise rates because the work delivers more value [DATASNIPPER-PERRY-2025]. The FERF researcher says firms that can answer clearly and with data where savings go will have an advantage [FEIDAILY-FERF-2026]; 66% of the 54 benchmark firms already tell clients about their technology and methodology as a differentiator [CPACOM-ATR-2025]. For tax work, the IRS OPR alert warns that billing for manual time not spent may violate the Circular 230 fee rule and says cost savings should be passed on openly [IRS-OPR-2026]; no equivalent for audits was found in AICPA guidance."
  outcomes:
    - {lever: experience, description: "CFO opinion on whether the auditor's AI has improved audit quality", figure: "evenly split", measures: "FERF 16th annual audit fee survey, 95 FEI member respondents (September 2025 to January 2026); no counts given for this question", provenance: independent, source_ref: FEIDAILY-FERF-2026}
    - {lever: cost, description: "Benchmark firms anticipating fee increases, and firms tracking value-billing agreements", figure: "74%; 13%", measures: "shares of the 54 firms anticipating fee increases as a growth strategy; tracking engagements on value-billing agreements (fixed fee billed in advance)", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: growth, description: "Benchmark firms that communicate their technology use to clients as a differentiator", figure: "66%", measures: "share of the 54 surveyed US firms; not representative", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: cost, description: "Respondents whose firms primarily bill hourly", figure: "78%", measures: "share of 600 respondents (tax, audit and accounting firms; 64% US)", provenance: vendor-published, source_ref: TR-SOTP-2026}
  prerequisites:
    - "Time and cost data from a pre-rollout baseline (see -08)"
    - "Clients who value the output rather than the hours, a pricing policy and a client message"
  risks_and_guardrails:
    - "FERF's respondents span private companies, nonprofits, public entities and government, and its fee benchmark covers about 470 S&P 500 companies, so its figures do not describe mid-market fees; one respondent who ran a formal competitive review reported fee reductions of 25 to 30 percent [FEIDAILY-FERF-2026]"
    - "The small-firm claims are quotes in vendor case studies with no pricing data [TR-SAMBROWN-2026; DATASNIPPER-PERRY-2025]"
    - "No mid-market fee-reduction case tied to AI was found"
  human_checkpoints:
    - "Engagement partner and managing partner approve pricing for AI-shortened work"
    - "The engagement partner owns the conversation with the CFO or audit committee; FERF advises finance leaders to ask their auditor directly how AI is reflected in scope, fees or insight [FEIDAILY-FERF-2026]"
  role_evolution: "FERF respondents want clearer articulation of insight from auditors, and several see audit relationships as more transactional over time, with value defined mainly by compliance execution [FEIDAILY-FERF-2026]."
  evidence_grade: C
  sources:
    - {ref: FEIDAILY-FERF-2026, title: "Audit Fees Hold Firm, Relationships Are Evolving, and Financial Leaders See Room for More (FERF 16th annual audit fee survey)", publisher: FEI Daily (Financial Executives International), type: survey, url: "https://daily.financialexecutives.org/FEI-Daily/April-2026/audit-fees-stable-ai-audit-trends-ferf-2024-survey.aspx", date: "2026-04-14", access: full, locator: "Paragraphs on AI in audit workflows and the value perception gap"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF pages: p. 9 growth strategies (74%); p. 12 (66%); p. 22 (13%); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
    - {ref: TR-SOTP-2026, title: "2026 State of Tax Professionals Report", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en-us/posts/wp-content/uploads/sites/20/2026/06/2026-State-of-Tax-Professionals-Report.pdf", date: "2026-06", access: full, locator: "Executive summary (78% hourly); methodology box (600 respondents, 64% US)"}
    - {ref: TR-SAMBROWN-2026, title: "Small firm, big leverage: Sam Brown, CPA, Inc. scales advisory and streamlines audits with AI", publisher: Thomson Reuters, type: vendor, url: "https://tax.thomsonreuters.com/en/insights/case-studies/small-firm-big-leverage-sam-brown-cpa-inc-scales-advisory-and-streamlines-audits-with-ai", date: "2026-05-11", access: full, locator: "Closing paragraph of results"}
    - {ref: DATASNIPPER-PERRY-2025, title: "DataSnipper Success Stories - Perry & Associates CPAs", publisher: DataSnipper, type: vendor, url: "https://www.datasnipper.com/resources/perry-associates-cpas", date: "2025-09-19", access: full, locator: "Quote paragraph ('maintain or even increase our rates')"}
    - {ref: IRS-OPR-2026, title: "Introductory Guidelines for Responsible AI Use in Federal Tax Practice (OPR Alert 2026-19)", publisher: IRS Office of Professional Responsibility, type: regulator, url: "https://content.govdelivery.com/accounts/USIRS/bulletins/41d6e70", date: "2026-06-24", access: full, locator: "Section on 10.27 fees"}
  last_reviewed: "2026-10-21"
  notes: "Three strands: small-firm margin claims, the fee model, and value reporting to CFOs. Grade C: survey evidence and vendor-case quotes; no firm has published a pricing change attributed to AI. Firm types: Sam Brown CPA is a small local firm (Troy, Ohio); Perry & Associates is based in Marietta, Ohio, size not stated. TR-SOTP-2026 date given as the month of the PDF (created 2026-06-02); the exact release day was not confirmed. The Perry page shows no visible date; 2025-09-19 is the CMS date field in the page data, matching assurance-nonprofit-government. Cross-links: assurance-planning-risk-assessment-23 and assurance-acceptance-independence-21 (efficiency negotiated into fees), and economics.md."

- id: assurance-private-company-19
  title: "Idea: tell the professional-liability insurer how AI is used and check the policy for AI exclusions"
  archetype: assurance
  module: private-company
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Insurers say errors from unvetted AI output can be covered like any error unless a policy excludes AI, and that exclusions may come if claims rise [BUSINESSINS-AIEO-2026]. A CNA risk director, writing in the Journal of Accountancy, says the lack of a CPA-specific AI standard is unlikely to help defend a negligence claim that work was not properly reviewed [JOFA-DISCLOSE-2025]; CNA underwrites the AICPA's professional liability programme."
  solution: "Idea: the firm asks its broker whether the policy has an AI exclusion or sublimit, tells the insurer how AI is used, and keeps the policy, review and consent records that show output was verified [BUSINESSINS-AIEO-2026; JOFA-DISCLOSE-2025]."
  outcomes:
    - {lever: risk, description: "none published", figure: "none published", measures: "n/a", provenance: independent, source_ref: BUSINESSINS-AIEO-2026}
  prerequisites:
    - "An AI use inventory (see -07) and a written answer from the broker on AI coverage"
  risks_and_guardrails:
    - "The insurer commentary is general and uses law and medicine as examples; accounting-firm underwriting practice was not found [BUSINESSINS-AIEO-2026]"
    - "Insurers said competitive pressure discourages exclusions for now, and shadow AI use makes it hard to trace how an error arose [BUSINESSINS-AIEO-2026]"
  human_checkpoints:
    - "Managing partner reviews coverage at each renewal"
  role_evolution: "The risk partner adds AI to the insurer renewal discussion."
  evidence_grade: D
  sources:
    - {ref: BUSINESSINS-AIEO-2026, title: "AI use amplifies professional liability risks", publisher: Business Insurance, type: press, url: "https://www.businessinsurance.com/ai-use-amplifies-professional-liability-risks/", date: "2026-06-26", access: full, locator: "Paragraphs 2-6 and 'Insurers cautious on E&O exclusions'"}
    - {ref: JOFA-DISCLOSE-2025, title: "Should I disclose my use of gen AI to clients? (Professional Liability Spotlight)", publisher: Journal of Accountancy, type: press, url: "https://www.journalofaccountancy.com/issues/2025/apr/should-i-disclose-my-use-of-gen-ai-to-clients/", date: "2025-04-01", access: full, locator: "Section 'Legal and ethical compliance', final paragraph"}
  last_reviewed: "2026-10-21"
  notes: "Idea: no accounting-firm insurer statement on AI exclusions was found. Kept because small firms rarely have an in-house risk function and no other module covers liability cover. Engagement-letter disclosure and consent are in assurance-quality-management-24 and assurance-acceptance-independence-11."

- id: assurance-private-company-20
  title: "Idea: continuous, AI-run audits sold by start-ups as a challenge to hours-based audit fees"
  archetype: assurance
  module: private-company
  function: strategy-planning
  work_types: [review-assurance]
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: model
  runtime_class: background-agent
  maturity: emerging
  problem: "Audit fees and delivery models are built on labour-intensive procedures."
  solution: "Idea: new entrants run continuous, AI-driven audits that undercut the hours-based model. A machine-written episode summary of The Accounting Podcast (25 September 2026) says start-ups such as Oath Verified are pioneering continuous, AI-powered audits that challenge traditional fee structures [ACCOUNTINGPODCAST-2026]. The summary does not say whether any private-company audit has been signed under this model."
  outcomes:
    - {lever: cost, description: "none published", figure: "none published", measures: "the summary page makes the point and gives no data", provenance: independent, source_ref: ACCOUNTINGPODCAST-2026}
  prerequisites:
    - "Not stated in the source"
  risks_and_guardrails:
    - "A Going Concern brief quotes a columnist arguing a firm could be forced to retract an audit report if AI hallucinated evidence or its agents were not properly supervised; opinion about large-firm and public-company practice, not a finding [GOINGCONCERN-0803-2026]"
  human_checkpoints:
    - "Not stated in the source; the opinion still rests with a licensed auditor under existing standards"
  role_evolution: "The summary says smaller firms can use technology to compete with larger ones [ACCOUNTINGPODCAST-2026]."
  evidence_grade: D
  sources:
    - {ref: ACCOUNTINGPODCAST-2026, title: "Tips to Roll Out AI In Your Firm, AI Squeezing Audit Fees (The Accounting Podcast, episode summary page)", publisher: Podwise (The Accounting Podcast), type: podcast, url: "https://podwise.ai/episodes/8995231", date: "2026-09-25", access: full, locator: "Episode summary, third and final sentences"}
