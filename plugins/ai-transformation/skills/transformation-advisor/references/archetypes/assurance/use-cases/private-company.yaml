- id: assurance-private-company-12
  title: "Client request intake: an agent validates PBC submissions and source-document data is extracted into workpapers (Caseware Client Requests, Response Validation and Document Intelligence agents; Suralink Workpaper Suite Intelligence)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [client-interaction, coordination-scheduling, review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: "Client information (the PBC, or 'prepared by client', list) arrives late, incomplete or in poor shape, and staff retype PDFs into Excel. In a survey of 54 firms, 60% ranked poor-quality client data and 53% lack of access to client information and systems among the top blockers; firms further along in their transformation were more likely to name access to client data as their biggest obstacle [CPACOM-ATR-2025]."
  solution: "Caseware's Client Requests lets auditors and clients collaborate through the engagement and sends client-submitted information into the Excel workpaper; a Response Validation Agent checks submissions while the auditor decides whether to accept them. Caseware calls it the first step toward automating the path from client request to populated workpaper, offered in limited early access with reference customers [CASEWARE-VERITYXL-2026]. A Document Intelligence Agent, in beta in June 2026, extracts information from source documents into workpapers [CASEWARE-VERITY-2026]. Suralink's Extract Links captures and structures data from client documents, and Link Answers answers questions on lease and debt agreements, each tied to the source [SURALINK-WSI-2026]."
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "announcements and beta descriptions only; no customer, hours or accuracy figure for any of the agents or features", provenance: vendor-published, source_ref: CASEWARE-VERITYXL-2026}
  prerequisites:
    - "A request-to-review workflow already in use; Suralink calls its product a request-to-review platform [SURALINK-WSI-2026]"
    - "Membership of Caseware's early-access or beta programmes during the limited rollout [CASEWARE-VERITYXL-2026; CASEWARE-VERITY-2026]"
  risks_and_guardrails:
    - "Caseware says the agent's findings inform review, but the decision to accept a submission always rests with the auditor [CASEWARE-VERITYXL-2026]"
    - "No source describes how these agents cope with clients on spreadsheets or QuickBooks-type systems"
  human_checkpoints:
    - "The auditor accepts or rejects each client submission [CASEWARE-VERITYXL-2026]"
  role_evolution: "Caseware says auditors gain confidence in the completeness and accuracy of what clients return [CASEWARE-VERITYXL-2026]."
  evidence_grade: C
  sources:
    - {ref: CASEWARE-VERITYXL-2026, title: "Caseware Verity for Excel: Agentic AI Connects Client Requests to Audit Workpapers", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-puts-agentic-ai-inside-the-audit-connecting-client-requests-to-the-workpaper-with-caseware-verity-for-excel", date: "2026-09-09", access: full, locator: "Section on Client Requests and the Response Validation Agent"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: Caseware, type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "Verity Agentic Suites section (Document Intelligence Agent paragraph)"}
    - {ref: SURALINK-WSI-2026, title: "Suralink Unveils Workpaper Suite Intelligence", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/05/05/suralink-unveils-workpaper-suite-intelligence/182793/", date: "2026-05-05", access: full, locator: "Paragraphs 3-6 (Extract Links, Link Answers)"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "Barriers chart and text (PDF p. 8, printed p. 7); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
  last_reviewed: "2026-10-21"
  notes: "Vendors only; no named customer. Grant Thornton says gtap reduces the back and forth in receiving client data, with no figure [GT-GTAP-2026, see -04]. Data and evidence acquisition has no module in the archetype (value-chain.md section 4); large-firm request agents are in assurance-controls-testing-03 and assurance-substantive-testing-21."

- id: assurance-private-company-13
  title: "Proof of cash and books-to-bank reconciliation for small-business clients without ERP data feeds (QuickBooks-type exports, templates, PDF bank statements)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [data-reporting, review-assurance]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: "Clients keep books in QuickBooks, Xero and similar systems, hand over inconsistent exports and PDF bank statements, and often refuse direct API access [CPAPA-ATLAB-2025]. Poor client data (60%) and limited system access (53%) are the top blockers firms name [CPACOM-ATR-2025]."
  solution: "A tool (Audit Sight) sits over the firm's engagement platform and takes data by read-only connection (the podcast lists QuickBooks, Dynamics, Xero, NetSuite, Sage Intacct and some lower-end packages) or by Excel or CSV templates with import guides. It converts PDF bank statements, rebuilds a complete general ledger and produces a proof-of-cash workpaper that reconciles every bank and book transaction [CPAPA-ATLAB-2025]. Thomson Reuters embeds the same vendor in its Guided Assurance methodology [TR-GUIDEDASSURANCE-2026]."
  outcomes:
    - {lever: speed, description: "A Holbrook & Manter partner says automated cash testing changed how the firm performs substantive testing", figure: "none published", measures: "qualitative partner quote in a Thomson Reuters post; no hours, error or sample figures", provenance: vendor-published, source_ref: TR-GUIDEDASSURANCE-2026}
    - {lever: risk, description: "Thomson Reuters says the cash analytics produce audit evidence that lets auditors reduce or eliminate substantive procedures", figure: "none published", measures: "vendor statement of capability; no firm result", provenance: vendor-published, source_ref: TR-GUIDEDASSURANCE-2026}
  prerequisites:
    - "A period general ledger and bank statements in usable form; many clients will not give API access, so firms rely on templates, ERP-specific import guides and data-conversion services [CPAPA-ATLAB-2025]"
    - "Methodology that accepts the evidence; the Holbrook & Manter partner said recent PPC methodology updates make the approach practical and aligned with professional standards [TR-GUIDEDASSURANCE-2026]"
  risks_and_guardrails:
    - "The tool is not a methodology; the podcast hosts call it a tactical tool that plugs into any methodology and creates workpapers for a separate container [CPAPA-ATLAB-2025]"
    - "Reliability of client-produced data still has to be evaluated; a CalCPA author says that when information produced by the entity feeds an automated tool, the auditor must evaluate whether it is sufficiently reliable [CALCPA-AISTD-2026] (secondary)"
  human_checkpoints:
    - "Auditor investigates unreconciled items and concludes; the output is a workpaper input, not the conclusion [CPAPA-ATLAB-2025]"
  role_evolution: "Inference, not a finding: staff time moves from keying and reformatting data to investigating unreconciled items. One podcast host says that, although much work is being sent offshore, automation is where audit work has to go in the long run [CPAPA-ATLAB-2025]; opinion, not measured."
  evidence_grade: B
  sources:
    - {ref: CPAPA-ATLAB-2025, title: "Overview of Audit Sight - The Accounting Technology Lab Podcast", publisher: CPA Practice Advisor, type: podcast, url: "https://www.cpapracticeadvisor.com/podcasts/overview-of-auditsight-the-accounting-technology-lab-podcast-oct-2025/", date: "2025-10-24", access: full, locator: "Transcript: data intake, direct connections, proof of cash"}
    - {ref: TR-GUIDEDASSURANCE-2026, title: "From Vision to Workflow: Thomson Reuters Advances AI-Enabled Audit Through Guided Assurance", publisher: Thomson Reuters, type: vendor, url: "https://www.thomsonreuters.com/en-us/posts/innovation/thomson-reuters-advances-ai-enabled-audit-through-guided-assurance/", date: "2026-06-05", access: full, locator: "Audit Sight paragraph and Holbrook & Manter quote"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p. 8, printed p. 7 (barriers chart); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
    - {ref: CALCPA-AISTD-2026, title: "AI Standard Setting, Regulation in Audit: Part 1", publisher: CalCPA, type: professional-body, url: "https://www.calcpa.org/whats-happening/articles/ai-standard-setting-regulation-in-audit-part-1", date: "2026-08-12", access: full, locator: "Section on AICPA guardrails, 'Data quality' bullet (byline Svetlana Gadzhieva, Aug. 12, 2026)"}
  last_reviewed: "2026-10-21"
  notes: "Ladder automate: the tool reconciles every transaction and people handle unreconciled items, which matches the vocabulary's worked example for automate. The named deployment is a partner quote at Holbrook & Manter (size not stated) inside vendor material, so grade B. The podcast names the package 'Sage Intact'; written here as Sage Intacct. A claimed 80% saving in management-meeting prep is a diligence feature and is not used. Cross-links: assurance-substantive-testing-07 (data cleaning to the trial balance) and -17 (bank and third-party data)."

- id: assurance-private-company-14
  title: "Risk-focused sample selection recorded as a workpaper, to justify leaner samples to peer reviewers at a small firm (Sam Brown CPA)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: other
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: "A small firm relied on Excel templates and manual steps for sampling, testing and documentation; it over-audited and found it hard to justify leaner samples to peer reviewers [TR-SAMBROWN-2026]."
  solution: "Transaction analytics embedded in the workflow (Thomson Reuters Audit Intelligence Analyze) focus procedures on higher-risk areas and record the selections as workpapers, so the firm can show peer reviewers why a sample is the size it is [TR-SAMBROWN-2026]."
  outcomes:
    - {lever: capacity, description: "Owner's estimate of staff time saved per audit", figure: "at least five to six hours per audit", measures: "owner's statement, phrased 'at least', of hours saved per audit with Audit Intelligence Analyze; an estimate, not a tracked metric", provenance: vendor-published, source_ref: TR-SAMBROWN-2026}
  prerequisites:
    - "Transaction data the tool can ingest, and a firm methodology that allows risk-based selection"
  risks_and_guardrails:
    - "Smaller samples must still meet peer reviewers' documentation expectations; the firm's stated reason for the tool was defensibility [TR-SAMBROWN-2026]"
  human_checkpoints:
    - "The firm decides which selections to test; peer review of the file follows"
  role_evolution: "The vendor says the three tools together shifted routine work away from senior time; the junior-staff change it describes comes from a separate tax-advisory tool (Ready to Advise), not the sampling tool [TR-SAMBROWN-2026]."
  evidence_grade: B
  sources:
    - {ref: TR-SAMBROWN-2026, title: "Small firm, big leverage: Sam Brown, CPA, Inc. scales advisory and streamlines audits with AI", publisher: Thomson Reuters, type: vendor, url: "https://tax.thomsonreuters.com/en/insights/case-studies/small-firm-big-leverage-sam-brown-cpa-inc-scales-advisory-and-streamlines-audits-with-ai", date: "2026-05-11", access: full, locator: "Opening summary; challenge, solution and results paragraphs"}
  last_reviewed: "2026-10-21"
  notes: "Firm type: small local firm (Troy, Ohio, founded 2015) serving individuals, businesses and nonprofits. The page shows no visible date; 2026-05-11 is the publishDate in the page metadata. Ladder automate to match assurance-nonprofit-government-06, which rates the same tool automate (selection and documentation run without a person; the auditor sets strata and approves). The peer-review rationale for sample size is the mid-market point. General pattern: assurance-substantive-testing-08 and -09."

- id: assurance-private-company-15
  title: "Engagement-aware assistant inside the Excel workpaper that drafts workpapers and test steps from the connected audit file (Caseware Verity for Excel)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "Auditors move information by hand between the audit file, client submissions and Excel workpapers; Caseware describes the aim as less time searching for and transferring information [CASEWARE-VERITYXL-2026]."
  solution: "Caseware says Verity for Excel reads the connected engagement (client-submitted information, procedures, trial balance, materiality, samples and supporting documents) from inside Excel and runs multi-step workflows covering workpaper generation and test automation across tests of controls, substantive analytics and tests of details. Suggestions are reviewed and approved before changes are applied. It is included at no additional licensing for firms that already have Verity and was described as generally available on 9 September 2026 [CASEWARE-VERITYXL-2026]."
  outcomes:
    - {lever: speed, description: "Average time saved in Caseware's own testing to date", figure: "9 hours per engagement; 75% per task", measures: "Caseware's wording: 'in testing to date' the product saved on average nine hours per engagement and 75% per task; the number of engagements, firms or tasks, the baseline, and what the 75% is a percentage of are not stated", provenance: vendor-published, source_ref: CASEWARE-VERITYXL-2026}
  prerequisites:
    - "Caseware Verity and the engagement held in Caseware Cloud [CASEWARE-VERITYXL-2026]"
  risks_and_guardrails:
    - "Changes are applied only after approval [CASEWARE-VERITYXL-2026]; Caseware states engagement data is not used to train its models [CASEWARE-RSA-2026]"
