- id: assurance-private-company-07
  title: "Written AI acceptable-use policy with an approved-tool list, a named owner, and role-based training as a condition of tool access, in a small or mid-size practice"
  archetype: assurance
  module: private-company
  function: risk-compliance-legal
  work_types: [review-assurance, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Staff in small and mid-size firms use general chat tools faster than firms write rules: more than one in three surveyed tax and audit professionals admit using unauthorised AI tools [TRI-FOP-2026]. Untrained staff is the most cited blocker in the AICPA audit benchmark (66% of 54 firms) [CPACOM-ATR-2025], and 46% of Karbon's respondent firms invest in training [KARBON-AI-2026]."
  solution: "The firm writes down which tools are approved and on which plan, what client information may go into them, which review standard applies to AI-assisted work and who owns the policy; some firms add a strategy committee with a designated representative [CPAFMA-WINSOME-2026]. AICPA ethics staff note that many firms steer staff to approved tools with clear data-handling protections [JOFA-ETHAI-2026]. Access to a tool is tied to completed training for the role, covering the engagement team's competence, which the AICPA practice aid lists as a firm-level consideration [AICPA-PA-2026]. EisnerAmper and Citrin Cooperman used CPA.com for training and change management in their platform rollouts [CASEWARE-EISNERAMPER-2026; CASEWARE-CITRIN-2026]."
  outcomes:
    - {lever: risk, description: "A survey of 162 firms reports 57% with a written AI policy that staff have been trained on (20% in 2024) and 47% with a dedicated AI strategy committee", figure: "57% (2026); 20% (2024); 47%", measures: "shares of the 162 responding firms, per a blog summary of the CPAFMA survey run in December 2025; the original report was not opened", provenance: independent, source_ref: CPAFMA-WINSOME-2026}
    - {lever: risk, description: "Karbon's survey reports 21% of firms with an AI policy; firms with a policy report 17% more time saved", figure: "21%; 17%", measures: "share of respondents' firms with an AI policy (about 593 respondents, mostly US, October 2025); the 17% is self-reported time saved by firms with a policy against those without", provenance: vendor-published, source_ref: KARBON-AI-2026}
    - {lever: risk, description: "Professionals admitting use of unauthorised AI tools", figure: "more than 1 in 3", measures: "share of professionals in Thomson Reuters' 2026 Future of Professionals research; the page does not state the base", provenance: vendor-published, source_ref: TRI-FOP-2026}
  prerequisites:
    - "An inventory of tools already in use, including AI inside software the firm already licenses"
    - "One named owner for the policy and the vendor file, and enterprise-tier accounts so approved tools carry contractual data protections [JOFA-CHECKLIST-2026]"
    - "Role-specific training for preparers, reviewers and partners, with a record of completion before access"
  risks_and_guardrails:
    - "The two policy surveys disagree (21% against 57%); samples and wording differ, so neither is a firm-population rate [KARBON-AI-2026; CPAFMA-WINSOME-2026]"
    - "A policy without monitoring does not remove unauthorised use [TRI-FOP-2026]"
    - "The AICPA Code's competence, confidentiality and independence duties apply however the tool is sourced [JOFA-ETHAI-2026]"
    - "Training figures are survey self-reports; no firm has published whether trained staff make fewer AI-related review notes"
  human_checkpoints:
    - "Policy owner approves each tool and use"
    - "Engagement partner confirms tools are firm-approved, used correctly and that the team is competent to use them [AICPA-PA-2026]"
  role_evolution: "A partner or technology lead becomes the accountable AI policy owner; the CPAFMA summary argues a named representative keeps governance from defaulting to individual staff judgment [CPAFMA-WINSOME-2026]. Thomson Reuters says junior staff still need structured development, with supervision in place before automation erodes it [TRI-FOP-2026]."
  evidence_grade: C
  sources:
    - {ref: CPAFMA-WINSOME-2026, title: "AI Governance Shocks in the 2026 CPAFMA Digitally Driven Firm Survey (blog summary of a survey of 162 firms)", publisher: Winsome Marketing, type: survey, url: "https://winsomemarketing.com/professional-services-marketing/ai-governance-shocks-in-the-2026-cpafma-digitally-driven-firm-survey", date: "2026-07-01", access: full, locator: "Paragraphs 2-4 (57%, 20%, 47%)"}
    - {ref: KARBON-AI-2026, title: "The State of AI in Accounting 2026", publisher: Karbon, type: survey, url: "https://a.storyblok.com/f/321253/x/e2116b7c8a/the-state-of-ai-in-accounting-report-2026-by-karbon.pdf", date: "2026-01", access: full, locator: "p. 18 (policy, strategy, training, time saved); p. 3 (sample and caveat)"}
    - {ref: TRI-FOP-2026, title: "What the 2026 Future of Professionals Report says tax and audit firm leaders should be prioritizing now", publisher: Thomson Reuters Institute, type: survey, url: "https://www.thomsonreuters.com/en/institute/reports/future-of-professionals-tax-audit-firms-paper-2026", date: "2026-07-21", access: full, locator: "'Govern the tools being used'; 'Define the role of early-career professionals'"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p. 8, printed p. 7 (blockers); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
    - {ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "Section 'AI can create confidentiality risks quickly'; AICPA Professional Ethics Division staff"}
    - {ref: AICPA-PA-2026, title: "AICPA Releases Guidance to Help Auditors Address the Use of AI in Financial Reporting and Auditing", publisher: AICPA & CIMA, type: standard-setter, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "Section two bullets (QM policies, competence, partner responsibilities); news release for the practice aid"}
    - {ref: JOFA-CHECKLIST-2026, title: "New checklist helps CPAs manage AI cyber risks", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/oct/new-checklist-helps-cpas-manage-ai-cyber-risks/", date: "2026-10-01", access: full, locator: "Paragraphs on the baseline security checklist and authorised AI tools"}
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper Leverages DAS Powered by Caseware to Unify Audit and Build an Agentic Future Across Its Multi-Vertical Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "Rollout and training paragraphs"}
    - {ref: CASEWARE-CITRIN-2026, title: "Citrin Cooperman & Company, LLP Adopts AI-Enabled DAS Suite Powered by Caseware to Advance Audit Quality, Professional Development, and Scalable Growth", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/citrin-cooperman-company-llp-adopts-ai-enabled-das-suite-powered-by-caseware-to-advance-audit-quality-professional-development-and-scalable-growth", date: "2026-07-13", access: full, locator: "CPA.com implementation paragraph"}
  last_reviewed: "2026-10-21"
  notes: "Two strands: policy and training. Maturity emerging because the surveys are anonymous and no named mid-market firm has published its policy or results. Grade C: a vendor survey, a vendor-affiliated survey and a consultant survey seen through a blog. Large-firm versions: assurance-quality-management-02 (risk-tiered permitted-use policy), -03 (authorised-tool inventory) and -10 (role-differentiated training). Writing AI into the system of quality management risk assessment and annual evaluation is in assurance-quality-management-26, not repeated here."

- id: assurance-private-company-08
  title: "Write a transformation plan and baseline the metrics that would show whether AI changes hours, review notes and quality"
  archetype: assurance
  module: private-company
  function: strategy-planning
  work_types: [data-reporting, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: "Of 54 firms in the CPA.com and AICPA audit benchmark, 75% had no formal documentation of their audit transformation, and the metrics most firms track (realisation 87%, billable hours 76%, utilisation 72%) say little about AI's effect [CPACOM-ATR-2025]. A global ISACA poll found 22% saying AI return on investment met or exceeded expectations and 22% not knowing [ISACA-PULSE-2026]."
  solution: "The firm records a baseline before rollout (for example hours per checklist, per selection and per review round; review notes per file; nonconformity history) and tracks it after. The AICPA benchmark report suggests newer metrics such as deliverable-based accountability and client readiness, and a formal policy to reinvest a defined share of saved time, giving 20% as an example [CPACOM-ATR-2025]."
  outcomes:
    - {lever: quality, description: "Firms without formal documentation of their audit transformation", figure: "75%", measures: "share of the 54 responding US firms; survey not representative", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: cost, description: "Firms that do not measure technology ROI, and firms naming staff efficiency as a top-two ROI outcome", figure: "6%; 83%", measures: "shares of the 54 firms; 54% name audit quality or accuracy and 37% cost savings", provenance: independent, source_ref: CPACOM-ATR-2025}
    - {lever: quality, description: "Few firms track margin, deliverable-based accountability or client readiness", figure: "28%; 22%; 13%", measures: "shares of the 54 firms tracking audit margin per engagement; deliverable-based accountability; client readiness metrics", provenance: independent, source_ref: CPACOM-ATR-2025}
  prerequisites:
    - "A named owner and a written plan [CPACOM-ATR-2025]"
    - "Pre-rollout baselines in the units the firm will use afterwards, and time recording that can separate AI-assisted from other work"
  risks_and_guardrails:
    - "The benchmark was run by CPA.com and the AICPA; DAS was built by the AICPA, CPA.com and Caseware, and CPA.com is its implementation partner [CASEWARE-EISNERAMPER-2026]. The 54-firm sample is not representative [CPACOM-ATR-2025]"
    - "Time saved is the dominant ROI measure and quality the second, so savings may be claimed without a quality check [CPACOM-ATR-2025]"
    - "ISACA's population is digital trust professionals, not accountants [ISACA-PULSE-2026]"
  human_checkpoints:
    - "Practice leader reviews baseline and post-rollout figures together"
    - "Partner decides how much saved time is reinvested"
  role_evolution: "Recommendation, not a sourced finding: practice leaders add AI value tracking to the realisation, hours and utilisation reporting most firms already run [CPACOM-ATR-2025]."
  evidence_grade: C
  sources:
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF pages: p. 3 (sample, not representative); p. 9 (75%); p. 12 (ROI priorities, 6%); p. 17 (20% reinvestment example); p. 22 (metrics tracked); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper Leverages DAS Powered by Caseware to Unify Audit and Build an Agentic Future Across Its Multi-Vertical Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "Paragraphs 2 and 4 (DAS built by AICPA, CPA.com and Caseware; CPA.com implementation)"}
    - {ref: ISACA-PULSE-2026, title: "AI use accelerates while governance and ROI lag, says new ISACA research", publisher: ISACA, type: survey, url: "https://isaca.org/about-us/newsroom/press-releases/2026/ai-use-accelerates-while-governance-and-roi-lag-says-new-isaca-research", date: "2026-05-05", access: full, locator: "Paragraphs on ROI"}
  last_reviewed: "2026-10-21"
  notes: "Grade C: survey data on measurement practice; no firm has published AI-specific before-and-after figures for a private-company audit. Large-firm monitoring and dashboards: assurance-quality-management-07, which also holds the one independent association between AI investment and restatements (FEDYK-2022; largest firms, pre-generative AI)."

- id: assurance-private-company-09
  title: "Start with general-purpose GenAI on low-risk drafting and documentation tasks chosen with staff, with skills sessions and a study of what changes (Beever and Struthers; AICPA webcast advice)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [document-production, research-synthesis]
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: "Firms adopt general assistants without knowing whether time saved becomes output or whether staff trust the results. Firms exploring AI risk being overwhelmed, and the analytics that attract attention are hard to validate [JOFA-AAFOCUS-2025]."
  solution: "Beever and Struthers, a mid-tier UK practice, introduced GenAI under a year-long study by Alliance Manchester Business School and Aston Business School that combined surveys of more than 200 staff, 50 interviews, targeted skills sessions and four case studies; staff used it to draft emails or refine written material (53%), summarise meetings or long documents (46%) and support spreadsheet work (33%) [ICAS-AMBS-2025]. On an AICPA A&A Focus webcast in September 2025, a Caseware senior vice president advised starting with easy-win tasks such as summarising board minutes, editing long memos or automating routine documentation, picked with staff, and not starting with analytics; she advised reading licence terms because smaller firms lack large firms' leverage to negotiate [JOFA-AAFOCUS-2025]."
  outcomes:
    - {lever: speed, description: "Staff saying GenAI helped them complete certain tasks faster", figure: "74%", measures: "share of survey respondents at Beever and Struthers; the article does not state each figure's base (survey drew on more than 200 staff)", provenance: independent, source_ref: ICAS-AMBS-2025}
    - {lever: capacity, description: "Staff saying time savings became a marked rise in overall output", figure: "22%", measures: "share of respondents reporting a marked rise in their overall output", provenance: independent, source_ref: ICAS-AMBS-2025}
    - {lever: risk, description: "Staff concerned about incorrect output and about client information handling", figure: "72%; 52%", measures: "shares of respondents concerned about incorrect GenAI output or flawed decisions; about how client information is handled and protected", provenance: independent, source_ref: ICAS-AMBS-2025}
  prerequisites:
    - "A firm policy and an approved tool; data privacy and confidentiality checked, especially for open or free tools [JOFA-AAFOCUS-2025]"
    - "Skills sessions alongside the tool [ICAS-AMBS-2025], and a way to measure output, not just licences issued"
  risks_and_guardrails:
    - "The study found GenAI most effective for routine, structured work, while tasks needing nuanced understanding, collaboration or ethical decision-making still depend on professional expertise [ICAS-AMBS-2025]"
    - "The webcast speaker warned that with a free tool 'you are the product' [JOFA-AAFOCUS-2025]"
    - "Due care and professional skepticism are unchanged; the practitioner stays responsible for accuracy and judgment [JOFA-AAFOCUS-2025]"
  human_checkpoints:
    - "Staff review all output; ICAS's lead says people must stay in the driving seat of professional decisions [ICAS-AMBS-2025]"
  role_evolution: "The webcast speaker said easy-win uses help younger staff perform at a higher level sooner [JOFA-AAFOCUS-2025]. The gap between faster tasks (74%) and more output (22%) suggests time is absorbed elsewhere; that is an inference from the two figures, not a finding of the study."
  evidence_grade: B
  sources:
    - {ref: ICAS-AMBS-2025, title: "ICAS study finds widespread concern over genAI accounting errors", publisher: The Accountant, type: press, url: "https://www.theaccountant-online.com/news/icas-study-finds-widespread/", date: "2026-03-17", access: full, locator: "Paragraphs 3-12 (design, 74%, 22%, 72%, 52%, task uses); Alliance Manchester and Aston Business Schools study of Beever and Struthers"}
    - {ref: JOFA-AAFOCUS-2025, title: "A&A Focus recap: AI considerations in A&A, GASB updates, and practical lease accounting challenges", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/newsletters/a-a-focus/aa-focus-recap-ai-considerations-in-aa-gasb-updates-and-practical-lease-accounting-challenges", date: "2025-09-19", access: full, locator: "Paragraphs on the AI segment by Danielle Supkis-Cheek"}
  last_reviewed: "2026-10-21"
  notes: "Two parts: the Beever and Struthers rollout and the advice to start with low-risk tasks. Firm type: mid-tier UK firm; tasks are general accounting work, not audit-specific, and only the press report was read (the ICAS report was not opened), so the grade is capped at B; the figures are staff perceptions, not timed measures. Source type is press (the article), although the underlying study is academic. The webcast speaker is a vendor executive, so that part is advice. The article is dated 17 Mar 2026. Board-minute summaries and memo drafting as tool uses: assurance-planning-risk-assessment-01 and assurance-completion-reporting-13."

- id: assurance-private-company-10
  title: "Citation-backed research and document-analysis assistant for audit teams at large regional and mid-sized firms (Plante Moran pilot; Harris, Hardy & Johnstone)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Audit teams lose time on technical research and on reading long unstructured documents such as board minutes, contracts and debt agreements, and staff are scarce."
  solution: "A purpose-built audit research assistant (Thomson Reuters CoCounsel Audit) gives citation-backed answers, accepts document uploads and lets firms integrate internal documents and templates. Plante Moran piloted it with more than 140 participants, then widened access [TR-PLANTEMORAN-2025]; Harris, Hardy & Johnstone uses it for document review such as board minutes and contracts [TR-SCALING-2026]."
  outcomes:
    - {lever: speed, description: "Plante Moran pilot respondents who said the tool was faster than traditional research methods", figure: "91%", measures: "of the 140+ participants in Plante Moran's pilot, those who reported it faster than traditional methods of research (anonymous internal survey of perceived speed, not a timed comparison), as published by the vendor", provenance: vendor-published, source_ref: TR-PLANTEMORAN-2025}
    - {lever: capacity, description: "Plante Moran widened access after the pilot", figure: "450% increase in user base", measures: "growth in users after the pilot as stated by Thomson Reuters; starting and end counts not given", provenance: vendor-published, source_ref: TR-SCALING-2026}
    - {lever: speed, description: "Harris, Hardy & Johnstone says document review that took an hour now takes about five minutes", figure: "about 1 hour to about 5 minutes", measures: "the firm's own statement for document review tasks; no timing study or sample size", provenance: vendor-published, source_ref: TR-SCALING-2026}
  prerequisites:
    - "Enterprise-grade licence and written AI security protocols; the vendor says Plante Moran set new AI security protocols and software controls with its guidance [TR-PLANTEMORAN-2025]"
    - "Prompt and template tuning before templates are shared"
  risks_and_guardrails:
    - "Perceived-speed surveys and firm quotes are not error-rate measures; no false-positive or miss rate is published [TR-SCALING-2026]"
  human_checkpoints:
    - "The auditor reads the cited passages and decides what to rely on; the vendor describes citation-backed responses as the basis for audit trails [TR-SCALING-2026]"
  role_evolution: "Thomson Reuters says giving every staff member the tool strengthened Plante Moran's reputation as an employer [TR-SCALING-2026]; the pilot survey found 87% of respondents wanted it made available to all staff [TR-PLANTEMORAN-2025]."
  evidence_grade: B
  sources:
    - {ref: TR-SCALING-2026, title: "Scaling audit practices with AI: 3 real-world case studies", publisher: Thomson Reuters, type: vendor, url: "https://tax.thomsonreuters.com/blog/scaling-your-audit-practice-with-ai-3-real-world-cocounsel-audit-case-studies/", date: "2026-06-16", access: full, locator: "Sections on Plante Moran and Harris, Hardy & Johnstone; results paragraph on the 140+ pilot"}
    - {ref: TR-PLANTEMORAN-2025, title: "Thomson Reuters CoCounsel at Plante Moran", publisher: Thomson Reuters, type: vendor, url: "https://tax.thomsonreuters.com/en/insights/case-studies/thomson-reuters-cocounsel-at-plante-moran", date: "2025-11-20", access: full, locator: "Sections 'Thoughtful innovation and rigorous security', 'Embracing innovation' and 'Key outcomes' (140+ participants, anonymous internal survey, 91%, 87%)"}
  last_reviewed: "2026-10-21"
  notes: "Grade stays B under the 2026-10-17 rule: the 91% comes from Plante Moran's internal pilot survey, but it measures perceived speed and is published only by the vendor. Firm types: Plante Moran is described by the vendor as one of the nation's largest audit and accounting firms; Harris, Hardy & Johnstone is described as mid-sized. The small nonprofit-audit firms in the same vendor material (template tuning, grant agreements, board minutes) are in assurance-nonprofit-government-01, -02 and -05; not repeated here. General pattern: assurance-planning-risk-assessment-01 and -02."

