  human_checkpoints:
    - "The practitioner approves each suggested change before it is applied [CASEWARE-VERITYXL-2026]"
  role_evolution: "Caseware says teams should spend less time searching for and moving information and more on professional judgment [CASEWARE-VERITYXL-2026]."
  evidence_grade: C
  sources:
    - {ref: CASEWARE-VERITYXL-2026, title: "Caseware Verity for Excel: Agentic AI Connects Client Requests to Audit Workpapers", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-puts-agentic-ai-inside-the-audit-connecting-client-requests-to-the-workpaper-with-caseware-verity-for-excel", date: "2026-09-09", access: full, locator: "Opening paragraphs; section on Verity for Excel (availability, nine hours and 75%)"}
    - {ref: CASEWARE-RSA-2026, title: "Caseware Verity-powered Risk Suggestion Agent launches to help auditors identify engagement-specific risks", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-verity-powered-risk-suggestion-agent-launches-to-help-auditors-identify-engagement-specific-risks", date: "2026-10-06", access: full, locator: "Paragraph on governance and data not used to train models"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: Caseware, type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "Governance paragraphs"}
  last_reviewed: "2026-10-21"
  notes: "Vendor claim with no named customer, so grade C and maturity announced although the vendor says generally available. Overlaps the Excel-embedded tools in assurance-substantive-testing-07, -11 and -12; the difference is the live link to the whole engagement file in the Caseware audit platform."

- id: assurance-private-company-16
  title: "AI gap flagging, cross-file checks and risk-to-procedure links in the engagement file, aimed at recurring peer-review findings at small firms (vendor and AICPA-column claims)"
  archetype: assurance
  module: private-company
  function: risk-compliance-legal
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: "The AICPA's Small Firm Advocate wrote in August 2026 that for many small firms it can feel as if the effort to comply with quality management standards and peer review now rivals the time spent performing the audit [JOFA-SMALLFIRM-2026]. A CPE course description says recent peer reviews show auditors failing to perform or document risk assessment and link it to substantive procedures, and documenting fraud consideration and analytical expectations poorly [NYSSCPA-PEERDEF-2026]. In 2025 state reports, 34 of 448 reviewed engagements were nonconforming in Tennessee and 86 of 525 in the Oklahoma, South Dakota and Kansas administering entity [TSCPA-PEERREVIEW-2025; OKSCPA-PEERREVIEW-2025]."
  solution: "The AICPA column advises standardising templates, checklists and engagement files through the year and says audit-specific AI-enabled technologies can help firms identify gaps, cross-reference requirements and flag inconsistencies earlier, so reviewers and partners spend time on judgment and supervision [JOFA-SMALLFIRM-2026]. Thomson Reuters argues that embedded research, standardised workpapers and traceable links from planning to risk to procedure to evidence to conclusion reduce the deficiencies reviewers look for [TR-PEERREVIEW-2026]. Caseware describes cross-file risk checks, unresolved-issue tracking and automated review packs that give partners earlier sight of sign-off readiness; its CwX demonstration showed a planning review where the assistant surfaced a trial-balance variance with no associated risk [CASEWARE-LAUNCH-2026; CASEWARE-VERITY-2026]."
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "no source reports a peer-review result, finding rate or hours saved from using such a tool", provenance: vendor-published, source_ref: TR-PEERREVIEW-2026}
  prerequisites:
    - "Standardised templates, checklists and engagement files kept up through the year, and a regular flow of audit work [JOFA-SMALLFIRM-2026]"
    - "A firm view of its own recurring review notes and past nonconformity types, and engagement data in one system so cross-file checks have something to check"
  risks_and_guardrails:
    - "The AICPA column says technology will not remove the need for peer review [JOFA-SMALLFIRM-2026]"
    - "None of the state peer-review reports read mentions AI, so how reviewers treat AI-assisted files is not documented [TSCPA-PEERREVIEW-2025; CTCPA-PEERREVIEW-2025; MNCPA-PEERREVIEW-2025; MOCPA-PEERREVIEW-2025; OKSCPA-PEERREVIEW-2025; OSCPA-PR-2026]"
    - "The EBSA found that peer review and practice monitoring did not help identify deficient plan audits, so passing peer review is weak evidence of tool quality [EBSA-AUDITQ-2023]"
    - "A tool that flags risks may anchor reviewers on its flags; a CCAB teaching case describes junior auditors focusing only on AI-flagged issues [CCAB-CASE2-2026] (hypothetical)"
    - "The Thomson Reuters and Caseware pieces are marketing for their own products"
  human_checkpoints:
    - "Manager and partner remain the reviewers; Caseware describes review points as staying the reviewer's call [CASEWARE-VERITY-2026]"
    - "Engagement quality review where required"
  role_evolution: "Caseware says managers can speed reviews with cross-file risk checks, unresolved-issue tracking and automated review packs, and partners get earlier sight of sign-off readiness [CASEWARE-LAUNCH-2026]; no firm has described how its reviewers' work changed. The AICPA column suggests some small firms use independent contractors, often retired practitioners, for engagement work and remediation in peak periods [JOFA-SMALLFIRM-2026]."
  evidence_grade: C
  sources:
    - {ref: JOFA-SMALLFIRM-2026, title: "What small firm CPAs need to know (Small Firm Q&A, Stephanie Otero)", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/what-small-firm-cpas-need-to-know/", date: "2026-08-01", access: full, locator: "First two Q&As (audit viability; peer review efficiency)"}
