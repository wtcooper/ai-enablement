# Use cases for the assurance archetype, private-company module (mid-market extension).
# Sources checked 2026-10-21.
# Covers audits of private companies under AICPA standards and preparation, compilation and review (SSARS) work at
# small, regional, top-100 and private-equity-backed firms. Large-firm mechanics live in the other modules; entries
# here say what is different at mid-market scale and cross-reference other modules by full id.

- id: assurance-private-company-01
  title: "One methodology platform for audits, preparation/compilation/review and benefit plan audits, with the vendor's AI layer on top (Withum, EisnerAmper, Citrin Cooperman, PKF O'Connor Davies on DAS and Caseware Verity)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Few mid-market firms build their own AI audit tooling, and many run audits, reviews, compilations and benefit plan audits on disconnected tools with uneven methodology. In a survey of 54 firms, 66% named untrained staff, 60% poor client data and 75% had no formal transformation plan [CPACOM-ATR-2025]. Choosing a methodology is itself a live decision: a practitioner panel at ENGAGE 2026 was built around it [GRF-ENGAGE-2026]."
  solution: "The firm adopts the Dynamic Assurance Solution (DAS) suite, a methodology the AICPA developed with audit professionals that runs on Caseware's platform [CASEWARE-DASUPD-2026]. DAS Audit, DAS PCR (preparation, compilation and review) and DAS EBP (employee benefit plans) share one system of record, and Caseware Verity (an engagement-aware assistant and agents) sits inside it [CASEWARE-WITHUM-2026; CASEWARE-CITRIN-2026]. Caseware says outputs are citation-backed and reviewable before they enter the file and run within firm-configured permissions with engagement-level data isolation [CASEWARE-LAUNCH-2026]. Rollouts are phased, with CPA.com as implementation partner for planning, data migration, training and change management [CASEWARE-EISNERAMPER-2026; CASEWARE-CITRIN-2026]."
  outcomes:
    - {lever: capacity, description: "Withum scale of use on the platform", figure: "more than 1,000 active users; more than 6,000 engagements completed to date", measures: "active users on DAS and engagements completed on it, as stated in Caseware's release; adoption counts, not time, quality or cost measures, and DAS is the whole platform, not only its AI features", provenance: vendor-published, source_ref: CASEWARE-WITHUM-2026}
    - {lever: capacity, description: "EisnerAmper scale of use after a phased rollout", figure: "more than 1,100 professionals; over 1,500 client engagements", measures: "professionals using the DAS suite and client engagements completed with the new system as of 25 June 2026, per Caseware; not split by engagement type", provenance: vendor-published, source_ref: CASEWARE-EISNERAMPER-2026}
    - {lever: speed, description: "A Withum partner says tasks that took hours are being streamlined", figure: "none published", measures: "qualitative quote in the vendor release", provenance: vendor-published, source_ref: CASEWARE-WITHUM-2026}
  prerequisites:
    - "A methodology decision: the platform's methodology becomes the firm's audit methodology"
    - "Implementation partner for planning, data migration, training and change management; CPA.com played this role at all four firms [CASEWARE-WITHUM-2026; CASEWARE-EISNERAMPER-2026; CASEWARE-CITRIN-2026; CASEWARE-PKF-2026]"
    - "Phased rollout with pilots and champions; EisnerAmper says it put professional readiness ahead of speed [CASEWARE-EISNERAMPER-2026]"
    - "Firm-configured permissions and engagement-level data separation [CASEWARE-LAUNCH-2026], plus a documented firm review of the vendor's controls, since the claims are self-published"
  risks_and_guardrails:
    - "Adoption counts are not outcome measures; none of the four releases publishes hours, review-note or inspection results, and all were written by the vendor [CASEWARE-WITHUM-2026; CASEWARE-EISNERAMPER-2026; CASEWARE-CITRIN-2026; CASEWARE-PKF-2026]"
    - "Methodology, workpapers and AI come from one vendor. AICPA ethics material warns that tool-provider terms can shift control, judgment, financial dependency or evidence access toward the provider; it was written about SOC 2 tools and says it may be relevant to other attest work [JOFA-SOCETH-2026]"
    - "The AICPA has said some firms lean too heavily on third-party SOC platforms without applying the judgment standards require [JOFA-PEER-2026]; a reminder that a governed platform does not replace the firm's own judgment"
  human_checkpoints:
    - "Auditors review, refine, accept or override each Disclosure Checklist Agent suggestion inside the DAS workflow, and Caseware says every Verity output is reviewable before it enters the file [CASEWARE-LAUNCH-2026]"
    - "Managers and partners review as before; Caseware describes the AI as a second set of eyes whose review points stay the reviewer's call [CASEWARE-VERITY-2026]"
  role_evolution: "Caseware's Withum release says a first-year auditor can trace disclosure checklist outputs to evidence and build judgment sooner, and Citrin Cooperman's assurance innovation leader says seeing the reasoning behind procedures builds technical knowledge [CASEWARE-WITHUM-2026; CASEWARE-CITRIN-2026]. The first is the vendor's narrative and the second a firm quote in a vendor release; neither is measured."
  evidence_grade: B
  sources:
    - {ref: CASEWARE-WITHUM-2026, title: "Withum Fully Adopts DAS Powered by the Caseware Verity AI Platform to Drive its Future-Ready Audit Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/withum-fully-adopts-das-powered-by-the-caseware-verity-ai-platform-to-drive-its-future-ready-audit-practice", date: "2026-06-03", access: full, locator: "Paragraphs 2-4 (suite, user and engagement counts); McElgunn quote; first-year auditor paragraph (release narrative)"}
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper Leverages DAS Powered by Caseware to Unify Audit and Build an Agentic Future Across Its Multi-Vertical Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "Opening paragraph (modules and counts); rollout and training paragraphs"}
    - {ref: CASEWARE-CITRIN-2026, title: "Citrin Cooperman & Company, LLP Adopts AI-Enabled DAS Suite Powered by Caseware to Advance Audit Quality, Professional Development, and Scalable Growth", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/citrin-cooperman-company-llp-adopts-ai-enabled-das-suite-powered-by-caseware-to-advance-audit-quality-professional-development-and-scalable-growth", date: "2026-07-13", access: full, locator: "Paragraph 2 (DAS Audit, DAS PCR, DAS EBP); CPA.com implementation paragraph; Kanter quotes"}
    - {ref: CASEWARE-PKF-2026, title: "PKF O'Connor Davies Adopts AI-Enabled DAS Suite Powered by Caseware Verity, and Joins the Caseware Agentic Pioneer Program", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/pkf-oconnor-davies-adopts-ai-enabled-das-suite-powered-by-caseware-verity-and-joins-the-caseware-agentic-pioneer-program", date: "2026-10-08", access: full, locator: "Paragraphs 1-3"}
    - {ref: CASEWARE-DASUPD-2026, title: "AICPA Dynamic Assurance Solution (DAS) Expands Connected Audit Workflows with New Risk, Controls and PCAOB Capabilities", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/aicpa-dynamic-assurance-solution-das-expands-connected-audit-workflows-with-new-risk-controls-and-pcaob-capabilities", date: "2026-06-08", access: full, locator: "Paragraph 2 (methodology developed by the AICPA)"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "Section 'Governance, traceability and human oversight'"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: Caseware, type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "Sections 'Governance and accountability' and 'Feedback from beta partner firms'"}
    - {ref: GRF-ENGAGE-2026, title: "2026 AICPA & CIMA Engage Conference (session list)", publisher: GRF CPAs & Advisors, type: conference, url: "https://www.grfcpa.com/?p=9081", date: "2025-11-17", access: full, locator: "Session abstract 'Methodology for Selecting a Methodology'"}
    - {ref: CPACOM-ATR-2025, title: "2025 Audit Transformation Report", publisher: CPA.com and AICPA, type: survey, url: "https://www.cpa.com/sites/cpa/files/2025-12/2025_Audit_Transformation_Report.pdf", date: "2025-12", access: full, locator: "PDF p. 8, printed p. 7 (blockers chart); PDF p. 9 (75% without a formal plan); CPA.com and AICPA Audit Benchmark Survey, 54 US firms; not representative"}
    - {ref: JOFA-SOCETH-2026, title: "SOC engagements: Ethics risks with tool providers", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/apr/soc-engagements-ethics-risks-with-tool-providers/", date: "2026-04-06", access: full, locator: "Paragraphs 1-3"}
    - {ref: JOFA-PEER-2026, title: "AICPA guides peer reviewers to address SOC 2 risks", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/may/aicpa-guides-peer-reviewers-to-address-soc-2-risks/", date: "2026-05-14", access: full, locator: "Paragraph 3 (AICPA quote)"}
  last_reviewed: "2026-10-21"
  notes: "The PCR facts are in -17. Firm types per the releases: Withum and PKF O'Connor Davies 'Top 25', EisnerAmper 'Top 20' (CPA Practice Advisor says top 15 [EISNER-AUDITAGENT-2026]); Citrin Cooperman describes itself as serving private, middle-market businesses. DAS is built by the AICPA, CPA.com and Caseware. Ladder augment because Verity gives a first pass that the auditor accepts or overrides. No firm below the top 100 was found with a public deployment. Cross-links: assurance-planning-risk-assessment-20 (methodology-embedded platform for mid-tier firms), assurance-quality-management-05 and -16 (methodology in the tool; central programme updates). assurance-quality-management-16 now also covers regional firms standardising methodology across engagement types on one platform; this entry keeps the named mid-market adoptions and the PCR and EBP modules."

- id: assurance-private-company-02
  title: "Standardise workpaper layouts, functionality and the firm knowledge base before layering AI (Citrin Cooperman)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [document-production, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: "Caseware's senior vice president of AI, analytics and assurance told the Journal of Accountancy that audit variability made it hard for auditors to benefit from tools that need consistent execution [JOFA-AUDITAI-2026]. An AICPA small-firm column says firms that audit only occasionally find each engagement feels like starting over [JOFA-SMALLFIRM-2026]."
  solution: "Citrin Cooperman's audit innovation leader describes a project team just for developing the standardised workpaper, layout and functionality; the article says the effort has run more than a year with technologists, subject matter experts, managers and the quality and standards teams taking part, and that a standardised knowledge base and process makes it easier for AI to surface the right information and for automation to scale across varied engagements [JOFA-AUDITAI-2026]. The AICPA small-firm column gives similar advice: standardise templates, checklists and engagement files through the year [JOFA-SMALLFIRM-2026]."
  outcomes:
    - {lever: quality, description: "The article reports the effort's length, not results", figure: "more than a year", measures: "how long the standardisation effort 'has stretched', in the Journal of Accountancy's words; no result is reported", provenance: self-reported, source_ref: JOFA-AUDITAI-2026}
  prerequisites:
    - "A dedicated project team including technologists, subject matter experts, managers and the quality and standards teams [JOFA-AUDITAI-2026]"
    - "Access to client data; the article notes lack of access to client data as one of the top obstacles to implementing AI in a CPA.com survey [JOFA-AUDITAI-2026]"
  risks_and_guardrails:
    - "The article calls the work a 'huge' undertaking [JOFA-AUDITAI-2026]"
    - "A customised AI tool is only as good as the data it can reach [JOFA-AUDITAI-2026]"
  human_checkpoints:
    - "The firm's quality and standards teams help define the standardised workpaper [JOFA-AUDITAI-2026]"
  role_evolution: "At Citrin Cooperman the quality and standards teams take part in designing the standardised workpaper [JOFA-AUDITAI-2026]; the article does not describe how roles change after rollout."
  evidence_grade: B
  sources:
    - {ref: JOFA-AUDITAI-2026, title: "How AI is transforming the audit - and what it means for CPAs", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/how-ai-is-transforming-the-audit-and-what-it-means-for-cpas/", date: "2026-02-01", access: full, locator: "Section on how a firm starts implementing AI (Kanter quotes)"}
    - {ref: JOFA-SMALLFIRM-2026, title: "What small firm CPAs need to know (Small Firm Q&A, Stephanie Otero)", publisher: Journal of Accountancy, type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/what-small-firm-cpas-need-to-know/", date: "2026-08-01", access: full, locator: "First two Q&As (audit viability; peer review efficiency)"}
  last_reviewed: "2026-10-21"
  notes: "Firm type: Citrin Cooperman, a firm that describes itself as serving private, middle-market businesses [CASEWARE-CITRIN-2026, see -01]. Graded B: a named firm and a described real project, with no measurement. The article is dated February 2026 and the DAS adoption release July 2026; no source links the two. This is a content and methodology change that comes before tool choice."

- id: assurance-private-company-03
  title: "Test methodology platforms and AI agents on the firm's own engagements before committing: side-by-side tests, parallel runs and a firm-held answer key, re-run when the model changes"
  archetype: assurance
  module: private-company
  function: risk-compliance-legal
  work_types: [review-assurance, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: "Smaller firms depend on vendors' own statements of accuracy. The only accuracy figures found for tools used in mid-market audit files are vendor-run beta results [CASEWARE-LAUNCH-2026], and no source evaluates the methodology choice that an ENGAGE 2026 panel was built around [GRF-ENGAGE-2026]."
  solution: "In a vendor-run interview, Thomson Reuters executives say leading firms compare systems side by side on standardised use-case tests and run AI solutions in parallel on live engagements, with partners judging performance on the firm's own work [TR-STATE-2026]. Applied to an agent (for example a disclosure checklist, extraction or risk-suggestion agent), the firm scores output against engagements where the right answers are known, records misses by item type, sets review depth to match, and repeats the test when the vendor changes the model. Caseware reports 94% accuracy on golden dataset items captured from beta traces [CASEWARE-LAUNCH-2026]; one beta firm found the disclosure checklist agent surfaced checklist questions that had been answered incorrectly [CASEWARE-VERITY-2026]."
  outcomes:
    - {lever: quality, description: "Caseware's own accuracy figure for Verity", figure: "94%", measures: "accuracy on golden dataset items captured from beta traces; item count, numerator and denominator not given", provenance: vendor-published, source_ref: CASEWARE-LAUNCH-2026}
    - {lever: speed, description: "Caseware's beta time figure for indicative manual workflows", figure: "15-20 minutes to under two minutes (up to 85% per interaction)", measures: "time per interaction on indicative manual workflows in beta; workflows not specified", provenance: vendor-published, source_ref: CASEWARE-LAUNCH-2026}
    - {lever: risk, description: "No firm reports a result from its own evaluation", figure: "none published", measures: "neither the ENGAGE abstract nor the vendor interview reports a firm-run test result", provenance: vendor-published, source_ref: TR-STATE-2026}
  prerequisites:
    - "Partner and managing-partner time to test tools on the firm's own files, a set of standard test tasks, and a live engagement that can carry a parallel run [TR-STATE-2026]"
    - "Engagements or checklists with known answers, held by the firm and not supplied by the vendor"
    - "A trigger to re-test when the vendor changes the model, and vendor willingness to share traces and version histories"
  risks_and_guardrails:
    - "The interviewees sell audit software, so the advice to test directly is also a sales context [TR-STATE-2026]"
    - "The 94% and time figures are vendor beta results, not independently verified; an answer key built from the vendor's own traces tests what the vendor already saw [CASEWARE-LAUNCH-2026]"
    - "No firm has published its own miss rate for these agents"
  human_checkpoints:
    - "Partners decide whether evidence from their own testing is enough to scale adoption [TR-STATE-2026]"
    - "The firm's methodology lead signs off test results before an agent goes into engagement use"
  role_evolution: "Partners take on building their own trust in tool performance instead of relying on demonstrations [TR-STATE-2026]; beta partners describe reviewing and validating instead of searching [CASEWARE-VERITY-2026]."
  evidence_grade: C
  sources:
    - {ref: TR-STATE-2026, title: "The state of AI in audit in 2026: Interview with experts", publisher: Thomson Reuters Tax & Accounting, type: vendor, url: "https://tax.thomsonreuters.com/blog/state-of-ai-in-audit/", date: "2026-03-30", access: full, locator: "Section on evaluating AI solutions (side-by-side tests and parallel runs)"}
    - {ref: GRF-ENGAGE-2026, title: "2026 AICPA & CIMA Engage Conference (session list)", publisher: GRF CPAs & Advisors, type: conference, url: "https://www.grfcpa.com/?p=9081", date: "2025-11-17", access: full, locator: "Session abstract 'Methodology for Selecting a Methodology'"}
    - {ref: CASEWARE-LAUNCH-2026, title: "Caseware launches Caseware Verity to bring workflow-native AI agents directly into assurance engagements", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/caseware-launches-verity-to-bring-workflow-native-ai-agents-directly-into-assurance-engagements", date: "2026-05-20", access: full, locator: "Paragraph 4 (beta results)"}
    - {ref: CASEWARE-VERITY-2026, title: "CwX 2026: How agentic AI is transforming audit and assurance", publisher: Caseware, type: vendor, url: "https://www.caseware.com/resources/blog/cwx-2026-how-agentic-ai-is-transforming-audit-and-assurance", date: "2026-06-17", access: full, locator: "Section 'Disclosure Checklist Agent'"}
  last_reviewed: "2026-10-21"
  notes: "Two strands: firm-run evaluation before committing, and answer-key testing and re-testing. Maturity piloting because the only figures come from beta programmes. The GRF panel is a practitioner-led session at a regional firm's event; only the abstract was read. Large-firm version: assurance-quality-management-04 (evaluation sets and parallel running) and -01 (recertification triggers)."

- id: assurance-private-company-04
  title: "Proprietary firm platforms and agents that start with private-company audits, built alongside a bought audit file (Grant Thornton gtap; EisnerAI Audit Design Agent)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: "Firms with large private-company audit books want one data foundation and consistent workpapers across engagements instead of fragmented tools. EisnerAmper's national office head says removing the work of assembling and sorting data lets auditors do more meaningful work [EISNER-AUDITAGENT-2026]."
  solution: "Grant Thornton US announced gtap, a cloud platform that standardises how audit data is ingested, transformed and analysed, 'works with data from any ERP system', supports full-population analysis and automates workpapers, with agents to follow. It is introduced first to private-company audits, then public-company audits the following year, in a phased rollout [GT-GTAP-2026; CPAPA-GT-2026]. EisnerAmper announced on 9 March 2026 the EisnerAI Audit Design Agent, developed with Microsoft on Microsoft Foundry, as a research and insight partner that helps auditors synthesise information across systems [EISNER-AUDITAGENT-2026]; on 25 June 2026 it also announced DAS adoption across its assurance practice, so it is both building and buying [CASEWARE-EISNERAMPER-2026]."
  outcomes:
    - {lever: quality, description: "none published", figure: "none published", measures: "both firms describe intent; neither gives accuracy, time or review-note figures", provenance: self-reported, source_ref: GT-GTAP-2026}
  prerequisites:
    - "Firm-scale data and cloud investment; Grant Thornton Ireland developed gtap first and the US firm extended it [GT-GTAP-2026]"
    - "A separate audit file and methodology that a firm-built agent sits alongside (EisnerAmper: DAS) [CASEWARE-EISNERAMPER-2026]"
  risks_and_guardrails:
    - "Grant Thornton says professionals supervise every step [GT-GTAP-2026]; the EisnerAmper coverage describes the agent as a research and insight partner and gives no supervision design [EISNER-AUDITAGENT-2026]"
    - "The 'any ERP' claim does not say how QuickBooks-type data is handled; the release speaks only of ERP systems [GT-GTAP-2026]"
    - "Trade-press coverage of the EisnerAmper agent names no controls, accuracy checks or review design [EISNER-AUDITAGENT-2026]"
  human_checkpoints:
    - "Auditors guide the process and keep oversight of agents [GT-GTAP-2026]"
  role_evolution: "Grant Thornton says automating the transactional parts frees teams for skepticism, judgment and risk assessment [GT-GTAP-2026]."
  evidence_grade: C
  sources:
    - {ref: GT-GTAP-2026, title: "Grant Thornton launches gtap to transform audit delivery across U.S. practice", publisher: Grant Thornton US, type: firm, url: "https://www.grantthornton.com/insights/press-releases/2026/may/grant-thornton-launches-gtap-audit-transformation-us", date: "2026-05-07", access: full, locator: "Paragraphs 2-5 (any ERP; private company audits first; supervision)"}
    - {ref: CPAPA-GT-2026, title: "Grant Thornton U.S. launches in-house audit transformation platform", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/05/08/grant-thornton-u-s-launches-in-house-audit-transformation-platform/183107/", date: "2026-05-08", access: full, locator: "Paragraph 5 (phased rollout)"}
    - {ref: EISNER-AUDITAGENT-2026, title: "EisnerAmper Rolls Out In-House AI Audit Design Agent", publisher: CPA Practice Advisor, type: press, url: "https://www.cpapracticeadvisor.com/2026/03/20/eisneramper-rolls-out-in-house-ai-audit-design-agent/180020/", date: "2026-03-20", access: full, locator: "First three paragraphs (announcement date 9 Mar); Austin quote ('assembling and sorting data') in the full page HTML"}
    - {ref: CASEWARE-EISNERAMPER-2026, title: "EisnerAmper Leverages DAS Powered by Caseware to Unify Audit and Build an Agentic Future Across Its Multi-Vertical Practice", publisher: Caseware, type: vendor, url: "https://www.caseware.com/news/eisneramper-leverages-das-powered-by-caseware-to-unify-audit-and-build-an-agentic-future-across-its-multi-vertical-practice", date: "2026-06-25", access: full, locator: "Paragraphs on 1,100 professionals and on future AI tools"}
  last_reviewed: "2026-10-21"
  notes: "Grade C: announcements with no evidence of use or results. Firm types: Grant Thornton US is a national, private-equity-backed firm; EisnerAmper is a Top 15-20 firm. Included because private-company-first sequencing is the mid-market point; the platforms themselves are in assurance-substantive-testing-22 and assurance-planning-risk-assessment-11. The press does not explain how EisnerAmper's agent and DAS fit together."

- id: assurance-private-company-05
  title: "Firm-built and co-developed audit agents on a vendor platform, with preparer and reviewer agents and overnight background runs (FGMK on DataSnipper; PKF O'Connor Davies in Caseware's Agentic Pioneer Program)"
  archetype: assurance
  module: private-company
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: piloting
  problem: "Firms want agents tailored to their own procedures (cash testing, journal entry testing, statement checks) without sending client data to open tools and without building software."
  solution: "FGMK built a base of agents in DataSnipper Excel Agents (cash, journal entry and financial statement testing), then tested Alwin, a web-based agent platform that works across PDF, Word and Excel and keeps running in the background, so an evening job is ready for review the next morning. Preparer agents build workpapers; reviewer agents check consistency and roll-up of statements. FGMK's QC department runs statements through an agent alongside its own independent review [DATASNIPPER-FGMK-2026]. PKF O'Connor Davies joined Caseware's Agentic Pioneer Program to design and deploy its own agents with Caseware's agent-building tools [CASEWARE-PKF-2026; CASEWARE-PIONEER-2026]."
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "FGMK describes general-ledger extraction over hundreds of pages and overnight runs qualitatively; PKF has announced participation only", provenance: vendor-published, source_ref: DATASNIPPER-FGMK-2026}
  prerequisites:
    - "Vendor commitment that firm data does not train models, plus control over who can create and who can use agents [DATASNIPPER-FGMK-2026]"
    - "Governance for agents built by staff: a review and change-management process, least-privilege access and human approval for higher-risk actions [JOFA-CHECKLIST-2026]"
    - "Written procedures (skills) and testing before an Excel agent is shared; a Journal of Accountancy demonstration used a custom data-cleaning skill and a plan-approval step [JOFA-EXCELAGENT-2026]"
  risks_and_guardrails:
    - "Agents the firm builds carry the firm's responsibility. Caseware says agents built in its environment run with the same audit trail and methodology context as Verity [CASEWARE-PKF-2026]; vendor claim"
    - "Co-development arrangements with a tool provider should be screened for independence and ethics threats; see assurance-acceptance-independence-13"
  human_checkpoints:
    - "Reviewer sees the agent's steps beside the workbook and leaves cell-level notes; FGMK keeps its own independent review [DATASNIPPER-FGMK-2026]"
  role_evolution: "Firms need people who can specify and test agents. PKF's chief executive says the programme gives it a seat at the table in developing AI capabilities [CASEWARE-PKF-2026]. Aprio's assurance operations director says the bigger impact is for reviewers, because each cell traces to its source [DATASNIPPER-APRIO-2026]."
  evidence_grade: B
  sources:
