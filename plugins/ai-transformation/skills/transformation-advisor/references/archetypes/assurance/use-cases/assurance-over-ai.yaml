    pages), the same kind of evidence graded C in -18, and the UK market figures measure the whole AI assurance
    market, not this service; the Babl page presents worked examples and does not say Babl delivered each, and no
    named client engagement was found. Market potential conflict: GBP 6.53bn by 2035 (DSIT 2024) versus GBP 18.8bn
    (DSIT roadmap, 2025); reason not found. ICAEW reported the GBP 1.01bn as "revenues"; DSIT calls it GVA.
    OJEWALE-2024 has two version dates (2024-02-27 first version; 2025-02-27 v3).

- id: assurance-assurance-over-ai-21
  title: Mandated independent bias audits of automated employment decision tools (New York City Local Law 144)
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Employers using automated employment decision tools must obtain annual independent bias audits, but the law leaves
    "auditor" and "tool" loosely defined (GROVES-2024).
  solution: >-
    Since July 2023 New York City employers using automated employment decision tools have had to undergo annual bias
    audits by an independent auditor. An interview study of 16 experts and practitioners found that auditors, tool
    vendors and employers defined practice themselves, producing four distinct auditor roles, and concluded the law has
    not established an effective audit regime (GROVES-2024).
  outcomes:
    - lever: quality
      description: "Independent researchers judged the regime not effective at protecting applicants: key terms undefined, data access hard for auditors, disagreement over who is a legitimate auditor"
      figure: "16"
      measures: "experts and practitioners interviewed within the New York City Local Law 144 regime"
      provenance: independent
      source_ref: GROVES-2024
  prerequisites:
    - "Access to tool outputs and demographic data; data access is named as a barrier (GROVES-2024)"
  risks_and_guardrails:
    - "Undefined independence and scope let buyers and vendors narrow the audit (GROVES-2024)."
  human_checkpoints:
    - "Independent auditor signs the bias audit (GROVES-2024)"
  role_evolution: >-
    Four auditor roles emerged because there was no agreed definition of a legitimate auditor (GROVES-2024).
  evidence_grade: B
  sources:
    - {ref: GROVES-2024, title: "Auditing Work: Exploring the New York City algorithmic bias audit regime", publisher: "arXiv (Groves, Metcalf, Kennedy, Vecchione, Strait)", type: academic, url: "https://arxiv.org/abs/2402.08101", date: "2024-02-12", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
    A qualitative study with no audit outcome statistics and no named audit firms; included as the best independent
    evidence of how algorithmic audits work in a live mandatory regime. Date is the arXiv submission date. Only the
    abstract was read.

- id: assurance-assurance-over-ai-22
  title: EU AI Act conformity assessment and regulatory-compliance assurance for high-risk AI
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Providers of high-risk AI systems must show conformity with the Act, but harmonised standards and
    conformity-assessment capacity are not ready (DQS-OMNIBUS-2026; CSA-AIASSURE-2026). Assurance providers cite the Act
    as a driver of demand (KPMGUK-GOVAI-2026).
  solution: >-
    Under Article 43(1), providers of Annex III point 1 systems that apply harmonised standards may choose internal
    control (Annex VI) or assessment of the quality management system and technical documentation with a notified body
    (Annex VII); under Article 43(2), providers of points 2 to 8 follow the internal-control procedure
    (EU-AIACT-ART43-2024). The Commission asked CEN and CENELEC for standards in ten areas, and the first harmonised AI
    standard, prEN 18286 on quality management, entered public enquiry on 30 Oct 2025 (EC-AISTANDARDS-2025). The AI
    Omnibus (Regulation (EU) 2026/1744) moved Annex III obligations to 2 Dec 2027 and Annex I obligations to 2 Aug 2028
    (AG-OMNIBUS-2026; SIG-AIACT-2026; GIBSON-OMNIBUS-2026). Deloitte UK offers third-party challenge over compliance with
    the Act, including conformity assessment for high-risk systems, and over the AI aspects of wider digital regulation
    including its independent audit (DELOITTE-AIA-UK-2026). KPMG UK's framework incorporates relevant Act requirements
    (KPMGUK-GOVAI-2026), and Act-aligned risk-management engagements were a worked example in an ISACA chapter
    session (HUMANITIX-BABL-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: EU-AIACT-ART43-2024
  prerequisites:
    - "A determination of whether a system is high-risk and which conformity route applies (EU-AIACT-ART43-2024)"
    - "Published, cited harmonised standards for presumption of conformity (EC-AISTANDARDS-2025)"
    - "Designated notified bodies where that route applies (CSA-AIASSURE-2026)"
  risks_and_guardrails:
    - "Article 43(2) puts most Annex III categories on internal control, so mandatory third-party demand there is not guaranteed (EU-AIACT-ART43-2024, as interpreted here)."
    - "DQS reports CEN and CENELEC missed an autumn 2025 target and expect delivery by end of 2026 at the earliest (DQS-OMNIBUS-2026)."
    - "DQS counts 8 of 27 member states with fully designated competent authorities (Mar 2026); the CSA note cites a report that only three had designated both notifying and market-surveillance authorities; the figures measure different things (DQS-OMNIBUS-2026; CSA-AIASSURE-2026)."
    - "Applying harmonised standards is voluntary; providers may use other frameworks (EC-AISTANDARDS-2025)."
    - "An academic paper argues the Act gives no data access to researchers and civil society and calls for third-party audit and model access for high-risk systems (ARXIV-HARTMANN-2025)."
  human_checkpoints:
    - "Provider or notified body signs off conformity (EU-AIACT-ART43-2024)"
  role_evolution: >-
    Conformity-assessment bodies must be designated and independent of providers, and supply is tight
    (CSA-AIASSURE-2026).
  evidence_grade: C
  sources:
    - {ref: EU-AIACT-ART43-2024, title: "Article 43: Conformity Assessment, Regulation (EU) 2024/1689 (third-party reproduction of the Act's text)", publisher: "artificialintelligenceact.eu", type: regulator, url: "https://artificialintelligenceact.eu/article/43/", date: "2024-06-13", access: full, locator: "paragraphs 1-2; date is the Regulation's date; the page's 'comes into force 2 August 2026' note pre-dates the Omnibus"}
