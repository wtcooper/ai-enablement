- id: assurance-assurance-over-ai-19
  title: Certify AI agents through automated adversarial testing, an authorised auditor and insurance backing (AIUC-1)
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, software-systems]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Enterprise security, legal and procurement teams run bespoke risk assessments of AI agents, liability is uncertain,
    and agent behaviour changes after a point-in-time audit (SCHELLMAN-AIUC1-2026). Consultancy.uk, summarising the FT,
    notes some insurers offer policies covering losses from malfunctioning AI services (CONSULTANCY-BIG4-2025).
  solution: >-
    AIUC-1 is a security, safety and reliability standard for AI agents covering six principles (security, safety,
    reliability, accountability, data and privacy, societal impact) and operationalising ISO 42001, NIST AI RMF, MITRE
    ATLAS and OWASP Top 10 for LLMs. The Artificial Intelligence Underwriting Company (AIUC) runs technical evaluations
    with thousands of adversarial scenarios derived from real incidents and issues the certificate; Schellman, named
    first authorised auditor on 3 Feb 2026, collects audit evidence and reports (SCHELLMAN-AIUC1-2026). Agent behaviour
    is re-tested at least quarterly, with a full audit each year (FIELDGUIDE-AIUC1-2026; SIERRA-AIUC1-2026). KPMG LLP's
    aIQ Capture platform was certified on 27 Aug 2026 after more than 900 technical tests (AIUC-KPMG-2026). AIUC lists
    Cursor, Fin, ElevenLabs, Harvey, UiPath and KPMG as certified (AIUC1-SITE-2026) and its release names Lovable
    (AIUC-SERIES-A-2026); Fieldguide (6 May 2026) and Sierra (17 Sep 2026) say they hold it (FIELDGUIDE-AIUC1-2026;
    SIERRA-AIUC1-2026). CSA let STAR Registry listings carry an AIUC-1 trustmark from 30 Jun 2026
    (CSA-STAR-AIUC1-2026). AIUC describes its model as "confidence infrastructure" combining certification, auditing and
    insurance (SCHELLMAN-AIUC1-2026); the first AIUC-1-backed insurance policy (ElevenLabs) was reported at $50 million
    of cover (FORKAST-AIUC-2026).
  outcomes:
    - lever: risk
      description: "Technical tests run against KPMG's aIQ Capture before certification"
      figure: "900+"
      measures: "technical tests of the aIQ Capture agentic platform covering hallucinations, high-risk domain interactions, content safety, prompt injection and other scenarios (joint KPMG/AIUC release)"
      provenance: vendor-published
      source_ref: AIUC-KPMG-2026
    - lever: risk
      description: "Coverage limit on the first AIUC-1-backed insurance policy"
      figure: "$50 million"
      measures: "coverage on the ElevenLabs policy, for risks such as hallucination-driven loss, data leakage and faulty tool actions, as reported by Forkast"
      provenance: vendor-published
      source_ref: FORKAST-AIUC-2026
    - lever: quality
      description: "UiPath's head of GRC says testing produced new guardrails the company can show customers (qualitative)"
      figure: "none published"
      measures: "qualitative customer quote on the AIUC-1 website"
      provenance: vendor-published
      source_ref: AIUC1-SITE-2026
  prerequisites:
    - "An agentic product to test, with logging and guardrails in place (SCHELLMAN-AIUC1-2026)"
    - "Willingness to be re-tested quarterly to keep the certificate (FORKAST-AIUC-2026)"
    - "Controls the auditor can review across technical, legal, operational and governance areas (SIERRA-AIUC1-2026)"
  risks_and_guardrails:
    - "Test counts measure activity, not residual risk; Forkast notes it is unknown how the insurance would perform in a systemic failure (FORKAST-AIUC-2026)."
    - "Schellman's release says 'authorized' auditor while the headline and the CSA note say 'accredited'; check which before relying on a badge (SCHELLMAN-AIUC1-2026; CSA-AIASSURE-2026)."
    - "The CSA note says buyers should ask for the specific policy terms and limits behind insurance-backed claims (CSA-AIASSURE-2026)."
    - "Every account read is a certifier's or certified company's own announcement; no policy terms or loss data were found (FORKAST-AIUC-2026; SCHELLMAN-AIUC1-2026)."
  human_checkpoints:
    - "Authorised auditor reviews guardrail implementation and red-team results; the AIUC-1 website describes a 50+ page independent audit report (AIUC1-SITE-2026)"
    - "Annual full audit and auditor review of governance controls (SIERRA-AIUC1-2026)"
  role_evolution: >-
    A CPA-firm auditor combines audit evidence work with another party's technical testing (SCHELLMAN-AIUC1-2026).
    Schellman's AI practice leader says AIUC-1 complements frameworks such as ISO 42001 with agent-specific technical
    controls and that leading AI companies adopt both (SCHELLMAN-AIUC1-2026). Big Four firms appear first as certified
    organisations; AIUC's co-founder says this can open the door to a broader assurance relationship (AIUC-KPMG-2026).
  evidence_grade: B
  sources:
    - {ref: SCHELLMAN-AIUC1-2026, title: "Schellman Becomes the First Accredited Auditor for AIUC-1, the Security Standard for AI Agents", publisher: "Schellman", type: firm, url: "https://www.schellman.com/blog/news/schellman-becomes-the-first-accredited-auditor-for-aiuc-1", date: "2026-02-03", access: full, locator: "release body, 'AIUC-1 Certification Overview' and 'About AIUC' (page updated 2026-09-29)"}
    - {ref: AIUC-KPMG-2026, title: "KPMG LLP Becomes First Big Four Firm with AIUC-1 Certified AI Capability", publisher: "AIUC", type: vendor, url: "https://aiuc.com/updates/kpmg-llp-becomes-first-big-four-firm-with-aiuc-1-certified-ai-capability", date: "2026-08-27", access: full, locator: "paragraphs 2-5"}
    - {ref: AIUC1-SITE-2026, title: "AIUC-1 Standard", publisher: "AIUC", type: vendor, url: "https://www.aiuc-1.com/", date: "2026-10", access: full, locator: "'Certified Agents' section; page undated, retrieved 2026-10-16; certified agents and customer quotes"}
    - {ref: AIUC-SERIES-A-2026, title: "Series A to build the confidence infrastructure for frontier AI", publisher: "AIUC", type: vendor, url: "https://aiuc.com/updates/series-a-announcement", date: "2026-09-15", access: full, locator: "post body"}
    - {ref: FORKAST-AIUC-2026, title: "AIUC Raises $40M to Build the Certification and Insurance Layer That Makes Agent Governance Auditable", publisher: "Forkast", type: press, url: "https://forkast.news/aiuc-raises-40m-to-build-the-certification-and-insurance-layer-that-makes-agent-governance-auditable/", date: "2026-09-16", access: full, locator: "paragraphs 4-6 and closing paragraph"}
    - {ref: FIELDGUIDE-AIUC1-2026, title: "Fieldguide becomes first AI platform for audit and advisory to achieve AIUC-1 certification", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/fieldguide-first-aiuc-1-certification", date: "2026-05-06", access: full, locator: "paragraphs 1-4"}
    - {ref: SIERRA-AIUC1-2026, title: "Sierra earns AIUC-1 certification after independent audit", publisher: "Unite.AI", type: press, url: "https://www.unite.ai/es/sierra-earns-aiuc-1-certification-after-independent-audit/", date: "2026-09-17", access: full, locator: "paragraphs 1-2 and 'Alcance de las pruebas'"}
    - {ref: CSA-STAR-AIUC1-2026, title: "Cloud Security Alliance Extends AI Assurance Leadership Into Agentic AI With Addition of AIUC-1 Certification to STAR Registry", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/press-releases/2026/06/30/csa-extends-leadership-into-agentic-ai-with-addition-of-aiuc-1-certification-to-star-registry", date: "2026-06-30", access: full, locator: "release body"}
    - {ref: CSA-AIASSURE-2026, title: "Who Assures the Assurers? Third-Party AI Assessment Standards (research note)", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-third-party-ai-assurance-standards-2026092/", date: "2026-09-27", access: full, locator: "'Background' and 'Security Analysis'"}
    - {ref: CONSULTANCY-BIG4-2025, title: "Big Four weighing up new AI audit offerings", publisher: "Consultancy.uk", type: press, url: "https://www.consultancy.uk/news/40424/big-four-weighing-up-new-ai-audit-offerings", date: "2025-06-10", access: full, locator: "paragraph 4"}
  last_reviewed: "2026-10-17"
  notes: >-
    Not an audit-firm product in origin; included because Schellman and KPMG are in it and it is a testing-led,
    insured alternative to management-system certification. Ladder augment: automated adversarial tests give a first
    pass under auditor oversight; the AI agent remains the subject. Data conflicts: consortium 60+ (Schellman, Feb
    2026) versus 250+ (AIUC, Aug-Sep 2026); AIUC raised a $40M Series A (15 Sep 2026) but its homepage cites $55M;
    Forkast reports 5,000 adversarial tests across the standard. UiPath's March 2026 certification release and a 15
    Jul 2026 revision of the standard were seen in search only.

- id: assurance-assurance-over-ai-20
  title: System-level technical assurance of a specific AI system (performance, robustness, bias and LLM testing)
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment, software-systems]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Governance certification does not tell a buyer whether an individual AI system performs as claimed
    (HUMANITIX-BABL-2026). Much existing AI assurance in the UK is supplied by AI developers themselves, which raises
    independence questions (CONSULTANCY-BIG4-2025).
  solution: >-
    An engagement borrows the practitioner, responsible party and intended-user model from financial audit, including
    ISAE 3000-style reasonable and limited assurance: select a framework and criteria, then gather evidence by
    inspection, inquiry, reperformance and analytical testing; a 16 Jul 2026 ISACA Melbourne session by Babl AI's CEO
    used NYC Local Law 144 bias audits, LLM testing against the NIST AI RMF Generative AI Profile and EU AI Act
    risk-management engagements as worked examples (HUMANITIX-BABL-2026). BSI offers an Algorithm Auditing and Dataset
    Testing service that verifies an AI system performs as intended (DSIT-ROADMAP-2025). Deloitte UK lists third-party
    challenge over the technical build and performance of AI use cases (data, architecture, robustness, precision and
    accuracy, explainability, transparency, bias and fairness, monitoring) and operational controls over AI-enabled
    applications (DELOITTE-AIA-UK-2026). KPMG Nederland added AI Assurance in Sep 2025 for independent checks of AI
    systems, algorithms and data analytics, integrating the AI Act, ISO 42001 and the NIST AI RMF, with technical
    checks such as robustness tests (KPMGNL-AI-2025). Academics propose coordinating three audit layers: governance
    audits of providers, model audits before release, and application audits (MOKANDER-LLM-2023;
    MOKANDER-BLUEPRINT-2024).
  outcomes:
    - lever: growth
      description: "Size of the UK AI assurance market"
      figure: "about GBP 1.01 billion GVA (2024); over 524 companies"
      measures: "approximate gross value added of the UK AI assurance market in 2024 and number of companies in it, per the DSIT roadmap's ministerial foreword"
      provenance: independent
      source_ref: DSIT-ROADMAP-2025
    - lever: growth
      description: "Specialised UK AI assurance suppliers and employment"
      figure: "84 specialised firms (17 in HMG's 2023 AI Sector Study); 12,572 employees"
      measures: "firms specialising in AI assurance among 524 suppliers, versus 17 in the 2023 AI Sector Study, and estimated employees, per DSIT's Nov 2024 report"
      provenance: independent
      source_ref: DSIT-ASSURANCE-2024
    - lever: quality
      description: "Only some AI audit studies translate into the desired accountability outcomes"
      figure: "a subset (no count in the abstract)"
      measures: "audit studies by regulators, law firms, civil society, journalism, academia and consultancies that translate to accountability outcomes, per the authors' assessment"
      provenance: independent
      source_ref: BIRHANE-2024
    - lever: quality
      description: "AI audit tools often fall short of supporting accountability"
      figure: "435 tools; 35 practitioners"
      measures: "AI audit tools in the authors' landscape analysis, compared with needs voiced in interviews with 35 AI audit practitioners"
      provenance: independent
      source_ref: OJEWALE-2024
  prerequisites:
    - "Access to the system, data and documentation; AI developers rarely grant access to check reliability, security or bias (JOFA-EVAL)"
    - "Criteria: scope and criteria are negotiated because no comprehensive framework exists (JOFA-EVAL)"
  risks_and_guardrails:
    - "DSIT cites a World Privacy Forum report suggesting up to 38% of AI governance tools may use metrics that could result in harm (DSIT-ROADMAP-2025)."
    - "A Caseware executive says misusing the term 'assurance' can be a problem in some jurisdictions, so her firm issues 'evaluation reports' (JOFA-EVAL)."
    - "The authors of the three-layer proposal say audits work only when structured and coordinated across all three levels, and that it is important to remain realistic about what auditing can achieve (MOKANDER-LLM-2023)."
  human_checkpoints:
    - "Practitioner scoping, criteria selection and opinion (JOFA-EVAL)"
  role_evolution: >-
    Deloitte UK refers to its Algorithm and AI Assurance team (DELOITTE-42001-2025), and a Deloitte partner leads a
    Global Algorithm and AI Assurance team and chairs an ICAEW AI Assurance Working Group, per the conference programme
    (ICAEW-AIAC-2026). AI audits are done by regulators, law firms, civil society, journalism, academia and
    consultancies (BIRHANE-2024).
  evidence_grade: C
  sources:
    - {ref: HUMANITIX-BABL-2026, title: "AI Assurance in Practice: providing trust beyond AI governance certifications", publisher: "ISACA Melbourne Chapter", type: conference, url: "https://events.humanitix.com/july-2026-emerging-technologies-working-group", date: "2026-07-16", access: full, locator: "event description"}
    - {ref: DSIT-ROADMAP-2025, title: "Trusted third-party AI assurance roadmap", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/trusted-third-party-ai-assurance-roadmap/trusted-third-party-ai-assurance-roadmap", date: "2025-09-03", access: full, locator: "ministerial foreword; sections on process certification (BSI) and quality of tools, footnote 1"}
    - {ref: DSIT-ASSURANCE-2024, title: "Assuring a responsible future for AI", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/assuring-a-responsible-future-for-ai/assuring-a-responsible-future-for-ai", date: "2024-11-06", access: full, locator: "summary paragraphs"}
    - {ref: DELOITTE-AIA-UK-2026, title: "AI Assurance for Responsible and Scalable AI Adoption", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/uk/en/services/audit-assurance/services/ai-assurance.html", date: "2026-07-02", access: full, locator: "pillar on technical build and performance; date from page JSON-LD"}
    - {ref: DELOITTE-42001-2025, title: "Navigating AI Assurance: Spotlight on ISO/IEC 42001 standard", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/uk/en/services/audit/blogs/navigating-ai-assurance-spotlight-on-iso-iec.html", date: "2025-10-07", access: full, locator: "reference to the Algorithm and AI Assurance team"}
    - {ref: KPMGNL-AI-2025, title: "KPMG Nederland voegt AI Assurance toe aan haar Responsible AI-aanbod (press release, Dutch)", publisher: "KPMG Nederland", type: firm, url: "https://kpmg.com/nl/nl/home/media/press-releases/2025/09/kpmg-start-met-onafhankelijke-controles-van-ai-systemen.html", date: "2025-09-23", access: full, locator: "sections on AI Assurance and components (event date shown in text)"}
