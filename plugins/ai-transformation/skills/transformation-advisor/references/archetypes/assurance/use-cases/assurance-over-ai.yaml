- id: assurance-assurance-over-ai-23
  title: Buyer-side verification of AI assurance evidence through certificate registers and trust-mark registries (CSA STAR for AI)
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, research-synthesis]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Procurement teams receive certificates and reports whose meaning depends on who issued them and against what
    criteria (CASRAI-42006-2026). SOC 2 is described as the default trust signal enterprise buyers demand from AI
    vendors, yet without AI-specific Trust Services Criteria two clean reports can cover different control sets
    (CSA-SOC2).
  solution: >-
    A five-minute register check (who accredited the certifier, and is the scope right) is recommended for ISO 42001
    certificates (CASRAI-42006-2026). KPMG UK says AI assurance is increasingly requested and assessed by procurement
    and supplier-risk teams (KPMGUK-GOVAI-2026); techUK says investors, insurers and procurement teams are increasingly
    asking for assurance evidence (TECHUK-ROADMAP-2026). Per the CSA note, STAR for AI Level 1 is a self-assessment
    against the AI-CAIQ, enhanced once it passes an automated scoring system; Level 2 (Nov 2025) adds an accredited
    third-party ISO/IEC 42001 certificate (CSA-AIASSURE-2026; CSA-STARAI-2025). AIUC-1 was added to the STAR Registry on
    30 Jun 2026 (CSA-STAR-AIUC1-2026). Coalfire describes the underlying AI Controls Matrix as 243 control objectives
    across 18 domains (COALFIRE-STAR-2025).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: CASRAI-42006-2026
  prerequisites:
    - "Accreditation registers searchable by certificate or body (CASRAI-42006-2026)"
    - "For STAR for AI Level 2, a completed AI-CAIQ and an accredited ISO/IEC 42001 certificate (CSA-AIASSURE-2026)"
  risks_and_guardrails:
    - "CASRAI notes that the IAF ceased operations on 1 Jan 2026 and was replaced by Global Accreditation Cooperation, so a document citing the IAF multilateral arrangement may be out of date; the recognition still flows from the accreditation body (CASRAI-42006-2026)."
    - "CSA runs the STAR scheme and publishes related frameworks, so its notes are not neutral (CSA-AIASSURE-2026; CSA-SOC2)."
  human_checkpoints:
    - "Procurement or risk reviewer confirms the scope covers the AI system being bought (CASRAI-42006-2026)"
    - "Third-party certification body at STAR for AI Level 2 (CSA-AIASSURE-2026)"
  role_evolution: >-
    The sources describe a new due-diligence step for procurement and third-party risk teams rather than a role change
    (KPMGUK-GOVAI-2026; CASRAI-42006-2026).
  evidence_grade: C
  sources:
    - {ref: CASRAI-42006-2026, title: "ISO/IEC 42006 explained: who is allowed to certify ISO 42001", publisher: "CASRAI", type: community, url: "https://casrai.org/guides/iso-42006-explained-who-can-certify-iso-42001", date: "2026-09-25", access: full, locator: "section 'How to check an ISO 42001 certificate'"}
    - {ref: CSA-SOC2, title: "The SOC 2 AI gap: auditors improvise where AICPA has not acted", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-soc2-ai-controls-gap-20260830-csa-styled/", date: "2026-08-30", access: full, locator: "Key Takeaways"}
    - {ref: KPMGUK-GOVAI-2026, title: "Independent confidence in how you govern AI (AI Governance Assurance)", publisher: "KPMG UK", type: firm, url: "https://kpmg.com/uk/en/insights/audit/independent-confidence-in-how-you-govern-ai.html", date: "2026-09-22", access: full, locator: "section 'Benefits', 'Differentiate in the market'"}
    - {ref: TECHUK-ROADMAP-2026, title: "One year on: the Trusted Third-Party AI Assurance Roadmap (summit page)", publisher: "techUK", type: conference, url: "https://www.techuk.org/events/one-year-on-the-trusted-third-party-ai-assurance-roadmap", date: "2026-09-28", access: full, locator: "'Why this matters now'"}
    - {ref: CSA-AIASSURE-2026, title: "Who Assures the Assurers? Third-Party AI Assessment Standards (research note)", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-third-party-ai-assurance-standards-2026092/", date: "2026-09-27", access: full, locator: "paragraphs 3-5 and reference list"}
    - {ref: CSA-STARAI-2025, title: "Cloud Security Alliance launches STAR for AI", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/press-releases/2025/10/23/cloud-security-alliance-launches-star-for-ai-establishing-the-global-framework-for-responsible-and-auditable-artificial-intelligence", date: "2025-10-23", access: full, locator: "paragraphs on Level 1 and Level 2"}
    - {ref: CSA-STAR-AIUC1-2026, title: "Cloud Security Alliance Extends AI Assurance Leadership Into Agentic AI With Addition of AIUC-1 Certification to STAR Registry", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/press-releases/2026/06/30/csa-extends-leadership-into-agentic-ai-with-addition-of-aiuc-1-certification-to-star-registry", date: "2026-06-30", access: full, locator: "release body"}
    - {ref: COALFIRE-STAR-2025, title: "Enhancing Trust in AI: An Overview of AI Certification with the Cloud Security Alliance (CSA)", publisher: "Coalfire", type: vendor, url: "https://coalfire.com/the-coalfire-blog/enhancing-trust-in-ai-an-overview-of-ai-certification-with-the-cloud-security-alliance-csa", date: "2025-08-29", access: full, locator: "section 'Introducing CSA STAR for AI'"}
  last_reviewed: "2026-10-17"
  notes: >-
    The registry is live (Anthropic, Sierra and Zendesk posted ISO 42001 certificates in it, per CSA-STARAI-2025),
    but no buyer's use of it is described, so maturity is emerging. Whether the automated STAR scoring uses AI is
    not stated, so ladder stays assist. The techUK text is an event description written beforehand.

- id: assurance-assurance-over-ai-24
  title: Professionalise AI assurers through credentials, competence frameworks, a code of ethics and agreed information-access rules
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [expert-judgment, coordination-scheduling]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    The UK government says it is difficult to judge the quality of existing AI assurance certifications and that none
    are issued by UKAS-accredited organisations, and that assurance providers often struggle to obtain the information
    they need (from white-box access down to minimal documentation) while firms worry about exposing confidential
    training data (DSIT-ROADMAP-2025). techUK says the sector lacks an agreed competency framework, clear career
    pathways and a professional body (TECHUK-ROADMAP-2026). An ICAEW article (Mar 2025) quotes a practitioner who asks
    what assurers are being measured against (ICAEW-AIASSURE-2025).
  solution: >-
    DSIT's Sep 2025 roadmap set four immediate actions: a consortium to professionalise the market, a skills and
    competencies framework, a map of information-access requirements and an AI Assurance Innovation Fund; it suggests AI
    auditing could be a useful starting point for professional certification, judged an immediate regulated industry
    body and professional standard premature, found generalisable process-certification requirements hard to develop,
    and saw accredited management-system certification as the most feasible near-term route, noting UKAS was piloting
    accreditation of ISO/IEC 42001 certification bodies (DSIT-ROADMAP-2025). At the one-year point techUK says the consortium (chaired by BCS) is working on a
    voluntary code of ethics, a skills framework and the information-access map, and that a Centre for AI Measurement
    led by NPL has launched (TECHUK-ROADMAP-2026). ISACA offers an Advanced in AI Audit (AAIA) certification for CISA
    holders or holders of another qualifying designation with an IT audit or advisory focus (including CIA, CPA, ACCA,
    ICAEW ACA/FCA), with domains in AI governance and risk, AI operations, and AI auditing tools and techniques
    (ISACA-AAIA-2026). ICAEW's AI Assurance Conference included a session on what an AI assurance profession could look
    like (ICAEW-AIAC-2026).
  outcomes:
    - lever: quality
      description: "Consortium workstreams reported under way at the one-year point"
      figure: "three workstreams (code of ethics, skills framework, information-access map)"
      measures: "work items techUK's event description says are under way; no deliverable seen"
      provenance: self-reported
      source_ref: TECHUK-ROADMAP-2026
  prerequisites:
    - "A consortium chaired by BCS and supported by DSIT, with techUK leading its industry advisory group (TECHUK-ROADMAP-2026)"
    - "A qualifying designation for the AAIA credential (ISACA-AAIA-2026)"
  risks_and_guardrails:
    - "ICAEW reports the government judged it premature to put a regulated body and professional standard in place (ICAEW-ROADMAP-2025)."
    - "A commentator notes the roadmap has no binding audit mandate, thresholds or standard report template; low-authority opinion (SUBSTACK-JAIN-2025)."
    - "DSIT says firms using assurance may lack practices to share information safely (DSIT-ROADMAP-2025)."
  human_checkpoints:
    - "Exam and experience requirements for the credential (ISACA-AAIA-2026)"
    - "Accreditation or registration decision by a recognised authority, if introduced (ICAEW-ROADMAP-2025)"
  role_evolution: >-
    The roadmap treats AI auditing as one specialism within a wider assurance profession, with pathways from internal
    audit, cybersecurity, data science and privacy (DSIT-ROADMAP-2025). IT auditors, internal auditors and accountants
    can add the AAIA credential (ISACA-AAIA-2026).
  evidence_grade: B
  sources:
    - {ref: DSIT-ROADMAP-2025, title: "Trusted third-party AI assurance roadmap", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/trusted-third-party-ai-assurance-roadmap/trusted-third-party-ai-assurance-roadmap", date: "2025-09-03", access: full, locator: "sections on professionalisation, process certification, accreditation and information access"}
    - {ref: TECHUK-ROADMAP-2026, title: "One year on: the Trusted Third-Party AI Assurance Roadmap (summit page)", publisher: "techUK", type: conference, url: "https://www.techuk.org/events/one-year-on-the-trusted-third-party-ai-assurance-roadmap", date: "2026-09-28", access: full, locator: "first paragraph, consortium progress and 'Why this matters now'"}
    - {ref: ICAEW-ROADMAP-2025, title: "Trusted AI assurance roadmap outlines three quality assurance models", publisher: "ICAEW", type: professional-body, url: "https://www.icaew.com/insights/viewpoints-on-the-news/2025/sep-2025/trusted-ai-assurance-roadmap-outlines-three-quality-assurance-models", date: "2025-09-16", access: full, locator: "sections 'Professionalisation' and 'Process certification'"}
    - {ref: ICAEW-AIASSURE-2025, title: "Where are we now with AI assurance?", publisher: "ICAEW Insights", type: professional-body, url: "https://icaew.com/insights/viewpoints-on-the-news/2025/mar-2025/where-are-we-now-with-ai-assurance", date: "2025-03-04", access: full, locator: "section 'Fundamental start line'"}
    - {ref: ISACA-AAIA-2026, title: "AAIA Certification: ISACA Advanced in AI Audit", publisher: "ISACA", type: professional-body, url: "https://www.isaca.org/credentialing/aaia", date: "2026", access: full, locator: "eligibility section; domains from the linked exam content outline page (isaca.org/credentialing/aaia/aaia-exam-content-outline); pages undated, retrieved 2026-10-17"}
    - {ref: ICAEW-AIAC-2026, title: "AI Assurance Conference 2026 (programme and speakers)", publisher: "ICAEW", type: conference, url: "https://www.icaew.com/learning-and-development/events/ai-assurance-conference", date: "2026-07-06", access: full, locator: "'Explore professionalisation'"}
    - {ref: SUBSTACK-JAIN-2025, title: "Auditing AI without illusions", publisher: "Soumya Jain (Substack)", type: community, url: "https://wildandempty.substack.com/p/auditing-ai-without-illusions", date: "2025-09-13", access: full, locator: "list of what the roadmap lacks"}
  last_reviewed: "2026-10-17"
  notes: >-
    UK-specific apart from ISACA. Grade B: named programme, bodies and credential, work in progress, no measured
    results; no count of credential holders. DSIT gives the innovation fund as GBP 11 million. The ICAEW Insights
    article is dated 4 Mar 2025.

# ---- Added 2026-10-21 (mid-market): agent evaluations handed to the external auditor, developer-deployer
# scoping, and an idea for assuring AI-generated analysis ----

- id: assurance-assurance-over-ai-25
  title: "A client's external auditors receive a third-party agent-evaluation attestation as input to a SOX audit, with assurance scaled by agent risk tier (MSCI)"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    When an AI agent makes decisions that touch SOX systems, auditors ask whether the agent does what its policy says.
    MSCI's CISO says governance documents, ISO 42001 work and an existing SOC 2 did not answer that (his statement as
    published by AIUC) (AIUC-MSCI-2026).
  solution: >-
    MSCI's SecOps Agent reviews and approves privileged-access requests. AIUC's red team ran about 1,400 tests against
    it, including testing across 112 privileged roles. A signed evaluation attestation and detailed report went to
    MSCI's external auditors as input to its 2026 SOX audit. MSCI and AIUC also built a risk-tiering framework:
    top-tier agents (customer-facing, or touching regulatory, HR or client data) are planned to be certified against
    AIUC-1 with an independent auditor; lower tiers will apply a defined subset of requirements at build time
    (AIUC-MSCI-2026).
  outcomes:
    - {lever: risk, description: "The agent passed with no major or significant vulnerabilities; remaining low-severity cases were timeouts, upstream platform controls, or the agent being stricter than required", figure: "~1,400 tests; 112 privileged roles", measures: "tests run by AIUC's red team across benign, social-engineering and adversarial risks against one SecOps agent, and privileged roles covered", provenance: vendor-published, source_ref: AIUC-MSCI-2026}
  prerequisites:
    - "Agent scoped with the company's engineers and grading criteria agreed before scaling the tests (AIUC-MSCI-2026)"
    - "A risk-tiering framework mapping requirements to each tier (AIUC-MSCI-2026)"
  risks_and_guardrails:
    - "The tests were run by AIUC's own red team and published by AIUC, not by MSCI or its auditors; whether the external auditors relied on the report is not stated (AIUC-MSCI-2026)"
    - "Quarterly re-testing is required to keep AIUC-1 certification current (AIUC-Q3-2026)"
  human_checkpoints:
    - "External auditors decide how far an evaluation report supports their SOX conclusions (not described in the source)"
  role_evolution: >-
    CISO and security-governance staff run a tiered assurance programme for agents (AIUC-MSCI-2026).
  evidence_grade: B
  sources:
    - {ref: AIUC-MSCI-2026, title: "How MSCI secures its highest-risk AI agents with AIUC-1 (case study)", publisher: "Artificial Intelligence Underwriting Company (AIUC)", type: vendor, url: "https://www.aiuc-1.com/research/how-msci-secures-its-highest-risk-ai-agents-with-aiuc-1", date: "2026-09-24", access: full, locator: "sections 'Solution' and 'A framework for the next thousand agents'"}
    - {ref: AIUC-Q3-2026, title: "Q3-2026 update: AIUC-1 for coding agents, and technical auditor guidance", publisher: "AIUC", type: vendor, url: "https://www.aiuc-1.com/research/2026-q3-standard-update", date: "2026-07-14", access: full, locator: "section 2 'Re-certification'"}
  last_reviewed: "2026-10-21"
  notes: >-
    Grade B, not A: the figures are the evaluator's, published in a vendor case study, with no independent
    verification and no statement from MSCI's auditors. Firm kind: a larger public company (roughly 6,000 employees),
    included because it shows what a mid-market client's external auditor will increasingly be handed. Extends -03,
    -05 and -07, which hold the auditor's side (extend ITGCs, use management monitoring evidence, vendor AI evidence)
    as ideas; the security archetype also cites this case study.

- id: assurance-assurance-over-ai-26
  title: "Scope an AI-agent assurance engagement with a developer-versus-deployer responsibility matrix (AIUC-1 guidance)"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Agents are often built on a configurable platform (examples named: Cursor, Sierra, ElevenLabs) and run by a
    different organisation on its own data. Each side can assume the other covers a control, leaving gaps, and an
    assurer must decide what the client (the deployer) can evidence (AIUC-Q4-2026).
  solution: >-
    AIUC's 15 Oct 2026 release publishes guidance and a template matrix, drafted by a working group of consortium
    members, on who typically meets each control. Across the 78 core controls in the Q4 2026 standard, where a
    developer-deployer relationship exists, AIUC says typically 33 are met by the developer, 40 by the deployer and 5
    by the independent evaluator (the technical testing). The split depends on the platform, and the
    responsibilities are described as not legally binding (AIUC-Q4-2026). An assurer would use it to set the
    engagement's scope and the evidence the deployer must provide. For AI bought from a third party, the AICPA
    practice aid, as reported, points the financial-statement auditor to a SOC report or other attestation and
    management representations (AT-AICPAPA-2026; see -07).
  outcomes:
    - {lever: quality, description: "Scoping aid; no use reported", figure: "33 developer, 40 deployer, 5 independent evaluator", measures: "of the 78 core controls in the 2026 Q4 AIUC-1 standard, the controls AIUC says are typically met by each party where a developer and deployer exist", provenance: vendor-published, source_ref: AIUC-Q4-2026}
  prerequisites:
    - "Knowing which platform the client's agents run on and what that platform provides"
  risks_and_guardrails:
    - "Guidance is not legally binding; the exact split depends on the platform (AIUC-Q4-2026)"
    - "Authored by AIUC and its consortium, not by the AICPA or an assurance regulator (AIUC-Q4-2026)"
  human_checkpoints:
    - "Assurer and client agree the matrix for the specific platform"
  role_evolution: "Not described in the source."
  evidence_grade: C
  sources:
    - {ref: AIUC-Q4-2026, title: "Q4-2026 release: Open-weight model controls and stronger third-party testing", publisher: "AIUC", type: vendor, url: "https://www.aiuc-1.com/research/2026-q4-standard-update", date: "2026-10-15", access: full, locator: "section 'New Guidance for Agent Developers vs. Deployers'"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "service-organisation paragraph"}
  last_reviewed: "2026-10-21"
  notes: >-
    For a client that deploys agents on a third-party platform rather than building them, the deployer column is the
    part the assurer would test. No firm kind is attached: the guidance is the standard owner's, with no reported
    use by an assurer. The same Q4 release consolidates third-party testing into one requirement per principle.

- id: assurance-assurance-over-ai-27
  title: "Idea: CPAs build an audit package that lets reviewers verify AI-generated analysis quickly (math example, offered as a model for business outputs)"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: draft-review-loop
  ladder: delegate
  change_scope: model
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    AI agents generate analysis far faster than people can check it; the example comes from mathematics, where a CPA
    says peer review takes about a year and that mathematicians need more scalable ways to verify AI-generated work
    (JOFA-MATHEX-2026).
  solution: >-
    Richie Sater, a CPA and software developer, built AI agents that produced an answer to a 1986 open problem over
    about three weeks, then sent mathematician Viktor Monakhov an "audit package" of supporting materials with the
    answer. He says reviewers otherwise spend about two weeks on each claimed answer, that his package let reviewers look
    quickly, and that it was endorsed and sent to peer review; he says the last two problems took about three days
