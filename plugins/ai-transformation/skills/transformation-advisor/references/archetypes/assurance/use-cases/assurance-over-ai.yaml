    - {ref: ICAEW-AIAC-2026, title: "AI Assurance Conference 2026 (programme and speakers)", publisher: "ICAEW", type: conference, url: "https://www.icaew.com/learning-and-development/events/ai-assurance-conference", date: "2026-07-06", access: full, locator: "speaker biographies"}
    - {ref: CONSULTANCY-BIG4-2025, title: "Big Four weighing up new AI audit offerings", publisher: "Consultancy.uk", type: press, url: "https://www.consultancy.uk/news/40424/big-four-weighing-up-new-ai-audit-offerings", date: "2025-06-10", access: full, locator: "paragraphs 4-6"}
    - {ref: MOKANDER-LLM-2023, title: "Auditing large language models: a three-layered approach (arXiv 2302.08500)", publisher: "Mokander, Schuett, Kirk and Floridi (arXiv)", type: academic, url: "https://arxiv.org/abs/2302.08500", date: "2023-02-16", access: full, locator: "abstract"}
    - {ref: MOKANDER-BLUEPRINT-2024, title: "A Blueprint for Auditing Generative AI (arXiv 2407.05338)", publisher: "Mokander, Curl and Kshirsagar (arXiv)", type: academic, url: "https://arxiv.org/abs/2407.05338", date: "2024-07-07", access: full, locator: "abstract"}
    - {ref: BIRHANE-2024, title: "AI auditing: The Broken Bus on the Road to AI Accountability (arXiv 2401.14462)", publisher: "Birhane, Steed, Ojewale, Vecchione and Raji (arXiv; IEEE SaTML 2024)", type: academic, url: "https://arxiv.org/abs/2401.14462", date: "2024-01-25", access: full, locator: "abstract"}
    - {ref: OJEWALE-2024, title: "Towards AI Accountability Infrastructure: Gaps and Opportunities in AI Audit Tooling (arXiv 2402.17861)", publisher: "Ojewale et al. (arXiv; ACM CHI)", type: academic, url: "https://arxiv.org/abs/2402.17861", date: "2024-02-27", access: full, locator: "abstract"}
  last_reviewed: "2026-10-17"
  notes: >-
