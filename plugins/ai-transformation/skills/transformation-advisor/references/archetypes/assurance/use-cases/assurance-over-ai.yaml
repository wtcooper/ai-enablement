# Use cases: assurance / assurance-over-ai
# Sources checked 2026-10-17. Two areas: (1) auditing AI the entity uses in financial reporting and internal control;
# (2) standalone assurance services over AI systems. In most entries the AI is the OBJECT of the assurance work, not
# the tool doing it, so ladder and runtime_class describe the assurance team's own tooling and default to assist /
# personal-assistant or shared-team-skills; pattern is 'other' (proposed new pattern: assurance over an AI system).
# Testing controls that AI performs, from the controls-testing programme view, is assurance-controls-testing-15;
# entries here reference it rather than repeat it. No entry has a measured quality outcome; figures are readiness
# surveys, market sizing, vendor counts or forecasts. Source refs are the archetype's
# shared keys (one key per document).
# Entries 25-27 added 2026-10-21 (mid-market).

- id: assurance-assurance-over-ai-01
  title: "Idea: inventory the entity's AI and scope it to financial-reporting processes, assertions and key controls"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Entities adopt generative AI through embedded features, vendor tools and unsanctioned "shadow AI", so an auditor
    or SOX team cannot tell which AI touches financial reporting (DART-COSO-2026; UNIQUS-GENAI-2026). The AICPA says
    an early question is how far the company relies on AI in financial reporting (AICPA-PA-2026). Audit partners
    most often name lack of in-house AI expertise and control capability (33%), data quality (27%), missing
    governance frameworks and oversight structures (27%) and thin documentation of models, assumptions and decision
    logic (26%) as the AI-related internal-control challenges at their largest client (BOARDMEMBER-CAQ-2026).
  solution: >-
    Work from a living inventory in which each use case is classified by COSO capability type, given an owner, and
    described by objective, data sources, model, deployment model and criticality (COSO-GENAI). Map in-scope use
    cases to financial-reporting processes, assertions and key controls, including controls over spreadsheets, tools,
    upstream data and interfaces, and coordinate early with internal and external auditors on what counts as
    sufficient, appropriate evidence for GenAI-enabled controls (DART-COSO-2026). BDO starts the IT audit with the
    entity's AI use cases, related systems and service providers, and the governance around them (BDO-ITGC). The
    AICPA practice aid (13 Oct 2026) asks auditors to establish the extent of reliance early, how AI
    differs from ordinary automation, how data quality affects reliability, whether the team has the right blend of
    audit, AI and data skills, and what new risks arise (data, model, hallucination, explainability, bias, drift)
    (AICPA-PA-2026). EY leaders advise organisations just starting out to begin with governance and an AI inventory
    (EY-SOC-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: COSO-GENAI
  prerequisites:
    - "A cross-functional AI governance structure that owns the inventory (COSO-GENAI)"
    - "Periodic scans or surveys to find shadow AI (COSO-GENAI)"
    - "A process to identify AI used by vendors and other third parties (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "COSO frames the inventory as a repeating cycle, so a one-off list goes stale as models, prompts and vendors change (COSO-GENAI)."
    - "Deloitte says the COSO guidance builds on the 2013 framework and is not a prescriptive rulebook (DART-COSO-2026)."
    - "Accounting Today's account of the AICPA aid says heavy AI reliance may resemble use of complex valuation models and may reveal a lack of management competence; acceptance is covered in the acceptance-independence module (AT-AICPAPA-2026)."
  human_checkpoints:
    - "Management signs off ownership and criticality per use case (COSO-GENAI)"
    - "Management identifies financially relevant use cases for heightened rigour and agrees with internal and external auditors what evidence suffices (DART-COSO-2026)"
    - "Engagement partner judgement on acceptance and on whether AI use affects financial reporting (AICPA-PA-2026)"
  role_evolution: >-
    The AICPA says the audit team may need a blend of auditing expertise, AI knowledge, data skills, professional
    skepticism and specialist support (AICPA-PA-2026). BDO places understanding of the entity's AI use first in the IT
    audit approach (BDO-ITGC).
  evidence_grade: D
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "pp. 18-19, roadmap steps 1-2 and example inventory entry"}
    - {ref: DART-COSO-2026, title: "Heads Up: COSO Releases Publication on Internal Controls Related to Generative AI (Vol. 33, Issue 3)", publisher: "Deloitte (DART)", type: firm, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2026/coso-internal-controls-generative-ai", date: "2026-04-03", access: full, locator: "paragraphs 1-3 and section on six actions, items 1, 2 and 6"}
    - {ref: AICPA-PA-2026, title: "AICPA Releases Guidance to Help Auditors Address the Use of AI in Financial Reporting and Auditing", publisher: "AICPA & CIMA", type: standard-setter, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "section 'Considering an organization's use of AI'; the practice aid itself is behind a member login and was not read"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraphs on acceptance and continuance and on understanding the entity"}
    - {ref: BDO-ITGC, title: "Artificial Intelligence: IT Audit Considerations with Focus on Information Technology General Controls", publisher: "BDO USA", type: firm, url: "https://www.bdo.com/insights/assurance/artificial-intelligence-it-audit-considerations-with-focus-on-information-technology-general-control", date: "2026-07-20", access: full, locator: "opening section 'Start with understanding'"}
    - {ref: UNIQUS-GENAI-2026, title: "Internal controls over generative AI", publisher: "Uniqus", type: firm, url: "https://uniqus.com/internal-controls-over-generative-ai/", date: "2026-04-07", access: full, locator: "section 1 (shadow AI)"}
    - {ref: BOARDMEMBER-CAQ-2026, title: "What audit partners are seeing on AI and what it means for audit committees", publisher: "Corporate Board Member (CAQ author)", type: press, url: "https://boardmember.com/?p=50023", date: "2026-07-15", access: full, locator: "section on operational control gaps"}
    - {ref: EY-SOC-2026, title: "How AI assurance builds trust with SOC, attestation and certification", publisher: "EY", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09", access: full, locator: "section 'How AI improves SOC reporting', closing quote"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: published guidance from COSO, the AICPA and firms; no named engagement or measured outcome found. A
    Genpact CAE forum summary is an AI-generated aggregator page and is not used here. One COSO capability type is
    named differently across sources ("knowledge retrieval and summarization", type 7 in the COSO PDF; "regulatory
    intelligence" in some secondary summaries); quote the PDF.

- id: assurance-assurance-over-ai-02
  title: Classify AI-enabled controls by reliance and by the AI's role to set the evidence standard and ITGC scope
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Some AI-assisted controls are re-performed by a person and some are accepted on the AI output alone, yet both are
    called AI controls; treating them alike makes evidence demands either too heavy or too light (COSO-GENAI).
    Vendor commentary says over-scoping, and presenting a monitoring activity as a key control, are both likely errors
    (FINREP-JE-2026).
  solution: >-
    COSO adopts a working definition: reliance occurs when management depends on AI-generated outputs as part of the
    evidence supporting an ICFR control's design or operating effectiveness. Its reliance example is AI matching
    journal entries to support with management approving on the AI output alone; its non-reliance example is a
    control owner re-performing the match on all or a sample of items. Where reliance exists COSO expects ICFR evidence
    standards (documented prompt, configuration and model version, a clear sampling rationale and exception
    resolution, retained evidence of design and operation); for non-reliance, expectations may be proportionately lower
    (COSO-GENAI). BDO applies the test to ITGC scoping and says ITGCs matter significantly more under reliance
    (BDO-ITGC). A finance-technology vendor, citing PwC 2025 guidance that could not be checked, sorts controls
    into three classes: AI makes and executes the decision (ITGC testing of the AI system comes into scope); AI flags
    and a human decides (an IT-dependent manual control, with human sign-off as the main operating evidence); AI
    supplements a key control without replacing it (FINREP-JE-2026). Another vendor lists twelve questions it says
    external auditors ask, ending with whether the AI behaves like a control or like a tool (KOGNITOS-SOXQ-2026).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: COSO-GENAI
  prerequisites:
    - "Use-case inventory mapped to key controls (DART-COSO-2026; see -01)"
    - "A control matrix that records, for each control, what the AI does and what the human does (FINREP-JE-2026)"
    - "Logs that can support an AI 'bill of materials': prompts, outputs, system messages, model version, parameters and plugins (COSO-GENAI)"
  risks_and_guardrails:
    - "COSO labels its definition a working definition drawn from emerging industry views; it is not part of the 2013 framework (COSO-GENAI)."
    - "BDO's paraphrase of the definition (depending on outputs without sufficiently re-performing) is worded differently from COSO's text, so do not treat the two as identical (BDO-ITGC; COSO-GENAI)."
    - "Both vendor sources sell products, and the PwC original and auditors' actual questions were not seen (FINREP-JE-2026; KOGNITOS-SOXQ-2026)."
  human_checkpoints:
    - "Control owner re-performs and documents review in non-reliance patterns (COSO-GENAI)"
    - "Auditor decides which pattern applies to each control (BDO-ITGC)"
    - "Human reviewer's disposition of AI flags, evidenced by sign-off and reviewer identity (FINREP-JE-2026)"
  role_evolution: >-
    By inference from the definition, control owners must show re-performance evidence and auditors add a
    classification step to controls scoping (COSO-GENAI; BDO-ITGC). A vendor says controllers and SOX leads
    need to explain AI controls in auditor-ready terms (KOGNITOS-SOXQ-2026).
  evidence_grade: C
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 13, working definition of AI reliance and evidence list"}
    - {ref: BDO-ITGC, title: "Artificial Intelligence: IT Audit Considerations with Focus on Information Technology General Controls", publisher: "BDO USA", type: firm, url: "https://www.bdo.com/insights/assurance/artificial-intelligence-it-audit-considerations-with-focus-on-information-technology-general-control", date: "2026-07-20", access: full, locator: "section 'Control activities' (reliance example and ITGC importance)"}
    - {ref: DART-COSO-2026, title: "Heads Up: COSO Releases Publication on Internal Controls Related to Generative AI (Vol. 33, Issue 3)", publisher: "Deloitte (DART)", type: firm, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2026/coso-internal-controls-generative-ai", date: "2026-04-03", access: full, locator: "section on six actions"}
    - {ref: FINREP-JE-2026, title: "AI journal entry testing and SOX 404 controls: a 2026 practitioner walkthrough", publisher: "Finrep", type: vendor, url: "https://www.finrep.ai/blog/ai-journal-entry-testing-and-sox-404-controls-a-2026-practitioner-walkthrough", date: "2026-08-03", access: full, locator: "section 'How to classify an AI journal entry control in your control matrix'"}
    - {ref: KOGNITOS-SOXQ-2026, title: "What your SOX auditor will ask about your AI automation", publisher: "Kognitos", type: vendor, url: "https://www.kognitos.com/blog/sox-auditor-questions-ai-automation/", date: "2026-05-15", access: full, locator: "TL;DR and section 'The 12 questions'"}
  last_reviewed: "2026-10-17"
  notes: >-
    assurance-controls-testing-15 mentions COSO reliance briefly; this entry holds the classification and
    evidence-standard detail. The Kognitos claims that amended AS 2201 and AS 2101 take effect for fiscal years
    beginning on or after 2026-12-15, and that Big Four firms train staff on AI-touched controls, are unconfirmed
    and not used. Grade C: vendor claims plus guidance; no named engagement.

- id: assurance-assurance-over-ai-03
  title: Respond to AI-operated controls by extending ITGCs to AI components and choosing between testing outputs, testing AI controls or testing around the AI
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, software-systems, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    ITGC testing was designed around applications, databases and operating systems, but AI-enabled processes add
    models, data pipelines, orchestration software and agents that can read from and act on ERP systems
    (BDO-ITGC). Some models learn, drift and give probabilistic results, so the testing strategy for deterministic
    automated controls may not carry over, and purchased AI may limit what the auditor can do (AT-AICPAPA-2026). KPMG
    says SOX programmes have largely avoided AI-related material weaknesses so far, crediting strong AI governance and
    timing: programmes are still testing "around" the AI, relying on manual and other automated controls (KPMG-SOX-2026). In an Optro survey of over 400 GRC and
    audit leaders, respondents said they authorise agents to approve or reject transactions (38%), modify controls or
    policies (34%) and change user permissions or access rights (27%) (OPTRO-SURVEY).
  solution: >-
    ITGCs: BDO keeps the four ITGC domains (user access, program change, computer operations, program development) and
    extends them to in-scope AI components (the model, data pipelines, orchestration software, AI agents and
    enterprise AI platforms), scoping each by its nature, the degree of reliance and whether the entity or a service
    provider performs the control; it asks whether ERP user-access reviews cover agents native to the ERP, external
    agents working through the user interface and headless agents using an API (BDO-ITGC). COSO, as summarised by
    Accounting Today, adds: treat prompts, system prompts, retrieval connectors and transformation rules as governed
    configurations with version history, approval and rollback (AT-COSO-2026). Uniqus adds: apply least privilege, logging and human override to agents, manage
    API keys and tokens like privileged credentials, and re-examine segregation of duties where AI can configure,
    execute and review (UNIQUS-GENAI-2026). Evidence mix: the AICPA aid, as reported, says the auditor may be able to
    test AI outputs substantively; if that alone is not sufficient, the auditor designs tests of controls. Sometimes
    traditional controls such as human review or monitoring bring AI risk to an acceptable level; in other cases
    controls over data quality, model performance and safeguards need testing. The aid also says the auditor cannot
    rely on tests of controls alone and may need to establish relationships between inputs and outputs and look to
    non-traditional information sources (AT-AICPAPA-2026). KPMG expects that working AI into the control environment
    will "likely during this next year" become unavoidable, and says external auditors are putting more emphasis on
    test of design as automated, AI-enabled controls spread (KPMG-SOX-2026; K-404A).
  outcomes:
    - lever: risk
      description: "KPMG expects the first wave of AI-related material weaknesses as SOX programmes stop testing around AI"
      figure: "2027 (forecast)"
      measures: "year in which KPMG expects the first AI-related material weaknesses; a firm forecast, not an observed event"
      provenance: self-reported
      source_ref: KPMG-SOX-2026
  prerequisites:
    - "Component-level inventory of the AI behind each in-scope use case (BDO-ITGC)"
    - "Reliance classification per control (see -02; BDO-ITGC)"
    - "Access to service-provider controls or reports where components are hosted by vendors (BDO-ITGC)"
    - "Robust control design, rationalisation and documentation before leveraging AI and other emerging technologies (K-404A)"
  risks_and_guardrails:
    - "BDO says the change is the extension of existing ITGC categories to AI components, not new categories (BDO-ITGC); COSO says established ITGC guidance remains necessary (COSO-GENAI)."
    - "The PCAOB technology-assisted-analysis amendments to AS 1105 and AS 2301 require testing relevant ITGCs where applicable over electronic information, but are not AI-specific (CALCPA-AISTD-2026, secondary; PCAOB pages were blocked)."
    - "A human approval step that rubber-stamps every AI recommendation provides no real control value (KPMG-SOX-2026)."
    - "The AICPA aid, as reported, says a one-to-one translation of existing risk guidance does not always work because AI can change the risks inherent to a class of transactions (AT-AICPAPA-2026)."
    - "Protiviti, quoted on a legal blog, says AI-driven layoffs and workforce changes can affect how established controls operate; the blog links this to staffing and segregation-of-duties weaknesses (TCC-ICFR-2026)."
    - "In the same Optro survey, 25% reported a control failure involving an agent and 30% an unintended agent action; vendor-published, and the figures count reports, not severity (OPTRO-SURVEY)."
  human_checkpoints:
    - "IT audit specialist scopes components per use case and decides how far ITGC testing must extend under reliance (BDO-ITGC)"
    - "The reviewer in a human-in-the-loop control must have the knowledge to judge AI reliability (AT-AICPAPA-2026)"
    - "Deficiency evaluation, including probing management's explanation of why a deficiency is not a material weakness (KPMG-ACAGENDA-2025)"
  role_evolution: >-
    KPMG says the auditor of the future must be as comfortable in a system configuration log as in a transaction
    ledger, that what counts as meaningful human oversight of AI-operated controls is becoming harder to define, and
    that a new mandate to assure the AI systems themselves is emerging (KPMG-SOX-2026). The AICPA aid, as reported,
    says auditors need to understand the AI mechanism behind a control as well as the control activity
    (AT-AICPAPA-2026).
  evidence_grade: C
  sources:
    - {ref: BDO-ITGC, title: "Artificial Intelligence: IT Audit Considerations with Focus on Information Technology General Controls", publisher: "BDO USA", type: firm, url: "https://www.bdo.com/insights/assurance/artificial-intelligence-it-audit-considerations-with-focus-on-information-technology-general-control", date: "2026-07-20", access: full, locator: "sections 'IT General Controls' and 'AI-related components'; PDF edition pp. 1-2"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "sections on control activities, audit responses, audit evidence and purchased AI"}
    - {ref: KPMG-SOX-2026, title: "The Future of SOX: a point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/future-sox-point-view-2030-beyond-new.pdf", date: "2026-09-24", access: full, locator: "p. 6 ('Auditing AI itself'); p. 7 ('The first AI-related material weaknesses'); p. 8 (configuration-log quote); p. 14 ('Challenges on the horizon'); PDF pages"}
    - {ref: K-404A, title: "The 404(a) opportunity: turning a compliance shift into a strategic catalyst", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/404-opportunity.pdf", date: "2026-08", access: full, locator: "section on renewed focus on Test of Design (design, rationalization and documentation)"}
    - {ref: KPMG-ACAGENDA-2025, title: "On the 2026 audit committee agenda", publisher: "KPMG Board Leadership Center", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/boardleadership/pdf/2026/on-the-2026-audit-committee-agenda.pdf", date: "2025-12-05", access: full, locator: "p. 2, 'ICOFR and probing control deficiencies'"}
    - {ref: UNIQUS-GENAI-2026, title: "Internal controls over generative AI", publisher: "Uniqus", type: firm, url: "https://uniqus.com/internal-controls-over-generative-ai/", date: "2026-04-07", access: full, locator: "sections on access controls and segregation of duties"}
    - {ref: AT-COSO-2026, title: "COSO releases guidance on internal controls for AI", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/coso-releases-guidance-on-applying-internal-controls-to-ai", date: "2026-02-24", access: full, locator: "paragraph on control environment"}
    - {ref: OPTRO-SURVEY, title: "One in three organizations say they have acted on wrong decisions made by AI agents", publisher: "Optro", type: survey, url: "https://optro.ai/blog/one-in-three-organizations-say-they-have-acted-on-wrong-decisions-made-by-ai-agents-optro-research-finds", date: "2026-10-08", access: full, locator: "paragraphs 2-4"}
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 6, scope and boundaries"}
    - {ref: CALCPA-AISTD-2026, title: "AI Standard Setting, Regulation in Audit: Part 1", publisher: "California Society of CPAs (CalCPA)", type: professional-body, url: "https://www.calcpa.org/whats-happening/articles/ai-standard-setting-regulation-in-audit-part-1", date: "2026-08-12", access: full, locator: "section 'PCAOB: The U.S. Issuer Landscape', AS 1105 paragraph"}
    - {ref: TCC-ICFR-2026, title: "Your 2026 Audit Committee Agenda: ICFR During AI Transformations", publisher: "TheCorporateCounsel.net", type: press, url: "https://www.thecorporatecounsel.net/blog/2026/02/your-2026-audit-committee-agenda-icfr-during-ai-transformations.html", date: "2026-02-06", access: full, locator: "Protiviti quotation in the second half of the post"}
  last_reviewed: "2026-10-17"
  notes: >-
    Extends assurance-controls-testing-15, which covers the same test object from the SOX testing-programme side
    (scoping AI components, ITGCs over prompts, models and agent identities, SOC scoping under TQA 9561); this entry
    adds BDO's component and agent-type scoping and the AICPA evidence-mix guidance. Uniqus's statement that the
    PCAOB flagged ITGCs over AI in 2026 inspection priorities is unverified and not used. Grade C: firm approach
    papers and non-authoritative guidance; no named engagement, inspection finding or measured outcome.

- id: assurance-assurance-over-ai-04
  title: Build an evidence trail for each AI-touched control, from retained prompts and model versions to tamper-evident agent action records
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, document-production, software-systems]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Because GenAI is probabilistic, a control that relies on its output cannot be evidenced by the output alone. COSO's
    guidance, as summarised by Accounting Today, says outputs should be treated as claims requiring validation
    (AT-COSO-2026); EisnerAmper says assertions requiring validation (EISNER-COSO-2026). Once an agent can call tools
    and trigger side effects, an auditor needs trustworthy evidence to reconstruct its behaviour (NIAN-AUDITABLE-2026).
  solution: >-
    Retain prompts, system prompts and configurations with version history (AT-COSO-2026). For significant-impact GenAI
    processes, COSO says an AI "bill of materials" should hold logs of prompts, outputs, system messages, model version,
    parameters and plugins (COSO-GENAI). Advisers add retained inputs, outputs, model versions and human-review
    records so the control can be shown to have operated (UNIQUS-GENAI-2026; KOGNITOS-SOXQ-2026). A vendor adds a
    crosswalk in the control matrix mapping each AI detection rule to the audit risk factor it addresses (for journal
    entries, AS 2401) (FINREP-JE-2026). For agents, the "Auditable Agents" paper defines five auditability dimensions
    (action recoverability, lifecycle coverage, policy checkability, responsibility attribution, evidence integrity)
    and proposes an Auditability Card for agent systems (NIAN-AUDITABLE-2026).
  outcomes:
    - lever: risk
      description: "Lower-bound ecosystem measurement suggesting basic security prerequisites for auditability are widely unmet"
      figure: "617"
      measures: "security findings across six prominent open-source agent projects, as counted by the authors"
      provenance: independent
      source_ref: NIAN-AUDITABLE-2026
    - lever: speed
      description: "Pre-execution mediation with tamper-evident records added little runtime cost in the authors' feasibility tests"
      figure: "8.3 ms"
      measures: "median overhead of pre-execution mediation with tamper-evident records in the authors' runtime feasibility results"
      provenance: independent
      source_ref: NIAN-AUDITABLE-2026
  prerequisites:
    - "Logging and retention of prompts, outputs and reviewer decisions (KOGNITOS-SOXQ-2026)"
    - "An agent runtime that can mediate actions before execution (NIAN-AUDITABLE-2026)"
  risks_and_guardrails:
    - "COSO, as summarised, names data extraction and ingestion as a high-risk capability because weak controls there pass compromised data to every downstream process (AT-COSO-2026)."
    - "The paper's authors say no single mechanism suffices, and its results come from research prototypes and open-source projects, not audited enterprise deployments (NIAN-AUDITABLE-2026)."
    - "Kognitos and Finrep sell automation products; their account of what auditors ask is marketing-adjacent (KOGNITOS-SOXQ-2026; FINREP-JE-2026)."
  human_checkpoints:
    - "A named reviewer documents what the AI concluded and why they agreed or disagreed (BAKERTILLY-IA-2026)"
    - "Responsibility attribution ties agent actions back to accountable people (NIAN-AUDITABLE-2026)"
  role_evolution: >-
    Baker Tilly says quality metrics such as finding accuracy and coverage, not efficiency, are the new indicators
    of a reliable audit function, and that boards increasingly ask "who made this call?" when AI is involved
    (BAKERTILLY-IA-2026). By inference, assurance
    providers would evaluate logging design and evidence integrity as part of AI control testing (NIAN-AUDITABLE-2026;
    COSO-GENAI).
  evidence_grade: C
  sources:
    - {ref: AT-COSO-2026, title: "COSO releases guidance on internal controls for AI", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/coso-releases-guidance-on-applying-internal-controls-to-ai", date: "2026-02-24", access: full, locator: "five foundational principles; control environment paragraph"}
    - {ref: EISNER-COSO-2026, title: "COSO released GenAI governance guidance: what it means for your organization", publisher: "EisnerAmper", type: firm, url: "https://www.eisneramper.com/insights/artificial-intelligence-insights/coso-ai-governance-internal-control-framework-0526/", date: "2026-05-13", access: full, locator: "Key takeaways"}
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 13, general controls and AI bill of materials"}
    - {ref: UNIQUS-GENAI-2026, title: "Internal controls over generative AI", publisher: "Uniqus", type: firm, url: "https://uniqus.com/internal-controls-over-generative-ai/", date: "2026-04-07", access: full, locator: "section 1"}
    - {ref: KOGNITOS-SOXQ-2026, title: "What your SOX auditor will ask about your AI automation", publisher: "Kognitos", type: vendor, url: "https://www.kognitos.com/blog/sox-auditor-questions-ai-automation/", date: "2026-05-15", access: full, locator: "questions 3, 4 and 8"}
    - {ref: FINREP-JE-2026, title: "AI journal entry testing and SOX 404 controls: a 2026 practitioner walkthrough", publisher: "Finrep", type: vendor, url: "https://www.finrep.ai/blog/ai-journal-entry-testing-and-sox-404-controls-a-2026-practitioner-walkthrough", date: "2026-08-03", access: full, locator: "section 'What PCAOB AS 2401 actually requires'"}
    - {ref: NIAN-AUDITABLE-2026, title: "Auditable Agents (arXiv 2604.05485, v4)", publisher: "Nian et al. (arXiv; condensed version accepted to ACM AI Summit 2026)", type: academic, url: "https://arxiv.org/abs/2604.05485", date: "2026-04-07", access: full, locator: "abstract (v4, last revised 2026-09-27)"}
    - {ref: BAKERTILLY-IA-2026, title: "Strategy in motion: internal audit's 2026 execution mandate", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/internal-audit-2026-execution-mandate", date: "2026-04-10", access: full, locator: "section 3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Baker Tilly's statement that the EU AI Act explicitly classes audit AI as high risk is not supported by the
    Annex III categories other sources list, and is not used. Only the paper's abstract was read.

- id: assurance-assurance-over-ai-05
  title: "Idea: use management's AI monitoring metrics, tolerance ranges and remediation logs as evidence that AI controls keep operating"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Point-in-time testing misses gradual model drift and vendor-driven changes; Deloitte says "set-and-forget" does not
    work when GenAI is used in financial reporting (DART-COSO-2026). COSO notes some risks, such as gradual accuracy
    degradation, are hard to detect through ongoing monitoring alone, and that because GenAI is probabilistic the
    definition of a "control failure" may need to move beyond a single pass/fail indicator (COSO-GENAI).
  solution: >-
    COSO expects continuous monitoring of indicators such as accuracy, precision and recall, coverage, latency and
    exception volumes; separate evaluations (periodic model effectiveness audits on historical and hypothetical data,
    independent challenge sessions, simulated adversarial exercises); a remediation log of issue, root cause, action
    and follow-up testing; and an agreed deficiency playbook. It says its illustrative metrics serve both operational
    monitoring and audit evidence collection (COSO-GENAI). Deloitte lists transaction volume, transaction size
    and override percentages as drift indicators and calls for root-cause review of prompt design, retrieval issues and
    vendor changes (DART-COSO-2026). Looking ahead, COSO says organisations will increasingly rely on multi-metric AI
    tolerances (acceptable thresholds across task accuracy, data leakage tolerance, bias levels, explainability
    minimums, cybersecurity posture and model change velocity), which may give a more realistic view of control
    effectiveness (COSO-GENAI).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: COSO-GENAI
  prerequisites:
    - "Monitoring dashboards with thresholds linked to retraining, reconfiguration or rollback triggers (COSO-GENAI)"
    - "Baselines for the chosen indicators and an owner for each (DART-COSO-2026)"
    - "Retained remediation logs with owner sign-offs (COSO-GENAI)"
    - "Living risk registers that update when models, corpora or configurations change (AT-COSO-2026)"
  risks_and_guardrails:
    - "COSO notes that monitoring systems themselves need monitoring so their detection logic stays accurate (COSO-GENAI)."
    - "COSO says GenAI deficiencies may be safety and reliability failures, such as hallucinations in regulated disclosures, not only control gaps (COSO-GENAI)."
    - "The tolerance passage is forward-looking and phrased with 'may'; no assurance standard is cited as accepting multi-metric tolerances as a deviation definition (COSO-GENAI)."
  human_checkpoints:
    - "Human-in-the-loop quality reviews of a sample of transactions against a rubric (COSO-GENAI)"
    - "Control owner reviews drift alerts and root causes (DART-COSO-2026)"
    - "Control owners and reviewers sign off tolerance changes; material deficiencies escalate to governance bodies (COSO-GENAI)"
  role_evolution: >-
    Deloitte says GenAI requires a shift in mindset for management and auditors, from static point-in-time assurance to
    continuous monitoring of model performance and risk (DART-COSO-2026). By inference, assurance providers would need
    statistical and model-evaluation skills to judge whether a tolerance range is credible (COSO-GENAI).
  evidence_grade: D
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "pp. 16-17, monitoring activities and 'Looking ahead' box under Principle 16; p. 4, audit-ready control mapping"}
    - {ref: DART-COSO-2026, title: "Heads Up: COSO Releases Publication on Internal Controls Related to Generative AI (Vol. 33, Issue 3)", publisher: "Deloitte (DART)", type: firm, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2026/coso-internal-controls-generative-ai", date: "2026-04-03", access: full, locator: "paragraph beginning 'Monitoring plays a key role'"}
    - {ref: AT-COSO-2026, title: "COSO releases guidance on internal controls for AI", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/coso-releases-guidance-on-applying-internal-controls-to-ai", date: "2026-02-24", access: full, locator: "paragraphs on risk assessment and the five foundational principles"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: guidance only. COSO's example (an expense-monitoring model retrained when monthly precision or recall
    falls below a threshold) is illustrative and unnamed. No override rates, drift rates or parallel-run results
    from a named entity were found. Ladder augment: the monitoring gives a first pass that people review; whether it
    uses AI is not stated.

- id: assurance-assurance-over-ai-06
  title: "Idea: re-perform AI-operated control outputs with independent test populations or challenger models"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    An auditor cannot inspect the reasoning of a probabilistic model, and the less insight there is into how an output
    was produced, the harder it is to become comfortable with it (AT-AICPAPA-2026).
  solution: >-
    COSO lists methods it says the assurance and risk community now discusses: human review ranging from full
    re-performance to risk-based sampling of exceptions; performance testing on test populations to check accuracy and
    completeness and stress-test edge cases; multi-model validation comparing outputs across independent AI models or
    deterministic benchmark algorithms; analytics monitoring of drift; and third-party validation or certification of
    models. COSO says these support management's assurance and auditor expectations of sufficient appropriate evidence
    (COSO-GENAI). KPMG's summary of the COSO roadmap lists performance testing, multi-model validation, data
    analytics monitoring and third-party validation as evolving approaches (KPMG-COSO-2026).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: COSO-GENAI
  prerequisites:
    - "Representative test populations and benchmark algorithms (COSO-GENAI)"
    - "A second model or deterministic benchmark independent of the first (COSO-GENAI)"
  risks_and_guardrails:
    - "For auditors' own tools the AICPA aid says a second AI tool checking the first does not reduce the auditor's supervision and review duties; an adjacent context (AT-AICPAPA-2026)."
  human_checkpoints:
    - "Human reviewers handle disagreements between the model and the challenger (COSO-GENAI)"
  role_evolution: >-
    By inference, assurance teams would need to build or buy challenger tooling and test sets to use the methods COSO
    lists (COSO-GENAI).
  evidence_grade: D
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 14, five leading approaches"}
    - {ref: KPMG-COSO-2026, title: "COSO releases GenAI roadmap", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/frv/pdf/2026/coso-releases-gen-ai-roadmap.pdf", date: "2026-05-01", access: full, locator: "pp. 2-3, 'Interaction with the KPMG Guide'"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraphs on audit evidence and on one AI tool evaluating another"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: COSO calls the methods emerging practice but names no deployment. In controls-testing,
    assurance-controls-testing-10 (several models cross-checking a workpaper) applies the same idea to the auditor's
    own work. One of the few entries in this module where AI does assurance work (augment).

- id: assurance-assurance-over-ai-07
  title: "Idea: obtain evidence over vendor-supplied AI through service-auditor reports and AI-specific management representations"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    When an entity uses a service organisation's AI, or the organisation uses AI inside its system, the user auditor's
    ability to perform procedures may be limited (AT-AICPAPA-2026), and vendor-supplied GenAI limits visibility into
    training data, model updates and underlying controls (COSO-GENAI).
  solution: >-
    The AICPA aid, as reported, says a service auditor's report often becomes important audit evidence; if it is not
    sufficient, additional procedures may include AI-related management representations, such as identification of
    the AI the entity uses. It also asks whether the entity has a process to identify AI used by vendors and other
    third parties and evaluate the effect on financial reporting (AT-AICPAPA-2026). The AICPA points to separate
    guidance on how a service organisation's AI use affects SOC 1 and SOC 2 engagements (AICPA-PA-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: AT-AICPAPA-2026
  prerequisites:
    - "Service-auditor reports whose system description and scope reach the AI components (AT-AICPAPA-2026)"
    - "An entity process for identifying third-party AI (AT-AICPAPA-2026)"
  risks_and_guardrails:
    - "The Cloud Security Alliance says the AICPA has published no AI-specific Trust Services Criteria and that a SOC 2 Type II reliably covers conventional IT general controls on the infrastructure, not model-specific properties; CSA publishes competing frameworks, so it is not neutral (CSA-SOC2)."
  human_checkpoints:
    - "User auditor evaluates whether the service-auditor report covers the relevant AI controls (AT-AICPAPA-2026)"
  role_evolution: >-
    User auditors read service-auditor reports for AI scope and ask for representations that name the AI in use
    (AT-AICPAPA-2026).
  evidence_grade: D
  sources:
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraphs on service organizations and purchased AI"}
    - {ref: AICPA-PA-2026, title: "AICPA Releases Guidance to Help Auditors Address the Use of AI in Financial Reporting and Auditing", publisher: "AICPA & CIMA", type: standard-setter, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "section 'Additional AI-related guidance'"}
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 6, third-party and vendor risk"}
    - {ref: CSA-SOC2, title: "The SOC 2 AI gap: auditors improvise where AICPA has not acted", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-soc2-ai-controls-gap-20260830-csa-styled/", date: "2026-08-30", access: full, locator: "Key Takeaways"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: non-authoritative guidance, no engagement found. The service auditor's side (scoping AI into SOC
    examinations under AICPA TQA 9561, whose text is behind a login) is in assurance-controls-testing-15 and the
    soc-attestation module.

- id: assurance-assurance-over-ai-08
  title: "Idea: extend fraud-risk assessment to AI manipulation and AI-generated evidence where the entity uses AI"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, research-synthesis]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    COSO says AI creates new routes for fraud: deepfakes, synthetic records, model manipulation through crafted prompts,
    and agents that bring authorisation and interface risks (COSO-GENAI).
  solution: >-
    COSO Principle 8 asks fraud risk assessment to identify how these threats could be used inside or outside the
    entity and whether existing fraud controls would catch them, and to expand preventive programmes where needed
    (COSO-GENAI). The AICPA aid, as reported, adds examples: personnel altering training data or the algorithm to
    create bias, editing model attributes so fraudulent transactions classify as legitimate, and generating fictitious
    supporting documents (AT-AICPAPA-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: COSO-GENAI
  prerequisites:
    - "Use-case inventory that includes agents and their permissions (COSO-GENAI)"
  risks_and_guardrails:
    - "COSO says agents can add authorisation risk, excessive agency and insecure interfaces (COSO-GENAI)."
  human_checkpoints:
    - "The engagement team's fraud-risk discussion covers AI-enabled schemes (AT-AICPAPA-2026)"
  role_evolution: >-
    The AICPA says teams may need specialist support (AICPA-PA-2026); by inference that support extends to fraud-risk
    discussions where AI is in the reporting process.
  evidence_grade: D
  sources:
    - {ref: COSO-GENAI, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "p. 11, Principle 8"}
    - {ref: AT-AICPAPA-2026, title: "AICPA releases practice guide for auditors dealing with AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/aicpa-releases-practice-guide-for-auditors-dealing-with-ai", date: "2026-10-14", access: full, locator: "paragraph on AI-enabled fraud risk"}
    - {ref: AICPA-PA-2026, title: "AICPA Releases Guidance to Help Auditors Address the Use of AI in Financial Reporting and Auditing", publisher: "AICPA & CIMA", type: standard-setter, url: "https://www.aicpa-cima.com/news/article/aicpa-releases-guidance-to-help-auditors-address-the-use-of-ai-in-financial-reporting-and-auditing", date: "2026-10-13", access: full, locator: "section 'Considering an organization's use of AI'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea: guidance only. The planning-stage treatment is in the planning-risk-assessment module; screening submitted
    evidence for fabrication is assurance-controls-testing-23.

- id: assurance-assurance-over-ai-09
  title: Audit committee oversight of AI in financial reporting through dialogue with the auditor and disclosure controls over AI statements
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [client-interaction, review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Audit committees are taking on AI oversight faster than they feel able to carry it: in the Deloitte/CAQ survey of
    248 audit committee chairs and members (per Accounting Today), 75% named AI governance a top-three priority (35% the year
    before) but only 56% were confident in the committee's ability to oversee it (DELOITTE-ACPR-2026). Companies also
    disclose how they use and govern AI, and those disclosures need controls behind them (KPMG-ACAGENDA-2025).
  solution: >-
    KPMG's Board Leadership Center tells committees to discuss with the external auditor how the audit plan assesses
    risks from the company's use of GenAI and AI agents in financial reporting and related controls, and how the
    auditor itself uses AI, and to consider tasking management with reassessing whether internal controls and
    disclosure controls support disclosures about the company's AI use, risks and governance (KPMG-ACAGENDA-2025).
    Two-thirds of audit partners say their committee proactively raised AI use in operations or financial reporting in
    the past 12 months, the most frequent topic (BOARDMEMBER-CAQ-2026). An advisory firm says "AI washing"
    (overstating AI capabilities in disclosures) has drawn SEC enforcement scrutiny (UNIQUS-GENAI-2026).
  outcomes:
    - lever: risk
      description: "Share of audit committees with primary responsibility for AI governance"
      figure: "20% to 29%"
      measures: "Deloitte/CAQ survey respondents (audit committee chairs and members; 248 respondents per Accounting Today) saying the audit committee has primary responsibility for AI governance, prior year to current year"
      provenance: independent
      source_ref: AT-ACPR-2026
    - lever: risk
      description: "Committees overseeing AI governance that describe their oversight as emerging or limited"
      figure: "82%"
      measures: "committees overseeing AI governance describing oversight as emerging or limited, as reported by Accounting Today from the Deloitte/CAQ survey"
      provenance: independent
      source_ref: AT-ACPR-2026
    - lever: risk
      description: "Audit partners whose audit committee proactively raised AI use in operations or financial reporting"
      figure: "about two-thirds"
      measures: "share of audit partners in the CAQ Spring 2026 Audit Partner Pulse; sample size not on the page read"
      provenance: independent
      source_ref: BOARDMEMBER-CAQ-2026
  prerequisites:
    - "Committee skills: 70% of respondents named technology, including AI, as the skill that would most enhance committee effectiveness (DELOITTE-ACPR-2026)"
    - "Inventory and governance evidence that can support AI disclosures (KPMG-ACAGENDA-2025)"
  risks_and_guardrails:
    - "The Deloitte/CAQ survey measures committees' own views; the 57% 'AI governance is the biggest committee challenge' figure comes from audit partners, a different group (BOARDMEMBER-CAQ-2026)."
    - "The SEC enforcement statement comes from an advisory firm and was not confirmed from an SEC source (UNIQUS-GENAI-2026)."
  human_checkpoints:
    - "Committee challenge of management's explanation of control deficiencies (KPMG-ACAGENDA-2025)"
    - "Committee review of management's reassessment of disclosure controls over AI statements (KPMG-ACAGENDA-2025)"
  role_evolution: >-
    KPMG says internal audit's focus on AI governance and risk will likely grow, and asks whether internal audit keeps a
    human on the loop at critical stages of agent workflows (KPMG-ACAGENDA-2025).
  evidence_grade: C
  sources:
    - {ref: DELOITTE-ACPR-2026, title: "Enterprise Risk Management Takes the Lead, AI Governance Gains Urgency for Audit Committees", publisher: "Deloitte US with Center for Audit Quality", type: survey, url: "https://www.deloitte.com/us/en/about/press-room/deloitte-caq-announce-2026-audit-committee-practices-report.html", date: "2026-09-22", access: full, locator: "highlights: 'A gap between AI responsibility and readiness'; media alert"}
    - {ref: AT-ACPR-2026, title: "Audit committees focusing on emerging risks like AI", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/audit-committees-focusing-on-emerging-risks-like-ai", date: "2026-09-22", access: full, locator: "paragraph 2"}
    - {ref: KPMG-ACAGENDA-2025, title: "On the 2026 audit committee agenda", publisher: "KPMG Board Leadership Center", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/boardleadership/pdf/2026/on-the-2026-audit-committee-agenda.pdf", date: "2025-12-05", access: full, locator: "p. 2, 'Climate, AI, and cybersecurity disclosures'; pp. 4-6, 'Clarify the role of the audit committee in the oversight of AI' (page numbers approximate)"}
    - {ref: BOARDMEMBER-CAQ-2026, title: "What audit partners are seeing on AI and what it means for audit committees", publisher: "Corporate Board Member (CAQ author)", type: press, url: "https://boardmember.com/?p=50023", date: "2026-07-15", access: full, locator: "paragraphs 3-6"}
    - {ref: UNIQUS-GENAI-2026, title: "Internal controls over generative AI", publisher: "Uniqus", type: firm, url: "https://uniqus.com/internal-controls-over-generative-ai/", date: "2026-04-07", access: full, locator: "section 1.1, SEC enforcement posture"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded C: the evidence is survey measures across unnamed committees plus a firm's agenda advice; no named audit
    committee or company is described doing this, and no outcome of the dialogue was measured. Maturity left
    in-production because the surveys show the practice is widespread.

- id: assurance-assurance-over-ai-10
  title: Internal audit assurance over AI governance using the IIA AI Auditing Framework and the COSO capability taxonomy
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Organisations expect assurance over their AI but internal audit is not ready: in the Optro/Panterra survey of
    internal audit leaders, 63% of surveyed organisations had not defined formal risk appetites or governance
    frameworks for AI, and 28% of respondents were confident in their teams' ability to audit AI risks (OPTRO-FOF-2025).
    Organisations look to internal audit for guidance on AI while many internal auditors are not AI experts
    (IIA-AIFRAMEWORK-2024).
  solution: >-
    The IIA framework (updated 13 Sep 2024 to cover generative AI and large language models) gives internal auditors a
    principles-based structure, linked to the Three Lines Model, to assess AI strategy and governance maturity,
    identify AI risks, evaluate controls over data, algorithms and cybersecurity, and provide assurance over
    AI-enabled processes, with a practitioner checklist; the auditor may act as adviser or assurance provider and may
    need outside technical resources (IIA-AIFRAMEWORK-2024). COSO's February 2026 publication groups GenAI use into
    eight capability types with minimum control expectations, illustrative metrics and starter templates such as risk
    matrices and control-testing procedures (COSO-GENAI). EY recommends that chief audit executives explicitly
    include AI systems with ICFR impact in the audit universe, with scope following where judgement occurs
    (EY-COSO-2026). A Cherry Bekaert podcast covers what an AI audit scope should include, from training data to
    cybersecurity and user behaviour (CBH-POD-2025).
  outcomes:
    - lever: risk
      description: "Internal audit leaders confident in their teams' ability to audit AI risks"
      figure: "28%"
      measures: "respondents to the 2026 Focus on the Future survey of internal audit leaders (US, Canada, Germany, UK, EU); sample size not stated on the page read"
      provenance: vendor-published
      source_ref: OPTRO-FOF-2025
  prerequisites:
    - "An AI inventory and strategy to audit against (IIA-AIFRAMEWORK-2024)"
    - "Control owners for each capability type (COSO-GENAI)"
  risks_and_guardrails:
    - "The IIA framework is guidance, not a mandatory standard; no AI-specific IIA Topical Requirement appears in Baker Tilly's list of those issued or planned (BAKERTILLY-IA-2026)."
    - "The IIA checklist is a quick-start guide to be customised to organisational maturity (IIA-AIFRAMEWORK-2024)."
    - "KPMG notes the COSO publication is guidance for applying the 2013 framework, not a new framework or a complete list of risks and controls (KPMG-COSO-2026)."
  human_checkpoints:
    - "Chief audit executive decides the advisory versus assurance posture (IIA-AIFRAMEWORK-2024)"
    - "A named human reviewer for AI-assisted audit work (BAKERTILLY-IA-2026)"
  role_evolution: >-
    Richard Chambers writes that internal auditors who cannot use or understand AI will struggle to advise on its risks,
    an "AI credibility gap" (OPTRO-FOF-2025). The IIA says internal auditors are not expected to be experts on every audit
    topic and may need outside technical resources for aspects such as deciphering algorithms (IIA-AIFRAMEWORK-2024). Baker Tilly suggests a 70/20/10
    training model (BAKERTILLY-IA-2026).
  evidence_grade: C
  sources:
    - {ref: IIA-AIFRAMEWORK-2024, title: "The IIA's Artificial Intelligence Auditing Framework", publisher: "The IIA", type: professional-body, url: "https://www.theiia.org/en/content/tools/professional/2023/the-iias-updated-ai-auditing-framework/", date: "2024-09-13", access: full, locator: "public page; English PDF (aiframework-sept-2024-update2.pdf, linked from the page) introduction and printed p. 14 'Challenges'"}
    - {ref: OPTRO-FOF-2025, title: "Top takeaways from 2026 Focus on the Future", publisher: "Optro (Richard Chambers)", type: vendor, url: "https://optro.ai/blog/top-takeaways-from-2026-focus-on-the-future", date: "2025-11-12", access: full, locator: "section 2, 'The gap grows between AI assurance expectations and internal audit readiness'"}
