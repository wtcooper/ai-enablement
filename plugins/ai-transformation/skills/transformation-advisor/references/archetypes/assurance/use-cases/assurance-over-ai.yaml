    - {ref: EY-COSO-2026, title: "COSO 2026 and the shift in AI governance", publisher: "EY", type: firm, url: "https://www.ey.com/en_us/cro-risk/coso-2026-and-the-shift-in-ai-governance", date: "2026-06-24", access: full, locator: "internal audit section on audit universe and judgement"}
    - {ref: KPMG-COSO-2026, title: "COSO releases GenAI roadmap", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/frv/pdf/2026/coso-releases-gen-ai-roadmap.pdf", date: "2026-05-01", access: full, locator: "pp. 2-3"}
    - {ref: CBH-POD-2025, title: "Auditing AI: the role of internal audit", publisher: "Cherry Bekaert", type: podcast, url: "https://www.cbh.com/insights/podcasts/auditing-ai-internal-audits-expanding-role", date: "2025-05-30", access: full, locator: "show notes (audio not heard)"}
    - {ref: BAKERTILLY-IA-2026, title: "Strategy in motion: internal audit's 2026 execution mandate", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/internal-audit-2026-execution-mandate", date: "2026-04-10", access: full, locator: "sections 3 and 4"}
  last_reviewed: "2026-10-17"
  notes: >-
    No named internal audit function reports applying the framework or the taxonomy, so maturity is emerging. Grade
    C: vendor-published survey and guidance. Baker Tilly describes the March 2026 IIA Great Audit Minds conference
    as a tipping point from AI experiments to execution.

- id: assurance-assurance-over-ai-11
  title: "Idea: continuous, AI-assisted assurance over AI systems instead of an annual audit cycle"
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    A summary of Genpact's CAE Forum (26 Mar 2026) says annual audit plans cannot keep pace with continuously changing AI
    systems and boards want ongoing assessments (GENPACT-CAE-2026). EY's SOC conference says risk assessment cannot be a
    static or annual exercise, and that AI systems drift and agents may rewrite themselves and change behaviour to work
    around anomalies (EY-SOC-2026).
  solution: >-
    Move from point-in-time assessment to continuous monitoring with real-time dashboards and dynamic audit planning
    (GENPACT-CAE-2026). EY conference speakers said AI can monitor AI system performance and detect problems such as
    drift early, and that organisations should start with simple automations in controlled environments before
    multi-agent set-ups under close oversight (EY-SOC-2026). AIUC-1's quarterly agent re-testing (see -19) is one live
    example of the cadence (FIELDGUIDE-AIUC1-2026).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: EY-SOC-2026
  prerequisites:
    - "An AI inventory and agreed risk indicators (GENPACT-CAE-2026)"
    - "Governance in place before multi-agent automation (EY-SOC-2026)"
  risks_and_guardrails:
    - "In an EY conference poll, 71% of participants rated their risk-management maturity 7 or lower out of 10; poll size not stated (EY-SOC-2026)."
    - "EY leaders say AI may invent details and fill in blanks even when told not to, so human oversight stays necessary (EY-SOC-2026)."
  human_checkpoints:
    - "Human oversight of AI-generated outputs and processes (EY-SOC-2026)"
  role_evolution: >-
    The Genpact forum summary says CAEs need data scientists and AI ethics specialists on their teams
    (GENPACT-CAE-2026).
  evidence_grade: D
  sources:
    - {ref: GENPACT-CAE-2026, title: "Evolving AI governance demands new oversight and audit strategies (summary of Genpact CAE Forum, 2026-03-26)", publisher: "welcome.ai", type: press, url: "https://www.welcome.ai/content/evolving-ai-governance-demands-new-oversight-and-audit-strategies", date: "2026-09-11", access: full, locator: "paragraphs on continuous assurance"}
    - {ref: EY-SOC-2026, title: "How AI assurance builds trust with SOC, attestation and certification", publisher: "EY", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09", access: full, locator: "sections 'Managing AI risks through continuous assurance' and 'How AI improves SOC reporting'"}
    - {ref: FIELDGUIDE-AIUC1-2026, title: "Fieldguide becomes first AI platform for audit and advisory to achieve AIUC-1 certification", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/fieldguide-first-aiuc-1-certification", date: "2026-05-06", access: full, locator: "paragraph 3"}
  last_reviewed: "2026-10-17"
  notes: >-
    Idea, as practitioners discuss it; no measured use found. The Genpact summary is an AI-generated aggregator page
    (low authority); the original Genpact material was not reached.

- id: assurance-assurance-over-ai-12
  title: Scope an AI assessment engagement as a governance, conformity or performance assessment, and say which in the report
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Terms such as "assurance", "audit", "certification" and "conformity assessment" are at times used interchangeably
    for different AI assessments (ACCA-EY-2025), and the number and variety of approaches is challenging
    (EY-AIASSESS-2025). A Caseware
    executive says her firm calls its output an "evaluation report" because misusing the term "assurance" can be a
    problem in some jurisdictions (JOFA-EVAL).
  solution: >-
    The ACCA and EY paper describes three types: governance assessments of internal oversight, conformity assessments
    against laws and standards, and performance assessments against predefined metrics, ranging from technical
    evaluations to traditional assurance and audits (CPAPA-ACCAEY-2025; SFN-ACCAEY-2025). EY recommends that each
    assessment state what is assessed, use a clear methodology and suitable criteria, and be done by a suitably
    qualified provider, and notes some assessments give explicit opinions while others give only a summary of
    procedures (EY-AIASSESS-2025). AICPA and Caseware voices say scope and criteria are negotiated ("scope
    negotiation") because no comprehensive framework exists, and an AICPA senior manager expects functionality
    engagements to be likelier at the developer and governance engagements at the deployer (JOFA-EVAL).
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: CFOTECH-ACCAEY-2025
  prerequisites:
    - "A clear purpose and criteria for each assessment (CFOTECH-ACCAEY-2025)"
  risks_and_guardrails:
    - "The ACCA and EY paper says current assessment frameworks lack robustness and calls for well-specified objectives, defined methods and criteria, and competent, objective and accountable providers (CFOTECH-ACCAEY-2025)."
    - "Buyers need to read the report type, because only some assessments give an explicit opinion (EY-AIASSESS-2025)."
  human_checkpoints:
    - "Practitioner scoping, criteria selection and opinion (JOFA-EVAL)"
  role_evolution: >-
    EY's Americas assurance chief technology officer describes a "two-in-the-box" model in which an AI auditor and an IT
    professional assess risk together (JOFA-EVAL).
  evidence_grade: C
  sources:
    - {ref: EY-AIASSESS-2025, title: "How AI assessments can enhance confidence in AI (written with ACCA)", publisher: "EY", type: firm, url: "https://www.ey.com/en_ca/insights/public-policy/how-ai-assessments-can-enhance-confidence-in-ai", date: "2025-08-27", access: full, locator: "sections 'Understanding the AI assessment landscape' and 'Next steps for business leaders'; date from page JSON-LD"}
    - {ref: CPAPA-ACCAEY-2025, title: "EY and ACCA Share New Guidance on AI Assessments to Boost Confidence in AI Systems", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=166602", date: "2025-08-04", access: full, locator: "article body"}
    - {ref: CFOTECH-ACCAEY-2025, title: "EY & ACCA urge trustworthy AI with robust assessment frameworks", publisher: "CFOtech UK", type: press, url: "https://cfotech.co.uk/story/ey-acca-urge-trustworthy-ai-with-robust-assessment-frameworks", date: "2025-08-05", access: full, locator: "section 'Types of assessments'; EY quote"}
    - {ref: SFN-ACCAEY-2025, title: "ACCA and EY share new guidance to help businesses boost confidence in AI", publisher: "Scottish Financial News", type: press, url: "https://www.scottishfinancialnews.com/articles/acca-and-ey-share-new-guidance-to-help-businesses-boost-confidence-in-ai", date: "2025-08-05", access: full, locator: "article body"}
    - {ref: ACCA-EY-2025, title: "AI Assessments: Enhancing Confidence in AI (policy paper)", publisher: "ACCA and EY", type: professional-body, url: "https://www.accaglobal.com/content/dam/gb/policy-and-insights/reports/2025/ai-assessments-enhancing-confidence.pdf", date: "2025-08", access: full, locator: "p. 6 executive summary (three assessment types; challenges); footnote 3 on terminology"}
    - {ref: JOFA-EVAL, title: "A new frontier: CPAs as AI system evaluators", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/nov/a-new-frontier-cpas-as-ai-system-evaluators/", date: "2025-11-01", access: full, locator: "sections 'What's an AI audit?' and 'Risk profiles in AI evaluations'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade C: a taxonomy from a professional body and a firm that sells assessments; no named engagement. The ACCA/EY
    paper was read in full.

- id: assurance-assurance-over-ai-13
  title: AI governance readiness and gap assessment against ISO/IEC 42001 and the NIST AI RMF
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Clients adopting AI need to know where their governance falls short of a benchmark standard before an auditor,
    certifier or customer asks (DELOITTE-42001-2025).
  solution: >-
    Deloitte UK describes a five-pillar framework (governance, data management, modelling and development,
    pre-deployment evaluation, deployment and operation) aligned to ISO/IEC 42001, with "no-regret" steps such as an AI
    governance committee, an AI system inventory and risk or impact assessments (DELOITTE-42001-2025); its AI Assurance
    page offers third-party challenge over AI risk, governance and control maturity, including certification readiness
    (DELOITTE-AIA-UK-2026). A Deloitte Singapore AI Assurance posting (25 Jun 2026) shows the work being staffed:
    consultants apply the Trustworthy AI methodology, document bias, fairness, transparency, robustness, security and
    privacy risks, maintain client AI risk registers, and support gap analyses and remediation roadmaps
    (DELOITTE-JOB-SG-2026). KPMG Nederland offers AI governance support, gap analyses and readiness scans alongside its
    AI Assurance service (KPMGNL-AI-2025).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: DELOITTE-42001-2025
  prerequisites:
    - "An AI system inventory and policy baseline at the client (DELOITTE-42001-2025)"
    - "Staff who can apply the firm's Trustworthy AI methodology against frameworks such as the NIST AI RMF and ISO/IEC 42001; familiarity with ISO/IEC 42001, ISO 31000 or ISO 27001 is an advantage, not a requirement (DELOITTE-JOB-SG-2026)"
  risks_and_guardrails:
    - "Readiness work is advisory, not assurance: a BSI accredited body does not certify a management system that another part of BSI consulted on (BSI-ANAB-2026)."
    - "Selling readiness to an audit client raises independence questions; see the acceptance-independence module (KPMGUS-ISO-2025)."
  human_checkpoints:
    - "Senior consultants review risk and quality reports (DELOITTE-JOB-SG-2026)"
  role_evolution: >-
    The Singapore posting is titled for 2-4 years of experience (its requirements say 2-3) and expects consultants to
    deepen knowledge of AI regulations and frameworks (EU AI Act, NIST AI RMF, Singapore's model framework) on the job
    (DELOITTE-JOB-SG-2026).
  evidence_grade: C
  sources:
    - {ref: DELOITTE-42001-2025, title: "Navigating AI Assurance: Spotlight on ISO/IEC 42001 standard", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/uk/en/services/audit/blogs/navigating-ai-assurance-spotlight-on-iso-iec.html", date: "2025-10-07", access: full, locator: "sections 'Deloitte's Five-Pillar AI Framework' and 'No-Regret Steps'"}
    - {ref: DELOITTE-AIA-UK-2026, title: "AI Assurance for Responsible and Scalable AI Adoption", publisher: "Deloitte UK", type: firm, url: "https://www.deloitte.com/uk/en/services/audit-assurance/services/ai-assurance.html", date: "2026-07-02", access: full, locator: "pillars list; date from page JSON-LD"}
    - {ref: DELOITTE-JOB-SG-2026, title: "A&A - SG - AI Assurance (Consultant / Senior Consultant)", publisher: "Deloitte Singapore (via Monster Thailand)", type: job-posting, url: "https://www.monster.co.th/job/a-a-sg-ai-assurance-deloitte-singapore-53507371", date: "2026-06-25", access: full, locator: "'Work you'll do' and requirements; datePosted 25-06-2026 in page data; posting marked closed"}
    - {ref: KPMGNL-AI-2025, title: "KPMG Nederland voegt AI Assurance toe aan haar Responsible AI-aanbod (press release, Dutch)", publisher: "KPMG Nederland", type: firm, url: "https://kpmg.com/nl/nl/home/media/press-releases/2025/09/kpmg-start-met-onafhankelijke-controles-van-ai-systemen.html", date: "2025-09-23", access: full, locator: "sections on components of the offer"}
    - {ref: BSI-ANAB-2026, title: "BSI secures ANAB accreditation to certify ISO/IEC 42001", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-US/insights-and-media/media-center/press-releases/2026/march/bsi-secures-anab-accreditation-to-certify-isoiec-42001/", date: "2026-03-10", access: full, locator: "'Our Accreditation' footer"}
    - {ref: KPMGUS-ISO-2025, title: "KPMG LLP Among First of the Big Four in the U.S. to Receive ISO 42001 AI Certification", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/media/news/kpmg-receives-iso-ai-certification.html", date: "2025-11-18", access: full, locator: "closing disclaimer on services not permissible for audit clients"}
  last_reviewed: "2026-10-17"
  notes: >-
    Evidence is service descriptions and a staffing posting (in-production because Deloitte is staffing the work);
    no named client. Deloitte NL and South Africa postings seen in search did not render.

- id: assurance-assurance-over-ai-14
  title: Reasonable-assurance opinion over an organisation's AI governance and controls (ISAE (UK) 3000, "SOC 2+" criteria)
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Customers, boards and procurement teams cannot see whether a supplier's AI is governed in practice rather than only
    on paper (KPMGUK-GOVAI-2026). EY's SOC conference says "trust me" is not enough and customers want tested evidence
    (EY-SOC-2026). KPMG's paper says no prescriptive regulatory framework mandates external AI assurance
    (K-UKCA).
  solution: >-
    KPMG UK combines its Trusted AI framework, controls assurance skills and SOC principles to give an independent
    assurance opinion on AI governance and controls under ISAE (UK) 3000, testing whether controls are clearly defined,
    suitably designed (against the Trust Services Criteria, informed by its Trusted AI framework, which it says
    incorporates relevant EU AI Act and ISO/IEC 42001 requirements) and operating effectively, with a report the client
    can share with customers (KPMGUK-GOVAI-2026). KPMG's January 2026 paper calls the approach "SOC 2+", says it gives
    reasonable assurance, and describes scoping the AI estate, readiness, testing controls, examining evidence and a
    formal opinion (K-UKCA). CSA launched STAR for AI and in March 2026 published guidelines for CPAs
    providing SOC 2+ attestation for it (CSA-STARAI-2025; CSA-CPAGUIDE-2026). Baker Tilly shows how AI controls can map
    to each element of the SOC 2 Trust Services Criteria (BAKERTILLY-SOC2-2025).
  outcomes:
    - lever: growth
      description: "KPMG UK states, from its own experience, that AI assurance is increasingly requested and assessed by procurement and supplier-risk teams"
      figure: "none published"
      measures: "qualitative statement by the provider; no count of requests, clients or reports"
      provenance: self-reported
      source_ref: KPMGUK-GOVAI-2026
  prerequisites:
    - "An AI governance control framework with ownership, escalation and lifecycle management (KPMGUK-GOVAI-2026)"
    - "An AI inventory so systems are traceable and monitored, and an AI strategy as the basis for criteria (K-UKCA)"
    - "Suitable criteria: the AICPA has published no AI-specific Trust Services Criteria, so auditors build ad hoc evidence requests (CSA-SOC2)"
  risks_and_guardrails:
    - "The IAASB says questions remain about subject matter and suitable criteria for AI assurance and whether ISAE 3000 (Revised) suffices; it is only gathering information (IAASB-CATALOG-2026)."
    - "EY says attestation is harder for AI because AI is not a series of control points; it spans data, models, platforms, applications and operations (EY-SOC-2026)."
    - "KPMG notes key risks in AI-enabled services often sit at application, workflow, oversight and third-party layers, not only the model (KPMGUK-GOVAI-2026)."
    - "The chair of an AICPA SOC working group warned that 'fast and easy' SOC services, pushed by tool-vendor marketing, may come at the expense of quality and objectivity (JOFA-FAST)."
    - "KPMG US material notes some services may not be permissible for KPMG audit clients; independence is covered in the acceptance-independence module (KPMGUS-ISO-2025)."
  human_checkpoints:
    - "Practitioner judgement in scoping and criteria selection (JOFA-EVAL)"
    - "The practitioner tests controls and examines evidence before a formal assurance opinion (K-UKCA)"
  role_evolution: >-
    SOC and controls-assurance teams extend into AI governance engagements; KPMG describes a team that tests, examines
    evidence and reports on management's process, controls and claims on responsible AI (K-UKCA).
  evidence_grade: C
  sources:
    - {ref: KPMGUK-GOVAI-2026, title: "Independent confidence in how you govern AI (AI Governance Assurance)", publisher: "KPMG UK", type: firm, url: "https://kpmg.com/uk/en/insights/audit/independent-confidence-in-how-you-govern-ai.html", date: "2026-09-22", access: full, locator: "sections 'Make AI Trust Stand Up to Scrutiny', 'Regulation' and 'Differentiate in the market'; date from page metadata"}
    - {ref: K-UKCA, title: "Reimagining Controls Assurance with AI: Latest Insights for Leaders", publisher: "KPMG UK", type: firm, url: "https://assets.kpmg.com/content/dam/kpmgsites/uk/pdf/2026/01/reimagining-controls-assurance-with-ai.pdf.coredownload.inline.pdf", date: "2026-01", access: full, locator: "PDF p. 2 partner note ('introducing a reasonable-assurance opinion'); pp. 7-8 'Assurance of AI'"}
    - {ref: EY-SOC-2026, title: "How AI assurance builds trust with SOC, attestation and certification", publisher: "EY", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/en-gl/services/technology-risk/documents/ey-gl-soc-reporting-attestation-conference-highlights-09-2026.pdf", date: "2026-09", access: full, locator: "section 'How attestation and certification strengthen AI assurance'"}
    - {ref: CSA-STARAI-2025, title: "Cloud Security Alliance launches STAR for AI", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/press-releases/2025/10/23/cloud-security-alliance-launches-star-for-ai-establishing-the-global-framework-for-responsible-and-auditable-artificial-intelligence", date: "2025-10-23", access: full, locator: "paragraphs 'Two foundational components'"}
    - {ref: CSA-CPAGUIDE-2026, title: "Guidelines for CPAs providing CSA STAR or STAR for AI attestation program", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/artifacts/guidelines-for-cpas-providing-csa-star-or-star-for-ai-attestation-program", date: "2026-03-05", access: full, locator: "landing page description (document not downloaded)"}
    - {ref: BAKERTILLY-SOC2-2025, title: "Representing AI controls in your SOC 2 report", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/ai-controls-for-soc-2-reports", date: "2025-12-18", access: full, locator: "sections on risk categories and TSC mapping"}
    - {ref: CSA-SOC2, title: "The SOC 2 AI gap: auditors improvise where AICPA has not acted", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-soc2-ai-controls-gap-20260830-csa-styled/", date: "2026-08-30", access: full, locator: "Key Takeaways"}
    - {ref: IAASB-CATALOG-2026, title: "Technology Catalog: Catalog of Technology-Related Matters and Preliminary Direction on Actions, Version 3", publisher: "IAASB", type: standard-setter, url: "https://ifacweb.blob.core.windows.net/publicfiles/2026-07/IAASB-Technology-Catalog-of-Issues-Proposed-Actions.pdf", date: "2026-07-09", access: full, locator: "p. 14, matter 10(b) AI assurance"}
    - {ref: JOFA-FAST, title: "Promises of 'fast and easy' threaten SOC credibility", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/feb/promises-of-fast-and-easy-threaten-soc-credibility/", date: "2026-02-01", access: full, locator: "opening quotes"}
    - {ref: KPMGUS-ISO-2025, title: "KPMG LLP Among First of the Big Four in the U.S. to Receive ISO 42001 AI Certification", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/media/news/kpmg-receives-iso-ai-certification.html", date: "2025-11-18", access: full, locator: "closing disclaimer"}
    - {ref: JOFA-EVAL, title: "A new frontier: CPAs as AI system evaluators", publisher: "Journal of Accountancy (AICPA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/nov/a-new-frontier-cpas-as-ai-system-evaluators/", date: "2025-11-01", access: full, locator: "section 'What's an AI audit?'"}
  last_reviewed: "2026-10-17"
  notes: >-
    Announced: KPMG's January 2026 paper says it is "introducing" the opinion, and no issued report, named client or
    opinion wording was found. The web page says "independent assurance opinion"; the paper says reasonable
    assurance. The KPMG UK paper's ~18% testing-time figure concerns AI used to perform controls assurance and is
    covered in controls-testing (assurance-controls-testing-11).

- id: assurance-assurance-over-ai-15
  title: ISO/IEC 42001 certification of an AI management system by an accredited certification body
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Customers, banks and defence buyers want evidence that an AI developer's governance works but cannot inspect the
    vendor's models or pipelines directly (CSA-AIASSURE-2026; BSI-UMONY-2026). ISO/IEC 42001 certifies a management
    system, not individual AI systems (HUMANITIX-BABL-2026).
  solution: >-
    A certification body audits the organisation's AI management system against ISO/IEC 42001. BSI's Umony case
    describes scoping, a specialist pre-assessment by AI-experienced auditors, targeted training, and a two-stage audit
    focused on risk assessment, impact assessment, controls and evidence (BSI-UMONY-2026); its Accelleo case describes
    achieving ISO/IEC 27001 and 42001 together under the Annex SL structure (BSI-ACCELLEO-2026). The CSA note describes a
    two-stage initial audit followed by annual surveillance audits over a three-year certificate cycle
    (CSA-AIASSURE-2026). Schellman became the first ANAB-accredited body after an eight-month process in which ANAB
    watched its audits of two AI companies, Evisort and StackAware; its CEO expected 42001 to be usually bundled with other
    certifications such as ISO/IEC 27001 (SCHELLMAN-AT-2024). Anthropic, Sierra and Zendesk posted ISO 42001
    certificates in the CSA STAR Registry (CSA-STARAI-2025), and Fieldguide says it holds the certification
    (FIELDGUIDE-AIUC1-2026).
  outcomes:
    - lever: growth
      description: "Schellman's CEO said the firm already had signed contracts with clients wanting ISO/IEC 42001 certification"
      figure: "26"
      measures: "signed client contracts for ISO/IEC 42001 certification at Schellman at the time of the interview (Oct 2024)"
      provenance: self-reported
      source_ref: SCHELLMAN-AT-2024
    - lever: growth
      description: "Organisations reporting steps to align with ISO/IEC 42001"
      figure: "26%"
      measures: "organisations that 'report taking steps to align with ISO/IEC 42001', per BSI research cited in its release; sample size and date not stated"
      provenance: vendor-published
      source_ref: BSI-ANAB-2026
    - lever: growth
      description: "Umony reports enhanced credibility in enterprise sales and supply-chain assurance (qualitative)"
      figure: "none published"
      measures: "qualitative claim on the certifier's own case-study page"
      provenance: vendor-published
      source_ref: BSI-UMONY-2026
  prerequisites:
    - "A defined AI management system scope, objectives and interfaces, with policies, roles, controls and KPIs across the AI lifecycle (BSI-UMONY-2026)"
    - "An accredited certification body; buyers are advised to check the accreditation body's register and scope, not just the certificate (CASRAI-42006-2026; CSA-AIASSURE-2026)"
  risks_and_guardrails:
    - "A BSI accredited body does not certify a client for a management system that another part of BSI consulted on (BSI-ANAB-2026)."
    - "Early certification rules reportedly asked firms to make algorithms transparent; Schellman's CEO says she pushed back because algorithms are proprietary (SCHELLMAN-AT-2024)."
    - "ISO/IEC 42006 was published about 19 months after ISO/IEC 42001 and is moving into national accreditation during 2026, so for roughly two years certificates were issued without an AI-specific certifier competence standard (CASRAI-42006-2026; CSA-AIASSURE-2026)."
    - "One guide notes the accredited bodies named in a single vendor tally (roughly a dozen) are far fewer than the organisations advertising certification services; the guide could not verify the roster (CASRAI-42006-2026)."
    - "The UK roadmap says the standards that could underpin certification are limited in number and scope (DSIT-ROADMAP-2025)."
  human_checkpoints:
    - "Certification-body auditors decide stage 1 and stage 2 outcomes; annual surveillance audits re-check the system (BSI-UMONY-2026; CSA-AIASSURE-2026)"
    - "Accreditation-body witness audits (SCHELLMAN-AT-2024)"
  role_evolution: >-
    Schellman, which began as a SOC audit firm (SCHELLMAN-AIUC1-2026), expanded into AI governance certification as
    clients planned major AI investments (SCHELLMAN-AT-2024). Certifiers use AI-experienced auditors for pre-assessment and audit (BSI-UMONY-2026), and
    secondary reporting says ISO/IEC 42006 assesses competence at audit-team level (CASRAI-42006-2026).
  evidence_grade: B
  sources:
    - {ref: BSI-UMONY-2026, title: "Umony achieves ISO/IEC 42001 certification for responsible AI (case study)", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-GB/insights-and-media/insights/case-studies/umony-achieves-isoiec-42001-certification-for-responsible-ai/", date: "2026", access: full, locator: "sections 'The Challenge' and 'The Solution'; page undated, retrieved 2026-10-16"}
    - {ref: BSI-ACCELLEO-2026, title: "Accelleo builds trusted defence AI with ISO/IEC 42001 (case study)", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-GB/insights-and-media/insights/case-studies/accelleo-builds-trusted-defence-ai-with-iso-iec-42001/", date: "2026", access: full, locator: "section 'The Solution'; page undated, retrieved 2026-10-16"}
    - {ref: SCHELLMAN-AT-2024, title: "Inside Schellman's journey to provide certification for ISO 42001 AI framework", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/inside-schellmans-journey-to-provide-certification-for-iso-42001-ai-framework", date: "2024-10-28", access: full, locator: "paragraphs on the eight-month ANAB process, Evisort and StackAware, 'Ready to meet demand', and bundling"}
    - {ref: BSI-ANAB-2026, title: "BSI secures ANAB accreditation to certify ISO/IEC 42001", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-US/insights-and-media/media-center/press-releases/2026/march/bsi-secures-anab-accreditation-to-certify-isoiec-42001/", date: "2026-03-10", access: full, locator: "release body; 'Our Accreditation' footer"}
    - {ref: CSA-AIASSURE-2026, title: "Who Assures the Assurers? Third-Party AI Assessment Standards (research note)", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-third-party-ai-assurance-standards-2026092/", date: "2026-09-27", access: full, locator: "'Background' section on the certification cycle"}
    - {ref: CASRAI-42006-2026, title: "ISO/IEC 42006 explained: who is allowed to certify ISO 42001", publisher: "CASRAI", type: community, url: "https://casrai.org/guides/iso-42006-explained-who-can-certify-iso-42001", date: "2026-09-25", access: full, locator: "sections 'The 2024-2026 accreditation record' and 'How to check an ISO 42001 certificate'"}
    - {ref: CSA-STARAI-2025, title: "Cloud Security Alliance launches STAR for AI", publisher: "Cloud Security Alliance", type: professional-body, url: "https://cloudsecurityalliance.org/press-releases/2025/10/23/cloud-security-alliance-launches-star-for-ai-establishing-the-global-framework-for-responsible-and-auditable-artificial-intelligence", date: "2025-10-23", access: full, locator: "paragraph 'STAR for AI Level 2'"}
    - {ref: FIELDGUIDE-AIUC1-2026, title: "Fieldguide becomes first AI platform for audit and advisory to achieve AIUC-1 certification", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/blog/fieldguide-first-aiuc-1-certification", date: "2026-05-06", access: full, locator: "final paragraph before quotes"}
    - {ref: HUMANITIX-BABL-2026, title: "AI Assurance in Practice: providing trust beyond AI governance certifications", publisher: "ISACA Melbourne Chapter", type: conference, url: "https://events.humanitix.com/july-2026-emerging-technologies-working-group", date: "2026-07-16", access: full, locator: "event description"}
    - {ref: DSIT-ROADMAP-2025, title: "Trusted third-party AI assurance roadmap", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/trusted-third-party-ai-assurance-roadmap/trusted-third-party-ai-assurance-roadmap", date: "2025-09-03", access: full, locator: "section on accreditation, limitations paragraph"}
    - {ref: SCHELLMAN-AIUC1-2026, title: "Schellman Becomes the First Accredited Auditor for AIUC-1, the Security Standard for AI Agents", publisher: "Schellman", type: firm, url: "https://www.schellman.com/blog/news/schellman-becomes-the-first-accredited-auditor-for-aiuc-1", date: "2026-02-03", access: full, locator: "site navigation ('Schellman began as a SOC audit firm 20+ years ago')"}
  last_reviewed: "2026-10-17"
  notes: >-
    Graded B, not A: the Schellman figure counts demand at one certifier in 2024, not an outcome of certification,
    and no certificate count exists. The CSA note cites market data of six to twelve months and tens of thousands of
    dollars in fees for a first certification (four to six months with an existing ISO/IEC 27001 certificate) from a
    consultancy blog nobody opened; not used as an outcome.

- id: assurance-assurance-over-ai-16
  title: Accredit and oversee AI management system certifiers against ISO/IEC 42006
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A certificate is only as trustworthy as the body that issues it, and the CSA note assesses that the AI assurance
    supplier base is growing faster than accreditation can vet entrants (CSA-AIASSURE-2026).
  solution: >-
    ISO/IEC 42006 sets additional requirements, on top of ISO/IEC 17021-1, for bodies that audit and certify AI
    management systems, aimed at certification bodies and the accreditation bodies that assess them (EVS-42006-2025). A
    compliance vendor reports that it requires collective audit-team competence across AI, management systems,
    auditing, AI governance and relevant law, and a calculated minimum audit time with documented deviations, and
    reports a European accreditation decision of 20 Nov 2025 to make it mandatory (BRIGHT-42006-2026). BSI announced
    ANAB accreditation for ISO/IEC 42001 on 10 Mar 2026, adding to UKAS and RvA, and describes itself as the first
    certifier holding all three (BSI-ANAB-2026). The UK roadmap says UKAS was piloting accreditation for ISO/IEC 42001
    certification and that accredited management-system certification may be the most feasible near-term quality route
    (DSIT-ROADMAP-2025).
  outcomes:
    - lever: risk
      description: "BSI holds accreditation for ISO/IEC 42001 certification from three national accreditation bodies"
      figure: "3"
      measures: "national accreditation bodies (ANAB, UKAS, RvA) that BSI says have accredited it to certify ISO/IEC 42001"
      provenance: self-reported
      source_ref: BSI-ANAB-2026
  prerequisites:
    - "ISO/IEC 17021-1 certification-body foundations (EVS-42006-2025)"
    - "Auditor competence in AI-specific areas such as data quality and transparency (EVS-42006-2025)"
  risks_and_guardrails:
    - "The CSA note says accreditation against the older general baseline alone does not guarantee AI-specific auditor competence (CSA-AIASSURE-2026)."
    - "'First' claims are self-described: Schellman says it was the first ANAB-accredited body for ISO 42001, BSI that it is the first with all three accreditations (SCHELLMAN-AIUC1-2026; BSI-ANAB-2026)."
    - "The 20 Nov 2025 accreditation decision and the competence and audit-time details come from a compliance vendor; the ISO text returned 403 (BRIGHT-42006-2026)."
  human_checkpoints:
    - "Accreditation bodies assess certifiers' competence, impartiality and consistency (BSI-ANAB-2026), including by witnessing audits the certifier performs (SCHELLMAN-AT-2024)"
  role_evolution: >-
    Certification bodies need auditors trained for AI and accreditation assessors who can judge them (EVS-42006-2025).
  evidence_grade: B
  sources:
    - {ref: EVS-42006-2025, title: "New international standard sets rules for auditing AI management systems (news item on ISO/IEC 42006)", publisher: "EVS (Estonian Centre for Standardisation and Accreditation), crediting IEC", type: standard-setter, url: "https://www.evs.ee/en/auditing-ai-management-systems", date: "2025-08-05", access: full, locator: "whole news item"}
    - {ref: BRIGHT-42006-2026, title: "ISO 42006 Raises the Bar for ISO 42001 Certifiers", publisher: "Bright Defense", type: vendor, url: "https://brightdefense.com/news/iso-42006-raises-the-bar-for-iso-42001-certifiers", date: "2026-09-14", access: full, locator: "sections 'What Competence Does ISO 42006 Require' and on audit time; European accreditation vote of 20 Nov 2025"}
    - {ref: BSI-ANAB-2026, title: "BSI secures ANAB accreditation to certify ISO/IEC 42001", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-US/insights-and-media/media-center/press-releases/2026/march/bsi-secures-anab-accreditation-to-certify-isoiec-42001/", date: "2026-03-10", access: full, locator: "first two paragraphs"}
    - {ref: DSIT-ROADMAP-2025, title: "Trusted third-party AI assurance roadmap", publisher: "UK Department for Science, Innovation and Technology", type: regulator, url: "https://www.gov.uk/government/publications/trusted-third-party-ai-assurance-roadmap/trusted-third-party-ai-assurance-roadmap", date: "2025-09-03", access: full, locator: "accreditation section"}
    - {ref: CSA-AIASSURE-2026, title: "Who Assures the Assurers? Third-Party AI Assessment Standards (research note)", publisher: "Cloud Security Alliance Labs", type: professional-body, url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-third-party-ai-assurance-standards-2026092/", date: "2026-09-27", access: full, locator: "'Key Takeaways' and 'Security Analysis'"}
    - {ref: SCHELLMAN-AIUC1-2026, title: "Schellman Becomes the First Accredited Auditor for AIUC-1, the Security Standard for AI Agents", publisher: "Schellman", type: firm, url: "https://www.schellman.com/blog/news/schellman-becomes-the-first-accredited-auditor-for-aiuc-1", date: "2026-02-03", access: full, locator: "quote by Avani Desai"}
    - {ref: SCHELLMAN-AT-2024, title: "Inside Schellman's journey to provide certification for ISO 42001 AI framework", publisher: "Accounting Today", type: press, url: "https://accountingtoday.com/news/inside-schellmans-journey-to-provide-certification-for-iso-42001-ai-framework", date: "2024-10-28", access: full, locator: "paragraphs on ANAB watching Schellman's audits of Evisort and StackAware"}
  last_reviewed: "2026-10-17"
  notes: >-
    Grade B: named accreditations announced by the accredited body itself; no measurements. ISO/IEC 42006 was
    published on 7 Jul 2025 (CASRAI; Bright Defense); the EVS item of 5 Aug 2025 is a later news report. No
    AI-drafting disclaimer was found on the CSA note's page when it was checked on 2026-10-17; CSA claims are still
    used only with attribution, because CSA runs competing assurance schemes.

- id: assurance-assurance-over-ai-17
  title: Audit firms certify their own AI management systems before selling AI assurance
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    A firm selling AI governance advice or assurance must show it holds itself to the same standard, and clients ask
    who has been through the process (KPMGINTL-ISO-2025).
  solution: >-
    Firms obtain ISO/IEC 42001 certification for their own AI systems from an accredited body and publicise it. KPMG
    LLP (US) announced its certification on 18 Nov 2025, naming Schellman Compliance as the certification body
    (KPMGUS-ISO-2025). KPMG International followed in December 2025 and said the Australia, Spain, India and USA firms
    were already certified (KPMGINTL-ISO-2025). SGS issued PwC Taiwan its ISO/IEC 42001 certificate (15 Jun 2026)
    (SGS-PWCTW-2026). Two EY Italian entities hold certificates: EY S.p.A. (first issued 23 Oct 2025 by Certiquality)
    and EY Advisory S.p.A. (decision of 20 Apr 2026 by ACM Cert) (EYIT-CERT-2025; EYIT-CERT-2026).
  outcomes:
    - lever: growth
      description: "Firms present the certificate as proof of experience and a basis to help clients with their own certification"
      figure: "none published"
      measures: "qualitative statements in firm and certifier releases"
      provenance: self-reported
      source_ref: KPMGINTL-ISO-2025
  prerequisites:
    - "An in-scope AI estate; KPMG International says certification gives member firms confidence to use tools such as KPMG Workbench and aIQ Chat (KPMGINTL-ISO-2025)"
    - "An accredited certification body independent of the firm's consulting arm (BSI-ANAB-2026)"
  risks_and_guardrails:
    - "Self-certification covers the firm's own management system and does not assure any client's AI (KPMGUS-ISO-2025)."
    - "Certificates have a defined scope; the EY Advisory certificate covers AI systems and AI-enabled services supporting client data handling and consulting services (EYIT-CERT-2026)."
  human_checkpoints:
    - "Certification-body audit and decision (KPMGUS-ISO-2025)"
  role_evolution: >-
    Firm AI governance teams become reference practitioners for client work; KPMG's US Trusted AI leader is quoted in
    the release (KPMGUS-ISO-2025).
  evidence_grade: B
  sources:
    - {ref: KPMGUS-ISO-2025, title: "KPMG LLP Among First of the Big Four in the U.S. to Receive ISO 42001 AI Certification", publisher: "KPMG US", type: firm, url: "https://kpmg.com/us/en/media/news/kpmg-receives-iso-ai-certification.html", date: "2025-11-18", access: full, locator: "release body; certification body named in the penultimate paragraph"}
    - {ref: KPMGINTL-ISO-2025, title: "KPMG International becomes first Big Four international entity to attain ISO 42001 certification for AI Management Systems", publisher: "KPMG International", type: firm, url: "https://kpmg.com/xx/en/media/press-releases/2025/12/kpmg-international-first-to-attain-iso-certification-for-ai-management-systems.html", date: "2025-12", access: full, locator: "paragraphs 1 and 4; day not on the page (URL path shows 2025/12)"}
    - {ref: SGS-PWCTW-2026, title: "PwC Taiwan Achieves ISO/IEC 42001 AI Management System Certification", publisher: "SGS", type: vendor, url: "https://www.sgs.com/en/news/2026/06/pwc-taiwan-achieves-iso-iec-42001-ai-management-system-certification", date: "2026-06-15", access: full, locator: "body text; 'Why SGS?'"}
    - {ref: EYIT-CERT-2025, title: "Certificate no. 72849, EY S.p.A., ISO/IEC 42001:2023", publisher: "Certiquality (published on ey.com)", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/it-it/campaigns/corporate-responsibilty/documents/ey-certificato-iso42001-eyspa-11-25.pdf", date: "2025-10-23", access: full, locator: "page 1, first issue and expiry (22 Oct 2028)"}
    - {ref: EYIT-CERT-2026, title: "Certificate IT26-08316, EY Advisory S.p.A., UNI CEI ISO/IEC 42001", publisher: "ACM Cert (published on ey.com)", type: firm, url: "https://www.ey.com/content/dam/ey-unified-site/ey-com/it-it/campaigns/corporate-responsibilty/documents/ey-eyadv-certificato-iso42001-4-26.pdf", date: "2026-04-20", access: full, locator: "page 1, decision date and scope"}
    - {ref: BSI-ANAB-2026, title: "BSI secures ANAB accreditation to certify ISO/IEC 42001", publisher: "BSI", type: vendor, url: "https://www.bsigroup.com/en-US/insights-and-media/media-center/press-releases/2026/march/bsi-secures-anab-accreditation-to-certify-isoiec-42001/", date: "2026-03-10", access: full, locator: "'Our Accreditation' footer"}
  last_reviewed: "2026-10-17"
  notes: >-
    A market-entry signal, not a client service. Deloitte's own certification status was not found. SGS described
    the PwC Taiwan certificate as the first ISO/IEC 42001 certificate it issued in Taiwan.

- id: assurance-assurance-over-ai-18
  title: Audit firms build AI assurance service lines, including firm-owned certification bodies and Big Four ISO/IEC 42001 offers
  archetype: assurance
  module: assurance-over-ai
  function: service-delivery
  work_types: [expert-judgment, client-interaction, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Realtid, summarising the Financial Times, reports that AI assurance has no clear standards, that quality ranges from
    superficial advice to technical reviews of single legal requirements, and that many providers are the developers
    themselves (REALTID-FT-2025).
  solution: >-
    In June 2025 press reports, Deloitte, EY, PwC and KPMG were said to be positioning to offer AI assurance as they had
    entered ESG assurance, and PwC UK's chief technology officer for audit said the firm already checks chatbot accuracy
    and bias (REALTID-FT-2025; CONSULTANCY-BIG4-2025). EY's 7 Apr 2026 release says its audit methodology underpins a
    suite of assurance services for audit and non-audit clients spanning AI diagnostics, governance, risk management and
    controls (EY-CANVAS-2026). EY Japan names EY CertifyPoint (Amsterdam) as EY's certification body offering
    certification for AI management systems, on a typical three-year cycle, alongside readiness services
    (EYJP-CERTIFYPOINT-2026). Trade coverage says PwC Canada launched an ISO/IEC 42001 certification solution on 16 Feb
    2026 and claims to be the first Big Four firm to offer accreditation services for the standard
    (CONSULTINGCA-PWC-2026). By September 2026 KPMG UK marketed an AI governance assurance product (KPMGUK-GOVAI-2026)
    and KPMG US framed assurance over AI systems as a "new mandate" (KPMG-SOX-2026).
  outcomes:
    - lever: growth
      description: "none published"
      figure: "none published"
      measures: "not applicable"
      source_ref: REALTID-FT-2025
  prerequisites:
    - "Teams that pair an AI auditor with an IT professional, which EY calls a 'two-in-the-box' model (JOFA-EVAL)"
    - "An accredited certification body kept separate from readiness consulting (BSI-ANAB-2026)"
  risks_and_guardrails:
    - "Press commentary raises liability if an assured system later causes harm, which slows even well-resourced firms (REALTID-FT-2025)."
    - "Consultancy.uk says the Big Four's partnerships with AI tool providers could raise independence questions, and EY offers its suite to audit clients; see the acceptance-independence module (CONSULTANCY-BIG4-2025; EY-CANVAS-2026)."
    - "EY Japan's page does not state ISO/IEC 42001 accreditation for CertifyPoint; do not assume it (EYJP-CERTIFYPOINT-2026)."
    - "PwC Canada's wording ('accreditation services', 'certification') leaves unclear whether it acts as an accredited certification body or as adviser (CONSULTINGCA-PWC-2026)."
  human_checkpoints:
    - "Partner sign-off on opinions and certification-body decisions (not described in the sources)"
  role_evolution: >-
    Deloitte audit partner Richard Tedder told the FT that companies and consumers will want assurance over AI used in
    critical functions, as quoted by Realtid (REALTID-FT-2025). Deloitte, Grant Thornton UK, KPMG and Forvis Mazars staff were scheduled to speak at ICAEW's AI
    Assurance Conference (6 Jul 2026) (ICAEW-AIAC-2026).
  evidence_grade: C
  sources:
    - {ref: REALTID-FT-2025, title: "Revisionsjattarna ser nasta kassako i AI-granskning (reporting the Financial Times)", publisher: "Realtid", type: press, url: "https://www.realtid.se/it-tech/revisionsjattarna-ser-nasta-kassako-i-ai-granskning/", date: "2025-06-04", access: full, locator: "sections 'Saknas tydliga standarder' and 'Processen med assurance gar langsamt'"}
    - {ref: CONSULTANCY-BIG4-2025, title: "Big Four weighing up new AI audit offerings", publisher: "Consultancy.uk", type: press, url: "https://www.consultancy.uk/news/40424/big-four-weighing-up-new-ai-audit-offerings", date: "2025-06-10", access: full, locator: "paragraphs 3-7"}
    - {ref: EY-CANVAS-2026, title: "EY launches enterprise-scale agentic AI to redefine the audit experience for the AI era", publisher: "EY", type: firm, url: "https://www.ey.com/en_ca/newsroom/2026/04/ey-launches-enterprise-scale-agentic-ai-to-redefine-the-audit-experience-for-the-ai-era", date: "2026-04-07", access: full, locator: "section 'Supporting organizations through their own transformation journeys'"}
