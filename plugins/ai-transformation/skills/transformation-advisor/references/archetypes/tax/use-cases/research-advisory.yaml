- id: tax-research-advisory-20
  title: Automated check that every cited authority exists and supports the point, before release
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - review-assurance
  pattern: full-population-testing
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Fabricated or misdescribed citations reach client memos and court filings, reviewers cannot spot a plausible citation
    by eye, and manual cite-checking of every authority is slow [TAXCT-CLINCO-2026].
  solution: >-
    A checker resolves every citation in a draft against authoritative sources and flags those that do not exist or do
    not support the stated proposition, for a person to clear. Damien Charlotin, who runs a database of hallucination
    decisions, offers an automated reference checker (PelAIkan) built on it [CHARLOTIN-DB-2026]. The Vals benchmark penalises
    answers whose cited sources do not resolve, which shows citation resolution can be tested mechanically [VALS-TAXAGENT-2026].
  outcomes:
  - lever: risk
    description: none published for tax memos; the checker has no published error rates
    figure: none published
    measures: not applicable
    provenance: vendor-published
    source_ref: CHARLOTIN-DB-2026
  prerequisites:
  - >-
    Access to authoritative sources to resolve citations against (Code, regulations, reporters, tribunal databases)
  - Policy requiring a verification log or second-reviewer cross-check [TAXCT-CLINCO-2026]
  risks_and_guardrails:
  - >-
    An existence check does not show the case supports the proposition; the UK tribunal in Zzaman found real cases that
    did not support the argument [ICAS-TAXTRIB-2026]
  - >-
    PelAIkan is built for legal decisions, not tax, and has no published performance figures [CHARLOTIN-DB-2026]
  - OPR says citations must be checked and cases read for written advice (s10.37) [IRS-OPR-2026]
  human_checkpoints:
  - A person clears every flagged citation and reads the authorities that carry the argument
  role_evolution: >-
    Verification becomes an explicit, logged step in the engagement file; OPR and PCRT both expect documented verification
    [IRS-OPR-2026; PCRT-AI-2026].
  evidence_grade: C
  sources:
  - ref: CHARLOTIN-DB-2026
