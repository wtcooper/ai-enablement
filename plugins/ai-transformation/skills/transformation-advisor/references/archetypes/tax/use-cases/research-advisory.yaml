- id: tax-research-advisory-05
  title: Knowledge assistant over the firm's or department's own memos, precedents and guidance
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Institutional tax knowledge sits in senior practitioners' heads and in scattered memos; vendors say it is lost as
    seniors retire and quality varies with staff experience [TR-AGENTICBLOG-2026]. Thomson Reuters markets its in-house
    product as removing the friction of managing research across multiple applications [TR-COCOUNSELCORP-2026].
  solution: >-
    An assistant answers from the organization's own memo library, guidance and policies alongside licensed content,
    so staff reuse prior positions consistently. Thomson Reuters lists retaining institutional knowledge and reducing
    variability in work quality as benefits of agentic research tools, and markets CoCounsel Tax for in-house teams with
    a Knowledge Base [TR-AGENTICBLOG-2026; TR-COCOUNSELCORP-2026]. KPMG put its tax knowledge management practice leader
    on a Bloomberg Tax forum panel on AI integration [BTAX-FORUM-2026].
  outcomes:
  - lever: quality
    description: none published
    figure: none published
    measures: not applicable
    provenance: vendor-published
    source_ref: TR-AGENTICBLOG-2026
  prerequisites:
  - Clean, access-controlled memo repository
  - Clear rules on which prior advice may be reused across clients (confidentiality)
  risks_and_guardrails:
  - >-
    Cross-client leakage: OPR warns that data generated for one client can be repurposed to answer an inquiry about another
    [IRS-OPR-2026]
  - >-
    Prior positions may be stale when law changes; Bloomberg Tax cites outdated guidance as a hallucination driver [BTAX-HALLUC-2026]
  human_checkpoints:
  - Reviewer confirms a retrieved precedent still reflects current law and fits the client's facts
  role_evolution: >-
    Thomson Reuters says agentic tools help firms retain institutional knowledge as senior practitioners retire and reduce
    variability across staff experience levels (vendor framing) [TR-AGENTICBLOG-2026]. KPMG's tax knowledge management
    practice leader was listed on a Bloomberg Tax forum AI panel [BTAX-FORUM-2026].
