    title: 'Instead for S Corporations (1120-S): AI Tax Agent'
    publisher: Instead
    type: vendor
    url: https://webflow.instead.com/products/s-corporation
    date: '2026-10-21'
    access: full
    locator: page undated, date is access date; 'Ready to run' workflows
  - ref: TR-COCOUNSELCORP-2026
    title: 'CoCounsel Tax: The AI tax assistant for in-house teams'
    publisher: Thomson Reuters
    type: vendor
    url: https://tax.thomsonreuters.com/en/products/cocounsel-tax/corp
    date: '2026-10-17'
    access: full
    locator: page undated, date is first access date (re-read 2026-10-21); 'Analyze transactions and restructuring scenarios'
