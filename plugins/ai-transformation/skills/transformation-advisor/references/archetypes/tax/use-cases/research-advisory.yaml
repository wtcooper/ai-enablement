  last_reviewed: '2026-10-21'
  notes: >-
    Added 2026-10-21 for mid-market firms. Maturity is piloting, not in-production, because the survey's 2% and 5%
    figures count planning-review tools, which are not all AI. CCH Axcess Advisor's general-availability date (13 May
    2026) appeared only in a search summary and is not used. In the Thomson Reuters survey "midsize" means 4 to 29
    professionals and "large" 30 or more, smaller than the mid-market firms this archetype describes. The
    Thomson Reuters survey is marked vendor-published because the publisher sells tax and
    advisory software. Related: tax-research-advisory-23 (law-change monitoring), -09 (blueprints) and
    tax-compliance-individual-business-14 (look-back review of prior-year returns).

- id: tax-research-advisory-28
  title: Informed consent and verification rules for AI in estate planning (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - review-assurance
  - client-interaction
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Estate-planning professionals are adopting AI for research, drafting and summaries, and ACTEC Fellows say hundreds
    of attorneys and judges have been caught citing fabricated authority [ACTEC-AIVIDEO-2026].
  solution: >-
    Idea: tell clients the firm uses AI and how, obtain separate informed consent, verify every output against source,
    and build competence before adopting the tool. ACTEC Fellow Gerry Beyer says the American Bar Association and many
    local bars require telling clients and getting informed consent, and recommends a separately signed provision
    [ACTEC-AIVIDEO-2026]. A practitioner newsletter argues that competence must precede adoption, so a professional can
    do the task without the tool [SOE-COMPETENCE-2025]. The same author later wrote that AI will be best used to
    amplify bespoke services, not to replace them [SOE-STRATEGIC-2025].
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: not applicable
    provenance: self-reported
    source_ref: ACTEC-AIVIDEO-2026
  prerequisites:
  - Engagement terms with a separate AI-use consent clause
  - A section 7216 position for return information [CPAPA-SETTLE-2026]
  risks_and_guardrails:
  - >-
    A CPA Practice Advisor contributor says the IRS has not said whether sending return information to an AI tool is a
    disclosure needing consent [CPAPA-SETTLE-2026]
  - >-
    The same article says the regulations require consent to be knowing and voluntary and that conditioning services on
    it generally makes it involuntary, so the firm needs a non-AI path for clients who decline [CPAPA-SETTLE-2026]
  human_checkpoints:
  - Attorney or adviser verifies every AI output; consent is obtained before AI touches client data
  role_evolution: >-
    The newsletter author argues the firm of the future is distinguished by bespoke tools and by work outside the
    documents [SOE-STRATEGIC-2025].
  evidence_grade: D
  sources:
  - ref: ACTEC-AIVIDEO-2026
    title: How Artificial Intelligence Affects Estate Planning in 2026
    publisher: ACTEC Foundation
    type: professional-body
    url: https://actecfoundation.org/videos/how-artificial-intelligence-affects-estate-planning-in-2026/
    date: '2026-02-05'
    access: full
    locator: "transcript: 'Why AI Results Must Always Be Verified'; 'Client Consent and Attorney Obligations When Using AI'"
  - ref: SOE-COMPETENCE-2025
    title: 'AI in Estate Planning: Duties of Competence?'
    publisher: State of Estates (Griffin Bridgers)
    type: community
    url: https://griffinbridgers.substack.com/p/ai-in-estate-planning-duties-of-competence
    date: '2025-01-21'
    access: full
    locator: free preview section (paid article); older than 12 months
  - ref: SOE-STRATEGIC-2025
    title: 'AI in Estate Planning: Strategic Planning'
    publisher: State of Estates (Griffin Bridgers)
    type: community
    url: https://griffinbridgers.substack.com/p/ai-in-estate-planning-strategic-planning
    date: '2025-11-13'
    access: full
    locator: '''Opinion and Context'''
  - ref: CPAPA-SETTLE-2026
    title: What to Settle Before Client Tax Data Touches AI
    publisher: CPA Practice Advisor (contributor S. de la Fe)
    type: press
    url: https://www.cpapracticeadvisor.com/?p=191491
    date: '2026-10-12'
    access: full
    locator: section 'The consent question has no clean answer yet'
  last_reviewed: '2026-10-21'
  notes: >-
    Added 2026-10-21 for mid-market firms. Idea: a control practitioners recommend, not a deployment. The ABA
    position is stated by the ACTEC Fellow; the ABA source itself was not reachable (403). The return-preparation
    counterpart is tax-compliance-individual-business-21.
