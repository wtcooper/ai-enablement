- id: tax-research-advisory-18
  title: >-
    Triage of AI-generated tax answers and citations that clients, counterparties or opponents bring (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - client-interaction
  - review-assurance
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Clients increasingly ask a chatbot first and then act on, or bring, the answer to the adviser [CPAPA-FIRSTSTOP-2025].
    Counterparties and opponents send positions and citations that may be AI-generated and wrong; in several reported
    cases the tax authority or tribunal, not the filer, found the errors [ICAS-TAXTRIB-2026; TAXCT-CLINCO-2026].
  solution: >-
    Idea: run incoming material through the same citation and consistency checks used on the firm's own work, and counsel
    clients to ask AI for primary sources, assumptions and step-by-step calculations. In Clinco the IRS flagged the nonexistent
    cases in its answering brief; in Harber the tribunal and HMRC found nine cited decisions did not exist [TAXCT-CLINCO-2026;
    ICAS-TAXTRIB-2026]. CPA Practice Advisor recommends engagement-letter wording that limits the firm's responsibility
    to advice it gives directly [CPAPA-FIRSTSTOP-2025].
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: not applicable
    provenance: independent
    source_ref: ICAS-TAXTRIB-2026
  prerequisites:
  - A citation-resolution capability (see tax-research-advisory-20)
  - Engagement-letter language on AI and a standard intake question about client AI use
  risks_and_guardrails:
  - >-
    PCRT says members should exercise scepticism where client or third-party data may have been AI-generated [PCRT-AI-2026]
  - >-
    Tribunals treat the rest of a document with great caution once AI-generated flaws are found and not corrected [ICAS-TAXTRIB-2026]
  - >-
    The article says the IRS warns that an AI-advised mistake on a return still falls on the taxpayer [CPAPA-FIRSTSTOP-2025]
  human_checkpoints:
  - Adviser reviews flagged material and its sources before adopting any position or responding
  role_evolution: >-
    CPA Practice Advisor says CPAs should warn clients against using AI advice without scrutiny and clarify in engagement
    letters that their responsibility extends only to advice they give directly [CPAPA-FIRSTSTOP-2025].
  evidence_grade: D
