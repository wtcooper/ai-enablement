- id: tax-research-advisory-04
  title: Specialist multi-jurisdiction and state-by-state research workflow (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Multi-jurisdiction questions (for example comparing state pass-through entity tax credits, or 50-state surveys) are
    where tools do worst and where manual work is longest [VALS-VLAIR-2025; VALS-TAXAGENT-2026].
  solution: >-
    Idea: a purpose-built workflow searches each jurisdiction's primary law and compiles a comparison table for adviser
    review. Vals suggests a specialist workflow designed to search all 50 states' laws should yield much better results
    than basic prompts [VALS-VLAIR-2025].
  outcomes:
  - lever: quality
    description: >-
      Legal research study (adjacent): AI products scored lower on questions that required more than one jurisdiction's
      law
    figure: 14 points lower on average (14 multi-jurisdiction questions)
    measures: >-
      Difference in average score between multi-jurisdiction and single-jurisdiction questions, on average across study
      participants, in a 200-question legal research set
    provenance: independent
    source_ref: VALS-VLAIR-2025
  prerequisites:
  - Primary-law access across the jurisdictions in scope
  risks_and_guardrails:
  - >-
    On the Vals tax benchmark's public state-tax question, twelve of eighteen models scored 0, eleven of them failing the
    same must-pass check on New York's treatment of PTET credits from more than one electing entity [VALS-TAXAGENT-2026]
  - >-
    All participants in the legal research study struggled with the 50-state survey question [VALS-VLAIR-2025]
  - >-
    Siva describes 'jurisdictional flattening', where federal training data dominates state and international answers
    [BTAX-SIVA1-2026]
  human_checkpoints:
  - Adviser verifies each jurisdiction's result against primary law
  role_evolution: Not described in the sources.
  evidence_grade: D
