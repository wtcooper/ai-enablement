- id: tax-research-advisory-17
  title: >-
    Client-facing tax question assistant that answers routine questions and escalates to an adviser (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - client-interaction
  pattern: service-agent-escalation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Clients and self-preparers ask routine tax questions that consume adviser time, and many already ask general chatbots
    [ANTINOZZI-2024; CPAPA-FIRSTSTOP-2025].
  solution: >-
    Idea: a chatbot answers routine client questions from the firm's approved content, flags nuanced or high-stakes questions
    and routes them to an adviser. The TPB lists chatbot functionality that can give tailored advice as AI capability
    practitioners may use [TPB-GS55-2026]. HMRC's guidelines for tax software using generative AI ask for flags on nuanced
    rules and prompts to seek a qualified tax professional [HMRC-GENAI-2026].
  outcomes:
  - lever: experience
    description: none published for a firm-deployed assistant
    figure: none published
    measures: not applicable
    provenance: independent
    source_ref: ANTINOZZI-2024
  prerequisites:
  - >-
    Defined scope of questions the assistant may answer, with an escalation path; Werfel contrasts a chatbot limited
    to filing deadlines with one answering credit eligibility [TAXADVISER-WERFEL-2026]
  - Client consent and disclosure of AI use in the engagement terms [PCRT-AI-2026; TPB-GS55-2026]
  risks_and_guardrails:
  - >-
    General-purpose ChatGPT gave correct responses 39% to 47% of the time across the 2023 and 2024 filing seasons and
    was less accurate on complex, fact-dependent questions [ANTINOZZI-2024]
  - Self-preparers are influenced by AI advisors and prefer tax-minimising recommendations [SWIDER-2025]
  - >-
    Werfel's registers list over-trust and unauthorised reliance, and a phased rollout starting with low-stakes factual
    queries [TAXADVISER-WERFEL-2026]
  - >-
    The TPB requires permission from each client before client information is entered into AI tools that act as a third
    party [TPB-GS55-2026]
  human_checkpoints:
  - Escalation to a qualified adviser for fact-dependent or advice-level questions
  role_evolution: Not described in the sources.
  evidence_grade: D
