- id: tax-research-advisory-02
  title: Multi-step research plans for gray-area questions, run inside the adviser's session
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  - expert-judgment
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Hard or 'gray-area' questions took hours across several databases (one firm layered CCH IntelliConnect with five
    Bloomberg BNA subscriptions) [ACCORDANCE-WFY-2026]. Thomson Reuters says that with search tools, applying findings to
    a client's situation still took substantial manual effort, and that answers without preserved reasoning chains and
    review-ready outputs are insufficient for substantive work [TR-AGENTICBLOG-2026].
  solution: >-
    The tool splits the work into steps: extract the fact pattern, frame the issues, locate authority, weigh its relevance
    and propose recommendations with risks; Accordance says it runs each step with dedicated agents and cites primary
    sources inline [ACCORDANCE-BDO-2026; ACCORDANCE-HOME-2026]. Bloomberg Tax announced a Deep Thinking Mode that asks
    clarifying questions and then executes a research plan [BTAX-TOOLS-2026]. Thomson Reuters positions CoCounsel Tax
    as moving from search-and-find to reason-and-act, with preserved reasoning chains and review-ready outputs [TR-AGENTICBLOG-2026].
  outcomes:
  - lever: speed
    description: >-
      A CPA who leads research at a 100-professional firm says research that took two, four or six hours takes 15 or
      20 minutes
    figure: 2-6 hours to 15-20 minutes
    measures: One practitioner's estimate of time per research task, quoted in the vendor case study
    provenance: vendor-published
    source_ref: ACCORDANCE-WFY-2026
  - lever: speed
    description: Multistate sales tax exposure analysis across 5-10 states done in a few hours instead of 1.5 days
    figure: 1.5 days to 3 hours (stated as 75%)
    measures: Time for one complex analysis at a 25-person firm, as stated in the vendor case study
    provenance: vendor-published
    source_ref: ACCORDANCE-SASSERATH-2025
  - lever: quality
    description: >-
      The practitioner says the tool flagged the documentation (board minutes, resolutions) needed to defend a debt-to-equity
      conversion for a foreign-owned holding company in an audit
    figure: none
    measures: Qualitative example; not measured
    provenance: vendor-published
    source_ref: ACCORDANCE-WFY-2026
  - lever: capacity
    description: Thomson Reuters-authored piece on agentic AI in tax firms
    figure: 14% currently; 80% expect it central within five years
    measures: >-
      Share of tax firms saying agentic AI is part of their workflow, and share expecting it to be central within five
      years; sample not stated
    provenance: vendor-published
    source_ref: CPAPA-TR-2026
  prerequisites:
  - >-
    A closed system with transparent citations so the researcher can check each step against primary authority [ACCORDANCE-WFY-2026]
  - >-
    Training so staff move from simple lookups to layered multi-part queries; the firm says the vendor taught this [ACCORDANCE-WFY-2026]
  - A way to retain the plan and reasoning for the reviewer [TR-AGENTICBLOG-2026]
  risks_and_guardrails:
  - >-
    The practitioner built trust by running queries where he already knew the answer; no systematic error rate was published
    [ACCORDANCE-WFY-2026]
  - Bloomberg Tax lists multi-step reasoning as something that can compound errors [BTAX-HALLUC-2026]
  - >-
    At TEI Tax Tech 2026 practitioners described failures that are silent and polite, for example an agent admitting
    after challenge that it had not opened the file [TEI-TAXTECH-2026]
  - >-
    Deep Thinking Mode and reason-and-act research are described only in launch or marketing material; no usage evidence
    was found [BTAX-TOOLS-2026; TR-AGENTICBLOG-2026]
  human_checkpoints:
  - >-
    Senior researcher checks the plan, the conclusions and the cited authority against his or her own expertise
  - Partner review before advice goes to the client
  role_evolution: >-
    Senior researchers move from running searches to directing and testing multi-part analyses; the case-study firm kept
    simple lookups on a lighter tool (Copilot) and used the research tool for complex scenarios [ACCORDANCE-WFY-2026].
    Thomson Reuters frames the change as amplifying judgment, not replacing it [TR-AGENTICBLOG-2026].
  evidence_grade: B
  sources:
  - ref: ACCORDANCE-WFY-2026
    title: 'Wright Ford Young & Co.: Rebuilding Their Approach to Gray-Area Research'
    publisher: Accordance
    type: vendor
    url: https://www.accordance.com/press/wright-ford-young-co-rebuilt-their-approach-to-gray-area-research
    date: '2026-07-22'
    access: full
    locator: Challenge, Solution and Impact sections
