# Use cases: tax / research-advisory
# Sources checked 2026-10-17; added 2026-10-21 for mid-market firms and owner clients (entries 26-28 added; new
# sources merged into 13, 14 and 25; no grade changed). 28 entries: A 0, B 11, C 10, D 7. Evidence is thin on measured outcomes: the
# before-and-after times are named practitioners' estimates quoted in case studies published by the vendors that
# sell the tools, not measurements; no independent test of a commercial tax research product exists.
# Independent measures (Stanford, Vals legal research, Vals Tax Agent Bench, TaxCalcBench, Antinozzi) test models
# or adjacent tools, not firm deployments. Cross-module overlaps are noted by full id in each entry's notes.

- id: tax-research-advisory-01
  title: Cited conversational tax research assistant in place of keyword database search
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  - expert-judgment
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Advisers at CPA and advisory firms pay for research databases but find them slow. In Blue J and CPA.com's 2025 survey
    of 150+ practitioners (co-produced by Blue J, which sells an AI research tool), 81.3% also used search engines for
    tax research and 42% called legacy tools too time-consuming [BLUEJ-OUTLOOK-2025; CPAPA-BLUEJ-2025]. General chatbots
    return confident citations that may not exist [BTAX-HALLUC-2026].
  solution: >-
    The adviser states the question and client facts in plain language and gets an answer with inline citations to primary
    authority drawn from a curated content set, then follows up and reads the authority before relying on it. Products
    named in the sources include Blue J (Tax Notes and IBFD content, per the company), Accordance and CoCounsel Tax (Checkpoint
    plus primary sources) [BLUEJ-HOME-2026; CPAPA-TR-2026; ACCORDANCE-SASSERATH-2025]. Named users include Sasserath & Co.
    and Barnes Wendling (Accordance), SSC CPAs + Advisors, which moved its primary research tool from Checkpoint to Blue
    J, Sorren and RSM US (quoted on Blue J's site) and Harris, Hardy & Johnstone (CoCounsel) [ACCORDANCE-BARNES-2026;
    BLUEJ-SSC-2025; BLUEJ-HOME-2026; TR-HHJ-2026]. Bloomberg Tax says its retrieval-augmented answers refrain from answering
    when reliable content is missing (vendor statement) [BTAX-HALLUC-2026].
  outcomes:
  - lever: speed
    description: >-
      A 25-person firm reports simple research on consulting expenses fell from 1 hour to 10 minutes, and a multistate
      sales tax exposure analysis from 1.5 days to 3 hours
    figure: 1 hour to 10 minutes (stated as 80%); 1.5 days to 3 hours (stated as 75%)
    measures: >-
      Time for two named research tasks at one firm, stated in the vendor's own narrative (not a quotation from the
      firm); the page's Impact line ('up
      to an 80% reduction in research time on complex scenarios') does not match its body text
    provenance: vendor-published
    source_ref: ACCORDANCE-SASSERATH-2025
  - lever: speed
    description: >-
      A Director at a 90-employee firm describes a technical footnote on a reorganization taking one hour instead of
      a full day
    figure: 8 hours to 1 hour (page says nearly 90% reduction)
    measures: One task described by one Director; a single example, not a firm-wide average
    provenance: vendor-published
    source_ref: ACCORDANCE-BARNES-2026
  - lever: capacity
    description: The same firm tracks usage across its professional staff
    figure: 700+ queries per month across 70 professional staff
    measures: Queries per month firm-wide, per the firm's own usage tracking as reported in the case study
    provenance: vendor-published
    source_ref: ACCORDANCE-BARNES-2026
  - lever: speed
    description: A Sorren tax partner describes one type of task
    figure: 4 to 5 hours to 15 minutes
    measures: >-
      One partner's recollection of how long a type of task used to take versus now, quoted on the vendor's page; not
      a measured sample
    provenance: vendor-published
    source_ref: BLUEJ-HOME-2026
  - lever: speed
    description: Blue J user survey respondents report weekly time saved
    figure: 2.94 hours per week
    measures: >-
      Self-reported weekly time saved by respondents to a Blue J user survey, across research and drafting combined
    provenance: vendor-published
    source_ref: BLUEJ-OUTLOOK-2025
  - lever: speed
    description: Thomson Reuters states average time savings for CoCounsel users
    figure: 32% per task
    measures: >-
      Average time savings per task for users of its CoCounsel solutions, as stated by Thomson Reuters; no sample or
      method given
    provenance: vendor-published
    source_ref: CPAPA-TR-2026
  - lever: quality
    description: Blue J says the rate at which users disagree with its tax answers is below 0.2%
    figure: <0.2%
    measures: >-
      Rate at which users disagree with the tool's answers (a user-feedback signal, not an audited accuracy rate; denominator
      not stated)
    provenance: vendor-published
    source_ref: BLUEJ-OUTLOOK-2025
  - lever: quality
    description: >-
      Independent preregistered study of three commercial retrieval-based legal research tools (adjacent: legal, not
      tax, research)
    figure: 17% to 33%
    measures: Share of responses that hallucinate, per tool, on the study's legal research query set
    provenance: independent
    source_ref: STANFORD-HALLUC-2024
  - lever: quality
    description: >-
      Independent study of four AI research products on 200 US legal research questions (adjacent: legal research)
    figure: 74%-78% (AI products) versus 69% (lawyer baseline)
    measures: Average weighted score across accuracy (50%), authoritativeness (40%) and appropriateness (10%)
    provenance: independent
    source_ref: VALS-VLAIR-2025
  prerequisites:
  - >-
    A curated, current content library the tool cites; Blue J says it updates primary sources daily [BLUEJ-ENTERPRISE-2026]
  - >-
    Vendor security review: the case studies cite closed systems, SOC reports and no training on client data [BLUEJ-ENTERPRISE-2026;
    TR-HHJ-2026]
  - >-
    Review of data retention and training terms before client facts are entered, given IRC 6713 and 7216 exposure [IRS-OPR-2026]
  - >-
    A sanctioned tool, so staff do not fall back to search engines or public chatbots (see tax-research-advisory-07)
  risks_and_guardrails:
  - >-
    OPR Alert 2026-19 says practitioners must verify facts, citations and calculations the AI produces (Circular 230
    s10.22) [IRS-OPR-2026]
  - >-
    PCRT guidance says to treat output as if prepared by a less experienced junior colleague and to confirm that referenced
    law exists [PCRT-AI-2026]
  - >-
    Retrieval does not eliminate hallucination: the only independent error measures found are for legal research tools
    (17% to 33%) [STANFORD-HALLUC-2024]
  - >-
    Tools that restrict sourcing to a proprietary database can lag on very recent guidance (legal research study) [VALS-VLAIR-2025]
  - >-
    A Drake Software executive warns that AI 'tends to agree with you' and varies by platform (advertising supplement)
    [TAXADV-DRAKE-2025]
  - >-
    No independent head-to-head accuracy test of commercial tax research tools was found; every speed and quality figure
    above for a tax tool is vendor-published
  human_checkpoints:
  - >-
    Adviser opens and reads each cited authority and confirms effective dates, jurisdiction and applicability before
    relying on it
  - >-
    Reviewer (manager or partner) tests the reasoning, not just the citation list, before a conclusion goes to a client
  role_evolution: >-
    Associates and mid-level staff do more of the first-pass research: Blue J reports its users are 40.8% associates,
    27.7% mid-level and 31.5% seniors [BLUEJ-OUTLOOK-2025]. RSM US's Washington National Tax leader says the tool keeps
    the practitioner 'in the driver's seat' [BLUEJ-HOME-2026]. PCRT frames the adviser as the reviewer of a junior colleague's
    work [PCRT-AI-2026].
  evidence_grade: B
  sources:
