- id: tax-research-advisory-06
  title: >-
    In-house tax department research and technical-question triage with licensed and enterprise AI assistants
  archetype: tax
  module: research-advisory
  function: finance-accounting
  work_types:
  - research-synthesis
  - expert-judgment
  - client-interaction
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Corporate tax teams answer ad hoc technical questions from finance, legal, auditors and the business with limited
    staff. Thomson Reuters' 2025 survey of 288 tax departments found 58% under-resourced (51% the year before) and more
    than half of time spent on reactive work [TR-CORPTAX-2025]; fewer than half of departments surveyed for the 2026
    report had a budget increase [TR-CORPTECH-2026].
  solution: >-
    In KPMG Germany's quick surveys, 89% use company-wide standard AI solutions and 29% specialised tax applications
    (base not stated), for uses ranging from researching and processing tax information to data analysis, documentation
    and reporting [KPMG-DE-2026]. In-house teams trial licensed research assistants: TEI's preliminary Midyear 2026
    programme scheduled Tax Labs on AI and tax research with Thomson Reuters CoCounsel and with Accordance [TEI-MIDYEAR-2026].
  outcomes:
  - lever: speed
    description: KPMG Germany quick surveys of tax departments; covers all AI use, not research alone
    figure: 66%
    measures: Share of AI users reporting noticeable time savings (sample size not stated)
    provenance: self-reported
    source_ref: KPMG-DE-2026
  - lever: capacity
    description: Adoption snapshot of corporate tax departments
    figure: 67% not using GenAI
    measures: >-
      Share of 288 surveyed corporate tax departments not using GenAI in 2025; among users, usage included research
    provenance: vendor-published
    source_ref: TR-CORPTAX-2025
  - lever: capacity
    description: Timeframe in which corporate tax leaders expect AI to become central to their workflow
    figure: 1 to 2 years
    measures: >-
      Expected timeframe among 170 tax leaders surveyed for the 2026 report; the article says it was longer the year
      before
    provenance: vendor-published
    source_ref: TR-CORPTECH-2026
  prerequisites:
  - >-
    IT approval and data-protection clearance: the top hurdles in KPMG Germany's survey were IT approvals (47%), data
    protection (41%) and lack of AI knowledge (41%) [KPMG-DE-2026]
  - A named owner for AI in the tax function [TEI-TAXTECH-2026]
  risks_and_guardrails:
  - >-
    Of more than 50 TEI Tax Tech 2026 attendees polled, two said the tax function owns AI implementation at their company
    [TEI-TAXTECH-2026]
  - More than one-third of tax and audit professionals admit using unauthorized AI tools [TR-FOP-2026]
  - >-
    Fonoa found 57.4% of 176 indirect tax leaders would not be confident defending AI-assisted decisions to a tax authority
    (adjacent) [FONOA-2026]
  - >-
    Silent hallucination and rising token costs were the new concerns TEI attendees raised [TEI-TAXTECH-2026]
  - >-
    Deloitte's scenario paper suggests investing in AI validation, model governance and expert-in-the-loop capability
    [DELOITTE-TTT-2026]
  human_checkpoints:
  - Tax director reviews AI-assisted conclusions before they go to the CFO, auditors or authorities
  role_evolution: >-
    Sala argues corporate tax teams will shrink little because AI cannot hold regulatory, ethical or financial culpability
    and the work is tax practice, not form preparation [SALA-TAXNOTES-2026]. In KPMG Germany's survey most companies
    expect stable tax headcount (58% domestic, 72% abroad) [KPMG-DE-2026].
  evidence_grade: C
  sources:
