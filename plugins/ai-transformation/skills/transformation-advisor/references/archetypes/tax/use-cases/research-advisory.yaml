- id: tax-research-advisory-07
  title: Firm-wide standard on approved, closed research assistants, with a named tax AI owner and governance
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  - coordination-scheduling
  - review-assurance
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Staff use general chatbots for tax questions whether or not the firm has approved them, with confidentiality, currency
    and citation risks [TR-FOP-2026; IRS-OPR-2026]. Large firms have many professionals researching the same questions
    with uneven tools and no central control over what is pasted into which AI [BLUEJ-CROWE-2024; PWC-MEGNA-2025].
  solution: >-
    The firm licenses or builds one standard tax research assistant, names an AI leader for tax, sets policy and trains
    staff. Crowe signed an enterprise agreement for Ask Blue J across its tax practice and has a Tax AI Leader [BLUEJ-CROWE-2024].
    KPMG US M&A Tax standardised its technology stack and uses its own GenAI Research Assistant for Navigating Tax [KPMG-MA-2025];
    KPMG UK had exclusive access to Ask Blue J from 2024 [KPMGUK-BLUEJ-2024]. PwC has a US AI Tax Leader, a governance
    committee, over 3,200 AI champions, over 800 custom GPTs and 250 agents firm-wide [PWC-MEGNA-2025]. Wright Ford Young
    standardised its staff on approved platforms and chose its research tool partly because it is a closed system with
    citations; Harris, Hardy & Johnstone cites an enclosed LLM with SOC certification [ACCORDANCE-WFY-2026; TR-HHJ-2026].
  outcomes:
  - lever: capacity
    description: Blue J's chief revenue officer says Crowe is implementing Ask Blue J across its entire tax practice
    figure: entire tax practice (no headcount given)
    measures: Scope of an enterprise agreement, as stated by a vendor executive in the vendor's 2024 release
    provenance: vendor-published
    source_ref: BLUEJ-CROWE-2024
  - lever: capacity
    description: PwC US AI Tax Leader on firm-wide enablement
    figure: 3,200+ AI champions; about 80% of people with some AI training
    measures: >-
      AI champions across the firm (not tax only) and share of 'our people' who took some AI training, as stated in an
      interview
    provenance: self-reported
    source_ref: PWC-MEGNA-2025
  - lever: capacity
    description: Announced scale of access to Claude across KPMG
    figure: 276,000 people
    measures: KPMG workforce that the announcement says will have access to Claude; an access figure, not usage
    provenance: self-reported
    source_ref: KPMG-ANTHROPIC-2026
  - lever: risk
    description: Gap between staff using AI for tax research and firms that formally adopted it
    figure: 80% vs 60%
    measures: >-
      Respondents (1,000 US accountants, March 2026) using AI for tax research weekly or monthly, versus respondents
      whose firm formally adopted AI-powered tax research; the vendor reads the gap as possible unsanctioned use
    provenance: vendor-published
    source_ref: BLUEJ-OUTLOOK-2026
  - lever: risk
    description: Unauthorized tool use
    figure: more than one-third
    measures: >-
      Share of surveyed tax and audit professionals admitting to using unauthorized AI tools (sub-sample size not given)
    provenance: vendor-published
    source_ref: TR-FOP-2026
  prerequisites:
  - Executive sponsor and a named AI leader for tax [BLUEJ-CROWE-2024; PWC-MEGNA-2025]
  - Written AI policy and vendor security and confidentiality review [JOFA-AIPOLICY-2026]
  - Training and an AI champion network [PWC-MEGNA-2025]
  risks_and_guardrails:
  - >-
    OPR names confidentiality leakage across clients as a risk, and competence under s10.35 requires understanding the
    tool [IRS-OPR-2026]
  - Closed tools reduce but do not remove the duty to verify output [IRS-OPR-2026]
  - >-
    ICAEW's director of regulatory policy said some firms have built locked-down internal tools while smaller firms would
    be expected to use public ones [ICAEW-POD-2026]
  - >-
    PwC says policy interpretation and high-touch consulting still see limited AI use, and uses 'multi-eye' human review
    for complex outputs [PWC-MEGNA-2025]
  human_checkpoints:
  - Managing partner or tax leader approves tools and maintains the approved list
  - Human review at each level of the firm's review process
