- id: tax-research-advisory-23
  title: Law-change monitoring that drafts client-specific impact notes for adviser review
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  - client-interaction
  pattern: monitor-diagnose-act
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    After major legislation advisers must track guidance across jurisdictions and explain the effect to each client,
    which is repetitive and urgent; models trained on static data answer with outdated rules [BTAX-HALLUC-2026; PCRT-AI-2026].
  solution: >-
    A monitoring agent watches new law and guidance and drafts impact notes for affected clients or matters. KPMG US's
    tax vice chair says building an agent to help clients adjust to changing tax regulations used to take weeks and multiple
    tools and takes minutes with Claude Cowork and Managed Agents inside KPMG Digital Gateway [KPMG-ANTHROPIC-2026].
    Bloomberg Tax describes an AI Assistant in its Compliance Tracker that summarises and analyses filings [BTAX-TOOLS-2026].
  outcomes:
  - lever: speed
    description: KPMG executive on time to build a client agent for changing tax rules
    figure: weeks to minutes
    measures: >-
      Time to build such an agent (not time to run an analysis), per Rema Serafi, KPMG US Vice Chair, Tax; no sample
      or method
    provenance: self-reported
    source_ref: KPMG-ANTHROPIC-2026
  - lever: quality
    description: >-
      Independent benchmark category on recent law changes and cross-year or cross-jurisdiction comparison (a research
      proxy, not a monitoring test)
    figure: 66.67% (best model)
    measures: Share of 30 Current and Temporal Analysis test questions answered fully correct, citation-adjusted
    provenance: independent
    source_ref: VALS-TAXAGENT-2026
  prerequisites:
  - Feeds of primary law and guidance that the agent reads directly, not model memory
  - >-
    Version control and update discipline; HMRC expects continuous monitoring and timely updating of data sources in
    generative-AI tax software [HMRC-GENAI-2026]
  risks_and_guardrails:
  - PCRT says outdated AI models can lead to compliance risks and incorrect advice [PCRT-AI-2026]
  - >-
    Bloomberg Tax lists training cutoffs and fast-changing guidance as a cause of confident but outdated answers [BTAX-HALLUC-2026]
  - >-
    KPMG says the work is guided by its Trusted AI framework, with no further detail [KPMG-ANTHROPIC-2026]
  human_checkpoints:
  - Adviser confirms each flagged change and its client impact before anything reaches the client
  role_evolution: >-
    KPMG says professionals and clients work with AI inside the platform, building new capabilities in real time
    [KPMG-ANTHROPIC-2026].
  evidence_grade: C
  sources:
  - ref: KPMG-ANTHROPIC-2026
    title: KPMG Partners with Anthropic for Digital Gateway Powered by Claude
    publisher: CPA Practice Advisor (KPMG/Anthropic release)
    type: firm
    url: >-
      https://www.cpapracticeadvisor.com/2026/05/20/kpmg-partners-with-anthropic-for-digital-gateway-powered-by-claude/183743/
    date: '2026-05-20'
