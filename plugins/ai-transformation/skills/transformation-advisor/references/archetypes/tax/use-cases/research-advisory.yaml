- id: tax-research-advisory-12
  title: 'Auditable computation in advice: the model translates rules, a deterministic engine calculates'
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - data-reporting
  - expert-judgment
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Advice often turns on a computation (tax tables, eligibility, multi-step interactions), and language models alone
    get these wrong in ways that are hard to see [COLUMN-TAXCALCBENCH-2025]. Researchers argue accuracy and auditability
    are the bottleneck for automated tax reasoning [JHU-TAXREASON-2025].
  solution: >-
    The model translates plain-text rules or fact patterns into formal logic or inputs for a symbolic solver or tax engine
    that does the arithmetic, and the logic trace is kept in the file. Johns Hopkins researchers tested this on the SARA
    statutory reasoning dataset with a cost model based on real penalties [JHU-TAXREASON-2025]. Column Tax's benchmark
    authors argue tax calculation needs deterministic engines around LLMs [COLUMN-TAXCALCBENCH-2025].
  outcomes:
  - lever: quality
    description: >-
      Best model computing simplified 2024 US federal personal returns with complete inputs (compliance calculation,
      adjacent; authors sell tax-engine technology)
    figure: 32.35% strict; 51.96% lenient
    measures: >-
      Share of 51 test returns computed correctly on every evaluated line (strict) or within plus or minus $5 on every
      line (lenient), best model
    provenance: vendor-published
    source_ref: COLUMN-TAXCALCBENCH-2025
  prerequisites:
  - A deterministic engine or formalised rule set for the computation
  - Inputs captured completely
  risks_and_guardrails:
  - >-
    Pure-LLM calculation misused tax tables, mis-calculated and misjudged eligibility in the Column benchmark [COLUMN-TAXCALCBENCH-2025]
  - The hybrid approach was evaluated on a benchmark, not in practice [JHU-TAXREASON-2025]
  - TEI attendees flagged errors that fail quietly and rising token costs [TEI-TAXTECH-2026]
  human_checkpoints:
  - Adviser reviews inputs, assumptions and the explanation of the calculation
  role_evolution: >-
    The calculation trace becomes part of the deliverable; PwC says its effective-tax-rate model is trained to explain
    inputs, outputs and assumptions, and approved logic is locked [PWC-MEGNA-2025].
  evidence_grade: C
