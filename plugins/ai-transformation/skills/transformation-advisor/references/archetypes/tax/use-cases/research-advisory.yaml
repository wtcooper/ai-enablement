- id: tax-research-advisory-19
  title: Citation verification and an AI-use record as a standing review step
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - review-assurance
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    AI can produce plausible but nonexistent authority. In Clinco, three of four cases cited for a notice-of-deficiency
    signature argument were described by the Tax Court as probable AI hallucinations, and counsel repeated one after
    the IRS flagged it [TAXCT-CLINCO-2026]. Regulators and tribunals expect practitioners to show how output was verified
    [IRS-OPR-2026; TPB-GS55-2026].
  solution: >-
    Reviewers confirm every cited authority exists and says what the draft claims, and the file records the prompt, the
    output, the citations, how they were verified and who reviewed. KPMG US M&A Tax says its human-in-the-loop model
    uses citations and hyperlinks to validate all AI outputs, with regular training [KPMG-MA-2025]. JofA suggests citation
    verification logs and a second reviewer for filings [TAXCT-CLINCO-2026]; an Aon adviser suggests documenting prompts,
    verification and reviewer in the client file [JOFA-AIPOLICY-2026]; Wolters Kluwer advises recording question, output,
    citations, validation steps and final conclusion [WK-CORPRES-2026].
  outcomes:
  - lever: risk
    description: Decisions worldwide in which a court or tribunal addressed hallucinated content by a party
    figure: 2,199 (as of 16 Oct 2026)
    measures: >-
      Decisions in all areas of law listed in the database header; not tax-only and not a rate (25 rows are
      tagged tax)
    provenance: independent
    source_ref: CHARLOTIN-DB-2026
  - lever: risk
    description: US Tax Court judge on how often he has seen hallucinated citations in filings
    figure: fewer than a dozen; he had not issued any sanctions himself (March 2026)
    measures: Instances Judge Holmes said he had seen in Tax Court filings, per a Bloomberg interview
    provenance: independent
    source_ref: BLAW-TAXCT-2026
  - lever: risk
    description: >-
      Bloomberg Tax cites a January 2026 paper (attributed to The International Tax Journal) reporting AI-related citation
      errors; a Texas A&M preprint with the same figure says 'nearly 800 cases' [PREPRINTS-HALLUC-2026]
    figure: nearly 800
    measures: >-
      AI-related citation errors in disciplinary actions and court records across at least 25 countries by late 2025,
      as described by Bloomberg Tax
    provenance: vendor-published
    source_ref: BTAX-HALLUC-2026
  prerequisites:
  - Written firm AI policy; OPR s10.36 expects firm procedures [IRS-OPR-2026]
  - Access to primary-source databases for checking
  - Training on AI limits [KPMG-MA-2025]
  risks_and_guardrails:
  - >-
    The Tax Court stopped short of sanctions in Clinco but warned of 'a recipe for sanctions'; OPR lists sanctions courts
    have imposed on lawyers [TAXCT-CLINCO-2026; IRS-OPR-2026]
  - >-
    A check that only confirms a case exists can miss errors in real authority: in Zzaman (UK) real cases did not support
    the argument, and in Thomas (US) real case names carried wrong reporters and propositions [ICAS-TAXTRIB-2026; BTAX-LOWY-2026]
  - >-
    Control dilution: Werfel's preparer register warns faster workflows can make review less rigorous in practice [AICPA-WERFEL-2026]
  - >-
    OPR s10.36 expects firms to document the steps that show adherence; the TPB says verification should be documented;
    PCRT suggests keeping screenshots of prompts and copies of web pages [IRS-OPR-2026; TPB-GS55-2026; PCRT-AI-2026]
  - Standing orders requiring AI certification exist in some courts [TAXCT-CLINCO-2026]
  human_checkpoints:
  - >-
    Second reviewer cross-checks existence and support of each authority before a filing or client memo goes out
  - Responsible partner signs off on the verification record
  role_evolution: >-
    An Aon adviser says the client file should record the prompts used, how outputs were verified and who reviewed
    [JOFA-AIPOLICY-2026]. OPR says those with principal authority over a firm's practice must take reasonable steps to ensure adequate procedures
    (s10.36) [IRS-OPR-2026]. Werfel's register calls for sign-off that requires genuine analysis [AICPA-WERFEL-2026].
  evidence_grade: B
  sources:
  - ref: KPMG-MA-2025
    title: >-
      How generative AI is transforming mergers and acquisitions tax: The KPMG approach (PDF; web article at kpmg.com/us/en/articles/2025/how-generative-ai-transforming-mergers-acquisitions-tax.html)
    publisher: KPMG US
    type: firm
    url: https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2025/how-generative-ai-transforming.pdf
    date: 2025-06
    access: full
    locator: page 2, 'Balancing risk and innovation'
  - ref: TAXCT-CLINCO-2026
    title: >-
      A recipe for sanctions: AI-hallucinated citations in tax (analysis of Clinco v. Commissioner, T.C. Memo. 2026-16)
    publisher: Journal of Accountancy (AICPA)
    type: press
    url: >-
      https://www.journalofaccountancy.com/issues/2026/sep/a-recipe-for-sanctions-ai-hallucinated-citations-in-tax/
    date: '2026-09-01'
    access: full
    locator: sections 'The apparitions in the briefing' and 'Firm policies'
