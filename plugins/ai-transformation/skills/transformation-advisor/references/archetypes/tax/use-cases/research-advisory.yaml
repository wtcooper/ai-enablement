  function: service-delivery
  work_types:
  - client-interaction
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: piloting
  problem: >-
    Hourly billing ties revenue to the time AI removes from research and drafting, while IRS OPR says billing for manual
    time not actually spent may violate the fee rule depending on the facts [BTAX-PRICING-2026; IRS-OPR-2026]. In
    Thomson Reuters' 2026 survey of 600 tax, audit and accounting respondents, 78% primarily use hourly billing, and
    advisory margins are 20-24% against 28% for individual return preparation [TR-SOTP-2026].
  solution: >-
    Firms test fixed monthly fees, project pricing, hybrid or value-based models. Sasserath & Co. moved new-client onboarding
    to fixed monthly fees where appropriate [ACCORDANCE-SASSERATH-2025]. RKL is piloting an alternative pricing model
    with a consultant, RSM US says it uses multiple pricing models and increasingly bills on value, and PwC's US tax
    leader says time is becoming less relevant [BTAX-PRICING-2026]. This is a pricing change, not an AI workflow.
  outcomes:
  - lever: growth
    description: Surveyed AI adopters considering alternatives to hourly billing
    figure: 69%
    measures: >-
      Share of respondents who have adopted AI-powered tax research (1,000 US accountants, March 2026) considering value-based,
      hybrid or fixed-fee billing
    provenance: vendor-published
    source_ref: BLUEJ-OUTLOOK-2026
  - lever: growth
    description: RKL clients onboarded under its pilot pricing model
    figure: several dozen new clients
    measures: New clients onboarded under the pilot, as reported by Bloomberg Tax (journalist's statement)
    provenance: self-reported
    source_ref: BTAX-PRICING-2026
  - lever: cost
    description: UK respondents expecting bills to fall because of generative AI
    figure: 45% of in-house teams; 35% of private practice
    measures: >-
      In-house respondents expecting bills to be reduced; private-practice respondents agreeing clients would expect
      a reduction (Tolley, 446 UK tax professionals, 2024)
    provenance: vendor-published
    source_ref: TOLLEY-2024
  prerequisites:
  - Scoping and pricing skills, and client agreement on scope and outputs
  - >-
    Willingness to test with a subset of clients; Blue J and CPA.com advise running it like an experiment [BLUEJ-OUTLOOK-2026]
  risks_and_guardrails:
  - >-
    OPR (s10.27): do not bill manual time not spent; pass efficiencies on openly and disclose AI activities in general
    or specific terms [IRS-OPR-2026; KTS-AI-2026]
  - >-
    The AICPA calls OPR's fee language non-authoritative and 'overly simplistic', says it does not appear to allow value
    pricing, and is working with the IRS on FAQs [AICPA-FEES-2026; AICPA-CART-2026]
  - >-
    Thomson Reuters Institute: about one third say their firm's commercial model has not adapted [TR-FOP-2026]
  human_checkpoints:
  - >-
    Engagement partner sets the fee basis and reviews billing against actual work and OPR's s10.27 expectations
  role_evolution: >-
    An RSM partner says AI gives firms time for deeper advisory work and strategy discussions with clients, and PwC's US
    tax leader says time is becoming less relevant [BTAX-PRICING-2026].
  evidence_grade: B
  sources:
