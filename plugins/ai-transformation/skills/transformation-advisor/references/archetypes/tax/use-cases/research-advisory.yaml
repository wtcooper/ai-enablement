- id: tax-research-advisory-15
  title: >-
    AI support for tax opinions and written advice, and in-house preliminary positions before an external opinion (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - expert-judgment
  - document-production
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Written advice must rest on reasonable factual and legal assumptions and consider all relevant facts (Circular 230
    s10.37) [IRS-OPR-2026], and the responsible practitioner must verify the analysis and facts before an opinion is
    finalised [KTS-AI-2026].
    Corporates often wait for, and defer to, an expensive opinion from a Big Four national office or law firm [SALA-TAXNOTES-2026].
  solution: >-
    Idea: AI assembles the authorities, maps them to the facts and drafts the analysis; a person decides the conclusion
    and signs. A Kilpatrick Townsend alert says AI can be a valuable tool in producing an opinion letter, provided the
    practitioner verifies the analysis, confirms the facts and replaces fabricated, outdated or inapplicable authorities
    [KTS-AI-2026]. Sala asks whether a highly technical tax AI could give corporate tax teams direction before or instead
    of the external opinion, and whether the Big Four's work is about more than an accurate opinion on the law [SALA-TAXNOTES-2026].
  outcomes:
  - lever: quality
    description: >-
      none published; the benchmark's best score on controversy and precedence analysis is a related measure
    figure: 36.67% (best model, Controversy and Precedence Analysis, 30 test questions)
    measures: >-
      Share of 30 test questions on audits, penalties, appeals, limitation periods, elections and which rules and rulings
      apply that were answered fully correct, citation-adjusted
    provenance: independent
    source_ref: VALS-TAXAGENT-2026
  prerequisites:
  - Secure, firm-approved AI system
  - Firm opinion-review process that stays in force
  - Documented verification of each authority
  risks_and_guardrails:
  - >-
    OPR: s10.37 requires reasonable factual and legal assumptions; where the system's logic is opaque, reliance may be
    unreasonable, and AI advice is a starting point [IRS-OPR-2026]
  - >-
    OPR on competence: lack of technological competence could lead to improper advice (s10.35) [IRS-OPR-2026]
  - >-
    Siva argues AI tools do not qualify for Kovel protection and that verifying citations is a non-delegable duty
    [BTAX-SIVA2-2026]
  - >-
    Werfel's preparer register lists liability ambiguity between the signing preparer and the AI vendor, and malpractice
    exposure [TAXADVISER-WERFEL-2026]
  - >-
    Sala argues AI cannot shoulder the regulatory, ethical or financial consequences of culpability [SALA-TAXNOTES-2026]
  - >-
    No authority was found on whether AI-generated advice can support a reasonable-cause or preparer-penalty defence
  human_checkpoints:
  - >-
    Signing professional owns the conclusion and verifies law, facts and every cited authority; opinion committee or
    second-partner review still applies
  role_evolution: >-
    The signer's duty is unchanged; verification and fact-gathering gain weight relative to drafting [KTS-AI-2026]. Sala
    predicts limited headcount effect because opinion work carries accountability AI cannot take [SALA-TAXNOTES-2026].
