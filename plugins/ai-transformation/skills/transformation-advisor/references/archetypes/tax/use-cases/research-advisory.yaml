- id: tax-research-advisory-14
  title: >-
    Drafting technical memos, advice letters and client emails from researched authority, with adviser revision
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - document-production
  - client-interaction
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Writing the memo, advice letter or client explanation after research takes days of associate time, delays the response
    and varies between staff [BTAX-LOWY-2026; BLUEJ-WRITING-2026]; clients also arrive with AI-generated questions [CPAPA-FIRSTSTOP-2025].
  solution: >-
    The tool turns facts and authorities into a first draft (memo, client email, letter, response to a tax authority)
    that the adviser edits and owns. Blue J sells this as Tax Writing, and a Larson Gross partner says the firm uses
    it to craft responses to client questions [BLUEJ-WRITING-2026]. CoCounsel Tax for in-house teams lists drafting internal
    technical memos with full citations from one prompt [TR-COCOUNSELCORP-2026]. KPMG describes a Writing Review Assistant
    that unifies style and defined terms [KPMG-MA-2025]. Nelson Mullins is piloting two leading platforms; Lowy says
    output resembles an average-performing junior associate's, useful for drafts but not ready to send [BTAX-LOWY-2026].
    PCRT gives report writing for tax advisory as an example use [PCRT-AI-2026]. For owner clients, One Stop CPA, a
    digital firm with four accountants and three non-accountants, uses Blue J for authority-based research and
    enterprise ChatGPT to organise findings, structure follow-up questions, summarise and draft client-facing
    explanations; the CEO says the technical analysis comes before the draft. In the example, a client considering a
    sale and a move to another state received an answer on state tax treatment and payout strategy within two hours
    [JOFA-SMALLFIRMS-2026].
  outcomes:
  - lever: speed
    description: >-
      Blue J user survey respondents report weekly time saved across research and drafting; not split between the two
    figure: 2.94 hours per week
    measures: Self-reported weekly time saved by Blue J user survey respondents
    provenance: vendor-published
    source_ref: BLUEJ-OUTLOOK-2025
  - lever: speed
    description: >-
      A practitioner asserts that a draft that takes a junior attorney days can often be generated in minutes
    figure: none published
    measures: Author's unmeasured assertion in an opinion article
    provenance: self-reported
    source_ref: BTAX-LOWY-2026
  - lever: experience
    description: >-
      UK tax professionals listing client communication drafting as a priority for planned generative-AI use
    figure: 80%
    measures: >-
      Respondents among 446 UK tax professionals (Tolley, 2024) listing drafting emails or other communication tasks
      as a priority; plans, not usage
    provenance: vendor-published
    source_ref: TOLLEY-2024
  - lever: speed
    description: >-
      The Journal of Accountancy reports that One Stop CPA's CEO developed an answer on a client's deal tax treatment
      and residency move within two hours, much less time than before. No baseline hours are given.
    figure: within two hours
    measures: >-
      time for one client's deal and relocation question, as stated by the firm's CEO to the Journal of Accountancy;
      no sample, baseline or method
    provenance: self-reported
    source_ref: JOFA-SMALLFIRMS-2026
  prerequisites:
  - A research tool that holds the cited analysis, so the draft inherits its citations
  - >-
    Enterprise tiers only, so client data does not train the model, and a saved library of prompts and templates
    (One Stop CPA's practice) [JOFA-SMALLFIRMS-2026]
  - Firm policy that AI text is a draft, not a final work product [TAXCT-CLINCO-2026]
  - >-
    Approved enterprise tool; no client-identifying detail in public tools (IRC 6713 and 7216) [IRS-OPR-2026]
  risks_and_guardrails:
  - >-
    Fabricated citations in a memo or filing are the main risk; in Clinco the Tax Court faulted counsel for citing nonexistent
    cases and warned of sanctions, though none was imposed [TAXCT-CLINCO-2026]
  - >-
    OPR treats AI output as a starting point and applies due diligence (s10.22) and written-advice rules (s10.37) [IRS-OPR-2026]
  - >-
    Fees: OPR says billing for manual labour not actually spent may violate s10.27 depending on the facts [IRS-OPR-2026]
  - >-
    A report Deloitte Australia prepared for the Australian government contained invented quotes and non-existent references
    and led to a reported partial fee refund [IRS-OPR-2026]
  - >-
    In Elden v HMRC the tribunal said the human who relies on AI bears responsibility, and failure to verify AI output
    was found to be professional incompetence for a regulated accountant [ICAS-TAXTRIB-2026; ROSSMARTIN-ELDEN-2026]
  - 'ICAEW: a generated letter to HMRC can mis-state a point or strike the wrong tone [ICAEW-POD-2026]'
  - >-
    Disclosure: in April 2025 JofA found no federal law or professional standard mandating disclosure of AI use to clients,
    some states requiring some disclosure, and suggested voluntary disclosure [JOFA-DISCLOSE-2025]; OPR's 2026 alert says
    practitioners should disclose AI activities, in general or specific terms, when crediting cost savings [IRS-OPR-2026]
  - >-
    The small firms in the Journal of Accountancy article keep client information out of public AI platforms and have
    a human review the work; One Stop CPA is one firm with one example and no error rate [JOFA-SMALLFIRMS-2026]
  human_checkpoints:
  - Named adviser edits, verifies every cited authority and approves every client-facing draft
  - Second reviewer checks authorities for opinion-level or litigation documents
  role_evolution: >-
    Less time on the first draft, more on editing and client-specific judgment [BLUEJ-WRITING-2026]. Lowy argues the
    lawyer's work shifts to narrowing options, rejecting weak ideas and owning the result, and calls AI proficiency a
    core competency [BTAX-LOWY-2026]. KPMG compares the change to the introduction of Excel [KPMG-MA-2025]. One Stop
    CPA closes engagements with the deliverable and offers implementation or compliance add-ons at the same time
    [JOFA-SMALLFIRMS-2026].
