  maturity: in-production
  problem: >-
    Junior staff lack the background to navigate legacy research tools, and seniors act as informal research trainers
    [TR-JANSEN-2026; ACCORDANCE-FINNEY-2025].
  solution: >-
    Firms use the cited research assistant as a tutor and to widen who can research. Jansen & Company's senior managing
    director, the firm's informal 'research trainer', says he uses AI as a tutor [TR-JANSEN-2026]. Sasserath & Co. says
    younger staff did not have to unlearn legacy methods [ACCORDANCE-SASSERATH-2025]; Finney Neill says less experienced
    staff could not get to answers on the old platform [ACCORDANCE-FINNEY-2025].
  outcomes:
