    foundation models' is a vendor statement; no benchmark was published in the pages read.

- id: tax-research-advisory-03
  title: Research agent that works a question end to end and submits a cited memo-style answer
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - research-synthesis
  - document-production
  pattern: research-brief
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    A corporate tax research question usually needs several chained lookups (statute, regulation, guidance, forms, prior-year
    rules), and an early error in a threshold, date or citation carries through to the answer [VALS-TAXAGENT-2026].
  solution: >-
    An agent with tools for authority lookup by citation, web search, document fetch, retrieval and a calculator researches
    a written question over many steps and submits one written answer with citations; Vals AI built an independent benchmark
    of this task for US corporate tax [VALS-TAXAGENT-2026]. EY India announced an AI Tax Hub with agents for research,
    compliance and litigation [EY-INDIA-2026]. A TEI-SJSU panel deck (panellists included OpenAI's tax reporting director)
    shows a sample tax research agent built on GPT-5 that drafts cited memos [SJSU-TEIHTTI-2025].
  outcomes:
  - lever: quality
    description: >-
      Highest score on the Tax Agent Bench leaderboard as read on 2026-10-17 (models run in the Vals harness, not commercial
      tax products or a firm deployment)
    figure: 49.19%
    measures: >-
      Share of the 193 private test questions answered fully correct (all expert rubric checks pass), multiplied by (0.7
      + 0.3 x citation quality); a question not answered within three hours scores 0
    provenance: independent
    source_ref: VALS-TAXAGENT-2026
  - lever: quality
    description: >-
      Weakest categories by best score: Forms and Filings, and Controversy and Precedence Analysis (category medians
      13.33% and 6.67%)
    figure: 40.00% and 36.67% (best model per category, 30 test questions each)
    measures: Share of the 30 test questions in the category answered fully correct, citation-adjusted
    provenance: independent
    source_ref: VALS-TAXAGENT-2026
  prerequisites:
  - >-
    Authority sources the agent can fetch by citation, and a way to check that citations resolve [VALS-TAXAGENT-2026]
  - >-
    Rubric-based or expert review of outputs, since fully correct answers were the minority on the benchmark [VALS-TAXAGENT-2026]
  - >-
    Budget for long runs: the leaderboard shows cost per task up to about $15 and run times up to about an hour [VALS-TAXAGENT-2026]
  risks_and_guardrails:
  - >-
