- id: tax-research-advisory-10
  title: Planning-alternative ideation and anti-abuse screening of structures (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - expert-judgment
  - research-synthesis
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Finding and testing planning alternatives (structures, elections, timing) across a large body of authority is slow
    and depends on a few senior people; abusive strategies are hard for agencies to spot [JHU-TAXABUSE-2025; BTAX-SIVA1-2026].
  solution: >-
    Idea: a model proposes or completes planning strategies and probes them against authority; the adviser decides whether
    any is client-specific, supportable and acceptable. Blair-Stanek, Holzenberger and Van Durme tested whether LLMs
    can interpret, verify, complete and generate tax strategies and report that LLM reasoning identified an apparently
    novel strategy; they frame the use for tax agencies [JHU-TAXABUSE-2025]. Lowy lists exploring planning alternatives
    as a strength of current tools [BTAX-LOWY-2026].
  outcomes:
  - lever: quality
    description: >-
      none published for adviser use; the paper's abstract reports an apparently novel strategy, with no rate or count
    figure: none published
    measures: not applicable
    provenance: independent
    source_ref: JHU-TAXABUSE-2025
  prerequisites:
  - Expert reviewer able to test structures against substance doctrines
  - >-
    A current authority base; PCRT warns that outdated models can lead to incorrect advice [PCRT-AI-2026]
  risks_and_guardrails:
  - >-
    Siva says AI can build a 'technically perfect sham' that meets the text but fails economic substance or step-transaction
    tests, and links reliance to IRC 6662 and 6700 exposure [BTAX-SIVA1-2026]
  - >-
    ICAEW: a member cannot say the AI came up with a contrived scheme; PCRT planning standards still apply [ICAEW-POD-2026]
  - >-
    PCRT: public AI tools may surface sources that promote particular schemes, and material legal uncertainty in AI output
    should be disclosed to the client [PCRT-AI-2026]
  - Lowy notes the tools are better at generating ideas than screening out bad ones [BTAX-LOWY-2026]
  human_checkpoints:
  - >-
    Senior adviser tests every AI-proposed structure against economic substance, step transaction and PCRT or Circular
    230 standards
  role_evolution: >-
    Lowy says the lawyer remains responsible for narrowing the possibilities AI generates, rejecting weak ideas and refining
    promising ones [BTAX-LOWY-2026].
  evidence_grade: D
  sources:
  - ref: JHU-TAXABUSE-2025
    title: "Can LLMs Identify Tax Abuse? (arXiv 2508.20097, v2 revised 2026-01-21)"
    publisher: "arXiv (Blair-Stanek, Holzenberger, Van Durme)"
