    title: "Topical guidance covering the application of PCRT to the ethical use of AI tools"
    publisher: "ICAEW for the seven PCRT bodies"
    type: professional-body
    url: "https://www.icaew.com/technical/tax/working-in-tax/pcrt/topical-guidance-application-of-pcrt-to-ethical-use-of-artificial-intelligence-tools"
    date: "2026-01-19"
