- id: tax-research-advisory-11
  title: >-
    AI challenge of a position: argue the other side, play the examiner, or cross-check with a second tool (idea)
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - expert-judgment
  - review-assurance
  pattern: draft-review-loop
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Positions are often tested only by the author and one reviewer, and a single tool's confident answer can be wrong;
    reviewers cannot easily see which answers need deeper checking [BTAX-LOWY-2026; PCRT-AI-2026].
  solution: >-
    Idea: the adviser asks a model to argue the opposite conclusion, list what an IRS examiner would flag, or runs the
    same question through a second tool and treats disagreement as a trigger for a deeper human check. Lowy lists generating
    alternative arguments and testing different ways to frame a technical issue as strengths of the tools [BTAX-LOWY-2026];
    CPA Practice Advisor's playbook suggests CPAs coach clients to ask AI to argue the opposite and identify what an auditor
    would flag [CPAPA-FIRSTSTOP-2025].
  outcomes:
  - lever: quality
    description: none published
    figure: none published
    measures: not applicable
    provenance: self-reported
    source_ref: BTAX-LOWY-2026
  prerequisites:
  - Approved tools; facts abstracted so no confidential client detail leaves approved systems
  risks_and_guardrails:
  - >-
    A Drake Software executive says AI tends to agree with the user, which weakens an adversarial test unless the model
    is prompted to oppose [TAXADV-DRAKE-2025]
  - Agreement between tools is not verification; authorities still need to be read [PCRT-AI-2026]
  - >-
    On the Vals benchmark, more tool calls and longer answers did not translate into accuracy [VALS-TAXAGENT-2026]
  human_checkpoints:
  - >-
    Adviser decides which objections are credible, checks both disagreements and consensus answers on material points
    against primary authority, and updates the memo
  role_evolution: >-
    The adviser acts as filter and decision-maker over a larger set of machine-generated objections [BTAX-LOWY-2026].
  evidence_grade: D
  sources:
  - ref: BTAX-LOWY-2026
