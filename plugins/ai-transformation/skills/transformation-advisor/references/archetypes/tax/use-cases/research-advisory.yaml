- id: tax-research-advisory-27
  title: Planning opportunities mined from filed owner returns and client data across the book, with dollar estimates
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - data-reporting
  - expert-judgment
  pattern: bulk-transformation
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    In the 2026 AICPA tax software survey, 93% of respondents said they use no tool to review returns for planning
    opportunities [AICPA-TAXSW-2026]. In the Thomson Reuters 2026 survey, 74% of respondents said clients strongly
    want additional financial advice, yet advisory margins are 20-24% against 28% for individual return preparation
    [TR-SOTP-2026].
  solution: >-
    Intuit Tax Advisor generates strategies automatically from ProConnect or Lacerte returns, and Intuit Assist
    (generative AI) answers questions and suggests the strategies most applicable to the client's goals; Intuit says the tool's existing
    strategies keep it from inventing recommendations [INTUIT-ASSIST-2024]. Wolters Kluwer describes CCH Axcess Advisor
    as surfacing opportunities hidden in client data, identifying which clients a given provision (for example, the
    2025 tax law changes) affects, and drafting outreach with Expert AI [WK-WHATSNEW-2025]. Filed, an AI-native vendor,
    says its Tax Planner builds an evidence-based plan from the return [FILED-HOME-2026]. WCG, a regional firm, says
    secure environments can already support tax plan comparisons and strategy recommendations [WCG-NOTREADY-2026].
  outcomes:
  - lever: growth
    description: >-
      In the AICPA survey, 93% of respondents did not use any other technology tool or application to review tax
      returns for planning opportunities; Holistiplan was used by 2%, and 5% used some other tool.
    figure: 93% did not use a planning-review tool; 2% used Holistiplan
    measures: >-
      share of 1,808 AICPA members who prepared 2025 returns for a fee, answering whether they use other technology
      tools to review tax returns to highlight planning opportunities; the survey is not AI-specific
    provenance: independent
    source_ref: AICPA-TAXSW-2026
  - lever: growth
    description: >-
      In the Thomson Reuters survey, 28% of respondent firms plan to start offering tax strategy in the next 12 months
      and 37% are considering it.
    figure: 28% planning; 37% considering
    measures: >-
      share of 600 respondents saying their firm plans or is considering to start offering tax strategy services in
      the next 12 months; the survey publisher also sells tax software
    provenance: vendor-published
    source_ref: TR-SOTP-2026
  prerequisites:
  - Return data in the tool's format (ProConnect or Lacerte for Intuit; CCH Axcess for Advisor)
  - Pricing for advisory work; the Thomson Reuters survey reports advisory margins below compliance margins [TR-SOTP-2026]
  risks_and_guardrails:
  - >-
    Advisory impact in Intuit's tool is "estimated and not guaranteed" per the page's own footnote [INTUIT-ASSIST-2024]
  - Written advice must meet Circular 230 section 10.37 [IRS-OPR-2026]
  - Product pages are vendor claims; no accuracy or uptake data for the AI layers was found
  human_checkpoints:
  - Adviser confirms eligibility and substance before any strategy is proposed to the owner
  role_evolution: >-
    Thomson Reuters reports that among firms that reallocated tasks, 39% named freeing professionals for advisory work
    as the primary driver [TR-SOTP-2026].
  evidence_grade: C
  sources:
  - ref: AICPA-TAXSW-2026
    title: 2026 tax software survey (1,808 AICPA members; AI adoption questions)
    publisher: The Tax Adviser and Journal of Accountancy (AICPA)
    type: survey
    url: https://www.thetaxadviser.com/issues/2026/aug/2026-tax-software-survey/
    date: '2026-08-31'
    access: full
    locator: section 'Use of AI and other technical tools', paragraph on planning-opportunity tools
  - ref: TR-SOTP-2026
    title: 2026 State of Tax Professionals Report
    publisher: Thomson Reuters Institute
    type: survey
    url: https://www.thomsonreuters.com/en-us/posts/wp-content/uploads/sites/20/2026/06/2026-State-of-Tax-Professionals-Report.pdf
    date: '2026-06'
    access: full
    locator: executive summary p.4 (74%, margins); Figure 14 p.19; Figure 18 p.24 (task reallocation drivers)
  - ref: INTUIT-ASSIST-2024
    title: New! Intuit Assist for Intuit Tax Advisor
    publisher: Intuit
    type: vendor
    url: https://accountants.intuit.com/taxprocenter/advisory-services/intuit-assist-for-intuit-tax-advisor/
    date: '2024-06-19'
