- id: tax-research-advisory-21
  title: 'M&A tax diligence: AI review of purchase agreements and a first-draft diligence report'
  archetype: tax
  module: research-advisory
  function: service-delivery
  work_types:
  - review-assurance
  - document-production
  - research-synthesis
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Transaction tax teams read long stock purchase and partnership agreements, research transaction-specific rules and
    write diligence reports under deal deadlines, leaving less time for structuring and hidden-risk analysis [KPMG-MA-2025].
  solution: >-
    KPMG US M&A Tax describes four GenAI tools: a research assistant for tax questions, accelerated review of SPAs and
    partnership agreements that highlights nonstandard clauses against baselines, an M&A Tax Reporting System that drafts
    an initial diligence report from jurisdiction, deal type and client constraints, and a writing review assistant;
    professionals add their own assessments [KPMG-MA-2025]. PCRT lists AI use in M&A (targets, due diligence, valuations)
    as an example use [PCRT-AI-2026]. A Hungarian advisory firm says AI tools process contracts and invoices to speed
    diligence [MONDAQ-HORIZON-2026].
  outcomes:
  - lever: speed
    description: KPMG's web page says the firm is compressing weeks of tax analysis into minutes
    figure: weeks to minutes
    measures: Marketing text; it does not say which analysis, how measured or over what sample
    provenance: self-reported
    source_ref: KPMG-MA-2025
  prerequisites:
  - Standardised national technology stack and workflows; KPMG says this came first [KPMG-MA-2025]
  - >-
    Data-room documents handled in a secure, approved environment with client authority to process them [PCRT-AI-2026]
  - Baseline clause positions for comparison [KPMG-MA-2025]
  risks_and_guardrails:
  - >-
    KPMG handles hallucination risk through human-in-the-loop validation with citations and hyperlinks and regular training
    [KPMG-MA-2025]
  - >-
    PCRT: client data for a transaction under NDA must not go into public AI tools; anonymise or use closed tools [PCRT-AI-2026]
  - >-
    Tax return information carries civil and criminal disclosure penalties (IRC 6713 and 7216) [IRS-OPR-2026]
  - >-
    No error rate for the clause-review or report-drafting tools is published [KPMG-MA-2025]
  human_checkpoints:
  - >-
    Professionals build on the draft with their own assessments and recommendations and validate output against the source
    documents
  - Senior reviewer signs the diligence report
  role_evolution: >-
    KPMG says practitioners shift from transactional and repetitive drafting tasks to deal structure, financial modelling,
    hidden risks and client-specific strategy [KPMG-MA-2025].
  evidence_grade: B
  sources:
  - ref: KPMG-MA-2025
    title: >-
      How generative AI is transforming mergers and acquisitions tax: The KPMG approach (PDF; web article at kpmg.com/us/en/articles/2025/how-generative-ai-transforming-mergers-acquisitions-tax.html)
