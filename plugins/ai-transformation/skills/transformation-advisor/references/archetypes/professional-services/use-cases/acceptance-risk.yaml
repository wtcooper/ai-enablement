- id: professional-services-acceptance-risk-08
  title: Risk-based acceptance workflow with scoring, routing, audit trail and generated engagement documents
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [transaction-processing, review-assurance]
  pattern: end-to-end-case-agent
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Acceptance run on email chains, paper and legacy systems takes days to weeks, gives partners no status visibility and
    tempts lawyers to bypass the process.
  solution: >-
    A configured acceptance platform replaces the manual routing. Approval paths follow risk score, jurisdiction, service
    line and counterparty. Conflicts, independence, AML and terms checks are connected, and an audit trail is kept.
    Approved intake data can produce engagement letters. This is the workflow base on which the AI features in entries
    02, 03 and 13 sit. The case studies below do not isolate any AI feature.
  outcomes:
    - lever: capacity
      description: "Intapp's case study says BDO Canada has processed more than 5,000 acceptances a month on average since go-live in January 2025, a 38% improvement on what the same resources could process before. No BDO Canada person is quoted on the figure."
      figure: "38%; more than 5,000 acceptances per month"
      measures: "average acceptances processed per month since go-live in January 2025, compared with what the firm could process before the system with the same resources (source wording)"
      provenance: vendor-published
      source_ref: INTAPP-BDOCA-2025
    - lever: capacity
      description: "Intapp's case study says Sandberg Phoenix is now opening three times as many matters, with significantly fewer errors."
      figure: "3x (three times more matters)"
      measures: "number of matters the firm opens, compared with its volume before Intapp Conflicts and Intake (source wording; no error figure given)"
      provenance: vendor-published
      source_ref: INTAPP-SANDBERG-2025
    - lever: speed
      description: "Loeb & Loeb's Systems Integration Manager says new business that took weeks (always at least a few days) is usually complete in a few hours. The case study says the conflicts team went from about 200 requests a month to sometimes 800."
      figure: "weeks or days to hours; about 200 to sometimes 800 requests per month"
      measures: "time to complete new business intake, as stated by the firm's Systems Integration Manager; requests processed per month by the conflicts team (case-study narrative). The case study says firm growth accounts for some of the increase."
      provenance: vendor-published
      source_ref: INTAPP-LOEB-2021
  prerequisites:
    - Integrations to the firm's financial, HR and CRM systems (BDO Canada cited Microsoft Dynamics and Workday as pain points before the change) (INTAPP-BDOCA-2025).
    - A firm-wide standard acceptance policy, so the workflow can enforce required fields and approvals (Loeb & Loeb, INTAPP-LOEB-2021).
    - A cleaned conflicts dataset; BDO Australia moved to a single searchable source across eight offices (INTAPP-BDOAU-2024).
  risks_and_guardrails:
    - The figures describe workflow platforms, not AI, and are reported in vendor-hosted case studies (grade capped at B).
    - Partners keep ultimate responsibility for conflicts clearance (BDO Australia's risk and ethics director, INTAPP-BDOAU-2024).
  human_checkpoints:
    - Partner and risk-team approvals along the configured path.
