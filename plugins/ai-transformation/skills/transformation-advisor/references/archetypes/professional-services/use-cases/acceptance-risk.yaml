- id: professional-services-acceptance-risk-13
  title: Continuous monitoring and re-screening of client relationships after acceptance
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, data-reporting]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Risk checks happen at onboarding, then clients change owners, face sanctions or litigation, or move into new
    jurisdictions. A VinciWorks summary of the SRA's 2025 AML report suggests re-screening lags: 92% of firms screen new
    clients against sanctions lists but only 79% re-check existing ones (VINCI-SRA-2025).
  solution: >-
    Intapp says its intake platform alerts when client ownership, sanctions status, litigation exposure or jurisdictional
    risk shifts, and triggers strategic reviews when AML, independence or risk-score thresholds are crossed. Celeste is
    described as continuously monitoring integrated data sources for conflicts.
  outcomes:
    - lever: risk
      description: "none published for the monitoring features"
      figure: none published
      measures: "not applicable: no figure for monitoring alerts was found"
      provenance: vendor-published
      source_ref: INTAPP-ONBOARDAI-2026
  prerequisites:
    - Third-party data feeds (Intapp lists sanctions screening, corporate hierarchies and beneficial ownership data) and entity matching between the firm's records and those feeds (INTAPP-ONBOARDAI-2026).
    - Configured thresholds for escalation by risk type.
  risks_and_guardrails:
    - The answer recorded at a VinciWorks AML Core Group meeting of UK law-firm compliance staff is that technology, including AI, is effective when well calibrated and governed, but over-reliance without tuning often leads to alert fatigue (VINCI-AML-2026).
    - Alert volumes and false-positive rates for these features are unpublished (gap).
  human_checkpoints:
    - Risk team triages alerts and decides on strategic review or exit.
  role_evolution: "No firm account found."
  evidence_grade: C
  sources:
    - { ref: INTAPP-ONBOARDAI-2026, title: "AI-driven client onboarding for regulated professional firms (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/intake/", date: 2026-10-06, access: full, locator: "section 'Continuous monitoring and policy enforcement'" }
    - { ref: INTAPP-CONFLICTSAI-2026, title: "AI-powered conflicts management (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/conflicts/", date: 2026-08-17, access: full, locator: "'Catch conflicts automatically'" }
    - { ref: VINCI-SRA-2025, title: "The SRA releases its 2025 AML annual report. What does it mean for your firm?", publisher: VinciWorks, type: community, url: "https://vinciworks.com/blog/the-sra-releases-its-2025-aml-annual-report-what-does-it-mean-for-your-firm/", date: 2025-11-03, access: full, locator: "list of report findings (sanctions screening of new versus existing clients)" }
    - { ref: VINCI-AML-2026, title: "AML compliance in 2026: What UK law firms are asking now", publisher: VinciWorks, type: community, url: "https://vinciworks.com/blog/aml-compliance-in-2026-what-uk-law-firms-are-asking-now/", date: 2026-01-28, access: full, locator: "Q&A on technology and false positives" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: law and accounting firms (vendor-described; no named customer). The 92% and 79% figures are the
    Solicitors Regulation Authority (SRA) findings as summarised by VinciWorks. The SRA's own report site
    (publications.sra.org.uk/aml-report-2025, via a mirror) confirmed 935 engagements and 270 non-compliant firms, but
    the sanctions figures were not in the pages reached, so they remain secondary. They describe current practice at UK
    law firms, not AI. Measures: share of firms reviewed that screen new clients against sanctions lists, and share that
    re-check existing clients (source wording). For audit-client independence monitoring, see
    assurance-acceptance-independence-06.
- id: professional-services-acceptance-risk-14
  title: In-house legal front door that routes, completes and logs business requests (in-house)
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [transaction-processing, client-interaction]
  pattern: service-agent-escalation
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    In-house teams get a stream of incomplete requests (a contract to check, a supplier to approve). Business teams stall
    or proceed without legal input and take on risk legal never sees.
  solution: >-
    In-house, vendor-described. Legora's Intake (available in Slack) has an agent read each request, ask for missing
    details, route it to the right team as a tracked task, and prepare a first draft from the team's playbooks; the default
    is that a lawyer reviews every piece of work. Routine, pre-approved requests such as a standard NDA can be completed
    and returned without review. Harvey's Intake routes requests from email, Jira, Slack and others to approved agents or
    lawyers and keeps an audit trail.
  outcomes:
    - lever: capacity
      description: "none published. Legora cites the ACC 2026 benchmark median of 367 employees per in-house lawyer as the problem, not as a result."
      figure: none published
      measures: "not applicable: product launch; the 367 figure (employees per in-house lawyer, ACC 2026 benchmark, as cited by Legora) is context, not an outcome"
      provenance: vendor-published
      source_ref: LEGORA-INTAKE-2026
  prerequisites:
    - Team playbooks and request types defined; per-type rules for review versus auto-completion.
  risks_and_guardrails:
    - Legora's general counsel says she needed to know who owns the answer before letting an agent answer the business, and that in Intake a lawyer always does (LEGORA-INTAKE-2026).
    - Harvey lets teams set routing, access and review rules, with a clear owner and status on each request (HARVEY-INTAKE-2026).
  human_checkpoints:
    - Lawyer reviews each piece of work by default; routine pre-approved types can bypass review (LEGORA-INTAKE-2026).
  role_evolution: >-
    Legora's general counsel says that with Intake routine work such as security questionnaires stops landing on her most
    senior people (LEGORA-INTAKE-2026).
  evidence_grade: B
  sources:
    - { ref: LEGORA-INTAKE-2026, title: "Legora launches Intake: an agentic front door for in-house legal teams", publisher: Legora, type: vendor, url: "https://legora.com/newsroom/legora-launches-intake-an-agentic-front-door-for-in-house-legal-teams", date: 2026-10-13, access: full, locator: "paragraphs 1-8" }
    - { ref: HARVEY-INTAKE-2026, title: "Intake: move every request toward resolution (product page)", publisher: Harvey, type: vendor, url: "https://www.harvey.ai/platform/intake", date: 2026-10-13, access: full, locator: "sections 'Give Your Team a Head Start', 'Stay in Control of Every Request'; Carvana quote" }
    - { ref: AL-COHESO-2026, title: "Legal Front Door Coheso Launches 'Memory' (AL Interview)", publisher: Artificial Lawyer, type: press, url: "https://www.artificiallawyer.com/2026/10/08/legal-front-door-coheso-launches-memory-al-interview/", date: 2026-10-08, access: full, locator: "paragraphs 1-6" }
  last_reviewed: 2026-10-19
  notes: >-
    In-house. This is a client-side request front door, next to firm client acceptance; it may belong to a
    legal-operations extension. B rests on Carvana's senior corporate counsel appearing as a named Harvey design partner
    and on Legora's own general counsel partnering on the design; no results are published. Legora's release shows 13
    Oct 2026 beside its headline. Harvey's page has no visible date; its product video's JSON-LD uploadDate (2026-10-13)
    is used. Coheso, another in-house legal front door, launched Memory on 8 Oct 2026 (held in knowledge-management).
    Dentsu's in-house team runs workflows for non-compete checks on new customers
    (professional-services-work-production-18).
