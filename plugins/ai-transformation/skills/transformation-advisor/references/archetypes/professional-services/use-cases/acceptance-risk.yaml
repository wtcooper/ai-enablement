# professional-services / acceptance-risk use cases (sources checked 2026-10-19)
# Firm kinds are named in each entry's notes; in-house examples are tagged "in-house".
# Audit-client independence, AI-vendor independence and the Grant Thornton UK KYC platform are held in the assurance
# archetype (assurance-acceptance-independence-02, -03, -13) and are cross-referenced, not repeated, here.
# Source-key notes: INTAPP-CONFLICTSAI-2026 is intapp.com/conflicts/ and INTAPP-ONBOARDAI-2026 is intapp.com/intake/;
# INTAPP-INTAKE-2026 is the accounting acceptance page, matching the key used in the assurance archetype.
# XAPIEN-PINSENT-2025 is the case study and XAPIEN-PINSENT-EBOOK-2025 the ebook summary: two documents.
# ARXIV-ADVERSE-2025 (arXiv preprint, read in full) and ORBILU-ADVERSE-2025 (University of Luxembourg repository record,
# seen in search only) are two copies of one paper, kept apart because only the preprint was read.

- id: professional-services-acceptance-risk-01
  title: Early opportunity screening against conflicts before a pitch or proposal advances
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Pitching for work that later fails conflicts wastes pursuit effort and embarrasses the firm.
  solution: >-
    Intapp says its conflicts product can screen opportunities before they advance to formal review. For ChatGPT
    Enterprise users, the Celeste plug-in is described as sourcing opportunities on work the firm has already cleared
    for conflicts.
  outcomes:
    - lever: speed
      description: none published
      figure: none published
      measures: "not applicable: announced capability"
      provenance: vendor-published
      source_ref: INTAPP-CONFLICTSAI-2026
  prerequisites:
    - Conflicts data connected to CRM (customer relationship management) and the pipeline.
  risks_and_guardrails:
    - Early screens use thinner information than a formal intake; no false-negative rate is published.
  human_checkpoints:
    - Formal conflicts review follows before acceptance.
  role_evolution: "No source."
  evidence_grade: C
  sources:
    - { ref: INTAPP-CONFLICTSAI-2026, title: "AI-powered conflicts management (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/conflicts/", date: 2026-08-17, access: full, locator: "'Spot conflicts early'" }
    - { ref: INTAPP-OPENAI-2026, title: "Intapp collaborates with OpenAI to bring frontier AI to the business of law", publisher: Intapp, type: vendor, url: "https://www.intapp.com/news/intapp-celeste-for-openai-for-law/", date: 2026-09-17, access: full, locator: "bullet list under 'Entitled access'" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: law and accounting firms (Intapp customers); no named customer for this feature. The product page has no
    visible date; its date is the page's JSON-LD dateModified (2026-08-17). Overlaps pursuit-proposals; the conflicts
    screen itself belongs here.
- id: professional-services-acceptance-risk-02
  title: AI-prepopulated intake requests with role-based risk summaries for reviewers
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [transaction-processing, document-production]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Fee earners must re-key client and matter details into acceptance forms. Reviewers then read long requests to find
    the conflicts, anti-money-laundering (AML) and jurisdiction issues that matter to them.
  solution: >-
    Intapp says Celeste pulls details from emails and files and prepopulates the request in Outlook, validates entries
    before submission, and generates role-based summaries that highlight conflicts, AML risks, jurisdictional risk and
    strategic fit. Its accounting acceptance page also describes AI request summaries.
  outcomes:
    - lever: speed
      description: "none published for the AI features; the vendor describes the features only"
      figure: none published
      measures: "not applicable: no figure for AI prepopulation or summaries was found"
      provenance: vendor-published
      source_ref: INTAPP-ONBOARDAI-2026
  prerequisites:
    - A configured acceptance workflow and form set to prepopulate (see professional-services-acceptance-risk-08).
    - Email and document access for the agent, scoped under the firm's confidentiality rules.
  risks_and_guardrails:
    - California's guidance warns that agents with persistent access to email, document management and client files can expose confidential information across matters if poorly scoped (CALBAR-GENAI-2026).
    - Reviewers who rely on a generated summary may miss what it omits; no omission rate has been published (gap).
    - IESBA (June 2026) says accountants must assess the fitness for purpose and potential bias of technology outputs, and that the Code now names automation bias (favouring a system's output over contradictory information) as a bias that can impair objectivity (IESBA-SNAPSHOT-2026, Q4).
    - Oregon's 2026 opinion says it is important that lawyers who obtain enough information about a prospect through a chatbot promptly enter the prospect into their conflict management system (OSB-FO-2026-208, section III.C).
  human_checkpoints:
    - Requester confirms prepopulated fields before submission.
    - Reviewers approve or escalate the request.
  role_evolution: >-
    Intapp positions the feature as reducing partner burden on data capture (INTAPP-ONBOARDAI-2026). No firm account of
    changed roles was found.
  evidence_grade: C
  sources:
    - { ref: INTAPP-ONBOARDAI-2026, title: "AI-driven client onboarding for regulated professional firms (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/intake/", date: 2026-10-06, access: full, locator: "section 'AI-driven intake requests'" }
    - { ref: INTAPP-INTAKE-2026, title: "Business acceptance and continuance solution for accounting firms (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/accounting/client-onboarding-continuance/", date: 2026-07-29, access: full, locator: "section 'Accelerate onboarding...' (AI request summaries)" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Duty of Confidentiality, pp. 5-6" }
    - { ref: IESBA-SNAPSHOT-2026, title: "IESBA Snapshot: Ethics and Independence Approach to the Use of Technology", publisher: IESBA, type: standard-setter, url: "https://www.ethicsboard.org/news-events/2026-06/iesba-snapshot-ethics-and-independence-approach-use-technology", date: "2026-06-11", access: full, locator: "Q2 (Code applies to technology); Q4 (use of technology outputs; automation bias)" }
    - { ref: OSB-FO-2026-208, title: "Formal Opinion No 2026-208: Chatbots and AI Agent Communications", publisher: Oregon State Bar, type: professional-body, url: "https://www.osbar.org/_docs/ethics/2026-208.pdf", date: "2026-02", access: full, locator: "section III.C" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: law and accounting firms (Intapp product pages); no named customer is tied to these AI features. Both
    product pages show no visible date; their dates are the pages' JSON-LD dateModified values (intake 2026-10-06,
    accounting 2026-07-29). For the accounting version of this workflow, see assurance-acceptance-independence-02.
- id: professional-services-acceptance-risk-03
  title: Agentic conflicts search, hit triage and clearance-summary drafting
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Conflicts analysts build searches, read long hit lists and write up each clearance decision. Volume rises with
    lateral hiring and growth, and the history of a client relationship often sits outside the conflicts database.
  solution: >-
    Intapp says its Celeste assistant builds the search strategy, triages high-risk hits for expert review, drafts a
    clearance summary for each analysis and keeps monitoring integrated data sources for new issues. Checks can be
    started from the intake or CRM system. Experts review the hits and decide.
  outcomes:
    - lever: speed
      description: >-
        Vendor says Celeste surfaces relevant matters, partner experience and prior pitch materials for an urgent client
        request "in minutes rather than hours". No measured study was published.
      figure: "minutes rather than hours"
      measures: >-
        Vendor description of the time to surface relevant matters, partner experience and prior pitch materials for an
        urgent client request; not a measured result and not specific to conflict clearance time.
      provenance: vendor-published
      source_ref: INTAPP-CELESTEGA-2026
    - lever: capacity
      description: >-
        Intapp's chief product officer says that when a conflicts team can clear 10 times the matters, that is a new
        business model. The statement is conditional ("When a conflicts team can ..."), not a reported result.
      figure: "none published (conditional 10x statement)"
      measures: "Conditional vendor-executive statement about matters cleared by a conflicts team; no baseline or sample given."
      provenance: vendor-published
      source_ref: INTAPP-CELESTEGA-2026
  prerequisites:
    - A firm system of record for clients, matters, parties and relationships that the agent can search (Intapp positions Celeste as natively integrated with the firm's systems of record) (INTAPP-CELESTEGA-2026).
    - Documented conflicts methods and playbooks the agent can follow. The Thomson Reuters Institute premortem scenario shows the agent failing where informal rules were never written down (TRI-PREMORTEM-2026).
    - Ethical-wall and need-to-know rules applied to the agent as they apply to people (INTAPP-CELESTEGA-2026).
  risks_and_guardrails:
    - A hypothetical premortem describes an agent clearing a conflict that depended on undocumented history; the scenario is illustrative and not a real incident (TRI-PREMORTEM-2026).
    - California's 2026 guidance says lawyers must not let agentic systems make substantive legal determinations without meaningful lawyer supervision, and that agent access to client files must be scoped and monitored (CALBAR-GENAI-2026).
    - Vendor material reports no accuracy benchmark or independent evaluation (INTAPP-CELESTEGA-2026 reports none; LAWSITES-CELESTE-2026 gives none).
  human_checkpoints:
    - Expert review of triaged hits before clearance.
    - Partner or risk-counsel decision on waivers and screens.
  role_evolution: >-
    BakerHostetler's CIO says the firm has onboarded many clients and complex engagements through lateral growth and
    believes Celeste can help it evaluate conflicts faster (INTAPP-CELESTEGA-2026). The one conflicts-analyst posting
    opened lists search, contextual analysis and intake management and requires Intapp, iManage and Aderant experience,
    with no AI duty visible in the public summary (VIRTUALVOCATIONS-2026).
  evidence_grade: B
  sources:
    - { ref: INTAPP-CELESTEGA-2026, title: "Intapp announces general availability of Celeste, the expert AI coworker for professional firms", publisher: Intapp, type: vendor, url: "https://www.intapp.com/news/general-availability-celeste/", date: 2026-07-15, access: full, locator: "paragraphs 3-7 and supporting quotes (Lowry, Jampol)" }
    - { ref: LAWSITES-CELESTE-2026, title: "Intapp makes Celeste generally available, calling it an AI coworker to run the business side of law firms", publisher: LawSites (LawNext), type: press, url: "https://www.lawnext.com/2026/07/intapp-makes-celeste-generally-available-calling-it-an-ai-coworker-to-run-the-business-side-of-law-firms.html", date: 2026-07-16, access: full, locator: "paragraphs on BakerHostetler and playbooks" }
    - { ref: INTAPP-CONFLICTSAI-2026, title: "AI-powered conflicts management (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/conflicts/", date: 2026-08-17, access: full, locator: "section 'Agentic conflicts clearance'" }
    - { ref: TRI-PREMORTEM-2026, title: "Premortem: Your 2028 agentic AI pilot program failed", publisher: Thomson Reuters Institute, type: press, url: "https://www.thomsonreuters.com/en/insights/articles/premortem-your-2028-agentic-ai-pilot-program-failed", date: 2026-02-18, access: full, locator: "Premortem No. 1, paragraphs on the conflicts check" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "Executive Summary p. 2; Duty of Confidentiality pp. 5-6" }
    - { ref: VIRTUALVOCATIONS-2026, title: "Conflicts Analyst (remote job posting)", publisher: Virtual Vocations, type: job-posting, url: "https://www.virtualvocations.com/job/conflicts-analyst-3264522-i.html", date: 2026-09-22, access: full, locator: "Job Summary and Required Qualifications" }
    - { ref: LEGALTECH-CELESTE-2026, title: "Intapp bets on 'firm AI' with general release of Celeste", publisher: Legal IT Insider, type: press, url: "https://legaltechnology.com/intapp-bets-on-firm-ai-with-general-release-of-celeste/", date: 2026-07-27, access: full, locator: "paragraphs 'Another early use case is on the intake and conflict side' and 'Baker Hostetler is one of Intapp's Celeste launch clients'" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: law firms (BakerHostetler named as an early adopter). Celeste was previewed in Feb 2026 and made
    generally available 15 Jul 2026. The BakerHostetler quote is a belief about future impact, so maturity is
    "piloting", not "in-production"; graded B on the named early adopter, with no published measurement. LawSites says
    Celeste was in limited release with early adopters including BakerHostetler, and that the firm's focus so far has
    been intake and conflicts. In Legal IT Insider, Intapp's chief product officer calls BakerHostetler a launch client
    and says intake and conflicts is "the use case that they really grabbed onto" (LEGALTECH-CELESTE-2026, read in
    full). The conflicts product page shows no visible date; its JSON-LD dateModified (2026-08-17) is used. For
    accounting-firm conflicts and independence clearance, see assurance-acceptance-independence-01.
- id: professional-services-acceptance-risk-04
  title: Small-firm conflicts-check agent with corporate-family mapping and fuzzy matching
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, research-synthesis]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    A small firm clears conflicts with a spreadsheet and partner memory, missing relationships hidden behind different
    entity names or corporate parents.
  solution: >-
    The writer describes a four-stage agent: it ingests new-matter details, maps corporate hierarchies from a state
    registry and firm records, runs fuzzy and opposing-party searches across the client database, and scores each
    potential match by risk.
  outcomes:
    - lever: speed
      description: >-
        The write-up says conflicts-check time fell from 2-3 hours per new matter to 8 minutes. The firm is unnamed (a
        14-attorney Nashville firm) and the page is a builder's own account.
      figure: "2-3 hours to 8 minutes per new matter"
      measures: "time per new-matter conflicts check, as stated by the author for one unnamed firm; no sample size or method"
      provenance: vendor-published
      source_ref: ADAI-CONFLICT-2026
  prerequisites:
    - Client history digitised with related entities; a registry data source.
  risks_and_guardrails:
    - The author says the first version flagged too aggressively (common surnames, generic names, registered agents), so the managing partner spent more time dismissing false positives than on the manual checks; thresholds were tuned over three weeks (ADAI-CONFLICT-2026).
  human_checkpoints:
    - Red (direct) and orange (related-entity) flags go to the responsible partner, who makes the legal call; green (no match) results are auto-approved with a logged audit trail (ADAI-CONFLICT-2026).
  role_evolution: "Managing partner no longer runs the manual search (author's account, ADAI-CONFLICT-2026)."
  evidence_grade: C
  sources:
    - { ref: ADAI-CONFLICT-2026, title: "The Conflict Check Agent", publisher: AdAI (newsletter), type: vendor, url: "https://www.adai.news/p/ai-conflict-check-agent-law-firm-case-study", date: 2026-02-23, access: full, locator: "TL;DR; 'What We Built'; the section on false positives" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: an unnamed small US law firm. Self-published by the builder, no independent check: usable as a signal
    about false-positive tuning only, and not counted as a named deployment. Kept separate from entry 03 because it is a
    custom build at a small firm rather than an enterprise platform.
