  role_evolution: >-
    Intapp's Loeb & Loeb case study says the project made the firm's "human workflow engine" (a phrase from its Systems
    Integration Manager) obsolete, where the earlier paper workflow needed a team of four on data entry, and that
    engagement letters could no longer be overlooked or delayed (INTAPP-LOEB-2021). The Sandberg Phoenix case study says
    the firm needed a dedicated intake department and a more sophisticated system as it grew (INTAPP-SANDBERG-2025).
  evidence_grade: B
  sources:
