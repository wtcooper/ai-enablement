- id: professional-services-acceptance-risk-11
  title: "Idea: structured register of client AI restrictions, consents and disclosures, checked at matter opening"
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [review-assurance, client-interaction]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    Clients are adding AI rules to outside counsel guidelines and engagement letters (disclosure or consent, approved
    tools, no client data in public models, billing for AI-driven savings). Some clients bar AI without permission or ask
    for warranties that models are unbiased; Starbucks is reported to strictly restrict vendor and outside-counsel AI
    use. Firms must follow these rules, and permitted tools differ by client.
  solution: >-
    Idea, drawn from a vendor compliance guide (Layer3 Labs): capture each client's AI terms as structured obligations at
    intake, check each AI tool against the client's list before work starts, and keep a record of which tool touched which
    matter (LAYER3-OCG-2026). Intapp announced a
    Celeste plug-in for ChatGPT Enterprise that lets professionals check captured work against the firm's outside counsel
    guidelines.
  outcomes:
    - lever: risk
      description: none published
      figure: none published
      measures: "not applicable: idea; no firm reporting a client-AI-terms register was found"
      provenance: vendor-published
      source_ref: LAYER3-OCG-2026
  prerequisites:
    - Client guidelines captured as structured terms (professional-services-acceptance-risk-10).
    - An inventory of the AI tools actually in use; an ACCA In Practice article notes that real use may not match the list of products a firm believes it has authorised (ACCA-ENGLETTERS-2026).
  risks_and_guardrails:
    - California's guidance says a lawyer must follow client instructions or guidelines that restrict AI use (CALBAR-GENAI-2026, Communication row, p. 7).
    - ABA Opinion 512 says lawyers must disclose AI use if the engagement terms or OCGs require it, and that boilerplate engagement-letter wording is not enough for informed consent to input client information into a self-learning tool (ABA-OP512-2024).
    - An ACCA In Practice article says inserting an AI clause will not make an unsafe process safe; policies, training and what happens on the file must support it (ACCA-ENGLETTERS-2026).
    - At Legalweek 2026 a DLA Piper AI innovation leader said some clients still send directives that bar AI without permission or demand warranties that models are unbiased (TRI-LEGALWEEK-2026).
  human_checkpoints:
    - The firm agrees any client AI restriction clearly with the client and decides how internal compliance will be monitored (ACCA-ENGLETTERS-2026); who signs off is not specified in the sources.
  role_evolution: >-
    A Sandpiper Partners roundtable listed the role of firm general counsel in managing compliance with AI-related
    guidelines as a session topic (JENNER-SANDPIPER-2026). On the client side, GSK's chief of staff described asking
    outside firms what AI they use, how, and how it generates savings (TRI-LEGALWEEK-2026).
  evidence_grade: D
