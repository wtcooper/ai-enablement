    - { ref: LAWSITES-CELESTE-2026, title: "Intapp makes Celeste generally available, calling it an AI coworker to run the business side of law firms", publisher: LawSites (LawNext), type: press, url: "https://www.lawnext.com/2026/07/intapp-makes-celeste-generally-available-calling-it-an-ai-coworker-to-run-the-business-side-of-law-firms.html", date: 2026-07-16, access: full, locator: "paragraph on lateral hiring" }
    - { ref: INTAPP-ONBOARDAI-2026, title: "AI-driven client onboarding for regulated professional firms (product page)", publisher: Intapp, type: vendor, url: "https://www.intapp.com/intake/", date: 2026-10-06, access: full, locator: "'Protect confidential information'" }
    - { ref: CALBAR-GENAI-2026, title: "Practical Guidance for the Use of Generative Artificial Intelligence in the Practice of Law (2026 revision)", publisher: "State Bar of California, Standing Committee on Professional Responsibility and Conduct (COPRAC)", type: regulator, url: "https://www.calbar.ca.gov/sites/default/files/portals/0/documents/ethics/Generative-AI-Practical-Guidance.pdf", date: "2026-05-14", access: full, locator: "p. 9" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: law firms (vendor-described; no named adopter for this playbook). The only delegate-level entry in the
    module, and it is an announcement. Lateral hiring itself is a talent-learning topic; only the conflicts pre-screen
    belongs here.
- id: professional-services-acceptance-risk-06
  title: LLM-generated sourced due-diligence report with risk-tiered routing at client onboarding
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [research-synthesis, review-assurance]
  pattern: research-brief
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Every new client needs AML and bribery screening, so analysts spend hours on low-risk clients while the few risky
    ones wait in the same queue. Xapien's ebook summary describes partners spending up to three hours per client and
    analysts working overtime screening false positives (XAPIEN-PINSENT-EBOOK-2025).
  solution: >-
    Pinsent Masons co-developed with Xapien what Xapien calls the legal market's first LLM-powered AML due-diligence
    tool. The tool generates a sourced report on AML, anti-bribery and corruption, and ESG risks and flags risky
    connections. Low-risk reports pass with minimal oversight, medium-risk ones go to the AML team, and high-risk ones
    need further verification or partner consultation.
  outcomes:
    - lever: speed
      description: "Pinsent Masons expects low-risk clients to be cleared in hours rather than days, and a report in around 15 minutes. Both are stated as expectations (future tense)."
      figure: "hours rather than days; around 15 minutes per report"
      measures: "expected time to clear low-risk clients, and expected time for the tool to generate a report (vendor case-study wording: 'expects', 'will generate'); not a measured result"
      provenance: vendor-published
      source_ref: XAPIEN-PINSENT-2025
    - lever: capacity
      description: "Xapien's Nov 2025 ebook summary says Pinsent Masons' General Counsel found fee earners losing 2.4 million hours to opening new matters and partners spending up to three hours per client. It describes the problem and does not report a result."
      figure: "2.4 million hours; up to three hours per client (problem statement)"
      measures: "hours fee earners were losing to opening new matters, and partner time per client, as stated in the ebook summary; the period and scope are not given in the text opened"
      provenance: vendor-published
      source_ref: XAPIEN-PINSENT-EBOOK-2025
  prerequisites:
    - Defined risk bands and routing rules (low, medium, high) agreed with the MLRO (money laundering reporting officer) or equivalent.
    - Entity matching tuned to keep false positives down; the ebook summary says analysts worked overtime screening false positives before the tool (XAPIEN-PINSENT-EBOOK-2025).
  risks_and_guardrails:
    - At a VinciWorks AML Core Group meeting of UK law-firm compliance staff (published Jan 2026), the answer recorded is that AI is used for triage and efficiency, not decision-making, and that acceptance decisions must remain human-led and defensible (VINCI-AML-2026).
    - Same meeting - onboarding and screening systems are strong on scale and consistency but weaker on context, judgment and complex structures (VINCI-AML-2026).
    - The title of the Xapien ebook claims 90% automation and a 16 million pound saving. The body opened does not show how either was calculated, so neither is used as an outcome (XAPIEN-PINSENT-EBOOK-2025).
  human_checkpoints:
    - AML team evaluates medium-risk reports; analysts and partners handle high-risk cases.
  role_evolution: >-
    Xapien says analysts can allocate effort to higher-risk cases and apply controls proportionate to each client's risk
    (XAPIEN-PINSENT-2025).
  evidence_grade: B
  sources:
    - { ref: XAPIEN-PINSENT-2025, title: "Pinsent Masons: Co-developing the first AML due diligence tool powered by a Large Language Model (case study)", publisher: Xapien, type: vendor, url: "https://xapien.com/case-studies/pinsent-masons/", date: 2025-01-30, access: full, locator: "sections 'Before Xapien' and 'With Xapien'" }
    - { ref: XAPIEN-PINSENT-EBOOK-2025, title: "How Pinsent Masons automates 90% of client onboarding to save £16m (ebook summary)", publisher: Xapien, type: vendor, url: "https://xapien.com/ebook/how-pinsent-masons-automates-90-of-client-onboarding-to-save-16m/", date: 2025-11-06, access: full, locator: "eBook summary paragraph" }
    - { ref: XAPIEN-IDD-2024, title: "How a law firm merged initial due diligence into client onboarding", publisher: Xapien, type: vendor, url: "https://xapien.com/how-a-law-firm-merged-initial-due-diligence-into-client-onboarding/", date: 2024-02-01, access: full, locator: "paragraphs 'Get a flavour of risk' and 'How one law firm uses Xapien'" }
    - { ref: VINCI-AML-2026, title: "AML compliance in 2026: What UK law firms are asking now", publisher: VinciWorks, type: community, url: "https://vinciworks.com/blog/aml-compliance-in-2026-what-uk-law-firms-are-asking-now/", date: 2026-01-28, access: full, locator: "Q&A on AI providers for background checks and on technology strengths and limits" }
  last_reviewed: 2026-10-19
  notes: >-
    Firm kind: UK law firm (Pinsent Masons). Graded B because Pinsent Masons is a named co-development partner, but the
    case study is in future tense and publishes no measurement, so maturity is "piloting". The case-study page shows no
    visible date; its JSON-LD datePublished is 2025-01-30 (modified 2026-06-18), so the source is dated 2025. A search
    summary (not opened) attributed to a Xapien interview figures of 26 days average onboarding before, a 58% cut in AML
    analysis hours and projected savings; those are search-only and not used. A second Xapien case study (Al Tamimi and
    Company) was seen in search results only. The 2024 Xapien post describes an unnamed law firm. For accounting-firm
    AML onboarding see assurance-acceptance-independence-04, and for Grant Thornton UK's unified KYC, due-diligence and
    acceptance platform (Fenergo) see assurance-acceptance-independence-03.
- id: professional-services-acceptance-risk-07
  title: "Idea: agentic adverse-media screening of prospective clients (research prototype)"
  archetype: professional-services
  module: acceptance-risk
  function: risk-compliance-legal
  work_types: [research-synthesis, review-assurance]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Keyword-based adverse-media screening (searching news for negative coverage of a client) produces many false
    positives, and hybrid systems need extensive manual review.
  solution: >-
    Idea: an LLM agent searches the web, retrieves documents and computes an adverse-media score with a written
    justification, for an analyst to review. A December 2025 University of Luxembourg paper presents an open-source version
    aimed at financial institutions' AML and KYC compliance (ARXIV-ADVERSE-2025).
  outcomes:
    - lever: quality
      description: none published
      figure: none published
