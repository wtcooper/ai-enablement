    decisions belong to professional-services-staffing-resourcing.

- id: advisory-transactions-07
  title: "AI-assisted lender QoE for SBA 7(a) change-of-ownership loans"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    SBA SOP 50 10 8.1, effective 2026-10-01, makes an independent QoE with a cash proof a condition on larger 7(a)
    acquisitions, and the lender must use the QoE earnings in the debt service calculation (QoEAgent's reading of the
    SOP). Lenders and buyers need many such reports quickly.
  solution: >-
    QoEAgent offers an SBA Lender QoE built to the SOP: a cash proof for the trailing twelve months and two prior
    fiscal years, GAAP-format financials, adjusted EBITDA schedules, a book-to-tax reconciliation, and working capital
    and customer analysis, delivered through a lender portal.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "Vendor says the rule adds weeks to credit processes; no turnaround data for the lender product", provenance: vendor-published, source_ref: QOEAGENT-SBAREQ-2026}
  prerequisites:
    - "Independent, experienced financial professional engaged for the benefit of the lender, per the SOP clause as quoted by QoEAgent (QOEAGENT-SBAREQ-2026)"
    - "Bank statements, ledger and trial balance, and prior-year tax returns (QOEAGENT-HOME-2026)"
  risks_and_guardrails:
    - "Per QoEAgent's reading, the seller-prepared report is barred outright. A buyer-commissioned report is allowed only if one of the lender's own vendors reviews it and the review findings are kept in the loan file (QOEAGENT-SBAUPDATE-2026)"
    - "The SBA page confirms version 8.1 with technical updates effective 2026-10-01; the SOP's QoE clause text was read only through vendor pages because the SBA document download returned an error (SBA-SOP5010-2026)"
    - "The $3 million threshold and the Owner Buyout and ESOP exemptions are as stated by QoEAgent; not verified against the SBA text (QOEAGENT-SBAUPDATE-2026)"
  human_checkpoints:
    - "A named professional stands behind the conclusions; lender vendor review where a buyer-commissioned report is used (QOEAGENT-SBAUPDATE-2026)"
  role_evolution: "Not stated by the sources."
  evidence_grade: C
  sources:
    - {ref: SBA-SOP5010-2026, title: "Lender and Development Company Loan Programs (SOP 50 10)", publisher: "U.S. Small Business Administration", type: regulator, url: "https://www.sba.gov/document/sop-50-10-lender-development-company-loan-programs", date: "2026-10-01", access: full, locator: "document header: 'Effective: October 1, 2026'; 'Version 8.1 with Technical Updates'. Date is the effective date; QoE clause not on this page"}
    - {ref: QOEAGENT-SBAUPDATE-2026, title: "The September 25 Update: A Buyer's QoE Can Now Reach the Lender", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/sba-qoe-september-25-update/", date: "2026-10-01", access: full, locator: "'What the clause said, and what it says now'; 'The vendor review is the condition'; 'What did not change'"}
    - {ref: QOEAGENT-SBAREQ-2026, title: "SBA Quality of Earnings: What the 2026 Rule Requires", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/sba-quality-of-earnings-requirement/", date: "2026-09-01", access: full, locator: "opening 'Short answer'; 'The earnings number is no longer the seller's number'"}
    - {ref: QOEAGENT-HOME-2026, title: "QoEAgent: AI quality of earnings, proof of cash and SBA lender QoE (home page)", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/", date: "2026-10-20", access: full, locator: "'SBA Lender QoE' section"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: AI-native provider. This is a regulatory demand driver for QoE in the lower middle market, with AI as
    the delivery method claimed by one vendor. Independence: the SBA clause is about the lender's reliance on the
    report, not auditor independence. The SBA valuation clause (no valuation prepared for the applicant or seller) is
    routed to the valuation module.

- id: advisory-transactions-08
  title: "AI-assisted sell-side QoE and pre-sale diligence readiness"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [document-production, review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Sellers who wait for the buyer's diligence meet findings late, in the middle of a process, which can trigger price
    adjustments (Pease Bell).
  solution: >-
    Run AI-driven pre-sale diligence and a sell-side QoE with proof of cash before going to market, so issues are
    found and addressed early. Pease Bell describes this for sellers; QoEAgent lists sell-side advisors as a customer
    group.
  outcomes:
    - {lever: risk, description: "Pease Bell says pre-sale AI diligence reduces the likelihood of purchase price adjustments and speeds the path to closing", figure: "none published", measures: "General claim in a firm article; no data or engagement cited", provenance: self-reported, source_ref: PEASEBELL-2026}
  prerequisites:
    - "Seller willingness to open books to a pre-sale review"
  risks_and_guardrails:
    - "Per QoEAgent's summary of the SBA rule, a seller-prepared report cannot be used by the lender (QOEAGENT-SBAUPDATE-2026)"
  human_checkpoints:
    - "Not described"
  role_evolution: >-
    Pease Bell says many entry-level transaction advisory tasks (aggregation, reconciliation, schedule preparation,
    initial analysis) can be handled by AI with minimal oversight and that early-career staff must interpret outputs
    with professional skepticism (PEASEBELL-2026). It gives no staffing data.
  evidence_grade: C
  sources:
    - {ref: PEASEBELL-2026, title: "AI in Transaction Advisory", publisher: "Pease Bell CPAs", type: firm, url: "https://www.peasebell.com/insights/artificial-intelligence-in-transaction-advisory/", date: "2026-02-27", access: full, locator: "sections 'How AI Accelerates Due Diligence' (sell-side paragraph) and 'What AI Means for Transaction Advisory Staffing'. Read through the r.jina.ai mirror"}
    - {ref: QOEAGENT-HOME-2026, title: "QoEAgent: AI quality of earnings, proof of cash and SBA lender QoE (home page)", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/", date: "2026-10-20", access: full, locator: "'Who we serve' (sell-side bankers and advisors)"}
    - {ref: QOEAGENT-SBAUPDATE-2026, title: "The September 25 Update: A Buyer's QoE Can Now Reach the Lender", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/sba-qoe-september-25-update/", date: "2026-10-01", access: full, locator: "'What the clause said, and what it says now'"}
    - {ref: CTACQ-QOE-2026, title: "2026 QoE Provider Comparison: 18 Firms Ranked by Price & Sector", publisher: "CT Acquisitions (M&A advisory marketing page)", type: vendor, url: "https://www.ctacquisitions.com/guides/qoe-provider-comparison-2026/", date: "2026-05-16", access: full, locator: "Quick Answer paragraph (sell-side QoE cost 40-60% of buy-side); opening only was read"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: mid-market CPA firm (Pease Bell; size not verified) and AI-native provider. The article says firms are
    'already seeing measurable gains' but gives no figures. A broker's marketing page (CTACQ-QOE-2026) says sell-side
    QoE typically costs 40-60% of a buy-side QoE; that is a general price observation, not AI-specific, and is not used
    as an outcome. Vendor due diligence is the UK term for a seller-commissioned report; no AI-specific source on it
    was found.

- id: advisory-transactions-09
  title: "Data-room document intelligence with source citations for diligence teams"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Data rooms (the secure document repositories a seller opens to bidders) are growing and timelines are compressing,
    making it harder to bring the same judgment to each issue (PwC-ToltIQ release). Contract review is often descoped
    from financial diligence because of time (PwC deals leader, ICAEW).
  solution: >-
    Tools ingest data rooms and disparate documents, surface key points with source citations, and let teams question
    the corpus. PwC's Deals practice has used ToltIQ on live transactions; PwC UK describes using Harvey to analyse
    deal-room material with citations. PwC's deals leader says contracts that used to be descoped can now be
    reviewed, which creates follow-up on anomalies.
  outcomes:
    - {lever: capacity, description: "PwC and ToltIQ report how widely the platform has been used inside PwC Deals", figure: "4,000+ PwC Deals practitioners; 5,000+ deals; 2 million+ documents", measures: "Usage counts stated in the joint release: practitioners who have used ToltIQ, deals it has been used on at PwC, and documents processed. Adoption counts, not performance.", provenance: self-reported, source_ref: PWC-TOLTIQ-2026}
    - {lever: capacity, description: "PwC UK deals leader on AI platform coverage in the UK deals business", figure: "2,500 practitioners, each with at least one platform", measures: "Stated by the PwC UK deals leader in a December 2024 magazine interview; adoption count, not performance", provenance: self-reported, source_ref: ICAEW-BIGSIX-2024}
    - {lever: quality, description: "Adjacent measurement: a law firm's tests of LLM review of commercial contracts in M&A legal due diligence", figure: "74% to 95% accuracy on average", measures: "Addleshaw Goddard's accuracy of LLM review of commercial contracts in its own legal due diligence test, before and after optimised retrieval and prompting. Legal DD, not financial DD.", provenance: self-reported, source_ref: ARTLAW-AG-2024}
    - {lever: speed, description: "Adjacent estimate: Deloitte UK's e-discovery lead on legal due diligence document review", figure: "25% saving versus traditional AI; 75% versus manual review", measures: "Efficiency saving as stated by Peter Robinson (Deloitte UK) for GenAI in legal due diligence; method not published. Legal DD, a recollection in a magazine interview.", provenance: self-reported, source_ref: ICAEW-BIGSIX-2024}
  prerequisites:
    - "Enterprise-grade or private-environment deployment that satisfies seller NDAs (KJK-NDA-2026)"
    - "Citation back to source documents so reviewers can verify (BLOCKCHAINNEWS-PWCUK-2026)"
  risks_and_guardrails:
    - "Uploading confidential data to an AI tool may breach NDA terms on retention, permitted representatives and use; some sellers now bar public AI or require prior written consent (KJK-NDA-2026)"
    - "The AICPA Code's confidential client information rule means asking whether client consent is needed before client data goes into an AI tool (JOFA-ETHICSAI-2026)"
    - "Intralinks reports hallucinated outputs leading to inaccurate diligence among the incident clusters it observed (INTRALINKS-AIDEAL-2026)"
    - "PwC UK's approach anchors outputs to verifiable sources (BLOCKCHAINNEWS-PWCUK-2026, secondary summary)"
  human_checkpoints:
    - "Practitioners review anomalies the AI flags; PwC's deals leader gives an illustrative 20 hours of human time on follow-up (ICAEW-BIGSIX-2024)"
  role_evolution: >-
    PwC's deals leader says staff can gain more insight and that it is hard to predict which tasks are replaced versus
    created (ICAEW-BIGSIX-2024). BDO's transaction services partner says GenAI could lead to new roles in AI oversight,
    data interpretation and client engagement (ICAEW-BIGSIX-2024).
  evidence_grade: B
  sources:
    - {ref: PWC-TOLTIQ-2026, title: "Reimagining deals for the Age of AI: PwC and ToltIQ enter strategic relationship", publisher: "PwC US", type: firm, url: "https://www.pwc.com/us/en/about-us/newsroom/press-releases/reimagining-deals-for-the-age-of-ai.html", date: "2026-06-15", access: full, locator: "'Built for the realities of deal execution' paragraph (usage counts); three priorities paragraph. Read through the r.jina.ai mirror"}
    - {ref: BLOCKCHAINNEWS-PWCUK-2026, title: "PwC Leverages AI for Faster Deal Execution", publisher: "Blockchain.News (secondary summary of PwC UK Deals CTO)", type: press, url: "https://blockchain.news/news/pwc-ai-deal-execution", date: "2026-05-06", access: full, locator: "paragraphs 1-4 (document ingestion with citations, valuation reading, generative drafting)"}
    - {ref: ICAEW-BIGSIX-2024, title: "Insight: AI and the Big Six", publisher: "ICAEW Corporate Financier", type: professional-body, url: "https://www.icaew.com/technical/corporate-finance/corporate-finance-faculty/corporate-financier/2024/articles/december/insight-ai-and-the-big-six", date: "2024-12-10", access: full, locator: "PwC (T. Popplewell) contracts example and platform count; Deloitte (P. Robinson) legal DD efficiency paragraph; BDO (M. Jones) on roles"}
    - {ref: ARTLAW-AG-2024, title: "AG Proves LLMs Can Do Well On Due Diligence", publisher: "Artificial Lawyer (reporting Addleshaw Goddard's research report)", type: press, url: "https://www.artificiallawyer.com/2024/10/08/ag-proves-llms-can-do-well-on-due-diligence/", date: "2024-10-08", access: full, locator: "accuracy 74% to 95% quote; chunking strategy 14%-22% improvement"}
    - {ref: KJK-NDA-2026, title: "AI and M&A NDAs: Managing Artificial Intelligence Risks in Confidentiality Agreements", publisher: "Kohrman Jackson & Krantz", type: firm, url: "https://kjk.com/2026/03/12/ai-and-ma-ndas-managing-artificial-intelligence-risks-in-confidentiality-agreements/", date: "2026-03-12", access: full, locator: "'Why AI Use in M&A Due Diligence Raises NDA Concerns'; 'How M&A NDAs Are Evolving'"}
    - {ref: JOFA-ETHICSAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "section 'AI can create confidentiality risks quickly'"}
    - {ref: INTRALINKS-AIDEAL-2026, title: "AI Use Permeates Dealmaking Despite Operational Concerns: SS&C Intralinks Report", publisher: "SS&C Intralinks (via Business Wire / Nasdaq)", type: survey, url: "https://www.nasdaq.com/press-release/ai-use-permeates-dealmaking-despite-operational-concerns-ssc-intralinks-report-2026", date: "2026-04-08", access: full, locator: "incident bullet"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: Big Four (PwC US, PwC UK, Deloitte UK) with a vendor (ToltIQ) and a law firm. Grade capped at B: named
    deployment with usage counts only, and the accuracy and efficiency measurements are from legal due diligence, an
    adjacent process. The ICAEW article is 22 months old and is used as a foundation. PwC UK's May 2026 account is a
    secondary news summary; PwC's own page was not read. The older PwC UK-Harvey alliance (2023) appeared only as a
    search result. Independence: PwC's and Deloitte's attest-client restrictions were not researched (see
    advisory-transactions-11). Expert-call and commercial diligence synthesis is outside this archetype.

- id: advisory-transactions-10
  title: "Deeper-cut analytics (SKU, customer, vendor, workforce, working capital) using time freed from routine diligence"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [data-reporting, expert-judgment]
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Routine preparation consumes the time that would otherwise go to deeper analysis, and an identified EBITDA
    adjustment can be worth many times the fee (Forvis Mazars US).
  solution: >-
    By automating the routine, diligence teams spend more of the engagement on SKU-level data, customer and vendor
    insight, employee productivity and working capital trends. Forvis Mazars US pairs this with sector-specific
    experience and says the result is more analysis, throughput and data-driven insight.
  outcomes:
    - {lever: quality, description: "Forvis Mazars US says depth of analysis increases", figure: "none published", measures: "Qualitative statement in a firm article; no engagement, tool or metric named", provenance: self-reported, source_ref: FORVIS-QOE-2026}
  prerequisites:
    - "Pairing experienced professionals with current tools (FORVIS-QOE-2026)"
  risks_and_guardrails:
    - "The same article warns that firms that over-rely on automation can head down wrong paths, not know when to stop and miss the true issues, and that AI is raising the prevalence of lower-quality QoE products (FORVIS-QOE-2026)"
  human_checkpoints:
    - "Professional judgment on EBITDA quality, net working capital, debt-like items and what matters to the deal (FORVIS-QOE-2026)"
  role_evolution: >-
    Forvis Mazars US describes a 'talent flywheel' in high-performing firms and warns that depleting junior ranks will
    create future holes in executive-level insight (FORVIS-QOE-2026).
  evidence_grade: C
  sources:
    - {ref: FORVIS-QOE-2026, title: "Quality of Earnings & Due Diligence in an AI World", publisher: "Forvis Mazars US (Transaction Advisory)", type: firm, url: "https://www.forvismazars.us/forsights/2026/09/quality-of-earnings-due-diligence-in-an-ai-world", date: "2026-09-08", access: full, locator: "sections '2. Depth' and '3. Talent'; 'Need for Diligence'"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: top-tier US firm (Forvis Mazars US; ranking not verified). Marked emerging and C because the article is a
    view from a named practice leader and names no tool or engagement. Pattern 'other': time released from routine work
    is redeployed to wider analysis (a scope-expansion pattern; candidate new pattern). Forvis Mazars US's January 2024
    article on diligence of AI-enabled targets is routed to the risk-controls module.

- id: advisory-transactions-11
  title: "Lifecycle M&A platform with an agent harness, from diligence to integration"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [research-synthesis, coordination-scheduling, expert-judgment]
  pattern: end-to-end-case-agent
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Deal teams run diligence, structuring and integration as separate, isolated tasks across tax, technology and
    financial workstreams (Deloitte).
  solution: >-
    Deloitte's M&A Platform embeds AI across the deal lifecycle, supported by an agentic harness (software to scale,
    govern and manage AI agents), and runs structured, interconnected workflows from strategy and diligence through
    integration. It is delivered through Deloitte's Ascend service delivery platform. EY-Parthenon markets a
    comparable Diligence Edge platform with a digital diligence assistant and an automation suite.
  outcomes:
    - {lever: capacity, description: "Deloitte says how many client engagements the platform is in use across", figure: "more than 1,000 client engagements", measures: "Count of client engagements in which the platform is in use, per Deloitte's release. Adoption count, not outcome.", provenance: self-reported, source_ref: DELOITTE-MAPLATFORM-2026}
    - {lever: speed, description: "Deloitte's own survey of 500 corporate and PE leaders reports benefits realised from AI in M&A", figure: "66% automated status reporting; 60% enhanced decision-making; 51% streamlined cross-functional coordination", measures: "Share of surveyed dealmakers who say they already see productivity gains in each area (Deloitte GenAI in M&A Pulse Survey, 500 corporate and PE leaders); respondent perceptions, not measured performance", provenance: vendor-published, source_ref: DELOITTE-MAPLATFORM-2026}
  prerequisites:
    - "Integration with approved deal data sources, the capability respondents rank as most important (DELOITTE-PULSE-2026)"
    - "Ring-fenced client and transaction data environment (DELOITTE-MAPLATFORM-2026)"
  risks_and_guardrails:
    - "Deloitte says the platform is designed to protect and ringfence client and transaction data (DELOITTE-MAPLATFORM-2026)"
    - "Human review remains the top requirement for high-stakes GenAI use in Deloitte's pulse study (DELOITTE-PULSE-2026)"
    - "Deloitte's earlier survey release carries the note that certain services may not be available to attest clients under public accounting rules (DELOITTE-GENAIMA-2025). Which deal services this covers was not verified."
    - "For SEC issuer audit clients, investment-banking-type services and any contingent fee impair independence (SEC-RULE2-01-2026)"
  human_checkpoints:
    - "Deloitte describes the platform as human-led and AI-powered (DELOITTE-MAPLATFORM-2026)"
  role_evolution: >-
    Deloitte's leaders say the platform lets deal teams achieve deeper insight by combining human judgment with AI
    (DELOITTE-MAPLATFORM-2026).
  evidence_grade: B
  sources:
    - {ref: DELOITTE-MAPLATFORM-2026, title: "Deloitte Expands AI and Agentic AI Capabilities With M&A Platform Enabling Smarter, More Streamlined Deal Execution", publisher: "Deloitte US", type: firm, url: "https://www.deloitte.com/us/en/about-us/press-room/deloitte-announces-ma-platform.html", date: "2026-09-22", access: full, locator: "paragraphs 2-3 (in use across more than 1,000 client engagements; agentic harness); survey paragraphs; closing paragraphs on data protection and Ascend"}
    - {ref: DELOITTE-PULSE-2026, title: "2026 Generative AI in M&A Pulse Study", publisher: "Deloitte US", type: survey, url: "https://www.deloitte.com/us/en/what-we-do/capabilities/mergers-acquisitions-restructuring/articles/m-and-a-generative-ai-study.html", date: "2026", access: full, locator: "'Key takeaways from the survey'. Page is undated; the 2026-09-22 Deloitte release calls the pulse survey recently released"}
    - {ref: DELOITTE-GENAIMA-2025, title: "Deloitte Survey: 86% of Corporate and Private Equity Leaders Now Use Generative AI, with Plans to Boost Spending in 2025", publisher: "Deloitte US", type: survey, url: "https://www.deloitte.com/us/en/about/press-room/deloitte-survey-genai-in-mna.html", date: "2025-10-09", access: full, locator: "boilerplate paragraph on attest-client services"}
    - {ref: EY-DILIGENCEEDGE-2026, title: "Diligence Edge: AI Diligence Platform", publisher: "EY-Parthenon", type: firm, url: "https://www.ey.com/en_uk/services/strategy/dilligence-edge", date: "2026-10-20", access: full, locator: "sections 'Digital Diligence Assistant', 'Automation suite', 'People-powered innovation'. Page is undated; date is access date. Read through the r.jina.ai mirror"}
    - {ref: ICAEW-BIGSIX-2024, title: "Insight: AI and the Big Six", publisher: "ICAEW Corporate Financier", type: professional-body, url: "https://www.icaew.com/technical/corporate-finance/corporate-finance-faculty/corporate-financier/2024/articles/december/insight-ai-and-the-big-six", date: "2024-12-10", access: full, locator: "EY paragraph (EY.ai, EYQ, EY Edge)"}
    - {ref: SEC-RULE2-01-2026, title: "17 CFR 210.2-01 Qualifications of accountants", publisher: "US SEC via eCFR", type: regulator, url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-17?part=210&section=210.2-01", date: "2026-10-20", access: full, locator: "(c)(4)(viii) broker-dealer, investment adviser or investment banking services; (c)(5) contingent fees. Current text as fetched; date is access date"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: Big Four (Deloitte, EY). Grade B because Deloitte names the platform and a usage count but publishes no
    outcome. Ladder stays augment: the platform is described as human-led and no agent is shown owning an outcome. The
    EY page is marketing copy with no usage or outcome data (grade C on its own); an ICAEW 2024 article reports EY has a
    tool called EY Edge and an in-house LLM, EYQ (ICAEW-BIGSIX-2024). Deloitte's 2025 and 2026 surveys use different
    samples (1,000 US leaders versus 500) and different measures and should not be compared. Deloitte sells M&A
    services, so its survey findings are vendor-published. Independence gate for AI-related services to audit
    clients: assurance-acceptance-independence-15.

- id: advisory-transactions-12
  title: "AI-drafted diligence deliverables: QoE exhibits, databook summary slides, red-flag reports and executive summaries from workpapers"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Turning workpapers and databooks (the schedules of financial analysis behind a diligence report) into
    executive-ready exhibits, summary slides and findings decks is slow, senior-reviewed work (General Catalyst job
    board posting).
  solution: >-
    Generative drafting of report pages and summaries from workpapers. PwC UK's Deals CTO describes producing
    executive-ready summaries from complex workpapers (secondary summary). A July 2026 expert-network posting says a
    foundation AI lab wants transaction advisory managers to create, evaluate and refine AI-generated QoE exhibits,
    databook summary slides, diligence findings decks, working capital pages and red-flag reports.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "No measured result; the sources describe intent and tasks", provenance: self-reported, source_ref: BLOCKCHAINNEWS-PWCUK-2026}
  prerequisites:
    - "Workpapers and databooks in a form a model can draft from"
  risks_and_guardrails:
    - "Forvis Mazars US warns AI can make thin reports look professional but they will not hold up under scrutiny (FORVIS-QOE-2026)"
    - "Cautionary analogue outside this module: Deloitte Australia agreed to repay the final instalment of a AU$440,000 government review after AI-generated errors including nonexistent references were found; Deloitte said the errors did not affect the findings (CITYAM-DELOITTE-2025)"
  human_checkpoints:
    - "Experienced transaction advisory managers evaluate and refine the AI-generated pages (GC-ETHOS-JOB-2026)"
  role_evolution: >-
    The posting pays experienced Big Four-level transaction advisory managers an hourly rate to train a model on
    report production, which shows the source of expertise labs want; it says nothing about how firms staff the work
    (GC-ETHOS-JOB-2026).
  evidence_grade: C
  sources:
    - {ref: GC-ETHOS-JOB-2026, title: "Expert Opportunity - Transaction Advisory Services Manager", publisher: "Ethos via General Catalyst job board", type: job-posting, url: "https://jobs.generalcatalyst.com/companies/ethos-2-e1b0048b-7d7c-4a76-97d7-b71911ec294a/jobs/86831351-expert-opportunity-transaction-advisory-services-manager-100-hr-up-to-2-000-week", date: "2026-07-18", access: full, locator: "'About This Opportunity' (task list); 'Qualifications'"}
    - {ref: BLOCKCHAINNEWS-PWCUK-2026, title: "PwC Leverages AI for Faster Deal Execution", publisher: "Blockchain.News (secondary summary of PwC UK Deals CTO)", type: press, url: "https://blockchain.news/news/pwc-ai-deal-execution", date: "2026-05-06", access: full, locator: "paragraph on generative drafting"}
    - {ref: FORVIS-QOE-2026, title: "Quality of Earnings & Due Diligence in an AI World", publisher: "Forvis Mazars US (Transaction Advisory)", type: firm, url: "https://www.forvismazars.us/forsights/2026/09/quality-of-earnings-due-diligence-in-an-ai-world", date: "2026-09-08", access: full, locator: "section '3. Talent'"}
    - {ref: CITYAM-DELOITTE-2025, title: "Deloitte refunds Australian government after AI 'made up citations' in report", publisher: "City AM", type: press, url: "https://www.cityam.com/?p=2367690", date: "2025-10-06", access: full, locator: "paragraphs 1-6"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: Big Four (PwC UK, via secondary source) and an AI lab (unnamed) recruiting through an expert network.
    The posting pays $100 per hour for 5-20 hours a week and is not evidence that firms use the output. The Deloitte
    Australia incident was a government review, not transaction advisory; it is a deliverable-quality analogue. The
    pre-issue check of references and figures is professional-services-quality-review-04. Ref CITYAM-DELOITTE-2025 is
    the same document the deep dive filed as CITYAM-DELOITTEAU-2025; renamed to match the other advisory modules.

- id: advisory-transactions-13
  title: "Buyers and sponsors run first-pass diligence with generative AI in-house"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [research-synthesis, review-assurance]
  pattern: research-brief
  ladder: augment
  change_scope: model
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    PE and corporate deal teams must evaluate more opportunities and process larger information volumes under tight
    deadlines. This is the demand-side shift transaction advisory providers face: some first-pass diligence moves
    in-house (Datasite; Intralinks).
  solution: >-
    Deal teams use AI tools in diligence themselves: S&P Global finds diligence has the highest AI integration among
    PE operations, Datasite reports half of dealmakers regularly use AI in diligence, and Deloitte finds 35% of
    adopters apply GenAI to diligence.
  outcomes:
    - {lever: capacity, description: "S&P Global: share of GPs reporting AI integrated into due diligence", figure: "31%", measures: "GPs who say AI is somewhat or fully integrated in due diligence, in S&P Global Market Intelligence's 2026 PE survey; sample size not stated in the release portion read", provenance: independent, source_ref: SPGLOBAL-PE-2026}
    - {lever: capacity, description: "Datasite and FT Longitude: share of dealmakers with AI regularly embedded in due diligence", figure: "50%", measures: "Respondents who report AI regularly embedded in due diligence; survey of 1,000 senior dealmakers (C-suite or C-1) in 27 countries, March 2026, commissioned by Datasite", provenance: vendor-published, source_ref: DATASITE-NEWDEALTEAM-2026}
    - {lever: speed, description: "SS&C Intralinks: reported time saving in the diligence phase", figure: "21-30%", measures: "Time savings that surveyed dealmakers (400 global M&A dealmakers, with Reuters) report from AI tools in the due diligence phase; self-reported perceptions", provenance: vendor-published, source_ref: INTRALINKS-AIDEAL-2026}
  prerequisites:
    - "Enterprise-grade tools that satisfy seller NDAs and data-room terms (KJK-NDA-2026)"
  risks_and_guardrails:
    - "S&P respondents name lack of expertise (49%), data privacy concerns (43%) and model accuracy concerns (38%) as barriers (SPGLOBAL-PE-2026)"
    - "Deloitte's 2025 survey: 67% cite data security and 65% cite data quality and availability as leading concerns (DELOITTE-GENAIMA-2025)"
    - "Datasite: 58% rely on human review and validation to trust AI outputs (DATASITE-NEWDEALTEAM-2026)"
  human_checkpoints:
    - "Human review and validation; 45% say the decision to sign should always remain human (DATASITE-NEWDEALTEAM-2026)"
  role_evolution: >-
    Datasite respondents say negotiation, strategic judgment, assessing trust and accountability are hardest for AI to
    replicate (DATASITE-NEWDEALTEAM-2026).
  evidence_grade: C
  sources:
    - {ref: SPGLOBAL-PE-2026, title: "S&P Global Market Intelligence's 2026 Private Equity Survey Shows Fundraising Confidence Rising as Managers Pivot to Operational Value", publisher: "S&P Global Market Intelligence", type: survey, url: "https://press.spglobal.com/2026-04-13-S-P-Global-Market-Intelligences-2026-Private-Equity-Survey-Shows-Fundraising-Confidence-Rising-as-Managers-Pivot-to-Operational-Value", date: "2026-04-13", access: full, locator: "'Limited AI adoption' bullet"}
    - {ref: DATASITE-NEWDEALTEAM-2026, title: "Datasite: AI Is Becoming Indispensable in Dealmaking, But Trust and Governance Will Determine the Winners", publisher: "Datasite (GlobeNewswire, with FT Longitude)", type: survey, url: "https://www.finanznachrichten.de/nachrichten-2026-07/68975080-datasite-ai-is-becoming-indispensable-in-dealmaking-but-trust-and-governance-will-determine-the-winners-399.htm", date: "2026-07-08", access: full, locator: "'Four key findings from the research'; 'About the report'"}
    - {ref: INTRALINKS-AIDEAL-2026, title: "AI Use Permeates Dealmaking Despite Operational Concerns: SS&C Intralinks Report", publisher: "SS&C Intralinks (via Business Wire / Nasdaq)", type: survey, url: "https://www.nasdaq.com/press-release/ai-use-permeates-dealmaking-despite-operational-concerns-ssc-intralinks-report-2026", date: "2026-04-08", access: full, locator: "key findings list"}
    - {ref: DELOITTE-GENAIMA-2025, title: "Deloitte Survey: 86% of Corporate and Private Equity Leaders Now Use Generative AI, with Plans to Boost Spending in 2025", publisher: "Deloitte US", type: survey, url: "https://www.deloitte.com/us/en/about/press-room/deloitte-survey-genai-in-mna.html", date: "2025-10-09", access: full, locator: "paragraphs on pre-sign use (35% due diligence) and barriers"}
    - {ref: KJK-NDA-2026, title: "AI and M&A NDAs: Managing Artificial Intelligence Risks in Confidentiality Agreements", publisher: "Kohrman Jackson & Krantz", type: firm, url: "https://kjk.com/2026/03/12/ai-and-ma-ndas-managing-artificial-intelligence-risks-in-confidentiality-agreements/", date: "2026-03-12", access: full, locator: "'How M&A NDAs Are Evolving to Address AI'"}
    - {ref: POSTTRADE-SPGLOBAL-2026, title: "AI finds its foothold in private equity, but mostly in due diligence", publisher: "Post-Trade 360", type: press, url: "https://posttrade360.com/news/fund-ops/ai-finds-its-foothold-in-private-equity-but-mostly-in-due-diligence/", date: "2026-04-13", access: full, locator: "first two paragraphs (27% effectiveness figure; one-in-four wording)"}
    - {ref: AM-EURODD-2026, title: "European Due Diligence Report 2026 (as summarised in search results)", publisher: "Alvarez & Marsal", type: survey, url: "https://www.alvarezandmarsal.com/node/96976", date: "2026-08-11", access: search-only, locator: "search-result summary only; page returned 403"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: PE sponsors and corporate buyers (the clients of transaction advisory firms), surveyed by a data vendor,
    a data-room vendor and a Big Four firm. These surveys cover diligence generally, not QoE, so they cap at C. Figures
    conflict: Post-Trade 360 reports the S&P figure as 'just shy of one in four' while S&P's own release says 31% (the
    release is used). The 27% 'effective in creating value during diligence' figure comes only from the Post-Trade 360
    article and is not in the outcomes. A&M's 2026 European diligence report (80%+ using or experimenting; 70% of Tier 1
    funds using consistently versus 41% of large and 28% of mid-sized funds) was seen only in search. Intralinks'
    separate H2 2026 sentiment report uses different numbers and is not comparable.

- id: advisory-transactions-14
  title: "Post-deal integration planning, TSA drafting and synergy sizing with generative AI"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [coordination-scheduling, document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Post-deal value realisation needs coordinated execution across systems and is less structured and harder to scale
    than pre-deal analysis (Accenture's PE lead, via CFO Dive). Line leaders must juggle integration work with their
    day jobs (Bain).
  solution: >-
    Bain expects early adopters to draft integration workplans and transition service agreements (TSAs: the seller's
    promise to keep running services for the buyer for a period after closing) in less than 20% of the time previously
    spent, then use company data to size cost and revenue synergies and draft value creation plans. Deloitte's pulse
    study reports that 52% of respondents apply GenAI in post-close integration (its survey question covers use or
    piloting).
  outcomes:
    - {lever: speed, description: "Bain's expectation for early adopters over the following 12 months", figure: "less than 20% of prior time", measures: "Bain's forward-looking expectation for the time early adopters will spend drafting integration workplans and TSAs relative to what they previously spent; not a measured result", provenance: vendor-published, source_ref: BAIN-GENAIMA-2025}
    - {lever: capacity, description: "Accenture: share of organizations investing in GenAI for post-deal M&A activity", figure: "27% in 2026, up from 18% in 2024", measures: "Share of surveyed organizations investing in GenAI for post-deal M&A activity; Accenture survey of 650 senior dealmakers in 12 industries and 24 countries, January 2026 (pre-deal was 46%, up from 31%)", provenance: vendor-published, source_ref: CFODIVE-ACCENTURE-2026}
  prerequisites:
    - "Integration with approved deal data sources (DELOITTE-PULSE-2026)"
  risks_and_guardrails:
    - "Not described in these sources beyond the human-review requirement in the pulse study (DELOITTE-PULSE-2026)"
  human_checkpoints:
    - "Human review remains the top requirement for high-stakes use (DELOITTE-PULSE-2026)"
  role_evolution: >-
    Bain says generative AI will pick up project management tasks and M&A teams should rethink the skills they need,
    with more focus on strategic value creation (BAIN-GENAIMA-2025).
  evidence_grade: C
  sources:
    - {ref: BAIN-GENAIMA-2025, title: "Generative AI in M&A: You're Not Behind-Yet", publisher: "Bain & Company (2025 M&A Report)", type: firm, url: "https://www.bain.com/insights/generative-ai-m-and-a-report-2025/", date: "2025-02-04", access: full, locator: "paragraphs on integration workplans and TSAs; 'Protecting people and the business during M&A'"}
    - {ref: CFODIVE-ACCENTURE-2026, title: "GenAI gains ground in M&A, but post-deal adoption lags", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/generative-ai-gains-ground-mergers-postdeal-adoption-lags/814895/", date: "2026-03-17", access: full, locator: "paragraphs 2-3 (adoption figures) and the sentence on McKinsey's integration expectation"}
    - {ref: DELOITTE-PULSE-2026, title: "2026 Generative AI in M&A Pulse Study", publisher: "Deloitte US", type: survey, url: "https://www.deloitte.com/us/en/what-we-do/capabilities/mergers-acquisitions-restructuring/articles/m-and-a-generative-ai-study.html", date: "2026", access: full, locator: "'Key takeaways' (49% deal closing, 52% post-close integration)"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm types: consultancies (Bain, Accenture, Deloitte) writing about corporate and PE acquirers rather than
    reporting an advisory-firm deployment. McKinsey's expectation that agentic AI will take over more than 50% of
    integration planning and execution tasks appears only inside the CFO Dive article. Deloitte's M&A Platform
    (advisory-transactions-11) covers integration but publishes no integration outcome. No integration-management-office
    case with outcomes was found. Agent-drafted status reports in general are professional-services-delivery-management-03.

- id: advisory-transactions-15
  title: "LLM-supported knowledge capture to retain rather than replace an acquired company's systems"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [research-synthesis, software-systems]
  pattern: grounded-knowledge-assistant
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Post-merger systems integration often loses the human and system-embedded knowledge of the acquired firm, which
    pushes acquirers to rip out and replace the target's ERP (ECIS 2026 paper).
  solution: >-
    In a study of two consecutive acquisitions of the same digital target, the second acquirer used LLM-supported
    'learning system knowledge through chat' to adopt a retain-and-revive approach for the target's proprietary ERP
    instead of the first acquirer's rip-and-replace.
  outcomes:
    - {lever: risk, description: "The authors report increased knowledge transferability, aggregation and efficiency, and lower assumed system opacity, personnel dependence and conversion cost", figure: "none published", measures: "Qualitative findings from a two-acquisition case study; organizations unnamed", provenance: independent, source_ref: ECIS-PMI-2026}
  prerequisites:
    - "Access to the target's system documentation, code or people to build a knowledge base"
  risks_and_guardrails:
    - "Not discussed in the abstract (ECIS-PMI-2026)"
  human_checkpoints:
    - "Not discussed in the abstract (ECIS-PMI-2026)"
  role_evolution: "Not discussed in the abstract (ECIS-PMI-2026)."
  evidence_grade: C
  sources:
    - {ref: ECIS-PMI-2026, title: "From Knowledge Loss To Knowledge Leverage: How Gen AI Affordances Transform Post-Merger IS Integration", publisher: "ECIS 2026 Proceedings (AIS eLibrary); Erber, Ortiz de Guinea, Steininger", type: academic, url: "https://aisel.aisnet.org/ecis2026/is_adopt/is_adopt/24/", date: "2026", access: full, locator: "abstract (only the abstract was read). Month of publication not shown on the page"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: acquirers, not advisory firms. Grade C: the case organizations are unnamed so this cannot meet B. Only
    the abstract was read. Kept because it is the only assist-level entry and the only evidence on IT integration.

- id: advisory-transactions-16
  title: "Autonomous quality-of-earnings analysis (idea)"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: emerging
  problem: >-
    QoE is a judgment-heavy, multi-week product; surveyed dealmakers see an agent that runs the whole analysis as a
    coming disruption (SS&C Intralinks survey).
  solution: >-
    An agent would own the QoE end to end (ingest, map, test, normalize, draft) with human checkpoints. This is an idea
    discussed by surveyed dealmakers, not a deployed product; a July 2026 buyer's guide says no AI tool runs a full QoE
    because it turns on judgment.
  outcomes:
    - {lever: speed, description: "none published", figure: "none published", measures: "Intralinks reports that autonomous QoE analysis is among the most highly anticipated disruptions expected by 2030; no performance data", provenance: vendor-published, source_ref: INTRALINKS-AIDEAL-2026}
  prerequisites:
    - "Reliable add-back and footnote handling, which a practitioner guide says is where tools degrade (WORKWISE-QOE-2026)"
  risks_and_guardrails:
    - "Over 80% of Intralinks respondents say they are comfortable with AI executing some multi-step workflows with minimal human intervention, while more than 57% report rising senior-level resistance driven by accuracy, explainability and fiduciary concerns (INTRALINKS-AIDEAL-2026)"
    - "Under the SBA rule as QoEAgent reads it, software cannot be the provider of a lender QoE (QOEAGENT-WHO-2026)"
  human_checkpoints:
    - "Not specified; the source describes minimal-human-intervention workflows generally (INTRALINKS-AIDEAL-2026)"
  role_evolution: "Not stated."
  evidence_grade: D
  sources:
    - {ref: INTRALINKS-AIDEAL-2026, title: "AI Use Permeates Dealmaking Despite Operational Concerns: SS&C Intralinks Report", publisher: "SS&C Intralinks (via Business Wire / Nasdaq)", type: survey, url: "https://www.nasdaq.com/press-release/ai-use-permeates-dealmaking-despite-operational-concerns-ssc-intralinks-report-2026", date: "2026-04-08", access: full, locator: "key findings: comfort with multi-step workflows and autonomous QoE"}
    - {ref: WORKWISE-QOE-2026, title: "The Best AI Tools for Quality of Earnings and Financial Due Diligence in 2026", publisher: "WorkWise Solutions (AI consulting firm)", type: vendor, url: "https://workwisesolutions.org/guides/best-ai-qoe-financial-due-diligence-tools.html", date: "2026-07-20", access: full, locator: "TLDR"}
    - {ref: QOEAGENT-WHO-2026, title: "Who Can Prepare an SBA Quality of Earnings Report", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/who-can-prepare-sba-quality-of-earnings/", date: "2026-09-05", access: full, locator: "opening summary"}
  last_reviewed: "2026-10-20"
  notes: >-
    Idea (D). The idea is discussed in a vendor survey and a consultancy guide, not demonstrated. Vendors in
    advisory-transactions-03 to -05 sell staged versions with human review. This is the only delegate-level entry.
