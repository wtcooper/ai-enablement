# Use cases: advisory / transactions (quality of earnings, financial due diligence, deal support, integration)
# Sources checked 2026-10-20 (wave 5). Merged from the transactions deep dive, the advisory landscape scan and the
# cross-cutting files on independence and pricing and on the state of AI and disruption.
# Evidence is thin: no entry is graded A. No error rate, override rate, parallel run, inspection finding or independent
# accuracy test of AI-assisted quality of earnings (QoE) or financial due diligence (FDD) was found. Speed figures are
# vendor-published or self-reported, with no method. Vendor pages with no date carry the access date (2026-10-20).
# Firm operations (pricing the firm's own work, staffing, ownership) are in professional-services; attest work is in
# assurance; transaction tax work is in tax. Cross-references are by id in notes.

- id: advisory-transactions-01
  title: "Financial due diligence workbench: data ingestion, trial balance mapping and first-draft databook"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Financial due diligence starts with collecting, checking and adjusting data before anyone can interpret it, and a
    large share of junior time goes there (Opio CEO, as reported by Tech.eu). Forvis Mazars US adds that teams can
    still be held up by target companies that struggle to pull requested data.
  solution: >-
    An AI platform built for transaction services teams reads large volumes of unstructured deal information,
    structures the data and drafts first-pass outputs. Forvis Mazars US describes AI helping with trial balance
    mapping, first versions of schedules, trend and anomaly spotting, missing-data checks, reconciliations and tailored
    questions for management. Forvis Mazars Group says its rollout of Opio's platform uses embedded controls, full
    traceability and mandatory human review.
  outcomes:
    - {lever: speed, description: "Opio reports average time saved per financial due diligence (FDD) engagement", figure: "27%", measures: "Opio product page: 'Average time saved per FDD'. Tech.eu words it as saving transaction services professionals 27 per cent of their time. Method, sample and baseline not published.", provenance: vendor-published, source_ref: OPIO-SITE-2026}
    - {lever: quality, description: "Forvis Mazars Group says that after testing, the solution improved the quality and depth of its due diligence and let teams analyse a broader range of information", figure: "none published", measures: "Qualitative statement by the Group's Financial Advisory Innovation leader in the rollout release; no metric given", provenance: self-reported, source_ref: FORVISGROUP-OPIO-2026}
  prerequisites:
    - "A pilot with transaction services professionals and the group AI team; the release describes a nine-month pilot before rollout (FORVISGROUP-OPIO-2026)"
    - "A deployment that fits confidentiality rules; the release says the platform operates exclusively on premise and does not train on data (FORVISGROUP-OPIO-2026)"
    - "Engagement data in structured form (trial balance, databook) for the platform to work from"
  risks_and_guardrails:
    - "The release says outputs are fully auditable and every figure traceable to its source document (FORVISGROUP-OPIO-2026)"
    - "Forvis Mazars US warns that firms relying too heavily on automation can produce thin, unsupported conclusions (FORVIS-QOE-2026)"
    - "Opio's compliance and certification claims (SOC 2 Type II, ISO 27001, GDPR, AI Act) are vendor statements (OPIO-SITE-2026)"
  human_checkpoints:
    - "Mandatory human review of platform outputs (FORVISGROUP-OPIO-2026)"
    - "Professionals own the judgment calls between dataroom and report (OPIO-SITE-2026)"
  role_evolution: >-
    Opio's CEO says automating data collection and checking lets junior professionals spend time earlier on analysis,
    judgement and client relationships (TECHEU-OPIO-2026). Forvis Mazars US warns that depleting junior ranks will
    create future holes in executive-level insight (FORVIS-QOE-2026).
  evidence_grade: B
  sources:
    - {ref: FORVISGROUP-OPIO-2026, title: "Forvis Mazars scales AI-powered transaction advisory solution", publisher: "Forvis Mazars Group", type: firm, url: "https://www.forvismazars.com/group/en/who-we-are/news-publications/latest-news/scaling-ai-powered-transaction-advisory-solutions", date: "2026-09-25", access: full, locator: "paragraphs 1-5 (rollout, nine-month pilot, mandatory human review); quotes from G. Volpi and T. Fulchiron; 'Responsible AI' paragraph"}
    - {ref: OPIO-SITE-2026, title: "Frontier AI for transaction services (product page)", publisher: "Opio", type: vendor, url: "https://www.opio.fi", date: "2026-10-20", access: full, locator: "statistics block (27% average time saved per FDD; 15 countries; 1M+ documents); security section. Page is undated; date is access date"}
    - {ref: TECHEU-OPIO-2026, title: "Opio raises EUR 4M to automate the grunt work of financial due diligence", publisher: "Tech.eu", type: press, url: "https://tech.eu/2026/09/16/opio-raises-eur4m-to-automate-the-grunt-work-of-financial-due-diligence/", date: "2026-09-16", access: full, locator: "paragraphs 3-6 (27% claim, Forvis Mazars Group and BDO named as customers, 15 countries)"}
    - {ref: FORVIS-QOE-2026, title: "Quality of Earnings & Due Diligence in an AI World", publisher: "Forvis Mazars US (Transaction Advisory)", type: firm, url: "https://www.forvismazars.us/forsights/2026/09/quality-of-earnings-due-diligence-in-an-ai-world", date: "2026-09-08", access: full, locator: "sections '1. Speed' and '3. Talent'"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: Forvis Mazars Group is an international network (not Big Four); the BDO customer claim comes only from
    Tech.eu. Opio is an AI-native provider founded in Paris in 2025 (Tech.eu). The group release does not say whether
    the US member firm uses the platform, and gives no timing or error figure. Proof of cash is the separate entry
    advisory-transactions-03. Independence: buy-side diligence on a third-party target is the usual setting; which
    diligence services are restricted for the firm's own audit clients was not verified (see advisory-transactions-11).
    Junior-role redesign is covered in professional-services-talent-learning-07.

- id: advisory-transactions-02
  title: "Transaction-level anomaly scoring and flux analysis to prepare management meetings and EBITDA adjustment candidates"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [data-reporting, review-assurance]
  pattern: full-population-testing
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Preparing for the first management meeting has been a bottleneck: teams eyeball trial balances and comb thousands
    of rows to find movements worth asking about (Miller Cooper principal and vendor release).
  solution: >-
    A module scores each transaction for anomaly risk (Audit Sight's FARS model), flags material balances and
    movements against materiality and standard-deviation thresholds the user sets, tracks candidate EBITDA
    adjustments to raise with management, and calculates profitability and efficiency ratios to focus the interview
    questions. Flux analysis means comparing balances across periods to find unusual movements.
  outcomes:
    - {lever: speed, description: "Audit Sight says the module eliminates prep time for the management-meeting step", figure: "80%", measures: "Vendor claim: share of QoE professionals' prep time eliminated for the initial management meeting. Basis not published.", provenance: vendor-published, source_ref: CPAPA-AUDITSIGHT-2025}
    - {lever: speed, description: "A principal at Miller Cooper Ltd., a named Audit Sight customer, says the tool shaved days off the deal cycle", figure: "none published (days, unquantified)", measures: "Customer's recollection quoted in the vendor release; no tracked metric", provenance: self-reported, source_ref: CPAPA-AUDITSIGHT-2025}
  prerequisites:
    - "Trial balance or ledger data for the deal period"
    - "Team-set materiality and standard-deviation thresholds (CPAPA-AUDITSIGHT-2025)"
  risks_and_guardrails:
    - "Flagged movements are candidates to discuss with management, not conclusions (CPAPA-AUDITSIGHT-2025)"
    - "A practitioner says first-pass automation weakens once normalization and judgment matter (SEARCHFUNDER-SOURCETABLE-2025); the practitioner sells a competing tool"
  human_checkpoints:
    - "QoE team decides which flagged movements become adjustments and what to ask management (CPAPA-AUDITSIGHT-2025)"
  role_evolution: >-
    The vendor says the tool lets transaction advisory professionals ask better questions and spend less time on
    manual data review (CPAPA-AUDITSIGHT-2025).
  evidence_grade: B
  sources:
    - {ref: CPAPA-AUDITSIGHT-2025, title: "Audit Sight Launches Management Meeting Module for Transaction Advisory Teams to Accelerate Deal Cycles and Surface Key Insights", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2025/07/10/audit-sight-launches-management-meeting-module-for-transaction-advisory-teams-to-accelerate-deal-cycles-and-surface-key-insights/164674/", date: "2025-07-10", access: full, locator: "intro paragraph; 'Designed for Transaction Advisory Professionals'; FARS paragraph; Todd Wrenn (Miller Cooper) quote under 'Built to Accelerate Deal Execution'"}
    - {ref: SEARCHFUNDER-SOURCETABLE-2025, title: "Has anyone used Sourcetable AI for QoE Analysis?", publisher: "Searchfunder (community thread)", type: community, url: "https://searchfunder.com/post/has-anyone-used-sourcetable-ai-for-qoe-analysis", date: "2025-10", access: full, locator: "reply from a professional; date approximate from relative timestamps"}
  last_reviewed: "2026-10-20"
  notes: >-
    Vendor: Audit Sight. Miller Cooper Ltd. is a named accounting-firm customer; its size and ranking were not verified.
    The release is 15 months old. Pricing and other customers not found. Adjustment sign-off with source evidence is
    advisory-transactions-04.

- id: advisory-transactions-03
  title: "Proof of cash and bank-to-ledger reconciliation by AI agents for lower-middle-market QoE"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [transaction-processing, review-assurance]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    In lower-middle-market deals the seller's books are often thin: scanned bank statements, several accounts, a
    system migration or a CPA who posts accruals once a year. Reconciling several years of bank activity to the ledger
    by hand takes weeks (QoEAgent).
  solution: >-
    A proof of cash ties the revenue and expenses in the books to the cash that moved through the bank. AI agents read
    bank statements, including scanned PDFs, tie revenue and expenses to the bank, map the trial balance to
    GAAP-format financials, and pass flagged items to CPAs and M&A advisors who review them and deliver a sourced
    databook. QoEAgent sells this as a staged continuum: a proof of cash within 24 hours, a 48-hour first look, and a
    full QoE.
  outcomes:
    - {lever: speed, description: "QoEAgent says a proof of cash is reconciled within a stated tolerance within a stated time of receiving data", figure: "within 1% in 24 hours", measures: "Vendor claim: revenue and expenses tied to bank statements to within 1%, within 24 hours of receiving the data. Not independently measured.", provenance: vendor-published, source_ref: QOEAGENT-HOME-2026}
    - {lever: risk, description: "In one described engagement, the proof of cash rebuilt monthly cash-basis statements and found year-end 2024 revenue and cost-of-sales deferrals documented by the seller's CPA but never recorded in the general ledger; the verified numbers did not support the price and the buyer walked away before closing", figure: "46 months rebuilt (January 2022 to October 2025); 1 engagement", measures: "A single QoEAgent engagement published with the client's written permission; target and seller unnamed", provenance: vendor-published, source_ref: QOEAGENT-CASE-2026}
  prerequisites:
    - "Bank statements for every account (scanned PDFs accepted), the general ledger and trial balance; prior-year tax returns for a lender QoE (QOEAGENT-HOME-2026)"
    - "Seller cooperation on a defined list of items, held through weekly diligence calls (QOEAGENT-CASE-2026)"
  risks_and_guardrails:
    - "A QoEAgent post tells buyers to ask any AI diligence tool vendor for its exception rate, its training data and what the human review step looks like (SEARCHFUNDER-QOEAGENT-2026)"
    - "The case study is one engagement written by the vendor (QOEAGENT-CASE-2026)"
  human_checkpoints:
    - "Credentialed professionals own every conclusion; software does extraction and matching (QOEAGENT-CASE-2026)"
    - "CPAs and M&A advisors review every flagged item (QOEAGENT-HOME-2026)"
  role_evolution: >-
    QoEAgent's own account is that the platform does the heavy lifting and credentialed people do the judgment
    (QOEAGENT-HOME-2026). Its founding team combines M&A advisory, valuation and an AI researcher (QOEAGENT-HOME-2026).
  evidence_grade: B
  sources:
    - {ref: QOEAGENT-HOME-2026, title: "QoEAgent: AI quality of earnings, proof of cash and SBA lender QoE (home page)", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/", date: "2026-10-20", access: full, locator: "hero section; 'How AI quality of earnings works' steps 01-04; FAQ. Page is undated; date is access date"}
    - {ref: QOEAGENT-CASE-2026, title: "Proof of Cash Case Study: An SBA Acquisition the Numbers Did Not Support", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/proof-of-cash-case-study-sba-acquisition/", date: "2026-10-15", access: full, locator: "opening summary; 'The problem'; 'What we did'; 'What we found'; 'The outcome'"}
    - {ref: SEARCHFUNDER-QOEAGENT-2026, title: "QoEAgent AI: AI Proof of Cash and Quality of Earnings for LMM Diligence", publisher: "Searchfunder (vendor-authored post)", type: community, url: "https://searchfunder.com/post/qoeagent-ai-ai-proof-of-cash-quality-of-earnings-for-lmm-diligence", date: "2026-08", access: full, locator: "post body, three questions to ask before trusting any AI diligence tool; date approximate from '2mos ago'"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: AI-native provider (Denver, founded 2023 per its site). Ladder set to automate because matching runs
    with no person on the normal path and flagged items go to CPAs; the vendor still says professionals own every
    conclusion. Change scope is process because the staged products (cash review, first look, full QoE) reorder the
    diligence flow. Grade B rests on the provider's own named service and one client engagement, with no tracked metric;
    the client quote and outcome are published by the vendor. The engagement was completed before the SBA technical
    update effective 2026-10-01 (per the case page). No independent review of QoEAgent was found.

- id: advisory-transactions-04
  title: "AI-suggested EBITDA adjustment candidates with source-linked evidence for reviewer sign-off"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [expert-judgment, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    The adjustments from reported to normalized EBITDA (add-backs and other changes that show recurring earnings)
    decide the price, and the work of finding, supporting and tracing them is slow and hard to audit in spreadsheets
    (Shepi). Forvis Mazars US notes that a single identified adjustment can be worth many times the fee.
  solution: >-
    A platform surfaces adjustment candidates, links each to supporting records where source evidence is available,
    shows gaps, and lets a person approve or reject each one before a PDF and Excel package is produced. Shepi's demo
    shows a normalized EBITDA bridge with 'adjustments reviewed 12 / 14' and source coverage percentages.
  outcomes:
    - {lever: quality, description: "Vendor says every conclusion is linked to source evidence and reviewers can follow a number back to its origin", figure: "none published", measures: "Product description and a demo mock-up on the vendor page; the on-page percentages (source coverage 96%, GL reconciliation 93%) are illustrative demo values, not results", provenance: vendor-published, source_ref: SHEPI-HOME-2026}
  prerequisites:
    - "Connected accounting data or uploaded trial balance, ledger, bank statements and supporting files (SHEPI-HOME-2026)"
  risks_and_guardrails:
    - "Shepi states the platform surfaces candidates and people decide which adjustments belong; neither path is an audit, review, attestation, valuation or fairness opinion (SHEPI-HOME-2026)"
    - "A practitioner buyer's guide says extraction is accurate on clean top-line numbers and degrades on add-backs, adjustments and footnotes, so a qualified analyst still owns the number (WORKWISE-QOE-2026). This is an opinion, not a measurement."
    - "Intralinks reports that 80% of surveyed dealmakers had AI-related security or accuracy incidents or near-misses in the past 12 months, with hallucinated outputs leading to inaccurate diligence among the clusters (INTRALINKS-AIDEAL-2026). The release does not state the denominator for the cluster percentages."
  human_checkpoints:
    - "User reviews and approves each adjustment (SHEPI-HOME-2026, Self-Service tier)"
    - "Licensed CPA reviews adjustments before delivery in the Done-For-You tier (SHEPI-HOME-2026)"
  role_evolution: >-
    Shepi pitches the tool to searchers, brokers, accountants and lenders; for accountants it is positioned as extra
    capacity with traceable workpapers (SHEPI-HOME-2026).
  evidence_grade: C
  sources:
    - {ref: SHEPI-HOME-2026, title: "Shepi: AI Quality of Earnings Software for SMB M&A", publisher: "Shepi", type: vendor, url: "https://www.shepi.ai", date: "2026-10-20", access: full, locator: "hero section; 'Built around the deal'; pricing tiers; 'Why Shepi'. Page is undated; date is access date"}
    - {ref: WORKWISE-QOE-2026, title: "The Best AI Tools for Quality of Earnings and Financial Due Diligence in 2026", publisher: "WorkWise Solutions (AI consulting firm)", type: vendor, url: "https://workwisesolutions.org/guides/best-ai-qoe-financial-due-diligence-tools.html", date: "2026-07-20", access: full, locator: "TLDR; section 1 'What a Quality of Earnings Analysis Is, and Where AI Fits'"}
    - {ref: INTRALINKS-AIDEAL-2026, title: "AI Use Permeates Dealmaking Despite Operational Concerns: SS&C Intralinks Report", publisher: "SS&C Intralinks (via Business Wire / Nasdaq)", type: survey, url: "https://www.nasdaq.com/press-release/ai-use-permeates-dealmaking-despite-operational-concerns-ssc-intralinks-report-2026", date: "2026-04-08", access: full, locator: "key findings list, incident bullet"}
    - {ref: FORVIS-QOE-2026, title: "Quality of Earnings & Due Diligence in an AI World", publisher: "Forvis Mazars US (Transaction Advisory)", type: firm, url: "https://www.forvismazars.us/forsights/2026/09/quality-of-earnings-due-diligence-in-an-ai-world", date: "2026-09-08", access: full, locator: "section '3. Talent' and closing paragraphs ('Need for Diligence'): value of an identified adjustment"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: vendor (AI-native). Grade C: product claims only; no named customer, no measured outcome. A Capterra
    listing seen in search showed $2,000 per project against $1,000 on the vendor page now, so pricing has moved or
    sources conflict (search-only, not used as an outcome). No user ratings found. The WorkWise guide is a
    consultancy opinion piece that says it takes no referral fees. Practitioners name this step as where AI is least
    reliable; the autonomous version is the idea in advisory-transactions-16.

- id: advisory-transactions-05
  title: "AI-native QoE service tiers (cash review, first look, self-service with CPA review) priced below a traditional engagement"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [document-production, transaction-processing]
  pattern: draft-review-loop
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Small and lower-middle-market buyers (searchers, independent sponsors) must choose between an expensive
    traditional engagement and fragile spreadsheet work (Shepi). One searcher reply puts QoE costs anywhere from $500
    to $25,000 or more depending on size, industry and scope (Searchfunder).
  solution: >-
    AI-native providers sell a tiered, scoped product: QoEAgent's Flash Cash Review, Proof-of-Cash Plus in 48 hours,
    QoE Essentials and a lender QoE at fixed fees quoted up front; Shepi's Self-Service at $1,000 per project or
    Done-For-You with licensed CPA review. A Columbia team posted that its custom model cuts production cost
    'significantly' even with an accountant verifying.
  outcomes:
    - {lever: cost, description: "Shepi lists a flat price for self-service QoE software", figure: "$1,000 per project (Self-Service)", measures: "List price on the vendor page read 2026-10-20; excludes the Done-For-You tier. Not a measured saving.", provenance: vendor-published, source_ref: SHEPI-HOME-2026}
    - {lever: cost, description: "A Columbia team says production cost is significantly lower with an accountant in the loop", figure: "none published", measures: "Claim in a community post seeking feedback; no cost figure given", provenance: self-reported, source_ref: SEARCHFUNDER-COLUMBIA-2026}
  prerequisites:
    - "Buyer or lender willing to accept a software-assisted, non-attest analysis"
  risks_and_guardrails:
    - "Shepi says lenders may require independent CPA involvement and that neither path is an audit, review, attestation or valuation (SHEPI-HOME-2026)"
    - "A lender-side searcher reply says banks favour providers that help buyer and lender get comfortable with a reconciliation or normalization, and criticised report-only providers (SEARCHFUNDER-COLUMBIA-2026)"
    - "QoEAgent's reading of the SBA rule is that software cannot be the provider and an independent financial professional must stand behind the conclusions (QOEAGENT-WHO-2026). This is a vendor interpretation."
    - "Forvis Mazars US says AI is raising the prevalence of lower-quality, lower-cost QoE products (FORVIS-QOE-2026)"
  human_checkpoints:
    - "Licensed CPA reviews adjustments in Shepi's Done-For-You tier (SHEPI-HOME-2026); credentialed professionals own conclusions at QoEAgent (QOEAGENT-HOME-2026)"
  role_evolution: "Not stated by the sources beyond the human-review models above."
  evidence_grade: C
  sources:
    - {ref: SHEPI-HOME-2026, title: "Shepi: AI Quality of Earnings Software for SMB M&A", publisher: "Shepi", type: vendor, url: "https://www.shepi.ai", date: "2026-10-20", access: full, locator: "'Choose the right level of support' (Self-Service and Done-For-You); scope disclaimer"}
    - {ref: QOEAGENT-HOME-2026, title: "QoEAgent: AI quality of earnings, proof of cash and SBA lender QoE (home page)", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/", date: "2026-10-20", access: full, locator: "'Four products, one continuum' section"}
    - {ref: SEARCHFUNDER-COLUMBIA-2026, title: "Columbia Team working on Cheaper Quality of Earnings Reports", publisher: "Searchfunder (community thread)", type: community, url: "https://www.searchfunder.com/post/columbia-team-working-on-cheaper-quality-of-earnings-reports", date: "2026-06", access: full, locator: "original post and the two visible replies; date approximate from '4mos ago'"}
    - {ref: QOEAGENT-WHO-2026, title: "Who Can Prepare an SBA Quality of Earnings Report", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/who-can-prepare-sba-quality-of-earnings/", date: "2026-09-05", access: full, locator: "opening summary and arrangements table"}
    - {ref: FORVIS-QOE-2026, title: "Quality of Earnings & Due Diligence in an AI World", publisher: "Forvis Mazars US (Transaction Advisory)", type: firm, url: "https://www.forvismazars.us/forsights/2026/09/quality-of-earnings-due-diligence-in-an-ai-world", date: "2026-09-08", access: full, locator: "section '3. Talent' and closing paragraphs"}
    - {ref: QOE-VENDORS-2026, title: "Quality of Earnings Software Launched by Finsider.ai (and other QoE automation vendor claims, as seen in search)", publisher: "Barchart (press release distribution)", type: vendor, url: "https://www.barchart.com/story/news/35038707/quality-of-earnings-software-launched-by-finsider-ai-ai-powered-qoe-reports-automation-platform-targets-60-faster-due-diligence-for-ma-deals", date: "2026", access: search-only, locator: "search-result summaries only (100% transaction coverage, proof-of-cash reconciliation, 60-80% faster diligence)"}
  last_reviewed: "2026-10-20"
  notes: >-
    Firm type: AI-native providers selling direct to buyers and lenders. The landscape's QoE-vendor lead
    (QOE-VENDORS-2026: Finsider, QoEAgent, Shepi; claims of 60-80% faster diligence) was merged here; it is
    search-only vendor marketing and is not used as an outcome. The 12 comments on the Columbia thread and 8 on the
    Sourcetable thread are mostly behind login; only the visible replies were read. Prices here are vendor list
    prices, not a firm's fee data; how a firm prices its own diligence work is in professional-services-scoping-pricing-16
    and professional-services-scoping-pricing-17.

- id: advisory-transactions-06
  title: "Sub-contracted or white-labelled AI QoE capacity for transaction advisory and CPA firms"
  archetype: advisory
  module: transactions
  function: service-delivery
  work_types: [transaction-processing, document-production]
  pattern: bulk-transformation
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Transaction advisory and CPA firms need capacity for proof-of-cash and trial-balance work during busy periods
    (QoEAgent; Shepi).
  solution: >-
    QoEAgent says it white-labels or supports parts of engagements for transaction advisory and CPA firms, from proof
    of cash and trial balance mapping through the databook. Shepi pitches accountants and CPAs on extra capacity
    through structured workpapers and repeatable analysis.
  outcomes:
    - {lever: capacity, description: "none published", figure: "none published", measures: "Positioning statements on vendor pages; no named firm customer or result found", provenance: vendor-published, source_ref: QOEAGENT-HOME-2026}
  prerequisites:
    - "Firm engagement terms that allow a sub-contractor or software to handle client financial data"
  risks_and_guardrails:
    - "Seller NDAs may restrict who and what may handle diligence material; an AI provider may not count as a permitted representative (KJK-NDA-2026)"
  human_checkpoints:
    - "Not described beyond the vendors' own review steps (QOEAGENT-HOME-2026; SHEPI-HOME-2026)"
  role_evolution: "Not stated by the sources."
  evidence_grade: C
  sources:
    - {ref: QOEAGENT-HOME-2026, title: "QoEAgent: AI quality of earnings, proof of cash and SBA lender QoE (home page)", publisher: "QoEAgent", type: vendor, url: "https://qoeagent.ai/", date: "2026-10-20", access: full, locator: "'Who we serve' (TAS and CPA firms); FAQ 'Do you work with transaction advisory and CPA firms?'"}
    - {ref: SHEPI-HOME-2026, title: "Shepi: AI Quality of Earnings Software for SMB M&A", publisher: "Shepi", type: vendor, url: "https://www.shepi.ai", date: "2026-10-20", access: full, locator: "'Built around the deal' (Accountants and CPAs)"}
