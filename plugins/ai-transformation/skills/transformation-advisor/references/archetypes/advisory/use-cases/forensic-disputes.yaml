- id: advisory-forensic-disputes-12
  title: "Idea: investigation services for AI-fuelled fraud (deepfake impersonation, forged documents, payments fraud) and AI-washing claims"
  archetype: advisory
  module: forensic-disputes
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Clients expect more AI-enabled fraud (synthetic identities, AI voices, forged documents) and claims that overstate a
    company's AI capabilities ("AI washing"), and few feel prepared.
  solution: >-
    Forensic accountants investigate AI-enabled schemes and test AI claims made to investors or customers. The topic
    appears in conference programmes, but no firm reports delivering the service.
  outcomes:
    - lever: risk
      description: >-
        Only 7% of respondents say their organisations are more than moderately prepared to detect or prevent AI-fuelled fraud.
      figure: "7%"
      measures: "Share of 713 ACFE/SAS survey respondents; a demand signal, not an outcome of a service."
      provenance: vendor-published
      source_ref: ACFE-TECHBENCH-2026
    - lever: risk
      description: >-
        85% of senior internal audit leaders view AI-enabled fraud as a moderate to high risk, and fewer than four in 10
        believe their function is adequately prepared.
      figure: "85% of 373"
      measures: "Internal Audit Foundation and Optro survey of 373 senior internal audit leaders; a demand signal."
      provenance: independent
      source_ref: IAF-AIFRAUD-2026
    - lever: risk
      description: >-
        76% of US organisations had attempted or actual payments fraud in 2025, 74% were affected by business email
        compromise (BEC, fraud using spoofed or hijacked business email), and 17% use AI against payments fraud.
      figure: "76%; 74% BEC; 17% use AI"
      measures: "AFP 2026 Payments Fraud and Control Survey of treasury and finance professionals (press release)."
      provenance: independent
      source_ref: AFP-PAYFRAUD-2026
    - lever: risk
      description: >-
        In March 2024 the SEC settled charges against two investment advisers for false and misleading statements about
        their use of AI.
      figure: "$400,000 total civil penalties"
      measures: "Combined civil penalties paid by Delphia (USA) Inc. and Global Predictions Inc., announced 2024-03-18."
      provenance: independent
      source_ref: SEC-AIWASH-2024
  prerequisites:
    - Skills in AI systems, data forensics and investigation interviews.
  risks_and_guardrails:
    - Survey respondents say fraudsters are ahead; only 7% feel more than moderately prepared (ACFE-TECHBENCH-2026).
    - The SEC action concerns investment advisers; its reach to private middle-market clients was not researched (SEC-AIWASH-2024).
  human_checkpoints:
    - Investigators decide scope, interview and report findings.
  role_evolution: >-
    A scheduled AICPA FVS session targets CPAs who want to position themselves as experts in AI-enabled elder fraud
    (AICPA-FVS-2026, FVC2621).
  evidence_grade: D
  sources:
    - { ref: ACFE-TECHBENCH-2026, title: "Study: Deepfake fraud surges - and only 7% of organizations are firmly ready (2026 Anti-Fraud Technology Benchmarking Report press release)", publisher: "SAS with ACFE", type: survey, url: "https://www.sas.com/en_us/news/press-releases/2026/march/acfe-anti-fraud-technology-study-deepfakes.html", date: "2026-03-25", access: full, locator: "opening paragraph" }
    - { ref: IAF-AIFRAUD-2026, title: "Internal Audit and AI-Enabled Fraud", publisher: "Internal Audit Foundation with Optro", type: survey, url: "https://www.theiia.org/globalassets/site/content/research/foundation/2026/internal-audit-and-ai-enabled-fraud/ia-and-ai-enabled-fraud-report-en.pdf", date: "2026-07", access: full, locator: "Executive summary, p. 3; pp. 13-14 (routed from risk-controls research)" }
    - { ref: AFP-PAYFRAUD-2026, title: "Over 75% of US Firms Experienced Payments Fraud in 2025, While AI Adoption for Fraud Mitigation Lags", publisher: "Association for Financial Professionals (survey underwritten by Truist)", type: survey, url: "https://www.financialprofessionals.org/about/learn-more/press-releases/Details/over-75-percent-of-us-firms-experienced-payments-fraud-in-2025-while-ai-adoption-for-fraud-mitigation-lags", date: "2026-04-14", access: full, locator: "key findings list (routed from client-accounting-services research)" }
    - { ref: SEC-AIWASH-2024, title: "SEC Charges Two Investment Advisers with Making False and Misleading Statements About Their Use of Artificial Intelligence", publisher: "SEC", type: regulator, url: "https://www.sec.gov/newsroom/press-releases/2024-36", date: "2024-03-18", access: full, locator: "paragraphs 1-3 (routed from risk-controls research)" }
    - { ref: ACFE-APAC-2026, title: "2026 ACFE Fraud Conference Asia-Pacific sessions", publisher: "ACFE", type: conference, url: "https://www.fraudconference.com/asiapac2026/sessions.aspx", date: "2026-08-18", access: full, locator: "session 2B, 'How to Uncover Artificial Intelligence Washing' (title only)" }
    - { ref: ACFE-CANADA-2026, title: "2026 ACFE Fraud Conference Canada sessions", publisher: "ACFE", type: conference, url: "https://www.fraudconference.com/canada2026/sessions.aspx", date: "2026-11-15", access: full, locator: "pre-conference on ethical AI use in fraud work; session 4C (scheduled)" }
    - { ref: ACFE-CANPR-2026, title: "2026 ACFE Fraud Conference Canada Focuses on AI, Cybercrime, Emerging Risks and More", publisher: "ACFE", type: professional-body, url: "https://www.acfe.com/about-the-acfe/newsroom-for-media/press-releases/press-release-detail?s=2026-acfe-fraud-conference-canada-pr", date: "2026-10-01", access: full, locator: "list of presentations" }
    - { ref: AICPA-FVS-2026, title: "AICPA Forensic & Valuation Services Conference 2026 agenda (Nov 4-6, 2026)", publisher: "AICPA & CIMA", type: conference, url: "https://tools.eventpower.com/agenda_module/schedule/display/26AICPA-FVC?agenda_id=2652&key=aab743&header=0", date: "2026-11", access: full, locator: "FVC2621, Thu Nov 5, 1:05-1:55 pm (scheduled)" }
  last_reviewed: "2026-10-21"
  notes: >-
    IDEA, labelled as such. Pattern: other (a new investigation service line; no source describes an end-to-end case
    agent). Demand signals cover payments fraud, BEC and deepfake investigation (AFP-PAYFRAUD-2026), AI-enabled fraud
    (IAF-AIFRAUD-2026) and AI-washing (SEC-AIWASH-2024). Prevention and control design stay in
    client-accounting-services (payment screening, advisory-client-accounting-services-10), private-client
    (payment-anomaly flagging, advisory-private-client-07) and risk-controls (fraud-risk readiness,
    advisory-risk-controls-23). Only session titles were available for the AI-washing session; items dated after
    2026-10-20 are scheduled and cannot support the grade.

