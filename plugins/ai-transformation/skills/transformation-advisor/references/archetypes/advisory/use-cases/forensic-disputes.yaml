- id: advisory-forensic-disputes-15
  title: "Idea: validation studies and error-rate testing of machine-generated analyses to meet or challenge a reliability standard such as proposed Rule 707"
  archetype: advisory
  module: forensic-disputes
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    If machine output is offered without an expert, the proponent would have to show it meets Rule 702's reliability
    tests, and a black-box process may be hard to defend without independent validation.
  solution: >-
    Experts design and run validation studies (training data, error rates, independent replication) that show a tool's
    reliability for the question at hand, or test an opponent's tool. The revised draft committee note says a proponent
    may overcome inexplicability by showing how the machine was trained and, for example through validation studies,
    that the process has a low error rate. Rule 707 is a proposal and may change.
  outcomes:
    - lever: risk
      description: none published
      figure: none published
      measures: "No outcomes; the service is described as a possibility."
      provenance: independent
      source_ref: USCOURTS-EVAGENDA-2026
  prerequisites:
    - Access to the tool's training data or the ability to test it on known cases; the committee discussed whether independent researchers would have licences.
  risks_and_guardrails:
    - The rule is not adopted; the Standing Committee's September 2026 report lists only continued consideration (USCOURTS-STDCOMM-2026).
    - The Justice Department raised overall concerns about Rule 707 at the November 2025 committee meeting (USCOURTS-EVAGENDA-2026, minutes, p. 19).
  human_checkpoints:
    - The court decides admissibility under the rule.
  role_evolution: >-
    Not published for forensic accountants. The committee discussed adding a factor on whether independent researchers
    have validated a tool and can obtain licences to test it (USCOURTS-EVAGENDA-2026, pp. 18-19), which would raise demand
    for independent testing; that demand is an inference, not a source statement.
  evidence_grade: D
  sources:
    - { ref: USCOURTS-EVAGENDA-2026, title: "Advisory Committee on Evidence Rules, agenda book for the May 7, 2026 meeting", publisher: "US federal judiciary", type: regulator, url: "https://www.uscourts.gov/sites/default/files/document/2026-05_evidence_rules_agenda_book.pdf", date: "2026-05-07", access: full, locator: "p. 4 (Tab III: more than 70 written comments); pp. 18-19 (Nov 2025 minutes: independent-validation factor, DOJ concerns); pp. 65-66 (Jan 2026 Standing Committee draft minutes: validation studies); pp. 132-133 (revised draft committee note)" }
    - { ref: USCOURTS-STDCOMM-2026, title: "Report of the Committee on Rules of Practice and Procedure, September 2026 (Agenda E-19, rev. 8/27/26)", publisher: "US federal judiciary", type: regulator, url: "https://www.uscourts.gov/sites/default/files/document/sept_2026_rules_report_and_attachments_final.pdf", date: "2026-08-27", access: full, locator: "Evidence Rules, Information Items (after p. 25)" }
    - { ref: USCOURTS-FRE707-2025, title: "Proposed Federal Rule of Evidence 707, Machine-Generated Evidence (published draft and committee note)", publisher: "US federal judiciary (copy hosted by Steptoe)", type: regulator, url: "https://www.steptoe.com/a/web/mfVW1ZxAuBkvow2pShnt2X/proposed-rule-707.pdf", date: "2025-08", access: full, locator: "rule text; committee note" }
  last_reviewed: "2026-10-21"
  notes: >-
    IDEA, labelled as such. Pattern: other (validation testing offered as an expert service). No source describes the
    service itself; the building blocks (validation studies, error-rate evidence) are in the committee's discussion.
    Rule 707's status comes from the judiciary's own September 2026 report. The validation-studies sentence is in the
    revised note in the May 2026 agenda book, not in the August 2025 published draft.
