- id: advisory-fpa-performance-12
  title: Partner-delivered implementation of AI-native ERP for mid-market finance teams
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - software-systems
  - coordination-scheduling
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: announced
  problem: Rillet says legacy ERPs act as 'dumb databases' where the real work happens in spreadsheets, and that
    traditional implementations take about 12 months.
  solution: An AI-native ERP applies AI inside the general ledger, with native integrations feeding structured data.
    Rillet says accounting firms are strategic partners, naming Armanino (top 20) and Wiss (top 50). Rillet's release
    says customers report implementing in as little as 4 weeks. Rillet's 2026 postings include a partnerships lead
    aimed at the Big 4, top firms, boutiques and fractional CFOs, and deployment leads for accounting solutions.
  outcomes:
  - lever: speed
    description: Rillet says customers consistently report cutting close times to a few days and implementing as
      fast as 4 weeks versus the 12 months it says traditional systems need.
    figure: 4 weeks versus 12 months
    measures: Implementation time as reported by the vendor, comparing its fastest customers with a vendor-stated
      traditional baseline; no sample, definition or named firm-led project
    provenance: vendor-published
    source_ref: RILLET-SERIESB-2025
  prerequisites:
  - Standard integrations to the client's source systems
  - A client finance team willing to leave spreadsheet-based processes
  risks_and_guardrails:
  - More than a quarter of organisations in Panorama's 2026 ERP study exceeded project budgets, with additional
    technology needs the leading cause; Panorama is an ERP consultancy and the full report is gated (PANORAMA-ERP-2026).
  - Vendor release; a single-vendor source. Customer closes and implementation times could not be checked. The
    page's FAQ (updated 2026-08-25) says implementations typically take 4-6 weeks led by Rillet's own CPA-driven
    team, against 3-12 months for traditional ERP, so the speed claim is not evidence of partner-led delivery (RILLET-SERIESB-2025).
  human_checkpoints:
  - Implementation partner designs the chart of accounts, integrations and controls
  role_evolution: Rillet says its leaders are former EY, PwC and CPA practitioners and its customers run lean teams;
    the release gives no data on partner staffing (RILLET-SERIESB-2025). Rillet is hiring deployment leads and a
    partnerships lead for firms and fractional CFOs (RILLET-JOBS-2026).
  evidence_grade: C
  sources:
  - ref: RILLET-SERIESB-2025
    title: Rillet raises $70M Series B from Andreessen Horowitz and ICONIQ
    publisher: Rillet
    type: vendor
    url: https://rillet.com/blog/fundraise-announcement/
    date: '2025-08-06'
    access: full
    locator: Paragraphs on customer close times and implementation; paragraph on partnerships with Armanino and
      Wiss
  - ref: PANORAMA-ERP-2026
    title: Panorama Consulting Group Releases Latest Study of ERP Implementation Outcomes Across the Globe (2026
      ERP Report)
