- id: advisory-fpa-performance-11
  title: Advisory partners enable and govern native AI agents inside mid-market ERP (Sage Intacct, Microsoft, NetSuite)
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - software-systems
  - coordination-scheduling
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: ERP vendors now ship AI assistants and agents with each product release (Sage Intacct had three 2026
    releases by August). Clients need someone to decide which to turn on, configure roles and permissions, and
    connect them to workflows.
  solution: Partner firms run release webinars and write-ups and offer agent services. Armanino's August 12, 2026
    deck says Sage Intacct's Finance Intelligence Agent is being rolled out to all customers 'this summer and fall'
    (phased early adopter) and describes a marketplace of Sage-certified partner agents with an admin console and
    role-based access. EisnerAmper's write-up covers the same release. Rand Group says it helps enable native agents
    in Microsoft, NetSuite and Sage products and build custom agents.
  outcomes:
  - lever: capacity
    description: none published for the advisory service
    figure: none
    measures: 'Not applicable: the sources describe product releases and service offers, with no client results'
    provenance: vendor-published
    source_ref: ARMANINO-INTACCTR3-2026
  prerequisites:
  - Admin configuration of each agent in the client's environment
  - Roles and permissions that limit who can call an agent
  - Data quality in the ledger (the agents answer from it)
  risks_and_guardrails:
  - GRF CPAs & Advisors says the strongest parts of Intacct's 2026 Release 2 are usability gains in day-to-day work
    rather than headline AI alone (GRF-INTACCTR2-2026).
  - Many agentic close tools are subservice organisations in SOC terms, and a practitioner article says AICPA guidance
    on AI in SOC reporting had not yet been published, so existing SOC reports may be silent on AI components (CPAPA-AGENTSCLOSE-2026,
    control 4). The Journal of Accountancy reported on 2026-10-13 that the AICPA had issued guidance earlier in
    2026 on service organizations' AI use in SOC 1 and SOC 2 engagements, so that statement appears superseded (JOFA-AIPA-2026).
  human_checkpoints:
  - Administrator enables each agent and sets role access
  - Marketplace agents are certified by the vendor through a technical, security and legal process (Armanino deck)
  role_evolution: Partner firms now brief clients on agent releases (ARMANINO-INTACCTR3-2026; EISNERAMPER-INTACCTR3-2026)
    and offer to enable native agents and build custom ones (RAND-AGENTS-2026). The sources show the offer, not
    a measured change in partner roles.
  evidence_grade: C
  sources:
