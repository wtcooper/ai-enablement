    and implementation impairs independence unless it is reasonable to conclude the results will not be subject to
    audit procedures, and separately lists management functions (decision-making, supervisory or ongoing monitoring)
    as impairing it (SEC-RULE2-01-2026, (c)(4)(ii) and (vi)). CFGI says it is free of auditor independence constraints
