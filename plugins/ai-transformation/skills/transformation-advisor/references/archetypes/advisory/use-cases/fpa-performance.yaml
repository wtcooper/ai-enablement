# Use cases: advisory / fpa-performance
# FP&A, budgeting and forecasting, management and board reporting, performance improvement and finance-system
# advisory delivered by accounting and advisory firms, PE-backed advisory platforms, vendors and client finance teams.
# Sources checked 2026-10-20 and re-checked against every cited source 2026-10-21.
# Evidence is thin: no entry is graded A and 2 of 14 are B. No accounting or advisory firm has published a measured
# outcome (error, edit or override rate, parallel run, forecast accuracy, cycle time) for AI-assisted FP&A work.
# Bookkeeping-based reporting and CAS forecasts are in client-accounting-services; controls before agents go live are
# in risk-controls; firm operations are in professional-services. Cross-references are by id in notes.
# Similar keys that name different documents: RSM-MMAI-2026 is RSM's own release on its middle-market AI survey;
# CPAPA-RSMMM-2026 (risk-controls, transactions) is CPA Practice Advisor's report of the same survey.

- id: advisory-fpa-performance-01
  title: AI-drafted variance and flux commentary, KPI views and management and board reporting packs, reviewed before
    release
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - data-reporting
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Variance explanations and performance narratives are written by hand, late in the reporting cycle. In
    the 2026 FP&A Trends Survey, teams reported spending 47% of their time on data collection and validation and
    32% on insight generation. CAS and advisory teams compile monthly statements by hand and add client-specific
    commentary late; clients want insight, not only numbers.
  solution: AI features inside planning and reporting platforms (the sources name Solver Copilot and Abacum's narrative
    layer) draft variance summaries, flag outliers and propose root causes from the planning model. An analyst or
    advisor reviews and edits before anything reaches management or a board. Pigment's page says it plans agent-based
    drafting of monthly budget variance analysis (planned, not shipped). Withum's Jim Bourke told a May 2026 conference
    to 'think how quickly Claude or ChatGPT could find a variance' and probably explain it, and said using AI to
    deliver real-time dashboards on the metrics clients want is how a CAS practice differentiates itself. CohnReznick
    CAS leaders name AI document-generation tools for auto-generated monthly reporting with commentary (Reach Reporting,
    Qvinci, Spotlight Reporting) in the Journal of Accountancy; they list Datarails under scenario modeling, not
    reporting.
  outcomes:
  - lever: capacity
    description: An unnamed CFO of a global media and information services firm said a flux analysis agent, built
      in three weeks, took variance commentary from 40 people manually producing it to five people reviewing and
      refining the agent's output.
    figure: 40 people to 5 people
    measures: People manually producing monthly variance commentary, before and after, as recalled by the CFO in
      a KPMG article; the organisation is not named and no method is given
    provenance: self-reported
    source_ref: KPMG-CFOREMODEL-2026
  - lever: quality
    description: In Gartner's March 2026 survey of 204 finance leaders, financial forecasting and insight generation
      were among the lowest-rated AI use cases.
    figure: none (ranking only)
    measures: Ratings of realized versus expected value by AI use case; the release gives no percentage for these
      use cases
    provenance: independent
    source_ref: GARTNER-AIREPORTCARD-2026
  - lever: cost
    description: Finance teams reported spending an average of 26% of their working time verifying or correcting
      AI-generated finance outputs.
    figure: 26%
    measures: Average share of work time spent verifying or correcting AI-generated finance outputs, among 270 CFOs
      and finance leaders in a Datarails (vendor) survey; 96% of respondents spent at least 10%
    provenance: vendor-published
    source_ref: CFODIVE-DATARAILS-2026
  - lever: capacity
    description: 86% of surveyed accounting professionals expect AI to increase their advisory capacity over the
      next 12 months; 30% name manual data cleanup as the top blocker to proactive advisory work.
    figure: 86% and 30%
    measures: Share of 725 US accounting and bookkeeping professionals in an Intuit-sponsored survey expecting more
      advisory capacity from AI, and naming manual data cleanup the top blocker
    provenance: vendor-published
    source_ref: INTUIT-ACCTTECH-2026
  prerequisites:
  - Actuals, plan and driver data already consolidated in one model (only 19% of FP&A teams rate their data quality
    advanced)
  - Agreed variance thresholds and commentary templates
  - A reviewer who knows the client's business
  - Clean, current ledger data and integrations (only 41% of surveyed firms say their tools are fully integrated)
  - A 30-60 day pilot on one workflow with time saved, added review time and errors measured (JofA)
  risks_and_guardrails:
  - 'Unreviewed AI output is a professional liability: Deloitte Australia agreed to repay the final instalment of
    a roughly AU$440,000 contract after a report was found to contain incorrect footnotes and references, and the
    updated report disclosed generative AI use (CITYAM-DELOITTE-2025).'
  - A practitioner checklist says agent output feeding the financial statements needs a human approval step whose
    depth scales with materiality, and that evidence should be replayable (CPAPA-AGENTSCLOSE-2026, controls 2 and
    3).
  - Vendor time-saving claims are marketing until a client's own data reproduces them (CPAPA-AGENTSCLOSE-2026, control
    2).
  - Three in five surveyed accountants say clients ask for proof of AI data protection always or frequently, yet
    only a third proactively explain how AI supports their work (INTUIT-ACCTTECH-2026).
  human_checkpoints:
  - Analyst checks each drafted explanation against the ledger and the business context
  - Named reviewer signs off before the pack goes to the client or board
  - Advisor reviews commentary and insights before delivery
  - Pilot measures review time and error reduction before scaling (JOFA-CASAI-2026)
  role_evolution: KPMG's Erin McShane sees AI supporting FP&A, spreadsheet modelling, data extraction and variance
    commentary, with talent needs moving from a reporting factory toward interpreting AI outputs and advising leaders
    (KPMG-CFOREMODEL-2026). Withum's Bourke says advisory-based services are the way the profession is going to
    grow, and that AI in CAS is where firms get 'the most bang for your buck' (ACCTODAY-CASKEYS-2026). In the Intuit
    survey, 38% of respondents name strategic judgment as the expertise they prioritise most in hiring and 22% AI
    fluency (INTUIT-ACCTTECH-2026).
  evidence_grade: C
