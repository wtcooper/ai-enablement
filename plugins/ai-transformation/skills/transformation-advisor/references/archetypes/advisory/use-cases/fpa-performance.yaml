- id: advisory-fpa-performance-13
  title: Managed FP&A delivered with agent-led forecasting and variance analysis, priced on outcomes
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - data-reporting
  - expert-judgment
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: announced
  problem: Enterprises want external help with planning, forecasting and decision support, not only transactional
    finance, and are comfortable sourcing more of it.
  solution: ISG's September 2026 FP&A quadrant says providers apply predictive models and GenAI to variance analysis,
    scenario modelling, forecast generation and management reporting, with early agentic capability that gathers
    data and flags deviations. It describes PwC's outcomes-based FP&A managed service with agent-led forecasting
    and variance analysis, EY's multi-agent forecasting framework, Deloitte's agentic forecasting, EXL's outcome-based
    delivery model and Sutherland's agentic CFO control tower aimed at midmarket and PE-backed enterprises.
  outcomes:
  - lever: speed
    description: ISG describes EY's multi-agent forecasting framework as turning variance analysis that once took
      thousands of hours into minutes.
    figure: thousands of hours to minutes
    measures: Variance analysis effort as characterised by ISG in the EY profile, from a provider-questionnaire
      process; no client, baseline or method given
    provenance: vendor-published
    source_ref: ISG-FAOFPA-2026
  prerequisites:
  - Data foundations and a unified data layer across FP&A and controllership (ISG on PwC)
  - Clients willing to source planning and analysis externally
  risks_and_guardrails:
  - 'ISG says maturity varies considerably: production implementations sit alongside early deployments, pilots and
    demonstrations (Executive Summary), and in FP&A differentiation increasingly depends on evidence that analytics
    improve forecast accuracy and decisions (ISG-FAOFPA-2026, FP&A Observations).'
  - ISG lists weak data foundations and insufficient governance as risks that could slow progress (ISG-FAOFPA-2026,
    Outlook).
  - 'Independence: for audit clients of SEC registrants, performing decision-making, supervisory or ongoing monitoring
    functions is listed as impairing independence (SEC-RULE2-01-2026, (c)(4)(vi)); whether a given managed FP&A
    scope crosses that line was not analysed here.'
  - 'Outcome-linked pricing meets a hard edge for audit clients: contingent fees on any service to an SEC issuer
    audit client impair independence (SEC-RULE2-01-2026, (c)(5)), and the AICPA Code restricts them where the firm
    performs an audit, review and certain other engagements (NYSSCPA-CONTFEE-2015, a 2015 description of the Code).'
  human_checkpoints:
  - ISG describes agentic capabilities operating under human oversight; sign-off points are not specified
  role_evolution: ISG says consulting and accounting firms are increasing their participation in managed services,
    which raises competition in FP&A, tax and controllership, and that experienced finance talent, industry context
    and data foundations drive differentiation (ISG-FAOFPA-2026).
  evidence_grade: C
  sources:
  - ref: ISG-FAOFPA-2026
    title: 'ISG Provider Lens Finance and Accounting Outsourcing (FAO) Services 2026: Financial Planning & Analysis
      quadrant report'
    publisher: Information Services Group (ISG), copy hosted by PwC
    type: survey
    url: https://www.pwc.com/gx/en/about/analyst-relations/financial-planning-and-analysis.pdf
    date: 2026-09
    access: full
    locator: FP&A 'Observations' paragraph; provider profiles for EY, PwC, Deloitte, EXL and Sutherland; Executive
      Summary on portfolio boundaries; Outlook
  - ref: SEC-RULE2-01-2026
    title: "17 CFR 210.2-01 Qualifications of accountants"
    publisher: U.S. Securities and Exchange Commission (via eCFR)
    type: regulator
    url: https://www.ecfr.gov/current/title-17/chapter-II/part-210/section-210.2-01
    date: "2026-10-20"
    access: full
    locator: (c)(4)(vi) and (c)(5)
  - ref: NYSSCPA-CONTFEE-2015
    title: 'Doing the Right Thing: When is a Contingent Fee Arrangement Considered an Act Discreditable?'
    publisher: NYSSCPA, The Trusted Professional
    type: professional-body
    url: https://nysscpa.org/news/1095984-doing-the-right-thing-when-is-a-contingent-fee-arrangement-considered-an-act-discreditable-2015-01-01
    date: '2015-01-01'
    access: full
    locator: Text on Section 1.510 (contingent fees proscribed where the firm performs an audit or review, certain
      compilations or an examination of prospective financial information)
  last_reviewed: '2026-10-21'
  notes: 'Firm types: Big Four (PwC, EY, Deloitte), and AI-native or outsourcing providers (EXL, Sutherland, Accenture,
    Capgemini and others in the report). Not mid-market accounting firms, apart from ISG''s remark that consulting
    and accounting firms are increasing their managed-service role. ISG is an analyst firm; the report is a provider-customized
    edition hosted by PwC. The outcome is a provider claim as relayed by ISG, so it cannot support a B or A grade.
    The firm''s own outcome-based pricing is in professional-services-scoping-pricing-19 and -14.'
- id: advisory-fpa-performance-14
  title: 'Idea: validation, back-testing and sign-off protocol for AI-generated forecasts and commentary, sold as
    an advisory service'
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - review-assurance
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: 'Finance leaders hesitate to trust AI for mission-critical work: in a vendor survey, 75% cited lack of
    auditability, 71% accuracy and hallucination concerns and 54% regulatory or compliance concerns.'
  solution: 'Practitioners and standard-setters describe pieces of such a service: an inventory of agents with named
    owners, evidence a reviewer can replay, sign-off gates scaled to risk, exception metrics with a kill threshold,
    and a short pilot that measures time saved, added review time and errors (CPA Practice Advisor, JofA). COSO''s
    February 2026 guidance maps generative AI capabilities, including insight generation, to its 17 control principles.
    Grant Thornton''s August 2026 webcast covers governance for AI-enabled forecasting.'
  outcomes:
  - lever: risk
    description: none published
    figure: none
    measures: No published results from an advisory service of this kind were found
    provenance: self-reported
    source_ref: COSO-GENAI-2026
  prerequisites:
  - A baseline of manual forecast accuracy to compare against
  - A client willing to log AI-assisted work and review results
  risks_and_guardrails:
  - KPMG's survey found only 29% of organisations track where AI adoption fails (KPMG-AIFINANCE-2026).
  - Independence implications of advisors validating a client's AI forecasts were not researched beyond the Regulation
    S-X management-functions text (SEC-RULE2-01-2026).
  human_checkpoints:
  - Named owner per agent
  - Human approval before outputs feed financial statements or board reporting
  role_evolution: Not discussed in the sources for this service.
  evidence_grade: D
  sources:
