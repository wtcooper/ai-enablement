- id: advisory-fpa-performance-07
  title: Planning models built and changed in plain language, with agents cascading structural changes
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - software-systems
  pattern: bulk-transformation
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: Building and changing multidimensional planning models normally needs specialist administrators or implementation
    consultants.
  solution: Abacum says its Modeling Intelligence lets finance teams build and modify models in plain language,
    with agents handling structural changes such as adding entities, currencies and product lines and cascading
    updates without breaking downstream reports. RSM's Abacum page says models can be built quickly without specialist
    admins while keeping transparency and auditability.
  outcomes:
  - lever: capacity
    description: none published
    figure: none
    measures: 'Not applicable: product descriptions only; no customer result for model building was published'
    provenance: vendor-published
    source_ref: ABACUM-INTELLIGENCE-2026
  prerequisites:
  - A governed model structure and clear dimension design
  - Reviewer able to inspect changes the agent makes
  risks_and_guardrails:
  - In a 2026 working paper, three frontier LLMs correctly solved 63, 58 and 42 of 100 synthetic leveraged buyout
    modelling cases, and accuracy fell as structure grew more complex; the author says none should be relied on
    without deterministic verification (SSRN-VIDAL-2026). This is an adjacent task (LBO models) and not planning-model
    building.
  - A practitioner checklist for close agents asks for evidence a reviewer can replay and for human sign-off scaled
    to materiality before agent output feeds the financial statements (CPAPA-AGENTSCLOSE-2026, controls 2 and 3);
    it addresses close agents, so applying it to model changes is an inference.
  human_checkpoints:
  - Reviewer inspects structural changes and reconciles outputs to the prior model before release
  role_evolution: RSM's page says models can be built without specialist admins (RSM-ABACUM-2026). The sources show
    no measured effect on implementation consultants or model administrators.
  evidence_grade: C
