  notes: >-
    Covers one change, a machine baseline forecast that a person adjusts, in two settings: Jirav Intelligent Forecasting
    in CAS and advisory firms, and ML forecasting in planning platforms. Change scope is step because one step, building
    the baseline, changes while driver-based models and the client discussion stay (Jirav says some clients still need
    driver-based models). The CAS 13-week cash-flow forecast from ledger data is in
    advisory-client-accounting-services-07; this entry covers the planning-software forecast. A family-office
    principal's one-off cash-flow model is advisory-private-client-16. Firm type: small and mid-size CAS firms; their
    ranks were not checked. Vendor: Jirav. Grade B, not A: the figures are quotes and counts in a vendor press release,
    not a tracked metric reported by the firm. Both sources are 2024, older than the 18-month window, and no later
    follow-up was found. The Intuit survey shows financial forecasting among the most common client-service uses of AI
    (51% of respondents in a 725-person sample of US accounting and bookkeeping professionals; the article does not
    state the denominator for the use list), but names no firms. For ML forecasting in planning platforms there is no
    named organisation and no measured forecast error. Evidence is survey self-report from KPMG (Big Four; the survey
    covers large organisations, not the middle market) and a sponsored vendor survey. Gartner's FP&A page says 84% of
    finance teams are deploying AI and only 4% are scaling it across the function; the page does not state the sample
    for that pair of figures. Maturity is in-production because Creative Planning used JIF for over 200 clients per the
    release; Gartner's pair of figures shows that wider ML and AI forecasting is mostly early deployment.
- id: advisory-fpa-performance-03
  title: Continuous, driver-based planning with AI-assisted scenarios replaces the annual budget cycle
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - data-reporting
  - expert-judgment
  pattern: other
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: Planning horizons are shrinking and scenario work is slow. In the 2026 FP&A Trends Survey, 44% of organisations
    could plan with high confidence only up to three months ahead, and only 19% of FP&A teams could run a scenario
    in real time or within one day.
  solution: Firms and vendors pitch rolling, driver-based forecasts that update as the business changes, with what-if
    scenarios on pricing, headcount, demand and investment (RSM and Abacum), continuous scenario-based forecasting
    with AI-enabled insights and governance (Grant Thornton webcast, August 20, 2026), and trigger-based adaptive
    scenario planning (Gartner). Abacum's release describes goal-seeking such as 'How do we reach $125M without
    adding headcount?'.
  outcomes:
  - lever: speed
    description: 'Baseline, not an outcome: only 19% of FP&A teams can run a scenario in real time or within a single
      day.'
    figure: 19%
    measures: Share of FP&A teams in the 2026 FP&A Trends Survey (475 respondents, 52 countries; sponsored by OneStream)
      that can run a scenario in real time or within a single day
    provenance: vendor-published
    source_ref: ONESTREAM-FPATRENDS-2026
  prerequisites:
  - Driver-based models (19% use mature models that automatically identify and apply drivers; 40% still use basic
    or non-driver approaches, per the webinar)
  - Integrated financial and operational planning (10% fully integrate them)
  - Timely data (11% have real-time or near-real-time access to critical data, per the survey release)
  risks_and_guardrails:
  - OneStream's presenter says AI compounds an existing advantage and does not create one, since AI users were already
    strong on data and connected planning (ONESTREAM-FPAWEBINAR-2026).
  - Gartner says traditional scenario planning relies on static assumptions and over-weights internal drivers (GARTNER-TALENT-2026).
  human_checkpoints:
  - Finance leaders set the trigger thresholds and contingency actions
  - Advisors challenge assumptions before scenarios go to management
  role_evolution: Gartner expects that by 2030 finance teams at leading organisations will shift from control and
    business-partnering roles toward digitally skilled 'catalysts' who build tools and manage AI-driven workflows
