    reporting packages, ledger dashboards and CAS-level variance explanations are in
    advisory-client-accounting-services-06; this entry covers the FP&A, planning-model and board-reporting layer.
    Reporting commentary for family principals is advisory-private-client-03. Firm types: Forvis Mazars US (top-100,
    mid-market) and Armanino (described as a top-20 firm in Rillet's release) deliver Solver; Abacum and Pigment are
    vendors. The Forvis Mazars deck is a webinar showing a tool, not a client deployment. The only figure that sounds
    like a measurement is anonymous and recalled, so the grade is C. No named advisory firm published an override rate,
    edit rate or error rate for AI-drafted commentary. For audit clients of SEC registrants, see the independence note
    in the module notes. Withum and CohnReznick are top-100 firms; Armanino and Wiss appear only as ENGAGE session
    speakers ('The tech-enabled adviser'; session title and abstract only, KARBON-ENGAGE-2026). Bourke's statement is
    general advice and does not say Withum measures dashboard results. The Intuit survey reports current use by unnamed
    firms (financial forecasting 51% and real-time insights 49% among top client-service uses).
- id: advisory-fpa-performance-02
  title: Machine-generated baseline forecasts (cash flow, budget, statistical and ML) inside planning software,
    with the adviser's judgment layered on top
  archetype: advisory
  module: fpa-performance
  function: service-delivery
  work_types:
  - data-reporting
  - expert-judgment
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: 'The vendor describes client forecasting as a weeks-long process: strategic discussion with the client,
    then trained staff building driver-based models. Forecasts are hard to hold beyond a short horizon: in the 2026
    FP&A Trends Survey, 44% could plan with high confidence only up to three months ahead, and confidence beyond
    six months fell from 39% to 29%.'
  solution: Jirav Intelligent Forecasting (JIF) uses AI and machine learning to generate a forward-looking cash-flow
    forecast from a client's historical data. Per the release, more advanced forecasts built with the firm's proprietary
    advisory insights can then be added to the engagement. Jirav says driver-based models built by skilled FP&A staff remain appropriate for some
    clients. More widely, statistical and machine-learning (ML) forecasting features in planning platforms generate
    baseline forecasts that analysts adjust; in the FP&A Trends Survey, ML use in forecasting reached 12%, the highest
    in the survey's history, and generative AI use reached 21%.
  outcomes:
  - lever: growth
    description: The owner of Practice Executive, a firm named in Jirav's release, said JIF insights 'already led
      to a $40K engagement with one of our clients'.
    figure: $40K engagement (one client)
    measures: Fee of one client engagement that the firm's owner attributes to JIF-derived insights, quoted in a
      vendor press release; no tracked metric
    provenance: vendor-published
    source_ref: JIRAV-JIF-2024
  - lever: capacity
    description: Creative Planning, named as an early adopter, 'initially included JIF for 10 clients' and increased
      use to over 200 clients, per the release.
    figure: 10 clients to over 200 clients
    measures: Number of clients for which the firm used JIF, as stated in the vendor's release; the date of the
      increase is not given
    provenance: vendor-published
    source_ref: JIRAV-JIF-2024
  - lever: quality
    description: 64% of respondents in KPMG's survey of 1,013 senior finance leaders reported stronger forecast
      accuracy over the past year.
    figure: 64%
    measures: Share of senior finance leaders at organisations with revenue of at least $250M ($500M in the US)
      reporting stronger forecast accuracy over the past year; self-reported, no measured error rate
    provenance: self-reported
    source_ref: KPMG-AIFINANCE-2026
  - lever: quality
    description: AI users scored 64% versus 35% for non-users on forecast quality in the FP&A Trends Survey, as
      presented in the webinar.
    figure: 64% versus 35%
    measures: Forecast quality, as presented in the webinar; the definition is not stated in the transcript and
      the report cautions the association does not show AI causes the difference
    provenance: vendor-published
    source_ref: ONESTREAM-FPAWEBINAR-2026
  - lever: quality
    description: Financial forecasting and insight generation were among the lowest-rated AI use cases in Gartner's
      March 2026 survey of 204 finance leaders.
    figure: none (ranking only)
    measures: Ratings of realized versus expected value by AI use case; no percentage published for these use cases
    provenance: independent
    source_ref: GARTNER-AIREPORTCARD-2026
  prerequisites:
  - Several periods of clean historical ledger data in the client's accounting system
  - A planning-software subscription (Jirav is CPA.com's preferred planning partner per the release)
  - A CAS or advisory team able to add client-specific forecasts
  - Data quality (36% in KPMG's survey call it both the top barrier and opportunity)
  - Back-testing against manual forecasts
  risks_and_guardrails:
  - No accuracy, back-test or error figure for JIF was published in the sources read.
  - The vendor itself says some clients still need driver-based models built by skilled staff (JIRAV-JIF-2024, section
    'Customizable and Ready for Growth').
  - KPMG found 71% of banking leaders reported moderate or significant forecast-accuracy gains against 44% in healthcare,
    which it attributes to data foundations (KPMG-AIFINANCE-2026).
  - The two 64% figures measure different things in different surveys and should not be combined.
  human_checkpoints:
  - Advisor reviews the machine forecast and layers on firm and client knowledge before presenting it
  - Analysts review and adjust machine baselines
  - Forecast error is tracked against actuals
  role_evolution: Jirav's release says the tool helps firms scale their services without increasing headcount; this
    is a vendor statement, not attributed to a named person (JIRAV-JIF-2024, 'Scaling Advisory Services Without Adding
    Staff'). Gartner recommends
    upskilling FP&A analysts into citizen data scientists and adding AI product managers and knowledge engineers
    (GARTNER-FPALEADER-2026, Priority 3).
  evidence_grade: B
