# Use cases: advisory / risk-controls
# Internal-audit outsourcing and co-sourcing, SOX readiness and testing, third-party and enterprise risk, and advising
# clients on governing their own AI. Merged on 2026-10-20 from the wave-5 practice, discourse and governance research
# files, the advisory landscape scan and the two cross-cutting files (independence-pricing, state-of-ai-disruption).
# Every source below was opened in that research (access: full); search-only leads are not used.
# No entry is graded A: no named organisation publishes a measured outcome for AI in internal audit, SOX or risk
# advisory. Most figures are vendor-published or self-reported; say so when you quote one.
# Boundaries: issuing SOC reports, AIUC-1 or ISO/IEC 42001 certification and audit methodology are in the assurance
# archetype; the firm's own pricing, quality control, engagement letters and staffing are in professional-services.
# Overlapping entries are cross-referenced by id in notes rather than duplicated.

- id: advisory-risk-controls-01
  title: "AI assists engagement pre-planning, risk brainstorming, walkthrough notes and starting risk scores"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [research-synthesis, document-production]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Pre-planning research, risk brainstorming, scoping, meeting summaries and walkthrough notes take engagement time
    before testing starts, and the annual risk assessment and planning memo start from a blank page and a mass of
    internal and external information.
  solution: >-
    Audit teams use generative AI for engagement pre-planning research and risk brainstorming, engagement planning and
    departmental risk assessment (Gartner poll). SOX leaders on a May 2026 panel described assistive uses: meeting
    summaries, walkthrough notes, code analysis, sample selection, reporting automation, populating SOC 1 templates,
    first-draft test procedures and documentation, and faster QA reviews; few autonomous uses were reported. Grant
    Thornton published 16 sample agent instructions for internal audit, including a risk-assessment agenda agent that
    pulls external information and a planning-memo agent that lists missing inputs as open items. Optro announced
    agentic risk-assessment scoring that recommends starting scores with supporting evidence.
  outcomes:
    - lever: speed
      description: "60% of polled audit professionals use genAI for engagement pre-planning and 44% for engagement planning"
      figure: "60%; 44%"
      measures: "Shares of 743 audit professionals in a Gartner webinar poll reporting genAI use for engagement pre-planning (research, brainstorming risks) and for engagement planning; self-selected webinar audience"
      provenance: independent
      source_ref: ACCTIMES-GARTNER-2026
    - lever: capacity
      description: "33% of KPMG webcast respondents name research, planning, scoping and risk assessment as their primary AI use in SOX, internal controls and internal audit"
      figure: "33%"
      measures: "Share of inputs from about 3,900 audit and risk leaders in KPMG's April 2026 Future of SOX webcast poll; self-selected audience"
      provenance: vendor-published
      source_ref: KPMG-FUTURESOX-2026
    - lever: speed
      description: "38.2% of webinar respondents see planning and risk assessment as where AI could create the most value"
      figure: "38.2%"
      measures: "Respondents selecting planning and risk assessment, among 2,078 to 2,327 attendees answering each question at the 2026-10-06 Wolters Kluwer TeamMate webinar; the publisher says the results are not a representative survey"
      provenance: vendor-published
      source_ref: CPAPA-IAPOLL-2026
  prerequisites:
    - "Clear expectations for AI-tool use; unclear expectations are the most common obstacle in Gartner's poll (48%) (HELPNET-GARTNER-2026)"
    - "Prior-year files, scope and methodology as agent inputs, with governance for agent development, testing, training, security and data access (GT-16AGENTS-2026)"
    - "Structured risk data in a GRC system the scoring agent can read (OPTRO-AGENTS-2026)"
  risks_and_guardrails:
    - "Gartner says the high adoption is not generally transforming audit processes and that productivity and adoption metrics are too narrow (ACCTIMES-GARTNER-2026)"
    - "A drafted risk assessment is a starting point and needs a person who knows the entity's real risks (FIELDGUIDE-SIXWAYS-2026)"
    - "AI-suggested scores can anchor the reviewer; the AICPA ethics article lists anchoring bias as a risk of AI output (JOFA-ETHICS-2026)"
    - "Overreliance and loss of professional judgment was the top agentic-AI concern for 27.5% of webinar respondents (CPAPA-IAPOLL-2026)"
  human_checkpoints:
    - "Auditor validates AI-surfaced risks before they enter the plan"
    - "Auditor confirms or overrides each starting risk score before the plan is issued"
  role_evolution: >-
    Wolters Kluwer's product lead says AI can contribute but can never inherit the auditor's accountability
    (CPAPA-IAPOLL-2026). Gartner says audit leaders feel pressure to show AI results and often jump to use cases without
    a strategy (ACCTIMES-GARTNER-2026).
  evidence_grade: C
  sources:
    - {ref: ACCTIMES-GARTNER-2026, title: "Audit teams' AI use common but most lack strategy", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/audit-teams-ai-use-common-but-most-lack-strategy", date: "2026-08-16", access: full, locator: "paragraphs on use cases and on Gartner analyst commentary"}
    - {ref: HELPNET-GARTNER-2026, title: "Most chief audit executives can't tell you what AI is worth yet", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/09/15/gartner-ai-in-internal-audit/", date: "2026-09-15", access: full, locator: "section 'The barriers are people and process'; paragraph 'Drafting and planning dominate'"}
    - {ref: IAC-SOXCHANGE-2026, title: "How SOX Is Changing in 2026", publisher: "Internal Audit Collective", type: community, url: "https://www.internalauditcollective.com/newsletters/how-sox-is-changing-in-2026", date: "2026-06-04", access: full, locator: "section 1, paragraph on current SOX use cases"}
    - {ref: GT-16AGENTS-2026, title: "16 sample AI agents for Internal Audit", publisher: "Grant Thornton Advisors", type: firm, url: "https://www.grantthornton.com/insights/articles/advisory/2026/16-sample-ai-agents-for-internal-audit", date: "2026-08-06", access: full, locator: "intro; first two agent tables (risk assessment agenda; planning memorandum)"}
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Agentic Risk Assessment Scoring paragraph"}
    - {ref: KPMG-FUTURESOX-2026, title: "Revolutionizing internal controls: Insights from an April 2026 KPMG Future of SOX webcast", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls.pdf", date: "2026-05-20", access: full, locator: "p. 2 (date is the PDF creation date; the webcast was in April 2026)"}
    - {ref: CPAPA-IAPOLL-2026, title: "Internal Auditors Eye Broader AI Use", publisher: "CPA Practice Advisor (reporting a Wolters Kluwer TeamMate poll)", type: survey, url: "https://www.cpapracticeadvisor.com/?p=191508", date: "2026-10-12", access: full, locator: "paragraphs 1, 6-8 and 'About the polling'"}
    - {ref: FIELDGUIDE-SIXWAYS-2026, title: "Six Ways Internal Audit Teams Are Putting AI to Work", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/six-ways-internal-audit-teams-are-putting-ai-to-work", date: "2026", access: full, locator: "section on planning and drafting"}
    - {ref: JOFA-ETHICS-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division staff)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "paragraph on anchoring bias"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from four research entries (practice 09, discourse 07 and 15, governance 07). Grade C: prevalence comes from
    self-selected polls and the named items (GT's sample agents, Optro scoring) are guidance or announced products, not
    reported deployments; the May 2026 panelists' employers are not named. Covers in-house internal audit as well as
    outsourced providers. Firm types: Grant Thornton Advisors (non-attest arm of a PE-backed alternative practice
    structure), Optro and Fieldguide (vendors), KPMG (Big Four). The audit-side equivalent is
    assurance-planning-risk-assessment-25; BDO's Risk Assessment Coach is an audit tool and sits in assurance.

- id: advisory-risk-controls-02
  title: "Signals from board materials and shared risk registers turned into audit actions between planning cycles"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [research-synthesis, data-reporting]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Board packs, audit actions and remediation tracking live in separate places, so signals in governance materials do
    not become audit follow-up. Enterprise risk registers and annual audit plans lag real conditions; Baker Tilly
    describes a 'signal gap' where data infrastructure cannot identify risks in real time.
  solution: >-
    Diligent links its AuditAI product to Smart Prep 360, which reviews board and committee materials for accounting
    anomalies, control gaps, repeat findings and potential fraud indicators and produces questions for directors.
    AuditAI turns those signals into risk-aware evidence requests and tracks remediation to closure. Baker Tilly's
    recap of the IIA's 2026 GAM conference discusses sharing risk registers and compliance monitoring results across
    the three lines; using AI to sense risk themes between planning cycles is discussed as an idea.
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
      measures: "No customer or result reported; announced product"
      provenance: vendor-published
      source_ref: DILIGENT-AUDITAI-2026
  prerequisites:
    - "Diligent Boards and the Diligent One platform in use (DILIGENT-AUDITAI-2026)"
    - "Documented governance that preserves internal audit's independence while risk intelligence is shared (BAKERTILLY-GAM-2026, item 2)"
  risks_and_guardrails:
    - "Single vendor source with no named customer (DILIGENT-AUDITAI-2026)"
    - "Baker Tilly flags a governance gap and independence concerns when internal audit takes on second-line functions; its recap says 71% of CAEs hold responsibilities beyond internal audit without naming the survey behind the figure (BAKERTILLY-GAM-2026, item 2)"
    - "48% of CAEs cite integrating AI into existing technology, processes and workforce as a top concern (PROTIVITI-TOPRISKS-2026)"
  human_checkpoints:
    - "Auditors keep key decisions through structured workflows and approvals (vendor claim, DILIGENT-AUDITAI-2026)"
    - "CAE and risk leaders decide what enters the risk register and the audit plan"
  role_evolution: >-
    Baker Tilly says the CAE moves from controlling every move to cultivating an environment where innovation can grow
    (BAKERTILLY-GAM-2026, item 6).
  evidence_grade: C
  sources:
    - {ref: DILIGENT-AUDITAI-2026, title: "Diligent launches AuditAI to streamline internal audits", publisher: "CFOtech", type: press, url: "https://cfotech.news/story/diligent-launches-auditai-to-streamline-internal-audits", date: "2026-03-13", access: full, locator: "paragraphs on Smart Prep 360"}
    - {ref: BAKERTILLY-GAM-2026, title: "Strategy in motion: Internal audit's 2026 execution mandate", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/internal-audit-2026-execution-mandate", date: "2026-04-10", access: full, locator: "items 1, 2 and 6"}
    - {ref: PROTIVITI-TOPRISKS-2026, title: "Top Risks 2026: Insights for Internal Audit Teams", publisher: "Protiviti", type: survey, url: "https://www.protiviti.com/us-en/survey/top-risks-cae-internal-audit-2026", date: "2026-01-22", access: full, locator: "paragraph on CAE integration concerns (48%)"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 15 (Diligent) and discourse 17 (continuous risk sensing, an idea). The continuous-sensing part
    is an idea; the Diligent part is an announced product. It is the only entry touching enterprise risk management
    (ERM), which has no named AI deployment in the research. Firm types: Diligent (vendor), Baker Tilly (large US
    accounting and advisory firm). Fraud-indicator flagging in board materials is routed to forensic-disputes. The
    audit-side equivalent is assurance-planning-risk-assessment-04.

- id: advisory-risk-controls-03
  title: "AI drafts risk and control matrices, control narratives, test procedures and document request lists for review"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [document-production, expert-judgment]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Building a risk and control matrix (RCM: the table linking each risk to the controls that address it) from notes,
    flowcharts and architecture diagrams takes an auditor days at the start of an internal-audit or SOX readiness
    engagement. Writing test steps, choosing sample sizes and listing the evidence to request is repetitive, and
    designing, rationalising and documenting controls for a client can take days or weeks.
  solution: >-
    RSM describes an agent, reached through a chat interface such as Microsoft Teams, that reads uploaded process
    documents, identifies process areas, risks and controls, and populates an RCM draft with control reference, type
    and frequency. It also generates step-by-step test procedures, applies a sampling methodology to population sizes
    and produces a document request list (DRL). Grant Thornton's CompliAI, deployed in February 2024 for its internal
    audit, compliance and risk professionals, combines the firm's controls library with generative AI for control gap
    assessment, rationalisation, narrative preparation, control definition, test-step preparation and identification
    of required evidence.
  outcomes:
    - lever: speed
      description: "An RSM director says the agent produces a first-draft RCM in minutes for work that typically takes one to two days"
      figure: "minutes versus one to two days"
      measures: "Time to a first-draft RCM from uploaded process documents, agent versus typical manual effort, as stated by an RSM director in a webinar write-up; not a tracked metric"
      provenance: self-reported
      source_ref: RSM-AGENTICIA-2025
    - lever: capacity
      description: "When inputs are reviewed first, the agent saves auditors several hours on test procedures and document requests"
      figure: "several hours"
      measures: "Manual hours saved per set of test procedures and document requests, as stated by an RSM director; not a tracked metric"
      provenance: self-reported
      source_ref: RSM-AGENTICIA-2025
    - lever: quality
      description: "During user acceptance testing the agent sometimes used individual names instead of roles and combined several controls into one"
      figure: "none published"
      measures: "Qualitative observation from user acceptance testing; no error rate given"
      provenance: self-reported
      source_ref: RSM-AGENTICIA-2025
    - lever: speed
      description: "Grant Thornton says control design and assessment tasks run in minutes where they would traditionally take days or weeks"
      figure: "minutes versus days or weeks (qualitative)"
      measures: "Elapsed time for control design and assessment tasks, described qualitatively in the firm's press release; no count"
      provenance: self-reported
      source_ref: GT-COMPLIAI-2024
  prerequisites:
    - "Process documentation the agent can read (narratives, flowcharts, architecture diagrams) and a secure enterprise environment (RSM-AGENTICIA-2025)"
    - "Accurate control descriptions and data fields, and an approved sampling methodology, before the agent builds testing strategies (RSM-AGENTICIA-2025)"
    - "A curated controls library to ground the model (GT-COMPLIAI-2024)"
    - "Formal approvals for changes to the agent workbench, and user training on its limits (RSM-AGENTICIA-2025)"
  risks_and_guardrails:
    - "Human review of every RCM draft before testing starts; output quality depends on input quality (RSM-AGENTICIA-2025)"
    - "The Grant Thornton release gives no quality measure, and current use of CompliAI was not confirmed in 2026 sources (GT-COMPLIAI-2024)"
  human_checkpoints:
    - "Auditor reviews and corrects the RCM, then confirms details with auditees, before testing"
    - "Auditor reviews procedures and the request list before they go to control owners"
  role_evolution: >-
    RSM describes treating the agent like a digital employee that can make intern-like mistakes, so the auditor moves
    from drafting to supervising and validating (RSM-AGENTICIA-2025).
  evidence_grade: B
  sources:
    - {ref: RSM-AGENTICIA-2025, title: "Reimagine internal audit with agentic AI to drive value", publisher: "RSM US", type: firm, url: "https://rsmus.com/insights/services/digital-transformation/agentic-ai-for-internal-audit.html", date: "2025-12-22", access: full, locator: "sections 'Creating risk and control matrices' and 'Testing strategy and generating document request lists (DRLs)'"}
    - {ref: IIA-CAEBULLETIN-2026, title: "CAE Bulletin Issue: January 20, 2026", publisher: "The IIA", type: professional-body, url: "https://www.theiia.org/en/content/newsletter/cae-bulletin/cae-bulletin-issue-january-20-2026/", date: "2026-01-20", access: full, locator: "first item, RSM summary"}
    - {ref: GT-COMPLIAI-2024, title: "Grant Thornton taps Microsoft technology to help clients manage compliance and risk using generative AI", publisher: "Grant Thornton LLP", type: firm, url: "https://www.grantthornton.com/insights/press-releases/2024/february/grant-thornton-taps-microsoft-technology-to-help-clients-manage-compliance-and-risk-using-generative-ai", date: "2024-02-06", access: full, locator: "paragraphs 1-4; capabilities list"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from discourse 01 and 02 and practice 10. RSM's agent was in user acceptance testing per the source (piloting);
    in-production rests on Grant Thornton's 2024 deployment, which is older than the preferred window. Firm types: RSM US
    (top-10 US firm serving the middle market), Grant Thornton (large US firm). Independence: internal-audit outsourcing
    for a firm's own SEC audit clients is restricted (see advisory-risk-controls-06). The external-audit equivalents are
    assurance-controls-testing-02 and assurance-planning-risk-assessment-25.

- id: advisory-risk-controls-04
  title: "Agents prepare evidence requests, check submissions for completeness and chase follow-ups"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [coordination-scheduling, review-assurance]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Repeated, loosely worded information requests and long waits for data add friction for process owners and slow
    fieldwork. Auditors chase control owners by email and spreadsheet, wrong or incomplete evidence is found weeks
    later, and the follow-up trail goes cold.
  solution: >-
    In a co-sourced billing and collections audit for an unnamed client, Baker Tilly used Fieldguide's agents to prepare
    and organise information requests, link them to audit objectives and track status. Another agent reviews responses
    for completeness and alerts the business owner if more data is needed; approved agents then support defined testing
    steps where source data is structured. Vendors sell the same pattern: Diligent AuditAI (launched March 2026), Optro
    Agentic Stakeholder Management (announced 2026-10-14) and Fieldguide.
  outcomes:
    - lever: speed
      description: "Baker Tilly says AI reduced coordination and processing time and improved testing coverage on the engagement"
      figure: "none published"
      measures: "No quantity published; the article lists request turnaround, duplicate requests, cycle time and population coverage as measures to define, not results"
      provenance: self-reported
      source_ref: BAKERTILLY-AIIA-2026
    - lever: speed
      description: "Diligent says early adopters cut time on audit administration by about 70%, from roughly 120 hours of manual coordination to 35; customers are not named"
      figure: "about 70%; roughly 120 hours to 35"
      measures: "Time on audit administration and manual coordination per audit cycle among unnamed early adopters, per Diligent; method not stated"
      provenance: vendor-published
      source_ref: DILIGENT-AUDITAI-2026
  prerequisites:
    - "An engagement platform holding requests, documents, walkthroughs, risks, controls, population references, testing and sign-off together (BAKERTILLY-AIIA-2026)"
    - "Completeness and accuracy of populations confirmed before AI testing (BAKERTILLY-AIIA-2026)"
  risks_and_guardrails:
    - "The team confirms population completeness and accuracy, reviews AI results, inspects supporting records and decides whether exceptions are isolated or systemic (BAKERTILLY-AIIA-2026, client example)"
    - "Retain the approved procedure, source information, AI output, exceptions, review and sign-off (BAKERTILLY-AIIA-2026, closing lessons)"
    - "A vendor CEO's article says about one in five evidence requests come back wrong the first time, without citing a source (CPAPA-5Q-2026)"
  human_checkpoints:
    - "The auditor remains responsible for procedure, evidence, analysis and conclusion"
    - "Auditors stay in control of key decisions through structured workflows and approvals (Diligent)"
  role_evolution: >-
    Baker Tilly says freed time goes to business context, root cause and practical recommendations, and the engagement
    stays auditor-led (BAKERTILLY-AIIA-2026).
  evidence_grade: B
  sources:
    - {ref: BAKERTILLY-AIIA-2026, title: "Start with stakeholder value when using AI in internal audit", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/ai-in-internal-audit", date: "2026-09-08", access: full, locator: "section 'A client example: Billing and collections'"}
    - {ref: IIA-UPSKILL-2026, title: "Internal Audit Upskilling for Critical AI Capabilities", publisher: "The IIA", type: professional-body, url: "https://www.theiia.org/en/content/articles/global-best-practices/2026/internal-audit-upskilling-for-critical-ai-capabilities/", date: "2026-07-22", access: full, locator: "section 'Internal Audit and Agentic AI' (John Romano, Baker Tilly)"}
    - {ref: DILIGENT-AUDITAI-2026, title: "Diligent launches AuditAI to streamline internal audits", publisher: "CFOtech", type: press, url: "https://cfotech.news/story/diligent-launches-auditai-to-streamline-internal-audits", date: "2026-03-13", access: full, locator: "paragraphs 3-5"}
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Agentic Stakeholder Management paragraph"}
    - {ref: FIELDGUIDE-SIXWAYS-2026, title: "Six Ways Internal Audit Teams Are Putting AI to Work", publisher: "Fieldguide", type: vendor, url: "https://www.fieldguide.io/resource-articles/six-ways-internal-audit-teams-are-putting-ai-to-work", date: "2026", access: full, locator: "section on real-time evidence review"}
    - {ref: CPAPA-5Q-2026, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents", publisher: "CPA Practice Advisor (author: CEO of Bead AI, a vendor)", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/18/5-questions-to-ask-before-your-sox-team-adopts-ai-agents/188703/", date: "2026-08-18", access: full, locator: "article body"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from discourse 04 (Baker Tilly) and practice 08 (vendors). Firm types: Baker Tilly (large US accounting and
    advisory firm; US ranking not checked), Diligent, Optro and Fieldguide (vendors). Independence: co-sourced internal
    audit for a firm's own SEC audit clients is restricted (see advisory-risk-controls-06). The audit-side equivalent is
    assurance-controls-testing-03.

- id: advisory-risk-controls-05
  title: "In-house internal-audit teams hand SOX control-test execution to agents, with auditor review (Reddit, Klaviyo)"
  archetype: advisory
  module: risk-controls
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: delegate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    SOX testing is repetitive and getting heavier: match evidence to samples, check attributes, document the result.
    KPMG's 2025 SOX Survey excerpts report that the cost of maintaining SOX controls rose 45% between its 2023 and 2025
    surveys, average testing hours per control rose from 12 (FY2022) to 16 (FY2024), and 52% of internal-audit
    departments spent more than 40% of their hours on SOX in FY2024.
  solution: >-
    The audit team's GRC platform runs agentic testing on defined controls: the agent reads the evidence, tests each
    attribute and writes up the result with a citation trail, and the auditor reviews and signs off. Named users of
    Optro's Autonomous Testing are Reddit and Klaviyo (in-house teams, not advisory firms). Optro says the engine now
    extends beyond SOX to operational audit testing.
  outcomes:
    - lever: speed
      description: "Reddit's internal audit team reports automating 175 controls in its first three months and cutting testing time per control by about 60% on average"
      figure: "175 controls (more than 40% of SOX scope) in 3 months; 60% average reduction in testing time per control"
      measures: "Per the vendor release: controls automated, and their share of the team's SOX scope; average reduction in testing time per control. Baseline and measurement method not stated"
      provenance: vendor-published
      source_ref: OPTRO-AGENTS-2026
    - lever: capacity
      description: "Reddit has since expanded agentic testing to over 75% of its SOX controls and to other recurring testing programs"
      figure: "over 75% of SOX controls"
      measures: "Share of Reddit's SOX controls under agentic testing, per the vendor release; date of measurement not stated"
      provenance: vendor-published
      source_ref: OPTRO-AGENTS-2026
    - lever: quality
      description: "Klaviyo's VP of Internal Audit and Compliance says accuracy is non-negotiable and the audit trail shows how each conclusion was reached"
      figure: "none published"
      measures: "Quote only; no count or rate"
      provenance: vendor-published
      source_ref: OPTRO-AGENTS-2026
  prerequisites:
    - "SOX tests, results and documentation already held in one platform"
    - "Controls described with attributes and evidence rules precise enough for an agent to apply"
    - "Controls documented and evidence reachable by the tool; KPMG says continuous testing cannot happen without continuous evidence collection (KPMG-SOX2030-2026, POV 3)"
  risks_and_guardrails:
    - "Every figure comes from the vendor's release; the customers' own measurements are not published"
    - "In Optro's survey of 417 GRC, audit, risk and security leaders, 34% report acting on an inaccurate agent decision or output and 46% say employees spend more time reviewing or correcting AI output (OPTRO-AGENTICREPORT-2026, vendor survey)"
    - "KPMG lists black-box audit difficulty, rubber-stamp human review, model drift and prompt injection, including instructions hidden in evidence aimed at testing agents, as open challenges (KPMG-SOX2030-2026)"
    - "KPMG's April 2026 poll found AI in SOX, controls and internal-audit functions mostly at pilot stage (KPMG-FUTURESOX-2026, p. 5)"
  human_checkpoints:
    - "Auditor reviews and approves each test conclusion"
    - "Auditor reviews every exception and every conclusion that feeds a deficiency evaluation"
  role_evolution: >-
    Klaviyo says the team spends less time on manual work and more on judgment and foresight, and Optro says auditors
    get time back for judgment-based work (OPTRO-AGENTS-2026).
  evidence_grade: B
  sources:
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Autonomous Testing paragraph (Reddit); customer quotes (Klaviyo)"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "Introduction, '2025 SOX Survey excerpts'; POV 3; 'Challenges on the horizon'"}
    - {ref: OPTRO-AGENTICREPORT-2026, title: "One in Three Organizations Say They Have Acted on Wrong Decisions Made by AI Agents", publisher: "Optro", type: survey, url: "https://optro.ai/blog/one-in-three-organizations-say-they-have-acted-on-wrong-decisions-made-by-ai-agents-optro-research-finds", date: "2026-10-08", access: full, locator: "key findings"}
    - {ref: KPMG-FUTURESOX-2026, title: "Revolutionizing internal controls: Insights from an April 2026 KPMG Future of SOX webcast", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls.pdf", date: "2026-05-20", access: full, locator: "p. 5"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 01 and governance 04. The same release was read at optro.ai and as a CPA Practice Advisor
    reprint (governance used the ref OPTRO-CRX-2026); one ref is kept. Grade B, not A: the figures are the vendor's
    report, not a customer-published tracked metric. Ladder is delegate because the agent tests each control end to end
    and drafts the result for review, which matches the vocabulary's worked example; no source describes a design
    without a reviewer. These are client companies, not advisory firms: the entry tells an advisor what clients'
    in-house teams are doing. Optro appears to be AuditBoard's current brand. The same Reddit case is
    assurance-controls-testing-05; Microsoft's own two-agent ITGC change-management tester (850 hours and $185K a year,
    self-reported, method not stated; MSFT-SOXAGENT-2026) is assurance-controls-testing-06.

- id: advisory-risk-controls-06
  title: "Advisory firms run agentic control testing inside co-sourced and outsourced internal-audit and SOX engagements"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, document-production]
  pattern: document-to-decision
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    Co-sourced and outsourced SOX testing is sold on testing hours. Evidence arrives in mixed formats (Excel workbooks
    with embedded files, screenshots, PDFs, logs), workpapers must stand up to the external auditor, and clients want
    shorter cycles.
  solution: >-
    Firms run agents at defined steps of their own methodology, with professional review before anything enters the
    file. RSM Beacon (with Andera; announced 2026-08-28 and described as live and in use by RSM professionals) takes the
    control description, attributes and evidence, allocates evidence to samples, tests each attribute and writes an
    annotated workpaper with a reasoning log; ambiguous items go to a human as open items, and auditors can queue
    several controls in the background, then review. Riveron says it applies agents in co-sourced and outsourced
    internal-audit engagements. Protiviti announced a Fieldguide alliance (2026-03-03) covering evidence request and
    review, sample selection, control evaluation and standard workpapers. PwC's Dynamic Testing is an agentic workflow
    with review checkpoints.
  outcomes:
    - lever: speed
      description: "PwC says automated test-procedure generation, evidence parsing and annotation can reduce effort by 30-40% and shrink turnarounds from weeks to days; no sample, client or date given"
      figure: "30-40% effort reduction"
      measures: "Controls-testing effort reduction as stated by PwC on its product page; denominator and baseline not stated"
      provenance: vendor-published
      source_ref: PWC-DYNTEST-2026
    - lever: quality
      description: "Riveron says it judges AI-enabled programs by shorter testing cycles, faster escalation to management, easier-to-review workpapers and more capacity for remediation follow-through, not hours saved; no figures"
      figure: "none published"
      measures: "Indicators listed, not measured results"
      provenance: self-reported
      source_ref: RIVERON-MONDAQ-2026
  prerequisites:
    - "Firm testing methodology codified well enough to configure agents (RSM uses its own proprietary testing methodology)"
    - "Control metadata, test attributes, evidence requirements, sampling logic and exception rules defined more precisely than many programs have historically (RIVERON-MONDAQ-2026)"
    - "Client agreement on data handling; RSM says Beacon client data is kept in a segregated environment and not used to train Andera's commercial product (ACCTODAY-RSMBEACON-2026)"
  risks_and_guardrails:
    - "Missing documentation may mean a control was performed informally, not that it failed; treat 'missing support' and 'true exception' as separate outcomes (RIVERON-MONDAQ-2026)"
    - "AI can flag false exceptions where the business relies on undocumented practice that people accept intuitively (GT-INFERENCEGAP-2026)"
    - "General-purpose language models used in isolation do not meet audit grade, per Riveron (RIVERON-MONDAQ-2026)"
    - "No firm publishes parallel-run, override or error figures"
    - "Independence: SEC Rule 2-01(c)(4)(v) bars internal-audit outsourcing relating to internal accounting controls, financial systems or financial statements for an SEC audit client unless the results will not be subject to audit procedures (SEC-RULE2-01-2026)"
  human_checkpoints:
    - "Riveron: every test result reviewed by experienced professionals before it becomes part of the workpaper"
    - "RSM Beacon: the AI 'does not make judgment calls'; ambiguous items are open items for a human, and reviewers see the reasoning log beside the evidence"
    - "PwC: users review and edit AI-generated test instructions before execution"
  role_evolution: >-
    Riveron says teams focus more on review, challenge, exception analysis and stakeholder dialogue
    (RIVERON-MONDAQ-2026). At RSM auditors move from preparing workpapers to queuing controls and reviewing completed
    ones (ACCTODAY-RSMBEACON-2026). Protiviti says the aim is to enhance, not replace, human judgment
    (PROTIVITI-FIELDGUIDE-2026). None gives staffing numbers.
  evidence_grade: B
  sources:
    - {ref: ACCTODAY-RSMBEACON-2026, title: "RSM launches AI-guided internal audit platform 'Beacon' with Andera", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/rsm-launches-ai-guided-internal-audit-platform-beacon-with-andera", date: "2026-08-28", access: full, locator: "paragraphs 2-5 and closing paragraph"}
    - {ref: RIVERON-MONDAQ-2026, title: "AI In Internal Audit And SOX: Applying Methods That Work", publisher: "Riveron (via Mondaq)", type: firm, url: "https://www.mondaq.com/unitedstates/audit/1805956/ai-in-internal-audit-and-sox-applying-methods-that-work", date: "2026-06-24", access: full, locator: "paragraphs on co-sourced and outsourced engagements and 'Every test result is reviewed'"}
    - {ref: PROTIVITI-FIELDGUIDE-2026, title: "Protiviti Announces Strategic Alliance with Fieldguide to Accelerate AI-Enabled Internal Audit, SOX, and Controls Transformation", publisher: "Protiviti (PR Newswire via finviz)", type: firm, url: "https://finviz.com/news/328216/protiviti-announces-strategic-alliance-with-fieldguide-to-accelerate-ai-enabled-internal-audit-sox-and-controls-transformation", date: "2026-03-03", access: full, locator: "paragraphs 2-4"}
    - {ref: PWC-DYNTEST-2026, title: "What if controls testing could be done in a fraction of the time, without compromising audit rigor? (Dynamic Testing)", publisher: "PwC US", type: firm, url: "https://www.pwc.com/us/en/tech-effect/ai-analytics/dynamic-controls-testing.html", date: "2026", access: full, locator: "benefits list ('reducing effort by 30-40%')"}
    - {ref: GT-INFERENCEGAP-2026, title: "The unexpected obstacle to AI-enabled SOX", publisher: "Grant Thornton", type: firm, url: "https://www.grantthornton.com/insights/articles/advisory/2026/the-unexpected-obstacle-to-ai-enabled-sox-and-internal-audit", date: "2026-08-12", access: full, locator: "article body"}
    - {ref: SEC-RULE2-01-2026, title: "17 CFR 210.2-01 Qualifications of accountants", publisher: "US SEC (via eCFR)", type: regulator, url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-17?part=210&section=210.2-01", date: "2026-10-20", access: full, locator: "(c)(4)(v) and (vi); date is the access date of the current text"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 03 and discourse 03. Practice cited the Beacon article as RSM-BEACON-2026; one ref is kept.
    Firm types: Riveron (consulting firm owned by affiliates of Kohlberg & Company, a PE-backed platform), RSM US (top-10
    US firm serving the middle market), Protiviti (global consulting firm, a Robert Half subsidiary), PwC (Big Four).
    The PwC page is undated ('2026' is a footer bound). Ladder is delegate following the vocabulary's worked example
    (agent tests key controls end to end and drafts the workpaper); the research files had graded it augment. RSM says it
    is evaluating Beacon for SOC, NIST, PCI and operational audits; that extension is not live. The same pattern from the
    audit side is assurance-controls-testing-20.

- id: advisory-risk-controls-07
  title: "Risk-advisory teams test 100% of a control population with document extraction and matching tools instead of a sample"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, data-reporting]
  pattern: full-population-testing
  ladder: augment
  change_scope: process
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Procedures such as vendor bank-detail changes, invoice-to-contract tie-outs and deposit reconciliations are tested
    on a sample (for example 1 of 25). Manual review misses a digit, and tying hundreds of documents takes hours.
  solution: >-
    Armanino's risk-advisory team (its Data Automation and Transformation staff) used DataSnipper's DocuMine, Document
    Matching and Excel Agents on live client engagements. The tools extract names, account numbers and contract terms,
    match them to supporting documents and reconcile deposits; the auditor reviews each suggested match. KPMG tells SOX
    teams to design controls to withstand full-population analytics by external auditors, and Gartner says more mature
    audit teams move from samples to full populations.
  outcomes:
    - lever: quality
      description: "A manager said manual review would miss a digit across dozens of account numbers and the tool let the team test 100% of the changes"
      figure: "100% of vendor bank and payment-detail changes tested (versus a 1-of-25 sample)"
      measures: "Share of the population of vendor bank and payment-method changes tested, per the Armanino manager quoted by the vendor; engagement and period not identified"
      provenance: vendor-published
      source_ref: DATASNIPPER-ARMANINO-2026
    - lever: capacity
      description: "A manager estimated about 25-plus hours saved on one deposit reconciliation"
      figure: "about 25+ hours (one reconciliation; estimate)"
      measures: "Hours saved on a bank-deposit-to-report reconciliation, an estimate by the manager quoted ('I estimate')"
      provenance: vendor-published
      source_ref: DATASNIPPER-ARMANINO-2026
  prerequisites:
    - "Source documents in files the tool can read, and a procedure with clear match rules"
    - "Capacity to work the extra exceptions that full coverage surfaces (CPAPA-FULLPOP-2026)"
  risks_and_guardrails:
    - "Full-population coverage surfaces more exceptions, so follow-up capacity must rise (CPAPA-FULLPOP-2026)"
    - "Marketing full testing must not imply certainty; an audit gives reasonable, not absolute, assurance (CPAPA-FULLPOP-2026)"
    - "Full coverage does not remove the need to check each flagged mismatch"
  human_checkpoints:
    - "Auditor reviews each suggested match or deposit combination before it stands; the tool shows the source for every answer and the auditor keeps sign-off"
  role_evolution: >-
    The article says staff move from flipping through PDFs to the items that do not match; the quoted staff sit in a
    Data Automation and Transformation group inside risk advisory (DATASNIPPER-ARMANINO-2026).
  evidence_grade: B
  sources:
    - {ref: DATASNIPPER-ARMANINO-2026, title: "AI and Auditing: 3 SOX Tests", publisher: "DataSnipper", type: vendor, url: "https://www.datasnipper.com/resources/three-use-cases-for-ai-in-internal-audit", date: "2026-08-12", access: full, locator: "three use-case sections; quotes from Claire Koch and Amanda Finley"}
    - {ref: CPAPA-FULLPOP-2026, title: "Testing Every Transaction Changes the Audit - Here's What Firms Should Know Before They Sell It", publisher: "CPA Practice Advisor (author: Tunde Adewole, Ledgerline)", type: press, url: "https://www.cpapracticeadvisor.com/2026/10/15/testing-every-transaction-changes-the-audit-heres-what-firms-should-know-before-they-sell-it/191713/", date: "2026-10-15", access: full, locator: "paragraphs on exceptions and the expectation gap"}
    - {ref: KPMG-REVCONTROLS-2026, title: "Revolutionizing internal controls: The impact of technology and automation (April 2026 Future of SOX webcast)", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls-new.pdf", date: "2026-05", access: full, locator: "slide 12 ('Design for 100% Population Scrutiny')"}
    - {ref: ACCTIMES-GARTNER-2026, title: "Audit teams' AI use common but most lack strategy", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/audit-teams-ai-use-common-but-most-lack-strategy", date: "2026-08-16", access: full, locator: "paragraph beginning 'He said more mature audit teams'"}
  last_reviewed: "2026-10-20"
  notes: >-
    From practice 04, with the full-population points of discourse 08 and governance 04. Grade B, not A: the article is on
    the vendor's site and the hours figure is an estimate. Firm type: Armanino is a mid-market accounting and advisory
    firm. Independence was not stated in the article. KPMG-REVCONTROLS-2026 is a revised copy ('-new' file) of the
    webcast summary cited elsewhere as KPMG-FUTURESOX-2026; both are kept because their pagination differs. The
    audit-side equivalent is assurance-controls-testing-08.

- id: advisory-risk-controls-08
  title: "Year-round control testing replaces a single point-in-time SOX test cycle"
  archetype: advisory
  module: risk-controls
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Testing bundled into one point in time finds issues late, and fixes are rushed near year end. KPMG says periodic
    assessments, manual evidence collection and sample-based testing are reaching their limit.
  solution: >-
    Klaviyo's VP of Internal Audit and Compliance says that with agent-run tests the team no longer bundles testing into
    a single point in time and now tests throughout the year, catching issues earlier and working with control owners
    to fix them sooner. KPMG argues continuous testing needs continuous evidence collection, and that automating evidence
    collection may give a more immediate return than automating tests.
  outcomes:
    - lever: quality
      description: "Klaviyo says it catches issues earlier and works with control owners to fix them sooner; no metric given"
      figure: "none published"
      measures: "Quote about testing cadence in a vendor release"
      provenance: vendor-published
      source_ref: OPTRO-AGENTS-2026
  prerequisites:
    - "Control evidence embedded in process workflows or standard repositories that tools can read through the year, not only at period end (KPMG-SOX2030-2026, POV 3)"
    - "Control owners willing to respond to issues sooner"
  risks_and_guardrails:
    - "Keep the line between first-line monitoring and third-line testing clear: the first line owns monitoring and internal audit tests the monitoring (KPMG-SOX2030-2026, POV 5)"
    - "KPMG's SOX leader says external auditors are moving to ingesting large data sets and away from sampling, so management must be ready for that level of scrutiny (KPMG-FUTURESOX-2026, p. 7)"
  human_checkpoints:
    - "Control owners work exceptions; auditors review exceptions and the reliability of the monitoring"
  role_evolution: >-
    KPMG expects the ICFR function to move from a point-in-time opinion on prior-year control effectiveness to a living
    view of control health, with SOX practitioners advising on control redesign and AI governance (KPMG-SOX2030-2026).
  evidence_grade: B
  sources:
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Klaviyo quote (Carmen Lam)"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "Introduction; POV 3 'Continuous, real-time assurance' and 'Automating evidence collection'; POV 5"}
    - {ref: KPMG-FUTURESOX-2026, title: "Revolutionizing internal controls: Insights from an April 2026 KPMG Future of SOX webcast", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls.pdf", date: "2026-05-20", access: full, locator: "p. 7, Sue King quote"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 05 and governance 09. The named deployment is one quote in a vendor release. Kept separate from
    advisory-risk-controls-05 because the change is the cadence of the whole testing process, not the execution of one
    test. Firm types: in-house team (Klaviyo) on a vendor platform; KPMG (Big Four). Independence: when a firm that
    audits an SEC client also tests that client's controls as internal-audit outsourcing, Rule 2-01(c)(4)(v) applies
    (see advisory-risk-controls-06). The audit-side equivalent is assurance-controls-testing-09.

- id: advisory-risk-controls-09
  title: "First-line continuous controls monitoring with human-approved auto-clear rules, heading toward embedded and self-healing controls (partly an idea)"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, data-reporting, software-systems]
  pattern: monitor-diagnose-act
  ladder: automate
  change_scope: process
  runtime_class: background-agent
  maturity: emerging
  problem: >-
    Periodic, sample-based testing leaves blind spots that surface at year end or during the external audit. Detective
    controls such as reconciliations and exception reports find issues after the fact, and control health is assessed
    once a year.
  solution: >-
    Grant Thornton describes AI that monitors a growing share of transactions continuously, with anomaly detection and
    alerts, multi-agent systems orchestrating control-testing workflows, and human-approved control logic that sets when
    AI can auto-clear an item and when it must route to review. KPMG's 2030 point of view describes preventive, embedded
    and increasingly self-healing controls that identify and sometimes correct configuration problems, with first-line
    owners running continuous monitoring and internal audit testing the monitoring. Havertys' VP of Internal Audit
    expects controls could one day be tested at each occurrence as documentation is approved.
  outcomes:
    - lever: risk
      description: "About 28% of KPMG webcast respondents say their main AI use in SOX and internal audit is analysis of large data sets; no outcome of continuous monitoring is published"
      figure: "about 28%"
      measures: "Share of about 3,900 audit and risk leaders in KPMG's April 2026 Future of SOX webcast poll naming analysis of large data sets as their primary AI use; self-selected audience"
      provenance: vendor-published
      source_ref: KPMG-REVCONTROLS-2026
  prerequisites:
    - "Mappings from risks to controls to data sources, and precision thresholds tied to true anomalies (GT-SOX-2026)"
    - "An integrated data architecture and automated evidence collection (KPMG-REVCONTROLS-2026; KPMG-SOX2030-2026)"
    - "A clear split between first-line monitoring and third-line testing (KPMG-SOX2030-2026)"
  risks_and_guardrails:
    - "Grant Thornton says external auditors and regulators have not given blanket approval for AI-driven SOX compliance (GT-SOX-2026, introduction)"
    - "Segregation of duties across AI-assisted workflows (GT-SOX-2026, 'AI as a co-pilot')"
    - "KPMG lists black-box audit difficulty, rubber-stamp human review, model drift, bias and prompt injection as open challenges (KPMG-SOX2030-2026)"
    - "Independence: SEC Rule 2-01(c)(4)(vi) lists management functions, including ongoing monitoring functions, among non-audit services that impair independence for an SEC audit client (SEC-RULE2-01-2026)"
  human_checkpoints:
    - "Humans approve the auto-clear logic before it runs"
    - "Control owners triage exceptions; internal audit tests the monitoring; reviewers sign off"
  role_evolution: >-
    Grant Thornton expects roles to move toward analysis, control design and stakeholder engagement while AI handles
    repetitive testing and documentation (GT-SOX-2026). KPMG says the SOX practitioner moves from reporting whether a
    control worked to advising on how to redesign it (KPMG-SOX2030-2026).
  evidence_grade: C
  sources:
    - {ref: GT-SOX-2026, title: "The power of AI in efficient SOX compliance", publisher: "Grant Thornton", type: firm, url: "https://www.grantthornton.com/insights/articles/advisory/2026/the-power-of-ai-in-efficient-sox-compliance", date: "2026-07-21", access: full, locator: "sections 'Continuous controls, continuous assurance', 'AI as a co-pilot, not an autopilot' and 'Upskilling'"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "POV 2 'Embedded and autonomous controls'; 'Challenges on the horizon'"}
    - {ref: KPMG-REVCONTROLS-2026, title: "Revolutionizing internal controls: The impact of technology and automation (April 2026 Future of SOX webcast)", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls-new.pdf", date: "2026-05", access: full, locator: "slides 2 and 12"}
    - {ref: OPTRO-HAVERTYS-2026, title: "Havertys Brings Agentic AI Into Internal Audit", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/havertys-furniture-success-story", date: "2026-09-04", access: full, locator: "paragraph beginning 'Beyond that plan, Stephanouk sees a bigger future'"}
    - {ref: SEC-RULE2-01-2026, title: "17 CFR 210.2-01 Qualifications of accountants", publisher: "US SEC (via eCFR)", type: regulator, url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-17?part=210&section=210.2-01", date: "2026-10-20", access: full, locator: "(c)(4)(vi); date is the access date"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from discourse 08 (continuous monitoring, grade C) and practice 18 (embedded, self-healing controls, an idea).
    The self-healing and test-at-each-occurrence parts are an idea with no deployment found. Grade C: firm advocacy
    pieces and a firm poll, no named deployment. The only automate-level process entry in this module. Firm types: Grant
    Thornton Advisors (PE-backed platform; Grant Thornton LLP holds the attest practice), KPMG (Big Four).

- id: advisory-risk-controls-10
  title: "AI pre-review and challenge of workpapers, audit scope and draft findings before human sign-off"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Manager review of workpapers is slow and inconsistent, and scope, risk-control mapping and draft findings are often
    reviewed late, so gaps in risk themes or unsupported findings can reach the client.
  solution: >-
    FJ Management's head of internal audit says Optro lets the team analyse workpapers automatically, run calibrated
    reviews and log evidence inside live audit workflows, keeping an auditable human-in-the-loop standard. Baker Tilly
    uses approved custom GPTs as structured challenge tools: review a proposed scope for missing risk themes, question
    whether a risk-control mapping is complete, compare planned procedures with objectives, and test whether a draft
    finding is supported by the work performed.
  outcomes:
    - lever: capacity
      description: "FJ Management's head of internal audit says the tool has changed what the team can get through; no figure"
      figure: "none published"
      measures: "Quote in a vendor release"
      provenance: vendor-published
      source_ref: OPTRO-AGENTS-2026
    - lever: quality
      description: "Baker Tilly publishes no measure; it says the output is a challenge record, not audit evidence, and does not set risk ratings"
      figure: "none published"
      measures: "No error, gap-found or override measure published"
      provenance: self-reported
      source_ref: BAKERTILLY-AIIA-2026
  prerequisites:
    - "Workpapers held as data in a structured, permissioned audit platform (OPTRO-AGENTS-2026)"
    - "Approved tools and data sources only, proprietary prompts and an audit methodology to challenge against (BAKERTILLY-AIIA-2026)"
  risks_and_guardrails:
    - "AI output does not become audit evidence, determine a risk rating or replace reviewer judgment; generated content is validated against source evidence and unsupported output is corrected or rejected (BAKERTILLY-AIIA-2026)"
    - "PCAOB staff heard from firms that supervisors are expected to apply the same diligence to work done with GenAI as to other work (PCAOB-GENAI-2024, pp. 4-5)"
    - "The 'calibrated' review method is not described, and vendor claims that agents are logged and audit-ready were not independently tested (OPTRO-AGENTS-2026)"
  human_checkpoints:
    - "The assigned auditor owns the procedure, evidence and conclusion; a human reviewer signs off every workpaper"
  role_evolution: >-
    Reviewers get a structured second look before sign-off, and accountability stays with the named auditor
    (BAKERTILLY-AIIA-2026). In Gartner's poll only 12% of respondents use AI for quality assurance reviews
    (ACCTIMES-GARTNER-2026).
  evidence_grade: B
  sources:
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Matt Sewell (FJ Management) quote"}
    - {ref: BAKERTILLY-AIIA-2026, title: "Start with stakeholder value when using AI in internal audit", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/ai-in-internal-audit", date: "2026-09-08", access: full, locator: "section beginning 'At Baker Tilly, Fieldguide ...' and 'We also use approved custom GPTs'; section on controls around AI-supported work"}
    - {ref: PCAOB-GENAI-2024, title: "Spotlight: Staff Update on Outreach Activities Related to the Integration of Generative AI in Audits and Financial Reporting", publisher: "PCAOB staff", type: regulator, url: "https://pcaobus.org/documents/generative-ai-spotlight.pdf", date: "2024-07", access: full, locator: "pp. 4-5, 'Supervision and Review of GenAI'"}
    - {ref: ACCTIMES-GARTNER-2026, title: "Audit teams' AI use common but most lack strategy", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/audit-teams-ai-use-common-but-most-lack-strategy", date: "2026-08-16", access: full, locator: "paragraph on use cases (12% use AI for quality assurance reviews)"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 07, governance 08 and discourse 05. Thin: one quote from an in-house team (FJ Management) and
    one firm's description of its own practice (Baker Tilly); ladder spans assist (challenge GPTs) and augment
    (workpaper pre-review). The PCAOB spotlight is older than the preferred window and reflects outreach mainly to larger
    firms. Related entries: assurance-controls-testing-10 (AI secondary review of control workpapers) and
    professional-services-quality-review-13 (independent machine cross-check before human review).

- id: advisory-risk-controls-11
  title: "AI drafts audit observations: finding detail, root cause, impact and recommendation"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [document-production]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Writing structured observation language (finding detail, root cause, impact, recommendation) after testing is slow
    and varies by author.
  solution: >-
    RSM describes an agent that drafts structured observation language from documented test results; auditors then
    follow up with auditees to validate findings and root cause before the report is final. Gartner's poll shows
    drafting audit issues, ratings or reports is among the most common genAI uses in audit.
  outcomes:
    - lever: speed
      description: "60% of polled audit professionals use genAI to draft audit issues, ratings or reports"
      figure: "60%"
      measures: "Share of 743 audit professionals in a Gartner webinar poll reporting genAI use to draft audit issues, ratings or reports; self-selected audience"
      provenance: independent
      source_ref: ACCTIMES-GARTNER-2026
  prerequisites:
    - "Detailed test data; RSM says output quality depends on it (RSM-AGENTICIA-2025)"
  risks_and_guardrails:
    - "The auditor follows up with auditees to validate findings and root cause before finalising (RSM-AGENTICIA-2025)"
    - "Lack of clarity on expected AI-tool use is the most common obstacle (48%) in Gartner's poll (HELPNET-GARTNER-2026)"
  human_checkpoints:
    - "Auditor validates each draft finding, its rating and its root cause with the auditee"
  role_evolution: >-
    Auditors shift from writing first drafts to validating facts and root cause with auditees (RSM-AGENTICIA-2025).
  evidence_grade: B
  sources:
    - {ref: RSM-AGENTICIA-2025, title: "Reimagine internal audit with agentic AI to drive value", publisher: "RSM US", type: firm, url: "https://rsmus.com/insights/services/digital-transformation/agentic-ai-for-internal-audit.html", date: "2025-12-22", access: full, locator: "section 'Generating reportable observation language'"}
    - {ref: ACCTIMES-GARTNER-2026, title: "Audit teams' AI use common but most lack strategy", publisher: "Accounting Times", type: press, url: "https://www.accountingtimes.com.au/profession/audit-teams-ai-use-common-but-most-lack-strategy", date: "2026-08-16", access: full, locator: "paragraph 'The poll found that generative AI use cases ...'"}
    - {ref: HELPNET-GARTNER-2026, title: "Most chief audit executives can't tell you what AI is worth yet", publisher: "Help Net Security", type: press, url: "https://www.helpnetsecurity.com/2026/09/15/gartner-ai-in-internal-audit/", date: "2026-09-15", access: full, locator: "section 'The barriers are people and process'"}
  last_reviewed: "2026-10-20"
  notes: >-
    From discourse 06. Firm type: RSM US (top-10 US firm serving the middle market). The Gartner figures cover internal
    audit teams in general, not outsourced providers. Gartner's own releases were blocked; the figures come from press
    coverage, and the two articles state different bases for the 38% strategy figure (743-person poll versus 161 CAEs).

- id: advisory-risk-controls-12
  title: "Reading vendors' SOC reports and assessing vendor AI risk for a client, with agent support announced"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, research-synthesis]
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Clients obtain AI through vendors and subcontractors, and internal audit must assess vendor AI governance, SOC
    reports and downstream dependencies. Most agentic close tools are subservice organisations in SOC terms, and
    existing SOC 1 and SOC 2 reports may say little about model behaviour, retraining or prompt controls. The IIA's
    Third-Party Topical Requirement took effect on 2026-09-15.
  solution: >-
    KPMG lists integrated third-party risk and SOC report review as an agent type in its SOX framework, with agents
    extracting control descriptions and testing results. Optro announced an agentic third-party risk workflow in which
    agents perform onboarding and due-diligence tasks while teams set policy and judge outcomes. The advisor or internal
    auditor reads each vendor's SOC report for what it covers about AI components and maps gaps to contract terms,
    complementary user entity controls (controls the customer must run) and the client's own validation testing. The
    AICPA released technical Q&A section 9561 on the effect of a service organisation's AI use on SOC 1 and SOC 2
    examinations.
  outcomes:
    - lever: risk
      description: "40% of surveyed audit functions evaluate vendor AI governance (new in 2026), 50% review SOC reports and 19% evaluate Nth-party risk"
      figure: "40%; 50%; 19%"
      measures: "Shares of 222 US audit leaders in Sikich's 2026 survey (fieldwork 2026-07-24 to 2026-08-19)"
      provenance: vendor-published
      source_ref: SIKICH-IAPRIORITIES-2026
  prerequisites:
    - "The client's current vendor SOC reports, contract rights and a vendor inventory (CPAPA-AGENTSCLOSE-2026)"
    - "Vendor documents in readable formats for agent extraction"
  risks_and_guardrails:
    - "Where reports are silent on AI, cover the gap with contract terms, complementary user entity controls and the client's own validation (CPAPA-AGENTSCLOSE-2026, control 4)"
    - "Source conflict, now resolved: the CPA Practice Advisor piece (2026-08-13) said the AICPA had not published SOC guidance on AI; Deloitte reported TQA 9561 by 2026-09-21 and the Journal of Accountancy says the guidance was issued earlier in 2026 (DART-TQA9561-2026; AICPA-AUDITAID-2026)"
    - "A Cloud Security Alliance note, AI-assisted and not reviewed by the CSA, says SOC 2 auditors improvise AI evidence requests and no common baseline exists (CSA-SOC2AI-2026)"
  human_checkpoints:
    - "Auditor judgment on reliance on vendor reports; advisor and client owner sign off the gap mapping"
    - "Teams configure policy and evaluate outcomes (Optro)"
  role_evolution: >-
    Third-party risk work widens from periodic vendor audits to AI governance and downstream dependencies
    (SIKICH-IAPRIORITIES-2026, p. 14).
  evidence_grade: C
  sources:
    - {ref: KPMG-AGENTICSOX-2025, title: "Seize the future: The agentic shift in SOX compliance", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2025/seize-the-future-the-agentic-shift-in-sox-compliance.html", date: "2025-07", access: full, locator: "list of agent use cases ('Integrated third-party risk and SOC report review')"}
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Agentic TPRM paragraph"}
    - {ref: SIKICH-IAPRIORITIES-2026, title: "2026 Internal audit priorities annual survey", publisher: "Sikich", type: survey, url: "https://go.sikich.com/rs/345-ICF-683/images/Sikich%202026%20Internal%20Audit%20Priorities%20Survey%20Report.pdf?version=0", date: "2026-10", access: full, locator: "p. 14 'Third-party risk is absorbing new technology risks'"}
    - {ref: CPAPA-AGENTSCLOSE-2026, title: "Before You Let the Agents Run the Close: Five Controls to Put in Writing First", publisher: "CPA Practice Advisor (author: Anthony L. Fulmore Sr., Texas A&M University Central Texas)", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/13/before-you-let-the-agents-run-the-close-five-controls-to-put-in-writing-first/", date: "2026-08-13", access: full, locator: "control 4, 'Third-party assurance, read closely'"}
    - {ref: DART-TQA9561-2026, title: "AICPA Releases TQAs on a Service Organization's Use of AI", publisher: "Deloitte Accounting Research Tool (DART)", type: firm, url: "https://dart.deloitte.com/USDART/home/news/all-news/2026/sep/aicpa-releases-tqas-service-organization-use-ai", date: "2026-09-21", access: full, locator: "opening paragraph"}
    - {ref: AICPA-AUDITAID-2026, title: "AI and the audit: AICPA publishes practice aid to assist auditors", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/oct/ai-and-the-audit-aicpa-publishes-practice-aid-to-assist-auditors/", date: "2026-10-13", access: full, locator: "paragraph beginning 'In addition to the practice aid ...'"}
    - {ref: CSA-SOC2AI-2026, title: "The SOC 2 AI Gap: Auditors Improvise Where AICPA Has Not Acted", publisher: "Cloud Security Alliance (CSAI Foundation)", type: community, url: "https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/08/CSA_research_note_soc2_ai_controls_gap_20260830-csa-styled.pdf", date: "2026-08-30", access: full, locator: "Key Takeaways; Background, pp. 2-3"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 11, discourse 12 and governance 11. Grade C: agent support is a firm framework and an announced
    product; prevalence comes from a vendor-run survey. The TQA text itself was not read (behind AICPA login). Reading
    others' SOC reports is user-entity work and stays here; issuing SOC reports is assurance
    (assurance-controls-testing-13 covers the audit-side reading of SOC reports; assurance-assurance-over-ai-07 covers
    evidence over vendor AI). Firm types: KPMG (Big Four), Optro (vendor), Sikich (mid-market firm as survey sponsor).

- id: advisory-risk-controls-13
  title: "Mid-market firms move internal-audit, ISO, HITRUST and PCI engagements onto one agentic platform with firm-built agents"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling, document-production]
  pattern: end-to-end-case-agent
  ladder: augment
  change_scope: process
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Risk-advisory engagements run on email, spreadsheets and bespoke tools, with client requests chased by hand and
    methodology applied inconsistently. Firms want one methodology and one evidence trail across audit, internal audit
    and SOC work, and face a capacity squeeze as the CPA pipeline thins.
  solution: >-
    Aprio standardised SOC, ISO, HITRUST and PCI work on Fieldguide in its Risk Advisory Services practice from December
    2025 (after a PCI pilot in March 2023), extended into financial audit in May 2026 and announced agent co-development
    on 2026-08-05, with its own professionals building and refining the agents. Cherry Bekaert announced on 2026-06-03
    that it would centralise planning, testing, review and reporting for Financial Audit, Internal Audit and SOC on the
    same platform, building on an existing deployment in its Risk and Cybersecurity practice. Baker Tilly runs internal
    audit delivery on it. Only the internal-audit and non-attest risk-advisory portion belongs here.
  outcomes:
    - lever: capacity
      description: "No measured result published for the advisory work; the firms describe intended benefits (traceability, consistent methodology, more time with clients)"
      figure: "none published"
      measures: "No hours, cost or quality measure published by Aprio, Cherry Bekaert or Baker Tilly"
      provenance: self-reported
      source_ref: CB-FIELDGUIDE-2026
  prerequisites:
    - "Firm methodology configured into the platform; Aprio says its own methodology shapes how each agent is designed (APRIO-FIELDGUIDE-2026)"
    - "Open APIs to connect the platform to the firm's other systems (CB-FIELDGUIDE-2026)"
    - "Vendor governance evidence; Cherry Bekaert's release says Fieldguide claims AIUC-1 certification and ISO 42001 (vendor claim, not verified)"
  risks_and_guardrails:
    - "Vendor concentration: all named firms use one vendor, and the vendor's CEO quotes drive the announcements"
    - "Aprio states every workflow is built to comply with AICPA, PCAOB and GAAS standards with human oversight at every stage (firm statement, not tested) (APRIO-FIELDGUIDE-2026)"
    - "The UK FRC's guidance asks firms to certify an AI tool per use case, test it, monitor it and recertify after material changes; it is aimed at audit firms and is a model here, not a binding US rule (FRC-GENAIGUIDE-2026, pp. 32-33)"
  human_checkpoints:
    - "Human oversight at each stage of the engagement lifecycle (Cherry Bekaert 'Field Agents with full human oversight'; Aprio)"
  role_evolution: >-
    Aprio says professionals spend more time interpreting results and advising as AI handles preparation, data
    validation and documentation (APRIO-FIELDGUIDE-2026). Cherry Bekaert describes more collaboration across audit and
    advisory teams; Fieldguide's CEO links the shift to a CPA pipeline at a 17-year low (vendor statement;
    CB-FIELDGUIDE-2026).
  evidence_grade: B
  sources:
    - {ref: APRIO-FIELDGUIDE-2026, title: "Aprio and Fieldguide Co-Build the Future of Audit with Agentic AI", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/?p=188025", date: "2026-08-05", access: full, locator: "paragraphs 1-3 and final timeline paragraph"}
    - {ref: CB-FIELDGUIDE-2026, title: "Cherry Bekaert Selects Fieldguide as Strategic AI Partner to Modernize Audit and Advisory Delivery", publisher: "Cherry Bekaert", type: firm, url: "https://www.cbh.com/newsroom/cherry-bekaert-expands-ai-audit-with-fieldguide/", date: "2026-06-03", access: full, locator: "paragraphs 1-4"}
    - {ref: BAKERTILLY-AIIA-2026, title: "Start with stakeholder value when using AI in internal audit", publisher: "Baker Tilly", type: firm, url: "https://www.bakertilly.com/insights/ai-in-internal-audit", date: "2026-09-08", access: full, locator: "paragraph beginning 'At Baker Tilly, Fieldguide ...'"}
    - {ref: FIELDGUIDE-SERIESC-2026, title: "Fieldguide Raises $75M Series C Round to Boost Audit and Advisory Firms' Agentic AI Capabilities", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/02/02/fieldguide-raises-75m-series-c-round-to-boost-audit-and-advisory-firms-agentic-ai-capabilities/177323", date: "2026-02-03", access: full, locator: "paragraphs on the capacity shortfall and customers"}
    - {ref: FRC-GENAIGUIDE-2026, title: "Generative and Agentic AI Guidance: Risks, mitigations and illustrative examples", publisher: "UK Financial Reporting Council", type: regulator, url: "https://www.frc.org.uk/documents/9256/Generative_and_Agentic_AI_Guidance_crosPeBU.pdf", date: "2026-03", access: full, locator: "pp. 32-33"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 16, discourse 18 and governance 05. Discourse rated it delegate; augment is used because every
    source stresses human oversight at each stage and no agent is described as owning an engagement outcome. Firm types:
    Cherry Bekaert (top-20, self-described) and Aprio (20th-largest US advisory and accounting firm per its release),
    Baker Tilly (large US firm), all mid-market firms with attest practices. The SOC and financial-audit portions, and Aprio's ISO/IEC 42001 certification accreditation
    (announced 2026-07-30), are assurance work. Fieldguide's 'half of the top 100 firms' figure is a single-source vendor
    claim. Independence: internal-audit outsourcing to the firms' own SEC audit clients is restricted (see
    advisory-risk-controls-06).

- id: advisory-risk-controls-14
  title: "A company replaces outsourced SOX testers with agents, starting with IT controls (Havertys)"
  archetype: advisory
  module: risk-controls
  function: risk-compliance-legal
  work_types: [review-assurance]
  pattern: document-to-decision
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: piloting
  problem: >-
    Havertys paid outside testers to run IT SOX tests. Tester turnover, internal or at the third party, is a risk, and the
    spend buys testing hours rather than advice. In KPMG's 2025 SOX survey 28% of companies used outsourced providers for
    SOX testing.
  solution: >-
    Havertys is adding Optro Autonomous Testing on top of its four-year-old Optro SOX system of record. It starts with the
    IT controls it already outsources, and plans to move to business-process controls and operational audits once IT
    controls are tested autonomously.
  outcomes:
    - lever: cost
      description: "Havertys will judge success partly by how its controls spend shifts, with more of the external support it buys expected to go to higher-value advisory work; no result yet"
      figure: "none published"
      measures: "Plan only; no figure given"
      provenance: vendor-published
      source_ref: OPTRO-HAVERTYS-2026
  prerequisites:
    - "Several years of structured test results and documentation already in the platform; Havertys says clean, consistent data gave it confidence"
    - "Havertys' reasoning: if a third-party tester could be taught the work, so could an agent"
  risks_and_guardrails:
    - "Case study published by the vendor; no outcome yet (OPTRO-HAVERTYS-2026)"
    - "KPMG's survey excerpt also reports that 58% said outsourced providers made up more than 20% of their SOX budget; the denominator is unclear in the source (KPMG-SOX2030-2026)"
  human_checkpoints:
    - "Managers continue to review and approve the work; the IT Audit Manager says the team is still responsible for reviewing"
  role_evolution: >-
    Havertys' VP of Internal Audit expects auditors to spend less time on controls expected to pass and more on process
    design, business risk and root cause, and the company expects its external spend to move toward advisory work
    (OPTRO-HAVERTYS-2026).
  evidence_grade: B
  sources:
    - {ref: OPTRO-HAVERTYS-2026, title: "Havertys Brings Agentic AI Into Internal Audit", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/havertys-furniture-success-story", date: "2026-09-04", access: full, locator: "paragraphs on third-party testers, 'We started with IT because we were already outsourcing those tests', review and success measures"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "Introduction, '2025 SOX Survey excerpts'"}
    - {ref: CPAPA-RSMMM-2026, title: "The Middle Market Has Embraced AI. Now Comes the Hard Part", publisher: "CPA Practice Advisor (RSM Middle Market AI Survey 2026)", type: survey, url: "https://www.cpapracticeadvisor.com/2026/07/22/the-middle-market-has-embraced-ai-now-comes-the-hard-part/187171/", date: "2026-07-22", access: full, locator: "paragraph on budget reallocation"}
  last_reviewed: "2026-10-20"
  notes: >-
    From practice 06. Direct signal for co-sourcing providers: the displaced work is outsourced testing hours. Maturity is
    piloting because the page describes the IT-first rollout as a first goal with no result. Related demand signal: among
    middle-market organisations increasing AI spend, 40% reallocate budget from external consulting services; the
    survey does not say the consulting is replaced by AI or by whom (CPAPA-RSMMM-2026). Firm type: client company
    (Havertys) on a vendor platform. The same case is assurance-controls-testing-19. The billing-model consequence for
    the provider (hours to advisory) is a professional-services question (professional-services-scoping-pricing-17).

- id: advisory-risk-controls-15
  title: "AI-native providers sell agent-run SOX and internal-audit testing straight to enterprise audit teams"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Public companies spend heavily on SOX testing and the testing stays manual; Midship cites roughly $2.3 million a year
    on SOX audit services for the average US public company (a vendor figure).
  solution: >-
    Vendors sell agents that follow an audit plan, gather evidence, test controls and produce review-ready workpapers
    with an approval workflow. Petual (a16z-backed; $20M raise reported 2026-04-24) names Navan as a customer. Midship
    raised a $4.15M seed (2026-01-27) for agents that run SOX testing lifecycles. Andera, whose technology RSM Beacon
    uses, markets a 70% time saving.
  outcomes:
    - lever: capacity
      description: "Petual reports customers achieve efficiency gains of 68% to 80% on existing SOX workflows and that workpapers take minutes rather than double- or triple-digit hours; Navan's head of audit, risk and compliance says it lets the company keep quality while scaling"
      figure: "68%-80% efficiency gain on SOX workflows (vendor claim)"
      measures: "Efficiency gain on existing SOX workflows across Petual customers, as reported by Petual at a funding announcement; metric, sample and period not given"
      provenance: vendor-published
      source_ref: FINTECHGLOBAL-PETUAL-2026
  prerequisites:
    - "Enterprise evidence in readable formats; the external auditor's acceptance of the workpaper format"
  risks_and_guardrails:
    - "All figures are vendor claims made at funding announcements"
    - "A vendor CEO warns that every major firm is building its own AI testing tools and that external auditors will scrutinise how a client applies them (CPAPA-5Q-2026)"
  human_checkpoints:
    - "Built-in approval workflow keeps human oversight central (Petual); agents keep humans in the loop (Midship)"
  role_evolution: >-
    Midship frames the shift as moving audit teams from evidence collection and documentation toward advisory work
    (MIDSHIP-SEED-2026).
  evidence_grade: B
  sources:
    - {ref: FINTECHGLOBAL-PETUAL-2026, title: "Petual raises $20m for AI-powered SOX compliance", publisher: "Fintech Global", type: press, url: "https://fintech.global/2026/04/24/petual-raises-20m-for-ai-powered-sox-compliance/", date: "2026-04-24", access: full, locator: "paragraphs 3-6 (efficiency figure; Navan quote)"}
    - {ref: MIDSHIP-SEED-2026, title: "Midship Raises $4.15M to Automate SOX Testing with Agentic AI", publisher: "Venture Capital Access Online", type: press, url: "https://www.vcaonline.com/news/2026012714/midship-raises-4-15m-to-automate-sox-testing-with-agentic-ai/", date: "2026-01-27", access: full, locator: "paragraphs 1-4"}
    - {ref: ANDERA-HOME-2026, title: "Andera: Automate your controls testing with AI", publisher: "Andera", type: vendor, url: "https://www.andera.ai/", date: "2026", access: full, locator: "home page headline claim"}
    - {ref: CPAPA-5Q-2026, title: "5 Questions to Ask Before Your SOX Team Adopts AI Agents", publisher: "CPA Practice Advisor (author: CEO of Bead AI, a vendor)", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/18/5-questions-to-ask-before-your-sox-team-adopts-ai-agents/188703/", date: "2026-08-18", access: full, locator: "article body"}
  last_reviewed: "2026-10-20"
  notes: >-
    From practice 17. Firm type: AI-native vendors, not accounting firms; they are the competitive context for
    co-sourcing. Grade B rests on a named production customer (Navan) with a quote; the figure is vendor-published.
    Andera's home page is undated and its $37M raise date came only from a search result, so it is not used. A podcast
    blurb seen in search said Optro acquired Midship; not confirmed, not used.

- id: advisory-risk-controls-16
  title: "SOX and internal-audit teams repositioned as controls advisers as automation moves into the first line"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [expert-judgment, review-assurance]
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    SOX and internal-audit teams spend most capacity testing controls after the fact, while stakeholders ask for advice
    before controls fail.
  solution: >-
    KPMG's SOX leader says external-auditor reliance on management testing 'is going to go away' and the role becomes
    controls adviser, with automation built into the first line. KPMG's path forward: embed controls in first-line
    workflows, build audit-ready evidence by design, and shift SOX and internal audit to controls advisory. SOX leaders
    on a May 2026 panel describe splitting teams into a forward-looking advisory group and a run-the-business group.
  outcomes:
    - lever: growth
      description: "Two-thirds of polled SOX leaders were asked to add value in operational, process and technology audits; 13% are still fully SOX-focused"
      figure: "two-thirds; 13%"
      measures: "Shares of SOX leaders polled during a 2026-05-14 webinar (sample size not stated) asked to add value in operational, process or technology audits, and still 100% focused on SOX"
      provenance: independent
      source_ref: IAC-SOXCHANGE-2026
  prerequisites:
    - "First-line process owners who will embed controls and automation"
    - "Execution burden reduced by automation to free advisory capacity (IAC-SOXCHANGE-2026, section 2)"
  risks_and_guardrails:
    - "Advising on control design and later testing the same controls needs separation; Sikich raises the same issue where internal audit owns AI governance (SIKICH-IAPRIORITIES-2026, p. 31)"
    - "KPMG expects external auditors testing whole populations to reduce the value of management's sample testing in lower-risk areas (KPMG-SOX2030-2026, POV 5)"
  human_checkpoints:
    - "Controller or process owner owns control design; SOX and internal audit advise and test"
  role_evolution: >-
    Teams move from testers to advisers before controls fail, and interviewers look for curiosity and holistic risk
    thinking (IAC-SOXCHANGE-2026, sections 2 and 4).
  evidence_grade: C
  sources:
    - {ref: KPMG-REVCONTROLS-2026, title: "Revolutionizing internal controls: The impact of technology and automation (April 2026 Future of SOX webcast)", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/revolutionizing-internal-controls-new.pdf", date: "2026-05", access: full, locator: "slide 7 (Sue King quote) and slide 12 ('The Path Forward')"}
    - {ref: IAC-SOXCHANGE-2026, title: "How SOX Is Changing in 2026", publisher: "Internal Audit Collective", type: community, url: "https://www.internalauditcollective.com/newsletters/how-sox-is-changing-in-2026", date: "2026-06-04", access: full, locator: "section 2 'SOX Teams' Scope Is Expanding'; section 4"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "POV 5"}
    - {ref: SIKICH-IAPRIORITIES-2026, title: "2026 Internal audit priorities annual survey", publisher: "Sikich", type: survey, url: "https://go.sikich.com/rs/345-ICF-683/images/Sikich%202026%20Internal%20Audit%20Priorities%20Survey%20Report.pdf?version=0", date: "2026-10", access: full, locator: "p. 31"}
  last_reviewed: "2026-10-20"
  notes: >-
    From discourse 09. Pattern is 'other': a service-model repositioning, not an agent pattern. Grade C: a firm's
    recommendation plus practitioner testimony with unnamed employers. The Internal Audit Collective promotes its own
    paid program. Firm type: KPMG (Big Four).

- id: advisory-risk-controls-17
  title: "AI governance, control design and certification-readiness advisory for clients (COSO GenAI roadmap, AIUC-1 readiness)"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [expert-judgment, document-production]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Clients, including private middle-market companies, deploy AI faster than they document ownership, controls and
    evidence. In KPMG's survey active AI use in finance rose from 30% (2024) to 75% (2026), fewer than half of
    organisations were fully assurance-ready, and only 29% track where AI adoption fails. COSO notes that generative AI
    can be confidently wrong, shifts with vendor updates and can start as unsanctioned 'shadow AI'. Enterprise buyers
    ask AI vendors and AI-using clients for independent proof that agents behave as intended.
  solution: >-
    Firms sell the design of AI governance: accountability across business, risk and internal audit; risk-based review
    before go-live; monitoring and decision logging after. COSO's February 2026 publication is the frame: classify each
    AI use by one of eight capability types, assess risk against the five COSO components, map preventive, detective and
    corrective controls, and set starter metrics, following a six-step roadmap (govern, inventory, assess, design,
    implement, monitor). RSM is hiring AI-risk consultants for AI/ML risk assessments and model governance documentation;
    Grant Thornton markets an AI governance model built on accountability and evidence. Readiness work before
    certification sits beside it: Grant Thornton LLP launched an Enterprise Assurance Services practice on 2026-09-23
    with provisional accreditation to support AIUC-1 certification of agentic AI controls, and on 2026-10-19 the AICPA
    and the Artificial Intelligence Underwriting Company announced a joint offering pairing a SOC 2 report with AIUC-1
    certification in one CPA-led engagement. In deals, Forvis Mazars US set out buy-side considerations for a target's AI
    (capability and data, cybersecurity and privacy, scalability and integration, ethical practices, regulatory compliance).
  outcomes:
    - lever: risk
      description: "Share of surveyed finance leaders whose organisations are fully assurance-ready for AI-enabled finance processes (a demand indicator, not a result of this service)"
      figure: "42%"
      measures: "1,013 C-suite and senior finance leaders at organisations with revenue of at least US$250M (US$500M in the US), March 2026; technology and financial services are 58% of the sample. The same release uses 42% for a second measure (confidence in scaling AI among assurance-ready organisations, against 14%)"
      provenance: vendor-published
      source_ref: KPMG-AIFINANCE-2026
    - lever: growth
      description: "Grant Thornton Advisors' CEO says AI is already driving demand for AI governance work and predicts demand will grow"
      figure: "none published"
      measures: "Executive statement in an interview; no engagement count or revenue given"
      provenance: self-reported
      source_ref: GT-CBIZ-2026
    - lever: risk
      description: "78% of surveyed leaders lack strong confidence they could pass an independent AI governance audit within 90 days (demand indicator)"
      figure: "78%"
      measures: "Respondents lacking strong confidence, of 950 C-suite and senior business leaders in Grant Thornton's own survey; not an engagement outcome"
      provenance: self-reported
      source_ref: GT-AIIMPACT-2026
    - lever: risk
      description: "67% of surveyed middle-market organisations apply AI governance controls before pilot or production stages"
      figure: "67%"
      measures: "Share of 1,030 US and Canadian middle-market senior leaders in RSM's 2026 survey, all of them AI users"
      provenance: vendor-published
      source_ref: CPAPA-RSMMM-2026
    - lever: risk
      description: "9% of private-equity leaders are very confident they could pass an AI governance audit in 90 days (demand indicator)"
      figure: "9%"
      measures: "Share of respondents to Grant Thornton's 2026 AI Impact Survey of PE leaders, per the survey summary; sample size and publication date not found"
      provenance: self-reported
      source_ref: GT-PEAI-2026
  prerequisites:
    - "A client inventory of AI uses with named owners, an acceptable-use policy and a cross-functional governance forum (COSO-GENAI-2026, pp. 9-10, 18-19)"
    - "Delivery staff with AI/ML and control skills; RSM's posting asks for Python, GenAI-stack and risk-framework experience and prefers AAIA, AAISM or AIGP certifications (RSM-JOB-AIRISK-2026)"
    - "For AIUC-1, quarterly technical retesting and annual renewal (JOFA-AIUC-2026)"
  risks_and_guardrails:
    - "COSO adapts its 2013 framework rather than creating a new one and is guidance, not a prescriptive rulebook (COSO-GENAIPR-2026; DART-COSO-2026)"
    - "Where the firm also audits the client, developing or hosting an AI system for that client can raise independence concerns under the AICPA Code (JOFA-ETHICS-2026)"
    - "For SEC audit clients, Rule 2-01(c)(4)(ii) restricts designing or implementing a system that generates information significant to the financial statements unless the results will not be subject to audit procedures (SEC-RULE2-01-2026)"
    - "Advice must not be framed as assurance over the client's AI; the AIUC-1 or SOC 2 examination is attest work, and readiness advice to a client the same firm will examine raises independence questions not resolved in the research"
    - "A Cloud Security Alliance note (AI-assisted, not CSA-reviewed) says two AI companies can hold clean SOC 2 reports with different tested control sets because no AI baseline exists (CSA-SOC2AI-2026)"
  human_checkpoints:
    - "Partner review of the risk assessment and control matrix before release"
    - "Client control owner confirms each control is operated, not only designed; management owns governance"
  role_evolution: >-
    COSO assigns each generative-AI tool a named owner with authority and accountability (COSO-GENAI-2026, p. 10). KPMG
    says AI governance should be built into existing ICFR infrastructure rather than run as a separate workstream
    (KPMG-SOX2030-2026, POV 1). RSM's posting describes work with engineering, data science, cybersecurity, model risk
    and audit teams across the first and second lines (RSM-JOB-AIRISK-2026).
  evidence_grade: C
  sources:
    - {ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI (GenAI)", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "executive summary p. 4; scope p. 5; Figure 3 p. 7; control environment pp. 9-10; roadmap pp. 18-19"}
