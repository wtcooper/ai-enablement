    - {ref: IIA-IPPF-2026, title: "IPPF documents listing, topic Artificial Intelligence", publisher: "The IIA", type: professional-body, url: "https://www.theiia.org/en/standards/documents/", date: "2026-09-18", access: full, locator: "AI-topic entries: templates issued 2026-06-16"}
