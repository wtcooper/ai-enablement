- id: advisory-risk-controls-18
  title: "AI inventory, shadow-AI discovery and review of user-built automations for a client's AI risk register"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [data-reporting, review-assurance, software-systems]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Teams cannot govern AI they have not listed, and shadow AI starts outside formal IT oversight. A LexisNexis report
    says 54% of consultants admit using AI tools without approval. Staff can now generate code and build their own
    automations, dashboards and apps; a Cherry Bekaert risk-advisory partner says this extends the developer pool to
    people who may not understand what happens behind the scenes. Inventory comes right after governance in COSO's six-step roadmap.
  solution: >-
    The advisor surveys and scans for unsanctioned use, then builds an inventory that classifies each use by capability
    type with an owner and criticality (COSO). Optro announced Agentic AI Governance: intake that pre-populates AI system
    records from existing documentation and an evidence evaluator that flags which controls are already satisfied; its AI
    Discovery feature for shadow AI is previewing ahead of 2027 availability. ACCA suggests asking who is actually using
    AI, since the answer may not match the list of authorised products. For user-built tools, advisors set up review and
    validation with ownership and change management before they enter the workflow, plus least-privilege access,
    sandboxes and human approval for higher-risk actions.
  outcomes:
    - lever: risk
      description: "Share of consultants who admit using AI tools without approval (a demand indicator)"
      figure: "54%"
      measures: "Per the vendor's landing page for its Management Consulting Industry Report 2026; sample, fieldwork date and wording not shown"
      provenance: vendor-published
      source_ref: LEXISNEXIS-CONSULTING-2026
    - lever: risk
      description: "33% of European organisations do not require staff to disclose AI contributions to work products, and 42% have a formal, comprehensive AI policy"
      figure: "33%; 42%"
      measures: "Shares of respondents to ISACA's European poll"
      provenance: independent
      source_ref: ISACA-AIPULSE-2026
  prerequisites:
    - "A client mandate to scan network and SaaS use, and a clear acceptable-use policy (COSO-GENAI-2026, p. 9)"
    - "Existing documentation of AI systems and a governance platform, for the vendor route (OPTRO-AGENTS-2026)"
    - "A data-classification policy and an approved-tools list (JOFA-CYBERCHECK-2026)"
  risks_and_guardrails:
    - "The Optro products are announced, with no named customer; AI Discovery is only a preview"
    - "Too much control drives workarounds; a Warren Averett risk partner advises governing what people are allowed to use rather than what they cannot (JOFA-CYBERCHECK-2026)"
    - "Agents with access to enterprise data, credentials or APIs open new attack paths (JOFA-CYBERCHECK-2026)"
  human_checkpoints:
    - "A governance committee classifies and approves each discovered use; teams own attestations and judgments"
    - "A review and change-management gate before any user-built agent touches production data"
  role_evolution: >-
    COSO assigns each AI use a named owner and a RACI (who is responsible, accountable, consulted, informed) for prompts,
    retrieval data and rules (COSO-GENAI-2026, p. 10); finance staff who build automations become owners of the controls
    over them (COSO-GENAI-2026, p. 8).
  evidence_grade: C
  sources:
    - {ref: OPTRO-AGENTS-2026, title: "Optro Launches Domain-Trained Agents for Audit, Compliance, Third-Party Risk, and AI Governance", publisher: "Optro", type: vendor, url: "https://optro.ai/blog/optro-launches-domain-trained-agents-for-audit-compliance-third-party-risk-and-ai-governance", date: "2026-10-14", access: full, locator: "Agentic AI Governance paragraph"}
    - {ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI (GenAI)", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "foundational characteristic 4, p. 8; control environment pp. 9-10; step 2, p. 19"}
    - {ref: LEXISNEXIS-CONSULTING-2026, title: "AI Is Accelerating Consulting and Introducing Risk (Management Consulting Industry Report 2026 landing page)", publisher: "LexisNexis", type: vendor, url: "https://professional.lexisnexis.com/en-us/ps-fowmini2026", date: "2026", access: full, locator: "second and third paragraphs"}
    - {ref: ISACA-AIPULSE-2026, title: "A Third of European Organisations Don't Know if They've Been Hit by an AI-Powered Cyberattack, New ISACA Research Finds", publisher: "ISACA", type: survey, url: "https://www.isaca.org/about-us/newsroom/press-releases/2026/a-third-of-european-organisations-dont-know-if-they-have-been-hit-by-an-ai-powered-cyberattack", date: "2026-06-17", access: full, locator: "final paragraph"}
    - {ref: ACCA-ENGLETTERS-2026, title: "Engagement letters, AI and PCRT", publisher: "ACCA", type: professional-body, url: "https://www.accaglobal.com/gb/en/technical-activities/uk-tech/in-practice-ezine-archive/In-Practice-archive-2026/september/Engagement-letters-AI-and-PCRT.html", date: "2026-09", access: full, locator: "final paragraph"}
    - {ref: JOFA-CYBERCHECK-2026, title: "New checklist helps CPAs manage AI cyber risks", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/news/2026/oct/new-checklist-helps-cpas-manage-ai-cyber-risks/", date: "2026-10-01", access: full, locator: "paragraphs on vibe coding, agent guardrails and the Paul Perry quote"}
    - {ref: IIA-IPPF-2026, title: "IPPF documents listing, topic Artificial Intelligence", publisher: "The IIA", type: professional-body, url: "https://www.theiia.org/en/standards/documents/", date: "2026-09-18", access: full, locator: "entry 'Vibe Coding Risks & What Internal Audit Needs to Know'"}
  last_reviewed: "2026-10-20"
  notes: >-
    Merged from practice 14, governance 12 and governance 13 (user-built automations, an idea). Grade C: announced
    products and practitioner advice; no named engagement result. Protiviti's IIA-listed paper on vibe-coding risks for
    internal audit (2026-09-18) is members-only and was read by title only. The ISACA poll is European; the LexisNexis
    figure covers consultants, not accounting firms. Firm types: vendors (Optro, LexisNexis); Warren Averett and Cherry
    Bekaert partners (top-100 mid-market firms) quoted as commentators. Related: assurance-assurance-over-ai-01 (scoping
    the entity's AI for the audit) and security-governance-risk-17 (enterprise AI policy and approval gates).

- id: advisory-risk-controls-19
  title: "Internal-audit review of a client's AI governance and AI lifecycle (Grant Thornton for a global bank)"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Traditional AI governance assumes risk is handled before deployment through policies and approvals, but agents make
    decisions at run time. Boards and audit committees ask whether AI is governed, and internal audit needs a repeatable
    way to test it without duplicating model-risk and compliance work.
  solution: >-
    Grant Thornton, as AI governance lifecycle audit advisor, helped a large global financial-services client's internal
    audit team build a repeatable approach to evaluating AI systems, developing questions and validating controls for
    new risks, aligned to the NIST AI Risk Management Framework; the client completed its first AI lifecycle audit.
    Co-sourced and in-house teams add AI governance, AI inventory, shadow AI, targeted high-risk AI assessments and
    monitoring reviews to audit plans. The IIA's AI Auditing Framework (issued 2024-09-13) provides a checklist, and in
    June 2026 the IIA issued templates including an audit-committee questionnaire on internal audit's AI coverage and a
    board AI-governance questionnaire. KPMG says ICFR programs will need to extend to AI systems that generate or
    validate financial data.
  outcomes:
    - lever: risk
      description: "Grant Thornton reports seven AI governance domains under active audit coverage and over 100 production AI use cases with governance oversight validated, within a framework covering over 1,000 AI initiatives"
      figure: "7 domains; 100+ production use cases validated; 1,000+ AI initiatives governed"
      measures: "Counts of governance domains, production use cases validated and AI initiatives in the client's framework, as listed in the firm's case-study panel; whether all came from this engagement is not stated"
      provenance: self-reported
      source_ref: GT-BANK-2026
    - lever: risk
      description: "77% of audit plans include AI assessments, but of respondents auditing AI only 53% review operational effectiveness, 40% ethical use and bias and 36% model validation"
      figure: "77%; 53%; 40%; 36%"
      measures: "Shares of 222 US audit leaders in Sikich's 2026 survey"
      provenance: vendor-published
      source_ref: SIKICH-IAPRIORITIES-2026
    - lever: capacity
      description: "63% of healthcare internal-audit respondents say they already perform AI governance engagements"
      figure: "63%"
      measures: "Share of respondents to the 2026 Protiviti and AHIA healthcare internal-audit survey; sample size not captured"
      provenance: vendor-published
      source_ref: PROTIVITI-AHIA-2026
  prerequisites:
    - "An AI inventory, including shadow AI, and an existing model-risk or governance function to audit against (the bank client had both)"
    - "A reference framework: NIST AI RMF, the IIA AI Auditing Framework, or COSO's GenAI guidance (COSO-GENAI-2026)"
    - "AI-literate auditors; Sikich finds AI the hardest skill to develop and retain for 41% of respondents"
  risks_and_guardrails:
    - "The bank client is anonymous and very large; this is not a mid-market engagement (GT-BANK-2026)"
    - "Safe is not the same as effective: a governed model can still produce inaccurate or biased decisions (SIKICH-IAPRIORITIES-2026, pp. 26, 30)"
    - "Internal audit should not design, own and later assure the same AI governance structure; internal audit is primary AI risk owner in 27% of smaller organisations versus 6% of larger ones (SIKICH-IAPRIORITIES-2026, p. 31)"
    - "KPMG notes SOX programs mostly still test around AI controls today and expects the first wave of AI-related material weaknesses in 2027 (KPMG-SOX2030-2026)"
    - "Independence: internal-audit outsourcing for an SEC audit client is restricted unless the results will not be subject to audit procedures (SEC-RULE2-01-2026, (c)(4)(v))"
  human_checkpoints:
    - "The work is human audit design; AI is the subject of the audit, not the auditor"
    - "Internal-audit lead approves scope and finding ratings; the audit committee receives the results"
  role_evolution: >-
    KPMG says SOX and ICFR professionals will need to be fluent in accounting and AI systems, and that the skills to audit
    a language model are not core to the CPA curriculum (KPMG-SOX2030-2026). 82% of Sikich respondents use external
    partners, and 60% of those cite access to specialised skills (SIKICH-IAPRIORITIES-2026).
  evidence_grade: B
  sources:
