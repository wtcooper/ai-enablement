    healthcare-specific. Firm types: Grant Thornton Advisors (PE-backed alternative practice structure), KPMG (Big Four),
    Sikich and Protiviti as survey sponsors. Certification against AIUC-1 or ISO/IEC 42001 is assurance; the audit-side
    equivalent of this entry is assurance-assurance-over-ai-10.

- id: advisory-risk-controls-20
  title: "SOX teams scope and evaluate the AI embedded in clients' business controls"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance, expert-judgment]
  pattern: intake-triage
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Business teams put AI inside revenue, procure-to-pay, close and access workflows, and SOX teams have no agreed way to
    scope or test those controls. KPMG's 2025 Trends in Material Weaknesses study, as cited, says IT-related material
    weaknesses rose from 31% (2021) to 58% (2025).
  solution: >-
    SOX teams ask about AI use and reliance during walkthroughs, send control owners quarterly questionnaires on current
    and planned AI, hold human-in-the-loop discussions for key controls, write baseline human-in-the-loop requirements,
    and align with the external auditor on documentation and evidence. COSO's generative-AI publication is the starting
    framework.
  outcomes:
    - lever: risk
      description: "An informal webinar poll, as the community publisher reads it, implies 95% of SOX programs lack a defined framework for evaluating AI in controls"
      figure: "95%"
      measures: "Share of respondents to a May 2026 Internal Audit Collective webinar poll (sample size not stated) without a defined framework for evaluating AI inside business controls, as the article states it; the chart was not visible"
      provenance: independent
      source_ref: IAC-SOXRELIANCE-2026
  prerequisites:
    - "A control-owner inventory of AI use; COSO's generative-AI publication as a starting framework"
  risks_and_guardrails:
    - "Panelists cite evidence retention, access management, data privacy and security, monitoring and non-deterministic outputs as concerns (IAC-SOXCHANGE-2026, section 1)"
    - "Vendor commentary says AI controls are assessed by analogy to existing standards and that precision, false-negative rate and drift are undefined for AI controls (FINREP-SOXRELIANCE-2026; vendor claim)"
    - "KPMG expects the first wave of AI-related material weaknesses in 2027 (KPMG-SOX2030-2026)"
  human_checkpoints:
    - "Control owners document human-in-the-loop procedures; the SOX team confirms evidence expectations with the external auditor"
  role_evolution: >-
    SOX teams become the first reviewer of how business controls use AI and negotiate evidence expectations with the
    external auditor (IAC-SOXRELIANCE-2026).
  evidence_grade: C
  sources:
    - {ref: IAC-SOXCHANGE-2026, title: "How SOX Is Changing in 2026", publisher: "Internal Audit Collective", type: community, url: "https://www.internalauditcollective.com/newsletters/how-sox-is-changing-in-2026", date: "2026-06-04", access: full, locator: "section 1, subsection 'Assessing SOX-Relevant Business Controls'"}
    - {ref: IAC-SOXRELIANCE-2026, title: "AI Use in SOX: What Will External Audit Rely On?", publisher: "Internal Audit Collective", type: community, url: "https://www.internalauditcollective.com/newsletters/ai-use-in-sox-what-will-external-audit-rely-on-and-how-can-sox-teams-get-ahead-of-the-game", date: "2026-06-11", access: full, locator: "section 'Management's Use of AI in Internal Controls'"}
    - {ref: FINREP-SOXRELIANCE-2026, title: "SOX Reliance on AI Controls: What the Guidance Actually Says (2026)", publisher: "Finrep", type: vendor, url: "https://www.finrep.ai/blog/sox-reliance-on-ai-controls-what-the-guidance-actually-says-2026", date: "2026-07-13", access: full, locator: "sections 'The Precision Problem' and 'Model Drift as a Control Deficiency'"}
    - {ref: KPMG-SOX2030-2026, title: "The Future of SOX: A point of view for 2030 and beyond", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/future-sox-point-view-2030-beyond.html", date: "2026-09-24", access: full, locator: "POV 1, 'The first AI-related material weaknesses'"}
    - {ref: KPMG-IPO-2026, title: "The IT leader's guide to IPO preparedness", publisher: "KPMG LLP", type: firm, url: "https://kpmg.com/us/en/articles/2026/it-leaders-guide-ipo-preparedness.html", date: "2026-06-10", access: full, locator: "passage citing KPMG's 2025 Trends in Material Weaknesses study"}
  last_reviewed: "2026-10-20"
  notes: >-
    From discourse 14. Grade C: community polls and practitioner testimony with unnamed employers, plus a vendor blog.
    The Internal Audit Collective promotes its own paid playbook. The vendor blog's claim that no PCAOB AI-specific
    standard or staff guidance exists as of July 2026 was not checked. The external-audit side of the same question is
    assurance-assurance-over-ai-02 and -03.

- id: advisory-risk-controls-21
  title: "Idea: written controls before a client's finance agents go live (agent inventory, replayable evidence, sign-off gates, assurance mapping, exit threshold)"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [expert-judgment, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Close and reconciliation agents (BlackLine, FloQast, Microsoft and Workday products named) are reaching production,
    and an academic commentator says finance teams are deploying faster than they are documenting controls. Vendor
    match-rate and time-saving figures are marketing until reproduced on the client's own data.
  solution: >-
    Idea (practitioner proposal). Before an agent touches a production close, the advisor helps the client put five
    controls in a signed one-page memo: an agent inventory with a named human owner; evidence a reviewer can replay
    (inputs, steps, exceptions, basis for each match); human sign-off gates scaled to materiality and risk; mapping of the
    vendor's SOC assurance to complementary controls and contract terms; and monitoring with metrics and a threshold at
    which the agent is pulled. A validation period is built into the rollout. This matches COSO roadmap steps 2 and 6
    (inventory; monitor and adapt).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "No firm or client result; the source is a practitioner checklist. Demand context: in KPMG's survey 42% of finance leaders are fully assurance-ready and 29% track where AI adoption fails (KPMG-AIFINANCE-2026)"
      provenance: self-reported
      source_ref: CPAPA-AGENTSCLOSE-2026
  prerequisites:
    - "Client willingness to define normal match rates, exception volumes and error rates before go-live, and to run a validation period on its own data"
    - "An approved list of agents and a close checklist where gates can be written"
  risks_and_guardrails:
    - "Sign-off gates must be written into the close checklist with names, or review becomes assumed rather than performed (CPAPA-AGENTSCLOSE-2026)"
    - "Monitoring should track indicators such as transaction volume, size and override percentages to detect model drift; 'set-and-forget' does not work (DART-COSO-2026)"
    - "The article cites the Deloitte Australia partial fee refund over fabricated citations (October 2025) as a warning about unreviewed AI output (CPAPA-AGENTSCLOSE-2026)"
  human_checkpoints:
    - "Controller signs the memo; a named human owns each agent's output and is authorised to pull the agent"
  role_evolution: >-
    The author says client-accounting and controllership firms can hand clients this checklist and that auditors will
    ask the same questions (CPAPA-AGENTSCLOSE-2026); control ownership shifts to named finance staff per agent
    (COSO-GENAI-2026, p. 10).
  evidence_grade: D
  sources:
    - {ref: CPAPA-AGENTSCLOSE-2026, title: "Before You Let the Agents Run the Close: Five Controls to Put in Writing First", publisher: "CPA Practice Advisor (author: Anthony L. Fulmore Sr., Texas A&M University Central Texas)", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/13/before-you-let-the-agents-run-the-close-five-controls-to-put-in-writing-first/", date: "2026-08-13", access: full, locator: "five numbered controls and closing paragraph"}
    - {ref: KPMG-AIFINANCE-2026, title: "AI adoption in finance doubles, but assurance readiness determines who wins, KPMG finds", publisher: "KPMG International", type: survey, url: "https://kpmg.com/xx/en/media/press-releases/2026/05/ai-adoption-in-finance-doubles-but-assurance-readiness-determines-who-wins.html", date: "2026-05-11", access: full, locator: "'Assurance readiness powers AI performance', second paragraph"}
    - {ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI (GenAI)", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "roadmap steps 2 and 6, pp. 18-19; control environment p. 10"}
    - {ref: DART-COSO-2026, title: "Heads Up: COSO Releases Publication on Internal Controls Related to Generative AI", publisher: "Deloitte (DART)", type: firm, url: "https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2026/coso-internal-controls-generative-ai", date: "2026-04-03", access: full, locator: "paragraph on monitoring KPIs"}
  last_reviewed: "2026-10-20"
  notes: >-
    Idea. Merged from practice 19, discourse 13 and governance 02 (the discourse file had graded it C; with no deployment
    found it is D). The author is a university professor writing in a trade outlet. The client-accounting side of agentic
    close (running the close for clients) belongs to the client-accounting-services module; this entry keeps only the
    control design. Independence: designing controls for a client the firm also audits needs analysis
    (see advisory-risk-controls-17).

- id: advisory-risk-controls-22
  title: "Confidence-threshold routing: low-confidence AI classifications and extractions go to a person"
  archetype: advisory
  module: risk-controls
  function: finance-accounting
  work_types: [transaction-processing, review-assurance]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Accountants working with AI suggestions risk adding errors when they follow AI recommendations on uncertain items. In
    a framed field experiment, AI assistance improved classification accuracy on average, but relying on non-consensus AI
    recommendations can increase the risk of error.
  solution: >-
    Set confidence thresholds so low-confidence items go to a person. In Choi and Xie's field data, accountants
    selectively intervene when AI confidence scores are low. COSO's roadmap gives the same design for invoice extraction:
    confidence thresholds, human review for new templates, and monthly accuracy sampling.
  outcomes:
    - lever: capacity
      description: "Time shifted from routine data entry to business communication and quality assurance in the field data"
      figure: "approximately 8.5% of accountant time"
      measures: "Reallocation of about 8.5% of accountant time from routine data entry toward higher-value tasks, per the MIT Sloan summary of the working-paper version; field data from an AI platform serving 79 SMEs (over 200,000 transaction records) and a survey of 277 accountants; bookkeeping context"
      provenance: independent
      source_ref: MITSLOAN-CHOIXIE-2025
    - lever: quality
      description: "62% of surveyed accountants worried about errors and accuracy in AI-generated reporting"
      figure: "62%"
      measures: "Share of the 277 surveyed accountants, per the MIT Sloan summary"
      provenance: independent
      source_ref: MITSLOAN-CHOIXIE-2025
  prerequisites:
    - "The AI system exposes a usable confidence score, and reviewers are trained to read it (MITSLOAN-CHOIXIE-2025)"
  risks_and_guardrails:
    - "Accountants tended to follow AI's divergent categories for uncertain transactions, which can introduce errors (MITSLOAN-CHOIXIE-2025)"
    - "Threshold design and accuracy sampling need re-validation after vendor updates (COSO-GENAI-2026, p. 19)"
  human_checkpoints:
    - "Low-confidence items and new templates go to a named reviewer; a controller reviews the monthly accuracy sample"
  role_evolution: >-
    The authors report effort moving from data entry to communication and quality assurance, and more experienced
    accountants gain more from the AI (STANFORD-JAR-2026; MITSLOAN-CHOIXIE-2025).
  evidence_grade: B
  sources:
    - {ref: STANFORD-JAR-2026, title: "Human + AI in Accounting: Early Evidence from the Field (Journal of Accounting Research 64(3), pp. 1333-1373)", publisher: "Stanford GSB (Choi and Xie)", type: academic, url: "https://www.gsb.stanford.edu/index%2ephp/node/629989", date: "2026-06", access: full, locator: "abstract"}
    - {ref: MITSLOAN-CHOIXIE-2025, title: "How generative AI can make accountants more productive", publisher: "MIT Sloan Ideas Made to Matter", type: academic, url: "https://mitsloan.mit.edu/ideas-made-to-matter/how-generative-ai-can-make-accountants-more-productive", date: "2025-08-05", access: full, locator: "paragraphs 2-6"}
    - {ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI (GenAI)", publisher: "COSO", type: standard-setter, url: "https://www.coso.org/_files/ugd/719ba0_ef4dbc255331406e95faf46e7a9e3a1c.pdf", date: "2026-02-23", access: full, locator: "step 4 example, p. 19; case 1, p. 20"}
  last_reviewed: "2026-10-20"
  notes: >-
    From governance 18. Grade capped at B: the measurements are independent but come from bookkeeping on one vendor's
    platform, not from risk and controls advisory. The governance file rated it augment; automate is used because the
    design sends only low-confidence items and new templates to people. The MIT Sloan summary describes an earlier
    version of the paper; the journal version was read only as an abstract. Firm type: not applicable (academic study).
    The bookkeeping delivery itself belongs to client-accounting-services; this entry keeps the control design.

- id: advisory-risk-controls-23
  title: "Idea: AI-enabled fraud readiness and fraud-risk program design for client internal-audit and risk functions"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [expert-judgment, research-synthesis]
  pattern: research-brief
  ladder: assist
  change_scope: step
  runtime_class: personal-assistant
  maturity: emerging
  problem: >-
    Internal-audit leaders see AI-enabled fraud (fabricated documents, deepfakes, synthetic identities) as a growing risk,
    and few feel prepared. Payments fraud and business email compromise are widespread, and anti-fraud AI is rarely
    tested or explained.
  solution: >-
    Idea discussed by practitioners: advisers help client audit and risk teams assess exposure to AI-enabled fraud, build
    skills and tools, update fraud risk assessments and design controls. Reference points for the design: DOJ's
    September 2024 compliance-program guidance asks prosecutors to look at how a company manages AI risk and whether
    human decision-making is the baseline for assessing AI; FinCEN's November 2024 alert gives deepfake red flags for
    financial institutions. The IIA's March 2026 GAM programme listed deepfakes and agile fraud risk management as a
    theme.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none published"
      measures: "No outcome of an advisory service published. Context: 85% of 373 senior internal-audit leaders view AI-enabled fraud as a moderate to high risk and fewer than four in 10 believe their function is adequately prepared (Internal Audit Foundation and Optro survey)"
      provenance: independent
      source_ref: IAF-AIFRAUD-2026
  prerequisites:
    - "Tools, skills and budget; the IAF survey lists these as the main barriers, and 84% of ACFE/SAS respondents cite budget as a major or moderate barrier (ACFE-TECHBENCH-2026)"
  risks_and_guardrails:
    - "Concern focuses on visible threats such as AI-powered phishing, while synthetic identity fraud is less widely recognised (IAF-AIFRAUD-2026, executive summary)"
    - "Only 7% of ACFE/SAS respondents say they are more than moderately prepared for AI-fuelled fraud; 18% test anti-fraud AI models for bias or fairness and 6% feel completely confident explaining how their models decide (ACFE-TECHBENCH-2026)"
    - "76% of organisations had attempted or actual payments fraud in 2025, 74% were hit by business email compromise and 17% use AI against it (AFP-PAYFRAUD-2026)"
  human_checkpoints:
    - "Fraud-risk conclusions remain with management and audit leadership"
  role_evolution: >-
    The IAF report says internal audit's own AI use builds the hands-on understanding needed to spot AI-enabled fraud
    (IAF-AIFRAUD-2026).
  evidence_grade: D
  sources:
    - {ref: IAF-AIFRAUD-2026, title: "Internal Audit and AI-Enabled Fraud", publisher: "Internal Audit Foundation with Optro", type: survey, url: "https://www.theiia.org/globalassets/site/content/research/foundation/2026/internal-audit-and-ai-enabled-fraud/ia-and-ai-enabled-fraud-report-en.pdf", date: "2026-07", access: full, locator: "executive summary, p. 3; pp. 13-14"}
    - {ref: IIA-GAM-2026, title: "The IIA's Great Audit Minds Conference to be Held March 9-11 in Las Vegas", publisher: "The IIA", type: conference, url: "https://www.theiia.org/en/content/communications/press-releases/2026/the-institute-of-internal-auditors-great-audit-minds-conference-to-be-held-march-9-11-in-las-vegas/", date: "2026-02-03", access: full, locator: "key themes list"}
    - {ref: ACFE-TECHBENCH-2026, title: "Study: Deepfake fraud surges - and only 7% of organizations are firmly ready (2026 Anti-Fraud Technology Benchmarking Report press release)", publisher: "SAS with ACFE", type: survey, url: "https://www.sas.com/en_us/news/press-releases/2026/march/acfe-anti-fraud-technology-study-deepfakes.html", date: "2026-03-25", access: full, locator: "survey findings bullets"}
    - {ref: DOJ-ECCP-2024, title: "Evaluation of Corporate Compliance Programs (updated September 2024)", publisher: "US DOJ Criminal Division", type: regulator, url: "https://www.justice.gov/criminal/criminal-fraud/page/file/937501/dl", date: "2024-09", access: full, locator: "AI sections"}
    - {ref: FINCEN-DEEPFAKE-2024, title: "FinCEN Alert FIN-2024-Alert004: Fraud Schemes Involving Deepfake Media Targeting Financial Institutions", publisher: "US Treasury FinCEN", type: regulator, url: "https://www.fincen.gov/system/files/shared/FinCEN-Alert-DeepFakes-Alert508FINAL.pdf", date: "2024-11-13", access: full, locator: "pp. 1-2"}
    - {ref: AFP-PAYFRAUD-2026, title: "Over 75% of US Firms Experienced Payments Fraud in 2025, While AI Adoption for Fraud Mitigation Lags", publisher: "Association for Financial Professionals (survey underwritten by Truist)", type: survey, url: "https://www.financialprofessionals.org/about/learn-more/press-releases/Details/over-75-percent-of-us-firms-experienced-payments-fraud-in-2025-while-ai-adoption-for-fraud-mitigation-lags", date: "2026-04-14", access: full, locator: "key findings list"}
  last_reviewed: "2026-10-20"
  notes: >-
    Idea: the sources show demand and concern, not a delivered advisory service. Built on discourse 16 plus items the
    forensic-disputes and client-accounting-services research routed here (DOJ-ECCP-2024, FINCEN-DEEPFAKE-2024,
    ACFE-TECHBENCH-2026, AFP-PAYFRAUD-2026). The IAF PDF date is its creation date (2026-07-28). The IIA release prints
    'February 3, 2025' for the 2026 conference; 2026 is assumed. Detection and investigation stay in forensic-disputes
    (advisory-forensic-disputes-03 covers proactive anti-fraud monitoring); the external-audit equivalent is
    assurance-planning-risk-assessment-15.

- id: advisory-risk-controls-24
  title: "Idea: certify AI testing tools before use, with a parallel run against completed engagements and recertification after changes"
  archetype: advisory
  module: risk-controls
  function: service-delivery
  work_types: [review-assurance]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    No public parallel-run, override or error-rate result exists for AI in internal audit or SOX testing, so firms and
    clients cannot compare an AI tool's conclusions with their own before relying on it.
  solution: >-
    Run the tool in shadow mode on engagements already completed and compare its results with the team's conclusions,
    then ramp gradually (Ledgerline author). A vendor CEO recommends running old and new side by side on 5-10 controls
    and comparing exceptions. The UK FRC describes the same controls from a regulator's side: test default, edge and
    diverse cases; recertify after material changes; and, for limited deployment, perform alternative procedures in full
    in parallel. COSO's roadmap adds revalidating after vendor updates.
  outcomes:
    - lever: quality
      description: "none published"
      figure: "none published"
