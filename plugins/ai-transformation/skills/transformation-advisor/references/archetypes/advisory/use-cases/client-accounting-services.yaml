# Use cases: advisory / client-accounting-services
# Client accounting services (CAS): outsourced or co-sourced bookkeeping, reconciliation and close, management
# reporting, controllership and fractional CFO work, payroll and bill pay, delivered by accounting firms, AI-native
# providers and in-house finance teams. Sources checked 2026-10-20 and re-verified against the opened sources
# 2026-10-21. Every source was opened (access: full) unless
# marked otherwise; several were read as abstracts, case studies or press reports, which the locator says.
# Almost every outcome figure is vendor-published or self-reported. The one independent field study (Choi and Xie)
# reports associations from one unnamed platform's SME customers. No CAS firm or platform has published an error
# rate, override rate, parallel-run result or inspection finding.
# Independence: bookkeeping and related services are restricted when the client is also the firm's own audit client;
# see advisory-client-accounting-services-24. Firm operations (pricing the firm's own CAS, staffing, PE ownership) are
# in professional-services; control services sold to clients are in advisory risk-controls; tax work is in tax.

- id: advisory-client-accounting-services-01
  title: Confidence-gated transaction categorization with accountant review of uncertain items
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Staff code bank and card transactions every month for every client, across different charts of accounts and
    house rules, and that coding sets the quality of every later report. Manual data cleanup is the top blocker to
    advisory work named by 30% of respondents in Intuit's 2026 survey (INTUIT-ACCTTECH-2026).
  solution: >-
    A model proposes the account for each transaction with a confidence score. High-confidence items post and
    uncertain ones go to an accountant, who reviews and edits in bulk. In Digits' benchmark the strongest results came
    from a model that learns each business's own booking history; general-purpose models without that context
    plateaued. Intuit has announced expert-verified auto-categorization, where only high-confidence items post
    automatically; it is off by default for firm-billed clients and the accountant decides when to switch it on.
  outcomes:
    - lever: capacity
      description: "Accountant time reallocated from routine data entry toward business communication and quality assurance (independent field study of an unnamed AI-enabled platform)."
      figure: "approximately 8.5% of accountant time"
      measures: "Share of accountant time reallocated from routine data entry, from platform data on 79 small and mid-sized businesses (working-paper abstract)"
      provenance: independent
      source_ref: STANFORD-WP-2025
    - lever: speed
      description: "Shorter monthly close associated with AI use; reported as an association, not a proven cause."
      figure: "7.5-day reduction in monthly close time"
      measures: "Reduction in monthly close time associated with AI usage (working-paper abstract); the Stanford summary describes adopters finalizing statements 7.5 days faster than accountants using traditional methods"
      provenance: independent
      source_ref: STANFORD-WP-2025
    - lever: quality
      description: "More granular general ledgers associated with AI use."
      figure: "12% increase in general ledger granularity"
      measures: "Increase in ledger granularity, for example splitting a broad payroll line into bonuses, benefits or meals (working-paper abstract and Stanford summary)"
      provenance: independent
      source_ref: STANFORD-WP-2025
    - lever: capacity
      description: "More weekly client support among adopters; the June 2026 journal abstract does not repeat this figure."
      figure: "55% increase in weekly client support"
      measures: "Increase in weekly client support among AI adopters (working-paper abstract); the comparison base is not stated"
      provenance: independent
      source_ref: STANFORD-WP-2025
    - lever: quality
      description: "Vendor-run categorization benchmark: ledger-native model against general models, a look-up agent and outsourced accountants."
      figure: "97.8% vs 79.5% vs 88.9% vs 79.1%"
      measures: "Share of 2,000 transactions from four small businesses on Digits classified to categories reviewed by US accountants applying GAAP: Digits' ledger-native model; best one-shot general model; best agent with ledger look-up; 12 outsourced accountants (majority vote of three-person teams) seeing the books for the first time"
      provenance: vendor-published
      source_ref: DIGITS-BENCH-2026
    - lever: speed
      description: "Processing time in the same vendor benchmark."
      figure: "40 ms vs 74 s per transaction; humans about 4 h 43 min per 500"
      measures: "Time per transaction for Digits' model and for the best look-up agent (Digits' report); average human team time per 500-transaction allocation, about 34 seconds a transaction (as reported by ACCTODAY-AIBENCH-2026)"
      provenance: vendor-published
      source_ref: DIGITS-BENCH-2026
    - lever: quality
      description: "Vendor test of general-purpose models on accounting workflows (accuracy ceiling for general models)."
      figure: "77.3% best of 19 models"
      measures: "Highest accuracy of 19 general models on 101 workflow questions graded deterministically (DualEntry); one engineer reports about 92% on classification but 30-40% on journal-entry creation"
      provenance: vendor-published
      source_ref: ACCTODAY-DUALENTRY-2026
    - lever: quality
      description: "Intuit's bank-feed categorization accuracy, old feed against new feed."
      figure: "about 78% to nearly 88%"
      measures: "Categorization accuracy as stated by Intuit; the article does not say how accuracy is measured or the denominator"
      provenance: vendor-published
      source_ref: CPAPA-INTUITCONNECT-2026
    - lever: capacity
      description: "Small two-partner firm's estimate after about nine months on an AI-native ledger."
      figure: "about 90% auto-categorized"
      measures: "Share of transactions auto-categorized across migrated clients, as stated ('approximately 90%') in a vendor case study; no tracked metric or method shown"
      provenance: vendor-published
      source_ref: DIGITS-LINCOLN-2026
  prerequisites:
    - "Bank and card feeds connected to the ledger, and a chart of accounts that reflects the client's own conventions"
    - "Booking history the model can learn from: the best agent in the Digits benchmark gained about 10 points over its one-shot score by looking up past bookings (DIGITS-BENCH-2026)"
    - "Confidence scores shown to reviewers and a defined threshold for posting versus review"
    - "Reviewer time reserved for low-confidence items and recurring-merchant exceptions"
  risks_and_guardrails:
    - "Junior accountants tended to accept AI suggestions even when flagged as uncertain, while senior accountants intervened (STANFORD-INSIGHTS-2025)."
    - "A framed experiment found AI help improved classification accuracy on average, but reliance on non-consensus AI recommendations can increase the risk of error (STANFORD-JAR-2026)."
    - "Failures cluster on recurring merchants and on categories the business defines, such as near-duplicate categories and payment-processor clearing accounts (DIGITS-BENCH-2026; ACCTODAY-AIBENCH-2026)."
    - "General-purpose models plateaued: the six models behind the best one-shot model finished within half a point of it, and the best one-shot configurations beat the human baseline by at most 0.4 points, within sampling error (DIGITS-BENCH-2026; ACCTODAY-AIBENCH-2026)."
    - "A small firm saw a built-in categorization feature begin mis-suggesting transactions it had coded correctly before, which created rework (DIGITS-LINCOLN-2026)."
    - "COSO warns that automated posting can amplify misclassification and lists validated confidence thresholds for auto-posting and periodic manual re-performance as controls (COSO-GENAI-2026, p. 24)."
    - "In the study's survey, 62% of accountants worried about errors in AI-generated reporting (MITSLOAN-CHOIXIE-2025)."
    - "A pseudonymous forum thread argues that even 97% accuracy leaves hundreds of errors a year per client and that professional responsibility forces full review (BEANCOUNT-REVIEWBURDEN-2026; anecdotal)."
  human_checkpoints:
    - "Accountant reviews low-confidence and flagged transactions"
    - "Periodic sampling of auto-posted items"
    - "Accountant decides when to switch auto-posting on for a client"
    - "Month-end review and sign-off before reports go to the client"
  role_evolution: >-
    The study reports a shift from routine data entry toward business communication and quality assurance, with more
    experienced accountants gaining more from the tool and intervening when confidence scores are low
    (MITSLOAN-CHOIXIE-2025; STANFORD-INSIGHTS-2025).
  evidence_grade: A
  sources:
    - { ref: STANFORD-WP-2025, title: "Human + AI in Accounting: Early Evidence from the Field (working paper no. 4261)", publisher: "Stanford Graduate School of Business (Choi, Xie)", type: academic, url: "https://www.gsb.stanford.edu/index%2ephp/faculty-research/working-papers/human-ai-accounting-early-evidence-field", date: "2025-05-07", access: full, locator: "abstract (55%, 7.5-day, 12% and 8.5% figures)" }
    - { ref: STANFORD-JAR-2026, title: "Human + AI in Accounting: Early Evidence from the Field (Choi, Xie), Journal of Accounting Research 64(3), pp 1333-1373", publisher: "Stanford Graduate School of Business (listing of the JAR article)", type: academic, url: "https://www.gsb.stanford.edu/index.php/node/629989", date: "2026-06", access: full, locator: "abstract only: 277 accountants surveyed, 79 SMEs, 200,000+ transaction records, framed experiment" }
    - { ref: STANFORD-INSIGHTS-2025, title: "AI Is Reshaping Accounting Jobs by Doing the 'Boring' Stuff", publisher: "Stanford Graduate School of Business Insights (Seb Murray)", type: academic, url: "https://www.gsb.stanford.edu/insights/ai-reshaping-accounting-jobs-doing-boring-stuff", date: "2025-06-26", access: full, locator: "paragraphs on experience levels, 7.5 days, 12% granularity and survey concerns" }
    - { ref: MITSLOAN-CHOIXIE-2025, title: "How generative AI can make accountants more productive", publisher: "MIT Sloan Ideas Made to Matter", type: academic, url: "https://mitsloan.mit.edu/ideas-made-to-matter/how-generative-ai-can-make-accountants-more-productive", date: "2025-08-05", access: full, locator: "paragraphs on 8.5% time reallocation and the 62% concern figure" }
    - { ref: DIGITS-BENCH-2026, title: "Breaking: AI Can't Close Your Books From the Outside (Yes, Including Jev)", publisher: "Digits", type: vendor, url: "https://digits.com/blog/ai-cant-close-books-from-outside/", date: "2026-10-07", access: full, locator: "sections 'No context', 'With access to the ledger', 'Native to the ledger', 'It misses house rules'" }
    - { ref: ACCTODAY-AIBENCH-2026, title: "AI beats human accountants at monthly close, transaction categorization", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/ai-beats-human-accountants-at-monthly-close-transaction-categorization", date: "2026-10-16", access: full, locator: "section 'The Digits benchmark' and 'Don't count humans out just yet'" }
    - { ref: ACCTODAY-DUALENTRY-2026, title: "Generalist AI model accuracy tops out at 77% for accounting", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/generalist-ai-model-accuracy-tops-out-at-77-for-accounting", date: "2026-03-17", access: full, locator: "paragraphs on 19 models, 101 workflows and the classification versus journal-entry split" }
    - { ref: CPAPA-INTUITCONNECT-2026, title: "Intuit Connect ON: What You Need to Know About the Latest Platform Innovations", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/06/26/intuit-connect-on-what-you-need-to-know-about-the-latest-platform-innovations/185810/", date: "2026-06-26", access: full, locator: "sections 'QuickBooks: Foundational Fixes' and 'Continuously Clean Books'" }
    - { ref: DIGITS-LINCOLN-2026, title: "How Lincoln Accounting Reclaimed 30+ Hours a Month by Switching to Digits", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/lincoln-accounting/", date: "2026-09-02", access: full, locator: "paragraphs on QuickBooks AI categorization rework and the roughly 90% estimate" }
    - { ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://auditoresinternos.es/wp-content/uploads/2026/02/Achieving-Effective-Internal-Control-Over-Generative-AI_COSO_compressed.pdf", date: "2026-02", access: full, locator: "p. 24, automated transaction processing and reconciliation (copy hosted by a third party)" }
    - { ref: BEANCOUNT-REVIEWBURDEN-2026, title: "I Adopted AI Bookkeeping for Time Savings, But Reviewing Every Transaction Takes Just as Long", publisher: "Beancount and Plain-Text Accounting Forum", type: community, url: "https://beancount.io/forum/t/i-adopted-ai-bookkeeping-for-time-savings-but-reviewing-every-transaction-takes-just-as-long/1823", date: "2026-03-22", access: full, locator: "original post and replies 1-3" }
    - { ref: INTUIT-ACCTTECH-2026, title: "The 2026 Accountant Technology Survey: Turning Data Revelations into a Firm of the Future", publisher: "CPA Practice Advisor (reporting the Intuit QuickBooks survey, n=725, May 2026)", type: survey, url: "https://cpapracticeadvisor.com/2026/07/02/the-2026-accountant-technology-survey-turning-data-revelations-into-a-firm-of-the-future/185807", date: "2026-07-02", access: full, locator: "advisory blockers paragraph (30%)" }
    - { ref: DUALENTRY-BENCH-2026, title: "Accounting AI Benchmark 2026 (leaderboard page, as read 2026-10-20)", publisher: "DualEntry", type: vendor, url: "https://dualentry.com/accounting-ai-benchmark", date: "2026-02-20", access: full, locator: "headline accuracy as read 2026-10-20 (live leaderboard)" }
    - { ref: CFOCOM-DUALENTRY-2026, title: "The best AI model still fails 1 in 5 accounting tasks", publisher: "CFO.com (guest post by DualEntry's CFO)", type: press, url: "https://www.cfo.com/news/the-best-ai-model-still-fails-1-in-5-accounting-tasks-Claude-Opus-OpenAI-GPT/818100/", date: "2026-04-22", access: full, locator: "paragraph on the 79.2% best score" }
    - { ref: CPAPA-XENDOO-2026, title: "Xendoo Buys Botkeeper Infinite; AI Platform Will Remain 'Active and Supported'", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/02/28/xendoo-buys-botkeeper-infinite-ai-platform-will-remain-active-and-supported/179027/", date: "2026-02-28", access: full, locator: "quoted chief-executive note on coding 80%+ of transactions" }
  last_reviewed: "2026-10-21"
  notes: >-
    Grade A rests on the independent Choi and Xie study, by named researchers at Stanford GSB and MIT Sloan, which
    reports measured figures. Limits: it reports associations, the platform is not named, the clients are small and
    mid-sized businesses on that platform rather than a named CAS firm, and only abstracts and university summaries
    were read (the Wiley full text was blocked). Abstract versions differ: the May 2025 working paper gives the figures
    above and the June 2026 journal abstract keeps the findings but not the numbers. Vendor benchmarks (Digits,
    DualEntry, Intuit) would be grade C on their own. Digits' human baseline had no client history and could not ask
    questions, which its own report flags. The DualEntry leaderboard changes: 77.3% top score in March 2026
    (ACCTODAY-DUALENTRY-2026), 79.2% in a 2026-04-22 CFO.com post (CFOCOM-DUALENTRY-2026) and 91.1% on the page read
    2026-10-20 (DUALENTRY-BENCH-2026). Botkeeper's chief executive said its platform coded 80%+ of transactions at 98%
    accuracy (CPAPA-XENDOO-2026), a company claim from a vendor that then announced its closure. Intuit's
    expert-verified auto-categorization sends uncertain items to the business owner, not the accountant
    (CPAPA-INTUITCONNECT-2026). Firm types: unnamed SME platform customers; vendor benchmark; Lincoln Accounting is a
    small two-partner firm. Independence: bookkeeping for the firm's own audit client is restricted; see -24.

- id: advisory-client-accounting-services-02
  title: Bank, card and clearing-account reconciliation by AI matching, with a short exceptions list for the accountant
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, review-assurance]
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Reconciling bank, card and clearing accounts means exporting statements, maintaining fragile matching rules and
    hunting mismatches. Unreconciled legacy balances make cleanups unprofitable to offer (FLOQAST-CASCASE-2026).
  solution: >-
    Matching software ingests statements or feeds, matches transactions without hand-built rules, finalizes clean
    reconciliations and presents a short, prioritized exceptions list. Staff describe matching logic in natural
    language for high-volume clearing accounts. A Top 100 firm's CAS practice uses FloQast AI Transaction Matching
    across clients on QuickBooks Online, Sage Intacct and Xero; Digits offers drag-and-drop bank statement
    reconciliation with an exceptions list.
  outcomes:
    - lever: speed
      description: "Monthly labor on specific project bank reconciliations at an unnamed Top 100 firm's CAS practice."
      figure: "8 hours to 5 hours (37.5%)"
      measures: "Reduction in monthly labor on specific bank reconciliations; the case study says saving up to three hours every month"
      provenance: vendor-published
      source_ref: FLOQAST-CASCASE-2026
    - lever: capacity
      description: "One clearing-account cleanup at the same practice."
      figure: "10,000+ rows in minutes"
      measures: "Rows pulled from a clearing account and matched by AI Transaction Matching in one project, per the CAS manager quoted"
      provenance: vendor-published
      source_ref: FLOQAST-CASCASE-2026
    - lever: speed
      description: "Cash match rate at an in-house finance team that piloted a cash-matching product (enterprise, not a CAS firm)."
      figure: "30% to more than 90%"
      measures: "Match rate of bank transactions against ledger entries at Brex before and after the pilot, as stated in Numeric's funding announcement"
      provenance: vendor-published
      source_ref: CPAPA-NUMERIC-2025
    - lever: capacity
      description: "Foundation case (May 2024; robotic process automation, not generative AI): a Top 25 firm's digital worker took over a client's fund reconciliations."
      figure: "15 hours a week; about 500 hours a year"
      measures: "Client time spent reconciling funds across 70 entities before the digital worker (15 hours a week); a second worker covering 100+ investment statements saves about 500 hours a year, as stated by the firm's AI partner"
      provenance: self-reported
      source_ref: ACCTODAY-USECASE-2024
  prerequisites:
    - "ERP connectors that work across the client mix; the FloQast case firm abandoned an earlier tool after connectors failed (FLOQAST-CASCASE-2026)"
    - "Standard work papers and one reconciliation procedure per balance-sheet account (FLOQAST-CASCASE-2026)"
  risks_and_guardrails:
    - "Vendor match rates are marketing figures until the client's own data reproduces them; build a validation period into the rollout and keep the results (CPAPA-AGENTSCLOSE-2026)."
    - "Statements are messy: duplicates, fees hidden in summaries and sync delays make true mismatches hard to separate from timing differences (DIGITS-BANKREC-2025)."
  human_checkpoints:
    - "Accountant clears the exceptions list"
    - "Job manager reviews and signs off the reconciliation checklist"
  role_evolution: >-
    The FloQast case firm describes staff shifting from manual ticking and tying to client consulting
    (FLOQAST-CASCASE-2026); Heather Taylor, accounting services manager at Hiline, says AI bank reconciliations
    'flipped my role' to reviewing a clean set of exceptions (DIGITS-BANKREC-2025).
  evidence_grade: B
  sources:
    - { ref: FLOQAST-CASCASE-2026, title: "How One CAS Practice Uses FloQast AI Transaction Matching to Scale Client Support (case study PDF)", publisher: "FloQast", type: vendor, url: "https://get.floqast.com/hubfs/Assets/Case%20Studies/FloQast_MillerCooper_CAS_Case_Study_August_2026.pdf", date: "2026-08", access: full, locator: "Results panel; sections 'The Challenge', 'How FloQast Helps', 'The FloQast Difference'" }
    - { ref: CPAPA-NUMERIC-2025, title: "AI Accounting Platform Numeric Raises $51M Series B", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2025/11/20/ai-accounting-platform-numeric-raises-51m-series-b/173638/", date: "2025-11-20", access: full, locator: "paragraphs on cash matching and the Brex controller quote" }
    - { ref: DIGITS-BANKREC-2025, title: "Always Be Closing: Introducing AI Bank Reconciliations", publisher: "Digits", type: vendor, url: "https://digits.com/blog/ai-bank-reconciliations/", date: "2025-11-10", access: full, locator: "sections on drag-and-drop reconciliation, exception list and customer quote (Heather Taylor, Hiline)" }
    - { ref: ACCTODAY-USECASE-2024, title: "Making the use case for AI in accounting", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/making-the-use-case-for-ai-in-accounting", date: "2024-05-06", access: full, locator: "Armanino digital-worker paragraphs" }
    - { ref: CPAPA-AGENTSCLOSE-2026, title: "Before You Let the Agents Run the Close: Five Controls to Put in Writing First", publisher: "CPA Practice Advisor (contributor A. L. Fulmore Sr.)", type: press, url: "https://www.cpapracticeadvisor.com/2026/08/13/before-you-let-the-agents-run-the-close-five-controls-to-put-in-writing-first/", date: "2026-08-13", access: full, locator: "controls 2 and 3" }
  last_reviewed: "2026-10-21"
  notes: >-
    Firm types: the FloQast case is a Top 100 firm the text does not name (the file name indicates Miller Cooper, not
    confirmed in the text); Hiline, quoted by Digits, is a named firm using AI bank reconciliations, without a
    figure; Armanino is a Top 25 firm and its digital workers are RPA, not generative AI; Brex is an in-house
    enterprise team, so the Numeric figure is adjacent to CAS delivery. Grade B rests on Hiline's named use and the
    FloQast case; no figure comes from a named firm's tracked metric. Agent-prepared reconciliation packages (BlackLine Verity
    Prepare) are in -03. Independence: reconciliation and bookkeeping for the firm's own audit client are restricted;
    see -24.

- id: advisory-client-accounting-services-03
  title: Agents prepare the month-end close across a firm's client portfolio, and accountants approve entries and review finished books
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting, review-assurance]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: process
  runtime_class: background-agent
  maturity: in-production
  problem: >-
    CAS capacity is capped by headcount: each close needs categorization, reconciliation, exception handling, journal
    entries and statements for every client, and staff are scarce. A CohnReznick CAS leader says clients expect a close
    in about 10 to 12 days (ACCTODAY-COHNPOD-2026).
  solution: >-
    Agent platforms sit on the firm's existing ledgers and prepare the close: categorization, reconciliation, exception
    handling, journal entries and statements. Pilot's Meridian (released for firms in June 2026) closes books in the
    firm's own ledger and returns review-ready financials. Ramp's Stack (announced June 2026) loads client memory and
    an editable firm procedure ('skill'), proposes a plan, drafts the workpaper and entry, and posts only after a person
    approves. BlackLine's Verity Prepare compiles a reconciliation package with reasoning and a confidence score for
    sign-off. Basis describes long-horizon agents that complete accounting workflows for review. Arclow, an AI-native practice,
    says AI categorizes and reconciles as transactions land and a licensed CPA works the close and confirms it.
    CohnReznick describes a pilot being set up with five to seven clients.
  outcomes:
    - lever: capacity
      description: "Months of books closed on the platform that underlies Meridian (company statement)."
      figure: "199,000 months across more than 8,000 businesses (job posting); 187,000+ months, 8,000+ businesses (June 2026 release)"
      measures: "Client-months of books closed on Pilot's platform since 2017, as stated by Pilot in two places; AI-prepared months are not separated from human-prepared ones, and no accuracy or override rate is published"
      provenance: vendor-published
      source_ref: PILOT-JOBS-2026
    - lever: capacity
      description: "Average time savings reported by firms using Basis agents (company statement on an undated page)."
      figure: "30%"
      measures: "Time savings on average, as stated by Basis and OpenAI; no baseline, sample or method given"
      provenance: vendor-published
      source_ref: OPENAI-BASIS-2026
    - lever: speed
      description: "BlackLine reports early adopters of Verity Prepare cut manual reconciliation preparation time; adopters are not named."
      figure: "up to 92%"
      measures: "Reduction in manual reconciliation preparation time for early adopters (a maximum, not an average; basis and number of adopters not stated)"
      provenance: vendor-published
      source_ref: CPAPA-BLACKLINE-2026
    - lever: capacity
      description: "CohnReznick's CAS leader expects capacity to improve once reconciliation and transactional steps are assisted; an expectation, not a result."
      figure: "50% or even more (expectation)"
      measures: "Leader's expected improvement in CAS team capacity; no denominator"
      provenance: self-reported
      source_ref: ACCTODAY-COHNPOD-2026
    - lever: quality
      description: "Lab test of a frontier model against 12 licensed CPAs (averaging about five and a half years' experience; Mercor calls them junior) on four simulated month-end close tasks."
      figure: "AI 100% on each of 20 attempts; humans generally below 50%"
      measures: "Share of 13 to 22 accountant-written rubric criteria met per task; an LLM grader agreed 98% with hand grading on 8 submissions; tasks removed client context and the ability to ask questions (MERCOR-APEX-2026 for participant experience)"
      provenance: independent
      source_ref: ACCTODAY-AIBENCH-2026
    - lever: quality
      description: "Vendor benchmark of unattended agents closing one real SaaS business's books for a year (mid-2025 models)."
      figure: "within 1% of CPA baselines early; over 15% (about half a million dollars) off after several months"
      measures: "Account balances produced by the model compared with a licensed-accountant baseline (Penrose AccountingBench); revenue was overstated 5-30% even by the best model"
      provenance: vendor-published
      source_ref: PENROSE-ACCTBENCH-2025
  prerequisites:
    - "Clean ledger access and permissions per client; Meridian is described as sitting on the firm's existing ledger with no migration (PILOT-JOBS-2026)"
    - "Firm procedures written down as editable skills or checklists, with firm-level preferences and client-level overrides set before the first close (ACCTODAY-RAMPSTACK-2026; PILOT-JOBS-2026)"
    - "A review layer that shows what the AI did, why, and the few exceptions that need a person (PILOT-JOBS-2026)"
    - "A core tech stack and client base in place; CohnReznick turned to AI after three years building its CAS practice, saying it now had both (ACCTODAY-COHNPOD-2026)"
    - "Clean opening balances: in Penrose's test, agents within 1% after the first month accumulated compounding errors over later months (PENROSE-ACCTBENCH-2025)"
  risks_and_guardrails:
    - "Nothing posts to a client's general ledger without explicit human authorization in Ramp's stated design (ACCTODAY-RAMPSTACK-2026)."
    - "In three of four imperfect AI-assisted sessions in the Mercor study, the AI had the correct figure at some point and it did not reach the final submission (ACCTODAY-AIBENCH-2026)."
    - "Penrose reports models that kept trying until they found a way past the reconciliation checks, even against instructions, and others that gave up or looped (PENROSE-ACCTBENCH-2025)."
    - "COSO distinguishes reliance (management uses only the AI output) from non-reliance (a control owner re-performs); reliance needs ICFR-grade evidence including a documented prompt, configuration and model version (COSO-GENAI-2026, p. 13)."
    - "Vendor viability: Botkeeper announced closure on 9 Feb 2026 and Xendoo bought its Infinite platform weeks later (CPAPA-XENDOO-2026; UKU-BOTKEEPER-2026)."
    - "No independent measurement of production close quality was found; Mercor says its tasks tested what models do best and removed colleagues and client context (MERCOR-APEX-2026)."
  human_checkpoints:
    - "Accountant approves the agent's plan before execution (Ramp Stack)"
    - "Accountant approves drafted entries and workpapers before posting"
    - "Accountant reviews finished books and signs off before client delivery"
    - "Each month's close is reviewed before it becomes the next month's opening position"
  role_evolution: >-
    Pilot's product posting sets success as more clients per accountant and less review time per close
    (PILOT-JOBS-2026). CohnReznick expects senior accountants to move up a layer to more review and client time
    (ACCTODAY-COHNPOD-2026), and a Deloitte contributor expects staff to orchestrate AI-prepared work
    (ACCTODAY-TRENDS-2026). Basis hires CPAs and accountants to define agent rules and behaviours and to write the
    procedures and skills its agents use (BASIS-JOBS-2026).
  evidence_grade: B
  sources:
