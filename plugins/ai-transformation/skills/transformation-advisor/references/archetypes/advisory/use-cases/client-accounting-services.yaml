    Merges two AP candidates (practice C, discourse C) and the governance angle's payment-fraud screening idea (C,
    adjacent survey). Vendors only (BILL, Xero, Tipalti, Ramp); no named firm outcome for AP agents in CAS was found.
    In Intuit's survey 53% list invoicing and payments among top firm-operations uses of AI, which is the firm's own
    billing, not CAS delivery (INTUIT-ACCTTECH-2026). BILL's claim that nearly 90 of the top 100 firms use its platform
    was seen only in a search summary and is not used. Payments-fraud investigation belongs to advisory
    forensic-disputes and control design to risk-controls. Independence: the discourse researcher describes AP and
    payment processing as commonly restricted for audit clients without verifying it; see -24.

- id: advisory-client-accounting-services-11
  title: Payroll preparation with AI-guided workflows, anomaly flags, payroll journal entries and liability tie-out
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, review-assurance, data-reporting]
  pattern: intake-triage
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: >-
    Payroll prep means re-entering hours, reimbursements and deductions that clients send by email and pulling the
    same reports after every run, client by client (ACCTODAY-GUSTO-2026). Payroll journal entries need employer and
    employee cost splits and department allocations, and liabilities must be tied out each period
    (ACCTODAY-RAMPSTACK-2026).
  solution: >-
    Gusto (October 2026) lets accountants run payroll from one firm dashboard; connected email drafts hours,
    reimbursements and deductions, the tool shows what changed since the last run, flags anomalies for review and
    learns which reports the firm pulls. Intuit's Payroll Agent in QuickBooks Workforce collects and validates data,
    flags inconsistencies and can run payroll for the business owner. Ramp says a Stack agent pulls payroll reports,
    computes splits and allocations and drafts the entry for approval; Pilot says its AI ticks and ties payroll
    liabilities.
  outcomes:
    - lever: capacity
      description: "none published"
      figure: "none"
      measures: "No outcome figure in the Gusto, Intuit, Ramp or Pilot announcements"
      provenance: vendor-published
      source_ref: ACCTODAY-GUSTO-2026
  prerequisites:
    - "Clients on the vendor's payroll platform, or connected payroll data"
    - "Documented account mappings for payroll entries"
    - "Mail or document connectors (Outlook, Google Drive and OneDrive were described as coming soon by Gusto)"
  risks_and_guardrails:
    - "Gusto says accountants want AI assistance but not full automation of payroll; the tool flags anomalies instead of pushing them through (ACCTODAY-GUSTO-2026)."
    - "QuickBooks Workforce was to be generally available 'in the coming weeks' from 8 May 2026, with no named customer outcomes (ACCTODAY-QBWORKFORCE-2026)."
    - "Nothing posts without human authorization in Ramp's stated design (ACCTODAY-RAMPSTACK-2026)."
  human_checkpoints:
    - "Accountant reviews flagged anomalies and approves payroll changes"
    - "Accountant approves the payroll entry and workpaper before posting"
  role_evolution: >-
    Gusto says the goal is to put the accountant back in the advising seat and out of report hunting
    (ACCTODAY-GUSTO-2026).
  evidence_grade: C
  sources:
    - { ref: ACCTODAY-GUSTO-2026, title: "Gusto adds accounting firm-centered enhancements to platform, partner program", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/gusto-adds-accounting-firm-centered-enhancements-to-platform-partner-program", date: "2026-10-09", access: full, locator: "paragraphs on AI-guided workflows, Gmail connector, anomaly flagging and multi-client MCP" }
    - { ref: ACCTODAY-QBWORKFORCE-2026, title: "Intuit launches QuickBooks Workforce for HCM, payroll", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/intuit-launches-quickbooks-workforce-for-hcm-payroll", date: "2026-05-08", access: full, locator: "paragraphs on the Payroll Agent and availability" }
    - { ref: ACCTODAY-RAMPSTACK-2026, title: "Ramp launches Stack, made specifically for accounting firms", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/ramp-launches-stack-made-specifically-for-accounting-firms", date: "2026-06-03", access: full, locator: "paragraph 3 and the payroll example in paragraph 9" }
    - { ref: PILOT-AIACCOUNTANT-2026, title: "Pilot Unveils AI Accountant", publisher: "Pilot (company blog)", type: vendor, url: "https://pilot.com/blog/pilot-unveils-ai-accountant-a-major-leap-toward-artificial-general-intelligence-in-accounting", date: "2026-02-04", access: full, locator: "sentence on ticking and tying payroll liabilities" }
    - { ref: JOFA-CASTIPS-2025, title: "Tips for providing the CAS services clients want", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/jul/tips-for-providing-the-cas-services-clients-want/", date: "2025-07-01", access: full, locator: "definition of CAS services (bookkeeping and payroll to CFO-level work)" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges a payroll-preparation candidate (practice C) and a payroll-entry candidate (discourse C). Vendors only; no
    firm deployment named and no AI-specific discussion of running payroll or filing payroll taxes found. Payroll is
    part of the CAS service set (JOFA-CASTIPS-2025). Independence: the independence-pricing research maps payroll-type
    accounting-record services to the SEC's bookkeeping restriction for issuer audit clients; see -24.

- id: advisory-client-accounting-services-12
  title: AI chasing of missing client documents and open transaction questions inside the ledger or portal
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [client-interaction, coordination-scheduling]
  pattern: service-agent-escalation
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: announced
  problem: >-
    Teams spend large amounts of time chasing documents and answers before the real work can start, and close cycles
    stretch when clients are slow: one solo firm says email follow-ups took clients 10 to 12 days to answer
    (ACCTODAY-AITHOUGHT-2026; DIGITS-ELEV8-2026).
  solution: >-
    Transaction questions and answers move into the transaction feed, a collaboration inbox or the ledger, and AI
    handles follow-up chasing for missing documents and open questions, escalating judgment calls to an accountant.
    Intuit says its collaboration inbox lets Intuit Intelligence chase follow-ups automatically; vendor and
    practice-management leaders predict AI will take the first pass at organizing client information, flagging what is
    missing and requesting documents.
  outcomes:
    - lever: speed
      description: "Client response time after a solo firm moved requests into the ledger platform; the sources attribute this to platform collaboration, not specifically to AI."
      figure: "10 to 12 days before; a few business days now"
      measures: "Time clients took to answer bookkeeping follow-ups, per the owner (DIGITS-ELEV8-2026); CPA Practice Advisor's account says delays that used to extend the close by more than a week were cut, without a figure (CPAPA-ELEV8-2026)"
      provenance: vendor-published
      source_ref: DIGITS-ELEV8-2026
  prerequisites:
    - "Client collaboration inside the ledger, portal or practice-management system"
    - "Defined escalation rules"
  risks_and_guardrails:
    - "Intuit's automatic chasing was announced without a stated availability date (CPAPA-INTUITCONNECT-2026)."
    - "No named CAS deployment of AI chasing during close was found; the AI part is an idea discussed by vendors (ACCTODAY-AITHOUGHT-2026)."
  human_checkpoints:
    - "Accountant handles escalations and judgment calls"
  role_evolution: >-
    Karbon's chief executive says far fewer people will spend days pulling information together before work can start
    (ACCTODAY-AITHOUGHT-2026; a prediction). Staff stop writing repeat follow-ups (CPAPA-ELEV8-2026).
  evidence_grade: C
  sources:
    - { ref: ACCTODAY-AITHOUGHT-2026, title: "AI Thought Leaders Survey 2026: Process Predictions", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/list/ai-thought-leaders-survey-2026-process-predictions", date: "2025-12-30", access: full, locator: "paragraphs on preparatory work and the Karbon CEO quote" }
    - { ref: DIGITS-ELEV8-2026, title: "From Bookkeeping Factory to Fractional CFO Firm: How Elev8 Built Big-Firm Output Without Adding Staff", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/elev8-cfo/", date: "2026-07-08", access: full, locator: "paragraph on follow-up emails taking 10 to 12 days before and a few business days now" }
    - { ref: CPAPA-ELEV8-2026, title: "How an AI-Native Accounting Platform Helped One Solo Firm Reclaim 90 Hours a Month and Scale Advisory Without Hiring", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/07/21/how-an-ai-native-accounting-platform-helped-one-solo-firm-reclaim-90-hours-a-month-and-scale-advisory-without-hiring/187093/", date: "2026-07-21", access: full, locator: "section 'Reinventing the Month-End Close', paragraph on client communication" }
    - { ref: CPAPA-INTUITCONNECT-2026, title: "Intuit Connect ON: What You Need to Know About the Latest Platform Innovations", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/06/26/intuit-connect-on-what-you-need-to-know-about-the-latest-platform-innovations/185810/", date: "2026-06-26", access: full, locator: "section 'Intuit Accountant Suite: The Firm's Control Tower'" }
    - { ref: ACCOUNTEX-2026, title: "Accountex London 2026: product roundup", publisher: "Financial Accountant (IFA)", type: press, url: "https://financialaccountant.co.uk/blog/accountex-london-2026-product-roundup/", date: "2026-05-19", access: full, locator: "section 'Intuit QuickBooks' (questions and answers in the transaction feed)" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges an idea (practice D) and a discourse candidate (C). Graded C because the AI-specific contribution is not
    isolated and the only named result is attributed to platform collaboration. For return-season intake chasing, see
    tax-compliance-individual-business-01.

- id: advisory-client-accounting-services-13
  title: Cross-client portfolio view of close status, open tasks and anomalies for CAS managers
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [data-reporting, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: background-agent
  maturity: piloting
  problem: >-
    A CAS manager running dozens of clients cannot easily see which close is late or which client's expenses have
    spiked; one CAS team that grew from 25 to 65 professionals had every manager tracking to-dos differently
    (FLOQAST-CASCASE-2026).
  solution: >-
    A portfolio view shows close status for every client, open tasks and who is working on them; AI summarizes issues
    across the client base, alerts on anomalies and answers cross-client queries such as margin comparisons between
    entities (Intuit Accountant Suite cross-client insights, open beta in June 2026; Ramp's Advisor Console).
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none"
      measures: "Feature descriptions only; beta and announced products"
      provenance: vendor-published
      source_ref: CPAPA-INTUITCONNECT-2026
  prerequisites:
    - "Clients on a single platform or consistent data feeds"
  risks_and_guardrails:
    - "Intuit says every skill run is logged in an audit trail showing when it ran, who triggered it and what changed (CPAPA-INTUITCONNECT-2026; vendor description)."
  human_checkpoints:
    - "Manager decides what to act on"
  role_evolution: >-
    Not described in the sources.
  evidence_grade: C
  sources:
    - { ref: CPAPA-INTUITCONNECT-2026, title: "Intuit Connect ON: What You Need to Know About the Latest Platform Innovations", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/06/26/intuit-connect-on-what-you-need-to-know-about-the-latest-platform-innovations/185810/", date: "2026-06-26", access: full, locator: "section 'Intuit Accountant Suite: The Firm's Control Tower'" }
    - { ref: ACCTODAY-RAMPSTACK-2026, title: "Ramp launches Stack, made specifically for accounting firms", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/ramp-launches-stack-made-specifically-for-accounting-firms", date: "2026-06-03", access: full, locator: "paragraph 5 (Advisor Console)" }
    - { ref: FLOQAST-CASCASE-2026, title: "How One CAS Practice Uses FloQast AI Transaction Matching to Scale Client Support (case study PDF)", publisher: "FloQast", type: vendor, url: "https://get.floqast.com/hubfs/Assets/Case%20Studies/FloQast_MillerCooper_CAS_Case_Study_August_2026.pdf", date: "2026-08", access: full, locator: "section 'The Challenge' (25 to 65 professionals; checklists routed to job managers)" }
  last_reviewed: "2026-10-21"
  notes: >-
    Vendor sources only (Intuit, Ramp); the FloQast case supplies the pain, not an AI monitoring result. See
    professional-services-delivery-management-05 for the firm-operations version of portfolio monitoring.

- id: advisory-client-accounting-services-14
  title: In-house controller automation that scans, summarizes and tickets incoming vendor mail and invoices
  archetype: advisory
  module: client-accounting-services
  function: finance-accounting
  work_types: [transaction-processing, coordination-scheduling]
  pattern: intake-triage
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    A small in-house accounting team was inundated with physical mail: vendor invoices, tax notices and statements
    (JOFA-REALLIFE-2025).
  solution: >-
    The controller of the Capital Area Food Bank built an automation that scans each item, summarizes it with AI,
    opens a ticket in the team's workflow system (Jira) with the summary and the original, and supports status
    look-ups and follow-up actions.
  outcomes:
    - lever: capacity
      description: "Staff time saved per week (controller's estimate, June 2025)."
      figure: "about four hours a week"
      measures: "Total staff time saved per week; the team now handles mail in 20-minute sprints on 'Mail Mondays'; an estimate by the controller"
      provenance: self-reported
      source_ref: JOFA-REALLIFE-2025
  prerequisites:
    - "An existing digital environment and workflow system to receive the output"
    - "Months of earlier work connecting systems and data, plus automation skill"
  risks_and_guardrails:
    - "Depends on one builder's skill; no extra licences were needed (JOFA-REALLIFE-2025)."
  human_checkpoints:
    - "Staff review tickets and act on them"
  role_evolution: >-
    The controller built the automation himself in Microsoft Power Automate, drawing on his own experience with the
    tool (JOFA-REALLIFE-2025).
  evidence_grade: B
  sources:
    - { ref: JOFA-REALLIFE-2025, title: "Real-life ways accountants are using AI", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/jun/real-life-ways-accountants-are-using-ai/", date: "2025-06-01", access: full, locator: "section on Karl Spanbauer, controller of the Capital Area Food Bank" }
  last_reviewed: "2026-10-21"
  notes: >-
    Organization type: in-house finance team at a not-for-profit, not a CAS provider; included because the module
    covers in-house teams. The source is about 16 months old. Controls over firm-built automations are in -22.

- id: advisory-client-accounting-services-15
  title: Offshore and outsourced CAS delivery redesigned around documented processes, AI-enabled workflows and onshore review
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, coordination-scheduling, review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: process
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Early offshoring was a lift-and-shift of the same process to cheaper labor, and firms that outsourced undocumented
    work struggled (ACCTODAY-OUTSOURCING-2026). AI tools add another place where client data can travel outside the
    US or to a related firm (TAXADV-7216-2026).
  solution: >-
    Firms map the as-is process, improve it with automation and AI, and make offshore output a review of work, with
    pods mixing US leads, offshore teams and AI-enabled workflows (CohnReznick; Aprio's CAAS manager posting).
  outcomes:
    - lever: capacity
      description: "Share of responding firms that offshore (2025 AICPA PCPS and CPA.com management survey, as reported)."
      figure: "29%"
      measures: "Share of responding firms that offshore; nearly three-quarters of firms with net client fees of $10 million or more offshore some work"
      provenance: independent
      source_ref: ACCTODAY-OUTSOURCING-2026
    - lever: capacity
      description: "Share of surveyed accounting and bookkeeping professionals who outsourced at least one service."
      figure: "80%; 65% plan to increase"
      measures: "Respondents who outsourced at least one service for the second year in a row, and who plan to increase outsourcing (Intuit survey, n=725)"
      provenance: vendor-published
      source_ref: INTUIT-ACCTTECH-2026
  prerequisites:
    - "Standardized procedures, defined scope and tracked performance metrics (ACCTODAY-OUTSOURCING-2026)"
    - "Documented processes before automation; a commenter says outsourcing forces the documentation AI needs (INTUIT-ACCTTECH-2026)"
    - "An inventory of where client data is processed and by whom"
  risks_and_guardrails:
    - "Outsourcing 'chaos' fails: workflows that live in people's heads do not transfer (ACCTODAY-OUTSOURCING-2026)."
    - "Mid-level roles may become harder to fill if entry-level roles are automated (ACCTODAY-MAVI-2026)."
    - "For tax return information, sharing among US employees of a firm needs no consent, but disclosure outside the US or to a related firm needs client consent with specific wording (TAXADV-7216-2026, citing Rev. Proc. 2013-14). Applying this to AI tools' data location is a question to test, not a stated rule."
  human_checkpoints:
    - "US lead reviews offshore output"
    - "Job manager sign-off"
    - "Consent captured before return information leaves the US or goes to a related entity"
  role_evolution: >-
    CohnReznick's CAS leader says offshore work is moving toward review of work and that upskilling will speed up with
    AI (ACCTODAY-OUTSOURCING-2026). Aprio's CAAS manager posting expects coordination of US leads, offshore teams and
    AI-enabled workflows, with success measured partly by how little client-lead review time pod financials need
    (APRIO-JOB-2026).
  evidence_grade: B
  sources:
    - { ref: ACCTODAY-OUTSOURCING-2026, title: "Making outsourcing work for your accounting firm", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/making-outsourcing-work-for-your-accounting-firm", date: "2026-02-05", access: full, locator: "paragraphs quoting Kane Polakoff (CohnReznick) and the 29% survey figure" }
    - { ref: INTUIT-ACCTTECH-2026, title: "The 2026 Accountant Technology Survey: Turning Data Revelations into a Firm of the Future", publisher: "CPA Practice Advisor (reporting the Intuit QuickBooks survey, n=725, May 2026)", type: survey, url: "https://cpapracticeadvisor.com/2026/07/02/the-2026-accountant-technology-survey-turning-data-revelations-into-a-firm-of-the-future/185807", date: "2026-07-02", access: full, locator: "paragraph on outsourcing as a second engine (80%, 65%)" }
    - { ref: APRIO-JOB-2026, title: "Accounting Manager, Client Accounting & Advisory Services (Aprio, listed on Built In NYC)", publisher: "Aprio via Built In NYC", type: job-posting, url: "https://www.builtinnyc.com/job/accounting-manager-client-accounting-advisory-services/11189037", date: "2026-09-15", access: full, locator: "responsibilities 'Quarterbacking' and 'Process & Delivery Innovation'" }
    - { ref: ACCTODAY-MAVI-2026, title: "MAVI offers AI-aided international financial talent service", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/mavi-offers-ai-aided-offshore-financial-talent-service", date: "2026-09-30", access: full, locator: "paragraphs on mid-level talent shortage" }
    - { ref: TAXADV-7216-2026, title: "Tax ethics and risk management: common questions and answers, part 1", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/tax-ethics-and-risk-management-common-questions-and-answers-part-1/", date: "2026-08-31", access: full, locator: "Sec. 7216 section" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges a practice entry (B) with the governance angle's offshore data-control idea (D), kept here as a guardrail.
    Firm types: CohnReznick is a Top 100 firm; Aprio is a Top 20 firm; MAVI is a talent vendor. No measured effect of AI
    on offshore throughput or quality was found. The AICPA PCPS survey result is reported second-hand. Staffing models
    and offshore talent marketplaces belong to professional-services (professional-services-staffing-resourcing-11).

- id: advisory-client-accounting-services-16
  title: AI-native provider sells autonomous bookkeeping and close direct to small businesses
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting, client-interaction]
  pattern: end-to-end-case-agent
  ladder: delegate
  change_scope: model
  runtime_class: managed-agent-runtime
  maturity: in-production
  problem: >-
    Small businesses and startups pay for bookkeeping that is slow, inconsistent and hard to scale with human staff,
    and book catch-up takes weeks (CPAPA-PILOTAI-2026; the provider's framing).
  solution: >-
    Pilot launched its AI Accountant on 4 Feb 2026 and describes it as fully autonomous: it onboards a business,
    configures systems, closes historical books, handles edge cases and produces statements, with a chat advisor for
    owner questions and a logged audit trail for every transaction and decision.
  outcomes:
    - lever: speed
      description: "Provider's claim for onboarding and closing books."
      figure: "hours, not weeks"
      measures: "Time for a business to be fully onboarded with books closed, as stated by Pilot's chief executive; no sample, baseline or independent test"
      provenance: vendor-published
      source_ref: CPAPA-PILOTAI-2026
    - lever: quality
      description: "Provider's claim that no person is on the normal path."
      figure: "zero human intervention"
      measures: "Pilot's description of the AI Accountant from onboarding to monthly close; not independently tested in anything found"
      provenance: vendor-published
      source_ref: PILOT-AIACCOUNTANT-2026
  prerequisites:
    - "Operating data and process knowledge from years of human-delivered bookkeeping; Pilot says it draws on its work for over 7,000 startups and small businesses (PILOT-AIACCOUNTANT-2026)"
    - "Bank, payroll and billing integrations (ACCTODAY-MERIDIAN-2026)"
  risks_and_guardrails:
    - "Pilot's own releases differ on human involvement: 'zero human intervention' (February 2026), 'minimal human intervention' and a dataset verified by US-based accounting experts (December 2025), and firm review of completed books in Meridian (June 2026) (CPAPA-PILOTAI-2026; CPAPA-PILOTPARTNER-2025; CPAPA-PILOTMERIDIAN-2026)."
    - "The head of an accounting-focused AI consultancy (Edgefield Group) says autonomous bookkeeping 'only works for very constrained, simpler cases' such as single-entity books (ACCTODAY-BIGYEAR-2026)."
    - "In a vendor test general-purpose models alone reached about 79.5% on categorization, so end-to-end autonomy depends on the provider's own specialized system (DIGITS-BENCH-2026)."
    - "Firms and clients are urged to keep their own data exports after Botkeeper's closure (UKU-BOTKEEPER-2026)."
  human_checkpoints:
    - "Business owner reviews flagged items and the audit history"
    - "Pilot says clients can review or adjust transaction-level decisions"
  role_evolution: >-
    Pilot's chief executive says automating repetitive work gives accountants more time for higher-value advisory
    work (CPAPA-PILOTAI-2026).
  evidence_grade: C
  sources:
