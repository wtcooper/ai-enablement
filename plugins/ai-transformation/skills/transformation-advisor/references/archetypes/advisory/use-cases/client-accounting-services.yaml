- id: advisory-client-accounting-services-22
  title: Firm AI policy, approved tools, vendor data terms and change control for firm-built automations in CAS delivery
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling, software-systems]
  pattern: other
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    About one-third of lawyers, accountants and compliance professionals say they use unsanctioned AI tools, only a
    minority of firms have a written AI policy or strategy, and staff can now build their own automations, dashboards
    and apps ('vibe coding') that may not have been reviewed (TR-FOP-2026; KARBON-SOAI-2026; JOFA-CHECKLIST-2026). A tool that searches all client files can pull a figure
    from the wrong client (CPAPA-SETTLE-2026).
  solution: >-
    The firm names an AI lead or committee, keeps a list of approved tools, defines permitted and prohibited uses,
    trains staff and logs in the client file how outputs were verified and who reviewed them. It asks each AI provider
    in writing whether prompts and files are kept and whether models train on customer data, and checks that client
    data is separated so work on one client cannot draw on another's documents. Firm-built agents go through change
    management and run with least-privilege access, activity monitoring and human approval for higher-risk actions.
    For compilation and review work, AI tools sit inside the firm's quality management system.
  outcomes:
    - lever: risk
      description: "Few firms have an AI policy or strategy."
      figure: "21%"
      measures: "Share of surveyed firms with an AI policy or strategy (Karbon, nearly 600 accounting professionals, published 2026-01-23; a vendor survey)"
      provenance: vendor-published
      source_ref: KARBON-SOAI-2026
    - lever: risk
      description: "Few firms are confident they can adapt."
      figure: "16%"
      measures: "Firms 'very confident' they can adapt to AI and automation over the next three years, per the 2025 PCPS National Management of an Accounting Practice survey as cited by the Journal of Accountancy (survey not opened)"
      provenance: independent
      source_ref: JOFA-AIPOLICY-2026
    - lever: risk
      description: "Professionals using AI their organization has not approved (mixed professions, vendor-run)."
      figure: "about one-third"
      measures: "Lawyers, accountants and compliance professionals saying they turn to unsanctioned AI tools (Thomson Reuters Future of Professionals 2026, global survey of 1,800 professionals; the release gives no exact percentage)"
      provenance: vendor-published
      source_ref: TR-FOP-2026
  prerequisites:
    - "Enterprise-grade AI tools with documented data handling"
    - "Training and signed acknowledgements"
    - "A designated person who owns the AI vendor file"
  risks_and_guardrails:
    - "The AICPA says the General Standards Rule has not changed and responsibility for the final work product stays with the member, whether the AI is built in-house or bought; some public AI tools use inputs to train future models (JOFA-ETHAI-2026)."
    - "For tax work, Circular 230 section 10.36 expects firm procedures covering training, secure data handling, accuracy monitoring and vetting of outside AI tools, and the IRS says client data should go only to secure, enterprise-approved AI (IRS-OPR-2026)."
    - "The FTC Safeguards Rule treats a firm completing income tax returns as a financial institution and requires service-provider oversight, a Qualified Individual and an annual written report; it protects individual consumers' information, not business-client data as such (FTC-SAFEGUARDS-2026)."
    - "Anthropic and Microsoft state that commercial products are not used to train their models by default; contracts and plan tiers govern in practice (ANTHROPIC-PRIVACY-2026; MS-COPILOTPRIV-2026)."
    - "A Cherry Bekaert risk partner says reviews should be more rigorous when user-built tools affect multiple clients (JOFA-CHECKLIST-2026)."
    - "SQMS No. 1 took effect 15 Dec 2025 and covers review and compilation work (LINFORD-SQMS-2024, a firm's summary); a law firm's white paper warns that a firm using AI on unverified assumptions or hallucinated authorities may face a due-care claim, compounded if confidential client data is exposed (HEPLER-CPALIAB-2026)."
  human_checkpoints:
    - "AI lead or committee approves tools and use cases"
    - "Vendor file review before a tool is approved and at renewal"
    - "Change-management review before a firm-built tool enters client work"
    - "Spot checks and engagement reviews of AI use"
  role_evolution: >-
    A designated AI lead or committee reviews use cases and handles incidents (JOFA-AIPOLICY-2026). Staff gain the
    ability to build tools, which increases the need for review and ownership (JOFA-CHECKLIST-2026).
  evidence_grade: C
  sources:
    - { ref: KARBON-SOAI-2026, title: "Karbon State of AI in Accounting 2026 Report", publisher: "Karbon Magazine", type: survey, url: "https://karbonhq.com/resources/state-of-ai-accounting-2026", date: "2026-01-23", access: full, locator: "paragraph 2 and highlights" }
    - { ref: JOFA-AIPOLICY-2026, title: "Drafting an AI policy that actually works", publisher: "Journal of Accountancy (Aon)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/jul/drafting-an-ai-policy-that-actually-works/", date: "2026-07-01", access: full, locator: "building blocks; 16% sidebar" }
    - { ref: TR-FOP-2026, title: "Future of Professionals 2026", publisher: "Thomson Reuters", type: survey, url: "https://www.thomsonreuters.com/en/press-releases/2026/june/ai-is-ready-but-firms-are-not-how-falling-behind-on-ai-implementation-is-costing-clients-and-talent", date: "2026-06-22", access: full, locator: "key findings" }
    - { ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "competence and due care, and confidentiality sections" }
    - { ref: IRS-OPR-2026, title: "Issue 2026-19: Introductory Guidelines for Responsible AI Use in Federal Tax Practice", publisher: "IRS Office of Professional Responsibility", type: regulator, url: "https://www.irs.gov/pub/opr-taxpros/issue-number-2026-19-introductory-guidelines-for-responsible-ai-use-in-federal-tax-practice.pdf", date: "2026-06-24", access: full, locator: "Circular 230 section 10.36; item 6; best practices list" }
    - { ref: FTC-SAFEGUARDS-2026, title: "16 CFR Part 314, Standards for Safeguarding Customer Information (current text)", publisher: "Federal Trade Commission via eCFR", type: regulator, url: "https://www.ecfr.gov/current/title-16/chapter-I/subchapter-C/part-314", date: "2026-10-20", access: full, locator: "314.2 financial institution example (viii) and (c)-(d); 314.4(a), (f), (i) (date is access date for the current text)" }
    - { ref: CPAPA-SETTLE-2026, title: "What to Settle Before Client Tax Data Touches AI", publisher: "CPA Practice Advisor (contributor S. de la Fe)", type: press, url: "https://www.cpapracticeadvisor.com/?p=191491", date: "2026-10-12", access: full, locator: "paragraphs on vendor questions and data separation" }
    - { ref: ANTHROPIC-PRIVACY-2026, title: "Is my data used for model training?", publisher: "Anthropic Privacy Center", type: vendor, url: "https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training", date: "2026-08-18", access: full, locator: "commercial products paragraph" }
    - { ref: MS-COPILOTPRIV-2026, title: "Data, Privacy, and Security for Microsoft 365 Copilot", publisher: "Microsoft Learn", type: vendor, url: "https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy", date: "2026-07-09", access: full, locator: "sections on training and stored data (updated 2026-10-08)" }
    - { ref: JOFA-CHECKLIST-2026, title: "New checklist helps CPAs manage AI cyber risks", publisher: "Journal of Accountancy", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/oct/new-checklist-helps-cpas-manage-ai-cyber-risks/", date: "2026-10-01", access: full, locator: "sections 'AI and vibe coding' and 'Data classification and governance'" }
    - { ref: LINFORD-SQMS-2024, title: "AICPA Quality Management Standard (SQMS) No. 1 (and why you should care)", publisher: "Linford and Company", type: firm, url: "https://linfordco.com/blog/aicpa-quality-management-standards-sqms-1/", date: "2024-09-25", access: full, locator: "opening paragraphs" }
    - { ref: HEPLER-CPALIAB-2026, title: "Professional Liability Risks for CPA Firms in 2026", publisher: "HeplerBroom (G. E. Davis)", type: firm, url: "https://heplerbroom.com/wp-content/uploads/2026/06/accounting-malpractice-white-paper-8JY697202.pdf", date: "2026-06", access: full, locator: "Generative AI Risks and Governance sections" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges four governance candidates: firm AI policy and logging (C), no-training contract terms and data segregation
    (D), guardrails for firm-built agents (D) and SQMS No. 1 (D). Grade C rests on survey figures; no firm reports a
    measured result. The IRS guidance applies to a CAS firm only for its tax work; SQMS applies only to compilation,
    review and attest engagements, not plain bookkeeping. The CPA Practice Advisor contributor sells AI implementation
    services. Firm-wide versions of these controls are in professional-services (professional-services-work-production-22,
    professional-services-quality-review-01).

- id: advisory-client-accounting-services-23
  title: AI-use disclosure, client consent and client-imposed AI terms in CAS engagement letters and onboarding
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [client-interaction, document-production]
  pattern: other
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Clients are asking how their data is used by AI, and no federal law or professional standard tells CPAs whether or
    how to disclose generative AI use (JOFA-DISCLOSE-2025). Enterprise clients are also writing AI terms into
    service-provider contracts (ZUELLIG-AIPOLICY-2026).
  solution: >-
    The firm adds AI-use language to engagement letters or a separate consent: what AI is used for, quality-control
    steps before delivery, consent to disclosure of confidential information to third parties and the firm's duty to
    prevent unauthorized release. Where tax return information is involved it considers the section 7216 consent format
    and offers a no-AI path for clients who decline. It keeps an AI governance program it can evidence when a client's
    own AI terms flow down to providers.
  outcomes:
    - lever: risk
      description: "Clients are asking for proof of AI data protection, and few accountants raise it first."
      figure: "three in five; 33%; 49%"
      measures: "Share of surveyed accountants who say clients ask for proof of AI data protection always or frequently; share who proactively explain how AI supports their work; share who address it only when asked (Intuit survey, n=725, May 2026)"
      provenance: vendor-published
      source_ref: INTUIT-ACCTTECH-2026
  prerequisites:
    - "Counsel review of state-law disclosure duties, and a firm AI policy (see -22)"
    - "A way to deliver services without AI for clients who decline, if consent is sought for tax return information"
    - "An AI governance program that can be evidenced to clients, flowed down to subcontractors including offshore partners"
  risks_and_guardrails:
    - "The AICPA ethics article says to ask, before client data goes into an AI system, whether it is confidential client information and whether the client has consented (JOFA-ETHAI-2026)."
    - "California and Utah have laws requiring some disclosure; the JofA liability column suggests the ABA opinion on generative AI as a model, under which consent should be informed and generic engagement-letter boilerplate is not enough (JOFA-DISCLOSE-2025; ABA-FO512-2024)."
    - "IESBA names training, product or technology development, research and benchmarking as uses of client information that need authorization, and lists what to tell the client, preferably in writing (IESBA-TECHREV-2023, 114.3 A3)."
    - "For Form 1040-series information, consent must follow the Rev. Proc. 2013-14 format and be signed separately (TAXADV-7216-2026); the IRS has not said whether sending return information to an AI tool is a disclosure (CPAPA-SETTLE-2026, contributor opinion)."
    - "A Woodard webinar deck offers a sample clause: no confidential client data goes to public or third-party AI systems without written consent, and licensed professionals supervise outputs (WOODARD-ENGLETTERS-2025); it is a sample, not evidence of adoption."
    - "One published client policy (Zuellig Pharma) bars use of the client's data to train, fine-tune, benchmark or test any AI system without written consent, covers indirect AI use and treats AI-generated deliverables as work for hire (ZUELLIG-AIPOLICY-2026)."
  human_checkpoints:
    - "Partner or counsel approves disclosure and consent wording"
    - "Staff check which clients declined before opening files"
    - "Client gives written consent before any AI use of its data beyond service delivery, where its terms require it"
  role_evolution: >-
    Not addressed by the sources.
  evidence_grade: C
  sources:
    - { ref: INTUIT-ACCTTECH-2026, title: "The 2026 Accountant Technology Survey: Turning Data Revelations into a Firm of the Future", publisher: "CPA Practice Advisor (reporting the Intuit QuickBooks survey, n=725, May 2026)", type: survey, url: "https://cpapracticeadvisor.com/2026/07/02/the-2026-accountant-technology-survey-turning-data-revelations-into-a-firm-of-the-future/185807", date: "2026-07-02", access: full, locator: "section 'Trust and Transparency'" }
    - { ref: JOFA-DISCLOSE-2025, title: "Should I disclose my use of gen AI to clients?", publisher: "Journal of Accountancy (professional liability spotlight)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/apr/should-i-disclose-my-use-of-gen-ai-to-clients/", date: "2025-04-01", access: full, locator: "first and later paragraphs" }
    - { ref: ABA-FO512-2024, title: "Formal Opinion 512, Generative Artificial Intelligence Tools", publisher: "American Bar Association", type: professional-body, url: "https://www.americanbar.org/content/dam/aba/administrative/professional_responsibility/ethics-opinions/aba-formal-opinion-512.pdf", date: "2024-07-29", access: search-only, locator: "as quoted in JOFA-DISCLOSE-2025 (primary PDF blocked)" }
    - { ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "confidentiality section" }
    - { ref: IESBA-TECHREV-2023, title: "Final Pronouncement: Technology-related Revisions to the Code (updated May 30, 2023)", publisher: "IESBA", type: standard-setter, url: "https://www.ethicsboard.org/publications/final-pronouncement-technology-related-revisions-code", date: "2023-04-11", access: full, locator: "R114.1(d), 114.3 A3" }
    - { ref: TAXADV-7216-2026, title: "Tax ethics and risk management: common questions and answers, part 1", publisher: "The Tax Adviser (AICPA)", type: professional-body, url: "https://www.thetaxadviser.com/issues/2026/aug/tax-ethics-and-risk-management-common-questions-and-answers-part-1/", date: "2026-08-31", access: full, locator: "Sec. 7216 section" }
    - { ref: CPAPA-SETTLE-2026, title: "What to Settle Before Client Tax Data Touches AI", publisher: "CPA Practice Advisor (contributor S. de la Fe)", type: press, url: "https://www.cpapracticeadvisor.com/?p=191491", date: "2026-10-12", access: full, locator: "paragraphs on 7216 consent" }
    - { ref: WOODARD-ENGLETTERS-2025, title: "Future Ready Engagement Letters (webinar deck)", publisher: "Woodard", type: firm, url: "https://www.woodard.com/hubfs/Future_Ready_Engagement_Letters_Oct2025.pdf", date: "2025-10", access: full, locator: "slide 'AI Disclosure and Consent Clause'" }
    - { ref: ZUELLIG-AIPOLICY-2026, title: "AI Policy for Service Providers/Consultants (version 2025.12.15)", publisher: "Zuellig Pharma", type: firm, url: "https://edge.sitecorecloud.io/zuelligphar3c90-zpcms-prod-4532/media/Project/Corporate/Policy/Zuellig-Pharma--AI-Policy-for-Service-Providers-Consultants---25022026.pdf", date: "2026-02", access: full, locator: "sections 1 and 3" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges a governance candidate on disclosure and consent (C) with one on client-imposed AI policies (B, but
    adjacent: Zuellig Pharma is a healthcare distributor and nothing links its policy to accounting providers). Graded C
    because no CAS firm reports adopting a consent process. The 7216 point applies only to tax return information, not
    bookkeeping data. The ABA opinion is a legal-profession analog cited through the Journal of Accountancy. Related
    entries: professional-services-client-development-16, professional-services-acceptance-risk-11,
    assurance-acceptance-independence-11 and tax-compliance-individual-business-21.

- id: advisory-client-accounting-services-24
  title: Independence and data-custody screening before a firm sells AI-enabled CAS to its own attest clients (idea)
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: intake-triage
  ladder: assist
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Firms that audit some clients and also provide CAS or AI-related nonattest services must decide which services can
    be provided to attest clients without impairing independence. Restrictions follow the client, not the service
    line: the same bookkeeping service can be sold freely to a client the firm does not audit (SEC-RULE2-01-2026).
  solution: >-
    Idea built from the rules and guidance read. Before offering an AI-enabled service to an attest client, including
    developing or hosting an AI system or running the client's books in a firm-hosted AI environment, the firm checks
    the client's attest status and regime (SEC issuer, private company under the AICPA Code, IESBA public interest
    entity), applies the nonattest and information-system rules, and where the Code is silent uses the conceptual
    framework: identify threats, evaluate significance, apply safeguards, document (JOFA-ETHAI-2026). Independence
    monitoring is built into client intake rather than left to engagement teams.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none"
      measures: "No measurements; the sources state requirements"
      provenance: self-reported
      source_ref: JOFA-ETHAI-2026
  prerequisites:
    - "A client list with attest status and regime"
    - "An ethics or independence review step in the sales and engagement-acceptance process"
  risks_and_guardrails:
    - "SEC Rule 2-01(c)(4) lists non-audit services that impair independence for issuer audit clients, including bookkeeping and related accounting-record services and financial information system design and implementation; several carry an exception only when the results will not be subject to audit procedures (SEC-RULE2-01-2026)."
    - "SEC staff FAQs say a prohibited service is presumed to be subject to audit procedures, that providing accounting and financial-statement templates can count as participating closely, and that there is no cure for prohibited services in a prior period (PWC-SECFAQ-2019)."
    - "The SEC staff treated licensing a tax-software module that generates accrual and disclosure information to an audit client as prohibited financial-system design; whether a firm-built agent that drafts entries or variance explanations falls under this reasoning has not been addressed (PWC-SECFAQ-2019)."
    - "The AICPA Code permits nonattest services when threats are acceptable and the client assumes management responsibilities, oversees the service through a suitably skilled person and accepts the results, documented in writing beforehand (JOFA-NONATTEST-2016, a 2016 description of ET 1.295)."
    - "The AICPA says developing or hosting an AI system for an attest client can raise independence concerns (JOFA-ETHAI-2026)."
    - "The IESBA Code allows bookkeeping for a non-PIE audit client only if routine or mechanical, assesses automated services by what the technology does, and treats hosting or storing an audit client's data as assuming a management responsibility (IESBA-TECHREV-2023, R601.5, 606.3 A1)."
    - "Contingent fees on any service to an issuer audit client impair independence (SEC-RULE2-01-2026, (c)(5))."
    - "Firm structure is moving: with KKR's investment closed, Crowe LLP keeps attest services while Crowe Advisory LLC provides tax, advisory and other non-attest services, and Crowe says some services may not be available to attest clients (CROWE-KKR-2026); the AICPA ethics committee agreed in August 2026 to continue discussing a second exposure draft on alternative practice structures at an interim October meeting (JOFA-PEEC-2026)."
  human_checkpoints:
    - "Ethics or independence partner review before engagement acceptance or a new service"
    - "Client's suitably skilled person accepts management responsibility for the service in writing"
  role_evolution: >-
    Not addressed by the sources. A 2016 JofA article describes a firm whose billing system required an engagement
    to be entered in the independence monitoring system before a client number was assigned (JOFA-NONATTEST-2016).
  evidence_grade: D
