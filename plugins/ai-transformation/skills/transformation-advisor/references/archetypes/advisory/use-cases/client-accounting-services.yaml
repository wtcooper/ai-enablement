    Idea (grade D): a compliance step, not a measured practice. Built from the governance candidate on independence
    screening and the independence-pricing research. This is the independence flag for the module: CAS bookkeeping,
    payroll-type record services and system work for the firm's own audit clients are the restricted case. The AICPA
    Code text (ET 1.295) and IESBA sections other than the technology revisions were not opened, so the private-company
    treatment rests on secondary descriptions; confirm before advising. Reading IESBA's hosting paragraph together with
    the AICPA's warning on hosting AI is the researchers' reading, not an authoritative interpretation. Related entries:
    assurance-acceptance-independence-15 (permissibility gate for AI services to audit clients), -16 (APS due
    diligence) and professional-services-firm-finance-15 (PE capital and attest separation).
