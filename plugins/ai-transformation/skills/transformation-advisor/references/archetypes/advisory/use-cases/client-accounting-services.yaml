- id: advisory-client-accounting-services-21
  title: "Control package before agents touch a client's production close: inventory and owner, validation, risk-tiered review gates, reviewer calibration, SOC mapping and exit thresholds (idea)"
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [review-assurance, coordination-scheduling]
  pattern: monitor-diagnose-act
  ladder: assist
  change_scope: process
  runtime_class: shared-team-skills
  maturity: emerging
  problem: >-
    Vendor accuracy claims are not comparable and benchmark vendors say no standard exists for task-level failure
    rates (CFOCOM-DUALENTRY-2026). Agents appear without being listed or owned, uniform review wastes time on low-risk
    matches and under-reviews judgment-heavy estimates, and juniors are more likely to accept AI output flagged as
    uncertain (CPAPA-AGENTSCLOSE-2026; STANFORD-INSIGHTS-2025).
  solution: >-
    Idea set out by a practitioner article and COSO guidance. Before an agent touches a production close, the CAS firm
    puts five controls in writing: an inventory of agents, each with one named owner and the accounts, data and
    assertions it touches; replayable evidence (inputs, steps, exceptions, basis for each match); human sign-off gates
    scaled to materiality and judgment, with auto-posting only above a validated confidence threshold and
    configuration rights separated from approval rights; a read of each vendor's SOC report for what it covers, with
    gaps filled by contract terms and complementary controls; and monitoring with an exit threshold at which the
    agent is pulled. A validation period on the client's own data comes first. Low-confidence items go to experienced
    reviewers, and staff are trained on automation, overconfidence and anchoring bias.
  outcomes:
    - lever: risk
      description: "none published"
      figure: "none"
      measures: "No firm has published results for these controls. COSO lists illustrative metrics: percentage of auto-posted transactions within tolerance, exception aging time, reversal and override rates"
      provenance: self-reported
      source_ref: COSO-GENAI-2026
  prerequisites:
    - "A named control owner and baseline metrics agreed before go-live"
    - "Logging of agent inputs, steps and exceptions"
    - "Confidence scores visible to reviewers, and experienced reviewers available"
    - "Access to vendor SOC reports and contract leverage"
  risks_and_guardrails:
    - "COSO control examples for automated posting: validated confidence thresholds, exception queues with context, locked configurations with multi-party approval for changes, and full audit trails for unattended postings (COSO-GENAI-2026, p. 24)."
    - "Reliance on AI output (approving postings on the AI output alone) needs ICFR-grade evidence; COSO's taxonomy has eight AI capability types, each with minimum control expectations (COSO-GENAI-2026, p. 13; JOFA-COSO-2026)."
    - "Accuracy varies by task and over time: DualEntry's leaderboard showed higher scores on transaction classification than on accounts receivable and month-end close, and Penrose found errors compounding across months (DUALENTRY-BENCH-2026; PENROSE-ACCTBENCH-2025)."
    - "Sources conflict on SOC guidance: an August 2026 article said the AICPA had no AI-specific SOC guidance; the Journal of Accountancy reported on 13 Oct 2026 that the AICPA had issued guidance earlier in 2026 on service organizations' AI use in SOC 1 and SOC 2 engagements (CPAPA-AGENTSCLOSE-2026; JOFA-AIPA-2026)."
    - "On 19 Oct 2026 the AICPA and AIUC announced a joint SOC 2 plus AIUC-1 engagement for AI systems, with multiple CPA firms already delivering it and full launch expected in early 2027 (JOFA-AIUC-2026); this is assurance over a vendor's AI, not guidance for the CAS firm."
    - "Seniors intervened when AI confidence dropped while juniors accepted uncertain output more and gained less (STANFORD-INSIGHTS-2025); an NBER study of customer support found the opposite, with novices gaining most, so the pattern may depend on the task (NBER-GENAIWORK-2023)."
    - "Products already ship pieces of this: locked-period review queues for agent writes (DIGITS-WRITEMCP-2026) and a logged audit trail of every skill run (CPAPA-INTUITCONNECT-2026)."
  human_checkpoints:
    - "Named owner signs off when an agent is added, changed or retired"
    - "Named reviewer at each gate in the close checklist; experienced reviewer on low-confidence items"
    - "Multi-party approval of any threshold or configuration change"
    - "A named person authorized to pull the agent from the workflow"
    - "Periodic manual re-performance of reconciliations"
  role_evolution: >-
    A control-owner role for each agent is proposed (CPAPA-AGENTSCLOSE-2026, control 1). Reviewers move from checking
    every item to reviewing exceptions and judgment items, with configuration authority separated from review
    authority (COSO-GENAI-2026, p. 24). Experience becomes more valuable as reviewers calibrate against AI confidence
    (STANFORD-INSIGHTS-2025).
  evidence_grade: D
  sources:
