- id: advisory-client-accounting-services-04
  title: Staff accountants book entries and reconcile through a general AI assistant connected to the ledger, with locked-period approval
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Booking entries and reconciling a quarterly close by hand takes hours (about seven for two clients at one
    practice), and an agent that writes to the ledger needs controls that closed-period pop-ups and passwords do not
    give (DIGITS-WRITEMCP-2026).
  solution: >-
    Accountants use a general assistant connected to the ledger through an agent connector (Digits' Write MCP,
    shipped 13 Oct 2026). Writes apply in open periods and are queued for manager approval in locked periods; agents
    work within the user's permissions.
  outcomes:
    - lever: speed
      description: "One AI-native practice's account of two client quarterly closes."
      figure: "about 7 hours by hand vs 1 hour 40 minutes"
      measures: "Time for one staff accountant to book entries and reconcile Q3 closes for two clients (one SaaS, one e-commerce), by hand versus through the assistant; a recollection quoted by the vendor, not a tracked metric"
      provenance: vendor-published
      source_ref: DIGITS-WRITEMCP-2026
  prerequisites:
    - "A ledger that allows agent writes with period-lock controls (DIGITS-WRITEMCP-2026)"
    - "Role-based permissions that agents inherit"
  risks_and_guardrails:
    - "An agent that writes to the ledger touches the system of record; closed-period passwords and pop-ups do not stop an agent, so changes need a proposal-and-review queue (DIGITS-WRITEMCP-2026)."
    - "In the Mercor lab study, people using an assistant took about 15 times longer than the model alone and sometimes overrode a correct AI answer (ACCTODAY-AIBENCH-2026)."
  human_checkpoints:
    - "Manager approves queued changes to locked periods"
    - "A licensed CPA works and confirms every close at Arclow (ARCLOW-SITE-2026; DIGITS-WRITEMCP-2026)"
  role_evolution: >-
    A staff accountant runs the closes through the assistant, while admins and managers lock periods and approve
    queued changes (DIGITS-WRITEMCP-2026).
  evidence_grade: B
  sources:
    - { ref: DIGITS-WRITEMCP-2026, title: "Agentic Accounting With Confidence: Introducing Write MCP and Locked Period Controls", publisher: "Digits", type: vendor, url: "https://digits.com/blog/write-mcp/", date: "2026-10-13", access: full, locator: "paragraphs on Write MCP, Locked Periods and the Arclow staff accountant" }
    - { ref: ARCLOW-SITE-2026, title: "Arclow home page (AI-native accounting practice)", publisher: "Arclow", type: firm, url: "https://arclow.com", date: "2026-10-20", access: full, locator: "hero text on CPA review (page undated; access date)" }
    - { ref: ACCTODAY-AIBENCH-2026, title: "AI beats human accountants at monthly close, transaction categorization", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/ai-beats-human-accountants-at-monthly-close-transaction-categorization", date: "2026-10-16", access: full, locator: "paragraphs on human-with-AI sessions" }
  last_reviewed: "2026-10-21"
  notes: >-
    Firm type: AI-native practice (Arclow) and vendor (Digits). Distinct from -03: here the accountant drives each step
    through an assistant rather than reviewing work an agent platform prepared. Independence: see -24.

- id: advisory-client-accounting-services-05
  title: Continuous close and automated monthly packages on an AI-native ledger (solo fractional-CFO firm)
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting, document-production]
  pattern: other
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    A small firm spent most of each month producing financials: exporting trial balances, cleaning data, formatting
    statements and PDFs and emailing them client by client, and every new bookkeeping client added production work
    (CPAPA-ELEV8-2026; DIGITS-ELEV8-2026).
  solution: >-
    Elev8 CFO moved its clients to an AI-native ledger (Digits) with real-time transaction visibility and client
    collaboration inside the platform, and built a pipeline on the ledger's API that generates and delivers branded
    statements to each client every month. Year-to-date financials became available at any point in the month
    rather than only after month-end, and freed time went to advisory and marketing.
  outcomes:
    - lever: speed
      description: "Monthly close cycle for the firm's clients."
      figure: "18 days to 5 days"
      measures: "Owner's reported close cycle at the first full month-end after migrating 27 clients; he says he is confident he could close all 27 within two days if he needs to review"
      provenance: self-reported
      source_ref: CPAPA-ELEV8-2026
    - lever: capacity
      description: "Monthly hours on bookkeeping and financial-statement production for a solo owner with 37 client engagements and no staff accountant."
      figure: "about 108 hours to about 20"
      measures: "Owner's estimate of hours each reporting cycle; both sources say 'approximately' or 'roughly' and show no time log"
      provenance: vendor-published
      source_ref: DIGITS-ELEV8-2026
    - lever: experience
      description: "Clients on automated reporting and self-service dashboards."
      figure: "27 on automated monthly reporting; 10 on self-service dashboards"
      measures: "Counts of the firm's migrated clients, per the owner"
      provenance: self-reported
      source_ref: CPAPA-ELEV8-2026
  prerequisites:
    - "Programmatic (API) access to ledger statements and report templates"
    - "Migration of balances, charts of accounts, payroll connections and bank feeds (see -09)"
    - "A small starting cohort"
  risks_and_guardrails:
    - "Owner's advice: start with five clients, run one parallel close, and confirm the numbers reconcile before cut-over (CPAPA-ELEV8-2026)."
    - "The owner says he can 'completely leave the bookkeeping duties to the system' and comes back to review when needed; neither source describes a fixed review step before statements are released (CPAPA-ELEV8-2026; DIGITS-ELEV8-2026)."
    - "The evidence is one solo firm's approximate figures, with no time log shown (CPAPA-ELEV8-2026; DIGITS-ELEV8-2026)."
  human_checkpoints:
    - "Parallel close on a starter cohort before cut-over"
    - "Owner review when needed; a review gate before automated release is not described in the sources"
  role_evolution: >-
    The owner says the practice moved from a 'bookkeeping factory' to advisory and fractional CFO work without hiring
    staff accountants, and that he now interprets data for clients rather than doing bookkeeping (DIGITS-ELEV8-2026;
    CPAPA-ELEV8-2026).
  evidence_grade: B
  sources:
    - { ref: CPAPA-ELEV8-2026, title: "How an AI-Native Accounting Platform Helped One Solo Firm Reclaim 90 Hours a Month and Scale Advisory Without Hiring", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/07/21/how-an-ai-native-accounting-platform-helped-one-solo-firm-reclaim-90-hours-a-month-and-scale-advisory-without-hiring/187093/", date: "2026-07-21", access: full, locator: "sections 'Reinventing the Month-End Close', 'Building a Scalable Reporting Process', 'What Saving 90 Hours Made Possible'" }
    - { ref: DIGITS-ELEV8-2026, title: "From Bookkeeping Factory to Fractional CFO Firm: How Elev8 Built Big-Firm Output Without Adding Staff", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/elev8-cfo/", date: "2026-07-08", access: full, locator: "paragraphs on 108 hours across 18 days and the Digits Connect API reporting pipeline" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges three candidates about the same firm and change (continuous close; automated package; branded statement
    distribution). Pattern is 'other': a continuous close on an AI-native ledger with API-driven reporting, mostly
    automation rather than generative AI; a candidate new pattern ('continuous close'). Firm type: small solo firm (Elev8
    CFO and Elevate Tax & Accounting, El Paso), not mid-market. The CPA Practice Advisor article reads as a vendor case
    study and sponsorship is not stated; both sources rest on the owner's estimates, so B not A.

- id: advisory-client-accounting-services-06
  title: AI-assisted live dashboards, variance explanations and management reporting as the CAS advisory layer
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [data-reporting, document-production, client-interaction]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: in-production
  problem: >-
    Static month-end packages arrive late, commentary is added late in the cycle, and building dashboards and
    explaining movements takes accountant time that routine bookkeeping crowds out (JOFA-CASAI-2026;
    ACCTODAY-CASKEYS-2026).
  solution: >-
    Accountants use ledger-connected dashboards and assistants to spot unusual movements, drill into drivers, draft
    variance explanations and walk clients through live financials in meetings. A JofA guide names reporting tools
    that generate the package and draft commentary from variances, trends and KPIs for staff to review; no named firm
    reports using that drafting step. Small firms on Digits describe drill-down, an assistant (Ask Digits) and
    screen-sharing live financials in client meetings, and Bonadio says it has incorporated AI and automation into a
    CAS offering that includes financial reporting and key metrics for business owners.
  outcomes:
    - lever: experience
      description: "none measured"
      figure: "none"
      measures: "No tracked figure; Withum's advisory leader says real-time dashboards are how a CAS practice differentiates and that a model could find a variance and 'probably' explain it (a statement, not a measurement)"
      provenance: self-reported
      source_ref: ACCTODAY-CASKEYS-2026
  prerequisites:
    - "Clean, current categorized ledger data"
    - "Agreed client KPIs"
    - "Dashboard and assistant connected to the ledger"
    - "A review step before client delivery"
  risks_and_guardrails:
    - "Withum's advisory leader says a model could find a variance 'and probably come up with an explanation for it' (ACCTODAY-CASKEYS-2026); the sources do not describe how firms check those explanations."
    - "Over-automating without oversight can miss categorization errors or misread context, especially in client-facing content (JOFA-CASAI-2026)."
    - "A Xero adviser says small business owners cannot easily verify what AI tells them, so an accountant must check explanations in context (CFODIVE-XERO-2026)."
    - "COSO lists judgment, forecasting and insight generation as an AI capability with its own control considerations (COSO-GENAI-2026, p. 14); the AICPA warns of automation, overconfidence and anchoring bias when reviewing AI output (JOFA-ETHAI-2026)."
  human_checkpoints:
    - "Accountant confirms each variance explanation against source records before it reaches the client"
    - "Manager reviews commentary before delivery"
  role_evolution: >-
    Bonadio's outsourced accounting leader says that with AI helping to get better data, the practice is 'the
    quarterback between advisory and compliance' (ACCTODAY-BONADIO-2026). Aprio's CAAS manager posting lists KPI
    dashboards and board-ready reporting narratives as duties (APRIO-JOB-2026).
  evidence_grade: B
  sources:
    - { ref: ACCTODAY-CASKEYS-2026, title: "CAS delivers 'the keys to the kingdom'", publisher: "Accounting Today (Firm Growth Forum keynote report, Jim Bourke, Withum)", type: press, url: "https://www.accountingtoday.com/news/cas-delivers-the-keys-to-the-kingdom", date: "2026-05-22", access: full, locator: "section 'AI in CAS'" }
    - { ref: ACCTODAY-BONADIO-2026, title: "CAS and outsourced accounting fuel Bonadio Group", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/cas-and-outsourced-accounting-fuel-bonadio-group", date: "2026-07-30", access: full, locator: "paragraphs 5-7 (Genovese quotes)" }
    - { ref: DIGITS-LINCOLN-2026, title: "How Lincoln Accounting Reclaimed 30+ Hours a Month by Switching to Digits", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/lincoln-accounting/", date: "2026-09-02", access: full, locator: "paragraphs on live reporting, drill-down and Ask Digits" }
    - { ref: DIGITS-TFMA-2026, title: "How TFMA LLC Improved Workflow Efficiency by 70% with Digits", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/how-tfma-llc-improved-workflow-efficiency-by-70-with-digits/", date: "2026-04-20", access: full, locator: "paragraphs on screen-sharing live financials in client meetings" }
    - { ref: JOFA-CASAI-2026, title: "Simple but effective AI use cases for CAS (Polakoff and Voyer, CohnReznick)", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/jan/simple-but-effective-ai-use-cases-for-cas/", date: "2026-01-01", access: full, locator: "use-case category 'Reporting' and 'Common pitfalls'" }
    - { ref: CFODIVE-XERO-2026, title: "Xero: Leaning on fractional CFOs for strategic finance", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/xero-leaning-fractional-cfos-strategic-finance/809896/", date: "2026-01-16", access: full, locator: "paragraph on verifying AI output" }
    - { ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://auditoresinternos.es/wp-content/uploads/2026/02/Achieving-Effective-Internal-Control-Over-Generative-AI_COSO_compressed.pdf", date: "2026-02", access: full, locator: "p. 14" }
    - { ref: JOFA-ETHAI-2026, title: "Accounting ethics in the age of AI", publisher: "Journal of Accountancy (AICPA Professional Ethics Division)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/aug/accounting-ethics-in-the-age-of-ai/", date: "2026-08-05", access: full, locator: "human in the loop section" }
    - { ref: APRIO-JOB-2026, title: "Accounting Manager, Client Accounting & Advisory Services (Aprio, listed on Built In NYC)", publisher: "Aprio via Built In NYC", type: job-posting, url: "https://www.builtinnyc.com/job/accounting-manager-client-accounting-advisory-services/11189037", date: "2026-09-15", access: full, locator: "responsibilities: KPI dashboards, board-ready reporting narratives" }
    - { ref: ACCTODAY-XEROAI-2026, title: "Xero aims to make AI core to platform functionality", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/xero-aims-to-make-ai-core-to-platform-functionality", date: "2026-03-16", access: full, locator: "paragraph on JAX use rising 61% in three months" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges three candidates (practice B, discourse B, governance D). Firm types: Withum is a Top 100 firm; Bonadio is
    a Top 50 firm; Lincoln Accounting and TFMA are small firms; Aprio is a Top 20 firm (the posting asks for AI-enabled
    delivery methodologies but does not say AI produces the dashboards). Grade B rests on Bonadio's and the small
    firms' named, described use of AI-assisted reporting; none reports AI-drafted commentary. The Withum quote is general ('think how quickly Claude or ChatGPT could find a variance') and
    on its own would be D. Xero says use of its JAX assistant rose 61% in three months, measure not defined
    (ACCTODAY-XEROAI-2026). CohnReznick's JofA article names reporting tools such as Reach Reporting, Qvinci and
    Spotlight Reporting as tool guidance. Independence: see -24.

- id: advisory-client-accounting-services-07
  title: Cash-flow forecasts, budgets, scenario planning and on-demand finance answers built from live ledger data
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [data-reporting, expert-judgment, client-interaction]
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Fractional CFO and CAS clients want forward-looking cash-flow and budget views, not a historical package, and
    those take time to assemble from spend and cash data; advisory capacity is limited by data cleanup and staffing
    (INTUIT-ACCTTECH-2026).
  solution: >-
    Armanino built a 13-week cash-flow tool on robotic process automation, not generative AI, that analyses spending
    and cash-flow data to project a client's cash position over a quarter (2024). Digits says firms now use a general assistant on ledger data to
    build 13-week forecasts, a 2026 budget and budget-versus-actual reports. Platform vendors are adding conversational
    answers grounded in the client's own ledger, AI cash-flow forecasts benchmarked against similar businesses and
    scenario modeling (Intuit, announced for late July 2026; Pilot's on-demand financial insights). CohnReznick's CAS
    leader expects AI to produce a 'script' of insights and benchmark data for advisory conversations later.
  outcomes:
    - lever: experience
      description: "Armanino reports client demand for its 13-week cash-flow tool; no figure given."
      figure: "none"
      measures: "Qualitative statement: the tool 'has proven very popular with clients' (reporter's paraphrase of Armanino's AI leader)"
      provenance: self-reported
      source_ref: ACCTODAY-USECASE-2024
    - lever: growth
      description: "Financial forecasting as a top client-service use of AI among surveyed professionals."
      figure: "51%"
      measures: "Respondents listing financial forecasting among top client-service uses of AI (Intuit survey, n=725, May 2026); the article does not say whether the base is all respondents or AI users"
      provenance: vendor-published
      source_ref: INTUIT-ACCTTECH-2026
  prerequisites:
    - "Clean, categorized spend and cash data"
    - "Client permission for AI use on their data"
    - "A defined advisory deliverable"
  risks_and_guardrails:
    - "The 2024 Armanino tool uses RPA, not generative AI, and the source is older than the 12-18 month window (ACCTODAY-USECASE-2024)."
    - "The newer forecasting examples come from unnamed firms in a vendor blog (DIGITS-WRITEMCP-2026)."
    - "COSO's control considerations for forecasting include hindsight analysis of forecasts against actual results (COSO-GENAI-2026, p. 14)."
    - "A CohnReznick CAS leader expects the advisory-insight capability to take longer than the transactional steps (ACCTODAY-COHNPOD-2026)."
  human_checkpoints:
    - "Adviser sets and reviews forecast and scenario assumptions before client delivery"
    - "Accountant interprets and presents insights"
  role_evolution: >-
    Aprio's CAAS manager is expected to build budgets, 13-week cash-flow models and scenario analyses, and to develop
    AI-enabled delivery methodologies; the posting does not say AI builds the models (APRIO-JOB-2026). CohnReznick expects staff to hold more analytical and client-conversation
    roles as compliance work automates (ACCTODAY-COHNPOD-2026).
  evidence_grade: B
  sources:
    - { ref: ACCTODAY-USECASE-2024, title: "Making the use case for AI in accounting", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/making-the-use-case-for-ai-in-accounting", date: "2024-05-06", access: full, locator: "Armanino 13 Week Cashflow paragraph (OJ Laos)" }
    - { ref: DIGITS-WRITEMCP-2026, title: "Agentic Accounting With Confidence: Introducing Write MCP and Locked Period Controls", publisher: "Digits", type: vendor, url: "https://digits.com/blog/write-mcp/", date: "2026-10-13", access: full, locator: "paragraph on a 13-week cash-flow forecast, 2026 budget and budget-versus-actual built with Claude" }
    - { ref: CPAPA-INTUITCONNECT-2026, title: "Intuit Connect ON: What You Need to Know About the Latest Platform Innovations", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/06/26/intuit-connect-on-what-you-need-to-know-about-the-latest-platform-innovations/185810/", date: "2026-06-26", access: full, locator: "section 'AI that Actually Knows Your Client's Books'" }
    - { ref: CPAPA-PILOTAI-2026, title: "Pilot Rolls Out Fully Autonomous AI Accountant", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/02/04/pilot-rolls-out-fully-autonomous-ai-accountant/177453/", date: "2026-02-04", access: full, locator: "feature list, 'Financial insights on demand'" }
    - { ref: INTUIT-ACCTTECH-2026, title: "The 2026 Accountant Technology Survey: Turning Data Revelations into a Firm of the Future", publisher: "CPA Practice Advisor (reporting the Intuit QuickBooks survey, n=725, May 2026)", type: survey, url: "https://cpapracticeadvisor.com/2026/07/02/the-2026-accountant-technology-survey-turning-data-revelations-into-a-firm-of-the-future/185807", date: "2026-07-02", access: full, locator: "sections 'Are You a Firm of the Future' and 'Trust and Transparency'" }
    - { ref: ACCTODAY-COHNPOD-2026, title: "The meeting of CAS and AI (On the Air podcast with Kane Polakoff, Intuit-sponsored)", publisher: "Accounting Today", type: podcast, url: "https://www.accountingtoday.com/podcast/at-intuit-sponsored-podcast-03-16", date: "2026-03-16", access: full, locator: "transcript 09:50-10:46 and 11:52-12:41" }
    - { ref: APRIO-JOB-2026, title: "Accounting Manager, Client Accounting & Advisory Services (Aprio, listed on Built In NYC)", publisher: "Aprio via Built In NYC", type: job-posting, url: "https://www.builtinnyc.com/job/accounting-manager-client-accounting-advisory-services/11189037", date: "2026-09-15", access: full, locator: "responsibilities 'Financial Modeling & FP&A'" }
    - { ref: COSO-GENAI-2026, title: "Achieving Effective Internal Control Over Generative AI", publisher: "COSO", type: standard-setter, url: "https://auditoresinternos.es/wp-content/uploads/2026/02/Achieving-Effective-Internal-Control-Over-Generative-AI_COSO_compressed.pdf", date: "2026-02", access: full, locator: "p. 14" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges a practice entry (B; Armanino 2024) and a discourse entry (C; announced client-facing Q&A and forecasts).
    Grade B reflects a named but dated, non-generative deployment; the generative and conversational parts are
    announced, unnamed or Pilot's own provider-side chat advisor. Firm types: Armanino is a Top 25 firm; Intuit and Pilot are vendors; CohnReznick is a Top
    100 firm speaking in the future tense. Wider FP&A, performance improvement and ERP advisory belong to the advisory
    fpa-performance module; this entry keeps only the CFO-services forecast step CAS teams deliver. Independence:
    management functions for the firm's own audit client are restricted; see -24.

- id: advisory-client-accounting-services-08
  title: Fractional CFO and controllership drafting of technical memos and analyses, with retrieval over the firm's past memos
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [document-production, expert-judgment, research-synthesis]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: in-production
  problem: >-
    Fractional CFO and controllership clients ask for technical accounting memos (for example goodwill impairment
    after an acquisition) that take hours to write, and fractional CFOs spend scarce senior time on recurring process
    and oversight of AP and AR (JOFA-REALLIFE-2025; CFODIVE-FRACTIONAL-2026).
  solution: >-
    Eventus Advisory Group turned its library of past memos into a retrieval index behind a memo-generator bot; staff
    get a first draft and a person reviews and corrects it. A San Diego fractional CFO uses AI to draft technical
    memos, speed the AP and AR invoicing work he oversees, and show clients how to build dashboards and drill into
    data with tools such as Claude.
  outcomes:
    - lever: speed
      description: "Time per accounting memo, as estimated by the firm's head of AI research (June 2025)."
      figure: "4 hours to 30 minutes"
      measures: "Estimated time for an accounting memo including careful human review; the builder's estimate, not a tracked metric; the build took about 60 hours"
      provenance: self-reported
      source_ref: JOFA-REALLIFE-2025
  prerequisites:
    - "A library of prior memos prepared for retrieval"
    - "In-house technical skill; the builder says many organizations may do better to wait for a vendor product (JOFA-REALLIFE-2025)"
    - "Systems and processes already set up for the client so ongoing work is recurring (CFODIVE-FRACTIONAL-2026)"
  risks_and_guardrails:
    - "Hallucination: the builder tried to remove it with specific instructions and examples, and a person stays in the loop (JOFA-REALLIFE-2025)."
    - "Advanced bots cost several dollars per run (JOFA-REALLIFE-2025)."
    - "The fractional CFO charges hourly, so AI time savings become a pricing question (CFODIVE-FRACTIONAL-2026); see professional-services-scoping-pricing-06."
  human_checkpoints:
    - "A person reviews and corrects every memo draft"
    - "The CFO owns memos and outputs"
  role_evolution: >-
    The fractional CFO calls helping the company adopt and learn AI 'a new responsibility for the CFO' and says AI has
    made clients more comfortable with outsourced finance leadership (CFODIVE-FRACTIONAL-2026).
  evidence_grade: B
  sources:
    - { ref: JOFA-REALLIFE-2025, title: "Real-life ways accountants are using AI", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/jun/real-life-ways-accountants-are-using-ai/", date: "2025-06-01", access: full, locator: "section on Glenn Hopper, Eventus Advisory Group (payoff, difficulty, cost)" }
    - { ref: CFODIVE-FRACTIONAL-2026, title: "Fractional CFOs see demand surge in AI age", publisher: "CFO Dive", type: press, url: "https://www.cfodive.com/news/fractional-cfos-see-demand-surge-ai-age/827264/", date: "2026-08-06", access: full, locator: "sections 'AI opens gates to on-demand talent' and 'An AI-enabled finance future' (Jason Hope)" }
  last_reviewed: "2026-10-21"
  notes: >-
    Firm types: Eventus Advisory Group is a mid-market advisory firm serving private and small-to-midsize public
    companies with fractional CFO and controllership work; Hope Financial Consulting is a small San Diego boutique.
    The JofA source is about 16 months old. Market context, not an outcome of this use case: Business Talent Group
    reports interim C-suite requests up 151% since 2021 and interim CFO demand up 14% year on year
    (CFODIVE-FRACTIONAL-2026; BTG report not opened). Technical memos for the firm's own audit client raise
    independence questions that were not checked; see -24.

- id: advisory-client-accounting-services-09
  title: Onboarding, ledger migration and catch-up cleanup accelerated by AI and sold as discrete or recurring projects
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, data-reporting, client-interaction]
  pattern: bulk-transformation
  ladder: automate
  change_scope: model
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    New clients arrive with years of messy data, duplicates, mispostings and unreconciled periods. Cleanups and
    catch-up took weeks of data entry, were unprofitable for budget-conscious clients and delayed advisory work, and
    migration is often the biggest obstacle to modernizing (DIGITS-TFMA-2026; ACCTODAY-RAMPSTACK-2026;
    FLOQAST-CASCASE-2026; CPAPA-ELEV8-2026).
  solution: >-
    Firms use AI categorization and matching to bring books current in days, and price cleanups as discrete projects
    or recurring quarterly engagements. They migrate clients between ledgers with platform automation and AI-assisted
    workflows. Ramp says Stack agents can audit a client's existing ledger for duplicates, mispostings and
    unreconciled periods and draft correcting entries. An Excel agent following a written procedure ('skill') can
    clean client-provided exports and reconcile them to control totals, logging every change.
  outcomes:
    - lever: speed
      description: "Small firm's cleanup turnaround after adopting an AI ledger."
      figure: "2 to 4 days"
      measures: "The firm now markets bringing books up to date in two to four days; earlier cleanups took weeks (owner, vendor case study)"
      provenance: vendor-published
      source_ref: DIGITS-TFMA-2026
    - lever: capacity
      description: "Solo advisory firm's estimate of bookkeeping workload reduction after adopting an AI ledger."
      figure: "approximately 75%"
      measures: "Reduction in bookkeeping workload, stated as approximate; bookkeeping was roughly 70% of the owner's workload before"
      provenance: vendor-published
      source_ref: DIGITS-ADEPT-2026
    - lever: speed
      description: "Ledger migration at a solo firm."
      figure: "27 clients in about 40 hours"
      measures: "Owner's estimate of hours to migrate balances, charts of accounts, payroll connections and bank feeds for 27 clients; he estimates traditional methods would have taken roughly twice the effort"
      provenance: self-reported
      source_ref: CPAPA-ELEV8-2026
    - lever: growth
      description: "A cleanup turned into a recurring service at a Top 100 CAS practice."
      figure: "one client"
      measures: "A client with seven years of unreconciled clearing-account data asked the firm to make the cleanup a recurring quarterly engagement"
      provenance: vendor-published
      source_ref: FLOQAST-CASCASE-2026
    - lever: speed
      description: "Excel agent demonstration on simulated data (audit setting)."
      figure: "about 10 minutes for 59,157 rows"
      measures: "Average time to clean, validate and reconcile simulated transaction-level ledger data to a trial balance, in the authors' demonstration; the authors say manual methods would take many hours"
      provenance: self-reported
      source_ref: JOFA-EXCELAGENT-2026
  prerequisites:
    - "Client books accessible on an AI-enabled platform or matching tool, and source-system access"
    - "A standard onboarding checklist and a defined, priced project offer"
    - "For agent cleanup: a written skill that preserves the source file, plans before acting and logs every change, tested on a control dataset until it reaches 100% accuracy (JOFA-EXCELAGENT-2026)"
    - "Control totals to reconcile to"
  risks_and_guardrails:
    - "In the FloQast case the AI identified the necessary write-offs; the case study does not say who reviewed or approved them (FLOQAST-CASCASE-2026)."
    - "The Excel-agent authors say the human approval step reduces but does not eliminate the risk of inappropriate data changes (JOFA-EXCELAGENT-2026)."
    - "Migration depends on one vendor: after Botkeeper announced its closure in February 2026, many firms migrated during the roughly three weeks before Xendoo revived the platform (UKU-BOTKEEPER-2026); its chief executive had claimed the platform could clean years of messy data in minutes (CPAPA-XENDOO-2026)."
    - "A JofA guide advises a 30 to 60 day pilot on one workflow, measuring time saved, added review time, error reduction and client feedback (JOFA-CASAI-2026)."
  human_checkpoints:
    - "Accountant approves the cleaning plan before changes"
    - "Accountant reviews write-offs, opening balances and the modifications log"
    - "Reconciliation check against source before go-live (parallel close)"
  role_evolution: >-
    One small-firm owner now runs with one strong bookkeeper instead of several layers of support and shifts time to
    advisory work (DIGITS-TFMA-2026). BST & Co.'s CAS leader advises investing in technology staff; her firm has two
    implementation specialists, each for a different accounting package (JOFA-CASTIPS-2025).
  evidence_grade: B
  sources:
    - { ref: DIGITS-TFMA-2026, title: "How TFMA LLC Improved Workflow Efficiency by 70% with Digits", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/how-tfma-llc-improved-workflow-efficiency-by-70-with-digits/", date: "2026-04-20", access: full, locator: "paragraphs on annual cleanups, two to four days, 1-3 hours per client and pricing" }
    - { ref: DIGITS-ADEPT-2026, title: "How Adept: Accounting Principles & Solutions Reduced Bookkeeping by 75% with Digits", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/adept-accounting/", date: "2026-03-23", access: full, locator: "section 'A 75% Reduction in Bookkeeping Time'" }
    - { ref: DIGITS-MANA-2025, title: "Mana Accounting & Advisory: Saving Hours with AI-Powered Accounting", publisher: "Digits (case study)", type: vendor, url: "https://digits.com/case-studies/mana-accounting-advisory-saving-hours-with-ai-powered-accounting/", date: "2025-10-10", access: full, locator: "paragraphs on cleanups taking minutes and client onboarding (qualitative)" }
    - { ref: CPAPA-ELEV8-2026, title: "How an AI-Native Accounting Platform Helped One Solo Firm Reclaim 90 Hours a Month and Scale Advisory Without Hiring", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/07/21/how-an-ai-native-accounting-platform-helped-one-solo-firm-reclaim-90-hours-a-month-and-scale-advisory-without-hiring/187093/", date: "2026-07-21", access: full, locator: "section 'Making Migration Manageable' (including 'migration is often the biggest obstacle')" }
    - { ref: FLOQAST-CASCASE-2026, title: "How One CAS Practice Uses FloQast AI Transaction Matching to Scale Client Support (case study PDF)", publisher: "FloQast", type: vendor, url: "https://get.floqast.com/hubfs/Assets/Case%20Studies/FloQast_MillerCooper_CAS_Case_Study_August_2026.pdf", date: "2026-08", access: full, locator: "paragraph on the seven-year clearing-account cleanup" }
    - { ref: ACCTODAY-RAMPSTACK-2026, title: "Ramp launches Stack, made specifically for accounting firms", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/ramp-launches-stack-made-specifically-for-accounting-firms", date: "2026-06-03", access: full, locator: "paragraph 3 (audit a client's existing books)" }
    - { ref: JOFA-EXCELAGENT-2026, title: "Using an Excel agent to clean, validate, and reconcile data (G. Pan and L. Wang, University of Akron)", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/oct/using-an-excel-agent-to-clean-validate-and-reconcile-data/", date: "2026-10-01", access: full, locator: "introduction, skill design, Steps 1-3 and results paragraph" }
    - { ref: JOFA-CASAI-2026, title: "Simple but effective AI use cases for CAS (Polakoff and Voyer, CohnReznick)", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/jan/simple-but-effective-ai-use-cases-for-cas/", date: "2026-01-01", access: full, locator: "use-case category 'Client onboarding' and the 30-to-60-day pilot advice" }
    - { ref: JOFA-CASTIPS-2025, title: "Tips for providing the CAS services clients want", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2025/jul/tips-for-providing-the-cas-services-clients-want/", date: "2025-07-01", access: full, locator: "section 'Build your technology stack wisely'" }
    - { ref: UKU-BOTKEEPER-2026, title: "Botkeeper Alternatives: 7 Best Options for Accounting Firms", publisher: "Uku (practice-management vendor blog)", type: vendor, url: "https://getuku.com/articles/botkeeper-alternatives/", date: "2026-02-13", access: full, locator: "section 'What Happened to Botkeeper?' (page revised after first publication; status checked 7 September 2026)" }
    - { ref: CPAPA-XENDOO-2026, title: "Xendoo Buys Botkeeper Infinite; AI Platform Will Remain 'Active and Supported'", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/02/28/xendoo-buys-botkeeper-infinite-ai-platform-will-remain-active-and-supported/179027/", date: "2026-02-28", access: full, locator: "quoted CEO note in the related-article block" }
    - { ref: CPAPA-INTUITCONNECT-2026, title: "Intuit Connect ON: What You Need to Know About the Latest Platform Innovations", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/06/26/intuit-connect-on-what-you-need-to-know-about-the-latest-platform-innovations/185810/", date: "2026-06-26", access: full, locator: "Intelligent Onboarding (beta from late July 2026)" }
  last_reviewed: "2026-10-21"
  notes: >-
    Merges four candidates: cleanup sold as a project (practice B), onboarding and migration automation (discourse B),
    agent cleanup of historical books (discourse C) and the Excel-agent skill (governance C). Ladder and scope follow
    the main change, a cleanup service priced as a project; the migration and Excel-agent parts are augment-step on
    their own. The Excel-agent figure comes from an audit-framed simulation (adjacent), and the authors say the method
    applies to AR and AP exports, tax data and client reports. TFMA charges $200-$400 a month for bookkeeping and
    $500-$1,000 for advisory (DIGITS-TFMA-2026); how firms price their own CAS is in professional-services
    (professional-services-scoping-pricing-16). Intuit's Intelligent Onboarding was announced as beta from late July
    2026 (CPAPA-INTUITCONNECT-2026). Firm types: TFMA, Elev8, Adept (solo) and Mana are small firms; the FloQast firm is
    an unnamed Top 100 firm; Ramp is a vendor. Independence: bookkeeping cleanup and system work for the firm's own
    audit client are restricted; see -24.

- id: advisory-client-accounting-services-10
  title: AP and bill-pay agents that capture, code and route invoices for approval, with AI fraud screening before payment release
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, client-interaction, review-assurance]
  pattern: document-to-decision
  ladder: automate
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    AP and bill pay for CAS clients involve manual invoice entry, coding, vendor emails, collecting vendor tax
    documents and payment coordination, with workflows that differ by client and system (JOFA-CASAI-2026). Firms that
    pay bills for clients also face business email compromise, spoofed invoices and deepfake impersonation; 74% of
    organizations were hit by business email compromise in 2025 (AFP-PAYFRAUD-2026).
  solution: >-
    AI-enabled AP tools (BILL, Tipalti, Ramp named by JofA) extract invoice details from PDFs and email, categorize
    expenses, match to purchase orders, route multi-level approvals and schedule payments. BILL's agents code invoices,
    draft answers to routine vendor and payment questions, capture receipts and collect vendor tax documents; Xero
    describes its assistant handling a bill from capture to payment and reconciliation. AI can also screen payment
    requests and vendor changes for fraud signals before release, with finance staff investigating alerts; no CAS firm
    reports doing this yet.
  outcomes:
    - lever: capacity
      description: "Vendor-stated aggregate for a receipt and expense agent."
      figure: "1,100-plus hours"
      measures: "Hours of manual work saved across customers since the agent's October 2025 launch, as stated by BILL; no per-customer data"
      provenance: vendor-published
      source_ref: CPAPA-BILLAGENTS-2026
    - lever: capacity
      description: "Vendor-stated aggregate for a vendor tax-document collection agent."
      figure: "approximately 1,000 days"
      measures: "Days of manual work saved across customers since the October 2025 launch, as stated by BILL"
      provenance: vendor-published
      source_ref: CPAPA-BILLAGENTS-2026
    - lever: risk
      description: "Use of AI against payments fraud by treasury and finance teams (adjacent: not CAS providers)."
      figure: "17% use AI; among users 49% more efficient fraud reporting, 45% better deepfake detection, 43% real-time identification"
      measures: "Share of AFP survey organizations using AI to combat payments fraud, and shares of AI users reporting each benefit (AFP 2026 Payments Fraud and Control Survey, 465 treasury practitioners, January 2026)"
      provenance: independent
      source_ref: AFP-PAYFRAUD-2026
  prerequisites:
    - "Clients on an AP platform integrated with their ledger and bank"
    - "An approval matrix"
    - "Vendor master data access with callback and dual-approval controls"
  risks_and_guardrails:
    - "Moving money raises the stakes; Xero says it designs for 'accountable intelligence' with audit trails and the owner or adviser in control (ACCTODAY-XEROAI-2026)."
    - "Aggregate vendor hours cannot be tied to any named firm or baseline (CPAPA-BILLAGENTS-2026)."
    - "AFP respondents cite cost, perceived immaturity of the technology and reliance on existing controls as reasons for slow AI adoption against fraud (AFP-PAYFRAUD-2026)."
  human_checkpoints:
    - "Owner or adviser approves payments"
    - "Accountant reviews coding exceptions"
    - "Finance staff investigate and release or block flagged payments"
  role_evolution: >-
    A BILL executive predicts pre-processing of bills (sourcing documents, extracting data, categorizing) will see the
    largest reduction in human involvement (ACCTODAY-AITHOUGHT-2026; a vendor forecast). Treasury was the department
    most likely to discover attempted fraud (83%) in the AFP survey (AFP-PAYFRAUD-2026).
  evidence_grade: C
  sources:
    - { ref: CPAPA-BILLAGENTS-2026, title: "BILL Releases New and Enhanced AI Agents", publisher: "CPA Practice Advisor", type: press, url: "https://www.cpapracticeadvisor.com/2026/02/10/bill-releases-new-and-enhanced-ai-agents/177829/", date: "2026-02-10", access: full, locator: "paragraphs on the agents and hours-saved figures" }
    - { ref: ACCTODAY-XEROAI-2026, title: "Xero aims to make AI core to platform functionality", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/news/xero-aims-to-make-ai-core-to-platform-functionality", date: "2026-03-16", access: full, locator: "paragraphs on JAX, online bill pay and Melio" }
    - { ref: JOFA-CASAI-2026, title: "Simple but effective AI use cases for CAS (Polakoff and Voyer, CohnReznick)", publisher: "Journal of Accountancy (AICPA & CIMA)", type: professional-body, url: "https://www.journalofaccountancy.com/issues/2026/jan/simple-but-effective-ai-use-cases-for-cas/", date: "2026-01-01", access: full, locator: "use-case category 'Spend and expense management'" }
    - { ref: ACCTODAY-AITHOUGHT-2026, title: "AI Thought Leaders Survey 2026: Process Predictions", publisher: "Accounting Today", type: press, url: "https://www.accountingtoday.com/list/ai-thought-leaders-survey-2026-process-predictions", date: "2025-12-30", access: full, locator: "Misherghi (BILL) quote on pre-processing" }
