- id: advisory-client-accounting-services-19
  title: "Outcome-based pricing of an AI ledger: the firm pays only for clients automated at 95% or more with no human touch"
  archetype: advisory
  module: client-accounting-services
  function: service-delivery
  work_types: [transaction-processing, coordination-scheduling]
