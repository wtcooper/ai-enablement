  maturity: announced
  problem: >-
    Digits' chief executive says that if the software does not do the work it should not get paid, and its new
    strategic adviser argues that firms should pay for results rather than for potential (ACCTODAY-DIGITSPRICING-2026).
  solution: >-
    Digits announced (7-8 Apr 2026) that firms pay for a client only when 95% or more of that client's transactions are
