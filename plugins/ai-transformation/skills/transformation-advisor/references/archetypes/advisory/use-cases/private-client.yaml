      15, 2024
  notes: 'Grade C: one announced firm collaboration plus vendor claims. The vendor''s Nov 2025 release said the platform
    then supported more than $10 billion in assets, with nearly one-third of clients managing over $1 billion; the homepage
    now shows $125B+. The two figures are not reconciled by any source. Firm types: PKF O''Connor Davies (large national
    accounting firm), Asseta AI (AI-native vendor). Cross-references: advisory-client-accounting-services-03 (close agents
    across a CAS portfolio) and -24 (independence and data-custody screening idea).'
  last_reviewed: '2026-10-20'
- id: advisory-private-client-02
  title: AI extraction of capital calls, distribution notices, K-1s and valuation statements into one system of record for
    alternative investments
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - transaction-processing
  - data-reporting
  pattern: document-to-decision
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: Capital calls, distributions, valuation statements and K-1s arrive in each fund manager's own format and portal,
    and staff re-key them into spreadsheets; unfunded commitments and stale marks are reconciled by hand.
  solution: 'A document-AI module ingests the PDFs, identifies the key data points and posts a reviewable draft to the family
    office''s reporting platform. At Jefferson River Capital, a single family office, Masttro''s Doc AI automated data capture
    for capital calls, distributions and valuations. Firm type: vendor (Masttro) with a named single-family-office customer;
    Armanino (mid-market firm) names document intake as the usual highest-return starting point.'
  outcomes:
  - lever: capacity
    description: Jefferson River Capital's implementation enabled tracking of 200+ alternative investments, per the vendor
      case summary; no time or error figures are published.
    figure: 200+ alternative investments tracked
    measures: Number of alternative investments tracked on the platform, per the vendor's case-study summary bullets
    provenance: vendor-published
    source_ref: MASTTRO-JEFFERSON-2026
  - lever: experience
    description: 'Context for the problem: in an audience poll at a family-office conference, collection of alts documents
      was named the major issue by 36% (extraction 27%, accuracy and consistency 9%).'
    figure: 36%
    measures: Share of the 70+ family offices polled that named collection as the major issue in processing alternative-investment
      documents and data; vendor-reported poll, wording as relayed by the vendor
    provenance: vendor-published
    source_ref: CANOE-FOALTS-2026
  prerequisites:
  - A defined intake process and one system of record for commitments, calls and valuations (ARMANINO-FOTRENDS-2026)
  - Clear view of where documents will live and who needs access (CANOE-FOALTS-2026)
  - Vendor diligence on whether client data trains models, where it is stored and who can access it (ARMANINO-FOTRENDS-2026)
  risks_and_guardrails:
  - Extraction is the step Armanino says puts a reviewable draft in front of a person; accuracy rates are not published
    by anyone in the sources read.
  - Fund managers' formats vary, so an unreviewed extraction can post wrong data to reporting; the Canoe write-up lists
    accuracy and consistency as a challenge (CANOE-FOALTS-2026).
  - FINRA's 2026 report names summarization and information extraction as the top GenAI use case among its member firms
    and lists hallucination and data-sensitivity risks (FINRA-OVERSIGHT-2026); the report addresses member firms, so applying
    it to family offices is by analogy.
  human_checkpoints:
  - A person reviews the extracted draft before it is posted (ARMANINO-FOTRENDS-2026).
  - Capital-call funding instructions are checked against procedure; Canoe cites flagging of wiring-information discrepancies
    as a feature (CANOE-FOALTS-2026).
  role_evolution: Staff move from copying data out of PDFs to reviewing drafts and exceptions. The 2022 Empaxis case describes
    an unnamed Northern California family office whose staff spent about an hour a day on manual statement work before bot-based
    extraction (EMPAXIS-FOSTMT-2022).
  evidence_grade: B
  sources:
  - ref: MASTTRO-JEFFERSON-2026
    title: Jefferson River Capital Single Family Office (case study)
    publisher: Masttro
    type: vendor
    url: https://masttro.com/resources/jefferson-river-capital
    date: '2026'
    access: full
    locator: 'Summary bullets: ''This Case Study Dives Into'''
  - ref: CANOE-FOALTS-2026
    title: 'The Future-Ready Family Office: Navigating alts data with AI-powered precision'
    publisher: Canoe Intelligence
    type: vendor
    url: https://canoeintelligence.com/the-future-ready-family-office-navigating-alts-data-with-ai-powered-precision/
    date: '2026-03-18'
    access: full
    locator: Sections on alts data challenges and the panel case study
  - ref: ARMANINO-FOTRENDS-2026
    title: 'Built to Last: The Family Office Trends Defining 2026'
    publisher: Armanino
    type: firm
    url: https://www.armanino.com/articles/family-office-trends/
    date: '2026-08-19'
    access: full
    locator: Section on alternative investments and AI document intake
  - ref: FINRA-OVERSIGHT-2026
    title: '2026 FINRA Annual Regulatory Oversight Report: GenAI: Continuing and Emerging Trends'
    publisher: FINRA
    type: regulator
    url: https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai
    date: '2025-12-09'
