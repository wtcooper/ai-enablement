# Use cases: advisory / private-client
# Private client services: family-office accounting and reporting, alternative-investment administration, payment
# controls, succession and owner advisory, and the client experience for principals and families. Delivered by
# accounting firms (large national, mid-market and small), family-office advisory firms, wealth platforms,
# vendors, and family offices' own in-house staff. Sources checked 2026-10-20 (wave 5: one combined deep dive, the
# advisory landscape scan and the cross-cutting files on independence and pricing and on the state of AI and disruption).
# Evidence is thin: no entry is graded A. Almost every source is written by a vendor, bank, law firm or advisory firm
# that sells to family offices. No error rate, override rate, parallel run, client-satisfaction measure or inspection
# finding was found for this module. Succession and owner advisory have one marketing deployment and two ideas.
# Tax and estate technical work is in tax; regulated investment advice is out of scope; firm operations (pricing,
# staffing, ownership) are in professional-services; attest work is in assurance. Cross-references are by id in notes.

- id: advisory-private-client-01
  title: Family-office accounting and reporting delivered by a CPA firm on an AI-driven, multi-entity platform
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - transaction-processing
  - data-reporting
  pattern: reconcile-exceptions
  ladder: automate
  change_scope: process
  runtime_class: workflow-automation
  maturity: announced
  problem: Multi-entity family offices keep accounting, investment reporting and financial operations in separate tools
    and spreadsheets, so closing and consolidating take manual effort and reporting is hard to trust.
  solution: 'A CPA firm adopts one cloud platform that combines the general ledger, bank and cash management, bill pay and
    financial reporting, with AI-powered workflows and automated intercompany reconciliation. Per its release, PKF O''Connor
    Davies plans to use the Asseta AI platform for family-office modernization from initial evaluation and implementation
    through ongoing financial operations. Firm type: large national accounting firm (PKF O''Connor Davies calls itself one
    of the nation''s largest; rank not verified here). Vendor: AI-native startup (Asseta AI).'
  outcomes:
  - lever: speed
    description: Vendor says most family offices go live in 8-12 weeks and publishes a 30/60/90-day implementation plan
      ending with reporting fully moved to the platform.
    figure: 8-12 weeks
    measures: Time to go live for 'most family offices', as stated in the vendor's FAQ; no sample or baseline given
    provenance: vendor-published
    source_ref: ASSETA-SITE-2026
  - lever: capacity
    description: Vendor homepage counters for scale of use.
    figure: $125B+ assets on platform; 50+ families onboarded
    measures: Counters on the vendor's homepage; definitions and dates not given
    provenance: vendor-published
    source_ref: ASSETA-SITE-2026
  - lever: speed
    description: Vendor markets closing 'in hours, not days'; no baseline or measurement is published.
    figure: none stated as a number
    measures: Marketing statement on the vendor site about close time; not a tracked metric
    provenance: vendor-published
    source_ref: ASSETA-SITE-2026
  prerequisites:
  - Import of chart of accounts and ownership structure into a sandbox, connection of bank and brokerage accounts, and historical
    data reconciliation (vendor's 30/60/90-day plan)
  - Team training on the new platform (same plan)
  risks_and_guardrails:
  - PKF's release announces a collaboration and says the firm 'plans' to use the platform; it reports no client results
    (PKF-ASSETA-2026).
  - All usage and speed figures are vendor claims; the vendor is a seed-stage company (CPAPA-ASSETASEED-2025).
  - 'Independence (the firm''s own attest clients): bookkeeping and related accounting-record services impair independence
    for SEC issuer audit clients (SEC-RULE2-01-2026, (c)(4)(i)). Under the AICPA Code a nonattest service is allowed only
    if the client assumes management responsibilities, oversees it through a suitably skilled person and accepts responsibility
    for the results (JOFA-NONATTEST-2016, a 2016 description). IESBA treats hosting or storing an audit client''s data as
    assuming a management responsibility (IESBA-TECH-2023, 606.3 A1). No source read addresses family offices specifically.'
  human_checkpoints:
  - Historical data reconciliation is finished and the team trained before go-live (ASSETA-SITE-2026).
  - Armanino describes keeping posting to the books and moving money with people while AI handles lower-risk work (ARMANINO-FOTRENDS-2026).
  role_evolution: PKF's release says the platform needs 'experienced advisory support', so the firm's role is positioned
    as selecting, implementing and running the platform for the family office (PKF-ASSETA-2026). No headcount effect is
    reported.
  evidence_grade: C
  sources:
  - ref: PKF-ASSETA-2026
    title: PKF O'Connor Davies Announces Collaboration with Asseta AI to Support Family Office Modernization
    publisher: PKF O'Connor Davies / Business Wire
    type: firm
    url: https://www.businesswire.com/news/home/20260326796176/en/PKF-OConnor-Davies-Announces-Collaboration-with-Asseta-AI-to-Support-Family-Office-Modernization
    date: '2026-03-26'
    access: full
    locator: Release paragraphs 1-3 (collaboration, platform description, PKF plans)
  - ref: ASSETA-SITE-2026
    title: 'Asseta: Family Office General Ledger, Bill Pay, Investments Data, Reconciliations and Reporting (product site)'
    publisher: Asseta AI
    type: vendor
    url: https://www.asseta.ai/
    date: 2026-10
    access: full
    locator: Homepage counters; 30/60/90-day implementation panel; FAQ on inter-company activity and go-live
  - ref: CPAPA-ASSETASEED-2025
    title: Asseta AI Raises $4.2M Seed Round to Bolster Family Office Accounting Platform
    publisher: CPA Practice Advisor
    type: press
    url: https://www.cpapracticeadvisor.com/?p=173630
    date: '2025-11-20'
