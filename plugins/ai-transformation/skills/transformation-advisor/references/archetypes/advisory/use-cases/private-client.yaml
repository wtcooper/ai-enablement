- id: advisory-private-client-07
  title: AI flagging of payment anomalies and wire-instruction discrepancies alongside procedural controls against deepfake
    fraud
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - review-assurance
  - transaction-processing
  pattern: monitor-diagnose-act
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: announced
  problem: AI-generated voice, video and writing make payment requests look authentic; family offices are lean, rely on
    informal channels and are likely targets.
  solution: Software flags anomalies in payments and approvals and discrepancies in wiring information, while the office
    adds procedural controls such as dual authorization and verification outside the request channel. Sources describe the
    controls as procedural rather than technical because detection tools lag attackers.
  outcomes:
  - lever: risk
    description: none published for AI flagging; Canoe lists proactive flagging of wiring-information discrepancies as a
      platform feature.
    figure: none published
    measures: Vendor feature description; no detection or false-positive rate given
    provenance: vendor-published
    source_ref: CANOE-FOALTS-2026
  prerequisites:
  - Approval workflows mapped to decision rights, signers and thresholds (AGILLINK-FOPRED-2026)
  - Staff aware that a single remote interaction should not authorize a significant payment (CFO-DEEPFAKE-2026)
  risks_and_guardrails:
  - A research professor quoted says defensive tools are behind and culture and procedure must carry the control (CFO-DEEPFAKE-2026).
  - SEC FY2026 priorities direct examiners at AI and polymorphic-malware risks in cybersecurity programs (SEC-EXAMPRI-FY2026).
  human_checkpoints:
  - Dual authorization and verified call-back for money movement (ARMANINO-FOTRENDS-2026; CFO-DEEPFAKE-2026).
  role_evolution: Approval authority stays with named people; offices replace informal email approvals with system workflows
    (AGILLINK-FOPRED-2026).
