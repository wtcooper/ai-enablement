- id: advisory-private-client-15
  title: 'Hybrid family-office model: outsourced accounting, reporting and AI enablement with strategy and relationships
    kept in-house'
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - transaction-processing
  - data-reporting
  - coordination-scheduling
  pattern: other
  ladder: augment
  change_scope: model
  runtime_class: workflow-automation
  maturity: announced
  problem: Lean offices lack bandwidth to build and maintain a bench for each of accounting, reporting, technology, AI and
    security.
  solution: Offices keep strategy, family relationships and decision-making in-house and move accounting operations, reporting,
    reconciliations, technology, AI enablement and cybersecurity to outside providers. Armanino describes this as the trend;
    PKF's Asseta collaboration is the nearest named example of a CPA firm running family-office financial operations on
    a platform. GenTrust's CIO says family offices have asked it to find staff who can find AI technology to automate bill
    pay, concierge and similar work.
  outcomes:
  - lever: cost
    description: Armanino, citing Campden Wealth and AlTi Tiedemann Global (2025), says 80% of family offices outsource
      primarily to access specialized expertise while only 31% cite cost savings as a main driver.
    figure: 80% and 31%
    measures: As worded by Armanino about family offices that outsource; denominators and the underlying report not read
    provenance: vendor-published
    source_ref: ARMANINO-FOTRENDS-2026
  prerequisites:
  - Defined decision rights and named backups for critical roles (ARMANINO-FOTRENDS-2026)
  risks_and_guardrails:
  - Vendor opacity and concentration risk (SQUIRE-FOAIRISK-2026).
  - 'Independence (the firm''s own attest clients): bookkeeping and related accounting-record services impair independence
    for SEC issuer audit clients (SEC-RULE2-01-2026, (c)(4)(i)). Under the AICPA Code a nonattest service is allowed only
    if the client assumes management responsibilities, oversees it through a suitably skilled person and accepts responsibility
    for the results (JOFA-NONATTEST-2016, a 2016 description). IESBA treats hosting or storing an audit client''s data as
    assuming a management responsibility (IESBA-TECH-2023, 606.3 A1). No source read addresses family offices specifically.'
  human_checkpoints:
  - Principals and in-house staff keep decisions and the relationship (ARMANINO-FOTRENDS-2026).
  role_evolution: In-house roles narrow toward strategy and relationships; GenTrust's CIO reports demand for staff who can
    select and run AI automation (AICIO-FOOPTEST-2026).
  evidence_grade: C
  sources:
