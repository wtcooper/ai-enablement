    title: 17 CFR 210.2-01 Qualifications of accountants
    publisher: US SEC via eCFR
    type: regulator
    url: https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-17?part=210&section=210.2-01
    date: '2026-10-20'
    access: full
    locator: (c)(4)(i) bookkeeping; (c)(4)(viii) investment adviser services; current text as fetched (date is the access
      date)
  - ref: JOFA-NONATTEST-2016
    title: Maintaining independence with nonattest services
    publisher: Journal of Accountancy
