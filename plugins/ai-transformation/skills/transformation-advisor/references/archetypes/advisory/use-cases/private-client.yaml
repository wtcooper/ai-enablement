- id: advisory-private-client-14
  title: Advising families on AI policy, data limits and vendor diligence as a service
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - expert-judgment
  - document-production
  pattern: other
  ladder: assist
  change_scope: model
  runtime_class: personal-assistant
  maturity: announced
  problem: Family offices handle the most sensitive data of any client and adopt AI tools without a policy; leaks can occur
    through ordinary use with no breach event.
  solution: 'Banks, law firms and CPA firms publish policy frameworks and templates and advise offices to inventory AI use
    cases, tier them by risk, approve tools, vet vendors and train staff. Northern Trust gives ten principles and a risk-tiered
    template; Squire Patton Boggs gives a six-part governance response; Armanino and Wiss advise setting data and review
    rules before adoption. Firm type: law firm, bank and mid-market CPA firms. Whether any firm sells this as a paid service
    is not shown.'
  outcomes:
  - lever: risk
    description: none published
    figure: none published
    measures: Guidance only
    provenance: vendor-published
    source_ref: NT-FOAIPOLICY-2026
  prerequisites:
  - Inventory of AI use cases by risk level (SQUIRE-FOAIRISK-2026)
  - Short list of approved tools and named owner (NT-FOAIPOLICY-2026)
  risks_and_guardrails:
  - Higher-risk uses (investment advice, tax positions, financial modelling, legal interpretation) get enhanced review under
    the Northern Trust template (NT-AIPOLICYTEMPLATE-2026).
  - Vendors should be asked whether client data trains models and where it is stored (ARMANINO-FOTRENDS-2026).
  - For the firm's own data handling, the AICPA Code's confidentiality rule means asking whether client consent is needed
    before client data goes into an AI tool (JOFA-ETHICSAI-2026).
  human_checkpoints:
  - AI output reviewed before reliance, especially on investment, legal, tax and estate matters (NT-FOAIPOLICY-2026).
  - Policy reviewed at least annually (NT-FOAIPOLICY-2026).
  role_evolution: Squire says responsibility must remain attributable to identified individuals or functions (SQUIRE-FOAIRISK-2026).
