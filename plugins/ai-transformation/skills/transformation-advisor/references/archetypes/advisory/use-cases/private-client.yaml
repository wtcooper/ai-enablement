- id: advisory-private-client-04
  title: AI help with transaction coding, intercompany reconciliation and month-end close in family-office accounting
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - transaction-processing
  pattern: reconcile-exceptions
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: Lean teams code transactions, reconcile accounts across entities and banks, and run the close by hand across
    fragmented systems.
  solution: AI categorizes invoices and transactions, reconciles accounts across entities and banks, and flags anomalies;
    a person reviews the exceptions. Sources name this as where practitioners are trying AI, and one family office's controller
    posting asks the hire to assess AI-assisted tooling for coding, policy audits, allocation and AP workflow.
  outcomes:
  - lever: speed
    description: none published for family offices. A named adjacent peer-reviewed study of small-business accounting finds
      genAI adoption associated with productivity gains; no figure is available from the abstract.
    figure: none published
    measures: 'Adjacent evidence only: survey of 277 accountants plus platform data on 79 SMEs (200,000+ transaction records);
      not family offices'
    provenance: independent
    source_ref: STANFORD-JAR-2026
  prerequisites:
  - Clear workflow owners, system of record and bottlenecks mapped before tooling (ARMANINO-FOTRENDS-2026)
  - Defined end state and security and privacy policy before any system goes live (WISS-FOAI-2026)
  risks_and_guardrails:
  - Armanino says offices keep AI away from moving money, posting to the books and final decisions (ARMANINO-FOTRENDS-2026).
  - A written approval and audit trail for AI use is advised (AGILLINK-FOPRED-2026; ARMANINO-FOTRENDS-2026).
  - 'Independence (the firm''s own attest clients): bookkeeping and related accounting-record services impair independence
    for SEC issuer audit clients (SEC-RULE2-01-2026, (c)(4)(i)). Under the AICPA Code a nonattest service is allowed only
    if the client assumes management responsibilities, oversees it through a suitably skilled person and accepts responsibility
    for the results (JOFA-NONATTEST-2016, a 2016 description). IESBA treats hosting or storing an audit client''s data as
    assuming a management responsibility (IESBA-TECH-2023, 606.3 A1). No source read addresses family offices specifically.'
  human_checkpoints:
  - Armanino keeps moving money, posting to the books and final decisions in human hands (ARMANINO-FOTRENDS-2026).
  - A person still signs off on AI-prepared work (ARMANINO-FOTRENDS-2026).
  role_evolution: A family-office controller posting scopes AI-assisted tooling inside a role that also owns an outsourced-accounting
    relationship and the close calendar (JOB-FOCONTROLLER-2026). The 2025 RBC and Campden report is quoted as predicting
    fewer staff doing basic accounting (WSR-RBC-2025).
  evidence_grade: C
