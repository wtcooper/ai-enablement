  - ref: IESBA-TECH-2023
    title: 'Final Pronouncement: Technology-related Revisions to the Code (clean version, updated May 30, 2023)'
    publisher: IESBA
    type: standard-setter
    url: https://www.ethicsboard.org/publications/final-pronouncement-technology-related-revisions-code
    date: '2023-04-11'
