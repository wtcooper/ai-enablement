    vendor case study), Masttro and Canoe (vendors), Armanino (mid-market firm). Cross-reference: K-1 extraction for the
    return itself is tax work (tax-compliance-individual-business-02).'
  last_reviewed: '2026-10-20'
- id: advisory-private-client-03
  title: AI-drafted reporting commentary and consolidated multi-entity reports for principals
  archetype: advisory
  module: private-client
  function: service-delivery
  work_types:
  - data-reporting
  - document-production
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: emerging
  problem: Investment reporting is still too manual, and families expect consolidated views across entities, investments
    and cash without waiting weeks for someone to stitch them together.
  solution: Staff use AI to draft reporting commentary, summarize documents and prepare meeting material for review; platforms
    consolidate entity-level numbers into one view. Armanino (mid-market and top-tier advisory firm; rank not verified)
    lists drafting reporting commentary among low-risk, high-leverage starting points where a person still signs off.
  outcomes:
  - lever: quality
    description: 'Survey: share of family offices using AI for investment performance reporting more than doubled in one
      year.'
    figure: 16%
    measures: Share of family offices in Citi's 2025 Global Family Office Report survey that use AI for investment performance
      reporting, as shown on Citi's May 2026 page; prior-year value not stated on the page
    provenance: vendor-published
    source_ref: CITI-AIFO-2026
  - lever: experience
    description: 'Survey: most respondents still find investment reporting too manual.'
    figure: 73%
    measures: Share of 2026 RBC/Campden respondents who 'still believe investment reporting is too manual', a top concern
      for three years running; sample size not captured
    provenance: vendor-published
    source_ref: RBC-CAMPDEN-2026
  - lever: capacity
    description: 'Survey: expectation of future use for financial reporting and data visualization.'
    figure: 69%
    measures: Share of 317 UBS family-office clients who think they are likely to use AI for financial reporting / data
      visualization in the next five years (intent, not use)
    provenance: vendor-published
    source_ref: UBS-GFO-2025
  prerequisites:
  - Clean, structured, reconciled data; speakers at a 2026 forum said the data, not the AI, is the bottleneck (WISS-FOAI-2026)
  - A defined process, owners and controls before technology (ARMANINO-FOTRENDS-2026)
  risks_and_guardrails:
  - Hallucination is often a data-governance problem, per a panel speaker (HUBBIS-ETON-2026).
  - Automation bias can turn a decision-support tool into an implicit decision driver (SQUIRE-FOAIRISK-2026).
  - Family offices are advised to define what data AI can access, what needs human review and what the audit trail is (ARMANINO-FOTRENDS-2026).
  human_checkpoints:
  - A person signs off on AI-drafted commentary and reports (ARMANINO-FOTRENDS-2026).
  - Final decisions, especially on investments, stay with experienced humans (CITI-AIFO-2026).
  role_evolution: Armanino and Citi both describe staff time shifting from assembling reports to review and strategy (ARMANINO-FOTRENDS-2026;
    CITI-AIFO-2026). The 2025 RBC and Campden report is quoted as predicting a significant reduction in staff doing basic
    accounting or administrative work (WSR-RBC-2025).
  evidence_grade: C
  sources:
  - ref: ARMANINO-FOTRENDS-2026
    title: 'Built to Last: The Family Office Trends Defining 2026'
    publisher: Armanino
    type: firm
    url: https://www.armanino.com/articles/family-office-trends/
    date: '2026-08-19'
    access: full
    locator: Sections on consolidated reporting and on AI as a governance decision
