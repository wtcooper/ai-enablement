  last_reviewed: "2026-10-20"
  notes: >-
    Grade B: a named in-house deployment (Hamilton Lane) with qualitative statements and no published measurement.
    The user has a stake in the vendor: Hamilton Lane took part in 73 Strings' 2025 Series B (S73-CALLISTO-2026).
    An earlier draft said the platform runs scenario analyses across portfolios; the Q&A does not say so (Callisto
    simulation is announced for 73 Intelligence, S73-CALLISTO-2026).
    Firm type: client in-house team (investment manager), not an accounting or advisory firm; it shows what portfolio
    valuation looks like when automated, and what advisory firms compete with. Independence is not an issue for an
    in-house team. Hamilton Lane AUM figures in the Q&A are context, not outcomes. The private-client research routed
    a lead: Masttro claims AI valuation of private equity and venture holdings on its platform pages (not read in
