      publisher: "73 Strings"
      type: vendor
      url: "https://73strings.com/insights/blog/how-hamilton-lane-brings-precision-and-scale-to-valuations-and-technology/"
      date: "2025-05-23"
      access: full
      locator: "answers by Rivera, paragraphs 2-4"
