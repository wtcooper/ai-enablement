- id: advisory-valuation-13
  title: "Portfolio valuation platform that extracts portfolio-company data from source documents with AI and standardizes the valuation process (in-house asset manager)"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [data-reporting, expert-judgment]
  pattern: document-to-decision
  ladder: augment
  change_scope: process
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Fund valuations were built in bespoke spreadsheets from whatever public data was at hand; the process was manual
    and resource-intensive, and reporting is moving from quarterly to more frequent marks.
  solution: >-
    Hamilton Lane (an investment manager, not an accounting firm) says in its own Q&A (2025-05-06, republished by the
    vendor) that it partnered with 73 Strings to standardize valuations across private-markets strategies on one
    platform that uses AI to process and contextualize valuation data (HAMILTONLANE-VALTECH-2025; S73-HAMLANE-2025).
    Hamilton Lane is also an investor in 73 Strings (S73-CALLISTO-2026). 73 Strings' platform extracts financial
    and operational data and KPIs from documents, and a Eurazeo executive is quoted on its site crediting 73 Strings
    with ROI across valuation, compliance, finance and investment teams (S73-HOME-2026). Vendor: 73 Strings.
  outcomes:
    - lever: speed
      description: "Hamilton Lane's director of valuation says the process is systematized so the firm can value everything it holds in a standardized, operationally efficient way; no time or accuracy figure is given"
      figure: "none published"
      measures: "Qualitative statement by Hamilton Lane's director of valuation (Santiago Rivera) in the firm's own Q&A"
      provenance: self-reported
      source_ref: HAMILTONLANE-VALTECH-2025
    - lever: cost
      description: "A Eurazeo executive is quoted as saying the platform delivered 'significant ROI' across operations; no figure"
      figure: "none published"
      measures: "Testimonial on the vendor's home page; undated; no measure stated"
      provenance: vendor-published
      source_ref: S73-HOME-2026
  prerequisites:
    - "A structured data layer under the platform"
    - "Integration with existing systems; Stout's interview asks whether added automation will integrate or become another system to access (STOUT-TECH-2024)"
    - "A move from deal-team-led to central-team valuation, which Stout says will be easier for some organizations to implement than for others (STOUT-TECH-2024)"
  risks_and_guardrails:
    - "73 Strings describes a deterministic core valuation engine with traceable calculations and human judgement central to valuation decisions (S73-CALLISTO-2026)"
    - "Standardized models can lose nuance that a bespoke deal-team valuation captured (STOUT-TECH-2024)"
  human_checkpoints:
    - "73 Strings says human judgement stays central to valuation decisions (S73-CALLISTO-2026); who reviews marks at Hamilton Lane is not described"
  role_evolution: >-
    Stout's 2024 interview on automation (not AI) describes control of the valuation process moving from deal teams
    to a central valuation team (STOUT-TECH-2024).
  evidence_grade: B
  sources:
    - ref: HAMILTONLANE-VALTECH-2025
      title: "The Intersection of Private Markets Valuations and Technology (Hamilton Lane insight, Q&A)"
      publisher: "Hamilton Lane"
      type: firm
      url: "https://www.hamiltonlane.com/en-us/insight/valuation-technology"
      date: "2025-05-06"
      access: full
      locator: "answers by Rivera (73 Strings partnership; systematized process)"
