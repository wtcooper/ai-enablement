- id: advisory-valuation-05
  title: "AI assistant inside the spreadsheet for valuation models: build, formula audit and sensitivities"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [data-reporting, software-systems]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Valuation models live in Excel, and building, auditing and flexing them is manual.
  solution: >-
    Anthropic says Claude in Excel builds financial models from filings and data feeds, audits formulas across linked
    workbooks and runs sensitivity analyses (ANTHROPIC-FSAGENTS-2026, May 2026). A BVR and CBV workshop (April 2025)
    covered Copilot in Excel as a personal Excel assistant for valuation practitioners (BVR-TRAINPRACTICAL-2025,
    summary only). Endicott says AI is moving into the core tools valuers use every day (BVR-ENDICOTT-2026). Vendors:
    Anthropic and Microsoft (the latter via the workshop summary).
  outcomes:
    - lever: quality
      description: "Anthropic reports that an Excel agent built by FundamentalLabs on Claude Opus 4 scored 83% accuracy on complex Excel tasks and passed 5 of 7 levels of the Financial Modeling World Cup"
      figure: "83%; 5 of 7 levels"
      measures: "Vendor's account of a third party's test (tasks, scoring and sample not described in the release); general financial modelling, not valuation"
      provenance: vendor-published
      source_ref: ANTHROPIC-FS-2025
  prerequisites:
    - "Firm policy on which AI tools may see client financials"
  risks_and_guardrails:
    - "Under Appraisal Foundation Advisory Opinion 41 the user, not the tool, is responsible for judging whether output is accurate and appropriate (ISA-AO41-2026)"
    - "Court example (Matter of Weber, 2024): the court found the expert's testimony not credible, re-ran his Copilot queries and got slightly different numbers each time, and said counsel must disclose AI use before AI-generated evidence is admitted (GOLDMAN-WEBER-2024)"
  human_checkpoints:
    - "Analyst reviews model logic and outputs"
  role_evolution: "Not documented for valuation."
  evidence_grade: C
  sources:
    - ref: ANTHROPIC-FSAGENTS-2026
      title: "Agents for financial services (ten agent templates, including a valuation reviewer)"
      publisher: "Anthropic"
      type: vendor
      url: "https://www.anthropic.com/news/finance-agents"
