- id: advisory-valuation-06
  title: "Idea: forecasting complete financial statements beyond one year as a projection input to DCF valuation"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [data-reporting]
  pattern: other
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: emerging
  problem: >-
    In a discounted cash flow (DCF) valuation most firm value sits beyond the first forecast year, yet few tools
    forecast full statements over long horizons (ARXIV-FORMA-2026).
  solution: >-
    A research team released a benchmark (ProForma-20Q) and a specialist transformer model that forecasts 78 statement
    line items 1-20 quarters ahead (ARXIV-FORMA-2026). This is a trained forecasting model, not a language-model agent.
    Idea: researchers discuss it; no valuation firm use found.
  outcomes:
    - lever: quality
      description: "On the benchmark the specialist model beat classical machine learning, gradient boosting, a time-series foundation model and frontier large language models, with the lead widening at longer horizons"
      figure: "none in the abstract"
      measures: "Authors' benchmark of anonymized firms scored by change-space R-squared; the abstract does not give the numbers; preprint"
      provenance: independent
      source_ref: ARXIV-FORMA-2026
  prerequisites:
