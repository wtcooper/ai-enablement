# Use cases: advisory / valuation (business valuation, fair value for financial reporting, portfolio and fund
# valuation, valuation reports and their defence)
# Sources checked 2026-10-20 (wave 5). Merged from the valuation deep dive, the advisory landscape scan, the
# cross-cutting files on independence and pricing and on the state of AI and disruption, and items other advisory
# modules routed to valuation.
# Evidence is thin: no entry is graded A. Verified 2026-10-21 (wave 5 fact-check): #03 and #08 moved to C because
# their case studies never say AI was used; #15 (CohnReznick) added from a release the deep dive missed. No error rate, override rate, parallel run or inspection finding on
# AI-assisted valuation was found. Speed figures are vendor-published or self-reported, with no method. Vendor pages
# with no date carry the access date (2026-10-20).
# Independence: appraisal, valuation and fairness-opinion services for an SEC-registrant audit client impair
# independence unless it is reasonable to conclude the results will not be subject to audit procedures
# (SEC-RULE2-01-2026, (c)(4)(iii)). Treatment for private-company attest clients under the AICPA Code was not
# confirmed in the research; confirm per engagement.
# Firm operations (pricing the firm's own work, staffing, ownership) are in professional-services; the auditor's use
# of valuation specialists is in assurance (specialists); tax valuations are in tax. Cross-references are by id in notes.

- id: advisory-valuation-01
  title: "Big Four valuation teams apply AI to comparable-company screening, volatility and customer-attrition analysis, technical research and information requests"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [research-synthesis, data-reporting, expert-judgment]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: piloting
  problem: >-
    Valuation engagements involve repetitive analytical and research steps (peer screens, volatility, attrition
    cohorts, client information requests) that consume junior analyst hours.
  solution: >-
    At the ASA Fair Value Conference in New York (reported by BVWire on 2026-06-10) a KPMG panellist said the firm is working to embed AI "into
    everything that we do", with applications ranging from information requests, meeting summaries and technical
    research to volatility analysis (how much a share price moves), attrition analysis (how fast customers are lost)
    and comparable-company screening. Other Big Four panellists described AI as increasingly part of valuation
    workflows and stressed judgment, review and auditability (BVR-KPMGTREND-2026). The report does not name the AI
    tools used. Separately, KPMG announced
    (2026-05-19) an alliance giving all of its 276,000+ people access to Claude (ANTHROPIC-KPMG-2026). Firm type:
    Big Four.
  outcomes:
    - lever: capacity
      description: "Several speakers said firms are hiring fewer entry-level analysts as AI automates part of the mechanical work (reported by BVWire; no count given)"
      figure: "none published"
      measures: "Panel statement reported by trade press; no hiring numbers, firm names or time period for the hiring comment"
      provenance: self-reported
      source_ref: BVR-KPMGTREND-2026
  prerequisites:
    - "Enterprise access to an AI platform; the panel report names no tool, and the separate Anthropic alliance gives all KPMG staff Claude access (ANTHROPIC-KPMG-2026)"
    - "Review procedures and auditability, which the panel called essential (BVR-KPMGTREND-2026)"
  risks_and_guardrails:
    - "Panellists stressed professional judgment, review procedures and auditability (BVR-KPMGTREND-2026)"
    - "Under SEC Rule 2-01(c)(4)(iii), valuation services for an SEC-registrant audit client are barred where the results will be subject to audit procedures, so a Big Four firm's valuation work for its own audit clients is restricted regardless of tooling (SEC-RULE2-01-2026)"
  human_checkpoints:
    - "Reviewer sign-off on AI-assisted analyses, stated as essential by panellists (BVR-KPMGTREND-2026)"
  role_evolution: >-
    Several speakers described fewer entry-level analyst hires and open questions about how future valuation professionals
    will be trained (BVR-KPMGTREND-2026).
  evidence_grade: B
  sources:
    - ref: BVR-KPMGTREND-2026
      title: "KPMG's AI push reflects a broader trend in valuation (BVWire, ASA Fair Value Conference panel)"
      publisher: "Business Valuation Resources"
      type: conference
      url: "https://www.bvresources.com/articles/bvwire/kpmgs-ai-push-reflects-a-broader-trend-in-valuation"
      date: "2026-06-10"
      access: full
      locator: "paragraphs 1-2"
    - ref: ANTHROPIC-KPMG-2026
      title: "KPMG integrates Claude across its core business and workforce of more than 276,000 in strategic alliance"
      publisher: "Anthropic"
      type: vendor
      url: "https://anthropic.com/news/anthropic-kpmg"
      date: "2026-05-19"
      access: full
      locator: "opening paragraphs (alliance; access for 276,000+ employees)"
    - ref: SEC-RULE2-01-2026
      title: "17 CFR 210.2-01 Qualifications of accountants (current text, Cornell LII)"
      publisher: "SEC (Regulation S-X)"
      type: regulator
      url: "https://www.law.cornell.edu/cfr/text/17/210.2-01"
      date: "2026-10-20"
      access: full
      locator: "paragraph (c)(4)(iii)"
    - ref: BVR-BIG4PANEL-2026
      title: "Big Four Valuation Leaders Discuss AI, Tariffs, Pain Points, and More (Business Valuation Update; paywalled, summary read)"
      publisher: "Business Valuation Resources"
      type: conference
      url: "https://www.bvresources.com/articles/business-valuation-update/big-four-valuation-leaders-discuss-ai-tariffs-pain-points-and-more"
      date: "2026-06"
      access: search-only
      locator: "summary (paywalled; AI, staffing pressures, client expectations)"
  last_reviewed: "2026-10-20"
  notes: >-
    Grade B: a named firm (KPMG) is reported using AI on these tasks, with no published measurement. Maturity is
    'piloting' because the source says KPMG 'is working to embed' AI and does not say which tasks run in production.
    The statement reaches us through a trade-press report of a panel, not a KPMG publication. The Anthropic release
    names tax, legal, private equity and cybersecurity as the alliance's first uses and does not mention valuation.
    The other Big Four firms are not individually described. Related: assurance-specialists-01 (Big Four valuation
    leaders at the 2025 and 2026 ASA conferences, framed as management's experts in an audit);
    professional-services-talent-learning-07 (entry-level roles redesigned around reviewing AI output);
    assurance-acceptance-independence-15 (permissibility gate for AI-related services to audit clients).

- id: advisory-valuation-02
  title: "Plain-language research agent over private-company transaction, control-premium and marketability-discount datasets, with drill-through to the underlying transactions"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [research-synthesis, data-reporting]
  pattern: grounded-knowledge-assistant
  ladder: augment
  change_scope: step
  runtime_class: personal-assistant
  maturity: announced
  problem: >-
    Valuers search transaction and discount databases by hand, filtering and re-filtering comparables as they learn
    more about the subject company.
  solution: >-
    BVR's Research and Data Agent (RADA) lets a user query DealStats, BIZCOMPS, the FactSet/BVR Control Premium Study,
    the Stout Restricted Stock Study and the Valuation Advisors DLOM study (discount for lack of marketability, the
    reduction applied because an interest cannot readily be sold) in plain language, and returns calculations, tables
    and graphs. A 'Display Transactions' feature opens the underlying observations, and 'Saved Threads' keeps the
    research for an engagement so it can be refined later (BVR-RADAPRODUCT-2026; BVR-RADAEXPAND-2026). Vendor: BVR (a
    publisher and data vendor; not a firm).
  outcomes:
    - lever: speed
      description: "BVR describes RADA in DealStats as moving comparable analysis from hours to seconds; no measurement is published"
      figure: "none published (vendor describes 'hours into seconds')"
      measures: "Vendor's marketing wording about comparable-transaction analysis time; no sample, baseline or method stated"
      provenance: vendor-published
      source_ref: BVR-RADAPRODUCT-2026
    - lever: quality
      description: "BVR advises users to open the transactions behind each answer and judge whether they suit the valuation"
      figure: "none"
      measures: "Guidance on use, not a measured result"
      provenance: vendor-published
      source_ref: BVR-RADATIP-2026
  prerequisites:
    - "Subscription to the underlying BVR datasets; RADA is stated to be included at no extra cost for subscribers to the four expanded resources (BVR-RADAEXPAND-2026)"
    - "An analyst able to judge whether the retrieved transactions are comparable"
  risks_and_guardrails:
    - "BVR says RADA in BVResearch Pro draws on BVR's vetted content and does not go out to the internet (BVR-RADAJUNIOR-2026); this is stated for that product, not for the transaction datasets"
    - "BVR's own tip tells users not to stop at the answer: inspect the underlying transactions before relying on a result (BVR-RADATIP-2026)"
  human_checkpoints:
    - "Analyst reviews the underlying transactions and decides which are appropriate for the subject company (BVR-RADATIP-2026)"
    - "Analyst owns the selection and the conclusion"
  role_evolution: >-
    BVR's tip frames the tool as combining AI efficiency with professional judgment that stays with the analyst
    (BVR-RADATIP-2026); no role change is documented.
  evidence_grade: C
  sources:
    - ref: BVR-RADAPRODUCT-2026
      title: "BVR's Research and Data Agent (product page; undated, date = access date)"
      publisher: "Business Valuation Resources"
      type: vendor
      url: "https://www.bvresources.com/products/research-and-data-agent"
      date: "2026-10-20"
      access: full
      locator: "RADA in DealStats section; 'How RADA works' list"
    - ref: BVR-RADAEXPAND-2026
      title: "AI-powered RADA expands to more BVR resources (BVWire)"
      publisher: "Business Valuation Resources"
      type: press
      url: "https://www.bvresources.com/articles/bvwire/ai-powered-rada-expands-to-more-bvr-resources"
      date: "2026-09-16"
      access: full
      locator: "paragraphs 1-2 (expansion to four datasets; Display Transactions; no extra cost)"
    - ref: BVR-RADATIP-2026
      title: "RADA tip of the week: Check the transactions behind the answer (BVWire)"
      publisher: "Business Valuation Resources"
      type: vendor
      url: "https://www.bvresources.com/articles/bvwire/rada-tip-of-the-week-check-the-transactions-behind-the-answer"
      date: "2026-09-23"
      access: full
      locator: "'Key point' paragraph"
    - ref: BVR-RADAJUNIOR-2026
      title: "RADA tip of the week: Use RADA to train junior analysts (BVWire)"
      publisher: "Business Valuation Resources"
      type: vendor
      url: "https://www.bvresources.com/articles/bvwire/rada-tip-of-the-week-use-rada-to-train-junior-analysts"
      date: "2026-05-06"
      access: full
      locator: "paragraph 2 (content limited to BVR's vetted content)"
  last_reviewed: "2026-10-20"
  notes: >-
    Grade C: product and vendor claims only. No named firm user, no error or override rate. Maturity is 'announced'
    because availability is documented but named customer use is not. The 'AI-powered' label and the point that it
    does not go beyond BVR's content are BVR's own descriptions. Kept apart from advisory-valuation-03, which covers
    named firms' comparables research on a different platform whose case studies do not claim generative AI. The same
    agent over BVR's technical library is advisory-valuation-04.

- id: advisory-valuation-03
  title: "Comparables, multiples and discount-rate research inside a vendor-branded AI valuation platform (UK accounting-firm users; AI use not stated)"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [research-synthesis, data-reporting]
  pattern: research-brief
  ladder: augment
  change_scope: step
  runtime_class: workflow-automation
  maturity: in-production
  problem: >-
    Manual research for valuation multiples and discount rates is a significant time drain for smaller valuation
    teams (VALUTICO-KRESTON-2025).
  solution: >-
    Kreston Reeves (forensics and business valuations team) and Rouse Chartered Accountants, both served by the
    vendor's British team, use Valutico's comparable-data analysis and automated financial data integration, per
    vendor case studies dated December 2025. Firm type: UK accounting firms (size not stated in the sources). The
    studies describe data-driven research and automation; they do not say generative AI was used.
  outcomes:
    - lever: speed
      description: "Rouse's quote: the team is 'reducing the time to complete projects by a third, saving up to a day at a time', so the platform paid for itself after one or two valuations"
      figure: "one third; up to a day per project"
      measures: "Rouse's own estimate of project-time reduction as quoted in a vendor case study; no baseline or sample"
      provenance: vendor-published
      source_ref: VALUTICO-ROUSE-2025
    - lever: speed
      description: "Kreston Reeves says research into multiples and discount rates is quicker than before; the study repeats the vendor's 'at least 3-5 times faster' wording"
      figure: "none specific to the firm"
      measures: "Qualitative statement by a senior manager; the 3-5x wording is vendor boilerplate with no stated basis"
      provenance: vendor-published
      source_ref: VALUTICO-KRESTON-2025
  prerequisites:
    - "Platform subscription and customer-success training (VALUTICO-KRESTON-2025; VALUTICO-ROUSE-2025)"
    - "Existing knowledge of valuation methods; the platform feeds the analyst's judgment"
  risks_and_guardrails:
    - "IVS requires the valuer to assess and select data and inputs with professional judgement and scepticism, and to document significant data and inputs (IVSC-PERSPECTIVES-2025)"
  human_checkpoints:
    - "Analyst selects and justifies multiples and discount-rate inputs"
  role_evolution: "Not stated by the sources."
  evidence_grade: C
  sources:
    - ref: VALUTICO-KRESTON-2025
      title: "How Valutico Made Valuations More Efficient for Kreston Reeves (case study)"
      publisher: "Valutico"
      type: vendor
      url: "https://valutico.com/case-studies/how-valutico-made-valuations-more-efficient-for-kreston-reeves/"
      date: "2025-12-11"
      access: full
      locator: "paragraphs 1-4 and quote"
    - ref: VALUTICO-ROUSE-2025
      title: "Valutico: The Platform That Paid for Itself for Rouse Chartered Accountants (case study)"
      publisher: "Valutico"
      type: vendor
      url: "https://valutico.com/case-studies/valutico-the-platform-that-paid-for-itself-for-rouse-chartered-accountants/"
      date: "2025-12-10"
      access: full
      locator: "paragraphs 1-4 and quote"
    - ref: IVSC-PERSPECTIVES-2025
      title: "Navigating the Rise of Artificial Intelligence in Valuation: Opportunities, Risks, and Standards (Perspectives Paper)"
      publisher: "International Valuation Standards Council"
      type: standard-setter
      url: "https://ivsc.org/wp-content/uploads/2025/07/Navigating-the-Rise-of-AI-in-Valuation-Opportunities-Risks-and-Standards.pdf"
      date: "2025-07-23"
      access: full
      locator: "page 4 (IVS 104 text) and page 12 (IVS 104 paragraphs 40.01-50.02)"
  last_reviewed: "2026-10-20"
  notes: >-
    Grade C (was B; downgraded 2026-10-21): the firms and the deployments are named, but neither case study says AI
    was used, so the AI claim rests on the vendor's branding (VALUTICO-HOME-2026) and the B would come from an
    adjacent, non-AI process. Rouse's 'a third' is a partner's estimate quoted by the vendor (Oscar Wingham; the
    Kreston Reeves quote is from Jodie Jones). It would return to B if either firm or the vendor said AI was used. Related:
    assurance-specialists-02 (valuation providers build third-party AI analytics into their methodology).

