      title: "73 Strings home page (undated; date = access date)"
      publisher: "73 Strings"
      type: vendor
      url: "https://73strings.com/"
      date: "2026-10-20"
      access: full
      locator: "Eurazeo testimonial; 73 Extract paragraph"
