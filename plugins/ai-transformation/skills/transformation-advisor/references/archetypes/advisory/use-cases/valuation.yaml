- id: advisory-valuation-10
  title: "AI reviewer agents check a valuation or valuation report against standards, methodology and the firm's review policy before sign-off"
  archetype: advisory
  module: valuation
  function: service-delivery
  work_types: [review-assurance]
  pattern: draft-review-loop
  ladder: augment
  change_scope: step
  runtime_class: shared-team-skills
  maturity: announced
  problem: >-
    Reports can contain every required section and still have missing or inconsistent requirements, unsupported
    assumptions, or arguments an opposing party could raise. Reviewers of valuations (for example fund valuation
    committees and in-house teams) must check comparables, methods and policy compliance across many positions on a
    deadline.
  solution: >-
    Two forms are described, neither with a named deployment. (1) Speakers on an AICPA FVS podcast described a
    'standards analyzer' agent loaded with SSVS (the AICPA valuation standard), U.S. GAAP and the AICPA forensic
    standard that flags missing or inconsistent requirements, and an 'adversarial reviewer' that looks for weak spots,
    unsupported assumptions and inconsistencies (BVR-AICPAREPORT-2026). The IVSC dialogue panel (2026-06-25) likewise
    encouraged using AI as a review tool that challenges assumptions (BVR-IVSCDIALOGUE-2026), and the IVSC paper says
    AI could be used in quality control (IVSC-PERSPECTIVES-2025). (2) Anthropic's 2026-05-05 release lists a
    'Valuation reviewer' among ten agent templates; it checks valuations against comparables, methodology and the
    firm's review standards, ships as plugins for Claude Cowork and Claude Code and as cookbooks for Claude Managed
    Agents, and uses subagents for tasks such as comparables selection or methodology checks; the managed-agent
    version adds a full audit log (ANTHROPIC-FSAGENTS-2026). Vendor: Anthropic.
  outcomes:
    - lever: quality
      description: "none published for the valuation-reviewer template"
      figure: "none"
      measures: "Announcement describes capability only"
      provenance: vendor-published
      source_ref: ANTHROPIC-FSAGENTS-2026
    - lever: quality
      description: "none published for the podcast speakers' approach"
      figure: "none"
      measures: "No measurement; the source describes the approach and its cautions only"
      provenance: self-reported
      source_ref: BVR-AICPAREPORT-2026
  prerequisites:
    - "Standards text available to the agent (BVR-AICPAREPORT-2026)"
    - "A protected internal AI system, because the podcast speakers warned against putting confidential client information into public AI tools (BVR-AICPAREPORT-2026)"
    - "The firm's own modelling conventions, risk policies and approval flows; the release says firms adapt the templates (ANTHROPIC-FSAGENTS-2026)"
  risks_and_guardrails:
    - "Speakers said AI does not replace professional review, that AI makes mistakes, and that the human remains responsible for the report (BVR-AICPAREPORT-2026)"
    - "The release states users stay in the loop, reviewing and approving work before it goes to a client or is filed; the managed-agent version offers per-tool permissions and a full audit log (ANTHROPIC-FSAGENTS-2026)"
    - "The IVSC exposure draft would add a quality-controls chapter (IVS 107) and require significant AI use to be documented in the engagement file, including the quality controls applied (IVSC-IVSED-2026; BVR-IVSPODCAST-2026)"
  human_checkpoints:
    - "Valuer reviews and decides on each flag; the signing valuer remains responsible (BVR-AICPAREPORT-2026)"
    - "Human reviews, iterates and approves before client release or filing (ANTHROPIC-FSAGENTS-2026)"
  role_evolution: "No role change is documented in the sources."
  evidence_grade: C
  sources:
